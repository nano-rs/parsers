source: json
transforms:
- source: time
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the emitted millisecond clock.
- source: session_start
  kind: epoch_ms
  target: session.created_time
  reason: Successful ISO timestamp conversion of the session start to the emitted millisecond clock.
- source: method
  kind: enum
  target: auth_protocol_id
  values:
    oidc: 4
    saml: 5
    github: 6
  reason: The SSO connector type normalized to the OCSF auth protocol; consume only when the expected ID is emitted.
- source: verb
  kind: enum
  target: activity_id
  values:
    get: 2
    list: 2
    watch: 2
    post: 1
    create: 1
    put: 3
    patch: 3
    update: 3
    delete: 4
  reason: The Kubernetes verb drives the API Activity; the method itself also lands in http_request.http_method.
- source: action
  kind: enum
  target: activity_id
  values:
    download: 2
    upload: 1
    '1': 14
    '3': 2
    '4': 3
    '5': 8
    '6': 8
    '7': 6
    '8': 6
    '9': 14
    '10': 2
    '11': 4
    '12': 1
    '13': 4
    '14': 8
    '15': 8
    '16': 5
    '17': 2
    '18': 1
  reason: The scp direction or Teleport SFTPAction number drives the File System Activity; consume only when that activity is emitted.
- source: success
  kind: enum
  target: status_id
  values:
    'true': 1
    'false': 2
  reason: The success flag is the OCSF status; consume only when the expected ID is emitted.
consumed_candidates:
- addr.local
- addr.remote
- argv
- attributes.email
- attributes.groups
- cert_type
- cluster_name
- code
- command
- connector
- db_service
- db_user
- error
- event
- exitCode
- exitError
- id
- identity.user
- kubernetes_cluster
- login
- message
- name
- path
- pid
- ppid
- program
- proto
- request_path
- resource_kind
- resource_name
- resource_namespace
- response_code
- return_code
- roles
- server_addr
- server_hostname
- server_id
- sid
- state
- target_path
- uid
- updated_by
- user
- app_name
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
