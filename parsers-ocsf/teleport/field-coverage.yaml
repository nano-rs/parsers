source: json
transforms:
- source: time
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the emitted millisecond clock.
- source: method
  kind: enum
  target: auth_protocol_id
  values:
    oidc: 4
    saml: 5
    github: 6
  reason: The SSO connector type normalized to the OCSF auth protocol; consume only when the expected
    ID is emitted.
- source: verb
  kind: enum
  target: activity_id
  values:
    get: 2
    list: 2
    watch: 2
    post: 1
    create: 1
    put: 3
    patch: 3
    update: 3
    delete: 4
  reason: The Kubernetes verb drives the API Activity; the method itself also lands in http_request.http_method.
- source: action
  kind: enum
  target: activity_id
  values:
    download: 2
    upload: 1
    '1': 14
    '3': 2
    '4': 3
    '5': 8
    '6': 8
    '7': 6
    '8': 6
    '9': 14
    '10': 2
    '11': 4
    '12': 1
    '13': 4
    '14': 8
    '15': 8
    '16': 5
    '17': 2
    '18': 1
  reason: The scp direction or Teleport SFTPAction number drives the File System Activity; consume only
    when that activity is emitted.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  addr.local:
  - dst_endpoint.ip
  addr.remote:
  - src_endpoint.ip
  attributes.email:
  - user.email_addr
  attributes.groups:
  - user.groups.name
  cert_type:
  - api.request.flags
  cluster_name:
  - metadata.log_provider
  - service.name
  code:
  - metadata.event_code
  command:
  - process.cmd_line
  connector:
  - user.domain
  db_service:
  - service.name
  db_user:
  - user.name
  error:
  - status_detail
  event:
  - message
  exitCode:
  - exit_code
  exitError:
  - status_detail
  id:
  - resources.uid
  identity.user:
  - actor.user.name
  kubernetes_cluster:
  - device.name
  login:
  - actor.user.account.name
  - process.user.name
  - user.name
  message:
  - message
  name:
  - entity.name
  - user.name
  path:
  - file.path
  - process.file.path
  pid:
  - process.pid
  ppid:
  - process.parent_process.pid
  program:
  - process.name
  proto:
  - api.service.name
  request_path:
  - http_request.url.path
  resource_kind:
  - resources.type
  resource_name:
  - resources.name
  resource_namespace:
  - resources.namespace
  response_code:
  - http_response.code
  return_code:
  - exit_code
  roles:
  - privileges
  server_hostname:
  - device.hostname
  - dst_endpoint.hostname
  server_id:
  - device.uid
  - dst_endpoint.uid
  sid:
