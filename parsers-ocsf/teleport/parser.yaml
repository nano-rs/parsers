name: teleport_ocsf
display_name: Teleport Audit Events (OCSF)
version: "1.1.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses Teleport audit events (the JSON audit log, Event Handler / fluentd
  export, or the events API; one event per line keyed by event + code) into
  OCSF 1.9.0. user.login and auth (SSH certificate checks) are
  "Authentication" (3002) Logon with the login method as auth_protocol (OIDC
  OpenID, SAML, GitHub OAuth 2.0, local) and SSO claims (email, groups) on the
  user; session.start / session.end and the db / app / Windows desktop session
  start and end events are Logon / Logoff where the OS or database login is
  the user, the Teleport user is the actor and sid is the session. exec and
  session.command (enhanced session recording) are "Process Activity" (1007)
  Launch with the command line, program, path, pid / ppid, login and exit
  code (only when the event carries one) on the Teleport node as device. scp and sftp are "File System
  Activity" (1001), the transfer direction or SFTP operation choosing Read /
  Create / Update / Delete / Rename / Open / Set or Get Attributes. user.create
  / update / delete / password_change and access requests are "User
  Management" (3007), an approved request as Assign Roles with the requested
  roles as privileges (Account Change 3001 is deprecated in OCSF 1.9);
  an access_request.update that names the requester and is APPROVED is
  Assign Roles, and a DENIED one is a Failure that grants no privileges.
  role.created / updated / deleted are "Entity Management" (3004). Every other
  event (cert.create, kube.request, resource CRUD, locks, connectors, and an
  access request review that carries only the reviewer in updated_by, since
  User Management requires the subject user) is "API Activity" (6003) with the
  event name as api.operation and the create / update / delete suffix or the
  Kubernetes verb as the activity. addr.remote is src_endpoint and addr.local
  / server_addr, server_hostname and server_id the Teleport node; the code
  suffix (I / W / E) and the success flag give the status, and a W or E code
  is Medium severity. Anything else falls back to Base Event with the raw
  record kept.
match_values:
  - teleport
category: security
vendor: "Teleport"
product: "Teleport"
parser_vrl: |
  # NAN source timezone. Generated by scripts/residual_spill.py; edit scripts/residual/source_tz.vrl.
  # The log source's timezone setting arrives as .nano.source_timezone (an IANA
  # name such as "America/New_York", or any fixed offset such as "+05:30"), set
  # by nano at ingest. .nano is nano's input, never part of the log: it is
  # removed whole before anything else, whatever its shape.
  # For a clock that carries no offset a parser parses it AS UTC and sets
  # __lc_pending; the generated local-clock block that follows the parse
  # (local_clock.vrl) turns it into real UTC with this setting, and the spill
  # records the zone used as unmapped.nano_time_assumed_tz (the name, the offset
  # as +HH:MM, or "UTC" when the setting is absent, invalid or "local").
  __src_nano = del(.nano)
  __src_tz_in = ""
  if is_object(__src_nano) { __src_tz_in = strip_whitespace(to_string(object!(__src_nano).source_timezone) ?? "") }
  __src_tz = "UTC"
  __src_shift_ms = 0
  __src_tz_label = "UTC"
  __time_assumed = false
  __time_inline = false
  __lc_pending = false
  __src_off = parse_regex(__src_tz_in, r'^(?P<sign>[+-])(?P<h>\d{2}):?(?P<m>\d{2})$') ?? {}
  if !is_empty(__src_off) {
      __src_h = to_int(__src_off.h) ?? 99
      __src_m = to_int(__src_off.m) ?? 99
      if __src_h <= 14 && __src_m <= 59 {
          __src_shift_ms = (__src_h * 3600 + __src_m * 60) * 1000
          if __src_off.sign == "-" { __src_shift_ms = 0 - __src_shift_ms }
          if __src_shift_ms != 0 { __src_tz_label = string!(__src_off.sign) + string!(__src_off.h) + ":" + string!(__src_off.m) }
      }
  } else if __src_tz_in != "" && downcase(__src_tz_in) != "local" {
      # "local" (the Vector host's zone) would make the time depend on the host.
      __src_probe, __src_probe_err = parse_timestamp("2000-01-01 00:00:00", "%Y-%m-%d %H:%M:%S", timezone: __src_tz_in)
      if __src_probe_err == null { __src_tz = __src_tz_in; __src_tz_label = __src_tz_in }
  }
  # END NAN source timezone
  # Teleport audit events -> OCSF 1.9.0 Authentication (3002), Process
  # Activity (1007), File System Activity (1001), User Management (3007),
  # Entity Management (3004), API Activity (6003) or Base Event (0)
  raw_log = to_string(.message) ?? ""
  __raw_body = raw_log
  __source_kv = {}

  parsed, err = parse_json(raw_log)
  __source_kv = object(parsed) ?? {}
  e = object(parsed) ?? {}
  event = to_string(e.event) ?? ""
  code = to_string(e.code) ?? ""

  if err != null || !is_object(parsed) || event == "" || code == "" {
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 99,
          "activity_name": "Other",
          "type_uid": 99,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": 0,
          "message": "Unrecognized Teleport record",
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": sha2("teleport|raw|" + raw_log, variant: "SHA-256"),
              "log_level": "error",
              "log_name": "audit",
              "product": { "name": "Teleport", "vendor_name": "Teleport" }
          }
      }
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      . = set!(., ["unmapped", "parse_fallback"], "unparsable input")
  } else {
      time_ms = 0
      ts = to_string(e.time) ?? ""
      if ts != "" {
          t, terr = parse_timestamp(ts, "%+", timezone: "UTC")
          if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
      }

      # ---- outcome: the success flag, else the code suffix (I / W / E) ----
      suffix = upcase(to_string(slice(code, -1) ?? ""))
      ok = suffix == "I"
      if is_boolean(e.success) { ok = bool(e.success) ?? ok }
      status_id = 1
      status_str = "Success"
      if !ok { status_id = 2; status_str = "Failure" }
      severity_id = 1
      severity = "Informational"
      if !ok || suffix == "W" || suffix == "E" { severity_id = 3; severity = "Medium" }
      error = to_string(e.error) ?? ""
      if error == "" { error = to_string(e.exitError) ?? "" }

      tp_user = to_string(e.user) ?? ""
      login = to_string(e.login) ?? ""
      sid = to_string(e.sid) ?? ""
      cluster = to_string(e.cluster_name) ?? ""

      # ---- endpoints: addr.remote is the client, addr.local the Teleport node ----
      # host:port, [v6]:port, or a bare address without a port
      src = {}
      remote = to_string(get(e, ["addr.remote"]) ?? "") ?? ""
      # A bare IPv6 address ends in ":<hex>", so test the bare forms first and
      # require brackets around an IPv6 address that carries a port.
      if is_ipv4(remote) || is_ipv6(remote) {
          src.ip = remote
      } else {
          rm, rerr = parse_regex(remote, r'^(?:\x5B(?P<ip6>[^\x5D]+)\x5D|(?P<ip4>[^:]+)):(?P<port>\d+)$')
          rip = string(rm.ip6) ?? ""
          if rip == "" { rip = string(rm.ip4) ?? "" }
          if rerr == null && (is_ipv4(rip) || is_ipv6(rip)) { src.ip = rip; src.port = to_int(rm.port) ?? 0 }
      }
      dst = {}
      local = to_string(get(e, ["addr.local"]) ?? "") ?? ""
      if local == "" { local = to_string(e.server_addr) ?? "" }
      if is_ipv4(local) || is_ipv6(local) {
          dst.ip = local
      } else {
          lm, lerr = parse_regex(local, r'^(?:\x5B(?P<ip6>[^\x5D]+)\x5D|(?P<ip4>[^:]+)):(?P<port>\d+)$')
          lip = string(lm.ip6) ?? ""
          if lip == "" { lip = string(lm.ip4) ?? "" }
          if lerr == null && (is_ipv4(lip) || is_ipv6(lip)) { dst.ip = lip; dst.port = to_int(lm.port) ?? 0 }
      }
      shost = to_string(e.server_hostname) ?? ""
      if shost != "" { dst.hostname = shost }
      suid = to_string(e.server_id) ?? ""
      if suid != "" { dst.uid = suid }

      actor = {}
      if tp_user != "" { actor.user = { "name": tp_user } }
      if sid != "" { actor.session = { "uid": sid } }
      ukind = to_int(e.user_kind) ?? 0
      if ukind == 1 && exists(actor.user) { actor.user.type_id = 1; actor.user.type = "User" }
      if ukind == 2 && exists(actor.user) { actor.user.type_id = 99; actor.user.type = "Bot" }

      metadata = {
          "version": "1.9.0",
          "uid": to_string(e.uid) ?? sha2("teleport|raw|" + raw_log, variant: "SHA-256"),
          "event_code": code,
          "log_name": "audit",
          "product": { "name": "Teleport", "vendor_name": "Teleport" }
      }
      if metadata.uid == "" { metadata.uid = sha2("teleport|raw|" + raw_log, variant: "SHA-256") }
      if cluster != "" { metadata.log_provider = cluster }
      if sid != "" { metadata.correlation_uid = sid }

      message = event
      if error != "" { message = event + ": " + error }
      emsg = to_string(e.message) ?? ""
      if emsg != "" { message = emsg }

      kind = "api"
      if event == "user.login" || event == "auth" || ends_with(event, "session.start") || ends_with(event, "session.end") { kind = "auth" }
      if event == "exec" || event == "session.command" { kind = "process" }
      if event == "scp" || event == "sftp" { kind = "file" }
      if starts_with(event, "user.") && event != "user.login" { kind = "user" }
      if event == "access_request.create" || (starts_with(event, "access_request.") && tp_user != "" && event != "access_request.search") { kind = "user" }
      # A denied access request is a failed privilege change.
      if starts_with(event, "access_request.") && upcase(to_string(e.state) ?? "") == "DENIED" {
          status_id = 2
          status_str = "Failure"
      }
      if starts_with(event, "role.") { kind = "entity" }

      dev = { "type_id": 0, "type": "Unknown" }
      if suid != "" { dev.uid = suid }
      if shost != "" { dev.hostname = shost }
      if exists(dst.ip) { dev.ip = dst.ip }
      kc = to_string(e.kubernetes_cluster) ?? ""
      if kc != "" { dev.name = kc }
      if !exists(dev.uid) && !exists(dev.hostname) && !exists(dev.ip) && !exists(dev.name) { dev.name = cluster }
      if dev.name == "" { dev.name = "unknown" }

      base = {
          "severity_id": severity_id,
          "severity": severity,
          "status_id": status_id,
          "status": status_str,
          "time": time_ms,
          "message": message,
          "raw_data": raw_log,
          "metadata": metadata
      }
      if error != "" { base.status_detail = error }

      if kind == "auth" {
          activity_id = 1
          activity_name = "Logon"
          if ends_with(event, "session.end") { activity_id = 2; activity_name = "Logoff" }
          subject = tp_user
          if login != "" { subject = login }
          dbu = to_string(e.db_user) ?? ""
          if dbu != "" { subject = dbu }
          user = { "name": subject }
          if subject == "" { user.name = "unknown" }
          attrs = object(e.attributes) ?? {}
          # SSO traits are map[string][]string, so email may be a list
          umail = to_string(attrs.email) ?? ""
          if is_array(attrs.email) { umail = to_string(get(array!(attrs.email), [0]) ?? "") ?? "" }
          if umail != "" { user.email_addr = umail }
          ugroups = []
          for_each(array(attrs.groups) ?? []) -> |_i, g| {
              gs = to_string(g) ?? ""
              if gs != "" { ugroups = push(ugroups, { "name": gs }) }
          }
          if length(ugroups) > 0 { user.groups = ugroups }
          ocsf = merge(base, {
              "class_uid": 3002,
              "class_name": "Authentication",
              "category_uid": 3,
              "category_name": "Identity & Access Management",
              "activity_id": activity_id,
              "activity_name": activity_name,
              "type_uid": 300200 + activity_id,
              "user": user
          })
          # A node / database / app session: the Teleport user acts, the
          # login (OS, database user) is the account logged into.
          if subject != tp_user && length(actor) > 0 { ocsf.actor = actor }
          method = downcase(to_string(e.method) ?? "")
          if method != "" {
              pid = 99
              pname = method
              if method == "oidc" { pid = 4; pname = "OpenID" }
              if method == "saml" { pid = 5; pname = "SAML" }
              if method == "github" { pid = 6; pname = "OAUTH 2.0" }
              ocsf.auth_protocol_id = pid
              ocsf.auth_protocol = pname
          }
          svc = {}
          dbs = to_string(e.db_service) ?? ""
          app = to_string(e.app_name) ?? ""
          if dbs != "" { svc.name = dbs } else if app != "" { svc.name = app } else if cluster != "" { svc.name = cluster } else { svc.name = "teleport" }
          ocsf.service = svc
          if length(src) > 0 { ocsf.src_endpoint = src }
          if length(dst) > 0 {
              ocsf.dst_endpoint = dst
              ocsf.is_remote = true
          }
          sess = {}
          if sid != "" { sess.uid = sid }
          sstart = to_string(e.session_start) ?? ""
          if sstart != "" {
              st, sterr = parse_timestamp(sstart, "%+", timezone: "UTC")
              if sterr == null { sess.created_time = to_unix_timestamp(st, unit: "milliseconds") }
          }
          if length(sess) > 0 { ocsf.session = sess }
          if is_object(e.mfa_device) { ocsf.is_mfa = true }
          . = ocsf
      } else if kind == "process" {
          proc = { "pid": to_int(e.pid) ?? 0 }
          program = to_string(e.program) ?? ""
          ppath = to_string(e.path) ?? ""
          cmd = to_string(e.command) ?? ""
          argv = array(e.argv) ?? []
          if cmd == "" && program != "" {
              cmd = program
              for_each(argv) -> |_i, a| { cmd = cmd + " " + (to_string(a) ?? "") }
          }
          if cmd != "" { proc.cmd_line = cmd }
          if program != "" { proc.name = program }
          if ppath != "" {
              pparts = split(ppath, "/")
              pbase = to_string(get(pparts, [length(pparts) - 1]) ?? "") ?? ""
              if pbase == "" { pbase = ppath }
              proc.file = { "path": ppath, "name": pbase, "type_id": 1, "type": "Regular File" }
              if !exists(proc.name) { proc.name = pbase }
          }
          ppid = to_int(e.ppid) ?? 0
          if ppid > 0 { proc.parent_process = { "pid": ppid } }
          if login != "" { proc.user = { "name": login } }
          if sid != "" { proc.session = { "uid": sid } }
          if length(actor) == 0 { actor.app_name = "teleport" }
          ocsf = merge(base, {
              "class_uid": 1007,
              "class_name": "Process Activity",
              "category_uid": 1,
              "category_name": "System Activity",
              "activity_id": 1,
              "activity_name": "Launch",
              "type_uid": 100701,
              "actor": actor,
              "device": dev,
              "process": proc
          })
          # to_int(null) is 0, so test presence first: an event with no exit
          # code must not claim a clean exit.
          rc = null
          if e.return_code != null { rc = to_int(e.return_code) ?? null } else if e.exitCode != null { rc = to_int(e.exitCode) ?? null }
          if rc != null { ocsf.exit_code = rc }
          . = ocsf
      } else if kind == "file" {
          fpath = to_string(e.path) ?? ""
          action = to_string(e.action) ?? ""
          activity_id = 99
          activity_name = "Other"
          ftype_id = 1
          ftype = "Regular File"
          if action == "download" || action == "3" || action == "10" || action == "17" { activity_id = 2; activity_name = "Read" }
          if action == "upload" || action == "18" { activity_id = 1; activity_name = "Create" }
          if action == "12" { activity_id = 1; activity_name = "Create"; ftype_id = 2; ftype = "Folder" }
          if action == "4" { activity_id = 3; activity_name = "Update" }
          if action == "11" { activity_id = 4; activity_name = "Delete" }
          if action == "13" { activity_id = 4; activity_name = "Delete"; ftype_id = 2; ftype = "Folder" }
          if action == "16" { activity_id = 5; activity_name = "Rename" }
          if action == "7" || action == "8" { activity_id = 6; activity_name = "Set Attributes" }
          if action == "5" || action == "6" || action == "14" || action == "15" { activity_id = 8; activity_name = "Get Attributes" }
          if action == "1" { activity_id = 14; activity_name = "Open" }
          if action == "9" { activity_id = 14; activity_name = "Open"; ftype_id = 2; ftype = "Folder" }
          if action == "10" { ftype_id = 2; ftype = "Folder" }
          fparts = split(fpath, "/")
          fname = to_string(get(fparts, [length(fparts) - 1]) ?? "") ?? ""
          if fname == "" { fname = fpath }
          if fname == "" { fname = "unknown" }
          file = { "name": fname, "type_id": ftype_id, "type": ftype }
          if fpath != "" { file.path = fpath }
          if length(actor) == 0 { actor.app_name = "teleport" }
          if login != "" && exists(actor.user) { actor.user.account = { "name": login } }
          ocsf = merge(base, {
              "class_uid": 1001,
              "class_name": "File System Activity",
              "category_uid": 1,
              "category_name": "System Activity",
              "activity_id": activity_id,
              "activity_name": activity_name,
              "type_uid": 100100 + activity_id,
              "actor": actor,
              "device": dev,
              "file": file
          })
          tpath = to_string(e.target_path) ?? ""
          if tpath != "" {
              tparts = split(tpath, "/")
              ocsf.file_result = { "path": tpath, "name": to_string(get(tparts, [length(tparts) - 1]) ?? tpath) ?? tpath, "type_id": ftype_id, "type": ftype }
          }
          . = ocsf
      } else if kind == "user" {
          activity_id = 99
          activity_name = "Other"
          subject = tp_user
          tname = to_string(e.name) ?? ""
          if event == "user.create" { activity_id = 1; activity_name = "Create"; if tname != "" { subject = tname } }
          if event == "user.update" { activity_id = 2; activity_name = "Update"; if tname != "" { subject = tname } }
          if event == "user.delete" { activity_id = 3; activity_name = "Delete"; if tname != "" { subject = tname } }
          if event == "user.password_change" { activity_id = 8; activity_name = "Password Change" }
          state = upcase(to_string(e.state) ?? "")
          if starts_with(event, "access_request.") {
              activity_name = "Access Request"
              if state == "APPROVED" { activity_id = 16; activity_name = "Assign Roles" }
          }
          if subject == "" { subject = "unknown" }
          privs = []
          # Denied roles were never granted, so they are not privileges.
          if state != "DENIED" {
              for_each(array(e.roles) ?? []) -> |_i, r| {
                  rs = to_string(r) ?? ""
                  if rs != "" { privs = push(privs, rs) }
              }
          }
          ocsf = merge(base, {
              "class_uid": 3007,
              "class_name": "User Management",
              "category_uid": 3,
              "category_name": "Identity & Access Management",
              "activity_id": activity_id,
              "activity_name": activity_name,
              "type_uid": 300700 + activity_id,
              "user": { "name": subject }
          })
          conn = to_string(e.connector) ?? ""
          if conn != "" { ocsf.user.domain = conn }
          if length(privs) > 0 { ocsf.privileges = privs }
          updby = to_string(e.updated_by) ?? ""
          if updby != "" {
              actor.user = { "name": updby }
          } else if subject == tp_user && starts_with(event, "access_request.") {
              actor = {}
          }
          if length(actor) > 0 && (subject != tp_user || updby != "") { ocsf.actor = actor }
          if length(src) > 0 { ocsf.src_endpoint = src }
          rid = to_string(e.id) ?? ""
          if rid != "" { ocsf.resources = [{ "uid": rid, "type": "access_request" }] }
          if state != "" { ocsf.status_code = state }
          . = ocsf
      } else if kind == "entity" {
          activity_id = 99
          activity_name = "Other"
          if ends_with(event, ".created") || ends_with(event, ".create") { activity_id = 1; activity_name = "Create" }
          if ends_with(event, ".updated") || ends_with(event, ".update") { activity_id = 3; activity_name = "Update" }
          if ends_with(event, ".deleted") || ends_with(event, ".delete") { activity_id = 4; activity_name = "Delete" }
          ename = to_string(e.name) ?? ""
          if ename == "" { ename = "unknown" }
          ocsf = merge(base, {
              "class_uid": 3004,
              "class_name": "Entity Management",
              "category_uid": 3,
              "category_name": "Identity & Access Management",
              "activity_id": activity_id,
              "activity_name": activity_name,
              "type_uid": 300400 + activity_id,
              "entity": { "name": ename, "type": "role" }
          })
          if length(actor) > 0 { ocsf.actor = actor }
          if length(src) > 0 { ocsf.src_endpoint = src }
          . = ocsf
      } else {
          activity_id = 99
          activity_name = "Other"
          if match(event, r'\.(?:create|created|issued|join|enroll)$') || event == "cert.create" { activity_id = 1; activity_name = "Create" }
          if match(event, r'\.(?:update|updated|search|review)$') { activity_id = 3; activity_name = "Update" }
          if match(event, r'\.(?:delete|deleted|delete_all_members)$') { activity_id = 4; activity_name = "Delete" }
          if event == "access_request.search" { activity_id = 2; activity_name = "Read" }
          verb = upcase(to_string(e.verb) ?? "")
          if verb == "GET" || verb == "LIST" || verb == "WATCH" { activity_id = 2; activity_name = "Read" }
          if verb == "POST" || verb == "CREATE" { activity_id = 1; activity_name = "Create" }
          if verb == "PUT" || verb == "PATCH" || verb == "UPDATE" { activity_id = 3; activity_name = "Update" }
          if verb == "DELETE" { activity_id = 4; activity_name = "Delete" }
          if !exists(actor.user) {
              iu = to_string(get(e, ["identity", "user"]) ?? "") ?? ""
              updby = to_string(e.updated_by) ?? ""
              if iu != "" { actor.user = { "name": iu } } else if updby != "" { actor.user = { "name": updby } }
          }
          if length(actor) == 0 { actor.app_name = "teleport" }
          api = { "operation": event, "request": { "uid": metadata.uid } }
          svc = {}
          if cluster != "" { svc.name = cluster }
          proto = to_string(e.proto) ?? ""
          if proto != "" { svc.name = proto }
          if length(svc) > 0 { api.service = svc }
          if error != "" { api.response = { "error": error } }
          if length(src) == 0 { src = { "name": "unknown" } }
          ocsf = merge(base, {
              "class_uid": 6003,
              "class_name": "API Activity",
              "category_uid": 6,
              "category_name": "Application Activity",
              "activity_id": activity_id,
              "activity_name": activity_name,
              "type_uid": 600300 + activity_id,
              "actor": actor,
              "api": api,
              "src_endpoint": src
          })
          if length(dst) > 0 { ocsf.dst_endpoint = dst }
          rpath = to_string(e.request_path) ?? ""
          if rpath != "" || verb != "" {
              hreq = {}
              if verb != "" { hreq.http_method = verb }
