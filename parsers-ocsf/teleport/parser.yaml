  # verb: The Kubernetes verb drives the API Activity; the method itself also lands in http_request.http_method.
  # action: The scp direction or Teleport SFTPAction number drives the File System Activity; consume only when that activity is emitted.
  # success: The success flag is the OCSF status; consume only when the expected ID is emitted.
  for_each(__flat) -> |key, value| {
