source: mixed
transforms:
- source: c_ip
  kind: lowercase
  target: src_endpoint.ip
  reason: Parser lowercases addresses and the host header; consume only when the normalized value is emitted.
- source: s_ip
  kind: lowercase
  target: dst_endpoint.ip
  reason: Parser lowercases addresses and the host header; consume only when the normalized value is emitted.
- source: cs_host
  kind: lowercase
  target: http_request.url.hostname
  reason: Parser lowercases addresses and the host header; consume only when the normalized value is emitted.
- source: c-ip
  kind: lowercase
  target: src_endpoint.ip
  reason: Parser lowercases addresses and the host header; consume only when the normalized value is emitted.
- source: s-ip
  kind: lowercase
  target: dst_endpoint.ip
  reason: Parser lowercases addresses and the host header; consume only when the normalized value is emitted.
- source: CIp
  kind: lowercase
  target: src_endpoint.ip
  reason: Parser lowercases addresses and the host header; consume only when the normalized value is emitted.
- source: CsHost
  kind: lowercase
  target: http_request.url.hostname
  reason: Parser lowercases addresses and the host header; consume only when the normalized value is emitted.
- source: TimeGenerated
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
