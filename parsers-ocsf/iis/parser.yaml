name: iis_ocsf
display_name: Microsoft IIS (OCSF)
version: "1.0.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses Microsoft Internet Information Services (IIS) W3C extended access logs
  into complete OCSF 1.9.0 "HTTP Activity" (class_uid 4002) records, emitted on
  the root. activity_id follows the HTTP method, status_id the response code
  (4xx and 5xx are Failure), severity rises to Low on 4xx and Medium on 5xx.
  c-ip is src_endpoint; s-ip / s-port / s-computername / s-sitename are
  dst_endpoint; cs-username is actor.user; time-taken is duration (ms);
  sc-bytes / cs-bytes are traffic and response / request length; "-" is empty
  and "+" in cs(User-Agent) is decoded to a space. sc-substatus and
  sc-win32-status, cs(Cookie) and any field the mapping does not consume land
  in unmapped.

  Layout. A W3C log's columns are declared by the `#Fields:` directive, but
  Vector delivers one line per event and VRL keeps no state between events, so
  a data line cannot see its file's header. Three input shapes are accepted:
    * A bare data line, laid out by its column count: 11 = the IIS 6 /
      Microsoft Learn example set (date time c-ip cs-username s-ip s-port
      cs-method cs-uri-stem cs-uri-query sc-status cs(User-Agent)); 14 = the
      IIS 7.x default; 15 = the IIS 8.5 / 10 default (date time s-ip cs-method
      cs-uri-stem cs-uri-query s-port cs-username c-ip cs(User-Agent)
      cs(Referer) sc-status sc-substatus sc-win32-status time-taken); 16 = that
      default plus an X-Forwarded-For custom field; 22 = every standard W3C
      field in IIS order (adds s-sitename s-computername cs-version cs(Cookie)
      cs-host sc-bytes cs-bytes); 23 = that plus X-Forwarded-For. Any other
      count is a Base Event with the columns kept and unmapped.parse_fallback
      set: configure one of these field sets, or use the next shape.
    * A JSON wrapper carrying the header with the line,
      {"fields": "<#Fields value>", "line": "<data line>"} (`#Fields` and `log`
      are accepted as key aliases). The header drives the layout exactly, so
      any field order and custom fields work.
    * A JSON record with named W3C keys (NXLog `w3c` parser: `cs-method`,
      `c-ip`, `cs(User-Agent)`; Azure App Service HTTP logs: `CsMethod`, `CIp`,
      `UserAgent`, `TimeGenerated`).
  Directive lines (#Software, #Version, #Date, #Fields, #Remark) are kept as a
  Base Event (class_uid 0): metadata.event_code is the directive, message its
  value, and a #Fields value is also metadata.log_format. Anything unparseable
  is a Base Event with the raw line in raw_data and unmapped.parse_fallback.
  Samples follow Microsoft Learn's W3C logging reference
  (https://learn.microsoft.com/en-us/windows/win32/http/w3c-logging,
  https://learn.microsoft.com/en-us/iis/configuration/system.applicationhost/sites/site/logfile/)
  and Elastic's IIS integration fixtures
  (https://github.com/elastic/integrations/tree/main/packages/iis/data_stream/access/_dev/test/pipeline),
  with addresses and hosts replaced by documentation values.
match_values:
  - iis
category: application
vendor: "Microsoft"
product: "Internet Information Services"
parser_vrl: |
  # NAN source timezone. Generated by scripts/residual_spill.py; edit scripts/residual/source_tz.vrl.
  # The log source's timezone setting arrives as .nano.source_timezone (an IANA
  # name such as "America/New_York", or any fixed offset such as "+05:30"), set
  # by nano at ingest. .nano is nano's input, never part of the log: it is
  # removed whole before anything else, whatever its shape.
  # A parser reads a clock that carries no offset AS UTC (timezone: "UTC", never
  # ambiguous) and records it: __time_assumed = true and the clock's ms in
  # __time_local (",<ms>" per clock). The spill block then turns every *time
  # field holding a recorded value into real UTC with the setting: a fixed
  # offset by arithmetic, an IANA zone with its DST rules (an ambiguous
  # fall-back time takes its FIRST occurrence, the earlier offset; a time in a
  # spring-forward gap moves forward by the gap), and records the zone used as
  # unmapped.nano_time_assumed_tz (the name, the offset as +HH:MM, or "UTC" when
  # the setting is absent or invalid). A clock with no year uses __src_year (the
  # current year in the source's zone) and records its ms in __time_noyear too:
  # a result more than a day in the future moves to the previous year.
  __src_nano = del(.nano)
  __src_tz_in = ""
  if is_object(__src_nano) { __src_tz_in = strip_whitespace(to_string(object!(__src_nano).source_timezone) ?? "") }
  __src_tz = "UTC"
  __src_shift_ms = 0
  __src_tz_label = "UTC"
  __time_assumed = false
  __time_inline = false
  __time_local = ""
  __time_noyear = ""
  __src_off = parse_regex(__src_tz_in, r'^(?P<sign>[+-])(?P<h>\d{2}):?(?P<m>\d{2})$') ?? {}
  if !is_empty(__src_off) {
      __src_h = to_int(__src_off.h) ?? 99
      __src_m = to_int(__src_off.m) ?? 99
      if __src_h <= 14 && __src_m <= 59 {
          __src_shift_ms = (__src_h * 3600 + __src_m * 60) * 1000
          if __src_off.sign == "-" { __src_shift_ms = 0 - __src_shift_ms }
          if __src_shift_ms != 0 { __src_tz_label = string!(__src_off.sign) + string!(__src_off.h) + ":" + string!(__src_off.m) }
      }
  } else if __src_tz_in != "" && downcase(__src_tz_in) != "local" {
      # "local" (the Vector host's zone) would make the time depend on the host.
      __src_probe, __src_probe_err = parse_timestamp("2000-01-01 00:00:00", "%Y-%m-%d %H:%M:%S", timezone: __src_tz_in)
      if __src_probe_err == null { __src_tz = __src_tz_in; __src_tz_label = __src_tz_in }
  }
  __src_now_ms = to_unix_timestamp(now(), unit: "milliseconds")
  __src_year = format_timestamp!(from_unix_timestamp!(__src_now_ms + __src_shift_ms, unit: "milliseconds"), "%Y", timezone: __src_tz)
  # END NAN source timezone
  # Microsoft IIS W3C extended log -> OCSF 1.9.0 HTTP Activity (4002) / Base Event (0)
  raw_log = to_string(.message) ?? ""
  __raw_body = raw_log
  __source_kv = {}
  line = strip_whitespace(raw_log)
  ip_re = r'^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$|^[0-9A-Fa-f:]{3,}$'

  # Column layouts by token count (snake_case W3C names).
  base14 = ["date", "time", "s_ip", "cs_method", "cs_uri_stem", "cs_uri_query", "s_port", "cs_username", "c_ip", "cs_user_agent", "sc_status", "sc_substatus", "sc_win32_status", "time_taken"]
  base15 = ["date", "time", "s_ip", "cs_method", "cs_uri_stem", "cs_uri_query", "s_port", "cs_username", "c_ip", "cs_user_agent", "cs_referer", "sc_status", "sc_substatus", "sc_win32_status", "time_taken"]
  full22 = ["date", "time", "s_sitename", "s_computername", "s_ip", "cs_method", "cs_uri_stem", "cs_uri_query", "s_port", "cs_username", "c_ip", "cs_version", "cs_user_agent", "cs_cookie", "cs_referer", "cs_host", "sc_status", "sc_substatus", "sc_win32_status", "sc_bytes", "cs_bytes", "time_taken"]
  layouts = {
      "11": ["date", "time", "c_ip", "cs_username", "s_ip", "s_port", "cs_method", "cs_uri_stem", "cs_uri_query", "sc_status", "cs_user_agent"],
      "14": base14,
      "15": base15,
      "16": push(base15, "x_forwarded_for"),
      "22": full22,
      "23": push(full22, "x_forwarded_for")
  }
  # Named JSON keys, normalized (lowercase, no - _ ( )), to the snake name.
  aliases = {
      "date": "date", "time": "time", "ssitename": "s_sitename", "sitename": "s_sitename",
      "scomputername": "s_computername", "computername": "s_computername",
      "sip": "s_ip", "csmethod": "cs_method", "csuristem": "cs_uri_stem", "csuriquery": "cs_uri_query",
      "sport": "s_port", "csusername": "cs_username", "cip": "c_ip", "csversion": "cs_version",
      "csuseragent": "cs_user_agent", "useragent": "cs_user_agent", "cscookie": "cs_cookie", "cookie": "cs_cookie",
      "csreferer": "cs_referer", "referer": "cs_referer", "cshost": "cs_host", "scstatus": "sc_status",
      "scsubstatus": "sc_substatus", "scwin32status": "sc_win32_status", "scbytes": "sc_bytes",
      "csbytes": "cs_bytes", "timetaken": "time_taken", "xforwardedfor": "x_forwarded_for"
  }

  f = {}
  shape = "invalid"
  directive = ""
  directive_value = ""
  header = ""
  wrapped_line = ""
  iso_time = ""

  parsed, jerr = parse_json(line)
  if jerr == null && is_object(parsed) {
      obj = object!(parsed)
      __source_kv = obj
      header = to_string(obj.fields) ?? ""
      if header == "" { header = to_string(get(obj, ["#Fields"]) ?? null) ?? "" }
      wrapped_line = to_string(obj.line) ?? ""
      if wrapped_line == "" { wrapped_line = to_string(obj.log) ?? "" }
      if header != "" && wrapped_line != "" {
          # ---- JSON wrapper: the #Fields header drives the layout ----
          hm, hmerr = parse_regex(header, r'^(?:#Fields:\s*)?(?P<names>.+)$')
          names = []
          if hmerr == null { names = split(strip_whitespace(to_string(hm.names)), " ") }
          vals = split(strip_whitespace(wrapped_line), " ")
          if length(names) > 0 && length(names) == length(vals) {
              shape = "header"
              for_each(names) -> |i, nm| {
                  sn = downcase(to_string(nm))
                  sn = replace(replace(replace(sn, "(", "_"), ")", ""), "-", "_")
                  v = string(get(vals, [i]) ?? null) ?? "-"
                  if v != "-" && v != "" { f = set!(f, [sn], v) }
              }
          }
      } else {
          # ---- JSON record with named W3C keys (NXLog, App Service) ----
          for_each(obj) -> |k, v| {
              nk = replace(downcase(k), r'[-_()]', "")
              sn = string(get(aliases, [nk]) ?? null) ?? ""
              if sn != "" && v != null && v != "-" && v != "" { f = set!(f, [sn], v) }
          }
          if (get(f, ["cs_method"]) ?? null) != null || (get(f, ["sc_status"]) ?? null) != null || (get(f, ["cs_uri_stem"]) ?? null) != null {
              shape = "named"
              iso_time = to_string(obj.TimeGenerated) ?? ""
              if iso_time == "" { iso_time = to_string(obj.EventTime) ?? "" }
          }
      }
  } else {
      dm, dmerr = parse_regex(line, r'^#(?P<directive>[A-Za-z-]+):\s*(?P<value>.*)$')
      lm, lmerr = parse_regex(line, r'^(?P<date>\d{4}-\d{2}-\d{2}) (?P<time>\d{2}:\d{2}:\d{2}) (?P<rest>\S.*)$')
      if dmerr == null {
          shape = "directive"
          directive = to_string(dm.directive)
          directive_value = to_string(dm.value)
          __source_kv = { "directive": directive, "value": directive_value }
      } else if lmerr == null {
          # ---- bare data line: layout by column count ----
          toks = split(line, " ")
          cols = array(get(layouts, [to_string(length(toks))]) ?? null) ?? []
          if length(cols) > 0 {
              shape = "positional"
              for_each(toks) -> |i, v| {
                  sn = string(get(cols, [i]) ?? null) ?? ""
                  if sn != "" && v != "-" && v != "" { f = set!(f, [sn], v) }
              }
          } else {
              for_each(toks) -> |i, v| { __source_kv = set!(__source_kv, ["column_" + to_string(i)], v) }
          }
      }
  }

  metadata = {
      "version": "1.9.0",
      "profiles": ["host"],
      "uid": sha2("iis|raw|" + raw_log, variant: "SHA-256"),
      "log_name": "W3C",
      "log_provider": "IIS",
      "product": { "name": "Internet Information Services", "vendor_name": "Microsoft" }
  }

  if shape == "positional" || shape == "header" || shape == "named" {
      method = upcase(to_string(get(f, ["cs_method"]) ?? null) ?? "")
      stem = to_string(get(f, ["cs_uri_stem"]) ?? null) ?? ""
      query = to_string(get(f, ["cs_uri_query"]) ?? null) ?? ""
      host = to_string(get(f, ["cs_host"]) ?? null) ?? ""
      ua_raw = to_string(get(f, ["cs_user_agent"]) ?? null) ?? ""
      ua = replace(ua_raw, "+", " ")
      referer = to_string(get(f, ["cs_referer"]) ?? null) ?? ""
      username = to_string(get(f, ["cs_username"]) ?? null) ?? ""
      c_ip = downcase(to_string(get(f, ["c_ip"]) ?? null) ?? "")
      s_ip = downcase(to_string(get(f, ["s_ip"]) ?? null) ?? "")
      s_port = to_int(get(f, ["s_port"]) ?? null) ?? 0
      code = to_int(get(f, ["sc_status"]) ?? null) ?? 0
      sc_bytes = -1
      if (get(f, ["sc_bytes"]) ?? null) != null { sc_bytes = to_int(get(f, ["sc_bytes"]) ?? null) ?? -1 }
      cs_bytes = -1
      if (get(f, ["cs_bytes"]) ?? null) != null { cs_bytes = to_int(get(f, ["cs_bytes"]) ?? null) ?? -1 }
      taken = -1
      if (get(f, ["time_taken"]) ?? null) != null { taken = to_int(get(f, ["time_taken"]) ?? null) ?? -1 }
      version = to_string(get(f, ["cs_version"]) ?? null) ?? ""
      xff = to_string(get(f, ["x_forwarded_for"]) ?? null) ?? ""

      # ---- time: date + time are UTC in W3C logs ----
      time_ms = to_unix_timestamp(now(), unit: "milliseconds")
      d = to_string(get(f, ["date"]) ?? null) ?? ""
      tm = to_string(get(f, ["time"]) ?? null) ?? ""
      if d != "" && tm != "" { iso_time = d + "T" + tm + "Z" }
      if iso_time != "" {
          ts, tserr = parse_timestamp(iso_time, "%+", timezone: "UTC")
          if tserr == null { time_ms = to_unix_timestamp(ts, unit: "milliseconds") }
      }
      if shape == "positional" {
          # The parse result of a positional line: the decoded user agent and the
          # combined UTC clock stand in for the raw tokens.
          __source_kv = f
          if ua_raw != "" { __source_kv.cs_user_agent = ua }
          if iso_time != "" {
              __discard = del(__source_kv.date)
              __discard = del(__source_kv.time)
              __source_kv.timestamp = iso_time
          }
      }

      activity_ids = { "CONNECT": 1, "DELETE": 2, "GET": 3, "HEAD": 4, "OPTIONS": 5, "POST": 6, "PUT": 7, "TRACE": 8, "PATCH": 9 }
      activity_names = { "CONNECT": "Connect", "DELETE": "Delete", "GET": "Get", "HEAD": "Head", "OPTIONS": "Options", "POST": "Post", "PUT": "Put", "TRACE": "Trace", "PATCH": "Patch" }
      activity_id = int(get(activity_ids, [method]) ?? 99) ?? 99
      activity_name = string(get(activity_names, [method]) ?? "Other") ?? "Other"

      status_id = 0
      status_str = "Unknown"
      severity_id = 1
      severity = "Informational"
      if code > 0 && code < 400 { status_id = 1; status_str = "Success" }
      if code >= 400 { status_id = 2; status_str = "Failure"; severity_id = 2; severity = "Low" }
      if code >= 500 { severity_id = 3; severity = "Medium" }

      # ---- url ----
      scheme = "http"
      if s_port == 443 { scheme = "https" }
      if stem == "" { stem = "/" }
      url = { "path": stem }
      if query != "" { url.query_string = query }
      # cs-host is the Host header verbatim, so a non-default port rides along
      # ("app.example.com:8443", "[2001:db8::1]:8443"). Hostname columns get the
      # bare host; url_string keeps the header as sent.
      host_name = host
      hm, hmerr = parse_regex(host, r'^\x5B(?P<h>[0-9A-Fa-f:.]+)\x5D(?::\d+)?$')
      if hmerr == null {
          host_name = to_string(hm.h)
      } else {
          hm2, hm2err = parse_regex(host, r'^(?P<h>[^:]+):\d+$')
          if hm2err == null { host_name = to_string(hm2.h) }
      }
      if host != "" {
          url.hostname = downcase(host_name)
          url.scheme = scheme
          url.url_string = scheme + "://" + host + stem
          if query != "" { url.url_string = url.url_string + "?" + query }
      }
      if s_port > 0 { url.port = s_port }

      http_request = { "url": url }
      if method != "" { http_request.http_method = method }
      if ua != "" { http_request.user_agent = ua }
      if referer != "" { http_request.referrer = referer }
      if version != "" { http_request.version = version }
      if cs_bytes >= 0 { http_request.length = cs_bytes }
      if xff != "" {
          xs = []
          for_each(split(xff, ",")) -> |_i, part| {
              ip = strip_whitespace(replace(to_string(part), "+", ""))
              # Proxies (Application Gateway, ARR, F5) often append the client port.
              xm, xmerr = parse_regex(ip, r'^(?P<ip>(?:[0-9]{1,3}\.){3}[0-9]{1,3}):\d+$')
              if xmerr == null {
                  ip = to_string(xm.ip)
              } else {
                  xm6, xm6err = parse_regex(ip, r'^\x5B(?P<ip>[0-9A-Fa-f:]+)\x5D(?::\d+)?$')
                  if xm6err == null { ip = to_string(xm6.ip) }
              }
              if match(ip, ip_re) { xs = push(xs, downcase(ip)) }
          }
          if length(xs) > 0 { http_request.x_forwarded_for = xs }
      }
      http_response = {}
      if code > 0 { http_response.code = code }
      if sc_bytes >= 0 { http_response.length = sc_bytes }

      src_endpoint = {}
      if match(c_ip, ip_re) { src_endpoint.ip = c_ip } else if c_ip != "" { src_endpoint.hostname = c_ip }
      dst_endpoint = {}
      if match(s_ip, ip_re) { dst_endpoint.ip = s_ip }
      if s_port > 0 { dst_endpoint.port = s_port }
      comp = to_string(get(f, ["s_computername"]) ?? null) ?? ""
      if comp != "" { dst_endpoint.hostname = comp }
      site = to_string(get(f, ["s_sitename"]) ?? null) ?? ""
      if site != "" { dst_endpoint.svc_name = site }
      if comp == "" && host_name != "" { dst_endpoint.hostname = downcase(host_name) }

      ocsf = {
          "class_uid": 4002,
          "class_name": "HTTP Activity",
          "category_uid": 4,
          "category_name": "Network Activity",
          "activity_id": activity_id,
          "activity_name": activity_name,
          "type_uid": 400200 + activity_id,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": status_id,
          "status": status_str,
          "time": time_ms,
          "raw_data": raw_log,
          "metadata": metadata,
          "http_request": http_request
      }
      if length(keys(http_response)) > 0 { ocsf.http_response = http_response }
      if code > 0 { ocsf.status_code = to_string(code) }
      if length(keys(src_endpoint)) > 0 { ocsf.src_endpoint = src_endpoint }
      if length(keys(dst_endpoint)) > 0 { ocsf.dst_endpoint = dst_endpoint }
      if username != "" { ocsf.actor = { "user": { "name": username } } }
      if taken >= 0 { ocsf.duration = taken }
      traffic = {}
      if sc_bytes >= 0 { traffic.bytes_in = sc_bytes }
      if cs_bytes >= 0 { traffic.bytes_out = cs_bytes }
      if length(keys(traffic)) > 0 { ocsf.traffic = traffic }
      if shape == "header" {
          ocsf.metadata.log_format = header
          ocsf.message = wrapped_line
      }
      . = ocsf
  } else {
      # ---- directive line or unparseable input: Base Event, never a drop ----
      time_ms = to_unix_timestamp(now(), unit: "milliseconds")
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 99,
          "activity_name": "Other",
          "type_uid": 99,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": time_ms,
          "raw_data": raw_log,
          "metadata": metadata
      }
      if shape == "directive" {
          .metadata.event_code = directive
          .message = directive_value
          if directive == "Fields" { .metadata.log_format = directive_value }
          if directive == "Date" {
              dts, dterr = parse_timestamp(directive_value, "%Y-%m-%d %H:%M:%S", timezone: "UTC")
              if dterr == null { .time = to_unix_timestamp(dts, unit: "milliseconds") }
          }
      } else {
          .metadata.log_level = "error"
          # NAN-5264: explicit fallback marker; nano parser health counts it.
          . = set!(., ["unmapped", "parse_fallback"], "unparsable input")
      }
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # Values spill exactly as parsed: a parser never masks, redacts or withholds
  # anything (masking is an opt-in pipeline step, never a parser concern).
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # A source field is consumed ONLY by an explicit mapping: a field-coverage.yaml
  # `mappings` entry (source key -> target paths) or a `transforms` rule with a
  # target, whose value is found AT THAT TARGET PATH of the selected branch. A
  # value that merely appears somewhere else in the event never consumes a field
  # (no coincidental consumption); everything else spills.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The sets below are strings instead
  # (a read shares the buffer). __repr holds one member per mapped leaf:
  # "," + encode_json(path) + "=" + encode_json(encode_json(value)), plus the
  # to_string form for a string or a float, so a numeric string is represented by
  # its typed scalar. Every part is a JSON text, inside which a '"' is always
  # escaped, so a member is matched exactly. Paths drop array indices
  # (resources.0.uid is resources.uid); arrays are walked two levels deep, and a
  # leaf deeper than that is simply not mapping evidence (it can only spill more).
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  # Clocks read without an offset (recorded as local ms in __time_local) become
  # real UTC: every *time field holding one is converted with the log source's
  # timezone (see source_tz.vrl), and the zone used is recorded, so source
  # health can tell assumed times apart. An inline IANA zone (__time_inline)
  # converts the same way but is not an assumption.
  if __time_local != "" {
      __time_fix = filter(flatten(object!(parse_json!(encode_json(.))))) -> |path, value| {
          is_integer(value) && match(path, r'(?:^|[._])time$') && contains(__time_local + ",", "," + to_string!(value) + ",")
      }
      for_each(__time_fix) -> |path, value| {
          __l = int!(value)
          __u = __l - __src_shift_ms
          if __src_tz != "UTC" {
              # The zone's offsets 12 h either side; equal offsets (no transition
              # that day) give the answer directly.
              __offs = map_values([__l - 43200000, __l + 43200000]) -> |at| {
                  __z = format_timestamp!(from_unix_timestamp!(at, unit: "milliseconds"), "%z", timezone: __src_tz)
                  __o = ((to_int(slice!(__z, 1, 3)) ?? 0) * 3600 + (to_int(slice!(__z, 3, 5)) ?? 0) * 60) * 1000
                  if starts_with(__z, "-") { 0 - __o } else { __o }
              }
              __oa = int!(__offs[0])
              __ob = int!(__offs[1])
              __u = __l - __oa
              if __oa != __ob {
                  # A candidate is valid when the zone has that offset at that
                  # instant. Both valid: ambiguous, keep the first occurrence
                  # (__oa, the earlier offset). Neither: a gap, __oa moves the
                  # time forward by the gap.
                  __ok = map_values([__l - __oa, __l - __ob]) -> |at| {
                      __z = format_timestamp!(from_unix_timestamp!(at, unit: "milliseconds"), "%z", timezone: __src_tz)
                      __o = ((to_int(slice!(__z, 1, 3)) ?? 0) * 3600 + (to_int(slice!(__z, 3, 5)) ?? 0) * 60) * 1000
                      if starts_with(__z, "-") { 0 - __o } else { __o }
                  }
                  if int!(__ok[0]) != __oa && int!(__ok[1]) == __ob { __u = __l - __ob }
              }
          }
          # No year in the clock: more than a day in the future is last year.
          if contains(__time_noyear + ",", "," + to_string(__l) + ",") && __u > __src_now_ms + 86400000 {
              __s = format_timestamp!(from_unix_timestamp!(__l, unit: "milliseconds"), "%Y-%m-%d %H:%M:%S%.3f")
              __prev, __prev_err = parse_timestamp(to_string((to_int(slice!(__s, 0, 4)) ?? 0) - 1) + slice!(__s, 4), "%Y-%m-%d %H:%M:%S%.3f", timezone: "UTC")
              if __prev_err == null { __u = __u - (__l - to_unix_timestamp(__prev, unit: "milliseconds")) }
          }
          . = set!(., split(path, "."), __u)
      }
  }
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped = object!(parse_json!(encode_json(__mapped)))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __copy = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __repr = ""
  for_each(flatten(__mapped)) -> |path, value| {
      __p = encode_json(path)
      if is_array(value) {
          for_each(array!(value)) -> |_i, item| {
              if is_object(item) {
                  for_each(flatten(object!(item))) -> |sub, leaf| {
                      __q = encode_json(path + "." + sub)
                      if is_array(leaf) {
                          for_each(array!(leaf)) -> |_j, x| {
                              if !is_object(x) && !is_array(x) {
                                  __repr = __repr + ("," + __q + "=" + encode_json(encode_json(x)))
                                  if is_string(x) || is_float(x) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(x))) }
                              }
                          }
                      } else {
                          __repr = __repr + ("," + __q + "=" + encode_json(encode_json(leaf)))
                          if is_string(leaf) || is_float(leaf) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(leaf))) }
                      }
                  }
              } else if !is_array(item) {
                  __repr = __repr + ("," + __p + "=" + encode_json(encode_json(item)))
                  if is_string(item) || is_float(item) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(item))) }
              }
          }
      } else {
          __repr = __repr + ("," + __p + "=" + encode_json(encode_json(value)))
          if is_string(value) || is_float(value) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(value))) }
      }
  }
  __consumed = ""
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__copy.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # BEGIN parser-specific transformations
  # c_ip: Parser lowercases addresses and the host header; consume only when the normalized value is emitted.
  # s_ip: Parser lowercases addresses and the host header; consume only when the normalized value is emitted.
  # cs_host: Parser lowercases addresses and the host header; consume only when the normalized value is emitted.
  # c-ip: Parser lowercases addresses and the host header; consume only when the normalized value is emitted.
  # s-ip: Parser lowercases addresses and the host header; consume only when the normalized value is emitted.
  # CIp: Parser lowercases addresses and the host header; consume only when the normalized value is emitted.
  # CsHost: Parser lowercases addresses and the host header; consume only when the normalized value is emitted.
  # TimeGenerated: Successful ISO timestamp conversion to the selected event clock in milliseconds.
  for_each(__flat) -> |key, value| {
      if match(key, r'(?x)
      \A(?:
        c_ip
      | c\-ip
      | CIp
      )\z') {
          __value = value
          if is_string(__value) {
              __expected = downcase(string!(__value))
              if contains(__repr, "," + "\"src_endpoint.ip\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        s_ip
      | s\-ip
      )\z') {
          __value = value
          if is_string(__value) {
              __expected = downcase(string!(__value))
              if contains(__repr, "," + "\"dst_endpoint.ip\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        cs_host
      | CsHost
      )\z') {
          __value = value
          if is_string(__value) {
              __expected = downcase(string!(__value))
              if contains(__repr, "," + "\"http_request.url.hostname\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        TimeGenerated
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%+", timezone: "UTC")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              if contains(__repr, "," + "\"time\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
  }
  # Declared source -> target mappings (field-coverage.yaml `mappings`).
  __decl = "\n\"CIp\"\t[\"src_endpoint.ip\"]\n\"ComputerName\"\t[\"dst_endpoint.hostname\"]\n\"CsBytes\"\t[\"http_request.length\",\"traffic.bytes_out\"]\n\"CsHost\"\t[\"http_request.url.hostname\"]\n\"CsMethod\"\t[\"http_request.http_method\"]\n\"CsUriStem\"\t[\"http_request.url.path\"]\n\"SPort\"\t[\"dst_endpoint.port\",\"http_request.url.port\"]\n\"ScBytes\"\t[\"http_response.length\",\"traffic.bytes_in\"]\n\"ScStatus\"\t[\"http_response.code\",\"status_code\"]\n\"TimeTaken\"\t[\"duration\"]\n\"UserAgent\"\t[\"http_request.user_agent\"]\n\"c-ip\"\t[\"src_endpoint.ip\"]\n\"c_ip\"\t[\"src_endpoint.ip\"]\n\"cs\\u0028User-Agent\\u0029\"\t[\"http_request.user_agent\"]\n\"cs-method\"\t[\"http_request.http_method\"]\n\"cs-uri-query\"\t[\"http_request.url.query_string\"]\n\"cs-uri-stem\"\t[\"http_request.url.path\"]\n\"cs_bytes\"\t[\"http_request.length\",\"traffic.bytes_out\"]\n\"cs_host\"\t[\"http_request.url.hostname\"]\n\"cs_method\"\t[\"http_request.http_method\"]\n\"cs_referer\"\t[\"http_request.referrer\"]\n\"cs_uri_query\"\t[\"http_request.url.query_string\"]\n\"cs_uri_stem\"\t[\"http_request.url.path\"]\n\"cs_user_agent\"\t[\"http_request.user_agent\"]\n\"cs_username\"\t[\"actor.user.name\"]\n\"cs_version\"\t[\"http_request.version\"]\n\"directive\"\t[\"metadata.event_code\"]\n\"fields\"\t[\"metadata.log_format\"]\n\"line\"\t[\"message\"]\n\"s-ip\"\t[\"dst_endpoint.ip\"]\n\"s-port\"\t[\"dst_endpoint.port\",\"http_request.url.port\"]\n\"s_computername\"\t[\"dst_endpoint.hostname\"]\n\"s_ip\"\t[\"dst_endpoint.ip\"]\n\"s_port\"\t[\"dst_endpoint.port\",\"http_request.url.port\"]\n\"s_sitename\"\t[\"dst_endpoint.svc_name\"]\n\"sc-status\"\t[\"http_response.code\",\"status_code\"]\n\"sc_bytes\"\t[\"http_response.length\",\"traffic.bytes_in\"]\n\"sc_status\"\t[\"http_response.code\",\"status_code\"]\n\"time-taken\"\t[\"duration\"]\n\"time_taken\"\t[\"duration\"]\n\"value\"\t[\"message\",\"metadata.log_format\"]\n\"x_forwarded_for\"\t[\"http_request.x_forwarded_for\"]\n"
  __preserve = []
  # END parser-specific transformations
  # Declared mappings: __decl holds "\n" + encode_json(key) + "\t" + JSON array of
  # target paths + "\n" per mapped source key (a raw newline never occurs in
  # compact JSON). A key is consumed when its value, or every element of a scalar
  # array, is at one of its own targets. Keys stay ESCAPED here and in __consumed:
  # a literal dotted key ("a~1b") and the nested path ("a.b") are different
  # fields, and mapping one never consumes the other.
  for_each(__flat) -> |key, value| {
      # __decl spells a bracket inside a key as a \u escape (deploy bracket count).
      __kt = encode_json(key)
      if match(__kt, r'[\x28\x29\x5B\x5D\x7B\x7D]') {
          __kt = replace(replace(replace(replace(replace(replace(__kt, r'\x28', "\\u0028"), r'\x29', "\\u0029"), r'\x5B', "\\u005b"), r'\x5D', "\\u005d"), r'\x7B', "\\u007b"), r'\x7D', "\\u007d")
      }
      __at = find(__decl, "\n" + __kt + "\t")
      if is_integer(__at) && !is_object(value) {
          __rest = slice!(__decl, int!(__at) + strlen(__kt) + 2)
          __hit = false
          for_each(array!(parse_json!(slice!(__rest, 0, int!(find(__rest, "\n")))))) -> |_i, target| {
              __tok = "," + encode_json(target) + "="
              if !__hit && is_array(value) {
                  __all = !is_empty(array!(value))
                  for_each(array!(value)) -> |_j, item| {
                      if __all {
                          __all = !is_object(item) && !is_array(item) && (contains(__repr, __tok + encode_json(encode_json(item))) || ((is_string(item) || is_float(item)) && contains(__repr, __tok + encode_json(to_string!(item)))))
                      }
                  }
                  __hit = __all
              } else if !__hit {
                  __hit = contains(__repr, __tok + encode_json(encode_json(value))) || ((is_string(value) || is_float(value)) && contains(__repr, __tok + encode_json(to_string!(value))))
              }
          }
          if __hit { __consumed = __consumed + ("," + encode_json(key)) }
      }
  }
  # Fast path: when no two source keys decode to the same key and no two spilled
  # keys get the same name, each key's decision depends only on its own value, so
  # one filter and one rename build the residual without copying it per key.
  __distinct = true
  if __tilde {
      __distinct = length(map_keys(__flat) -> |key| { replace(replace(key, "~1", "."), "~0", "~") }) == length(__flat)
  }
  __kept = {}
  __names = {}
  if __distinct {
      __kept = filter(__flat) -> |key, value| {
          # A key is kept unless an explicit mapping or transformation consumed it.
          # Do not spill a copy of the raw body.
          value != __raw_body && !contains(__consumed, "," + encode_json(key))
      }
      __names = map_keys(__kept) -> |key| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          join!(__parts, ".")
      }
  }
  __residual = {}
  if __distinct && length(__names) == length(__kept) {
      __residual = map_values(__names) -> |value| {
          if is_array(value) || is_object(value) {
              if __tilde {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              if __complex { value = encode_json(value) }
          }
          value
      }
  } else {
      # Slow path, in source key order: a name already taken gets the next free
      # _2, _3, ... suffix.
      for_each(__flat) -> |key, value| {
          __token = "," + encode_json(key)
          key = replace(replace(key, "~1", "."), "~0", "~")
          if is_array(value) || is_object(value) {
              value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                  replace(replace(inner, "~1", "."), "~0", "~")
              }, ["v"])
          }
          if !contains(__consumed, __token) && value != __raw_body {
              __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
              __base = join!(__parts, ".")
              __key = __base
              __suffix = 2
              if includes(keys(__residual), __key) {
                  for_each(__flat) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __key) {
                          __key = __base + "_" + to_string(__suffix)
                          __suffix = __suffix + 1
                      }
                  }
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              __spill = if __complex { encode_json(value) } else { value }
              __residual = set!(__residual, [__key], __spill)
          }
      }
  }
  # Names nano owns in unmapped (the parser markers and the reserved nano.*
  # namespace) are never taken by a source field: a vendor key with such a name
  # is kept, renamed source_<name>, so a log cannot forge a marker.
  if match(encode_json(keys(__residual)), r'"nano(?:"|\.|_time_assumed_tz"|_time_source"|_operational")') {
      for_each(object!(__residual)) -> |key, value| {
          if includes(["nano", "nano_time_assumed_tz", "nano_time_source", "nano_operational"], key) || starts_with(key, "nano.") {
              __residual = remove!(__residual, [key])
              __residual = set!(__residual, ["source_" + key], value)
          }
      }
  }
  # Keep existing derived evidence, but remove null placeholders and copies of a
  # source value (that value is mapped or spilled above under its source path).
  # A value merely equal to some mapped attribute is kept: equality with an
  # unrelated attribute is no evidence that it is represented.
  # The canonical source spill above is the authoritative representation of
  # containers. The cheap conditions run first; the source value set is built on
  # first use.
  __original_values = null
  for_each(flatten(__existing)) -> |key, value| {
      if !is_null(value) && value != "" && !is_array(value) && !is_object(value) && value != __raw_body {
          # Members for the value itself and for to_string(value), as above.
          __json = encode_json(value)
          __as_json = "," + encode_json(__json)
          __as_string = __as_json
          if is_string(value) { __as_string = "," + __json } else if is_float(value) { __as_string = "," + encode_json(to_string!(value)) }
          if __original_values == null {
              # __source_kv may hold non-JSON types (a timestamp), so only an
              # integer or a boolean skips its to_string member here.
              __original_values = join!(map_values(values(flatten(__source_kv))) -> |source_value| {
                  __source_json = encode_json(source_value)
                  __tokens = "," + encode_json(__source_json)
                  if is_string(source_value) {
                      __tokens = __tokens + "," + __source_json
                  } else if !is_object(source_value) && !is_array(source_value) && !is_integer(source_value) && !is_boolean(source_value) {
                      __tokens = __tokens + "," + encode_json(to_string(source_value) ?? "")
                  }
                  __tokens
              }, "")
          }
          __source_set = string!(__original_values)
          __keep = !contains(__source_set, __as_json) && !contains(__source_set, __as_string)
          # Only text opening an object or an array (after JSON whitespace)
          # decodes to a container.
          if __keep && is_string(value) && match(string!(value), r'^[ \t\n\r]*[\x5B\x7B]') {
              __decoded, __decode_err = parse_json(string!(value))
              __keep = !(__decode_err == null && (is_object(__decoded) || is_array(__decoded)))
          }
          if __keep {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, as-is. These
  # entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__copy.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  if __time_assumed && !__time_inline { __residual = set!(__residual, ["nano_time_assumed_tz"], __src_tz_label) }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

samples:
  # Microsoft Learn W3C logging example (IIS 6 field set), documentation IPs:
  # https://learn.microsoft.com/en-us/windows/win32/http/w3c-logging
  - raw: '2002-05-02 17:42:15 192.0.2.55 - 192.0.2.10 80 GET /images/picture.jpg - 200 Mozilla/4.0+(compatible;MSIE+5.5;+Windows+2000+Server)'
    expect:
      class_uid: 4002
      activity_id: 3
      http_response.code: 200
      src_endpoint.ip: 192.0.2.55
      http_request.user_agent: Mozilla/4.0 (compatible;MSIE 5.5; Windows 2000 Server)
  # IIS 10 default field set, after Elastic's iis access pipeline fixtures:
  # https://github.com/elastic/integrations/tree/main/packages/iis/data_stream/access/_dev/test/pipeline
  - raw: '2026-11-20 09:10:11 192.0.2.10 GET /favicon.ico - 80 - 198.51.100.25 Mozilla/5.0+(Macintosh;+Intel+Mac+OS+X+10.14;+rv:64.0)+Gecko/20100101+Firefox/64.0 http://www.example.com/ 404 0 2 47'
    expect:
      class_uid: 4002
      status_id: 2
      severity_id: 2
      duration: 47
      unmapped.sc_win_32_status: "2"
  - raw: '2026-11-20 10:25:01 W3SVC2 WEB01 192.0.2.10 PROPFIND /owa/ - 443 - 198.51.100.66 HTTP/1.1 Microsoft-WebDAV-MiniRedir/10.0.19045 - - mail.example.com 401 2 5 1293 512 15 203.0.113.9'
    expect:
      class_uid: 4002
      dst_endpoint.hostname: WEB01
      http_request.url.url_string: https://mail.example.com/owa/
      http_request.x_forwarded_for.0: 203.0.113.9
      traffic.bytes_in: 1293
  - raw: '#Fields: date time s-ip cs-method cs-uri-stem cs-uri-query s-port cs-username c-ip cs(User-Agent) cs(Referer) sc-status sc-substatus sc-win32-status time-taken'
    expect:
      class_uid: 0
      metadata.event_code: Fields
  - raw: 'this is not an IIS log line'
    expect:
      class_uid: 0
      unmapped.parse_fallback: unparsable input
  # Review fix: cs-host with a port and X-Forwarded-For entries with client ports.
  - raw: "2026-11-20 11:02:44 W3SVC3 WEB02 192.0.2.10 GET /api/orders id=42 8443 - 198.51.100.40 HTTP/1.1 Mozilla/5.0+(Windows+NT+10.0;+Win64;+x64) - - app.example.com:8443 200 0 0 5120 610 31 198.51.100.77:54321"
    expect:
      class_uid: 4002
      "http_request.url.hostname": "app.example.com"
      "http_request.url.url_string": "http://app.example.com:8443/api/orders?id=42"
      "http_request.x_forwarded_for.0": "198.51.100.77"
      "dst_endpoint.hostname": "WEB02"
  - raw: "2026-11-20 11:03:10 W3SVC3 - 192.0.2.10 GET /health - 8443 - 198.51.100.41 HTTP/1.1 kube-probe/1.29 - - [2001:db8::10]:8443 200 0 0 2 180 1 [2001:db8::77]:50123"
    expect:
      "http_request.url.hostname": "2001:db8::10"
      "dst_endpoint.hostname": "2001:db8::10"
      "http_request.x_forwarded_for.0": "2001:db8::77"
