source: json
transforms:
- source: verb
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value
    is emitted.
- source: requestReceivedTimestamp
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: stageTimestamp
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: verb
  kind: enum
  target: activity_name
  values:
    create: Create
  reason: Parser normalizes the caption case; verify the emitted caption.
- source: verb
  kind: enum
  target: activity_name
  values:
    delete: Delete
  reason: Parser normalizes the caption case; verify the emitted caption.
consumed_candidates:
- annotations
- annotations.authorization.k8s.io/decision
- annotations.authorization.k8s.io/reason
- apiVersion
- auditID
- level
- objectRef
- objectRef.apiGroup
- objectRef.name
- objectRef.namespace
- objectRef.resource
- objectRef.subresource
- requestReceivedTimestamp
- requestURI
- responseStatus
- responseStatus.code
- responseStatus.message
- responseStatus.reason
- sourceIPs
- stage
- stageTimestamp
- user
- user.groups
- user.uid
- user.username
- userAgent
- verb
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
