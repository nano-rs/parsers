source: json
transforms:
- source: requestReceivedTimestamp
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  apiVersion:
  - api.version
  auditID:
  - api.request.uid
  - metadata.correlation_uid
  objectRef.apiGroup:
  - resources.version
  objectRef.name:
  - resources.name
  - resources.uid
  objectRef.namespace:
  - resources.namespace
  objectRef.resource:
  - resources.type
  requestURI:
  - http_request.url.path
  responseStatus.code:
  - http_response.code
  - status_code
  responseStatus.message:
  - api.response.message
  - status_detail
  sourceIPs:
  - src_endpoint.ip
  user.uid:
  - actor.user.uid
  user.username:
  - actor.user.email_addr
  - actor.user.name
  userAgent:
  - http_request.user_agent
