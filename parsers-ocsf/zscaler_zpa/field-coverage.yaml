source: json
transforms:
- source: TimestampConnectionStart
  kind: epoch_ms
  target: start_time
  reason: Successful ISO timestamp conversion of the connection start in milliseconds.
- source: TimestampConnectionEnd
  kind: epoch_ms
  target: end_time
  reason: Successful ISO timestamp conversion of the connection end in milliseconds.
- source: TimestampAuthentication
  kind: epoch_ms
  target: session.created_time
  reason: Successful ISO timestamp conversion of the session authentication time in milliseconds.
- source: ConnectionStatus
  kind: lowercase
  target: metadata.event_code
  reason: Parser lowercases the connection status into the message; consume only when the normalized value
    is emitted.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  Application:
  - app_name
  - dst_endpoint.svc_name
  ClientCountryCode:
  - src_endpoint.location.country
  ClientLatitude:
  - src_endpoint.location.lat
  ClientLongitude:
  - src_endpoint.location.long
  ClientPublicIP:
  - src_endpoint.ip
  ConnectionID:
  - connection_info.uid
  ConnectionStatus:
  - metadata.event_code
  Connector:
  - proxy_endpoint.name
  - user.name
  ConnectorGroup:
  - user.groups.name
  ConnectorIP:
  - proxy_endpoint.ip
  ConnectorPort:
  - proxy_endpoint.port
  CountryCode:
  - src_endpoint.location.country
  Host:
  - dst_endpoint.hostname
  - dst_endpoint.ip
  Hostname:
  - device.hostname
  IPProtocol:
  - connection_info.protocol_num
  InternalReason:
  - status_detail
  Latitude:
  - src_endpoint.location.lat
  Longitude:
  - src_endpoint.location.long
  Platform:
  - device.os.name
  Policy:
  - policy.name
  PrivateIP:
  - src_endpoint.ip
  PublicIP:
  - src_endpoint.ip
  ServerIP:
  - dst_endpoint.ip
  ServerPort:
  - dst_endpoint.port
  SessionID:
  - actor.session.uid
  - metadata.correlation_uid
  - session.uid
  SessionStatus:
  - metadata.event_code
  - status_detail
  SessionType:
  - metadata.event_code
  Username:
  - actor.user.name
  - user.email_addr
  - user.name
  ZEN:
  - dst_endpoint.name
  ZENTotalBytesRxClient:
  - traffic.bytes
  - traffic.bytes_out
  ZENTotalBytesTxClient:
  - traffic.bytes
  - traffic.bytes_in
