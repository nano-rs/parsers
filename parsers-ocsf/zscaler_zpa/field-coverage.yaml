source: json
transforms:
- source: LogTimestamp
  kind: epoch_ms
  target: time
  format: '%a %b %d %H:%M:%S %Y'
  reason: Successful LSS LogTimestamp (UTC) conversion to the event clock in milliseconds.
- source: TimestampConnectionStart
  kind: epoch_ms
  target: start_time
  reason: Successful ISO timestamp conversion of the connection start in milliseconds.
- source: TimestampConnectionEnd
  kind: epoch_ms
  target: end_time
  reason: Successful ISO timestamp conversion of the connection end in milliseconds.
- source: TimestampAuthentication
  kind: epoch_ms
  target: session.created_time
  reason: Successful ISO timestamp conversion of the session authentication time in milliseconds.
- source: ConnectionStatus
  kind: lowercase
  reason: Parser lowercases the connection status into the message; consume only
    when the normalized value is emitted.
consumed_candidates:
- Application
- ClientCountryCode
- ClientLatitude
- ClientLongitude
- ClientPrivateIP
- ClientPublicIP
- ConnectionID
- ConnectionStatus
- Connector
- ConnectorGroup
- ConnectorIP
- ConnectorPort
- CountryCode
- Host
- Hostname
- IPProtocol
- InternalReason
- Latitude
- Longitude
- Platform
- Policy
- PrivateIP
- PublicIP
- ServerIP
- ServerPort
- ServicePort
- SessionID
- SessionStatus
- SessionType
- Username
- ZEN
- ZENTotalBytesRxClient
- ZENTotalBytesTxClient
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
