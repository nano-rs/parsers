source: mixed
transforms:
- source: timestamp
  kind: epoch_ms
  target: time
  reason: Exported lines carry an RFC 3339 event clock, converted to event milliseconds.
consumed_candidates:
- eventId
- id
- ingestionTime
- logEvents.@aws.account
- logEvents.@aws.region
- logEvents.id
- logEvents.message
- logEvents.timestamp
- logGroup
- logGroupName
- message
- message_json.errorMessage
- message_json.message
- message_json.msg
- owner
- timestamp
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
source_normalize:
- kind: unwrap_single
  path: logEvents
  reason: A subscription envelope carrying one logEvent is captured as that event, the
    same shape `unnest(.logEvents)` leaves, so the event is not spilled twice.
- kind: parse_json_object
  paths:
  - logEvents.message
  - message
  target: message_json
  arrays: true
  reason: A JSON log message is moved under message_json so its fields spill one by
    one and secret keys are redacted (its raw text stays only in raw_data); never
    overwrites an existing message_json.
- kind: withhold
  paths:
  - logEvents.message
  - message
  match: '^\uFEFF?\s*(?:\x7B|\x5B\s*(?:[\x7B\x5B\x22]|(?:-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?|true|false|null)\s*(?:,|\x5D\s*$)))'
  reason: Text that opens like a JSON object or array (a UTF-8 BOM allowed) but could not
    be moved (invalid JSON, or an input message_json key) cannot be key-redacted, so only
    its byte length and sha256 stay.
- kind: withhold
  paths:
  - logEvents
  match: '^\x5B[^\x5D]'
  reason: A multi-event batch (nano cannot fan out) keeps its events only in raw_data;
    their message text cannot be key-redacted, so only its byte length and sha256 stay.
