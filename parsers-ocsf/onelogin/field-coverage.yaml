source: json
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
transforms:
- source: created_at
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
mappings:
  account_id:
  - metadata.tenant_uid
  actor_system:
  - actor.app_name
  actor_user_id:
  - actor.user.uid
  actor_user_name:
  - actor.user.name
  app_id:
  - service.uid
  app_name:
  - service.name
  custom_message:
  - message
  error_description:
  - status_detail
  event_type_id:
  - category_uid
  - metadata.event_code
  id:
  - metadata.uid
  ipaddr:
  - src_endpoint.ip
  notes:
  - message
  risk_score:
  - risk_score
  user_id:
  - user.uid
  user_name:
  - user.name
