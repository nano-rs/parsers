name: wazuh_ocsf
display_name: Wazuh Alerts (OCSF)
version: "1.1.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses Wazuh manager alerts (alerts.json, one JSON alert per line, or the
  same alert as a wazuh-alerts-* indexer document) into OCSF 1.9.0 with the
  host and security_control profiles. A syscheck / FIM alert on a file (not
  a registry key or value: [x64] HKEY_..., short hives such as HKLM\, or a
  syscheck_registry rule) is a
  "File System Activity" (1001): syscheck.event added / modified / deleted is
  Create / Update / Delete, the file carries path, parent folder, size, MD5 /
  SHA-1 / SHA-256 and owner (the _after values, or _before for a deletion),
  and whodata (syscheck.audit) names the actor user and process. Every other
  alert, including registry FIM, is a "Detection Finding" (2004) with the
  rule as the analytic (uid = rule.id, name = rule.description, category =
  decoder), rule.groups as finding types and metadata.labels, full_log as the
  finding description and the decoded data (srcip / srcport, dstip /
  dstport, dstuser / srcuser, Windows eventdata image or newProcessName,
  decimal or hex processId / newProcessId, targetObject) as evidences. rule.level 0-15 maps to severity_id the way
  Wazuh's own OCSF converter does (15 Critical, 11-14 High, 8-10 Medium, 4-7
  Low, 0-3 Informational; no level is Unknown); rule.mitre id / tactic / technique become attacks
  with sub-techniques split out; rule.firedtimes is count; the agent is the
  device and the manager the reporter; location is metadata.log_name.
  Compliance mappings (pci_dss, gdpr, hipaa, nist_800_53, tsc, gpg13) are kept
  under unmapped. Anything that is not an alert falls back to Base Event with
  the raw record kept.
match_values:
  - wazuh
category: security
vendor: "Wazuh"
product: "Wazuh"
parser_vrl: |
  # NAN source timezone. Generated by scripts/residual_spill.py; edit scripts/residual/source_tz.vrl.
  # The log source's timezone setting arrives as .nano.source_timezone (an IANA
  # name such as "America/New_York", or any fixed offset such as "+05:30"), set
  # by nano at ingest. .nano is nano's input, never part of the log: it is
  # removed whole before anything else, whatever its shape.
  # A parser reads a clock that carries no offset AS UTC (timezone: "UTC", never
  # ambiguous) and records it: __time_assumed = true and the clock's ms in
  # __time_local (",<ms>" per clock). The spill block then turns every *time
  # field holding a recorded value into real UTC with the setting: a fixed
  # offset by arithmetic, an IANA zone with its DST rules (an ambiguous
  # fall-back time takes its FIRST occurrence, the earlier offset; a time in a
  # spring-forward gap moves forward by the gap), and records the zone used as
  # unmapped.nano_time_assumed_tz (the name, the offset as +HH:MM, or "UTC" when
  # the setting is absent or invalid). A clock with no year uses __src_year (the
  # current year in the source's zone) and records its ms in __time_noyear too:
  # a result more than a day in the future moves to the previous year.
  __src_nano = del(.nano)
  __src_tz_in = ""
  if is_object(__src_nano) { __src_tz_in = strip_whitespace(to_string(object!(__src_nano).source_timezone) ?? "") }
  __src_tz = "UTC"
  __src_shift_ms = 0
  __src_tz_label = "UTC"
  __time_assumed = false
  __time_inline = false
  __time_local = ""
  __time_noyear = ""
  __src_off = parse_regex(__src_tz_in, r'^(?P<sign>[+-])(?P<h>\d{2}):?(?P<m>\d{2})$') ?? {}
  if !is_empty(__src_off) {
      __src_h = to_int(__src_off.h) ?? 99
      __src_m = to_int(__src_off.m) ?? 99
      if __src_h <= 14 && __src_m <= 59 {
          __src_shift_ms = (__src_h * 3600 + __src_m * 60) * 1000
          if __src_off.sign == "-" { __src_shift_ms = 0 - __src_shift_ms }
          if __src_shift_ms != 0 { __src_tz_label = string!(__src_off.sign) + string!(__src_off.h) + ":" + string!(__src_off.m) }
      }
  } else if __src_tz_in != "" && downcase(__src_tz_in) != "local" {
      # "local" (the Vector host's zone) would make the time depend on the host.
      __src_probe, __src_probe_err = parse_timestamp("2000-01-01 00:00:00", "%Y-%m-%d %H:%M:%S", timezone: __src_tz_in)
      if __src_probe_err == null { __src_tz = __src_tz_in; __src_tz_label = __src_tz_in }
  }
  __src_now_ms = to_unix_timestamp(now(), unit: "milliseconds")
  __src_year = format_timestamp!(from_unix_timestamp!(__src_now_ms + __src_shift_ms, unit: "milliseconds"), "%Y", timezone: __src_tz)
  # END NAN source timezone
  # Wazuh alerts.json -> OCSF 1.9.0 Detection Finding (2004), File System
  # Activity (1001) for syscheck / FIM file alerts, or Base Event (0)
  raw_log = to_string(.message) ?? ""
  __raw_body = raw_log
  __source_kv = {}
  ip_re = r'^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$|^[0-9A-Fa-f:]{3,}$'

  parsed, err = parse_json(raw_log)
  __source_kv = object(parsed) ?? {}
  e = object(parsed) ?? {}
  rule = object(e.rule) ?? {}
  alert_id = to_string(e.id) ?? ""

  if err != null || !is_object(parsed) || length(rule) == 0 || alert_id == "" {
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 99,
          "activity_name": "Other",
          "type_uid": 99,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": 0,
          "message": "Unrecognized Wazuh record",
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": sha2("wazuh|raw|" + raw_log, variant: "SHA-256"),
              "log_level": "error",
              "log_name": "alerts",
              "product": { "name": "Wazuh", "vendor_name": "Wazuh" }
          }
      }
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      . = set!(., ["unmapped", "parse_fallback"], "unparsable input")
  } else {
      # ---- time ----
      time_ms = 0
      ts = to_string(e.timestamp) ?? ""
      if ts != "" {
          t, terr = parse_timestamp(ts, "%+", timezone: "UTC")
          if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
      }

      # ---- severity: rule.level 0-15, normalized as Wazuh's own OCSF
      # converter does (15 Critical, 11-14 High, 8-10 Medium, 4-7 Low, 0-3 Info)
      # to_int(null) is 0, so an alert without a level stays Unknown.
      level = -1
      if rule.level != null { level = to_int(rule.level) ?? -1 }
      severity_id = 0
      severity = "Unknown"
      if level >= 0 { severity_id = 1; severity = "Informational" }
      if level >= 4 { severity_id = 2; severity = "Low" }
      if level >= 8 { severity_id = 3; severity = "Medium" }
      if level >= 11 { severity_id = 4; severity = "High" }
      if level >= 15 { severity_id = 5; severity = "Critical" }

      rule_id = to_string(rule.id) ?? ""
      rule_desc = to_string(rule.description) ?? ""
      groups = []
      for_each(array(rule.groups) ?? []) -> |_i, g| {
          gs = to_string(g) ?? ""
          if gs != "" { groups = push(groups, gs) }
      }

      # ---- MITRE ATT&CK: rule.mitre.id[] with tactic[] / technique[] ----
      mitre = object(rule.mitre) ?? {}
      tactic_objs = []
      for_each(array(mitre.tactic) ?? []) -> |_i, tn| {
          tns = to_string(tn) ?? ""
          if tns != "" { tactic_objs = push(tactic_objs, { "name": tns }) }
      }
      tech_names = array(mitre.technique) ?? []
      attacks = []
      for_each(array(mitre.id) ?? []) -> |i, mid| {
          ids = to_string(mid) ?? ""
          if ids != "" {
              atk = {}
              tname = to_string(get(tech_names, [i]) ?? "") ?? ""
              if contains(ids, ".") {
                  atk.technique = { "uid": to_string(get(split(ids, "."), [0]) ?? ids) ?? ids }
                  atk.sub_technique = { "uid": ids }
                  if tname != "" { atk.sub_technique.name = tname }
              } else {
                  atk.technique = { "uid": ids }
                  if tname != "" { atk.technique.name = tname }
              }
              if length(tactic_objs) > 0 { atk.tactics = tactic_objs }
              attacks = push(attacks, atk)
          }
      }
      if length(attacks) == 0 && length(tactic_objs) > 0 { attacks = [{ "tactics": tactic_objs }] }

      # ---- the agent (or manager) the alert is about ----
      agent = object(e.agent) ?? {}
      manager = to_string(get(e, ["manager", "name"]) ?? "") ?? ""
      dev = { "type_id": 0, "type": "Unknown" }
      aid = to_string(agent.id) ?? ""
      if aid != "" { dev.uid = aid }
      aname = to_string(agent.name) ?? ""
      if aname != "" { dev.name = aname; dev.hostname = downcase(aname) }
      aip = to_string(agent.ip) ?? ""
      if match(aip, ip_re) { dev.ip = aip }
      if !exists(dev.name) && !exists(dev.uid) && !exists(dev.ip) && manager != "" { dev.name = manager; dev.hostname = downcase(manager) }

      location = to_string(e.location) ?? ""
      decoder = to_string(get(e, ["decoder", "name"]) ?? "") ?? ""
      full_log = to_string(e.full_log) ?? ""
      count = to_int(rule.firedtimes) ?? 0

      metadata = {
          "version": "1.9.0",
          "profiles": ["host", "security_control"],
          "uid": alert_id,
          "log_name": "alerts",
          "product": { "name": "Wazuh", "vendor_name": "Wazuh" }
      }
      if location != "" { metadata.log_name = location }
      if decoder != "" { metadata.log_format = decoder }
      if rule_id != "" { metadata.event_code = rule_id }
      if length(groups) > 0 { metadata.labels = groups }
      if manager != "" { metadata.reporter = { "name": manager, "hostname": downcase(manager) } }

      sc = object(e.syscheck) ?? {}
      fim_path = to_string(sc.path) ?? ""
      fim_event = downcase(to_string(sc.event) ?? "")
      # Registry FIM ([x64] HKEY_..., HKLM\..., or a syscheck_registry rule)
      # stays a Detection Finding; only file paths are File System Activity.
      is_registry = includes(groups, "syscheck_registry") || includes(groups, "syscheck_registry_value") || includes(groups, "syscheck_registry_key") || sc.value_name != null || sc.value_type != null || match(upcase(fim_path), r'^(?:\x5BX(?:32|64)\x5D\s*)?(?:HKEY_|HK(?:LM|CU|CR|U|CC)(?:\\|$))')
      is_file = fim_path != "" && !is_registry

      if is_file {
          # ---- File System Activity for a syscheck file alert ----
          activity_id = 99
          activity_name = "Other"
          if fim_event == "added" { activity_id = 1; activity_name = "Create" }
          if fim_event == "modified" { activity_id = 3; activity_name = "Update" }
          if fim_event == "deleted" { activity_id = 4; activity_name = "Delete" }
          suffix = "_after"
          if fim_event == "deleted" { suffix = "_before" }
          pparts = split(fim_path, r'[/\\]')
          fname = to_string(get(pparts, [length(pparts) - 1]) ?? "") ?? ""
          if fname == "" { fname = fim_path }
          file = { "path": fim_path, "name": fname, "type_id": 1, "type": "Regular File" }
          folder = replace(fim_path, r'[/\\][^/\\]*$', "")
          if folder != "" && folder != fim_path { file.parent_folder = folder }
          fsize_raw = get(sc, ["size" + suffix]) ?? null
          fsize = to_int(fsize_raw) ?? -1
          if fsize_raw != null && fsize >= 0 { file.size = fsize }
          hashes = []
          md5 = to_string(get(sc, ["md5" + suffix]) ?? "") ?? ""
          if md5 != "" { hashes = push(hashes, { "algorithm_id": 1, "algorithm": "MD5", "value": downcase(md5) }) }
          sha1 = to_string(get(sc, ["sha1" + suffix]) ?? "") ?? ""
          if sha1 != "" { hashes = push(hashes, { "algorithm_id": 2, "algorithm": "SHA-1", "value": downcase(sha1) }) }
          sha256 = to_string(get(sc, ["sha256" + suffix]) ?? "") ?? ""
          if sha256 != "" { hashes = push(hashes, { "algorithm_id": 3, "algorithm": "SHA-256", "value": downcase(sha256) }) }
          if length(hashes) > 0 { file.hashes = hashes }
          uname = to_string(get(sc, ["uname" + suffix]) ?? "") ?? ""
          fuid = to_string(get(sc, ["uid" + suffix]) ?? "") ?? ""
          if uname != "" || fuid != "" {
              owner = {}
              if uname != "" { owner.name = uname }
              if fuid != "" { owner.uid = fuid }
              file.owner = owner
          }
          finode = to_string(get(sc, ["inode" + suffix]) ?? "") ?? ""
          if finode != "" { file.uid = finode }

          # whodata names the user and process behind the change
          actor = {}
          au = object(get(sc, ["audit", "user"]) ?? {}) ?? {}
          au_name = to_string(au.name) ?? ""
          au_id = to_string(au.id) ?? ""
          if au_name != "" || au_id != "" {
              actor.user = {}
              if au_name != "" { actor.user.name = au_name }
              if au_id != "" { actor.user.uid = au_id }
          }
          ap = object(get(sc, ["audit", "process"]) ?? {}) ?? {}
          ap_name = to_string(ap.name) ?? ""
          ap_pid = to_int(ap.id) ?? 0
          if ap_name != "" || ap.id != null {
              proc = { "pid": ap_pid }
              if ap_name != "" {
                  pp = split(ap_name, r'[/\\]')
                  pbase = to_string(get(pp, [length(pp) - 1]) ?? "") ?? ""
                  if pbase == "" { pbase = ap_name }
                  proc.name = pbase
                  proc.file = { "path": ap_name, "name": pbase, "type_id": 1, "type": "Regular File" }
              }
              ppid = to_int(ap.ppid) ?? 0
              if ppid > 0 { proc.parent_process = { "pid": ppid } }
              cwd = to_string(ap.cwd) ?? ""
              if cwd != "" { proc.working_directory = cwd }
              actor.process = proc
          }
          if length(actor) == 0 {
              actor.app_name = location
              if location == "" { actor.app_name = "syscheck" }
          }

          ocsf = {
              "class_uid": 1001,
              "class_name": "File System Activity",
              "category_uid": 1,
              "category_name": "System Activity",
              "activity_id": activity_id,
              "activity_name": activity_name,
              "type_uid": 100100 + activity_id,
              "severity_id": severity_id,
              "severity": severity,
              "status_id": 1,
              "status": "Success",
              "time": time_ms,
              "message": rule_desc,
              "raw_data": raw_log,
              "metadata": metadata,
              "actor": actor,
              "device": dev,
              "file": file,
              "is_alert": true
          }
          diff = to_string(sc.diff) ?? ""
          if diff != "" { ocsf.file_diff = diff }
          if length(attacks) > 0 { ocsf.attacks = attacks }
          if count > 0 { ocsf.count = count }
          . = ocsf
      } else {
          # ---- Detection Finding for every other alert ----
          d = object(e.data) ?? {}
          ev = {}
          sip = to_string(d.srcip) ?? ""
          if match(sip, ip_re) {
              ev.src_endpoint = { "ip": sip }
              sport = to_int(d.srcport) ?? 0
              if sport > 0 { ev.src_endpoint.port = sport }
          }
          dip = to_string(d.dstip) ?? ""
          if match(dip, ip_re) {
              ev.dst_endpoint = { "ip": dip }
              dport = to_int(d.dstport) ?? 0
              if dport > 0 { ev.dst_endpoint.port = dport }
          }
          tuser = to_string(d.dstuser) ?? ""
          if tuser == "" { tuser = to_string(d.srcuser) ?? "" }
          if tuser != "" { ev.user = { "name": tuser } }
          wed = object(get(d, ["win", "eventdata"]) ?? {}) ?? {}
          image = to_string(wed.image) ?? ""
          if image == "" { image = to_string(wed.newProcessName) ?? "" }
          if image != "" {
              ip_parts = split(image, r'[/\\]')
              ibase = to_string(get(ip_parts, [length(ip_parts) - 1]) ?? "") ?? ""
              if ibase == "" { ibase = image }
              # Sysmon writes decimal pids, Security events hex (0x2d0).
              # In a 4688, newProcessId is the new process and processId its creator.
              wpid_s = downcase(to_string(wed.processId) ?? "")
              ppid_s = ""
              if wed.newProcessId != null {
                  ppid_s = wpid_s
                  wpid_s = downcase(to_string(wed.newProcessId) ?? "")
              }
              wpid = null
              if starts_with(wpid_s, "0x") { wpid = parse_int(slice!(wpid_s, 2), base: 16) ?? null } else if match(wpid_s, r'^\d+$') { wpid = to_int(wpid_s) ?? null }
              proc = { "name": ibase, "file": { "path": image, "name": ibase, "type_id": 1, "type": "Regular File" } }
              if wpid != null { proc.pid = wpid }
              wppid = null
              if starts_with(ppid_s, "0x") { wppid = parse_int(slice!(ppid_s, 2), base: 16) ?? null } else if match(ppid_s, r'^\d+$') { wppid = to_int(ppid_s) ?? null }
              if wppid != null {
                  proc.parent_process = { "pid": wppid }
                  pname = to_string(wed.parentProcessName) ?? ""
                  if pname != "" {
                      pnp = split(pname, r'[/\\]')
                      pnb = to_string(get(pnp, [length(pnp) - 1]) ?? "") ?? ""
                      if pnb == "" { pnb = pname }
                      proc.parent_process.name = pnb
                      proc.parent_process.file = { "path": pname, "name": pnb, "type_id": 1, "type": "Regular File" }
                  }
              }
              pguid = to_string(wed.processGuid) ?? ""
              if pguid != "" { proc.uid = pguid }
              # The OCSF process needs a pid or uid; neither known means an
              # event-scoped uid rather than a fabricated pid 0.
              if !exists(proc.pid) && !exists(proc.uid) { proc.uid = "wazuh|" + alert_id + "|" + image }
              puser = to_string(wed.user) ?? ""
              if puser != "" { proc.user = { "name": puser } }
              if !exists(proc.user) {
                  suser = to_string(wed.subjectUserName) ?? ""
                  if suser != "" { proc.user = { "name": suser } }
              }
              pcmd = to_string(wed.commandLine) ?? ""
              if pcmd != "" { proc.cmd_line = pcmd }
              ev.process = proc
          }
          target = to_string(wed.targetObject) ?? ""
          if target != "" { ev.reg_key = { "path": target } }
          if is_object(e.syscheck) && fim_path != "" { ev.reg_key = { "path": fim_path } }
          if length(ev) == 0 { ev.device = dev }

          finding_info = { "uid": alert_id, "title": rule_desc }
          if rule_desc == "" { finding_info.title = "Wazuh rule " + rule_id }
          if full_log != "" { finding_info.desc = full_log }
          if length(groups) > 0 { finding_info.types = groups }
          if rule_id != "" {
              finding_info.analytic = { "uid": rule_id, "name": finding_info.title, "type_id": 1, "type": "Rule" }
              if decoder != "" { finding_info.analytic.category = decoder }
          }
          if time_ms > 0 { finding_info.created_time = time_ms }
          if length(attacks) > 0 { finding_info.attacks = attacks }
          finding_info.data_sources = ["Wazuh"]

          ocsf = {
              "class_uid": 2004,
              "class_name": "Detection Finding",
              "category_uid": 2,
              "category_name": "Findings",
              "activity_id": 1,
              "activity_name": "Create",
              "type_uid": 200401,
              "severity_id": severity_id,
              "severity": severity,
              "status_id": 1,
              "status": "New",
              "time": time_ms,
              "message": finding_info.title,
              "raw_data": raw_log,
              "metadata": metadata,
              "finding_info": finding_info,
              "evidences": [ev],
              "device": dev,
              "is_alert": true
          }
          if count > 0 { ocsf.count = count }
          . = ocsf
      }
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # Values spill exactly as parsed: a parser never masks, redacts or withholds
  # anything (masking is an opt-in pipeline step, never a parser concern).
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # A source field is consumed ONLY by an explicit mapping: a field-coverage.yaml
  # `mappings` entry (source key -> target paths) or a `transforms` rule with a
  # target, whose value is found AT THAT TARGET PATH of the selected branch. A
  # value that merely appears somewhere else in the event never consumes a field
  # (no coincidental consumption); everything else spills.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The sets below are strings instead
  # (a read shares the buffer). __repr holds one member per mapped leaf:
  # "," + encode_json(path) + "=" + encode_json(encode_json(value)), plus the
  # to_string form for a string or a float, so a numeric string is represented by
  # its typed scalar. Every part is a JSON text, inside which a '"' is always
  # escaped, so a member is matched exactly. Paths drop array indices
  # (resources.0.uid is resources.uid); arrays are walked two levels deep, and a
  # leaf deeper than that is simply not mapping evidence (it can only spill more).
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  # Clocks read without an offset (recorded as local ms in __time_local) become
  # real UTC: every *time field holding one is converted with the log source's
  # timezone (see source_tz.vrl), and the zone used is recorded, so source
  # health can tell assumed times apart. An inline IANA zone (__time_inline)
  # converts the same way but is not an assumption.
  if __time_local != "" {
      __time_fix = filter(flatten(object!(parse_json!(encode_json(.))))) -> |path, value| {
          is_integer(value) && match(path, r'(?:^|[._])time$') && contains(__time_local + ",", "," + to_string!(value) + ",")
      }
      for_each(__time_fix) -> |path, value| {
          __l = int!(value)
          __u = __l - __src_shift_ms
          if __src_tz != "UTC" {
              # The zone's offsets 12 h either side; equal offsets (no transition
              # that day) give the answer directly.
              __offs = map_values([__l - 43200000, __l + 43200000]) -> |at| {
                  __z = format_timestamp!(from_unix_timestamp!(at, unit: "milliseconds"), "%z", timezone: __src_tz)
                  __o = ((to_int(slice!(__z, 1, 3)) ?? 0) * 3600 + (to_int(slice!(__z, 3, 5)) ?? 0) * 60) * 1000
                  if starts_with(__z, "-") { 0 - __o } else { __o }
              }
              __oa = int!(__offs[0])
              __ob = int!(__offs[1])
              __u = __l - __oa
              if __oa != __ob {
                  # A candidate is valid when the zone has that offset at that
                  # instant. Both valid: ambiguous, keep the first occurrence
                  # (__oa, the earlier offset). Neither: a gap, __oa moves the
                  # time forward by the gap.
                  __ok = map_values([__l - __oa, __l - __ob]) -> |at| {
                      __z = format_timestamp!(from_unix_timestamp!(at, unit: "milliseconds"), "%z", timezone: __src_tz)
                      __o = ((to_int(slice!(__z, 1, 3)) ?? 0) * 3600 + (to_int(slice!(__z, 3, 5)) ?? 0) * 60) * 1000
                      if starts_with(__z, "-") { 0 - __o } else { __o }
                  }
                  if int!(__ok[0]) != __oa && int!(__ok[1]) == __ob { __u = __l - __ob }
              }
          }
          # No year in the clock: more than a day in the future is last year.
          if contains(__time_noyear + ",", "," + to_string(__l) + ",") && __u > __src_now_ms + 86400000 {
