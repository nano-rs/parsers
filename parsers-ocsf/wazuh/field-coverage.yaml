source: json
transforms:
- source: timestamp
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the emitted millisecond clock.
- source: agent.name
  kind: lowercase
  reason: Parser lowercases the agent name for device.hostname; the original also lands in device.name.
- source: manager.name
  kind: lowercase
  reason: Parser lowercases the manager name for metadata.reporter.hostname; the original also lands in reporter.name.
- source: syscheck.md5_after
  kind: lowercase
  reason: Parser lowercases file hashes; consume only when the normalized value is emitted.
- source: syscheck.sha1_after
  kind: lowercase
  reason: Parser lowercases file hashes; consume only when the normalized value is emitted.
- source: syscheck.sha256_after
  kind: lowercase
  reason: Parser lowercases file hashes; consume only when the normalized value is emitted.
- source: syscheck.md5_before
  kind: lowercase
  reason: Parser lowercases file hashes; consume only when the normalized value is emitted.
- source: syscheck.sha1_before
  kind: lowercase
  reason: Parser lowercases file hashes; consume only when the normalized value is emitted.
- source: syscheck.sha256_before
  kind: lowercase
  reason: Parser lowercases file hashes; consume only when the normalized value is emitted.
- source: syscheck.event
  kind: enum
  target: activity_id
  values:
    added: 1
    modified: 3
    deleted: 4
  reason: The FIM event drives the File System Activity (Create / Update / Delete); consume only when that activity is emitted.
consumed_candidates:
- agent.id
- agent.ip
- agent.name
- data.dstip
- data.dstport
- data.dstuser
- data.srcip
- data.srcport
- data.srcuser
- data.win.eventdata.commandLine
- data.win.eventdata.image
- data.win.eventdata.processGuid
- data.win.eventdata.processId
- data.win.eventdata.targetObject
- data.win.eventdata.user
- data.win.eventdata.newProcessId
- data.win.eventdata.newProcessName
- data.win.eventdata.subjectUserName
- data.win.eventdata.parentProcessName
- decoder.name
- full_log
- id
- location
- manager.name
- rule.description
- rule.firedtimes
- rule.groups
- rule.id
- rule.mitre.id
- rule.mitre.tactic
- rule.mitre.technique
- syscheck.audit.process.cwd
- syscheck.audit.process.id
- syscheck.audit.process.name
- syscheck.audit.process.ppid
- syscheck.audit.user.id
- syscheck.audit.user.name
- syscheck.diff
- syscheck.inode_after
- syscheck.inode_before
- syscheck.md5_after
- syscheck.md5_before
- syscheck.path
- syscheck.sha1_after
- syscheck.sha1_before
- syscheck.sha256_after
- syscheck.sha256_before
- syscheck.size_after
- syscheck.size_before
- syscheck.uid_after
- syscheck.uid_before
- syscheck.uname_after
- syscheck.uname_before
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
