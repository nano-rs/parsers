name: f5_waf_ocsf
display_name: F5 BIG-IP ASM (OCSF)
version: "1.3.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields in redacted, dotted snake_case unmapped keys.
  Parses F5 BIG-IP ASM / Advanced WAF logs (syslog-wrapped or bare
  comma-separated key=value) into OCSF 1.9.0 HTTP Activity (class_uid 4002).
  The HTTP request/response is the event; the WAF verdict rides on
  action_id / disposition_id, the ASM policy on firewall_rule, and the
  violation detail (attack_type, violations, signature set, bot class,
  support id) on unmapped.*. Lines that yield no recognisable ASM keys still
  emit a well-formed 4002 record with activity_id 99 and the raw line in
  `message`.
match_values:
  - f5_waf
category: security
vendor: "F5"
product: "BIG-IP ASM"
parser_vrl: |
  # F5 BIG-IP ASM -> OCSF 1.9.0 HTTP Activity (class_uid 4002)

  raw_log = string!(.message)
  __raw_body = raw_log
  __source_kv = {}

  time_ms = to_int(to_unix_timestamp(now(), unit: "milliseconds"))
  dvc_host = null
  body = raw_log

  syslog_match, syslog_err = parse_regex(raw_log, r'^(?:<(?P<pri>\d+)>)?(?P<ts>[A-Z][a-z]{2}\s+\d+\s+\d+:\d+:\d+)\s+(?P<host>\S+)\s+(?P<component>[^:\x5B]+)(?:\x5B\d+\x5D)?:\s*(?P<body>.*)$')
  # Capture parsed fields before mapping; omit structural raw-body captures.
  __capture = object(parse_json!(encode_json(syslog_match))) ?? {}
  __ignore = del(__capture.body)
  __ignore = del(__capture.content)
  __ignore = del(__capture.kvdata)
  __ignore = del(__capture.kvpart)
  __ignore = del(__capture.msg)
  __ignore = del(__capture.payload)
  __ignore = del(__capture.remainder)
  __ignore = del(__capture.rest)
  __ignore = del(__capture.sd)
  __source_kv = set!(__source_kv, ["header"], merge(object(get(__source_kv, ["header"]) ?? null) ?? {}, __capture))
  if syslog_err == null && syslog_match != null {
      body = string!(syslog_match.body)
      hv = to_string(syslog_match.host)
      if hv != "" { dvc_host = hv }
      ts_str = to_string(syslog_match.ts)
      if ts_str != "" {
          full_ts = ts_str + " " + format_timestamp!(now(), "%Y")
          ts, ts_err = parse_timestamp(full_ts, "%b %d %H:%M:%S %Y")
          if ts_err == null { time_ms = to_int(to_unix_timestamp(ts, unit: "milliseconds")) }
      }
  }

  kv = parse_key_value(body, key_value_delimiter: "=", field_delimiter: ",") ?? {}
  __kv_capture = object(parse_json!(encode_json(kv))) ?? {}
  for_each(__kv_capture) -> |key, value| {
      if !is_boolean(value) { __source_kv = set!(__source_kv, [key], value) }
  }

  # helper: first non-empty of a set of keys
  pick = null

  # ---- HTTP method -> activity_id ----
  method = ""
  mv = to_string(kv.method) ?? ""
  if mv == "" { mv = to_string(kv.http_method) ?? "" }
  if mv != "" { method = upcase(mv) }

  activity_id = 99
  activity_name = "Other"
  if method == "CONNECT" { activity_id = 1;  activity_name = "Connect" }
  if method == "DELETE"  { activity_id = 2;  activity_name = "Delete" }
  if method == "GET"     { activity_id = 3;  activity_name = "Get" }
  if method == "HEAD"    { activity_id = 4;  activity_name = "Head" }
  if method == "OPTIONS" { activity_id = 5;  activity_name = "Options" }
  if method == "POST"    { activity_id = 6;  activity_name = "Post" }
  if method == "PUT"     { activity_id = 7;  activity_name = "Put" }
  if method == "TRACE"   { activity_id = 8;  activity_name = "Trace" }
  if method == "PATCH"   { activity_id = 9;  activity_name = "Patch" }

  # ---- WAF verdict ----
  waf_action = to_string(kv.action) ?? ""
  if waf_action == "" { waf_action = to_string(kv.request_status) ?? "" }
  la = downcase(waf_action)
  action_id = 3
  action = "Observed"
  disposition_id = 17
  disposition = "Logged"
  if contains(la, "block") || contains(la, "reject") || contains(la, "drop") {
      action_id = 2
      action = "Denied"
      disposition_id = 2
      disposition = "Blocked"
  }
  if contains(la, "allow") || contains(la, "pass") {
      action_id = 1
      action = "Allowed"
      disposition_id = 1
      disposition = "Allowed"
  }
  if contains(la, "alert") {
      action_id = 3
      action = "Observed"
      disposition_id = 19
      disposition = "Alert"
  }

  # ---- severity ----
  sev_raw = downcase(to_string(kv.severity) ?? "")
  severity_id = 1
  severity = "Informational"
  if sev_raw == "informational" || sev_raw == "info" { severity_id = 1; severity = "Informational" }
  if sev_raw == "warning" || sev_raw == "notice" || sev_raw == "low" { severity_id = 2; severity = "Low" }
  if sev_raw == "error" || sev_raw == "medium" { severity_id = 3; severity = "Medium" }
  if sev_raw == "critical" || sev_raw == "high" { severity_id = 4; severity = "High" }
  if sev_raw == "emergency" || sev_raw == "alert" { severity_id = 5; severity = "Critical" }

  attack_type = to_string(kv.attack_type) ?? ""
  violations = to_string(kv.violations) ?? ""
  is_alert = attack_type != "" || violations != ""
  if is_alert && severity_id < 2 { severity_id = 2; severity = "Low" }

  # ---- response code -> status ----
  code = 0
  cv = to_string(kv.response_code) ?? ""
  if cv == "" { cv = to_string(kv.status_code) ?? "" }
  if cv != "" { code = to_int(cv) ?? 0 }
  has_code = code > 0

  status_id = 0
  status_str = "Unknown"
  if has_code && code < 400 { status_id = 1; status_str = "Success" }
  if has_code && code >= 400 { status_id = 2; status_str = "Failure" }

  class_uid = 4002

  . = {
      "class_uid": class_uid,
      "class_name": "HTTP Activity",
      "category_uid": 4,
      "category_name": "Network Activity",
      "activity_id": activity_id,
      "activity_name": activity_name,
      "type_uid": class_uid * 100 + activity_id,
      "severity_id": severity_id,
      "severity": severity,
      "status_id": status_id,
      "status": status_str,
      "time": time_ms,
      "raw_data": raw_log,
      "action_id": action_id,
      "action": action,
      "disposition_id": disposition_id,
      "disposition": disposition,
      "is_alert": is_alert,
      "metadata": {
          "version": "1.9.0",
          "uid": sha2("f5_waf|raw|" + raw_log, variant: "SHA-256"),
          "log_source": "f5_waf",
          "log_provider": "ASM",
          "profiles": ["host", "security_control"],
          "product": {
              "name": "BIG-IP ASM",
              "vendor_name": "F5",
              "feature": { "name": "waf" }
          }
      }
  }

  support_id = to_string(kv.support_id) ?? ""
  if support_id != "" { .metadata.original_event_uid = support_id }

  # ---- endpoints ----
  src_ip = to_string(kv.src_ip) ?? ""
  if src_ip == "" { src_ip = to_string(kv.client_ip) ?? "" }
  if src_ip == "" { src_ip = to_string(kv.source_ip) ?? "" }
  src = {}
  if src_ip != "" { src.ip = downcase(src_ip) }
  xff = to_string(kv.x_forwarded_for) ?? ""
  country = to_string(kv.country) ?? ""
  if country == "" { country = to_string(kv.geo_location) ?? "" }
  if country != "" { src.location = { "country": country } }
  src_port = to_string(kv.src_port) ?? ""
  if src_port != "" {
      sp = to_int(src_port) ?? 0
      if sp > 0 { src.port = sp }
  }
  if length(src) > 0 { .src_endpoint = src }

  dst_ip = to_string(kv.dest_ip) ?? ""
  if dst_ip == "" { dst_ip = to_string(kv.server_ip) ?? "" }
  if dst_ip == "" { dst_ip = to_string(kv.dst_ip) ?? "" }
  dst = {}
  if dst_ip != "" { dst.ip = downcase(dst_ip) }
  dport = to_string(kv.dest_port) ?? ""
  if dport == "" { dport = to_string(kv.dst_port) ?? "" }
  if dport != "" {
      dp = to_int(dport) ?? 0
      if dp > 0 { dst.port = dp }
  }
  vs = to_string(kv.virtual_server) ?? ""
  if vs != "" { dst.svc_name = vs }
  if length(dst) > 0 { .dst_endpoint = dst }

  # 4002 constrains "at least one of [dst_endpoint, src_endpoint]"
  if !exists(.src_endpoint) && !exists(.dst_endpoint) {
      .dst_endpoint = { "svc_name": "http" }
  }

  if dvc_host != null {
      .device = { "hostname": dvc_host, "type_id": 15, "type": "Load Balancer" }
  }

  # ---- http_request / http_response ----
  uri = to_string(kv.uri) ?? ""
  if uri == "" { uri = to_string(kv.url) ?? "" }
  host_hdr = to_string(kv.host) ?? ""
  ua = to_string(kv.user_agent) ?? ""
  if ua == "" { ua = to_string(kv.useragent) ?? "" }
  referrer = to_string(kv.referer) ?? ""
  if referrer == "" { referrer = to_string(kv.referrer) ?? "" }

  req = {}
  if method != "" { req.http_method = method }
  if ua != "" { req.user_agent = ua }
  if referrer != "" { req.referrer = referrer }
  if xff != "" { req.x_forwarded_for = [xff] }
  url = {}
  if uri != "" {
      if starts_with(uri, "http://") || starts_with(uri, "https://") {
          url.url_string = uri
          pu, pue = parse_url(uri)
          if pue == null && pu != null {
              url.hostname = to_string(pu.host)
              url.path = to_string(pu.path)
              url.scheme = to_string(pu.scheme)
          }
      } else {
          qsplit = split(uri, "?", limit: 2)
          url.path = qsplit[0]
          if length(qsplit) > 1 { url.query_string = qsplit[1] }
      }
  }
  if host_hdr != "" && !exists(url.hostname) { url.hostname = host_hdr }
  if length(url) > 0 { req.url = url }
  # 4002 constrains "at least one of [http_request, http_response]" — emit the
  # request object unconditionally so an unrecognised ASM line still validates.
  .http_request = req

  resp = {}
  if has_code { resp.code = code; resp.status = status_str }
  ctype = to_string(kv.response_content_type) ?? ""
  if ctype != "" { resp.content_type = ctype }
  if length(resp) > 0 { .http_response = resp }

  # ---- volumes / duration ----
  traffic = {}
  bin = to_string(kv.bytes_in) ?? ""
  # NAN-2995: OCSF 1.9 network_traffic: bytes_in = destination -> source, bytes_out = source -> destination.
  # F5's bytes_in is bytes INTO the BIG-IP from the client (the request,
  # src -> dst = OCSF bytes_out); its bytes_out is the response (OCSF bytes_in).
  if bin != "" { traffic.bytes_out = to_int(bin) ?? 0 }
  bout = to_string(kv.bytes_out) ?? ""
  if bout != "" { traffic.bytes_in = to_int(bout) ?? 0 }
  if length(traffic) > 0 { .traffic = traffic }

  dur = to_string(kv.duration) ?? ""
  if dur != "" { .duration = to_int(dur) ?? 0 }

  # ---- ASM policy -> firewall_rule (security_control profile) ----
  policy = to_string(kv.policy_name) ?? ""
  if policy != "" { .firewall_rule = { "name": policy, "uid": policy, "type": "WAF Policy" } }

  # ---- authenticated user ----
  uname = to_string(kv.username) ?? ""
  if uname == "" { uname = to_string(kv.user) ?? "" }
  if uname != "" && uname != "N/A" { .actor = { "user": { "name": uname } } }

  # ---- violation rating -> risk_level ----
  vr = to_string(kv.violation_rating) ?? ""
  if vr != "" {
      vrn = to_int(vr) ?? 0
      .risk_score = vrn
      rl = 0
      rlname = "Info"
      if vrn >= 1 { rl = 1; rlname = "Low" }
      if vrn >= 3 { rl = 2; rlname = "Medium" }
      if vrn >= 4 { rl = 3; rlname = "High" }
      if vrn >= 5 { rl = 4; rlname = "Critical" }
      .risk_level_id = rl
      .risk_level = rlname
  }

  # ---- everything ASM-specific that OCSF has no home for ----
  unmapped = {}
  if attack_type != "" { unmapped.attack_type = attack_type }
  if violations != "" { unmapped.violations = violations }
  if waf_action != "" { unmapped.waf_action = waf_action }
  if support_id != "" { unmapped.support_id = support_id }
  sid = to_string(kv.session_id) ?? ""
  if sid != "" { unmapped.session_id = sid }
  sigset = to_string(kv.sig_set_names) ?? ""
  if sigset == "" { sigset = to_string(kv.signature_set) ?? "" }
  if sigset != "" { unmapped.signature_set = sigset }
  tc = to_string(kv.threat_campaign_names) ?? ""
  if tc == "" { tc = to_string(kv.threat_campaign) ?? "" }
  if tc != "" { unmapped.threat_campaign = tc }
  bc = to_string(kv.bot_class) ?? ""
  if bc != "" { unmapped.bot_class = bc }
  bn = to_string(kv.bot_name) ?? ""
  if bn != "" { unmapped.bot_name = bn }
  pn = to_string(kv.param_name) ?? ""
  if pn != "" { unmapped.param_name = pn }
  pv = to_string(kv.param_value) ?? ""
  if pv != "" { unmapped.param_value = pv }
  ss = to_string(kv.staged_sig) ?? ""
  if ss != "" { unmapped.staged_signature = ss }
  vd = to_string(kv.violation_details) ?? ""
  if vd != "" { unmapped.violation_details = vd }
  rs = to_string(kv.request_status) ?? ""
  if rs != "" { unmapped.request_status = rs }
  if length(kv) == 0 { unmapped.parse_status = "no_key_value_pairs" }
  if length(unmapped) > 0 { .unmapped = unmapped }

  obs = []
  if src_ip != "" { obs = push(obs, { "name": "src_endpoint.ip", "type": "IP Address", "type_id": 2, "value": downcase(src_ip) }) }
  if dst_ip != "" { obs = push(obs, { "name": "dst_endpoint.ip", "type": "IP Address", "type_id": 2, "value": downcase(dst_ip) }) }
  if uri != "" { obs = push(obs, { "name": "http_request.url.path", "type": "Uniform Resource Locator", "type_id": 23, "value": uri }) }
  if ua != "" { obs = push(obs, { "name": "http_request.user_agent", "type": "HTTP User-Agent", "type_id": 16, "value": ua }) }
  if length(obs) > 0 { .observables = obs }

  .

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # Exact value representation is evaluated AFTER branch selection. Numeric strings
  # count as represented by their typed scalar; other transformations are explicit.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The value sets below are strings
  # instead (a read shares the buffer): "," + encode_json(member) per member, and
  # contains(set, "," + encode_json(x)) is exact membership. Every member is a
  # JSON text, inside which a '"' is always escaped, so ',"' only ever starts a
  # member, and a JSON string ends at its first unescaped '"'. The fixed candidate
  # set is a regex literal, compiled once with the program.
  # __mapped holds only JSON types, so to_string equals encode_json for an integer
  # or a boolean and only strings and floats add a second member.
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped_json = encode_json(__mapped)
  __mapped = object!(parse_json!(__mapped_json))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __safe = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __safe_json = encode_json(__safe)
  # Object and array members are encodings: an empty object, an object that
  # opens with a quoted key, or an array. A lookup can ask for one only when some
  # source or existing value is an array, or a string spelling one of those
  # openings, and the regex below finds either in the JSON text (brackets are
  # written as hex escapes because nano's deploy check counts them raw).
  # Otherwise the scalar nodes suffice; a Sysmon GUID, a brace-wrapped string
  # with no quoted key, is no object member. The leaves of flatten(), with arrays
  # flattened too, are every scalar node unless a key holds a literal '.' (in
  # compact JSON only a key is followed by ':').
  # Their encodings, unwrapped from the array, already are the string members.
  __represented = ""
  __nodes = __mapped
  if !match(__safe_json, r'"(?:\x7B\\"|\x7B\x7D"|\x5B)|[:,\x5B]\x5B') && !match(__mapped_json, r'\.(?:[^"\\]|\\.)*":') {
      __leaves = flatten(values(flatten(__mapped)))
      __leaves_json = encode_json(__leaves)
      if match(__leaves_json, r'\x7B') {
          # An object inside an array: walk the leaves, objects whole.
          __nodes = __leaves
      } else {
          __nodes = []
          __members = map_values(__leaves) -> |value| {
              if is_float(value) {
                  encode_json(encode_json(value)) + "," + encode_json(to_string!(value))
              } else {
                  encode_json(encode_json(value))
              }
          }
          __represented = "," + join!(__members, ",") + "," + slice!(__leaves_json, 1, -1)
      }
  }
  __walk = map_values(__nodes, recursive: true) -> |value| {
      __json = encode_json(value)
      if is_string(value) {
          # A string's second member is the string itself, encoded: __json.
          __represented = __represented + ("," + encode_json(__json) + "," + __json)
      } else if is_float(value) {
          __represented = __represented + ("," + encode_json(__json) + "," + encode_json(to_string!(value)))
      } else {
          __represented = __represented + ("," + encode_json(__json))
      }
      value
  }
  __consumed = ""
  # BEGIN parser-specific transformations
  # severity: Parser case-normalizes this parsed field when represented in output.
  # action: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when the expected ID is emitted.
  for_each(flatten(__source_kv)) -> |key, value| {
      if match(key, r'(?x)
      \A(?:
        severity
      )\z') {
          __value = value
          if is_string(__value) {
              __expected = downcase(string!(__value))
              if contains(__represented, "," + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        action
      )\z') {
          __value = value
          if __value != null {
              __expected = get!({"allow": 1, "allowed": 1, "accept": 1, "accepted": 1, "permit": 1, "permitted": 1, "pass": 1, "passed": 1, "deny": 2, "denied": 2, "block": 2, "blocked": 2, "reject": 2, "rejected": 2, "drop": 2, "dropped": 2, "log": 3, "observed": 3}, [downcase(to_string(__value) ?? "")])
              if __expected != null {
                  if ."action_id" == __expected { __consumed = __consumed + ("," + encode_json(key)) }
              }
          }
      }
  }
  # Only source keys read by this parser are eligible for exact-value consumption; the selected branch must emit the value. Unknown keys always spill, even when their value equals an OCSF default.
  __candidates = r'(?x)
  \A(?:
    action
  | attack_type
  | bot_class
  | bot_name
  | bytes_in
  | bytes_out
  | client_ip
  | country
  | dest_ip
  | dest_port
  | dst_ip
  | dst_port
  | duration
  | geo_location
  | header\.body
  | header\.host
  | header\.ts
  | host
  | http_method
  | method
  | param_name
  | param_value
  | policy_name
  | referer
  | referrer
  | request_status
  | response_code
  | response_content_type
  | server_ip
  | session_id
  | severity
  | sig_set_names
  | signature_set
  | source_ip
  | src_ip
  | src_port
  | staged_sig
  | status_code
  | support_id
  | threat_campaign
  | threat_campaign_names
  | uri
  | url
  | user
  | user_agent
  | useragent
  | username
  | violation_details
  | violation_rating
  | violations
  | virtual_server
  | x_forwarded_for
  )\z'
  __preserve = []
  # END parser-specific transformations
  # Redact at every depth, including objects inside arrays, before serialization.
  # Redaction needs a sensitive word in a key or a name/key value, and encode_json
  # never escapes a letter, so text without one of the words needs no walk.
  if match(downcase(__safe_json), r'password|secret|authorization|token') {
      __safe = map_values(__safe, recursive: true) -> |value| {
          if is_object(value) {
              # Header/parameter arrays commonly encode sensitive keys as name/value
              # or Key/Value objects instead of using the secret name as an object key.
              __sensitive_pair = false
              for_each(object!(value)) -> |key, child| {
                  if includes(["name", "key"], downcase(key)) && match(downcase(string(child) ?? ""), r'password|secret|authorization|token') {
                      __sensitive_pair = true
                  }
              }
              for_each(object!(value)) -> |key, _child| {
                  if match(downcase(key), r'password|secret|authorization|token') || (__sensitive_pair && includes(["value", "values"], downcase(key))) {
                      value = set!(value, [key], "<redacted>")
                  }
              }
          }
          value
      }
  }
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__safe.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # Fast path: when no two source keys decode to the same key and no two spilled
  # keys get the same name, each key's decision depends only on its own value, so
  # one filter and one rename build the residual without copying it per key.
  __distinct = true
  if __tilde {
      __distinct = length(map_keys(__flat) -> |key| { replace(replace(key, "~1", "."), "~0", "~") }) == length(__flat)
  }
  __kept = {}
  __names = {}
  if __distinct {
      __kept = filter(__flat) -> |key, value| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          # A key is kept unless it is consumed: by a transformation above, or as a
          # candidate whose value is represented. Redacted leaves always remain
          # visible. Do not spill a copy of the raw body.
          if value == __raw_body {
              false
          } else if value == "<redacted>" {
              true
          } else if contains(__consumed, "," + encode_json(key)) {
              false
          } else if !match(key, __candidates) {
              true
          } else {
              # flatten stops at arrays, so objects inside an array still carry the
              # escaped keys: decode them too, or `a.b` spills as `a~1b` (NAN-3604).
              if __tilde && (is_array(value) || is_object(value)) {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __same = contains(__represented, "," + encode_json(encode_json(value)))
              if !__same && (is_string(value) || is_float(value)) {
                  __same = contains(__represented, "," + encode_json(to_string!(value)))
              }
              # A scalar array is consumed only if every element is represented. Preserve
              # partially represented arrays intact, including their ordering and repeats.
              if !__same && is_array(value) && !is_empty(array!(value)) {
                  __same = true
                  for_each(array!(value)) -> |_index, item| {
                      if __same {
                          if is_object(item) || is_array(item) {
                              __same = false
                          } else if !contains(__represented, "," + encode_json(encode_json(item))) {
                              __same = (is_string(item) || is_float(item)) && contains(__represented, "," + encode_json(to_string!(item)))
                          }
                      }
                  }
              }
              !__same
          }
      }
      __names = map_keys(__kept) -> |key| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          join!(__parts, ".")
      }
  }
  __residual = {}
  if __distinct && length(__names) == length(__kept) {
      __residual = map_values(__names) -> |value| {
          if is_array(value) || is_object(value) {
              if __tilde {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              if __complex { value = encode_json(value) }
          }
          value
      }
  } else {
      # Slow path, in source key order: a decoded key consumed earlier stays
      # consumed, and a name already taken gets the next free _2, _3, ... suffix.
      for_each(__flat) -> |key, value| {
          key = replace(replace(key, "~1", "."), "~0", "~")
