source: text
probe:
  mode: suffix
  require: '='
  text: ',ResidualProbe="nan2421-text-unknown",password="nan2421-secret"'
  source: ResidualProbe
transforms:
- source: action
  kind: enum
  target: action_id
  values:
    allow: 1
    allowed: 1
    accept: 1
    accepted: 1
    permit: 1
    permitted: 1
    pass: 1
    passed: 1
    deny: 2
    denied: 2
    block: 2
    blocked: 2
    reject: 2
    rejected: 2
    drop: 2
    dropped: 2
    log: 3
    observed: 3
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when
    the expected ID is emitted.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  bytes_in:
  - traffic.bytes_out
  bytes_out:
  - traffic.bytes_in
  country:
  - src_endpoint.location.country
  dest_ip:
  - dst_endpoint.ip
  - observables.value
  dest_port:
  - dst_endpoint.port
  duration:
  - duration
  header.host:
  - device.hostname
  method:
  - http_request.http_method
  policy_name:
  - firewall_rule.name
  - firewall_rule.uid
  response_code:
  - http_response.code
  src_ip:
  - observables.value
  - src_endpoint.ip
  support_id:
  - metadata.original_event_uid
  uri:
  - http_request.url.path
  - http_request.url.url_string
  - observables.value
  user_agent:
  - http_request.user_agent
  - observables.value
  username:
  - actor.user.name
  violation_rating:
  - risk_score
  x_forwarded_for:
  - http_request.x_forwarded_for
