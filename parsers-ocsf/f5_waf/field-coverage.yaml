source: text
transforms:
- source: severity
  kind: lowercase
  reason: Parser case-normalizes this parsed field when represented in output.
- source: action
  kind: enum
  target: action_id
  values:
    allow: 1
    allowed: 1
    accept: 1
    accepted: 1
    permit: 1
    permitted: 1
    pass: 1
    passed: 1
    deny: 2
    denied: 2
    block: 2
    blocked: 2
    reject: 2
    rejected: 2
    drop: 2
    dropped: 2
    log: 3
    observed: 3
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping;
    consume only when the expected ID is emitted.
probe:
  mode: suffix
  require: '='
  text: ',ResidualProbe="nan2421-text-unknown",password="nan2421-secret"'
  source: ResidualProbe
consumed_candidates:
- action
- attack_type
- bot_class
- bot_name
- bytes_in
- bytes_out
- client_ip
- country
- dest_ip
- dest_port
- dst_ip
- dst_port
- duration
- geo_location
- header.body
- header.host
- header.ts
- host
- http_method
- method
- param_name
- param_value
- policy_name
- referer
- referrer
- request_status
- response_code
- response_content_type
- server_ip
- session_id
- severity
- sig_set_names
- signature_set
- source_ip
- src_ip
- src_port
- staged_sig
- status_code
- support_id
- threat_campaign
- threat_campaign_names
- uri
- url
- user
- user_agent
- useragent
- username
- violation_details
- violation_rating
- violations
- virtual_server
- x_forwarded_for
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
