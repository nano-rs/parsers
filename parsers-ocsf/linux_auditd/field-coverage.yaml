source: text
probe:
  mode: suffix
  require: '='
  text: ' ResidualProbe="nan2421-text-unknown" password="nan2421-secret"'
  source: ResidualProbe
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  auid:
  - actor.user.uid
  - user.uid
  comm:
  - process.name
  cwd:
  - process.working_directory
  daddr:
  - dst_endpoint.ip
  dport:
  - dst_endpoint.port
  exe:
  - process.file.path
  exit:
  - exit_code
  header.audit_type:
  - metadata.event_code
  name:
  - file.path
  pid:
  - actor.process.pid
  - process.pid
  ppid:
  - actor.process.pid
  proto:
  - connection_info.protocol_num
  saddr:
  - src_endpoint.ip
  ses:
  - session.uid
  sport:
  - src_endpoint.port
  uid:
  - process.user.uid
