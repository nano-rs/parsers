name: linux_auditd_ocsf
display_name: Linux Audit Daemon (OCSF)
version: "1.3.0"
description: >
  Preserves unconsumed parsed fields in redacted, dotted snake_case unmapped keys.
  Parses Linux auditd text records into complete OCSF 1.9.0 records,
  routed by audit record type:
    SYSCALL / EXECVE / CWD / AVC  -> Process Activity 1007
    PATH                          -> File System Activity 1001
    USER_AUTH / USER_LOGIN / USER_LOGOUT / USER_START / USER_END /
    CRED_ACQ / CRED_DISP          -> Authentication 3002
    ADD_USER / DEL_USER / USER_MGMT / USER_ACCT / ROLE_ASSIGN / ROLE_REMOVE
                                  -> User Management 3007 (3001/3005 deprecated in 1.9)
    ADD_GROUP / DEL_GROUP / GRP_MGMT -> Group Management 3006
    NETFILTER_PKT                 -> Network Activity 4001 (Traffic)
  auditd splits one logical event across several records, so every emitted event
  carries metadata.correlation_uid = "<epoch>.<ms>:<serial>" and companion records
  with no pid of their own (EXECVE, CWD, PATH) use the process.pid 0 sentinel.
  Also accepts the optional node=<host> prefix. Carries metadata.profiles ["host"]
  (plus "security_control" on AVC, which is what disposition/action are bound to).
  The OCSF counterpart of parsers/linux_auditd - deploy one or the other.
ocsf_version: "1.9.0"
match_values:
  - linux_auditd
category: endpoint
vendor: "Linux"
product: "auditd"
parser_vrl: |
  # Linux auditd (text key=value records) -> OCSF 1.9.0.
  # Emits the COMPLETE OCSF record on the root, routed by audit record type:
  #   SYSCALL                       -> Process Activity 1007 (Launch on execve, else Other)
  #   EXECVE                        -> Process Activity 1007 (Launch)
  #   CWD                           -> Process Activity 1007 (Other; carries working_directory)
  #   AVC                           -> Process Activity 1007 (Other + SELinux disposition)
  #   PATH                          -> File System Activity 1001 (by nametype)
  #   USER_AUTH/USER_LOGIN/USER_LOGOUT/USER_START/USER_END/CRED_ACQ/CRED_DISP
  #                                 -> Authentication 3002
  #   ADD_USER/DEL_USER/USER_MGMT/USER_ACCT/ROLE_ASSIGN/ROLE_REMOVE
  #                                 -> User Management 3007   (3001/3005 are deprecated in 1.9)
  #   ADD_GROUP/DEL_GROUP/GRP_MGMT  -> Group Management 3006
  #   NETFILTER_PKT                 -> Network Activity 4001 (Traffic)
  #   anything else / unparsable    -> Process Activity 1007 (Other)
  #
  # auditd splits ONE logical event across several records (SYSCALL + EXECVE +
  # CWD + PATH...) that share the audit id. nano ingests them one line at a time,
  # so every emitted event carries metadata.correlation_uid = "<epoch>.<ms>:<serial>"
  # and the sibling records can be re-joined on it. Companion records that carry
  # no pid of their own (EXECVE, CWD, PATH) emit the process.pid 0 sentinel.
  raw_log = string!(.message)
  __raw_body = raw_log
  __source_kv = {}

  # Optional `node=<host>` prefix (auditd name_format=hostname), then the
  # `type=X msg=audit(EPOCH.MS:SERIAL): <body>` header.
  node_name = ""
  node_match, node_err = parse_regex(raw_log, r'^node=(?P<n>\S+)\s+')
  if node_err == null { node_name = downcase(string(node_match.n) ?? "") }

  header_match, h_err = parse_regex(raw_log, r'type=(?P<audit_type>\w+)\s+msg=audit\((?P<epoch>\d+)\.(?P<ms>\d+):(?P<serial>\d+)\):\s*(?P<body>.*)')
  # Capture parsed fields before mapping; omit structural raw-body captures.
  __capture = object(parse_json!(encode_json(header_match))) ?? {}
  __ignore = del(__capture.body)
  __ignore = del(__capture.content)
  __ignore = del(__capture.kvdata)
  __ignore = del(__capture.kvpart)
  __ignore = del(__capture.msg)
  __ignore = del(__capture.payload)
  __ignore = del(__capture.remainder)
  __ignore = del(__capture.rest)
  __ignore = del(__capture.sd)
  __source_kv = set!(__source_kv, ["header"], merge(object(get(__source_kv, ["header"]) ?? null) ?? {}, __capture))

  if h_err != null {
      . = {
          "class_uid": 1007,
          "class_name": "Process Activity",
          "category_uid": 1,
          "category_name": "System Activity",
          "activity_id": 99,
          "activity_name": "Other",
          "type_uid": 100799,
          "severity_id": 1,
          "severity": "Informational",
          "time": 0,
          "raw_data": raw_log,
          # 1007 requires actor/device/process even on the unparseable path.
          "process": { "pid": 0 },
          "actor": { "process": { "pid": 0 } },
          "device": { "hostname": node_name, "type_id": 0 },
          "metadata": {
              "version": "1.9.0",
              "profiles": ["host"],
              "uid": sha2("linux_auditd|raw|" + raw_log, variant: "SHA-256"),
              "log_level": "error",
              "log_source": "linux_auditd",
              "product": { "name": "auditd", "vendor_name": "Linux" }
          }
      }
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      . = set!(., ["unmapped", "parse_fallback"], "unparsable input")
  } else {
      audit_type = upcase(string(header_match.audit_type) ?? "")
      epoch_str = string(header_match.epoch) ?? "0"
      ms_str = string(header_match.ms) ?? "0"
      serial = string(header_match.serial) ?? ""
      body = string(header_match.body) ?? ""

      # ---- time: auditd stamps EPOCH.MILLIS ----
      time_ms = ((to_int(epoch_str) ?? 0) * 1000) + (to_int(ms_str) ?? 0)
      audit_id = epoch_str + "." + ms_str + ":" + serial

      # ---- key=value body ----
      kv = {}
      kv_parsed, kv_err = parse_key_value(body, key_value_delimiter: "=", field_delimiter: " ")
      __kv_capture = object(parse_json!(encode_json(kv_parsed))) ?? {}
      for_each(__kv_capture) -> |key, value| {
          if !is_boolean(value) { __source_kv = set!(__source_kv, [key], value) }
      }
      if kv_err == null { kv = kv_parsed }

      # ---- scalar helpers -------------------------------------------------
      comm = replace(to_string(kv.comm) ?? "", "\"", "")
      exe = replace(to_string(kv.exe) ?? "", "\"", "")
      if exe == "" {
          # exe="..." inside a PAM msg='...' blob is missed by parse_key_value
          exm, exerr = parse_regex(body, r'exe="(?P<v>[^"]*)"')
          if exerr == null { exe = string(exm.v) ?? "" }
      }
      exe_name = ""
      enm, enmerr = parse_regex(exe, r'(?P<b>[^/]+)$')
      if enmerr == null { exe_name = string(enm.b) ?? "" }

      proc_name = comm
      if proc_name == "" { proc_name = exe_name }

      pid = to_int(kv.pid) ?? 0
      ppid = to_int(kv.ppid) ?? 0
      uid_num = to_string(kv.uid) ?? ""
      auid_num = to_string(kv.auid) ?? ""
      euid_num = to_string(kv.euid) ?? ""
      gid_num = to_string(kv.gid) ?? ""
      ses = to_string(kv.ses) ?? ""
      tty = replace(to_string(kv.tty) ?? "", "\"", "")
      syscall_num = to_string(kv.syscall) ?? ""
      exit_str = to_string(kv.exit) ?? ""
      success = downcase(to_string(kv.success) ?? "")
      audit_key = replace(to_string(kv.key) ?? "", "\"", "")
      if audit_key == "(null)" { audit_key = "" }

      # acct="name" — the account a PAM/user-management record is about
      acct = ""
      acm, acerr = parse_regex(body, r'acct="?(?P<v>[^"\s]*)"?')
      if acerr == null { acct = string(acm.v) ?? "" }
      # res=success|failed
      res = ""
      rsm, rserr = parse_regex(body, r'\bres=(?P<v>\w+)')
      if rserr == null { res = downcase(string(rsm.v) ?? "") }
      # op=PAM:authentication / op=add-user ...
      op = ""
      opm, operr = parse_regex(body, r'\bop=(?P<v>\S+)')
      if operr == null { op = replace(string(opm.v) ?? "", "\"", "") }
      # hostname= / addr= / terminal= on PAM records ("?" means "not supplied")
      remote_host = ""
      hnm, hnerr = parse_regex(body, r'\bhostname=(?P<v>[^\s,]+)')
      if hnerr == null { remote_host = string(hnm.v) ?? "" }
      if remote_host == "?" { remote_host = "" }
      remote_addr = ""
      adm, aderr = parse_regex(body, r'\baddr=(?P<v>[^\s,]+)')
      if aderr == null { remote_addr = downcase(string(adm.v) ?? "") }
      if remote_addr == "?" { remote_addr = "" }
      terminal = ""
      tmm, tmerr = parse_regex(body, r'\bterminal=(?P<v>[^\s,]+)')
      if tmerr == null { terminal = string(tmm.v) ?? "" }
      if terminal == "?" { terminal = "" }

      # ---- shared objects -------------------------------------------------
      device = { "hostname": node_name, "type_id": 0 }

      proc_file = { "name": exe_name, "path": exe, "type_id": 1 }
      subject_process = { "name": proc_name, "pid": pid, "file": proc_file }
      if uid_num != "" { subject_process.user = { "uid": uid_num } }

      # auid is the LOGIN uid — the human behind the session — so it is the
      # actor's identity, while uid/euid are the effective ids of the process.
      actor_user = {}
      if auid_num != "" && auid_num != "4294967295" { actor_user.uid = auid_num }
      if acct != "" { actor_user.name = downcase(acct) }

      # ---- defaults; overridden per branch below ----
      class_uid = 1007
      class_name = "Process Activity"
      category_uid = 1
      category_name = "System Activity"
      activity_id = 99
      activity_name = "Other"
      severity_id = 1
      severity = "Informational"
      profiles = ["host"]

      ocsf = {}

      is_auth = audit_type == "USER_AUTH" || audit_type == "USER_LOGIN" || audit_type == "USER_LOGOUT" || audit_type == "USER_START" || audit_type == "USER_END" || audit_type == "CRED_ACQ" || audit_type == "CRED_DISP"
      is_user_mgmt = audit_type == "ADD_USER" || audit_type == "DEL_USER" || audit_type == "USER_MGMT" || audit_type == "USER_ACCT" || audit_type == "ROLE_ASSIGN" || audit_type == "ROLE_REMOVE"
      is_group_mgmt = audit_type == "ADD_GROUP" || audit_type == "DEL_GROUP" || audit_type == "GRP_MGMT"

      if audit_type == "SYSCALL" || audit_type == "EXECVE" || audit_type == "CWD" || audit_type == "AVC" {
          # ---- Process Activity 1007 ----------------------------------
          class_uid = 1007; class_name = "Process Activity"
          category_uid = 1; category_name = "System Activity"

          proc = subject_process

          if audit_type == "SYSCALL" {
              # execve(59) / execveat(322) on x86_64, execve(221) on aarch64 —
              # these are the syscalls that actually launch a process.
              if syscall_num == "59" || syscall_num == "322" || syscall_num == "221" {
                  activity_id = 1; activity_name = "Launch"
              } else {
                  activity_id = 99; activity_name = "Other"
              }
          } else if audit_type == "EXECVE" {
              activity_id = 1; activity_name = "Launch"
              # EXECVE carries no pid of its own — only the argv. Rebuild the
              # command line from a0..a9 and lean on correlation_uid to rejoin
              # it with the SYSCALL record that does carry the pid.
              args = []
              a0 = replace(to_string(kv.a0) ?? "", "\"", "")
              a1 = replace(to_string(kv.a1) ?? "", "\"", "")
              a2 = replace(to_string(kv.a2) ?? "", "\"", "")
              a3 = replace(to_string(kv.a3) ?? "", "\"", "")
              a4 = replace(to_string(kv.a4) ?? "", "\"", "")
              a5 = replace(to_string(kv.a5) ?? "", "\"", "")
              a6 = replace(to_string(kv.a6) ?? "", "\"", "")
              a7 = replace(to_string(kv.a7) ?? "", "\"", "")
              a8 = replace(to_string(kv.a8) ?? "", "\"", "")
              a9 = replace(to_string(kv.a9) ?? "", "\"", "")
              if a0 != "" { args = push(args, a0) }
              if a1 != "" { args = push(args, a1) }
              if a2 != "" { args = push(args, a2) }
              if a3 != "" { args = push(args, a3) }
              if a4 != "" { args = push(args, a4) }
              if a5 != "" { args = push(args, a5) }
              if a6 != "" { args = push(args, a6) }
              if a7 != "" { args = push(args, a7) }
              if a8 != "" { args = push(args, a8) }
              if a9 != "" { args = push(args, a9) }
              if length(args) > 0 {
                  proc.cmd_line = join!(args, " ")
                  argv0_name = ""
                  a0m, a0merr = parse_regex(a0, r'(?P<b>[^/]+)$')
                  if a0merr == null { argv0_name = string(a0m.b) ?? "" }
                  if proc.name == "" { proc.name = argv0_name }
              }
          } else if audit_type == "CWD" {
              activity_id = 99; activity_name = "Other"
              cwd_val = replace(to_string(kv.cwd) ?? "", "\"", "")
              if cwd_val != "" { proc.working_directory = cwd_val }
          } else {
              # AVC — an SELinux access-vector decision about a running process.
              activity_id = 99; activity_name = "Other"
              avc_decision = ""
              avc_perm = ""
              avm, avmerr = parse_regex(body, r'avc:\s+(?P<d>\w+)\s+\{\s*(?P<p>[^\x7D]+)\}')
              if avmerr == null {
                  avc_decision = downcase(string(avm.d) ?? "")
                  avc_perm = strip_whitespace(string(avm.p) ?? "")
              }
              # SELinux is a security control making an allow/deny call, so the
              # decision is a disposition (security_control profile), not a status.
              profiles = ["host", "security_control"]
              if avc_decision == "denied" {
                  ocsf.disposition_id = 2; ocsf.disposition = "Blocked"
                  ocsf.action_id = 2; ocsf.action = "Denied"
                  severity_id = 3; severity = "Medium"
              } else {
                  ocsf.disposition_id = 1; ocsf.disposition = "Allowed"
                  ocsf.action_id = 1; ocsf.action = "Allowed"
              }
              scontext = ""
              scm, scerr = parse_regex(body, r'scontext=(?P<v>\S+)')
              if scerr == null { scontext = string(scm.v) ?? "" }
              tcontext = ""
              tcm, tcerr = parse_regex(body, r'tcontext=(?P<v>\S+)')
              if tcerr == null { tcontext = string(tcm.v) ?? "" }
              tclass = ""
              tlm, tlerr = parse_regex(body, r'tclass=(?P<v>\w+)')
              if tlerr == null { tclass = string(tlm.v) ?? "" }
              ocsf.unmapped = {
                  "avc_decision": avc_decision,
                  "avc_permission": avc_perm,
                  "selinux_source_context": scontext,
                  "selinux_target_context": tcontext,
                  "selinux_target_class": tclass,
                  "selinux_permissive": to_string(kv.permissive) ?? null,
                  "target_name": replace(to_string(kv.name) ?? "", "\"", "")
              }
          }

          if audit_type != "AVC" {
              ocsf.unmapped = {
                  "audit_record_type": audit_type,
                  "syscall": syscall_num,
                  "uid": uid_num,
                  "euid": euid_num,
                  "gid": gid_num,
                  "tty": tty,
                  "session_id": ses,
                  "audit_key": audit_key
              }
          }

          ocsf.process = proc
          # The launching process is the ACTOR; auditd gives only its pid (ppid).
          actor = { "process": { "pid": ppid } }
          if actor_user != {} { actor.user = actor_user }
          ocsf.actor = actor
          ocsf.device = device
          if exit_str != "" {
              exit_int = to_int(exit_str) ?? 0
              ocsf.exit_code = exit_int
          }
          if success != "" {
              if success == "yes" {
                  ocsf.status_id = 1; ocsf.status = "Success"
              } else {
                  ocsf.status_id = 2; ocsf.status = "Failure"
                  severity_id = 2; severity = "Low"
              }
          }
      } else if audit_type == "PATH" {
          # ---- File System Activity 1001 ------------------------------
          class_uid = 1001; class_name = "File System Activity"
          category_uid = 1; category_name = "System Activity"
          nametype = upcase(replace(to_string(kv.nametype) ?? "", "\"", ""))
          if nametype == "CREATE" {
              activity_id = 1; activity_name = "Create"
          } else if nametype == "DELETE" {
              activity_id = 4; activity_name = "Delete"
          } else if nametype == "NORMAL" || nametype == "PARENT" {
              activity_id = 14; activity_name = "Open"
          } else {
              activity_id = 99; activity_name = "Other"
          }
          fpath = replace(to_string(kv.name) ?? "", "\"", "")
          fname = ""
          fnm, fnmerr = parse_regex(fpath, r'(?P<b>[^/]+)$')
          if fnmerr == null { fname = string(fnm.b) ?? "" }
          ocsf.file = { "name": fname, "path": fpath, "type_id": 1 }
          # PATH is a companion record: no pid, no comm of its own.
          actor = { "process": { "pid": pid } }
          if actor_user != {} { actor.user = actor_user }
          ocsf.actor = actor
          ocsf.device = device
          ocsf.unmapped = {
              "inode": to_string(kv.inode) ?? null,
              "file_mode": to_string(kv.mode) ?? null,
              "nametype": nametype,
              "owner_uid": to_string(kv.ouid) ?? null,
              "owner_gid": to_string(kv.ogid) ?? null
          }
      } else if is_auth {
          # ---- Authentication 3002 ------------------------------------
          class_uid = 3002; class_name = "Authentication"
          category_uid = 3; category_name = "Identity & Access Management"
          if audit_type == "USER_LOGIN" || audit_type == "USER_AUTH" || audit_type == "USER_START" {
              activity_id = 1; activity_name = "Logon"
          } else if audit_type == "USER_LOGOUT" || audit_type == "USER_END" {
              activity_id = 2; activity_name = "Logoff"
          } else {
              # CRED_ACQ / CRED_DISP — PAM credential setup and teardown have no
              # dedicated OCSF authentication activity.
              activity_id = 99; activity_name = "Other"
          }
          user_obj = { "name": downcase(acct) }
          if auid_num != "" && auid_num != "4294967295" { user_obj.uid = auid_num }
          ocsf.user = user_obj
          # 3002 requires user + one of [service, dst_endpoint]. The PAM stack
          # doing the authenticating is the service; auditd never names the local
          # host, so dst_endpoint is not available.
          svc_name = exe_name
          if svc_name == "" { svc_name = "pam" }
          ocsf.service = { "name": svc_name }
          if remote_addr != "" || remote_host != "" {
              src = {}
              if remote_addr != "" { src.ip = remote_addr }
              if remote_host != "" { src.hostname = downcase(remote_host) }
              ocsf.src_endpoint = src
          }
          if ses != "" && ses != "4294967295" { ocsf.session = { "uid": ses } }
          if res == "success" {
              ocsf.status_id = 1; ocsf.status = "Success"
          } else if res != "" {
              ocsf.status_id = 2; ocsf.status = "Failure"
              severity_id = 2; severity = "Low"
          }
          if terminal != "" {
              # Terminal-attached PAM sessions are local; a remote address means
              # the login came over the network.
              ocsf.is_remote = remote_addr != ""
          }
          ocsf.device = device
          ocsf.unmapped = {
              "audit_record_type": audit_type,
              "pam_operation": op,
              "terminal": terminal,
              "exe": exe,
              "pid": to_string(pid)
          }
      } else if is_user_mgmt {
          # ---- User Management 3007 (3001/3005 deprecated in 1.9) -----
          class_uid = 3007; class_name = "User Management"
          category_uid = 3; category_name = "Identity & Access Management"
          if audit_type == "ADD_USER" {
              activity_id = 1; activity_name = "Create"
          } else if audit_type == "DEL_USER" {
              activity_id = 3; activity_name = "Delete"
          } else if audit_type == "USER_MGMT" {
              activity_id = 2; activity_name = "Update"
          } else if audit_type == "ROLE_ASSIGN" {
              activity_id = 16; activity_name = "Assign Roles"
          } else if audit_type == "ROLE_REMOVE" {
              activity_id = 17; activity_name = "Remove Roles"
          } else {
              # USER_ACCT — PAM account-validity check
              activity_id = 99; activity_name = "Other"
          }
          user_obj = { "name": downcase(acct) }
          acct_id = to_string(kv.id) ?? ""
          if acct_id != "" { user_obj.uid = acct_id }
          ocsf.user = user_obj
          actor = {}
          if actor_user != {} { actor.user = actor_user }
          if pid != 0 { actor.process = { "pid": pid, "name": proc_name, "file": proc_file } }
          if actor != {} { ocsf.actor = actor }
          ocsf.device = device
          if res == "success" {
              ocsf.status_id = 1; ocsf.status = "Success"
          } else if res != "" {
              ocsf.status_id = 2; ocsf.status = "Failure"
              severity_id = 2; severity = "Low"
          }
          ocsf.unmapped = { "audit_record_type": audit_type, "operation": op, "exe": exe }
      } else if is_group_mgmt {
          # ---- Group Management 3006 ----------------------------------
          class_uid = 3006; class_name = "Group Management"
          category_uid = 3; category_name = "Identity & Access Management"
          if audit_type == "ADD_GROUP" {
              activity_id = 6; activity_name = "Create"
          } else if audit_type == "DEL_GROUP" {
              activity_id = 5; activity_name = "Delete"
          } else {
              activity_id = 9; activity_name = "Update"
          }
          grp = ""
          gm, gmerr = parse_regex(body, r'\bgrp="?(?P<v>[^"\s]+)"?')
          if gmerr == null { grp = string(gm.v) ?? "" }
          if grp == "" { grp = acct }
          group_obj = { "name": downcase(grp) }
          grp_id = to_string(kv.id) ?? ""
          if grp_id != "" { group_obj.uid = grp_id }
          ocsf.group = group_obj
          if acct != "" && acct != grp { ocsf.user = { "name": downcase(acct) } }
          actor = {}
          if actor_user != {} { actor.user = actor_user }
          if pid != 0 { actor.process = { "pid": pid, "name": proc_name, "file": proc_file } }
          if actor != {} { ocsf.actor = actor }
          ocsf.device = device
          if res == "success" {
              ocsf.status_id = 1; ocsf.status = "Success"
          } else if res != "" {
              ocsf.status_id = 2; ocsf.status = "Failure"
              severity_id = 2; severity = "Low"
          }
          ocsf.unmapped = { "audit_record_type": audit_type, "operation": op, "exe": exe }
      } else if audit_type == "NETFILTER_PKT" {
          # ---- Network Activity 4001 ----------------------------------
          class_uid = 4001; class_name = "Network Activity"
          category_uid = 4; category_name = "Network Activity"
          activity_id = 6; activity_name = "Traffic"
          saddr = downcase(replace(to_string(kv.saddr) ?? "", "\"", ""))
          daddr = downcase(replace(to_string(kv.daddr) ?? "", "\"", ""))
          src = {}
          if saddr != "" { src.ip = saddr }
          sport = to_int(kv.sport) ?? 0
          if sport != 0 { src.port = sport }
          dst = {}
          if daddr != "" { dst.ip = daddr }
          dport = to_int(kv.dport) ?? 0
          if dport != 0 { dst.port = dport }
          ocsf.src_endpoint = src
          ocsf.dst_endpoint = dst
          # connection_info.direction_id is required whenever connection_info is
          # present; a NETFILTER_PKT record does not state the direction.
          conn = { "direction_id": 0 }
          proto_num = to_int(kv.proto) ?? 0
          if proto_num != 0 { conn.protocol_num = proto_num }
          ocsf.connection_info = conn
          ocsf.device = device
          ocsf.unmapped = { "audit_record_type": audit_type, "mark": to_string(kv.mark) ?? null }
      } else {
          # ---- unknown record type -> Process Activity / Other --------
          class_uid = 1007; class_name = "Process Activity"
          category_uid = 1; category_name = "System Activity"
          activity_id = 99; activity_name = "Other"
          ocsf.process = subject_process
          actor = { "process": { "pid": ppid } }
          if actor_user != {} { actor.user = actor_user }
          ocsf.actor = actor
          ocsf.device = device
          ocsf.unmapped = { "audit_record_type": audit_type }
      }

      # ---- common envelope ---------------------------------------------
      ocsf.class_uid = class_uid
      ocsf.class_name = class_name
      ocsf.category_uid = category_uid
      ocsf.category_name = category_name
      ocsf.activity_id = activity_id
      ocsf.activity_name = activity_name
      ocsf.type_uid = class_uid * 100 + activity_id
      ocsf.severity_id = severity_id
      ocsf.severity = severity
      ocsf.time = time_ms
      ocsf.raw_data = raw_log
      # NAN-3702: metadata.uid is the lake's dedup key, so it must be unique per
      # RECORD, not per logical event. One auditd event is several lines (SYSCALL,
      # EXECVE, CWD, PATH...) sharing audit_id; keying on it kept only the first
      # line and dropped the rest. Hash the raw line instead (a redelivery repeats
      # it byte for byte); audit_id stays the correlation/original id.
      ocsf.metadata = {
          "version": "1.9.0",
          "profiles": profiles,
          "uid": sha2("linux_auditd|raw|" + raw_log, variant: "SHA-256"),
          "original_event_uid": audit_id,
          # Every record of one logical auditd event shares this id.
          "correlation_uid": audit_id,
          "event_code": audit_type,
          "log_source": "linux_auditd",
          "log_provider": "auditd",
          "product": { "name": "auditd", "vendor_name": "Linux" }
      }
      if audit_key != "" {
          ocsf.metadata.event_code = audit_type + ":" + audit_key
      }

      # NAN-3342: publish the canonical lowercase name beside known IANA ids.
      # Unknown numbers retain their id without inventing a name.
      protocol_names = { "1": "icmp", "2": "igmp", "6": "tcp", "17": "udp", "41": "ipv6", "47": "gre", "50": "esp", "51": "ah", "58": "icmpv6", "89": "ospf", "132": "sctp" }
      protocol_name = get(protocol_names, [to_string(ocsf.connection_info.protocol_num)]) ?? null
      if is_string(protocol_name) { ocsf.connection_info.protocol_name = protocol_name }
      . = ocsf
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # Exact value representation is evaluated AFTER branch selection. Numeric strings
  # count as represented by their typed scalar; other transformations are explicit.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The value sets below are strings
  # instead (a read shares the buffer): "," + encode_json(member) per member, and
  # contains(set, "," + encode_json(x)) is exact membership. Every member is a
  # JSON text, inside which a '"' is always escaped, so ',"' only ever starts a
  # member, and a JSON string ends at its first unescaped '"'. The fixed candidate
  # set is a regex literal, compiled once with the program.
  # __mapped holds only JSON types, so to_string equals encode_json for an integer
  # or a boolean and only strings and floats add a second member.
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped_json = encode_json(__mapped)
  __mapped = object!(parse_json!(__mapped_json))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __safe = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __safe_json = encode_json(__safe)
  # Object and array members are encodings: an empty object, an object that
  # opens with a quoted key, or an array. A lookup can ask for one only when some
  # source or existing value is an array, or a string spelling one of those
  # openings, and the regex below finds either in the JSON text (brackets are
  # written as hex escapes because nano's deploy check counts them raw).
  # Otherwise the scalar nodes suffice; a Sysmon GUID, a brace-wrapped string
  # with no quoted key, is no object member. The leaves of flatten(), with arrays
  # flattened too, are every scalar node unless a key holds a literal '.' (in
  # compact JSON only a key is followed by ':').
  # Their encodings, unwrapped from the array, already are the string members.
  __represented = ""
  __nodes = __mapped
  if !match(__safe_json, r'"(?:\x7B\\"|\x7B\x7D"|\x5B)|[:,\x5B]\x5B') && !match(__mapped_json, r'\.(?:[^"\\]|\\.)*":') {
      __leaves = flatten(values(flatten(__mapped)))
      __leaves_json = encode_json(__leaves)
      if match(__leaves_json, r'\x7B') {
          # An object inside an array: walk the leaves, objects whole.
          __nodes = __leaves
      } else {
          __nodes = []
          __members = map_values(__leaves) -> |value| {
              if is_float(value) {
                  encode_json(encode_json(value)) + "," + encode_json(to_string!(value))
              } else {
                  encode_json(encode_json(value))
              }
          }
          __represented = "," + join!(__members, ",") + "," + slice!(__leaves_json, 1, -1)
      }
  }
  __walk = map_values(__nodes, recursive: true) -> |value| {
      __json = encode_json(value)
      if is_string(value) {
          # A string's second member is the string itself, encoded: __json.
          __represented = __represented + ("," + encode_json(__json) + "," + __json)
      } else if is_float(value) {
          __represented = __represented + ("," + encode_json(__json) + "," + encode_json(to_string!(value)))
      } else {
          __represented = __represented + ("," + encode_json(__json))
      }
      value
  }
  __consumed = ""
  # BEGIN parser-specific transformations
  # success: Parser case-normalizes this parsed field when represented in output.
  # nametype: Parser normalizes the caption case; verify the emitted caption.
  for_each(flatten(__source_kv)) -> |key, value| {
      if match(key, r'(?x)
      \A(?:
        success
      )\z') {
          __value = value
          if is_string(__value) {
              __expected = downcase(string!(__value))
              if contains(__represented, "," + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        nametype
      )\z') {
          __value = value
          if __value != null {
              __expected = get!({"create": "Create"}, [downcase(to_string(__value) ?? "")])
              if __expected != null {
                  if ."activity_name" == __expected { __consumed = __consumed + ("," + encode_json(key)) }
              }
          }
      }
  }
  # Only source keys read by this parser are eligible for exact-value consumption; the selected branch must emit the value. Unknown keys always spill, even when their value equals an OCSF default.
  __candidates = r'(?x)
  \A(?:
    a0
  | a1
  | a2
  | a3
  | a4
  | a5
  | a6
  | a7
  | a8
  | a9
  | auid
  | comm
  | cwd
  | daddr
  | dport
  | euid
  | exe
  | exit
  | gid
  | header\.audit_type
  | header\.body
  | header\.epoch
  | header\.ms
  | header\.serial
  | id
  | inode
  | key
  | mark
  | mode
  | name
  | nametype
  | ogid
  | ouid
  | permissive
  | pid
  | ppid
  | proto
  | saddr
  | ses
  | sport
  | success
  | syscall
  | tty
  | uid
  )\z'
  __preserve = []
  # END parser-specific transformations
  # Redact at every depth, including objects inside arrays, before serialization.
  # Redaction needs a sensitive word in a key or a name/key value, and encode_json
  # never escapes a letter, so text without one of the words needs no walk.
  if match(downcase(__safe_json), r'password|secret|authorization|token') {
      __safe = map_values(__safe, recursive: true) -> |value| {
          if is_object(value) {
              # Header/parameter arrays commonly encode sensitive keys as name/value
              # or Key/Value objects instead of using the secret name as an object key.
              __sensitive_pair = false
              for_each(object!(value)) -> |key, child| {
                  if includes(["name", "key"], downcase(key)) && match(downcase(string(child) ?? ""), r'password|secret|authorization|token') {
                      __sensitive_pair = true
                  }
              }
              for_each(object!(value)) -> |key, _child| {
                  if match(downcase(key), r'password|secret|authorization|token') || (__sensitive_pair && includes(["value", "values"], downcase(key))) {
                      value = set!(value, [key], "<redacted>")
                  }
              }
          }
          value
      }
  }
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__safe.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # Fast path: when no two source keys decode to the same key and no two spilled
  # keys get the same name, each key's decision depends only on its own value, so
  # one filter and one rename build the residual without copying it per key.
  __distinct = true
  if __tilde {
      __distinct = length(map_keys(__flat) -> |key| { replace(replace(key, "~1", "."), "~0", "~") }) == length(__flat)
  }
  __kept = {}
  __names = {}
  if __distinct {
      __kept = filter(__flat) -> |key, value| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          # A key is kept unless it is consumed: by a transformation above, or as a
          # candidate whose value is represented. Redacted leaves always remain
          # visible. Do not spill a copy of the raw body.
          if value == __raw_body {
              false
          } else if value == "<redacted>" {
              true
          } else if contains(__consumed, "," + encode_json(key)) {
              false
          } else if !match(key, __candidates) {
              true
          } else {
              # flatten stops at arrays, so objects inside an array still carry the
              # escaped keys: decode them too, or `a.b` spills as `a~1b` (NAN-3604).
              if __tilde && (is_array(value) || is_object(value)) {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __same = contains(__represented, "," + encode_json(encode_json(value)))
              if !__same && (is_string(value) || is_float(value)) {
                  __same = contains(__represented, "," + encode_json(to_string!(value)))
              }
              # A scalar array is consumed only if every element is represented. Preserve
              # partially represented arrays intact, including their ordering and repeats.
              if !__same && is_array(value) && !is_empty(array!(value)) {
                  __same = true
                  for_each(array!(value)) -> |_index, item| {
                      if __same {
                          if is_object(item) || is_array(item) {
                              __same = false
                          } else if !contains(__represented, "," + encode_json(encode_json(item))) {
                              __same = (is_string(item) || is_float(item)) && contains(__represented, "," + encode_json(to_string!(item)))
                          }
                      }
                  }
              }
              !__same
          }
      }
      __names = map_keys(__kept) -> |key| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          join!(__parts, ".")
      }
  }
  __residual = {}
  if __distinct && length(__names) == length(__kept) {
      __residual = map_values(__names) -> |value| {
          if is_array(value) || is_object(value) {
              if __tilde {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              if __complex { value = encode_json(value) }
          }
          value
      }
  } else {
      # Slow path, in source key order: a decoded key consumed earlier stays
      # consumed, and a name already taken gets the next free _2, _3, ... suffix.
      for_each(__flat) -> |key, value| {
          key = replace(replace(key, "~1", "."), "~0", "~")
          if is_array(value) || is_object(value) {
              value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                  replace(replace(inner, "~1", "."), "~0", "~")
              }, ["v"])
          }
          __same = contains(__represented, "," + encode_json(encode_json(value)))
          if !__same && (is_string(value) || is_float(value)) {
              __same = contains(__represented, "," + encode_json(to_string!(value)))
          }
          if !__same && is_array(value) && !is_empty(array!(value)) {
              __same = true
              for_each(array!(value)) -> |_index, item| {
                  if __same {
                      if is_object(item) || is_array(item) {
                          __same = false
                      } else if !contains(__represented, "," + encode_json(encode_json(item))) {
                          __same = (is_string(item) || is_float(item)) && contains(__represented, "," + encode_json(to_string!(item)))
                      }
                  }
              }
          }
          __token = "," + encode_json(key)
          if __same && match(key, __candidates) { __consumed = __consumed + ("," + encode_json(key)) }
          if (!contains(__consumed, __token) || value == "<redacted>") && value != __raw_body {
              __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
              __base = join!(__parts, ".")
              __key = __base
              __suffix = 2
              if includes(keys(__residual), __key) {
                  for_each(__flat) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __key) {
                          __key = __base + "_" + to_string(__suffix)
                          __suffix = __suffix + 1
                      }
                  }
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              __spill = if __complex { encode_json(value) } else { value }
              __residual = set!(__residual, [__key], __spill)
          }
      }
  }
  # Keep existing derived evidence, but remove null placeholders and mapped copies.
  # Source-derived aliases are replaced by canonical dotted source paths above.
  # Existing aggregates may contain sensitive descendants; the canonical source
  # spill above is the authoritative representation of containers. The cheap
  # conditions run first; the source value set is built on first use.
  __original_values = null
  for_each(flatten(__existing)) -> |key, value| {
      if !is_null(value) && value != "" && !is_array(value) && !is_object(value) && value != __raw_body && !match(downcase(key), r'password|secret|authorization|token') {
          # Members for the value itself and for to_string(value), as above.
          __json = encode_json(value)
          __as_json = "," + encode_json(__json)
          __as_string = __as_json
          if is_string(value) { __as_string = "," + __json } else if is_float(value) { __as_string = "," + encode_json(to_string!(value)) }
          if __original_values == null {
              # __source_kv may hold non-JSON types (a timestamp), so only an
              # integer or a boolean skips its to_string member here.
              __original_values = join!(map_values(values(flatten(__source_kv))) -> |source_value| {
                  __source_json = encode_json(source_value)
                  __tokens = "," + encode_json(__source_json)
                  if is_string(source_value) {
                      __tokens = __tokens + "," + __source_json
                  } else if !is_object(source_value) && !is_array(source_value) && !is_integer(source_value) && !is_boolean(source_value) {
                      __tokens = __tokens + "," + encode_json(to_string(source_value) ?? "")
                  }
                  __tokens
              }, "")
          }
          __source_set = string!(__original_values)
          __keep = !contains(__source_set, __as_json) && !contains(__source_set, __as_string)
          __keep = __keep && !contains(__represented, __as_json) && !contains(__represented, __as_string)
          # Only text opening an object or an array (after JSON whitespace)
          # decodes to a container.
          if __keep && is_string(value) && match(string!(value), r'^[ \t\n\r]*[\x5B\x7B]') {
              __decoded, __decode_err = parse_json(string!(value))
              __keep = !(__decode_err == null && (is_object(__decoded) || is_array(__decoded)))
          }
          if __keep {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, with recursive
  # redaction. These entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__safe.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

