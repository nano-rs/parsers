# What this parser gets when its log arrives as an HEC (or OTel-style) object
# event; scripts/test_hec_envelopes.py builds the delivery the way nano does and
# checks each case.
cases:
- name: an ECS JSON log record as an HEC object (the event line in message)
  event:
    '@timestamp': '2025-05-01T01:20:11.418Z'
    log.level: DEBUG
    log.logger: org.keycloak.events
    message: type="LOGIN", realmId="r1", clientId="account", userId="u1", ipAddress="192.0.2.10", auth_method="openid-connect", username="alice"
  expect:
    class_uid: 3002
    time: 1746062411418
    metadata.log_level: DEBUG
- name: a Quarkus JSON log record as an HEC object
  event:
    timestamp: '2026-10-12T09:41:03.512+02:00'
    level: WARN
    loggerName: org.keycloak.events
    message: type="LOGIN", realmId="r1", clientId="account", userId="u1", ipAddress="192.0.2.10", auth_method="openid-connect", username="alice"
  expect:
    class_uid: 3002
    time: 1791790863512
    metadata.log_level: WARN
- name: a jboss-logging text line wrapped by an HEC sender
  event:
    message: 2026-10-12 09:41:03,512 WARN [org.keycloak.events] (executor-thread-4) type="LOGIN", realmId="r1", clientId="account", userId="u1", ipAddress="192.0.2.10", auth_method="openid-connect", username="alice"
    env: prod
  expect:
    class_uid: 3002
    metadata.log_level: WARN
  keep:
  - env
