              activity_id = 99
              activity_name = "Other"
              grp = {}
              if res_type == "GROUP" {
                  if op_create { activity_id = 6; activity_name = "Create" }
                  if op_update { activity_id = 9; activity_name = "Update" }
                  if op_delete { activity_id = 5; activity_name = "Delete" }
                  if path_id != "" { grp.uid = path_id }
                  gname = string(rep.name) ?? ""
                  if gname != "" { grp.name = gname }
              } else if res_type == "GROUP_MEMBERSHIP" {
                  # users/{user id}/groups/{group id}
                  if op_create { activity_id = 3; activity_name = "Add User" }
                  if op_delete { activity_id = 4; activity_name = "Remove User" }
                  gid = string(path_parts[3]) ?? ""
                  if gid != "" { grp.uid = gid }
                  gname = string(rep.name) ?? ""
                  if gname != "" { grp.name = gname }
                  if path_id != "" { ocsf.user = { "uid": path_id } }
              } else {
                  if op_create { activity_id = 12; activity_name = "Assign Roles" }
                  if op_delete { activity_id = 13; activity_name = "Remove Roles" }
                  if path_id != "" { grp.uid = path_id }
              }
              if length(grp) == 0 { grp = { "name": "unknown" } }
              ocsf.group = grp
              ocsf.class_name = "Group Management"
          } else {
              class_uid = 6003
              activity_id = 99
              activity_name = "Other"
