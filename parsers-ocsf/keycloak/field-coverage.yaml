source: mixed
source_normalize:
- kind: parse_kv_merge
  path: message
  match: ^(type|operationType)=
  key_value_delimiter: '='
  field_delimiter: ', '
  tail_keys:
  - representation
  - requestUri
  - cookies
  - stackTrace
  reason: A Keycloak JSON log record carries the event line in `message`; the parser replaces
    that key with the pairs parsed from it. The values a line ends with (representation, and
    at TRACE requestUri, cookies, stackTrace) are cut off whole first, never split on ', '.
    Skipped on a parse error, an empty result or a key the record already has.
- kind: allowlist
  keep:
  - id
  - time
  - type
  - operationType
  - realmId
  - realmName
  - clientId
  - userId
  - ipAddress
  - sessionId
  - error
  - resourceType
  - resourcePath
  - representation
  - requestUri
  - authSessionParentId
  - authSessionTabId
  - auth_method
  - auth_type
  - client_auth_method
  - code_id
  - consent
  - grant_type
  - redirect_uri
  - response_mode
  - response_type
  - scope
  - refresh_token_type
  - username
  - email
  - impersonator
  - impersonator_id
  - impersonator_realm
  - reason
  - remember_me
  - identity_provider
  - identity_provider_identity
  - register_method
  - previous_email
  - updated_email
  - custom_required_action
  - timestamp
  - '@timestamp'
  - level
  - log.level
  - log.logger
  - loggerClassName
  - loggerName
  - threadName
  - threadId
  - hostName
  - processName
  - processId
  - sequence
  - ndc
  - host.hostname
  - process.name
  - process.pid
  - process.thread.id
  - process.thread.name
  - service.name
  - service.version
  - service.environment
  - ecs.version
  - event.sequence
  - data_stream.type
  - log_time
  - log_level
  - logger
  - thread
  nested:
    details:
    - auth_method
    - auth_type
    - client_auth_method
    - code_id
    - consent
    - grant_type
    - redirect_uri
    - response_mode
    - response_type
    - scope
    - refresh_token_type
    - username
    - email
    - impersonator
    - impersonator_id
    - impersonator_realm
    - reason
    - remember_me
    - identity_provider
    - identity_provider_identity
    - register_method
    - previous_email
    - updated_email
    - custom_required_action
    authDetails:
    - realmId
    - clientId
    - userId
    - ipAddress
  urls:
  - requestUri
  - redirect_uri
  reason: 'Fail closed: only documented Keycloak event fields and JSON log envelope metadata
    stay; URLs keep scheme, host and path. Cookies, stack traces, request query strings, unparsed
    or non-string messages, Quarkus exceptions, mdc, a pre-existing representation_json and
    unknown details are withheld together.'
- kind: parse_json_object
  paths:
  - representation
  target: representation_json
  keep:
  - id
  - username
  - email
  - firstName
  - lastName
  - enabled
  - clientId
  - name
  - realm
  - type
  reason: An admin event representation can hold secrets with no secret-looking key (CredentialRepresentation
    value, private keys), so it is cut to non-secret scalar fields; every other field is withheld
    together.
- kind: withhold
  paths:
  - representation
  match: ^[\s\S]
  reason: A representation that is not a JSON object (an array, not JSON) cannot be filtered,
    so only its byte length and sha256 stay (raw_data keeps it).
transforms:
- source: '@timestamp'
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion of the JSON log envelope clock in milliseconds.
- source: timestamp
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion of the native Quarkus JSON log clock in milliseconds.
- source: type
  kind: enum
  target: activity_name
  values:
    login: Logon
    login_error: Logon
    logout: Logoff
  reason: Keycloak event type mapped to the OCSF activity caption; consume only when
    the emitted caption matches.
probe:
  mode: suffix
  require: '[org.keycloak.events] (default task-'
  text: ', ResidualProbe="nan2421-text-unknown", password="nan2421-secret"'
  source: ResidualProbe
  # The allowlist (source_normalize) withholds an unknown field.
  expect_withheld: true
consumed_candidates:
- representation_json.email
- representation_json.name
- representation_json.username
- representation_json.id
- representation_json.clientId
- authDetails.clientId
- authDetails.ipAddress
- authDetails.realmId
- authDetails.userId
- clientId
- details.auth_method
- details.authSessionParentId
- details.code_id
- details.impersonator
- details.impersonator_id
- details.username
- error
- id
- ipAddress
- log_level
- log.level
- level
- message
- operationType
- realmId
- resourcePath
- sessionId
- time
- type
- userId
- authSessionParentId
- code_id
- username
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
