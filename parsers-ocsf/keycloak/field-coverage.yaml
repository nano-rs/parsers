source: mixed
source_normalize:
- kind: parse_kv_merge
  path: message
  match: ^(type|operationType)=
  key_value_delimiter: '='
  field_delimiter: ', '
  tail_keys:
  - representation
  - requestUri
  - cookies
  - stackTrace
  reason: A Keycloak JSON log record carries the event line in `message`; the parser replaces that key
    with the pairs parsed from it. The values a line ends with (representation, and at TRACE requestUri,
    cookies, stackTrace) are cut off whole first, never split on ', '. Skipped on a parse error, an empty
    result or a key the record already has.
- kind: parse_json_object
  paths:
  - representation
  target: representation_json
  arrays: true
  reason: An admin event representation is JSON text; parsed (object or array) it moves whole to representation_json
    so each field maps or spills as-is. Text that is not JSON stays as written; never overwrites an existing
    representation_json.
probe:
  mode: suffix
  require: '[org.keycloak.events] (default task-'
  text: ', ResidualProbe="nan2421-text-unknown", password="nan2421-secret"'
  source: ResidualProbe
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
transforms:
- source: '@timestamp'
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion of the JSON log envelope clock in milliseconds.
- source: timestamp
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion of the native Quarkus JSON log clock in milliseconds.
- source: type
  kind: enum
  target: activity_name
  values:
    login: Logon
    login_error: Logon
    logout: Logoff
  reason: Keycloak event type mapped to the OCSF activity caption; consume only when the emitted caption
    matches.
mappings:
  authSessionParentId:
  - metadata.correlation_uid
  clientId:
  - actor.app_uid
  - service.name
  code_id:
  - metadata.correlation_uid
  error:
  - status_detail
  ipAddress:
  - src_endpoint.ip
  log_level:
  - metadata.log_level
  realmId:
  - metadata.tenant_uid
  type:
  - message
  - metadata.event_code
  userId:
  - actor.user.uid
  - user.uid
  username:
  - user.email_addr
  - user.name
  authDetails.clientId:
  - actor.app_uid
  authDetails.ipAddress:
  - src_endpoint.ip
  authDetails.userId:
  - actor.user.uid
  id:
  - metadata.uid
  operationType:
  - api.operation
  resourcePath:
  - resources.uid
  resourceType:
  - resources.type
  time:
  - time
  level:
  - metadata.log_level
  log.level:
  - metadata.log_level
  sessionId:
  - session.uid
  representation_json.email:
  - user.email_addr
  - user.name
  details.code_id:
  - metadata.correlation_uid
  details.username:
  - actor.user.email_addr
  - actor.user.name
  - user.email_addr
  - user.name
  representation_json.username:
  - user.name
  details.authSessionParentId:
  - metadata.correlation_uid
  representation_json.name:
  - group.name
  representation.email:
  - user.email_addr
  representation.username:
  - user.name
  details.impersonator:
