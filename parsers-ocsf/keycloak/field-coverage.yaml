source: mixed
source_normalize:
- kind: parse_kv_merge
  path: message
  match: ^(type|operationType)=
  key_value_delimiter: '='
  field_delimiter: ', '
  reason: A Keycloak JSON log record carries the event line in `message`; the parser
    replaces that key with the pairs parsed from it, so its details spill as redacted
    keys. Skipped on a parse error, an empty result or a key the record already has.
- kind: withhold
  paths:
  - message
  match: ^(type|operationType)=
  reason: An event line that could not be unpacked (parse error, empty, or a key the
    record already has) may carry credentials key redaction cannot reach, so only its
    byte length and sha256 stay (raw_data keeps it).
transforms:
- source: '@timestamp'
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion of the JSON log envelope clock in milliseconds.
- source: timestamp
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion of the native Quarkus JSON log clock in milliseconds.
- source: type
  kind: enum
  target: activity_name
  values:
    login: Logon
    login_error: Logon
    logout: Logoff
  reason: Keycloak event type mapped to the OCSF activity caption; consume only when
    the emitted caption matches.
probe:
  mode: suffix
  require: '[org.keycloak.events] (default task-'
  text: ', ResidualProbe="nan2421-text-unknown", password="nan2421-secret"'
  source: ResidualProbe
consumed_candidates:
- authDetails.clientId
- authDetails.ipAddress
- authDetails.realmId
- authDetails.userId
- clientId
- details.auth_method
- details.authSessionParentId
- details.code_id
- details.impersonator
- details.impersonator_id
- details.username
- error
- id
- ipAddress
- log_level
- log.level
- level
- message
- operationType
- realmId
- resourcePath
- sessionId
- time
- type
- userId
- authSessionParentId
- code_id
- username
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
