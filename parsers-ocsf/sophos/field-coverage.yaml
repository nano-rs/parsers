source: text
transforms:
- source: device_name
  kind: lowercase
  reason: Parser case-normalizes this parsed field when represented in output.
- source: priority
  kind: lowercase
  reason: Parser case-normalizes this parsed field when represented in output.
- source: src_ip
  kind: lowercase
  reason: Parser case-normalizes this parsed field when represented in output.
- source: dst_ip
