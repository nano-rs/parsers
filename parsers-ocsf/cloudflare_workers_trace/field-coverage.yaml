source: json
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
transforms:
- source: EventTimestampMs
  kind: epoch_ms
  format: '%+'
  target: time
  reason: A job with timestamp_format rfc3339 renders EventTimestampMs as an RFC 3339 string.
mappings:
  DispatchNamespace:
  - resources.namespace
  Event.RayID:
  - api.request.uid
  - metadata.correlation_uid
  Event.Request.Method:
  - http_request.http_method
  Event.Request.URL:
  - http_request.url.url_string
  Event.Response.Status:
  - api.response.code
  - http_response.code
  EventTimestampMs:
  - time
  EventType:
  - api.operation
  - metadata.event_code
  Outcome:
  - status_detail
  ScriptName:
  - actor.app_name
  - api.service.name
  - resources.name
  - src_endpoint.svc_name
  ScriptTags:
  - resources.labels
  ScriptVersion.ID:
  - api.version
  - resources.version
  WallTimeMs:
  - duration
