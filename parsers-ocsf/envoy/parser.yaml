name: envoy_ocsf
display_name: Envoy / Istio Access Logs (OCSF)
version: "1.0.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses Envoy proxy access logs, including Istio sidecar and gateway logs, into
  complete OCSF 1.9.0 records. Accepts three shapes: Istio's default TEXT format
  (with response code details, termination details, upstream cluster, upstream
  and downstream addresses, SNI and route), Envoy's built-in default text format,
  and the JSON access log (Istio `accessLogEncoding: JSON` keys, or an Envoy
  `json_format` that uses the same key names).
    HTTP entries                      -> HTTP Activity 4002 (activity from the method)
    TCP proxy entries ("- - -", no
    protocol)                          -> Network Activity 4001 (Traffic, Fail on a
                                          response flag, Refuse on an RBAC denial)
    anything else                     -> Base Event 0 with unmapped.parse_fallback
  The client is src_endpoint (downstream remote address), the upstream host is
  dst_endpoint, and the address Envoy accepted the connection on is proxy.
  Istio mTLS peer principals (`downstream_peer_uri_san`, `upstream_peer_uri_san`,
  or the `*_peer_principal` spelling) become src_endpoint.svc_name and
  dst_endpoint.svc_name. The Istio upstream cluster
  (`outbound|9080||reviews.default.svc.cluster.local`) sets the connection
  direction and the destination service hostname. Response flags are status_code,
  response code details are status_detail.
match_values:
  - envoy
category: network
vendor: "Envoy Proxy"
product: "Envoy"
parser_vrl: |
  # Envoy / Istio access log -> OCSF 1.9.0 HTTP Activity (4002) / Network Activity (4001) / Base Event (0)
  raw_log = to_string(.message) ?? ""
  __raw_body = raw_log
  __source_kv = {}
  e = {}
  shape = ""

  parsed, perr = parse_json(raw_log)
  if perr == null && is_object(parsed) {
      pj = object!(parsed)
      __source_kv = pj
      if exists(pj.start_time) && (exists(pj.response_code) || exists(pj.downstream_remote_address) || exists(pj.bytes_sent)) {
          shape = "json"
          e = pj
      }
  } else {
      # Istio default TEXT format (meshConfig.accessLogFormat unset).
      m, merr = parse_regex(raw_log, r'^\x5B(?P<start_time>[^\x5D]+)\x5D "(?P<method>\S+) (?P<path>\S+) (?P<protocol>\S+)" (?P<response_code>\d+) (?P<response_flags>\S+) (?P<response_code_details>\S+) (?P<connection_termination_details>\S+) "(?P<upstream_transport_failure_reason>[^"]*)" (?P<bytes_received>\d+) (?P<bytes_sent>\d+) (?P<duration>\S+) (?P<upstream_service_time>\S+) "(?P<x_forwarded_for>[^"]*)" "(?P<user_agent>[^"]*)" "(?P<request_id>[^"]*)" "(?P<authority>[^"]*)" "(?P<upstream_host>[^"]*)" (?P<upstream_cluster>\S+) (?P<upstream_local_address>\S+) (?P<downstream_local_address>\S+) (?P<downstream_remote_address>\S+) (?P<requested_server_name>\S+) (?P<route_name>\S+)\s*$')
      if merr == null {
          shape = "istio_text"
      } else {
          # Envoy's built-in default format.
          m, merr = parse_regex(raw_log, r'^\x5B(?P<start_time>[^\x5D]+)\x5D "(?P<method>\S+) (?P<path>\S+) (?P<protocol>\S+)" (?P<response_code>\d+) (?P<response_flags>\S+) (?P<bytes_received>\d+) (?P<bytes_sent>\d+) (?P<duration>\S+) (?P<upstream_service_time>\S+) "(?P<x_forwarded_for>[^"]*)" "(?P<user_agent>[^"]*)" "(?P<request_id>[^"]*)" "(?P<authority>[^"]*)" "(?P<upstream_host>[^"]*)"\s*$')
          if merr == null { shape = "envoy_text" }
      }
      if shape != "" {
          # "-" is Envoy's placeholder for an absent operator value.
          e = filter(object!(m)) -> |_k, v| { v != null && v != "" && v != "-" }
          __source_kv = e
      }
  }

  if shape == "" {
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 0,
          "activity_name": "Unknown",
          "type_uid": 0,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": 0,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": sha2("envoy|raw|" + raw_log, variant: "SHA-256"),
              "log_level": "error",
              "log_name": "access",
              "log_provider": "Envoy",
              "product": { "name": "Envoy", "vendor_name": "Envoy Proxy" }
          },
          "unmapped": { "parse_error": "not an Envoy access log line" }
      }
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      . = set!(., ["unmapped", "parse_fallback"], "unparsable input")
  } else {
      # A JSON value can be null, a number or a "-" placeholder: normalize to text.
      method = to_string(e.method) ?? ""
      if method == "-" { method = "" }
      path = to_string(e.path) ?? ""
      if path == "-" { path = "" }
      protocol = to_string(e.protocol) ?? ""
      if protocol == "-" { protocol = "" }
      code = to_int(e.response_code) ?? 0
      flags = to_string(e.response_flags) ?? ""
      if flags == "-" { flags = "" }
      details = to_string(e.response_code_details) ?? ""
      if details == "-" { details = "" }
      term = to_string(e.connection_termination_details) ?? ""
      if term == "-" { term = "" }
      # -1 = absent: to_int(null) would read as 0, which is a real value.
      bytes_rx = -1
      if e.bytes_received != null { bytes_rx = to_int(e.bytes_received) ?? -1 }
      bytes_tx = -1
      if e.bytes_sent != null { bytes_tx = to_int(e.bytes_sent) ?? -1 }
      duration_ms = -1
      if e.duration != null { duration_ms = to_int(e.duration) ?? -1 }
      ust = -1
      if e.upstream_service_time != null { ust = to_int(e.upstream_service_time) ?? -1 }
      xff = to_string(e.x_forwarded_for) ?? ""
      if xff == "-" { xff = "" }
      ua = to_string(e.user_agent) ?? ""
      if ua == "-" { ua = "" }
      req_id = to_string(e.request_id) ?? ""
      if req_id == "-" { req_id = "" }
      authority = to_string(e.authority) ?? ""
      if authority == "-" { authority = "" }
      cluster = to_string(e.upstream_cluster) ?? ""
      if cluster == "-" { cluster = "" }
      sni = to_string(e.requested_server_name) ?? ""
      if sni == "-" { sni = "" }
      down_peer = string(e.downstream_peer_uri_san) ?? string(e.downstream_peer_principal) ?? ""
      if down_peer == "-" { down_peer = "" }
      up_peer = string(e.upstream_peer_uri_san) ?? string(e.upstream_peer_principal) ?? ""
      if up_peer == "-" { up_peer = "" }

      # ---- addresses: ip:port, [v6]:port, or tcp://ip:port ----
      addr_re = r'^(?:[a-z]+://)?(?:\x5B(?P<ip6>[0-9A-Fa-f:.]+)\x5D|(?P<ip4>[0-9]{1,3}(?:\.[0-9]{1,3}){3})):(?P<port>[0-9]+)$'
      src_ep = {}
      a = parse_regex(to_string(e.downstream_remote_address) ?? "", addr_re) ?? {}
      aip = string(a.ip4) ?? string(a.ip6) ?? ""
      if aip != "" { src_ep.ip = aip }
      aport = to_int(a.port) ?? 0
      if aport > 0 { src_ep.port = aport }
      if down_peer != "" { src_ep.svc_name = down_peer }

      dst_ep = {}
      a = parse_regex(to_string(e.upstream_host) ?? "", addr_re) ?? {}
      aip = string(a.ip4) ?? string(a.ip6) ?? ""
      if aip != "" {
          dst_ep.ip = aip
          aport = to_int(a.port) ?? 0
          if aport > 0 { dst_ep.port = aport }
      }
      proxy_ep = {}
      a = parse_regex(to_string(e.downstream_local_address) ?? "", addr_re) ?? {}
      aip = string(a.ip4) ?? string(a.ip6) ?? ""
      if aip != "" {
          proxy_ep.ip = aip
          aport = to_int(a.port) ?? 0
          if aport > 0 { proxy_ep.port = aport }
      }
      # No upstream host (no healthy upstream, no route): the listener address is
      # what the client was trying to reach.
      if !exists(dst_ep.ip) && exists(proxy_ep.ip) {
          dst_ep = proxy_ep
          proxy_ep = {}
      }
      # An inbound sidecar forwards to the address it accepted on: one endpoint, not a proxy hop.
      if exists(proxy_ep.ip) && proxy_ep.ip == dst_ep.ip && proxy_ep.port == dst_ep.port { proxy_ep = {} }
      if up_peer != "" { dst_ep.svc_name = up_peer }

      # ---- Istio upstream cluster: direction|port|subset|service FQDN ----
      direction_id = 0
      direction = ""
      if contains(cluster, "|") {
          cp = split(cluster, "|")
          cdir = string(cp[0]) ?? ""
          if cdir == "inbound" { direction_id = 1; direction = "Inbound" }
          if cdir == "outbound" { direction_id = 2; direction = "Outbound" }
          csvc = string(cp[3]) ?? ""
          if csvc != "" && !exists(dst_ep.hostname) { dst_ep.hostname = csvc }
      }

      time_ms = 0
      ts, tserr = parse_timestamp(to_string(e.start_time) ?? "", "%+", timezone: "UTC")
      if tserr == null { time_ms = to_unix_timestamp(ts, unit: "milliseconds") }

      is_rbac = contains(details, "rbac_access_denied") || contains(term, "rbac_access_denied")
      is_tcp = protocol == "" && method == ""
      is_istio = shape == "istio_text" || contains(cluster, "|") || starts_with(sni, "outbound_")

      ocsf = {}
      if is_tcp {
          # ---------------- TCP proxy entry -> Network Activity (4001) ----------------
          activity_id = 6
          activity_name = "Traffic"
          status_id = 1
          status_str = "Success"
          severity_id = 1
          severity = "Informational"
          if is_rbac {
              activity_id = 5; activity_name = "Refuse"
              status_id = 2; status_str = "Failure"
              severity_id = 3; severity = "Medium"
          } else if flags != "" {
              activity_id = 4; activity_name = "Fail"
              status_id = 2; status_str = "Failure"
              severity_id = 2; severity = "Low"
          }
          ocsf = {
              "class_uid": 4001,
              "class_name": "Network Activity",
              "category_uid": 4,
              "category_name": "Network Activity",
              "activity_id": activity_id,
              "activity_name": activity_name,
              "type_uid": 400100 + activity_id,
              "status_id": status_id,
              "status": status_str,
              "severity_id": severity_id,
              "severity": severity
          }
          if length(src_ep) == 0 && length(dst_ep) == 0 { dst_ep = { "name": "unknown" } }
      } else {
          # ---------------- HTTP entry -> HTTP Activity (4002) ----------------
          activity_id = 99
          activity_name = "Other"
          if method == "CONNECT" { activity_id = 1; activity_name = "Connect" }
          if method == "DELETE"  { activity_id = 2; activity_name = "Delete" }
          if method == "GET"     { activity_id = 3; activity_name = "Get" }
          if method == "HEAD"    { activity_id = 4; activity_name = "Head" }
          if method == "OPTIONS" { activity_id = 5; activity_name = "Options" }
          if method == "POST"    { activity_id = 6; activity_name = "Post" }
          if method == "PUT"     { activity_id = 7; activity_name = "Put" }
          if method == "TRACE"   { activity_id = 8; activity_name = "Trace" }
          if method == "PATCH"   { activity_id = 9; activity_name = "Patch" }

          status_id = 0
          status_str = "Unknown"
          if code >= 100 && code < 400 { status_id = 1; status_str = "Success" }
          if code >= 400 || (code == 0 && flags != "") { status_id = 2; status_str = "Failure" }
          severity_id = 1
          severity = "Informational"
          if code >= 400 && code < 500 { severity_id = 2; severity = "Low" }
          if code >= 500 || (code == 0 && flags != "") { severity_id = 3; severity = "Medium" }
          if is_rbac { severity_id = 3; severity = "Medium" }

          url_obj = {}
          up = split(path, "?", limit: 2)
          url_obj.path = string(up[0]) ?? ""
          if url_obj.path == "" { url_obj.path = "/" }
          qs = string(up[1]) ?? ""
          if qs != "" { url_obj.query_string = qs }
          # :authority is host, host:port, [v6] or [v6]:port.
          if authority != "" {
              am = parse_regex(authority, r'^(?:\x5B(?P<h6>[0-9A-Fa-f:.]+)\x5D|(?P<h>[^:\x5B\x5D]+))(?::(?P<p>[0-9]{1,5}))?$') ?? {}
              ahost = string(am.h) ?? string(am.h6) ?? ""
              if ahost != "" {
                  url_obj.hostname = ahost
                  aport = to_int(am.p) ?? 0
                  if aport > 0 { url_obj.port = aport }
              } else {
                  url_obj.hostname = authority
              }
          }
          req = { "url": url_obj }
          if method != "" { req.http_method = method }
          if protocol != "" { req.version = protocol }
          if ua != "" { req.user_agent = ua }
          if req_id != "" { req.uid = req_id }
          if xff != "" {
              xffs = filter(map_values(split(xff, ",")) -> |x| { strip_whitespace(string!(x)) }) -> |_i, x| { is_ipv4(string!(x)) || is_ipv6(string!(x)) }
              if length(xffs) > 0 { req.x_forwarded_for = xffs }
          }
          resp = { "code": code }
          if ust >= 0 { resp.latency = ust }
          if bytes_tx >= 0 { resp.length = bytes_tx }
          ocsf = {
              "class_uid": 4002,
              "class_name": "HTTP Activity",
              "category_uid": 4,
              "category_name": "Network Activity",
              "activity_id": activity_id,
              "activity_name": activity_name,
              "type_uid": 400200 + activity_id,
              "status_id": status_id,
              "status": status_str,
              "severity_id": severity_id,
              "severity": severity,
              "http_request": req,
              "http_response": resp,
              "http_status": code
          }
          if protocol != "" { ocsf.app_protocol_name = protocol }
      }

      if length(src_ep) > 0 { ocsf.src_endpoint = src_ep }
      if length(dst_ep) > 0 { ocsf.dst_endpoint = dst_ep }
      if length(proxy_ep) > 0 { ocsf.proxy = proxy_ep }
      conn = { "protocol_name": "tcp", "protocol_num": 6 }
      if direction_id > 0 { conn.direction_id = direction_id; conn.direction = direction } else { conn.direction_id = 0; conn.direction = "Unknown" }
      ocsf.connection_info = conn
      # NAN-2995: bytes_in = destination -> source, bytes_out = source -> destination.
      # bytes_sent goes back to the downstream client (src), so it is bytes_in.
      traffic = {}
      if bytes_tx >= 0 { traffic.bytes_in = bytes_tx }
      if bytes_rx >= 0 { traffic.bytes_out = bytes_rx }
      if length(traffic) > 0 { ocsf.traffic = traffic }
      if duration_ms >= 0 { ocsf.duration = duration_ms }
      if flags != "" { ocsf.status_code = flags }
      if details != "" { ocsf.status_detail = details } else if term != "" { ocsf.status_detail = term }
      ocsf.time = time_ms
      ocsf.raw_data = raw_log

      provider = "Envoy"
      if is_istio { provider = "Istio" }
      ocsf.metadata = {
          "version": "1.9.0",
          "uid": sha2("envoy|raw|" + raw_log, variant: "SHA-256"),
          "log_name": "access",
          "log_provider": provider,
          "log_format": shape,
          "product": { "name": "Envoy", "vendor_name": "Envoy Proxy" }
      }
      if req_id != "" { ocsf.metadata.correlation_uid = req_id }
      if is_rbac {
          # Envoy's RBAC filter enforced a policy: a security control denial, not an app 403.
          ocsf.metadata.profiles = ["security_control"]
          ocsf.action_id = 2; ocsf.action = "Denied"
          ocsf.disposition_id = 2; ocsf.disposition = "Blocked"
      }

      . = ocsf
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # Values spill exactly as parsed: a parser never masks, redacts or withholds
  # anything (masking is an opt-in pipeline step, never a parser concern).
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # A source field is consumed ONLY by an explicit mapping: a field-coverage.yaml
  # `mappings` entry (source key -> target paths) or a `transforms` rule with a
  # target, whose value is found AT THAT TARGET PATH of the selected branch. A
  # value that merely appears somewhere else in the event never consumes a field
  # (no coincidental consumption); everything else spills.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The sets below are strings instead
  # (a read shares the buffer). __repr holds one member per mapped leaf:
  # "," + encode_json(path) + "=" + encode_json(encode_json(value)), plus the
  # to_string form for a string or a float, so a numeric string is represented by
  # its typed scalar. Every part is a JSON text, inside which a '"' is always
  # escaped, so a member is matched exactly. Paths drop array indices
  # (resources.0.uid is resources.uid); arrays are walked two levels deep, and a
  # leaf deeper than that is simply not mapping evidence (it can only spill more).
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped = object!(parse_json!(encode_json(__mapped)))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __copy = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __repr = ""
  for_each(flatten(__mapped)) -> |path, value| {
      __p = encode_json(path)
      if is_array(value) {
          for_each(array!(value)) -> |_i, item| {
              if is_object(item) {
                  for_each(flatten(object!(item))) -> |sub, leaf| {
                      __q = encode_json(path + "." + sub)
                      if is_array(leaf) {
                          for_each(array!(leaf)) -> |_j, x| {
                              if !is_object(x) && !is_array(x) {
                                  __repr = __repr + ("," + __q + "=" + encode_json(encode_json(x)))
                                  if is_string(x) || is_float(x) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(x))) }
                              }
                          }
                      } else {
                          __repr = __repr + ("," + __q + "=" + encode_json(encode_json(leaf)))
                          if is_string(leaf) || is_float(leaf) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(leaf))) }
                      }
                  }
              } else if !is_array(item) {
                  __repr = __repr + ("," + __p + "=" + encode_json(encode_json(item)))
                  if is_string(item) || is_float(item) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(item))) }
              }
          }
      } else {
          __repr = __repr + ("," + __p + "=" + encode_json(encode_json(value)))
          if is_string(value) || is_float(value) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(value))) }
      }
  }
  __consumed = ""
  # BEGIN parser-specific transformations
  # start_time: Envoy START_TIME (RFC 3339) converted to event milliseconds.
  for_each(flatten(__source_kv)) -> |key, value| {
      if match(key, r'(?x)
      \A(?:
        start_time
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%+", timezone: "UTC")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              if contains(__repr, "," + "\"time\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
  }
  # Declared source -> target mappings (field-coverage.yaml `mappings`).
  __decl = "\n\"authority\"\t[\"http_request.url.hostname\"]\n\"bytes_received\"\t[\"traffic.bytes_out\"]\n\"bytes_sent\"\t[\"http_response.length\",\"traffic.bytes_in\"]\n\"connection_termination_details\"\t[\"status_detail\"]\n\"downstream_peer_uri_san\"\t[\"src_endpoint.svc_name\"]\n\"duration\"\t[\"duration\"]\n\"method\"\t[\"http_request.http_method\"]\n\"path\"\t[\"http_request.url.path\"]\n\"protocol\"\t[\"app_protocol_name\",\"http_request.version\"]\n\"request_id\"\t[\"http_request.uid\",\"metadata.correlation_uid\"]\n\"response_code\"\t[\"http_response.code\",\"http_status\"]\n\"response_code_details\"\t[\"status_detail\"]\n\"response_flags\"\t[\"status_code\"]\n\"upstream_peer_uri_san\"\t[\"dst_endpoint.svc_name\"]\n\"upstream_service_time\"\t[\"http_response.latency\"]\n\"user_agent\"\t[\"http_request.user_agent\"]\n\"x_forwarded_for\"\t[\"http_request.x_forwarded_for\"]\n"
  __preserve = []
  # END parser-specific transformations
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__copy.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # Declared mappings: __decl holds "\n" + encode_json(key) + "\t" + JSON array of
  # target paths + "\n" per mapped source key (a raw newline never occurs in
  # compact JSON). A key is consumed when its value, or every element of a scalar
  # array, is at one of its own targets.
  for_each(__flat) -> |key, value| {
      if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
      # __decl spells a bracket inside a key as a \u escape (deploy bracket count).
      __kt = encode_json(key)
      if match(__kt, r'[\x28\x29\x5B\x5D\x7B\x7D]') {
          __kt = replace(replace(replace(replace(replace(replace(__kt, r'\x28', "\\u0028"), r'\x29', "\\u0029"), r'\x5B', "\\u005b"), r'\x5D', "\\u005d"), r'\x7B', "\\u007b"), r'\x7D', "\\u007d")
      }
      __at = find(__decl, "\n" + __kt + "\t")
      if is_integer(__at) && !is_object(value) {
          __rest = slice!(__decl, int!(__at) + strlen(__kt) + 2)
          __hit = false
          for_each(array!(parse_json!(slice!(__rest, 0, int!(find(__rest, "\n")))))) -> |_i, target| {
              __tok = "," + encode_json(target) + "="
              if !__hit && is_array(value) {
                  __all = !is_empty(array!(value))
                  for_each(array!(value)) -> |_j, item| {
                      if __all {
                          __all = !is_object(item) && !is_array(item) && (contains(__repr, __tok + encode_json(encode_json(item))) || ((is_string(item) || is_float(item)) && contains(__repr, __tok + encode_json(to_string!(item)))))
                      }
                  }
                  __hit = __all
              } else if !__hit {
                  __hit = contains(__repr, __tok + encode_json(encode_json(value))) || ((is_string(value) || is_float(value)) && contains(__repr, __tok + encode_json(to_string!(value))))
              }
          }
          if __hit { __consumed = __consumed + ("," + encode_json(key)) }
      }
  }
  # Fast path: when no two source keys decode to the same key and no two spilled
  # keys get the same name, each key's decision depends only on its own value, so
  # one filter and one rename build the residual without copying it per key.
  __distinct = true
  if __tilde {
      __distinct = length(map_keys(__flat) -> |key| { replace(replace(key, "~1", "."), "~0", "~") }) == length(__flat)
  }
  __kept = {}
  __names = {}
  if __distinct {
      __kept = filter(__flat) -> |key, value| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          # A key is kept unless an explicit mapping or transformation consumed it.
          # Do not spill a copy of the raw body.
          value != __raw_body && !contains(__consumed, "," + encode_json(key))
      }
      __names = map_keys(__kept) -> |key| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          join!(__parts, ".")
      }
  }
  __residual = {}
  if __distinct && length(__names) == length(__kept) {
      __residual = map_values(__names) -> |value| {
          if is_array(value) || is_object(value) {
              if __tilde {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              if __complex { value = encode_json(value) }
          }
          value
      }
  } else {
      # Slow path, in source key order: a name already taken gets the next free
      # _2, _3, ... suffix.
      for_each(__flat) -> |key, value| {
          key = replace(replace(key, "~1", "."), "~0", "~")
          if is_array(value) || is_object(value) {
              value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                  replace(replace(inner, "~1", "."), "~0", "~")
              }, ["v"])
          }
          __token = "," + encode_json(key)
          if !contains(__consumed, __token) && value != __raw_body {
              __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
              __base = join!(__parts, ".")
              __key = __base
              __suffix = 2
              if includes(keys(__residual), __key) {
                  for_each(__flat) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __key) {
                          __key = __base + "_" + to_string(__suffix)
                          __suffix = __suffix + 1
                      }
                  }
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              __spill = if __complex { encode_json(value) } else { value }
              __residual = set!(__residual, [__key], __spill)
          }
      }
  }
  # Keep existing derived evidence, but remove null placeholders and copies of a
  # source value (that value is mapped or spilled above under its source path).
  # A value merely equal to some mapped attribute is kept: equality with an
  # unrelated attribute is no evidence that it is represented.
  # The canonical source spill above is the authoritative representation of
  # containers. The cheap conditions run first; the source value set is built on
  # first use.
  __original_values = null
  for_each(flatten(__existing)) -> |key, value| {
      if !is_null(value) && value != "" && !is_array(value) && !is_object(value) && value != __raw_body {
          # Members for the value itself and for to_string(value), as above.
          __json = encode_json(value)
          __as_json = "," + encode_json(__json)
          __as_string = __as_json
          if is_string(value) { __as_string = "," + __json } else if is_float(value) { __as_string = "," + encode_json(to_string!(value)) }
          if __original_values == null {
              # __source_kv may hold non-JSON types (a timestamp), so only an
              # integer or a boolean skips its to_string member here.
              __original_values = join!(map_values(values(flatten(__source_kv))) -> |source_value| {
                  __source_json = encode_json(source_value)
                  __tokens = "," + encode_json(__source_json)
                  if is_string(source_value) {
                      __tokens = __tokens + "," + __source_json
                  } else if !is_object(source_value) && !is_array(source_value) && !is_integer(source_value) && !is_boolean(source_value) {
                      __tokens = __tokens + "," + encode_json(to_string(source_value) ?? "")
                  }
                  __tokens
              }, "")
          }
          __source_set = string!(__original_values)
          __keep = !contains(__source_set, __as_json) && !contains(__source_set, __as_string)
          # Only text opening an object or an array (after JSON whitespace)
          # decodes to a container.
          if __keep && is_string(value) && match(string!(value), r'^[ \t\n\r]*[\x5B\x7B]') {
              __decoded, __decode_err = parse_json(string!(value))
              __keep = !(__decode_err == null && (is_object(__decoded) || is_array(__decoded)))
          }
          if __keep {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, as-is. These
  # entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__copy.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

