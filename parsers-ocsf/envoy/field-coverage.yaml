source: mixed
transforms:
- source: start_time
  kind: epoch_ms
  target: time
  reason: Envoy START_TIME (RFC 3339) converted to event milliseconds.
consumed_candidates:
- authority
- bytes_received
- bytes_sent
- connection_termination_details
- downstream_peer_principal
- downstream_peer_uri_san
- duration
- method
- path
- protocol
- request_id
- response_code
- response_code_details
- response_flags
- upstream_peer_principal
- upstream_peer_uri_san
- upstream_service_time
- user_agent
- x_forwarded_for
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
