name: traefik_ocsf
display_name: Traefik (OCSF)
version: "1.0.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses Traefik Proxy logs into complete OCSF 1.9.0 records. Access logs in
  the `common` (CLF plus request count, router, service URL and duration),
  `genericCLF` and `json` formats become "HTTP Activity" (class_uid 4002):
  client on src_endpoint, the selected service on dst_endpoint, the Host
  header on http_request.url, DownstreamStatus / DownstreamContentSize on
  http_response, Duration (ns) on duration and OriginDuration (ns) on
  http_response.latency, TLS details on tls and trace_id / span_id on trace.
  Traefik's own application log (JSON from v2 logrus or v3 zerolog, the v2
  logfmt `common` form and the v3 console form) is not an HTTP transaction and
  becomes "Base Event" (class_uid 0) with the level mapped to severity. A
  bare IPv6 ServiceAddr / ClientAddr is kept whole; a port is read only from
  `[v6]:port` or `v4:port`. JSON without access-log or application-log keys
  takes the fallback branch.
  Unrecognized lines become Base Event with the raw line kept and
  `unmapped.parse_fallback` set. The whole OCSF object is emitted on the root.
match_values:
  - traefik
category: network
vendor: "Traefik Labs"
product: "Traefik Proxy"
parser_vrl: |
  # NAN source timezone. Generated by scripts/residual_spill.py; edit scripts/residual/source_tz.vrl.
  # The log source's timezone setting arrives as .nano.source_timezone (an IANA
  # name such as "America/New_York", or any fixed offset such as "+05:30"), set
  # by nano at ingest. .nano is nano's input, never part of the log: it is
  # removed whole before anything else, whatever its shape.
  # For a clock that carries no offset a parser parses it AS UTC and sets
  # __lc_pending; the generated local-clock block that follows the parse
  # (local_clock.vrl) turns it into real UTC with this setting, and the spill
  # records the zone used as unmapped.nano_time_assumed_tz (the name, the offset
  # as +HH:MM, or "UTC" when the setting is absent, invalid or "local").
  __src_nano = del(.nano)
  __src_tz_in = ""
  if is_object(__src_nano) { __src_tz_in = strip_whitespace(to_string(object!(__src_nano).source_timezone) ?? "") }
  __src_tz = "UTC"
  __src_shift_ms = 0
  __src_tz_label = "UTC"
  __time_assumed = false
  __time_inline = false
  __lc_pending = false
  # No parse_* decoder here: nano infers a parser's input contract from the first
  # decoder in its program (parse_json first = a JSON-input parser, handed the
  # whole HEC / OTLP object). This prelude opens every parser, so a decoder in it
  # would turn every JSON-input parser into a text one. match + slice instead.
  if match(__src_tz_in, r'^[+-]\d{2}:?\d{2}$') {
      __src_sign = slice(__src_tz_in, 0, 1) ?? "+"
      __src_digits = replace(slice(__src_tz_in, 1) ?? "", ":", "")
      __src_hh = slice(__src_digits, 0, 2) ?? "99"
      __src_mm = slice(__src_digits, 2, 4) ?? "99"
      __src_h = to_int(__src_hh) ?? 99
      __src_m = to_int(__src_mm) ?? 99
      if __src_h <= 14 && __src_m <= 59 {
          __src_shift_ms = (__src_h * 3600 + __src_m * 60) * 1000
          if __src_sign == "-" { __src_shift_ms = 0 - __src_shift_ms }
          if __src_shift_ms != 0 { __src_tz_label = __src_sign + __src_hh + ":" + __src_mm }
      }
  } else if __src_tz_in != "" && downcase(__src_tz_in) != "local" {
      # "local" (the Vector host's zone) would make the time depend on the host.
      __src_probe, __src_probe_err = parse_timestamp("2000-01-01 00:00:00", "%Y-%m-%d %H:%M:%S", timezone: __src_tz_in)
      if __src_probe_err == null { __src_tz = __src_tz_in; __src_tz_label = __src_tz_in }
  }
  # END NAN source timezone
  # nano's input contract (nanosiem hec_payload.rs, NAN-5883): JSON access / app records and
  # CLF / logfmt / console lines. From nano v2.0.36 an HEC JSON record (string or object event)
  # arrives whole; older nano versions read this as undeclared and infer `text`, as before.
  # nano:input=json_or_text
  # Traefik -> OCSF 1.9.0 HTTP Activity (4002) / Base Event (0)
  raw_log = to_string(.message) ?? ""
  __raw_body = raw_log
  __source_kv = {}

  kind = ""
  a = {}
  j, jerr = parse_json(raw_log)
  if jerr == null && is_object(j) {
      a = object!(j)
      __source_kv = a
      if exists(a.RequestMethod) || exists(a.DownstreamStatus) || exists(a.ClientAddr) {
          kind = "access_json"
      } else if exists(a.level) || exists(a.msg) || exists(a.message) || exists(a.time) {
          kind = "app"
      }
      # Any other JSON object is not a Traefik log: it takes the fallback branch,
      # so a misrouted source shows up in parser health instead of passing silently.
  } else {
      c = parse_regex(raw_log, r'^(?P<client_host>\S+) \S+ (?P<client_username>\S+) \[(?P<start_local>[^\x5D]+)\] "(?P<request_method>\S+) (?P<request_path>\S+) (?P<request_protocol>[^"]*)" (?P<downstream_status>\d{3}|-) (?P<downstream_content_size>\d+|-)(?: (?:"(?P<request_referer>[^"]*)"|-) (?:"(?P<request_user_agent>[^"]*)"|-)(?: (?P<request_count>\d+|-) (?:"(?P<router_name>[^"]*)"|-) (?:"(?P<service_url>[^"]*)"|-) (?P<duration>\d+)ms)?)?\s*$') ?? {}
      if length(c) > 0 {
          kind = "access_clf"
          # Optional groups that did not participate come back null; they are not source fields.
          a = compact(c, string: false)
          __source_kv = a
      } else {
          # v2 `common` application log: logfmt with time / level / msg.
          if match(raw_log, r'^time="[^"]*" level=\w+ ') {
              kv = parse_key_value(raw_log, key_value_delimiter: "=", field_delimiter: " ") ?? {}
              if exists(kv.level) {
                  kind = "app"
                  a = kv
                  __source_kv = a
              }
          }
          if kind == "" {
              # v3 console application log: `<RFC3339> <LVL> [<caller> >] <message> key=value...`
              v3 = parse_regex(raw_log, r'^(?P<time>\d{4}-\d{2}-\d{2}T\S+) (?P<level>TRC|DBG|INF|WRN|ERR|FTL|PNC) (?:(?P<caller>\S+:\d+) > )?(?P<message>.*)$') ?? {}
              if length(v3) > 0 {
                  kind = "app"
                  a = compact(v3, string: false)
                  __source_kv = a
              }
          }
      }
  }

  # ---- severity from the Traefik level ----------------------------------
  level = downcase(string(a.level) ?? "")
  severity_id = 1
  severity = "Informational"
  if level == "warn" || level == "warning" || level == "wrn" { severity_id = 3; severity = "Medium" }
  if level == "error" || level == "err" { severity_id = 4; severity = "High" }
  if level == "fatal" || level == "ftl" || level == "panic" || level == "pnc" { severity_id = 6; severity = "Fatal" }

  product = { "name": "Traefik Proxy", "vendor_name": "Traefik Labs" }
  uid = sha2("traefik|raw|" + raw_log, variant: "SHA-256")

  if kind == "access_json" || kind == "access_clf" {
      # ---------------- HTTP Activity (4002) ----------------
      time_ms = 0
      start_s = string(a.StartUTC) ?? string(a.StartLocal) ?? ""
      if start_s != "" {
          t, terr = parse_timestamp(start_s, "%+", timezone: "UTC")
          if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
      }
      clf_ts = string(a.start_local) ?? ""
      if clf_ts != "" {
          t2, t2err = parse_timestamp(clf_ts, "%d/%b/%Y:%H:%M:%S %z", timezone: "UTC")
          if t2err == null { time_ms = to_unix_timestamp(t2, unit: "milliseconds") }
      }
      if time_ms == 0 {
          ts = string(a.time) ?? ""
          t3, t3err = parse_timestamp(ts, "%+", timezone: "UTC")
          if t3err == null { time_ms = to_unix_timestamp(t3, unit: "milliseconds") }
      }

      method = upcase(string(a.RequestMethod) ?? string(a.request_method) ?? "")
      if method == "-" { method = "" }
      req_path = string(a.RequestPath) ?? string(a.request_path) ?? ""
      version = string(a.RequestProtocol) ?? string(a.request_protocol) ?? ""
      # to_int(null) is 0, not an error, so pick the present key before converting.
      ds = a.DownstreamStatus
      if ds == null { ds = a.downstream_status }
      code = to_int(ds) ?? 0
      dl = a.DownstreamContentSize
      if dl == null { dl = a.downstream_content_size }
      resp_len = to_int(dl) ?? 0
      req_len = to_int(a.RequestContentSize) ?? 0
      user_agent = string(get(a, ["request_User-Agent"]) ?? null) ?? string(a.request_user_agent) ?? ""
      referrer = string(get(a, ["request_Referer"]) ?? null) ?? string(a.request_referer) ?? ""
      content_type = string(get(a, ["downstream_Content-Type"]) ?? null) ?? ""
      username = string(a.ClientUsername) ?? string(a.client_username) ?? ""

      # ---- client ----
      client_ip = string(a.ClientHost) ?? string(a.client_host) ?? ""
      client_port = to_int(a.ClientPort) ?? 0
      if client_ip == "" {
          # A bare address is taken as is; host:port needs IPv6 in brackets, so a
          # bare IPv6 is never split at its last colon.
          caddr = string(a.ClientAddr) ?? ""
          if is_ipv4(caddr) || is_ipv6(caddr) {
              client_ip = caddr
          } else {
              cm = parse_regex(caddr, r'^(?:\x5B(?P<ip6>[^\x5D]+)\x5D(?::(?P<port6>\d+))?|(?P<ip4>[^:\x5B\x5D]+):(?P<port>\d+))$') ?? {}
              client_ip = string(cm.ip6) ?? string(cm.ip4) ?? ""
              client_port = to_int(string(cm.port6) ?? string(cm.port) ?? "") ?? 0
          }
      }
      src_endpoint = {}
      if is_ipv4(client_ip) || is_ipv6(client_ip) {
          src_endpoint.ip = downcase(client_ip)
          if client_port > 0 { src_endpoint.port = client_port }
      }

      # ---- upstream service ----
      dst_endpoint = {}
      svc_addr = string(a.ServiceAddr) ?? ""
      svc_url = string(a.ServiceURL) ?? string(a.service_url) ?? ""
      svc_url_obj = object(a.ServiceURL) ?? object(a.BackendURL) ?? {}
      svc_host = string(svc_url_obj.Host) ?? ""
      if svc_addr == "" && svc_host != "" { svc_addr = svc_host }
      if svc_addr == "" && svc_url != "" {
          su, suerr = parse_url(svc_url)
          if suerr == null {
              suh = string(su.host) ?? ""
              sup = to_int(su.port)
              if suh != "" && sup > 0 { svc_addr = suh + ":" + to_string(sup) } else if suh != "" { svc_addr = suh }
          }
      }
      if svc_addr != "" {
          sip = ""
          sport = 0
          if is_ipv4(svc_addr) || is_ipv6(svc_addr) {
              sip = svc_addr
          } else {
              sm = parse_regex(svc_addr, r'^(?:\x5B(?P<ip6>[^\x5D]+)\x5D(?::(?P<port6>\d+))?|(?P<host>[^:\x5B\x5D]+):(?P<port>\d+))$') ?? {}
              sip = string(sm.ip6) ?? string(sm.host) ?? ""
              sport = to_int(string(sm.port6) ?? string(sm.port) ?? "") ?? 0
              if sip == "" && !contains(svc_addr, ":") { sip = svc_addr }
          }
          if is_ipv4(sip) || is_ipv6(sip) { dst_endpoint.ip = downcase(sip) } else if sip != "" { dst_endpoint.hostname = downcase(sip) }
          if sport > 0 { dst_endpoint.port = sport }
      }
      svc_name = string(a.ServiceName) ?? string(a.BackendName) ?? ""
      if svc_name != "" { dst_endpoint.svc_name = svc_name }

      # ---- url ----
      url_obj = {}
      up = split(req_path, "?", limit: 2)
      url_obj.path = string(up[0]) ?? "/"
      if url_obj.path == "" { url_obj.path = "/" }
      if length(up) == 2 && (string(up[1]) ?? "") != "" { url_obj.query_string = string(up[1]) ?? "" }
      rhost = string(a.RequestHost) ?? ""
      if rhost != "" && rhost != "-" { url_obj.hostname = downcase(rhost) }
      rport = to_int(a.RequestPort) ?? 0
      if rport > 0 { url_obj.port = rport }
      scheme = string(a.RequestScheme) ?? ""
      if scheme != "" { url_obj.scheme = scheme }

      activity_id = 99
      activity_name = "Other"
      if method == "CONNECT" { activity_id = 1; activity_name = "Connect" }
      if method == "DELETE"  { activity_id = 2; activity_name = "Delete" }
      if method == "GET"     { activity_id = 3; activity_name = "Get" }
      if method == "HEAD"    { activity_id = 4; activity_name = "Head" }
      if method == "OPTIONS" { activity_id = 5; activity_name = "Options" }
      if method == "POST"    { activity_id = 6; activity_name = "Post" }
      if method == "PUT"     { activity_id = 7; activity_name = "Put" }
      if method == "TRACE"   { activity_id = 8; activity_name = "Trace" }
      if method == "PATCH"   { activity_id = 9; activity_name = "Patch" }

      status_id = 0
      status_str = "Unknown"
      if code >= 100 && code < 400 { status_id = 1; status_str = "Success" }
      if code >= 400 { status_id = 2; status_str = "Failure" }
      if code >= 500 && severity_id < 2 { severity_id = 2; severity = "Low" }

      http_request = { "url": url_obj }
      if method != "" { http_request.http_method = method }
      if version != "" { http_request.version = version }
      if user_agent != "" && user_agent != "-" { http_request.user_agent = user_agent }
      if referrer != "" && referrer != "-" { http_request.referrer = referrer }
      if req_len > 0 { http_request.length = req_len }

      http_response = { "code": code }
      if code > 0 { http_response.status = status_str }
      if resp_len > 0 { http_response.length = resp_len }
      if content_type != "" { http_response.content_type = content_type }
      odur = to_int(a.OriginDuration) ?? -1
      if exists(a.OriginDuration) && odur >= 0 { http_response.latency = to_int(odur * 0.000001) }

      ocsf = {
          "class_uid": 4002,
          "class_name": "HTTP Activity",
          "category_uid": 4,
          "category_name": "Network Activity",
          "activity_id": activity_id,
          "activity_name": activity_name,
          "type_uid": 400200 + activity_id,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": status_id,
          "status": status_str,
          "time": time_ms,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": uid,
              "profiles": ["load_balancer"],
              "log_name": "access",
              "product": product
          },
          "http_request": http_request,
          "http_response": http_response
      }
      if kind == "access_json" { ocsf.metadata.log_format = "json" } else { ocsf.metadata.log_format = "common" }
      if clf_ts != "" { ocsf.metadata.original_time = clf_ts }
      dur_ns = to_int(a.Duration) ?? -1
      if exists(a.Duration) && dur_ns >= 0 { ocsf.duration = to_int(dur_ns * 0.000001) }
      dur_ms = to_int(a.duration) ?? -1
      if exists(a.duration) && dur_ms >= 0 { ocsf.duration = dur_ms }
      # OCSF 1.9 network_traffic: bytes_in = destination -> source (response to the client).
      if resp_len > 0 || req_len > 0 {
          ocsf.traffic = {}
          if resp_len > 0 { ocsf.traffic.bytes_in = resp_len }
          if req_len > 0 { ocsf.traffic.bytes_out = req_len }
      }
      if length(src_endpoint) > 0 { ocsf.src_endpoint = src_endpoint }
      if length(dst_endpoint) > 0 { ocsf.dst_endpoint = dst_endpoint }
      if username != "" && username != "-" {
          # actor is bound to the host profile on HTTP Activity.
          ocsf.actor = { "user": { "name": username } }
          ocsf.metadata.profiles = push(ocsf.metadata.profiles, "host")
      }

      # ---- router -> load_balancer (Traefik is the balancing reverse proxy) ----
      router = string(a.RouterName) ?? string(a.router_name) ?? string(a.FrontendName) ?? ""
      lb = {}
      if router != "" && router != "-" { lb.name = router }
      if exists(lb.name) {
          if code > 0 { lb.code = code }
          if length(dst_endpoint) > 0 { lb.dst_endpoint = dst_endpoint }
          ocsf.load_balancer = lb
      }

      tls_version = string(a.TLSVersion) ?? ""
      if tls_version != "" {
          ocsf.tls = { "version": tls_version }
          tls_cipher = string(a.TLSCipher) ?? ""
          if tls_cipher != "" { ocsf.tls.cipher = tls_cipher }
          if rhost != "" && rhost != "-" { ocsf.tls.sni = rhost }
      }

      trace_id = string(a.trace_id) ?? ""
      if trace_id != "" {
          ocsf.trace = { "uid": trace_id }
          # span_id (the EntryPoint root span) stays in unmapped: an OCSF span needs
          # start/end times the access log does not carry.
          ocsf.metadata.profiles = push(ocsf.metadata.profiles, "trace")
      }
      . = ocsf
  } else if kind == "app" {
      # ---------------- Base Event (0): Traefik application log ----------------
      time_ms = 0
      ts = string(a.time) ?? ""
      if ts != "" {
          t, terr = parse_timestamp(ts, "%+", timezone: "UTC")
          if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
      }
      msg = string(a.message) ?? string(a.msg) ?? ""
      ocsf = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 99,
          "activity_name": "Other",
          "type_uid": 99,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": 0,
          "status": "Unknown",
          "time": time_ms,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": uid,
              "log_name": "traefik",
              "product": product
          }
      }
      if msg != "" { ocsf.message = msg }
      lvl_raw = string(a.level) ?? ""
      if lvl_raw != "" { ocsf.metadata.log_level = lvl_raw }
      err_s = string(a.error) ?? ""
      if err_s != "" { ocsf.status_detail = err_s }
      . = ocsf
  } else {
      # ---------------- Base Event (0): unrecognized ----------------
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 99,
          "activity_name": "Other",
          "type_uid": 99,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": 0,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": uid,
              "log_name": "traefik",
              "log_level": "error",
              "product": product
          }
      }
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      . = set!(., ["unmapped", "parse_fallback"], "unparsable input")
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # Values spill exactly as parsed: a parser never masks, redacts or withholds
  # anything (masking is an opt-in pipeline step, never a parser concern).
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # A source field is consumed ONLY by an explicit mapping: a field-coverage.yaml
  # `mappings` entry (source key -> target paths) or a `transforms` rule with a
  # target, whose value is found AT THAT TARGET PATH of the selected branch. A
  # value that merely appears somewhere else in the event never consumes a field
  # (no coincidental consumption); everything else spills.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The sets below are strings instead
  # (a read shares the buffer). __repr holds one member per mapped leaf:
  # "," + encode_json(path) + "=" + encode_json(encode_json(value)), plus the
  # to_string form for a string or a float, so a numeric string is represented by
  # its typed scalar. Every part is a JSON text, inside which a '"' is always
  # escaped, so a member is matched exactly. Paths drop array indices
  # (resources.0.uid is resources.uid); arrays are walked two levels deep, and a
  # leaf deeper than that is simply not mapping evidence (it can only spill more).
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped = object!(parse_json!(encode_json(__mapped)))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __copy = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __repr = ""
  for_each(flatten(__mapped)) -> |path, value| {
      __p = encode_json(path)
      if is_array(value) {
          for_each(array!(value)) -> |_i, item| {
              if is_object(item) {
                  for_each(flatten(object!(item))) -> |sub, leaf| {
                      __q = encode_json(path + "." + sub)
                      if is_array(leaf) {
                          for_each(array!(leaf)) -> |_j, x| {
                              if !is_object(x) && !is_array(x) {
                                  __repr = __repr + ("," + __q + "=" + encode_json(encode_json(x)))
                                  if is_string(x) || is_float(x) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(x))) }
                              }
                          }
                      } else {
                          __repr = __repr + ("," + __q + "=" + encode_json(encode_json(leaf)))
                          if is_string(leaf) || is_float(leaf) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(leaf))) }
                      }
                  }
              } else if !is_array(item) {
                  __repr = __repr + ("," + __p + "=" + encode_json(encode_json(item)))
                  if is_string(item) || is_float(item) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(item))) }
              }
          }
      } else {
          __repr = __repr + ("," + __p + "=" + encode_json(encode_json(value)))
          if is_string(value) || is_float(value) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(value))) }
      }
  }
  __consumed = ""
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__copy.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # BEGIN parser-specific transformations
  # StartUTC: Request start clock (RFC 3339) converted to event milliseconds.
  # time: Log record clock (RFC 3339) converted to event milliseconds.
  # start_local: CLF timestamp with explicit offset converted to event milliseconds.
  # Duration: Traefik reports Duration in nanoseconds; OCSF duration is milliseconds.
  # level: Traefik log level normalized to OCSF severity_id; consumed only when that ID is emitted.
  for_each(__flat) -> |key, value| {
      if match(key, r'(?x)
      \A(?:
        StartUTC
      | time
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%+", timezone: "UTC")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              if contains(__repr, "," + "\"time\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        start_local
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%d/%b/%Y:%H:%M:%S %z", timezone: "UTC")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              if contains(__repr, "," + "\"time\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        Duration
      )\z') {
          __value = value
          __number, __number_err = to_float(__value)
          if __number_err == null && __value != null && !is_boolean(__value) {
              __expected = to_int(__number * 0.000001)
              if contains(__repr, "," + "\"duration\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        level
      )\z') {
          __value = value
          if __value != null {
              __expected = get!({"trace": 1, "trc": 1, "debug": 1, "dbg": 1, "info": 1, "inf": 1, "warn": 3, "warning": 3, "wrn": 3, "error": 4, "err": 4, "fatal": 6, "ftl": 6, "panic": 6, "pnc": 6}, [downcase(to_string(__value) ?? "")])
              if __expected != null {
                  if contains(__repr, "," + "\"severity_id\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
              }
          }
      }
  }
  # Declared source -> target mappings (field-coverage.yaml `mappings`).
  __decl = "\n\"client_host\"\t[\"src_endpoint.ip\"]\n\"client_username\"\t[\"actor.user.name\"]\n\"downstream_content_size\"\t[\"http_response.length\",\"traffic.bytes_in\"]\n\"downstream_status\"\t[\"http_response.code\",\"load_balancer.code\"]\n\"duration\"\t[\"duration\"]\n\"request_method\"\t[\"http_request.http_method\"]\n\"request_path\"\t[\"http_request.url.path\"]\n\"request_protocol\"\t[\"http_request.version\"]\n\"request_referer\"\t[\"http_request.referrer\"]\n\"request_user_agent\"\t[\"http_request.user_agent\"]\n\"router_name\"\t[\"load_balancer.name\"]\n\"start_local\"\t[\"metadata.original_time\"]\n\"ClientAddr\"\t[\"src_endpoint.ip\"]\n\"DownstreamContentSize\"\t[\"http_response.length\",\"traffic.bytes_in\"]\n\"DownstreamStatus\"\t[\"http_response.code\",\"load_balancer.code\"]\n\"RequestHost\"\t[\"http_request.url.hostname\",\"tls.sni\"]\n\"RequestMethod\"\t[\"http_request.http_method\"]\n\"RequestPath\"\t[\"http_request.url.path\"]\n\"RequestPort\"\t[\"http_request.url.port\"]\n\"RequestProtocol\"\t[\"http_request.version\"]\n\"RouterName\"\t[\"load_balancer.name\"]\n\"ServiceAddr\"\t[\"dst_endpoint.ip\",\"load_balancer.dst_endpoint.ip\"]\n\"level\"\t[\"metadata.log_level\"]\n\"msg\"\t[\"message\"]\n\"error\"\t[\"status_detail\"]\n\"message\"\t[\"message\"]\n\"BackendName\"\t[\"dst_endpoint.svc_name\",\"load_balancer.dst_endpoint.svc_name\"]\n\"ClientHost\"\t[\"src_endpoint.ip\"]\n\"ClientPort\"\t[\"src_endpoint.port\"]\n\"FrontendName\"\t[\"load_balancer.name\"]\n\"RequestContentSize\"\t[\"http_request.length\",\"traffic.bytes_out\"]\n\"downstream_Content-Type\"\t[\"http_response.content_type\"]\n\"request_User-Agent\"\t[\"http_request.user_agent\"]\n\"ServiceName\"\t[\"dst_endpoint.svc_name\",\"load_balancer.dst_endpoint.svc_name\"]\n\"RequestScheme\"\t[\"http_request.url.scheme\"]\n\"TLSCipher\"\t[\"tls.cipher\"]\n\"TLSVersion\"\t[\"tls.version\"]\n\"trace_id\"\t[\"trace.uid\"]\n"
  __preserve = []
  # END parser-specific transformations
  # Declared mappings: __decl holds "\n" + encode_json(key) + "\t" + JSON array of
  # target paths + "\n" per mapped source key (a raw newline never occurs in
  # compact JSON). A key is consumed when its value, or every element of a scalar
  # array, is at one of its own targets. Keys stay ESCAPED here and in __consumed:
  # a literal dotted key ("a~1b") and the nested path ("a.b") are different
  # fields, and mapping one never consumes the other.
  for_each(__flat) -> |key, value| {
      # __decl spells a bracket inside a key as a \u escape (deploy bracket count).
      __kt = encode_json(key)
      if match(__kt, r'[\x28\x29\x5B\x5D\x7B\x7D]') {
          __kt = replace(replace(replace(replace(replace(replace(__kt, r'\x28', "\\u0028"), r'\x29', "\\u0029"), r'\x5B', "\\u005b"), r'\x5D', "\\u005d"), r'\x7B', "\\u007b"), r'\x7D', "\\u007d")
      }
      __at = find(__decl, "\n" + __kt + "\t")
      if is_integer(__at) && !is_object(value) {
          __rest = slice!(__decl, int!(__at) + strlen(__kt) + 2)
          __hit = false
          for_each(array!(parse_json!(slice!(__rest, 0, int!(find(__rest, "\n")))))) -> |_i, target| {
              __tok = "," + encode_json(target) + "="
              if !__hit && is_array(value) {
                  __all = !is_empty(array!(value))
                  for_each(array!(value)) -> |_j, item| {
                      if __all {
                          __all = !is_object(item) && !is_array(item) && (contains(__repr, __tok + encode_json(encode_json(item))) || ((is_string(item) || is_float(item)) && contains(__repr, __tok + encode_json(to_string!(item)))))
                      }
                  }
                  __hit = __all
              } else if !__hit {
                  __hit = contains(__repr, __tok + encode_json(encode_json(value))) || ((is_string(value) || is_float(value)) && contains(__repr, __tok + encode_json(to_string!(value))))
              }
          }
          if __hit { __consumed = __consumed + ("," + encode_json(key)) }
      }
  }
  # Fast path: when no two source keys decode to the same key and no two spilled
  # keys get the same name, each key's decision depends only on its own value, so
  # one filter and one rename build the residual without copying it per key.
  __distinct = true
  if __tilde {
      __distinct = length(map_keys(__flat) -> |key| { replace(replace(key, "~1", "."), "~0", "~") }) == length(__flat)
  }
  __kept = {}
  __names = {}
  if __distinct {
      __kept = filter(__flat) -> |key, value| {
          # A key is kept unless an explicit mapping or transformation consumed it.
          # Do not spill a copy of the raw body.
          value != __raw_body && !contains(__consumed, "," + encode_json(key))
      }
      __names = map_keys(__kept) -> |key| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          join!(__parts, ".")
      }
  }
  __residual = {}
  if __distinct && length(__names) == length(__kept) {
      __residual = map_values(__names) -> |value| {
          if is_array(value) || is_object(value) {
              if __tilde {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              if __complex { value = encode_json(value) }
          }
          value
      }
  } else {
      # Slow path, in source key order: a name already taken gets the next free
      # _2, _3, ... suffix.
      for_each(__flat) -> |key, value| {
          __token = "," + encode_json(key)
          key = replace(replace(key, "~1", "."), "~0", "~")
          if is_array(value) || is_object(value) {
              value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                  replace(replace(inner, "~1", "."), "~0", "~")
              }, ["v"])
          }
          if !contains(__consumed, __token) && value != __raw_body {
              __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
              __base = join!(__parts, ".")
              __key = __base
              __suffix = 2
              if includes(keys(__residual), __key) {
                  for_each(__flat) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __key) {
                          __key = __base + "_" + to_string(__suffix)
                          __suffix = __suffix + 1
                      }
                  }
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              __spill = if __complex { encode_json(value) } else { value }
              __residual = set!(__residual, [__key], __spill)
          }
      }
  }
  # Names nano owns in unmapped (the parser markers and the reserved nano.*
  # namespace) are never taken by a source field: a vendor key with such a name
  # is kept, renamed source_<name>, so a log cannot forge a marker.
  if match(encode_json(keys(__residual)), r'"nano(?:"|\.|_time_assumed_tz"|_time_source"|_operational")') {
      for_each(object!(__residual)) -> |key, value| {
          if includes(["nano", "nano_time_assumed_tz", "nano_time_source", "nano_operational"], key) || starts_with(key, "nano.") {
              # source_<name>, or the next free _2, _3, ... when a vendor key
              # already holds that name: nothing is lost.
              __rk = "source_" + key
              __rn = 2
              if includes(keys(__residual), __rk) {
                  for_each(__residual) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __rk) {
                          __rk = "source_" + key + "_" + to_string(__rn)
                          __rn = __rn + 1
                      }
                  }
              }
              __residual = remove!(__residual, [key])
              __residual = set!(__residual, [__rk], value)
          }
      }
  }
  # Keep existing derived evidence, but remove null placeholders and copies of a
  # source value (that value is mapped or spilled above under its source path).
  # A value merely equal to some mapped attribute is kept: equality with an
  # unrelated attribute is no evidence that it is represented.
  # The canonical source spill above is the authoritative representation of
  # containers. The cheap conditions run first; the source value set is built on
  # first use.
  __original_values = null
  for_each(flatten(__existing)) -> |key, value| {
      if !is_null(value) && value != "" && !is_array(value) && !is_object(value) && value != __raw_body {
          # Members for the value itself and for to_string(value), as above.
          __json = encode_json(value)
          __as_json = "," + encode_json(__json)
          __as_string = __as_json
          if is_string(value) { __as_string = "," + __json } else if is_float(value) { __as_string = "," + encode_json(to_string!(value)) }
          if __original_values == null {
              # __source_kv may hold non-JSON types (a timestamp), so only an
              # integer or a boolean skips its to_string member here.
              __original_values = join!(map_values(values(flatten(__source_kv))) -> |source_value| {
                  __source_json = encode_json(source_value)
                  __tokens = "," + encode_json(__source_json)
                  if is_string(source_value) {
                      __tokens = __tokens + "," + __source_json
                  } else if !is_object(source_value) && !is_array(source_value) && !is_integer(source_value) && !is_boolean(source_value) {
                      __tokens = __tokens + "," + encode_json(to_string(source_value) ?? "")
                  }
                  __tokens
              }, "")
          }
          __source_set = string!(__original_values)
          __keep = !contains(__source_set, __as_json) && !contains(__source_set, __as_string)
          # Only text opening an object or an array (after JSON whitespace)
          # decodes to a container.
          if __keep && is_string(value) && match(string!(value), r'^[ \t\n\r]*[\x5B\x7B]') {
              __decoded, __decode_err = parse_json(string!(value))
              __keep = !(__decode_err == null && (is_object(__decoded) || is_array(__decoded)))
          }
          if __keep {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, as-is. These
  # entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__copy.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  if __time_assumed && !__time_inline { __residual = set!(__residual, ["nano_time_assumed_tz"], __src_tz_label) }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

samples:
  - raw: '192.0.2.10 - - [02/Oct/2017:20:22:07 +0000] "GET /ui/favicons/favicon-16x16.png HTTP/1.1" 304 0 "http://www.example.com/login" "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/61.0.3163.100 Safari/537.36" 262 "Host-host-1" "http://198.51.100.3:5601" 2ms'
    expect:
      class_uid: 4002
      activity_id: 3
      "http_response.code": 304
      "dst_endpoint.ip": "198.51.100.3"
      duration: 2
  - raw: '{"ClientAddr":"192.0.2.20:23456","DownstreamContentSize":19,"DownstreamStatus":404,"Duration":486767,"OriginContentSize":19,"OriginDuration":467360,"OriginStatus":404,"RequestHost":"198.51.100.11","RequestMethod":"GET","RequestPath":"/foo/bar/baz.php","RequestPort":"-","RequestProtocol":"HTTP/1.1","RouterName":"service-foo@kubernetescrd","ServiceAddr":"198.51.100.40:1234","StartLocal":"2024-02-02T17:07:08.048870614Z","level":"info","msg":"","time":"2024-02-02T17:07:08Z"}'
    expect:
      class_uid: 4002
      "src_endpoint.ip": "192.0.2.20"
      status_id: 2
  - raw: '{"level":"error","providerName":"docker","error":"net/http: request canceled (Client.Timeout or context cancellation while reading body)","time":"2025-01-14T09:56:51-05:00","caller":"github.com/traefik/traefik/v3/pkg/provider/docker/pdocker.go:157","message":"Provider error, retrying in 443.671239ms"}'
    expect:
      class_uid: 0
      severity_id: 4
  # Bare IPv6 ServiceAddr is never split into a different address plus a port.
  - raw: '{"ClientAddr":"[2001:db8::30]:51544","DownstreamStatus":200,"Duration":1000000,"RequestMethod":"GET","RequestPath":"/","RequestProtocol":"HTTP/1.1","ServiceAddr":"2001:db8::2:8080","StartUTC":"2026-11-21T10:00:00Z","level":"info","msg":""}'
    expect:
      "src_endpoint.ip": "2001:db8::30"
      "src_endpoint.port": 51544
      "dst_endpoint.ip": "2001:db8::2:8080"
      "dst_endpoint.port": "<missing>"
      "dst_endpoint.hostname": "<missing>"
  # JSON that is neither an access log nor an application log is a fallback.
  - raw: '{"foo":"bar"}'
    expect:
      class_uid: 0
      "unmapped.parse_fallback": "unparsable input"
  - raw: 'not a traefik line'
    expect:
      class_uid: 0
      "unmapped.parse_fallback": "unparsable input"
