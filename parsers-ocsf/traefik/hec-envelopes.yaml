# What this parser gets when its log arrives as an HEC (or OTel-style) object
# event; scripts/test_hec_envelopes.py builds the delivery the way nano does and
# checks each case.
cases:
- name: traefik CLF access line wrapped by an HEC sender
  event:
    message: 192.0.2.10 - frank [14/Jan/2025:09:56:51 -0500] "GET /api/v1/items HTTP/1.1" 200 512 "-" "curl/8.5.0" 42 "web@docker" "http://172.18.0.3:80" 3ms
    k8s_pod: traefik-1
  expect:
    class_uid: 4002
    http_request.http_method: GET
    http_response.code: 200
- name: traefik v2 logfmt application line wrapped by an HEC sender
  event:
    message: time="2025-01-14T09:56:51-05:00" level=error msg="Provider connection error" providerName=docker
    k8s_pod: traefik-1
  expect:
    class_uid: 0
    severity_id: 4
- name: traefik v3 JSON application log as an HEC object (its own message)
  event:
    level: error
    providerName: docker
    time: '2025-01-14T09:56:51-05:00'
    message: Provider error, retrying...
  expect:
    class_uid: 0
    severity_id: 4
    time: 1736866611000
