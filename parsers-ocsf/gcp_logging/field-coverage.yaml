source: json
transforms:
- source: timestamp
  kind: epoch_ms
  target: time
  reason: LogEntry timestamp (RFC 3339) converted to event milliseconds.
- source: receiveTimestamp
  kind: epoch_ms
  target: metadata.logged_time
  reason: LogEntry receiveTimestamp (RFC 3339) converted to the logged-time milliseconds.
- source: severity
  kind: enum
  target: severity_id
  values:
    default: 1
    debug: 1
    info: 1
    notice: 2
    warning: 3
    error: 4
    critical: 5
    alert: 5
    emergency: 6
  reason: Cloud Logging LogSeverity normalized to OCSF severity_id; consumed only when that ID is emitted.
consumed_candidates:
- httpRequest.protocol
- httpRequest.referer
- httpRequest.remoteIp
- httpRequest.requestMethod
- httpRequest.requestSize
- httpRequest.requestUrl
- httpRequest.responseSize
- httpRequest.serverIp
- httpRequest.status
- httpRequest.userAgent
- insertId
- jsonPayload.message
- jsonPayload.msg
- jsonPayload.statusDetails
- logName
- operation.id
- protoPayload.authenticationInfo.principalEmail
- protoPayload.methodName
- protoPayload.requestMetadata.callerIp
- protoPayload.requestMetadata.callerSuppliedUserAgent
- protoPayload.resourceName
- protoPayload.serviceName
- protoPayload.status.code
- protoPayload.status.message
- resource.labels.location
- resource.labels.project_id
- resource.labels.region
- resource.labels.zone
- resource.type
- severity
- textPayload
- trace
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
source_normalize:
- kind: base64_json_merge
  path: message.data
  reason: A Pub/Sub push wrapper's base64 LogEntry is the event; its fields spill and are
    redacted while the wrapper keys ride along. Skipped when a decoded key collides.
- kind: withhold
  paths:
  - message.data
  match: '^[\s\S]'
  reason: A Pub/Sub body that is not merged (undecodable, or colliding keys) cannot be
    key-redacted, so it is replaced by its byte length and sha256 (raw_data keeps it).
