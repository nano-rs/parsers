name: gcp_logging_ocsf
display_name: Google Cloud Logging (generic, OCSF)
version: "1.0.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Generic parser for Google Cloud Logging LogEntry records from ANY log
  (Cloud Run, GKE, Compute Engine, App Engine, load balancers, Cloud
  Functions, custom application logs), as exported by a log sink to Pub/Sub
  (decoded by the pull source, or the push-subscription wrapper with a
  base64 `message.data`) or to Cloud Storage / BigQuery as JSON. The common
  LogEntry fields map everywhere: timestamp on time, receiveTimestamp on
  metadata.logged_time, insertId on metadata.uid, logName on
  metadata.log_name, severity (DEFAULT ... EMERGENCY) on severity_id, the
  project and location from resource.labels on cloud, and operation.id on
  metadata.correlation_uid; entry labels and the other resource labels stay
  in `unmapped.labels.*` / `unmapped.resource.*`. The trace id lands on
  trace.uid for the HTTP and API classes (Base Event has no trace
  attribute, so there it stays in unmapped). Classes follow the payload shape. An AuditLog protoPayload that reaches this lane is "API
  Activity" (class_uid 6003) with the core fields mapped, even when it also
  carries `httpRequest` (IAP, API Gateway), whose request then lands on
  http_request; route audit logs to the gcp_audit parser for the full
  mapping. Any other entry with `httpRequest` (load balancer, Cloud Run,
  App Engine request logs) is "HTTP Activity" (class_uid 4002); a bare IPv6
  remoteIp / serverIp is kept whole, a port is read only from `[v6]:port`
  or `v4:port`. With the push wrapper, the decoded LogEntry is the parsed
  source, so its unmapped fields spill as-is and the base64 body is not
  spilled a second time. Everything else
  (textPayload, jsonPayload, other protoPayloads) is "Base Event"
  (class_uid 0): textPayload or jsonPayload.message is the message and the
  rest of jsonPayload passes through under `unmapped.json_payload.*`.
  This parser claims its own source type (`gcp_logging`) and never
  collides with gcp_audit. Non-LogEntry input becomes Base Event with the
  raw body kept and `unmapped.parse_fallback` set. The whole OCSF object is
  emitted on the root.
match_values:
  - gcp_logging
category: cloud
vendor: "Google"
product: "Cloud Logging"
parser_vrl: |
  # NAN source timezone. Generated by scripts/residual_spill.py; edit scripts/residual/source_tz.vrl.
  # The log source's timezone setting arrives as .nano.source_timezone (an IANA
  # name such as "America/New_York", or any fixed offset such as "+05:30"), set
  # by nano at ingest. .nano is nano's input, never part of the log: it is
  # removed whole before anything else, whatever its shape.
  # For a clock that carries no offset a parser parses it AS UTC and sets
  # __lc_pending; the generated local-clock block that follows the parse
  # (local_clock.vrl) turns it into real UTC with this setting, and the spill
  # records the zone used as unmapped.nano_time_assumed_tz (the name, the offset
  # as +HH:MM, or "UTC" when the setting is absent, invalid or "local").
  __src_nano = del(.nano)
  __src_tz_in = ""
  if is_object(__src_nano) { __src_tz_in = strip_whitespace(to_string(object!(__src_nano).source_timezone) ?? "") }
  __src_tz = "UTC"
  __src_shift_ms = 0
  __src_tz_label = "UTC"
  __time_assumed = false
  __time_inline = false
  __lc_pending = false
  # No parse_* decoder here: nano infers a parser's input contract from the first
  # decoder in its program (parse_json first = a JSON-input parser, handed the
  # whole HEC / OTLP object). This prelude opens every parser, so a decoder in it
  # would turn every JSON-input parser into a text one. match + slice instead.
  if match(__src_tz_in, r'^[+-]\d{2}:?\d{2}$') {
      __src_sign = slice(__src_tz_in, 0, 1) ?? "+"
      __src_digits = replace(slice(__src_tz_in, 1) ?? "", ":", "")
      __src_hh = slice(__src_digits, 0, 2) ?? "99"
      __src_mm = slice(__src_digits, 2, 4) ?? "99"
      __src_h = to_int(__src_hh) ?? 99
      __src_m = to_int(__src_mm) ?? 99
      if __src_h <= 14 && __src_m <= 59 {
          __src_shift_ms = (__src_h * 3600 + __src_m * 60) * 1000
          if __src_sign == "-" { __src_shift_ms = 0 - __src_shift_ms }
          if __src_shift_ms != 0 { __src_tz_label = __src_sign + __src_hh + ":" + __src_mm }
      }
  } else if __src_tz_in != "" && downcase(__src_tz_in) != "local" {
      # "local" (the Vector host's zone) would make the time depend on the host.
      __src_probe, __src_probe_err = parse_timestamp("2000-01-01 00:00:00", "%Y-%m-%d %H:%M:%S", timezone: __src_tz_in)
      if __src_probe_err == null { __src_tz = __src_tz_in; __src_tz_label = __src_tz_in }
  }
  # END NAN source timezone
  # Google Cloud Logging LogEntry -> OCSF 1.9.0 HTTP Activity (4002) / API Activity (6003) / Base Event (0)
  raw_log = to_string(.message) ?? ""
  __raw_body = raw_log
  __source_kv = {}

  e = {}
  is_entry = false
  j, jerr = parse_json(raw_log)
  if jerr == null && is_object(j) {
      p = object!(j)
      __source_kv = p
      e = p
      # Pub/Sub push subscription wrapper: {"message": {"data": <base64 LogEntry>, ...}, "subscription": ...}
      pdata = string(get(p, ["message", "data"]) ?? null) ?? ""
      if pdata != "" {
          dec = decode_base64(pdata) ?? ""
          dj, djerr = parse_json(dec)
          if djerr == null && is_object(dj) {
              de = object!(dj)
              # The decoded LogEntry is the source, so its unmapped fields spill as-is;
              # the wrapper's own fields ride along without the base64 body.
              # A decoded key the wrapper also has would be overwritten, so then the
              # wrapper is kept as captured (its base64 body spills as-is) and the
              # record is not mapped from the unmerged body: it falls back as a
              # non-LogEntry.
              w = p
              __discard = del(w.message.data)
              wkeys = keys(w)
              collide = false
              for_each(de) -> |k, _v| { if includes(wkeys, k) { collide = true } }
              if !collide {
                  e = de
                  __source_kv = merge(de, w)
              }
          }
      }
      is_entry = exists(e.logName) || exists(e.insertId) || exists(e.textPayload) || exists(e.jsonPayload) || exists(e.protoPayload) || (exists(e.resource) && exists(e.timestamp))
  }

  product = { "name": "Google Cloud Logging", "vendor_name": "Google" }
  raw_uid = sha2("gcp_logging|raw|" + raw_log, variant: "SHA-256")

  if is_entry {
      resource = object(e.resource) ?? {}
      rlabels = object(resource.labels) ?? {}
      jp = object(e.jsonPayload) ?? {}
      pp = object(e.protoPayload) ?? {}
      hr = object(e.httpRequest) ?? {}

      # ---- time ----
      time_ms = 0
      ts = string(e.timestamp) ?? string(e.receiveTimestamp) ?? ""
      t, terr = parse_timestamp(ts, "%+", timezone: "UTC")
      if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }

      # ---- severity (LogSeverity names) ----
      sev = upcase(string(e.severity) ?? "")
      severity_id = 1
      severity = "Informational"
      if sev == "NOTICE" { severity_id = 2; severity = "Low" }
      if sev == "WARNING" { severity_id = 3; severity = "Medium" }
      if sev == "ERROR" { severity_id = 4; severity = "High" }
      if sev == "CRITICAL" || sev == "ALERT" { severity_id = 5; severity = "Critical" }
      if sev == "EMERGENCY" { severity_id = 6; severity = "Fatal" }

      # ---- cloud: project from resource.labels, else logName ----
      log_name = string(e.logName) ?? ""
      project_id = string(rlabels.project_id) ?? ""
      if project_id == "" {
          lm = parse_regex(log_name, r'^projects/(?P<project>[^/]+)/') ?? {}
          project_id = string(lm.project) ?? ""
      }
      cloud = { "provider": "GCP" }
      if project_id != "" {
          cloud.project_uid = project_id
          cloud.account = { "uid": project_id }
      }
      zone = string(rlabels.zone) ?? ""
      location = string(rlabels.location) ?? string(rlabels.region) ?? ""
      if zone != "" { cloud.zone = zone }
      if location != "" { cloud.region = location } else if zone != "" { cloud.region = zone }

      profiles = ["cloud"]
      metadata = {
          "version": "1.9.0",
          "uid": raw_uid,
          "log_name": "cloud_logging",
          "log_provider": "Google Cloud Logging",
          "product": product
      }
      insert_id = string(e.insertId) ?? ""
      if insert_id != "" { metadata.uid = insert_id }
      if log_name != "" { metadata.log_name = log_name }
      if sev != "" { metadata.log_level = string(e.severity) ?? sev }
      rts = string(e.receiveTimestamp) ?? ""
      if rts != "" {
          rt, rterr = parse_timestamp(rts, "%+", timezone: "UTC")
          if rterr == null { metadata.logged_time = to_unix_timestamp(rt, unit: "milliseconds") }
      }
      op_id = string(get(e, ["operation", "id"]) ?? null) ?? ""
      if op_id != "" { metadata.correlation_uid = op_id }

      # ---- trace: "projects/<p>/traces/<id>" or a bare id ----
      trace_s = string(e.trace) ?? ""
      trace_id = trace_s
      tm = parse_regex(trace_s, r'/traces/(?P<id>[^/]+)$') ?? {}
      if exists(tm.id) { trace_id = string(tm.id) ?? trace_s }

      msg = string(e.textPayload) ?? string(jp.message) ?? string(jp.msg) ?? ""

      is_audit = ends_with(string(get(pp, ["@type"]) ?? null) ?? "", "google.cloud.audit.AuditLog")

      # ---- httpRequest endpoints: a bare IPv4/IPv6 address is taken as is; a
      # host:port form needs IPv6 in brackets, so a bare IPv6 is never split.
      hr_src = {}
      rip = string(hr.remoteIp) ?? ""
      rport = 0
      if !is_ipv4(rip) && !is_ipv6(rip) {
          rmm = parse_regex(rip, r'^(?:\x5B(?P<ip6>[^\x5D]+)\x5D(?::(?P<port6>\d+))?|(?P<ip4>[^:\x5B\x5D]+):(?P<port>\d+))$') ?? {}
          rip = string(rmm.ip6) ?? string(rmm.ip4) ?? ""
          rport = to_int(string(rmm.port6) ?? string(rmm.port) ?? "") ?? 0
      }
      if is_ipv4(rip) || is_ipv6(rip) {
          hr_src = { "ip": downcase(rip) }
          if rport > 0 { hr_src.port = rport }
      }
      hr_dst = {}
      sip = string(hr.serverIp) ?? ""
      sport = 0
      if !is_ipv4(sip) && !is_ipv6(sip) {
          smm = parse_regex(sip, r'^(?:\x5B(?P<ip6>[^\x5D]+)\x5D(?::(?P<port6>\d+))?|(?P<ip4>[^:\x5B\x5D]+):(?P<port>\d+))$') ?? {}
          sip = string(smm.ip6) ?? string(smm.ip4) ?? ""
          sport = to_int(string(smm.port6) ?? string(smm.port) ?? "") ?? 0
      }
      if is_ipv4(sip) || is_ipv6(sip) {
          hr_dst = { "ip": downcase(sip) }
          if sport > 0 { hr_dst.port = sport }
      }

      # ---- httpRequest -> http_request / http_response (shared by 4002 and 6003) ----
      method = upcase(string(hr.requestMethod) ?? "")
      http_activity_id = 99
      http_activity_name = "Other"
      if method == "CONNECT" { http_activity_id = 1; http_activity_name = "Connect" }
      if method == "DELETE"  { http_activity_id = 2; http_activity_name = "Delete" }
      if method == "GET"     { http_activity_id = 3; http_activity_name = "Get" }
      if method == "HEAD"    { http_activity_id = 4; http_activity_name = "Head" }
      if method == "OPTIONS" { http_activity_id = 5; http_activity_name = "Options" }
      if method == "POST"    { http_activity_id = 6; http_activity_name = "Post" }
      if method == "PUT"     { http_activity_id = 7; http_activity_name = "Put" }
      if method == "TRACE"   { http_activity_id = 8; http_activity_name = "Trace" }
      if method == "PATCH"   { http_activity_id = 9; http_activity_name = "Patch" }

      url_obj = {}
      req_url = string(hr.requestUrl) ?? ""
      if req_url != "" {
          u, uerr = parse_url(req_url)
          if uerr == null {
              url_obj.url_string = req_url
              if u.scheme != "" { url_obj.scheme = u.scheme }
              uh = string(u.host) ?? ""
              if uh != "" { url_obj.hostname = downcase(uh) }
              if u.path != "" { url_obj.path = u.path }
              up = to_int(u.port)
              if up > 0 { url_obj.port = up }
              qs = split(req_url, "?", limit: 2)
              if length(qs) == 2 && (string(qs[1]) ?? "") != "" { url_obj.query_string = string(qs[1]) ?? "" }
          } else {
              qs = split(req_url, "?", limit: 2)
              url_obj.path = string(qs[0]) ?? "/"
              if length(qs) == 2 && (string(qs[1]) ?? "") != "" { url_obj.query_string = string(qs[1]) ?? "" }
          }
      }
      if !exists(url_obj.path) && !exists(url_obj.url_string) { url_obj.path = "/" }

      code = to_int(hr.status) ?? 0
      http_status_id = 0
      http_status_str = "Unknown"
      if code >= 100 && code < 400 { http_status_id = 1; http_status_str = "Success" }
      if code >= 400 { http_status_id = 2; http_status_str = "Failure" }

      http_request = { "url": url_obj }
      if method != "" { http_request.http_method = method }
      ua = string(hr.userAgent) ?? ""
      if ua != "" { http_request.user_agent = ua }
      ref = string(hr.referer) ?? ""
      if ref != "" { http_request.referrer = ref }
      proto = string(hr.protocol) ?? ""
      if proto != "" { http_request.version = proto }
      req_size = to_int(hr.requestSize) ?? 0
      if req_size > 0 { http_request.length = req_size }

      resp_size = to_int(hr.responseSize) ?? 0
      http_response = { "code": code }
      if code > 0 { http_response.status = http_status_str }
      if resp_size > 0 { http_response.length = resp_size }
      status_details = string(jp.statusDetails) ?? ""
      if status_details != "" { http_response.message = status_details }

      ocsf = {}
      if is_audit {
          # ---------------- API Activity (6003): AuditLog on the generic lane ----------------
          method_name = string(pp.methodName) ?? ""
          mparts = split(method_name, ".")
          verb = downcase(string(get(mparts, [length(mparts) - 1]) ?? null) ?? "")
          activity_id = 99
          activity_name = "Other"
          if starts_with(verb, "create") || starts_with(verb, "insert") { activity_id = 1; activity_name = "Create" }
          if starts_with(verb, "get") || starts_with(verb, "list") || starts_with(verb, "read") { activity_id = 2; activity_name = "Read" }
          if starts_with(verb, "update") || starts_with(verb, "patch") || starts_with(verb, "set") { activity_id = 3; activity_name = "Update" }
          if starts_with(verb, "delete") || starts_with(verb, "remove") { activity_id = 4; activity_name = "Delete" }

          # Outcome as gcp_audit reads it: a non-zero status.code, or a first
          # authorizationInfo entry with granted == false, is a failure.
          scode = to_int(get(pp, ["status", "code"]) ?? 0) ?? 0
          status_id = 1
          status_str = "Success"
          granted = get(pp, ["authorizationInfo", 0, "granted"]) ?? null
          if scode > 0 || granted == false { status_id = 2; status_str = "Failure" }

          principal = string(get(pp, ["authenticationInfo", "principalEmail"]) ?? null) ?? ""
          user = { "name": "unknown" }
          if principal != "" {
              user = { "name": principal }
              if contains(principal, "@") { user.email_addr = principal }
          }
          caller_ip = string(get(pp, ["requestMetadata", "callerIp"]) ?? null) ?? ""
          src = { "ip": "0.0.0.0" }
          if is_ipv4(caller_ip) || is_ipv6(caller_ip) { src = { "ip": downcase(caller_ip) } } else if caller_ip != "" { src = { "ip": "0.0.0.0", "hostname": caller_ip } } else if length(hr_src) > 0 { src = hr_src }
          api_obj = { "operation": method_name, "service": { "name": string(pp.serviceName) ?? "unknown" } }
          if method_name == "" { api_obj.operation = "Unknown" }

          ocsf = {
              "class_uid": 6003,
              "class_name": "API Activity",
              "category_uid": 6,
              "category_name": "Application Activity",
              "activity_id": activity_id,
              "activity_name": activity_name,
              "type_uid": 600300 + activity_id,
              "status_id": status_id,
              "status": status_str,
              "api": api_obj,
              "actor": { "user": user },
              "src_endpoint": src
          }
          if scode > 0 { ocsf.status_code = to_string(scode) }
          smsg = string(get(pp, ["status", "message"]) ?? null) ?? ""
          if smsg != "" { ocsf.status_detail = smsg }
          rname = string(pp.resourceName) ?? ""
          if rname != "" {
              res = { "uid": rname, "name": rname }
              rtype = string(resource.type) ?? ""
              if rtype != "" { res.type = rtype }
              ocsf.resources = [res]
          }
          cua = string(get(pp, ["requestMetadata", "callerSuppliedUserAgent"]) ?? null) ?? ""
          # An audit entry that also carries httpRequest (IAP, API Gateway, Data Access)
          # keeps its request on http_request; the class stays API Activity.
          if length(hr) > 0 {
              ocsf.http_request = http_request
              if length(hr_dst) > 0 { ocsf.dst_endpoint = hr_dst }
          }
          if cua != "" { ocsf.http_request = set!(object(ocsf.http_request) ?? {}, ["user_agent"], cua) }
      } else if length(hr) > 0 {
          # ---------------- HTTP Activity (4002) ----------------
          ocsf = {
              "class_uid": 4002,
              "class_name": "HTTP Activity",
              "category_uid": 4,
              "category_name": "Network Activity",
              "activity_id": http_activity_id,
              "activity_name": http_activity_name,
              "type_uid": 400200 + http_activity_id,
              "status_id": http_status_id,
              "status": http_status_str,
              "http_request": http_request,
              "http_response": http_response
          }
          # latency is a protobuf Duration string ("0.005250797s").
          lat = string(hr.latency) ?? ""
          lm2 = parse_regex(lat, r'^(?P<s>[0-9.]+)s$') ?? {}
          if exists(lm2.s) { ocsf.duration = to_int(round((to_float(lm2.s) ?? 0.0) * 1000.0)) }
          # OCSF 1.9 network_traffic: bytes_in = destination -> source (response to the client).
          if resp_size > 0 || req_size > 0 {
              ocsf.traffic = {}
              if resp_size > 0 { ocsf.traffic.bytes_in = resp_size }
              if req_size > 0 { ocsf.traffic.bytes_out = req_size }
          }
          if length(hr_src) > 0 { ocsf.src_endpoint = hr_src }
          if length(hr_dst) > 0 { ocsf.dst_endpoint = hr_dst }
      } else {
          # ---------------- Base Event (0) ----------------
          ocsf = {
              "class_uid": 0,
              "class_name": "Base Event",
              "category_uid": 0,
              "category_name": "Uncategorized",
              "activity_id": 99,
              "activity_name": "Other",
              "type_uid": 99,
              "status_id": 0,
              "status": "Unknown"
          }
      }

      ocsf.severity_id = severity_id
      ocsf.severity = severity
      ocsf.time = time_ms
      ocsf.raw_data = raw_log
      ocsf.cloud = cloud
      if msg != "" { ocsf.message = msg }
      # trace is profile-bound and not defined on Base Event; there it stays in unmapped.
      if trace_id != "" && ocsf.class_uid != 0 {
          ocsf.trace = { "uid": trace_id }
          profiles = push(profiles, "trace")
      }
      metadata.profiles = profiles
      ocsf.metadata = metadata
      . = ocsf
  } else {
      # ---------------- Base Event (0): not a LogEntry ----------------
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 99,
          "activity_name": "Other",
          "type_uid": 99,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": 0,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": raw_uid,
              "profiles": ["cloud"],
              "log_name": "cloud_logging",
              "log_level": "error",
              "product": product
          },
          "cloud": { "provider": "GCP" }
      }
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      . = set!(., ["unmapped", "parse_fallback"], "unparsable input")
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # Values spill exactly as parsed: a parser never masks, redacts or withholds
  # anything (masking is an opt-in pipeline step, never a parser concern).
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # A source field is consumed ONLY by an explicit mapping: a field-coverage.yaml
  # `mappings` entry (source key -> target paths) or a `transforms` rule with a
  # target, whose value is found AT THAT TARGET PATH of the selected branch. A
  # value that merely appears somewhere else in the event never consumes a field
  # (no coincidental consumption); everything else spills.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The sets below are strings instead
  # (a read shares the buffer). __repr holds one member per mapped leaf:
  # "," + encode_json(path) + "=" + encode_json(encode_json(value)), plus the
  # to_string form for a string or a float, so a numeric string is represented by
  # its typed scalar. Every part is a JSON text, inside which a '"' is always
  # escaped, so a member is matched exactly. Paths drop array indices
  # (resources.0.uid is resources.uid); arrays are walked two levels deep, and a
  # leaf deeper than that is simply not mapping evidence (it can only spill more).
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped = object!(parse_json!(encode_json(__mapped)))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __copy = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __repr = ""
  for_each(flatten(__mapped)) -> |path, value| {
      __p = encode_json(path)
      if is_array(value) {
          for_each(array!(value)) -> |_i, item| {
              if is_object(item) {
                  for_each(flatten(object!(item))) -> |sub, leaf| {
                      __q = encode_json(path + "." + sub)
                      if is_array(leaf) {
                          for_each(array!(leaf)) -> |_j, x| {
                              if !is_object(x) && !is_array(x) {
                                  __repr = __repr + ("," + __q + "=" + encode_json(encode_json(x)))
                                  if is_string(x) || is_float(x) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(x))) }
                              }
                          }
                      } else {
                          __repr = __repr + ("," + __q + "=" + encode_json(encode_json(leaf)))
                          if is_string(leaf) || is_float(leaf) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(leaf))) }
                      }
                  }
              } else if !is_array(item) {
                  __repr = __repr + ("," + __p + "=" + encode_json(encode_json(item)))
                  if is_string(item) || is_float(item) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(item))) }
              }
          }
      } else {
          __repr = __repr + ("," + __p + "=" + encode_json(encode_json(value)))
          if is_string(value) || is_float(value) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(value))) }
      }
  }
  __consumed = ""
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__copy.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # BEGIN parser-specific transformations
  # timestamp: LogEntry timestamp (RFC 3339) converted to event milliseconds.
  # receiveTimestamp: LogEntry receiveTimestamp (RFC 3339) converted to the logged-time milliseconds.
  # severity: Cloud Logging LogSeverity normalized to OCSF severity_id; consumed only when that ID is emitted.
  for_each(__flat) -> |key, value| {
      if match(key, r'(?x)
      \A(?:
        timestamp
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%+", timezone: "UTC")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              if contains(__repr, "," + "\"time\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        receiveTimestamp
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%+", timezone: "UTC")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              if contains(__repr, "," + "\"metadata.logged_time\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        severity
      )\z') {
          __value = value
          if __value != null {
              __expected = get!({"default": 1, "debug": 1, "info": 1, "notice": 2, "warning": 3, "error": 4, "critical": 5, "alert": 5, "emergency": 6}, [downcase(to_string(__value) ?? "")])
              if __expected != null {
                  if contains(__repr, "," + "\"severity_id\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
              }
          }
      }
  }
  # Declared source -> target mappings (field-coverage.yaml `mappings`).
  __decl = "\n\"httpRequest.protocol\"\t[\"http_request.version\"]\n\"httpRequest.remoteIp\"\t[\"src_endpoint.ip\"]\n\"httpRequest.requestMethod\"\t[\"http_request.http_method\"]\n\"httpRequest.requestSize\"\t[\"http_request.length\",\"traffic.bytes_out\"]\n\"httpRequest.requestUrl\"\t[\"http_request.url.url_string\"]\n\"httpRequest.responseSize\"\t[\"http_response.length\",\"traffic.bytes_in\"]\n\"httpRequest.serverIp\"\t[\"dst_endpoint.ip\"]\n\"httpRequest.status\"\t[\"http_response.code\"]\n\"httpRequest.userAgent\"\t[\"http_request.user_agent\"]\n\"insertId\"\t[\"metadata.uid\"]\n\"logName\"\t[\"metadata.log_name\"]\n\"resource.labels.location\"\t[\"cloud.region\"]\n\"resource.labels.project_id\"\t[\"cloud.account.uid\",\"cloud.project_uid\"]\n\"resource.type\"\t[\"resources.type\"]\n\"severity\"\t[\"metadata.log_level\"]\n\"textPayload\"\t[\"message\"]\n\"protoPayload.authenticationInfo.principalEmail\"\t[\"actor.user.email_addr\",\"actor.user.name\"]\n\"protoPayload.methodName\"\t[\"api.operation\"]\n\"protoPayload.resourceName\"\t[\"resources.name\",\"resources.uid\"]\n\"protoPayload.serviceName\"\t[\"api.service.name\"]\n\"resource.labels.zone\"\t[\"cloud.region\",\"cloud.zone\"]\n\"protoPayload.requestMetadata.callerIp\"\t[\"src_endpoint.ip\"]\n\"protoPayload.requestMetadata.callerSuppliedUserAgent\"\t[\"http_request.user_agent\"]\n\"operation.id\"\t[\"metadata.correlation_uid\"]\n\"resource.labels.region\"\t[\"cloud.region\"]\n\"jsonPayload.message\"\t[\"message\"]\n\"jsonPayload.statusDetails\"\t[\"http_response.message\"]\n\"httpRequest.referer\"\t[\"http_request.referrer\"]\n"
  __preserve = []
  # END parser-specific transformations
  # Declared mappings: __decl holds "\n" + encode_json(key) + "\t" + JSON array of
  # target paths + "\n" per mapped source key (a raw newline never occurs in
  # compact JSON). A key is consumed when its value, or every element of a scalar
  # array, is at one of its own targets. Keys stay ESCAPED here and in __consumed:
  # a literal dotted key ("a~1b") and the nested path ("a.b") are different
  # fields, and mapping one never consumes the other.
  for_each(__flat) -> |key, value| {
      # __decl spells a bracket inside a key as a \u escape (deploy bracket count).
      __kt = encode_json(key)
      if match(__kt, r'[\x28\x29\x5B\x5D\x7B\x7D]') {
          __kt = replace(replace(replace(replace(replace(replace(__kt, r'\x28', "\\u0028"), r'\x29', "\\u0029"), r'\x5B', "\\u005b"), r'\x5D', "\\u005d"), r'\x7B', "\\u007b"), r'\x7D', "\\u007d")
      }
      __at = find(__decl, "\n" + __kt + "\t")
      if is_integer(__at) && !is_object(value) {
          __rest = slice!(__decl, int!(__at) + strlen(__kt) + 2)
          __hit = false
          for_each(array!(parse_json!(slice!(__rest, 0, int!(find(__rest, "\n")))))) -> |_i, target| {
              __tok = "," + encode_json(target) + "="
              if !__hit && is_array(value) {
                  __all = !is_empty(array!(value))
                  for_each(array!(value)) -> |_j, item| {
                      if __all {
                          __all = !is_object(item) && !is_array(item) && (contains(__repr, __tok + encode_json(encode_json(item))) || ((is_string(item) || is_float(item)) && contains(__repr, __tok + encode_json(to_string!(item)))))
                      }
                  }
                  __hit = __all
              } else if !__hit {
                  __hit = contains(__repr, __tok + encode_json(encode_json(value))) || ((is_string(value) || is_float(value)) && contains(__repr, __tok + encode_json(to_string!(value))))
              }
          }
          if __hit { __consumed = __consumed + ("," + encode_json(key)) }
      }
  }
  # Fast path: when no two source keys decode to the same key and no two spilled
  # keys get the same name, each key's decision depends only on its own value, so
  # one filter and one rename build the residual without copying it per key.
  __distinct = true
  if __tilde {
      __distinct = length(map_keys(__flat) -> |key| { replace(replace(key, "~1", "."), "~0", "~") }) == length(__flat)
  }
  __kept = {}
  __names = {}
  if __distinct {
      __kept = filter(__flat) -> |key, value| {
          # A key is kept unless an explicit mapping or transformation consumed it.
          # Do not spill a copy of the raw body.
          value != __raw_body && !contains(__consumed, "," + encode_json(key))
      }
      __names = map_keys(__kept) -> |key| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          join!(__parts, ".")
      }
  }
  __residual = {}
  if __distinct && length(__names) == length(__kept) {
      __residual = map_values(__names) -> |value| {
          if is_array(value) || is_object(value) {
              if __tilde {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              if __complex { value = encode_json(value) }
          }
          value
      }
  } else {
      # Slow path: two spilled keys get the same name. A literal dotted key and a
      # nested path read alike ({"a.b": 1, "a": {"b": 2}} is "a.b" twice), and so
      # do keys that only snake-case alike ("userName", "user_name").
      # NAN-5894: a literal dotted key whose name is shared keeps its dots
      # escaped, RFC 6901 style ("a~1b", a "~" in it as "~0"), and the key
      # without a literal dot keeps "a.b". That is the name nano's ingest step
      # gives the flat key when no parser runs, so the name never depends on
      # whether a parser read the event, and it cannot clash with a vendor key
      # that is really named "b_2". A key is escaped only when its escaped name
      # is unique too (two flat keys that only snake-case alike escape to the
      # same name, so escaping would not tell them apart). Only a name still
      # taken after that gets the next free _2, _3, ... suffix, in key order:
      # keys that differ only in case or snake-casing, or a vendor key already
      # spelled "a~1b" (nothing is ever dropped).
      __spilled = filter(__flat) -> |key, value| {
          value != __raw_body && !contains(__consumed, "," + encode_json(key))
      }
      __plain = map_values(keys(__spilled)) -> |key| {
          key = replace(replace(string!(key), "~1", "."), "~0", "~")
          join!(map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }, ".")
      }
      __shared = filter(tally!(__plain)) -> |_name, count| { count > 1 }
      __shared = "\n" + join!(map_values(keys(__shared)) -> |name| { encode_json(name) }, "\n") + "\n"
      # The escaped name of each literal dotted key ("" for any other key).
      __escaped_names = map_values(keys(__spilled)) -> |key| {
          key = string!(key)
          if contains(key, "~1") {
              join!(map_values(split(key, ".")) -> |segment| {
                  join!(map_values(split(string!(segment), "~1")) -> |piece| {
                      replace(snakecase(replace(string!(piece), "~0", "~")), "~", "~0")
                  }, "~1")
              }, ".")
          } else { "" }
      }
      __escaped_shared = filter(tally!(__escaped_names)) -> |_name, count| { count > 1 }
      __escaped_shared = "\n" + join!(map_values(keys(__escaped_shared)) -> |name| { encode_json(name) }, "\n") + "\n"
      for_each(__flat) -> |key, value| {
          __token = "," + encode_json(key)
          __escaped_key = key
          key = replace(replace(key, "~1", "."), "~0", "~")
          if is_array(value) || is_object(value) {
              value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                  replace(replace(inner, "~1", "."), "~0", "~")
              }, ["v"])
          }
          if !contains(__consumed, __token) && value != __raw_body {
              __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
              __base = join!(__parts, ".")
              if contains(__escaped_key, "~1") && contains(__shared, "\n" + encode_json(__base) + "\n") {
                  __escaped_name = join!(map_values(split(__escaped_key, ".")) -> |segment| {
                      join!(map_values(split(string!(segment), "~1")) -> |piece| {
                          replace(snakecase(replace(string!(piece), "~0", "~")), "~", "~0")
                      }, "~1")
                  }, ".")
                  if !contains(__escaped_shared, "\n" + encode_json(__escaped_name) + "\n") { __base = __escaped_name }
              }
              __key = __base
              __suffix = 2
              if includes(keys(__residual), __key) {
                  for_each(__flat) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __key) {
                          __key = __base + "_" + to_string(__suffix)
                          __suffix = __suffix + 1
                      }
                  }
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              __spill = if __complex { encode_json(value) } else { value }
              __residual = set!(__residual, [__key], __spill)
          }
      }
  }
  # Names nano owns in unmapped (the parser markers and the reserved nano.*
  # namespace) are never taken by a source field: a vendor key with such a name
  # is kept, renamed source_<name>, so a log cannot forge a marker. An escaped
  # flat key ("nano~1x", NAN-5894) is renamed the same way as "nano.x".
  if match(encode_json(keys(__residual)), r'"nano(?:"|\.|~1|_time_assumed_tz"|_time_source"|_operational")') {
      for_each(object!(__residual)) -> |key, value| {
          if includes(["nano", "nano_time_assumed_tz", "nano_time_source", "nano_operational"], key) || starts_with(key, "nano.") || starts_with(key, "nano~1") {
              # source_<name>, or the next free _2, _3, ... when a vendor key
              # already holds that name: nothing is lost.
              __rk = "source_" + key
              __rn = 2
              if includes(keys(__residual), __rk) {
                  for_each(__residual) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __rk) {
                          __rk = "source_" + key + "_" + to_string(__rn)
                          __rn = __rn + 1
                      }
                  }
              }
              __residual = remove!(__residual, [key])
              __residual = set!(__residual, [__rk], value)
          }
      }
  }
  # Keep existing derived evidence, but remove null placeholders and copies of a
  # source value (that value is mapped or spilled above under its source path).
  # A value merely equal to some mapped attribute is kept: equality with an
  # unrelated attribute is no evidence that it is represented.
  # The canonical source spill above is the authoritative representation of
  # containers. The cheap conditions run first; the source value set is built on
  # first use.
  __original_values = null
  for_each(flatten(__existing)) -> |key, value| {
      if !is_null(value) && value != "" && !is_array(value) && !is_object(value) && value != __raw_body {
          # Members for the value itself and for to_string(value), as above.
          __json = encode_json(value)
          __as_json = "," + encode_json(__json)
          __as_string = __as_json
          if is_string(value) { __as_string = "," + __json } else if is_float(value) { __as_string = "," + encode_json(to_string!(value)) }
          if __original_values == null {
              # __source_kv may hold non-JSON types (a timestamp), so only an
              # integer or a boolean skips its to_string member here.
              __original_values = join!(map_values(values(flatten(__source_kv))) -> |source_value| {
                  __source_json = encode_json(source_value)
                  __tokens = "," + encode_json(__source_json)
                  if is_string(source_value) {
                      __tokens = __tokens + "," + __source_json
                  } else if !is_object(source_value) && !is_array(source_value) && !is_integer(source_value) && !is_boolean(source_value) {
                      __tokens = __tokens + "," + encode_json(to_string(source_value) ?? "")
                  }
                  __tokens
              }, "")
          }
          __source_set = string!(__original_values)
          __keep = !contains(__source_set, __as_json) && !contains(__source_set, __as_string)
          # Only text opening an object or an array (after JSON whitespace)
          # decodes to a container.
          if __keep && is_string(value) && match(string!(value), r'^[ \t\n\r]*[\x5B\x7B]') {
              __decoded, __decode_err = parse_json(string!(value))
              __keep = !(__decode_err == null && (is_object(__decoded) || is_array(__decoded)))
          }
          if __keep {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, as-is. These
  # entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__copy.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  if __time_assumed && !__time_inline { __residual = set!(__residual, ["nano_time_assumed_tz"], __src_tz_label) }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

samples:
  - raw: '{"insertId":"66be5f8c000a8c5b2d9f3c1a","httpRequest":{"requestMethod":"GET","requestUrl":"https://hello-abc123-uc.a.run.app/api/items?page=2","requestSize":"372","status":200,"responseSize":"1012","userAgent":"curl/8.4.0","remoteIp":"203.0.113.10","serverIp":"198.51.100.53","latency":"0.005250797s","protocol":"HTTP/1.1"},"resource":{"type":"cloud_run_revision","labels":{"service_name":"hello","location":"us-central1","project_id":"example-project","revision_name":"hello-00001-abc","configuration_name":"hello"}},"timestamp":"2026-11-21T10:00:01.120Z","severity":"INFO","labels":{"instanceId":"00f8a1b2c3"},"logName":"projects/example-project/logs/run.googleapis.com%2Frequests","trace":"projects/example-project/traces/4bf92f3577b34da6a3ce929d0e0e4736","receiveTimestamp":"2026-11-21T10:00:01.300Z"}'
    expect:
      class_uid: 4002
      activity_id: 3
      "http_response.code": 200
      "cloud.project_uid": "example-project"
      "trace.uid": "4bf92f3577b34da6a3ce929d0e0e4736"
      duration: 5
  - raw: '{"textPayload":"Wed Apr 15 20:40:51 CEST 2015 Hello, world!","insertId":"2015-04-15|11:41:00.577447-07|192.0.2.198|-1694494956","timestamp":"2015-04-15T18:40:56Z","severity":"WARNING","logName":"projects/example-project/logs/helloworld.log"}'
    expect:
      class_uid: 0
      severity_id: 3
      message: "Wed Apr 15 20:40:51 CEST 2015 Hello, world!"
  # Bare IPv6 remoteIp / serverIp are never split at their last colon.
  - raw: '{"insertId":"v6-0001","httpRequest":{"requestMethod":"GET","requestUrl":"https://www.example.com/","status":200,"remoteIp":"2001:db8::1","serverIp":"2001:db8::2:8080"},"resource":{"type":"http_load_balancer","labels":{"project_id":"example-project"}},"timestamp":"2026-11-21T10:10:00Z","severity":"INFO","logName":"projects/example-project/logs/requests"}'
    expect:
      class_uid: 4002
      "src_endpoint.ip": "2001:db8::1"
      "src_endpoint.port": "<missing>"
      "dst_endpoint.ip": "2001:db8::2:8080"
      "dst_endpoint.port": "<missing>"
  # An AuditLog with httpRequest stays API Activity; a first authorizationInfo with granted false fails.
  - raw: '{"protoPayload":{"@type":"type.googleapis.com/google.cloud.audit.AuditLog","authenticationInfo":{"principalEmail":"bob@example.com"},"serviceName":"iap.googleapis.com","methodName":"AuthorizeUser","authorizationInfo":[{"resource":"projects/example-project/iap_web/compute/services/web","permission":"iap.webServiceVersions.accessViaIAP","granted":false}],"resourceName":"projects/example-project/iap_web/compute/services/web"},"httpRequest":{"requestMethod":"GET","requestUrl":"https://app.example.com/admin","remoteIp":"203.0.113.21","userAgent":"Mozilla/5.0"},"insertId":"iap-0001","resource":{"type":"gce_backend_service","labels":{"project_id":"example-project"}},"timestamp":"2026-11-21T10:11:00Z","severity":"INFO","logName":"projects/example-project/logs/cloudaudit.googleapis.com%2Fdata_access"}'
    expect:
      class_uid: 6003
      status_id: 2
      "actor.user.name": "bob@example.com"
      "src_endpoint.ip": "203.0.113.21"
      "http_request.http_method": "GET"
  - raw: 'not a log entry'
    expect:
      class_uid: 0
      "unmapped.parse_fallback": "unparsable input"
