name: defender_for_cloud_ocsf
display_name: Microsoft Defender for Cloud (OCSF)
version: "1.0.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses Microsoft Defender for Cloud (formerly Azure Security Center) security
  alerts and recommendations, one JSON record per event, as delivered by
  continuous export to Event Hubs or a Log Analytics workspace, the alerts REST
  API and the Logic App / workflow automation trigger, into complete OCSF 1.9.0
  records:
    security alert (AlertDisplayName / properties.alertDisplayName /
    SecurityAlert row)                    -> Detection Finding 2004
    assessment, sub-assessment
    (recommendation), regulatory
    compliance assessment                 -> Compliance Finding 2003
    secure score / secure score control   -> Base Event 0 (a posture metric)
  Field names differ in case between delivery paths, so the mapping reads a
  lower-cased copy and the original record is what the residual spill keeps.
  Alerts carry SystemAlertId as finding_info.uid, AlertType as the analytic,
  intent / techniques as ATT&CK attacks, the affected Azure resource on
  resources[], and the ip / host / account / process / file entities on
  evidences[] (one evidence per entity; Log Analytics rows that carry Entities,
  Techniques or Tactics as JSON text are decoded; hex and decimal process ids).
  Alert severity High / Medium / Low / Informational maps to the
  OCSF severity; status Active / New -> New, InProgress -> In Progress,
  Dismissed -> Suppressed, Resolved -> Resolved. Assessments map status
  Healthy / Passed -> Pass, Unhealthy / Failed -> Fail, NotApplicable / Skipped
  -> Other on compliance, with the recommendation severity applied only to a
  failing resource; the regulatory standard and control come from the record
  id. The continuous-export Insert / Write / Delete action is the activity
  (Create / Update / Close). An Event Hubs `{"records": [...]}` envelope is
  exploded upstream (one record per event); one that reaches the lane anyway is
  kept whole as a Base Event with unmapped.parse_fallback. Distinct from the
  defender_xdr and defender_edr parsers, and from Defender for Cloud alerts that
  arrive inside the Azure Activity Log (azure_monitor). Samples come from the
  Elastic microsoft_defender_cloud pipeline fixtures and the Microsoft Defender
  for Cloud alert schema docs, with documentation identifiers.
match_values:
  - defender_for_cloud
category: cloud
vendor: "Microsoft"
product: "Defender for Cloud"
parser_vrl: |
  # NAN source timezone. Generated by scripts/residual_spill.py; edit scripts/residual/source_tz.vrl.
  # The log source's timezone setting arrives as .nano.source_timezone (an IANA
  # name such as "America/New_York", or any fixed offset such as "+05:30"), set
  # by nano at ingest. .nano is nano's input, never part of the log: it is
  # removed whole before anything else, whatever its shape.
  # For a clock that carries no offset a parser parses it AS UTC and sets
  # __lc_pending; the generated local-clock block that follows the parse
  # (local_clock.vrl) turns it into real UTC with this setting, and the spill
  # records the zone used as unmapped.nano_time_assumed_tz (the name, the offset
  # as +HH:MM, or "UTC" when the setting is absent, invalid or "local").
  __src_nano = del(.nano)
  __src_tz_in = ""
  if is_object(__src_nano) { __src_tz_in = strip_whitespace(to_string(object!(__src_nano).source_timezone) ?? "") }
  __src_tz = "UTC"
  __src_shift_ms = 0
  __src_tz_label = "UTC"
  __time_assumed = false
  __time_inline = false
  __lc_pending = false
  __src_off = parse_regex(__src_tz_in, r'^(?P<sign>[+-])(?P<h>\d{2}):?(?P<m>\d{2})$') ?? {}
  if !is_empty(__src_off) {
      __src_h = to_int(__src_off.h) ?? 99
      __src_m = to_int(__src_off.m) ?? 99
      if __src_h <= 14 && __src_m <= 59 {
          __src_shift_ms = (__src_h * 3600 + __src_m * 60) * 1000
          if __src_off.sign == "-" { __src_shift_ms = 0 - __src_shift_ms }
          if __src_shift_ms != 0 { __src_tz_label = string!(__src_off.sign) + string!(__src_off.h) + ":" + string!(__src_off.m) }
      }
  } else if __src_tz_in != "" && downcase(__src_tz_in) != "local" {
      # "local" (the Vector host's zone) would make the time depend on the host.
      __src_probe, __src_probe_err = parse_timestamp("2000-01-01 00:00:00", "%Y-%m-%d %H:%M:%S", timezone: __src_tz_in)
      if __src_probe_err == null { __src_tz = __src_tz_in; __src_tz_label = __src_tz_in }
  }
  # END NAN source timezone
  # Microsoft Defender for Cloud (formerly Azure Security Center) -> OCSF 1.9.0
  #   security alert (continuous export / Event Hubs, alerts REST API and Logic
  #   App trigger `properties` shape, Log Analytics SecurityAlert row)
  #                                      -> Detection Finding 2004
  #   assessment / sub-assessment (recommendation), regulatory compliance
  #   assessment                         -> Compliance Finding 2003
  #   secure score / secure score control -> Base Event 0 (a posture metric)
  # Field names differ in case between delivery paths (AlertDisplayName vs
  # alertDisplayName, Status.Code vs status.code), so lookups read a
  # lower-cased copy; the original record is what the residual spill sees.
  raw_log = to_string(.message) ?? ""
  __raw_body = raw_log
  __source_kv = {}

  parsed, err = parse_json(raw_log)
  p = {}
  ok = false
  if err == null && is_object(parsed) {
      p = object!(parsed)
      ok = true
  }
  __source_kv = p

  t = {}
  if ok { t = map_keys(p, recursive: true) -> |k| { downcase(k) } }
  props = object(t.properties) ?? {}
  r = merge(t, props)
  rtype = downcase(string(t.type) ?? "")

  kind = ""
  if ok {
      if exists(t.records) {
          kind = "envelope"
      } else if contains(rtype, "securescore") {
          kind = "score"
      } else if contains(rtype, "regulatorycompliance") {
          kind = "regulatory"
      } else if contains(rtype, "microsoft.security/assessments") {
          kind = "assessment"
      } else if contains(rtype, "/alerts") || rtype == "securityalert" || exists(r.systemalertid) || exists(r.alertdisplayname) || exists(r.alertname) {
          kind = "alert"
      }
  }

  # ---- shared: severity, resource, cloud, time helpers ----
  sev_txt = downcase(string(r.severity) ?? string(r.alertseverity) ?? string(get(r, ["metadata", "severity"]) ?? null) ?? string(get(r, ["status", "severity"]) ?? null) ?? "")
  severity_id = 1
  severity = "Informational"
  if sev_txt == "low" { severity_id = 2; severity = "Low" }
  if sev_txt == "medium" { severity_id = 3; severity = "Medium" }
  if sev_txt == "high" { severity_id = 4; severity = "High" }
  if sev_txt == "critical" { severity_id = 5; severity = "Critical" }

  rid_obj = object(r.resourcedetails) ?? {}
  res_id = string(r.azureresourceid) ?? string(rid_obj.id) ?? string(r.resourceid) ?? ""
  rec_id = string(t.id) ?? ""
  sub_src = res_id
  if sub_src == "" { sub_src = rec_id }
  sub = ""
  sm, smerr = parse_regex(sub_src, r'(?i)/subscriptions/(?P<sub>[0-9a-f-]{36})')
  if smerr == null { sub = downcase(string!(sm.sub)) }
  cloud = { "provider": "Azure" }
  if sub != "" { cloud.account = { "uid": sub, "type_id": 99, "type": "Azure Subscription" } }
  tenant = string(r.tenantid) ?? ""
  if tenant != "" { cloud.org = { "uid": tenant } }

  resource = {}
  if res_id != "" { resource.uid = res_id }
  rname = string(rid_obj.resourcename) ?? string(r.compromisedentity) ?? ""
  if rname == "" && res_id != "" {
      nm, nmerr = parse_regex(res_id, r'/(?P<n>[^/]+)$')
      if nmerr == null { rname = string!(nm.n) }
  }
  if rname != "" { resource.name = rname }
  rtype_res = string(rid_obj.resourcetype) ?? ""
  if rtype_res == "" && res_id != "" {
      pm, pmerr = parse_regex(res_id, r'(?i)/providers/(?P<p>[^/]+/[^/]+)/[^/]+$')
      if pmerr == null { rtype_res = string!(pm.p) }
  }
  if rtype_res != "" { resource.type = rtype_res }

  enrich = object(r.securityeventdataenrichment) ?? object(r.assessmenteventdataenrichment) ?? object(r.subassessmenteventdataenrichment) ?? {}
  enrich_action = downcase(string(enrich.action) ?? "")

  # ISO 8601 to epoch milliseconds, 0 when absent or unparseable.
  clock_ms = {}
  for_each(["timegenerated", "timegeneratedutc", "processingendtime", "processingendtimeutc", "starttimeutc", "starttime", "endtimeutc", "endtime"]) -> |_i, k| {
      v = string(get(r, [k]) ?? null) ?? ""
      if v != "" {
          tp, terr = parse_timestamp(v, "%+", timezone: "UTC")
          if terr == null { clock_ms = set!(clock_ms, [k], to_unix_timestamp(tp, unit: "milliseconds")) }
      }
  }
  status_obj = object(r.status) ?? {}
  for_each(["statuschangedate", "firstevaluationdate"]) -> |_i, k| {
      v = string(get(status_obj, [k]) ?? null) ?? ""
      if v != "" {
          tp, terr = parse_timestamp(v, "%+", timezone: "UTC")
          if terr == null { clock_ms = set!(clock_ms, [k], to_unix_timestamp(tp, unit: "milliseconds")) }
      }
  }
  now_ms = to_unix_timestamp(now(), unit: "milliseconds")

  metadata = {
      "version": "1.9.0",
      "profiles": ["cloud"],
      "log_name": "Defender for Cloud",
      "log_provider": "Microsoft Defender for Cloud",
      "product": { "name": "Microsoft Defender for Cloud", "vendor_name": "Microsoft" }
  }

  if kind == "alert" {
      title = string(r.alertdisplayname) ?? string(r.alertname) ?? string(r.displayname) ?? "Defender for Cloud alert"
      alert_uid = string(r.systemalertid) ?? string(t.name) ?? ""
      if alert_uid == "" { alert_uid = sha2("defender_for_cloud|alert|" + raw_log, variant: "SHA-256") }
      alert_type = string(r.alerttype) ?? ""

      time_ms = int(clock_ms.timegenerated) ?? int(clock_ms.timegeneratedutc) ?? int(clock_ms.processingendtime) ?? int(clock_ms.processingendtimeutc) ?? int(clock_ms.starttimeutc) ?? int(clock_ms.starttime) ?? now_ms

      finding_info = { "uid": alert_uid, "title": title }
      desc = string(r.description) ?? ""
      if desc != "" { finding_info.desc = desc }
      if alert_type != "" {
          finding_info.types = [alert_type]
          finding_info.analytic = { "uid": alert_type, "name": title, "type_id": 1, "type": "Rule" }
      }
      first = int(clock_ms.starttimeutc) ?? int(clock_ms.starttime) ?? 0
      if first > 0 { finding_info.first_seen_time = first }
      last = int(clock_ms.endtimeutc) ?? int(clock_ms.endtime) ?? 0
      if last > 0 { finding_info.last_seen_time = last }
      created = int(clock_ms.timegenerated) ?? int(clock_ms.timegeneratedutc) ?? 0
      if created > 0 { finding_info.created_time = created }
      uri = string(r.alerturi) ?? string(r.alertlink) ?? ""
      if uri != "" { finding_info.src_url = uri }
      pcomp = string(r.productcomponentname) ?? ""
      if pcomp != "" { finding_info.product = { "name": pcomp } }

      # ---- MITRE ATT&CK: techniques + intent (kill-chain tactics) ----
      # Log Analytics rows hold multi-valued columns as JSON array text
      # ("[\"T1078\",\"T1110\"]"); other paths use an array or "A, B" text.
      # Intent is read first; Tactics fills in whenever Intent yields no usable
      # tactic (empty, "Unknown" or "PreAttack" only).
      tactics = []
      for_each([r.intent, r.tactics]) -> |_si, src| {
          if length(tactics) == 0 && src != null {
              tl = array(src) ?? []
              if length(tl) == 0 {
                  tx = string(src) ?? ""
                  tx_arr, tx_err = parse_json(tx)
                  if tx_err == null && is_array(tx_arr) { tl = array!(tx_arr) } else if tx != "" { tl = split(tx, ",") }
              }
              for_each(tl) -> |_i, it| {
                  name = strip_whitespace(to_string(it) ?? "")
                  if name != "" && downcase(name) != "unknown" && downcase(name) != "preattack" {
                      tactics = push(tactics, { "name": name })
                  }
              }
          }
      }
      techs = array(r.techniques) ?? []
      if length(techs) == 0 {
          ts_txt = string(r.techniques) ?? ""
          ts_arr, ts_err = parse_json(ts_txt)
          if ts_err == null && is_array(ts_arr) { techs = array!(ts_arr) } else if ts_txt != "" { techs = split(ts_txt, ",") }
      }
      # Only the singular attack.tactic is used (attack.tactics is deprecated
      # since OCSF 1.1.0). The alert does not say which technique belongs to
      # which tactic, so a single tactic is paired with each technique, and
      # several tactics each get their own attack beside the technique ones.
      attacks = []
      for_each(techs) -> |_i, tq| {
          tid = strip_whitespace(to_string(tq) ?? "")
          if tid != "" {
              a = { "technique": { "uid": tid } }
              if length(tactics) == 1 { a.tactic = tactics[0] }
              attacks = push(attacks, a)
          }
      }
      if length(attacks) == 0 || length(tactics) > 1 {
          for_each(tactics) -> |_i, tc| { attacks = push(attacks, { "tactic": tc }) }
      }
      if length(attacks) > 0 { finding_info.attacks = attacks }

      # ---- status: New / Active / InProgress / Resolved / Dismissed ----
      st = downcase(string(r.status) ?? "")
      status_id = 1
      status = "New"
      activity_id = 1
      activity_name = "Create"
      if st == "inprogress" { status_id = 2; status = "In Progress"; activity_id = 2; activity_name = "Update" }
      if st == "dismissed" { status_id = 3; status = "Suppressed"; activity_id = 2; activity_name = "Update" }
      if st == "resolved" { status_id = 4; status = "Resolved"; activity_id = 3; activity_name = "Close" }

      # ---- entities -> evidences[], one per ip / host / account / process / file ----
      # Log Analytics rows carry Entities as JSON text; decode it, then read the
      # keys lower-cased like the rest of the record. $ref entries repeat an
      # entity already listed and carry no type, so they are skipped.
      entities = array(r.entities) ?? []
      if length(entities) == 0 {
          en_txt = string(r.entities) ?? ""
          en_arr, en_err = parse_json(en_txt)
          if en_err == null && is_array(en_arr) {
              lowered = map_keys({ "v": en_arr }, recursive: true) -> |k| { downcase(k) }
              entities = array(lowered.v) ?? []
          }
      }
      evidences = []
      for_each(entities) -> |_i, e| {
          eo = object(e) ?? {}
          et = downcase(string(eo.type) ?? "")
          ev = {}
          if et == "ip" {
              addr = string(eo.address) ?? ""
              if addr != "" { ev.src_endpoint = { "ip": downcase(addr) } }
          }
          if et == "host" {
              hn = string(eo.hostname) ?? ""
              if hn != "" {
                  device = { "hostname": hn, "type_id": 0 }
                  osf = string(eo.osfamily) ?? ""
                  if osf != "" {
                      os_type = 0
                      if downcase(osf) == "windows" { os_type = 100 }
                      if downcase(osf) == "linux" { os_type = 200 }
                      device.os = { "name": osf, "type_id": os_type }
                  }
                  ev.device = device
              }
          }
          if et == "account" {
              un = string(eo.name) ?? ""
              if un != "" {
                  user = { "name": un }
                  sid = string(eo.sid) ?? ""
                  if sid != "" { user.uid = sid }
                  ntd = string(eo.ntdomain) ?? ""
                  if ntd != "" { user.domain = ntd }
                  ev.user = user
              }
          }
          if et == "process" {
              # OCSF needs a pid on a process. Windows alerts write it in hex
              # ("0x1f2c"), Linux alerts and normalized feeds in decimal.
              pid_txt = downcase(strip_whitespace(to_string(eo.processid) ?? ""))
              pid = -1
              if starts_with(pid_txt, "0x") {
                  hp, hp_err = parse_int(replace(pid_txt, "0x", ""), base: 16)
                  if hp_err == null { pid = hp }
              } else if match(pid_txt, r'^\d+$') {
                  pid = to_int(pid_txt) ?? -1
              }
              if pid >= 0 {
                  proc = { "pid": pid }
                  cl = string(eo.commandline) ?? ""
                  if cl != "" { proc.cmd_line = cl }
                  ev.process = proc
              }
          }
          if et == "file" {
              fnm = string(eo.name) ?? ""
              if fnm != "" {
                  file = { "name": fnm, "type_id": 1 }
                  dirp = string(eo.directory) ?? ""
                  if dirp != "" { file.parent_folder = dirp }
                  ev.file = file
              }
          }
          if length(ev) > 0 { evidences = push(evidences, ev) }
      }

      remediation = {}
      steps = array(r.remediationsteps) ?? []
      if length(steps) == 0 {
          rs_txt = string(r.remediationsteps) ?? ""
          if rs_txt != "" {
              rs_arr, rs_err = parse_json(rs_txt)
              if rs_err == null && is_array(rs_arr) { steps = array!(rs_arr) } else { steps = [rs_txt] }
          }
      }
      if length(steps) > 0 { remediation.desc = join(map_values(steps) -> |s| { to_string(s) ?? "" }, "\n") ?? "" }

      vendor = string(r.vendorname) ?? "Microsoft"
      pname = string(r.productname) ?? "Microsoft Defender for Cloud"
      metadata.product = { "name": pname, "vendor_name": vendor }
      metadata.uid = alert_uid
      if alert_uid != "" { metadata.original_event_uid = alert_uid }

      ocsf = {
          "class_uid": 2004,
          "class_name": "Detection Finding",
          "category_uid": 2,
          "category_name": "Findings",
          "activity_id": activity_id,
          "activity_name": activity_name,
          "type_uid": 200400 + activity_id,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": status_id,
          "status": status,
          "is_alert": true,
          "time": time_ms,
          "message": title,
          "raw_data": raw_log,
          "metadata": metadata,
          "cloud": cloud,
          "finding_info": finding_info
      }
      if length(resource) > 0 { ocsf.resources = [resource] }
      if length(evidences) > 0 { ocsf.evidences = evidences }
      if length(remediation) > 0 { ocsf.remediation = remediation }
      conf = downcase(string(r.confidencelevel) ?? "")
      if conf == "low" { ocsf.confidence_id = 1; ocsf.confidence = "Low" }
      if conf == "medium" { ocsf.confidence_id = 2; ocsf.confidence = "Medium" }
      if conf == "high" { ocsf.confidence_id = 3; ocsf.confidence = "High" }
      if is_boolean(r.isincident) && r.isincident == true { ocsf.is_suspected_breach = true }
      . = ocsf
  } else if kind == "assessment" || kind == "regulatory" {
      title = ""
      code = ""
      standard = ""
      control = ""
      if kind == "regulatory" {
          title = string(r.description) ?? string(t.name) ?? ""
          code = downcase(string(r.state) ?? "")
          cm, cmerr = parse_regex(rec_id, r'(?i)regulatoryComplianceStandards/(?P<std>[^/]+)/regulatoryComplianceControls/(?P<ctl>[^/]+)')
          if cmerr == null { standard = string!(cm.std); control = string!(cm.ctl) }
      } else {
          title = string(r.displayname) ?? string(get(r, ["metadata", "displayname"]) ?? null) ?? string(t.name) ?? ""
          code = downcase(string(status_obj.code) ?? "")
          control = string(t.name) ?? ""
      }
      if title == "" { title = "Defender for Cloud assessment" }

      # Healthy / Passed -> Pass, Unhealthy / Failed -> Fail, else Other.
      c_status_id = 0
      c_status = "Unknown"
      if code == "healthy" || code == "passed" { c_status_id = 1; c_status = "Pass" }
      if code == "unhealthy" || code == "failed" { c_status_id = 3; c_status = "Fail" }
      if code == "notapplicable" || code == "skipped" { c_status_id = 99; c_status = "Other" }
      compliance = { "status_id": c_status_id, "status": c_status }
      if code != "" { compliance.status_code = string(status_obj.code) ?? string(r.state) ?? code }
      cdesc = string(status_obj.description) ?? ""
      if cdesc != "" { compliance.status_detail = cdesc }
      if control != "" { compliance.control = control }
      if standard != "" { compliance.standards = [standard] }
      cats = array(get(r, ["metadata", "categories"]) ?? null) ?? []
      if length(cats) > 0 { compliance.category = to_string(cats[0]) ?? "" }
      if kind == "assessment" && exists(r.category) {
          acat = string(r.category) ?? ""
          if acat != "" && acat != "N/A" { compliance.category = acat }
      }

      # The finding is open while the resource fails; a pass resolves it.
      status_id = 1
      status = "New"
      if c_status_id == 1 { status_id = 4; status = "Resolved" }
      if c_status_id == 99 { status_id = 99; status = "Other" }
      if c_status_id != 3 { severity_id = 1; severity = "Informational" }

      activity_id = 1
      activity_name = "Create"
      if enrich_action == "write" || enrich_action == "update" { activity_id = 2; activity_name = "Update" }
      if enrich_action == "delete" { activity_id = 3; activity_name = "Close" }

      uid = rec_id
      if uid == "" { uid = sha2("defender_for_cloud|assessment|" + raw_log, variant: "SHA-256") }
      finding_info = { "uid": uid, "title": title, "types": ["Recommendation"] }
      if kind == "regulatory" { finding_info.types = ["Regulatory Compliance"] }
      if contains(rtype, "subassessments") { finding_info.types = ["Sub-assessment"] }
      fdesc = string(get(r, ["metadata", "description"]) ?? null) ?? string(r.description) ?? ""
      if fdesc != "" && kind != "regulatory" { finding_info.desc = fdesc }
      first_eval = int(clock_ms.firstevaluationdate) ?? 0
      if first_eval > 0 { finding_info.created_time = first_eval }
      changed = int(clock_ms.statuschangedate) ?? 0
      if changed > 0 { finding_info.modified_time = changed }
      portal = string(get(r, ["links", "azureportal"]) ?? null) ?? string(r.assessmentdetailslink) ?? ""
      if portal != "" { finding_info.src_url = portal }
      pol = string(get(r, ["metadata", "policydefinitionid"]) ?? null) ?? ""
      if pol != "" { finding_info.analytic = { "uid": pol, "name": title, "type_id": 1, "type": "Rule" } }

      remediation = {}
      rdesc = string(get(r, ["metadata", "remediationdescription"]) ?? null) ?? string(r.remediation) ?? ""
      if rdesc != "" { remediation.desc = rdesc }

      time_ms = int(clock_ms.statuschangedate) ?? int(clock_ms.timegenerated) ?? now_ms
      metadata.uid = sha2("defender_for_cloud|" + uid + "|" + enrich_action + "|" + to_string(time_ms), variant: "SHA-256")
      metadata.log_name = "Defender for Cloud recommendations"
      if kind == "regulatory" { metadata.log_name = "Defender for Cloud regulatory compliance" }

      ocsf = {
          "class_uid": 2003,
          "class_name": "Compliance Finding",
          "category_uid": 2,
          "category_name": "Findings",
          "activity_id": activity_id,
          "activity_name": activity_name,
          "type_uid": 200300 + activity_id,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": status_id,
          "status": status,
          "time": time_ms,
          "message": title,
          "raw_data": raw_log,
          "metadata": metadata,
          "cloud": cloud,
          "compliance": compliance,
          "finding_info": finding_info
      }
      if length(resource) > 0 { ocsf.resources = [resource] }
      if length(remediation) > 0 { ocsf.remediation = remediation }
      . = ocsf
  } else {
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 0,
          "activity_name": "Unknown",
          "type_uid": 0,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": now_ms,
          "raw_data": raw_log,
          "metadata": metadata,
          "cloud": cloud
      }
      .metadata.uid = sha2("defender_for_cloud|raw|" + raw_log, variant: "SHA-256")
