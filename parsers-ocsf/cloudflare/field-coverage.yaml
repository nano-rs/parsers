source: json
transforms:
- source: QueryName
  kind: lowercase
  target: query.hostname
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: ClientRequestScheme
  kind: lowercase
  target: http_request.url.scheme
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: Timestamp
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: Datetime
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: Action
  kind: enum
  target: action_id
  values:
    allow: 1
    allowed: 1
    accept: 1
    accepted: 1
    permit: 1
    permitted: 1
    pass: 1
    passed: 1
    deny: 2
    denied: 2
    block: 2
    blocked: 2
    reject: 2
    rejected: 2
    drop: 2
    dropped: 2
    log: 3
    observed: 3
    simulate: 3
    challenge: 2
    jschallenge: 2
    js_challenge: 2
    managedchallenge: 2
    managed_challenge: 2
    connectionclose: 2
    connection_close: 2
    skip: 1
    bypass: 1
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when
    the expected ID is emitted.
- source: EdgeStartTimestamp
  kind: scale
  factor: 1.0e-06
  target: time
  reason: Existing unit conversion by 1e-06 verified against time; unused clock fallbacks remain residual.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  BotScore:
  - risk_score
  ClientASN:
  - src_endpoint.autonomous_system.number
  ClientASNDescription:
  - src_endpoint.autonomous_system.name
  ClientIP:
  - src_endpoint.ip
  ClientRequestBytes:
  - http_request.length
  - traffic.bytes_out
  ClientRequestHost:
  - dst_endpoint.hostname
  - http_request.url.hostname
  ClientRequestMethod:
  - http_request.http_method
  ClientRequestPath:
  - http_request.url.path
  ClientRequestProtocol:
  - http_request.version
  ClientRequestReferer:
  - http_request.referrer
  ClientRequestScheme:
  - http_request.url.scheme
  ClientRequestUserAgent:
  - http_request.user_agent
  ClientSrcPort:
  - src_endpoint.port
  Description:
  - firewall_rule.name
  EdgeResponseBytes:
  - http_response.length
  - traffic.bytes_in
  EdgeResponseStatus:
  - http_response.code
  EdgeServerIP:
  - proxy.ip
  OriginIP:
  - dst_endpoint.ip
  QueryName:
  - query.hostname
  RayID:
  - metadata.correlation_uid
  RuleID:
  - firewall_rule.uid
  Source:
  - firewall_rule.type
  SourceIP:
  - src_endpoint.ip
