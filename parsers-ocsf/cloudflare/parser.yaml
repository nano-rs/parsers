name: cloudflare_ocsf
display_name: Cloudflare (OCSF)
version: "1.1.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields in redacted, dotted snake_case unmapped keys.
  Parses Cloudflare Logpush JSON — HTTP requests, firewall events and DNS
  queries — into OCSF 1.9.0. HTTP request and firewall-event records become
  "HTTP Activity" (class_uid 4002); DNS records become "DNS Activity"
  (class_uid 4003). The WAF / firewall verdict drives the security-control
  action/disposition and `firewall_rule`, the client ASN and country ride on
  src_endpoint (promoted columns), and RayID becomes
  metadata.correlation_uid so an analyst can join edge and origin records.
  Mirrors the UDM cloudflare parser (../parsers/parsers/cloudflare/parser.yaml).
match_values:
  - cloudflare
category: network
vendor: "Cloudflare"
product: "Cloudflare"
parser_vrl: |
  # Cloudflare Logpush -> OCSF 1.9.0 HTTP Activity (4002) / DNS Activity (4003)
  raw_log = string!(.message)
  __raw_body = raw_log
  __source_kv = {}
  ip_re = r'^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$|^[0-9A-Fa-f:]{3,}$'

  p, perr = parse_json(raw_log)
  __source_kv = object(p) ?? {}

  if perr == null && is_object(p) {
      is_dns = exists(p.QueryName)
      is_firewall = exists(p.Kind) || (exists(p.Action) && !exists(p.EdgeStartTimestamp))

      # ---- common client context -------------------------------------
      src_endpoint = {}
      cip = string(p.ClientIP) ?? ""
      if !is_dns {
          if match(cip, ip_re) { src_endpoint.ip = cip }
      } else {
          sip = string(p.SourceIP) ?? ""
          if match(sip, ip_re) { src_endpoint.ip = sip }
      }
      sport = to_int(p.ClientSrcPort) ?? 0
      if sport != 0 { src_endpoint.port = sport }
      asn = to_int(p.ClientASN) ?? 0
      asn_name = string(p.ClientASNDescription) ?? ""
      if asn != 0 || asn_name != "" {
          a = {}
          if asn != 0 { a.number = asn }
          if asn_name != "" { a.name = asn_name }
          src_endpoint.autonomous_system = a
      }
      ccountry = string(p.ClientCountry) ?? ""
      if ccountry != "" && ccountry != "xx" { src_endpoint.location = { "country": upcase(ccountry) } }

      metadata = {
          "version": "1.9.0",
          "uid": uuid_v4(),
          "profiles": ["host", "security_control"],
          "log_name": "cloudflare-logpush",
          "product": { "name": "Cloudflare", "vendor_name": "Cloudflare" }
      }
      ray = string(p.RayID) ?? ""
      if ray != "" { metadata.correlation_uid = ray }

      unmapped = {}

      if is_dns {
          # ================= DNS Activity (4003) =================
          time_ms = 0
          ts_str = string(p.Timestamp) ?? ""
          if ts_str != "" {
              t, terr = parse_timestamp(ts_str, "%+")
              if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
          }

          qt = to_int(p.QueryType) ?? 0
          qtype = to_string(qt)
          if qt == 1 { qtype = "A" }
          if qt == 2 { qtype = "NS" }
          if qt == 5 { qtype = "CNAME" }
          if qt == 6 { qtype = "SOA" }
          if qt == 12 { qtype = "PTR" }
          if qt == 15 { qtype = "MX" }
          if qt == 16 { qtype = "TXT" }
          if qt == 28 { qtype = "AAAA" }
          if qt == 33 { qtype = "SRV" }

          rc = to_int(p.ResponseCode) ?? 0
          rcode_id = 99
          rcode = to_string(rc)
          if rc == 0 { rcode_id = 0; rcode = "NoError" }
          if rc == 1 { rcode_id = 1; rcode = "FormError" }
          if rc == 2 { rcode_id = 2; rcode = "ServError" }
          if rc == 3 { rcode_id = 3; rcode = "NXDomain" }
          if rc == 4 { rcode_id = 4; rcode = "NotImp" }
          if rc == 5 { rcode_id = 5; rcode = "Refused" }

          status_id = 1
          status_str = "Success"
          if rc != 0 { status_id = 2; status_str = "Failure" }

          colo = string(p.ColoCode) ?? ""
          if colo != "" { unmapped.colo_code = colo }
          edns = string(p.EDNSSubnet) ?? ""
          if edns != "" { unmapped.edns_subnet = edns }

          . = {
              "class_uid": 4003,
              "class_name": "DNS Activity",
              "category_uid": 4,
              "category_name": "Network Activity",
              "activity_id": 2,
              "activity_name": "Response",
              "type_uid": 400302,
              "severity_id": 1,
              "severity": "Informational",
              "status_id": status_id,
              "status": status_str,
              "rcode_id": rcode_id,
              "rcode": rcode,
              "time": time_ms,
              "raw_data": raw_log,
              "metadata": metadata,
              "query": { "hostname": downcase(string(p.QueryName) ?? ""), "type": qtype }
          }
          if exists(src_endpoint.ip) {
              .src_endpoint = src_endpoint
          } else {
              .dst_endpoint = { "svc_name": "cloudflare-dns" }
          }
          if length(unmapped) > 0 { .unmapped = unmapped }
      } else {
          # ================= HTTP Activity (4002) =================
          time_ms = 0
          if is_firewall {
              ts_str = string(p.Datetime) ?? ""
              if ts_str != "" {
                  t, terr = parse_timestamp(ts_str, "%+")
                  if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
              }
          } else {
              ns = to_int(p.EdgeStartTimestamp) ?? 0
              if ns > 0 {
                  time_ms = to_int(floor(ns / 1000000))
              } else {
                  ts_str = string(p.EdgeStartTimestamp) ?? ""
                  if ts_str != "" {
                      t, terr = parse_timestamp(ts_str, "%+")
                      if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
                  }
              }
          }

          method = upcase(string(p.ClientRequestMethod) ?? "")
          activity_id = 99
          activity_name = "Other"
          if method == "CONNECT" { activity_id = 1; activity_name = "Connect" }
          if method == "DELETE"  { activity_id = 2; activity_name = "Delete" }
          if method == "GET"     { activity_id = 3; activity_name = "Get" }
          if method == "HEAD"    { activity_id = 4; activity_name = "Head" }
          if method == "OPTIONS" { activity_id = 5; activity_name = "Options" }
          if method == "POST"    { activity_id = 6; activity_name = "Post" }
          if method == "PUT"     { activity_id = 7; activity_name = "Put" }
          if method == "TRACE"   { activity_id = 8; activity_name = "Trace" }
          if method == "PATCH"   { activity_id = 9; activity_name = "Patch" }

          code = to_int(p.EdgeResponseStatus) ?? 0
          status_id = 2
          status_str = "Failure"
          if code >= 200 && code < 400 { status_id = 1; status_str = "Success" }
          if code == 0 { status_id = 0; status_str = "Unknown" }

          host = string(p.ClientRequestHost) ?? ""
          scheme = downcase(string(p.ClientRequestScheme) ?? "")
          if scheme == "" { scheme = "https" }
          uri = string(p.ClientRequestURI) ?? ""
          if uri == "" { uri = string(p.ClientRequestPath) ?? "" }
          query = string(p.ClientRequestQuery) ?? ""

          url_obj = {}
          if host != "" { url_obj.hostname = downcase(host) }
          url_obj.scheme = scheme
          upath = uri
          if contains(uri, "?") {
              sp = split(uri, "?", limit: 2)
              upath = string(sp[0]) ?? ""
              if length(sp) == 2 { url_obj.query_string = string(sp[1]) ?? "" }
          } else if query != "" {
              url_obj.query_string = replace(query, "?", "")
          }
          if upath != "" { url_obj.path = upath } else { url_obj.path = "/" }
          if host != "" { url_obj.url_string = scheme + "://" + host + uri }

          http_request = { "url": url_obj }
          if method != "" { http_request.http_method = method }
          ua = string(p.ClientRequestUserAgent) ?? ""
          if ua != "" { http_request.user_agent = ua }
          ref = string(p.ClientRequestReferer) ?? ""
          if ref != "" { http_request.referrer = ref }
          proto = string(p.ClientRequestProtocol) ?? ""
          if proto != "" { http_request.version = proto }
          req_bytes = to_int(p.ClientRequestBytes) ?? 0
          if req_bytes != 0 { http_request.length = req_bytes }

          resp_bytes = to_int(p.EdgeResponseBytes) ?? 0
          http_response = { "code": code, "status": status_str }
          if resp_bytes != 0 { http_response.length = resp_bytes }
          ct = string(p.EdgeResponseContentType) ?? ""
          if ct != "" { http_response.content_type = ct }

          # ---- verdict: firewall event Action, then WAFAction, then the
          #      first FirewallMatchesActions entry ----
          verdict = downcase(string(p.Action) ?? "")
          if verdict == "" || verdict == "unknown" { verdict = downcase(string(p.WAFAction) ?? "") }
          if verdict == "" || verdict == "unknown" {
              fma = array(p.FirewallMatchesActions) ?? []
              if length(fma) > 0 { verdict = downcase(to_string(fma[0]) ?? "") }
          }
          action_id = 0
          action_name = "Unknown"
          disposition_id = 0
          disposition_name = "Unknown"
          severity_id = 1
          severity = "Informational"
          is_alert = false
          if verdict == "block" || verdict == "drop" {
              action_id = 2; action_name = "Denied"
              disposition_id = 2; disposition_name = "Blocked"
              severity_id = 4; severity = "High"
              is_alert = true
          } else if verdict == "challenge" || verdict == "jschallenge" || verdict == "managedchallenge" {
              action_id = 2; action_name = "Denied"
              disposition_id = 19; disposition_name = "Challenge"
              severity_id = 3; severity = "Medium"
              is_alert = true
          } else if verdict == "allow" || verdict == "skip" || verdict == "log" || verdict == "simulate" {
              action_id = 1; action_name = "Allowed"
              disposition_id = 1; disposition_name = "Allowed"
          } else if verdict != "" && verdict != "unknown" {
              action_id = 99; action_name = verdict
          }

          rule_uid = string(p.RuleID) ?? ""
          if rule_uid == "" { rule_uid = string(p.WAFRuleID) ?? "" }
          rule_desc = string(p.Description) ?? ""
          if rule_desc == "" { rule_desc = string(p.WAFRuleMessage) ?? "" }

          for_each(["SecurityLevel", "BotScoreSrc", "JA3Hash", "ClientSSLProtocol", "ClientSSLCipher", "CacheCacheStatus", "ZoneName", "EdgeColoCode", "ClientDeviceType", "ClientIPClass", "Source", "Kind", "WAFProfile"]) -> |_i, key| {
              v = to_string(get(p, [key]) ?? "") ?? ""
              if v != "" { unmapped = set!(unmapped, [downcase(key)], v) }
          }
          ort = to_int(p.OriginResponseTime) ?? 0
          if ort != 0 { unmapped.origin_response_time_ns = ort }
          fw_ids = array(p.FirewallMatchesRuleIDs) ?? []
          if length(fw_ids) > 0 { unmapped.firewall_rule_ids = encode_json(fw_ids) }

          . = {
              "class_uid": 4002,
              "class_name": "HTTP Activity",
              "category_uid": 4,
              "category_name": "Network Activity",
              "activity_id": activity_id,
              "activity_name": activity_name,
              "type_uid": 400200 + activity_id,
              "severity_id": severity_id,
              "severity": severity,
              "status_id": status_id,
              "status": status_str,
              "action_id": action_id,
              "action": action_name,
              "disposition_id": disposition_id,
              "disposition": disposition_name,
              "is_alert": is_alert,
              "time": time_ms,
              "raw_data": raw_log,
              "metadata": metadata,
              "http_request": http_request,
              "http_response": http_response,
              "traffic": { "bytes_in": req_bytes, "bytes_out": resp_bytes }
          }
          if exists(src_endpoint.ip) || exists(src_endpoint.port) { .src_endpoint = src_endpoint }
          dst_endpoint = {}
          oip = string(p.OriginIP) ?? ""
          if match(oip, ip_re) { dst_endpoint.ip = oip }
          if host != "" { dst_endpoint.hostname = downcase(host) }
          if exists(dst_endpoint.ip) || exists(dst_endpoint.hostname) { .dst_endpoint = dst_endpoint }
          eip = string(p.EdgeServerIP) ?? ""
          if match(eip, ip_re) { .proxy = { "ip": eip } }
          if rule_uid != "" || rule_desc != "" {
              fr = {}
              if rule_uid != "" { fr.uid = rule_uid }
              if rule_desc != "" { fr.name = rule_desc }
              .firewall_rule = fr
          }
          # BotScore is Cloudflare's 1-99 likelihood that the client is human;
          # it is a risk signal, not an entity risk score from the RBA engine.
          bs = to_int(p.BotScore) ?? -1
          if bs >= 0 { .risk_score = bs }
          if length(unmapped) > 0 { .unmapped = unmapped }
      }
  } else {
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 99,
          "activity_name": "Other",
          "type_uid": 99,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": 0,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": uuid_v4(),
              "log_level": "error",
              "log_name": "cloudflare-logpush",
              "product": { "name": "Cloudflare", "vendor_name": "Cloudflare" }
          }
      }
  }

  .

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # Exact value representation is evaluated AFTER branch selection. Numeric strings
  # count as represented by their typed scalar; other transformations are explicit.
  __mapped = object!(parse_json!(encode_json(.)))
  __existing = object(__mapped.unmapped) ?? {}
  __discard = del(__mapped.raw_data)
  __discard = del(__mapped.unmapped)
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __represented = []
  __walk = map_values(__mapped, recursive: true) -> |value| {
      __represented = push(__represented, encode_json(value))
      if !is_object(value) && !is_array(value) && !is_null(value) {
          __represented = push(__represented, to_string(value) ?? "")
      }
      value
  }
  __consumed = []
  # BEGIN parser-specific transformations
  # QueryName: Parser lowercases this source value; consume only when the normalized value is emitted.
  # ClientRequestScheme: Parser lowercases this source value; consume only when the normalized value is emitted.
  # Action: Parser lowercases this source value; consume only when the normalized value is emitted.
  # WAFAction: Parser lowercases this source value; consume only when the normalized value is emitted.
  # Timestamp: Successful ISO timestamp conversion to the selected event clock in milliseconds.
  # Datetime: Successful ISO timestamp conversion to the selected event clock in milliseconds.
  # EdgeStartTimestamp: Successful ISO timestamp conversion to the selected event clock in milliseconds.
  # Action: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when the expected ID is emitted.
  # ClientCountry: Parser normalizes the caption case; verify the emitted caption.
  # ClientCountry: Parser normalizes the caption case; verify the emitted caption.
  # EdgeStartTimestamp: Existing unit conversion by 1e-06 verified against time; unused clock fallbacks remain residual.
  # WAFAction: Parser normalizes the caption case; verify the emitted caption.
  # Only source keys read by this parser are eligible for exact-value consumption; the selected branch must emit the value. Unknown keys always spill, even when their value equals an OCSF default.
  __candidates = ["Action", "BotScore", "ClientASN", "ClientASNDescription", "ClientCountry", "ClientIP", "ClientRequestBytes", "ClientRequestHost", "ClientRequestMethod", "ClientRequestPath", "ClientRequestProtocol", "ClientRequestQuery", "ClientRequestReferer", "ClientRequestScheme", "ClientRequestURI", "ClientRequestUserAgent", "ClientSrcPort", "ColoCode", "Datetime", "Description", "EDNSSubnet", "EdgeResponseBytes", "EdgeResponseContentType", "EdgeResponseStatus", "EdgeServerIP", "EdgeStartTimestamp", "FirewallMatchesActions", "FirewallMatchesRuleIDs", "Kind", "OriginIP", "OriginResponseTime", "QueryName", "QueryType", "RayID", "ResponseCode", "RuleID", "SourceIP", "Timestamp", "WAFAction", "WAFRuleID", "WAFRuleMessage"]
  __preserve = []
  __rules = array!(parse_json!("[{\"source\":\"QueryName\",\"kind\":\"lowercase\",\"reason\":\"Parser lowercases this source value; consume only when the normalized value is emitted.\"},{\"source\":\"ClientRequestScheme\",\"kind\":\"lowercase\",\"reason\":\"Parser lowercases this source value; consume only when the normalized value is emitted.\"},{\"source\":\"Action\",\"kind\":\"lowercase\",\"reason\":\"Parser lowercases this source value; consume only when the normalized value is emitted.\"},{\"source\":\"WAFAction\",\"kind\":\"lowercase\",\"reason\":\"Parser lowercases this source value; consume only when the normalized value is emitted.\"},{\"source\":\"Timestamp\",\"kind\":\"epoch_ms\",\"target\":\"time\",\"reason\":\"Successful ISO timestamp conversion to the selected event clock in milliseconds.\"},{\"source\":\"Datetime\",\"kind\":\"epoch_ms\",\"target\":\"time\",\"reason\":\"Successful ISO timestamp conversion to the selected event clock in milliseconds.\"},{\"source\":\"EdgeStartTimestamp\",\"kind\":\"epoch_ms\",\"target\":\"time\",\"reason\":\"Successful ISO timestamp conversion to the selected event clock in milliseconds.\"},{\"source\":\"Action\",\"kind\":\"enum\",\"target\":\"action_id\",\"values\":{\"allow\":1,\"allowed\":1,\"accept\":1,\"accepted\":1,\"permit\":1,\"permitted\":1,\"pass\":1,\"passed\":1,\"deny\":2,\"denied\":2,\"block\":2,\"blocked\":2,\"reject\":2,\"rejected\":2,\"drop\":2,\"dropped\":2,\"log\":3,\"observed\":3},\"reason\":\"Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when the expected ID is emitted.\"},{\"source\":\"ClientCountry\",\"kind\":\"enum\",\"target\":\"src_endpoint.location.country\",\"values\":{\"ru\":\"RU\"},\"reason\":\"Parser normalizes the caption case; verify the emitted caption.\"},{\"source\":\"ClientCountry\",\"kind\":\"enum\",\"target\":\"src_endpoint.location.country\",\"values\":{\"de\":\"DE\"},\"reason\":\"Parser normalizes the caption case; verify the emitted caption.\"},{\"source\":\"EdgeStartTimestamp\",\"kind\":\"scale\",\"factor\":1e-06,\"target\":\"time\",\"reason\":\"Existing unit conversion by 1e-06 verified against time; unused clock fallbacks remain residual.\"},{\"source\":\"WAFAction\",\"kind\":\"enum\",\"target\":\"action\",\"values\":{\"unknown\":\"Unknown\"},\"reason\":\"Parser normalizes the caption case; verify the emitted caption.\"}]"))
  __source_flat = flatten(__source_kv)
  for_each(__rules) -> |_index, rule| {
      __source_key = string!(rule.source)
      __value = get!(__source_flat, [__source_key])
      __expected = null
      __valid = false
      if rule.kind == "lowercase" && is_string(__value) {
          __expected = downcase(string!(__value))
          __valid = true
      } else if rule.kind == "epoch_ms" {
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", string(rule.format) ?? "%+")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              __valid = true
          }
      } else if rule.kind == "scale" {
          __number, __number_err = to_float(__value)
          if __number_err == null && __value != null && !is_boolean(__value) {
              __expected = to_int(__number * to_float!(rule.factor))
              __valid = true
          }
      } else if rule.kind == "hex" {
          __hex = replace(downcase(string(__value) ?? ""), r'^0x', "")
          __integer, __integer_err = parse_int(__hex, base: 16)
          __expected = __integer
          __valid = is_string(__value) && starts_with(downcase(string(__value) ?? ""), "0x") && __integer_err == null
      } else if rule.kind == "enum" {
          __expected = get!(object!(rule.values), [downcase(to_string(__value) ?? "")])
          __valid = __expected != null
      }
      __matches = includes(__represented, encode_json(__expected))
      if is_string(rule.target) { __matches = get!(., split(string!(rule.target), ".")) == __expected }
      if __valid && __matches { __consumed = push(__consumed, __source_key) }
  }
  # END parser-specific transformations
  # Redact at every depth, including objects inside arrays, before serialization.
  __safe = map_values(object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing}))), recursive: true) -> |value| {
      if is_object(value) {
          # Header/parameter arrays commonly encode sensitive keys as name/value
          # or Key/Value objects instead of using the secret name as an object key.
          __sensitive_pair = false
          for_each(object!(value)) -> |key, child| {
              if includes(["name", "key"], downcase(key)) && match(downcase(string(child) ?? ""), r'password|secret|authorization|token') {
                  __sensitive_pair = true
              }
          }
          for_each(object!(value)) -> |key, _child| {
              if match(downcase(key), r'password|secret|authorization|token') || (__sensitive_pair && includes(["value", "values"], downcase(key))) {
                  value = set!(value, [key], "<redacted>")
              }
          }
      }
      value
  }
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  __escaped = map_keys(object!(__safe.source), recursive: true) -> |key| {
      replace(replace(key, "~", "~0"), ".", "~1")
  }
  __flat = flatten(__escaped)
  __residual = {}
  for_each(__flat) -> |key, value| {
      key = replace(replace(key, "~1", "."), "~0", "~")
      __same = includes(__represented, encode_json(value))
      if !is_object(value) && !is_array(value) && !is_null(value) {
          __same = __same || includes(__represented, to_string(value) ?? "")
      }
      # A scalar array is consumed only if every element is represented. Preserve
      # partially represented arrays intact, including their ordering and repeats.
      if is_array(value) && !is_empty(array!(value)) {
          __all_items = true
          for_each(array!(value)) -> |_index, item| {
              __item_same = includes(__represented, encode_json(item))
              if !is_object(item) && !is_array(item) && !is_null(item) {
                  __item_same = __item_same || includes(__represented, to_string(item) ?? "")
              }
              if is_object(item) || is_array(item) || !__item_same { __all_items = false }
          }
          __same = __same || __all_items
      }
      if __same && includes(__candidates, key) { __consumed = push(__consumed, key) }
      # Redacted leaves always remain visible. Do not spill a copy of the raw body.
      if (!includes(__consumed, key) || value == "<redacted>") && value != __raw_body {
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          __base = join!(__parts, ".")
          __key = __base
          __suffix = 2
          if includes(keys(__residual), __key) {
              for_each(__flat) -> |_other_key, _other_value| {
                  if includes(keys(__residual), __key) {
                      __key = __base + "_" + to_string(__suffix)
                      __suffix = __suffix + 1
                  }
              }
          }
          __complex = is_object(value)
          if is_array(value) {
              for_each(array!(value)) -> |_index, item| {
                  if is_object(item) || is_array(item) { __complex = true }
              }
          }
          __spill = if __complex { encode_json(value) } else { value }
          __residual = set!(__residual, [__key], __spill)
      }
  }
  # Keep existing derived evidence, but remove null placeholders and mapped copies.
  # Source-derived aliases are replaced by canonical dotted source paths above.
  __original_values = []
  for_each(flatten(__source_kv)) -> |_key, value| {
      __original_values = push(__original_values, encode_json(value))
      if !is_object(value) && !is_array(value) { __original_values = push(__original_values, to_string(value) ?? "") }
  }
  for_each(flatten(__existing)) -> |key, value| {
      __source_alias = includes(__original_values, encode_json(value)) || includes(__original_values, to_string(value) ?? "")
      __mapped_alias = includes(__represented, encode_json(value)) || includes(__represented, to_string(value) ?? "")
      __decoded, __decode_err = parse_json(string(value) ?? "")
      __encoded_container = __decode_err == null && (is_object(__decoded) || is_array(__decoded))
      if !is_null(value) && value != "" && !__source_alias && !__mapped_alias && !__encoded_container && value != __raw_body {
          # Existing aggregates may contain sensitive descendants; the canonical
          # source spill above is the authoritative representation of containers.
          if !is_array(value) && !is_object(value) && !match(downcase(key), r'password|secret|authorization|token') {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, with recursive
  # redaction. These entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__safe.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

