# What this parser gets when its log arrives as an HEC (or OTel-style) object
# event; scripts/test_hec_envelopes.py builds the delivery the way nano does and
# checks each case.
cases:
- name: 'a json-file record with an image and no container id or name: no container'
  event:
    message: '{"log": "hello\n", "stream": "stdout", "time": "2026-11-20T10:00:00Z"}'
    host: h1
    image: nginx:1.27
  expect:
    device.hostname: h1
    device.container: <missing>
    unmapped.envelope.image: nginx:1.27
