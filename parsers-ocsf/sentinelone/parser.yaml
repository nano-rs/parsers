name: sentinelone_ocsf
display_name: SentinelOne (OCSF)
version: "1.1.0"
description: >
  Preserves unconsumed parsed fields in redacted, dotted snake_case unmapped keys.
  Parses SentinelOne Singularity EDR JSON into complete OCSF 1.9.0
  records, routed by payload shape:
    threat / alert (threatId|threatName|classification) -> Detection Finding 2004 (Create)
    management-console activity log (activityType)      -> API Activity 6003 (Other)
    Deep Visibility (EventType), dispatched further:
      *dns*                                             -> DNS Activity 4003 (Query)
      *network* / *ip connect*                          -> Network Activity 4001 (Open)
      *registry* with a value                           -> Registry Value Activity 201002 (Set)
      *registry* key only                               -> Registry Key Activity 201001 (Create)
      *file*                                            -> File System Activity 1001 (Create/Update/Delete/Rename)
      *process*                                         -> Process Activity 1007 (Launch/Terminate)
      anything else                                     -> Process Activity 1007 (Other)
  On a Deep Visibility process event the DV process is `process` and its parent is
  `actor.process`. Detection Finding 2004 has no top-level `file`, so a convicted
  binary rides on actor.process.file (and is repeated in evidences[] and
  observables[]). Carries metadata.profiles ["host"] (plus "security_control" on
  findings, which is what disposition/action are bound to). The OCSF counterpart of
  parsers/sentinelone - deploy one or the other, never both.
ocsf_version: "1.9.0"
match_values:
  - sentinelone
category: endpoint
vendor: "SentinelOne"
product: "Singularity"
parser_vrl: |
  # SentinelOne Singularity (EDR) JSON -> OCSF 1.9.0.
  # Emits the COMPLETE OCSF record on the root, routed by payload shape:
  #   threat / alert (threatId|threatName|classification) -> Detection Finding 2004 (Create)
  #   management-console activity log (activityType)      -> API Activity 6003 (Other)
  #   Deep Visibility (EventType), dispatched further:
  #     *process*                                         -> Process Activity 1007 (Launch)
  #     *network*/*ip*                                    -> Network Activity 4001 (Open)
  #     *dns*                                             -> DNS Activity 4003 (Query)
  #     *file*                                            -> File System Activity 1001 (Update)
  #     *registry* with a value                           -> Registry Value Activity 201002 (Set)
  #     *registry* key only                               -> Registry Key Activity 201001 (Create)
  #     anything else                                     -> Process Activity 1007 (Other)
  raw_log = string!(.message)
  parsed, err = parse_json(raw_log)
  __source_kv = object(parsed) ?? {}
  __raw_body = raw_log

  if err != null || !is_object(parsed) {
      . = {
          "class_uid": 1007,
          "class_name": "Process Activity",
          "category_uid": 1,
          "category_name": "System Activity",
          "activity_id": 99,
          "activity_name": "Other",
          "type_uid": 100799,
          "severity_id": 1,
          "severity": "Informational",
          "time": 0,
          "raw_data": raw_log,
          # 1007 requires actor/device/process even on the unparseable path.
          "process": { "pid": 0 },
          "actor": { "process": { "pid": 0 } },
          "device": { "hostname": "", "type_id": 0 },
          "metadata": {
              "version": "1.9.0",
              "profiles": ["host"],
              "uid": uuid_v4(),
              "log_level": "error",
              "log_source": "sentinelone",
              "product": { "name": "Singularity", "vendor_name": "SentinelOne" }
          }
      }
  } else {
      p = object!(parsed)

      # ---- shape detection (mirrors the UDM parser's precedence) --------
      is_deep_visibility = exists(p.EventType)
      is_activity = !is_deep_visibility && exists(p.activityType)
      is_threat = !is_deep_visibility && !is_activity && (exists(p.threatId) || exists(p.threatName) || exists(p.classification))

      # ---- time --------------------------------------------------------
      # NOTE: to_string(<missing>) yields "" and does not error, so every
      # fallback below is an explicit empty check rather than `??` chaining.
      time_ms = 0
      ts_str = to_string(p.createdAt) ?? ""
      if ts_str == "" { ts_str = to_string(p.ProcessStartTime) ?? "" }
      if ts_str != "" {
          t, terr = parse_timestamp(ts_str, "%+")
          if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
      }

      # ---- device / host -----------------------------------------------
      device_hostname = downcase(to_string(p.agentComputerName) ?? "")
      if device_hostname == "" { device_hostname = downcase(to_string(p.agentName) ?? "") }
      if device_hostname == "" { device_hostname = downcase(to_string(p.data.computerName) ?? "") }
      device = { "hostname": device_hostname, "type_id": 0 }
      agent_ip = downcase(to_string(p.agentIp) ?? "")
      if agent_ip != "" { device.ip = agent_ip }
      agent_id = to_string(p.agentId) ?? ""
      if agent_id != "" { device.uid = agent_id }

      user_name = downcase(to_string(p.User) ?? "")
      if user_name == "" { user_name = downcase(to_string(p.data.username) ?? "") }
      user_obj = { "name": user_name }
      agent_domain = downcase(to_string(p.agentDomain) ?? "")
      if agent_domain != "" { user_obj.domain = agent_domain }

      # ---- Deep Visibility process objects ------------------------------
      dv_proc_path = to_string(p.ProcessImagePath) ?? ""
      dv_proc_name = to_string(p.ProcessName) ?? ""
      if dv_proc_name == "" {
          m, merr = parse_regex(dv_proc_path, r'(?P<b>[^\\/]+)$')
          if merr == null { dv_proc_name = string(m.b) ?? "" }
      }
      dv_sha256 = downcase(to_string(p.Sha256) ?? "")
      dv_sha1 = downcase(to_string(p.Sha1) ?? "")
      dv_md5 = downcase(to_string(p.Md5) ?? "")
      dv_hashes = []
      if dv_md5 != "" { dv_hashes = push(dv_hashes, { "algorithm_id": 1, "value": dv_md5 }) }
      if dv_sha1 != "" { dv_hashes = push(dv_hashes, { "algorithm_id": 2, "value": dv_sha1 }) }
      if dv_sha256 != "" { dv_hashes = push(dv_hashes, { "algorithm_id": 3, "value": dv_sha256 }) }
      dv_proc_file = { "name": dv_proc_name, "path": dv_proc_path, "type_id": 1 }
      if length(dv_hashes) > 0 { dv_proc_file.hashes = dv_hashes }
      dv_process = {
          "name": dv_proc_name,
          "cmd_line": to_string(p.ProcessCommandLine) ?? "",
          "pid": to_int(p.ProcessId) ?? 0,
          "file": dv_proc_file
      }

      dv_parent_path = to_string(p.ParentProcessImagePath) ?? ""
      dv_parent_name = to_string(p.ParentProcessName) ?? ""
      if dv_parent_name == "" {
          pm, pmerr = parse_regex(dv_parent_path, r'(?P<b>[^\\/]+)$')
          if pmerr == null { dv_parent_name = string(pm.b) ?? "" }
      }
      dv_parent = {
          "name": dv_parent_name,
          "cmd_line": to_string(p.ParentProcessCommandLine) ?? "",
          "pid": to_int(p.ParentProcessId) ?? 0,
          "file": { "name": dv_parent_name, "path": dv_parent_path, "type_id": 1 }
      }
      has_parent = dv_parent_path != "" || dv_parent_name != ""
      # For the non-1007 Deep Visibility classes the initiator is the DV process.
      dv_actor_process = dv_process
      if !has_parent { dv_actor_process = dv_process }

      # ---- defaults; overridden per branch below ------------------------
      class_uid = 1007
      class_name = "Process Activity"
      category_uid = 1
      category_name = "System Activity"
      activity_id = 99
      activity_name = "Other"
      severity_id = 1
      severity = "Informational"
      profiles = ["host"]

      ocsf = {}

      if is_threat {
          # ---- Detection Finding 2004 -----------------------------------
          class_uid = 2004
          class_name = "Detection Finding"
          category_uid = 2
          category_name = "Findings"
          activity_id = 1
          activity_name = "Create"
          profiles = ["host", "security_control"]

          # SentinelOne grades a threat by confidenceLevel, not a numeric score.
          confidence = downcase(to_string(p.confidenceLevel) ?? "")
          confidence_id = 0
          risk_level_id = 0
          risk_level = "Info"
          if confidence == "malicious" {
              severity_id = 5; severity = "Critical"; confidence_id = 3
              risk_level_id = 4; risk_level = "Critical"
          } else if confidence == "suspicious" {
              severity_id = 4; severity = "High"; confidence_id = 2
              risk_level_id = 3; risk_level = "High"
          } else {
              severity_id = 3; severity = "Medium"; confidence_id = 1
              risk_level_id = 2; risk_level = "Medium"
          }
          ocsf.confidence_id = confidence_id

          threat_path = to_string(p.filePath) ?? ""
          threat_name = ""
          tm, tmerr = parse_regex(threat_path, r'(?P<b>[^\\/]+)$')
          if tmerr == null { threat_name = string(tm.b) ?? "" }
          threat_hash = downcase(to_string(p.fileContentHash) ?? "")
          threat_file = { "name": threat_name, "path": threat_path, "type_id": 1 }
          if threat_hash != "" {
              # SentinelOne's fileContentHash is a SHA-1 in the classic threat
              # API and a SHA-256 in newer payloads; distinguish by length
              # rather than asserting one algorithm.
              algorithm_id = 2
              if strlen(threat_hash) == 64 { algorithm_id = 3 }
              if strlen(threat_hash) == 32 { algorithm_id = 1 }
              threat_file.hashes = [{ "algorithm_id": algorithm_id, "value": threat_hash }]
          }
          threat_size = to_int(p.fileSize) ?? 0
          if threat_size > 0 { threat_file.size = threat_size }

          finding_uid = to_string(p.threatId) ?? ""
          if finding_uid == "" { finding_uid = to_string(p.id) ?? "" }
          if finding_uid == "" { finding_uid = uuid_v4() }
          title = to_string(p.threatName) ?? ""
          if title == "" { title = to_string(p.description) ?? "" }
          if title == "" { title = "SentinelOne threat" }

          finding_info = {
              "uid": finding_uid,
              "title": title,
              "data_sources": ["sentinelone"]
          }
          classification = to_string(p.classification) ?? ""
          if classification != "" { finding_info.types = [classification] }
          classification_source = to_string(p.classificationSource) ?? ""
          if classification_source != "" || classification != "" {
              # SentinelOne convicts via its static-AI / behavioural-AI engines,
              # not a customer-authored rule.
              finding_info.analytic = {
                  "name": classification_source,
                  "uid": classification,
                  "type_id": 4,
                  "type": "Learning (ML/DL)"
              }
          }
          ocsf.finding_info = finding_info
          ocsf.is_alert = true
          ocsf.risk_level_id = risk_level_id
          ocsf.risk_level = risk_level

          # 2004 has no top-level `file`, so the convicted binary rides on
          # actor.process.file — it is what executed/was quarantined, and this
          # keeps its path and hash queryable on promoted paths. The same
          # artifact is repeated in evidences[] for fidelity.
          ocsf.actor = {
              "process": { "name": threat_name, "pid": 0, "file": threat_file },
              "user": user_obj
          }
          ocsf.device = device
          ocsf.evidences = [{ "file": threat_file, "device": device }]

          observables = []
          if threat_hash != "" {
              observables = push(observables, { "name": "actor.process.file.hashes.value", "type": "Hash", "type_id": 8, "value": threat_hash })
          }
          if threat_path != "" {
              observables = push(observables, { "name": "actor.process.file.path", "type": "File Name", "type_id": 7, "value": threat_path })
          }
          if device_hostname != "" {
              observables = push(observables, { "name": "device.hostname", "type": "Hostname", "type_id": 1, "value": device_hostname })
          }
          if length(observables) > 0 { ocsf.observables = observables }

          # mitigationStatus -> security_control disposition/action
          mitigation = downcase(to_string(p.mitigationStatus) ?? "")
          disposition_id = 15
          disposition = "Detected"
          action_id = 3
          action = "Observed"
          if mitigation == "mitigated" || mitigation == "blocked" {
              disposition_id = 2; disposition = "Blocked"; action_id = 2; action = "Denied"
          } else if mitigation == "quarantined" || mitigation == "marked_as_benign_quarantined" {
              disposition_id = 3; disposition = "Quarantined"; action_id = 2; action = "Denied"
          } else if mitigation == "killed" {
              disposition_id = 2; disposition = "Blocked"; action_id = 2; action = "Denied"
          } else if mitigation == "not_mitigated" || mitigation == "unmitigated" {
              disposition_id = 16; disposition = "No Action"
          } else if mitigation == "marked_as_benign" {
              disposition_id = 10; disposition = "Exonerated"; action_id = 1; action = "Allowed"
          }
          ocsf.disposition_id = disposition_id
          ocsf.disposition = disposition
          ocsf.action_id = action_id
          ocsf.action = action
          mitigation_desc = to_string(p.mitigationStatusDescription) ?? ""
          if mitigation_desc != "" { ocsf.status_detail = mitigation_desc }

          # 2004 status_id is the FINDING lifecycle, not Success/Failure. A
          # SentinelOne threat arrives open; a mitigated one is resolved.
          status_id = 1
          status = "New"
          if disposition_id == 2 || disposition_id == 3 { status_id = 4; status = "Resolved" }
          if disposition_id == 10 { status_id = 3; status = "Suppressed" }
          ocsf.status_id = status_id
          ocsf.status = status

          # indicators[] carry MITRE techniques and tactics
          mitre_ids = []
          tactic_names = []
          indicators = []
          if is_array(p.indicators) { indicators = array(p.indicators) ?? [] }
          for_each(indicators) -> |_i, ind| {
              techs = []
              if is_array(get(ind, ["techniques"]) ?? null) { techs = array(get(ind, ["techniques"]) ?? []) ?? [] }
              for_each(techs) -> |_j, tq| {
                  tq_str = ""
                  if is_object(tq) {
                      tq_str = to_string(get(tq, ["name"]) ?? "") ?? ""
                  } else {
                      tq_str = to_string(tq) ?? ""
                  }
                  tm2, tm2err = parse_regex(tq_str, r'(?P<tid>[tT]\d{4}(?:\.\d{3})?)')
                  if tm2err == null {
                      mitre_ids = push(mitre_ids, upcase(string(tm2.tid) ?? ""))
                  } else if tq_str != "" {
                      tactic_names = push(tactic_names, tq_str)
                  }
              }
              tacs = []
              if is_array(get(ind, ["tactics"]) ?? null) { tacs = array(get(ind, ["tactics"]) ?? []) ?? [] }
              for_each(tacs) -> |_k, ta| {
                  ta_str = ""
                  if is_object(ta) {
                      ta_str = to_string(get(ta, ["name"]) ?? "") ?? ""
                  } else {
                      ta_str = to_string(ta) ?? ""
                  }
                  if ta_str != "" { tactic_names = push(tactic_names, ta_str) }
              }
          }
          mitre_ids = unique(mitre_ids)
          if length(mitre_ids) > 0 {
              attacks = []
              for_each(mitre_ids) -> |_i, tid| {
                  attacks = push(attacks, { "technique": { "uid": tid } })
              }
              ocsf.attacks = attacks
          }

          engines_str = ""
          if is_array(p.engines) {
              engine_strs = []
              for_each(array(p.engines) ?? []) -> |_i, e| {
                  es = to_string(e) ?? ""
                  if es != "" { engine_strs = push(engine_strs, es) }
              }
              if length(engine_strs) > 0 { engines_str = join!(engine_strs, ",") }
          }
          tactics_str = ""
          if length(tactic_names) > 0 { tactics_str = join!(unique(tactic_names), ",") }

          ocsf.unmapped = {
              "threat_id": to_string(p.threatId) ?? null,
              "classification": classification,
              "classification_source": classification_source,
              "cloud_verdict": to_string(p.cloudVerdict) ?? null,
              "confidence_level": to_string(p.confidenceLevel) ?? null,
              "mitigation_status": to_string(p.mitigationStatus) ?? null,
              "initiated_by": to_string(p.initiatedBy) ?? null,
              "engines": engines_str,
              "mitre_tactics": tactics_str,
              "agent_id": agent_id,
              "agent_version": to_string(p.agentVersion) ?? null,
              "agent_os_type": to_string(p.agentOsType) ?? null,
              "agent_machine_type": to_string(p.agentMachineType) ?? null,
              "agent_network_status": to_string(p.agentNetworkStatus) ?? null,
              "agent_is_active": p.agentIsActive,
              "site_name": to_string(p.siteName) ?? null,
              "group_name": to_string(p.groupName) ?? null,
              "account_name": to_string(p.accountName) ?? null,
              "account_id": to_string(p.accountId) ?? null,
              "description": to_string(p.description) ?? null
          }
      } else if is_activity {
          # ---- API Activity 6003 ---------------------------------------
          # The SentinelOne activity log is a management-console audit trail:
          # a console user acting on the tenant, not endpoint telemetry.
          class_uid = 6003
          class_name = "API Activity"
          category_uid = 6
          category_name = "Application Activity"
          # activityType is an opaque numeric code, so the CRUD verb is unknown.
          activity_id = 99
          activity_name = "Other"

          activity_type = to_string(p.activityType) ?? ""
          primary = to_string(p.primaryDescription) ?? ""
          ocsf.api = {
              "operation": activity_type,
              "service": { "name": "SentinelOne Management Console" }
          }
          api_uid = to_string(p.id) ?? ""
          if api_uid != "" { ocsf.api.request = { "uid": api_uid } }

          actor_user = { "name": user_name }
          user_id = to_string(p.userId) ?? ""
          if user_id != "" { actor_user.uid = user_id }
          ocsf.actor = { "user": actor_user }

          # 6003 requires src_endpoint; the console client IP is the source.
          src_ip = downcase(to_string(p.data.ipAddress) ?? "")
          src_endpoint = {}
          if src_ip != "" { src_endpoint.ip = src_ip }
          if device_hostname != "" { src_endpoint.hostname = device_hostname }
          if is_empty(src_endpoint) { src_endpoint = { "hostname": "" } }
          ocsf.src_endpoint = src_endpoint
          if device_hostname != "" { ocsf.device = device }
          ocsf.status_id = 1
          ocsf.status = "Success"
          if primary != "" { ocsf.status_detail = primary }

          ocsf.unmapped = {
              "activity_type": activity_type,
              "primary_description": primary,
              "secondary_description": to_string(p.secondaryDescription) ?? null,
              "user_role": to_string(p.data.role) ?? null,
              "activity_source": to_string(p.data.source) ?? null,
              "site_name": to_string(p.siteName) ?? null,
              "group_name": to_string(p.groupName) ?? null,
              "account_name": to_string(p.accountName) ?? null,
              "account_id": to_string(p.accountId) ?? null
          }
      } else if is_deep_visibility {
          # ---- Deep Visibility telemetry -------------------------------
          dv_type = downcase(to_string(p.EventType) ?? "")
          registry_path = to_string(p.RegistryPath) ?? ""
          registry_value = to_string(p.RegistryValue) ?? ""
          dns_request = to_string(p.DnsRequest) ?? ""
          src_ip = downcase(to_string(p.SrcIP) ?? "")
          dst_ip = downcase(to_string(p.DstIP) ?? "")

          if contains(dv_type, "dns") {
              class_uid = 4003
              class_name = "DNS Activity"
              category_uid = 4
              category_name = "Network Activity"
              activity_id = 1
              activity_name = "Query"
              # 4003 needs at least one endpoint; the querying host is the source.
              src_endpoint = {}
              if src_ip != "" { src_endpoint.ip = src_ip }
              if device_hostname != "" { src_endpoint.hostname = device_hostname }
              if is_empty(src_endpoint) { src_endpoint = { "hostname": "" } }
              ocsf.src_endpoint = src_endpoint
              if dst_ip != "" { ocsf.dst_endpoint = { "ip": dst_ip, "port": to_int(p.DstPort) ?? 0 } }
              ocsf.query = { "hostname": downcase(dns_request) }
              ocsf.actor = { "process": dv_actor_process, "user": user_obj }
              ocsf.device = device
          } else if contains(dv_type, "network") || contains(dv_type, "ip connect") || contains(dv_type, "ipconnect") {
              class_uid = 4001
              class_name = "Network Activity"
              category_uid = 4
              category_name = "Network Activity"
              activity_id = 1
              activity_name = "Open"
              src_endpoint = { "port": to_int(p.SrcPort) ?? 0 }
              if src_ip != "" { src_endpoint.ip = src_ip }
              if device_hostname != "" { src_endpoint.hostname = device_hostname }
              ocsf.src_endpoint = src_endpoint
              ocsf.dst_endpoint = { "ip": dst_ip, "port": to_int(p.DstPort) ?? 0 }
              ocsf.connection_info = { "direction_id": 2 }
              ocsf.actor = { "process": dv_actor_process, "user": user_obj }
              ocsf.device = device
          } else if contains(dv_type, "registry") {
              if registry_value != "" {
                  class_uid = 201002
                  class_name = "Registry Value Activity"
                  activity_id = 2
                  activity_name = "Set"
                  # SentinelOne gives the full key\value in RegistryPath; split
                  # on the last separator so name/path are both populated.
                  rv_name = ""
                  rvm, rvmerr = parse_regex(registry_path, r'(?P<n>[^\\]+)$')
                  if rvmerr == null { rv_name = string(rvm.n) ?? "" }
                  rv_path = registry_path
                  rpm, rpmerr = parse_regex(registry_path, r'^(?P<p>.*)\\[^\\]+$')
                  if rpmerr == null { rv_path = string(rpm.p) ?? "" }
                  ocsf.reg_value = { "name": rv_name, "path": rv_path, "data": registry_value }
              } else {
                  class_uid = 201001
                  class_name = "Registry Key Activity"
                  activity_id = 1
                  activity_name = "Create"
                  ocsf.reg_key = { "path": registry_path }
              }
              ocsf.actor = { "process": dv_actor_process, "user": user_obj }
              ocsf.device = device
          } else if contains(dv_type, "file") {
              class_uid = 1001
              class_name = "File System Activity"
              activity_id = 3
              activity_name = "Update"
              if contains(dv_type, "creation") || contains(dv_type, "create") {
                  activity_id = 1; activity_name = "Create"
              }
              if contains(dv_type, "deletion") || contains(dv_type, "delete") {
                  activity_id = 4; activity_name = "Delete"
              }
              if contains(dv_type, "rename") { activity_id = 5; activity_name = "Rename" }
              file_path = to_string(p.FilePath) ?? ""
              file_name = ""
              fm, fmerr = parse_regex(file_path, r'(?P<b>[^\\/]+)$')
              if fmerr == null { file_name = string(fm.b) ?? "" }
              file_obj = { "name": file_name, "path": file_path, "type_id": 1 }
              if length(dv_hashes) > 0 { file_obj.hashes = dv_hashes }
              ocsf.file = file_obj
              ocsf.actor = { "process": dv_actor_process, "user": user_obj }
              ocsf.device = device
          } else if contains(dv_type, "process") {
              class_uid = 1007
              class_name = "Process Activity"
              activity_id = 1
              activity_name = "Launch"
              if contains(dv_type, "exit") || contains(dv_type, "termination") {
                  activity_id = 2; activity_name = "Terminate"
              }
              # The DV process is the SUBJECT; its parent is the actor.
              ocsf.process = dv_process
              actor_process = dv_process
              if has_parent { actor_process = dv_parent }
              ocsf.actor = { "process": actor_process, "user": user_obj }
              ocsf.device = device
              ocsf.status_id = 1
              ocsf.status = "Success"
          } else {
              ocsf.process = dv_process
              actor_process = dv_process
              if has_parent { actor_process = dv_parent }
              ocsf.actor = { "process": actor_process, "user": user_obj }
              ocsf.device = device
          }

          ocsf.unmapped = {
              "dv_event_type": to_string(p.EventType) ?? null,
              "agent_id": agent_id,
              "site_name": to_string(p.siteName) ?? null,
              "group_name": to_string(p.groupName) ?? null,
              "account_name": to_string(p.accountName) ?? null,
              "account_id": to_string(p.accountId) ?? null
          }
      } else {
          # ---- unrecognised payload -> Process Activity 1007 (Other) ----
          ocsf.process = dv_process
          ocsf.actor = { "process": dv_process, "user": user_obj }
          ocsf.device = device
          ocsf.unmapped = {
              "site_name": to_string(p.siteName) ?? null,
              "group_name": to_string(p.groupName) ?? null,
              "account_name": to_string(p.accountName) ?? null,
              "account_id": to_string(p.accountId) ?? null
          }
      }

