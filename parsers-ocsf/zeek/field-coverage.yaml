source: json
transforms:
- source: _path
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value
    is emitted.
- source: proto
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value
    is emitted.
- source: service
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value
    is emitted.
- source: msg_types
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value
    is emitted.
- source: action
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value
    is emitted.
- source: ts
  target: time
  kind: scale
  factor: 1000
  reason: Source seconds converted to the emitted millisecond value.
- source: duration
  target: duration
  kind: scale
  factor: 1000
  reason: Source seconds converted to the emitted millisecond value.
