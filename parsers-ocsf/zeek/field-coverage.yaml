source: json
transforms:
- source: _path
  kind: lowercase
  target: metadata.event_code
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: _path
  kind: lowercase
  target: metadata.log_name
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: proto
  kind: lowercase
  target: connection_info.protocol_name
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: service
  kind: lowercase
  target: app_protocol_name
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: service
  kind: lowercase
  target: dst_endpoint.svc_name
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: ts
  target: time
  kind: scale
  factor: 1000
  reason: Source seconds converted to the emitted millisecond value.
- source: duration
  target: duration
  kind: scale
  factor: 1000
  reason: Source seconds converted to the emitted millisecond value.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  TTLs:
  - answers.ttl
  _path:
  - metadata.event_code
  - metadata.log_name
  answers:
  - answers.rdata
  arg:
  - file.name
  - file.path
  assigned_addr:
  - src_endpoint.ip
  client:
  - observables.value
  - user.name
  command:
  - command
  community_id:
  - connection_info.community_uid
  cookie:
  - identifier_cookie
  desktop_height:
  - remote_display.physical_height
  desktop_width:
  - remote_display.physical_width
  domainname:
  - user.domain
  from:
  - email.from
  host:
  - http_request.url.hostname
  host_name:
  - src_endpoint.hostname
  id~1orig_h:
  - evidences.src_endpoint.ip
  - observables.value
  - src_endpoint.ip
  id~1orig_p:
  - evidences.src_endpoint.port
  - src_endpoint.port
  id~1resp_h:
  - dst_endpoint.ip
  - evidences.dst_endpoint.ip
  - observables.value
  id~1resp_p:
  - dst_endpoint.port
  - evidences.dst_endpoint.port
  lease_time:
  - lease_dur
  mac:
  - src_endpoint.mac
  msg:
  - finding_info.desc
  - status_detail
  msg_id:
  - email.message_uid
  name:
  - file.name
  - file.path
  - finding_info.analytic.name
  - finding_info.analytic.uid
  - finding_info.title
  - finding_info.uid
  node:
  - device.hostname
  - src_endpoint.hostname
  note:
  - finding_info.analytic.name
  - finding_info.analytic.uid
  - finding_info.title
  - finding_info.uid
  orig_ip_bytes:
  - traffic.bytes_out
  orig_pkts:
  - traffic.packets_out
  path:
  - share
  proto:
  - connection_info.protocol_name
  qclass_name:
  - query.class
  qtype_name:
  - query.type
  query:
  - observables.value
  - query.hostname
  rcode_name:
  - rcode
  rcptto:
  - email.to
  referrer:
  - http_request.referrer
  reply_code:
  - codes
  reply_msg:
  - status_detail
  resp_ip_bytes:
  - traffic.bytes_in
  resp_pkts:
  - traffic.packets_in
  response_body_len:
  - http_response.length
  - traffic.bytes_in
  result:
  - status_detail
  seen~1indicator:
  - observables.value
  service:
  - app_protocol_name
  - dst_endpoint.svc_name
  sha256:
  - observables.value
  share_type:
  - share_type
  status_code:
  - http_response.code
  subject:
  - email.subject
  trans_id:
  - transaction_id
  uid:
  - connection_info.uid
  - metadata.correlation_uid
  uri:
  - http_request.url.path
  user:
  - actor.user.name
  user_agent:
  - http_request.user_agent
  - observables.value
  username:
  - observables.value
  - user.name
  version:
  - protocol_ver
