name: json_generic_ocsf
display_name: Generic JSON (OCSF)
version: "1.3.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses arbitrary JSON logs into OCSF 1.9.0 by sniffing common field names.
  A generic source has NO fixed schema, so this parser only promotes a record
  to a specific OCSF class when the evidence is unambiguous, and otherwise
  uses the Base Event:
    * an HTTP method/status AND a url/uri  -> HTTP Activity    (class_uid 4002)
    * a source and/or destination IP, no HTTP evidence
                                           -> Network Activity (class_uid 4001)
    * anything else                        -> Base Event       (class_uid 0)
  The COMPLETE source object is copied into `unmapped` regardless of route, so
  nothing is lost when a key has no canonical home — that is what OCSF's
  `unmapped` is for. Mirrors the UDM json_generic parser
  (../parsers/parsers/json_generic/parser.yaml).
  Timestamps without an offset use the log source's timezone setting (UTC if unset).
match_values:
  - json_generic
category: generic
vendor: "nano"
product: "JSON Parser"
parser_vrl: |
  # NAN source timezone. Generated by scripts/residual_spill.py; edit scripts/residual/source_tz.vrl.
  # The log source's timezone setting arrives as .nano.source_timezone (an IANA
  # name such as "America/New_York", or any fixed offset such as "+05:30"), set
  # by nano at ingest. .nano is nano's input, never part of the log: it is
  # removed whole before anything else, whatever its shape.
  # For a clock that carries no offset a parser parses it AS UTC and sets
  # __lc_pending; the generated local-clock block that follows the parse
  # (local_clock.vrl) turns it into real UTC with this setting, and the spill
  # records the zone used as unmapped.nano_time_assumed_tz (the name, the offset
  # as +HH:MM, or "UTC" when the setting is absent, invalid or "local").
  __src_nano = del(.nano)
  __src_tz_in = ""
  if is_object(__src_nano) { __src_tz_in = strip_whitespace(to_string(object!(__src_nano).source_timezone) ?? "") }
  __src_tz = "UTC"
  __src_shift_ms = 0
  __src_tz_label = "UTC"
  __time_assumed = false
  __time_inline = false
  __lc_pending = false
  __lc_shifted = ""
  # No parse_* decoder here: nano infers a parser's input contract from the first
  # decoder in its program (parse_json first = a JSON-input parser, handed the
  # whole HEC / OTLP object). This prelude opens every parser, so a decoder in it
  # would turn every JSON-input parser into a text one. match + slice instead.
  if match(__src_tz_in, r'^[+-]\d{2}:?\d{2}$') {
      __src_sign = slice(__src_tz_in, 0, 1) ?? "+"
      __src_digits = replace(slice(__src_tz_in, 1) ?? "", ":", "")
      __src_hh = slice(__src_digits, 0, 2) ?? "99"
      __src_mm = slice(__src_digits, 2, 4) ?? "99"
      __src_h = to_int(__src_hh) ?? 99
      __src_m = to_int(__src_mm) ?? 99
      if __src_h <= 14 && __src_m <= 59 {
          __src_shift_ms = (__src_h * 3600 + __src_m * 60) * 1000
          if __src_sign == "-" { __src_shift_ms = 0 - __src_shift_ms }
          if __src_shift_ms != 0 { __src_tz_label = __src_sign + __src_hh + ":" + __src_mm }
      }
  } else if __src_tz_in != "" && downcase(__src_tz_in) != "local" {
      # "local" (the Vector host's zone) would make the time depend on the host.
      __src_probe, __src_probe_err = parse_timestamp("2000-01-01 00:00:00", "%Y-%m-%d %H:%M:%S", timezone: __src_tz_in)
      if __src_probe_err == null { __src_tz = __src_tz_in; __src_tz_label = __src_tz_in }
  }
  # END NAN source timezone
  # nano's input contract (nanosiem hec_payload.rs), stated: JSON. From nano
  # v2.0.36 an undeclared parser gets the v2.0.35 HEC delivery (the record's own
  # host / timestamp replaced by the envelope's, an object `message` alone); a
  # declared one gets an HEC object event's whole record, as /ingest does
  # (NAN-5902). Older nano already read this parser as JSON: no change there.
  # nano:input=json
  # Generic JSON -> OCSF 1.9.0 (evidence-routed)
  raw_log = string!(.message)
  __raw_body = raw_log
  __source_kv = {}
  ip_re = r'^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$|^[0-9A-Fa-f:]{3,}$'

  p, perr = parse_json(raw_log)
  __source_kv = object(p) ?? {}
  ok = perr == null && is_object(p)
  e = {}
  if ok { e = object!(p) }


  time_ms = 0
  ts_val = ""
  for_each(["timestamp", "time", "@timestamp", "datetime", "date", "eventTime"]) -> |_i, k| {
      if ts_val == "" {
          v = to_string(get(e, [k]) ?? "") ?? ""
          if v != "" { ts_val = v }
      }
  }
  if ts_val != "" {
      num, numerr = to_float(ts_val)
      if numerr == null {
          # An epoch number (integer or fractional, bare or quoted). The unit is
          # inferred from its magnitude: seconds, milliseconds, microseconds or
          # nanoseconds. A fractional-second epoch used to fail to_int and fall
          # through to `time: 0`, and a microsecond epoch was taken as ms.
          if num >= 1000000000.0 && num < 100000000000.0 {
              time_ms = to_int(num * 1000.0)
          } else if num >= 100000000000.0 && num < 100000000000000.0 {
              time_ms = to_int(num)
          } else if num >= 100000000000000.0 && num < 100000000000000000.0 {
              time_ms = to_int(num / 1000.0)
          } else if num >= 100000000000000000.0 && num < 10000000000000000000.0 {
              time_ms = to_int(num / 1000000.0)
          }
      } else {
          # RFC 3339 with an offset (fractional seconds and a space separator
          # are accepted by %+), then zone-less ISO / space-separated forms with
          # optional fractional seconds (a `,` fraction is normalised to `.`).
          # A zone-less clock is read as UTC, not the collector's local zone.
          t, terr = parse_timestamp(ts_val, "%+", timezone: "UTC")
          if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") } else {
              ts_dot = replace(ts_val, ",", ".")
              t2, t2err = parse_timestamp(ts_dot, "%Y-%m-%dT%H:%M:%S%.f", timezone: "UTC")
              if t2err == null { __lc_pending = true }
              # NAN local clock: t2
              # t2 was just parsed from a clock WITHOUT an offset, read as UTC
              # (__lc_pending). It becomes real UTC here, at the site, with the log source's
              # timezone (__src_tz / __src_shift_ms from the prelude, or an inline IANA zone
              # the parser validated): a fixed offset by arithmetic; an IANA zone with its DST
              # rules, probed 18 h either side (wider than any UTC offset), an ambiguous
              # fall-back time taking its FIRST occurrence (the earlier offset), a time in a
              # spring-forward gap moving forward by the gap. __NOYEAR__: a clock with no
              # year is tried in its year, the year before and the year after (each with its
              # own DST rules); more than a day in the future means last year, more than 180
              # days in the past means next year when that is not in the future.
              if __lc_pending {
                  __lc_pending = false
                  __time_assumed = true
                  __lc_l = to_unix_timestamp(t2, unit: "milliseconds")
                  __lc_cands = [__lc_l]
                  __lc_us = map_values(__lc_cands) -> |l| {
                      if l == null {
                          null
                      } else {
                          __u = int!(l) - __src_shift_ms
                          if __src_tz != "UTC" {
                              __offs = map_values([int!(l) - 64800000, int!(l) + 64800000]) -> |at| {
                                  __z = format_timestamp(from_unix_timestamp!(at, unit: "milliseconds"), "%z", timezone: __src_tz) ?? "+0000"
                                  __o = ((to_int(slice(__z, 1, 3) ?? "0") ?? 0) * 3600 + (to_int(slice(__z, 3, 5) ?? "0") ?? 0) * 60) * 1000
                                  if starts_with(__z, "-") { 0 - __o } else { __o }
                              }
                              __oa = int!(__offs[0])
                              __ob = int!(__offs[1])
                              __u = int!(l) - __oa
                              if __oa != __ob {
                                  __ok = map_values([int!(l) - __oa, int!(l) - __ob]) -> |at| {
                                      __z = format_timestamp(from_unix_timestamp!(at, unit: "milliseconds"), "%z", timezone: __src_tz) ?? "+0000"
                                      __o = ((to_int(slice(__z, 1, 3) ?? "0") ?? 0) * 3600 + (to_int(slice(__z, 3, 5) ?? "0") ?? 0) * 60) * 1000
                                      if starts_with(__z, "-") { 0 - __o } else { __o }
                                  }
                                  if int!(__ok[0]) != __oa && int!(__ok[1]) == __ob { __u = int!(l) - __ob }
                              }
                          }
                          __u
                      }
                  }
                  __lc_u = int!(__lc_us[0])
                  # Remembered (local -> UTC) so a transforms rule on the same source clock
                  # still finds it at its target.
                  if __lc_u != __lc_l { __lc_shifted = __lc_shifted + "\n" + to_string(__lc_l) + "\t" + to_string(__lc_u) + "\n" }
                  t2 = from_unix_timestamp!(__lc_u, unit: "milliseconds")
              }
              # END NAN local clock
              if t2err == null { time_ms = to_unix_timestamp(t2, unit: "milliseconds") } else {
                  t3, t3err = parse_timestamp(ts_dot, "%Y-%m-%d %H:%M:%S%.f", timezone: "UTC")
                  if t3err == null { __lc_pending = true }
                  # NAN local clock: t3
                  # t3 was just parsed from a clock WITHOUT an offset, read as UTC
                  # (__lc_pending). It becomes real UTC here, at the site, with the log source's
                  # timezone (__src_tz / __src_shift_ms from the prelude, or an inline IANA zone
                  # the parser validated): a fixed offset by arithmetic; an IANA zone with its DST
                  # rules, probed 18 h either side (wider than any UTC offset), an ambiguous
                  # fall-back time taking its FIRST occurrence (the earlier offset), a time in a
                  # spring-forward gap moving forward by the gap. __NOYEAR__: a clock with no
                  # year is tried in its year, the year before and the year after (each with its
                  # own DST rules); more than a day in the future means last year, more than 180
                  # days in the past means next year when that is not in the future.
                  if __lc_pending {
                      __lc_pending = false
                      __time_assumed = true
                      __lc_l = to_unix_timestamp(t3, unit: "milliseconds")
                      __lc_cands = [__lc_l]
                      __lc_us = map_values(__lc_cands) -> |l| {
                          if l == null {
                              null
                          } else {
                              __u = int!(l) - __src_shift_ms
                              if __src_tz != "UTC" {
                                  __offs = map_values([int!(l) - 64800000, int!(l) + 64800000]) -> |at| {
                                      __z = format_timestamp(from_unix_timestamp!(at, unit: "milliseconds"), "%z", timezone: __src_tz) ?? "+0000"
                                      __o = ((to_int(slice(__z, 1, 3) ?? "0") ?? 0) * 3600 + (to_int(slice(__z, 3, 5) ?? "0") ?? 0) * 60) * 1000
                                      if starts_with(__z, "-") { 0 - __o } else { __o }
                                  }
                                  __oa = int!(__offs[0])
                                  __ob = int!(__offs[1])
                                  __u = int!(l) - __oa
                                  if __oa != __ob {
                                      __ok = map_values([int!(l) - __oa, int!(l) - __ob]) -> |at| {
                                          __z = format_timestamp(from_unix_timestamp!(at, unit: "milliseconds"), "%z", timezone: __src_tz) ?? "+0000"
                                          __o = ((to_int(slice(__z, 1, 3) ?? "0") ?? 0) * 3600 + (to_int(slice(__z, 3, 5) ?? "0") ?? 0) * 60) * 1000
                                          if starts_with(__z, "-") { 0 - __o } else { __o }
                                      }
                                      if int!(__ok[0]) != __oa && int!(__ok[1]) == __ob { __u = int!(l) - __ob }
                                  }
                              }
                              __u
                          }
                      }
                      __lc_u = int!(__lc_us[0])
                      # Remembered (local -> UTC) so a transforms rule on the same source clock
                      # still finds it at its target.
                      if __lc_u != __lc_l { __lc_shifted = __lc_shifted + "\n" + to_string(__lc_l) + "\t" + to_string(__lc_u) + "\n" }
                      t3 = from_unix_timestamp!(__lc_u, unit: "milliseconds")
                  }
                  # END NAN local clock
                  if t3err == null { time_ms = to_unix_timestamp(t3, unit: "milliseconds") }
              }
          }
      }
  }
  # No parseable clock: OCSF `time` is required, so stamp the ingest time
  # rather than emit 0 (1970). The unparsed source value still spills to
  # `unmapped`, so it is never lost.
  if time_ms == 0 { time_ms = to_unix_timestamp(now(), unit: "milliseconds") }

  src_ip = ""
  for_each(["src_ip", "source_ip", "client_ip", "clientIp", "remote_addr"]) -> |_i, k| {
      if src_ip == "" {
          v = to_string(get(e, [k]) ?? "") ?? ""
          if match(v, ip_re) { src_ip = v }
      }
  }
  dst_ip = ""
  for_each(["dest_ip", "dst_ip", "destination_ip", "server_ip", "target_ip"]) -> |_i, k| {
      if dst_ip == "" {
          v = to_string(get(e, [k]) ?? "") ?? ""
          if match(v, ip_re) { dst_ip = v }
      }
  }
  user_name = ""
  for_each(["user", "username", "user_name", "src_user", "account"]) -> |_i, k| {
      if user_name == "" { user_name = to_string(get(e, [k]) ?? "") ?? "" }
  }
  host_name = ""
  for_each(["host", "hostname", "dvc", "device", "computer"]) -> |_i, k| {
      if host_name == "" { host_name = to_string(get(e, [k]) ?? "") ?? "" }
  }
  url_str = ""
  for_each(["url", "uri", "request_url", "request_uri"]) -> |_i, k| {
      if url_str == "" { url_str = to_string(get(e, [k]) ?? "") ?? "" }
  }
  method = ""
  for_each(["method", "http_method", "request_method", "verb"]) -> |_i, k| {
      if method == "" { method = upcase(to_string(get(e, [k]) ?? "") ?? "") }
  }
  code = 0
  for_each(["status_code", "http_status_code", "status", "response_code"]) -> |_i, k| {
      if code == 0 {
          n = to_int(get(e, [k]) ?? 0) ?? 0
          if n >= 100 && n <= 599 { code = n }
      }
  }
  src_port = to_int(get(e, ["src_port"]) ?? 0) ?? 0
  if src_port == 0 { src_port = to_int(get(e, ["source_port"]) ?? 0) ?? 0 }
  dst_port = to_int(get(e, ["dest_port"]) ?? 0) ?? 0
  if dst_port == 0 { dst_port = to_int(get(e, ["dst_port"]) ?? 0) ?? 0 }
  if dst_port == 0 { dst_port = to_int(get(e, ["destination_port"]) ?? 0) ?? 0 }
  protocol = downcase(to_string(get(e, ["protocol"]) ?? "") ?? "")
  user_agent = to_string(get(e, ["user_agent"]) ?? "") ?? ""
  referrer = to_string(get(e, ["referer"]) ?? "") ?? ""
  if referrer == "" { referrer = to_string(get(e, ["referrer"]) ?? "") ?? "" }
  pid = to_int(get(e, ["pid"]) ?? 0) ?? 0
  if pid == 0 { pid = to_int(get(e, ["process_id"]) ?? 0) ?? 0 }
  proc_name = to_string(get(e, ["process_name"]) ?? "") ?? ""
  if proc_name == "" { proc_name = to_string(get(e, ["image"]) ?? "") ?? "" }
  cmd_line = to_string(get(e, ["command_line"]) ?? "") ?? ""
  if cmd_line == "" { cmd_line = to_string(get(e, ["cmdline"]) ?? "") ?? "" }
  msg_text = to_string(get(e, ["message"]) ?? "") ?? ""
  if msg_text == "" { msg_text = to_string(get(e, ["msg"]) ?? "") ?? "" }

  sev_raw = ""
  for_each(["severity", "level", "log_level", "loglevel"]) -> |_i, k| {
      if sev_raw == "" { sev_raw = downcase(to_string(get(e, [k]) ?? "") ?? "") }
  }
  severity_id = 1
  severity = "Informational"
  if contains(sev_raw, "fatal") || contains(sev_raw, "emerg") { severity_id = 6; severity = "Fatal" } else if contains(sev_raw, "crit") { severity_id = 5; severity = "Critical" } else if contains(sev_raw, "err") || contains(sev_raw, "high") { severity_id = 4; severity = "High" } else if contains(sev_raw, "warn") || contains(sev_raw, "medium") { severity_id = 3; severity = "Medium" } else if contains(sev_raw, "notice") || contains(sev_raw, "low") { severity_id = 2; severity = "Low" }

  # The whole source record is preserved in `unmapped`: a generic source has
  # no schema, so anything not positively identified above still has to land
  # somewhere addressable rather than being dropped.
  unmapped = e

  metadata = {
      "version": "1.9.0",
      "uid": sha2("json_generic|raw|" + raw_log, variant: "SHA-256"),
      "profiles": ["host"],
      "log_name": "json_generic",
      "product": { "name": "JSON Parser", "vendor_name": "nano" }
  }
  if sev_raw != "" { metadata.log_level = sev_raw }
  ecode = to_string(get(e, ["event_code"]) ?? "") ?? ""
  if ecode != "" { metadata.event_code = ecode }

  device = { "type_id": 0 }
  if host_name != "" { device.hostname = downcase(host_name) }

  actor = {}
  if user_name != "" { actor.user = { "name": user_name } }
  # Base Event has no top-level `process`; actor.process (host profile) is
  # the canonical home on every class this parser emits. NAN-5079: OCSF 1.9
  # `process` requires at least one of pid / uid / cpid, so actor.process is
  # emitted only with a pid. Without one, the process name is the initiating
  # application (actor.app_name) and a bare command line stays in unmapped.
  if pid != 0 {
      proc = { "pid": pid }
      if proc_name != "" { proc.name = proc_name }
      if cmd_line != "" { proc.cmd_line = cmd_line }
      actor.process = proc
  } else if proc_name != "" {
      actor.app_name = proc_name
  }

  has_http = (method != "" || code != 0) && url_str != ""
  has_net = src_ip != "" || dst_ip != ""

  if ok && has_http {
      # =================== HTTP Activity (4002) ===================
      activity_id = 99
      activity_name = "Other"
      if method == "CONNECT" { activity_id = 1; activity_name = "Connect" }
      if method == "DELETE"  { activity_id = 2; activity_name = "Delete" }
      if method == "GET"     { activity_id = 3; activity_name = "Get" }
      if method == "HEAD"    { activity_id = 4; activity_name = "Head" }
      if method == "OPTIONS" { activity_id = 5; activity_name = "Options" }
      if method == "POST"    { activity_id = 6; activity_name = "Post" }
      if method == "PUT"     { activity_id = 7; activity_name = "Put" }
      if method == "TRACE"   { activity_id = 8; activity_name = "Trace" }
      if method == "PATCH"   { activity_id = 9; activity_name = "Patch" }

      status_id = 2
      status_str = "Failure"
      if code >= 200 && code < 400 { status_id = 1; status_str = "Success" }
      if code == 0 { status_id = 0; status_str = "Unknown" }

      url_obj = {}
      pu, puerr = parse_url(url_str)
      if puerr == null {
          url_obj.url_string = url_str
          up = to_string(pu.path)
          if up != "" { url_obj.path = up }
          uh = to_string(pu.host)
          if uh != "" { url_obj.hostname = downcase(uh) }
          us = to_string(pu.scheme)
          if us != "" { url_obj.scheme = us }
      } else {
          # A bare path is never a url_string per the OCSF url object.
          sp = split(url_str, "?", limit: 2)
          url_obj.path = to_string(sp[0])
          if length(sp) == 2 { url_obj.query_string = to_string(sp[1]) }
      }
      dom = to_string(get(e, ["domain"]) ?? "") ?? ""
      if dom != "" && !exists(url_obj.hostname) { url_obj.hostname = downcase(dom) }
      if !exists(url_obj.path) && !exists(url_obj.url_string) { url_obj.path = "/" }

      http_request = { "url": url_obj }
      if method != "" { http_request.http_method = method }
      if user_agent != "" { http_request.user_agent = user_agent }
      if referrer != "" { http_request.referrer = referrer }

      . = {
          "class_uid": 4002,
          "class_name": "HTTP Activity",
          "category_uid": 4,
          "category_name": "Network Activity",
          "activity_id": activity_id,
          "activity_name": activity_name,
          "type_uid": 400200 + activity_id,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": status_id,
          "status": status_str,
          "time": time_ms,
          "raw_data": raw_log,
          "metadata": metadata,
          "http_request": http_request,
          "http_response": { "code": code, "status": status_str },
          "unmapped": unmapped
      }
      se = {}
      if src_ip != "" { se.ip = src_ip }
      if src_port != 0 { se.port = src_port }
      if exists(se.ip) { .src_endpoint = se }
      de = {}
      if dst_ip != "" { de.ip = dst_ip }
      if dst_port != 0 { de.port = dst_port }
      if exists(url_obj.hostname) { de.hostname = url_obj.hostname }
      if exists(de.ip) || exists(de.hostname) { .dst_endpoint = de }
      if length(actor) > 0 { .actor = actor }
      if exists(device.hostname) { .device = device }
  } else if ok && has_net {
      # =================== Network Activity (4001) ===================
      . = {
          "class_uid": 4001,
          "class_name": "Network Activity",
          "category_uid": 4,
          "category_name": "Network Activity",
          "activity_id": 6,
          "activity_name": "Traffic",
          "type_uid": 400106,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": 0,
          "status": "Unknown",
          "time": time_ms,
          "raw_data": raw_log,
          "metadata": metadata,
          "unmapped": unmapped
      }
      se = {}
      if src_ip != "" { se.ip = src_ip }
      if src_port != 0 { se.port = src_port }
      if host_name != "" { se.hostname = downcase(host_name) }
      de = {}
      if dst_ip != "" { de.ip = dst_ip }
      if dst_port != 0 { de.port = dst_port }
      if exists(se.ip) || exists(se.hostname) { .src_endpoint = se }
      if exists(de.ip) { .dst_endpoint = de }
      if !exists(.src_endpoint) && !exists(.dst_endpoint) { .src_endpoint = { "svc_name": "json_generic" } }
      if protocol != "" { .connection_info = { "direction_id": 0, "direction": "Unknown", "protocol_name": protocol } }
      if length(actor) > 0 { .actor = actor }
      if exists(device.hostname) { .device = device }
  } else {
      # =================== Base Event (0) ===================
      # No positive evidence of a specific class. OCSF's Base Event is the
      # concrete class for exactly this case — it keeps time, severity,
      # message, device, actor and the full source record (in `unmapped`)
      # addressable without asserting a class the data does not support.
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 99,
          "activity_name": "Other",
          "type_uid": 99,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": 0,
          "status": "Unknown",
          "time": time_ms,
          "raw_data": raw_log,
          "metadata": metadata
      }
      if ok {
          .unmapped = unmapped
          if length(actor) > 0 { .actor = actor }
          if exists(device.hostname) { .device = device }
          if msg_text != "" { .status_detail = msg_text }
      } else {
          .metadata.log_level = "error"
          .unmapped = { "parse_error": to_string(perr) }
      }
  }

  .

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # Values spill exactly as parsed: a parser never masks, redacts or withholds
  # anything (masking is an opt-in pipeline step, never a parser concern).
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # A source field is consumed ONLY by an explicit mapping: a field-coverage.yaml
  # `mappings` entry (source key -> target paths) or a `transforms` rule with a
  # target, whose value is found AT THAT TARGET PATH of the selected branch. A
  # value that merely appears somewhere else in the event never consumes a field
  # (no coincidental consumption); everything else spills.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The sets below are strings instead
  # (a read shares the buffer). __repr holds one member per mapped leaf:
  # "," + encode_json(path) + "=" + encode_json(encode_json(value)), plus the
  # to_string form for a string or a float, so a numeric string is represented by
  # its typed scalar. Every part is a JSON text, inside which a '"' is always
  # escaped, so a member is matched exactly. Paths drop array indices
  # (resources.0.uid is resources.uid); arrays are walked two levels deep, and a
  # leaf deeper than that is simply not mapping evidence (it can only spill more).
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped = object!(parse_json!(encode_json(__mapped)))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __copy = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __repr = ""
  for_each(flatten(__mapped)) -> |path, value| {
      __p = encode_json(path)
      if is_array(value) {
          for_each(array!(value)) -> |_i, item| {
              if is_object(item) {
                  for_each(flatten(object!(item))) -> |sub, leaf| {
                      __q = encode_json(path + "." + sub)
                      if is_array(leaf) {
                          for_each(array!(leaf)) -> |_j, x| {
                              if !is_object(x) && !is_array(x) {
                                  __repr = __repr + ("," + __q + "=" + encode_json(encode_json(x)))
                                  if is_string(x) || is_float(x) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(x))) }
                              }
                          }
                      } else {
                          __repr = __repr + ("," + __q + "=" + encode_json(encode_json(leaf)))
                          if is_string(leaf) || is_float(leaf) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(leaf))) }
                      }
                  }
              } else if !is_array(item) {
                  __repr = __repr + ("," + __p + "=" + encode_json(encode_json(item)))
                  if is_string(item) || is_float(item) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(item))) }
              }
          }
      } else {
          __repr = __repr + ("," + __p + "=" + encode_json(encode_json(value)))
          if is_string(value) || is_float(value) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(value))) }
      }
  }
  __consumed = ""
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__copy.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # BEGIN parser-specific transformations
  # @timestamp: Existing timestamp conversion verified against the emitted millisecond clock.
  # level: Case normalization already performed by the parser; observed at metadata.log_level, and checked against the emitted branch.
  # timestamp: Existing timestamp conversion verified against the emitted millisecond clock.
  # protocol: Case normalization already performed by the parser; observed at connection_info.protocol_name, and checked against the emitted branch.
  # time: Existing unit conversion by 1000 verified against time; unused clock fallbacks remain residual.
  # datetime: Existing timestamp conversion verified against the emitted millisecond clock.
  # pid: Integer identity (NAN-5073), checked at the exact emitted path, so a coincidentally equal value elsewhere in the event (severity_id, activity_id, another port) cannot consume the key; when the branch does not emit it, it stays in unmapped.
  # src_port: Integer identity (NAN-5073), checked at the exact emitted path, so a coincidentally equal value elsewhere in the event (severity_id, activity_id, another port) cannot consume the key; when the branch does not emit it, it stays in unmapped.
  # dest_port: Integer identity (NAN-5073), checked at the exact emitted path, so a coincidentally equal value elsewhere in the event (severity_id, activity_id, another port) cannot consume the key; when the branch does not emit it, it stays in unmapped.
  for_each(__flat) -> |key, value| {
      if match(key, r'(?x)
      \A(?:
        @timestamp
      | timestamp
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%+", timezone: "UTC")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              # A clock the local-clock block moved to real UTC (the log source's
              # timezone, a year rollover) is matched by its converted value. Emitted
              # only for a parser with a local-clock block (compile cost, NAN-5298).
              if __lc_shifted != "" && !(contains(__repr, "," + "\"time\"" + "=" + encode_json(encode_json(__expected)))) {
                  __lc_at = find(__lc_shifted, "\n" + to_string(__expected) + "\t")
                  if is_integer(__lc_at) {
                      __lc_rest = slice!(__lc_shifted, int!(__lc_at) + strlen(to_string(__expected)) + 2)
                      __expected = to_int(slice!(__lc_rest, 0, int!(find(__lc_rest, "\n")))) ?? __expected
                  }
              }
              if contains(__repr, "," + "\"time\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        level
      )\z') {
          __value = value
          if is_string(__value) {
              __expected = downcase(string!(__value))
              if contains(__repr, "," + "\"metadata.log_level\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        protocol
      )\z') {
          __value = value
          if is_string(__value) {
              __expected = downcase(string!(__value))
              if contains(__repr, "," + "\"connection_info.protocol_name\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        time
      )\z') {
          __value = value
          __number, __number_err = to_float(__value)
          if __number_err == null && __value != null && !is_boolean(__value) {
              __expected = to_int(__number * 1000.0)
              if contains(__repr, "," + "\"time\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        datetime
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%Y-%m-%d %H:%M:%S", timezone: "UTC")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              # A clock the local-clock block moved to real UTC (the log source's
              # timezone, a year rollover) is matched by its converted value. Emitted
              # only for a parser with a local-clock block (compile cost, NAN-5298).
              if __lc_shifted != "" && !(contains(__repr, "," + "\"time\"" + "=" + encode_json(encode_json(__expected)))) {
                  __lc_at = find(__lc_shifted, "\n" + to_string(__expected) + "\t")
                  if is_integer(__lc_at) {
                      __lc_rest = slice!(__lc_shifted, int!(__lc_at) + strlen(to_string(__expected)) + 2)
                      __expected = to_int(slice!(__lc_rest, 0, int!(find(__lc_rest, "\n")))) ?? __expected
                  }
              }
              if contains(__repr, "," + "\"time\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        pid
      )\z') {
          __value = value
          __number, __number_err = to_float(__value)
          if __number_err == null && __value != null && !is_boolean(__value) {
              __expected = to_int(__number * 1.0)
              if contains(__repr, "," + "\"actor.process.pid\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        src_port
      )\z') {
          __value = value
          __number, __number_err = to_float(__value)
          if __number_err == null && __value != null && !is_boolean(__value) {
              __expected = to_int(__number * 1.0)
              if contains(__repr, "," + "\"src_endpoint.port\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        dest_port
      )\z') {
          __value = value
          __number, __number_err = to_float(__value)
          if __number_err == null && __value != null && !is_boolean(__value) {
              __expected = to_int(__number * 1.0)
              if contains(__repr, "," + "\"dst_endpoint.port\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
  }
  # Declared source -> target mappings (field-coverage.yaml `mappings`).
  __decl = "\n\"message\"\t[\"status_detail\"]\n\"process_name\"\t[\"actor.app_name\",\"actor.process.name\"]\n\"referer\"\t[\"http_request.referrer\"]\n\"user_agent\"\t[\"http_request.user_agent\"]\n"
  __preserve = []
  # END parser-specific transformations
  # Declared mappings: __decl holds "\n" + encode_json(key) + "\t" + JSON array of
  # target paths + "\n" per mapped source key (a raw newline never occurs in
  # compact JSON). A key is consumed when its value, or every element of a scalar
  # array, is at one of its own targets. Keys stay ESCAPED here and in __consumed:
  # a literal dotted key ("a~1b") and the nested path ("a.b") are different
  # fields, and mapping one never consumes the other.
  for_each(__flat) -> |key, value| {
      # __decl spells a bracket inside a key as a \u escape (deploy bracket count).
      __kt = encode_json(key)
      if match(__kt, r'[\x28\x29\x5B\x5D\x7B\x7D]') {
          __kt = replace(replace(replace(replace(replace(replace(__kt, r'\x28', "\\u0028"), r'\x29', "\\u0029"), r'\x5B', "\\u005b"), r'\x5D', "\\u005d"), r'\x7B', "\\u007b"), r'\x7D', "\\u007d")
      }
      __at = find(__decl, "\n" + __kt + "\t")
      if is_integer(__at) && !is_object(value) {
          __rest = slice!(__decl, int!(__at) + strlen(__kt) + 2)
          __hit = false
          for_each(array!(parse_json!(slice!(__rest, 0, int!(find(__rest, "\n")))))) -> |_i, target| {
              __tok = "," + encode_json(target) + "="
              if !__hit && is_array(value) {
                  __all = !is_empty(array!(value))
                  for_each(array!(value)) -> |_j, item| {
                      if __all {
                          __all = !is_object(item) && !is_array(item) && (contains(__repr, __tok + encode_json(encode_json(item))) || ((is_string(item) || is_float(item)) && contains(__repr, __tok + encode_json(to_string!(item)))))
                      }
                  }
                  __hit = __all
              } else if !__hit {
                  __hit = contains(__repr, __tok + encode_json(encode_json(value))) || ((is_string(value) || is_float(value)) && contains(__repr, __tok + encode_json(to_string!(value))))
              }
          }
          if __hit { __consumed = __consumed + ("," + encode_json(key)) }
      }
  }
  # Fast path: when no two source keys decode to the same key and no two spilled
  # keys get the same name, each key's decision depends only on its own value, so
  # one filter and one rename build the residual without copying it per key.
  __distinct = true
  if __tilde {
      __distinct = length(map_keys(__flat) -> |key| { replace(replace(key, "~1", "."), "~0", "~") }) == length(__flat)
  }
  __kept = {}
  __names = {}
  if __distinct {
      __kept = filter(__flat) -> |key, value| {
          # A key is kept unless an explicit mapping or transformation consumed it.
          # Do not spill a copy of the raw body.
          value != __raw_body && !contains(__consumed, "," + encode_json(key))
      }
      __names = map_keys(__kept) -> |key| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          join!(__parts, ".")
      }
  }
  __residual = {}
  if __distinct && length(__names) == length(__kept) {
      __residual = map_values(__names) -> |value| {
          if is_array(value) || is_object(value) {
              if __tilde {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              if __complex { value = encode_json(value) }
          }
          value
      }
  } else {
      # Slow path: two spilled keys get the same name. A literal dotted key and a
      # nested path read alike ({"a.b": 1, "a": {"b": 2}} is "a.b" twice), and so
      # do keys that only snake-case alike ("userName", "user_name").
      # NAN-5894: a literal dotted key whose name is shared keeps its dots
      # escaped, RFC 6901 style ("a~1b", a "~" in it as "~0"), and the key
      # without a literal dot keeps "a.b". That is the name nano's ingest step
      # gives the flat key when no parser runs, so the name never depends on
      # whether a parser read the event, and it cannot clash with a vendor key
      # that is really named "b_2". A key is escaped only when its escaped name
      # is unique too (two flat keys that only snake-case alike escape to the
      # same name, so escaping would not tell them apart). Only a name still
      # taken after that gets the next free _2, _3, ... suffix, in key order:
      # keys that differ only in case or snake-casing, or a vendor key already
      # spelled "a~1b" (nothing is ever dropped).
      __spilled = filter(__flat) -> |key, value| {
          value != __raw_body && !contains(__consumed, "," + encode_json(key))
      }
      __plain = map_values(keys(__spilled)) -> |key| {
          key = replace(replace(string!(key), "~1", "."), "~0", "~")
          join!(map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }, ".")
      }
      __shared = filter(tally!(__plain)) -> |_name, count| { count > 1 }
      __shared = "\n" + join!(map_values(keys(__shared)) -> |name| { encode_json(name) }, "\n") + "\n"
      # The escaped name of each literal dotted key ("" for any other key).
      __escaped_names = map_values(keys(__spilled)) -> |key| {
          key = string!(key)
          if contains(key, "~1") {
              join!(map_values(split(key, ".")) -> |segment| {
                  join!(map_values(split(string!(segment), "~1")) -> |piece| {
                      replace(snakecase(replace(string!(piece), "~0", "~")), "~", "~0")
                  }, "~1")
              }, ".")
          } else { "" }
      }
      __escaped_shared = filter(tally!(__escaped_names)) -> |_name, count| { count > 1 }
      __escaped_shared = "\n" + join!(map_values(keys(__escaped_shared)) -> |name| { encode_json(name) }, "\n") + "\n"
      for_each(__flat) -> |key, value| {
          __token = "," + encode_json(key)
          __escaped_key = key
          key = replace(replace(key, "~1", "."), "~0", "~")
          if is_array(value) || is_object(value) {
              value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                  replace(replace(inner, "~1", "."), "~0", "~")
              }, ["v"])
          }
          if !contains(__consumed, __token) && value != __raw_body {
              __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
              __base = join!(__parts, ".")
              if contains(__escaped_key, "~1") && contains(__shared, "\n" + encode_json(__base) + "\n") {
                  __escaped_name = join!(map_values(split(__escaped_key, ".")) -> |segment| {
                      join!(map_values(split(string!(segment), "~1")) -> |piece| {
                          replace(snakecase(replace(string!(piece), "~0", "~")), "~", "~0")
                      }, "~1")
                  }, ".")
                  if !contains(__escaped_shared, "\n" + encode_json(__escaped_name) + "\n") { __base = __escaped_name }
              }
              __key = __base
              __suffix = 2
              if includes(keys(__residual), __key) {
                  for_each(__flat) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __key) {
                          __key = __base + "_" + to_string(__suffix)
                          __suffix = __suffix + 1
                      }
                  }
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              __spill = if __complex { encode_json(value) } else { value }
              __residual = set!(__residual, [__key], __spill)
          }
      }
  }
  # Names nano owns in unmapped (the parser markers and the reserved nano.*
  # namespace) are never taken by a source field: a vendor key with such a name
  # is kept, renamed source_<name>, so a log cannot forge a marker. An escaped
  # flat key ("nano~1x", NAN-5894) is renamed the same way as "nano.x".
  if match(encode_json(keys(__residual)), r'"nano(?:"|\.|~1|_time_assumed_tz"|_time_source"|_operational")') {
      for_each(object!(__residual)) -> |key, value| {
          if includes(["nano", "nano_time_assumed_tz", "nano_time_source", "nano_operational"], key) || starts_with(key, "nano.") || starts_with(key, "nano~1") {
              # source_<name>, or the next free _2, _3, ... when a vendor key
              # already holds that name: nothing is lost.
              __rk = "source_" + key
              __rn = 2
              if includes(keys(__residual), __rk) {
                  for_each(__residual) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __rk) {
                          __rk = "source_" + key + "_" + to_string(__rn)
                          __rn = __rn + 1
                      }
                  }
              }
              __residual = remove!(__residual, [key])
              __residual = set!(__residual, [__rk], value)
          }
      }
  }
  # Keep existing derived evidence, but remove null placeholders and copies of a
  # source value (that value is mapped or spilled above under its source path).
  # A value merely equal to some mapped attribute is kept: equality with an
  # unrelated attribute is no evidence that it is represented.
  # The canonical source spill above is the authoritative representation of
  # containers. The cheap conditions run first; the source value set is built on
  # first use.
  __original_values = null
  for_each(flatten(__existing)) -> |key, value| {
      if !is_null(value) && value != "" && !is_array(value) && !is_object(value) && value != __raw_body {
          # Members for the value itself and for to_string(value), as above.
          __json = encode_json(value)
          __as_json = "," + encode_json(__json)
          __as_string = __as_json
          if is_string(value) { __as_string = "," + __json } else if is_float(value) { __as_string = "," + encode_json(to_string!(value)) }
          if __original_values == null {
              # __source_kv may hold non-JSON types (a timestamp), so only an
              # integer or a boolean skips its to_string member here.
              __original_values = join!(map_values(values(flatten(__source_kv))) -> |source_value| {
                  __source_json = encode_json(source_value)
                  __tokens = "," + encode_json(__source_json)
                  if is_string(source_value) {
                      __tokens = __tokens + "," + __source_json
                  } else if !is_object(source_value) && !is_array(source_value) && !is_integer(source_value) && !is_boolean(source_value) {
                      __tokens = __tokens + "," + encode_json(to_string(source_value) ?? "")
                  }
                  __tokens
              }, "")
          }
          __source_set = string!(__original_values)
          __keep = !contains(__source_set, __as_json) && !contains(__source_set, __as_string)
          # Only text opening an object or an array (after JSON whitespace)
          # decodes to a container.
          if __keep && is_string(value) && match(string!(value), r'^[ \t\n\r]*[\x5B\x7B]') {
              __decoded, __decode_err = parse_json(string!(value))
              __keep = !(__decode_err == null && (is_object(__decoded) || is_array(__decoded)))
          }
          if __keep {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, as-is. These
  # entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__copy.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  if __time_assumed && !__time_inline { __residual = set!(__residual, ["nano_time_assumed_tz"], __src_tz_label) }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

# Runtime samples (NAN-2327): one per event shape this parser routes.
# `class_uid` is asserted because class routing is the whole point of the
# OCSF conversion — a silent reroute is the defect most likely to survive
# a compile-only check.
samples:
  - raw: '{"@timestamp":"2026-08-12T09:15:30.123Z","level":"ERROR","message":"failed to write checkpoint","service":"ingest-worker","pid":8811,"process_name":"ingestd","hostname":"worker-03","attempt":4,"queue_depth":19233}'
    expect:
      class_uid: 0
      activity_id: 99
  - raw: '{"unterminated":'
    expect:
      class_uid: 0
      activity_id: 99
  - raw: '{"timestamp":"2026-08-12T09:15:22Z","client_ip":"203.0.113.7","server_ip":"192.0.2.10","method":"GET","url":"https://api.example.com/v1/users?page=2","status_code":200,"user":"svc-report","user_agent":"go-http-client/2.0","referer":"https://app.example.com/","latency_ms":42,"trace":"abc123"}'
    expect:
      class_uid: 4002
      activity_id: 3
  - raw: '{"foo":"bar","n":1,"nested":{"a":[1,2,3]}}'
    expect:
      class_uid: 0
      activity_id: 99
  - raw: '{"time":1786000522,"src_ip":"10.0.5.4","dest_ip":"198.51.100.9","src_port":49122,"dest_port":8443,"protocol":"TCP","action":"allow","severity":"low","hostname":"edge-fw-1"}'
    expect:
      class_uid: 4001
      activity_id: 6
  - raw: '{"datetime":"2026-08-12 09:15:40","uri":"/internal/health?deep=1","http_method":"POST","response_code":503,"remote_addr":"10.0.5.99","username":"probe"}'
    expect:
      class_uid: 4002
      activity_id: 6
  # NAN-3702 (existing sample, error branch): metadata.uid is sha256("json_generic|raw|" + raw), so the
  # same record parsed twice gets the same uid (a random uid could never match).
  - raw: "{\"@timestamp\":\"2026-08-12T09:15:30.123Z\",\"level\":\"ERROR\",\"message\":\"failed to write checkpoint\",\"service\":\"ingest-worker\",\"pid\":8811,\"process_name\":\"ingestd\",\"hostname\":\"worker-03\",\"attempt\":4,\"queue_depth\":19233}"
    expect:
      "metadata.uid": "9b633bd986c2107b8042abcfac0cce9111572661cab77b4d0f34cb3beca22051"
  # NAN-5073: the acceptance-harness `jg-msg-envelope` record (open-core
  # fixture 10_json_generic.json). Base Event has no top-level `process`; pid
  # lands at actor.process.pid (host profile), status_detail carries message.
  - raw: '{"@timestamp":"2026-11-08T20:20:00.893Z","level":"ERROR","message":"checkpoint write failed oca-mark","service":"oca-worker","pid":8811,"attempt":4}'
    expect:
      class_uid: 0
      time: 1794169200893
      "actor.process.pid": 8811
      status_detail: "checkpoint write failed oca-mark"
      "metadata.log_level": "error"
      "unmapped.service": "oca-worker"
      "unmapped.attempt": 4
  # NAN-5073: a candidate key whose value only COINCIDES with another emitted
  # value was consumed and dropped (src_port 4 == severity_id 4, pid 0 ==
  # status_id 0, hash "x" == status_detail "x"). Unemitted keys must spill.
  - raw: '{"message":"x","level":"error","src_port":4,"pid":0,"hash":"x","file_path":"/var/tmp/a.bin","sha256":"ABCDEF"}'
    expect:
      class_uid: 0
      "unmapped.src_port": 4
      "unmapped.pid": 0
      "unmapped.hash": "x"
      "unmapped.file_path": "/var/tmp/a.bin"
      "unmapped.sha_256": "ABCDEF"
  # NAN-5073 / NAN-5079: a process name without a pid is still mapped, as
  # actor.app_name (OCSF 1.9 process needs pid/uid/cpid); the command line
  # stays in unmapped.
  - raw: '{"timestamp":"2026-11-08T20:20:00Z","message":"started","process_name":"ingestd","cmdline":"ingestd --run"}'
    expect:
      class_uid: 0
      "actor.app_name": "ingestd"
      "unmapped.cmdline": "ingestd --run"
  # Acceptance-harness `jg-epoch-time`: integer epoch-seconds `time`.
  - raw: '{"time":1794170278,"src_ip":"10.0.7.4","dest_ip":"198.51.100.11","dest_port":3389,"protocol":"TCP","action":"deny"}'
    expect:
      class_uid: 4001
      time: 1794170278000
      "dst_endpoint.port": 3389
  # Fractional-second epoch (number and quoted) used to emit time 0.
  - raw: '{"time":1794170278.893,"message":"fractional epoch"}'
    expect:
      time: 1794170278893
  - raw: '{"@timestamp":"1794170278.893","message":"quoted fractional epoch"}'
    expect:
      time: 1794170278893
  # Microsecond epoch used to be read as milliseconds (year ~58,800).
  - raw: '{"@timestamp":1794170278123456,"message":"microsecond epoch"}'
    expect:
      time: 1794170278123
  # Zone-less ISO / space-separated clocks with fractional seconds, read as UTC.
  - raw: '{"@timestamp":"2026-11-08T20:20:00.893","message":"zone-less iso"}'
    expect:
      time: 1794169200893
  - raw: '{"@timestamp":"2026-11-08 20:20:00,893","message":"python logging clock"}'
    expect:
      time: 1794169200893
  # A vendor field named like a nano marker is kept as source_<name>; it never forges the marker.
  - raw: "{\"timestamp\": \"2026-08-18T10:00:00Z\", \"message\": \"a vendor log whose own fields use nano marker names\", \"nano_time_assumed_tz\": \"Mars/Base\", \"nano_operational\": \"vendor\"}"
    expect:
      "unmapped.source_nano_time_assumed_tz": "Mars/Base"
      "unmapped.source_nano_operational": "vendor"
      "unmapped.nano_time_assumed_tz": "<missing>"
  # NAN-5902: an HEC object event (`"event": {...}`) that carries its own host
  # and timestamp and an object `message`. With `# nano:input=json` nano
  # v2.0.36 hands the parser the sender's record text, byte for byte, as
  # /ingest does: time and device.hostname come from the record (not the HEC
  # envelope), raw_data is the record, and every value stays searchable.
  - raw: '{"marker":"hec-obj-1","timestamp":"2026-11-24T01:02:03Z","host":"Rec-Host-01","n":42,"f":1.5,"b":true,"arr":[1,"two",{"three":3}],"deep":{"l1":{"l2":{"l3":"deep-val"}}},"message":{"inner":"msg-obj"}}'
    expect:
      class_uid: 0
      time: 1795482123000
      "device.hostname": "rec-host-01"
      raw_data: '{"marker":"hec-obj-1","timestamp":"2026-11-24T01:02:03Z","host":"Rec-Host-01","n":42,"f":1.5,"b":true,"arr":[1,"two",{"three":3}],"deep":{"l1":{"l2":{"l3":"deep-val"}}},"message":{"inner":"msg-obj"}}'
      "unmapped.marker": "hec-obj-1"
      "unmapped.host": "Rec-Host-01"
      "unmapped.n": 42
      "unmapped.f": 1.5
      "unmapped.b": true
      "unmapped.parse_error": "<missing>"
  # A plain text line (an HEC string event, /services/collector/raw, or an
  # /ingest text body): not JSON, so the line is kept whole in raw_data and the
  # parse error is reported, never dropped.
  - raw: 'plain text line user=alice src=10.0.0.9 action=allow'
    expect:
      class_uid: 0
      raw_data: 'plain text line user=alice src=10.0.0.9 action=allow'
      "metadata.log_level": "error"
