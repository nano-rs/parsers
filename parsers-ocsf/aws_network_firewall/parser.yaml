  # Declared source -> target mappings (field-coverage.yaml `mappings`).
  __decl = "\n\"availability_zone\"\t[\"cloud.zone\"]\n\"event.alert.category\"\t[\"finding_info.analytic.category\",\"finding_info.types\",\"firewall_rule.category\"]\n\"event.alert.rev\"\t[\"finding_info.analytic.version\",\"firewall_rule.version\"]\n\"event.alert.signature\"\t[\"finding_info.analytic.name\",\"finding_info.title\",\"firewall_rule.name\",\"message\"]\n\"event.alert.signature_id\"\t[\"finding_info.analytic.uid\",\"firewall_rule.uid\"]\n\"event.app_proto\"\t[\"app_protocol_name\"]\n\"event.aws_metadata.resource_arn\"\t[\"finding_info.product_uid\"]\n\"event.dest_ip\"\t[\"dst_endpoint.ip\",\"evidences.dst_endpoint.ip\"]\n\"event.dest_port\"\t[\"dst_endpoint.port\",\"evidences.dst_endpoint.port\"]\n\"event.flow_id\"\t[\"connection_info.uid\",\"evidences.connection_info.uid\"]\n\"event.http.hostname\"\t[\"evidences.http_request.url.hostname\"]\n\"event.http.http_method\"\t[\"evidences.http_request.http_method\"]\n\"event.http.http_user_agent\"\t[\"evidences.http_request.user_agent\"]\n\"event.http.protocol\"\t[\"evidences.http_request.version\"]\n\"event.http.url\"\t[\"evidences.http_request.url.path\"]\n\"event.netflow.bytes\"\t[\"traffic.bytes_out\"]\n\"event.netflow.pkts\"\t[\"traffic.packets_out\"]\n\"event.sni\"\t[\"dst_endpoint.hostname\"]\n\"event.src_ip\"\t[\"evidences.src_endpoint.ip\",\"src_endpoint.ip\"]\n\"event.src_port\"\t[\"evidences.src_endpoint.port\",\"src_endpoint.port\"]\n\"event.tls.issuerdn\"\t[\"evidences.tls.certificate.issuer\"]\n\"event.tls.serial\"\t[\"evidences.tls.certificate.serial_number\"]\n\"event.tls.sni\"\t[\"evidences.tls.sni\"]\n\"event.tls.subject\"\t[\"evidences.tls.certificate.subject\"]\n\"event.tls.version\"\t[\"evidences.tls.version\"]\n\"event.tls_error.error_message\"\t[\"status_detail\"]\n\"firewall_name\"\t[\"metadata.reporter.name\"]\n"
