name: aws_network_firewall_ocsf
display_name: AWS Network Firewall (OCSF)
version: "1.0.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses AWS Network Firewall logs (one JSON record per line, as delivered to S3,
  CloudWatch Logs or Firehose: firewall_name, availability_zone, event_timestamp
  and the Suricata EVE-style `event`) into complete OCSF 1.9.0 records:
    event_type alert               -> Detection Finding 2004 (security_control:
                                      alert.action allowed -> Allowed, blocked /
                                      rejected -> Denied + Blocked, dropped ->
                                      Denied + Dropped; Suricata
                                      severity 1/2/3 -> High/Medium/Low; the rule
                                      on finding_info.analytic and firewall_rule;
                                      the 5-tuple, HTTP and TLS on evidences[])
    event_type netflow             -> Network Activity 4001 Traffic (uni-directional
                                      packets/bytes on traffic.*_out, flow start/end)
    TLS engine (tls_error,
    revocation_check)              -> Network Activity 4001 Fail / Refuse
  A null netflow counter is left out, never written as 0. The firewall is
  metadata.reporter, the zone and its region land on cloud.
  Anything that is not a Network Firewall record is kept whole as a Base Event
  with unmapped.parse_fallback. Samples come from the AWS "Contents of an AWS
  Network Firewall log" examples and the Elastic aws.firewall_logs pipeline
  fixtures, with documentation addresses.
match_values:
  - aws_network_firewall
category: network
vendor: "Amazon"
product: "Network Firewall"
parser_vrl: |
  # NAN source timezone. Generated by scripts/residual_spill.py; edit scripts/residual/source_tz.vrl.
  # The log source's timezone setting arrives as .nano.source_timezone (an IANA
  # name such as "America/New_York", or any fixed offset such as "+05:30"), set
  # by nano at ingest. .nano is nano's input, never part of the log: it is
  # removed whole before anything else, whatever its shape.
  # For a clock that carries no offset a parser parses it AS UTC and sets
  # __lc_pending; the generated local-clock block that follows the parse
  # (local_clock.vrl) turns it into real UTC with this setting, and the spill
  # records the zone used as unmapped.nano_time_assumed_tz (the name, the offset
  # as +HH:MM, or "UTC" when the setting is absent, invalid or "local").
  __src_nano = del(.nano)
  __src_tz_in = ""
  if is_object(__src_nano) { __src_tz_in = strip_whitespace(to_string(object!(__src_nano).source_timezone) ?? "") }
  __src_tz = "UTC"
  __src_shift_ms = 0
  __src_tz_label = "UTC"
  __time_assumed = false
  __time_inline = false
  __lc_pending = false
  # No parse_* decoder here: nano infers a parser's input contract from the first
  # decoder in its program (parse_json first = a JSON-input parser, handed the
  # whole HEC / OTLP object). This prelude opens every parser, so a decoder in it
  # would turn every JSON-input parser into a text one. match + slice instead.
  if match(__src_tz_in, r'^[+-]\d{2}:?\d{2}$') {
      __src_sign = slice(__src_tz_in, 0, 1) ?? "+"
      __src_digits = replace(slice(__src_tz_in, 1) ?? "", ":", "")
      __src_hh = slice(__src_digits, 0, 2) ?? "99"
      __src_mm = slice(__src_digits, 2, 4) ?? "99"
      __src_h = to_int(__src_hh) ?? 99
      __src_m = to_int(__src_mm) ?? 99
      if __src_h <= 14 && __src_m <= 59 {
          __src_shift_ms = (__src_h * 3600 + __src_m * 60) * 1000
          if __src_sign == "-" { __src_shift_ms = 0 - __src_shift_ms }
          if __src_shift_ms != 0 { __src_tz_label = __src_sign + __src_hh + ":" + __src_mm }
      }
  } else if __src_tz_in != "" && downcase(__src_tz_in) != "local" {
      # "local" (the Vector host's zone) would make the time depend on the host.
      __src_probe, __src_probe_err = parse_timestamp("2000-01-01 00:00:00", "%Y-%m-%d %H:%M:%S", timezone: __src_tz_in)
      if __src_probe_err == null { __src_tz = __src_tz_in; __src_tz_label = __src_tz_in }
  }
  # END NAN source timezone
  # AWS Network Firewall log (JSON, Suricata EVE-style `event`) -> OCSF 1.9.0
  #   event_type alert              -> Detection Finding 2004 (security_control)
  #   event_type netflow / flow     -> Network Activity 4001 (Traffic)
  #   TLS engine event (event_type tls, or tls_error / revocation_check)
  #                                 -> Network Activity 4001 (Fail / Refuse / Traffic)
  raw_log = to_string(.message) ?? ""
  __raw_body = raw_log
  __source_kv = {}

  parsed, err = parse_json(raw_log)
  p = {}
  ev = {}
  ok = false
  if err == null && is_object(parsed) {
      p = object!(parsed)
      ev = object(p.event) ?? {}
      # Any JSON with an `event` object is not a Network Firewall record: it
      # needs the firewall name or a Suricata / TLS-engine event key.
      ok = length(ev) > 0 && (exists(p.firewall_name) || exists(ev.event_type) || exists(ev.src_ip) || exists(ev.tls_error) || exists(ev.revocation_check))
  }
  __source_kv = p

  if !ok {
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 0,
          "activity_name": "Unknown",
          "type_uid": 0,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": to_unix_timestamp(now(), unit: "milliseconds"),
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "profiles": ["cloud"],
              "uid": sha2("aws_network_firewall|raw|" + raw_log, variant: "SHA-256"),
              "log_level": "error",
              "log_name": "AWS Network Firewall",
              "log_provider": "AWS Network Firewall",
              "product": { "name": "AWS Network Firewall", "vendor_name": "Amazon" }
          },
          "cloud": { "provider": "AWS" }
      }
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      . = set!(., ["unmapped", "parse_fallback"], "not a Network Firewall log record")
  } else {
      event_type = downcase(to_string(ev.event_type) ?? "")
      fw_name = to_string(p.firewall_name) ?? ""
      zone = to_string(p.availability_zone) ?? ""

      # ---- time: event.timestamp (microseconds) else event_timestamp (epoch s) ----
      time_ms = 0
      ts = to_string(ev.timestamp) ?? ""
      if ts != "" {
          tp, terr = parse_timestamp(ts, "%+", timezone: "UTC")
          if terr == null { time_ms = to_unix_timestamp(tp, unit: "milliseconds") }
      }
      if time_ms == 0 {
          epoch = to_int(p.event_timestamp) ?? 0
          if epoch > 0 { time_ms = epoch * 1000 }
      }
      if time_ms == 0 { time_ms = to_unix_timestamp(now(), unit: "milliseconds") }

      # ---- cloud: region is the zone without its trailing letter ----
      cloud = { "provider": "AWS" }
      if zone != "" {
          cloud.zone = zone
          rm, rerr = parse_regex(zone, r'^(?P<region>[a-z]{2}(?:-[a-z]+)+-\d+)[a-z]$')
          if rerr == null { cloud.region = string!(rm.region) }
      }

      # ---- endpoints and connection ----
      src_endpoint = {}
      sip = to_string(ev.src_ip) ?? ""
      if sip != "" { src_endpoint.ip = downcase(sip) }
      sport = to_int(ev.src_port) ?? 0
      if sport > 0 { src_endpoint.port = sport }
      dst_endpoint = {}
      dip = to_string(ev.dest_ip) ?? ""
      if dip != "" { dst_endpoint.ip = downcase(dip) }
      dport = to_int(ev.dest_port) ?? 0
      if dport > 0 { dst_endpoint.port = dport }

      # Suricata's direction (to_server / to_client) is flow orientation, not
      # an inbound / outbound boundary, so the OCSF direction stays Unknown.
      conn = { "direction_id": 0, "direction": "Unknown" }
      proto = downcase(to_string(ev.proto) ?? "")
      if proto != "" {
          conn.protocol_name = proto
          if proto == "tcp" { conn.protocol_num = 6 }
          if proto == "udp" { conn.protocol_num = 17 }
          if proto == "icmp" { conn.protocol_num = 1 }
          if proto == "ipv6-icmp" { conn.protocol_num = 58 }
      }
      flow_id = to_string(ev.flow_id) ?? ""
      if flow_id != "" { conn.uid = flow_id }

      # ---- application layer ----
      http_request = {}
      hreq = object(ev.http) ?? {}
      if length(hreq) > 0 {
          url_obj = {}
          hhost = to_string(hreq.hostname) ?? ""
          hurl = to_string(hreq.url) ?? ""
          if hhost != "" { url_obj.hostname = hhost }
          if hurl != "" { url_obj.path = hurl }
          if length(url_obj) == 0 { url_obj.path = "/" }
          http_request.url = url_obj
          hm = to_string(hreq.http_method) ?? ""
          if hm != "" { http_request.http_method = hm }
          hua = to_string(hreq.http_user_agent) ?? ""
          if hua != "" { http_request.user_agent = hua }
          hver = to_string(hreq.protocol) ?? ""
          if hver != "" { http_request.version = hver }
      }
      tls = {}
      tobj = object(ev.tls) ?? {}
      sni = string(tobj.sni) ?? string(ev.sni) ?? ""
      if sni != "" { tls.sni = sni }
      tver = to_string(tobj.version) ?? ""
      if tver != "" { tls.version = tver }
      ja3 = to_string(get(tobj, ["ja3", "hash"]) ?? null) ?? ""
      if ja3 != "" { tls.ja3_hash = { "algorithm_id": 1, "algorithm": "MD5", "value": ja3 } }
      cert = {}
      subj = to_string(tobj.subject) ?? ""
      if subj != "" { cert.subject = subj }
      iss = to_string(tobj.issuerdn) ?? ""
      if iss != "" { cert.issuer = iss }
      serial = to_string(tobj.serial) ?? ""
      if serial != "" { cert.serial_number = serial }
      fpr = to_string(tobj.fingerprint) ?? ""
      if fpr != "" { cert.fingerprints = [{ "algorithm_id": 2, "algorithm": "SHA-1", "value": fpr }] }
      if length(cert) > 0 {
          if !exists(cert.issuer) { cert.issuer = "" }
          if !exists(cert.serial_number) { cert.serial_number = "" }
          tls.certificate = cert
      }

      # OCSF requires tls.version. The TLS engine's error / revocation records
      # carry only the SNI, which then names the server on dst_endpoint.
      if length(tls) > 0 && !exists(tls.version) {
          if sni != "" { dst_endpoint.hostname = sni }
          tls = {}
      }

      metadata = {
          "version": "1.9.0",
          "profiles": ["cloud"],
          "log_name": "AWS Network Firewall",
          "log_provider": "AWS Network Firewall",
          "product": { "name": "AWS Network Firewall", "vendor_name": "Amazon" }
      }
      if fw_name != "" { metadata.reporter = { "name": fw_name } }
      metadata.uid = sha2("aws_network_firewall|" + fw_name + "|" + flow_id + "|" + event_type + "|" + ts + "|" + raw_log, variant: "SHA-256")

      if event_type == "alert" {
          al = object(ev.alert) ?? {}
          al_action = downcase(to_string(al.action) ?? "")
          sid = to_string(al.signature_id) ?? ""
          sig = to_string(al.signature) ?? ""
          cat = to_string(al.category) ?? ""
          rev = to_string(al.rev) ?? ""
          sev = to_int(al.severity) ?? 0

          # Suricata severity: 1 is the most severe.
          severity_id = 1
          severity = "Informational"
          if sev == 1 { severity_id = 4; severity = "High" }
          if sev == 2 { severity_id = 3; severity = "Medium" }
          if sev == 3 { severity_id = 2; severity = "Low" }

          action_id = 0
          action = "Unknown"
          disposition_id = 0
          disposition = "Unknown"
          # Older records may carry only the engine verdict.
          if al_action == "" { al_action = downcase(to_string(get(ev, ["verdict", "action"]) ?? null) ?? "") }
          if al_action == "allowed" || al_action == "accept" { action_id = 1; action = "Allowed"; disposition_id = 1; disposition = "Allowed" }
          if al_action == "blocked" || al_action == "rejected" || al_action == "reject" { action_id = 2; action = "Denied"; disposition_id = 2; disposition = "Blocked" }
          if al_action == "dropped" || al_action == "drop" { action_id = 2; action = "Denied"; disposition_id = 6; disposition = "Dropped" }

          title = sig
          if title == "" { title = "Network Firewall alert (sid " + sid + ")" }
          analytic = { "type_id": 1, "type": "Rule" }
          if sid != "" { analytic.uid = sid }
          if sig != "" { analytic.name = sig }
          if rev != "" { analytic.version = rev }
          if cat != "" { analytic.category = cat }
          finding_info = {
              "uid": sha2("aws_network_firewall|alert|" + fw_name + "|" + flow_id + "|" + sid + "|" + ts, variant: "SHA-256"),
              "title": title,
              "analytic": analytic
          }
          if cat != "" { finding_info.types = [cat] }
          arn = to_string(get(ev, ["aws_metadata", "resource_arn"]) ?? null) ?? ""
          if arn != "" { finding_info.product_uid = arn }

          fw_rule = {}
          if sid != "" { fw_rule.uid = sid }
          if sig != "" { fw_rule.name = sig }
          if rev != "" { fw_rule.version = rev }
          if cat != "" { fw_rule.category = cat }

          evidence = {}
          if length(src_endpoint) > 0 { evidence.src_endpoint = src_endpoint }
          if length(dst_endpoint) > 0 { evidence.dst_endpoint = dst_endpoint }
          if length(conn) > 0 { evidence.connection_info = conn }
          if length(http_request) > 0 { evidence.http_request = http_request }
          if length(tls) > 0 { evidence.tls = tls }

          metadata.profiles = ["cloud", "security_control"]
          ocsf = {
              "class_uid": 2004,
              "class_name": "Detection Finding",
              "category_uid": 2,
              "category_name": "Findings",
              "activity_id": 1,
              "activity_name": "Create",
              "type_uid": 200401,
              "severity_id": severity_id,
              "severity": severity,
              "status_id": 1,
              "status": "New",
              "is_alert": true,
              "action_id": action_id,
              "action": action,
              "disposition_id": disposition_id,
              "disposition": disposition,
              "time": time_ms,
              "message": title,
              "raw_data": raw_log,
              "metadata": metadata,
              "cloud": cloud,
              "finding_info": finding_info
          }
          if length(fw_rule) > 0 { ocsf.firewall_rule = fw_rule }
          if length(evidence) > 0 { ocsf.evidences = [evidence] }
          . = ocsf
      } else {
          activity_id = 6
          activity_name = "Traffic"
          status_id = 1
          status = "Success"
          severity_id = 1
          severity = "Informational"
          action_id = 0
          action = ""
          status_detail = ""
          log_name = "AWS Network Firewall"
          traffic = {}
          start_ms = 0
          end_ms = 0

          nf = object(ev.netflow) ?? object(ev.flow) ?? {}
          if length(nf) > 0 {
              log_name = "AWS Network Firewall flow"
              # netflow is uni-directional: every packet went source -> destination.
              # Suricata's bidirectional flow form splits the counters by side.
              # A null counter is absent, never zero.
              if nf.pkts != null { traffic.packets_out = to_int(nf.pkts) ?? 0 }
              if nf.bytes != null { traffic.bytes_out = to_int(nf.bytes) ?? 0 }
              if nf.pkts_toserver != null { traffic.packets_out = to_int(nf.pkts_toserver) ?? 0 }
              if nf.pkts_toclient != null { traffic.packets_in = to_int(nf.pkts_toclient) ?? 0 }
              if nf.bytes_toserver != null { traffic.bytes_out = to_int(nf.bytes_toserver) ?? 0 }
              if nf.bytes_toclient != null { traffic.bytes_in = to_int(nf.bytes_toclient) ?? 0 }
              st = to_string(nf.start) ?? ""
              if st != "" {
                  s1, s1err = parse_timestamp(st, "%+", timezone: "UTC")
                  if s1err == null { start_ms = to_unix_timestamp(s1, unit: "milliseconds") }
              }
              en = to_string(nf.end) ?? ""
              if en != "" {
                  e1, e1err = parse_timestamp(en, "%+", timezone: "UTC")
                  if e1err == null { end_ms = to_unix_timestamp(e1, unit: "milliseconds") }
              }
          }

          rc = object(ev.revocation_check) ?? {}
          tls_err = ev.tls_error
          if event_type == "tls" || length(rc) > 0 || tls_err != null { log_name = "AWS Network Firewall TLS" }
          if length(rc) > 0 {
              rc_action = upcase(to_string(rc.action) ?? "")
              rc_status = to_string(rc.status) ?? ""
              status_detail = "revocation check: " + rc_status
              if rc_action == "DROP" || rc_action == "REJECT" {
                  activity_id = 5; activity_name = "Refuse"
                  status_id = 2; status = "Failure"
                  action_id = 2; action = "Denied"
                  severity_id = 3; severity = "Medium"
              } else {
                  action_id = 1; action = "Allowed"
              }
          }
          if tls_err != null {
              activity_id = 4; activity_name = "Fail"
              status_id = 2; status = "Failure"
              severity_id = 2; severity = "Low"
              terr_msg = to_string(get(tls_err, ["error_message"]) ?? null) ?? to_string(tls_err) ?? ""
              if terr_msg != "" { status_detail = terr_msg }
          }

          tcp = object(ev.tcp) ?? {}
          tflags = to_string(tcp.tcp_flags) ?? ""
          if tflags != "" {
              fl, flerr = parse_int(tflags, base: 16)
              if flerr == null { conn.tcp_flags = fl }
          }

          if action_id != 0 { metadata.profiles = ["cloud", "security_control"] }
          metadata.log_name = log_name
          if length(src_endpoint) == 0 { src_endpoint.ip = "0.0.0.0" }
          ocsf = {
              "class_uid": 4001,
              "class_name": "Network Activity",
              "category_uid": 4,
              "category_name": "Network Activity",
              "activity_id": activity_id,
              "activity_name": activity_name,
              "type_uid": 400100 + activity_id,
              "severity_id": severity_id,
              "severity": severity,
              "status_id": status_id,
              "status": status,
              "time": time_ms,
              "raw_data": raw_log,
              "metadata": metadata,
              "cloud": cloud,
              "src_endpoint": src_endpoint
          }
          if length(dst_endpoint) > 0 { ocsf.dst_endpoint = dst_endpoint }
          if length(conn) > 0 { ocsf.connection_info = conn }
          if length(traffic) > 0 { ocsf.traffic = traffic }
          if length(tls) > 0 { ocsf.tls = tls }
          if start_ms > 0 { ocsf.start_time = start_ms }
          if end_ms > 0 { ocsf.end_time = end_ms }
          if start_ms > 0 && end_ms >= start_ms { ocsf.duration = end_ms - start_ms }
          if status_detail != "" { ocsf.status_detail = status_detail }
          if action_id != 0 { ocsf.action_id = action_id; ocsf.action = action }
          app = to_string(ev.app_proto) ?? ""
          if app != "" && app != "failed" { ocsf.app_protocol_name = app }
          . = ocsf
      }
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # Values spill exactly as parsed: a parser never masks, redacts or withholds
  # anything (masking is an opt-in pipeline step, never a parser concern).
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # A source field is consumed ONLY by an explicit mapping: a field-coverage.yaml
  # `mappings` entry (source key -> target paths) or a `transforms` rule with a
  # target, whose value is found AT THAT TARGET PATH of the selected branch. A
  # value that merely appears somewhere else in the event never consumes a field
  # (no coincidental consumption); everything else spills.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The sets below are strings instead
  # (a read shares the buffer). __repr holds one member per mapped leaf:
  # "," + encode_json(path) + "=" + encode_json(encode_json(value)), plus the
  # to_string form for a string or a float, so a numeric string is represented by
  # its typed scalar. Every part is a JSON text, inside which a '"' is always
  # escaped, so a member is matched exactly. Paths drop array indices
  # (resources.0.uid is resources.uid); arrays are walked two levels deep, and a
  # leaf deeper than that is simply not mapping evidence (it can only spill more).
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped = object!(parse_json!(encode_json(__mapped)))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __copy = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __repr = ""
  for_each(flatten(__mapped)) -> |path, value| {
      __p = encode_json(path)
      if is_array(value) {
          for_each(array!(value)) -> |_i, item| {
              if is_object(item) {
                  for_each(flatten(object!(item))) -> |sub, leaf| {
                      __q = encode_json(path + "." + sub)
                      if is_array(leaf) {
                          for_each(array!(leaf)) -> |_j, x| {
                              if !is_object(x) && !is_array(x) {
                                  __repr = __repr + ("," + __q + "=" + encode_json(encode_json(x)))
                                  if is_string(x) || is_float(x) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(x))) }
                              }
                          }
                      } else {
                          __repr = __repr + ("," + __q + "=" + encode_json(encode_json(leaf)))
                          if is_string(leaf) || is_float(leaf) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(leaf))) }
                      }
                  }
              } else if !is_array(item) {
                  __repr = __repr + ("," + __p + "=" + encode_json(encode_json(item)))
                  if is_string(item) || is_float(item) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(item))) }
              }
          }
      } else {
          __repr = __repr + ("," + __p + "=" + encode_json(encode_json(value)))
          if is_string(value) || is_float(value) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(value))) }
      }
  }
  __consumed = ""
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__copy.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # BEGIN parser-specific transformations
  # event.timestamp: Suricata ISO timestamp converted to the emitted millisecond clock.
  # event.netflow.start: Flow start converted to the emitted millisecond clock.
  # event.netflow.end: Flow end converted to the emitted millisecond clock.
  # event.proto: Transport protocol lowercased onto connection_info.protocol_name.
  # event.proto: Transport protocol lowercased onto connection_info.protocol_name.
  # event.alert.severity: Suricata severity (1 most severe) normalized to the OCSF severity; consume only when the expected ID is emitted.
  # event.alert.action: Alert verdict normalized to the OCSF action; consume only when the expected ID is emitted.
  for_each(__flat) -> |key, value| {
      if match(key, r'(?x)
      \A(?:
        event\.timestamp
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%+", timezone: "UTC")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              if contains(__repr, "," + "\"time\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
