source: json
transforms:
- source: event.timestamp
  kind: epoch_ms
  target: time
  reason: Suricata ISO timestamp converted to the emitted millisecond clock.
- source: event.netflow.start
  kind: epoch_ms
  target: start_time
  reason: Flow start converted to the emitted millisecond clock.
- source: event.netflow.end
  kind: epoch_ms
  target: end_time
  reason: Flow end converted to the emitted millisecond clock.
- source: event.proto
  kind: lowercase
  target: connection_info.protocol_name
  reason: Transport protocol lowercased onto connection_info.protocol_name.
- source: event.proto
  kind: lowercase
  target: evidences.connection_info.protocol_name
  reason: Transport protocol lowercased onto connection_info.protocol_name.
- source: event.alert.severity
  kind: enum
  target: severity_id
  values:
    '1': 4
    '2': 3
    '3': 2
  reason: Suricata severity (1 most severe) normalized to the OCSF severity; consume only when the expected
    ID is emitted.
- source: event.alert.action
  kind: enum
  target: action_id
  values:
    allowed: 1
    blocked: 2
    rejected: 2
    dropped: 2
    drop: 2
  reason: Alert verdict normalized to the OCSF action; consume only when the expected ID is emitted.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  availability_zone:
  - cloud.zone
  event.alert.category:
  - finding_info.analytic.category
  - finding_info.types
  - firewall_rule.category
  event.alert.rev:
  - finding_info.analytic.version
  - firewall_rule.version
  event.alert.signature:
  - finding_info.analytic.name
  - finding_info.title
  - firewall_rule.name
  - message
  event.alert.signature_id:
  - finding_info.analytic.uid
  - firewall_rule.uid
  event.app_proto:
  - app_protocol_name
  event.aws_metadata.resource_arn:
  - finding_info.product_uid
  event.dest_ip:
  - dst_endpoint.ip
  - evidences.dst_endpoint.ip
  event.dest_port:
  - dst_endpoint.port
  - evidences.dst_endpoint.port
  event.flow_id:
  - connection_info.uid
  - evidences.connection_info.uid
  event.http.hostname:
  - evidences.http_request.url.hostname
  event.http.http_method:
  - evidences.http_request.http_method
  event.http.http_user_agent:
  - evidences.http_request.user_agent
  event.http.protocol:
  - evidences.http_request.version
  event.http.url:
  - evidences.http_request.url.path
  event.netflow.bytes:
  - traffic.bytes_out
  event.netflow.pkts:
  - traffic.packets_out
  event.sni:
  - dst_endpoint.hostname
  event.src_ip:
  - evidences.src_endpoint.ip
  - src_endpoint.ip
  event.src_port:
  - evidences.src_endpoint.port
  - src_endpoint.port
  event.tls.issuerdn:
  - evidences.tls.certificate.issuer
  event.tls.serial:
  - evidences.tls.certificate.serial_number
  event.tls.sni:
  - evidences.tls.sni
  event.tls.subject:
  - evidences.tls.certificate.subject
  event.tls.version:
  - evidences.tls.version
  event.tls_error.error_message:
  - status_detail
  firewall_name:
  - metadata.reporter.name
