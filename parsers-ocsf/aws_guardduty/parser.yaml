      "finding_info.uid": "524939459a6aa68da5b7c0b21c304c2a75b01a8013b05abe5d291fa837d6bc66"
  # NAN-3721: the uid is the finding id plus updatedAt; original_event_uid is the finding id
  - raw: "{\"schemaVersion\":\"2.0\",\"accountId\":\"123456789012\",\"region\":\"us-east-1\",\"partition\":\"aws\",\"arn\":\"arn:aws:guardduty:us-east-1:123456789012:detector/abc/finding/aabb\",\"createdAt\":\"2026-08-18T20:00:00.000Z\",\"updatedAt\":\"2026-08-18T20:05:00.000Z\",\"type\":\"UnauthorizedAccess:IAMUser/MaliciousIPCaller.Custom\",\"severity\":8.0,\"title\":\"API GetObject was invoked from a known malicious IP address.\",\"description\":\"API GetObject was invoked from IP address 198.51.100.5 which is on a custom threat list.\",\"resource\":{\"resourceType\":\"AccessKey\",\"accessKeyDetails\":{\"accessKeyId\":\"AKIAIOSFODNN7EXAMPLE\",\"principalId\":\"AIDACKCEVSQ6C2EXAMPLE\",\"userType\":\"IAMUser\",\"userName\":\"alice\"}},\"service\":{\"serviceName\":\"guardduty\",\"detectorId\":\"abc123\",\"count\":3,\"eventFirstSeen\":\"2026-08-18T19:50:00Z\",\"eventLastSeen\":\"2026-08-18T20:00:00Z\",\"action\":{\"actionType\":\"AWS_API_CALL\",\"awsApiCallAction\":{\"api\":\"GetObject\",\"serviceName\":\"s3.amazonaws.com\",\"callerType\":\"Remote IP\",\"remoteIpDetails\":{\"ipAddressV4\":\"198.51.100.5\",\"organization\":{\"asn\":\"64512\",\"asnOrg\":\"EvilNet\",\"isp\":\"EvilNet\",\"org\":\"EvilNet\"},\"country\":{\"countryName\":\"Russia\"},\"city\":{\"cityName\":\"Moscow\"}}}},\"evidence\":{\"threatIntelligenceDetails\":[{\"threatListName\":\"CustomList\",\"threatNames\":[\"BadActor\"]}]},\"additionalInfo\":{\"sample\":false}},\"id\":\"7cc5f0b1c4d6e8a9b0c1d2e3f4a5b6c7\"}"
    expect:
      "metadata.uid": "7cc5f0b1c4d6e8a9b0c1d2e3f4a5b6c7|2026-08-18T20:05:00.000Z"
