source: json
transforms:
- source: createdAt
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: updatedAt
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: service.eventFirstSeen
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: service.eventLastSeen
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: createdAt
  kind: epoch_ms
  target: finding_info.created_time
  format: '%+'
  reason: Existing timestamp conversion verified against the emitted millisecond clock.
- source: service.eventFirstSeen
  kind: epoch_ms
  target: finding_info.first_seen_time
  format: '%+'
  reason: Existing timestamp conversion verified against the emitted millisecond clock.
- source: service.eventLastSeen
  kind: epoch_ms
  target: finding_info.created_time
  format: '%+'
  reason: Existing timestamp conversion verified against the emitted millisecond clock.
- source: service.serviceName
  kind: enum
  target: metadata.log_name
  values:
    guardduty: GuardDuty
  reason: Parser normalizes the caption case; verify the emitted caption.
- source: severity
  kind: enum
  target: severity_id
  values:
    informational: 1
    info: 1
    debug: 1
    low: 2
    medium: 3
    warn: 3
    warning: 3
    high: 4
    error: 4
    critical: 5
    fatal: 6
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping;
    consume only when the expected ID is emitted.
