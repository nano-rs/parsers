source: json
transforms:
- source: createdAt
  kind: epoch_ms
  target: finding_info.created_time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: updatedAt
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: service.eventFirstSeen
  kind: epoch_ms
  target: finding_info.first_seen_time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: service.eventLastSeen
  kind: epoch_ms
  target: finding_info.last_seen_time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: createdAt
  kind: epoch_ms
  target: finding_info.created_time
  format: '%+'
  reason: Existing timestamp conversion verified against the emitted millisecond clock.
- source: service.eventFirstSeen
  kind: epoch_ms
  target: finding_info.first_seen_time
  format: '%+'
  reason: Existing timestamp conversion verified against the emitted millisecond clock.
- source: service.eventLastSeen
  kind: epoch_ms
  target: finding_info.last_seen_time
  format: '%+'
  reason: Existing timestamp conversion verified against the emitted millisecond clock.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  accountId:
  - cloud.account.uid
  arn:
  - finding_info.uid_alt
  description:
  - finding_info.desc
  id:
  - finding_info.uid
  - metadata.original_event_uid
  partition:
  - cloud.cloud_partition
  region:
  - cloud.region
  resource.accessKeyDetails.accessKeyId:
  - resources.uid
  resource.accessKeyDetails.principalId:
  - actor.user.uid
  - evidences.actor.user.uid
  resource.accessKeyDetails.userName:
  - actor.user.name
  - evidences.actor.user.name
  - resources.name
  resource.accessKeyDetails.userType:
  - actor.user.type
  - evidences.actor.user.type
  resource.instanceDetails.availabilityZone:
  - cloud.zone
  resource.instanceDetails.instanceId:
  - evidences.dst_endpoint.instance_uid
  - resources.name
  - resources.uid
  service.action.awsApiCallAction.api:
  - api.operation
  - evidences.api.operation
  service.action.awsApiCallAction.remoteIpDetails.city.cityName:
  - evidences.src_endpoint.location.city
  service.action.awsApiCallAction.remoteIpDetails.country.countryName:
  - evidences.src_endpoint.location.country
  service.action.awsApiCallAction.remoteIpDetails.ipAddressV4:
  - evidences.src_endpoint.ip
  service.action.awsApiCallAction.remoteIpDetails.organization.asn:
  - evidences.src_endpoint.autonomous_system.number
  service.action.awsApiCallAction.remoteIpDetails.organization.isp:
  - evidences.src_endpoint.isp
  service.action.awsApiCallAction.remoteIpDetails.organization.org:
  - evidences.src_endpoint.autonomous_system.name
  service.action.dnsRequestAction.domain:
  - evidences.dst_endpoint.domain
  service.action.networkConnectionAction.localPortDetails.port:
  - evidences.dst_endpoint.port
  service.action.networkConnectionAction.remoteIpDetails.country.countryName:
  - evidences.src_endpoint.location.country
  service.action.networkConnectionAction.remoteIpDetails.ipAddressV4:
  - evidences.src_endpoint.ip
  service.action.networkConnectionAction.remoteIpDetails.organization.asn:
  - evidences.src_endpoint.autonomous_system.number
  service.action.networkConnectionAction.remoteIpDetails.organization.org:
  - evidences.src_endpoint.autonomous_system.name
  service.action.networkConnectionAction.remotePortDetails.port:
  - evidences.src_endpoint.port
  service.count:
  - count
  service.detectorId:
  - finding_info.analytic.uid
  title:
  - finding_info.title
  - message
  type:
  - evidences.name
  - finding_info.types
