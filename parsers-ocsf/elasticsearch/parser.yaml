name: elasticsearch_ocsf
display_name: Elasticsearch / OpenSearch (OCSF)
version: "1.0.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses Elasticsearch and OpenSearch node logs into complete OCSF 1.9.0 records.
  Accepts the JSON server log (Elasticsearch 7 `"type":"server"` and the 8.x ECS
  layout), the Elasticsearch security audit log (`event.type` / `event.action`),
  the OpenSearch security plugin audit log (`audit_category`), and the search and
  indexing slow logs (7.x `index_search_slowlog` / `index_indexing_slowlog` and
  the 8.x ECS `elasticsearch.slowlog.*` layout).
    audit authentication_success, OpenSearch AUTHENTICATED      -> Authentication 3002 Logon
    audit authentication_failed, realm_authentication_failed,
    anonymous_access_denied, OpenSearch FAILED_LOGIN            -> Authentication 3002 Logon, Failure
    audit run_as_granted / run_as_denied                        -> Authentication 3002 Account Switch
    audit access_granted / access_denied, tampered_request,
    OpenSearch GRANTED_PRIVILEGES / MISSING_PRIVILEGES /
    BAD_HEADERS                                                 -> API Activity 6003 (denials
                                                                   carry action Denied)
    audit security_config_change on users (put_user,
    delete_user, change_password, change_disable_user, ...)     -> User Management 3007
    other security_config_change actions                        -> API Activity 6003
    audit connection_granted / connection_denied (IP filter)    -> Network Activity 4001
    search slow log                                             -> Datastore Activity 6005 Query
    indexing slow log                                           -> Datastore Activity 6005 Write
    server log "started" / "stopped" (org.elasticsearch.node.Node) -> Application Lifecycle 6002
    server log ERROR / FATAL                                    -> Application Error 6008
    other server log lines and audit categories                 -> Base Event 0
  Account Change 3001 is deprecated in OCSF 1.9 and is not emitted. The cluster
  uuid is metadata.tenant_uid, the node name is the reporting endpoint.
match_values:
  - elasticsearch
category: application
vendor: "Elastic"
product: "Elasticsearch"
parser_vrl: |
  # Elasticsearch / OpenSearch server, audit and slow logs -> OCSF 1.9.0.
  raw_log = to_string(.message) ?? ""
  __raw_body = raw_log
  __source_kv = {}
  shape = ""
  e = {}
  f = {}
  parsed, perr = parse_json(raw_log)
  if perr == null && is_object(parsed) {
      e = object!(parsed)
      __source_kv = e
      # Elasticsearch writes dotted top-level keys ("user.name"); nest them.
      f = unflatten(e)
      etype = string(get(f, ["event", "type"]) ?? "") ?? ""
      dataset = string(get(f, ["event", "dataset"]) ?? "") ?? ""
      ltype = string(f.type) ?? ""
      if exists(f.audit_category) {
          shape = "opensearch_audit"
      } else if ltype == "audit" || (exists(f.event.action) && etype != "" && dataset == "") {
          shape = "audit"
      } else if dataset == "elasticsearch.slowlog" || ends_with(ltype, "_slowlog") || exists(f.elasticsearch.slowlog) {
          shape = "slowlog"
      } else if exists(f.message) && (dataset != "" || ltype == "server" || ltype == "deprecation" || exists(f.log.level) || exists(f.level)) {
          shape = "server"
      }
  }

  product = { "name": "Elasticsearch", "vendor_name": "Elastic" }
  if shape == "opensearch_audit" { product = { "name": "OpenSearch", "vendor_name": "OpenSearch Project" } }

  if shape == "" {
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 0,
          "activity_name": "Unknown",
          "type_uid": 0,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": 0,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": sha2("elasticsearch|raw|" + raw_log, variant: "SHA-256"),
              "log_level": "error",
              "log_name": "elasticsearch",
              "log_provider": "Elasticsearch",
              "product": product
          },
          "unmapped": { "parse_error": "not an Elasticsearch or OpenSearch JSON log record" }
      }
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      . = set!(., ["unmapped", "parse_fallback"], "unparsable input")
  } else {
      # ---- time: ISO 8601, or Elasticsearch's comma-decimal "2022-09-04T22:54:53,028+0000" ----
      tstr = string(get(f, ["@timestamp"]) ?? "") ?? ""
      if tstr == "" { tstr = string(f.timestamp) ?? "" }
      time_ms = 0
      tnorm = replace(tstr, ",", ".")
      tp, tperr = parse_timestamp(tnorm, "%+")
      if tperr != null { tp, tperr = parse_timestamp(tnorm, "%Y-%m-%dT%H:%M:%S%.f%z") }
      if tperr != null { tp, tperr = parse_timestamp(tnorm, "%Y-%m-%dT%H:%M:%S%.f", timezone: "UTC") }
      if tperr == null { time_ms = to_unix_timestamp(tp, unit: "milliseconds") }

      node_name = string(get(f, ["node", "name"]) ?? "") ?? ""
      if node_name == "" { node_name = string(get(f, ["elasticsearch", "node", "name"]) ?? "") ?? "" }
      if node_name == "" { node_name = string(f.audit_node_name) ?? "" }
      cluster_uuid = string(get(f, ["cluster", "uuid"]) ?? "") ?? ""
      if cluster_uuid == "" { cluster_uuid = string(get(f, ["elasticsearch", "cluster", "uuid"]) ?? "") ?? "" }
      cluster_name = string(get(f, ["cluster", "name"]) ?? "") ?? ""
      if cluster_name == "" { cluster_name = string(get(f, ["elasticsearch", "cluster", "name"]) ?? "") ?? "" }
      if cluster_name == "" { cluster_name = string(f.audit_cluster_name) ?? "" }

      class_uid = 0
      activity_id = 99
      activity_name = "Other"
      status_id = 0
      status_str = "Unknown"
      severity_id = 1
      severity = "Informational"
      log_level = ""
      event_code = ""
      message = ""
      status_detail = ""
      denied = false
      src_ep = {}
      user = {}
      actor = {}
      api_op = ""
      req_uid = ""
      http_method = ""
      url_path = ""
      url_query = ""
      indices = []
      corr = ""
      log_name = "elasticsearch"
      logger = ""
      ocsf = {}

      if shape == "audit" || shape == "opensearch_audit" {
          log_name = "audit"
          if shape == "audit" {
              # ================= Elasticsearch security audit =================
              action = string(get(f, ["event", "action"]) ?? "") ?? ""
              etype = string(get(f, ["event", "type"]) ?? "") ?? ""
              event_code = action
              origin = string(get(f, ["origin", "address"]) ?? "") ?? ""
              uname = string(get(f, ["user", "name"]) ?? "") ?? ""
              urealm = string(get(f, ["user", "realm"]) ?? "") ?? ""
              roles = array(get(f, ["user", "roles"]) ?? []) ?? []
              run_as = string(get(f, ["user", "run_as", "name"]) ?? "") ?? ""
              # Under es-security-runas-user, user.name is the impersonated (effective)
              # user and user.run_by.* is the user that authenticated: the real actor.
              run_by = string(get(f, ["user", "run_by", "name"]) ?? "") ?? ""
              run_by_realm = string(get(f, ["user", "run_by", "realm"]) ?? "") ?? ""
              api_op = string(f.action) ?? ""
              req_uid = string(get(f, ["request", "id"]) ?? "") ?? ""
              http_method = string(get(f, ["request", "method"]) ?? "") ?? ""
              url_path = string(get(f, ["url", "path"]) ?? "") ?? ""
              url_query = string(get(f, ["url", "query"]) ?? "") ?? ""
              indices = array(f.indices) ?? []
              corr = string(get(f, ["trace", "id"]) ?? "") ?? ""
              if uname != "" { user.name = uname }
              if length(roles) > 0 { user.groups = map_values(roles) -> |rv| { { "name": to_string(rv) ?? "" } } }
              if urealm != "" { user.domain = urealm }
              cfg = object(get(f, ["put"]) ?? {}) ?? {}
              if length(cfg) == 0 { cfg = object(get(f, ["delete"]) ?? {}) ?? {} }
              if length(cfg) == 0 { cfg = object(get(f, ["change"]) ?? {}) ?? {} }
              if action == "authentication_success" {
                  class_uid = 3002; activity_id = 1; activity_name = "Logon"
                  status_id = 1; status_str = "Success"
              } else if includes(["authentication_failed", "realm_authentication_failed", "anonymous_access_denied"], action) {
                  class_uid = 3002; activity_id = 1; activity_name = "Logon"
                  status_id = 2; status_str = "Failure"
                  severity_id = 2; severity = "Low"
                  status_detail = action
                  if action == "anonymous_access_denied" && uname == "" { user.name = "_anonymous" }
              } else if action == "run_as_granted" || action == "run_as_denied" {
                  class_uid = 3002; activity_id = 7; activity_name = "Account Switch"
                  if action == "run_as_granted" { status_id = 1; status_str = "Success" } else {
                      status_id = 2; status_str = "Failure"; severity_id = 3; severity = "Medium"; status_detail = action
                  }
                  if run_as != "" {
                      # The authenticated user is the actor; the run-as user is the subject.
                      actor.user = user
                      user = { "name": run_as }
                      rr = string(get(f, ["user", "run_as", "realm"]) ?? "") ?? ""
                      if rr != "" { user.domain = rr }
                  }
              } else if action == "access_granted" || action == "access_denied" || action == "tampered_request" {
                  class_uid = 6003
                  if action == "access_granted" { status_id = 1; status_str = "Success" } else {
                      status_id = 2; status_str = "Failure"; severity_id = 3; severity = "Medium"; status_detail = action; denied = true
                  }
                  if action == "tampered_request" { severity_id = 4; severity = "High"; denied = false }
              } else if action == "connection_granted" || action == "connection_denied" {
                  class_uid = 4001
                  if action == "connection_granted" { activity_id = 1; activity_name = "Open"; status_id = 1; status_str = "Success" } else {
                      activity_id = 5; activity_name = "Refuse"; status_id = 2; status_str = "Failure"; severity_id = 2; severity = "Low"
                      status_detail = string(f.rule) ?? action
                  }
              } else if etype == "security_config_change" {
                  status_id = 1; status_str = "Success"
                  target = object(cfg.user) ?? {}
                  tname = string(target.name) ?? ""
                  if includes(["put_user", "delete_user", "change_password", "change_disable_user", "change_enable_user"], action) {
                      class_uid = 3007
                      if action == "put_user" { activity_id = 2; activity_name = "Update" }
                      if action == "delete_user" { activity_id = 3; activity_name = "Delete" }
                      if action == "change_password" { activity_id = 8; activity_name = "Password Change" }
                      if action == "change_disable_user" { activity_id = 5; activity_name = "Disable" }
                      if action == "change_enable_user" { activity_id = 4; activity_name = "Enable" }
                      if tname == "" { tname = "unknown" }
                      actor.user = user
                      user = { "name": tname }
                  } else {
                      class_uid = 6003
                      api_op = action
                      if starts_with(action, "put_") || starts_with(action, "change_") { activity_id = 3; activity_name = "Update" }
                      if starts_with(action, "delete_") || starts_with(action, "invalidate_") { activity_id = 4; activity_name = "Delete" }
                      if starts_with(action, "create_") { activity_id = 1; activity_name = "Create" }
                  }
              }
              if run_by != "" && run_by != uname && (class_uid == 6003 || class_uid == 3007) {
                  rb = { "name": run_by }
                  if run_by_realm != "" { rb.domain = run_by_realm }
                  actor.user = rb
              }
              if origin != "" {
                  r = parse_regex(origin, r'^(?:\x5B(?P<ip6>[0-9A-Fa-f:.]+)\x5D|(?P<ip4>[0-9]{1,3}(?:\.[0-9]{1,3}){3})):(?P<port>[0-9]+)$') ?? {}
                  rip = string(r.ip4) ?? string(r.ip6) ?? ""
                  if rip != "" { src_ep.ip = rip; src_ep.port = to_int(r.port) ?? 0 }
              }
          } else {
              # ================= OpenSearch security plugin audit =================
              cat = string(f.audit_category) ?? ""
              event_code = cat
              uname = string(f.audit_request_effective_user) ?? ""
              # OpenSearch logs the sentinel "<NONE>" when no credentials were read.
              if uname == "<NONE>" { uname = "" }
              init_user = string(f.audit_request_initiating_user) ?? ""
              if init_user == "<NONE>" { init_user = "" }
              api_op = string(f.audit_transport_action) ?? string(f.audit_request_privilege) ?? ""
              http_method = string(f.audit_rest_request_method) ?? ""
              url_path = string(f.audit_rest_request_path) ?? ""
              req_uid = string(f.audit_request_id) ?? ""
              indices = array(f.audit_trace_indices) ?? []
              rip = string(f.audit_request_remote_address) ?? ""
              if is_ipv4(rip) || is_ipv6(rip) { src_ep.ip = rip }
              if uname != "" { user.name = uname }
              uroles = array(f.audit_request_user_roles) ?? []
              if length(uroles) > 0 { user.groups = map_values(uroles) -> |rv| { { "name": to_string(rv) ?? "" } } }
              if cat == "AUTHENTICATED" {
                  class_uid = 3002; activity_id = 1; activity_name = "Logon"; status_id = 1; status_str = "Success"
              } else if cat == "FAILED_LOGIN" {
                  class_uid = 3002; activity_id = 1; activity_name = "Logon"; status_id = 2; status_str = "Failure"
                  severity_id = 2; severity = "Low"
                  status_detail = string(f.audit_authentication_failure_reason) ?? cat
                  if uname == "" {
                      attempted = string(f.audit_request_attempted_user) ?? ""
                      if attempted == "" || attempted == "<NONE>" { attempted = "unknown" }
                      user.name = attempted
                  }
              } else if cat == "SSL_EXCEPTION" {
                  # A failed TLS / client-certificate handshake is a failed logon at the transport.
                  class_uid = 3002; activity_id = 1; activity_name = "Logon"; status_id = 2; status_str = "Failure"
                  severity_id = 3; severity = "Medium"
                  exc = string(f.audit_request_exception_stacktrace) ?? ""
                  status_detail = "SSL_EXCEPTION"
                  if exc != "" { status_detail = string(split(exc, "\n")[0]) ?? exc }
                  ocsf.auth_protocol_id = 99; ocsf.auth_protocol = "TLS"
                  if length(user) == 0 { user.name = "unknown" }
              } else if cat == "GRANTED_PRIVILEGES" || cat == "MISSING_PRIVILEGES" || cat == "BAD_HEADERS" || cat == "OPENDISTRO_SECURITY_INDEX_ATTEMPT" {
                  class_uid = 6003
                  if cat == "GRANTED_PRIVILEGES" { status_id = 1; status_str = "Success" } else {
                      status_id = 2; status_str = "Failure"; severity_id = 3; severity = "Medium"; status_detail = cat
                      if cat == "MISSING_PRIVILEGES" { denied = true }
                  }
                  # An attempt to write the security plugin's own users / roles index.
                  if cat == "OPENDISTRO_SECURITY_INDEX_ATTEMPT" { severity_id = 4; severity = "High"; denied = true }
              }
              if init_user != "" && init_user != uname && class_uid == 6003 { actor.user = { "name": init_user } }
          }

          if class_uid == 6003 {
              # Activity from the transport action: indices:data/read/* -> Read, ...
              if api_op == "" { api_op = http_method + " " + url_path }
              if activity_id == 99 {
                  if starts_with(api_op, "indices:data/read") || starts_with(api_op, "cluster:monitor") || starts_with(api_op, "indices:monitor") { activity_id = 2; activity_name = "Read" }
                  if starts_with(api_op, "indices:admin/create") || starts_with(api_op, "indices:admin/auto_create") || starts_with(api_op, "indices:data/write/index") { activity_id = 1; activity_name = "Create" }
                  if starts_with(api_op, "indices:data/write/update") || starts_with(api_op, "indices:data/write/bulk") || starts_with(api_op, "indices:admin/mapping/put") || starts_with(api_op, "indices:admin/settings/update") || starts_with(api_op, "cluster:admin/settings/update") { activity_id = 3; activity_name = "Update" }
                  if starts_with(api_op, "indices:admin/delete") || starts_with(api_op, "indices:data/write/delete") { activity_id = 4; activity_name = "Delete" }
              }
              api_obj = { "operation": api_op, "service": { "name": product.name } }
              if req_uid != "" { api_obj.request = { "uid": req_uid } }
              ocsf.api = api_obj
              if !exists(actor.user) {
                  if length(user) > 0 { actor.user = user } else { actor.app_name = "unknown" }
              }
              ocsf.actor = actor
              if length(indices) > 0 {
                  ocsf.resources = map_values(indices) -> |iv| { { "type": "index", "name": to_string(iv) ?? "" } }
              }
              if denied {
                  ocsf.metadata_profiles = ["security_control"]
                  ocsf.action_id = 2; ocsf.action = "Denied"
                  ocsf.disposition_id = 2; ocsf.disposition = "Blocked"
              }
          } else if class_uid == 3002 {
              if length(user) == 0 { user = { "name": "unknown" } }
              ocsf.user = user
              ocsf.service = { "name": product.name }
              if length(actor) > 0 { ocsf.actor = actor }
              ocsf.is_remote = true
          } else if class_uid == 3007 {
              ocsf.user = user
              if length(actor) > 0 { ocsf.actor = actor }
          }
          if class_uid == 3002 || class_uid == 6003 {
              if length(src_ep) == 0 { src_ep = { "name": "unknown" } }
              if http_method != "" || url_path != "" {
                  hr = {}
                  if http_method != "" { hr.http_method = http_method }
                  if url_path != "" {
                      uo = { "path": url_path }
                      if url_query != "" { uo.query_string = url_query }
                      hr.url = uo
                  }
                  ocsf.http_request = hr
              }
          }
          message = event_code
      } else if shape == "slowlog" {
          # ================= search / indexing slow log =================
          log_name = "slowlog"
          sl = object(get(f, ["elasticsearch", "slowlog"]) ?? {}) ?? {}
          if length(sl) == 0 { sl = f }
          logger = string(get(f, ["log", "logger"]) ?? "") ?? ""
          if logger == "" { logger = string(f.component) ?? "" }
          ltype = string(f.type) ?? ""
          is_index = contains(logger, "indexing") || ltype == "index_indexing_slowlog"
          log_level = string(get(f, ["log", "level"]) ?? "") ?? ""
          if log_level == "" { log_level = string(f.level) ?? "" }
          if upcase(log_level) == "WARN" { severity_id = 2; severity = "Low" }
          class_uid = 6005
          if is_index { activity_id = 5; activity_name = "Write" } else { activity_id = 4; activity_name = "Query" }
          status_id = 1; status_str = "Success"
          smsg = string(sl.message) ?? ""
          message = smsg
          im = parse_regex(smsg, r'^\x5B(?P<i>[^\x5D/]+)') ?? {}
          idx = string(im.i) ?? ""
          if idx == "" { idx = "unknown" }
          ocsf.table = { "name": idx }
          dbn = cluster_name
          if dbn == "" { dbn = "elasticsearch" }
          ocsf.database = { "name": dbn, "type_id": 6, "type": "NoSQL" }
          ocsf.type_id = 3
          ocsf.type = "Table"
          src = string(sl.source) ?? ""
          if src != "" {
              qi = { "query_string": src }
              stype = string(sl.search_type) ?? ""
              if stype != "" { qi.name = stype } else if is_index { qi.name = "index" } else { qi.name = "search" }
              ocsf.query_info = qi
          }
          took = to_int(sl.took_millis) ?? -1
          if took >= 0 { ocsf.duration = took }
          oid = string(sl.id) ?? ""
          if oid != "" && !is_index { actor.app_uid = oid }
          sun = string(get(f, ["user", "name"]) ?? "") ?? ""
          if sun != "" { actor.user = { "name": sun } }
          if length(actor) == 0 { actor = { "app_name": "unknown" } }
          ocsf.actor = actor
          ocsf.src_endpoint = { "name": "unknown" }
          corr = string(get(f, ["trace", "id"]) ?? "") ?? ""
      } else {
          # ================= server log =================
          log_level = string(get(f, ["log", "level"]) ?? "") ?? ""
          if log_level == "" { log_level = string(f.level) ?? "" }
          logger = string(get(f, ["log", "logger"]) ?? "") ?? ""
          if logger == "" { logger = string(f.component) ?? "" }
          ltype = string(f.type) ?? ""
          if ltype == "deprecation" || contains(string(get(f, ["event", "dataset"]) ?? "") ?? "", "deprecation") { log_name = "deprecation" } else { log_name = "server" }
          message = string(f.message) ?? ""
          lvl = upcase(log_level)
          if lvl == "WARN" || lvl == "WARNING" { severity_id = 3; severity = "Medium" }
          if lvl == "ERROR" { severity_id = 4; severity = "High" }
          if lvl == "FATAL" || lvl == "CRITICAL" { severity_id = 6; severity = "Fatal" }
          is_node = ends_with(logger, ".node.Node") || logger == "o.e.n.Node" || ends_with(logger, "node.Node")
          if is_node && (message == "started" || starts_with(message, "started ")) {
              class_uid = 6002; activity_id = 3; activity_name = "Start"; status_id = 1; status_str = "Success"
          } else if is_node && (message == "stopped" || message == "closed") {
              class_uid = 6002; activity_id = 4; activity_name = "Stop"; status_id = 1; status_str = "Success"
          } else if lvl == "ERROR" || lvl == "FATAL" || lvl == "CRITICAL" {
              class_uid = 6008; activity_id = 1; activity_name = "General Error"; status_id = 2; status_str = "Failure"
              ex = string(get(f, ["error", "message"]) ?? "") ?? ""
              if ex == "" { ex = string(get(f, ["error", "type"]) ?? "") ?? "" }
              if ex != "" { status_detail = ex }
          }
          if class_uid == 6002 { ocsf.app = product }
          corr = string(get(f, ["trace", "id"]) ?? "") ?? ""
      }

      cls_name = "Base Event"
      cat_uid = 0
      cat_name = "Uncategorized"
      if class_uid == 3002 { cls_name = "Authentication"; cat_uid = 3; cat_name = "Identity & Access Management" }
      if class_uid == 3007 { cls_name = "User Management"; cat_uid = 3; cat_name = "Identity & Access Management" }
      if class_uid == 4001 { cls_name = "Network Activity"; cat_uid = 4; cat_name = "Network Activity" }
      if class_uid == 6002 { cls_name = "Application Lifecycle"; cat_uid = 6; cat_name = "Application Activity" }
      if class_uid == 6003 { cls_name = "API Activity"; cat_uid = 6; cat_name = "Application Activity" }
      if class_uid == 6005 { cls_name = "Datastore Activity"; cat_uid = 6; cat_name = "Application Activity" }
      if class_uid == 6008 { cls_name = "Application Error"; cat_uid = 6; cat_name = "Application Activity" }

      profiles = array(ocsf.metadata_profiles) ?? []
      del(ocsf.metadata_profiles)
      ocsf.class_uid = class_uid
      ocsf.class_name = cls_name
      ocsf.category_uid = cat_uid
      ocsf.category_name = cat_name
      ocsf.activity_id = activity_id
      ocsf.activity_name = activity_name
      ocsf.type_uid = class_uid * 100 + activity_id
      ocsf.severity_id = severity_id
      ocsf.severity = severity
      ocsf.status_id = status_id
      ocsf.status = status_str
      if status_detail != "" { ocsf.status_detail = status_detail }
      if message != "" { ocsf.message = message }
      if (class_uid == 3002 || class_uid == 3007 || class_uid == 4001 || class_uid == 6003) && length(src_ep) > 0 { ocsf.src_endpoint = src_ep }
      if class_uid == 4001 && !exists(ocsf.src_endpoint) { ocsf.src_endpoint = { "name": "unknown" } }
      node_ep = {}
      if node_name != "" { node_ep.name = node_name }
      nip = string(f.audit_node_host_address) ?? ""
      if is_ipv4(nip) || is_ipv6(nip) { node_ep.ip = nip }
      if class_uid != 0 && class_uid != 6002 && class_uid != 6008 && class_uid != 3007 && length(node_ep) > 0 { ocsf.dst_endpoint = node_ep }
      ocsf.time = time_ms
      ocsf.raw_data = raw_log
      meta = {
          "version": "1.9.0",
          "uid": sha2("elasticsearch|raw|" + raw_log, variant: "SHA-256"),
          "log_name": log_name,
          "log_provider": product.name,
          "product": product
      }
      if length(profiles) > 0 { meta.profiles = profiles }
      if event_code != "" { meta.event_code = event_code }
      if log_level != "" { meta.log_level = log_level }
      if cluster_uuid != "" { meta.tenant_uid = cluster_uuid }
      if corr != "" { meta.correlation_uid = corr }
      if logger != "" { meta.loggers = [{ "name": logger }] }
      ocsf.metadata = meta

      . = ocsf
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # Values spill exactly as parsed: a parser never masks, redacts or withholds
  # anything (masking is an opt-in pipeline step, never a parser concern).
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # A source field is consumed ONLY by an explicit mapping: a field-coverage.yaml
  # `mappings` entry (source key -> target paths) or a `transforms` rule with a
  # target, whose value is found AT THAT TARGET PATH of the selected branch. A
  # value that merely appears somewhere else in the event never consumes a field
  # (no coincidental consumption); everything else spills.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The sets below are strings instead
  # (a read shares the buffer). __repr holds one member per mapped leaf:
  # "," + encode_json(path) + "=" + encode_json(encode_json(value)), plus the
  # to_string form for a string or a float, so a numeric string is represented by
  # its typed scalar. Every part is a JSON text, inside which a '"' is always
  # escaped, so a member is matched exactly. Paths drop array indices
  # (resources.0.uid is resources.uid); arrays are walked two levels deep, and a
  # leaf deeper than that is simply not mapping evidence (it can only spill more).
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped = object!(parse_json!(encode_json(__mapped)))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __copy = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __repr = ""
  for_each(flatten(__mapped)) -> |path, value| {
      __p = encode_json(path)
      if is_array(value) {
          for_each(array!(value)) -> |_i, item| {
              if is_object(item) {
                  for_each(flatten(object!(item))) -> |sub, leaf| {
                      __q = encode_json(path + "." + sub)
                      if is_array(leaf) {
                          for_each(array!(leaf)) -> |_j, x| {
                              if !is_object(x) && !is_array(x) {
                                  __repr = __repr + ("," + __q + "=" + encode_json(encode_json(x)))
                                  if is_string(x) || is_float(x) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(x))) }
                              }
                          }
                      } else {
                          __repr = __repr + ("," + __q + "=" + encode_json(encode_json(leaf)))
                          if is_string(leaf) || is_float(leaf) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(leaf))) }
                      }
                  }
              } else if !is_array(item) {
                  __repr = __repr + ("," + __p + "=" + encode_json(encode_json(item)))
                  if is_string(item) || is_float(item) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(item))) }
              }
          }
      } else {
          __repr = __repr + ("," + __p + "=" + encode_json(encode_json(value)))
          if is_string(value) || is_float(value) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(value))) }
      }
  }
  __consumed = ""
  # BEGIN parser-specific transformations
  # @timestamp: ISO 8601 event clock converted to event milliseconds.
  # timestamp: ISO 8601 event clock converted to event milliseconds (the comma-decimal form is normalized by the parser and stays residual when the generic parse rejects it).
  for_each(flatten(__source_kv)) -> |key, value| {
      if match(key, r'(?x)
      \A(?:
        @timestamp
      | timestamp
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%+")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              if contains(__repr, "," + "\"time\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
  }
  # Declared source -> target mappings (field-coverage.yaml `mappings`).
  __decl = "\n\"action\"\t[\"api.operation\"]\n\"audit_authentication_failure_reason\"\t[\"status_detail\"]\n\"audit_category\"\t[\"message\",\"metadata.event_code\"]\n\"audit_node_host_address\"\t[\"dst_endpoint.ip\"]\n\"audit_node_name\"\t[\"dst_endpoint.name\"]\n\"audit_request_attempted_user\"\t[\"user.name\"]\n\"audit_request_effective_user\"\t[\"user.name\"]\n\"audit_request_initiating_user\"\t[\"actor.user.name\"]\n\"audit_request_remote_address\"\t[\"src_endpoint.ip\"]\n\"audit_rest_request_method\"\t[\"http_request.http_method\"]\n\"audit_rest_request_path\"\t[\"http_request.url.path\"]\n\"audit_trace_indices\"\t[\"resources.name\"]\n\"audit_transport_action\"\t[\"api.operation\"]\n\"cluster.name\"\t[\"database.name\"]\n\"cluster.uuid\"\t[\"metadata.tenant_uid\"]\n\"component\"\t[\"metadata.loggers.name\"]\n\"elasticsearch.cluster.name\"\t[\"database.name\"]\n\"elasticsearch.cluster.uuid\"\t[\"metadata.tenant_uid\"]\n\"elasticsearch.node.name\"\t[\"dst_endpoint.name\"]\n\"elasticsearch.slowlog.id\"\t[\"actor.app_uid\"]\n\"elasticsearch.slowlog.message\"\t[\"message\"]\n\"elasticsearch.slowlog.search_type\"\t[\"query_info.name\"]\n\"elasticsearch.slowlog.source\"\t[\"query_info.query_string\"]\n\"elasticsearch.slowlog.took_millis\"\t[\"duration\"]\n\"error.message\"\t[\"status_detail\"]\n\"event.action\"\t[\"message\",\"metadata.event_code\"]\n\"id\"\t[\"actor.app_uid\"]\n\"indices\"\t[\"resources.name\"]\n\"level\"\t[\"metadata.log_level\"]\n\"log.level\"\t[\"metadata.log_level\"]\n\"log.logger\"\t[\"metadata.loggers.name\"]\n\"message\"\t[\"message\"]\n\"node.name\"\t[\"dst_endpoint.name\"]\n\"put.user.name\"\t[\"user.name\"]\n\"request.id\"\t[\"api.request.uid\"]\n\"request.method\"\t[\"http_request.http_method\"]\n\"rule\"\t[\"status_detail\"]\n\"search_type\"\t[\"query_info.name\"]\n\"source\"\t[\"query_info.query_string\"]\n\"took_millis\"\t[\"duration\"]\n\"trace.id\"\t[\"metadata.correlation_uid\"]\n\"url.path\"\t[\"http_request.url.path\"]\n\"url.query\"\t[\"http_request.url.query_string\"]\n\"user.name\"\t[\"actor.user.name\",\"user.name\"]\n\"user.realm\"\t[\"actor.user.domain\",\"user.domain\"]\n\"user.roles\"\t[\"actor.user.groups.name\"]\n\"user.run_as.name\"\t[\"user.name\"]\n\"user.run_as.realm\"\t[\"user.domain\"]\n"
  __preserve = []
  # END parser-specific transformations
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__copy.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # Declared mappings: __decl holds "\n" + encode_json(key) + "\t" + JSON array of
  # target paths + "\n" per mapped source key (a raw newline never occurs in
  # compact JSON). A key is consumed when its value, or every element of a scalar
  # array, is at one of its own targets.
  for_each(__flat) -> |key, value| {
      if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
      # __decl spells a bracket inside a key as a \u escape (deploy bracket count).
      __kt = encode_json(key)
      if match(__kt, r'[\x28\x29\x5B\x5D\x7B\x7D]') {
          __kt = replace(replace(replace(replace(replace(replace(__kt, r'\x28', "\\u0028"), r'\x29', "\\u0029"), r'\x5B', "\\u005b"), r'\x5D', "\\u005d"), r'\x7B', "\\u007b"), r'\x7D', "\\u007d")
      }
      __at = find(__decl, "\n" + __kt + "\t")
      if is_integer(__at) && !is_object(value) {
          __rest = slice!(__decl, int!(__at) + strlen(__kt) + 2)
          __hit = false
          for_each(array!(parse_json!(slice!(__rest, 0, int!(find(__rest, "\n")))))) -> |_i, target| {
              __tok = "," + encode_json(target) + "="
              if !__hit && is_array(value) {
                  __all = !is_empty(array!(value))
                  for_each(array!(value)) -> |_j, item| {
                      if __all {
                          __all = !is_object(item) && !is_array(item) && (contains(__repr, __tok + encode_json(encode_json(item))) || ((is_string(item) || is_float(item)) && contains(__repr, __tok + encode_json(to_string!(item)))))
                      }
                  }
                  __hit = __all
              } else if !__hit {
                  __hit = contains(__repr, __tok + encode_json(encode_json(value))) || ((is_string(value) || is_float(value)) && contains(__repr, __tok + encode_json(to_string!(value))))
              }
          }
          if __hit { __consumed = __consumed + ("," + encode_json(key)) }
      }
  }
  # Fast path: when no two source keys decode to the same key and no two spilled
  # keys get the same name, each key's decision depends only on its own value, so
  # one filter and one rename build the residual without copying it per key.
  __distinct = true
  if __tilde {
      __distinct = length(map_keys(__flat) -> |key| { replace(replace(key, "~1", "."), "~0", "~") }) == length(__flat)
  }
  __kept = {}
  __names = {}
  if __distinct {
      __kept = filter(__flat) -> |key, value| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          # A key is kept unless an explicit mapping or transformation consumed it.
          # Do not spill a copy of the raw body.
          value != __raw_body && !contains(__consumed, "," + encode_json(key))
      }
      __names = map_keys(__kept) -> |key| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          join!(__parts, ".")
      }
  }
  __residual = {}
  if __distinct && length(__names) == length(__kept) {
      __residual = map_values(__names) -> |value| {
          if is_array(value) || is_object(value) {
              if __tilde {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              if __complex { value = encode_json(value) }
          }
          value
      }
  } else {
      # Slow path, in source key order: a name already taken gets the next free
      # _2, _3, ... suffix.
      for_each(__flat) -> |key, value| {
          key = replace(replace(key, "~1", "."), "~0", "~")
          if is_array(value) || is_object(value) {
              value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                  replace(replace(inner, "~1", "."), "~0", "~")
