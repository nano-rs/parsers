  elasticsearch~1slowlog~1took_millis:
  - duration
  error~1message:
  - status_detail
  event~1action:
  - message
  - metadata.event_code
  id:
  - actor.app_uid
  indices:
  - resources.name
  level:
  - metadata.log_level
  log~1level:
  - metadata.log_level
  log~1logger:
  - metadata.loggers.name
  message:
  - message
  node~1name:
  - dst_endpoint.name
  put.user.name:
  - user.name
  request~1id:
  - api.request.uid
  request~1method:
  - http_request.http_method
  rule:
  - status_detail
  search_type:
  - query_info.name
  source:
  - query_info.query_string
  took_millis:
  - duration
  trace~1id:
