source: json
transforms:
- source: '@timestamp'
  kind: epoch_ms
  target: time
  reason: ISO 8601 event clock converted to event milliseconds.
- source: timestamp
  kind: epoch_ms
  target: time
  reason: ISO 8601 event clock converted to event milliseconds (the comma-decimal form is normalized by
    the parser and stays residual when the generic parse rejects it).
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  action:
  - api.operation
  audit_authentication_failure_reason:
  - status_detail
  audit_category:
  - message
  - metadata.event_code
  audit_node_host_address:
  - dst_endpoint.ip
  audit_node_name:
  - dst_endpoint.name
  audit_request_attempted_user:
  - user.name
  audit_request_effective_user:
  - user.name
  audit_request_initiating_user:
  - actor.user.name
  audit_request_remote_address:
  - src_endpoint.ip
  audit_rest_request_method:
  - http_request.http_method
  audit_rest_request_path:
  - http_request.url.path
  audit_trace_indices:
  - resources.name
  audit_transport_action:
  - api.operation
  cluster.name:
  - database.name
  cluster.uuid:
  - metadata.tenant_uid
  component:
  - metadata.loggers.name
  elasticsearch.cluster.name:
  - database.name
  elasticsearch.cluster.uuid:
  - metadata.tenant_uid
  elasticsearch.node.name:
  - dst_endpoint.name
  elasticsearch.slowlog.id:
  - actor.app_uid
  elasticsearch.slowlog.message:
  - message
  elasticsearch.slowlog.search_type:
  - query_info.name
  elasticsearch.slowlog.source:
  - query_info.query_string
  elasticsearch.slowlog.took_millis:
  - duration
  error.message:
  - status_detail
  event.action:
  - message
  - metadata.event_code
  id:
  - actor.app_uid
  indices:
  - resources.name
  level:
  - metadata.log_level
  log.level:
  - metadata.log_level
  log.logger:
  - metadata.loggers.name
  message:
  - message
  node.name:
  - dst_endpoint.name
  put.user.name:
  - user.name
  request.id:
  - api.request.uid
  request.method:
  - http_request.http_method
  rule:
  - status_detail
  search_type:
  - query_info.name
  source:
  - query_info.query_string
  took_millis:
  - duration
  trace.id:
  - metadata.correlation_uid
  url.path:
