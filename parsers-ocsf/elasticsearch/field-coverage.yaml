source: json
transforms:
- source: '@timestamp'
  kind: epoch_ms
  target: time
  reason: ISO 8601 event clock converted to event milliseconds.
- source: timestamp
  kind: epoch_ms
  target: time
  reason: ISO 8601 event clock converted to event milliseconds (the comma-decimal form
    is normalized by the parser and stays residual when the generic parse rejects it).
consumed_candidates:
- 'action'
- 'audit_authentication_failure_reason'
- 'audit_category'
- 'audit_cluster_name'
- 'audit_node_host_address'
- 'audit_node_name'
- 'audit_request_attempted_user'
- 'audit_request_effective_user'
- 'audit_request_id'
- 'audit_request_initiating_user'
- 'audit_request_privilege'
- 'audit_request_remote_address'
- 'audit_request_user_roles'
- 'audit_rest_request_method'
- 'audit_rest_request_path'
- 'audit_trace_indices'
- 'audit_transport_action'
- 'cluster.name'
- 'cluster.uuid'
- 'component'
- 'elasticsearch.cluster.name'
- 'elasticsearch.cluster.uuid'
- 'elasticsearch.node.name'
- 'elasticsearch.slowlog.id'
- 'elasticsearch.slowlog.message'
- 'elasticsearch.slowlog.search_type'
- 'elasticsearch.slowlog.source'
- 'elasticsearch.slowlog.took_millis'
- 'error.message'
- 'error.type'
- 'event.action'
- 'id'
- 'indices'
- 'level'
- 'log.level'
- 'log.logger'
- 'message'
- 'node.name'
- 'put.user.name'
- 'request.id'
- 'request.method'
- 'rule'
- 'search_type'
- 'source'
- 'took_millis'
- 'trace.id'
- 'url.path'
