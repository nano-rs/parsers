source: json
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
transforms:
- source: when
  kind: epoch_ms
  format: '%+'
  target: time
  reason: The audit record's clock (RFC 3339, UTC) is the event time.
- source: action.result
  kind: enum
  target: status_id
  values:
    'true': 1
    'false': 2
  reason: action.result is the outcome; true is Success, false Failure.
mappings:
  action.type:
  - api.operation
  actor.email:
  - actor.user.name
  - user.email_addr
  - user.name
  actor.id:
  - actor.user.uid
  - user.uid
  actor.ip:
  - src_endpoint.ip
  id:
  - metadata.uid
  metadata.token_name:
  - resources.name
  owner.id:
  - resources.uid
  resource.id:
  - resources.uid
  resource.type:
  - resources.type
  metadata.name:
  - resources.name
  metadata.zone_name:
  - resources.namespace
  metadata.reason:
  - status_detail
