source: json
transforms:
- source: severity
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value
    is emitted.
- source: LAST_SCAN_DATETIME
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: firstDetectedDate
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: lastEvaluated
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: PUBLISHED_DATETIME
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
consumed_candidates:
- CATEGORY
- CVE_LIST
- CVSS_BASE
- CVSS_V3_BASE
- DETECTION_LIST
- DNS
- IP
- LAST_SCAN_DATETIME
- NETBIOS
- OS
- PUBLISHED_DATETIME
- QID
- SEVERITY
- SOLUTION
- TITLE
- TRACKING_METHOD
- VULN_TYPE
- controlId
- cvss_v3
- cvss_v3.base
- evidence
- firstDetectedDate
- hostIp
- hostName
- id
- lastEvaluated
- method
- param
- policyName
- qid
- rationale
- severity
- status
- technology
- title
- uri
- vulnType
- webApp
- webApp.name
- webApp.url
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
