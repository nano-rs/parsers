source: json
transforms:
- source: t.$date
  kind: epoch_ms
  target: time
  reason: Structured log clock (ISO 8601 in an extended JSON $date) converted to event milliseconds.
- source: ts.$date
  kind: epoch_ms
  target: time
  reason: Audit log clock (ISO 8601 in an extended JSON $date) converted to event milliseconds.
- source: s
  kind: enum
  target: metadata.log_level
  values:
    f: Fatal
    e: Error
    w: Warning
    i: Info
    d1: Debug
    d2: Debug
    d3: Debug
    d4: Debug
    d5: Debug
  reason: MongoDB severity letter mapped to the log level name; consume only when the emitted level matches.
- source: result
  kind: enum
  target: status_detail
  values:
    '11': UserNotFound
    '13': Unauthorized
    '18': AuthenticationFailed
  reason: Audit result error code mapped to the MongoDB error code name written as status_detail.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  atype:
  - message
  - metadata.event_code
  attr.appName:
  - actor.app_name
  attr.durationMillis:
  - duration
  attr.errMsg:
  - status_detail
  attr.error:
  - status_detail
  attr.mechanism:
  - auth_protocol
  attr.principalName:
  - user.name
  attr.user:
  - user.name
  c:
  - metadata.loggers.name
  ctx:
  - actor.session.uid
  - metadata.correlation_uid
  id:
  - metadata.event_code
  local.ip:
  - dst_endpoint.ip
  local.port:
  - dst_endpoint.port
  msg:
  - message
  param.command:
  - query_info.name
  param.mechanism:
  - auth_protocol
  param.user:
  - user.name
  remote.ip:
  - src_endpoint.ip
  remote.port:
  - src_endpoint.port
  ts.$date.$numberLong:
  - time
