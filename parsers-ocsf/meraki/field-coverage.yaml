source: text
transforms:
- source: protocol
  kind: lowercase
  reason: Parser case-normalizes this parsed field when represented in output.
- source: proto
  kind: lowercase
  reason: Parser case-normalizes this parsed field when represented in output.
- source: direction
  kind: lowercase
  reason: Parser case-normalizes this parsed field when represented in output.
- source: type
  kind: lowercase
  reason: Parser case-normalizes this parsed field when represented in output.
- source: blocked
  kind: lowercase
  reason: Parser case-normalizes this parsed field when represented in output.
- source: action
  kind: lowercase
  reason: Parser case-normalizes this parsed field when represented in output.
- source: mac
  kind: lowercase
  reason: Case normalization already performed by the parser; observed at src_endpoint.mac,
    and checked against the emitted branch.
- source: timestamp
  kind: scale
  factor: 1000
  target: time
  reason: Existing unit conversion by 1000 verified against time; unused clock fallbacks
    remain residual.
probe:
  mode: suffix
  require: type=8021x_auth
  text: ' ResidualProbe="nan2421-text-unknown" password="nan2421-secret"'
  source: ResidualProbe
consumed_candidates:
- action
- blocked
- connectivity
- dip
- direction
- dport
- dst
- header.device
- header.epoch
- header.logtype
- header.rest
- identity
- mac
- name
- priority
- proto
- protocol
- radio
- rssi
- signature
- sip
- sport
- src
- type
- user
- vap
- vpn_type
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
