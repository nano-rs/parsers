source: text
probe:
  mode: suffix
  require: type=8021x_auth
  text: ' ResidualProbe="nan2421-text-unknown" password="nan2421-secret"'
  source: ResidualProbe
transforms:
- source: protocol
  kind: lowercase
  target: connection_info.protocol_name
  reason: Parser case-normalizes this parsed field when represented in output.
- source: type
  kind: lowercase
  target: metadata.event_code
  reason: Parser case-normalizes this parsed field when represented in output.
- source: mac
  kind: lowercase
  target: observables.value
  reason: Case normalization already performed by the parser; observed at src_endpoint.mac, and checked
    against the emitted branch.
- source: mac
  kind: lowercase
  target: src_endpoint.mac
  reason: Case normalization already performed by the parser; observed at src_endpoint.mac, and checked
    against the emitted branch.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  dport:
  - dst_endpoint.port
  dst:
  - dst_endpoint.ip
  - observables.value
  header.device:
  - device.hostname
  - src_endpoint.hostname
  header.logtype:
  - metadata.log_name
  identity:
  - actor.user.name
  - observables.value
  - user.name
  protocol:
  - connection_info.protocol_name
  signature:
  - finding_info.analytic.uid
  - finding_info.uid
  sport:
  - src_endpoint.port
  src:
  - observables.value
  - src_endpoint.ip
  type:
  - metadata.event_code
