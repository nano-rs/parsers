- raw: <134>1 1730281900.000000000 MR33-OFFICE events type=8021x_auth radio=1 vap=2 client_mac=00:0C:29:3A:1B:5F identity=corp\\jsmith aid=1234
  expect:
    class_uid: 3002
    activity_id: 1
    user.name: corp\\jsmith
    actor.user.name: corp\\jsmith
    disposition_id: 1
- raw: '<134>1 1730281572.123456789 MX84-BRANCH flows src=10.10.1.55 dst=93.184.216.34 mac=00:0C:29:3A:1B:5F protocol=tcp sport=51422 dport=443 pattern: allow all'
  expect:
    class_uid: 4001
    activity_id: 6
    src_endpoint.ip: 10.10.1.55
    dst_endpoint.ip: 93.184.216.34
    disposition_id: 1
- raw: '<134>1 1730281600.000000000 MX84-BRANCH flows src=203.0.113.44 dst=10.10.1.20 mac=AA:BB:CC:DD:EE:FF protocol=tcp sport=44112 dport=3389 pattern: deny all'
