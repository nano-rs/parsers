source: text
transforms:
- source: header.ts
  kind: epoch_ms
  target: time
  format: '%+'
  reason: RFC 3339 header clock with an offset converted to event milliseconds; the offset-less fail2ban.log
    clock remains residual.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  header.host:
  - device.hostname
  header.jhost:
  - device.hostname
  header.logger:
  - metadata.log_provider
  header.level:
  - metadata.log_level
  jail_event.jail:
  - finding_info.analytic.name
  jail_event.ip:
  - evidences.src_endpoint.ip
  - observables.value
  message:
  - message
