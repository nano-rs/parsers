source: text
transforms:
- source: header.ts
  kind: epoch_ms
  target: time
  format: '%+'
  reason: RFC 3339 header clock with an offset converted to event milliseconds; the offset-less fail2ban.log clock remains residual.
consumed_candidates:
- header.host
- header.jhost
- header.logger
- header.level
- jail_event.jail
- jail_event.verb
- jail_event.ip
- message
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
