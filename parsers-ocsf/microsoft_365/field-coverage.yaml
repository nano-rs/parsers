source: json
transforms:
- source: CreationTime
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: ResultStatus
  target: status_id
  kind: enum
  reason: M365 operation result maps to OCSF status.
  values:
    succeeded: 1
    success: 1
    'true': 1
    failed: 2
    failure: 2
    'false': 2
- source: CreationTime
  kind: epoch_ms
  target: time
  format: '%Y-%m-%dT%H:%M:%S'
  reason: M365 also accepts zone-less ISO clocks using the parser runtime timezone; compare the emitted
    milliseconds.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  ClientIP:
  - src_endpoint.ip
  FromIP:
  - src_endpoint.ip
  Id:
  - metadata.original_event_uid
  - metadata.uid
  LogonError:
  - status_detail
  MessageId:
  - email.message_uid
  MessageTraceId:
  - message_trace_uid
  ObjectId:
  - file.path
  - resources.name
  - resources.uid
  Operation:
  - api.operation
  - message
  - metadata.event_code
  OrganizationId:
  - cloud.account.uid
  - metadata.tenant_uid
  RecipientAddress:
  - email.to
  SenderAddress:
  - email.from
  SessionId:
  - session.uid
  Size:
  - email.size
  SourceFileExtension:
  - file.ext
  SourceFileName:
  - file.name
  Subject:
  - email.subject
  ToIP:
  - dst_endpoint.ip
  UserAgent:
  - http_request.user_agent
  UserId:
  - actor.user.email_addr
  - actor.user.name
  - user.email_addr
  - user.name
  UserKey:
  - actor.user.uid
  - user.uid
  Workload:
  - api.service.name
  - cloud.account.name
  - resources.type
