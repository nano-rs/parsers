source: json
transforms:
- source: ResultStatus
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value
    is emitted.
- source: Direction
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value
    is emitted.
- source: Action
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value
    is emitted.
- source: ItemType
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value
    is emitted.
- source: CreationTime
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: ResultStatus
  target: status_id
  kind: enum
  reason: M365 operation result maps to OCSF status.
  values:
    succeeded: 1
    success: 1
    'true': 1
    failed: 2
    failure: 2
    'false': 2
- source: CreationTime
  kind: epoch_ms
  target: time
  format: '%Y-%m-%dT%H:%M:%S'
  reason: M365 also accepts zone-less ISO clocks using the parser runtime timezone;
    compare the emitted milliseconds.
