name: microsoft_365_ocsf
display_name: Microsoft 365 (OCSF)
version: "1.3.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields in redacted, dotted snake_case unmapped keys.
  Parses Microsoft 365 Management Activity API records into complete OCSF 1.9.0
  records, routed by Workload and Operation:
    Exchange MessageTrace (SenderAddress / MessageTraceId) -> Email Activity 4009
    Exchange mailbox operations                            -> API Activity 6003
    SharePoint / OneDrive                                  -> File Hosting Activity 6006
    AzureActiveDirectory UserLoggedIn / UserLoginFailed /
      UserLoggedOut                                        -> Authentication 3002
    AzureActiveDirectory user lifecycle ("Add user.",
      "Delete user.", "Reset user password.", strong-auth) -> User Management 3007
    AzureActiveDirectory group operations                  -> Group Management 3006
    Teams, DLP, SecurityComplianceCenter, everything else  -> API Activity 6003
  Account Change 3001 and User Access Management 3005 are DEPRECATED in OCSF
  1.9 and are not emitted. On Azure AD directory changes the record's `UserId`
  (or Actor[]) is the administrator (`actor.user`) and `Target[]` is the subject
  (`user` / `group`). Carries metadata.profiles ["cloud"] because the `cloud`
  object (tenant = OrganizationId) is profile-bound in OCSF 1.9.
match_values:
  - microsoft_365
category: cloud
vendor: "Microsoft"
product: "Microsoft 365"
parser_vrl: |
  # Microsoft 365 Management Activity API JSON -> OCSF 1.9.0.
  raw_log = string!(.message)
  __raw_body = raw_log
  __source_kv = {}
  parsed, err = parse_json(raw_log)
  __source_kv = object(parsed) ?? {}

  if err != null || !is_object(parsed) {
      # Unparseable input is emitted as an OCSF Base Event (class_uid 0)
      # rather than being guessed into a security class: it stays valid, and
      # therefore visible, without fabricating a user or an outcome.
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 0,
          "activity_name": "Unknown",
          "type_uid": 0,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": 0,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": sha2("microsoft_365|raw|" + raw_log, variant: "SHA-256"),
              "log_level": "error",
              "log_name": "Microsoft 365 Management Activity",
              "log_provider": "Microsoft 365",
              "product": { "name": "Microsoft 365", "vendor_name": "Microsoft" }
          },
          "unmapped": { "parse_error": "not a JSON object" }
      }
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      . = set!(., ["unmapped", "parse_fallback"], "unparsable input")
  } else {
      p = object!(parsed)

      # metadata.profiles must declare every profile-bound object the record
      # carries: `cloud` always, `security_control` when a disposition is set.
      profiles = ["cloud"]

      workload = string(p.Workload) ?? ""
      operation = string(p.Operation) ?? ""
      op_l = downcase(operation)

      # ---- time ----
      time_ms = 0
      raw_ts = string(p.CreationTime) ?? ""
      if raw_ts != "" {
          t, terr = parse_timestamp(raw_ts, "%+")
          if terr != null { t, terr = parse_timestamp(raw_ts, "%Y-%m-%dT%H:%M:%S") }
          if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
      }

      # ---- outcome ----
      status_id = 0
      status_str = "Unknown"
      severity_id = 1
      severity = "Informational"
      result_raw = downcase(string(p.ResultStatus) ?? "")
      if result_raw == "succeeded" || result_raw == "success" || result_raw == "partiallysucceeded" {
          status_id = 1; status_str = "Success"
      } else if result_raw == "failed" || result_raw == "failure" {
          status_id = 2; status_str = "Failure"; severity_id = 2; severity = "Low"
      } else if result_raw != "" {
          status_id = 99; status_str = "Other"
      }

      # ---- acting principal ----
      actor_id = string(p.UserId) ?? ""
      actor_user = { "name": downcase(actor_id) }
      if actor_id == "" { actor_user = { "name": "unknown" } }
      user_key = string(p.UserKey) ?? ""
      if user_key != "" { actor_user = set!(actor_user, ["uid"], user_key) }
      if match(actor_id, r'^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$') {
          actor_user = set!(actor_user, ["email_addr"], downcase(actor_id))
          apx = split(actor_id, "@")
          if length(apx) == 2 { actor_user = set!(actor_user, ["domain"], downcase(string(apx[1]) ?? "")) }
      }

      # ---- Azure AD Target[] -> the subject of a directory change ----
      targets = array(p.Target) ?? []
      target_id = ""
      for_each(targets) -> |_i, tv| {
          to_ = object(tv) ?? {}
          tval = string(to_.ID) ?? ""
          if target_id == "" && tval != "" { target_id = tval }
      }
      subject = { "name": downcase(target_id) }
      if match(target_id, r'^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$') {
          subject = set!(subject, ["email_addr"], downcase(target_id))
      }
      have_subject = target_id != ""

      # ---- source IP: ClientIP may be "ip", "ip:port" or "[v6]:port" ----
      raw_ip = string(p.ClientIP) ?? string(p.ClientIPAddress) ?? string(p.ActorIpAddress) ?? ""
      src_ip = ""
      src_port = 0
      if raw_ip != "" {
          if starts_with(raw_ip, "[") {
              m6, m6err = parse_regex(raw_ip, r'^\[(?P<ip>[^\]]+)\](:(?P<port>\d+))?$')
              if m6err == null {
                  src_ip = string(m6.ip) ?? ""
                  src_port = to_int(m6.port) ?? 0
              }
          } else {
              colon_parts = split(raw_ip, ":")
              if length(colon_parts) == 2 {
                  src_ip = string(colon_parts[0]) ?? ""
                  src_port = to_int(colon_parts[1]) ?? 0
              } else {
                  src_ip = raw_ip
              }
          }
      }

      # ---- workload dispatch ----
      is_message_trace = workload == "Exchange" && (operation == "MessageTrace" || exists(p.SenderAddress) || exists(p.MessageTraceId))
      is_aad = workload == "AzureActiveDirectory"
      aad_auth = operation == "UserLoggedIn" || operation == "UserLoginFailed" || operation == "UserLoggedOut" || operation == "UserLoggedInFromNewDevice"
      aad_usermgmt = starts_with(op_l, "add user") || starts_with(op_l, "delete user") || starts_with(op_l, "update user") ||
                     starts_with(op_l, "reset user password") || starts_with(op_l, "change user password") ||
                     starts_with(op_l, "set force change user password") ||
                     starts_with(op_l, "disable strong authentication") || starts_with(op_l, "enable strong authentication") ||
                     starts_with(op_l, "enable account") || starts_with(op_l, "disable account")
      aad_groupmgmt = starts_with(op_l, "add group") || starts_with(op_l, "delete group") || starts_with(op_l, "update group") ||
                      starts_with(op_l, "add member to group") || starts_with(op_l, "remove member from group")

      class_uid = 6003
      if is_message_trace {
          class_uid = 4009
      } else if workload == "SharePoint" || workload == "OneDrive" {
          class_uid = 6006
      } else if is_aad && aad_auth {
          class_uid = 3002
      } else if is_aad && aad_usermgmt {
          class_uid = 3007
      } else if is_aad && aad_groupmgmt {
          class_uid = 3006
      }

      ocsf = {}

      if class_uid == 4009 {
          # ---- Exchange message trace -> Email Activity ----
          direction_raw = downcase(string(p.Direction) ?? string(p.Directionality) ?? "")
          direction_id = 0
          if direction_raw == "inbound" || direction_raw == "incoming" { direction_id = 1 }
          if direction_raw == "outbound" || direction_raw == "originating" { direction_id = 2 }
          if direction_raw == "intraorg" || direction_raw == "internal" { direction_id = 3 }

          activity_id = 99
          activity_name = "Other"
          if direction_id == 1 { activity_id = 2; activity_name = "Receive" }
          if direction_id == 2 { activity_id = 1; activity_name = "Send" }
          if direction_id == 3 { activity_id = 1; activity_name = "Send" }

          sender = string(p.SenderAddress) ?? ""
          recipient = string(p.RecipientAddress) ?? ""
          email_obj = {}
          if match(sender, r'^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$') { email_obj = set!(email_obj, ["from"], downcase(sender)) }
          if match(recipient, r'^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$') { email_obj = set!(email_obj, ["to"], [downcase(recipient)]) }
          subj = string(p.Subject) ?? ""
          if subj != "" { email_obj = set!(email_obj, ["subject"], subj) }
          mid = string(p.MessageId) ?? ""
          if mid != "" { email_obj = set!(email_obj, ["message_uid"], mid) }
          size = to_int(p.Size) ?? 0
          if size > 0 { email_obj = set!(email_obj, ["size"], size) }
          # email requires at_least_one(from, to)
          if length(email_obj) == 0 { email_obj = { "from": "unknown@invalid.local" } }

          ocsf.class_uid = 4009
          ocsf.class_name = "Email Activity"
          ocsf.category_uid = 4
          ocsf.category_name = "Network Activity"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          ocsf.direction_id = direction_id
          ocsf.email = email_obj
          trace_id = string(p.MessageTraceId) ?? ""
          if trace_id != "" { ocsf.message_trace_uid = trace_id }
          mail_action = downcase(string(p.Action) ?? "")
          if mail_action != "" {
              disp_id = 99
              disp = "Other"
              if contains(mail_action, "deliver") || contains(mail_action, "allow") { disp_id = 1; disp = "Allowed" }
              if contains(mail_action, "block") || contains(mail_action, "reject") { disp_id = 2; disp = "Blocked" }
              if contains(mail_action, "quarantine") { disp_id = 3; disp = "Quarantined" }
              ocsf.disposition_id = disp_id
              ocsf.disposition = disp
              # disposition is bound to the security_control profile.
              profiles = push(profiles, "security_control")
          }
          to_ip = string(p.ToIP) ?? ""
          if to_ip != "" { ocsf.dst_endpoint = { "ip": downcase(to_ip) } }
          from_ip = string(p.FromIP) ?? ""
          if from_ip != "" { src_ip = from_ip }
      } else if class_uid == 6006 {
          activity_id = 99
          activity_name = "Other"
          if op_l == "fileuploaded" || op_l == "fileuploadedtoonedrive" { activity_id = 1; activity_name = "Upload" }
          if op_l == "filedownloaded" || op_l == "filesyncdownloadedfull" { activity_id = 2; activity_name = "Download" }
          if op_l == "filemodified" || op_l == "filecheckedin" { activity_id = 3; activity_name = "Update" }
          if op_l == "filedeleted" || op_l == "filerecycled" || op_l == "filedeletedfirststagerecyclebin" { activity_id = 4; activity_name = "Delete" }
          if op_l == "filerenamed" { activity_id = 5; activity_name = "Rename" }
          if op_l == "filecopied" { activity_id = 6; activity_name = "Copy" }
          if op_l == "filemoved" { activity_id = 7; activity_name = "Move" }
          if op_l == "filerestored" { activity_id = 8; activity_name = "Restore" }
          if op_l == "filepreviewed" { activity_id = 9; activity_name = "Preview" }
          if op_l == "filecheckedout" { activity_id = 10; activity_name = "Lock" }
          if op_l == "filecheckincancelled" { activity_id = 11; activity_name = "Unlock" }
          if op_l == "sharinginvitationcreated" || op_l == "anonymouslinkcreated" || op_l == "companylinkcreated" || op_l == "addedtosecurelink" || op_l == "sharingset" { activity_id = 12; activity_name = "Share" }
          if op_l == "sharingrevoked" || op_l == "anonymouslinkremoved" { activity_id = 13; activity_name = "Unshare" }
          if op_l == "fileaccessed" || op_l == "fileaccessedextended" { activity_id = 14; activity_name = "Open" }
          if op_l == "filesyncuploadedfull" || op_l == "filesyncdownloadedpartial" { activity_id = 15; activity_name = "Sync" }

          fname = string(p.SourceFileName) ?? ""
          if fname == "" { fname = string(p.ObjectId) ?? "" }
          if fname == "" { fname = "unknown" }
          file_obj = { "name": fname, "type_id": 1 }
          fpath = string(p.ObjectId) ?? ""
          if fpath != "" { file_obj = set!(file_obj, ["path"], fpath) }
          fext = string(p.SourceFileExtension) ?? ""
          if fext != "" { file_obj = set!(file_obj, ["ext"], fext) }
          item_type = downcase(string(p.ItemType) ?? "")
          if item_type == "folder" { file_obj = set!(file_obj, ["type_id"], 2) }

          ocsf.class_uid = 6006
          ocsf.class_name = "File Hosting Activity"
          ocsf.category_uid = 6
          ocsf.category_name = "Application Activity"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          ocsf.file = file_obj
          ocsf.actor = { "user": actor_user }
      } else if class_uid == 3002 {
          activity_id = 1
          activity_name = "Logon"
          if operation == "UserLoggedOut" { activity_id = 2; activity_name = "Logoff" }
          if operation == "UserLoginFailed" { status_id = 2; status_str = "Failure"; severity_id = 2; severity = "Low" }

          ocsf.class_uid = 3002
          ocsf.class_name = "Authentication"
          ocsf.category_uid = 3
          ocsf.category_name = "Identity & Access Management"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          # Authentication 3002 carries the authenticating principal in `user`.
          ocsf.user = actor_user
          ocsf.service = { "name": "Azure Active Directory" }
          ocsf.is_remote = true
          sess = string(p.SessionId) ?? ""
          if sess != "" { ocsf.session = { "uid": sess } }
      } else if class_uid == 3007 {
          activity_id = 2
          activity_name = "Update"
          if starts_with(op_l, "add user") { activity_id = 1; activity_name = "Create" }
          if starts_with(op_l, "delete user") { activity_id = 3; activity_name = "Delete" }
          if starts_with(op_l, "enable account") { activity_id = 4; activity_name = "Enable" }
          if starts_with(op_l, "disable account") { activity_id = 5; activity_name = "Disable" }
          if starts_with(op_l, "change user password") { activity_id = 8; activity_name = "Password Change" }
          if starts_with(op_l, "reset user password") || starts_with(op_l, "set force change user password") { activity_id = 9; activity_name = "Password Reset" }
          if starts_with(op_l, "enable strong authentication") { activity_id = 12; activity_name = "Enable MFA Factors" }
          if starts_with(op_l, "disable strong authentication") { activity_id = 13; activity_name = "Disable MFA Factors" }

          ocsf.class_uid = 3007
          ocsf.class_name = "User Management"
          ocsf.category_uid = 3
          ocsf.category_name = "Identity & Access Management"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          # SUBJECT = Target[] (the account changed); ACTOR = UserId (the admin).
          if have_subject { ocsf.user = subject } else { ocsf.user = actor_user }
          ocsf.actor = { "user": actor_user }
      } else if class_uid == 3006 {
          activity_id = 99
          activity_name = "Other"
          if starts_with(op_l, "add group") { activity_id = 6; activity_name = "Create" }
          if starts_with(op_l, "delete group") { activity_id = 5; activity_name = "Delete" }
          if starts_with(op_l, "update group") { activity_id = 9; activity_name = "Update" }
          if starts_with(op_l, "add member to group") { activity_id = 3; activity_name = "Add User" }
          if starts_with(op_l, "remove member from group") { activity_id = 4; activity_name = "Remove User" }

          ocsf.class_uid = 3006
          ocsf.class_name = "Group Management"
          ocsf.category_uid = 3
          ocsf.category_name = "Identity & Access Management"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          gname = target_id
          if gname == "" { gname = string(p.ObjectId) ?? "" }
          if gname == "" { gname = "unknown" }
          ocsf.group = { "name": gname }
          ocsf.actor = { "user": actor_user }
      } else {
          activity_id = 99
          activity_name = "Other"
          if contains(op_l, "add") || contains(op_l, "create") || contains(op_l, "new") { activity_id = 1; activity_name = "Create" }
          if contains(op_l, "get") || contains(op_l, "view") || contains(op_l, "read") || contains(op_l, "accessed") || contains(op_l, "search") { activity_id = 2; activity_name = "Read" }
          if contains(op_l, "set") || contains(op_l, "update") || contains(op_l, "modify") || contains(op_l, "change") { activity_id = 3; activity_name = "Update" }
          if contains(op_l, "remove") || contains(op_l, "delete") { activity_id = 4; activity_name = "Delete" }

          ocsf.class_uid = 6003
          ocsf.class_name = "API Activity"
          ocsf.category_uid = 6
          ocsf.category_name = "Application Activity"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          op = operation
          if op == "" { op = "unknown" }
          svc_name = workload
          if svc_name == "" { svc_name = "Microsoft 365" }
          ocsf.api = { "operation": op, "service": { "name": svc_name } }
          ocsf.actor = { "user": actor_user }
          resources = []
          obj_id = string(p.ObjectId) ?? ""
          if obj_id != "" { resources = push(resources, { "name": obj_id, "uid": obj_id, "type": workload }) }
          if have_subject { resources = push(resources, { "name": target_id, "type": "Target" }) }
          if length(resources) > 0 { ocsf.resources = resources }
      }

      # ---- source endpoint ----
      src_ep = {}
      if src_ip != "" { src_ep = set!(src_ep, ["ip"], downcase(src_ip)) }
      if src_port > 0 { src_ep = set!(src_ep, ["port"], src_port) }
      if length(src_ep) == 0 { src_ep = { "hostname": "unknown" } }
      ocsf.src_endpoint = src_ep

      user_agent = string(p.UserAgent) ?? ""
      if user_agent != "" && to_int(ocsf.class_uid) != 4009 { ocsf.http_request = { "user_agent": user_agent } }

      # ---- cloud (profile-bound) ----
      ocsf.cloud = {
          "provider": "Microsoft",
          "account": { "uid": string(p.OrganizationId) ?? "", "name": workload }
      }

      # ---- common envelope ----
      # OCSF base status_detail preserves the vendor's logon failure reason.
      if is_string(p.LogonError) && p.LogonError != "" { ocsf.status_detail = p.LogonError }
      ocsf.status_id = status_id
      ocsf.status = status_str
      ocsf.severity_id = severity_id
      ocsf.severity = severity
      ocsf.type_uid = to_int(ocsf.class_uid) * 100 + to_int(ocsf.activity_id)
      ocsf.time = time_ms
      msg = operation
      if msg == "" { msg = workload }
      if msg == "" { msg = "microsoft_365_event" }
      ocsf.message = msg
      ocsf.raw_data = raw_log

      evt_uid = string(p.Id) ?? ""
      if evt_uid == "" { evt_uid = sha2("microsoft_365|raw|" + raw_log, variant: "SHA-256") }
      ocsf.metadata = {
          "version": "1.9.0",
          "profiles": profiles,
          "uid": evt_uid,
          "original_event_uid": evt_uid,
          "event_code": operation,
          "log_name": "Microsoft 365 Management Activity",
          "log_provider": "Microsoft 365",
          "tenant_uid": string(p.OrganizationId) ?? "",
          "product": { "name": "Microsoft 365", "vendor_name": "Microsoft" }
      }

      # ---- Microsoft-specific signals with no OCSF home ----
      user_type_raw = to_string(p.UserType) ?? ""
      user_type = user_type_raw
      if user_type_raw == "0" { user_type = "Regular" }
      if user_type_raw == "2" { user_type = "Admin" }
      if user_type_raw == "3" { user_type = "DcAdmin" }
      if user_type_raw == "4" { user_type = "System" }
      if user_type_raw == "5" { user_type = "Application" }
      if user_type_raw == "6" { user_type = "ServicePrincipal" }

      cand = {
          "workload": workload,
          "record_type": to_string(p.RecordType) ?? "",
          "result_status": string(p.ResultStatus) ?? "",
          "user_type": user_type,
          "client_info": string(p.ClientInfoString) ?? "",
          "client_app_id": string(p.ClientAppId) ?? "",
          "mailbox_owner_upn": string(p.MailboxOwnerUPN) ?? "",
          "mailbox_guid": string(p.MailboxGuid) ?? "",
          "client_process_name": string(p.ClientProcessName) ?? "",
          "external_access": to_string(p.ExternalAccess) ?? "",
          "site_url": string(p.SiteUrl) ?? "",
          "source_relative_url": string(p.SourceRelativeUrl) ?? "",
          "item_type": string(p.ItemType) ?? "",
          "event_source": string(p.EventSource) ?? "",
          "chat_name": string(p.ChatName) ?? "",
          "channel_name": string(p.ChannelName) ?? "",
          "team_name": string(p.TeamName) ?? "",
          "communication_type": string(p.CommunicationType) ?? "",
          "incident_id": string(p.IncidentId) ?? "",
          "message_direction": string(p.Direction) ?? string(p.Directionality) ?? "",
          "mail_action": string(p.Action) ?? "",
          "connector_id": string(p.ConnectorId) ?? "",
          "message_type": string(p.MessageType) ?? "",
          "aad_event_type": to_string(p.AzureActiveDirectoryEventType) ?? "",
          "object_id": string(p.ObjectId) ?? "",
          "target_id": target_id
      }
      unmapped = {}
      for_each(cand) -> |k, v| {
          if v != "" { unmapped = set!(unmapped, [k], v) }
      }
      scl = to_int(p.SCL) ?? -100
      if scl != -100 { unmapped = set!(unmapped, ["scl"], scl) }
      if exists(p.ModifiedProperties) { unmapped = set!(unmapped, ["modified_properties"], encode_json(p.ModifiedProperties)) }
      if exists(p.ExtendedProperties) { unmapped = set!(unmapped, ["extended_properties"], encode_json(p.ExtendedProperties)) }
      if exists(p.PolicyDetails) { unmapped = set!(unmapped, ["policy_details"], encode_json(p.PolicyDetails)) }
      if exists(p.SensitiveInfoDetections) { unmapped = set!(unmapped, ["sensitive_info"], encode_json(p.SensitiveInfoDetections)) }
      if exists(p.ExchangeMetaData) { unmapped = set!(unmapped, ["exchange_metadata"], encode_json(p.ExchangeMetaData)) }
      if exists(p.Folders) { unmapped = set!(unmapped, ["folders"], encode_json(p.Folders)) }
      if length(unmapped) > 0 { ocsf.unmapped = unmapped }

      . = ocsf
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # Exact value representation is evaluated AFTER branch selection. Numeric strings
  # count as represented by their typed scalar; other transformations are explicit.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The value sets below are strings
  # instead (a read shares the buffer): "," + encode_json(member) per member, and
  # contains(set, "," + encode_json(x)) is exact membership. Every member is a
  # JSON text, inside which a '"' is always escaped, so ',"' only ever starts a
  # member, and a JSON string ends at its first unescaped '"'. The fixed candidate
  # set is a regex literal, compiled once with the program.
  # __mapped holds only JSON types, so to_string equals encode_json for an integer
  # or a boolean and only strings and floats add a second member.
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped_json = encode_json(__mapped)
  __mapped = object!(parse_json!(__mapped_json))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __safe = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __safe_json = encode_json(__safe)
  # Object and array members are encodings: an empty object, an object that
  # opens with a quoted key, or an array. A lookup can ask for one only when some
  # source or existing value is an array, or a string spelling one of those
  # openings, and the regex below finds either in the JSON text (brackets are
  # written as hex escapes because nano's deploy check counts them raw).
  # Otherwise the scalar nodes suffice; a Sysmon GUID, a brace-wrapped string
  # with no quoted key, is no object member. The leaves of flatten(), with arrays
  # flattened too, are every scalar node unless a key holds a literal '.' (in
  # compact JSON only a key is followed by ':').
  # Their encodings, unwrapped from the array, already are the string members.
  __represented = ""
  __nodes = __mapped
  if !match(__safe_json, r'"(?:\x7B\\"|\x7B\x7D"|\x5B)|[:,\x5B]\x5B') && !match(__mapped_json, r'\.(?:[^"\\]|\\.)*":') {
      __leaves = flatten(values(flatten(__mapped)))
      __leaves_json = encode_json(__leaves)
      if match(__leaves_json, r'\x7B') {
          # An object inside an array: walk the leaves, objects whole.
          __nodes = __leaves
      } else {
          __nodes = []
          __members = map_values(__leaves) -> |value| {
              if is_float(value) {
                  encode_json(encode_json(value)) + "," + encode_json(to_string!(value))
              } else {
                  encode_json(encode_json(value))
              }
          }
          __represented = "," + join!(__members, ",") + "," + slice!(__leaves_json, 1, -1)
      }
  }
  __walk = map_values(__nodes, recursive: true) -> |value| {
      __json = encode_json(value)
      if is_string(value) {
          # A string's second member is the string itself, encoded: __json.
          __represented = __represented + ("," + encode_json(__json) + "," + __json)
      } else if is_float(value) {
          __represented = __represented + ("," + encode_json(__json) + "," + encode_json(to_string!(value)))
      } else {
          __represented = __represented + ("," + encode_json(__json))
      }
      value
  }
  __consumed = ""
  # BEGIN parser-specific transformations
  # ResultStatus: Parser lowercases this source value; consume only when the normalized value is emitted.
  # Direction: Parser lowercases this source value; consume only when the normalized value is emitted.
  # Action: Parser lowercases this source value; consume only when the normalized value is emitted.
  # ItemType: Parser lowercases this source value; consume only when the normalized value is emitted.
  # CreationTime: Successful ISO timestamp conversion to the selected event clock in milliseconds.
  # ResultStatus: M365 operation result maps to OCSF status.
  # CreationTime: M365 also accepts zone-less ISO clocks using the parser runtime timezone; compare the emitted milliseconds.
  for_each(flatten(__source_kv)) -> |key, value| {
      if match(key, r'(?x)
      \A(?:
        ResultStatus
      | Direction
      | Action
      | ItemType
      )\z') {
          __value = value
          if is_string(__value) {
              __expected = downcase(string!(__value))
              if contains(__represented, "," + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        CreationTime
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%+")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              if ."time" == __expected { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        ResultStatus
      )\z') {
          __value = value
          if __value != null {
              __expected = get!({"succeeded": 1, "success": 1, "true": 1, "failed": 2, "failure": 2, "false": 2}, [downcase(to_string(__value) ?? "")])
              if __expected != null {
                  if ."status_id" == __expected { __consumed = __consumed + ("," + encode_json(key)) }
              }
          }
      }
      if match(key, r'(?x)
      \A(?:
        CreationTime
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%Y-%m-%dT%H:%M:%S")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              if ."time" == __expected { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
  }
  # Only source keys read by this parser are eligible for exact-value consumption; the selected branch must emit the value. Unknown keys always spill, even when their value equals an OCSF default.
  __candidates = r'(?x)
  \A(?:
    Action
  | ActorIpAddress
  | AzureActiveDirectoryEventType
  | ChannelName
  | ChatName
  | ClientAppId
  | ClientIP
  | ClientIPAddress
  | ClientInfoString
  | ClientProcessName
  | CommunicationType
  | ConnectorId
  | CreationTime
  | Direction
  | Directionality
  | EventSource
  | ExchangeMetaData
  | ExtendedProperties
  | ExternalAccess
  | Folders
  | FromIP
  | Id
  | IncidentId
  | ItemType
  | LogonError
  | MailboxGuid
  | MailboxOwnerUPN
  | MessageId
  | MessageTraceId
  | MessageType
  | ModifiedProperties
  | ObjectId
  | Operation
  | OrganizationId
  | PolicyDetails
  | RecipientAddress
  | RecordType
  | ResultStatus
  | SCL
  | SenderAddress
  | SensitiveInfoDetections
  | SessionId
  | SiteUrl
  | Size
  | SourceFileExtension
  | SourceFileName
  | SourceRelativeUrl
  | Subject
  | Target
  | TeamName
  | ToIP
  | UserAgent
  | UserId
  | UserKey
  | UserType
  | Workload
  )\z'
  __preserve = []
  # END parser-specific transformations
  # Redact at every depth, including objects inside arrays, before serialization.
  # Redaction needs a sensitive word in a key or a name/key value, and encode_json
  # never escapes a letter, so text without one of the words needs no walk.
  if match(downcase(__safe_json), r'password|secret|authorization|token') {
      __safe = map_values(__safe, recursive: true) -> |value| {
          if is_object(value) {
              # Header/parameter arrays commonly encode sensitive keys as name/value
              # or Key/Value objects instead of using the secret name as an object key.
              __sensitive_pair = false
              for_each(object!(value)) -> |key, child| {
                  if includes(["name", "key"], downcase(key)) && match(downcase(string(child) ?? ""), r'password|secret|authorization|token') {
                      __sensitive_pair = true
                  }
              }
              for_each(object!(value)) -> |key, _child| {
                  if match(downcase(key), r'password|secret|authorization|token') || (__sensitive_pair && includes(["value", "values"], downcase(key))) {
                      value = set!(value, [key], "<redacted>")
                  }
              }
          }
          value
      }
  }
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__safe.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # Fast path: when no two source keys decode to the same key and no two spilled
  # keys get the same name, each key's decision depends only on its own value, so
  # one filter and one rename build the residual without copying it per key.
  __distinct = true
  if __tilde {
      __distinct = length(map_keys(__flat) -> |key| { replace(replace(key, "~1", "."), "~0", "~") }) == length(__flat)
  }
  __kept = {}
  __names = {}
  if __distinct {
      __kept = filter(__flat) -> |key, value| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          # A key is kept unless it is consumed: by a transformation above, or as a
          # candidate whose value is represented. Redacted leaves always remain
          # visible. Do not spill a copy of the raw body.
          if value == __raw_body {
              false
          } else if value == "<redacted>" {
              true
          } else if contains(__consumed, "," + encode_json(key)) {
              false
          } else if !match(key, __candidates) {
              true
          } else {
              # flatten stops at arrays, so objects inside an array still carry the
              # escaped keys: decode them too, or `a.b` spills as `a~1b` (NAN-3604).
              if __tilde && (is_array(value) || is_object(value)) {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __same = contains(__represented, "," + encode_json(encode_json(value)))
              if !__same && (is_string(value) || is_float(value)) {
                  __same = contains(__represented, "," + encode_json(to_string!(value)))
              }
              # A scalar array is consumed only if every element is represented. Preserve
              # partially represented arrays intact, including their ordering and repeats.
              if !__same && is_array(value) && !is_empty(array!(value)) {
                  __same = true
                  for_each(array!(value)) -> |_index, item| {
                      if __same {
                          if is_object(item) || is_array(item) {
                              __same = false
                          } else if !contains(__represented, "," + encode_json(encode_json(item))) {
                              __same = (is_string(item) || is_float(item)) && contains(__represented, "," + encode_json(to_string!(item)))
                          }
                      }
                  }
              }
              !__same
          }
      }
      __names = map_keys(__kept) -> |key| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          join!(__parts, ".")
      }
  }
  __residual = {}
  if __distinct && length(__names) == length(__kept) {
      __residual = map_values(__names) -> |value| {
          if is_array(value) || is_object(value) {
              if __tilde {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              if __complex { value = encode_json(value) }
          }
          value
      }
  } else {
      # Slow path, in source key order: a decoded key consumed earlier stays
      # consumed, and a name already taken gets the next free _2, _3, ... suffix.
      for_each(__flat) -> |key, value| {
          key = replace(replace(key, "~1", "."), "~0", "~")
          if is_array(value) || is_object(value) {
              value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                  replace(replace(inner, "~1", "."), "~0", "~")
              }, ["v"])
          }
          __same = contains(__represented, "," + encode_json(encode_json(value)))
          if !__same && (is_string(value) || is_float(value)) {
              __same = contains(__represented, "," + encode_json(to_string!(value)))
          }
          if !__same && is_array(value) && !is_empty(array!(value)) {
              __same = true
              for_each(array!(value)) -> |_index, item| {
                  if __same {
                      if is_object(item) || is_array(item) {
                          __same = false
                      } else if !contains(__represented, "," + encode_json(encode_json(item))) {
                          __same = (is_string(item) || is_float(item)) && contains(__represented, "," + encode_json(to_string!(item)))
                      }
                  }
              }
          }
          __token = "," + encode_json(key)
          if __same && match(key, __candidates) { __consumed = __consumed + ("," + encode_json(key)) }
          if (!contains(__consumed, __token) || value == "<redacted>") && value != __raw_body {
              __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
              __base = join!(__parts, ".")
              __key = __base
              __suffix = 2
              if includes(keys(__residual), __key) {
                  for_each(__flat) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __key) {
                          __key = __base + "_" + to_string(__suffix)
                          __suffix = __suffix + 1
                      }
                  }
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              __spill = if __complex { encode_json(value) } else { value }
              __residual = set!(__residual, [__key], __spill)
          }
      }
  }
  # Keep existing derived evidence, but remove null placeholders and mapped copies.
  # Source-derived aliases are replaced by canonical dotted source paths above.
  # Existing aggregates may contain sensitive descendants; the canonical source
  # spill above is the authoritative representation of containers. The cheap
  # conditions run first; the source value set is built on first use.
  __original_values = null
  for_each(flatten(__existing)) -> |key, value| {
      if !is_null(value) && value != "" && !is_array(value) && !is_object(value) && value != __raw_body && !match(downcase(key), r'password|secret|authorization|token') {
          # Members for the value itself and for to_string(value), as above.
          __json = encode_json(value)
          __as_json = "," + encode_json(__json)
          __as_string = __as_json
          if is_string(value) { __as_string = "," + __json } else if is_float(value) { __as_string = "," + encode_json(to_string!(value)) }
          if __original_values == null {
              # __source_kv may hold non-JSON types (a timestamp), so only an
              # integer or a boolean skips its to_string member here.
              __original_values = join!(map_values(values(flatten(__source_kv))) -> |source_value| {
                  __source_json = encode_json(source_value)
                  __tokens = "," + encode_json(__source_json)
                  if is_string(source_value) {
                      __tokens = __tokens + "," + __source_json
                  } else if !is_object(source_value) && !is_array(source_value) && !is_integer(source_value) && !is_boolean(source_value) {
                      __tokens = __tokens + "," + encode_json(to_string(source_value) ?? "")
                  }
                  __tokens
              }, "")
          }
          __source_set = string!(__original_values)
          __keep = !contains(__source_set, __as_json) && !contains(__source_set, __as_string)
          __keep = __keep && !contains(__represented, __as_json) && !contains(__represented, __as_string)
          # Only text opening an object or an array (after JSON whitespace)
          # decodes to a container.
          if __keep && is_string(value) && match(string!(value), r'^[ \t\n\r]*[\x5B\x7B]') {
              __decoded, __decode_err = parse_json(string!(value))
              __keep = !(__decode_err == null && (is_object(__decoded) || is_array(__decoded)))
          }
          if __keep {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, with recursive
  # redaction. These entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__safe.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

