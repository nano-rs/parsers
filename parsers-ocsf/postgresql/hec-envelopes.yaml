# What this parser gets when its log arrives as an HEC (or OTel-style) object
# event; scripts/test_hec_envelopes.py builds the delivery the way nano does and
# checks each case.
cases:
- name: a PostgreSQL 15+ jsonlog record as an HEC object (its own message)
  event:
    timestamp: 2026-11-20 10:24:02.511 UTC
    user: alice
    dbname: app
    pid: 24130
    remote_host: 192.0.2.10
    session_id: 673db8a2.5e42
    error_severity: FATAL
    state_code: 28P01
    message: password authentication failed for user "alice"
    backend_type: client backend
  expect:
    class_uid: 3002
    severity_id: 5
- name: a stderr line wrapped by an HEC sender
  event:
    message: '2026-11-20 10:24:02.511 UTC [24130] FATAL:  password authentication failed for user "bob"'
    host: db-1
  expect:
    class_uid: 3002
