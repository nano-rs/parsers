source: mixed
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  error_severity:
  - metadata.log_level
  message:
  - message
  pid:
  - actor.process.pid
  timestamp:
  - metadata.original_time
  dbname:
  - database.name
  user:
  - actor.user.name
  - user.name
  detail:
  - status_detail
  statement:
  - query_info.query_string
  connection_from:
  - src_endpoint.ip
  query_id:
  - query_info.uid
  session_id:
  - actor.session.uid
  - metadata.correlation_uid
  - session.uid
  state_code:
  - status_code
  application_name:
  - src_endpoint.svc_name
  remote_host:
  - src_endpoint.ip
  remote_port:
  - src_endpoint.port
  syslog_host:
  - device.hostname
