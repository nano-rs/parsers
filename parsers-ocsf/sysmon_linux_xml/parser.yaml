name: sysmon_linux_xml_ocsf
display_name: Microsoft Sysmon for Linux (XML, OCSF)
version: "1.1.0"
description: >
  Preserves unconsumed parsed fields in redacted, dotted snake_case unmapped keys.
  Parses raw Sysmon for Linux **XML** records into complete OCSF 1.9.0 events.
  Linux Sysmon emits a subset of the Windows EventIDs:
    1  Process Create      -> Process Activity 1007 (Launch)
    2  File Creation Time  -> File System Activity 1001 (Set Attributes)
    3  Network Connect     -> Network Activity 4001 (Open)
    4  Sysmon State Change -> Application Lifecycle 6002 (Start/Stop)
    5  Process Terminate   -> Process Activity 1007 (Terminate)
    11 File Create         -> File System Activity 1001 (Create)
    16 Config Change       -> Application Lifecycle 6002 (Update)
    23/26 File Delete      -> File System Activity 1001 (Delete)
  Anything else falls through to Process Activity 1007 (Other). Linux Sysmon
  writes "-" for values it could not determine (unbacked parents, absent hashes,
  "no level" integrity); those are normalised away rather than stored literally.
  Emits the whole OCSF object on the root so it lands in ocsf_logs.event and the
  promoted columns materialize. Carries metadata.profiles ["host"]. The OCSF
  counterpart of parsers/sysmon_linux_xml - deploy one or the other, never both.
ocsf_version: "1.9.0"
match_values:
  - linux_sysmon
category: endpoint
vendor: "Microsoft"
product: "Sysmon for Linux"
parser_vrl: |
  # Sysmon for Linux **XML** -> OCSF 1.9.0. Emits the COMPLETE record on root.
  # Linux Sysmon renders the same <Event><System>/<EventData> shape as Windows but
  # emits only a subset of EventIDs (1,2,3,4,5,11,16,23,26) and writes "-" for
  # every value it could not determine.
  raw_log = string!(.message)
  __raw_body = raw_log
  __source_kv = {}
  parsed, err = parse_xml(raw_log)

  if err != null || !is_object(parsed) {
      . = {
          "class_uid": 1007,
          "class_name": "Process Activity",
          "category_uid": 1,
          "category_name": "System Activity",
          "activity_id": 99,
          "activity_name": "Other",
          "type_uid": 100799,
          "severity_id": 1,
          "severity": "Informational",
          "time": 0,
          "raw_data": raw_log,
          # 1007 requires actor/device/process even on the unparseable path.
          "process": { "pid": 0 },
          "actor": { "process": { "pid": 0 } },
          "device": { "hostname": "", "type_id": 0 },
          "metadata": {
              "version": "1.9.0",
              "profiles": ["host"],
              "uid": uuid_v4(),
              "log_level": "error",
              "log_source": "linux_sysmon",
              "product": { "name": "Sysmon for Linux", "vendor_name": "Microsoft" }
          }
      }
  } else {
      ev = object(parsed.Event) ?? {}
      system = object(ev.System) ?? {}

      eid = to_int(system.EventID) ?? 0
      if eid == 0 { eid = to_int(system.EventID.text) ?? 0 }

      computer = downcase(to_string(system.Computer) ?? "")
      channel = to_string(system.Channel) ?? ""
      if channel == "" { channel = "Linux-Sysmon/Operational" }
      log_provider = to_string(system.Provider."@Name") ?? ""
      if log_provider == "" { log_provider = "Linux-Sysmon" }
      record_id = to_string(system.EventRecordID) ?? ""

      # ---- event time: System/TimeCreated/@SystemTime -> epoch ms -------
      time_ms = 0
      ts_str = to_string(system.TimeCreated."@SystemTime") ?? ""
      if ts_str != "" {
          t, terr = parse_timestamp(ts_str, "%+")
          if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
      }

      # ---- Level -> OCSF severity --------------------------------------
      level_int = to_int(system.Level) ?? 4
      severity_id = 1
      severity = "Informational"
      if level_int == 1 {
          severity_id = 5; severity = "Critical"
      } else if level_int == 2 {
          severity_id = 4; severity = "High"
      } else if level_int == 3 {
          severity_id = 3; severity = "Medium"
      }

      # ---- EventData/Data[@Name] -> flat key/value map ------------------
      data_items = ev.EventData.Data
      items = []
      if is_array(data_items) {
          items = array(data_items) ?? []
      } else if is_object(data_items) {
          items = [data_items]
      }
      kv = {}
      for_each(items) -> |_i, item| {
          iname = to_string(item."@Name") ?? ""
          ivalue = to_string(item.text) ?? ""
          if iname != "" { kv = set!(kv, [iname], ivalue) }
      }

      # NOTE on get(): the compiler statically types `kv` as the empty object
      # literal, so `kv.X` would be `null` and every to_int on it would look
      # infallible — stripping the runtime guard and letting a bad ProcessId
      # ABORT the program. get() returns `any`, so the coalescing stays real.

      __source_kv = { "system": system, "event_data": kv }

      # ---- shared extraction. Linux Sysmon writes "-" for "unknown". ----
      actor_user = downcase(to_string(get(kv, ["User"]) ?? null) ?? "")
      if actor_user == "-" { actor_user = "" }

      img = to_string(get(kv, ["Image"]) ?? null) ?? ""
      if img == "-" { img = "" }
      proc_name = ""
      anm, anmerr = parse_regex(img, r'(?P<b>[^\\/]+)$')
      if anmerr == null { proc_name = string(anm.b) ?? "" }

      pimg = to_string(get(kv, ["ParentImage"]) ?? null) ?? ""
      if pimg == "-" { pimg = "" }
      parent_name = ""
      pnm, pnmerr = parse_regex(pimg, r'(?P<b>[^\\/]+)$')
      if pnmerr == null { parent_name = string(pnm.b) ?? "" }

      parent_cmd = to_string(get(kv, ["ParentCommandLine"]) ?? null) ?? ""
      if parent_cmd == "-" { parent_cmd = "" }
      parent_guid = to_string(get(kv, ["ParentProcessGuid"]) ?? null) ?? ""
      if parent_guid == "{00000000-0000-0000-0000-000000000000}" { parent_guid = "" }

      # SHA-256 out of the "SHA256=..,MD5=.." Hashes string
      sha = ""
      hs = to_string(get(kv, ["Hashes"]) ?? null) ?? ""
      if hs != "-" && hs != "" {
          hm, hmerr = parse_regex(hs, r'SHA256=(?P<h>[0-9A-Fa-f]+)')
          if hmerr == null { sha = downcase(string(hm.h) ?? "") }
      }

      subject_file = { "name": proc_name, "path": img, "type_id": 1 }
      if sha != "" { subject_file.hashes = [{ "algorithm_id": 3, "value": sha }] }
      subject_process = {
          "name": proc_name,
          "cmd_line": to_string(get(kv, ["CommandLine"]) ?? null) ?? "",
          "pid": to_int(get(kv, ["ProcessId"]) ?? null) ?? 0,
          "uid": to_string(get(kv, ["ProcessGuid"]) ?? null) ?? "",
          "file": subject_file
      }

      parent_process = {
          "name": parent_name,
          "cmd_line": parent_cmd,
          "pid": to_int(get(kv, ["ParentProcessId"]) ?? null) ?? 0,
          "uid": parent_guid,
          "file": { "name": parent_name, "path": pimg, "type_id": 1 }
      }
      # A process that predates the sensor has no tracked parent at all.
      has_parent = pimg != "" || parent_cmd != ""

      actor_process = subject_process
      if has_parent { actor_process.parent_process = parent_process }

      device = { "hostname": computer, "type_id": 0 }

      tf = to_string(get(kv, ["TargetFilename"]) ?? null) ?? ""
      if tf == "-" { tf = "" }
      file_name = ""
      fnm, fnmerr = parse_regex(tf, r'(?P<b>[^\\/]+)$')
      if fnmerr == null { file_name = string(fnm.b) ?? "" }
      target_file = { "name": file_name, "path": tf, "type_id": 1 }
      if sha != "" { target_file.hashes = [{ "algorithm_id": 3, "value": sha }] }

      # RuleName carries the config's MITRE annotation. Linux Sysmon emits the
      # PascalCase TechniqueID= form, Windows the snake_case technique_id=.
      rule_name = to_string(get(kv, ["RuleName"]) ?? null) ?? ""
      if rule_name == "-" { rule_name = "" }
      technique_id = ""
      if rule_name != "" {
          tm, tmerr = parse_regex(rule_name, r'(?i)technique[_]?id=(?P<tid>[^,\s]+)')
          if tmerr == null { technique_id = upcase(string(tm.tid) ?? "") }
      }

      # ---- defaults; overridden per branch below ------------------------
      class_uid = 1007
      class_name = "Process Activity"
      category_uid = 1
      category_name = "System Activity"
      activity_id = 99
      activity_name = "Other"
      profiles = ["host"]

      ocsf = {}

      if eid == 1 || eid == 5 {
          # Process Create / Terminate -> Process Activity 1007
          if eid == 1 {
              activity_id = 1; activity_name = "Launch"
          } else {
              activity_id = 2; activity_name = "Terminate"
          }
          # The NEW process is `process`; its launcher is `actor.process`.
          ocsf.process = subject_process
          if eid == 1 && has_parent {
              ocsf.actor = { "process": parent_process, "user": { "name": actor_user } }
          } else {
              ocsf.actor = { "process": subject_process, "user": { "name": actor_user } }
          }
          ocsf.device = device
          integrity = to_string(get(kv, ["IntegrityLevel"]) ?? null) ?? ""
          if integrity == "no level" { integrity = "" }
          ocsf.unmapped = {
              "current_directory": to_string(get(kv, ["CurrentDirectory"]) ?? null) ?? "",
              "integrity_level": integrity,
              "logon_id": to_string(get(kv, ["LogonId"]) ?? null) ?? "",
              "terminal_session_id": to_string(get(kv, ["TerminalSessionId"]) ?? null) ?? "",
              "parent_user": to_string(get(kv, ["ParentUser"]) ?? null) ?? "",
              "hashes_raw": hs
          }
      } else if eid == 3 {
          # Network Connection -> Network Activity 4001 (Open)
          class_uid = 4001; class_name = "Network Activity"
          category_uid = 4; category_name = "Network Activity"
          activity_id = 1; activity_name = "Open"
          src_host = downcase(to_string(get(kv, ["SourceHostname"]) ?? null) ?? "")
          if src_host == "-" { src_host = "" }
          dst_host = downcase(to_string(get(kv, ["DestinationHostname"]) ?? null) ?? "")
          if dst_host == "-" { dst_host = "" }
          ocsf.src_endpoint = {
              "ip": downcase(to_string(get(kv, ["SourceIp"]) ?? null) ?? ""),
              "port": to_int(get(kv, ["SourcePort"]) ?? null) ?? 0,
              "hostname": src_host
          }
          ocsf.dst_endpoint = {
              "ip": downcase(to_string(get(kv, ["DestinationIp"]) ?? null) ?? ""),
              "port": to_int(get(kv, ["DestinationPort"]) ?? null) ?? 0,
              "hostname": dst_host
          }
          # Initiated=true means this host opened the connection -> Outbound.
          initiated = downcase(to_string(get(kv, ["Initiated"]) ?? null) ?? "")
          direction_id = 0
          if initiated == "true" { direction_id = 2 }
          if initiated == "false" { direction_id = 1 }
          conn = { "direction_id": direction_id }
          proto = downcase(to_string(get(kv, ["Protocol"]) ?? null) ?? "")
          # protocol_num is an IANA number; only emit it when known.
          if proto == "tcp" { conn.protocol_num = 6 }
          if proto == "udp" { conn.protocol_num = 17 }
          ocsf.connection_info = conn
          ocsf.actor = { "process": actor_process, "user": { "name": actor_user } }
          ocsf.device = device
          ocsf.unmapped = {
              "source_is_ipv6": to_string(get(kv, ["SourceIsIpv6"]) ?? null) ?? "",
              "destination_is_ipv6": to_string(get(kv, ["DestinationIsIpv6"]) ?? null) ?? "",
              "source_port_name": to_string(get(kv, ["SourcePortName"]) ?? null) ?? "",
              "destination_port_name": to_string(get(kv, ["DestinationPortName"]) ?? null) ?? ""
          }
      } else if eid == 4 || eid == 16 {
          # Sysmon service state / config change -> Application Lifecycle 6002.
          # This is the sensor itself starting, stopping or reconfiguring.
          class_uid = 6002; class_name = "Application Lifecycle"
          category_uid = 6; category_name = "Application Activity"
          state = downcase(to_string(get(kv, ["State"]) ?? null) ?? "")
          if eid == 16 {
              activity_id = 8; activity_name = "Update"
          } else if state == "started" {
              activity_id = 3; activity_name = "Start"
          } else if state == "stopped" {
              activity_id = 4; activity_name = "Stop"
          } else {
              activity_id = 99; activity_name = "Other"
          }
          # 6002 constrains on one of [app, application]; the application whose
          # lifecycle this is, is the Sysmon sensor itself.
          app = { "name": "Sysmon for Linux", "vendor_name": "Microsoft" }
          app_version = to_string(get(kv, ["Version"]) ?? null) ?? ""
          if app_version != "" { app.version = app_version }
          ocsf.app = app
          ocsf.device = device
          ocsf.unmapped = {
              "sysmon_state": to_string(get(kv, ["State"]) ?? null) ?? "",
              "sysmon_schema_version": to_string(get(kv, ["SchemaVersion"]) ?? null) ?? "",
              "configuration": to_string(get(kv, ["Configuration"]) ?? null) ?? "",
              "configuration_file_hash": to_string(get(kv, ["ConfigurationFileHash"]) ?? null) ?? ""
          }
      } else if eid == 2 || eid == 11 || eid == 23 || eid == 26 {
          # File System Activity 1001 family.
          class_uid = 1001; class_name = "File System Activity"
          if eid == 11 {
              activity_id = 1; activity_name = "Create"
          } else if eid == 2 {
              activity_id = 6; activity_name = "Set Attributes"
          } else {
              activity_id = 4; activity_name = "Delete"
          }
          ocsf.file = target_file
          ocsf.actor = { "process": actor_process, "user": { "name": actor_user } }
          ocsf.device = device
          ocsf.unmapped = {
              "creation_utc_time": to_string(get(kv, ["CreationUtcTime"]) ?? null) ?? "",
              "previous_creation_utc_time": to_string(get(kv, ["PreviousCreationUtcTime"]) ?? null) ?? "",
              "hashes_raw": hs,
              "is_executable": to_string(get(kv, ["IsExecutable"]) ?? null) ?? ""
          }
      } else {
          # EventID Linux Sysmon does not (yet) emit -> Process Activity / Other.
          ocsf.process = subject_process
          ocsf.actor = { "process": actor_process, "user": { "name": actor_user } }
          ocsf.device = device
      }

      # ---- common envelope ----------------------------------------------
      ocsf.class_uid = class_uid
      ocsf.class_name = class_name
      ocsf.category_uid = category_uid
      ocsf.category_name = category_name
      ocsf.activity_id = activity_id
      ocsf.activity_name = activity_name
      ocsf.type_uid = class_uid * 100 + activity_id
      ocsf.severity_id = severity_id
      ocsf.severity = severity
      ocsf.time = time_ms
      ocsf.raw_data = raw_log
      # `attacks` is bound to the security_control profile in Nano's embedded
      # 1.9.0 contract (the public schema.ocsf.io lists it as unprofiled), so the
      # profile has to be declared alongside it or the event is rejected.
      if technique_id != "" {
          ocsf.attacks = [{ "technique": { "uid": technique_id } }]
          if !includes(profiles, "security_control") { profiles = push(profiles, "security_control") }
      }

      # EventRecordID is only unique within a host stream and can be reused after
      # a log reset; fold in host + event time so a replay stays idempotent while
      # a later reused RecordID cannot collide.
      record_uid = ""
      if record_id != "" && computer != "" && ts_str != "" {
          record_uid = join!(["sysmon_linux_xml", computer, downcase(channel), downcase(log_provider), record_id, ts_str], "|")
      }
      if record_uid == "" { record_uid = uuid_v4() }

      ocsf.metadata = {
          "version": "1.9.0",
          "profiles": profiles,
          "uid": record_uid,
          "original_event_uid": record_uid,
          "event_code": to_string(eid),
          "log_name": channel,
          "log_provider": log_provider,
          "log_source": "linux_sysmon",
          "product": { "name": "Sysmon for Linux", "vendor_name": "Microsoft" }
      }

      . = ocsf
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # Exact value representation is evaluated AFTER branch selection. Numeric strings
  # count as represented by their typed scalar; other transformations are explicit.
  __mapped = object!(parse_json!(encode_json(.)))
  __existing = object(__mapped.unmapped) ?? {}
  __discard = del(__mapped.raw_data)
  __discard = del(__mapped.unmapped)
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __represented = []
  __walk = map_values(__mapped, recursive: true) -> |value| {
      __represented = push(__represented, encode_json(value))
      if !is_object(value) && !is_array(value) && !is_null(value) {
          __represented = push(__represented, to_string(value) ?? "")
      }
      value
  }
  __consumed = []
  # BEGIN parser-specific transformations
  # system.TimeCreated.@SystemTime: XML system clock converted to event milliseconds.
  # event_data.Protocol: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when the expected ID is emitted.
  # Only source keys read by this parser are eligible for exact-value consumption; the selected branch must emit the value. Unknown keys always spill, even when their value equals an OCSF default.
  __candidates = ["event_data.CommandLine", "event_data.Configuration", "event_data.ConfigurationFileHash", "event_data.CreationUtcTime", "event_data.CurrentDirectory", "event_data.DestinationHostname", "event_data.DestinationIp", "event_data.DestinationIsIpv6", "event_data.DestinationPort", "event_data.DestinationPortName", "event_data.Hashes", "event_data.Image", "event_data.Initiated", "event_data.IntegrityLevel", "event_data.IsExecutable", "event_data.LogonId", "event_data.ParentCommandLine", "event_data.ParentImage", "event_data.ParentProcessGuid", "event_data.ParentProcessId", "event_data.ParentUser", "event_data.PreviousCreationUtcTime", "event_data.ProcessGuid", "event_data.ProcessId", "event_data.Protocol", "event_data.RuleName", "event_data.SchemaVersion", "event_data.SourceHostname", "event_data.SourceIp", "event_data.SourceIsIpv6", "event_data.SourcePort", "event_data.SourcePortName", "event_data.State", "event_data.TargetFilename", "event_data.TerminalSessionId", "event_data.User", "event_data.Version", "event_data.X", "system.Channel", "system.Computer", "system.EventID", "system.EventID.text", "system.EventRecordID", "system.Level", "system.Provider.@Name", "system.TimeCreated.@SystemTime"]
  __preserve = []
  __rules = array!(parse_json!("[{\"source\":\"system.TimeCreated.@SystemTime\",\"kind\":\"epoch_ms\",\"target\":\"time\",\"reason\":\"XML system clock converted to event milliseconds.\"},{\"source\":\"event_data.Protocol\",\"kind\":\"enum\",\"target\":\"connection_info.protocol_num\",\"values\":{\"tcp\":6,\"udp\":17,\"icmp\":1,\"icmpv6\":58,\"ipv6-icmp\":58},\"reason\":\"Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when the expected ID is emitted.\"}]"))
  __source_flat = flatten(__source_kv)
  for_each(__rules) -> |_index, rule| {
      __source_key = string!(rule.source)
      __value = get!(__source_flat, [__source_key])
      __expected = null
      __valid = false
      if rule.kind == "lowercase" && is_string(__value) {
          __expected = downcase(string!(__value))
          __valid = true
      } else if rule.kind == "epoch_ms" {
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", string(rule.format) ?? "%+")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              __valid = true
          }
      } else if rule.kind == "scale" {
          __number, __number_err = to_float(__value)
          if __number_err == null && __value != null && !is_boolean(__value) {
              __expected = to_int(__number * to_float!(rule.factor))
              __valid = true
          }
      } else if rule.kind == "hex" {
          __hex = replace(downcase(string(__value) ?? ""), r'^0x', "")
          __integer, __integer_err = parse_int(__hex, base: 16)
          __expected = __integer
          __valid = is_string(__value) && starts_with(downcase(string(__value) ?? ""), "0x") && __integer_err == null
      } else if rule.kind == "enum" {
          __expected = get!(object!(rule.values), [downcase(to_string(__value) ?? "")])
          __valid = __expected != null
      }
      __matches = includes(__represented, encode_json(__expected))
      if is_string(rule.target) { __matches = get!(., split(string!(rule.target), ".")) == __expected }
      if __valid && __matches { __consumed = push(__consumed, __source_key) }
  }
  # END parser-specific transformations
  # Redact at every depth, including objects inside arrays, before serialization.
  __safe = map_values(object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing}))), recursive: true) -> |value| {
      if is_object(value) {
          # Header/parameter arrays commonly encode sensitive keys as name/value
          # or Key/Value objects instead of using the secret name as an object key.
          __sensitive_pair = false
          for_each(object!(value)) -> |key, child| {
              if includes(["name", "key"], downcase(key)) && match(downcase(string(child) ?? ""), r'password|secret|authorization|token') {
                  __sensitive_pair = true
              }
          }
          for_each(object!(value)) -> |key, _child| {
              if match(downcase(key), r'password|secret|authorization|token') || (__sensitive_pair && includes(["value", "values"], downcase(key))) {
                  value = set!(value, [key], "<redacted>")
              }
          }
      }
      value
  }
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  __escaped = map_keys(object!(__safe.source), recursive: true) -> |key| {
      replace(replace(key, "~", "~0"), ".", "~1")
  }
  __flat = flatten(__escaped)
  __residual = {}
  for_each(__flat) -> |key, value| {
      key = replace(replace(key, "~1", "."), "~0", "~")
      __same = includes(__represented, encode_json(value))
      if !is_object(value) && !is_array(value) && !is_null(value) {
          __same = __same || includes(__represented, to_string(value) ?? "")
      }
      # A scalar array is consumed only if every element is represented. Preserve
      # partially represented arrays intact, including their ordering and repeats.
      if is_array(value) && !is_empty(array!(value)) {
          __all_items = true
          for_each(array!(value)) -> |_index, item| {
              __item_same = includes(__represented, encode_json(item))
              if !is_object(item) && !is_array(item) && !is_null(item) {
                  __item_same = __item_same || includes(__represented, to_string(item) ?? "")
              }
              if is_object(item) || is_array(item) || !__item_same { __all_items = false }
          }
          __same = __same || __all_items
      }
      if __same && includes(__candidates, key) { __consumed = push(__consumed, key) }
      # Redacted leaves always remain visible. Do not spill a copy of the raw body.
      if (!includes(__consumed, key) || value == "<redacted>") && value != __raw_body {
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          __base = join!(__parts, ".")
          __key = __base
          __suffix = 2
          if includes(keys(__residual), __key) {
              for_each(__flat) -> |_other_key, _other_value| {
                  if includes(keys(__residual), __key) {
                      __key = __base + "_" + to_string(__suffix)
                      __suffix = __suffix + 1
                  }
              }
          }
          __complex = is_object(value)
          if is_array(value) {
              for_each(array!(value)) -> |_index, item| {
                  if is_object(item) || is_array(item) { __complex = true }
              }
          }
          __spill = if __complex { encode_json(value) } else { value }
          __residual = set!(__residual, [__key], __spill)
      }
  }
  # Keep existing derived evidence, but remove null placeholders and mapped copies.
  # Source-derived aliases are replaced by canonical dotted source paths above.
  __original_values = []
  for_each(flatten(__source_kv)) -> |_key, value| {
      __original_values = push(__original_values, encode_json(value))
      if !is_object(value) && !is_array(value) { __original_values = push(__original_values, to_string(value) ?? "") }
  }
  for_each(flatten(__existing)) -> |key, value| {
      __source_alias = includes(__original_values, encode_json(value)) || includes(__original_values, to_string(value) ?? "")
      __mapped_alias = includes(__represented, encode_json(value)) || includes(__represented, to_string(value) ?? "")
      __decoded, __decode_err = parse_json(string(value) ?? "")
      __encoded_container = __decode_err == null && (is_object(__decoded) || is_array(__decoded))
      if !is_null(value) && value != "" && !__source_alias && !__mapped_alias && !__encoded_container && value != __raw_body {
          # Existing aggregates may contain sensitive descendants; the canonical
          # source spill above is the authoritative representation of containers.
          if !is_array(value) && !is_object(value) && !match(downcase(key), r'password|secret|authorization|token') {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, with recursive
  # redaction. These entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__safe.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

