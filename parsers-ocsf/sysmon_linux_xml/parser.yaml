name: sysmon_linux_xml_ocsf
display_name: Microsoft Sysmon for Linux (XML, OCSF)
version: "1.3.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses raw Sysmon for Linux **XML** records into complete OCSF 1.9.0 events.
  Linux Sysmon emits a subset of the Windows EventIDs:
    1  Process Create      -> Process Activity 1007 (Launch)
    2  File Creation Time  -> File System Activity 1001 (Set Attributes)
    3  Network Connect     -> Network Activity 4001 (Open)
    4  Sysmon State Change -> Application Lifecycle 6002 (Start/Stop)
    5  Process Terminate   -> Process Activity 1007 (Terminate)
    11 File Create         -> File System Activity 1001 (Create)
    16 Config Change       -> Application Lifecycle 6002 (Update)
    23/26 File Delete      -> File System Activity 1001 (Delete)
  Anything else falls through to Process Activity 1007 (Other). Linux Sysmon
  writes "-" for values it could not determine (unbacked parents, absent hashes,
  "no level" integrity); those are normalised away rather than stored literally.
  Emits the whole OCSF object on the root so it lands in ocsf_logs.event and the
  promoted columns materialize. Carries metadata.profiles ["host"]. The OCSF
  counterpart of parsers/sysmon_linux_xml - deploy one or the other, never both.
ocsf_version: "1.9.0"
match_values:
  - linux_sysmon
category: endpoint
vendor: "Microsoft"
product: "Sysmon for Linux"
parser_vrl: |
  # Sysmon for Linux **XML** -> OCSF 1.9.0. Emits the COMPLETE record on root.
  # Linux Sysmon renders the same <Event><System>/<EventData> shape as Windows but
  # emits only a subset of EventIDs (1,2,3,4,5,11,16,23,26) and writes "-" for
  # every value it could not determine.
  raw_log = string!(.message)
  __raw_body = raw_log
  __source_kv = {}
  parsed, err = parse_xml(raw_log)

  if err != null || !is_object(parsed) {
      . = {
          "class_uid": 1007,
          "class_name": "Process Activity",
          "category_uid": 1,
          "category_name": "System Activity",
          "activity_id": 99,
          "activity_name": "Other",
          "type_uid": 100799,
          "severity_id": 1,
          "severity": "Informational",
          "time": 0,
          "raw_data": raw_log,
          # 1007 requires actor/device/process even on the unparseable path.
          "process": { "pid": 0 },
          "actor": { "process": { "pid": 0 } },
          "device": { "hostname": "", "type_id": 0 },
          "metadata": {
              "version": "1.9.0",
              "profiles": ["host"],
              "uid": sha2("sysmon_linux_xml|raw|" + raw_log, variant: "SHA-256"),
              "log_level": "error",
              "log_source": "linux_sysmon",
              "product": { "name": "Sysmon for Linux", "vendor_name": "Microsoft" }
          }
      }
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      . = set!(., ["unmapped", "parse_fallback"], "unparsable input")
  } else {
      ev = object(parsed.Event) ?? {}
      system = object(ev.System) ?? {}

      eid = to_int(system.EventID) ?? 0
      if eid == 0 { eid = to_int(system.EventID.text) ?? 0 }

      computer = downcase(to_string(system.Computer) ?? "")
      channel = to_string(system.Channel) ?? ""
      if channel == "" { channel = "Linux-Sysmon/Operational" }
      log_provider = to_string(system.Provider."@Name") ?? ""
      if log_provider == "" { log_provider = "Linux-Sysmon" }
      record_id = to_string(system.EventRecordID) ?? ""

      # ---- event time: System/TimeCreated/@SystemTime -> epoch ms -------
      time_ms = 0
      ts_str = to_string(system.TimeCreated."@SystemTime") ?? ""
      if ts_str != "" {
          t, terr = parse_timestamp(ts_str, "%+")
          if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
      }

      # ---- Level -> OCSF severity --------------------------------------
      level_int = to_int(system.Level) ?? 4
      severity_id = 1
      severity = "Informational"
      if level_int == 1 {
          severity_id = 5; severity = "Critical"
      } else if level_int == 2 {
          severity_id = 4; severity = "High"
      } else if level_int == 3 {
          severity_id = 3; severity = "Medium"
      }

      # ---- EventData/Data[@Name] -> flat key/value map ------------------
      data_items = ev.EventData.Data
      items = []
      if is_array(data_items) {
          items = array(data_items) ?? []
      } else if is_object(data_items) {
          items = [data_items]
      }
      kv = {}
      for_each(items) -> |_i, item| {
          iname = to_string(item."@Name") ?? ""
          ivalue = to_string(item.text) ?? ""
          if iname != "" { kv = set!(kv, [iname], ivalue) }
      }

      # NOTE on get(): the compiler statically types `kv` as the empty object
      # literal, so `kv.X` would be `null` and every to_int on it would look
      # infallible — stripping the runtime guard and letting a bad ProcessId
      # ABORT the program. get() returns `any`, so the coalescing stays real.

      __source_kv = { "system": system, "event_data": kv }

      # ---- shared extraction. Linux Sysmon writes "-" for "unknown". ----
      actor_user = downcase(to_string(get(kv, ["User"]) ?? null) ?? "")
      if actor_user == "-" { actor_user = "" }

      img = to_string(get(kv, ["Image"]) ?? null) ?? ""
      if img == "-" { img = "" }
      proc_name = ""
      anm, anmerr = parse_regex(img, r'(?P<b>[^\\/]+)$')
      if anmerr == null { proc_name = string(anm.b) ?? "" }

      pimg = to_string(get(kv, ["ParentImage"]) ?? null) ?? ""
      if pimg == "-" { pimg = "" }
      parent_name = ""
      pnm, pnmerr = parse_regex(pimg, r'(?P<b>[^\\/]+)$')
      if pnmerr == null { parent_name = string(pnm.b) ?? "" }

      parent_cmd = to_string(get(kv, ["ParentCommandLine"]) ?? null) ?? ""
      if parent_cmd == "-" { parent_cmd = "" }
      parent_guid = to_string(get(kv, ["ParentProcessGuid"]) ?? null) ?? ""
      if parent_guid == "{00000000-0000-0000-0000-000000000000}" { parent_guid = "" }

      # SHA-256 out of the "SHA256=..,MD5=.." Hashes string
      sha = ""
      hs = to_string(get(kv, ["Hashes"]) ?? null) ?? ""
      if hs != "-" && hs != "" {
          hm, hmerr = parse_regex(hs, r'SHA256=(?P<h>[0-9A-Fa-f]+)')
          if hmerr == null { sha = downcase(string(hm.h) ?? "") }
      }

      subject_file = { "name": proc_name, "path": img, "type_id": 1 }
      if sha != "" { subject_file.hashes = [{ "algorithm_id": 3, "value": sha }] }
      subject_process = {
          "name": proc_name,
          "cmd_line": to_string(get(kv, ["CommandLine"]) ?? null) ?? "",
          "pid": to_int(get(kv, ["ProcessId"]) ?? null) ?? 0,
          "uid": to_string(get(kv, ["ProcessGuid"]) ?? null) ?? "",
          "file": subject_file
      }

      parent_process = {
          "name": parent_name,
          "cmd_line": parent_cmd,
          "pid": to_int(get(kv, ["ParentProcessId"]) ?? null) ?? 0,
          "uid": parent_guid,
          "file": { "name": parent_name, "path": pimg, "type_id": 1 }
      }
      # A process that predates the sensor has no tracked parent at all.
      has_parent = pimg != "" || parent_cmd != ""

      actor_process = subject_process
      if has_parent { actor_process.parent_process = parent_process }

      device = { "hostname": computer, "type_id": 0 }

      tf = to_string(get(kv, ["TargetFilename"]) ?? null) ?? ""
      if tf == "-" { tf = "" }
      file_name = ""
      fnm, fnmerr = parse_regex(tf, r'(?P<b>[^\\/]+)$')
      if fnmerr == null { file_name = string(fnm.b) ?? "" }
      target_file = { "name": file_name, "path": tf, "type_id": 1 }
      if sha != "" { target_file.hashes = [{ "algorithm_id": 3, "value": sha }] }

      # RuleName carries the config's MITRE annotation. Linux Sysmon emits the
      # PascalCase TechniqueID= form, Windows the snake_case technique_id=.
      rule_name = to_string(get(kv, ["RuleName"]) ?? null) ?? ""
      if rule_name == "-" { rule_name = "" }
      technique_id = ""
      if rule_name != "" {
          tm, tmerr = parse_regex(rule_name, r'(?i)technique[_]?id=(?P<tid>[^,\s]+)')
          if tmerr == null { technique_id = upcase(string(tm.tid) ?? "") }
      }

      # ---- defaults; overridden per branch below ------------------------
      class_uid = 1007
      class_name = "Process Activity"
      category_uid = 1
      category_name = "System Activity"
      activity_id = 99
      activity_name = "Other"
      profiles = ["host"]

      ocsf = {}

      if eid == 1 || eid == 5 {
          # Process Create / Terminate -> Process Activity 1007
          if eid == 1 {
              activity_id = 1; activity_name = "Launch"
          } else {
              activity_id = 2; activity_name = "Terminate"
          }
          # The NEW process is `process`; its launcher is `actor.process`.
          ocsf.process = subject_process
          if eid == 1 && has_parent {
              ocsf.actor = { "process": parent_process, "user": { "name": actor_user } }
          } else {
              ocsf.actor = { "process": subject_process, "user": { "name": actor_user } }
          }
          ocsf.device = device
          integrity = to_string(get(kv, ["IntegrityLevel"]) ?? null) ?? ""
          if integrity == "no level" { integrity = "" }
          ocsf.unmapped = {
              "current_directory": to_string(get(kv, ["CurrentDirectory"]) ?? null) ?? "",
              "integrity_level": integrity,
              "logon_id": to_string(get(kv, ["LogonId"]) ?? null) ?? "",
              "terminal_session_id": to_string(get(kv, ["TerminalSessionId"]) ?? null) ?? "",
              "parent_user": to_string(get(kv, ["ParentUser"]) ?? null) ?? "",
              "hashes_raw": hs
          }
      } else if eid == 3 {
          # Network Connection -> Network Activity 4001 (Open)
          class_uid = 4001; class_name = "Network Activity"
          category_uid = 4; category_name = "Network Activity"
          activity_id = 1; activity_name = "Open"
          src_host = downcase(to_string(get(kv, ["SourceHostname"]) ?? null) ?? "")
          if src_host == "-" { src_host = "" }
          dst_host = downcase(to_string(get(kv, ["DestinationHostname"]) ?? null) ?? "")
          if dst_host == "-" { dst_host = "" }
          ocsf.src_endpoint = {
              "ip": downcase(to_string(get(kv, ["SourceIp"]) ?? null) ?? ""),
              "port": to_int(get(kv, ["SourcePort"]) ?? null) ?? 0,
              "hostname": src_host
          }
          ocsf.dst_endpoint = {
              "ip": downcase(to_string(get(kv, ["DestinationIp"]) ?? null) ?? ""),
              "port": to_int(get(kv, ["DestinationPort"]) ?? null) ?? 0,
              "hostname": dst_host
          }
          # Initiated=true means this host opened the connection -> Outbound.
          initiated = downcase(to_string(get(kv, ["Initiated"]) ?? null) ?? "")
          direction_id = 0
          if initiated == "true" { direction_id = 2 }
          if initiated == "false" { direction_id = 1 }
          conn = { "direction_id": direction_id }
          proto = downcase(to_string(get(kv, ["Protocol"]) ?? null) ?? "")
          # protocol_num is an IANA number; only emit it when known.
          if proto == "tcp" { conn.protocol_num = 6 }
          if proto == "udp" { conn.protocol_num = 17 }
          ocsf.connection_info = conn
          ocsf.actor = { "process": actor_process, "user": { "name": actor_user } }
          ocsf.device = device
          ocsf.unmapped = {
              "source_is_ipv6": to_string(get(kv, ["SourceIsIpv6"]) ?? null) ?? "",
              "destination_is_ipv6": to_string(get(kv, ["DestinationIsIpv6"]) ?? null) ?? "",
              "source_port_name": to_string(get(kv, ["SourcePortName"]) ?? null) ?? "",
              "destination_port_name": to_string(get(kv, ["DestinationPortName"]) ?? null) ?? ""
          }
      } else if eid == 4 || eid == 16 {
          # Sysmon service state / config change -> Application Lifecycle 6002.
          # This is the sensor itself starting, stopping or reconfiguring.
          class_uid = 6002; class_name = "Application Lifecycle"
          category_uid = 6; category_name = "Application Activity"
          state = downcase(to_string(get(kv, ["State"]) ?? null) ?? "")
          if eid == 16 {
              activity_id = 8; activity_name = "Update"
          } else if state == "started" {
              activity_id = 3; activity_name = "Start"
          } else if state == "stopped" {
              activity_id = 4; activity_name = "Stop"
          } else {
              activity_id = 99; activity_name = "Other"
          }
          # 6002 constrains on one of [app, application]; the application whose
          # lifecycle this is, is the Sysmon sensor itself.
          app = { "name": "Sysmon for Linux", "vendor_name": "Microsoft" }
          app_version = to_string(get(kv, ["Version"]) ?? null) ?? ""
          if app_version != "" { app.version = app_version }
          ocsf.app = app
          ocsf.device = device
          ocsf.unmapped = {
              "sysmon_state": to_string(get(kv, ["State"]) ?? null) ?? "",
              "sysmon_schema_version": to_string(get(kv, ["SchemaVersion"]) ?? null) ?? "",
              "configuration": to_string(get(kv, ["Configuration"]) ?? null) ?? "",
              "configuration_file_hash": to_string(get(kv, ["ConfigurationFileHash"]) ?? null) ?? ""
          }
      } else if eid == 2 || eid == 11 || eid == 23 || eid == 26 {
          # File System Activity 1001 family.
          class_uid = 1001; class_name = "File System Activity"
          if eid == 11 {
              activity_id = 1; activity_name = "Create"
          } else if eid == 2 {
              activity_id = 6; activity_name = "Set Attributes"
          } else {
              activity_id = 4; activity_name = "Delete"
          }
          ocsf.file = target_file
          ocsf.actor = { "process": actor_process, "user": { "name": actor_user } }
          ocsf.device = device
          ocsf.unmapped = {
              "creation_utc_time": to_string(get(kv, ["CreationUtcTime"]) ?? null) ?? "",
              "previous_creation_utc_time": to_string(get(kv, ["PreviousCreationUtcTime"]) ?? null) ?? "",
              "hashes_raw": hs,
              "is_executable": to_string(get(kv, ["IsExecutable"]) ?? null) ?? ""
          }
      } else {
          # EventID Linux Sysmon does not (yet) emit -> Process Activity / Other.
          ocsf.process = subject_process
          ocsf.actor = { "process": actor_process, "user": { "name": actor_user } }
          ocsf.device = device
      }

      # ---- common envelope ----------------------------------------------
      ocsf.class_uid = class_uid
      ocsf.class_name = class_name
      ocsf.category_uid = category_uid
      ocsf.category_name = category_name
      ocsf.activity_id = activity_id
      ocsf.activity_name = activity_name
      ocsf.type_uid = class_uid * 100 + activity_id
      ocsf.severity_id = severity_id
      ocsf.severity = severity
      ocsf.time = time_ms
      ocsf.raw_data = raw_log
      # `attacks` is bound to the security_control profile in Nano's embedded
      # 1.9.0 contract (the public schema.ocsf.io lists it as unprofiled), so the
      # profile has to be declared alongside it or the event is rejected.
      if technique_id != "" {
          ocsf.attacks = [{ "technique": { "uid": technique_id } }]
          if !includes(profiles, "security_control") { profiles = push(profiles, "security_control") }
      }

      # EventRecordID is only unique within a host stream and can be reused after
      # a log reset; fold in host + event time so a replay stays idempotent while
      # a later reused RecordID cannot collide.
      record_uid = ""
      if record_id != "" && computer != "" && ts_str != "" {
          record_uid = join!(["sysmon_linux_xml", computer, downcase(channel), downcase(log_provider), record_id, ts_str], "|")
      }
      if record_uid == "" { record_uid = sha2("sysmon_linux_xml|raw|" + raw_log, variant: "SHA-256") }

      ocsf.metadata = {
          "version": "1.9.0",
          "profiles": profiles,
          "uid": record_uid,
          "event_code": to_string(eid),
          "log_name": channel,
          "log_provider": log_provider,
          "log_source": "linux_sysmon",
          "product": { "name": "Sysmon for Linux", "vendor_name": "Microsoft" }
      }

      # NAN-3713: original_event_uid carries the vendor's bare record number
      # (the per-host, per-channel sequence), not the composite uid above, so
      # it stays searchable as the number Windows shows. Omitted when absent.
      if record_id != "" { ocsf.metadata.original_event_uid = record_id }

      # NAN-3342: publish the canonical lowercase name beside known IANA ids.
      # Unknown numbers retain their id without inventing a name.
      protocol_names = { "1": "icmp", "2": "igmp", "6": "tcp", "17": "udp", "41": "ipv6", "47": "gre", "50": "esp", "51": "ah", "58": "icmpv6", "89": "ospf", "132": "sctp" }
      protocol_name = get(protocol_names, [to_string(ocsf.connection_info.protocol_num)]) ?? null
      if is_string(protocol_name) { ocsf.connection_info.protocol_name = protocol_name }
      . = ocsf
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # Values spill exactly as parsed: a parser never masks, redacts or withholds
  # anything (masking is an opt-in pipeline step, never a parser concern).
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # A source field is consumed ONLY by an explicit mapping: a field-coverage.yaml
  # `mappings` entry (source key -> target paths) or a `transforms` rule with a
  # target, whose value is found AT THAT TARGET PATH of the selected branch. A
  # value that merely appears somewhere else in the event never consumes a field
  # (no coincidental consumption); everything else spills.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The sets below are strings instead
  # (a read shares the buffer). __repr holds one member per mapped leaf:
  # "," + encode_json(path) + "=" + encode_json(encode_json(value)), plus the
  # to_string form for a string or a float, so a numeric string is represented by
  # its typed scalar. Every part is a JSON text, inside which a '"' is always
  # escaped, so a member is matched exactly. Paths drop array indices
  # (resources.0.uid is resources.uid); arrays are walked two levels deep, and a
  # leaf deeper than that is simply not mapping evidence (it can only spill more).
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped = object!(parse_json!(encode_json(__mapped)))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __copy = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __repr = ""
  for_each(flatten(__mapped)) -> |path, value| {
      __p = encode_json(path)
      if is_array(value) {
          for_each(array!(value)) -> |_i, item| {
              if is_object(item) {
                  for_each(flatten(object!(item))) -> |sub, leaf| {
                      __q = encode_json(path + "." + sub)
                      if is_array(leaf) {
                          for_each(array!(leaf)) -> |_j, x| {
                              if !is_object(x) && !is_array(x) {
                                  __repr = __repr + ("," + __q + "=" + encode_json(encode_json(x)))
                                  if is_string(x) || is_float(x) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(x))) }
                              }
                          }
                      } else {
                          __repr = __repr + ("," + __q + "=" + encode_json(encode_json(leaf)))
                          if is_string(leaf) || is_float(leaf) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(leaf))) }
                      }
                  }
              } else if !is_array(item) {
                  __repr = __repr + ("," + __p + "=" + encode_json(encode_json(item)))
                  if is_string(item) || is_float(item) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(item))) }
              }
          }
      } else {
          __repr = __repr + ("," + __p + "=" + encode_json(encode_json(value)))
          if is_string(value) || is_float(value) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(value))) }
      }
  }
  __consumed = ""
  # BEGIN parser-specific transformations
  # event_data.Protocol: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when the expected ID is emitted.
  for_each(flatten(__source_kv)) -> |key, value| {
      if match(key, r'(?x)
      \A(?:
        event_data\.Protocol
      )\z') {
          __value = value
          if __value != null {
              __expected = get!({"tcp": 6, "udp": 17, "icmp": 1, "icmpv6": 58, "ipv6-icmp": 58}, [downcase(to_string(__value) ?? "")])
              if __expected != null {
                  if contains(__repr, "," + "\"connection_info.protocol_num\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
              }
          }
      }
  }
  # Declared source -> target mappings (field-coverage.yaml `mappings`).
  __decl = "\n\"event_data.CommandLine\"\t[\"actor.process.cmd_line\",\"process.cmd_line\"]\n\"event_data.DestinationIp\"\t[\"dst_endpoint.ip\"]\n\"event_data.DestinationPort\"\t[\"dst_endpoint.port\"]\n\"event_data.Image\"\t[\"actor.process.file.path\",\"process.file.path\"]\n\"event_data.ParentCommandLine\"\t[\"actor.process.cmd_line\"]\n\"event_data.ParentImage\"\t[\"actor.process.file.path\"]\n\"event_data.ParentProcessGuid\"\t[\"actor.process.uid\"]\n\"event_data.ParentProcessId\"\t[\"actor.process.pid\"]\n\"event_data.ProcessGuid\"\t[\"actor.process.uid\",\"process.uid\"]\n\"event_data.ProcessId\"\t[\"actor.process.pid\",\"process.pid\"]\n\"event_data.SourceIp\"\t[\"src_endpoint.ip\"]\n\"event_data.SourcePort\"\t[\"src_endpoint.port\"]\n\"event_data.TargetFilename\"\t[\"file.path\"]\n\"event_data.User\"\t[\"actor.user.name\"]\n\"event_data.Version\"\t[\"app.version\"]\n\"system.Channel\"\t[\"metadata.log_name\"]\n\"system.Computer\"\t[\"device.hostname\"]\n\"system.EventID\"\t[\"metadata.event_code\"]\n\"system.EventRecordID\"\t[\"metadata.original_event_uid\"]\n\"system.Provider.@Name\"\t[\"metadata.log_provider\"]\n"
  __preserve = []
  # END parser-specific transformations
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__copy.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # Declared mappings: __decl holds "\n" + encode_json(key) + "\t" + JSON array of
  # target paths + "\n" per mapped source key (a raw newline never occurs in
  # compact JSON). A key is consumed when its value, or every element of a scalar
  # array, is at one of its own targets.
  for_each(__flat) -> |key, value| {
      if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
      # __decl spells a bracket inside a key as a \u escape (deploy bracket count).
      __kt = encode_json(key)
      if match(__kt, r'[\x28\x29\x5B\x5D\x7B\x7D]') {
          __kt = replace(replace(replace(replace(replace(replace(__kt, r'\x28', "\\u0028"), r'\x29', "\\u0029"), r'\x5B', "\\u005b"), r'\x5D', "\\u005d"), r'\x7B', "\\u007b"), r'\x7D', "\\u007d")
      }
      __at = find(__decl, "\n" + __kt + "\t")
      if is_integer(__at) && !is_object(value) {
          __rest = slice!(__decl, int!(__at) + strlen(__kt) + 2)
          __hit = false
          for_each(array!(parse_json!(slice!(__rest, 0, int!(find(__rest, "\n")))))) -> |_i, target| {
              __tok = "," + encode_json(target) + "="
              if !__hit && is_array(value) {
                  __all = !is_empty(array!(value))
                  for_each(array!(value)) -> |_j, item| {
                      if __all {
                          __all = !is_object(item) && !is_array(item) && (contains(__repr, __tok + encode_json(encode_json(item))) || ((is_string(item) || is_float(item)) && contains(__repr, __tok + encode_json(to_string!(item)))))
                      }
                  }
                  __hit = __all
              } else if !__hit {
                  __hit = contains(__repr, __tok + encode_json(encode_json(value))) || ((is_string(value) || is_float(value)) && contains(__repr, __tok + encode_json(to_string!(value))))
              }
          }
          if __hit { __consumed = __consumed + ("," + encode_json(key)) }
      }
  }
  # Fast path: when no two source keys decode to the same key and no two spilled
  # keys get the same name, each key's decision depends only on its own value, so
  # one filter and one rename build the residual without copying it per key.
  __distinct = true
  if __tilde {
      __distinct = length(map_keys(__flat) -> |key| { replace(replace(key, "~1", "."), "~0", "~") }) == length(__flat)
  }
  __kept = {}
  __names = {}
  if __distinct {
      __kept = filter(__flat) -> |key, value| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          # A key is kept unless an explicit mapping or transformation consumed it.
          # Do not spill a copy of the raw body.
          value != __raw_body && !contains(__consumed, "," + encode_json(key))
      }
      __names = map_keys(__kept) -> |key| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          join!(__parts, ".")
      }
  }
  __residual = {}
  if __distinct && length(__names) == length(__kept) {
      __residual = map_values(__names) -> |value| {
          if is_array(value) || is_object(value) {
              if __tilde {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              if __complex { value = encode_json(value) }
          }
          value
      }
  } else {
      # Slow path, in source key order: a name already taken gets the next free
      # _2, _3, ... suffix.
      for_each(__flat) -> |key, value| {
          key = replace(replace(key, "~1", "."), "~0", "~")
          if is_array(value) || is_object(value) {
              value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                  replace(replace(inner, "~1", "."), "~0", "~")
              }, ["v"])
          }
          __token = "," + encode_json(key)
          if !contains(__consumed, __token) && value != __raw_body {
              __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
              __base = join!(__parts, ".")
              __key = __base
              __suffix = 2
              if includes(keys(__residual), __key) {
                  for_each(__flat) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __key) {
                          __key = __base + "_" + to_string(__suffix)
                          __suffix = __suffix + 1
                      }
                  }
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              __spill = if __complex { encode_json(value) } else { value }
              __residual = set!(__residual, [__key], __spill)
          }
      }
  }
  # Keep existing derived evidence, but remove null placeholders and copies of a
  # source value (that value is mapped or spilled above under its source path).
  # A value merely equal to some mapped attribute is kept: equality with an
  # unrelated attribute is no evidence that it is represented.
  # The canonical source spill above is the authoritative representation of
  # containers. The cheap conditions run first; the source value set is built on
  # first use.
  __original_values = null
  for_each(flatten(__existing)) -> |key, value| {
      if !is_null(value) && value != "" && !is_array(value) && !is_object(value) && value != __raw_body {
          # Members for the value itself and for to_string(value), as above.
          __json = encode_json(value)
          __as_json = "," + encode_json(__json)
          __as_string = __as_json
          if is_string(value) { __as_string = "," + __json } else if is_float(value) { __as_string = "," + encode_json(to_string!(value)) }
          if __original_values == null {
              # __source_kv may hold non-JSON types (a timestamp), so only an
              # integer or a boolean skips its to_string member here.
              __original_values = join!(map_values(values(flatten(__source_kv))) -> |source_value| {
                  __source_json = encode_json(source_value)
                  __tokens = "," + encode_json(__source_json)
                  if is_string(source_value) {
                      __tokens = __tokens + "," + __source_json
                  } else if !is_object(source_value) && !is_array(source_value) && !is_integer(source_value) && !is_boolean(source_value) {
                      __tokens = __tokens + "," + encode_json(to_string(source_value) ?? "")
                  }
                  __tokens
              }, "")
          }
          __source_set = string!(__original_values)
          __keep = !contains(__source_set, __as_json) && !contains(__source_set, __as_string)
          # Only text opening an object or an array (after JSON whitespace)
          # decodes to a container.
          if __keep && is_string(value) && match(string!(value), r'^[ \t\n\r]*[\x5B\x7B]') {
              __decoded, __decode_err = parse_json(string!(value))
              __keep = !(__decode_err == null && (is_object(__decoded) || is_array(__decoded)))
          }
          if __keep {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, as-is. These
  # entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__copy.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

