source: text
transforms:
- source: system.TimeCreated.@SystemTime
  kind: epoch_ms
  target: time
  reason: XML system clock converted to event milliseconds.
- source: event_data.Protocol
  kind: enum
  target: connection_info.protocol_num
  values:
    tcp: 6
    udp: 17
    icmp: 1
    icmpv6: 58
    ipv6-icmp: 58
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping;
    consume only when the expected ID is emitted.
probe:
  mode: before
  anchor: </EventData>
  require: </EventData>
  text: <Data Name="ResidualProbe">nan2421-text-unknown</Data><Data Name="Password">nan2421-secret</Data>
  source: event_data.ResidualProbe
consumed_candidates:
- event_data.CommandLine
- event_data.Configuration
- event_data.ConfigurationFileHash
- event_data.CreationUtcTime
- event_data.CurrentDirectory
- event_data.DestinationHostname
- event_data.DestinationIp
- event_data.DestinationIsIpv6
- event_data.DestinationPort
- event_data.DestinationPortName
- event_data.Hashes
- event_data.Image
- event_data.Initiated
- event_data.IntegrityLevel
- event_data.IsExecutable
- event_data.LogonId
- event_data.ParentCommandLine
- event_data.ParentImage
- event_data.ParentProcessGuid
- event_data.ParentProcessId
- event_data.ParentUser
- event_data.PreviousCreationUtcTime
- event_data.ProcessGuid
- event_data.ProcessId
- event_data.Protocol
- event_data.RuleName
- event_data.SchemaVersion
- event_data.SourceHostname
- event_data.SourceIp
- event_data.SourceIsIpv6
- event_data.SourcePort
- event_data.SourcePortName
- event_data.State
- event_data.TargetFilename
- event_data.TerminalSessionId
- event_data.User
- event_data.Version
- event_data.X
- system.Channel
- system.Computer
- system.EventID
- system.EventID.text
- system.EventRecordID
- system.Level
- system.Provider.@Name
- system.TimeCreated.@SystemTime
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
