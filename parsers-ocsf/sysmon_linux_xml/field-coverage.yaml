source: text
probe:
  mode: before
  anchor: </EventData>
  require: </EventData>
  text: <Data Name="ResidualProbe">nan2421-text-unknown</Data><Data Name="Password">nan2421-secret</Data>
  source: event_data.ResidualProbe
transforms:
- source: system.TimeCreated.@SystemTime
  kind: epoch_ms
  target: time
  reason: XML system clock converted to event milliseconds.
- source: event_data.Protocol
  kind: enum
  target: connection_info.protocol_num
  values:
    tcp: 6
    udp: 17
    icmp: 1
    icmpv6: 58
    ipv6-icmp: 58
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when
    the expected ID is emitted.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  event_data.CommandLine:
  - actor.process.cmd_line
  - process.cmd_line
  event_data.DestinationIp:
  - dst_endpoint.ip
  event_data.DestinationPort:
  - dst_endpoint.port
  event_data.Image:
  - actor.process.file.path
  - process.file.path
  event_data.ParentCommandLine:
  - actor.process.cmd_line
  event_data.ParentImage:
  - actor.process.file.path
  event_data.ParentProcessGuid:
  - actor.process.uid
  event_data.ParentProcessId:
  - actor.process.pid
  event_data.ProcessGuid:
  - actor.process.uid
  - process.uid
  event_data.ProcessId:
  - actor.process.pid
  - process.pid
  event_data.SourceIp:
  - src_endpoint.ip
  event_data.SourcePort:
  - src_endpoint.port
  event_data.TargetFilename:
  - file.path
  event_data.User:
  - actor.user.name
  event_data.Version:
  - app.version
  system.Channel:
  - metadata.log_name
  system.Computer:
  - device.hostname
  system.EventID:
  - metadata.event_code
  system.EventRecordID:
  - metadata.original_event_uid
  system.Provider.@Name:
  - metadata.log_provider
