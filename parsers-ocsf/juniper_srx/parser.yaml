name: juniper_srx_ocsf
display_name: Juniper SRX (OCSF)
version: "1.2.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses Juniper SRX structured syslog ([junos@... key="value"]) into OCSF
  1.9.0. RT_FLOW_SESSION_CREATE / _CLOSE / _DENY route to Network Activity
  (4001) with activity Open / Close / Refuse; RT_IDP attack records route to
  Detection Finding (2004); RT_UTM webfilter records route to HTTP Activity
  (4002). Unlike the UDM parser this one never aborts on a non-RFC-5424 line —
  it emits a Network Activity record with activity_id 99 and the raw line in
  `message`.
match_values:
  - juniper_srx
category: network
vendor: "Juniper"
product: "SRX"
parser_vrl: |
  # NAN source timezone. Generated by scripts/residual_spill.py; edit scripts/residual/source_tz.vrl.
  # The log source's timezone setting arrives as .nano.source_timezone (an IANA
  # name such as "America/New_York", or any fixed offset such as "+05:30"), set
  # by nano at ingest. .nano is nano's input, never part of the log: it is
  # removed whole before anything else, whatever its shape.
  # For a clock that carries no offset a parser parses it AS UTC and sets
  # __lc_pending; the generated local-clock block that follows the parse
  # (local_clock.vrl) turns it into real UTC with this setting, and the spill
  # records the zone used as unmapped.nano_time_assumed_tz (the name, the offset
  # as +HH:MM, or "UTC" when the setting is absent, invalid or "local").
  __src_nano = del(.nano)
  __src_tz_in = ""
  if is_object(__src_nano) { __src_tz_in = strip_whitespace(to_string(object!(__src_nano).source_timezone) ?? "") }
  __src_tz = "UTC"
  __src_shift_ms = 0
  __src_tz_label = "UTC"
  __time_assumed = false
  __time_inline = false
  __lc_pending = false
  __src_off = parse_regex(__src_tz_in, r'^(?P<sign>[+-])(?P<h>\d{2}):?(?P<m>\d{2})$') ?? {}
  if !is_empty(__src_off) {
      __src_h = to_int(__src_off.h) ?? 99
      __src_m = to_int(__src_off.m) ?? 99
      if __src_h <= 14 && __src_m <= 59 {
          __src_shift_ms = (__src_h * 3600 + __src_m * 60) * 1000
          if __src_off.sign == "-" { __src_shift_ms = 0 - __src_shift_ms }
          if __src_shift_ms != 0 { __src_tz_label = string!(__src_off.sign) + string!(__src_off.h) + ":" + string!(__src_off.m) }
      }
  } else if __src_tz_in != "" && downcase(__src_tz_in) != "local" {
      # "local" (the Vector host's zone) would make the time depend on the host.
      __src_probe, __src_probe_err = parse_timestamp("2000-01-01 00:00:00", "%Y-%m-%d %H:%M:%S", timezone: __src_tz_in)
      if __src_probe_err == null { __src_tz = __src_tz_in; __src_tz_label = __src_tz_in }
  }
  # END NAN source timezone
  # Juniper SRX -> OCSF 1.9.0

  raw_log = string!(.message)
  __raw_body = raw_log
  __source_kv = {}

  time_ms = to_int(to_unix_timestamp(now(), unit: "milliseconds"))
  dvc_host = ""
  app_name_hdr = ""
  msg_id = ""
  rest = raw_log

  hm, he = parse_regex(raw_log, r'^<(?P<pri>\d+)>\d*\s*(?P<ts>\S+)\s+(?P<host>\S+)\s+(?P<appname>\S+)\s+(?P<procid>\S+)\s+(?P<msgid>\S+)\s+(?P<rest>.*)$')
  # Capture parsed fields before mapping; omit structural raw-body captures.
  __capture = object(parse_json!(encode_json(hm))) ?? {}
  __ignore = del(__capture.body)
  __ignore = del(__capture.content)
  __ignore = del(__capture.kvdata)
  __ignore = del(__capture.kvpart)
  __ignore = del(__capture.msg)
  __ignore = del(__capture.payload)
  __ignore = del(__capture.remainder)
  __ignore = del(__capture.rest)
  __ignore = del(__capture.sd)
  __source_kv = set!(__source_kv, ["header"], merge(object(get(__source_kv, ["header"]) ?? null) ?? {}, __capture))
  if he == null && hm != null {
      dvc_host = string!(hm.host)
      app_name_hdr = string!(hm.appname)
      msg_id = string!(hm.msgid)
      rest = string!(hm.rest)
      tsv = string!(hm.ts)
      ts, ts_err = parse_timestamp(tsv, "%Y-%m-%dT%H:%M:%S%.fZ", timezone: "UTC")
      if ts_err == null {
          time_ms = to_int(to_unix_timestamp(ts, unit: "milliseconds"))
      } else {
          ts2, ts2_err = parse_timestamp(tsv, "%Y-%m-%dT%H:%M:%S%.f%z", timezone: "UTC")
          if ts2_err == null { time_ms = to_int(to_unix_timestamp(ts2, unit: "milliseconds")) }
      }
  }
  # Some SRX deployments log the message id inline rather than in the MSGID slot.
  if msg_id == "" || msg_id == "-" {
      im, ie = parse_regex(raw_log, r'(?P<mid>RT_[A-Z0-9_]+)')
      if ie == null && im != null { msg_id = string!(im.mid) }
  }

  kv = {}
  sm, se = parse_regex(rest, r'\x5Bjunos@\S+\s+(?P<kvdata>[^\x5D]+)\x5D')
  if se == null && sm != null {
      kv = parse_key_value(string!(sm.kvdata), key_value_delimiter: "=", field_delimiter: " ") ?? {}
      __kv_capture = object(parse_json!(encode_json(kv))) ?? {}
      for_each(__kv_capture) -> |key, value| {
          if !is_boolean(value) { __source_kv = set!(__source_kv, [key], value) }
      }
  }

  src_ip = to_string(kv."source-address") ?? ""
  dst_ip = to_string(kv."destination-address") ?? ""
  src_port = to_int(to_string(kv."source-port") ?? "") ?? 0
  dst_port = to_int(to_string(kv."destination-port") ?? "") ?? 0
  src_zone = to_string(kv."source-zone-name") ?? ""
  dst_zone = to_string(kv."destination-zone-name") ?? ""
  src_if = to_string(kv."packet-incoming-interface") ?? ""
  if src_if == "" { src_if = to_string(kv."source-interface-name") ?? "" }
  dst_if = to_string(kv."destination-interface-name") ?? ""

  proto_num = to_int(to_string(kv."protocol-id") ?? "") ?? 0
  proto = downcase(to_string(kv."protocol-name") ?? "")
  if proto == "" {
      if proto_num == 1 { proto = "icmp" }
      if proto_num == 6 { proto = "tcp" }
      if proto_num == 17 { proto = "udp" }
      if proto_num == 47 { proto = "gre" }
      if proto_num == 50 { proto = "esp" }
      if proto_num == 58 { proto = "icmpv6" }
  }
  if proto_num == 0 {
      if proto == "tcp" { proto_num = 6 }
      if proto == "udp" { proto_num = 17 }
      if proto == "icmp" { proto_num = 1 }
  }

  policy = to_string(kv."policy-name") ?? ""
  session_id = to_string(kv."session-id-32") ?? ""
  if session_id == "" { session_id = to_string(kv."session-id") ?? "" }
  bytes_out = to_int(to_string(kv."bytes-from-client") ?? "") ?? 0
  bytes_in = to_int(to_string(kv."bytes-from-server") ?? "") ?? 0
  pkts_out = to_int(to_string(kv."packets-from-client") ?? "") ?? 0
  pkts_in = to_int(to_string(kv."packets-from-server") ?? "") ?? 0
  duration_s = to_int(to_string(kv."elapsed-time") ?? "") ?? 0
  repeat_cnt = to_int(to_string(kv."repeat-count") ?? "") ?? 0

  user_name = to_string(kv.username) ?? ""
  if user_name == "N/A" { user_name = "" }
  app = to_string(kv.application) ?? ""
  if app == "" { app = to_string(kv."application-name") ?? "" }
  if app == "UNKNOWN" { app = "" }
  svc_name = to_string(kv."service-name") ?? ""
  close_reason = to_string(kv.reason) ?? ""
  srx_action = downcase(to_string(kv.action) ?? "")
  attack_name = to_string(kv."attack-name") ?? ""
  threat_sev = downcase(to_string(kv."threat-severity") ?? "")
  idp_rule = to_string(kv."rule-name") ?? ""
  rulebase = to_string(kv."rulebase-name") ?? ""

  nat_src = to_string(kv."nat-source-address") ?? ""
  nat_dst = to_string(kv."nat-destination-address") ?? ""
  nat_sport = to_string(kv."nat-source-port") ?? ""
  nat_dport = to_string(kv."nat-destination-port") ?? ""

  # ---- severity ----
  severity_id = 1
  severity = "Informational"
  if threat_sev == "low" || threat_sev == "info" { severity_id = 2; severity = "Low" }
  if threat_sev == "medium" { severity_id = 3; severity = "Medium" }
  if threat_sev == "high" { severity_id = 4; severity = "High" }
  if threat_sev == "critical" { severity_id = 5; severity = "Critical" }

  # ---- routing ----
  # Route on MSGID *and* APP-NAME: SRX puts RT_FLOW / RT_IDP / RT_UTM in the
  # APP-NAME slot and the specific event (IDP_ATTACK_LOG_EVENT,
  # WEBFILTER_URL_BLOCKED, ...) in MSGID.
  mid = downcase(msg_id) + " " + downcase(app_name_hdr)
  route = "network"
  activity_id = 99
  activity_name = "Other"
  action_id = 3
  action = "Observed"
  disposition_id = 17
  disposition = "Logged"
  status_id = 1
  status_str = "Success"

  if contains(mid, "rt_flow_session_create") {
      activity_id = 1
      activity_name = "Open"
      action_id = 1
      action = "Allowed"
      disposition_id = 1
      disposition = "Allowed"
  } else if contains(mid, "rt_flow_session_close") {
      activity_id = 2
      activity_name = "Close"
      action_id = 1
      action = "Allowed"
      disposition_id = 1
      disposition = "Allowed"
  } else if contains(mid, "rt_flow_session_deny") {
      activity_id = 5
      activity_name = "Refuse"
      action_id = 2
      action = "Denied"
      disposition_id = 2
      disposition = "Blocked"
      status_id = 2
      status_str = "Failure"
      severity_id = 2
      severity = "Low"
  } else if contains(mid, "rt_idp") || contains(mid, "idp_attack") {
      route = "finding"
      activity_id = 1
      activity_name = "Create"
      action_id = 3
      action = "Observed"
      disposition_id = 15
      disposition = "Detected"
      if severity_id < 2 { severity_id = 2; severity = "Low" }
      if srx_action == "drop" || srx_action == "drop-packet" || srx_action == "close" || srx_action == "block" {
          action_id = 2
          action = "Denied"
          disposition_id = 2
          disposition = "Blocked"
      }
  } else if contains(mid, "webfilter") || contains(mid, "url_") || (contains(mid, "rt_utm") && contains(mid, "web")) {
      route = "http"
      if srx_action == "block" || srx_action == "blocked" {
          action_id = 2
          action = "Denied"
          disposition_id = 2
          disposition = "Blocked"
          status_id = 2
          status_str = "Failure"
      } else {
          action_id = 1
          action = "Allowed"
          disposition_id = 1
          disposition = "Allowed"
      }
  }

  # ---- objects ----
  src = {}
  if src_ip != "" && src_ip != "0.0.0.0" { src.ip = downcase(src_ip) }
  if src_port > 0 { src.port = src_port }
  if src_zone != "" { src.zone = src_zone }
  if src_if != "" { src.interface_name = src_if }

  dst = {}
  if dst_ip != "" && dst_ip != "0.0.0.0" { dst.ip = downcase(dst_ip) }
  if dst_port > 0 { dst.port = dst_port }
  if dst_zone != "" { dst.zone = dst_zone }
  if dst_if != "" { dst.interface_name = dst_if }
  if svc_name != "" && svc_name != "None" { dst.svc_name = svc_name }

  traffic = {}
  if bytes_in > 0 { traffic.bytes_in = bytes_in }
  if bytes_out > 0 { traffic.bytes_out = bytes_out }
  if pkts_in > 0 { traffic.packets_in = pkts_in }
  if pkts_out > 0 { traffic.packets_out = pkts_out }

  metadata = {
      "version": "1.9.0",
      "uid": sha2("juniper_srx|raw|" + raw_log, variant: "SHA-256"),
      "log_source": "juniper_srx",
      "log_provider": "JUNOS",
      "profiles": ["host", "security_control"],
      "product": {
          "name": "SRX",
          "vendor_name": "Juniper",
          "feature": { "name": "firewall" }
      }
  }
  if msg_id != "" && msg_id != "-" { metadata.event_code = msg_id }
  if app_name_hdr != "" && app_name_hdr != "-" { metadata.log_name = app_name_hdr }

  device = { "type_id": 9, "type": "Firewall" }
  has_device = false
  if dvc_host != "" { device.hostname = dvc_host; has_device = true }

  fw_rule = {}
  if policy != "" { fw_rule.name = policy; fw_rule.uid = policy }
  if idp_rule != "" && policy == "" { fw_rule.name = idp_rule; fw_rule.uid = idp_rule }
  if rulebase != "" { fw_rule.category = rulebase }

  unmapped = {}
  if session_id != "" { unmapped.session_id = session_id }
  if close_reason != "" { unmapped.close_reason = close_reason }
  if srx_action != "" { unmapped.srx_action = srx_action }
  if nat_src != "" && nat_src != "0.0.0.0" { unmapped.nat_src_ip = nat_src }
  if nat_dst != "" && nat_dst != "0.0.0.0" { unmapped.nat_dst_ip = nat_dst }
  if nat_sport != "" && nat_sport != "0" { unmapped.nat_src_port = nat_sport }
  if nat_dport != "" && nat_dport != "0" { unmapped.nat_dst_port = nat_dport }
  if idp_rule != "" { unmapped.idp_rule_name = idp_rule }
  if length(kv) == 0 { unmapped.parse_status = "no_junos_structured_data" }

  obs = []
  if src_ip != "" && src_ip != "0.0.0.0" { obs = push(obs, { "name": "src_endpoint.ip", "type": "IP Address", "type_id": 2, "value": downcase(src_ip) }) }
  if dst_ip != "" && dst_ip != "0.0.0.0" { obs = push(obs, { "name": "dst_endpoint.ip", "type": "IP Address", "type_id": 2, "value": downcase(dst_ip) }) }
  if user_name != "" { obs = push(obs, { "name": "user.name", "type": "User Name", "type_id": 4, "value": user_name }) }

  # ============================================================
  # Assemble
  # ============================================================
  if route == "finding" {
      class_uid = 2004
      title = attack_name
      if title == "" { title = "Juniper IDP detection" }
      evidence = {}
      if length(src) > 0 { evidence.src_endpoint = src }
      if length(dst) > 0 { evidence.dst_endpoint = dst }
      if proto_num > 0 { evidence.connection_info = { "direction_id": 0, "protocol_num": proto_num } }
      if user_name != "" { evidence.user = { "name": user_name } }
      evidence.name = "IDP attack"
      . = {
          "class_uid": class_uid,
          "class_name": "Detection Finding",
          "category_uid": 2,
          "category_name": "Findings",
          "activity_id": 1,
          "activity_name": "Create",
          "type_uid": class_uid * 100 + 1,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": status_id,
          "status": status_str,
          "time": time_ms,
          "raw_data": raw_log,
          "action_id": action_id,
          "action": action,
          "disposition_id": disposition_id,
          "disposition": disposition,
          "is_alert": true,
          "metadata": metadata,
          "finding_info": {
              "uid": title,
              "title": title,
              "data_sources": ["juniper_srx"],
              "analytic": { "name": title, "uid": title, "type_id": 1, "type": "Rule" }
          },
          "evidences": [evidence]
      }
      if length(fw_rule) > 0 { .firewall_rule = fw_rule }
      if has_device { .device = device }
      if repeat_cnt > 1 { .count = repeat_cnt }

  } else if route == "http" {
      class_uid = 4002
      url_str = to_string(kv.url) ?? ""
      obj_name = to_string(kv."object-name") ?? ""
      if url_str == "" { url_str = obj_name }
      category = to_string(kv.category) ?? ""
      url = {}
      if url_str != "" {
          if starts_with(url_str, "http://") || starts_with(url_str, "https://") {
              url.url_string = url_str
          } else {
              url.url_string = "http://" + url_str
          }
          dm, de = parse_regex(url_str, r'^(?:https?://)?(?P<domain>[^/:\s]+)')
          if de == null && dm != null { url.hostname = string!(dm.domain) }
          pm4, pe4 = parse_regex(url_str, r'^(?:https?://)?[^/]+(?P<path>/[^\s]*)$')
          if pe4 == null && pm4 != null { url.path = string!(pm4.path) }
      }
      if category != "" { url.categories = [category] }
      req = {}
      if length(url) > 0 { req.url = url }
      . = {
          "class_uid": class_uid,
          "class_name": "HTTP Activity",
          "category_uid": 4,
          "category_name": "Network Activity",
          "activity_id": 99,
          "activity_name": "Other",
          "type_uid": class_uid * 100 + 99,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": status_id,
          "status": status_str,
          "time": time_ms,
          "raw_data": raw_log,
          "action_id": action_id,
          "action": action,
          "disposition_id": disposition_id,
          "disposition": disposition,
          "metadata": metadata,
          "http_request": req,
          "connection_info": { "direction_id": 0, "protocol_num": proto_num }
      }
      if proto != "" { .connection_info.protocol_name = proto }
      if length(src) > 0 { .src_endpoint = src }
      if length(dst) > 0 { .dst_endpoint = dst }
      if length(src) == 0 && length(dst) == 0 { .dst_endpoint = { "svc_name": "http" } }
      if user_name != "" { .actor = { "user": { "name": user_name } } }
      if app != "" { .app_name = app }
      if has_device { .device = device }

  } else {
      class_uid = 4001
      . = {
          "class_uid": class_uid,
          "class_name": "Network Activity",
          "category_uid": 4,
          "category_name": "Network Activity",
          "activity_id": activity_id,
          "activity_name": activity_name,
          "type_uid": class_uid * 100 + activity_id,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": status_id,
          "status": status_str,
          "time": time_ms,
          "raw_data": raw_log,
          "action_id": action_id,
          "action": action,
          "disposition_id": disposition_id,
          "disposition": disposition,
          "metadata": metadata,
          "connection_info": { "direction_id": 0, "protocol_num": proto_num }
      }
      if proto != "" { .connection_info.protocol_name = proto }
      if session_id != "" { .connection_info.uid = session_id }
      if length(src) > 0 { .src_endpoint = src }
      if length(dst) > 0 { .dst_endpoint = dst }
      if length(src) == 0 && length(dst) == 0 {
          fb = {}
          if dvc_host != "" { fb.hostname = dvc_host }
          if length(fb) == 0 { fb.hostname = "unknown" }
          .src_endpoint = fb
      }
      if length(traffic) > 0 { .traffic = traffic }
      if duration_s > 0 { .duration = duration_s }
      if repeat_cnt > 1 { .count = repeat_cnt }
      if length(fw_rule) > 0 { .firewall_rule = fw_rule }
      if user_name != "" { .actor = { "user": { "name": user_name } } }
      if app != "" { .app_name = app }
      if close_reason != "" { .status_detail = close_reason }
      if has_device { .device = device }
  }

  if length(unmapped) > 0 { .unmapped = unmapped }
  if length(obs) > 0 { .observables = obs }

  .

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # Values spill exactly as parsed: a parser never masks, redacts or withholds
  # anything (masking is an opt-in pipeline step, never a parser concern).
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # A source field is consumed ONLY by an explicit mapping: a field-coverage.yaml
  # `mappings` entry (source key -> target paths) or a `transforms` rule with a
  # target, whose value is found AT THAT TARGET PATH of the selected branch. A
  # value that merely appears somewhere else in the event never consumes a field
  # (no coincidental consumption); everything else spills.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The sets below are strings instead
  # (a read shares the buffer). __repr holds one member per mapped leaf:
  # "," + encode_json(path) + "=" + encode_json(encode_json(value)), plus the
  # to_string form for a string or a float, so a numeric string is represented by
  # its typed scalar. Every part is a JSON text, inside which a '"' is always
  # escaped, so a member is matched exactly. Paths drop array indices
  # (resources.0.uid is resources.uid); arrays are walked two levels deep, and a
  # leaf deeper than that is simply not mapping evidence (it can only spill more).
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped = object!(parse_json!(encode_json(__mapped)))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __copy = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __repr = ""
  for_each(flatten(__mapped)) -> |path, value| {
      __p = encode_json(path)
      if is_array(value) {
          for_each(array!(value)) -> |_i, item| {
              if is_object(item) {
                  for_each(flatten(object!(item))) -> |sub, leaf| {
                      __q = encode_json(path + "." + sub)
                      if is_array(leaf) {
                          for_each(array!(leaf)) -> |_j, x| {
                              if !is_object(x) && !is_array(x) {
                                  __repr = __repr + ("," + __q + "=" + encode_json(encode_json(x)))
                                  if is_string(x) || is_float(x) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(x))) }
                              }
                          }
                      } else {
                          __repr = __repr + ("," + __q + "=" + encode_json(encode_json(leaf)))
                          if is_string(leaf) || is_float(leaf) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(leaf))) }
                      }
                  }
              } else if !is_array(item) {
                  __repr = __repr + ("," + __p + "=" + encode_json(encode_json(item)))
                  if is_string(item) || is_float(item) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(item))) }
              }
          }
      } else {
          __repr = __repr + ("," + __p + "=" + encode_json(encode_json(value)))
          if is_string(value) || is_float(value) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(value))) }
      }
  }
  __consumed = ""
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__copy.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # BEGIN parser-specific transformations
  # action: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when the expected ID is emitted.
  for_each(__flat) -> |key, value| {
      if match(key, r'(?x)
      \A(?:
        action
      )\z') {
          __value = value
          if __value != null {
              __expected = get!({"allow": 1, "allowed": 1, "accept": 1, "accepted": 1, "permit": 1, "permitted": 1, "pass": 1, "passed": 1, "deny": 2, "denied": 2, "block": 2, "blocked": 2, "reject": 2, "rejected": 2, "drop": 2, "dropped": 2, "log": 3, "observed": 3}, [downcase(to_string(__value) ?? "")])
              if __expected != null {
                  if contains(__repr, "," + "\"action_id\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
              }
          }
      }
  }
  # Declared source -> target mappings (field-coverage.yaml `mappings`).
  __decl = "\n\"application\"\t[\"app_name\"]\n\"attack-name\"\t[\"finding_info.analytic.name\",\"finding_info.analytic.uid\",\"finding_info.title\",\"finding_info.uid\"]\n\"bytes-from-client\"\t[\"traffic.bytes_out\"]\n\"bytes-from-server\"\t[\"traffic.bytes_in\"]\n\"category\"\t[\"http_request.url.categories\"]\n\"destination-address\"\t[\"dst_endpoint.ip\",\"evidences.dst_endpoint.ip\",\"observables.value\"]\n\"destination-port\"\t[\"dst_endpoint.port\",\"evidences.dst_endpoint.port\"]\n\"destination-zone-name\"\t[\"dst_endpoint.zone\"]\n\"elapsed-time\"\t[\"duration\"]\n\"header.appname\"\t[\"metadata.log_name\"]\n\"header.host\"\t[\"device.hostname\",\"src_endpoint.hostname\"]\n\"header.msgid\"\t[\"metadata.event_code\"]\n\"packet-incoming-interface\"\t[\"src_endpoint.interface_name\"]\n\"packets-from-client\"\t[\"traffic.packets_out\"]\n\"packets-from-server\"\t[\"traffic.packets_in\"]\n\"policy-name\"\t[\"firewall_rule.name\",\"firewall_rule.uid\"]\n\"protocol-id\"\t[\"connection_info.protocol_num\"]\n\"reason\"\t[\"status_detail\"]\n\"repeat-count\"\t[\"count\"]\n\"rulebase-name\"\t[\"firewall_rule.category\"]\n\"service-name\"\t[\"dst_endpoint.svc_name\",\"evidences.dst_endpoint.svc_name\"]\n\"session-id-32\"\t[\"connection_info.uid\"]\n\"source-address\"\t[\"evidences.src_endpoint.ip\",\"observables.value\",\"src_endpoint.ip\"]\n\"source-port\"\t[\"evidences.src_endpoint.port\",\"src_endpoint.port\"]\n\"source-zone-name\"\t[\"src_endpoint.zone\"]\n\"username\"\t[\"actor.user.name\",\"observables.value\"]\n"
  __preserve = []
  # END parser-specific transformations
  # Declared mappings: __decl holds "\n" + encode_json(key) + "\t" + JSON array of
  # target paths + "\n" per mapped source key (a raw newline never occurs in
  # compact JSON). A key is consumed when its value, or every element of a scalar
  # array, is at one of its own targets. Keys stay ESCAPED here and in __consumed:
  # a literal dotted key ("a~1b") and the nested path ("a.b") are different
  # fields, and mapping one never consumes the other.
  for_each(__flat) -> |key, value| {
      # __decl spells a bracket inside a key as a \u escape (deploy bracket count).
      __kt = encode_json(key)
      if match(__kt, r'[\x28\x29\x5B\x5D\x7B\x7D]') {
          __kt = replace(replace(replace(replace(replace(replace(__kt, r'\x28', "\\u0028"), r'\x29', "\\u0029"), r'\x5B', "\\u005b"), r'\x5D', "\\u005d"), r'\x7B', "\\u007b"), r'\x7D', "\\u007d")
      }
      __at = find(__decl, "\n" + __kt + "\t")
      if is_integer(__at) && !is_object(value) {
          __rest = slice!(__decl, int!(__at) + strlen(__kt) + 2)
          __hit = false
          for_each(array!(parse_json!(slice!(__rest, 0, int!(find(__rest, "\n")))))) -> |_i, target| {
              __tok = "," + encode_json(target) + "="
              if !__hit && is_array(value) {
                  __all = !is_empty(array!(value))
                  for_each(array!(value)) -> |_j, item| {
                      if __all {
                          __all = !is_object(item) && !is_array(item) && (contains(__repr, __tok + encode_json(encode_json(item))) || ((is_string(item) || is_float(item)) && contains(__repr, __tok + encode_json(to_string!(item)))))
                      }
                  }
                  __hit = __all
              } else if !__hit {
                  __hit = contains(__repr, __tok + encode_json(encode_json(value))) || ((is_string(value) || is_float(value)) && contains(__repr, __tok + encode_json(to_string!(value))))
              }
          }
          if __hit { __consumed = __consumed + ("," + encode_json(key)) }
      }
  }
  # Fast path: when no two source keys decode to the same key and no two spilled
  # keys get the same name, each key's decision depends only on its own value, so
  # one filter and one rename build the residual without copying it per key.
  __distinct = true
  if __tilde {
      __distinct = length(map_keys(__flat) -> |key| { replace(replace(key, "~1", "."), "~0", "~") }) == length(__flat)
  }
  __kept = {}
  __names = {}
  if __distinct {
      __kept = filter(__flat) -> |key, value| {
          # A key is kept unless an explicit mapping or transformation consumed it.
          # Do not spill a copy of the raw body.
          value != __raw_body && !contains(__consumed, "," + encode_json(key))
      }
      __names = map_keys(__kept) -> |key| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          join!(__parts, ".")
      }
  }
  __residual = {}
  if __distinct && length(__names) == length(__kept) {
      __residual = map_values(__names) -> |value| {
          if is_array(value) || is_object(value) {
              if __tilde {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              if __complex { value = encode_json(value) }
          }
          value
      }
  } else {
      # Slow path, in source key order: a name already taken gets the next free
      # _2, _3, ... suffix.
      for_each(__flat) -> |key, value| {
          __token = "," + encode_json(key)
          key = replace(replace(key, "~1", "."), "~0", "~")
          if is_array(value) || is_object(value) {
              value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                  replace(replace(inner, "~1", "."), "~0", "~")
              }, ["v"])
          }
          if !contains(__consumed, __token) && value != __raw_body {
              __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
              __base = join!(__parts, ".")
              __key = __base
              __suffix = 2
              if includes(keys(__residual), __key) {
                  for_each(__flat) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __key) {
                          __key = __base + "_" + to_string(__suffix)
                          __suffix = __suffix + 1
                      }
                  }
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              __spill = if __complex { encode_json(value) } else { value }
              __residual = set!(__residual, [__key], __spill)
          }
      }
  }
  # Names nano owns in unmapped (the parser markers and the reserved nano.*
  # namespace) are never taken by a source field: a vendor key with such a name
  # is kept, renamed source_<name>, so a log cannot forge a marker.
  if match(encode_json(keys(__residual)), r'"nano(?:"|\.|_time_assumed_tz"|_time_source"|_operational")') {
      for_each(object!(__residual)) -> |key, value| {
          if includes(["nano", "nano_time_assumed_tz", "nano_time_source", "nano_operational"], key) || starts_with(key, "nano.") {
              # source_<name>, or the next free _2, _3, ... when a vendor key
              # already holds that name: nothing is lost.
              __rk = "source_" + key
              __rn = 2
              if includes(keys(__residual), __rk) {
                  for_each(__residual) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __rk) {
                          __rk = "source_" + key + "_" + to_string(__rn)
                          __rn = __rn + 1
                      }
                  }
              }
              __residual = remove!(__residual, [key])
              __residual = set!(__residual, [__rk], value)
          }
      }
  }
  # Keep existing derived evidence, but remove null placeholders and copies of a
  # source value (that value is mapped or spilled above under its source path).
  # A value merely equal to some mapped attribute is kept: equality with an
  # unrelated attribute is no evidence that it is represented.
  # The canonical source spill above is the authoritative representation of
  # containers. The cheap conditions run first; the source value set is built on
  # first use.
  __original_values = null
  for_each(flatten(__existing)) -> |key, value| {
      if !is_null(value) && value != "" && !is_array(value) && !is_object(value) && value != __raw_body {
          # Members for the value itself and for to_string(value), as above.
          __json = encode_json(value)
          __as_json = "," + encode_json(__json)
          __as_string = __as_json
          if is_string(value) { __as_string = "," + __json } else if is_float(value) { __as_string = "," + encode_json(to_string!(value)) }
          if __original_values == null {
              # __source_kv may hold non-JSON types (a timestamp), so only an
              # integer or a boolean skips its to_string member here.
              __original_values = join!(map_values(values(flatten(__source_kv))) -> |source_value| {
                  __source_json = encode_json(source_value)
                  __tokens = "," + encode_json(__source_json)
                  if is_string(source_value) {
                      __tokens = __tokens + "," + __source_json
                  } else if !is_object(source_value) && !is_array(source_value) && !is_integer(source_value) && !is_boolean(source_value) {
                      __tokens = __tokens + "," + encode_json(to_string(source_value) ?? "")
                  }
                  __tokens
              }, "")
          }
          __source_set = string!(__original_values)
          __keep = !contains(__source_set, __as_json) && !contains(__source_set, __as_string)
          # Only text opening an object or an array (after JSON whitespace)
          # decodes to a container.
          if __keep && is_string(value) && match(string!(value), r'^[ \t\n\r]*[\x5B\x7B]') {
              __decoded, __decode_err = parse_json(string!(value))
              __keep = !(__decode_err == null && (is_object(__decoded) || is_array(__decoded)))
          }
          if __keep {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, as-is. These
  # entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__copy.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  if __time_assumed && !__time_inline { __residual = set!(__residual, ["nano_time_assumed_tz"], __src_tz_label) }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

