name: juniper_srx_ocsf
display_name: Juniper SRX (OCSF)
version: "1.1.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields in redacted, dotted snake_case unmapped keys.
  Parses Juniper SRX structured syslog ([junos@... key="value"]) into OCSF
  1.9.0. RT_FLOW_SESSION_CREATE / _CLOSE / _DENY route to Network Activity
  (4001) with activity Open / Close / Refuse; RT_IDP attack records route to
  Detection Finding (2004); RT_UTM webfilter records route to HTTP Activity
  (4002). Unlike the UDM parser this one never aborts on a non-RFC-5424 line —
  it emits a Network Activity record with activity_id 99 and the raw line in
  `message`.
match_values:
  - juniper_srx
category: network
vendor: "Juniper"
product: "SRX"
parser_vrl: |
  # Juniper SRX -> OCSF 1.9.0

  raw_log = string!(.message)
  __raw_body = raw_log
  __source_kv = {}

  time_ms = to_int(to_unix_timestamp(now(), unit: "milliseconds"))
  dvc_host = ""
  app_name_hdr = ""
  msg_id = ""
  rest = raw_log

  hm, he = parse_regex(raw_log, r'^<(?P<pri>\d+)>\d*\s*(?P<ts>\S+)\s+(?P<host>\S+)\s+(?P<appname>\S+)\s+(?P<procid>\S+)\s+(?P<msgid>\S+)\s+(?P<rest>.*)$')
  # Capture parsed fields before mapping; omit structural raw-body captures.
  __capture = object(parse_json!(encode_json(hm))) ?? {}
  __ignore = del(__capture.body)
  __ignore = del(__capture.content)
  __ignore = del(__capture.kvdata)
  __ignore = del(__capture.kvpart)
  __ignore = del(__capture.msg)
  __ignore = del(__capture.payload)
  __ignore = del(__capture.remainder)
  __ignore = del(__capture.rest)
  __ignore = del(__capture.sd)
  __source_kv = set!(__source_kv, ["header"], merge(object(get(__source_kv, ["header"]) ?? null) ?? {}, __capture))
  if he == null && hm != null {
      dvc_host = string!(hm.host)
      app_name_hdr = string!(hm.appname)
      msg_id = string!(hm.msgid)
      rest = string!(hm.rest)
      tsv = string!(hm.ts)
      ts, ts_err = parse_timestamp(tsv, "%Y-%m-%dT%H:%M:%S%.fZ")
      if ts_err == null {
          time_ms = to_int(to_unix_timestamp(ts, unit: "milliseconds"))
      } else {
          ts2, ts2_err = parse_timestamp(tsv, "%Y-%m-%dT%H:%M:%S%.f%z")
          if ts2_err == null { time_ms = to_int(to_unix_timestamp(ts2, unit: "milliseconds")) }
      }
  }
  # Some SRX deployments log the message id inline rather than in the MSGID slot.
  if msg_id == "" || msg_id == "-" {
      im, ie = parse_regex(raw_log, r'(?P<mid>RT_[A-Z0-9_]+)')
      if ie == null && im != null { msg_id = string!(im.mid) }
  }

  kv = {}
  sm, se = parse_regex(rest, r'\x5Bjunos@\S+\s+(?P<kvdata>[^\x5D]+)\x5D')
  if se == null && sm != null {
      kv = parse_key_value(string!(sm.kvdata), key_value_delimiter: "=", field_delimiter: " ") ?? {}
      __kv_capture = object(parse_json!(encode_json(kv))) ?? {}
      for_each(__kv_capture) -> |key, value| {
          if !is_boolean(value) { __source_kv = set!(__source_kv, [key], value) }
      }
  }

  src_ip = to_string(kv."source-address") ?? ""
  dst_ip = to_string(kv."destination-address") ?? ""
  src_port = to_int(to_string(kv."source-port") ?? "") ?? 0
  dst_port = to_int(to_string(kv."destination-port") ?? "") ?? 0
  src_zone = to_string(kv."source-zone-name") ?? ""
  dst_zone = to_string(kv."destination-zone-name") ?? ""
  src_if = to_string(kv."packet-incoming-interface") ?? ""
  if src_if == "" { src_if = to_string(kv."source-interface-name") ?? "" }
  dst_if = to_string(kv."destination-interface-name") ?? ""

  proto_num = to_int(to_string(kv."protocol-id") ?? "") ?? 0
  proto = downcase(to_string(kv."protocol-name") ?? "")
  if proto == "" {
      if proto_num == 1 { proto = "icmp" }
      if proto_num == 6 { proto = "tcp" }
      if proto_num == 17 { proto = "udp" }
      if proto_num == 47 { proto = "gre" }
      if proto_num == 50 { proto = "esp" }
      if proto_num == 58 { proto = "icmpv6" }
  }
  if proto_num == 0 {
      if proto == "tcp" { proto_num = 6 }
      if proto == "udp" { proto_num = 17 }
      if proto == "icmp" { proto_num = 1 }
  }

  policy = to_string(kv."policy-name") ?? ""
  session_id = to_string(kv."session-id-32") ?? ""
  if session_id == "" { session_id = to_string(kv."session-id") ?? "" }
  bytes_out = to_int(to_string(kv."bytes-from-client") ?? "") ?? 0
  bytes_in = to_int(to_string(kv."bytes-from-server") ?? "") ?? 0
  pkts_out = to_int(to_string(kv."packets-from-client") ?? "") ?? 0
  pkts_in = to_int(to_string(kv."packets-from-server") ?? "") ?? 0
  duration_s = to_int(to_string(kv."elapsed-time") ?? "") ?? 0
  repeat_cnt = to_int(to_string(kv."repeat-count") ?? "") ?? 0

  user_name = to_string(kv.username) ?? ""
  if user_name == "N/A" { user_name = "" }
  app = to_string(kv.application) ?? ""
  if app == "" { app = to_string(kv."application-name") ?? "" }
  if app == "UNKNOWN" { app = "" }
  svc_name = to_string(kv."service-name") ?? ""
  close_reason = to_string(kv.reason) ?? ""
  srx_action = downcase(to_string(kv.action) ?? "")
  attack_name = to_string(kv."attack-name") ?? ""
  threat_sev = downcase(to_string(kv."threat-severity") ?? "")
  idp_rule = to_string(kv."rule-name") ?? ""
  rulebase = to_string(kv."rulebase-name") ?? ""

  nat_src = to_string(kv."nat-source-address") ?? ""
  nat_dst = to_string(kv."nat-destination-address") ?? ""
  nat_sport = to_string(kv."nat-source-port") ?? ""
  nat_dport = to_string(kv."nat-destination-port") ?? ""

  # ---- severity ----
  severity_id = 1
  severity = "Informational"
  if threat_sev == "low" || threat_sev == "info" { severity_id = 2; severity = "Low" }
  if threat_sev == "medium" { severity_id = 3; severity = "Medium" }
  if threat_sev == "high" { severity_id = 4; severity = "High" }
  if threat_sev == "critical" { severity_id = 5; severity = "Critical" }

  # ---- routing ----
  # Route on MSGID *and* APP-NAME: SRX puts RT_FLOW / RT_IDP / RT_UTM in the
  # APP-NAME slot and the specific event (IDP_ATTACK_LOG_EVENT,
  # WEBFILTER_URL_BLOCKED, ...) in MSGID.
  mid = downcase(msg_id) + " " + downcase(app_name_hdr)
  route = "network"
  activity_id = 99
  activity_name = "Other"
  action_id = 3
  action = "Observed"
  disposition_id = 17
  disposition = "Logged"
  status_id = 1
  status_str = "Success"

  if contains(mid, "rt_flow_session_create") {
      activity_id = 1
      activity_name = "Open"
      action_id = 1
      action = "Allowed"
      disposition_id = 1
      disposition = "Allowed"
  } else if contains(mid, "rt_flow_session_close") {
      activity_id = 2
      activity_name = "Close"
      action_id = 1
      action = "Allowed"
      disposition_id = 1
      disposition = "Allowed"
  } else if contains(mid, "rt_flow_session_deny") {
      activity_id = 5
      activity_name = "Refuse"
      action_id = 2
      action = "Denied"
      disposition_id = 2
      disposition = "Blocked"
      status_id = 2
      status_str = "Failure"
      severity_id = 2
      severity = "Low"
  } else if contains(mid, "rt_idp") || contains(mid, "idp_attack") {
      route = "finding"
      activity_id = 1
      activity_name = "Create"
      action_id = 3
      action = "Observed"
      disposition_id = 15
      disposition = "Detected"
      if severity_id < 2 { severity_id = 2; severity = "Low" }
      if srx_action == "drop" || srx_action == "drop-packet" || srx_action == "close" || srx_action == "block" {
          action_id = 2
          action = "Denied"
          disposition_id = 2
          disposition = "Blocked"
      }
  } else if contains(mid, "webfilter") || contains(mid, "url_") || (contains(mid, "rt_utm") && contains(mid, "web")) {
      route = "http"
      if srx_action == "block" || srx_action == "blocked" {
          action_id = 2
          action = "Denied"
          disposition_id = 2
          disposition = "Blocked"
          status_id = 2
          status_str = "Failure"
      } else {
          action_id = 1
          action = "Allowed"
          disposition_id = 1
          disposition = "Allowed"
      }
  }

  # ---- objects ----
  src = {}
  if src_ip != "" && src_ip != "0.0.0.0" { src.ip = downcase(src_ip) }
  if src_port > 0 { src.port = src_port }
  if src_zone != "" { src.zone = src_zone }
  if src_if != "" { src.interface_name = src_if }

  dst = {}
  if dst_ip != "" && dst_ip != "0.0.0.0" { dst.ip = downcase(dst_ip) }
  if dst_port > 0 { dst.port = dst_port }
  if dst_zone != "" { dst.zone = dst_zone }
  if dst_if != "" { dst.interface_name = dst_if }
  if svc_name != "" && svc_name != "None" { dst.svc_name = svc_name }

  traffic = {}
  if bytes_in > 0 { traffic.bytes_in = bytes_in }
  if bytes_out > 0 { traffic.bytes_out = bytes_out }
  if pkts_in > 0 { traffic.packets_in = pkts_in }
  if pkts_out > 0 { traffic.packets_out = pkts_out }

  metadata = {
      "version": "1.9.0",
      "uid": uuid_v4(),
      "log_source": "juniper_srx",
      "log_provider": "JUNOS",
      "profiles": ["host", "security_control"],
      "product": {
          "name": "SRX",
          "vendor_name": "Juniper",
          "feature": { "name": "firewall" }
      }
  }
  if msg_id != "" && msg_id != "-" { metadata.event_code = msg_id }
  if app_name_hdr != "" && app_name_hdr != "-" { metadata.log_name = app_name_hdr }

  device = { "type_id": 9, "type": "Firewall" }
  has_device = false
  if dvc_host != "" { device.hostname = dvc_host; has_device = true }

  fw_rule = {}
  if policy != "" { fw_rule.name = policy; fw_rule.uid = policy }
  if idp_rule != "" && policy == "" { fw_rule.name = idp_rule; fw_rule.uid = idp_rule }
  if rulebase != "" { fw_rule.category = rulebase }

  unmapped = {}
  if session_id != "" { unmapped.session_id = session_id }
  if close_reason != "" { unmapped.close_reason = close_reason }
  if srx_action != "" { unmapped.srx_action = srx_action }
  if nat_src != "" && nat_src != "0.0.0.0" { unmapped.nat_src_ip = nat_src }
  if nat_dst != "" && nat_dst != "0.0.0.0" { unmapped.nat_dst_ip = nat_dst }
  if nat_sport != "" && nat_sport != "0" { unmapped.nat_src_port = nat_sport }
  if nat_dport != "" && nat_dport != "0" { unmapped.nat_dst_port = nat_dport }
  if idp_rule != "" { unmapped.idp_rule_name = idp_rule }
  if length(kv) == 0 { unmapped.parse_status = "no_junos_structured_data" }

  obs = []
  if src_ip != "" && src_ip != "0.0.0.0" { obs = push(obs, { "name": "src_endpoint.ip", "type": "IP Address", "type_id": 2, "value": downcase(src_ip) }) }
  if dst_ip != "" && dst_ip != "0.0.0.0" { obs = push(obs, { "name": "dst_endpoint.ip", "type": "IP Address", "type_id": 2, "value": downcase(dst_ip) }) }
  if user_name != "" { obs = push(obs, { "name": "user.name", "type": "User Name", "type_id": 4, "value": user_name }) }

  # ============================================================
  # Assemble
  # ============================================================
  if route == "finding" {
      class_uid = 2004
      title = attack_name
      if title == "" { title = "Juniper IDP detection" }
      evidence = {}
      if length(src) > 0 { evidence.src_endpoint = src }
      if length(dst) > 0 { evidence.dst_endpoint = dst }
      if proto_num > 0 { evidence.connection_info = { "direction_id": 0, "protocol_num": proto_num } }
      if user_name != "" { evidence.user = { "name": user_name } }
      evidence.name = "IDP attack"
      . = {
          "class_uid": class_uid,
          "class_name": "Detection Finding",
          "category_uid": 2,
          "category_name": "Findings",
          "activity_id": 1,
          "activity_name": "Create",
          "type_uid": class_uid * 100 + 1,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": status_id,
          "status": status_str,
          "time": time_ms,
          "raw_data": raw_log,
          "action_id": action_id,
          "action": action,
          "disposition_id": disposition_id,
          "disposition": disposition,
          "is_alert": true,
          "metadata": metadata,
          "finding_info": {
              "uid": title,
              "title": title,
              "data_sources": ["juniper_srx"],
              "analytic": { "name": title, "uid": title, "type_id": 1, "type": "Rule" }
          },
          "evidences": [evidence]
      }
      if length(fw_rule) > 0 { .firewall_rule = fw_rule }
      if has_device { .device = device }
      if repeat_cnt > 1 { .count = repeat_cnt }

  } else if route == "http" {
      class_uid = 4002
      url_str = to_string(kv.url) ?? ""
      obj_name = to_string(kv."object-name") ?? ""
      if url_str == "" { url_str = obj_name }
      category = to_string(kv.category) ?? ""
      url = {}
      if url_str != "" {
          if starts_with(url_str, "http://") || starts_with(url_str, "https://") {
              url.url_string = url_str
          } else {
              url.url_string = "http://" + url_str
          }
          dm, de = parse_regex(url_str, r'^(?:https?://)?(?P<domain>[^/:\s]+)')
          if de == null && dm != null { url.hostname = string!(dm.domain) }
          pm4, pe4 = parse_regex(url_str, r'^(?:https?://)?[^/]+(?P<path>/[^\s]*)$')
          if pe4 == null && pm4 != null { url.path = string!(pm4.path) }
      }
      if category != "" { url.categories = [category] }
      req = {}
      if length(url) > 0 { req.url = url }
      . = {
          "class_uid": class_uid,
          "class_name": "HTTP Activity",
          "category_uid": 4,
          "category_name": "Network Activity",
          "activity_id": 99,
          "activity_name": "Other",
          "type_uid": class_uid * 100 + 99,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": status_id,
          "status": status_str,
          "time": time_ms,
          "raw_data": raw_log,
          "action_id": action_id,
          "action": action,
          "disposition_id": disposition_id,
          "disposition": disposition,
          "metadata": metadata,
          "http_request": req,
          "connection_info": { "direction_id": 0, "protocol_num": proto_num }
      }
      if proto != "" { .connection_info.protocol_name = proto }
      if length(src) > 0 { .src_endpoint = src }
      if length(dst) > 0 { .dst_endpoint = dst }
      if length(src) == 0 && length(dst) == 0 { .dst_endpoint = { "svc_name": "http" } }
      if user_name != "" { .actor = { "user": { "name": user_name } } }
      if app != "" { .app_name = app }
      if has_device { .device = device }

  } else {
      class_uid = 4001
      . = {
          "class_uid": class_uid,
          "class_name": "Network Activity",
          "category_uid": 4,
          "category_name": "Network Activity",
          "activity_id": activity_id,
          "activity_name": activity_name,
          "type_uid": class_uid * 100 + activity_id,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": status_id,
          "status": status_str,
          "time": time_ms,
          "raw_data": raw_log,
          "action_id": action_id,
          "action": action,
          "disposition_id": disposition_id,
          "disposition": disposition,
          "metadata": metadata,
          "connection_info": { "direction_id": 0, "protocol_num": proto_num }
      }
      if proto != "" { .connection_info.protocol_name = proto }
      if session_id != "" { .connection_info.uid = session_id }
      if length(src) > 0 { .src_endpoint = src }
      if length(dst) > 0 { .dst_endpoint = dst }
      if length(src) == 0 && length(dst) == 0 {
          fb = {}
          if dvc_host != "" { fb.hostname = dvc_host }
          if length(fb) == 0 { fb.hostname = "unknown" }
          .src_endpoint = fb
      }
      if length(traffic) > 0 { .traffic = traffic }
      if duration_s > 0 { .duration = duration_s }
      if repeat_cnt > 1 { .count = repeat_cnt }
      if length(fw_rule) > 0 { .firewall_rule = fw_rule }
      if user_name != "" { .actor = { "user": { "name": user_name } } }
      if app != "" { .app_name = app }
      if close_reason != "" { .status_detail = close_reason }
      if has_device { .device = device }
  }

  if length(unmapped) > 0 { .unmapped = unmapped }
  if length(obs) > 0 { .observables = obs }

  .

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # Exact value representation is evaluated AFTER branch selection. Numeric strings
  # count as represented by their typed scalar; other transformations are explicit.
  __mapped = object!(parse_json!(encode_json(.)))
  __existing = object(__mapped.unmapped) ?? {}
  __discard = del(__mapped.raw_data)
  __discard = del(__mapped.unmapped)
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __represented = []
  __walk = map_values(__mapped, recursive: true) -> |value| {
      __represented = push(__represented, encode_json(value))
      if !is_object(value) && !is_array(value) && !is_null(value) {
          __represented = push(__represented, to_string(value) ?? "")
      }
      value
  }
  __consumed = []
  # BEGIN parser-specific transformations
  # action: Parser case-normalizes this parsed field when represented in output.
  # action: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when the expected ID is emitted.
  # threat-severity: Parser normalizes the caption case; verify the emitted caption.
  # Only source keys read by this parser are eligible for exact-value consumption; the selected branch must emit the value. Unknown keys always spill, even when their value equals an OCSF default.
  __candidates = ["action", "application", "application-name", "attack-name", "bytes-from-client", "bytes-from-server", "category", "destination-address", "destination-interface-name", "destination-port", "destination-zone-name", "elapsed-time", "header.appname", "header.host", "header.msgid", "header.rest", "header.ts", "nat-destination-address", "nat-destination-port", "nat-source-address", "nat-source-port", "object-name", "packet-incoming-interface", "packets-from-client", "packets-from-server", "policy-name", "protocol-id", "protocol-name", "reason", "repeat-count", "rule-name", "rulebase-name", "service-name", "session-id", "session-id-32", "source-address", "source-interface-name", "source-port", "source-zone-name", "threat-severity", "url", "username"]
  __preserve = []
  __rules = array!(parse_json!("[{\"source\":\"action\",\"kind\":\"lowercase\",\"reason\":\"Parser case-normalizes this parsed field when represented in output.\"},{\"source\":\"action\",\"kind\":\"enum\",\"target\":\"action_id\",\"values\":{\"allow\":1,\"allowed\":1,\"accept\":1,\"accepted\":1,\"permit\":1,\"permitted\":1,\"pass\":1,\"passed\":1,\"deny\":2,\"denied\":2,\"block\":2,\"blocked\":2,\"reject\":2,\"rejected\":2,\"drop\":2,\"dropped\":2,\"log\":3,\"observed\":3},\"reason\":\"Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when the expected ID is emitted.\"},{\"source\":\"threat-severity\",\"kind\":\"enum\",\"target\":\"severity\",\"values\":{\"critical\":\"Critical\"},\"reason\":\"Parser normalizes the caption case; verify the emitted caption.\"}]"))
  __source_flat = flatten(__source_kv)
  for_each(__rules) -> |_index, rule| {
      __source_key = string!(rule.source)
      __value = get!(__source_flat, [__source_key])
      __expected = null
      __valid = false
      if rule.kind == "lowercase" && is_string(__value) {
          __expected = downcase(string!(__value))
          __valid = true
      } else if rule.kind == "epoch_ms" {
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", string(rule.format) ?? "%+")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              __valid = true
          }
      } else if rule.kind == "scale" {
          __number, __number_err = to_float(__value)
          if __number_err == null && __value != null && !is_boolean(__value) {
              __expected = to_int(__number * to_float!(rule.factor))
              __valid = true
          }
      } else if rule.kind == "hex" {
          __hex = replace(downcase(string(__value) ?? ""), r'^0x', "")
          __integer, __integer_err = parse_int(__hex, base: 16)
          __expected = __integer
          __valid = is_string(__value) && starts_with(downcase(string(__value) ?? ""), "0x") && __integer_err == null
      } else if rule.kind == "enum" {
          __expected = get!(object!(rule.values), [downcase(to_string(__value) ?? "")])
          __valid = __expected != null
      }
      __matches = includes(__represented, encode_json(__expected))
      if is_string(rule.target) { __matches = get!(., split(string!(rule.target), ".")) == __expected }
      if __valid && __matches { __consumed = push(__consumed, __source_key) }
  }
  # END parser-specific transformations
  # Redact at every depth, including objects inside arrays, before serialization.
  __safe = map_values(object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing}))), recursive: true) -> |value| {
      if is_object(value) {
          # Header/parameter arrays commonly encode sensitive keys as name/value
          # or Key/Value objects instead of using the secret name as an object key.
          __sensitive_pair = false
          for_each(object!(value)) -> |key, child| {
              if includes(["name", "key"], downcase(key)) && match(downcase(string(child) ?? ""), r'password|secret|authorization|token') {
                  __sensitive_pair = true
              }
          }
          for_each(object!(value)) -> |key, _child| {
              if match(downcase(key), r'password|secret|authorization|token') || (__sensitive_pair && includes(["value", "values"], downcase(key))) {
                  value = set!(value, [key], "<redacted>")
              }
          }
      }
      value
  }
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  __escaped = map_keys(object!(__safe.source), recursive: true) -> |key| {
      replace(replace(key, "~", "~0"), ".", "~1")
  }
  __flat = flatten(__escaped)
  __residual = {}
  for_each(__flat) -> |key, value| {
      key = replace(replace(key, "~1", "."), "~0", "~")
      __same = includes(__represented, encode_json(value))
      if !is_object(value) && !is_array(value) && !is_null(value) {
          __same = __same || includes(__represented, to_string(value) ?? "")
      }
      # A scalar array is consumed only if every element is represented. Preserve
      # partially represented arrays intact, including their ordering and repeats.
      if is_array(value) && !is_empty(array!(value)) {
          __all_items = true
          for_each(array!(value)) -> |_index, item| {
              __item_same = includes(__represented, encode_json(item))
              if !is_object(item) && !is_array(item) && !is_null(item) {
                  __item_same = __item_same || includes(__represented, to_string(item) ?? "")
              }
              if is_object(item) || is_array(item) || !__item_same { __all_items = false }
          }
          __same = __same || __all_items
      }
      if __same && includes(__candidates, key) { __consumed = push(__consumed, key) }
      # Redacted leaves always remain visible. Do not spill a copy of the raw body.
      if (!includes(__consumed, key) || value == "<redacted>") && value != __raw_body {
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          __base = join!(__parts, ".")
          __key = __base
          __suffix = 2
          if includes(keys(__residual), __key) {
              for_each(__flat) -> |_other_key, _other_value| {
                  if includes(keys(__residual), __key) {
                      __key = __base + "_" + to_string(__suffix)
                      __suffix = __suffix + 1
                  }
              }
          }
          __complex = is_object(value)
          if is_array(value) {
              for_each(array!(value)) -> |_index, item| {
                  if is_object(item) || is_array(item) { __complex = true }
              }
          }
          __spill = if __complex { encode_json(value) } else { value }
          __residual = set!(__residual, [__key], __spill)
      }
  }
  # Keep existing derived evidence, but remove null placeholders and mapped copies.
  # Source-derived aliases are replaced by canonical dotted source paths above.
  __original_values = []
  for_each(flatten(__source_kv)) -> |_key, value| {
      __original_values = push(__original_values, encode_json(value))
      if !is_object(value) && !is_array(value) { __original_values = push(__original_values, to_string(value) ?? "") }
  }
  for_each(flatten(__existing)) -> |key, value| {
      __source_alias = includes(__original_values, encode_json(value)) || includes(__original_values, to_string(value) ?? "")
      __mapped_alias = includes(__represented, encode_json(value)) || includes(__represented, to_string(value) ?? "")
      __decoded, __decode_err = parse_json(string(value) ?? "")
      __encoded_container = __decode_err == null && (is_object(__decoded) || is_array(__decoded))
      if !is_null(value) && value != "" && !__source_alias && !__mapped_alias && !__encoded_container && value != __raw_body {
          # Existing aggregates may contain sensitive descendants; the canonical
          # source spill above is the authoritative representation of containers.
          if !is_array(value) && !is_object(value) && !match(downcase(key), r'password|secret|authorization|token') {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, with recursive
  # redaction. These entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__safe.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

