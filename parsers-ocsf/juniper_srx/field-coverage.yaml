source: text
transforms:
- source: action
  kind: lowercase
  reason: Parser case-normalizes this parsed field when represented in output.
- source: action
  kind: enum
  target: action_id
  values:
    allow: 1
    allowed: 1
    accept: 1
    accepted: 1
    permit: 1
    permitted: 1
    pass: 1
    passed: 1
    deny: 2
    denied: 2
    block: 2
    blocked: 2
    reject: 2
    rejected: 2
    drop: 2
    dropped: 2
    log: 3
    observed: 3
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping;
    consume only when the expected ID is emitted.
- source: threat-severity
  kind: enum
  target: severity
  values:
    critical: Critical
  reason: Parser normalizes the caption case; verify the emitted caption.
probe:
  mode: before
  anchor: ']'
  require: junos@
  text: ' ResidualProbe="nan2421-text-unknown" password="nan2421-secret"'
  source: ResidualProbe
consumed_candidates:
- action
- application
- application-name
- attack-name
- bytes-from-client
- bytes-from-server
- category
- destination-address
- destination-interface-name
- destination-port
- destination-zone-name
- elapsed-time
- header.appname
- header.host
- header.msgid
- header.rest
- header.ts
- nat-destination-address
- nat-destination-port
- nat-source-address
- nat-source-port
- object-name
- packet-incoming-interface
- packets-from-client
- packets-from-server
- policy-name
- protocol-id
- protocol-name
- reason
- repeat-count
- rule-name
- rulebase-name
- service-name
- session-id
- session-id-32
- source-address
- source-interface-name
- source-port
- source-zone-name
- threat-severity
- url
- username
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
