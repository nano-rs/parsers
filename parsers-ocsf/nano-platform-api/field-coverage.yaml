source: json
transforms:
- source: userEmail
  kind: lowercase
  target: actor.user.name
  reason: Case normalization already performed by the parser; observed at actor.user.name, and checked
    against the emitted branch.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  ip:
  - src_endpoint.ip
  method:
  - http_request.http_method
  ms:
  - duration
  msg:
  - message
  path:
  - http_request.url.path
  - http_request.url.url_string
  replica:
  - dst_endpoint.hostname
  reqId:
  - api.request.uid
  - metadata.correlation_uid
  status:
  - api.response.code
  - http_response.code
  - status_code
  time:
  - time
  ua:
  - http_request.user_agent
  userEmail:
  - actor.user.name
  userId:
  - actor.user.uid
