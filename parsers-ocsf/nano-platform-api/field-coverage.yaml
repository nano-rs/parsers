source: json
transforms:
- source: ts
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: userEmail
  kind: lowercase
  reason: Case normalization already performed by the parser; observed at actor.user.name,
    and checked against the emitted branch.
consumed_candidates:
- err.message
- error
- ip
- level
- method
- ms
- msg
- path
- replica
- reqId
- requestId
- status
- time
- ts
- ua
- userEmail
- userId
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
