name: macos_unified_log_ocsf
display_name: macOS Unified Log (OCSF)
version: "1.0.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields in redacted, dotted snake_case unmapped keys.
  Parses macOS unified log entries, one JSON object per entry as written by
  `log show --style ndjson` / `log stream --style ndjson` (subsystem,
  category, processImagePath, processID, messageType, eventMessage, ...),
  into OCSF 1.9.0. The emitting process is actor.process (name, path, pid,
  tid, uid) and messageType sets the severity (Fault High, Error Medium,
  everything else Informational). Security-relevant subsystems with a stable
  message shape are sub-parsed: sshd / sshd-session Accepted, Failed and
  Invalid user -> Authentication (3002) Logon; sudo command and sudo
  failure -> Authentication (3002) Account Switch with the command on
  actor.process.cmd_line; loginwindow doLogin -> Authentication Logon;
  opendirectoryd "Failed to authenticate user" -> Logon failure; authd right
  authorization (Succeeded authorizing / Failed to authorize / Sandbox
  denied) -> Authentication activity Other with the right in service.name,
  the requesting client as actor.process and authd as logon_process; TCC
  "Update Access Record" permission changes -> Entity Management (3004)
  Update with the TCC service and client; Gatekeeper / syspolicyd /
  XProtect verdicts that reject, block or report malware -> Detection
  Finding (2004) with the file path as evidence. Every other entry is a Base
  Event (0) with all fields kept. The JSON array that `log show --style
  json` writes is not split here (send ndjson); an array or a line that is
  not a JSON object, or a JSON object with none of the unified log keys,
  is kept whole as a Base Event marked with unmapped.parse_fallback.
match_values:
  - macos_unified_log
category: endpoint
vendor: "Apple"
product: "macOS"
parser_vrl: |
  # macOS unified log (ndjson) -> OCSF 1.9.0 Authentication (3002) / Entity
  # Management (3004) / Detection Finding (2004) / Base Event (0)
  raw_log = if is_string(.message) { string!(.message) } else { encode_json(.message) }
  __raw_body = raw_log
  __source_kv = {}
  entry = {}
  decoded = false
  if is_object(.message) {
      entry = object!(.message)
      __source_kv = entry
      decoded = true
  } else {
      parsed, perr = parse_json(raw_log)
      if perr == null && is_object(parsed) {
          entry = object!(parsed)
          __source_kv = entry
          decoded = true
      }
  }

  # A JSON object is a unified log entry only if it carries one of the keys
  # `log --style ndjson` always writes; anything else is a misrouted stream.
  if decoded && !(exists(entry.eventMessage) || exists(entry.subsystem) || exists(entry.processImagePath) || exists(entry.messageType) || exists(entry.eventType) || exists(entry.timestamp)) {
      decoded = false
  }

  msg_text = to_string(entry.eventMessage) ?? ""
  subsystem = to_string(entry.subsystem) ?? ""
  category = to_string(entry.category) ?? ""
  cl = downcase(category)
  msg_type = to_string(entry.messageType) ?? ""
  image_path = to_string(entry.processImagePath) ?? ""
  proc_name = to_string(entry.process) ?? ""
  if proc_name == "" && image_path != "" {
      bn, bne = parse_regex(image_path, r'(?P<name>[^/]+)$')
      if bne == null { proc_name = string!(bn.name) }
  }
  pid = to_int(entry.processID) ?? 0
  tid = to_int(entry.threadID) ?? 0
  uid = to_string(entry.userID) ?? ""
  boot_uid = to_string(entry.bootUUID) ?? ""
  # `log` itself writes no host name; a forwarder that adds one is honored.
  host_name = to_string(entry.hostname) ?? to_string(entry.host) ?? ""
  ts_text = to_string(entry.timestamp) ?? ""

  time_ms = to_int(to_unix_timestamp(now(), unit: "milliseconds"))
  if ts_text != "" {
      tp, tpe = parse_timestamp(ts_text, "%Y-%m-%d %H:%M:%S%.f%z")
      if tpe != null { tp, tpe = parse_timestamp(ts_text, "%+") }
      if tpe == null { time_ms = to_unix_timestamp(tp, unit: "milliseconds") }
  }

  severity_id = 1
  severity = "Informational"
  mt = downcase(msg_type)
  if mt == "fault" { severity_id = 4; severity = "High" }
  if mt == "error" { severity_id = 3; severity = "Medium" }

  route = "base"
  activity_id = 99
  activity_name = "Other"
  status_id = 0
  status_str = "Unknown"
  action_id = 0
  action = "Unknown"
  disposition_id = 0
  disposition = "Unknown"
  user_name = ""
  login_uid = ""
  client_path = ""
  client_pid = 0
  auth_creator = ""
  is_authd = false
  actor_user = ""
  src_ip = ""
  src_port = 0
  cmd_line = ""
  status_detail = ""
  service_name = ""
  auth_proto = ""
  tcc_service = ""
  tcc_client = ""
  tcc_value = ""
  file_path = ""
  analytic = ""
  finding_title = ""
  pl = downcase(proc_name)
  sl = downcase(subsystem)

  if (pl == "sshd" || pl == "sshd-session") && msg_text != "" {
      sm, se = parse_regex(msg_text, r'^(?P<result>Accepted|Failed)\s+(?P<method>\S+)\s+for\s+(?:invalid user\s+)?(?P<user>\S+)\s+from\s+(?P<ip>[0-9A-Fa-f.:]+)\s+port\s+(?P<port>\d+)')
      if se == null {
          route = "auth"
          user_name = string!(sm.user)
          src_ip = string!(sm.ip)
          src_port = to_int(sm.port) ?? 0
          auth_proto = string!(sm.method)
          service_name = "sshd"
          activity_id = 1; activity_name = "Logon"
          if sm.result == "Accepted" {
              status_id = 1; status_str = "Success"
              action_id = 1; action = "Allowed"; disposition_id = 1; disposition = "Allowed"
          } else {
              status_id = 2; status_str = "Failure"
              action_id = 2; action = "Denied"; disposition_id = 2; disposition = "Blocked"
          }
      } else {
          im, ie = parse_regex(msg_text, r'^Invalid user\s+(?P<user>\S*)\s+from\s+(?P<ip>[0-9A-Fa-f.:]+)\s+port\s+(?P<port>\d+)')
          if ie == null {
              route = "auth"
              user_name = string!(im.user)
              src_ip = string!(im.ip)
              src_port = to_int(im.port) ?? 0
              service_name = "sshd"
              activity_id = 1; activity_name = "Logon"
              status_id = 2; status_str = "Failure"; status_detail = "Invalid user"
              action_id = 2; action = "Denied"; disposition_id = 2; disposition = "Blocked"
          }
      }
  } else if pl == "sudo" && msg_text != "" {
      dm, de = parse_regex(msg_text, r'^\s*(?P<user>\S+)\s*:\s+(?:(?P<reason>[^;]*?)\s*;\s+)?TTY=(?P<tty>\S+)\s*;\s*PWD=(?P<pwd>.*?)\s*;\s*USER=(?P<target>\S+)(?P<extra>(?:\s*;\s*[A-Z_]+=[^;]*?)*)\s*;\s*COMMAND=(?P<command>.*?)\s*$')
      if de == null {
          route = "auth"
          actor_user = string!(dm.user)
          user_name = string!(dm.target)
          cmd_line = string!(dm.command)
          service_name = "sudo"
          activity_id = 7; activity_name = "Account Switch"
          reason = string(dm.reason) ?? ""
          if reason == "" {
              status_id = 1; status_str = "Success"
              action_id = 1; action = "Allowed"; disposition_id = 1; disposition = "Allowed"
          } else {
              status_id = 2; status_str = "Failure"; status_detail = reason
              action_id = 2; action = "Denied"; disposition_id = 2; disposition = "Blocked"
          }
      }
  } else if pl == "loginwindow" && msg_text != "" {
      lm, le = parse_regex(msg_text, r'doLogin\x5D\s*\|\s*shortUsername = (?P<user>[^,]+), userID = (?P<uid>-?\d+)')
      if le == null {
          route = "auth"
          user_name = string!(lm.user)
          login_uid = string!(lm.uid)
          activity_id = 1; activity_name = "Logon"
          status_id = 1; status_str = "Success"
          service_name = "loginwindow"
      }
  } else if pl == "opendirectoryd" && msg_text != "" {
      om, oe = parse_regex(msg_text, r'^Failed to authenticate user\s+<?(?P<user>[^>\s]+)>?\s*(?:\x28error:\s*(?P<code>-?\d+)\x29)?')
      if oe == null {
          route = "auth"
          user_name = string!(om.user)
          activity_id = 1; activity_name = "Logon"
          status_id = 2; status_str = "Failure"
          if om.code != null { status_detail = "error " + string!(om.code) }
          action_id = 2; action = "Denied"; disposition_id = 2; disposition = "Blocked"
          service_name = "opendirectoryd"
      }
  } else if (pl == "authd" || sl == "com.apple.authorization") && msg_text != "" {
      am, ae = parse_regex(msg_text, r'^(?P<result>Succeeded authorizing|Failed to authorize|Sandbox denied authorizing) right\s+\x27(?P<right>[^\x27]+)\x27\s+by client\s+\x27(?P<client>[^\x27]+)\x27(?:\s+\x5B(?P<client_pid>\d+)\x5D)?(?:\s+for authorization created by\s+\x27(?P<creator>[^\x27]+)\x27)?(?:.*?\x28(?P<code>-\d+)\x29)?')
      if ae == null {
          route = "auth"
          service_name = string!(am.right)
          # the requesting client is the actor; authd itself is the logon process
          client_path = string!(am.client)
          client_pid = to_int(am.client_pid) ?? 0
          if am.creator != null { auth_creator = string!(am.creator) }
          is_authd = true
          activity_id = 99; activity_name = "Other"
          if am.result == "Succeeded authorizing" {
              status_id = 1; status_str = "Success"
              action_id = 1; action = "Allowed"; disposition_id = 1; disposition = "Allowed"
          } else {
              status_id = 2; status_str = "Failure"
              if am.code != null { status_detail = "OSStatus " + string!(am.code) }
              action_id = 2; action = "Denied"; disposition_id = 2; disposition = "Blocked"
          }
      }
  } else if (sl == "com.apple.tcc" || pl == "tccd") && msg_text != "" {
      tm, te = parse_regex(msg_text, r'Update Access Record:\s+(?P<service>kTCCService[A-Za-z0-9]+)\s+for\s+(?P<client>\S+)\s+to\s+(?P<value>[A-Za-z]+)')
      if te == null {
          route = "tcc"
          tcc_service = string!(tm.service)
          tcc_client = string!(tm.client)
          tcc_value = string!(tm.value)
      }
  } else if (contains(sl, "systempolicy") || contains(sl, "xprotect") || pl == "syspolicyd" || contains(pl, "xprotect") || cl == "gatekeeper" || cl == "xprotect") && msg_text != "" {
      # an "allowed" verdict is not a finding, but "not allowed" is a block
      negative = match(msg_text, r'(?i)\bmalware\b|\b(?:rejected|blocked|denied|not allowed|quarantin\w*)\b')
      allowed_verdict = match(msg_text, r'(?i)result:\s*allowed|\ballowed\s*$') && !match(msg_text, r'(?i)\bnot\s+allowed\b')
      if negative && !allowed_verdict {
          route = "finding"
          analytic = if contains(sl, "xprotect") || contains(pl, "xprotect") || cl == "xprotect" { "XProtect" } else { "Gatekeeper" }
          # an app bundle path may contain spaces; any other path ends at whitespace
          fm, fe = parse_regex(msg_text, r'(?P<path>/[^:,\x28\x29]*?\.app)\b')
          if fe != null { fm, fe = parse_regex(msg_text, r'(?P<path>/[^\s:,\x28\x29]+)') }
          if fe == null { file_path = string!(fm.path) }
          finding_title = analytic + ": " + msg_text
          if length(finding_title) > 200 { finding_title = slice!(finding_title, 0, 200) }
      }
  }

  metadata = {
      "version": "1.9.0",
      "uid": sha2("macos_unified_log|raw|" + raw_log, variant: "SHA-256"),
      "log_name": "unified_log",
      "product": { "name": "macOS", "vendor_name": "Apple" }
  }
  if subsystem != "" { metadata.log_provider = subsystem }
  if msg_type != "" { metadata.log_level = msg_type }
  if ts_text != "" { metadata.original_time = ts_text }

  device = {}
  if host_name != "" {
      device = { "hostname": host_name, "type_id": 0, "type": "Unknown", "os": { "name": "macOS", "type_id": 300, "type": "macOS" } }
      if boot_uid != "" { device.boot_uid = boot_uid }
  }

  proc = {}
  if proc_name != "" { proc.name = proc_name }
  if image_path != "" { proc.path = image_path }
  if pid > 0 { proc.pid = pid }
  if tid > 0 { proc.tid = tid }
  if uid != "" { proc.user = { "uid": uid } }
  if cmd_line != "" { proc.cmd_line = cmd_line }
  actor = {}
  if length(proc) > 0 { actor.process = proc }
  if actor_user != "" { actor.user = { "name": actor_user } }

  base = {
      "time": time_ms,
      "raw_data": raw_log,
      "metadata": metadata,
      "severity_id": severity_id,
      "severity": severity
  }
  if msg_text != "" { base.message = msg_text }

  if route == "auth" {
      if status_id == 2 && severity_id < 3 { severity_id = 3; severity = "Medium" }
      # authd names no subject user (entry.userID is authd's own uid)
      if user_name == "" { user_name = "unknown" }
      subject = { "name": user_name }
      if login_uid != "" { subject.uid = login_uid }
      . = merge(base, {
          "class_uid": 3002, "class_name": "Authentication",
          "category_uid": 3, "category_name": "Identity & Access Management",
          "activity_id": activity_id, "activity_name": activity_name,
          "type_uid": 300200 + activity_id,
          "severity_id": severity_id, "severity": severity,
          "status_id": status_id, "status": status_str,
          "user": subject
      })
      if action_id > 0 {
          .action_id = action_id; .action = action
          .disposition_id = disposition_id; .disposition = disposition
          .metadata.profiles = ["security_control"]
      }
      if status_detail != "" { .status_detail = status_detail }
      if service_name != "" { .service = { "name": service_name } }
      if auth_proto != "" { .auth_protocol = auth_proto; .auth_protocol_id = 99 }
      if src_ip != "" {
          .is_remote = true
          .src_endpoint = { "ip": src_ip }
          if src_port > 0 { .src_endpoint.port = src_port }
      }
      if activity_id == 7 { .account_switch_type_id = 99; .account_switch_type = "sudo" }
      if is_authd {
          cproc = { "path": client_path }
          cn, cne = parse_regex(client_path, r'(?P<name>[^/]+)$')
          if cne == null { cproc.name = cn.name }
          if client_pid > 0 { cproc.pid = client_pid }
          actor = { "process": cproc }
          if pid > 0 { .logon_process = proc }
          # key must not contain "authorization": the residual spill's secret
          # filter drops any unmapped key matching it
          if auth_creator != "" { . = set!(., ["unmapped", "authd_creator_path"], auth_creator) }
      }
  } else if route == "tcc" {
      . = merge(base, {
          "class_uid": 3004, "class_name": "Entity Management",
          "category_uid": 3, "category_name": "Identity & Access Management",
          "activity_id": 3, "activity_name": "Update",
          "type_uid": 300403,
          "status_id": 1, "status": "Success",
          "entity": { "name": tcc_service, "type": "TCC access record", "uid": tcc_client, "data": { "auth_value": tcc_value } }
      })
      if severity_id < 2 { .severity_id = 2; .severity = "Low" }
  } else if route == "finding" {
      ev = {}
      if length(proc) > 0 { ev.process = proc }
      if file_path != "" {
          fnm, fne = parse_regex(file_path, r'(?P<name>[^/]+)/?$')
          fobj = { "path": file_path, "type_id": 1, "type": "Regular File" }
          if fne == null { fobj.name = fnm.name }
          if ends_with(file_path, ".app") { fobj.type_id = 2; fobj.type = "Folder" }
          ev.file = fobj
      }
      fsev_id = 3
      fsev = "Medium"
      if match(msg_text, r'(?i)\bmalware\b') { fsev_id = 4; fsev = "High" }
      . = merge(base, {
          "class_uid": 2004, "class_name": "Detection Finding",
          "category_uid": 2, "category_name": "Findings",
          "activity_id": 1, "activity_name": "Create",
          "type_uid": 200401,
          "severity_id": fsev_id,
          "severity": fsev,
          "status_id": 1, "status": "New",
          "action_id": 2, "action": "Denied",
          "disposition_id": 2, "disposition": "Blocked",
          "finding_info": {
              "uid": sha2("macos_unified_log|finding|" + raw_log, variant: "SHA-256"),
              "title": finding_title,
              "analytic": { "name": analytic, "type_id": 1, "type": "Rule" }
          },
          "evidences": [ev]
      })
      .metadata.profiles = ["security_control"]
  } else {
      . = merge(base, {
          "class_uid": 0, "class_name": "Base Event",
          "category_uid": 0, "category_name": "Uncategorized",
          "activity_id": 99, "activity_name": "Other",
          "type_uid": 99,
          "status_id": 0, "status": "Unknown"
      })
      if !decoded { . = set!(., ["unmapped", "parse_fallback"], "not a unified log ndjson object") }
  }
  if decoded {
      # actor (and device) on Base Event / Detection Finding come from the host profile
      if length(actor) > 0 { .actor = actor }
      if length(device) > 0 { .device = device }
      if length(actor) > 0 || length(device) > 0 {
          .metadata.profiles = push(array(.metadata.profiles) ?? [], "host")
      }
  }

  .

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # Exact value representation is evaluated AFTER branch selection. Numeric strings
  # count as represented by their typed scalar; other transformations are explicit.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The value sets below are strings
  # instead (a read shares the buffer): "," + encode_json(member) per member, and
  # contains(set, "," + encode_json(x)) is exact membership. Every member is a
  # JSON text, inside which a '"' is always escaped, so ',"' only ever starts a
  # member, and a JSON string ends at its first unescaped '"'. The fixed candidate
  # set is a regex literal, compiled once with the program.
  # __mapped holds only JSON types, so to_string equals encode_json for an integer
  # or a boolean and only strings and floats add a second member.
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped_json = encode_json(__mapped)
  __mapped = object!(parse_json!(__mapped_json))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __safe = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __safe_json = encode_json(__safe)
  # Object and array members are encodings: an empty object, an object that
  # opens with a quoted key, or an array. A lookup can ask for one only when some
  # source or existing value is an array, or a string spelling one of those
  # openings, and the regex below finds either in the JSON text (brackets are
  # written as hex escapes because nano's deploy check counts them raw).
  # Otherwise the scalar nodes suffice; a Sysmon GUID, a brace-wrapped string
  # with no quoted key, is no object member. The leaves of flatten(), with arrays
  # flattened too, are every scalar node unless a key holds a literal '.' (in
  # compact JSON only a key is followed by ':').
  # Their encodings, unwrapped from the array, already are the string members.
  __represented = ""
  __nodes = __mapped
  if !match(__safe_json, r'"(?:\x7B\\"|\x7B\x7D"|\x5B)|[:,\x5B]\x5B') && !match(__mapped_json, r'\.(?:[^"\\]|\\.)*":') {
      __leaves = flatten(values(flatten(__mapped)))
      __leaves_json = encode_json(__leaves)
      if match(__leaves_json, r'\x7B') {
          # An object inside an array: walk the leaves, objects whole.
          __nodes = __leaves
      } else {
          __nodes = []
          __members = map_values(__leaves) -> |value| {
              if is_float(value) {
                  encode_json(encode_json(value)) + "," + encode_json(to_string!(value))
              } else {
                  encode_json(encode_json(value))
              }
          }
          __represented = "," + join!(__members, ",") + "," + slice!(__leaves_json, 1, -1)
      }
  }
  __walk = map_values(__nodes, recursive: true) -> |value| {
      __json = encode_json(value)
      if is_string(value) {
          # A string's second member is the string itself, encoded: __json.
          __represented = __represented + ("," + encode_json(__json) + "," + __json)
      } else if is_float(value) {
          __represented = __represented + ("," + encode_json(__json) + "," + encode_json(to_string!(value)))
      } else {
          __represented = __represented + ("," + encode_json(__json))
      }
      value
  }
  __consumed = ""
  # BEGIN parser-specific transformations
  # Only source keys read by this parser are eligible for exact-value consumption; the selected branch must emit the value. Unknown keys always spill, even when their value equals an OCSF default.
  __candidates = r'(?x)
  \A(?:
    eventMessage
  | subsystem
  | messageType
  | processImagePath
  | process
  | processID
  | threadID
  | userID
  | bootUUID
  | timestamp
  | hostname
  | host
  )\z'
  __preserve = []
  # END parser-specific transformations
  # Redact at every depth, including objects inside arrays, before serialization.
  # Redaction needs a sensitive word in a key or a name/key value, and encode_json
  # never escapes a letter, so text without one of the words needs no walk.
  if match(downcase(__safe_json), r'password|secret|authorization|token') {
      __safe = map_values(__safe, recursive: true) -> |value| {
          if is_object(value) {
              # Header/parameter arrays commonly encode sensitive keys as name/value
              # or Key/Value objects instead of using the secret name as an object key.
              __sensitive_pair = false
              for_each(object!(value)) -> |key, child| {
                  if includes(["name", "key"], downcase(key)) && match(downcase(string(child) ?? ""), r'password|secret|authorization|token') {
                      __sensitive_pair = true
                  }
              }
              for_each(object!(value)) -> |key, _child| {
                  if match(downcase(key), r'password|secret|authorization|token') || (__sensitive_pair && includes(["value", "values"], downcase(key))) {
                      value = set!(value, [key], "<redacted>")
                  }
              }
          }
          value
      }
  }
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__safe.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # Fast path: when no two source keys decode to the same key and no two spilled
  # keys get the same name, each key's decision depends only on its own value, so
  # one filter and one rename build the residual without copying it per key.
  __distinct = true
  if __tilde {
      __distinct = length(map_keys(__flat) -> |key| { replace(replace(key, "~1", "."), "~0", "~") }) == length(__flat)
  }
  __kept = {}
  __names = {}
  if __distinct {
      __kept = filter(__flat) -> |key, value| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          # A key is kept unless it is consumed: by a transformation above, or as a
          # candidate whose value is represented. Redacted leaves always remain
          # visible. Do not spill a copy of the raw body.
          if value == __raw_body {
              false
          } else if value == "<redacted>" {
              true
          } else if contains(__consumed, "," + encode_json(key)) {
              false
          } else if !match(key, __candidates) {
              true
          } else {
              # flatten stops at arrays, so objects inside an array still carry the
              # escaped keys: decode them too, or `a.b` spills as `a~1b` (NAN-3604).
              if __tilde && (is_array(value) || is_object(value)) {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __same = contains(__represented, "," + encode_json(encode_json(value)))
              if !__same && (is_string(value) || is_float(value)) {
                  __same = contains(__represented, "," + encode_json(to_string!(value)))
              }
              # A scalar array is consumed only if every element is represented. Preserve
              # partially represented arrays intact, including their ordering and repeats.
              if !__same && is_array(value) && !is_empty(array!(value)) {
                  __same = true
                  for_each(array!(value)) -> |_index, item| {
                      if __same {
                          if is_object(item) || is_array(item) {
                              __same = false
                          } else if !contains(__represented, "," + encode_json(encode_json(item))) {
                              __same = (is_string(item) || is_float(item)) && contains(__represented, "," + encode_json(to_string!(item)))
                          }
                      }
                  }
              }
              !__same
          }
      }
      __names = map_keys(__kept) -> |key| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          join!(__parts, ".")
      }
  }
  __residual = {}
  if __distinct && length(__names) == length(__kept) {
      __residual = map_values(__names) -> |value| {
          if is_array(value) || is_object(value) {
              if __tilde {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              if __complex { value = encode_json(value) }
          }
          value
      }
  } else {
      # Slow path, in source key order: a decoded key consumed earlier stays
      # consumed, and a name already taken gets the next free _2, _3, ... suffix.
      for_each(__flat) -> |key, value| {
          key = replace(replace(key, "~1", "."), "~0", "~")
          if is_array(value) || is_object(value) {
              value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                  replace(replace(inner, "~1", "."), "~0", "~")
              }, ["v"])
          }
          __same = contains(__represented, "," + encode_json(encode_json(value)))
          if !__same && (is_string(value) || is_float(value)) {
              __same = contains(__represented, "," + encode_json(to_string!(value)))
          }
          if !__same && is_array(value) && !is_empty(array!(value)) {
              __same = true
              for_each(array!(value)) -> |_index, item| {
                  if __same {
                      if is_object(item) || is_array(item) {
                          __same = false
                      } else if !contains(__represented, "," + encode_json(encode_json(item))) {
                          __same = (is_string(item) || is_float(item)) && contains(__represented, "," + encode_json(to_string!(item)))
                      }
                  }
              }
          }
          __token = "," + encode_json(key)
          if __same && match(key, __candidates) { __consumed = __consumed + ("," + encode_json(key)) }
          if (!contains(__consumed, __token) || value == "<redacted>") && value != __raw_body {
              __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
              __base = join!(__parts, ".")
              __key = __base
              __suffix = 2
              if includes(keys(__residual), __key) {
                  for_each(__flat) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __key) {
                          __key = __base + "_" + to_string(__suffix)
                          __suffix = __suffix + 1
                      }
                  }
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              __spill = if __complex { encode_json(value) } else { value }
              __residual = set!(__residual, [__key], __spill)
          }
      }
  }
  # Keep existing derived evidence, but remove null placeholders and mapped copies.
  # Source-derived aliases are replaced by canonical dotted source paths above.
  # Existing aggregates may contain sensitive descendants; the canonical source
  # spill above is the authoritative representation of containers. The cheap
  # conditions run first; the source value set is built on first use.
  __original_values = null
  for_each(flatten(__existing)) -> |key, value| {
      if !is_null(value) && value != "" && !is_array(value) && !is_object(value) && value != __raw_body && !match(downcase(key), r'password|secret|authorization|token') {
          # Members for the value itself and for to_string(value), as above.
          __json = encode_json(value)
          __as_json = "," + encode_json(__json)
          __as_string = __as_json
          if is_string(value) { __as_string = "," + __json } else if is_float(value) { __as_string = "," + encode_json(to_string!(value)) }
          if __original_values == null {
              # __source_kv may hold non-JSON types (a timestamp), so only an
              # integer or a boolean skips its to_string member here.
              __original_values = join!(map_values(values(flatten(__source_kv))) -> |source_value| {
                  __source_json = encode_json(source_value)
                  __tokens = "," + encode_json(__source_json)
                  if is_string(source_value) {
                      __tokens = __tokens + "," + __source_json
                  } else if !is_object(source_value) && !is_array(source_value) && !is_integer(source_value) && !is_boolean(source_value) {
                      __tokens = __tokens + "," + encode_json(to_string(source_value) ?? "")
                  }
                  __tokens
              }, "")
          }
          __source_set = string!(__original_values)
          __keep = !contains(__source_set, __as_json) && !contains(__source_set, __as_string)
          __keep = __keep && !contains(__represented, __as_json) && !contains(__represented, __as_string)
          # Only text opening an object or an array (after JSON whitespace)
          # decodes to a container.
          if __keep && is_string(value) && match(string!(value), r'^[ \t\n\r]*[\x5B\x7B]') {
              __decoded, __decode_err = parse_json(string!(value))
              __keep = !(__decode_err == null && (is_object(__decoded) || is_array(__decoded)))
          }
          if __keep {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, with recursive
  # redaction. These entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__safe.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

