source: json
transforms:
- source: eventTimestamp
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: level
  kind: enum
  target: severity_id
  values:
    informational: 1
    info: 1
    debug: 1
    low: 2
    medium: 3
    warn: 3
    warning: 3
    high: 4
    error: 4
    critical: 5
    fatal: 6
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when
    the expected ID is emitted.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  caller:
  - actor.user.email_addr
  - actor.user.name
  - actor.user.uid
  callerType:
  - actor.user.type
  claims.appid:
  - actor.app_uid
  correlationId:
  - metadata.correlation_uid
  eventName.value:
  - api.operation
  httpRequest.clientIpAddress:
  - src_endpoint.ip
  httpRequest.clientRequestId:
  - http_request.uid
  httpRequest.method:
  - http_request.http_method
  httpRequest.uri:
  - http_request.url.url_string
  operationId:
  - api.request.uid
  operationName.value:
  - api.operation
  properties.statusCode:
  - api.response.error
  - status_code
  properties.statusMessage:
  - status_detail
  resourceGroupName:
  - resources.group.name
  resourceId:
  - resources.uid
  resourceLocation:
  - cloud.region
  - resources.region
  resourceName:
  - resources.name
  resourceProviderName.value:
  - api.service.name
  resourceType.value:
  - resources.type
  subscriptionId:
  - cloud.account.uid
  - resources.namespace
  subscriptionName:
  - cloud.account.name
  tenantId:
  - cloud.org.uid
