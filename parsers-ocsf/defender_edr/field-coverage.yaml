- source: LogonType
  target: logon_type_id
  kind: enum
  values:
    interactive: 2
    network: 3
    batch: 4
    service: 5
    unlock: 7
    networkcleartext: 8
    newcredentials: 9
    remoteinteractive: 10
    cachedinteractive: 11
  reason: Authentication branch translates Defender logon names into OCSF logon_type_id.
- source: Protocol
  target: connection_info.protocol_num
  kind: enum
  values:
    tcp: 6
    udp: 17
    icmp: 1
  reason: Network branch translates protocol names to IANA numbers.
- source: RemediationAction
  target: disposition_id
  kind: enum
  values:
    block: 2
    blocked: 2
    quarantine: 3
    quarantined: 3
    remove: 5
    removed: 5
    allow: 1
    allowed: 1
  reason: Finding branch maps remediation to security-control disposition.
- source: AlertState
  target: status_id
  kind: enum
  values:
    new: 1
    inprogress: 2
    in progress: 2
    resolved: 4
    suppressed: 3
    dismissed: 3
  reason: Finding branch normalizes the finding lifecycle state.
- source: Severity
  target: severity_id
  kind: enum
  values:
    informational: 1
    low: 2
    medium: 3
    high: 4
  reason: Vendor severity is normalized to the OCSF severity enumeration.
