source: json
transforms:
- source: ts
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: messageTime
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: clickTime
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  clickIP:
  - src_endpoint.ip
  connection.country:
  - src_endpoint.location.country
  connection.host:
  - src_endpoint.hostname
  connection.ip:
  - src_endpoint.ip
  envelope.from:
  - email.from
  envelope.rcpts:
  - email.to
  filter.modules.spam.scores.overall:
  - risk_score
  guid:
  - email.uid
  - metadata.original_event_uid
  - metadata.uid
  malwareScore:
  - risk_score
  messageID:
  - email.message_uid
  - metadata.original_event_uid
  messageSize:
  - email.size
  msg.header.message-id:
  - email.message_uid
  msg.normalizedHeader.subject:
  - email.subject
  msg.sizeBytes:
  - email.size
  recipient:
  - email.to
  sender:
  - email.from
  senderIP:
  - src_endpoint.ip
  subject:
  - email.subject
  - message
  threatURL:
  - email.urls.url_string
  type:
  - message
  - metadata.event_code
  url:
  - email.urls.url_string
