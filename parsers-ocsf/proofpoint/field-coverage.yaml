source: json
transforms:
- source: filter.routeDirection
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value
    is emitted.
- source: filter.modules.spam.disposition
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value
    is emitted.
- source: threatStatus
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value
    is emitted.
- source: ts
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: messageTime
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: clickTime
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: threatStatus
  kind: enum
  target: disposition
  values:
    blocked: Blocked
  reason: Parser normalizes the caption case; verify the emitted caption.
consumed_candidates:
- campaignId
- classification
- clickIP
- clickTime
- connection
- connection.country
- connection.helo
- connection.host
- connection.ip
- connection.protocol
- envelope
- envelope.from
- envelope.rcpts
- filter
- filter.disposition
- filter.modules
- filter.modules.spam
- filter.modules.spam.disposition
- filter.modules.spam.scores
- filter.modules.spam.scores.classifiers.malware
- filter.modules.spam.scores.classifiers.phish
- filter.modules.spam.scores.overall
- filter.modules.spam.verdict
- filter.modules.urldefense.counts.rewritten
- filter.routeDirection
- guid
- headerFrom
- impostorScore
- malwareScore
- messageID
- messageParts
- messageSize
- messageTime
- modulesRun
- msg
- msg.header.message-id
- msg.normalizedHeader.subject
- msg.sizeBytes
- phishScore
- quarantineFolder
- quarantineRule
- recipient
- sender
- senderIP
- spamScore
- subject
- threatID
- threatStatus
- threatURL
- threatsInfoMap
- ts
- type
- url
- userAgent
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
