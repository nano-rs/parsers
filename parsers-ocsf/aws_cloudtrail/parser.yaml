name: aws_cloudtrail_ocsf
display_name: AWS CloudTrail (OCSF)
version: "1.1.0"
description: >
  Parses AWS CloudTrail management events into complete OCSF 1.8.0
  "API Activity" (class_uid 6003) records. The whole OCSF object is emitted on
  the root so it lands in ocsf_logs.event and the promoted columns materialize
  (api.service.name, api.operation, cloud.*, resources[], src_endpoint, actor).
  Mirrors the UDM aws_cloudtrail parser but targets OCSF instead of `.udm.*`.
match_values:
  - aws_cloudtrail
category: cloud
vendor: "Amazon"
product: "AWS CloudTrail"
parser_vrl: |
  # AWS CloudTrail JSON -> OCSF 1.8.0 API Activity (class_uid 6003).
  raw_log = string!(.message)
  parsed, err = parse_json(raw_log)

  if err != null || !is_object(parsed) {
      . = {
          "class_uid": 6003,
          "category_uid": 6,
          "activity_id": 99,
          "type_uid": 600399,
          "severity_id": 1,
          "status_id": 0,
          "time": 0,
          "message": raw_log,
          "metadata": {
              "version": "1.8.0",
              # NAN-3702: deterministic, so a redelivered unparseable record
              # dedupes in the lake instead of landing as a second row.
              "uid": sha2("aws_cloudtrail|raw|" + raw_log, variant: "SHA-256"),
              "log_level": "error",
              "product": { "name": "AWS CloudTrail", "vendor_name": "Amazon" }
          }
      }
  } else {
      p = object!(parsed)
      ui = object(p.userIdentity) ?? {}
      nano = object(p._nanosiem) ?? {}

      class_uid = 6003

      # ---- activity_id: CRUD from changeType / readOnly ----
      change = downcase(string(nano.changeType) ?? "")
      read_only = if is_boolean(p.readOnly) { bool(p.readOnly) ?? false } else { false }
      activity_id = 99
      activity_name = "Other"
      if change == "create" { activity_id = 1; activity_name = "Create" }
      if change == "read"   { activity_id = 2; activity_name = "Read" }
      if change == "update" { activity_id = 3; activity_name = "Update" }
      if change == "delete" { activity_id = 4; activity_name = "Delete" }
      if activity_id == 99 && read_only { activity_id = 2; activity_name = "Read" }

      # ---- AWS service token out of eventSource ("ec2.amazonaws.com" -> "ec2") ----
      event_source = string(p.eventSource) ?? ""
      svc = ""
      sm, smerr = parse_regex(event_source, r'^(?P<s>[^.]+)')
      if smerr == null { svc = string(sm.s) ?? "" }
      if svc == "" { svc = string(nano.cloudService) ?? "" }

      # ---- outcome: errorCode present -> Failure ----
      error_code = string(p.errorCode) ?? ""
      status_id = 1
      status_str = string(nano.status) ?? "Success"
      severity_id = 1
      severity = "Informational"
      if error_code != "" {
          status_id = 2
          status_str = "Failure"
          severity_id = 2
          severity = "Low"
      }

      # ---- time: eventTime ISO8601 -> epoch ms ----
      time_ms = 0
      ts_str = string(p.eventTime) ?? ""
      if ts_str != "" {
          t, terr = parse_timestamp(ts_str, "%+")
          if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
      }

      # ---- resources[]: CloudTrail {type, ARN} -> OCSF {type, uid, name} ----
      res_in = array(p.resources) ?? []
      resources = map_values(res_in) -> |r| {
          arn = string(r.ARN) ?? ""
          rname = ""
          rm, rmerr = parse_regex(arn, r'(?P<n>[^:/]+)$')
          if rmerr == null { rname = string(rm.n) ?? "" }
          { "type": string(r.type) ?? "", "uid": arn, "name": rname }
      }

      # ---- caller identity ----
      caller = string(nano.callerName) ?? string(ui.userName) ?? ""
      caller_uid = string(ui.arn) ?? string(ui.principalId) ?? ""

      mfa = if is_boolean(nano.mfaAuthenticated) { bool(nano.mfaAuthenticated) ?? false } else { false }

      # NAN-3702: the lake drops a row whose (event hour, metadata.uid) it has
      # already stored, so the uid must be the same every time the same record
      # arrives (S3/SQS redelivery, Pub/Sub retry, overlapping pulls). eventID
      # stays the uid when present, unchanged; a record without one (or with an
      # empty one) hashes its raw body, which a redelivery repeats byte for byte.
      event_uid = string(p.eventID) ?? ""
      if event_uid == "" { event_uid = sha2("aws_cloudtrail|raw|" + raw_log, variant: "SHA-256") }

      ocsf = {
          "class_uid": class_uid,
          "class_name": "API Activity",
          "category_uid": 6,
          "category_name": "Application Activity",
          "activity_id": activity_id,
          "activity_name": activity_name,
          "type_uid": class_uid * 100 + activity_id,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": status_id,
          "status": status_str,
          "time": time_ms,
          "message": raw_log,
          "metadata": {
              "version": "1.8.0",
              "uid": event_uid,
              "log_name": "CloudTrail",
              "log_provider": "AWS CloudTrail",
              "correlation_uid": string(p.requestID) ?? "",
              "product": { "name": "AWS CloudTrail", "vendor_name": "Amazon" }
          },
          "api": {
              "operation": string(p.eventName) ?? "",
              "service": { "name": svc }
          },
          "cloud": {
              "provider": "AWS",
              "region": string(p.awsRegion) ?? "",
              "account": {
                  "uid": string(p.recipientAccountId) ?? string(ui.accountId) ?? "",
                  "name": string(nano.accountAlias) ?? ""
              }
          },
          "actor": {
              "user": {
                  "name": caller,
                  "uid": caller_uid,
                  "type": string(ui.type) ?? ""
              }
          }
      }

      # src_endpoint is REQUIRED on API Activity 6003 — always emit it.
      ocsf.src_endpoint = { "ip": downcase(string(p.sourceIPAddress) ?? "") }

      ua = string(p.userAgent) ?? ""
      if ua != "" { ocsf.http_request = { "user_agent": ua } }

      if length(resources) > 0 { ocsf.resources = resources }

      # is_mfa is NOT an API Activity attribute (it's auth-specific) -> unmapped.
      unmapped = { "mfa_authenticated": mfa }
      if error_code != "" {
          unmapped.error_code = error_code
          unmapped.error_message = string(p.errorMessage) ?? null
      }
      ocsf.unmapped = unmapped

      . = ocsf
  }
samples:
  # NAN-3702: eventID stays the uid when present, so existing uids do not move.
  - raw: "{\"eventVersion\":\"1.08\",\"eventID\":\"3f1c2a4e-8d4b-4c59-9a1e-0f6b7c8d9e01\",\"eventTime\":\"2026-09-28T17:00:00Z\",\"eventSource\":\"secretsmanager.amazonaws.com\",\"eventName\":\"CreateSecret\",\"awsRegion\":\"us-east-1\",\"sourceIPAddress\":\"10.0.1.10\",\"userAgent\":\"aws-cli/2.15\",\"readOnly\":false,\"recipientAccountId\":\"456789012345\",\"requestID\":\"req-1\",\"eventType\":\"AwsApiCall\",\"userIdentity\":{\"type\":\"AssumedRole\",\"principalId\":\"AROAEXAMPLE:session-1\",\"arn\":\"arn:aws:sts::456789012345:assumed-role/app/session-1\",\"accountId\":\"456789012345\"}}"
    expect:
      "class_uid": 6003
      "metadata.uid": "3f1c2a4e-8d4b-4c59-9a1e-0f6b7c8d9e01"
  # NAN-3702: no eventID: the raw record is hashed.
  - raw: "{\"eventVersion\":\"1.08\",\"eventTime\":\"2026-09-28T17:00:00Z\",\"eventSource\":\"secretsmanager.amazonaws.com\",\"eventName\":\"CreateSecret\",\"awsRegion\":\"us-east-1\",\"sourceIPAddress\":\"10.0.1.10\",\"userAgent\":\"aws-cli/2.15\",\"readOnly\":false,\"recipientAccountId\":\"456789012345\",\"requestID\":\"req-1\",\"eventType\":\"AwsApiCall\",\"userIdentity\":{\"type\":\"AssumedRole\",\"principalId\":\"AROAEXAMPLE:session-1\",\"arn\":\"arn:aws:sts::456789012345:assumed-role/app/session-1\",\"accountId\":\"456789012345\"}}"
    expect:
      "class_uid": 6003
      "metadata.uid": "06cc283969029b80dbdee5ed61387867fc0734862e5a9e58f10e06a58b86f456"
  # NAN-3702: empty eventID counts as missing: the raw record is hashed.
  - raw: "{\"eventVersion\":\"1.08\",\"eventID\":\"\",\"eventTime\":\"2026-09-28T17:00:00Z\",\"eventSource\":\"secretsmanager.amazonaws.com\",\"eventName\":\"CreateSecret\",\"awsRegion\":\"us-east-1\",\"sourceIPAddress\":\"10.0.1.10\",\"userAgent\":\"aws-cli/2.15\",\"readOnly\":false,\"recipientAccountId\":\"456789012345\",\"requestID\":\"req-1\",\"eventType\":\"AwsApiCall\",\"userIdentity\":{\"type\":\"AssumedRole\",\"principalId\":\"AROAEXAMPLE:session-1\",\"arn\":\"arn:aws:sts::456789012345:assumed-role/app/session-1\",\"accountId\":\"456789012345\"}}"
    expect:
      "class_uid": 6003
      "metadata.uid": "8707073894de6de9772aecf121b6a55cd22ec2145280b402299e764bfc4d2c2c"
  # NAN-3702: unparseable record (error branch).
  - raw: "not json at all"
    expect:
      "metadata.log_level": "error"
      "metadata.uid": "58351a9c5d9ceedc418d3c559220e83bb5f573f63120432664543d2c06616225"
