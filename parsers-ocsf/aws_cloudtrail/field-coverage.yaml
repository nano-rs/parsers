source: json
transforms:
- source: sourceIPAddress
  kind: lowercase
  target: src_endpoint.hostname
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: sourceIPAddress
  kind: lowercase
  target: src_endpoint.ip
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: eventTime
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  _nanosiem.accountAlias:
  - cloud.account.name
  _nanosiem.callerName:
  - actor.user.name
  _nanosiem.mfaAuthenticated:
  - actor.session.is_mfa
  _nanosiem.status:
  - status
  awsRegion:
  - cloud.region
  eventID:
  - metadata.uid
  eventName:
  - api.operation
  recipientAccountId:
  - cloud.account.uid
  requestID:
  - api.request.uid
  - metadata.correlation_uid
  sourceIPAddress:
  - src_endpoint.hostname
  - src_endpoint.ip
  userAgent:
  - http_request.user_agent
  userIdentity.arn:
  - actor.user.uid
  userIdentity.invokedBy:
  - actor.user.name
  userIdentity.sessionContext.sessionIssuer.userName:
  - actor.user.name
  userIdentity.type:
  - actor.user.type
  userIdentity.userName:
  - actor.user.name
