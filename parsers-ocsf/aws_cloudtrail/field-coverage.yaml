- _nanosiem.accountAlias
- _nanosiem.callerName
- _nanosiem.changeType
- _nanosiem.cloudService
- _nanosiem.mfaAuthenticated
- _nanosiem.status
- awsRegion
- errorCode
- errorMessage
- eventID
- eventName
- eventSource
- eventTime
- readOnly
- recipientAccountId
- requestID
- resources
- sourceIPAddress
- userAgent
- userIdentity
- userIdentity.accountId
- userIdentity.arn
- userIdentity.principalId
- userIdentity.type
- userIdentity.userName
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
