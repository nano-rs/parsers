source: json
transforms:
- source: query_timestamp
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: transport
  kind: lowercase
  target: connection_info.protocol_name
  reason: Parser lowercases the transport name; consume only when the normalized value is emitted.
- source: firewall_rule_action
  kind: enum
  target: disposition_id
  values:
    block: 2
    alert: 19
    allow: 1
  reason: DNS Firewall verdict normalized to the OCSF disposition; consume only when the expected ID is
    emitted.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  account_id:
  - cloud.account.uid
  firewall_rule_group_id:
  - firewall_rule.uid
  query_class:
  - query.class
  query_type:
  - query.type
  rcode:
  - rcode
  region:
  - cloud.region
  srcaddr:
  - src_endpoint.ip
  srcids.instance:
  - src_endpoint.instance_uid
  srcids.resolver_endpoint:
  - src_endpoint.uid
  srcport:
  - src_endpoint.port
  version:
  - metadata.log_version
  vpc_id:
  - src_endpoint.vpc_uid
