source: json
transforms:
- source: event_type
  kind: lowercase
  target: metadata.log_name
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: proto
  kind: lowercase
  target: connection_info.protocol_name
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: app_proto
  kind: lowercase
  target: app_protocol_name
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: app_proto
  kind: lowercase
  target: dst_endpoint.svc_name
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: timestamp
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: proto
  kind: enum
  target: connection_info.protocol_num
  values:
    tcp: 6
    udp: 17
    icmp: 1
    icmpv6: 58
    ipv6-icmp: 58
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when
    the expected ID is emitted.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  alert.category:
  - finding_info.types
  alert.metadata.mitre_technique_id:
  - attacks.technique.uid
  alert.signature:
  - finding_info.analytic.name
  - finding_info.title
  alert.signature_id:
  - finding_info.analytic.uid
  - finding_info.uid
  anomaly.event:
  - finding_info.analytic.name
  - finding_info.analytic.uid
  - finding_info.title
  - finding_info.uid
  anomaly.type:
  - finding_info.types
  app_proto:
  - app_protocol_name
  - dst_endpoint.svc_name
  dest_ip:
  - dst_endpoint.ip
  - evidences.dst_endpoint.ip
  - observables.value
  dest_port:
  - dst_endpoint.port
  - evidences.dst_endpoint.port
  dhcp.assigned_ip:
  - src_endpoint.ip
  dhcp.client_mac:
  - src_endpoint.mac
  dhcp.hostname:
  - src_endpoint.hostname
  dhcp.lease_time:
  - lease_dur
  dns.id:
  - transaction_id
  dns.rcode:
  - rcode
  dns.rrname:
  - observables.value
  - query.hostname
  dns.rrtype:
  - query.type
  event_type:
  - metadata.log_name
  fileinfo.sha256:
  - observables.value
  flow.bytes_toclient:
  - traffic.bytes_in
  flow.bytes_toserver:
  - traffic.bytes_out
  flow.pkts_toclient:
  - traffic.packets_in
  flow.pkts_toserver:
  - traffic.packets_out
  flow_id:
  - metadata.correlation_uid
  host:
  - device.hostname
  http.hostname:
  - http_request.url.hostname
  http.http_content_type:
  - http_response.content_type
  http.http_refer:
  - http_request.referrer
  http.http_user_agent:
  - http_request.user_agent
  - observables.value
  http.length:
  - http_response.length
  http.status:
  - http_response.code
  http.url:
  - http_request.url.path
  in_iface:
  - evidences.src_endpoint.interface_name
  src_ip:
  - evidences.src_endpoint.ip
  - observables.value
  - src_endpoint.ip
  src_port:
  - evidences.src_endpoint.port
  - src_endpoint.port
