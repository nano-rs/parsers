source: mixed
transforms:
- source: datetime
  kind: epoch_ms
  target: time
  format: '%Y-%m-%d %H:%M:%S'
  reason: Debug log local clock (no zone, read as UTC) in this locale layout; consume only when the emitted
    clock matches.
- source: datetime
  kind: epoch_ms
  target: time
  format: '%d/%m/%Y %H:%M:%S'
  reason: Debug log local clock (no zone, read as UTC) in this locale layout; consume only when the emitted
    clock matches.
- source: EventTime
  kind: epoch_ms
  target: time
  format: '%Y-%m-%d %H:%M:%S'
  reason: NXLog EventTime (no zone, read as UTC); consume only when the emitted clock matches.
- source: '@timestamp'
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: remote_ip
  kind: lowercase
  target: dst_endpoint.ip
  reason: IP addresses are lowercased (IPv6) on the emitted endpoint.
- source: remote_ip
  kind: lowercase
  target: src_endpoint.ip
  reason: IP addresses are lowercased (IPv6) on the emitted endpoint.
- source: RemoteIP
  kind: lowercase
  target: src_endpoint.ip
