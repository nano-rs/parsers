name: windows_dns_ocsf
display_name: Windows DNS Server (OCSF)
version: "1.0.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses Microsoft Windows Server DNS logs into OCSF 1.9.0 "DNS Activity"
  (class_uid 4003). Three input forms are accepted, one record per event:
    * the DNS debug log text file (dns.log), PACKET lines: date and time
      (12 h en-US or 24 h day-first / ISO / dotted locales), thread, packet id,
      UDP/TCP, Snd/Rcv, remote IP, XID, query/response, opcode, the
      [flags-hex flag-chars rcode] block, question type and the
      (n)label(n) question name, which is converted to dotted form;
    * the NXLog xm_msdns parsed record (QuestionName, ResponseCode, ...);
    * the Microsoft-Windows-DNSServer/Analytical ETW events as JSON from
      Winlogbeat / Elastic Agent (winlog.event_data) or NXLog (flat keys):
      256 QUERY_RECEIVED, 257 RESPONSE_SUCCESS, 258 RESPONSE_FAILURE,
      259 IGNORED_QUERY, 260 RECURSE_QUERY_OUT, 261 RECURSE_RESPONSE_IN,
      262 RECURSE_QUERY_TIMEOUT.
  Activity is Query (1) or Response (2); src_endpoint is always the client
  that asked the question (for recursion the DNS server itself is the
  client), and the debug log Snd/Rcv lands on connection_info.direction.
  Flags map to flag_ids, the opcode to query.opcode_id, the response code to
  rcode_id. Microsoft-Windows-DNSServer/Audit events (zone, record and policy
  changes) and non-PACKET debug log lines are kept as Base Event (class 0,
  activity Other) with their message; debug log header and legend lines are
  kept as Base Event (activity Unknown) with unmapped.log_line_type = header.
  Anything else is a Base Event with the body in raw_data and
  unmapped.parse_fallback set. The debug log and NXLog EventTime carry no
  time zone and are read as UTC. Windows Event XML for these channels is not
  parsed here.
  Timestamps without an offset use the log source's timezone setting (UTC if unset).
match_values:
  - windows_dns
category: network
vendor: "Microsoft"
product: "Windows DNS Server"
parser_vrl: |
  # NAN source timezone. Generated by scripts/residual_spill.py; edit scripts/residual/source_tz.vrl.
  # The log source's timezone setting arrives as .nano.source_timezone (an IANA
  # name such as "America/New_York", or any fixed offset such as "+05:30"), set
  # by nano at ingest. .nano is nano's input, never part of the log: it is
  # removed whole before anything else, whatever its shape.
  # For a clock that carries no offset a parser parses it AS UTC and sets
  # __lc_pending; the generated local-clock block that follows the parse
  # (local_clock.vrl) turns it into real UTC with this setting, and the spill
  # records the zone used as unmapped.nano_time_assumed_tz (the name, the offset
  # as +HH:MM, or "UTC" when the setting is absent, invalid or "local").
  __src_nano = del(.nano)
  __src_tz_in = ""
  if is_object(__src_nano) { __src_tz_in = strip_whitespace(to_string(object!(__src_nano).source_timezone) ?? "") }
  __src_tz = "UTC"
  __src_shift_ms = 0
  __src_tz_label = "UTC"
  __time_assumed = false
  __time_inline = false
  __lc_pending = false
  __lc_shifted = ""
  # No parse_* decoder here: nano infers a parser's input contract from the first
  # decoder in its program (parse_json first = a JSON-input parser, handed the
  # whole HEC / OTLP object). This prelude opens every parser, so a decoder in it
  # would turn every JSON-input parser into a text one. match + slice instead.
  if match(__src_tz_in, r'^[+-]\d{2}:?\d{2}$') {
      __src_sign = slice(__src_tz_in, 0, 1) ?? "+"
      __src_digits = replace(slice(__src_tz_in, 1) ?? "", ":", "")
      __src_hh = slice(__src_digits, 0, 2) ?? "99"
      __src_mm = slice(__src_digits, 2, 4) ?? "99"
      __src_h = to_int(__src_hh) ?? 99
      __src_m = to_int(__src_mm) ?? 99
      if __src_h <= 14 && __src_m <= 59 {
          __src_shift_ms = (__src_h * 3600 + __src_m * 60) * 1000
          if __src_sign == "-" { __src_shift_ms = 0 - __src_shift_ms }
          if __src_shift_ms != 0 { __src_tz_label = __src_sign + __src_hh + ":" + __src_mm }
      }
  } else if __src_tz_in != "" && downcase(__src_tz_in) != "local" {
      # "local" (the Vector host's zone) would make the time depend on the host.
      __src_probe, __src_probe_err = parse_timestamp("2000-01-01 00:00:00", "%Y-%m-%d %H:%M:%S", timezone: __src_tz_in)
      if __src_probe_err == null { __src_tz = __src_tz_in; __src_tz_label = __src_tz_in }
  }
  # END NAN source timezone
  # nano's input contract (nanosiem hec_payload.rs), stated: JSON. From nano
  # v2.0.36 a declared parser gets an HEC object event's whole record, as
  # /ingest does; undeclared it gets the v2.0.35 HEC delivery (NAN-5902).
  # nano:input=json
  # Windows DNS Server (debug log / xm_msdns / Analytical ETW) -> OCSF 1.9.0 DNS Activity (4003)
  raw_log = to_string(.message) ?? ""
  __raw_body = raw_log
  __source_kv = {}

  fmt = "unknown"
  p = {}
  parsed, jerr = parse_json(raw_log)
  if jerr == null && is_object(parsed) {
      p = object!(parsed)
      __source_kv = p
      fmt = "json"
  }

  # ---- normalized fields, filled by whichever branch matches ----
  time_ms = 0
  dt_str = ""
  eid = ""
  host = ""
  log_name = "DNS Server debug log"
  is_dns = false
  is_resp = false
  activity_id = 1
  activity_name = "Query"
  opcode_id = -1
  qname = ""
  qtype = ""
  rcode_txt = ""
  rcode_num = -1
  xid = -1
  proto = ""
  sr = ""
  remote_ip = ""
  flag_chars = ""
  flags_word = -1
  client_ip = ""
  client_port = 0
  server_ip = ""
  server_port = 0
  status_id = 0
  status_detail = ""
  elapsed_ms = -1
  message = ""
  line_kind = ""

  if fmt == "unknown" {
      # ---- DNS debug log PACKET line ----
      m, merr = parse_regex(raw_log, r'^(?P<datetime>\d{1,4}[/.-]\d{1,2}[/.-]\d{1,4} \d{1,2}:\d{2}:\d{2}(?: [AP]M)?)\s+(?P<thread_id>[0-9A-Fa-f]+)\s+(?P<context>PACKET)\s+(?P<packet_id>[0-9A-Fa-f]+)\s+(?P<protocol>UDP|TCP)\s+(?P<direction>Snd|Rcv)\s+(?P<remote_ip>[0-9A-Fa-f.:]+)\s+(?P<xid>[0-9A-Fa-f]{1,4})\s+(?P<qr>R)?\s*(?P<opcode>[QNU?])\s+\x5B(?P<flags_hex>[0-9A-Fa-f]{4})\s+(?:(?P<flags_char>[ATDR](?:[ATDR ]*[ATDR])?)\s+)?(?P<rcode>[A-Z]+)\x5D\s+(?P<qtype>\S+)\s+(?P<qname>\S+)\s*$')
      if merr == null {
          __source_kv = compact(m)
          fmt = "packet"
          dt_str = to_string(m.datetime)
          proto = downcase(to_string(m.protocol))
          sr = to_string(m.direction)
          remote_ip = to_string(m.remote_ip)
          xid = parse_int(to_string(m.xid), base: 16) ?? -1
          is_resp = (to_string(m.qr)) == "R"
          op = to_string(m.opcode)
          if op == "Q" { opcode_id = 0 } else if op == "N" { opcode_id = 4 } else if op == "U" { opcode_id = 5 } else if op == "?" { opcode_id = 99 }
          flag_chars = to_string(m.flags_char)
          rcode_txt = to_string(m.rcode)
          qtype = to_string(m.qtype)
          qname = replace(to_string(m.qname), r'\(\d+\)', ".")
          is_dns = true
      } else {
          # ---- other timestamped debug log lines (EVENT, Note, ...) ----
          e, eerr = parse_regex(raw_log, r'^(?P<datetime>\d{1,4}[/.-]\d{1,2}[/.-]\d{1,4} \d{1,2}:\d{2}:\d{2}(?: [AP]M)?)\s+(?P<thread_id>[0-9A-Fa-f]+)\s+(?P<context>[A-Za-z]+)\s+(?P<detail>\S.*?)\s*$')
          if eerr == null {
              __source_kv = compact(e)
              fmt = "debug_event"
              # A PACKET line the packet regex could not read is a degraded parse,
              # not an ordinary EVENT line: flag it so source health sees the loss.
              if to_string(e.context) == "PACKET" { fmt = "packet_unparsed" }
              dt_str = to_string(e.datetime)
              message = to_string(e.detail)
          } else if match(raw_log, r'(?i)\A(?:\s|-{2,}|\z|dns server log|log file wrap|message logging key|field\s*#)') {
              fmt = "header"
              line_kind = "header"
          }
      }
  } else {
      w = object(p.winlog) ?? {}
      evt = object(p.event) ?? {}
      ed = object(w.event_data) ?? object(p.event_data) ?? p
      eid = to_string(w.event_id) ?? ""
      if eid == "" { eid = to_string(evt.code) ?? "" }
      if eid == "" { eid = to_string(p.EventID) ?? "" }
      if eid == "" { eid = to_string(p.event_id) ?? "" }
      host = to_string(get(p, ["host", "name"]) ?? null) ?? ""
      if host == "" { host = to_string(w.computer_name) ?? "" }
      if host == "" { host = to_string(p.Hostname) ?? "" }
      chan = to_string(w.channel) ?? ""
      if chan == "" { chan = to_string(p.Channel) ?? "" }
      provider = to_string(w.provider_name) ?? ""
      if provider == "" { provider = to_string(evt.provider) ?? "" }
      if provider == "" { provider = to_string(p.ProviderName) ?? "" }
      if provider == "" { provider = to_string(p.SourceName) ?? "" }
      ts = to_string(get(p, ["@timestamp"]) ?? null) ?? ""
      if ts != "" {
          t, terr = parse_timestamp(ts, "%+", timezone: "UTC")
          if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
      }
      if time_ms == 0 { dt_str = to_string(p.EventTime) ?? "" }

      if includes(["256", "257", "258", "259", "260", "261", "262"], eid) && exists(ed.QNAME) {
          # ---- Microsoft-Windows-DNSServer/Analytical ----
          fmt = "etw"
          is_dns = true
          log_name = "Microsoft-Windows-DNSServer/Analytical"
          qname = to_string(ed.QNAME) ?? ""
          qt = to_string(ed.QTYPE) ?? ""
          qtype = string(get({"1": "A", "2": "NS", "5": "CNAME", "6": "SOA", "12": "PTR", "13": "HINFO", "15": "MX", "16": "TXT", "28": "AAAA", "33": "SRV", "35": "NAPTR", "43": "DS", "46": "RRSIG", "47": "NSEC", "48": "DNSKEY", "64": "SVCB", "65": "HTTPS", "251": "IXFR", "252": "AXFR", "255": "ANY", "257": "CAA"}, [qt]) ?? null) ?? qt
          if exists(ed.XID) { xid = to_int(ed.XID) ?? -1 }
          tcp = to_string(ed.TCP) ?? ""
          if tcp == "1" { proto = "tcp" } else if tcp == "0" { proto = "udp" }
          if exists(ed.RCODE) { rcode_num = to_int(ed.RCODE) ?? -1 }
          if exists(ed.Flags) { flags_word = to_int(ed.Flags) ?? -1 }
          iface = to_string(ed.InterfaceIP) ?? ""
          src = to_string(ed.Source) ?? ""
          dst = to_string(ed.Destination) ?? ""
          port = to_int(ed.Port) ?? 0
          if exists(ed.ElapsedTime) { elapsed_ms = to_int(ed.ElapsedTime) ?? -1 }
          status_detail = to_string(ed.Reason) ?? ""
          # the server's own view: what it received is Inbound, what it sent Outbound
          sr = if includes(["256", "259", "261"], eid) { "Rcv" } else { "Snd" }
          if eid == "256" || eid == "259" {
              client_ip = src; client_port = port; server_ip = iface
          } else if eid == "257" || eid == "258" {
              is_resp = true
              client_ip = dst; client_port = port; server_ip = iface
          } else if eid == "260" || eid == "262" {
              client_ip = iface; server_ip = dst; server_port = port
          } else {
              is_resp = true
              client_ip = iface; server_ip = src; server_port = port
          }
          if eid == "259" { status_id = 2 }
          if eid == "258" { status_id = 2 }
          if eid == "262" {
              status_id = 2
              activity_id = 99
              activity_name = "Other"
              if status_detail == "" { status_detail = "Recursive query timed out" }
          }
      } else if exists(p.QuestionName) || exists(p.SendReceiveIndicator) {
          # ---- NXLog xm_msdns parsed debug log record ----
          fmt = "msdns"
          is_dns = true
          proto = downcase(to_string(p.Protocol) ?? "")
          sr = to_string(p.SendReceiveIndicator) ?? ""
          remote_ip = to_string(p.RemoteIP) ?? ""
          xid = parse_int(to_string(p.Xid) ?? "", base: 16) ?? -1
          is_resp = downcase(to_string(p.QueryResponseIndicator) ?? "") == "response"
          op = downcase(to_string(p.Opcode) ?? "")
          if op == "standard query" { opcode_id = 0 } else if op == "notify" { opcode_id = 4 } else if op == "update" { opcode_id = 5 } else if op != "" { opcode_id = 99 }
          if p.AuthoritativeAnswer == true { flag_chars = flag_chars + "A" }
          if p.TruncatedResponse == true { flag_chars = flag_chars + "T" }
          if p.RecursionDesired == true { flag_chars = flag_chars + "D" }
          if p.RecursionAvailable == true { flag_chars = flag_chars + "R" }
          if flag_chars == "" { flag_chars = to_string(p.FlagsChar) ?? "" }
          rcode_txt = to_string(p.ResponseCode) ?? ""
          qtype = to_string(p.QuestionType) ?? ""
          qname = to_string(p.QuestionName) ?? ""
      } else if contains(downcase(provider), "dns") || contains(downcase(chan), "dns") {
          # ---- Microsoft-Windows-DNSServer/Audit and other DNS Server events ----
          fmt = "audit"
          log_name = if chan != "" { chan } else { "Microsoft-Windows-DNSServer" }
          message = to_string(p.message) ?? ""
          if message == "" { message = to_string(p.Message) ?? "" }
          if message == "" { message = "Microsoft DNS Server event " + eid }
      }
  }

  # ---- clock for the text forms: the Windows host's local time, no zone;
  # read as UTC and recorded, so the log source's timezone setting converts it ----
  if time_ms == 0 && dt_str != "" {
      fmts = ["%Y-%m-%d %H:%M:%S", "%d/%m/%Y %H:%M:%S", "%m/%d/%Y %H:%M:%S", "%d.%m.%Y %H:%M:%S"]
      if match(dt_str, r'[AP]M$') { fmts = ["%m/%d/%Y %I:%M:%S %p", "%d/%m/%Y %I:%M:%S %p"] }
      for_each(fmts) -> |_i, f| {
          if time_ms == 0 {
              tt, tterr = parse_timestamp(dt_str, string!(f), timezone: "UTC")
              if tterr == null { __lc_pending = true }
              # NAN local clock: tt
              # tt was just parsed from a clock WITHOUT an offset, read as UTC
              # (__lc_pending). It becomes real UTC here, at the site, with the log source's
              # timezone (__src_tz / __src_shift_ms from the prelude, or an inline IANA zone
              # the parser validated): a fixed offset by arithmetic; an IANA zone with its DST
              # rules, probed 18 h either side (wider than any UTC offset), an ambiguous
              # fall-back time taking its FIRST occurrence (the earlier offset), a time in a
              # spring-forward gap moving forward by the gap. __NOYEAR__: a clock with no
              # year is tried in its year, the year before and the year after (each with its
              # own DST rules); more than a day in the future means last year, more than 180
              # days in the past means next year when that is not in the future.
              if __lc_pending {
                  __lc_pending = false
                  __time_assumed = true
                  __lc_l = to_unix_timestamp(tt, unit: "milliseconds")
                  __lc_cands = [__lc_l]
                  __lc_us = map_values(__lc_cands) -> |l| {
                      if l == null {
                          null
                      } else {
                          __u = int!(l) - __src_shift_ms
                          if __src_tz != "UTC" {
                              __offs = map_values([int!(l) - 64800000, int!(l) + 64800000]) -> |at| {
                                  __z = format_timestamp(from_unix_timestamp!(at, unit: "milliseconds"), "%z", timezone: __src_tz) ?? "+0000"
                                  __o = ((to_int(slice(__z, 1, 3) ?? "0") ?? 0) * 3600 + (to_int(slice(__z, 3, 5) ?? "0") ?? 0) * 60) * 1000
                                  if starts_with(__z, "-") { 0 - __o } else { __o }
                              }
                              __oa = int!(__offs[0])
                              __ob = int!(__offs[1])
                              __u = int!(l) - __oa
                              if __oa != __ob {
                                  __ok = map_values([int!(l) - __oa, int!(l) - __ob]) -> |at| {
                                      __z = format_timestamp(from_unix_timestamp!(at, unit: "milliseconds"), "%z", timezone: __src_tz) ?? "+0000"
                                      __o = ((to_int(slice(__z, 1, 3) ?? "0") ?? 0) * 3600 + (to_int(slice(__z, 3, 5) ?? "0") ?? 0) * 60) * 1000
                                      if starts_with(__z, "-") { 0 - __o } else { __o }
                                  }
                                  if int!(__ok[0]) != __oa && int!(__ok[1]) == __ob { __u = int!(l) - __ob }
                              }
                          }
                          __u
                      }
                  }
                  __lc_u = int!(__lc_us[0])
                  # Remembered (local -> UTC) so a transforms rule on the same source clock
                  # still finds it at its target.
                  if __lc_u != __lc_l { __lc_shifted = __lc_shifted + "\n" + to_string(__lc_l) + "\t" + to_string(__lc_u) + "\n" }
                  tt = from_unix_timestamp!(__lc_u, unit: "milliseconds")
              }
              # END NAN local clock
              if tterr == null { time_ms = to_unix_timestamp(tt, unit: "milliseconds") }
          }
      }
  }
  if time_ms == 0 { time_ms = to_unix_timestamp(now(), unit: "milliseconds") }

  metadata = {
      "version": "1.9.0",
      "uid": sha2("windows_dns|raw|" + raw_log, variant: "SHA-256"),
      "log_name": log_name,
      "log_provider": "Microsoft-Windows-DNSServer",
      "product": { "name": "Windows DNS Server", "vendor_name": "Microsoft" }
  }
  if eid != "" { metadata.event_code = eid }
  device = {}
  if host != "" {
      device = { "hostname": host, "type_id": 1, "type": "Server" }
      metadata.profiles = ["host"]
  }
  unmapped = {}

  if is_dns {
      # ---- roles from the debug log direction ----
      if remote_ip != "" {
          if (sr == "Rcv" && !is_resp) || (sr == "Snd" && is_resp) { client_ip = remote_ip } else { server_ip = remote_ip }
      }
      if is_resp && activity_id == 1 { activity_id = 2; activity_name = "Response" }

      # ---- response code ----
      rcode_names = ["NoError", "FormError", "ServError", "NXDomain", "NotImp", "Refused", "YXDomain", "YXRRSet", "NXRRSet", "NotAuth", "NotZone"]
      if rcode_txt != "" {
          rcode_num = to_int(get({"NOERROR": 0, "FORMERR": 1, "SERVFAIL": 2, "NXDOMAIN": 3, "NOTIMP": 4, "NOTIMPL": 4, "REFUSED": 5, "YXDOMAIN": 6, "YXRRSET": 7, "NXRRSET": 8, "NOTAUTH": 9, "NOTZONE": 10}, [upcase(rcode_txt)]) ?? 99) ?? 99
      }
      if is_resp && rcode_num >= 0 {
          if rcode_num == 0 && status_id == 0 { status_id = 1 }
          if rcode_num != 0 { status_id = 2 }
      }

      # ---- header flags: decimal word (ETW) or the debug log letters ----
      flag_ids = []
      flags = []
      if flags_word >= 0 {
          if opcode_id < 0 { opcode_id = mod(to_int(floor(flags_word / 2048)), 16) }
          if mod(to_int(floor(flags_word / 1024)), 2) == 1 { flag_ids = push(flag_ids, 1); flags = push(flags, "Authoritative Answer") }
          if mod(to_int(floor(flags_word / 512)), 2) == 1 { flag_ids = push(flag_ids, 2); flags = push(flags, "Truncated Response") }
          if mod(to_int(floor(flags_word / 256)), 2) == 1 { flag_ids = push(flag_ids, 3); flags = push(flags, "Recursion Desired") }
          if mod(to_int(floor(flags_word / 128)), 2) == 1 { flag_ids = push(flag_ids, 4); flags = push(flags, "Recursion Available") }
          if mod(to_int(floor(flags_word / 32)), 2) == 1 { flag_ids = push(flag_ids, 5); flags = push(flags, "Authentic Data") }
          if mod(to_int(floor(flags_word / 16)), 2) == 1 { flag_ids = push(flag_ids, 6); flags = push(flags, "Checking Disabled") }
      } else {
          if contains(flag_chars, "A") { flag_ids = push(flag_ids, 1); flags = push(flags, "Authoritative Answer") }
          if contains(flag_chars, "T") { flag_ids = push(flag_ids, 2); flags = push(flags, "Truncated Response") }
          if contains(flag_chars, "D") { flag_ids = push(flag_ids, 3); flags = push(flags, "Recursion Desired") }
          if contains(flag_chars, "R") { flag_ids = push(flag_ids, 4); flags = push(flags, "Recursion Available") }
      }

      # ---- question ----
      qname = replace(replace(qname, r'^\.+', ""), r'\.+$', "")
      if qname == "" { qname = "." }
      query = { "hostname": qname }
      if qtype != "" { query.type = qtype }
      if opcode_id >= 0 {
          op_name = string(get({"0": "Query", "1": "Inverse Query", "2": "Status", "3": "Reserved", "4": "Notify", "5": "Update", "6": "DSO Message"}, [to_string(opcode_id)]) ?? null) ?? "Other"
          if op_name == "Other" { opcode_id = 99 }
          query.opcode_id = opcode_id
          query.opcode = op_name
      }

      src_endpoint = {}
      if client_ip != "" { src_endpoint.ip = downcase(client_ip) }
      if client_port > 0 { src_endpoint.port = client_port }
      dst_endpoint = {}
      if server_ip != "" { dst_endpoint.ip = downcase(server_ip) }
      if server_port > 0 { dst_endpoint.port = server_port }
      if length(keys(src_endpoint)) == 0 && length(keys(dst_endpoint)) == 0 { src_endpoint.ip = "0.0.0.0" }

      connection_info = {}
      if proto == "udp" { connection_info = { "protocol_name": "udp", "protocol_num": 17 } }
      if proto == "tcp" { connection_info = { "protocol_name": "tcp", "protocol_num": 6 } }
      if sr == "Rcv" { connection_info.direction_id = 1; connection_info.direction = "Inbound" }
      if sr == "Snd" { connection_info.direction_id = 2; connection_info.direction = "Outbound" }
      if length(keys(connection_info)) > 0 && !exists(connection_info.direction_id) { connection_info.direction_id = 0; connection_info.direction = "Unknown" }

      status = string(get({"0": "Unknown", "1": "Success", "2": "Failure"}, [to_string(status_id)]) ?? null) ?? "Unknown"
      ocsf = {
          "class_uid": 4003,
          "class_name": "DNS Activity",
          "category_uid": 4,
          "category_name": "Network Activity",
          "activity_id": activity_id,
          "activity_name": activity_name,
          "type_uid": 400300 + activity_id,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": status_id,
          "status": status,
          "time": time_ms,
          "raw_data": raw_log,
          "metadata": metadata,
          "query": query
      }
      if length(keys(src_endpoint)) > 0 { ocsf.src_endpoint = src_endpoint }
      if length(keys(dst_endpoint)) > 0 { ocsf.dst_endpoint = dst_endpoint }
      if length(keys(connection_info)) > 0 { ocsf.connection_info = connection_info }
      if is_resp && rcode_num >= 0 {
          if rcode_num > 10 && rcode_num != 99 { rcode_num = 99 }
          ocsf.rcode_id = rcode_num
