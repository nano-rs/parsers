source: text
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  accept_date:
  - metadata.original_time
  backend_name:
  - dst_endpoint.svc_name
  - load_balancer.dst_endpoint.svc_name
  bytes_read:
  - http_response.length
  - traffic.bytes_in
  client_ip:
  - src_endpoint.ip
  client_port:
  - src_endpoint.port
  error_message:
  - message
  - status_detail
  frontend_ip:
  - dst_endpoint.ip
  - load_balancer.dst_endpoint.ip
  frontend_name:
  - load_balancer.name
  frontend_port:
  - dst_endpoint.port
  - load_balancer.dst_endpoint.port
  process_name:
  - metadata.log_provider
  server_name:
  - dst_endpoint.name
  - load_balancer.dst_endpoint.name
  ssl_ciphers:
  - tls.cipher
  ssl_fc_sni:
  - http_request.url.hostname
  - tls.sni
  ssl_version:
  - tls.version
  status_code:
  - http_response.code
  - load_balancer.code
  syslog_host:
  - device.hostname
  - device.ip
  termination_state:
  - status_code
  time_active:
  - duration
  time_response:
  - http_response.latency
  time_total:
  - duration
