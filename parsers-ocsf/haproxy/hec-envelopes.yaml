# What this parser gets when its log arrives as an HEC (or OTel-style) object
# event; scripts/test_hec_envelopes.py builds the delivery the way nano does and
# checks each case.
cases:
- name: haproxy syslog line wrapped by an HEC sender
  event:
    message: 'Feb  6 12:14:14 localhost haproxy[14389]: 192.0.2.20:52124 [06/Feb/2009:12:14:14.655] http-in static/srv1 10/0/30/69/109 200 2750 - - ---- 1/1/1/1/0 0/0 "GET /index.html HTTP/1.1"'
    k8s_pod: haproxy-0
  expect:
    class_uid: 4002
    http_response.code: 200
