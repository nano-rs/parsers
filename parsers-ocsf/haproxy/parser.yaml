  - raw: 'Feb  6 12:14:14 localhost haproxy[14389]: 192.0.2.2:33317 [06/Feb/2009:12:14:14.655] http-in static/srv1 10/0/30/69/109 200 2750 - - ---- 1/1/1/1/0 0/0 {www.example.com} {} "GET /index.html HTTP/1.1"'
    expect:
      class_uid: 4002
      activity_id: 3
      "http_response.code": 200
      "src_endpoint.ip": "192.0.2.2"
      duration: 109
      "load_balancer.name": "http-in"
  - raw: 'Feb  6 12:12:56 localhost haproxy[14387]: 192.0.2.2:33313 [06/Feb/2009:12:12:51.443] fnt bck/srv1 0/0/5007 212 -- 0/0/0/0/3 0/0'
    expect:
      class_uid: 4001
      activity_id: 2
      duration: 5007
      "traffic.bytes_in": 212
  - raw: 'Dec  3 18:27:14 localhost haproxy[6103]: 192.0.2.1:56059 [03/Dec/2012:17:35:10.380] frt/f1: Connection error during SSL handshake'
    expect:
      class_uid: 4001
      activity_id: 4
      status_id: 2
  - raw: 'not a haproxy line'
    expect:
      class_uid: 0
      "unmapped.parse_fallback": "unparsable input"
