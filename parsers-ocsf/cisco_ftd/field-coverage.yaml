  fields.IntrusionPolicy:
  - policy.name
  fields.FileName:
  - evidences.file.name
  fields.FileSize:
  - evidences.file.size
  fields.FileType:
  - evidences.file.desc
  fields.ThreatName:
  - malware.name
  fields.FilePolicy:
  - policy.name
  fields.FileAction:
  - status_detail
  fields.DeviceUUID:
