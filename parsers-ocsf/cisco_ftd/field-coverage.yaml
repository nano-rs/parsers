  event.src_ip:
  - dst_endpoint.ip
  - src_endpoint.ip
  event.dst_ip:
  - dst_endpoint.ip
  - src_endpoint.ip
  event.src_port:
  - dst_endpoint.port
  - src_endpoint.port
  event.dst_port:
  - dst_endpoint.port
  - src_endpoint.port
  event.src_iface:
  - dst_endpoint.interface_name
  - src_endpoint.interface_name
  event.dst_iface:
  - dst_endpoint.interface_name
  - src_endpoint.interface_name
  event.protocol:
  - connection_info.protocol_name
  event.conn_id:
  - connection_info.uid
  event.acl:
  - firewall_rule.name
  - firewall_rule.uid
  event.bytes:
  - traffic.bytes
  event.reason:
