source: text
transforms:
- source: header.ts
  kind: epoch_ms
  target: time
  format: '%+'
  reason: RFC 3339 syslog timestamp converted to event milliseconds; "Mon DD YYYY" clocks remain residual.
- source: fields.Protocol
  kind: lowercase
  target: connection_info.protocol_name
  reason: Protocol name lowercased into connection_info.protocol_name.
- source: fields.Protocol
  kind: lowercase
  target: evidences.connection_info.protocol_num
  reason: Protocol name lowercased into connection_info.protocol_name.
- source: event.protocol
  kind: lowercase
  target: connection_info.protocol_name
  reason: Protocol name lowercased into connection_info.protocol_name.
- source: event.protocol
  kind: enum
  target: connection_info.protocol_num
  values:
    tcp: 6
    udp: 17
    icmp: 1
  reason: Protocol name normalized to the IANA protocol number.
- source: fields.Protocol
  kind: enum
  target: connection_info.protocol_num
  values:
    tcp: 6
    udp: 17
    icmp: 1
  reason: Protocol name normalized to the IANA protocol number.
- source: fields.ConnectionDuration
  kind: scale
  factor: 1000
  target: duration
  reason: Connection duration in seconds converted to OCSF milliseconds.
- source: fields.AccessControlRuleAction
  kind: enum
  target: action_id
  values:
    allow: 1
    trust: 1
    block: 2
    block with reset: 2
  reason: Access control verdict normalized to the OCSF action; consume only when the expected ID is emitted.
- source: event.direction
  kind: enum
  target: connection_info.direction_id
  values:
    inbound: 1
    outbound: 2
  reason: Connection build direction normalized to the OCSF direction id.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  header.host:
  - device.hostname
  header.msg_id:
  - metadata.event_code
  fields.SrcIP:
  - evidences.src_endpoint.ip
  - src_endpoint.ip
  fields.DstIP:
  - dst_endpoint.ip
  - evidences.dst_endpoint.ip
  fields.SrcPort:
  - evidences.src_endpoint.port
  - src_endpoint.port
  fields.DstPort:
  - dst_endpoint.port
  - evidences.dst_endpoint.port
  fields.IngressInterface:
  - evidences.src_endpoint.interface_name
  - src_endpoint.interface_name
  fields.EgressInterface:
  - dst_endpoint.interface_name
  - evidences.dst_endpoint.interface_name
  fields.IngressZone:
  - evidences.src_endpoint.zone
  - src_endpoint.zone
  fields.EgressZone:
  - dst_endpoint.zone
  - evidences.dst_endpoint.zone
  fields.Protocol:
  - connection_info.protocol_name
  - evidences.connection_info.protocol_num
  fields.ConnectionID:
  - connection_info.uid
  fields.User:
  - actor.user.name
  - evidences.user.name
  fields.ApplicationProtocol:
