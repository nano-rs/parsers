  # Sources: Elastic cisco_ftd integration test fixtures (real FTD syslog)
  #   https://github.com/elastic/integrations/tree/main/packages/cisco_ftd/data_stream/log/_dev/test/pipeline
  # and Cisco Secure Firewall Threat Defense Syslog Messages (430001-430005):
  #   https://www.cisco.com/c/en/us/td/docs/security/firepower/Syslogs/fptd_syslog_guide/security-event-syslog-messages.html
  # Public IPs, hosts, users and device UUIDs replaced with documentation values.
  # 430001 intrusion event, priority 1 (test-intrusion.log)
  - raw: '2019-08-16T09:54:00Z firepower  %FTD-0-430001: SrcIP: 10.0.1.20, DstIP: 10.0.100.30, SrcPort: 55644, DstPort: 80, Protocol: tcp, IngressInterface: inside, EgressInterface: outside, IngressZone: input-zone, EgressZone: output-zone, Priority: 1, GID: 1, SID: 17279, Revision: 12, Message: SERVER-WEBAPP Ipswitch WhatsUp Small Business directory traversal attempt, Classification: Attempted User Privilege Gain, User: No Authentication Required, Client: Firefox, ApplicationProtocol: HTTP, IntrusionPolicy: intrusion-policy, ACPolicy: default, NAPPolicy: Balanced Security and Connectivity'
    expect:
      class_uid: 2004
      severity_id: 4
      finding_info.analytic.uid: "1:17279"
      finding_info.title: SERVER-WEBAPP Ipswitch WhatsUp Small Business directory traversal attempt
      evidences.0.src_endpoint.ip: 10.0.1.20
      evidences.0.dst_endpoint.port: 80
      action_id: 3
      policy.name: intrusion-policy
