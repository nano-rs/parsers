name: kafka_ocsf
display_name: Apache Kafka (OCSF)
version: "1.0.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses Apache Kafka broker and controller logs (server.log, controller.log,
  state-change.log, kafka-authorizer.log) into complete OCSF 1.9.0 records.
  Accepts Kafka's log4j layout `[2024-05-02 10:11:12,345] INFO message (logger)`
  and the `2024-05-02 10:11:12,345 INFO logger: message` layout some
  distributions use. A `[Component key=value]` context prefix is split off.
    authorizer "Principal = User:x is Denied operation = ..."  -> API Activity 6003,
                                                                 Failure, action Denied
    authorizer "... is Allowed operation = ..." (DEBUG)        -> API Activity 6003, Success
    "Failed authentication with /<ip> (...)" (SASL / SSL)      -> Authentication 3002 Logon, Failure
    "Successfully authenticated client: authenticationID=..."  -> Authentication 3002 Logon, Success
    KafkaServer / BrokerServer / KafkaRaftServer started,
    shut down completed                                        -> Application Lifecycle 6002
    any other ERROR / FATAL line                               -> Application Error 6008
    any other line                                             -> Base Event 0
  The authorizer's resource (`Topic:LITERAL:orders`) becomes resources[] with the
  pattern type kept, the principal (`User:alice`) becomes actor.user, and the
  client host becomes src_endpoint. Log timestamps carry no zone and are read as UTC.
  Timestamps without an offset use the log source's timezone setting (UTC if unset).
match_values:
  - kafka
category: application
vendor: "Apache Software Foundation"
product: "Apache Kafka"
parser_vrl: |
  # NAN source timezone. Generated by scripts/residual_spill.py; edit scripts/residual/source_tz.vrl.
  # The log source's timezone setting arrives as .nano.source_timezone (an IANA
  # name such as "America/New_York", or any fixed offset such as "+05:30"), set
  # by nano at ingest. .nano is nano's input, never part of the log: it is
  # removed whole before anything else, whatever its shape.
  # For a clock that carries no offset a parser parses it AS UTC and sets
  # __lc_pending; the generated local-clock block that follows the parse
  # (local_clock.vrl) turns it into real UTC with this setting, and the spill
  # records the zone used as unmapped.nano_time_assumed_tz (the name, the offset
  # as +HH:MM, or "UTC" when the setting is absent, invalid or "local").
  __src_nano = del(.nano)
  __src_tz_in = ""
  if is_object(__src_nano) { __src_tz_in = strip_whitespace(to_string(object!(__src_nano).source_timezone) ?? "") }
  __src_tz = "UTC"
  __src_shift_ms = 0
  __src_tz_label = "UTC"
  __time_assumed = false
  __time_inline = false
  __lc_pending = false
  __lc_shifted = ""
  # No parse_* decoder here: nano infers a parser's input contract from the first
  # decoder in its program (parse_json first = a JSON-input parser, handed the
  # whole HEC / OTLP object). This prelude opens every parser, so a decoder in it
  # would turn every JSON-input parser into a text one. match + slice instead.
  if match(__src_tz_in, r'^[+-]\d{2}:?\d{2}$') {
      __src_sign = slice(__src_tz_in, 0, 1) ?? "+"
      __src_digits = replace(slice(__src_tz_in, 1) ?? "", ":", "")
      __src_hh = slice(__src_digits, 0, 2) ?? "99"
      __src_mm = slice(__src_digits, 2, 4) ?? "99"
      __src_h = to_int(__src_hh) ?? 99
      __src_m = to_int(__src_mm) ?? 99
      if __src_h <= 14 && __src_m <= 59 {
          __src_shift_ms = (__src_h * 3600 + __src_m * 60) * 1000
          if __src_sign == "-" { __src_shift_ms = 0 - __src_shift_ms }
          if __src_shift_ms != 0 { __src_tz_label = __src_sign + __src_hh + ":" + __src_mm }
      }
  } else if __src_tz_in != "" && downcase(__src_tz_in) != "local" {
      # "local" (the Vector host's zone) would make the time depend on the host.
      __src_probe, __src_probe_err = parse_timestamp("2000-01-01 00:00:00", "%Y-%m-%d %H:%M:%S", timezone: __src_tz_in)
      if __src_probe_err == null { __src_tz = __src_tz_in; __src_tz_label = __src_tz_in }
  }
  # END NAN source timezone
  # Apache Kafka server / controller / authorizer log -> OCSF 1.9.0.
  raw_log = to_string(.message) ?? ""
  __raw_body = raw_log
  __source_kv = {}
  parsed = false
  log_time = ""
  level = ""
  logger = ""
  body = ""

  m, merr = parse_regex(raw_log, r'(?s)^\x5B(?P<log_time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3})\x5D (?P<level>[A-Z]+)\s+(?P<body>.*?)(?: \x28(?P<logger>[A-Za-z0-9_.$]+)\x29)?\s*$')
  if merr != null {
      m, merr = parse_regex(raw_log, r'(?s)^(?P<log_time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3})\s+(?P<level>[A-Z]+)\s+(?P<logger>[A-Za-z0-9_.$]+):\s+(?P<body>.*?)\s*$')
  }
  if merr == null {
      parsed = true
      kv = filter(object!(m)) -> |_k, v| { v != null && v != "" }
      log_time = string(kv.log_time) ?? ""
      level = string(kv.level) ?? ""
      logger = string(kv.logger) ?? ""
      body = string(kv.body) ?? ""
      # The message itself is kept as `message`, not as a residual copy of the line.
      __source_kv = { "log_time": log_time, "level": level }
      if logger != "" { __source_kv.logger = logger }
  }

  product = { "name": "Apache Kafka", "vendor_name": "Apache Software Foundation" }

  if !parsed {
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 0,
          "activity_name": "Unknown",
          "type_uid": 0,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": 0,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": sha2("kafka|raw|" + raw_log, variant: "SHA-256"),
              "log_level": "error",
              "log_name": "server",
              "log_provider": "Apache Kafka",
              "product": product
          },
          "unmapped": { "parse_error": "not a Kafka log4j line" }
      }
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      . = set!(., ["unmapped", "parse_fallback"], "unparsable input")
  } else {
      time_ms = 0
      tp, tperr = parse_timestamp(replace(log_time, ",", "."), "%Y-%m-%d %H:%M:%S%.3f", timezone: "UTC")
      if tperr == null { __lc_pending = true }
      # NAN local clock: tp
      # tp was just parsed from a clock WITHOUT an offset, read as UTC
      # (__lc_pending). It becomes real UTC here, at the site, with the log source's
      # timezone (__src_tz / __src_shift_ms from the prelude, or an inline IANA zone
      # the parser validated): a fixed offset by arithmetic; an IANA zone with its DST
      # rules, probed 18 h either side (wider than any UTC offset), an ambiguous
      # fall-back time taking its FIRST occurrence (the earlier offset), a time in a
      # spring-forward gap moving forward by the gap. __NOYEAR__: a clock with no
      # year is tried in its year, the year before and the year after (each with its
      # own DST rules); more than a day in the future means last year, more than 180
      # days in the past means next year when that is not in the future.
      if __lc_pending {
          __lc_pending = false
          __time_assumed = true
          __lc_l = to_unix_timestamp(tp, unit: "milliseconds")
          __lc_cands = [__lc_l]
          __lc_us = map_values(__lc_cands) -> |l| {
              if l == null {
                  null
              } else {
                  __u = int!(l) - __src_shift_ms
                  if __src_tz != "UTC" {
                      __offs = map_values([int!(l) - 64800000, int!(l) + 64800000]) -> |at| {
                          __z = format_timestamp(from_unix_timestamp!(at, unit: "milliseconds"), "%z", timezone: __src_tz) ?? "+0000"
                          __o = ((to_int(slice(__z, 1, 3) ?? "0") ?? 0) * 3600 + (to_int(slice(__z, 3, 5) ?? "0") ?? 0) * 60) * 1000
                          if starts_with(__z, "-") { 0 - __o } else { __o }
                      }
                      __oa = int!(__offs[0])
                      __ob = int!(__offs[1])
                      __u = int!(l) - __oa
                      if __oa != __ob {
                          __ok = map_values([int!(l) - __oa, int!(l) - __ob]) -> |at| {
                              __z = format_timestamp(from_unix_timestamp!(at, unit: "milliseconds"), "%z", timezone: __src_tz) ?? "+0000"
                              __o = ((to_int(slice(__z, 1, 3) ?? "0") ?? 0) * 3600 + (to_int(slice(__z, 3, 5) ?? "0") ?? 0) * 60) * 1000
                              if starts_with(__z, "-") { 0 - __o } else { __o }
                          }
                          if int!(__ok[0]) != __oa && int!(__ok[1]) == __ob { __u = int!(l) - __ob }
                      }
                  }
                  __u
              }
          }
          __lc_u = int!(__lc_us[0])
          # Remembered (local -> UTC) so a transforms rule on the same source clock
          # still finds it at its target.
          if __lc_u != __lc_l { __lc_shifted = __lc_shifted + "\n" + to_string(__lc_l) + "\t" + to_string(__lc_u) + "\n" }
          tp = from_unix_timestamp!(__lc_u, unit: "milliseconds")
      }
      # END NAN local clock
      if tperr == null { time_ms = to_unix_timestamp(tp, unit: "milliseconds") }

      # ---- optional "[Component key=value, ...]" or "[Controller 0]:" context prefix ----
      msg = body
      context = ""
      cm, cmerr = parse_regex(body, r'(?s)^\x5B(?P<context>[^\x5D]+)\x5D:?\s+(?P<msg>.*)$')
      if cmerr == null {
          context = string!(cm.context)
          msg = string!(cm.msg)
          __source_kv.context = context
      }

      lvl = upcase(level)
      severity_id = 1
      severity = "Informational"
      if lvl == "WARN" { severity_id = 3; severity = "Medium" }
      if lvl == "ERROR" { severity_id = 4; severity = "High" }
      if lvl == "FATAL" { severity_id = 6; severity = "Fatal" }

      class_uid = 0
      activity_id = 99
      activity_name = "Other"
      status_id = 0
      status_str = "Unknown"
      status_detail = ""
      log_name = "server"
      ocsf = {}
      profiles = []

      # The principal and the resource name can hold spaces (an mTLS X.500 DN
      # "User:CN=client01, OU=apps, O=Example Corp", a consumer group id), so both
      # are bounded by the literal separators, not by whitespace. Pre-2.x
      # SimpleAclAuthorizer lines end at the resource (no request / refcount).
      az, azerr = parse_regex(msg, r'^Principal = (?P<principal>.+?) is (?P<result>Allowed|Denied) [Oo]peration = (?P<operation>\S+) from host = (?P<host>\S+) on resource = (?P<resource>.+?)(?: for request = (?P<request>\S+) with resourceRefCount = (?P<ref_count>\d+))?(?: based on rule (?P<rule>.+))?$')
      af, aferr = parse_regex(msg, r'(?s)^Failed (?P<reauth>re-)?authentication with (?P<peer>\S+)(?: \x28channelId=(?P<channel_id>[^\x29]*)\x29)? \x28(?P<reason>.*)\x29$')
      asu, asuerr = parse_regex(msg, r'^Successfully authenticated client: authenticationID=(?P<authentication_id>[^;]+); authorizationID=(?P<authorization_id>[^;.]+(?:\.[^;.]+)*)\.?$')

      if azerr == null {
          # ================= authorizer decision -> API Activity (6003) =================
          log_name = "authorizer"
          class_uid = 6003
          principal = string!(az.principal)
          op = string!(az.operation)
          host = string!(az.host)
          resource = string!(az.resource)
          request = string(az.request) ?? ""
          __source_kv = merge(__source_kv, { "principal": principal, "result": string!(az.result), "operation": op, "host": host, "resource": resource })
          if request != "" { __source_kv.request = request; __source_kv.ref_count = to_int(az.ref_count) ?? 0 }
          rule = string(az.rule) ?? ""
          if rule != "" { __source_kv.rule = rule }
          opu = upcase(op)
          if opu == "CREATE" || opu == "CREATE_TOKENS" { activity_id = 1; activity_name = "Create" }
          if includes(["READ", "DESCRIBE", "DESCRIBE_CONFIGS", "DESCRIBE_TOKENS"], opu) { activity_id = 2; activity_name = "Read" }
          if includes(["WRITE", "ALTER", "ALTER_CONFIGS", "IDEMPOTENT_WRITE", "CLUSTER_ACTION"], opu) { activity_id = 3; activity_name = "Update" }
          if opu == "DELETE" { activity_id = 4; activity_name = "Delete" }
          pp = split(principal, ":", limit: 2)
          ptype = string(pp[0]) ?? ""
          pname = string(pp[1]) ?? principal
          actor_user = { "name": pname }
          if ptype == "User" { actor_user.type_id = 1; actor_user.type = "User" }
          ocsf.actor = { "user": actor_user }
          rp = split(resource, ":", limit: 3)
          res = { "type": string(rp[0]) ?? resource }
          if length(rp) == 3 {
              res.name = string(rp[2]) ?? ""
              res.labels = ["pattern_type:" + (string(rp[1]) ?? "")]
          } else if length(rp) == 2 {
              res.name = string(rp[1]) ?? ""
          }
          ocsf.resources = [res]
          ocsf.api = { "operation": op, "service": { "name": "Apache Kafka" } }
          if request != "" { ocsf.api.request = { "uid": request } }
          if is_ipv4(host) || is_ipv6(host) { ocsf.src_endpoint = { "ip": host } } else { ocsf.src_endpoint = { "hostname": host } }
          if string!(az.result) == "Denied" {
              status_id = 2; status_str = "Failure"; status_detail = "Denied"
              if severity_id < 3 { severity_id = 3; severity = "Medium" }
              profiles = ["security_control"]
              ocsf.action_id = 2; ocsf.action = "Denied"
              ocsf.disposition_id = 2; ocsf.disposition = "Blocked"
          } else {
              status_id = 1; status_str = "Success"
              profiles = ["security_control"]
              ocsf.action_id = 1; ocsf.action = "Allowed"
              ocsf.disposition_id = 1; ocsf.disposition = "Allowed"
          }
      } else if aferr == null || asuerr == null {
          # ================= SASL / SSL authentication -> Authentication (3002) =================
          class_uid = 3002
          activity_id = 1
          activity_name = "Logon"
          user = { "name": "unknown" }
          src = {}
          if aferr == null {
              status_id = 2; status_str = "Failure"
              peer = string!(af.peer)
              reason = string!(af.reason)
              status_detail = reason
              if severity_id < 2 { severity_id = 2; severity = "Low" }
              __source_kv = merge(__source_kv, { "peer": peer, "reason": reason })
              chan = string(af.channel_id) ?? ""
              if chan != "" { __source_kv.channel_id = chan }
              if exists(af.reauth) && af.reauth != null { __source_kv.reauth = "re-"; ocsf.is_new_logon = false }
              # Peer is "/192.0.2.10" or "hostname/192.0.2.10".
              pparts = split(peer, "/", limit: 2)
              phost = string(pparts[0]) ?? ""
              pip = string(pparts[1]) ?? ""
              if is_ipv4(pip) || is_ipv6(pip) { src.ip = pip }
              if phost != "" { src.hostname = phost }
              mech = parse_regex(reason, r'SASL mechanism (?P<mech>[A-Z0-9_-]+)') ?? {}
              mname = string(mech.mech) ?? ""
              if mname != "" {
                  ocsf.auth_protocol_id = 99; ocsf.auth_protocol = mname
                  if mname == "GSSAPI" { ocsf.auth_protocol_id = 2; ocsf.auth_protocol = "Kerberos" }
              } else if contains(reason, "SSL") {
                  ocsf.auth_protocol_id = 99; ocsf.auth_protocol = "TLS"
              }
          } else {
              status_id = 1; status_str = "Success"
              aid = strip_whitespace(string!(asu.authentication_id))
              zid = strip_whitespace(string!(asu.authorization_id))
              __source_kv = merge(__source_kv, { "authentication_id": aid, "authorization_id": zid })
              # RFC 4422: the authentication id proved the credentials (the actor);
              # a different authorization id is the identity it acts as (the subject).
              user = { "name": aid }
              if zid != "" && zid != aid {
                  ocsf.actor = { "user": { "name": aid } }
                  user = { "name": zid }
              }
              # SaslServerCallbackHandler is the GSSAPI (Kerberos) callback handler.
              if ends_with(logger, "SaslServerCallbackHandler") { ocsf.auth_protocol_id = 2; ocsf.auth_protocol = "Kerberos" }
          }
          ocsf.user = user
          ocsf.service = { "name": "Apache Kafka" }
          ocsf.is_remote = true
          if length(src) > 0 { ocsf.src_endpoint = src }
      } else {
          is_server = ends_with(logger, "KafkaServer") || ends_with(logger, "KafkaRaftServer") || ends_with(logger, "BrokerServer") || ends_with(logger, "ControllerServer")
          ml = downcase(msg)
          if is_server && (ml == "started" || ml == "kafka server started" || contains(ml, "transition from starting to started")) {
              class_uid = 6002; activity_id = 3; activity_name = "Start"; status_id = 1; status_str = "Success"
              ocsf.app = product
          } else if is_server && (ml == "shut down completed" || ml == "shutdown completed") {
              class_uid = 6002; activity_id = 4; activity_name = "Stop"; status_id = 1; status_str = "Success"
              ocsf.app = product
          } else if lvl == "ERROR" || lvl == "FATAL" {
              class_uid = 6008; activity_id = 1; activity_name = "General Error"; status_id = 2; status_str = "Failure"
          }
          if contains(logger, "controller") || starts_with(context, "Controller") { log_name = "controller" }
          if logger == "state.change.logger" { log_name = "state-change" }
      }

      cls_name = "Base Event"
      cat_uid = 0
      cat_name = "Uncategorized"
      if class_uid == 3002 { cls_name = "Authentication"; cat_uid = 3; cat_name = "Identity & Access Management" }
      if class_uid == 6002 { cls_name = "Application Lifecycle"; cat_uid = 6; cat_name = "Application Activity" }
      if class_uid == 6003 { cls_name = "API Activity"; cat_uid = 6; cat_name = "Application Activity" }
      if class_uid == 6008 { cls_name = "Application Error"; cat_uid = 6; cat_name = "Application Activity" }

      ocsf.class_uid = class_uid
      ocsf.class_name = cls_name
      ocsf.category_uid = cat_uid
      ocsf.category_name = cat_name
      ocsf.activity_id = activity_id
      ocsf.activity_name = activity_name
      ocsf.type_uid = class_uid * 100 + activity_id
      ocsf.severity_id = severity_id
      ocsf.severity = severity
      ocsf.status_id = status_id
      ocsf.status = status_str
      if status_detail != "" { ocsf.status_detail = status_detail }
      if !exists(ocsf.message) { ocsf.message = msg }
      ocsf.time = time_ms
      ocsf.raw_data = raw_log
      meta = {
          "version": "1.9.0",
          "uid": sha2("kafka|raw|" + raw_log, variant: "SHA-256"),
          "log_name": log_name,
          "log_provider": "Apache Kafka",
          "log_level": level,
          "product": product
      }
      if length(profiles) > 0 { meta.profiles = profiles }
      if logger != "" { meta.loggers = [{ "name": logger }] }
      ocsf.metadata = meta

      . = ocsf
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # Values spill exactly as parsed: a parser never masks, redacts or withholds
  # anything (masking is an opt-in pipeline step, never a parser concern).
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # A source field is consumed ONLY by an explicit mapping: a field-coverage.yaml
  # `mappings` entry (source key -> target paths) or a `transforms` rule with a
  # target, whose value is found AT THAT TARGET PATH of the selected branch. A
  # value that merely appears somewhere else in the event never consumes a field
  # (no coincidental consumption); everything else spills.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The sets below are strings instead
  # (a read shares the buffer). __repr holds one member per mapped leaf:
  # "," + encode_json(path) + "=" + encode_json(encode_json(value)), plus the
  # to_string form for a string or a float, so a numeric string is represented by
  # its typed scalar. Every part is a JSON text, inside which a '"' is always
  # escaped, so a member is matched exactly. Paths drop array indices
  # (resources.0.uid is resources.uid); arrays are walked two levels deep, and a
  # leaf deeper than that is simply not mapping evidence (it can only spill more).
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped = object!(parse_json!(encode_json(__mapped)))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __copy = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __repr = ""
  for_each(flatten(__mapped)) -> |path, value| {
      __p = encode_json(path)
      if is_array(value) {
          for_each(array!(value)) -> |_i, item| {
              if is_object(item) {
                  for_each(flatten(object!(item))) -> |sub, leaf| {
                      __q = encode_json(path + "." + sub)
                      if is_array(leaf) {
                          for_each(array!(leaf)) -> |_j, x| {
                              if !is_object(x) && !is_array(x) {
                                  __repr = __repr + ("," + __q + "=" + encode_json(encode_json(x)))
                                  if is_string(x) || is_float(x) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(x))) }
                              }
                          }
                      } else {
                          __repr = __repr + ("," + __q + "=" + encode_json(encode_json(leaf)))
                          if is_string(leaf) || is_float(leaf) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(leaf))) }
                      }
                  }
              } else if !is_array(item) {
                  __repr = __repr + ("," + __p + "=" + encode_json(encode_json(item)))
                  if is_string(item) || is_float(item) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(item))) }
              }
          }
      } else {
          __repr = __repr + ("," + __p + "=" + encode_json(encode_json(value)))
          if is_string(value) || is_float(value) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(value))) }
      }
  }
  __consumed = ""
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__copy.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # BEGIN parser-specific transformations
  # Declared source -> target mappings (field-coverage.yaml `mappings`).
  __decl = "\n\"authentication_id\"\t[\"actor.user.name\"]\n\"authorization_id\"\t[\"user.name\"]\n\"host\"\t[\"src_endpoint.ip\"]\n\"level\"\t[\"metadata.log_level\"]\n\"logger\"\t[\"metadata.loggers.name\"]\n\"operation\"\t[\"api.operation\"]\n\"reason\"\t[\"status_detail\"]\n\"request\"\t[\"api.request.uid\"]\n"
  __preserve = []
  # END parser-specific transformations
  # Declared mappings: __decl holds "\n" + encode_json(key) + "\t" + JSON array of
  # target paths + "\n" per mapped source key (a raw newline never occurs in
  # compact JSON). A key is consumed when its value, or every element of a scalar
  # array, is at one of its own targets. Keys stay ESCAPED here and in __consumed:
  # a literal dotted key ("a~1b") and the nested path ("a.b") are different
  # fields, and mapping one never consumes the other.
  for_each(__flat) -> |key, value| {
      # __decl spells a bracket inside a key as a \u escape (deploy bracket count).
      __kt = encode_json(key)
      if match(__kt, r'[\x28\x29\x5B\x5D\x7B\x7D]') {
          __kt = replace(replace(replace(replace(replace(replace(__kt, r'\x28', "\\u0028"), r'\x29', "\\u0029"), r'\x5B', "\\u005b"), r'\x5D', "\\u005d"), r'\x7B', "\\u007b"), r'\x7D', "\\u007d")
      }
      __at = find(__decl, "\n" + __kt + "\t")
      if is_integer(__at) && !is_object(value) {
          __rest = slice!(__decl, int!(__at) + strlen(__kt) + 2)
          __hit = false
          for_each(array!(parse_json!(slice!(__rest, 0, int!(find(__rest, "\n")))))) -> |_i, target| {
              __tok = "," + encode_json(target) + "="
              if !__hit && is_array(value) {
                  __all = !is_empty(array!(value))
                  for_each(array!(value)) -> |_j, item| {
                      if __all {
                          __all = !is_object(item) && !is_array(item) && (contains(__repr, __tok + encode_json(encode_json(item))) || ((is_string(item) || is_float(item)) && contains(__repr, __tok + encode_json(to_string!(item)))))
                      }
                  }
                  __hit = __all
              } else if !__hit {
                  __hit = contains(__repr, __tok + encode_json(encode_json(value))) || ((is_string(value) || is_float(value)) && contains(__repr, __tok + encode_json(to_string!(value))))
              }
          }
          if __hit { __consumed = __consumed + ("," + encode_json(key)) }
      }
  }
  # Fast path: when no two source keys decode to the same key and no two spilled
  # keys get the same name, each key's decision depends only on its own value, so
  # one filter and one rename build the residual without copying it per key.
  __distinct = true
  if __tilde {
      __distinct = length(map_keys(__flat) -> |key| { replace(replace(key, "~1", "."), "~0", "~") }) == length(__flat)
  }
  __kept = {}
  __names = {}
  if __distinct {
      __kept = filter(__flat) -> |key, value| {
          # A key is kept unless an explicit mapping or transformation consumed it.
          # Do not spill a copy of the raw body.
          value != __raw_body && !contains(__consumed, "," + encode_json(key))
      }
      __names = map_keys(__kept) -> |key| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          join!(__parts, ".")
      }
  }
  __residual = {}
  if __distinct && length(__names) == length(__kept) {
      __residual = map_values(__names) -> |value| {
          if is_array(value) || is_object(value) {
              if __tilde {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              if __complex { value = encode_json(value) }
          }
          value
      }
  } else {
      # Slow path, in source key order: a name already taken gets the next free
      # _2, _3, ... suffix.
      for_each(__flat) -> |key, value| {
          __token = "," + encode_json(key)
          key = replace(replace(key, "~1", "."), "~0", "~")
          if is_array(value) || is_object(value) {
              value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                  replace(replace(inner, "~1", "."), "~0", "~")
              }, ["v"])
          }
          if !contains(__consumed, __token) && value != __raw_body {
              __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
              __base = join!(__parts, ".")
              __key = __base
              __suffix = 2
              if includes(keys(__residual), __key) {
                  for_each(__flat) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __key) {
                          __key = __base + "_" + to_string(__suffix)
                          __suffix = __suffix + 1
                      }
                  }
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              __spill = if __complex { encode_json(value) } else { value }
              __residual = set!(__residual, [__key], __spill)
          }
      }
  }
  # Names nano owns in unmapped (the parser markers and the reserved nano.*
  # namespace) are never taken by a source field: a vendor key with such a name
  # is kept, renamed source_<name>, so a log cannot forge a marker.
  if match(encode_json(keys(__residual)), r'"nano(?:"|\.|_time_assumed_tz"|_time_source"|_operational")') {
      for_each(object!(__residual)) -> |key, value| {
          if includes(["nano", "nano_time_assumed_tz", "nano_time_source", "nano_operational"], key) || starts_with(key, "nano.") {
              # source_<name>, or the next free _2, _3, ... when a vendor key
              # already holds that name: nothing is lost.
              __rk = "source_" + key
              __rn = 2
              if includes(keys(__residual), __rk) {
                  for_each(__residual) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __rk) {
                          __rk = "source_" + key + "_" + to_string(__rn)
                          __rn = __rn + 1
                      }
                  }
              }
              __residual = remove!(__residual, [key])
              __residual = set!(__residual, [__rk], value)
          }
      }
  }
  # Keep existing derived evidence, but remove null placeholders and copies of a
  # source value (that value is mapped or spilled above under its source path).
  # A value merely equal to some mapped attribute is kept: equality with an
  # unrelated attribute is no evidence that it is represented.
  # The canonical source spill above is the authoritative representation of
  # containers. The cheap conditions run first; the source value set is built on
  # first use.
  __original_values = null
  for_each(flatten(__existing)) -> |key, value| {
      if !is_null(value) && value != "" && !is_array(value) && !is_object(value) && value != __raw_body {
          # Members for the value itself and for to_string(value), as above.
          __json = encode_json(value)
          __as_json = "," + encode_json(__json)
          __as_string = __as_json
          if is_string(value) { __as_string = "," + __json } else if is_float(value) { __as_string = "," + encode_json(to_string!(value)) }
          if __original_values == null {
              # __source_kv may hold non-JSON types (a timestamp), so only an
              # integer or a boolean skips its to_string member here.
              __original_values = join!(map_values(values(flatten(__source_kv))) -> |source_value| {
                  __source_json = encode_json(source_value)
                  __tokens = "," + encode_json(__source_json)
                  if is_string(source_value) {
                      __tokens = __tokens + "," + __source_json
                  } else if !is_object(source_value) && !is_array(source_value) && !is_integer(source_value) && !is_boolean(source_value) {
                      __tokens = __tokens + "," + encode_json(to_string(source_value) ?? "")
                  }
                  __tokens
              }, "")
          }
          __source_set = string!(__original_values)
          __keep = !contains(__source_set, __as_json) && !contains(__source_set, __as_string)
          # Only text opening an object or an array (after JSON whitespace)
          # decodes to a container.
          if __keep && is_string(value) && match(string!(value), r'^[ \t\n\r]*[\x5B\x7B]') {
              __decoded, __decode_err = parse_json(string!(value))
              __keep = !(__decode_err == null && (is_object(__decoded) || is_array(__decoded)))
          }
          if __keep {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, as-is. These
  # entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__copy.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  if __time_assumed && !__time_inline { __residual = set!(__residual, ["nano_time_assumed_tz"], __src_tz_label) }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

samples:
  - raw: '[2024-05-02 10:11:12,345] INFO Principal = User:alice is Denied operation = READ from host = 192.0.2.10 on resource = Topic:LITERAL:orders for request = Fetch with resourceRefCount = 1 based on rule DefaultDeny (kafka.authorizer.logger)'
    expect:
      class_uid: 6003
      activity_id: 2
      status_id: 2
      action_id: 2
      "actor.user.name": "alice"
      "src_endpoint.ip": "192.0.2.10"
      "resources.0.name": "orders"
      time: 1714644672345
  - raw: '[2024-05-02 10:12:01,002] INFO [SocketServer listenerType=BROKER, nodeId=1] Failed authentication with /203.0.113.7 (channelId=192.0.2.5:9094-203.0.113.7:51234-12) (Authentication failed during authentication due to invalid credentials with SASL mechanism SCRAM-SHA-512) (org.apache.kafka.common.network.Selector)'
    expect:
      class_uid: 3002
      status_id: 2
      "src_endpoint.ip": "203.0.113.7"
      auth_protocol: "SCRAM-SHA-512"
  - raw: '2025-01-01 12:39:15,875 INFO org.apache.kafka.common.security.authenticator.SaslServerCallbackHandler: [data-plane-kafka-network-thread-543-ListenerName(SASL_SSL)-SASL_SSL-32]: Successfully authenticated client: authenticationID=svc@EXAMPLE.COM; authorizationID=svc@EXAMPLE.COM.'
    expect:
      class_uid: 3002
      status_id: 1
      "user.name": "svc@EXAMPLE.COM"
  - raw: '[2017-08-04 10:48:21,048] INFO [controller-event-thread]: Starting (kafka.controller.ControllerEventManager$ControllerEventThread)'
    expect:
      class_uid: 0
      "metadata.log_name": "controller"
  - raw: '[2024-05-02 10:00:05,771] INFO [KafkaServer id=1] started (kafka.server.KafkaServer)'
    expect:
      class_uid: 6002
      activity_id: 3
  - raw: 'Exception in thread "main" java.lang.OutOfMemoryError: Java heap space'
    expect:
      class_uid: 0
      "unmapped.parse_fallback": "unparsable input"
  # neon #79: an mTLS X.500 DN principal with spaces still parses
  - raw: "[2024-05-02 10:14:05,612] INFO Principal = User:CN=client01, OU=apps, O=Example Corp is Denied operation = READ from host = 192.0.2.10 on resource = Topic:LITERAL:orders for request = Fetch with resourceRefCount = 1 based on rule DefaultDeny (kafka.authorizer.logger)"
    expect:
      "class_uid": 6003
      "action_id": 2
      "actor.user.name": "CN=client01, OU=apps, O=Example Corp"
      "src_endpoint.ip": "192.0.2.10"
  # neon #79: a resource name with spaces
  - raw: "[2024-05-02 10:14:09,020] INFO Principal = User:analytics is Denied operation = READ from host = 192.0.2.11 on resource = Group:LITERAL:nightly report consumers for request = OffsetCommit with resourceRefCount = 1 based on rule DefaultDeny (kafka.authorizer.logger)"
    expect:
      "class_uid": 6003
      "resources.0.name": "nightly report consumers"
      "resources.0.type": "Group"
  # neon #79: pre-2.x SimpleAclAuthorizer line without request / refcount
  - raw: "[2018-03-01 08:00:01,100] INFO Principal = User:bob is Denied Operation = Read from host = 198.51.100.23 on resource = Topic:payments (kafka.authorizer.logger)"
    expect:
      "class_uid": 6003
      "status_id": 2
      "resources.0.name": "payments"
      "api.request.uid": "<missing>"
  # neon #79: authenticationID is the actor, a different authorizationID the subject
  - raw: "2025-01-01 12:41:02,330 INFO org.apache.kafka.common.security.authenticator.SaslServerCallbackHandler: [data-plane-kafka-network-thread-543-ListenerName(SASL_SSL)-SASL_SSL-33]: Successfully authenticated client: authenticationID=svc-proxy@EXAMPLE.COM; authorizationID=alice@EXAMPLE.COM."
    expect:
