source: json
transforms:
- source: config.created_at
  kind: epoch_ms
  format: '%+'
  target: resources.created_time
  reason: The config's creation clock.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  config.name:
  - resources.name
  project.id:
  - resources.uid
  project.name:
  - resources.name
  project.slug:
  - resources.namespace
  type:
  - api.operation
  - metadata.event_code
  workplace.id:
  - resources.uid
  workplace.name:
  - resources.name
