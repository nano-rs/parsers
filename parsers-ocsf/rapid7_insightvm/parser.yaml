name: rapid7_insightvm_ocsf
display_name: Rapid7 InsightVM (OCSF)
version: "1.1.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields in redacted, dotted snake_case unmapped keys.
  Parses Rapid7 InsightVM (Nexpose) vulnerability findings, remediation events
  and asset records into OCSF 1.9.0 "Detection Finding" (class_uid 2004).
  A vulnerability finding is activity 1 (Create) with status New; a
  remediation is activity 3 (Close) with status Resolved; an asset record is
  activity 2 (Update) carrying the asset's rolled-up risk in `resources[]`.
  CVEs land at the promoted `vulnerabilities[].cve.uid`; the OCSF
  `vulnerability` object requires exactly one of advisory/cve/cwe, so a
  finding with no CVE emits none. Unrecognised shapes become Base Event
  (class_uid 0). Mirrors the UDM rapid7_insightvm parser
  (../parsers/parsers/rapid7_insightvm/parser.yaml).
match_values:
  - rapid7_insightvm
category: security
vendor: "Rapid7"
product: "InsightVM"
parser_vrl: |
  # Rapid7 InsightVM -> OCSF 1.9.0 Detection Finding (2004) / Base Event (0)
  raw_log = string!(.message)
  __raw_body = raw_log
  __source_kv = {}
  ip_re = r'^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$|^[0-9A-Fa-f:]{3,}$'

  p, perr = parse_json(raw_log)
  __source_kv = object(p) ?? {}
  ok = perr == null && is_object(p)
  e = {}
  if ok { e = object!(p) }

  type_field = downcase(to_string(e.type) ?? "")
  is_remediation = type_field == "remediation" || exists(e.remediated_date)
  is_vuln = exists(e.vulnerability_id) && !is_remediation
  is_asset = type_field == "asset" || (exists(e.vulnerabilities) && !exists(e.vulnerability_id))

  shape = "unknown"
  if is_vuln { shape = "vulnerability" } else if is_remediation { shape = "remediation" } else if is_asset { shape = "asset" }

  host_ip = to_string(e.ip) ?? ""
  host_name = to_string(e.hostname) ?? ""
  asset_id = to_string(e.asset_id) ?? ""
  if asset_id == "" { asset_id = to_string(e.id) ?? "" }

  severity_id = 1
  severity = "Informational"
  sev_raw = downcase(to_string(e.severity) ?? "")
  if sev_raw == "critical" { severity_id = 5; severity = "Critical" } else if sev_raw == "severe" { severity_id = 4; severity = "High" } else if sev_raw == "moderate" { severity_id = 3; severity = "Medium" } else if sev_raw == "low" { severity_id = 2; severity = "Low" }

  time_ms = 0
  activity_id = 1
  activity_name = "Create"
  status_id = 1
  status_str = "New"
  title = to_string(e.title) ?? ""
  finding_uid = to_string(e.vulnerability_id) ?? ""
  cves = []
  solution = to_string(e.solution) ?? ""
  unmapped = {}
  port = 0
  types = []

  for_each(["os_name", "os_version", "os_architecture", "mac_address", "site_name", "scan_template", "proof", "exploits", "malware_kits", "cvss_v2_vector", "cvss_v3_vector", "service", "protocol", "status", "first_found", "published", "verified_by", "solution_id", "fqdn"]) -> |_i, k| {
      v = to_string(get(e, [k]) ?? "") ?? ""
      if v != "" { unmapped = set!(unmapped, [k], v) }
  }
  if asset_id != "" { unmapped.asset_id = asset_id }

  cv3 = to_float(e.cvss_v3_score) ?? -1.0
  if cv3 >= 0.0 { unmapped.cvss_v3_score = cv3 }
  cv2 = to_float(e.cvss_v2_score) ?? -1.0
  if cv2 >= 0.0 { unmapped.cvss_v2_score = cv2 }

  cl = array(e.cves) ?? []
  for_each(cl) -> |_i, c| {
      cs = to_string(c) ?? ""
      if cs != "" { cves = push(cves, cs) }
  }

  if shape == "vulnerability" {
      types = ["Vulnerability"]
      pv = to_int(e.port) ?? 0
      if pv != 0 { port = pv }
      lf = to_string(e.last_found) ?? ""
      if lf != "" {
          t, terr = parse_timestamp(lf, "%+")
          if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
      }
      cats = array(e.categories) ?? []
      if length(cats) > 0 { unmapped.categories = encode_json(cats) }
      sid = to_string(e.scan_id) ?? ""
      if sid != "" { unmapped.scan_id = sid }
  } else if shape == "remediation" {
      types = ["Vulnerability Remediation"]
      activity_id = 3
      activity_name = "Close"
      status_id = 4
      status_str = "Resolved"
      rd = to_string(e.remediated_date) ?? ""
      if rd != "" {
          t, terr = parse_timestamp(rd, "%+")
          if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
      }
  } else if shape == "asset" {
      types = ["Asset Assessment"]
      activity_id = 2
      activity_name = "Update"
      status_id = 2
      status_str = "In Progress"
      if title == "" { title = "Asset assessment" }
      if finding_uid == "" { finding_uid = asset_id }
      la = to_string(e.last_assessed_for_vulnerabilities) ?? ""
      if la != "" {
          t, terr = parse_timestamp(la, "%+")
          if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
      }
      v = object(e.vulnerabilities) ?? {}
      for_each(["total", "critical", "severe", "moderate", "low"]) -> |_i, k| {
          n = to_int(get(v, [k]) ?? -1) ?? -1
          if n >= 0 { unmapped = set!(unmapped, ["vuln_" + k], n) }
      }
      tg = array(e.tags) ?? []
      if length(tg) > 0 { unmapped.tags = encode_json(tg) }
      lsi = to_string(e.last_scan_id) ?? ""
      if lsi != "" { unmapped.scan_id = lsi }
  }

  risk = to_float(e.risk_score) ?? -1.0

  if ok && shape != "unknown" {
      if finding_uid == "" { finding_uid = uuid_v4() }
      if title == "" { title = "InsightVM finding " + finding_uid }

      finding_info = { "uid": finding_uid, "title": title, "data_sources": ["rapid7_insightvm"] }
      if length(types) > 0 { finding_info.types = types }
      finding_info.analytic = { "name": "Rapid7 InsightVM", "type_id": 1, "type": "Rule" }

      . = {
          "class_uid": 2004,
          "class_name": "Detection Finding",
          "category_uid": 2,
          "category_name": "Findings",
          "activity_id": activity_id,
          "activity_name": activity_name,
          "type_uid": 200400 + activity_id,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": status_id,
          "status": status_str,
          "is_alert": severity_id >= 4,
          "time": time_ms,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": uuid_v4(),
              "log_name": "insightvm-" + shape,
              "product": { "name": "InsightVM", "vendor_name": "Rapid7" }
          },
          "finding_info": finding_info
      }

      res = {}
      if match(host_ip, ip_re) { res.ip = host_ip }
      if host_name != "" { res.hostname = downcase(host_name); res.name = host_name }
      if !exists(res.name) && exists(res.ip) { res.name = host_ip }
      if !exists(res.name) && asset_id != "" { res.uid = asset_id }
      if length(res) > 0 {
          res.type = "Host"
          # InsightVM's asset risk score is a rolled-up per-asset number, which
          # is exactly what resource_details.device.risk_score is for. It is
          # NOT the event's risk_score — that is owned by nano's RBA engine.
          if risk >= 0.0 {
              dev = { "type_id": 0, "risk_score": to_int(round(risk)) }
              if exists(res.hostname) { dev.hostname = res.hostname }
              if exists(res.ip) { dev.ip = res.ip }
              res.device = dev
          }
          .resources = [res]
      }

      if match(host_ip, ip_re) {
          de = { "ip": host_ip }
          if port != 0 { de.port = port }
          if host_name != "" { de.hostname = downcase(host_name) }
          .evidences = [{ "dst_endpoint": de }]
      }

      if length(cves) > 0 {
          vulns = []
          for_each(cves) -> |_i, c| {
              v = { "cve": { "uid": to_string(c) ?? "" } }
              if title != "" { v.title = title }
              if severity != "" { v.severity = severity }
              if solution != "" { v.remediation = { "desc": solution } }
              if shape == "remediation" { v.is_fix_available = true }
              vulns = push(vulns, v)
          }
          .vulnerabilities = vulns
      } else if solution != "" {
          .remediation = { "desc": solution }
      }

      # See the qualys parser: `evidences.*` and `vulnerabilities[].cve.uid`
      # are not addressable in nPL, so pivotable entities are ALSO emitted as
      # OCSF observables, which ARE promoted.
      obs = []
      for_each(cves) -> |_i, c| {
          cv = to_string(c) ?? ""
          if cv != "" { obs = push(obs, { "name": "vulnerabilities.cve.uid", "type": "CVE Object: uid", "type_id": 18, "value": cv }) }
      }
      if match(host_ip, ip_re) { obs = push(obs, { "name": "resources.ip", "type": "IP Address", "type_id": 2, "value": host_ip }) }
      if host_name != "" { obs = push(obs, { "name": "resources.hostname", "type": "Hostname", "type_id": 1, "value": downcase(host_name) }) }
      if length(obs) > 0 { .observables = obs }

      if length(unmapped) > 0 { .unmapped = unmapped }
  } else {
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 99,
          "activity_name": "Other",
          "type_uid": 99,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": 0,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": uuid_v4(),
              "log_name": "insightvm",
              "product": { "name": "InsightVM", "vendor_name": "Rapid7" }
          }
      }
      if !ok { .metadata.log_level = "error" }
  }

  .

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # Exact value representation is evaluated AFTER branch selection. Numeric strings
  # count as represented by their typed scalar; other transformations are explicit.
  __mapped = object!(parse_json!(encode_json(.)))
  __existing = object(__mapped.unmapped) ?? {}
  __discard = del(__mapped.raw_data)
  __discard = del(__mapped.unmapped)
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __represented = []
  __walk = map_values(__mapped, recursive: true) -> |value| {
      __represented = push(__represented, encode_json(value))
      if !is_object(value) && !is_array(value) && !is_null(value) {
          __represented = push(__represented, to_string(value) ?? "")
      }
      value
  }
  __consumed = []
  # BEGIN parser-specific transformations
  # type: Parser lowercases this source value; consume only when the normalized value is emitted.
  # severity: Parser lowercases this source value; consume only when the normalized value is emitted.
  # last_found: Successful ISO timestamp conversion to the selected event clock in milliseconds.
  # remediated_date: Successful ISO timestamp conversion to the selected event clock in milliseconds.
  # last_assessed_for_vulnerabilities: Successful ISO timestamp conversion to the selected event clock in milliseconds.
  # Only source keys read by this parser are eligible for exact-value consumption; the selected branch must emit the value. Unknown keys always spill, even when their value equals an OCSF default.
  __candidates = ["asset_id", "categories", "cves", "cvss_v2_score", "cvss_v3_score", "hostname", "id", "ip", "last_assessed_for_vulnerabilities", "last_found", "last_scan_id", "port", "remediated_date", "risk_score", "scan_id", "severity", "solution", "tags", "title", "type", "vulnerabilities", "vulnerabilities.is_fix_available", "vulnerabilities.remediation", "vulnerabilities.severity", "vulnerabilities.title", "vulnerability_id"]
  __preserve = []
  __rules = array!(parse_json!("[{\"source\":\"type\",\"kind\":\"lowercase\",\"reason\":\"Parser lowercases this source value; consume only when the normalized value is emitted.\"},{\"source\":\"severity\",\"kind\":\"lowercase\",\"reason\":\"Parser lowercases this source value; consume only when the normalized value is emitted.\"},{\"source\":\"last_found\",\"kind\":\"epoch_ms\",\"target\":\"time\",\"reason\":\"Successful ISO timestamp conversion to the selected event clock in milliseconds.\"},{\"source\":\"remediated_date\",\"kind\":\"epoch_ms\",\"target\":\"time\",\"reason\":\"Successful ISO timestamp conversion to the selected event clock in milliseconds.\"},{\"source\":\"last_assessed_for_vulnerabilities\",\"kind\":\"epoch_ms\",\"target\":\"time\",\"reason\":\"Successful ISO timestamp conversion to the selected event clock in milliseconds.\"}]"))
  __source_flat = flatten(__source_kv)
  for_each(__rules) -> |_index, rule| {
      __source_key = string!(rule.source)
      __value = get!(__source_flat, [__source_key])
      __expected = null
      __valid = false
      if rule.kind == "lowercase" && is_string(__value) {
          __expected = downcase(string!(__value))
          __valid = true
      } else if rule.kind == "epoch_ms" {
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", string(rule.format) ?? "%+")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              __valid = true
          }
      } else if rule.kind == "scale" {
          __number, __number_err = to_float(__value)
          if __number_err == null && __value != null && !is_boolean(__value) {
              __expected = to_int(__number * to_float!(rule.factor))
              __valid = true
          }
      } else if rule.kind == "hex" {
          __hex = replace(downcase(string(__value) ?? ""), r'^0x', "")
          __integer, __integer_err = parse_int(__hex, base: 16)
          __expected = __integer
          __valid = is_string(__value) && starts_with(downcase(string(__value) ?? ""), "0x") && __integer_err == null
      } else if rule.kind == "enum" {
          __expected = get!(object!(rule.values), [downcase(to_string(__value) ?? "")])
          __valid = __expected != null
      }
      __matches = includes(__represented, encode_json(__expected))
      if is_string(rule.target) { __matches = get!(., split(string!(rule.target), ".")) == __expected }
      if __valid && __matches { __consumed = push(__consumed, __source_key) }
  }
  # END parser-specific transformations
  # Redact at every depth, including objects inside arrays, before serialization.
  __safe = map_values(object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing}))), recursive: true) -> |value| {
      if is_object(value) {
          # Header/parameter arrays commonly encode sensitive keys as name/value
          # or Key/Value objects instead of using the secret name as an object key.
          __sensitive_pair = false
          for_each(object!(value)) -> |key, child| {
              if includes(["name", "key"], downcase(key)) && match(downcase(string(child) ?? ""), r'password|secret|authorization|token') {
                  __sensitive_pair = true
              }
          }
          for_each(object!(value)) -> |key, _child| {
              if match(downcase(key), r'password|secret|authorization|token') || (__sensitive_pair && includes(["value", "values"], downcase(key))) {
                  value = set!(value, [key], "<redacted>")
              }
          }
      }
      value
  }
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  __escaped = map_keys(object!(__safe.source), recursive: true) -> |key| {
      replace(replace(key, "~", "~0"), ".", "~1")
  }
  __flat = flatten(__escaped)
  __residual = {}
  for_each(__flat) -> |key, value| {
      key = replace(replace(key, "~1", "."), "~0", "~")
      __same = includes(__represented, encode_json(value))
      if !is_object(value) && !is_array(value) && !is_null(value) {
          __same = __same || includes(__represented, to_string(value) ?? "")
      }
      # A scalar array is consumed only if every element is represented. Preserve
      # partially represented arrays intact, including their ordering and repeats.
      if is_array(value) && !is_empty(array!(value)) {
          __all_items = true
          for_each(array!(value)) -> |_index, item| {
              __item_same = includes(__represented, encode_json(item))
              if !is_object(item) && !is_array(item) && !is_null(item) {
                  __item_same = __item_same || includes(__represented, to_string(item) ?? "")
              }
              if is_object(item) || is_array(item) || !__item_same { __all_items = false }
          }
          __same = __same || __all_items
      }
      if __same && includes(__candidates, key) { __consumed = push(__consumed, key) }
      # Redacted leaves always remain visible. Do not spill a copy of the raw body.
      if (!includes(__consumed, key) || value == "<redacted>") && value != __raw_body {
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          __base = join!(__parts, ".")
          __key = __base
          __suffix = 2
          if includes(keys(__residual), __key) {
              for_each(__flat) -> |_other_key, _other_value| {
                  if includes(keys(__residual), __key) {
                      __key = __base + "_" + to_string(__suffix)
                      __suffix = __suffix + 1
                  }
              }
          }
          __complex = is_object(value)
          if is_array(value) {
              for_each(array!(value)) -> |_index, item| {
                  if is_object(item) || is_array(item) { __complex = true }
              }
          }
          __spill = if __complex { encode_json(value) } else { value }
          __residual = set!(__residual, [__key], __spill)
      }
  }
  # Keep existing derived evidence, but remove null placeholders and mapped copies.
  # Source-derived aliases are replaced by canonical dotted source paths above.
  __original_values = []
  for_each(flatten(__source_kv)) -> |_key, value| {
      __original_values = push(__original_values, encode_json(value))
      if !is_object(value) && !is_array(value) { __original_values = push(__original_values, to_string(value) ?? "") }
  }
  for_each(flatten(__existing)) -> |key, value| {
      __source_alias = includes(__original_values, encode_json(value)) || includes(__original_values, to_string(value) ?? "")
      __mapped_alias = includes(__represented, encode_json(value)) || includes(__represented, to_string(value) ?? "")
      __decoded, __decode_err = parse_json(string(value) ?? "")
      __encoded_container = __decode_err == null && (is_object(__decoded) || is_array(__decoded))
      if !is_null(value) && value != "" && !__source_alias && !__mapped_alias && !__encoded_container && value != __raw_body {
          # Existing aggregates may contain sensitive descendants; the canonical
          # source spill above is the authoritative representation of containers.
          if !is_array(value) && !is_object(value) && !match(downcase(key), r'password|secret|authorization|token') {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, with recursive
  # redaction. These entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__safe.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

# Runtime samples (NAN-2327): one per event shape this parser routes.
# `class_uid` is asserted because class routing is the whole point of the
# OCSF conversion — a silent reroute is the defect most likely to survive
# a compile-only check.
samples:
  - raw: '{"type":"asset","id":"asset-4471","ip":"10.95.2.8","hostname":"db03.corp.example","fqdn":"db03.corp.example","os_name":"Windows Server 2022","mac_address":"00:11:22:33:44:55","site_name":"Prod DMZ","risk_score":15230.5,"vulnerabilities":{"total":47,"critical":3,"severe":19,"moderate":21,"low":4},"tags":["pci","prod"],"last_assessed_for_vulnerabilities":"2026-08-12T06:00:00Z","last_scan_id":"scan-771"}'
    expect:
      class_uid: 2004
      activity_id: 2
  - raw: '{"type":"remediation","vulnerability_id":"ssl-cve-2026-1234","title":"OpenSSL Remote Code Execution","ip":"10.95.2.7","hostname":"app02.corp.example","solution":"Upgrade OpenSSL to 3.0.14 or later","solution_id":"openssl-upgrade","verified_by":"scan-802","remediated_date":"2026-08-15T04:00:00Z","cves":["CVE-2026-1234"],"severity":"Critical"}'
    expect:
      class_uid: 2004
      activity_id: 3
  - raw: '{"foo":"bar"}'
    expect:
      class_uid: 0
      activity_id: 99
  - raw: '{"type":"vulnerability","vulnerability_id":"ssl-cve-2026-1234","title":"OpenSSL Remote Code Execution","severity":"Critical","cvss_v3_score":9.8,"cvss_v2_score":10.0,"cvss_v3_vector":"CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H","cves":["CVE-2026-1234"],"ip":"10.95.2.7","hostname":"app02.corp.example","os_name":"Ubuntu Linux","os_version":"24.04","port":443,"protocol":"tcp","service":"https","status":"vulnerable-version","risk_score":892.4,"exploits":3,"malware_kits":1,"proof":"Version banner reports OpenSSL 3.0.1","solution":"Upgrade OpenSSL to 3.0.14 or later","solution_id":"openssl-upgrade","categories":["Web","Encryption"],"scan_id":"scan-771","first_found":"2026-07-01T00:00:00Z","last_found":"2026-08-12T06:00:00Z","site_name":"Prod DMZ"}'
    expect:
      class_uid: 2004
      activity_id: 1
