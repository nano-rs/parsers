source: json
transforms:
- source: category
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value
    is emitted.
- source: timestamp
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: aux_details.name
  kind: lowercase
  reason: Case normalization already performed by the parser; observed at user.name,
    and checked against the emitted branch.
- source: category
  kind: enum
  target: status
  values:
    success: Success
  reason: Parser normalizes the caption case; verify the emitted caption.
consumed_candidates:
- action
- actor_details
- actor_details.email
- actor_details.name
- actor_details.uuid
- actor_uuid
- aux_details
- aux_details.email
- aux_details.name
- aux_id
- category
- client
- client.app_name
- client.app_version
- client.ip
- client.ip_address
- client.os_name
- client.os_version
- client.platform_name
- client.platform_version
- country
- details.value
- item_uuid
- location
- location.city
- location.country
- location.region
- object_type
- object_uuid
- session
- session.device_uuid
- session.ip
- session_uuid
- target_user
- target_user.email
- target_user.name
- target_user.uuid
- timestamp
- type
- used_version
- user
- user.email
- user.name
- user.uuid
- uuid
- vault_uuid
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
