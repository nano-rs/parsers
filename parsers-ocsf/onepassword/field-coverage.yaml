source: json
transforms:
- source: aux_details.name
  kind: lowercase
  target: user.name
  reason: Case normalization already performed by the parser; observed at user.name, and checked against
    the emitted branch.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  action:
  - api.operation
  - message
  - metadata.event_code
  actor_details.email:
  - actor.user.email_addr
  - actor.user.name
  actor_details.name:
  - actor.user.full_name
  actor_details.uuid:
  - actor.user.uid
  actor_uuid:
  - actor.user.uid
  aux_details.name:
  - group.name
  - resources.name
  client.ip_address:
  - src_endpoint.ip
  country:
  - src_endpoint.location.country
  item_uuid:
  - resources.name
  - resources.uid
  location.country:
  - src_endpoint.location.country
  object_type:
  - resources.type
  object_uuid:
  - group.uid
  - resources.uid
  - user.uid
  session.ip:
  - src_endpoint.ip
  session_uuid:
  - session.uid
  target_user.email:
  - user.email_addr
  - user.name
  target_user.name:
  - user.full_name
  target_user.uuid:
  - user.uid
  type:
  - message
  - metadata.event_code
  - status_detail
  user.email:
  - actor.user.email_addr
  - actor.user.name
  user.name:
  - actor.user.full_name
  user.uuid:
  - actor.user.uid
  uuid:
  - metadata.original_event_uid
  - metadata.uid
  vault_uuid:
  - resources.name
  - resources.uid
