name: onepassword_ocsf
display_name: 1Password (OCSF)
version: "1.1.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields in redacted, dotted snake_case unmapped keys.
  Parses 1Password Events API records into complete OCSF 1.9.0 records:
    signinattempts (category/type/session_uuid) -> Authentication 3002
    itemusages (item_uuid + action)             -> API Activity 6003 (Read) —
      a vault item being revealed is a credential read, and the item and vault
      are carried as `resources[]`
    auditevents object_type=user                -> User Management 3007
    auditevents object_type=group               -> Group Management 3006
    auditevents (everything else)               -> API Activity 6003
  On auditevents the acting administrator is `actor.user` (from actor_details)
  and the account named by object_uuid/aux_details is the subject (`user`).
match_values:
  - onepassword
category: security
vendor: "1Password"
product: "1Password"
parser_vrl: |
  # 1Password Events API JSON -> OCSF 1.9.0.
  raw_log = string!(.message)
  __raw_body = raw_log
  __source_kv = {}
  parsed, err = parse_json(raw_log)
  __source_kv = object(parsed) ?? {}

  if err != null || !is_object(parsed) {
      # Unparseable input is emitted as an OCSF Base Event (class_uid 0)
      # rather than being guessed into a security class: it stays valid, and
      # therefore visible, without fabricating a user or an outcome.
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 0,
          "activity_name": "Unknown",
          "type_uid": 0,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": 0,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": uuid_v4(),
              "log_level": "error",
              "log_name": "1Password Events API",
              "log_provider": "1Password",
              "product": { "name": "1Password", "vendor_name": "1Password" }
          },
          "unmapped": { "parse_error": "not a JSON object" }
      }
  } else {
      p = object!(parsed)
      client = object(p.client) ?? {}
      loc = object(p.location) ?? {}
      target_user = object(p.target_user) ?? {}
      item_user = object(p.user) ?? {}
      actor_details = object(p.actor_details) ?? {}
      aux_details = object(p.aux_details) ?? {}
      sess = object(p.session) ?? {}

      # ---- time ----
      time_ms = 0
      ts_str = string(p.timestamp) ?? ""
      if ts_str != "" {
          t, terr = parse_timestamp(ts_str, "%+")
          if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
      }

      # ---- shape detection ----
      is_item_usage = exists(p.item_uuid)
      is_audit = exists(p.object_type) || exists(p.actor_uuid)
      is_signin = !is_item_usage && !is_audit

      # ---- helper: turn a 1Password user object into an OCSF user ----
      email = string(target_user.email) ?? string(item_user.email) ?? string(actor_details.email) ?? ""
      uname = string(target_user.name) ?? string(item_user.name) ?? string(actor_details.name) ?? ""
      uuid_v = string(target_user.uuid) ?? string(item_user.uuid) ?? string(actor_details.uuid) ?? ""
      if uuid_v == "" { uuid_v = string(p.actor_uuid) ?? "" }
      principal_name = email
      if principal_name == "" { principal_name = uname }
      principal = { "name": downcase(principal_name) }
      if principal_name == "" { principal = { "name": "unknown" } }
      if uuid_v != "" { principal = set!(principal, ["uid"], uuid_v) }
      if match(email, r'^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$') {
          principal = set!(principal, ["email_addr"], downcase(email))
      }
      if uname != "" { principal = set!(principal, ["full_name"], uname) }

      action = string(p.action) ?? ""
      object_type = string(p.object_type) ?? ""

      ocsf = {}
      status_id = 1
      status_str = "Success"
      severity_id = 1
      severity = "Informational"

      if is_signin {
          category = downcase(string(p.category) ?? "")
          signin_type = string(p.type) ?? ""
          if category == "success" {
              status_id = 1; status_str = "Success"
          } else if category != "" {
              status_id = 2; status_str = "Failure"; severity_id = 2; severity = "Low"
          }

          ocsf.class_uid = 3002
          ocsf.class_name = "Authentication"
          ocsf.category_uid = 3
          ocsf.category_name = "Identity & Access Management"
          ocsf.activity_id = 1
          ocsf.activity_name = "Logon"
          # Authentication 3002 carries the authenticating principal in `user`.
          ocsf.user = principal
          ocsf.service = { "name": "1Password" }
          sid = string(p.session_uuid) ?? ""
          if sid != "" { ocsf.session = { "uid": sid } }
          # 1Password reports MFA state through the failure category and the
          # sign-in step type: mfa_failed / mfa_ok name the second factor.
          ocsf.is_mfa = category == "mfa_failed" || contains(downcase(signin_type), "mfa")
          ocsf.is_remote = true
          if signin_type != "" { ocsf.status_detail = signin_type }
      } else if is_item_usage {
          ocsf.class_uid = 6003
          ocsf.class_name = "API Activity"
          ocsf.category_uid = 6
          ocsf.category_name = "Application Activity"
          ocsf.activity_id = 2
          ocsf.activity_name = "Read"
          ocsf.actor = { "user": principal }
          op = action
          if op == "" { op = "item_usage" }
          ocsf.api = { "operation": op, "service": { "name": "1Password" } }
          resources = []
          item_uuid = string(p.item_uuid) ?? ""
          vault_uuid = string(p.vault_uuid) ?? ""
          if item_uuid != "" { resources = push(resources, { "uid": item_uuid, "type": "Item", "name": item_uuid }) }
          if vault_uuid != "" { resources = push(resources, { "uid": vault_uuid, "type": "Vault", "name": vault_uuid }) }
          if length(resources) > 0 { ocsf.resources = resources }
      } else {
          # auditevents
          subject_name = string(aux_details.name) ?? string(aux_details.email) ?? ""
          object_uuid = string(p.object_uuid) ?? ""
          act_l = downcase(action)
          if object_type == "user" {
              activity_id = 2
              activity_name = "Update"
              if act_l == "create" || act_l == "join" || act_l == "invite" { activity_id = 1; activity_name = "Create" }
              if act_l == "delete" || act_l == "leave" { activity_id = 3; activity_name = "Delete" }
              if act_l == "activate" || act_l == "reactivate" { activity_id = 4; activity_name = "Enable" }
              if act_l == "suspend" || act_l == "deactivate" { activity_id = 5; activity_name = "Disable" }
              if act_l == "changepassword" || act_l == "change_password" { activity_id = 8; activity_name = "Password Change" }
              ocsf.class_uid = 3007
              ocsf.class_name = "User Management"
              ocsf.category_uid = 3
              ocsf.category_name = "Identity & Access Management"
              ocsf.activity_id = activity_id
              ocsf.activity_name = activity_name
              # SUBJECT = the account named by the audit object.
              subj = {}
              if subject_name != "" { subj = set!(subj, ["name"], downcase(subject_name)) }
              if object_uuid != "" { subj = set!(subj, ["uid"], object_uuid) }
              if length(subj) == 0 { subj = { "name": "unknown" } }
              ocsf.user = subj
              ocsf.actor = { "user": principal }
          } else if object_type == "group" {
              activity_id = 99
              activity_name = "Other"
              if act_l == "create" { activity_id = 6; activity_name = "Create" }
              if act_l == "delete" { activity_id = 5; activity_name = "Delete" }
              if act_l == "update" || act_l == "edit" { activity_id = 9; activity_name = "Update" }
              if act_l == "join" || act_l == "add_member" { activity_id = 3; activity_name = "Add User" }
              if act_l == "leave" || act_l == "remove_member" { activity_id = 4; activity_name = "Remove User" }
              ocsf.class_uid = 3006
              ocsf.class_name = "Group Management"
              ocsf.category_uid = 3
              ocsf.category_name = "Identity & Access Management"
              ocsf.activity_id = activity_id
              ocsf.activity_name = activity_name
              grp = {}
              if subject_name != "" { grp = set!(grp, ["name"], subject_name) }
              if object_uuid != "" { grp = set!(grp, ["uid"], object_uuid) }
              if length(grp) == 0 { grp = { "name": "unknown" } }
              ocsf.group = grp
              ocsf.actor = { "user": principal }
          } else {
              activity_id = 99
              activity_name = "Other"
              if act_l == "create" { activity_id = 1; activity_name = "Create" }
              if act_l == "read" || act_l == "view" { activity_id = 2; activity_name = "Read" }
              if act_l == "update" || act_l == "edit" { activity_id = 3; activity_name = "Update" }
              if act_l == "delete" { activity_id = 4; activity_name = "Delete" }
              ocsf.class_uid = 6003
              ocsf.class_name = "API Activity"
              ocsf.category_uid = 6
              ocsf.category_name = "Application Activity"
              ocsf.activity_id = activity_id
              ocsf.activity_name = activity_name
              op = action
              if op == "" { op = "audit_event" }
              if object_type != "" { op = action + " " + object_type }
              ocsf.api = { "operation": op, "service": { "name": "1Password" } }
              ocsf.actor = { "user": principal }
              if object_uuid != "" {
                  rname = subject_name
                  if rname == "" { rname = object_uuid }
                  ocsf.resources = [{ "uid": object_uuid, "type": object_type, "name": rname }]
              }
          }
      }

      # ---- source endpoint ----
      src_ip = string(client.ip_address) ?? string(client.ip) ?? string(sess.ip) ?? ""
      src_ep = {}
      if src_ip != "" { src_ep = set!(src_ep, ["ip"], downcase(src_ip)) }
      country = string(p.country) ?? string(loc.country) ?? ""
      if country != "" { src_ep = set!(src_ep, ["location"], { "country": country }) }
      if length(src_ep) == 0 { src_ep = { "hostname": "unknown" } }
      ocsf.src_endpoint = src_ep

      # ---- common envelope ----
      ocsf.status_id = status_id
      ocsf.status = status_str
      ocsf.severity_id = severity_id
      ocsf.severity = severity
      ocsf.type_uid = to_int(ocsf.class_uid) * 100 + to_int(ocsf.activity_id)
      ocsf.time = time_ms
      msg = action
      if msg == "" { msg = string(p.type) ?? "" }
      if msg == "" { msg = "1password_event" }
      ocsf.message = msg
      ocsf.raw_data = raw_log

      evt_uid = string(p.uuid) ?? ""
      if evt_uid == "" { evt_uid = uuid_v4() }
      event_code = string(p.type) ?? ""
      if event_code == "" { event_code = action }
      meta = {
          "version": "1.9.0",
          "uid": evt_uid,
          "original_event_uid": evt_uid,
          "log_name": "1Password Events API",
          "log_provider": "1Password",
          "product": { "name": "1Password", "vendor_name": "1Password" }
      }
      if event_code != "" { meta = set!(meta, ["event_code"], event_code) }
      ocsf.metadata = meta

      cand = {
          "signin_category": string(p.category) ?? "",
          "signin_type": string(p.type) ?? "",
          "signin_email": string(p.details.value) ?? "",
          "app_name": string(client.app_name) ?? "",
          "app_version": string(client.app_version) ?? "",
          "platform": string(client.platform_name) ?? "",
          "platform_version": string(client.platform_version) ?? "",
          "os_name": string(client.os_name) ?? "",
          "os_version": string(client.os_version) ?? "",
          "geo_country": string(loc.country) ?? string(p.country) ?? "",
          "geo_region": string(loc.region) ?? "",
          "geo_city": string(loc.city) ?? "",
          "item_uuid": string(p.item_uuid) ?? "",
          "vault_uuid": string(p.vault_uuid) ?? "",
          "object_type": object_type,
          "object_uuid": string(p.object_uuid) ?? "",
          "aux_id": to_string(p.aux_id) ?? "",
          "session_device_uuid": string(sess.device_uuid) ?? ""
      }
      unmapped = {}
      for_each(cand) -> |k, v| {
          if v != "" { unmapped = set!(unmapped, [k], v) }
      }
      used_version = to_int(p.used_version) ?? 0
      if used_version != 0 { unmapped = set!(unmapped, ["item_version"], used_version) }
      if length(unmapped) > 0 { ocsf.unmapped = unmapped }

      . = ocsf
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # Exact value representation is evaluated AFTER branch selection. Numeric strings
  # count as represented by their typed scalar; other transformations are explicit.
  __mapped = object!(parse_json!(encode_json(.)))
  __existing = object(__mapped.unmapped) ?? {}
  __discard = del(__mapped.raw_data)
  __discard = del(__mapped.unmapped)
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __represented = []
  __walk = map_values(__mapped, recursive: true) -> |value| {
      __represented = push(__represented, encode_json(value))
      if !is_object(value) && !is_array(value) && !is_null(value) {
          __represented = push(__represented, to_string(value) ?? "")
      }
      value
  }
  __consumed = []
  # BEGIN parser-specific transformations
  # category: Parser lowercases this source value; consume only when the normalized value is emitted.
  # timestamp: Successful ISO timestamp conversion to the selected event clock in milliseconds.
  # aux_details.name: Case normalization already performed by the parser; observed at user.name, and checked against the emitted branch.
  # category: Parser normalizes the caption case; verify the emitted caption.
  # Only source keys read by this parser are eligible for exact-value consumption; the selected branch must emit the value. Unknown keys always spill, even when their value equals an OCSF default.
  __candidates = ["action", "actor_details", "actor_details.email", "actor_details.name", "actor_details.uuid", "actor_uuid", "aux_details", "aux_details.email", "aux_details.name", "aux_id", "category", "client", "client.app_name", "client.app_version", "client.ip", "client.ip_address", "client.os_name", "client.os_version", "client.platform_name", "client.platform_version", "country", "details.value", "item_uuid", "location", "location.city", "location.country", "location.region", "object_type", "object_uuid", "session", "session.device_uuid", "session.ip", "session_uuid", "target_user", "target_user.email", "target_user.name", "target_user.uuid", "timestamp", "type", "used_version", "user", "user.email", "user.name", "user.uuid", "uuid", "vault_uuid"]
  __preserve = []
  __rules = array!(parse_json!("[{\"source\":\"category\",\"kind\":\"lowercase\",\"reason\":\"Parser lowercases this source value; consume only when the normalized value is emitted.\"},{\"source\":\"timestamp\",\"kind\":\"epoch_ms\",\"target\":\"time\",\"reason\":\"Successful ISO timestamp conversion to the selected event clock in milliseconds.\"},{\"source\":\"aux_details.name\",\"kind\":\"lowercase\",\"reason\":\"Case normalization already performed by the parser; observed at user.name, and checked against the emitted branch.\"},{\"source\":\"category\",\"kind\":\"enum\",\"target\":\"status\",\"values\":{\"success\":\"Success\"},\"reason\":\"Parser normalizes the caption case; verify the emitted caption.\"}]"))
  __source_flat = flatten(__source_kv)
  for_each(__rules) -> |_index, rule| {
      __source_key = string!(rule.source)
      __value = get!(__source_flat, [__source_key])
      __expected = null
      __valid = false
      if rule.kind == "lowercase" && is_string(__value) {
          __expected = downcase(string!(__value))
          __valid = true
      } else if rule.kind == "epoch_ms" {
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", string(rule.format) ?? "%+")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              __valid = true
          }
      } else if rule.kind == "scale" {
          __number, __number_err = to_float(__value)
          if __number_err == null && __value != null && !is_boolean(__value) {
              __expected = to_int(__number * to_float!(rule.factor))
              __valid = true
          }
      } else if rule.kind == "hex" {
          __hex = replace(downcase(string(__value) ?? ""), r'^0x', "")
          __integer, __integer_err = parse_int(__hex, base: 16)
          __expected = __integer
          __valid = is_string(__value) && starts_with(downcase(string(__value) ?? ""), "0x") && __integer_err == null
      } else if rule.kind == "enum" {
          __expected = get!(object!(rule.values), [downcase(to_string(__value) ?? "")])
          __valid = __expected != null
      }
      __matches = includes(__represented, encode_json(__expected))
      if is_string(rule.target) { __matches = get!(., split(string!(rule.target), ".")) == __expected }
      if __valid && __matches { __consumed = push(__consumed, __source_key) }
  }
  # END parser-specific transformations
  # Redact at every depth, including objects inside arrays, before serialization.
  __safe = map_values(object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing}))), recursive: true) -> |value| {
      if is_object(value) {
          # Header/parameter arrays commonly encode sensitive keys as name/value
          # or Key/Value objects instead of using the secret name as an object key.
          __sensitive_pair = false
          for_each(object!(value)) -> |key, child| {
              if includes(["name", "key"], downcase(key)) && match(downcase(string(child) ?? ""), r'password|secret|authorization|token') {
                  __sensitive_pair = true
              }
          }
          for_each(object!(value)) -> |key, _child| {
              if match(downcase(key), r'password|secret|authorization|token') || (__sensitive_pair && includes(["value", "values"], downcase(key))) {
                  value = set!(value, [key], "<redacted>")
              }
          }
      }
      value
  }
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  __escaped = map_keys(object!(__safe.source), recursive: true) -> |key| {
      replace(replace(key, "~", "~0"), ".", "~1")
  }
  __flat = flatten(__escaped)
  __residual = {}
  for_each(__flat) -> |key, value| {
      key = replace(replace(key, "~1", "."), "~0", "~")
      __same = includes(__represented, encode_json(value))
      if !is_object(value) && !is_array(value) && !is_null(value) {
          __same = __same || includes(__represented, to_string(value) ?? "")
      }
      # A scalar array is consumed only if every element is represented. Preserve
      # partially represented arrays intact, including their ordering and repeats.
      if is_array(value) && !is_empty(array!(value)) {
          __all_items = true
          for_each(array!(value)) -> |_index, item| {
              __item_same = includes(__represented, encode_json(item))
              if !is_object(item) && !is_array(item) && !is_null(item) {
                  __item_same = __item_same || includes(__represented, to_string(item) ?? "")
              }
              if is_object(item) || is_array(item) || !__item_same { __all_items = false }
          }
          __same = __same || __all_items
      }
      if __same && includes(__candidates, key) { __consumed = push(__consumed, key) }
      # Redacted leaves always remain visible. Do not spill a copy of the raw body.
      if (!includes(__consumed, key) || value == "<redacted>") && value != __raw_body {
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          __base = join!(__parts, ".")
          __key = __base
          __suffix = 2
          if includes(keys(__residual), __key) {
              for_each(__flat) -> |_other_key, _other_value| {
                  if includes(keys(__residual), __key) {
                      __key = __base + "_" + to_string(__suffix)
                      __suffix = __suffix + 1
                  }
              }
          }
          __complex = is_object(value)
          if is_array(value) {
              for_each(array!(value)) -> |_index, item| {
                  if is_object(item) || is_array(item) { __complex = true }
              }
          }
          __spill = if __complex { encode_json(value) } else { value }
          __residual = set!(__residual, [__key], __spill)
      }
  }
  # Keep existing derived evidence, but remove null placeholders and mapped copies.
  # Source-derived aliases are replaced by canonical dotted source paths above.
  __original_values = []
  for_each(flatten(__source_kv)) -> |_key, value| {
      __original_values = push(__original_values, encode_json(value))
      if !is_object(value) && !is_array(value) { __original_values = push(__original_values, to_string(value) ?? "") }
  }
  for_each(flatten(__existing)) -> |key, value| {
      __source_alias = includes(__original_values, encode_json(value)) || includes(__original_values, to_string(value) ?? "")
      __mapped_alias = includes(__represented, encode_json(value)) || includes(__represented, to_string(value) ?? "")
      __decoded, __decode_err = parse_json(string(value) ?? "")
      __encoded_container = __decode_err == null && (is_object(__decoded) || is_array(__decoded))
      if !is_null(value) && value != "" && !__source_alias && !__mapped_alias && !__encoded_container && value != __raw_body {
          # Existing aggregates may contain sensitive descendants; the canonical
          # source spill above is the authoritative representation of containers.
          if !is_array(value) && !is_object(value) && !match(downcase(key), r'password|secret|authorization|token') {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, with recursive
  # redaction. These entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__safe.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

samples:
  # audit_group_join.json
  - raw: "{\"uuid\":\"QR8BD1RST9UVWXYZ56789ABC0\",\"timestamp\":\"2026-08-18T15:45:30.220000Z\",\"actor_uuid\":\"ADMIN1234567890ABCDEFGHIJK\",\"actor_details\":{\"uuid\":\"ADMIN1234567890ABCDEFGHIJK\",\"email\":\"admin@example.com\",\"name\":\"Ops Admin\"},\"action\":\"join\",\"object_type\":\"group\",\"object_uuid\":\"GRP555444333222111000999\",\"aux_id\":12,\"aux_details\":{\"uuid\":\"GRP555444333222111000999\",\"name\":\"Owners\"},\"session\":{\"uuid\":\"SES111222333444555666777\",\"device_uuid\":\"DEV999888777666555444333\",\"ip\":\"192.0.2.77\"},\"location\":{\"country\":\"US\"}}"
    expect:
      "class_uid": 3006
      "activity_id": 3
      "metadata.version": "1.9.0"
  # audit_user_suspend.json
  - raw: "{\"uuid\":\"PQ7AC0QRS8TUVWXYZ456789AB\",\"timestamp\":\"2026-08-18T15:41:12.004000Z\",\"actor_uuid\":\"ADMIN1234567890ABCDEFGHIJK\",\"actor_details\":{\"uuid\":\"ADMIN1234567890ABCDEFGHIJK\",\"email\":\"admin@example.com\",\"name\":\"Ops Admin\"},\"action\":\"suspend\",\"object_type\":\"user\",\"object_uuid\":\"UUBOB98765432109876543210\",\"aux_id\":0,\"aux_details\":{\"uuid\":\"UUBOB98765432109876543210\",\"email\":\"bob.smith@example.com\",\"name\":\"Bob Smith\"},\"session\":{\"uuid\":\"SES111222333444555666777\",\"login_time\":\"2026-08-18T15:00:00Z\",\"device_uuid\":\"DEV999888777666555444333\",\"ip\":\"192.0.2.77\"},\"location\":{\"country\":\"US\",\"region\":\"Texas\",\"city\":\"Austin\"}}"
    expect:
      "class_uid": 3007
      "activity_id": 5
