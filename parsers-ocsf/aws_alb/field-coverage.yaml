source: text
transforms:
- source: timestamp
  kind: epoch_ms
  target: time
  format: '%+'
  reason: Parsed access-log timestamp converted to event milliseconds.
- source: target_processing_time
  kind: scale
  factor: 1000
  target: duration
  reason: Existing unit conversion by 1000 verified against duration; unused clock
    fallbacks remain residual.
- source: request_creation_time
  kind: epoch_ms
  target: time
  format: '%+'
  reason: Existing timestamp conversion verified against the emitted millisecond clock.
consumed_candidates:
- actions_executed
- chosen_cert_arn
- client_port
- domain_name
- elb
- elb_status_code
- error_reason
- matched_rule_priority
- received_bytes
- redirect_url
- request
- request_creation_time
- request_processing_time
- response_processing_time
- sent_bytes
- ssl_cipher
- ssl_protocol
- target_group_arn
- target_port
- target_processing_time
- target_status_code
- timestamp
- trace_id
- type
- user_agent
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
