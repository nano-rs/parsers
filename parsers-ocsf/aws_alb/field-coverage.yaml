source: text
transforms:
- source: timestamp
  kind: epoch_ms
  target: time
  format: '%+'
  reason: Parsed access-log timestamp converted to event milliseconds.
- source: target_processing_time
  kind: scale
  factor: 1000
  target: duration
  reason: Existing unit conversion by 1000 verified against duration; unused clock fallbacks remain residual.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  domain_name:
  - dst_endpoint.hostname
  - http_request.url.hostname
  - load_balancer.dst_endpoint.hostname
  - tls.sni
  elb:
  - load_balancer.name
  elb_status_code:
  - http_response.code
  - load_balancer.code
  error_reason:
  - load_balancer.error_message
  received_bytes:
  - traffic.bytes_out
  sent_bytes:
  - http_response.length
  - traffic.bytes_in
  ssl_cipher:
  - tls.cipher
  ssl_protocol:
  - tls.version
  trace_id:
  - trace.uid
  user_agent:
  - http_request.user_agent
