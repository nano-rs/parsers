source: mixed
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
transforms:
- source: timestamp
  kind: scale
  factor: 1000
  target: time
  reason: Slow log SET timestamp Unix seconds converted to event milliseconds.
mappings:
  err_code:
  - status_code
  label:
  - metadata.log_level
  msg:
  - message
  thread:
  - actor.session.uid
  - session.uid
  time:
  - metadata.original_time
  argument:
  - database.name
  - message
  - query_info.query_string
  db:
  - database.name
  id:
  - actor.session.uid
  ip:
  - src_endpoint.ip
  priv_user:
  - actor.user.name
  statement:
  - query_info.query_string
  timestamp:
  - metadata.original_time
  user:
  - actor.user.name
  connection_data.status:
  - status_code
  connection_id:
  - actor.session.uid
  - session.uid
  login.ip:
  - src_endpoint.ip
  login.user:
  - actor.user.name
  - user.name
  audit_record.connection_id:
  - actor.session.uid
  - session.uid
  audit_record.db:
  - database.name
  audit_record.ip:
  - src_endpoint.ip
  audit_record.sqltext:
  - query_info.query_string
  audit_record.status:
  - status_code
  audit_record.timestamp:
  - metadata.original_time
  audit_record.user:
  - user.name
  query_data.query:
  - query_info.query_string
  general_data.query:
  - query_info.query_string
  thread_id:
  - actor.session.uid
