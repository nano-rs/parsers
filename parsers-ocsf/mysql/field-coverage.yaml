source: mixed
transforms:
- source: query_time
  kind: scale
  factor: 1000
  target: duration
  reason: Slow log Query_time in seconds converted to the OCSF millisecond duration.
- source: timestamp
  kind: scale
  factor: 1000
  target: time
  reason: Slow log SET timestamp Unix seconds converted to event milliseconds.
consumed_candidates:
- account.host
- account.user
- argument
- audit_record.command_class
- audit_record.connection_id
- audit_record.db
- audit_record.ip
- audit_record.sqltext
- audit_record.status
- audit_record.timestamp
- audit_record.user
- class
- connection_data.db
- connection_data.status
- connection_id
- db
- err_code
- general_data.query
- general_data.sql_command
- general_data.status
- host
- id
- ip
- label
- login.ip
- login.user
- msg
- priv_user
- statement
- thread
- time
- timestamp
- user
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
