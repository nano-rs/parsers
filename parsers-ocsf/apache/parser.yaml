name: apache_ocsf
display_name: Apache HTTP Server (OCSF)
version: "1.1.0"
ocsf_version: "1.9.0"
description: >
  Parses Apache combined/common log format into a complete OCSF 1.9.0
  "HTTP Activity" (class_uid 4002) record. The whole OCSF object is emitted
  on the root so it can be inserted into the ocsf_logs `event` column, from
  which the promoted columns materialize. Mirrors the shape of the UDM
  apache parser (../parsers/parsers/apache/parser.yaml) but targets OCSF
  instead of `.udm.*`.

  v1.1.0 — OCSF 1.8.0 -> 1.9.0 upgrade:
    * metadata.version is now "1.9.0" (1.8.0 is rejected by this release).
    * `actor` is a host-profile attribute on 4002, so the event now declares
      metadata.profiles ["host"]; without it the authenticated-user mapping
      was rejected as "attribute \"actor\" is not defined for this OCSF
      class/profile".
    * The unparsable-line fallback used to emit class 4002 with neither
      http_request nor http_response, which violates the class constraint
      "at least one of [http_request, http_response]". It now emits Base
      Event (class_uid 0), which is what an unparsable line actually is.
match_values:
  - apache_access
category: application
vendor: "Apache Software Foundation"
product: "Apache HTTP Server"
parser_vrl: |
  # Apache Combined Log Format -> OCSF 1.9.0 HTTP Activity (class_uid 4002)
  # Format: %h %l %u %t "%r" %>s %b "%{Referer}i" "%{User-Agent}i"
  #
  # Emits the COMPLETE standard OCSF record on the root. This object is what
  # gets written to ocsf_logs.event; the MATERIALIZED columns derive from it.

  raw_log = string!(.message)

  ip_re = r'^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$|^[0-9A-Fa-f:]{3,}$'

  parsed, err = parse_apache_log(raw_log, "combined")

  if err == null {
      # ---- method -> activity_id (OCSF HTTP Activity enum, 1.9.0) ----
      # parse_apache_log returns method as a known String; no coalescing needed.
      method = upcase(string!(parsed.method))
      activity_id = 99
      activity_name = "Other"
      if method == "CONNECT" { activity_id = 1; activity_name = "Connect" }
      if method == "DELETE"  { activity_id = 2; activity_name = "Delete" }
      if method == "GET"     { activity_id = 3; activity_name = "Get" }
      if method == "HEAD"    { activity_id = 4; activity_name = "Head" }
      if method == "OPTIONS" { activity_id = 5; activity_name = "Options" }
      if method == "POST"    { activity_id = 6; activity_name = "Post" }
      if method == "PUT"     { activity_id = 7; activity_name = "Put" }
      if method == "TRACE"   { activity_id = 8; activity_name = "Trace" }
      if method == "PATCH"   { activity_id = 9; activity_name = "Patch" }

      # ---- status -> status_id (2xx/3xx Success, else Failure) ----
      # parse_apache_log returns status/size as ints already; to_int is infallible.
      code = to_int(parsed.status)
      status_id = 2
      status_str = "Failure"
      if code >= 200 && code < 400 { status_id = 1; status_str = "Success" }

      # ---- time: parse_apache_log timestamp -> epoch milliseconds ----
      time_ms = 0
      tms, terr = to_unix_timestamp(parsed.timestamp, unit: "milliseconds")
      if terr == null { time_ms = tms }

      class_uid = 4002

      # ---- build http_request ----
      # Apache combined logs carry only a request path (no scheme/host), so the
      # OCSF url is path-only. url.json forbids a bare path in url_string, and
      # there is no top-level `url` on http_activity (4002).
      req_path = to_string(parsed.path)
      http_request = {
          "http_method": method,
          "user_agent": to_string(parsed.agent),
          "url": {
              "path": req_path
          }
      }
      # referrer: omit when "-"
      ref = to_string(parsed.referrer)
      if ref != "-" && ref != "" {
          http_request.referrer = ref
      }

      # ---- build http_response (length + code) ----
      size = to_int(parsed.size)
      http_response = {
          "code": code,
          "length": size,
          "status": status_str
      }

      # ---- assemble the OCSF record on the root ----
      . = {
          "class_uid": class_uid,
          "class_name": "HTTP Activity",
          "category_uid": 4,
          "category_name": "Network Activity",
          "activity_id": activity_id,
          "activity_name": activity_name,
          "type_uid": class_uid * 100 + activity_id,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": status_id,
          "status": status_str,
          "time": time_ms,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": uuid_v4(),
              # `actor` is host-profile-bound on 4002 in OCSF 1.9.
              "profiles": ["host"],
              "log_name": "apache",
              "product": {
                  "name": "Apache HTTP Server",
                  "vendor_name": "Apache Software Foundation"
              }
          },
          "http_request": http_request,
          "http_response": http_response,
          # traffic.bytes_out exercises our promoted `traffic.bytes_out` column.
          "traffic": {
              "bytes_out": size
          }
      }

      # %h is an IP unless HostnameLookups is on; network_endpoint.ip is
      # regex-checked as ip_t, so a resolved name must go to hostname.
      remote = to_string(parsed.host)
      if match(remote, ip_re) {
          .src_endpoint = { "ip": remote }
      } else if remote != "" && remote != "-" {
          .src_endpoint = { "hostname": downcase(remote) }
      }

      # authenticated user (Apache %u) -> actor.user.name, omit "-"
      auth_user = to_string(parsed.user)
      if auth_user != "-" && auth_user != "" {
          .actor = { "user": { "name": auth_user } }
      }
  } else {
      # On parse failure, emit a Base Event carrying the raw line so the row
      # still lands and is debuggable rather than silently dropped. It is NOT
      # emitted as 4002: an unparsable line has neither http_request nor
      # http_response, which violates the HTTP Activity class constraint.
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 99,
          "activity_name": "Other",
          "type_uid": 99,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": 0,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": uuid_v4(),
              "log_name": "apache",
              "product": {
                  "name": "Apache HTTP Server",
                  "vendor_name": "Apache Software Foundation"
              },
              "log_level": "error"
          }
      }
  }

  .

# Runtime samples (NAN-2327): one per event shape this parser routes.
# `class_uid` is asserted because class routing is the whole point of the
# OCSF conversion — a silent reroute is the defect most likely to survive
# a compile-only check.
samples:
  - raw: '127.0.0.1 - frank [10/Oct/2000:13:55:36 -0700] "GET /apache_pb.gif HTTP/1.0" 200 2326 "http://www.example.com/start.html" "Mozilla/4.08 [en] (Win98; I ;Nav)"'
    expect:
      class_uid: 4002
      activity_id: 3
  - raw: 'this is not an nginx log line at all'
    expect:
      class_uid: 0
      activity_id: 99
  - raw: '10.1.2.3 - - [12/Aug/2026:09:15:22 +0000] "POST /wp-login.php HTTP/1.1" 500 0 "-" "-"'
    expect:
      class_uid: 4002
      activity_id: 6
