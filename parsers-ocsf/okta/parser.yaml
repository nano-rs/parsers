name: okta_ocsf
display_name: Okta (OCSF)
version: "1.3.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields in redacted, dotted snake_case unmapped keys.
  Parses Okta System Log events (/api/v1/logs) into complete OCSF 1.9.0 records,
  routed by eventType:
    user.session.start / user.authentication.* / user.session.end
                                   -> Authentication 3002
    user.lifecycle.* / user.account.* / user.mfa.*
                                   -> User Management 3007
    group.*                        -> Group Management 3006
    everything else (policy., application., system., app., sso.)
                                   -> API Activity 6003
  Account Change 3001 and User Access Management 3005 are DEPRECATED in OCSF
  1.9 and are deliberately not emitted. On user/group management events the
  Okta `actor` (the admin) is `actor.user` and the target from `target[]` is the
  subject (`user` / `group`) — the reverse would invert every
  "who did what to whom" hunt. Emits the whole OCSF object on the root so it
  lands in ocsf_logs.event and the promoted columns materialize.
match_values:
  - okta
category: security
vendor: "Okta"
product: "Identity Cloud"
parser_vrl: |
  # Okta System Log JSON -> OCSF 1.9.0.
  raw_log = string!(.message)
  __raw_body = raw_log
  __source_kv = {}
  parsed, err = parse_json(raw_log)
  __source_kv = object(parsed) ?? {}

  if err != null || !is_object(parsed) {
      # Unparseable input still has to be a VALID OCSF record or the lake drops
      # it and the failure becomes invisible. Placeholders are explicit.
      # Unparseable input is emitted as an OCSF Base Event (class_uid 0)
      # rather than being guessed into a security class: it stays valid, and
      # therefore visible, without fabricating a user or an outcome.
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 0,
          "activity_name": "Unknown",
          "type_uid": 0,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": 0,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": sha2("okta|raw|" + raw_log, variant: "SHA-256"),
              "log_level": "error",
              "log_name": "Okta System Log",
              "log_provider": "Okta",
              "product": { "name": "Identity Cloud", "vendor_name": "Okta" }
          },
          "unmapped": { "parse_error": "not a JSON object" }
      }
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      . = set!(., ["unmapped", "parse_fallback"], "unparsable input")
  } else {
      p = object!(parsed)
      actor_in = object(p.actor) ?? {}
      client = object(p.client) ?? {}
      ua_o = object(client.userAgent) ?? {}
      geo = object(client.geographicalContext) ?? {}
      authctx = object(p.authenticationContext) ?? {}
      outcome = object(p.outcome) ?? {}
      debug = object(p.debugContext.debugData) ?? {}
      sec = object(p.securityContext) ?? {}
      tx = object(p.transaction) ?? {}

      event_type = string(p.eventType) ?? ""

      # ---- time: published ISO8601 -> epoch ms ----
      time_ms = 0
      ts_str = string(p.published) ?? ""
      if ts_str != "" {
          t, terr = parse_timestamp(ts_str, "%+")
          if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
      }

      # ---- outcome -> status ----
      result = downcase(string(outcome.result) ?? "")
      status_id = 0
      status_str = "Unknown"
      if result == "success" || result == "allow" { status_id = 1; status_str = "Success" }
      if result == "failure" || result == "deny" || result == "challenge" { status_id = 2; status_str = "Failure" }

      # ---- severity: Okta DEBUG/INFO/WARN/ERROR -> OCSF ----
      sev_raw = downcase(string(p.severity) ?? "")
      severity_id = 1
      severity = "Informational"
      if sev_raw == "warn" { severity_id = 3; severity = "Medium" }
      if sev_raw == "error" { severity_id = 4; severity = "High" }
      if status_id == 2 && severity_id == 1 { severity_id = 2; severity = "Low" }

      # ---- the acting principal ----
      actor_alt = string(actor_in.alternateId) ?? ""
      actor_name = actor_alt
      if actor_name == "" { actor_name = string(actor_in.displayName) ?? "" }
      # Only a real RFC-shaped address may go in email_addr; Okta puts service
      # principals and "unknown" in alternateId, which fail the email_t regex.
      actor_is_email = match(actor_alt, r'^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$')
      actor_domain = ""
      aparts = split(actor_alt, "@")
      if actor_is_email && length(aparts) == 2 { actor_domain = downcase(string(aparts[1]) ?? "") }
      actor_user = { "name": downcase(actor_name), "uid": string(actor_in.id) ?? "", "type": string(actor_in.type) ?? "" }
      if actor_domain != "" { actor_user = set!(actor_user, ["domain"], actor_domain) }
      if actor_is_email { actor_user = set!(actor_user, ["email_addr"], downcase(actor_alt)) }

      # ---- target[] walk: subject user / group / app / policy + resources[] ----
      targets = array(p.target) ?? []
      subj_user = {}
      have_subj_user = false
      subj_group = {}
      have_subj_group = false
      app_name = ""
      app_uid = ""
      resources = []
      for_each(targets) -> |_i, tv| {
          tgt = object(tv) ?? {}
          ttype = string(tgt.type) ?? ""
          tname = string(tgt.displayName) ?? ""
          talt = string(tgt.alternateId) ?? ""
          tuid = string(tgt.id) ?? ""
          if ttype == "User" && !have_subj_user {
              su = { "name": downcase(talt), "uid": tuid }
              if talt == "" { su = { "name": downcase(tname), "uid": tuid } }
              if match(talt, r'^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$') { su = set!(su, ["email_addr"], downcase(talt)) }
              if tname != "" { su = set!(su, ["full_name"], tname) }
              subj_user = su
              have_subj_user = true
          }
          if ttype == "UserGroup" && !have_subj_group {
              subj_group = { "name": tname, "uid": tuid, "type": "Okta Group" }
              have_subj_group = true
          }
          if ttype == "AppInstance" && app_name == "" {
              app_name = tname
              app_uid = tuid
          }
          rname = tname
          if rname == "" { rname = talt }
          resources = push(resources, { "type": ttype, "uid": tuid, "name": rname })
      }

      # ---- class routing ----
      class_uid = 6003
      if starts_with(event_type, "user.session.start") || starts_with(event_type, "user.authentication") || starts_with(event_type, "user.session.end") {
          class_uid = 3002
      } else if starts_with(event_type, "user.lifecycle") || starts_with(event_type, "user.account") || starts_with(event_type, "user.mfa") {
          class_uid = 3007
      } else if starts_with(event_type, "group.") {
          class_uid = 3006
      }

      ocsf = {}

      if class_uid == 3002 {
          activity_id = 1
          activity_name = "Logon"
          if starts_with(event_type, "user.session.end") { activity_id = 2; activity_name = "Logoff" }

          ocsf.class_uid = 3002
          ocsf.class_name = "Authentication"
          ocsf.category_uid = 3
          ocsf.category_name = "Identity & Access Management"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name

          # On an Okta logon the actor IS the principal being authenticated.
          # Authentication 3002 carries that principal in `user`, NOT in
          # `actor` — the reverse of the endpoint classes.
          ocsf.user = actor_user

          # 3002 constraint: at_least_one(service, dst_endpoint). The app being
          # signed into when the event names one, otherwise Okta itself.
          svc_name = app_name
          if svc_name == "" { svc_name = "Okta" }
          svc = { "name": svc_name }
          if app_uid != "" { svc = set!(svc, ["uid"], app_uid) }
          ocsf.service = svc

          sid = string(authctx.externalSessionId) ?? ""
          if sid != "" && sid != "unknown" { ocsf.session = { "uid": sid } }

          cred_type = string(authctx.credentialType) ?? ""
          if cred_type != "" {
              cred_l = downcase(cred_type)
              ap_id = 99
              if cred_l == "saml" { ap_id = 5 }
              if cred_l == "oauth2" || cred_l == "oauth" { ap_id = 6 }
              if cred_l == "openid" || cred_l == "oidc" { ap_id = 4 }
              ocsf.auth_protocol_id = ap_id
              ocsf.auth_protocol = cred_type
          }

          # MFA: an explicit MFA event type, or an MFA-shaped credential.
          cred_l2 = downcase(cred_type)
          is_mfa = contains(event_type, "mfa") || cred_l2 == "otp" || cred_l2 == "sms" || cred_l2 == "push" || cred_l2 == "totp" || cred_l2 == "webauthn" || cred_l2 == "signed_nonce"
          ocsf.is_mfa = is_mfa
          # Okta sign-ins are always remote/network; logon_type_id is a
          # Windows-specific enum and is deliberately not emitted.
          ocsf.is_remote = true
      } else if class_uid == 3007 {
          activity_id = 2
          activity_name = "Update"
          if starts_with(event_type, "user.lifecycle.create") { activity_id = 1; activity_name = "Create" }
          if starts_with(event_type, "user.lifecycle.delete") { activity_id = 3; activity_name = "Delete" }
          if starts_with(event_type, "user.lifecycle.activate") || starts_with(event_type, "user.lifecycle.reactivate") { activity_id = 4; activity_name = "Enable" }
          if starts_with(event_type, "user.lifecycle.deactivate") { activity_id = 5; activity_name = "Disable" }
          if starts_with(event_type, "user.lifecycle.suspend") || starts_with(event_type, "user.account.lock") { activity_id = 6; activity_name = "Lock" }
          if starts_with(event_type, "user.lifecycle.unsuspend") || starts_with(event_type, "user.account.unlock") { activity_id = 7; activity_name = "Unlock" }
          if starts_with(event_type, "user.account.update_password") { activity_id = 8; activity_name = "Password Change" }
          if starts_with(event_type, "user.account.reset_password") { activity_id = 9; activity_name = "Password Reset" }
          if starts_with(event_type, "user.mfa.factor.activate") || starts_with(event_type, "user.mfa.factor.reset") { activity_id = 12; activity_name = "Enable MFA Factors" }
          if starts_with(event_type, "user.mfa.factor.deactivate") { activity_id = 13; activity_name = "Disable MFA Factors" }
          if starts_with(event_type, "user.account.privilege.grant") { activity_id = 14; activity_name = "Assign Privileges" }
          if starts_with(event_type, "user.account.privilege.revoke") { activity_id = 15; activity_name = "Remove Privileges" }

          ocsf.class_uid = 3007
          ocsf.class_name = "User Management"
          ocsf.category_uid = 3
          ocsf.category_name = "Identity & Access Management"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          # SUBJECT = the account being changed. Falls back to the actor for
          # self-service changes (password reset by the user themselves).
          if have_subj_user {
              ocsf.user = subj_user
          } else {
              ocsf.user = actor_user
          }
          # ACTOR = the admin (or the user themselves) performing the change.
          ocsf.actor = { "user": actor_user }
          if length(resources) > 0 { ocsf.resources = resources }
      } else if class_uid == 3006 {
          activity_id = 99
          activity_name = "Other"
          if starts_with(event_type, "group.user_membership.add") { activity_id = 3; activity_name = "Add User" }
          if starts_with(event_type, "group.user_membership.remove") { activity_id = 4; activity_name = "Remove User" }
          if starts_with(event_type, "group.lifecycle.create") { activity_id = 6; activity_name = "Create" }
          if starts_with(event_type, "group.lifecycle.delete") { activity_id = 5; activity_name = "Delete" }
          if starts_with(event_type, "group.lifecycle.update") || starts_with(event_type, "group.profile") { activity_id = 9; activity_name = "Update" }
          if starts_with(event_type, "group.privilege.grant") { activity_id = 1; activity_name = "Assign Privileges" }
          if starts_with(event_type, "group.privilege.revoke") { activity_id = 2; activity_name = "Revoke Privileges" }

          ocsf.class_uid = 3006
          ocsf.class_name = "Group Management"
          ocsf.category_uid = 3
          ocsf.category_name = "Identity & Access Management"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          # `group` is REQUIRED on 3006. Okta always names the group in target[];
          # if it somehow does not, fall back to the event type so the record is
          # still a valid, searchable group event.
          if have_subj_group {
              ocsf.group = subj_group
          } else {
              ocsf.group = { "name": "unknown" }
          }
          if have_subj_user { ocsf.user = subj_user }
          ocsf.actor = { "user": actor_user }
          if length(resources) > 0 { ocsf.resources = resources }
      } else {
          ocsf.class_uid = 6003
          ocsf.class_name = "API Activity"
          ocsf.category_uid = 6
          ocsf.category_name = "Application Activity"
          activity_id = 99
          activity_name = "Other"
          if contains(event_type, ".create") || contains(event_type, ".add") || contains(event_type, ".grant") { activity_id = 1; activity_name = "Create" }
          if contains(event_type, ".read") || contains(event_type, ".view") || contains(event_type, ".evaluate") { activity_id = 2; activity_name = "Read" }
          if contains(event_type, ".update") || contains(event_type, ".activate") || contains(event_type, ".deactivate") { activity_id = 3; activity_name = "Update" }
          if contains(event_type, ".delete") || contains(event_type, ".remove") || contains(event_type, ".revoke") { activity_id = 4; activity_name = "Delete" }
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          ocsf.api = { "operation": event_type, "service": { "name": "Okta" } }
          ocsf.actor = { "user": actor_user }
          if length(resources) > 0 { ocsf.resources = resources }
      }

      # ---- source endpoint (required on 6003, useful everywhere) ----
      src_ip = string(client.ipAddress) ?? ""
      if src_ip == "" {
          req_chain = array(p.request.ipChain) ?? []
          if length(req_chain) > 0 {
              first_hop = object(req_chain[0]) ?? {}
              src_ip = string(first_hop.ip) ?? ""
          }
      }
      src_ep = {}
      if src_ip != "" { src_ep = set!(src_ep, ["ip"], downcase(src_ip)) }
      as_num = to_int(sec.asNumber) ?? 0
      as_org = string(sec.asOrg) ?? ""
      if as_num != 0 || as_org != "" {
          src_ep = set!(src_ep, ["autonomous_system"], { "number": as_num, "name": as_org })
      }
      isp = string(sec.isp) ?? ""
      if isp != "" { src_ep = set!(src_ep, ["isp"], isp) }
      if length(src_ep) == 0 {
          # network_endpoint needs at_least_one identifying attribute.
          src_ep = { "hostname": "unknown" }
      }
      ocsf.src_endpoint = src_ep

      raw_ua = string(ua_o.rawUserAgent) ?? ""
      if raw_ua != "" { ocsf.http_request = { "user_agent": raw_ua } }

      # ---- common envelope ----
      ocsf.status_id = status_id
      ocsf.status = status_str
      reason = string(outcome.reason) ?? ""
      if reason != "" { ocsf.status_detail = reason }
      ocsf.severity_id = severity_id
      ocsf.severity = severity
      ocsf.type_uid = to_int(ocsf.class_uid) * 100 + to_int(ocsf.activity_id)
      ocsf.time = time_ms
      msg = string(p.displayMessage) ?? ""
      if msg == "" { msg = event_type }
      ocsf.message = msg
      ocsf.raw_data = raw_log

      evt_uid = string(p.uuid) ?? ""
      if evt_uid == "" { evt_uid = sha2("okta|raw|" + raw_log, variant: "SHA-256") }
      meta = {
          "version": "1.9.0",
          "uid": evt_uid,
          "original_event_uid": evt_uid,
          "event_code": event_type,
          "log_name": "Okta System Log",
          "log_provider": "Okta",
          "product": { "name": "Identity Cloud", "vendor_name": "Okta" }
      }
      txid = string(tx.id) ?? ""
      if txid != "" { meta = set!(meta, ["correlation_uid"], txid) }
      ocsf.metadata = meta

      # ---- Okta signals with no OCSF home ----
      cand = {
          "legacy_event_type": string(p.legacyEventType) ?? "",
          "client_device": string(client.device) ?? "",
          "client_zone": string(client.zone) ?? "",
          "client_os": string(ua_o.os) ?? "",
          "client_browser": string(ua_o.browser) ?? "",
          "geo_country": string(geo.country) ?? "",
          "geo_city": string(geo.city) ?? "",
          "geo_state": string(geo.state) ?? "",
          "auth_provider": string(authctx.authenticationProvider) ?? "",
          "credential_provider": string(authctx.credentialProvider) ?? "",
          "auth_interface": string(authctx.interface) ?? "",
          "policy_type": string(debug.policyType) ?? "",
          "policy_rule": string(debug.rule) ?? "",
          "factor": string(debug.factor) ?? "",
          "factor_result": string(debug.factorResult) ?? "",
          "behaviors": string(debug.behaviors) ?? "",
          "risk": string(debug.risk) ?? "",
          "threat_suspected": string(debug.threatSuspected) ?? "",
          "request_uri": string(debug.requestUri) ?? "",
          "security_domain": string(sec.domain) ?? "",
          "transaction_type": string(tx.type) ?? ""
      }
      unmapped = {}
      for_each(cand) -> |k, v| {
          if v != "" { unmapped = set!(unmapped, [k], v) }
      }
      if is_boolean(sec.isProxy) { unmapped = set!(unmapped, ["is_proxy"], bool!(sec.isProxy)) }
      if length(targets) > 0 { unmapped = set!(unmapped, ["okta_targets"], encode_json(targets)) }
      if length(unmapped) > 0 { ocsf.unmapped = unmapped }

      . = ocsf
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # Exact value representation is evaluated AFTER branch selection. Numeric strings
  # count as represented by their typed scalar; other transformations are explicit.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The value sets below are strings
  # instead (a read shares the buffer): "," + encode_json(member) per member, and
  # contains(set, "," + encode_json(x)) is exact membership. Every member is a
  # JSON text, inside which a '"' is always escaped, so ',"' only ever starts a
  # member, and a JSON string ends at its first unescaped '"'. The fixed candidate
  # set is a regex literal, compiled once with the program.
  # __mapped holds only JSON types, so to_string equals encode_json for an integer
  # or a boolean and only strings and floats add a second member.
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped_json = encode_json(__mapped)
  __mapped = object!(parse_json!(__mapped_json))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __safe = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __safe_json = encode_json(__safe)
  # Object and array members are encodings: an empty object, an object that
  # opens with a quoted key, or an array. A lookup can ask for one only when some
  # source or existing value is an array, or a string spelling one of those
  # openings, and the regex below finds either in the JSON text (brackets are
  # written as hex escapes because nano's deploy check counts them raw).
  # Otherwise the scalar nodes suffice; a Sysmon GUID, a brace-wrapped string
  # with no quoted key, is no object member. The leaves of flatten(), with arrays
  # flattened too, are every scalar node unless a key holds a literal '.' (in
  # compact JSON only a key is followed by ':').
  # Their encodings, unwrapped from the array, already are the string members.
  __represented = ""
  __nodes = __mapped
  if !match(__safe_json, r'"(?:\x7B\\"|\x7B\x7D"|\x5B)|[:,\x5B]\x5B') && !match(__mapped_json, r'\.(?:[^"\\]|\\.)*":') {
      __leaves = flatten(values(flatten(__mapped)))
      __leaves_json = encode_json(__leaves)
      if match(__leaves_json, r'\x7B') {
          # An object inside an array: walk the leaves, objects whole.
          __nodes = __leaves
      } else {
          __nodes = []
          __members = map_values(__leaves) -> |value| {
              if is_float(value) {
                  encode_json(encode_json(value)) + "," + encode_json(to_string!(value))
              } else {
                  encode_json(encode_json(value))
              }
          }
          __represented = "," + join!(__members, ",") + "," + slice!(__leaves_json, 1, -1)
      }
  }
  __walk = map_values(__nodes, recursive: true) -> |value| {
      __json = encode_json(value)
      if is_string(value) {
          # A string's second member is the string itself, encoded: __json.
          __represented = __represented + ("," + encode_json(__json) + "," + __json)
      } else if is_float(value) {
          __represented = __represented + ("," + encode_json(__json) + "," + encode_json(to_string!(value)))
      } else {
          __represented = __represented + ("," + encode_json(__json))
      }
      value
  }
  __consumed = ""
  # BEGIN parser-specific transformations
  # outcome.result: Parser lowercases this source value; consume only when the normalized value is emitted.
  # severity: Parser lowercases this source value; consume only when the normalized value is emitted.
  # published: Successful ISO timestamp conversion to the selected event clock in milliseconds.
  # outcome.result: Okta outcome maps to OCSF status in the emitted branch.
  # severity: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when the expected ID is emitted.
  # debugContext.debugData.factorResult: Parser normalizes the caption case; verify the emitted caption.
  for_each(flatten(__source_kv)) -> |key, value| {
      if match(key, r'(?x)
      \A(?:
        outcome\.result
      | severity
      )\z') {
          __value = value
          if is_string(__value) {
              __expected = downcase(string!(__value))
              if contains(__represented, "," + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        published
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%+")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              if ."time" == __expected { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        outcome\.result
      )\z') {
          __value = value
          if __value != null {
              __expected = get!({"success": 1, "allow": 1, "failure": 2, "deny": 2, "challenge": 2}, [downcase(to_string(__value) ?? "")])
              if __expected != null {
                  if ."status_id" == __expected { __consumed = __consumed + ("," + encode_json(key)) }
              }
          }
      }
      if match(key, r'(?x)
      \A(?:
        severity
      )\z') {
          __value = value
          if __value != null {
              __expected = get!({"informational": 1, "info": 1, "debug": 1, "low": 2, "medium": 3, "warn": 3, "warning": 3, "high": 4, "error": 4, "critical": 5, "fatal": 6}, [downcase(to_string(__value) ?? "")])
              if __expected != null {
                  if ."severity_id" == __expected { __consumed = __consumed + ("," + encode_json(key)) }
              }
          }
      }
      if match(key, r'(?x)
      \A(?:
        debugContext\.debugData\.factorResult
      )\z') {
          __value = value
          if __value != null {
              __expected = get!({"success": "Success"}, [downcase(to_string(__value) ?? "")])
              if __expected != null {
                  if ."status" == __expected { __consumed = __consumed + ("," + encode_json(key)) }
              }
          }
      }
  }
  # Only source keys read by this parser are eligible for exact-value consumption; the selected branch must emit the value. Unknown keys always spill, even when their value equals an OCSF default.
  __candidates = r'(?x)
  \A(?:
    actor
  | actor\.alternateId
  | actor\.displayName
  | actor\.id
  | actor\.type
  | authenticationContext
  | authenticationContext\.authenticationProvider
  | authenticationContext\.credentialProvider
  | authenticationContext\.credentialType
  | authenticationContext\.externalSessionId
  | authenticationContext\.interface
  | client
  | client\.device
  | client\.geographicalContext
  | client\.geographicalContext\.city
  | client\.geographicalContext\.country
  | client\.geographicalContext\.state
  | client\.ipAddress
  | client\.userAgent
  | client\.userAgent\.browser
  | client\.userAgent\.os
  | client\.userAgent\.rawUserAgent
  | client\.zone
  | debugContext\.debugData
  | debugContext\.debugData\.behaviors
  | debugContext\.debugData\.factor
  | debugContext\.debugData\.factorResult
  | debugContext\.debugData\.policyType
  | debugContext\.debugData\.requestUri
  | debugContext\.debugData\.risk
  | debugContext\.debugData\.rule
  | debugContext\.debugData\.threatSuspected
  | displayMessage
  | eventType
  | legacyEventType
  | outcome
  | outcome\.reason
  | outcome\.result
  | published
  | request\.ipChain
  | securityContext
  | securityContext\.asNumber
  | securityContext\.asOrg
  | securityContext\.domain
  | securityContext\.isProxy
  | securityContext\.isp
  | severity
  | target
  | transaction
  | transaction\.id
  | transaction\.type
  | uuid
  )\z'
  __preserve = []
  # END parser-specific transformations
  # Redact at every depth, including objects inside arrays, before serialization.
  # Redaction needs a sensitive word in a key or a name/key value, and encode_json
  # never escapes a letter, so text without one of the words needs no walk.
  if match(downcase(__safe_json), r'password|secret|authorization|token') {
      __safe = map_values(__safe, recursive: true) -> |value| {
          if is_object(value) {
              # Header/parameter arrays commonly encode sensitive keys as name/value
              # or Key/Value objects instead of using the secret name as an object key.
              __sensitive_pair = false
              for_each(object!(value)) -> |key, child| {
                  if includes(["name", "key"], downcase(key)) && match(downcase(string(child) ?? ""), r'password|secret|authorization|token') {
                      __sensitive_pair = true
                  }
              }
              for_each(object!(value)) -> |key, _child| {
                  if match(downcase(key), r'password|secret|authorization|token') || (__sensitive_pair && includes(["value", "values"], downcase(key))) {
                      value = set!(value, [key], "<redacted>")
                  }
              }
          }
          value
      }
  }
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__safe.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # Fast path: when no two source keys decode to the same key and no two spilled
  # keys get the same name, each key's decision depends only on its own value, so
  # one filter and one rename build the residual without copying it per key.
  __distinct = true
  if __tilde {
      __distinct = length(map_keys(__flat) -> |key| { replace(replace(key, "~1", "."), "~0", "~") }) == length(__flat)
  }
  __kept = {}
  __names = {}
  if __distinct {
      __kept = filter(__flat) -> |key, value| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          # A key is kept unless it is consumed: by a transformation above, or as a
          # candidate whose value is represented. Redacted leaves always remain
          # visible. Do not spill a copy of the raw body.
          if value == __raw_body {
              false
          } else if value == "<redacted>" {
              true
          } else if contains(__consumed, "," + encode_json(key)) {
              false
          } else if !match(key, __candidates) {
              true
          } else {
              # flatten stops at arrays, so objects inside an array still carry the
              # escaped keys: decode them too, or `a.b` spills as `a~1b` (NAN-3604).
              if __tilde && (is_array(value) || is_object(value)) {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __same = contains(__represented, "," + encode_json(encode_json(value)))
              if !__same && (is_string(value) || is_float(value)) {
                  __same = contains(__represented, "," + encode_json(to_string!(value)))
              }
              # A scalar array is consumed only if every element is represented. Preserve
              # partially represented arrays intact, including their ordering and repeats.
              if !__same && is_array(value) && !is_empty(array!(value)) {
                  __same = true
                  for_each(array!(value)) -> |_index, item| {
                      if __same {
                          if is_object(item) || is_array(item) {
                              __same = false
                          } else if !contains(__represented, "," + encode_json(encode_json(item))) {
                              __same = (is_string(item) || is_float(item)) && contains(__represented, "," + encode_json(to_string!(item)))
                          }
                      }
                  }
              }
              !__same
          }
      }
      __names = map_keys(__kept) -> |key| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          join!(__parts, ".")
      }
  }
  __residual = {}
  if __distinct && length(__names) == length(__kept) {
      __residual = map_values(__names) -> |value| {
          if is_array(value) || is_object(value) {
              if __tilde {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              if __complex { value = encode_json(value) }
          }
          value
      }
  } else {
      # Slow path, in source key order: a decoded key consumed earlier stays
      # consumed, and a name already taken gets the next free _2, _3, ... suffix.
      for_each(__flat) -> |key, value| {
          key = replace(replace(key, "~1", "."), "~0", "~")
          if is_array(value) || is_object(value) {
              value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                  replace(replace(inner, "~1", "."), "~0", "~")
              }, ["v"])
          }
          __same = contains(__represented, "," + encode_json(encode_json(value)))
          if !__same && (is_string(value) || is_float(value)) {
              __same = contains(__represented, "," + encode_json(to_string!(value)))
          }
          if !__same && is_array(value) && !is_empty(array!(value)) {
              __same = true
              for_each(array!(value)) -> |_index, item| {
                  if __same {
                      if is_object(item) || is_array(item) {
                          __same = false
                      } else if !contains(__represented, "," + encode_json(encode_json(item))) {
                          __same = (is_string(item) || is_float(item)) && contains(__represented, "," + encode_json(to_string!(item)))
                      }
                  }
              }
          }
          __token = "," + encode_json(key)
          if __same && match(key, __candidates) { __consumed = __consumed + ("," + encode_json(key)) }
          if (!contains(__consumed, __token) || value == "<redacted>") && value != __raw_body {
              __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
              __base = join!(__parts, ".")
              __key = __base
              __suffix = 2
              if includes(keys(__residual), __key) {
                  for_each(__flat) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __key) {
                          __key = __base + "_" + to_string(__suffix)
                          __suffix = __suffix + 1
                      }
                  }
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              __spill = if __complex { encode_json(value) } else { value }
              __residual = set!(__residual, [__key], __spill)
          }
      }
  }
  # Keep existing derived evidence, but remove null placeholders and mapped copies.
  # Source-derived aliases are replaced by canonical dotted source paths above.
  # Existing aggregates may contain sensitive descendants; the canonical source
  # spill above is the authoritative representation of containers. The cheap
  # conditions run first; the source value set is built on first use.
  __original_values = null
  for_each(flatten(__existing)) -> |key, value| {
      if !is_null(value) && value != "" && !is_array(value) && !is_object(value) && value != __raw_body && !match(downcase(key), r'password|secret|authorization|token') {
          # Members for the value itself and for to_string(value), as above.
          __json = encode_json(value)
          __as_json = "," + encode_json(__json)
          __as_string = __as_json
          if is_string(value) { __as_string = "," + __json } else if is_float(value) { __as_string = "," + encode_json(to_string!(value)) }
          if __original_values == null {
              # __source_kv may hold non-JSON types (a timestamp), so only an
              # integer or a boolean skips its to_string member here.
              __original_values = join!(map_values(values(flatten(__source_kv))) -> |source_value| {
                  __source_json = encode_json(source_value)
                  __tokens = "," + encode_json(__source_json)
                  if is_string(source_value) {
                      __tokens = __tokens + "," + __source_json
                  } else if !is_object(source_value) && !is_array(source_value) && !is_integer(source_value) && !is_boolean(source_value) {
                      __tokens = __tokens + "," + encode_json(to_string(source_value) ?? "")
                  }
                  __tokens
              }, "")
          }
          __source_set = string!(__original_values)
          __keep = !contains(__source_set, __as_json) && !contains(__source_set, __as_string)
          __keep = __keep && !contains(__represented, __as_json) && !contains(__represented, __as_string)
          # Only text opening an object or an array (after JSON whitespace)
          # decodes to a container.
          if __keep && is_string(value) && match(string!(value), r'^[ \t\n\r]*[\x5B\x7B]') {
              __decoded, __decode_err = parse_json(string!(value))
              __keep = !(__decode_err == null && (is_object(__decoded) || is_array(__decoded)))
          }
          if __keep {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, with recursive
  # redaction. These entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__safe.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

