source: json
transforms:
- source: published
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: outcome.result
  target: status_id
  kind: enum
  reason: Okta outcome maps to OCSF status in the emitted branch.
  values:
    success: 1
    allow: 1
    failure: 2
    deny: 2
    challenge: 2
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  actor.alternateId:
  - actor.user.email_addr
  - actor.user.name
  - user.email_addr
  - user.name
  actor.id:
  - actor.user.uid
  - user.uid
  actor.type:
  - actor.user.type
  - user.type
  authenticationContext.credentialType:
  - auth_protocol
  authenticationContext.externalSessionId:
  - session.uid
  client.ipAddress:
  - src_endpoint.ip
  client.userAgent.rawUserAgent:
  - http_request.user_agent
  displayMessage:
  - message
  eventType:
  - api.operation
  - metadata.event_code
  outcome.reason:
  - status_detail
  securityContext.asNumber:
  - src_endpoint.autonomous_system.number
  securityContext.asOrg:
  - src_endpoint.autonomous_system.name
  securityContext.isp:
  - src_endpoint.isp
  transaction.id:
  - metadata.correlation_uid
  uuid:
  - metadata.original_event_uid
  - metadata.uid
