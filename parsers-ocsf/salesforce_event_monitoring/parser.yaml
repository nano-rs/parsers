name: salesforce_event_monitoring_ocsf
display_name: Salesforce Event Monitoring (OCSF)
version: "1.0.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses Salesforce Shield Event Monitoring into complete OCSF 1.9.0 records.
  Two sources, one record per message:
    EventLogFile (ELF) rows, keyed by EVENT_TYPE. Either a JSON object with
    the ELF column names (a collector applied the header), or the CSV header
    line plus ONE data row in the same message. The CSV column order is
    header-driven (LogFileFieldNames): it differs by event type and API
    version, so EVENT_TYPE may sit in any column, a leading UTF-8 BOM is
    ignored, and a quoted value may span lines (the record ends at a newline
    outside quotes). A bare CSV row without its header is not guessed at and
    is kept as a Base Event, as is a row with an unclosed quote. A message
    carrying more rows is parsed for the first row only and marked with
    unmapped.parse_fallback.
    Real-Time Event Monitoring objects (LoginEvent, LoginAsEvent, LogoutEvent,
    ApiEvent, ReportEvent, LightningUriEvent) and LoginHistory, typed by
    attributes.type when the export carries it, else by their fields
    (streamed Pub/Sub events have no attributes: DelegatedUsername marks a
    LoginAsEvent, a bare session record a LogoutEvent).
  Routing:
    Login, LoginEvent, LoginHistory       -> Authentication 3002 (Logon)
    LoginAs, LoginAsEvent                 -> Authentication 3002 (Account Switch, Impersonate; Medium)
    Logout, LogoutEvent                   -> Authentication 3002 (Logoff)
    Report, ReportExport, ReportEvent     -> Datastore Activity 6005 (Read; exports Medium)
    ApiEvent with a SOQL Query            -> Datastore Activity 6005 (Query); the
                                             full query is
                                             query_info.query_string
    API, RestApi, Apex*, URI, LightningUriEvent
    and every other event type            -> API Activity 6003
  ORGANIZATION_ID is metadata.tenant_uid; REQUEST_ID (ELF) or EventIdentifier
  (real-time) is metadata.uid.
  Over Splunk HEC, send each log as an HEC string event (or post it to
  nano's /ingest endpoint), not as an HEC object event: for an object event
  nano today removes some fields (such as timestamp) and may hand the parser
  only the event's message, so the time or fields can be lost. A fix is
  planned in nano.
  For Salesforce, a JSON record that a forwarder gives its own message field
  arrives as that text only.
match_values:
  - salesforce_event_monitoring
category: cloud
vendor: "Salesforce"
product: "Salesforce"
parser_vrl: |
  # NAN source timezone. Generated by scripts/residual_spill.py; edit scripts/residual/source_tz.vrl.
  # The log source's timezone setting arrives as .nano.source_timezone (an IANA
  # name such as "America/New_York", or any fixed offset such as "+05:30"), set
  # by nano at ingest. .nano is nano's input, never part of the log: it is
  # removed whole before anything else, whatever its shape.
  # For a clock that carries no offset a parser parses it AS UTC and sets
  # __lc_pending; the generated local-clock block that follows the parse
  # (local_clock.vrl) turns it into real UTC with this setting, and the spill
  # records the zone used as unmapped.nano_time_assumed_tz (the name, the offset
  # as +HH:MM, or "UTC" when the setting is absent, invalid or "local").
  __src_nano = del(.nano)
  __src_tz_in = ""
  if is_object(__src_nano) { __src_tz_in = strip_whitespace(to_string(object!(__src_nano).source_timezone) ?? "") }
  __src_tz = "UTC"
  __src_shift_ms = 0
  __src_tz_label = "UTC"
  __time_assumed = false
  __time_inline = false
  __lc_pending = false
  # No parse_* decoder here: nano infers a parser's input contract from the first
  # decoder in its program (parse_json first = a JSON-input parser, handed the
  # whole HEC / OTLP object). This prelude opens every parser, so a decoder in it
  # would turn every JSON-input parser into a text one. match + slice instead.
  if match(__src_tz_in, r'^[+-]\d{2}:?\d{2}$') {
      __src_sign = slice(__src_tz_in, 0, 1) ?? "+"
      __src_digits = replace(slice(__src_tz_in, 1) ?? "", ":", "")
      __src_hh = slice(__src_digits, 0, 2) ?? "99"
      __src_mm = slice(__src_digits, 2, 4) ?? "99"
      __src_h = to_int(__src_hh) ?? 99
      __src_m = to_int(__src_mm) ?? 99
      if __src_h <= 14 && __src_m <= 59 {
          __src_shift_ms = (__src_h * 3600 + __src_m * 60) * 1000
          if __src_sign == "-" { __src_shift_ms = 0 - __src_shift_ms }
          if __src_shift_ms != 0 { __src_tz_label = __src_sign + __src_hh + ":" + __src_mm }
      }
  } else if __src_tz_in != "" && downcase(__src_tz_in) != "local" {
      # "local" (the Vector host's zone) would make the time depend on the host.
      __src_probe, __src_probe_err = parse_timestamp("2000-01-01 00:00:00", "%Y-%m-%d %H:%M:%S", timezone: __src_tz_in)
      if __src_probe_err == null { __src_tz = __src_tz_in; __src_tz_label = __src_tz_in }
  }
  # END NAN source timezone
  # nano's input contract (nanosiem hec_payload.rs), stated: text, as it reads today
  # (EventLogFile CSV needs its text; the JSON forms carry no `message` and still arrive whole).
  # nano:input=text
  # Salesforce Event Monitoring (EventLogFile rows, Real-Time Event Monitoring) -> OCSF 1.9.0.
  # A string body is the usual wire form. A source that already decoded the
  # JSON hands over an object (or array) instead, and a record without any
  # `message` is the decoded event itself; never abort on either.
  raw_log = ""
  if is_string(.message) {
      raw_log = string!(.message)
  } else if is_object(.message) || is_array(.message) {
      raw_log = encode_json(.message)
  } else if exists(.message) && !is_null(.message) {
      raw_log = to_string(.message) ?? ""
  } else {
      raw_log = encode_json(.)
  }
  __raw_body = raw_log
  __source_kv = {}
  # A UTF-8 byte order mark (written by spreadsheet tools and some exporters)
  # is not part of the data.
  body = replace(raw_log, r'^\x{FEFF}', "")
  parsed, err = parse_json(body)
  r = {}
  fmt = ""
  fallback = ""
  if err == null && is_object(parsed) {
      r = object!(parsed)
      if exists(r.EVENT_TYPE) {
          fmt = "elf"
      } else if exists(r.EventDate) || exists(r.EventIdentifier) || exists(r.LoginHistoryId) || is_object(r.attributes) {
          fmt = "rtem"
      } else {
          fallback = "JSON object is neither an EventLogFile row nor an Event Monitoring event"
      }
      __source_kv = r
  } else if err == null {
      fallback = "not a JSON object"
  } else {
      # EventLogFile CSV is header-driven: the column order is the file's own
      # header (LogFileFieldNames) and differs by event type and API version,
      # so a row is only decoded together with its header line, and EVENT_TYPE
      # may sit in any column.
      lines = split(replace(body, "\r\n", "\n"), "\n")
      header = parse_csv(string!(lines[0])) ?? []
      if !includes(header, "EVENT_TYPE") {
          fallback = "EventLogFile CSV row without its header line (column layout unknown)"
      } else {
          # One RFC 4180 record ends at a newline OUTSIDE quotes: a quoted
          # QUERY or STACK_TRACE value may span lines, so lines are joined
          # until the record's quotes balance.
          rec_text = ""
          complete = false
          more = false
          for_each(slice!(lines, 1)) -> |_i, line| {
              l = string!(line)
              if !complete {
                  if rec_text != "" || l != "" {
                      if rec_text == "" { rec_text = l } else { rec_text = rec_text + "\n" + l }
                      if mod(length(split(rec_text, "\"")) - 1, 2) == 0 { complete = true }
                  }
              } else if l != "" {
                  more = true
              }
          }
          if rec_text == "" {
              fallback = "EventLogFile CSV header line without a data row"
          } else if !complete {
              fallback = "EventLogFile CSV data row has an unclosed quote"
          } else {
              row = parse_csv(rec_text) ?? []
              if length(header) != length(row) {
                  fallback = "EventLogFile CSV row does not match its header"
              } else {
                  for_each(header) -> |i, name| {
                      r = set!(r, [string!(name)], get!(row, [i]))
                  }
                  fmt = "elf"
                  __source_kv = r
                  if more { fallback = "multi-row EventLogFile CSV: only the first row is parsed" }
              }
          }
      }
  }

  if fmt == "" {
      # Not decodable: an OCSF Base Event with the raw body kept.
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 0,
          "activity_name": "Unknown",
          "type_uid": 0,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": 0,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": sha2("salesforce_event_monitoring|raw|" + raw_log, variant: "SHA-256"),
              "log_level": "error",
              "log_name": "Salesforce Event Monitoring",
              "log_provider": "Salesforce",
              "product": { "name": "Salesforce", "vendor_name": "Salesforce" }
          },
          "unmapped": { "parse_error": fallback }
      }
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      . = set!(., ["unmapped", "parse_fallback"], "unparsable input")
  } else {
      email_re = r'^[^@\s]+@[^@\s]+\.[^@\s]+$'
      # ---- one vocabulary for both wire forms ----
      et = ""
      ts = ""
      user_name = ""
      user_id = ""
      src_ip = ""
      session_key = ""
      login_key = ""
      evt_uid = ""
      org_id = ""
      user_agent = ""
      http_method = ""
      path = ""
      op = ""
      api_version = ""
      entity = ""
      query = ""
      report_id = ""
      report_name = ""
      status_text = ""
      failed = false
      status_code = 0
      delegated_name = ""
      delegated_id = ""
      login_url = ""
      record_id = ""
      loc = {}
      if fmt == "elf" {
          et = string(r.EVENT_TYPE) ?? ""
          ts = string(r.TIMESTAMP_DERIVED) ?? ""
          user_name = string(r.USER_NAME) ?? ""
          if user_name == "" { user_name = string(r.USERNAME) ?? "" }
          user_id = string(r.USER_ID_DERIVED) ?? ""
          if user_id == "" { user_id = string(r.USER_ID) ?? "" }
          src_ip = string(r.CLIENT_IP) ?? ""
          if src_ip == "" { src_ip = string(r.SOURCE_IP) ?? "" }
          session_key = string(r.SESSION_KEY) ?? ""
          login_key = string(r.LOGIN_KEY) ?? ""
          evt_uid = string(r.REQUEST_ID) ?? ""
          org_id = string(r.ORGANIZATION_ID) ?? ""
          user_agent = string(r.BROWSER_TYPE) ?? ""
          http_method = string(r.METHOD) ?? ""
          path = string(r.URI) ?? ""
          op = string(r.METHOD_NAME) ?? ""
          api_version = string(r.API_VERSION) ?? ""
          entity = string(r.ENTITY_NAME) ?? ""
          if entity == "" { entity = string(r.ENTITY) ?? "" }
          report_id = string(r.REPORT_ID_DERIVED) ?? ""
          if report_id == "" { report_id = string(r.REPORT_ID) ?? "" }
          delegated_name = string(r.DELEGATED_USER_NAME) ?? ""
          delegated_id = string(r.DELEGATED_USER_ID_DERIVED) ?? ""
          if delegated_id == "" { delegated_id = string(r.DELEGATED_USER_ID) ?? "" }
          login_status = string(r.LOGIN_STATUS) ?? ""
          req_status = string(r.REQUEST_STATUS) ?? ""
          if login_status != "" && login_status != "LOGIN_NO_ERROR" { failed = true; status_text = login_status }
          if includes(["f", "failed", "failure"], downcase(req_status)) { failed = true }
          # SUCCESS is "1"/"0" in the CSV but may arrive typed (0, false) in JSON.
          if includes(["0", "false", "f", "no", "n"], downcase(to_string(r.SUCCESS) ?? "")) { failed = true }
          status_code = to_int(r.STATUS_CODE) ?? 0
          if status_code >= 400 { failed = true }
      } else {
          rtype = ""
          if is_object(r.attributes) { rtype = string(r.attributes.type) ?? "" }
          if rtype == "" {
              # A schema-normalized collector may send every field, absent ones as
              # null or "", so a field signals a type only when it holds a value.
              # In priority order, so a report or page event is never overwritten.
              if (string(r.ReportId) ?? "") != "" {
                  rtype = "ReportEvent"
              } else if (string(r.PageUrl) ?? "") != "" {
                  rtype = "LightningUriEvent"
              } else if (string(r.Query) ?? "") != "" || ((string(r.QueriedEntities) ?? "") != "" && (string(r.ApiType) ?? "") != "") {
                  rtype = "ApiEvent"
              } else if (string(r.LoginType) ?? "") != "" || (string(r.LoginUrl) ?? "") != "" {
                  rtype = "LoginEvent"
              }
              # Streamed (Pub/Sub) deliveries carry no attributes.type: an admin
              # login-as carries a DelegatedUsername (and never outranks a report,
              # page or API event), and a logout is a session record with no
              # operation, query, page or login details.
              if (rtype == "" || rtype == "LoginEvent") && (string(r.DelegatedUsername) ?? "") != "" { rtype = "LoginAsEvent" }
              if rtype == "" && (string(r.SessionKey) ?? "") != "" && (string(r.Operation) ?? "") == "" && (string(r.ApiType) ?? "") == "" && (string(r.Status) ?? "") == "" { rtype = "LogoutEvent" }
          }
          et = rtype
          ts = string(r.EventDate) ?? ""
          if ts == "" { ts = string(r.CreatedDate) ?? "" }
          user_name = string(r.Username) ?? ""
          user_id = string(r.UserId) ?? ""
          src_ip = string(r.SourceIp) ?? ""
          session_key = string(r.SessionKey) ?? ""
          login_key = string(r.LoginKey) ?? ""
          evt_uid = string(r.EventIdentifier) ?? ""
          if evt_uid == "" { evt_uid = string(r.Id) ?? "" }
          user_agent = string(r.UserAgent) ?? ""
          http_method = string(r.HttpMethod) ?? ""
          path = string(r.PageUrl) ?? ""
          op = string(r.Operation) ?? ""
          api_version = string(r.ApiVersion) ?? ""
          if api_version == "N/A" { api_version = "" }
          entity = string(r.QueriedEntities) ?? ""
          query = string(r.Query) ?? ""
          report_id = string(r.ReportId) ?? ""
          report_name = string(r.Name) ?? ""
          record_id = string(r.RecordId) ?? ""
          login_url = string(r.LoginUrl) ?? ""
          delegated_name = string(r.DelegatedUsername) ?? ""
          status_text = string(r.Status) ?? ""
          if status_text != "" && status_text != "Success" { failed = true }
          city = string(r.City) ?? ""
          if city != "" { loc.city = city }
          country = string(r.CountryIso) ?? ""
          if country != "" { loc.country = country }
          region = string(r.Subdivision) ?? ""
          if region != "" { loc.region = region }
          postal = string(r.PostalCode) ?? ""
          if postal != "" { loc.postal_code = postal }
          # An equatorial or prime-meridian coordinate arrives as an integer (0, 1).
          if is_float(r.LoginLatitude) || is_integer(r.LoginLatitude) { loc.lat = r.LoginLatitude }
          if is_float(r.LoginLongitude) || is_integer(r.LoginLongitude) { loc.long = r.LoginLongitude }
      }

      # ---- time ----
      time_ms = 0
      clock, clock_err = parse_timestamp(ts, "%+", timezone: "UTC")
      if clock_err == null {
          time_ms = to_unix_timestamp(clock, unit: "milliseconds")
      } else if fmt == "elf" {
          # EventLogFile TIMESTAMP is GMT, e.g. 20130715233322.670.
          # utc-by-spec: EventLogFile TIMESTAMP is GMT by specification.
          clock2, clock2_err = parse_timestamp(string(r.TIMESTAMP) ?? "", "%Y%m%d%H%M%S%.f", timezone: "UTC")
          if clock2_err == null { time_ms = to_unix_timestamp(clock2, unit: "milliseconds") }
      }

      # ---- principals and endpoint ----
      user = {}
      if user_name != "" { user.name = user_name }
      if user_id != "" { user.uid = user_id }
      if match(user_name, email_re) { user.email_addr = user_name }
      if length(user) == 0 { user = { "name": "unknown" } }
      src_ep = { "hostname": "unknown" }
      if is_ipv4(src_ip) || is_ipv6(src_ip) { src_ep = { "ip": src_ip } }
      # OCSF location needs a place (at_least_one city / country / postal_code
      # / region): bare coordinates stay in unmapped as written.
      if exists(loc.city) || exists(loc.country) || exists(loc.postal_code) || exists(loc.region) { src_ep.location = loc }
      session = {}
      if session_key != "" { session.uid = session_key }
      if login_key != "" {
          if exists(session.uid) { session.uid_alt = login_key } else { session.uid = login_key }
      }

      # ---- family routing ----
      family = "api"
      if et == "Login" || et == "LoginEvent" || et == "LoginHistory" { family = "login" }
      if et == "LoginAs" || et == "LoginAsEvent" { family = "loginas" }
      if et == "Logout" || et == "LogoutEvent" { family = "logout" }
      if et == "Report" || et == "ReportExport" || et == "ReportEvent" { family = "report" }
      if et == "ApiEvent" && query != "" { family = "query" }

      status_id = 1
      status_str = "Success"
      severity_id = 1
      severity = "Informational"
      if failed { status_id = 2; status_str = "Failure"; severity_id = 2; severity = "Low" }
      if family == "loginas" || et == "ReportExport" || (et == "ReportEvent" && contains(downcase(op), "export")) { severity_id = 3; severity = "Medium" }

      ocsf = {}
      if family == "login" || family == "loginas" || family == "logout" {
          activity_id = 1
          activity_name = "Logon"
          if family == "logout" { activity_id = 2; activity_name = "Logoff" }
          ocsf.class_uid = 3002
          ocsf.class_name = "Authentication"
          ocsf.category_uid = 3
          ocsf.category_name = "Identity & Access Management"
          ocsf.user = user
          if family == "loginas" {
              # An admin logged in AS the user: the user is USER_ID, the admin
              # is the DELEGATED_USER.
              activity_id = 7
              activity_name = "Account Switch"
              ocsf.account_switch_type_id = 2
              ocsf.account_switch_type = "Impersonate"
              admin = {}
              if delegated_name != "" { admin.name = delegated_name }
              if match(delegated_name, email_re) { admin.email_addr = delegated_name }
              if delegated_id != "" { admin.uid = delegated_id }
              if length(admin) > 0 { ocsf.actor = { "user": admin } }
          }
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          ocsf.service = { "name": "Salesforce" }
          ocsf.is_remote = true
          if status_text != "" && failed { ocsf.status_detail = status_text }
          if user_agent != "" { ocsf.http_request = { "user_agent": user_agent } }
          if login_url != "" { ocsf.dst_endpoint = { "hostname": login_url } }
          if length(session) > 0 { ocsf.session = session }
      } else if family == "report" || family == "query" {
          activity_id = 1
          activity_name = "Read"
          if family == "query" { activity_id = 4; activity_name = "Query" }
          ocsf.class_uid = 6005
          ocsf.class_name = "Datastore Activity"
          ocsf.category_uid = 6
          ocsf.category_name = "Application Activity"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          actor = { "user": user }
          if length(session) > 0 { actor.session = session }
          ocsf.actor = actor
          tbl = {}
          if family == "report" {
              if report_id != "" { tbl.uid = report_id }
              if report_name != "" { tbl.name = report_name }
          } else if entity != "" {
              tbl.name = entity
          }
          if length(tbl) == 0 { tbl.name = "unknown" }
          ocsf.table = tbl
          if family == "query" {
              # The full query, never truncated: a parser keeps every value.
              # query_info needs a uid (OCSF at_least_one name / uid): the same
              # fallback metadata.uid gets below when the event has no id.
              qinfo_uid = evt_uid
              if qinfo_uid == "" { qinfo_uid = sha2("salesforce_event_monitoring|raw|" + raw_log, variant: "SHA-256") }
              qinfo = { "uid": qinfo_uid, "query_string": query }
              ocsf.query_info = qinfo
          }
      } else {
          verb = downcase(op + " " + http_method)
          activity_id = 99
          activity_name = "Other"
          if contains(verb, "get") || contains(verb, "query") || contains(verb, "read") || et == "LightningUriEvent" || et == "URI" || et == "LightningPageView" { activity_id = 2; activity_name = "Read" }
          if contains(verb, "post") || contains(verb, "insert") || contains(verb, "create") { activity_id = 1; activity_name = "Create" }
          if contains(verb, "patch") || contains(verb, "put") || contains(verb, "update") || contains(verb, "upsert") { activity_id = 3; activity_name = "Update" }
          if contains(verb, "delete") { activity_id = 4; activity_name = "Delete" }
          ocsf.class_uid = 6003
          ocsf.class_name = "API Activity"
          ocsf.category_uid = 6
          ocsf.category_name = "Application Activity"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          operation = op
          if operation == "" { operation = et }
          if operation == "" { operation = "unknown" }
          api = { "operation": operation, "service": { "name": "Salesforce" } }
          if api_version != "" { api.version = api_version }
          ocsf.api = api
          actor = { "user": user }
          if length(session) > 0 { actor.session = session }
          ocsf.actor = actor
          req = {}
          if http_method != "" { req.http_method = http_method }
          if path != "" { req.url = { "path": path } }
          if user_agent != "" { req.user_agent = user_agent }
          if length(req) > 0 { ocsf.http_request = req }
          if status_code > 0 { ocsf.http_response = { "code": status_code } }
          res = []
          if entity != "" { res = push(res, { "name": entity, "type": "sObject" }) }
          if record_id != "" { res = push(res, { "uid": record_id, "type": "Record" }) }
          if length(res) > 0 { ocsf.resources = res }
      }

      ocsf.src_endpoint = src_ep
      ocsf.status_id = status_id
      ocsf.status = status_str
      ocsf.severity_id = severity_id
      ocsf.severity = severity
      ocsf.type_uid = to_int(ocsf.class_uid) * 100 + to_int(ocsf.activity_id)
      ocsf.time = time_ms
      msg = et
      if msg == "" { msg = "salesforce_event" }
      ocsf.message = msg
      ocsf.raw_data = raw_log

      if evt_uid == "" { evt_uid = sha2("salesforce_event_monitoring|raw|" + raw_log, variant: "SHA-256") }
      log_name = "Salesforce EventLogFile"
      if fmt == "rtem" { log_name = "Salesforce Real-Time Event Monitoring" }
      md = {
          "version": "1.9.0",
          "uid": evt_uid,
          "log_name": log_name,
          "log_provider": "Salesforce",
          "product": { "name": "Salesforce", "vendor_name": "Salesforce" }
      }
      if et != "" { md.event_code = et }
      if org_id != "" { md.tenant_uid = org_id }
      ocsf.metadata = md
      if fallback != "" { ocsf.unmapped = { "parse_fallback": fallback } }

      . = ocsf
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # Values spill exactly as parsed: a parser never masks, redacts or withholds
  # anything (masking is an opt-in pipeline step, never a parser concern).
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # A source field is consumed ONLY by an explicit mapping: a field-coverage.yaml
  # `mappings` entry (source key -> target paths) or a `transforms` rule with a
  # target, whose value is found AT THAT TARGET PATH of the selected branch. A
  # value that merely appears somewhere else in the event never consumes a field
  # (no coincidental consumption); everything else spills.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The sets below are strings instead
  # (a read shares the buffer). __repr holds one member per mapped leaf:
  # "," + encode_json(path) + "=" + encode_json(encode_json(value)), plus the
  # to_string form for a string or a float, so a numeric string is represented by
  # its typed scalar. Every part is a JSON text, inside which a '"' is always
  # escaped, so a member is matched exactly. Paths drop array indices
  # (resources.0.uid is resources.uid); arrays are walked two levels deep, and a
  # leaf deeper than that is simply not mapping evidence (it can only spill more).
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped = object!(parse_json!(encode_json(__mapped)))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __copy = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __repr = ""
  for_each(flatten(__mapped)) -> |path, value| {
      __p = encode_json(path)
      if is_array(value) {
          for_each(array!(value)) -> |_i, item| {
              if is_object(item) {
                  for_each(flatten(object!(item))) -> |sub, leaf| {
                      __q = encode_json(path + "." + sub)
                      if is_array(leaf) {
                          for_each(array!(leaf)) -> |_j, x| {
                              if !is_object(x) && !is_array(x) {
                                  __repr = __repr + ("," + __q + "=" + encode_json(encode_json(x)))
                                  if is_string(x) || is_float(x) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(x))) }
                              }
                          }
                      } else {
                          __repr = __repr + ("," + __q + "=" + encode_json(encode_json(leaf)))
                          if is_string(leaf) || is_float(leaf) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(leaf))) }
                      }
                  }
              } else if !is_array(item) {
                  __repr = __repr + ("," + __p + "=" + encode_json(encode_json(item)))
                  if is_string(item) || is_float(item) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(item))) }
              }
          }
      } else {
          __repr = __repr + ("," + __p + "=" + encode_json(encode_json(value)))
          if is_string(value) || is_float(value) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(value))) }
      }
  }
  __consumed = ""
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__copy.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # BEGIN parser-specific transformations
  # TIMESTAMP_DERIVED: EventLogFile ISO TIMESTAMP_DERIVED converted to the event clock in milliseconds.
  # EventDate: Real-time event ISO EventDate converted to the event clock in milliseconds.
  for_each(__flat) -> |key, value| {
      if match(key, r'(?x)
      \A(?:
        TIMESTAMP_DERIVED
      | EventDate
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%+", timezone: "UTC")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              if contains(__repr, "," + "\"time\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
  }
  # Declared source -> target mappings (field-coverage.yaml `mappings`).
  __decl = "\n\"API_VERSION\"\t[\"api.version\"]\n\"BROWSER_TYPE\"\t[\"http_request.user_agent\"]\n\"CLIENT_IP\"\t[\"src_endpoint.ip\"]\n\"EVENT_TYPE\"\t[\"api.operation\",\"message\",\"metadata.event_code\"]\n\"LOGIN_KEY\"\t[\"actor.session.uid_alt\",\"session.uid\",\"session.uid_alt\"]\n\"LOGIN_STATUS\"\t[\"status_detail\"]\n\"ORGANIZATION_ID\"\t[\"metadata.tenant_uid\"]\n\"REQUEST_ID\"\t[\"metadata.uid\"]\n\"SESSION_KEY\"\t[\"actor.session.uid\",\"session.uid\"]\n\"URI\"\t[\"http_request.url.path\"]\n\"USER_ID_DERIVED\"\t[\"actor.user.uid\",\"user.uid\"]\n\"USER_NAME\"\t[\"user.email_addr\",\"user.name\"]\n\"DELEGATED_USER_ID_DERIVED\"\t[\"actor.user.uid\"]\n\"DELEGATED_USER_NAME\"\t[\"actor.user.email_addr\",\"actor.user.name\"]\n\"METHOD\"\t[\"http_request.http_method\"]\n\"METHOD_NAME\"\t[\"api.operation\"]\n\"ENTITY_NAME\"\t[\"resources.name\"]\n\"STATUS_CODE\"\t[\"http_response.code\"]\n\"REPORT_ID\"\t[\"table.uid\"]\n\"REPORT_ID_DERIVED\"\t[\"table.uid\"]\n\"City\"\t[\"src_endpoint.location.city\"]\n\"CountryIso\"\t[\"src_endpoint.location.country\"]\n\"EventIdentifier\"\t[\"metadata.uid\",\"query_info.uid\"]\n\"LoginKey\"\t[\"actor.session.uid_alt\",\"session.uid\",\"session.uid_alt\"]\n\"LoginLatitude\"\t[\"src_endpoint.location.lat\"]\n\"LoginLongitude\"\t[\"src_endpoint.location.long\"]\n\"LoginUrl\"\t[\"dst_endpoint.hostname\"]\n\"PostalCode\"\t[\"src_endpoint.location.postal_code\"]\n\"SessionKey\"\t[\"actor.session.uid\",\"session.uid\"]\n\"SourceIp\"\t[\"src_endpoint.ip\"]\n\"Status\"\t[\"status_detail\"]\n\"Subdivision\"\t[\"src_endpoint.location.region\"]\n\"UserId\"\t[\"actor.user.uid\",\"user.uid\"]\n\"Username\"\t[\"actor.user.email_addr\",\"actor.user.name\",\"user.email_addr\",\"user.name\"]\n\"Operation\"\t[\"api.operation\"]\n\"QueriedEntities\"\t[\"resources.name\",\"table.name\"]\n\"Query\"\t[\"query_info.query_string\"]\n\"attributes.type\"\t[\"message\",\"metadata.event_code\"]\n\"Name\"\t[\"table.name\"]\n\"ReportId\"\t[\"table.uid\"]\n\"PageUrl\"\t[\"http_request.url.path\"]\n\"RecordId\"\t[\"resources.uid\"]\n\"DelegatedUsername\"\t[\"actor.user.email_addr\",\"actor.user.name\"]\n"
  __preserve = []
  # END parser-specific transformations
  # Declared mappings: __decl holds "\n" + encode_json(key) + "\t" + JSON array of
  # target paths + "\n" per mapped source key (a raw newline never occurs in
  # compact JSON). A key is consumed when its value, or every element of a scalar
  # array, is at one of its own targets. Keys stay ESCAPED here and in __consumed:
  # a literal dotted key ("a~1b") and the nested path ("a.b") are different
  # fields, and mapping one never consumes the other.
  for_each(__flat) -> |key, value| {
      # __decl spells a bracket inside a key as a \u escape (deploy bracket count).
      __kt = encode_json(key)
      if match(__kt, r'[\x28\x29\x5B\x5D\x7B\x7D]') {
          __kt = replace(replace(replace(replace(replace(replace(__kt, r'\x28', "\\u0028"), r'\x29', "\\u0029"), r'\x5B', "\\u005b"), r'\x5D', "\\u005d"), r'\x7B', "\\u007b"), r'\x7D', "\\u007d")
      }
      __at = find(__decl, "\n" + __kt + "\t")
      if is_integer(__at) && !is_object(value) {
          __rest = slice!(__decl, int!(__at) + strlen(__kt) + 2)
          __hit = false
          for_each(array!(parse_json!(slice!(__rest, 0, int!(find(__rest, "\n")))))) -> |_i, target| {
              __tok = "," + encode_json(target) + "="
              if !__hit && is_array(value) {
                  __all = !is_empty(array!(value))
                  for_each(array!(value)) -> |_j, item| {
                      if __all {
                          __all = !is_object(item) && !is_array(item) && (contains(__repr, __tok + encode_json(encode_json(item))) || ((is_string(item) || is_float(item)) && contains(__repr, __tok + encode_json(to_string!(item)))))
                      }
                  }
                  __hit = __all
              } else if !__hit {
                  __hit = contains(__repr, __tok + encode_json(encode_json(value))) || ((is_string(value) || is_float(value)) && contains(__repr, __tok + encode_json(to_string!(value))))
              }
          }
          if __hit { __consumed = __consumed + ("," + encode_json(key)) }
      }
  }
  # Fast path: when no two source keys decode to the same key and no two spilled
  # keys get the same name, each key's decision depends only on its own value, so
  # one filter and one rename build the residual without copying it per key.
  __distinct = true
  if __tilde {
      __distinct = length(map_keys(__flat) -> |key| { replace(replace(key, "~1", "."), "~0", "~") }) == length(__flat)
  }
  __kept = {}
  __names = {}
  if __distinct {
      __kept = filter(__flat) -> |key, value| {
          # A key is kept unless an explicit mapping or transformation consumed it.
          # Do not spill a copy of the raw body.
          value != __raw_body && !contains(__consumed, "," + encode_json(key))
      }
      __names = map_keys(__kept) -> |key| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          join!(__parts, ".")
      }
  }
  __residual = {}
  if __distinct && length(__names) == length(__kept) {
      __residual = map_values(__names) -> |value| {
          if is_array(value) || is_object(value) {
              if __tilde {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              if __complex { value = encode_json(value) }
          }
          value
      }
  } else {
      # Slow path: two spilled keys get the same name. A literal dotted key and a
      # nested path read alike ({"a.b": 1, "a": {"b": 2}} is "a.b" twice), and so
      # do keys that only snake-case alike ("userName", "user_name").
      # NAN-5894: a literal dotted key whose name is shared keeps its dots
      # escaped, RFC 6901 style ("a~1b", a "~" in it as "~0"), and the key
      # without a literal dot keeps "a.b". That is the name nano's ingest step
      # gives the flat key when no parser runs, so the name never depends on
      # whether a parser read the event, and it cannot clash with a vendor key
      # that is really named "b_2". A key is escaped only when its escaped name
      # is unique too (two flat keys that only snake-case alike escape to the
      # same name, so escaping would not tell them apart). Only a name still
      # taken after that gets the next free _2, _3, ... suffix, in key order:
      # keys that differ only in case or snake-casing, or a vendor key already
      # spelled "a~1b" (nothing is ever dropped).
      __spilled = filter(__flat) -> |key, value| {
          value != __raw_body && !contains(__consumed, "," + encode_json(key))
      }
      __plain = map_values(keys(__spilled)) -> |key| {
          key = replace(replace(string!(key), "~1", "."), "~0", "~")
          join!(map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }, ".")
      }
      __shared = filter(tally!(__plain)) -> |_name, count| { count > 1 }
      __shared = "\n" + join!(map_values(keys(__shared)) -> |name| { encode_json(name) }, "\n") + "\n"
      # The escaped name of each literal dotted key ("" for any other key).
      __escaped_names = map_values(keys(__spilled)) -> |key| {
          key = string!(key)
          if contains(key, "~1") {
              join!(map_values(split(key, ".")) -> |segment| {
                  join!(map_values(split(string!(segment), "~1")) -> |piece| {
                      replace(snakecase(replace(string!(piece), "~0", "~")), "~", "~0")
                  }, "~1")
              }, ".")
          } else { "" }
      }
      __escaped_shared = filter(tally!(__escaped_names)) -> |_name, count| { count > 1 }
      __escaped_shared = "\n" + join!(map_values(keys(__escaped_shared)) -> |name| { encode_json(name) }, "\n") + "\n"
      for_each(__flat) -> |key, value| {
          __token = "," + encode_json(key)
          __escaped_key = key
          key = replace(replace(key, "~1", "."), "~0", "~")
          if is_array(value) || is_object(value) {
              value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                  replace(replace(inner, "~1", "."), "~0", "~")
              }, ["v"])
          }
          if !contains(__consumed, __token) && value != __raw_body {
              __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
              __base = join!(__parts, ".")
              if contains(__escaped_key, "~1") && contains(__shared, "\n" + encode_json(__base) + "\n") {
                  __escaped_name = join!(map_values(split(__escaped_key, ".")) -> |segment| {
                      join!(map_values(split(string!(segment), "~1")) -> |piece| {
                          replace(snakecase(replace(string!(piece), "~0", "~")), "~", "~0")
                      }, "~1")
                  }, ".")
                  if !contains(__escaped_shared, "\n" + encode_json(__escaped_name) + "\n") { __base = __escaped_name }
              }
              __key = __base
              __suffix = 2
              if includes(keys(__residual), __key) {
                  for_each(__flat) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __key) {
                          __key = __base + "_" + to_string(__suffix)
                          __suffix = __suffix + 1
                      }
                  }
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              __spill = if __complex { encode_json(value) } else { value }
              __residual = set!(__residual, [__key], __spill)
          }
      }
  }
  # Names nano owns in unmapped (the parser markers and the reserved nano.*
  # namespace) are never taken by a source field: a vendor key with such a name
  # is kept, renamed source_<name>, so a log cannot forge a marker. An escaped
  # flat key ("nano~1x", NAN-5894) is renamed the same way as "nano.x".
  if match(encode_json(keys(__residual)), r'"nano(?:"|\.|~1|_time_assumed_tz"|_time_source"|_operational")') {
      for_each(object!(__residual)) -> |key, value| {
          if includes(["nano", "nano_time_assumed_tz", "nano_time_source", "nano_operational"], key) || starts_with(key, "nano.") || starts_with(key, "nano~1") {
              # source_<name>, or the next free _2, _3, ... when a vendor key
              # already holds that name: nothing is lost.
              __rk = "source_" + key
              __rn = 2
              if includes(keys(__residual), __rk) {
                  for_each(__residual) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __rk) {
                          __rk = "source_" + key + "_" + to_string(__rn)
                          __rn = __rn + 1
                      }
                  }
              }
              __residual = remove!(__residual, [key])
              __residual = set!(__residual, [__rk], value)
          }
      }
  }
  # Keep existing derived evidence, but remove null placeholders and copies of a
  # source value (that value is mapped or spilled above under its source path).
  # A value merely equal to some mapped attribute is kept: equality with an
  # unrelated attribute is no evidence that it is represented.
  # The canonical source spill above is the authoritative representation of
  # containers. The cheap conditions run first; the source value set is built on
  # first use.
  __original_values = null
  for_each(flatten(__existing)) -> |key, value| {
      if !is_null(value) && value != "" && !is_array(value) && !is_object(value) && value != __raw_body {
          # Members for the value itself and for to_string(value), as above.
          __json = encode_json(value)
          __as_json = "," + encode_json(__json)
          __as_string = __as_json
          if is_string(value) { __as_string = "," + __json } else if is_float(value) { __as_string = "," + encode_json(to_string!(value)) }
          if __original_values == null {
              # __source_kv may hold non-JSON types (a timestamp), so only an
              # integer or a boolean skips its to_string member here.
              __original_values = join!(map_values(values(flatten(__source_kv))) -> |source_value| {
                  __source_json = encode_json(source_value)
                  __tokens = "," + encode_json(__source_json)
                  if is_string(source_value) {
                      __tokens = __tokens + "," + __source_json
                  } else if !is_object(source_value) && !is_array(source_value) && !is_integer(source_value) && !is_boolean(source_value) {
                      __tokens = __tokens + "," + encode_json(to_string(source_value) ?? "")
                  }
                  __tokens
              }, "")
          }
          __source_set = string!(__original_values)
          __keep = !contains(__source_set, __as_json) && !contains(__source_set, __as_string)
          # Only text opening an object or an array (after JSON whitespace)
          # decodes to a container.
          if __keep && is_string(value) && match(string!(value), r'^[ \t\n\r]*[\x5B\x7B]') {
              __decoded, __decode_err = parse_json(string!(value))
              __keep = !(__decode_err == null && (is_object(__decoded) || is_array(__decoded)))
          }
          if __keep {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, as-is. These
  # entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__copy.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  if __time_assumed && !__time_inline { __residual = set!(__residual, ["nano_time_assumed_tz"], __src_tz_label) }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

