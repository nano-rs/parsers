name: salesforce_event_monitoring_ocsf
display_name: Salesforce Event Monitoring (OCSF)
version: "1.0.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields in redacted, dotted snake_case unmapped keys.
  Parses Salesforce Shield Event Monitoring into complete OCSF 1.9.0 records.
  Two sources, one record per message:
    EventLogFile (ELF) rows, keyed by EVENT_TYPE. Either a JSON object with
    the ELF column names (a collector applied the header), or the CSV header
    line plus ONE data row in the same message. The CSV column order is
    header-driven (LogFileFieldNames): it differs by event type and API
    version, so EVENT_TYPE may sit in any column, a leading UTF-8 BOM is
    ignored, and a quoted value may span lines (the record ends at a newline
    outside quotes). A bare CSV row without its header is not guessed at and
    is kept as a Base Event, as is a row with an unclosed quote. A message
    carrying more rows is parsed for the first row only and marked with
    unmapped.parse_fallback.
    Real-Time Event Monitoring objects (LoginEvent, LoginAsEvent, LogoutEvent,
    ApiEvent, ReportEvent, LightningUriEvent) and LoginHistory, typed by
    attributes.type when the export carries it, else by their fields
    (streamed Pub/Sub events have no attributes: DelegatedUsername marks a
    LoginAsEvent, a bare session record a LogoutEvent).
  Routing:
    Login, LoginEvent, LoginHistory       -> Authentication 3002 (Logon)
    LoginAs, LoginAsEvent                 -> Authentication 3002 (Account Switch, Impersonate; Medium)
    Logout, LogoutEvent                   -> Authentication 3002 (Logoff)
    Report, ReportExport, ReportEvent     -> Datastore Activity 6005 (Read; exports Medium)
    ApiEvent with a SOQL Query            -> Datastore Activity 6005 (Query); the
                                             query is bounded to 4096 characters in
                                             query_info.query_string (raw_data
                                             keeps the one full copy)
    API, RestApi, Apex*, URI, LightningUriEvent
    and every other event type            -> API Activity 6003
  ORGANIZATION_ID is metadata.tenant_uid; REQUEST_ID (ELF) or EventIdentifier
  (real-time) is metadata.uid.
match_values:
  - salesforce_event_monitoring
category: cloud
vendor: "Salesforce"
product: "Salesforce"
parser_vrl: |
  # Salesforce Event Monitoring (EventLogFile rows, Real-Time Event Monitoring) -> OCSF 1.9.0.
  # A string body is the usual wire form. A source that already decoded the
  # JSON hands over an object (or array) instead, and a record without any
  # `message` is the decoded event itself; never abort on either.
  raw_log = ""
  if is_string(.message) {
      raw_log = string!(.message)
  } else if is_object(.message) || is_array(.message) {
      raw_log = encode_json(.message)
  } else if exists(.message) && !is_null(.message) {
      raw_log = to_string(.message) ?? ""
  } else {
      raw_log = encode_json(.)
  }
  __raw_body = raw_log
  __source_kv = {}
  # A UTF-8 byte order mark (written by spreadsheet tools and some exporters)
  # is not part of the data.
  body = replace(raw_log, r'^\x{FEFF}', "")
  parsed, err = parse_json(body)
  r = {}
  fmt = ""
  fallback = ""
  if err == null && is_object(parsed) {
      r = object!(parsed)
      if exists(r.EVENT_TYPE) {
          fmt = "elf"
      } else if exists(r.EventDate) || exists(r.EventIdentifier) || exists(r.LoginHistoryId) || is_object(r.attributes) {
          fmt = "rtem"
      } else {
          fallback = "JSON object is neither an EventLogFile row nor an Event Monitoring event"
      }
      __source_kv = r
  } else if err == null {
      fallback = "not a JSON object"
  } else {
      # EventLogFile CSV is header-driven: the column order is the file's own
      # header (LogFileFieldNames) and differs by event type and API version,
      # so a row is only decoded together with its header line, and EVENT_TYPE
      # may sit in any column.
      lines = split(replace(body, "\r\n", "\n"), "\n")
      header = parse_csv(string!(lines[0])) ?? []
      if !includes(header, "EVENT_TYPE") {
          fallback = "EventLogFile CSV row without its header line (column layout unknown)"
      } else {
          # One RFC 4180 record ends at a newline OUTSIDE quotes: a quoted
          # QUERY or STACK_TRACE value may span lines, so lines are joined
          # until the record's quotes balance.
          rec_text = ""
          complete = false
          more = false
          for_each(slice!(lines, 1)) -> |_i, line| {
              l = string!(line)
              if !complete {
                  if rec_text != "" || l != "" {
                      if rec_text == "" { rec_text = l } else { rec_text = rec_text + "\n" + l }
                      if mod(length(split(rec_text, "\"")) - 1, 2) == 0 { complete = true }
                  }
              } else if l != "" {
                  more = true
              }
          }
          if rec_text == "" {
              fallback = "EventLogFile CSV header line without a data row"
          } else if !complete {
              fallback = "EventLogFile CSV data row has an unclosed quote"
          } else {
              row = parse_csv(rec_text) ?? []
              if length(header) != length(row) {
                  fallback = "EventLogFile CSV row does not match its header"
              } else {
                  for_each(header) -> |i, name| {
                      r = set!(r, [string!(name)], get!(row, [i]))
                  }
                  fmt = "elf"
                  __source_kv = r
                  if more { fallback = "multi-row EventLogFile CSV: only the first row is parsed" }
              }
          }
      }
  }

  if fmt == "" {
      # Not decodable: an OCSF Base Event with the raw body kept.
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 0,
          "activity_name": "Unknown",
          "type_uid": 0,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": 0,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": sha2("salesforce_event_monitoring|raw|" + raw_log, variant: "SHA-256"),
              "log_level": "error",
              "log_name": "Salesforce Event Monitoring",
              "log_provider": "Salesforce",
              "product": { "name": "Salesforce", "vendor_name": "Salesforce" }
          },
          "unmapped": { "parse_error": fallback }
      }
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      . = set!(., ["unmapped", "parse_fallback"], "unparsable input")
  } else {
      email_re = r'^[^@\s]+@[^@\s]+\.[^@\s]+$'
      # ---- one vocabulary for both wire forms ----
      et = ""
      ts = ""
      user_name = ""
      user_id = ""
      src_ip = ""
      session_key = ""
      login_key = ""
      evt_uid = ""
      org_id = ""
      user_agent = ""
      http_method = ""
      path = ""
      op = ""
      api_version = ""
      entity = ""
      query = ""
      report_id = ""
      report_name = ""
      status_text = ""
      failed = false
      status_code = 0
      delegated_name = ""
      delegated_id = ""
      login_url = ""
      record_id = ""
      loc = {}
      if fmt == "elf" {
          et = string(r.EVENT_TYPE) ?? ""
          ts = string(r.TIMESTAMP_DERIVED) ?? ""
          user_name = string(r.USER_NAME) ?? ""
          if user_name == "" { user_name = string(r.USERNAME) ?? "" }
          user_id = string(r.USER_ID_DERIVED) ?? ""
          if user_id == "" { user_id = string(r.USER_ID) ?? "" }
          src_ip = string(r.CLIENT_IP) ?? ""
          if src_ip == "" { src_ip = string(r.SOURCE_IP) ?? "" }
          session_key = string(r.SESSION_KEY) ?? ""
          login_key = string(r.LOGIN_KEY) ?? ""
          evt_uid = string(r.REQUEST_ID) ?? ""
          org_id = string(r.ORGANIZATION_ID) ?? ""
          user_agent = string(r.BROWSER_TYPE) ?? ""
          http_method = string(r.METHOD) ?? ""
          path = string(r.URI) ?? ""
          op = string(r.METHOD_NAME) ?? ""
          api_version = string(r.API_VERSION) ?? ""
          entity = string(r.ENTITY_NAME) ?? ""
          if entity == "" { entity = string(r.ENTITY) ?? "" }
          report_id = string(r.REPORT_ID_DERIVED) ?? ""
          if report_id == "" { report_id = string(r.REPORT_ID) ?? "" }
          delegated_name = string(r.DELEGATED_USER_NAME) ?? ""
          delegated_id = string(r.DELEGATED_USER_ID_DERIVED) ?? ""
          if delegated_id == "" { delegated_id = string(r.DELEGATED_USER_ID) ?? "" }
          login_status = string(r.LOGIN_STATUS) ?? ""
          req_status = string(r.REQUEST_STATUS) ?? ""
          if login_status != "" && login_status != "LOGIN_NO_ERROR" { failed = true; status_text = login_status }
          if includes(["f", "failed", "failure"], downcase(req_status)) { failed = true }
          # SUCCESS is "1"/"0" in the CSV but may arrive typed (0, false) in JSON.
          if includes(["0", "false", "f", "no", "n"], downcase(to_string(r.SUCCESS) ?? "")) { failed = true }
          status_code = to_int(r.STATUS_CODE) ?? 0
          if status_code >= 400 { failed = true }
      } else {
          rtype = ""
          if is_object(r.attributes) { rtype = string(r.attributes.type) ?? "" }
          if rtype == "" {
              # A schema-normalized collector may send every field, absent ones as
              # null or "", so a field signals a type only when it holds a value.
              if (string(r.ReportId) ?? "") != "" { rtype = "ReportEvent" }
              if (string(r.PageUrl) ?? "") != "" { rtype = "LightningUriEvent" }
              if (string(r.Query) ?? "") != "" || (exists(r.QueriedEntities) && exists(r.ApiType)) { rtype = "ApiEvent" }
              if rtype == "" && (exists(r.LoginType) || exists(r.LoginUrl)) { rtype = "LoginEvent" }
              # Streamed (Pub/Sub) deliveries carry no attributes.type: an admin
              # login-as carries a DelegatedUsername (and never outranks a report,
              # page or API event), and a logout is a session record with no
              # operation, query, page or login details.
              if (rtype == "" || rtype == "LoginEvent") && (string(r.DelegatedUsername) ?? "") != "" { rtype = "LoginAsEvent" }
              if rtype == "" && exists(r.SessionKey) && !exists(r.Operation) && !exists(r.ApiType) && !exists(r.Status) { rtype = "LogoutEvent" }
          }
          et = rtype
          ts = string(r.EventDate) ?? ""
          if ts == "" { ts = string(r.CreatedDate) ?? "" }
          user_name = string(r.Username) ?? ""
          user_id = string(r.UserId) ?? ""
          src_ip = string(r.SourceIp) ?? ""
          session_key = string(r.SessionKey) ?? ""
          login_key = string(r.LoginKey) ?? ""
          evt_uid = string(r.EventIdentifier) ?? ""
          if evt_uid == "" { evt_uid = string(r.Id) ?? "" }
          user_agent = string(r.UserAgent) ?? ""
          http_method = string(r.HttpMethod) ?? ""
          path = string(r.PageUrl) ?? ""
          op = string(r.Operation) ?? ""
          api_version = string(r.ApiVersion) ?? ""
          if api_version == "N/A" { api_version = "" }
          entity = string(r.QueriedEntities) ?? ""
          query = string(r.Query) ?? ""
          report_id = string(r.ReportId) ?? ""
          report_name = string(r.Name) ?? ""
          record_id = string(r.RecordId) ?? ""
          login_url = string(r.LoginUrl) ?? ""
          delegated_name = string(r.DelegatedUsername) ?? ""
          status_text = string(r.Status) ?? ""
          if status_text != "" && status_text != "Success" { failed = true }
          city = string(r.City) ?? ""
          if city != "" { loc.city = city }
          country = string(r.CountryIso) ?? ""
          if country != "" { loc.country = country }
          region = string(r.Subdivision) ?? ""
          if region != "" { loc.region = region }
          postal = string(r.PostalCode) ?? ""
          if postal != "" { loc.postal_code = postal }
          if is_float(r.LoginLatitude) { loc.lat = r.LoginLatitude }
          if is_float(r.LoginLongitude) { loc.long = r.LoginLongitude }
      }

      # ---- time ----
      time_ms = 0
      clock, clock_err = parse_timestamp(ts, "%+")
      if clock_err == null {
          time_ms = to_unix_timestamp(clock, unit: "milliseconds")
      } else if fmt == "elf" {
          # EventLogFile TIMESTAMP is GMT, e.g. 20130715233322.670.
          clock2, clock2_err = parse_timestamp(string(r.TIMESTAMP) ?? "", "%Y%m%d%H%M%S%.f")
          if clock2_err == null { time_ms = to_unix_timestamp(clock2, unit: "milliseconds") }
      }

      # ---- principals and endpoint ----
      user = {}
      if user_name != "" { user.name = user_name }
      if user_id != "" { user.uid = user_id }
      if match(user_name, email_re) { user.email_addr = user_name }
      if length(user) == 0 { user = { "name": "unknown" } }
      src_ep = { "hostname": "unknown" }
      if is_ipv4(src_ip) || is_ipv6(src_ip) { src_ep = { "ip": src_ip } }
      if length(loc) > 0 { src_ep.location = loc }
      session = {}
      if session_key != "" { session.uid = session_key }
      if login_key != "" {
          if exists(session.uid) { session.uid_alt = login_key } else { session.uid = login_key }
      }

      # ---- family routing ----
      family = "api"
      if et == "Login" || et == "LoginEvent" || et == "LoginHistory" { family = "login" }
      if et == "LoginAs" || et == "LoginAsEvent" { family = "loginas" }
      if et == "Logout" || et == "LogoutEvent" { family = "logout" }
      if et == "Report" || et == "ReportExport" || et == "ReportEvent" { family = "report" }
      if et == "ApiEvent" && query != "" { family = "query" }

      status_id = 1
      status_str = "Success"
      severity_id = 1
      severity = "Informational"
      if failed { status_id = 2; status_str = "Failure"; severity_id = 2; severity = "Low" }
      if family == "loginas" || et == "ReportExport" || (et == "ReportEvent" && contains(downcase(op), "export")) { severity_id = 3; severity = "Medium" }

      ocsf = {}
      if family == "login" || family == "loginas" || family == "logout" {
          activity_id = 1
          activity_name = "Logon"
          if family == "logout" { activity_id = 2; activity_name = "Logoff" }
          ocsf.class_uid = 3002
          ocsf.class_name = "Authentication"
          ocsf.category_uid = 3
          ocsf.category_name = "Identity & Access Management"
          ocsf.user = user
          if family == "loginas" {
              # An admin logged in AS the user: the user is USER_ID, the admin
              # is the DELEGATED_USER.
              activity_id = 7
              activity_name = "Account Switch"
              ocsf.account_switch_type_id = 2
              ocsf.account_switch_type = "Impersonate"
              admin = {}
              if delegated_name != "" { admin.name = delegated_name }
              if match(delegated_name, email_re) { admin.email_addr = delegated_name }
              if delegated_id != "" { admin.uid = delegated_id }
              if length(admin) > 0 { ocsf.actor = { "user": admin } }
          }
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          ocsf.service = { "name": "Salesforce" }
          ocsf.is_remote = true
          if status_text != "" && failed { ocsf.status_detail = status_text }
          if user_agent != "" { ocsf.http_request = { "user_agent": user_agent } }
          if login_url != "" { ocsf.dst_endpoint = { "hostname": login_url } }
          if length(session) > 0 { ocsf.session = session }
      } else if family == "report" || family == "query" {
          activity_id = 1
          activity_name = "Read"
          if family == "query" { activity_id = 4; activity_name = "Query" }
          ocsf.class_uid = 6005
          ocsf.class_name = "Datastore Activity"
          ocsf.category_uid = 6
          ocsf.category_name = "Application Activity"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          actor = { "user": user }
          if length(session) > 0 { actor.session = session }
          ocsf.actor = actor
          tbl = {}
          if family == "report" {
              if report_id != "" { tbl.uid = report_id }
              if report_name != "" { tbl.name = report_name }
          } else if entity != "" {
              tbl.name = entity
          }
          if length(tbl) == 0 { tbl.name = "unknown" }
          ocsf.table = tbl
          if family == "query" {
              qinfo = { "uid": evt_uid, "query_string": query }
              # Bounded to 4096 characters; the residual spill's truncate rule
              # keeps the full query out of unmapped (raw_data is its one copy).
              if strlen(query) > 4096 {
                  qinfo.query_string = truncate(query, 4096)
                  ocsf.metadata_truncated = length(query)
              }
              ocsf.query_info = qinfo
          }
      } else {
          verb = downcase(op + " " + http_method)
          activity_id = 99
          activity_name = "Other"
          if contains(verb, "get") || contains(verb, "query") || contains(verb, "read") || et == "LightningUriEvent" || et == "URI" || et == "LightningPageView" { activity_id = 2; activity_name = "Read" }
          if contains(verb, "post") || contains(verb, "insert") || contains(verb, "create") { activity_id = 1; activity_name = "Create" }
          if contains(verb, "patch") || contains(verb, "put") || contains(verb, "update") || contains(verb, "upsert") { activity_id = 3; activity_name = "Update" }
          if contains(verb, "delete") { activity_id = 4; activity_name = "Delete" }
          ocsf.class_uid = 6003
          ocsf.class_name = "API Activity"
          ocsf.category_uid = 6
          ocsf.category_name = "Application Activity"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          operation = op
          if operation == "" { operation = et }
          if operation == "" { operation = "unknown" }
          api = { "operation": operation, "service": { "name": "Salesforce" } }
          if api_version != "" { api.version = api_version }
          ocsf.api = api
          actor = { "user": user }
          if length(session) > 0 { actor.session = session }
          ocsf.actor = actor
          req = {}
          if http_method != "" { req.http_method = http_method }
          if path != "" { req.url = { "path": path } }
          if user_agent != "" { req.user_agent = user_agent }
          if length(req) > 0 { ocsf.http_request = req }
          if status_code > 0 { ocsf.http_response = { "code": status_code } }
          res = []
          if entity != "" { res = push(res, { "name": entity, "type": "sObject" }) }
          if record_id != "" { res = push(res, { "uid": record_id, "type": "Record" }) }
          if length(res) > 0 { ocsf.resources = res }
      }

      ocsf.src_endpoint = src_ep
      ocsf.status_id = status_id
      ocsf.status = status_str
      ocsf.severity_id = severity_id
      ocsf.severity = severity
      ocsf.type_uid = to_int(ocsf.class_uid) * 100 + to_int(ocsf.activity_id)
      ocsf.time = time_ms
      msg = et
      if msg == "" { msg = "salesforce_event" }
      ocsf.message = msg
      ocsf.raw_data = raw_log

      if evt_uid == "" { evt_uid = sha2("salesforce_event_monitoring|raw|" + raw_log, variant: "SHA-256") }
      log_name = "Salesforce EventLogFile"
      if fmt == "rtem" { log_name = "Salesforce Real-Time Event Monitoring" }
      md = {
          "version": "1.9.0",
          "uid": evt_uid,
          "log_name": log_name,
          "log_provider": "Salesforce",
          "product": { "name": "Salesforce", "vendor_name": "Salesforce" }
      }
      if et != "" { md.event_code = et }
      if org_id != "" { md.tenant_uid = org_id }
      if exists(ocsf.metadata_truncated) {
          md.is_truncated = true
          md.untruncated_size = ocsf.metadata_truncated
          __discard = del(ocsf.metadata_truncated)
      }
      ocsf.metadata = md
      if fallback != "" { ocsf.unmapped = { "parse_fallback": fallback } }

      . = ocsf
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # Exact value representation is evaluated AFTER branch selection. Numeric strings
  # count as represented by their typed scalar; other transformations are explicit.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The value sets below are strings
  # instead (a read shares the buffer): "," + encode_json(member) per member, and
  # contains(set, "," + encode_json(x)) is exact membership. Every member is a
  # JSON text, inside which a '"' is always escaped, so ',"' only ever starts a
  # member, and a JSON string ends at its first unescaped '"'. The fixed candidate
  # set is a regex literal, compiled once with the program.
  # __mapped holds only JSON types, so to_string equals encode_json for an integer
  # or a boolean and only strings and floats add a second member.
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped_json = encode_json(__mapped)
  __mapped = object!(parse_json!(__mapped_json))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __safe = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __safe_json = encode_json(__safe)
  # Object and array members are encodings: an empty object, an object that
  # opens with a quoted key, or an array. A lookup can ask for one only when some
  # source or existing value is an array, or a string spelling one of those
  # openings, and the regex below finds either in the JSON text (brackets are
  # written as hex escapes because nano's deploy check counts them raw).
  # Otherwise the scalar nodes suffice; a Sysmon GUID, a brace-wrapped string
  # with no quoted key, is no object member. The leaves of flatten(), with arrays
  # flattened too, are every scalar node unless a key holds a literal '.' (in
  # compact JSON only a key is followed by ':').
  # Their encodings, unwrapped from the array, already are the string members.
  __represented = ""
  __nodes = __mapped
  if !match(__safe_json, r'"(?:\x7B\\"|\x7B\x7D"|\x5B)|[:,\x5B]\x5B') && !match(__mapped_json, r'\.(?:[^"\\]|\\.)*":') {
      __leaves = flatten(values(flatten(__mapped)))
      __leaves_json = encode_json(__leaves)
      if match(__leaves_json, r'\x7B') {
          # An object inside an array: walk the leaves, objects whole.
          __nodes = __leaves
      } else {
          __nodes = []
          __members = map_values(__leaves) -> |value| {
              if is_float(value) {
                  encode_json(encode_json(value)) + "," + encode_json(to_string!(value))
              } else {
                  encode_json(encode_json(value))
              }
          }
          __represented = "," + join!(__members, ",") + "," + slice!(__leaves_json, 1, -1)
      }
  }
  __walk = map_values(__nodes, recursive: true) -> |value| {
      __json = encode_json(value)
      if is_string(value) {
          # A string's second member is the string itself, encoded: __json.
          __represented = __represented + ("," + encode_json(__json) + "," + __json)
      } else if is_float(value) {
          __represented = __represented + ("," + encode_json(__json) + "," + encode_json(to_string!(value)))
      } else {
          __represented = __represented + ("," + encode_json(__json))
      }
      value
  }
  __consumed = ""
  # BEGIN parser-specific transformations
  # TIMESTAMP_DERIVED: EventLogFile ISO TIMESTAMP_DERIVED converted to the event clock in milliseconds.
  # EventDate: Real-time event ISO EventDate converted to the event clock in milliseconds.
  # CreatedDate: Record CreatedDate, used only when EventDate is absent.
  # Query: SOQL text is bounded to 4096 characters in query_info.query_string (metadata.is_truncated marks a cut); raw_data keeps the one full copy, so unmapped never repeats it.
  for_each(flatten(__source_kv)) -> |key, value| {
      if match(key, r'(?x)
      \A(?:
        TIMESTAMP_DERIVED
      | EventDate
      | CreatedDate
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%+")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              if ."time" == __expected { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        Query
      )\z') {
          # A bounded copy (the first 4096 characters, as truncate() counts them)
          # consumes its source, so an over-long value is not stored a second time in
          # unmapped: raw_data stays its one lossless copy. An over-bound value counts
          # only when the event says so in metadata.is_truncated and keeps the raw body
          # as raw_data.
          __value = value
          if is_string(__value) {
              __expected = string!(__value)
              __over = strlen(__expected) > 4096
              if __over { __expected = truncate(__expected, 4096) }
              if (!__over || (.metadata.is_truncated == true && .raw_data == __raw_body)) && ."query_info"."query_string" == __expected { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
  }
  # Only source keys read by this parser are eligible for exact-value consumption; the selected branch must emit the value. EventLogFile TIMESTAMP (yyyyMMddHHmmss.SSS) is parsed into time when TIMESTAMP_DERIVED is absent but always spills, because the coverage checker has no portable form for it.
  __candidates = r'(?x)
  \A(?:
    API_VERSION
  | ApiVersion
  | BROWSER_TYPE
  | CLIENT_IP
  | City
  | CountryIso
  | DELEGATED_USER_ID
  | DELEGATED_USER_ID_DERIVED
  | DELEGATED_USER_NAME
  | DelegatedUsername
  | ENTITY
  | ENTITY_NAME
  | EVENT_TYPE
  | EventIdentifier
  | HttpMethod
  | Id
  | LOGIN_KEY
  | LOGIN_STATUS
  | LoginKey
  | LoginLatitude
  | LoginLongitude
  | LoginUrl
  | METHOD
  | METHOD_NAME
  | NAME
  | Name
  | ORGANIZATION_ID
  | Operation
  | PageUrl
  | PostalCode
  | QueriedEntities
  | Query
  | RecordId
  | REPORT_ID
  | REPORT_ID_DERIVED
  | REQUEST_ID
  | ReportId
  | SESSION_KEY
  | SOURCE_IP
  | STATUS_CODE
  | SessionKey
  | SourceIp
  | Status
  | Subdivision
  | URI
  | USERNAME
  | USER_ID
  | USER_ID_DERIVED
  | USER_NAME
  | UserAgent
  | UserId
  | Username
  | attributes\.type
  )\z'
  __preserve = []
  # END parser-specific transformations
  # Redact at every depth, including objects inside arrays, before serialization.
  # Redaction needs a sensitive word in a key or a name/key value, and encode_json
  # never escapes a letter, so text without one of the words needs no walk.
  if match(downcase(__safe_json), r'password|secret|authorization|token') {
      __safe = map_values(__safe, recursive: true) -> |value| {
          if is_object(value) {
              # Header/parameter arrays commonly encode sensitive keys as name/value
              # or Key/Value objects instead of using the secret name as an object key.
              __sensitive_pair = false
              for_each(object!(value)) -> |key, child| {
                  if includes(["name", "key"], downcase(key)) && match(downcase(string(child) ?? ""), r'password|secret|authorization|token') {
                      __sensitive_pair = true
                  }
              }
              for_each(object!(value)) -> |key, _child| {
                  if match(downcase(key), r'password|secret|authorization|token') || (__sensitive_pair && includes(["value", "values"], downcase(key))) {
                      value = set!(value, [key], "<redacted>")
                  }
              }
          }
          value
      }
  }
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__safe.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # Fast path: when no two source keys decode to the same key and no two spilled
  # keys get the same name, each key's decision depends only on its own value, so
  # one filter and one rename build the residual without copying it per key.
  __distinct = true
  if __tilde {
      __distinct = length(map_keys(__flat) -> |key| { replace(replace(key, "~1", "."), "~0", "~") }) == length(__flat)
  }
  __kept = {}
  __names = {}
  if __distinct {
      __kept = filter(__flat) -> |key, value| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          # A key is kept unless it is consumed: by a transformation above, or as a
          # candidate whose value is represented. Redacted leaves always remain
          # visible. Do not spill a copy of the raw body.
          if value == __raw_body {
              false
          } else if value == "<redacted>" {
              true
          } else if contains(__consumed, "," + encode_json(key)) {
              false
          } else if !match(key, __candidates) {
              true
          } else {
              # flatten stops at arrays, so objects inside an array still carry the
              # escaped keys: decode them too, or `a.b` spills as `a~1b` (NAN-3604).
              if __tilde && (is_array(value) || is_object(value)) {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __same = contains(__represented, "," + encode_json(encode_json(value)))
              if !__same && (is_string(value) || is_float(value)) {
                  __same = contains(__represented, "," + encode_json(to_string!(value)))
              }
              # A scalar array is consumed only if every element is represented. Preserve
              # partially represented arrays intact, including their ordering and repeats.
              if !__same && is_array(value) && !is_empty(array!(value)) {
                  __same = true
                  for_each(array!(value)) -> |_index, item| {
                      if __same {
                          if is_object(item) || is_array(item) {
                              __same = false
                          } else if !contains(__represented, "," + encode_json(encode_json(item))) {
                              __same = (is_string(item) || is_float(item)) && contains(__represented, "," + encode_json(to_string!(item)))
                          }
                      }
                  }
              }
              !__same
          }
      }
      __names = map_keys(__kept) -> |key| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          join!(__parts, ".")
      }
  }
  __residual = {}
  if __distinct && length(__names) == length(__kept) {
      __residual = map_values(__names) -> |value| {
          if is_array(value) || is_object(value) {
              if __tilde {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              if __complex { value = encode_json(value) }
          }
          value
      }
  } else {
      # Slow path, in source key order: a decoded key consumed earlier stays
      # consumed, and a name already taken gets the next free _2, _3, ... suffix.
      for_each(__flat) -> |key, value| {
          key = replace(replace(key, "~1", "."), "~0", "~")
          if is_array(value) || is_object(value) {
              value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                  replace(replace(inner, "~1", "."), "~0", "~")
              }, ["v"])
          }
          __same = contains(__represented, "," + encode_json(encode_json(value)))
          if !__same && (is_string(value) || is_float(value)) {
              __same = contains(__represented, "," + encode_json(to_string!(value)))
          }
          if !__same && is_array(value) && !is_empty(array!(value)) {
              __same = true
              for_each(array!(value)) -> |_index, item| {
                  if __same {
                      if is_object(item) || is_array(item) {
                          __same = false
                      } else if !contains(__represented, "," + encode_json(encode_json(item))) {
                          __same = (is_string(item) || is_float(item)) && contains(__represented, "," + encode_json(to_string!(item)))
                      }
                  }
              }
          }
          __token = "," + encode_json(key)
          if __same && match(key, __candidates) { __consumed = __consumed + ("," + encode_json(key)) }
          if (!contains(__consumed, __token) || value == "<redacted>") && value != __raw_body {
              __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
              __base = join!(__parts, ".")
              __key = __base
              __suffix = 2
              if includes(keys(__residual), __key) {
                  for_each(__flat) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __key) {
                          __key = __base + "_" + to_string(__suffix)
                          __suffix = __suffix + 1
                      }
                  }
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              __spill = if __complex { encode_json(value) } else { value }
              __residual = set!(__residual, [__key], __spill)
          }
      }
  }
  # Keep existing derived evidence, but remove null placeholders and mapped copies.
  # Source-derived aliases are replaced by canonical dotted source paths above.
  # Existing aggregates may contain sensitive descendants; the canonical source
  # spill above is the authoritative representation of containers. The cheap
  # conditions run first; the source value set is built on first use.
  __original_values = null
  for_each(flatten(__existing)) -> |key, value| {
      if !is_null(value) && value != "" && !is_array(value) && !is_object(value) && value != __raw_body && !match(downcase(key), r'password|secret|authorization|token') {
          # Members for the value itself and for to_string(value), as above.
          __json = encode_json(value)
          __as_json = "," + encode_json(__json)
          __as_string = __as_json
          if is_string(value) { __as_string = "," + __json } else if is_float(value) { __as_string = "," + encode_json(to_string!(value)) }
          if __original_values == null {
              # __source_kv may hold non-JSON types (a timestamp), so only an
              # integer or a boolean skips its to_string member here.
              __original_values = join!(map_values(values(flatten(__source_kv))) -> |source_value| {
                  __source_json = encode_json(source_value)
                  __tokens = "," + encode_json(__source_json)
                  if is_string(source_value) {
                      __tokens = __tokens + "," + __source_json
                  } else if !is_object(source_value) && !is_array(source_value) && !is_integer(source_value) && !is_boolean(source_value) {
                      __tokens = __tokens + "," + encode_json(to_string(source_value) ?? "")
                  }
                  __tokens
              }, "")
          }
          __source_set = string!(__original_values)
          __keep = !contains(__source_set, __as_json) && !contains(__source_set, __as_string)
          __keep = __keep && !contains(__represented, __as_json) && !contains(__represented, __as_string)
          # Only text opening an object or an array (after JSON whitespace)
          # decodes to a container.
          if __keep && is_string(value) && match(string!(value), r'^[ \t\n\r]*[\x5B\x7B]') {
              __decoded, __decode_err = parse_json(string!(value))
              __keep = !(__decode_err == null && (is_object(__decoded) || is_array(__decoded)))
          }
          if __keep {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, with recursive
  # redaction. These entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__safe.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

