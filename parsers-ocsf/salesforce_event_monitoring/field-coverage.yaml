source: mixed
transforms:
- source: TIMESTAMP_DERIVED
  kind: epoch_ms
  target: time
  format: '%+'
  reason: EventLogFile ISO TIMESTAMP_DERIVED converted to the event clock in milliseconds.
- source: EventDate
  kind: epoch_ms
  target: time
  format: '%+'
  reason: Real-time event ISO EventDate converted to the event clock in milliseconds.
- source: CreatedDate
  kind: epoch_ms
  target: time
  format: '%+'
  reason: Record CreatedDate, used only when EventDate is absent.
- source: Query
  kind: truncate
  target: query_info.query_string
  length: 4096
  reason: SOQL text is bounded to 4096 characters in query_info.query_string (metadata.is_truncated
    marks a cut); raw_data keeps the one full copy, so unmapped never repeats it.
consumed_candidates:
- API_VERSION
- ApiVersion
- BROWSER_TYPE
- CLIENT_IP
- City
- CountryIso
- DELEGATED_USER_ID
- DELEGATED_USER_ID_DERIVED
- DELEGATED_USER_NAME
- DelegatedUsername
- ENTITY
- ENTITY_NAME
- EVENT_TYPE
- EventIdentifier
- HttpMethod
- Id
- LOGIN_KEY
- LOGIN_STATUS
- LoginKey
- LoginLatitude
- LoginLongitude
- LoginUrl
- METHOD
- METHOD_NAME
- NAME
- Name
- ORGANIZATION_ID
- Operation
- PageUrl
- PostalCode
- QueriedEntities
- Query
- RecordId
- REPORT_ID
- REPORT_ID_DERIVED
- REQUEST_ID
- ReportId
- SESSION_KEY
- SOURCE_IP
- STATUS_CODE
- SessionKey
- SourceIp
- Status
- Subdivision
- URI
- USERNAME
- USER_ID
- USER_ID_DERIVED
- USER_NAME
- UserAgent
- UserId
- Username
- attributes.type
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. EventLogFile TIMESTAMP
  (yyyyMMddHHmmss.SSS) is parsed into time when TIMESTAMP_DERIVED is absent but
  always spills, because the coverage checker has no portable form for it.
