source: mixed
transforms:
- source: TIMESTAMP_DERIVED
  kind: epoch_ms
  target: time
  format: '%+'
  reason: EventLogFile ISO TIMESTAMP_DERIVED converted to the event clock in milliseconds.
- source: EventDate
  kind: epoch_ms
  target: time
  format: '%+'
  reason: Real-time event ISO EventDate converted to the event clock in milliseconds.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  API_VERSION:
  - api.version
  BROWSER_TYPE:
  - http_request.user_agent
  CLIENT_IP:
  - src_endpoint.ip
  City:
  - src_endpoint.location.city
  CountryIso:
  - src_endpoint.location.country
  DELEGATED_USER_ID_DERIVED:
  - actor.user.uid
  DELEGATED_USER_NAME:
  - actor.user.email_addr
  - actor.user.name
  DelegatedUsername:
  - actor.user.email_addr
  - actor.user.name
  ENTITY_NAME:
  - resources.name
  EVENT_TYPE:
  - api.operation
  - message
  - metadata.event_code
  EventIdentifier:
  - metadata.uid
  - query_info.uid
  LOGIN_KEY:
  - actor.session.uid_alt
  - session.uid
  - session.uid_alt
  LOGIN_STATUS:
  - status_detail
  LoginKey:
  - actor.session.uid_alt
  - session.uid
  - session.uid_alt
  LoginLatitude:
  - src_endpoint.location.lat
  LoginLongitude:
  - src_endpoint.location.long
  LoginUrl:
  - dst_endpoint.hostname
  METHOD:
  - http_request.http_method
  METHOD_NAME:
  - api.operation
  Name:
  - table.name
  ORGANIZATION_ID:
  - metadata.tenant_uid
  Operation:
  - api.operation
  PageUrl:
  - http_request.url.path
  PostalCode:
  - src_endpoint.location.postal_code
  QueriedEntities:
  - resources.name
  - table.name
  Query:
  - query_info.query_string
  RecordId:
  - resources.uid
  REPORT_ID:
  - table.uid
  REPORT_ID_DERIVED:
  - table.uid
  REQUEST_ID:
  - metadata.uid
  ReportId:
  - table.uid
  SESSION_KEY:
  - actor.session.uid
  - session.uid
  STATUS_CODE:
  - http_response.code
  SessionKey:
  - actor.session.uid
  - session.uid
  SourceIp:
  - src_endpoint.ip
  Status:
  - status_detail
  Subdivision:
  - src_endpoint.location.region
  URI:
  - http_request.url.path
  USER_ID_DERIVED:
  - actor.user.uid
  - user.uid
  USER_NAME:
  - user.email_addr
  - user.name
  UserId:
  - actor.user.uid
  - user.uid
  Username:
  - actor.user.email_addr
  - actor.user.name
  - user.email_addr
  - user.name
  attributes.type:
  - message
  - metadata.event_code
