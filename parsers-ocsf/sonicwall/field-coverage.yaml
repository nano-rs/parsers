source: text
probe:
  mode: suffix
  require: '='
  text: ' ResidualProbe="nan2421-text-unknown" password="nan2421-secret"'
  source: ResidualProbe
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  Category:
  - http_request.url.categories
  arg:
  - http_request.url.path
  attack_name:
  - finding_info.analytic.name
  - finding_info.title
  c:
  - metadata.log_name
  dstname:
  - dst_endpoint.hostname
  - http_request.url.hostname
  fw:
  - device.ip
  - src_endpoint.ip
  m:
  - metadata.event_code
  msg:
  - status_detail
  rcvd:
  - traffic.bytes_in
  rpkt:
  - traffic.packets_in
  rule:
  - firewall_rule.name
  - firewall_rule.uid
  sent:
  - traffic.bytes_out
  sid:
  - finding_info.analytic.uid
  - finding_info.uid
  sn:
  - device.uid
  spkt:
  - traffic.packets_out
  usr:
  - actor.user.name
  - observables.value
  - user.name
