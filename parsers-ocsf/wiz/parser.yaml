name: wiz_ocsf
display_name: Wiz Issues, Detections and Findings (OCSF)
version: "1.1.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses Wiz records from the GraphQL API and from Wiz automation webhooks into
  complete OCSF 1.9.0 findings with the security_control profile (plus cloud
  when the cloud platform is known, and host when an actor principal is set).
  The class follows the record type: a vulnerability finding (vulnerableAsset,
  CVE name) is a "Vulnerability Finding" (2002) with the CVE, CVSS score, EPSS,
  affected package and fixed version; a cloud configuration finding (rule +
  result) is a "Compliance Finding" (2003) with the rule short id as control,
  PASS / FAIL as compliance status and the framework names as standards; an
  Issue (issuesV2 node or Issues webhook), a Detection (Detections webhook) or
  a Threat (Wiz Defend threat with ruleMatch / triggeringEvents) is a
  "Detection Finding" (2004) carrying the control or rule as the analytic,
  MITRE tactics and techniques as attacks, the primary actor as actor.user (or
  a network address as the evidence source IP) and the triggering events'
  process tree and source IP as evidences. Severity (INFORMATIONAL / LOW /
  MEDIUM / HIGH / CRITICAL) maps to severity_id 1-5 (for a vulnerability the
  higher of vendorSeverity and CVSSSeverity, since vendorSeverity is often
  NONE); a High / Critical finding alerts until it is Resolved or Suppressed; status OPEN is New,
  IN_PROGRESS In Progress, REJECTED / IGNORED Suppressed and RESOLVED
  Resolved (activity Close); a webhook trigger type of Updated is an Update.
  The affected cloud resource (entitySnapshot, resource, primaryResource or
  vulnerableAsset) becomes resources[] with its tags, and its subscription
  becomes cloud.account. A Defend or webhook envelope carries one record;
  API pages must be split one node per event upstream. Anything else falls
  back to Base Event with the raw record kept.
match_values:
  - wiz
category: cloud
vendor: "Wiz"
product: "Wiz"
parser_vrl: |
  # NAN source timezone. Generated by scripts/residual_spill.py; edit scripts/residual/source_tz.vrl.
  # The log source's timezone setting arrives as .nano.source_timezone (an IANA
  # name such as "America/New_York", or any fixed offset such as "+05:30"), set
  # by nano at ingest. .nano is nano's input, never part of the log: it is
  # removed whole before anything else, whatever its shape.
  # For a clock that carries no offset a parser parses it AS UTC and sets
  # __lc_pending; the generated local-clock block that follows the parse
  # (local_clock.vrl) turns it into real UTC with this setting, and the spill
  # records the zone used as unmapped.nano_time_assumed_tz (the name, the offset
  # as +HH:MM, or "UTC" when the setting is absent, invalid or "local").
  __src_nano = del(.nano)
  __src_tz_in = ""
  if is_object(__src_nano) { __src_tz_in = strip_whitespace(to_string(object!(__src_nano).source_timezone) ?? "") }
  __src_tz = "UTC"
  __src_shift_ms = 0
  __src_tz_label = "UTC"
  __time_assumed = false
  __time_inline = false
  __lc_pending = false
  __src_off = parse_regex(__src_tz_in, r'^(?P<sign>[+-])(?P<h>\d{2}):?(?P<m>\d{2})$') ?? {}
  if !is_empty(__src_off) {
      __src_h = to_int(__src_off.h) ?? 99
      __src_m = to_int(__src_off.m) ?? 99
      if __src_h <= 14 && __src_m <= 59 {
          __src_shift_ms = (__src_h * 3600 + __src_m * 60) * 1000
          if __src_off.sign == "-" { __src_shift_ms = 0 - __src_shift_ms }
          if __src_shift_ms != 0 { __src_tz_label = string!(__src_off.sign) + string!(__src_off.h) + ":" + string!(__src_off.m) }
      }
  } else if __src_tz_in != "" && downcase(__src_tz_in) != "local" {
      # "local" (the Vector host's zone) would make the time depend on the host.
      __src_probe, __src_probe_err = parse_timestamp("2000-01-01 00:00:00", "%Y-%m-%d %H:%M:%S", timezone: __src_tz_in)
      if __src_probe_err == null { __src_tz = __src_tz_in; __src_tz_label = __src_tz_in }
  }
  # END NAN source timezone
  # Wiz issues, detections, threats, vulnerability findings and cloud
  # configuration findings -> OCSF 1.9.0 Detection (2004) / Vulnerability
  # (2002) / Compliance (2003) Finding, or Base Event (0)
  raw_log = to_string(.message) ?? ""
  __raw_body = raw_log
  __source_kv = {}
  ip_re = r'^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$|^[0-9A-Fa-f:]{3,}$'

  parsed, err = parse_json(raw_log)
  __source_kv = object(parsed) ?? {}
  e = object(parsed) ?? {}
  trig = object(e.trigger) ?? {}
  trig_source = upcase(to_string(trig.source) ?? "")

  # ---- which Wiz record ----
  shape = "unknown"
  if is_object(e.vulnerableAsset) || (e.CVEDescription != null && e.name != null) {
      shape = "vulnerability"
  } else if is_object(e.rule) && e.result != null {
      shape = "configuration"
  } else if is_object(e.issue) && (is_object(e.control) || trig_source == "ISSUES") {
      shape = "issue_webhook"
  } else if trig_source == "DETECTIONS" || e.tdrId != null {
      shape = "detection"
  } else if is_object(e.entitySnapshot) && (is_array(e.sourceRules) || is_object(e.sourceRule)) {
      shape = "issue"
  } else if is_object(e.ruleMatch) || is_object(e.triggeringEvents) || is_object(e.primaryActor) {
      shape = "threat"
  }

  rec_id = to_string(e.id) ?? ""
  if shape == "issue_webhook" { rec_id = to_string(get(e, ["issue", "id"]) ?? "") ?? "" }

  if err != null || !is_object(parsed) || shape == "unknown" || rec_id == "" {
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 99,
          "activity_name": "Other",
          "type_uid": 99,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": 0,
          "message": "Unrecognized Wiz record",
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": sha2("wiz|raw|" + raw_log, variant: "SHA-256"),
              "log_level": "error",
              "log_name": "wiz",
              "product": { "name": "Wiz", "vendor_name": "Wiz" }
          }
      }
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      . = set!(., ["unmapped", "parse_fallback"], "unparsable input")
  } else {
      class_uid = 2004
      class_name = "Detection Finding"
      if shape == "vulnerability" { class_uid = 2002; class_name = "Vulnerability Finding" }
      if shape == "configuration" { class_uid = 2003; class_name = "Compliance Finding" }

      uid = rec_id
      title = ""
      desc = ""
      sev_raw = upcase(to_string(e.severity) ?? "")
      status_raw = upcase(to_string(e.status) ?? "")
      created_str = to_string(e.createdAt) ?? ""
      updated_str = to_string(e.updatedAt) ?? ""
      first_str = ""
      last_str = ""
      src_url = ""
      types = []
      analytic = {}
      data_sources = []
      rsrc = {}
      acct_uid = ""
      acct_name = ""
      provider = ""
      region = ""
      actor_src = {}
      tev = []
      remediation_text = ""
      log_name = "issues"
      attacks = []
      feature = ""

      if shape == "issue" {
          rules = array(e.sourceRules) ?? []
          if is_object(e.sourceRule) { rules = [e.sourceRule] }
          r0 = object(get(rules, [0]) ?? {}) ?? {}
          title = to_string(r0.name) ?? ""
          desc = to_string(r0.description) ?? ""
          rid = to_string(r0.id) ?? ""
          if rid != "" || title != "" {
              analytic = { "uid": rid, "name": title, "type_id": 1, "type": "Rule" }
              if rid == "" { del(analytic.uid) }
              if title == "" { del(analytic.name) }
              rcat = to_string(get(r0, ["__typename"]) ?? "") ?? ""
              if rcat != "" { analytic.category = rcat }
          }
          rst = to_string(r0.sourceType) ?? ""
          if rst != "" { data_sources = [rst] }
          remediation_text = to_string(r0.resolutionRecommendation) ?? ""
          itype = to_string(e.type) ?? ""
          if itype != "" { types = [itype] }
          for_each(array(r0.securitySubCategories) ?? []) -> |_i, sc| {
              fw = to_string(get(sc, ["category", "framework", "name"]) ?? "") ?? ""
              if contains(downcase(fw), "mitre") {
                  tname = to_string(get(sc, ["category", "name"]) ?? "") ?? ""
                  qname = to_string(get(sc, ["title"]) ?? "") ?? ""
                  atk = {}
                  if tname != "" { atk.tactic = { "name": tname } }
                  if qname != "" { atk.technique = { "name": qname } }
                  if length(atk) > 0 { attacks = push(attacks, atk) }
              }
          }
          rsrc = object(e.entitySnapshot) ?? {}
          provider = to_string(rsrc.cloudPlatform) ?? ""
          acct_uid = to_string(rsrc.subscriptionExternalId) ?? ""
          acct_name = to_string(rsrc.subscriptionName) ?? ""
          region = to_string(rsrc.region) ?? ""
          if status_raw == "RESOLVED" { last_str = to_string(e.resolvedAt) ?? "" }
      } else if shape == "issue_webhook" {
          iss = object(e.issue) ?? {}
          ctl = object(e.control) ?? {}
          title = to_string(ctl.name) ?? ""
          desc = to_string(ctl.description) ?? ""
          sev_raw = upcase(to_string(iss.severity) ?? "")
          if sev_raw == "" { sev_raw = upcase(to_string(ctl.severity) ?? "") }
          status_raw = upcase(to_string(iss.status) ?? "")
          created_str = to_string(iss.created) ?? ""
          src_url = to_string(iss.link) ?? ""
          cid = to_string(ctl.id) ?? ""
          if cid != "" || title != "" {
              analytic = { "type_id": 1, "type": "Rule" }
              if cid != "" { analytic.uid = cid }
              if title != "" { analytic.name = title }
          }
          types = ["Issue"]
          remediation_text = to_string(ctl.resolutionRecommendationPlainText) ?? ""
          if remediation_text == "" { remediation_text = to_string(ctl.resolutionRecommendation) ?? "" }
          rsrc = object(e.resource) ?? {}
          provider = to_string(rsrc.cloudPlatform) ?? ""
          acct_uid = to_string(rsrc.subscriptionId) ?? ""
          acct_name = to_string(rsrc.subscriptionName) ?? ""
          region = to_string(rsrc.region) ?? ""
          feature = to_string(trig.ruleName) ?? ""
          log_name = "issues webhook"
      } else if shape == "detection" {
          title = to_string(e.title) ?? ""
          desc = to_string(e.description) ?? ""
          src_url = to_string(e.threatURL) ?? ""
          if src_url == "" { src_url = to_string(e.detectionUrl) ?? "" }
          tdr = to_string(e.tdrId) ?? ""
          analytic = { "type_id": 1, "type": "Rule" }
          if tdr != "" { analytic.uid = tdr }
          if title != "" { analytic.name = title }
          tsrc = to_string(e.tdrSource) ?? ""
          if tsrc != "" { data_sources = [tsrc] }
          types = ["Detection"]
          tf = object(e.timeframe) ?? {}
          first_str = to_string(tf.start) ?? ""
          last_str = to_string(tf.end) ?? ""
          tactics = array(e.mitreTactics) ?? []
          techniques = array(e.mitreTechniques) ?? []
          tactic0 = to_string(get(tactics, [0]) ?? "") ?? ""
          for_each(techniques) -> |_i, t| {
              ts = to_string(t) ?? ""
              if ts != "" {
                  atk = {}
                  if contains(ts, ".") {
                      atk.sub_technique = { "uid": ts }
                      atk.technique = { "uid": to_string(get(split(ts, "."), [0]) ?? ts) ?? ts }
                  } else {
                      atk.technique = { "uid": ts }
                  }
                  if length(tactics) == 1 && tactic0 != "" { atk.tactic = { "uid": tactic0 } }
                  attacks = push(attacks, atk)
              }
          }
          if length(techniques) == 0 || length(tactics) > 1 {
              for_each(tactics) -> |_i, t| {
                  ts = to_string(t) ?? ""
                  if ts != "" { attacks = push(attacks, { "tactic": { "uid": ts } }) }
              }
          }
          rsrc = object(e.primaryResource) ?? {}
          ca = object(rsrc.cloudAccount) ?? {}
          provider = to_string(ca.cloudPlatform) ?? ""
          acct_uid = to_string(ca.externalId) ?? ""
          acct_name = to_string(ca.name) ?? ""
          region = to_string(rsrc.region) ?? ""
          if provider == "" {
              co = object(get(array(e.cloudOrganizations) ?? [], [0]) ?? {}) ?? {}
              provider = to_string(co.cloudProvider) ?? ""
          }
          actor_src = object(e.primaryActor) ?? {}
          if is_object(e.triggeringEvent) { tev = [e.triggeringEvent] }
          if is_array(e.triggeringEvents) { tev = array(e.triggeringEvents) ?? [] }
          feature = to_string(trig.ruleName) ?? ""
          log_name = "detections webhook"
      } else if shape == "threat" {
          rule = object(get(e, ["ruleMatch", "rule"]) ?? {}) ?? {}
          title = to_string(rule.name) ?? ""
          desc = to_string(e.description) ?? ""
          if title == "" { title = desc }
          rid = to_string(rule.id) ?? ""
          analytic = { "type_id": 1, "type": "Rule" }
          if rid != "" { analytic.uid = rid }
          if title != "" { analytic.name = title }
          for_each(array(e.origins) ?? []) -> |_i, o| {
              os = to_string(o) ?? ""
              if os != "" { data_sources = push(data_sources, os) }
          }
          ttype = to_string(e.type) ?? ""
          if ttype != "" { types = [ttype] }
          rsrc = object(e.primaryResource) ?? {}
          ca = object(get(array(e.cloudAccounts) ?? [], [0]) ?? {}) ?? {}
          provider = to_string(ca.cloudProvider) ?? ""
          acct_uid = to_string(ca.externalId) ?? ""
          acct_name = to_string(ca.name) ?? ""
          region = to_string(rsrc.region) ?? ""
          actor_src = object(e.primaryActor) ?? {}
          tev = array(get(e, ["triggeringEvents", "nodes"]) ?? []) ?? []
          log_name = "threats"
      } else if shape == "vulnerability" {
          title = to_string(e.name) ?? ""
          desc = to_string(e.description) ?? ""
          # Take the higher of the vendor and CVSS ratings: vendorSeverity is
          # often NONE / UNKNOWN when the package vendor assigned no rating.
          sev_raw = upcase(to_string(e.vendorSeverity) ?? "")
          cvss_sev = upcase(to_string(e.CVSSSeverity) ?? "")
          sev_rank = { "INFORMATIONAL": 1, "INFO": 1, "NONE": 0, "LOW": 2, "MEDIUM": 3, "HIGH": 4, "CRITICAL": 5 }
          vr = to_int(get(sev_rank, [sev_raw]) ?? 0) ?? 0
          cr = to_int(get(sev_rank, [cvss_sev]) ?? 0) ?? 0
          if cr > vr { sev_raw = cvss_sev }
          first_str = to_string(e.firstDetectedAt) ?? ""
          last_str = to_string(e.lastDetectedAt) ?? ""
          src_url = to_string(e.portalUrl) ?? ""
          ds = to_string(e.dataSourceName) ?? ""
          if ds != "" { data_sources = [ds] }
          types = ["Vulnerability"]
          remediation_text = to_string(e.remediation) ?? ""
          rsrc = object(e.vulnerableAsset) ?? {}
          provider = to_string(rsrc.cloudPlatform) ?? ""
          acct_uid = to_string(rsrc.subscriptionExternalId) ?? ""
          acct_name = to_string(rsrc.subscriptionName) ?? ""
          region = to_string(rsrc.region) ?? ""
          log_name = "vulnerability findings"
      } else {
          rule = object(e.rule) ?? {}
          title = to_string(rule.name) ?? ""
          desc = to_string(rule.description) ?? ""
          rid = to_string(rule.id) ?? ""
          analytic = { "type_id": 1, "type": "Rule" }
          if rid != "" { analytic.uid = rid }
          if title != "" { analytic.name = title }
          first_str = to_string(e.firstSeenAt) ?? ""
          created_str = to_string(e.analyzedAt) ?? ""
          types = ["Cloud Configuration"]
          remediation_text = to_string(e.remediation) ?? ""
          if remediation_text == "" { remediation_text = to_string(rule.remediationInstructions) ?? "" }
          rsrc = object(e.resource) ?? {}
          sub = object(rsrc.subscription) ?? {}
          provider = to_string(sub.cloudProvider) ?? ""
          acct_uid = to_string(sub.externalId) ?? ""
          acct_name = to_string(sub.name) ?? ""
          region = to_string(rsrc.region) ?? ""
          log_name = "cloud configuration findings"
      }

      # ---- times ----
      created_ms = 0
      if created_str != "" {
          t, terr = parse_timestamp(created_str, "%+", timezone: "UTC")
          if terr == null { created_ms = to_unix_timestamp(t, unit: "milliseconds") }
      }
      updated_ms = 0
      if updated_str != "" {
          t, terr = parse_timestamp(updated_str, "%+", timezone: "UTC")
          if terr == null { updated_ms = to_unix_timestamp(t, unit: "milliseconds") }
      }
      first_ms = 0
      if first_str != "" {
          t, terr = parse_timestamp(first_str, "%+", timezone: "UTC")
          if terr == null { first_ms = to_unix_timestamp(t, unit: "milliseconds") }
      }
      last_ms = 0
      if last_str != "" {
          t, terr = parse_timestamp(last_str, "%+", timezone: "UTC")
          if terr == null { last_ms = to_unix_timestamp(t, unit: "milliseconds") }
      }
      time_ms = updated_ms
      if last_ms > time_ms { time_ms = last_ms }
      if time_ms == 0 { time_ms = created_ms }
      if time_ms == 0 { time_ms = first_ms }

      # ---- severity ----
      severity_id = 0
      severity = "Unknown"
      if sev_raw == "INFORMATIONAL" || sev_raw == "INFO" || sev_raw == "NONE" { severity_id = 1; severity = "Informational" }
      if sev_raw == "LOW" { severity_id = 2; severity = "Low" }
      if sev_raw == "MEDIUM" { severity_id = 3; severity = "Medium" }
      if sev_raw == "HIGH" { severity_id = 4; severity = "High" }
      if sev_raw == "CRITICAL" { severity_id = 5; severity = "Critical" }

      # ---- lifecycle ----
      status_id = 0
      status_str = "Unknown"
      if status_raw == "OPEN" { status_id = 1; status_str = "New" }
      if status_raw == "IN_PROGRESS" { status_id = 2; status_str = "In Progress" }
      if status_raw == "REJECTED" || status_raw == "IGNORED" { status_id = 3; status_str = "Suppressed" }
      if status_raw == "RESOLVED" || status_raw == "FIXED" { status_id = 4; status_str = "Resolved" }
      activity_id = 1
      activity_name = "Create"
      ttype = upcase(to_string(trig.type) ?? "")
      if ttype == "UPDATED" || ttype == "REOPENED" || (ttype == "" && updated_ms > created_ms && created_ms > 0) || status_id == 2 { activity_id = 2; activity_name = "Update" }
      if status_id == 4 || status_id == 3 || ttype == "RESOLVED" { activity_id = 3; activity_name = "Close" }

      if title == "" { title = uid }
      finding_info = { "uid": uid, "title": title }
      if desc != "" { finding_info.desc = desc }
      if length(types) > 0 { finding_info.types = types }
      if created_ms > 0 { finding_info.created_time = created_ms }
      if updated_ms > 0 { finding_info.modified_time = updated_ms }
      if first_ms > 0 { finding_info.first_seen_time = first_ms }
      if last_ms > 0 { finding_info.last_seen_time = last_ms }
      if src_url != "" { finding_info.src_url = src_url }
      if length(analytic) > 0 { finding_info.analytic = analytic }
      if length(data_sources) > 0 { finding_info.data_sources = data_sources }
      if length(attacks) > 0 { finding_info.attacks = attacks }
      tid = to_string(e.threatId) ?? ""
      if tid != "" { finding_info.uid_alt = tid }

      # ---- the affected cloud resource ----
      res = {}
      rid2 = to_string(rsrc.id) ?? ""
      if rid2 != "" { res.uid = rid2 }
      rname = to_string(rsrc.name) ?? ""
      if rname != "" { res.name = rname }
      rtype = to_string(rsrc.type) ?? ""
      if rtype != "" { res.type = rtype }
      ralt = to_string(rsrc.providerUniqueId) ?? ""
      if ralt == "" { ralt = to_string(rsrc.providerId) ?? "" }
      if ralt == "" { ralt = to_string(rsrc.externalId) ?? "" }
      if ralt != "" { res.uid_alt = ralt }
      if region != "" { res.region = region }
      if provider != "" { res.provider = provider }
      rns = to_string(rsrc.kubernetesNamespaceName) ?? ""
      if rns != "" { res.namespace = rns }
      rtags = []
      if is_object(rsrc.tags) {
          for_each(object(rsrc.tags) ?? {}) -> |k, v| { rtags = push(rtags, { "name": k, "value": to_string(v) ?? "" }) }
      } else {
          for_each(array(rsrc.tags) ?? []) -> |_i, tg| {
              tk = to_string(get(tg, ["key"]) ?? "") ?? ""
              if tk != "" { rtags = push(rtags, { "name": tk, "value": to_string(get(tg, ["value"]) ?? "") ?? "" }) }
          }
      }
      if length(rtags) > 0 { res.tags = rtags }
      rips = array(rsrc.ipAddresses) ?? []
      rip = to_string(get(rips, [0]) ?? "") ?? ""
      if match(rip, ip_re) { res.ip = rip }
      if length(res) > 0 && !exists(res.uid) && !exists(res.name) {
          if ralt != "" { res.uid = ralt } else { res.uid = uid }
      }

      cloud = {}
      if provider != "" {
          cloud.provider = provider
          if acct_uid != "" { cloud.account = { "uid": acct_uid } }
          if acct_name != "" {
              if acct_uid != "" { cloud.account.name = acct_name } else { cloud.account = { "name": acct_name } }
          }
          if region != "" { cloud.region = region }
      }

      # ---- the actor: a principal, or a network address ----
      actor = {}
      actor_ip = ""
      atype = upcase(to_string(actor_src.type) ?? "")
      aname = to_string(actor_src.name) ?? ""
      if atype == "NETWORK_ADDRESS" {
          actor_ip = aname
      } else if aname != "" && atype != "UNKNOWN" {
          au = { "name": aname }
          aid = to_string(actor_src.id) ?? ""
          if aid != "" { au.uid = aid }
          amail = to_string(actor_src.email) ?? ""
          if amail != "" { au.email_addr = amail }
          # actor.user.type is the promoted column, so it always carries a caption.
          if atype == "USER_ACCOUNT" {
              au.type_id = 1
              au.type = "User"
          } else if atype == "SERVICE_ACCOUNT" {
              au.type_id = 3
              au.type = "System"
          } else if atype != "" {
              au.type_id = 99
              au.type = to_string(actor_src.nativeType) ?? atype
              if au.type == "" { au.type = atype }
          }
          actor.user = au
      }

      # ---- triggering events: source IP, process ----
      evidences = []
      for_each(tev) -> |_i, ev| {
          evo = {}
          eip = to_string(get(ev, ["actorIP"]) ?? "") ?? ""
          if eip == "" { eip = actor_ip }
          if match(eip, ip_re) {
              sep = { "ip": eip }
              meta = object(get(ev, ["actorIPMeta"]) ?? {}) ?? {}
              ccountry = to_string(meta.country) ?? ""
              if ccountry != "" { sep.location = { "country": ccountry } }
              asn = to_int(meta.autonomousSystemNumber) ?? 0
              if asn > 0 {
                  sep.autonomous_system = { "number": asn }
                  asorg = to_string(meta.autonomousSystemOrganization) ?? ""
                  if asorg != "" { sep.autonomous_system.name = asorg }
              }
              evo.src_endpoint = sep
          }
          pt = object(get(array(get(ev, ["runtimeDetails", "processTree"]) ?? []) ?? [], [0]) ?? {}) ?? {}
