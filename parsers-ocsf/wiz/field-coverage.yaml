source: json
transforms:
- source: createdAt
  kind: epoch_ms
  target: finding_info.created_time
  reason: Successful ISO timestamp conversion to the emitted millisecond clock.
- source: analyzedAt
  kind: epoch_ms
  target: finding_info.created_time
  reason: Successful ISO timestamp conversion to the emitted millisecond clock.
- source: issue.created
  kind: epoch_ms
  target: finding_info.created_time
  reason: Successful ISO timestamp conversion to the emitted millisecond clock.
- source: updatedAt
  kind: epoch_ms
  target: finding_info.modified_time
  reason: Successful ISO timestamp conversion to the emitted millisecond clock.
- source: firstDetectedAt
  kind: epoch_ms
  target: finding_info.first_seen_time
  reason: Successful ISO timestamp conversion to the emitted millisecond clock.
- source: firstSeenAt
  kind: epoch_ms
  target: finding_info.first_seen_time
  reason: Successful ISO timestamp conversion to the emitted millisecond clock.
- source: timeframe.start
  kind: epoch_ms
  target: finding_info.first_seen_time
  reason: Successful ISO timestamp conversion to the emitted millisecond clock.
- source: lastDetectedAt
  kind: epoch_ms
  target: finding_info.last_seen_time
  reason: Successful ISO timestamp conversion to the emitted millisecond clock.
- source: timeframe.end
  kind: epoch_ms
  target: finding_info.last_seen_time
  reason: Successful ISO timestamp conversion to the emitted millisecond clock.
- source: resolvedAt
  kind: epoch_ms
  target: finding_info.last_seen_time
  reason: A resolved issue's resolution time is its last-seen time; consume only when emitted.
- source: severity
  kind: enum
  target: severity_id
  values: &id001
    informational: 1
    info: 1
    none: 1
    low: 2
    medium: 3
    high: 4
    critical: 5
  reason: The Wiz severity normalized to the OCSF severity; consume only when the expected ID is emitted.
- source: issue.severity
  kind: enum
  target: severity_id
  values: *id001
  reason: The webhook issue severity normalized to the OCSF severity; consume only when the expected ID
    is emitted.
- source: status
  kind: enum
  target: status_id
  values: &id002
    open: 1
    in_progress: 2
    rejected: 3
    ignored: 3
    resolved: 4
    fixed: 4
  reason: The Wiz status normalized to the OCSF finding status; consume only when the expected ID is emitted.
- source: issue.status
  kind: enum
  target: status_id
  values: *id002
  reason: The webhook issue status normalized to the OCSF finding status; consume only when the expected
    ID is emitted.
- source: trigger.type
  kind: enum
  target: activity_id
  values:
    created: 1
    updated: 2
    reopened: 2
    resolved: 3
  reason: The webhook trigger type drives the OCSF activity; consume only when that activity is emitted.
- source: result
  kind: enum
  target: compliance.status_id
  values:
    pass: 1
    fail: 3
  reason: The configuration check result normalized to the OCSF compliance status; consume only when the
    expected ID is emitted.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
