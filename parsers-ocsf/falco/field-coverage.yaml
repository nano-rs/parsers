source: json
transforms:
- source: time
  kind: epoch_ms
  target: time
  reason: Successful RFC 3339 timestamp conversion to the selected event clock in milliseconds.
- source: priority
  kind: enum
  target: severity_id
  values:
    emergency: 5
    alert: 5
    critical: 5
    error: 4
    warning: 3
    notice: 2
    informational: 1
    info: 1
    debug: 1
  reason: Falco rule priority normalized to the OCSF severity; consume only when the expected ID is emitted.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  hostname:
  - device.hostname
  output:
  - message
  output_fields.container~1id:
  - evidences.container.uid
  output_fields.container~1image~1repository:
  - evidences.container.image.name
  - evidences.container.image.uid
  output_fields.container~1image~1tag:
  - evidences.container.image.tag
  - evidences.container.tag
  output_fields.container~1name:
  - evidences.container.name
  output_fields.evt~1type:
  - evidences.name
  output_fields.fd~1name:
  - evidences.file.path
  output_fields.k8s~1ns~1name:
  - resources.namespace
  output_fields.k8s~1pod~1name:
  - resources.name
  output_fields.ka~1target~1name:
  - resources.name
  output_fields.ka~1target~1namespace:
  - resources.namespace
  output_fields.ka~1target~1resource:
  - resources.type
  output_fields.ka~1user~1name:
  - actor.user.name
  - evidences.actor.user.name
  output_fields.proc~1cmdline:
  - actor.process.cmd_line
  - evidences.process.cmd_line
  output_fields.proc~1exepath:
  - actor.process.file.path
  - evidences.process.file.path
  output_fields.proc~1name:
  - actor.process.name
  - evidences.process.name
  output_fields.proc~1pcmdline:
  - actor.process.parent_process.cmd_line
  - evidences.process.parent_process.cmd_line
  output_fields.proc~1pid:
  - actor.process.pid
  - evidences.process.pid
  output_fields.proc~1pname:
  - actor.process.parent_process.name
  - evidences.process.parent_process.name
  output_fields.proc~1ppid:
  - actor.process.parent_process.pid
  - evidences.process.parent_process.pid
  output_fields.user~1name:
  - actor.process.user.name
  - actor.user.name
  - evidences.process.user.name
  output_fields.user~1uid:
  - actor.process.user.uid
  - actor.user.uid
  - evidences.process.user.uid
  rule:
  - finding_info.analytic.name
  - finding_info.title
  - message
  source:
  - finding_info.data_sources
  tags:
  - metadata.labels
  uuid:
  - finding_info.uid
  - metadata.original_event_uid
  - metadata.uid
