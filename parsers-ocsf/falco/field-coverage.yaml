source: json
transforms:
- source: time
  kind: epoch_ms
  target: time
  reason: Successful RFC 3339 timestamp conversion to the selected event clock in milliseconds.
- source: priority
  kind: enum
  target: severity_id
  values:
    emergency: 5
    alert: 5
    critical: 5
    error: 4
    warning: 3
    notice: 2
    informational: 1
    info: 1
    debug: 1
  reason: Falco rule priority normalized to the OCSF severity; consume only when the expected ID is emitted.
consumed_candidates:
- hostname
- output
- output_fields.container.id
- output_fields.container.image.id
- output_fields.container.image.repository
- output_fields.container.image.tag
- output_fields.container.name
- output_fields.evt.type
- output_fields.fd.name
- output_fields.k8s.ns.name
- output_fields.k8s.pod.name
- output_fields.ka.target.name
- output_fields.ka.target.namespace
- output_fields.ka.target.resource
- output_fields.ka.user.name
- output_fields.proc.cmdline
- output_fields.proc.cwd
- output_fields.proc.exepath
- output_fields.proc.name
- output_fields.proc.pcmdline
- output_fields.proc.pid
- output_fields.proc.pname
- output_fields.proc.ppid
- output_fields.user.name
- output_fields.user.uid
- priority
- rule
- source
- tags
- time
- uuid
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
