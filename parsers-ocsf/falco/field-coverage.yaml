source: json
transforms:
- source: priority
  kind: enum
  target: severity_id
  values:
    emergency: 5
    alert: 5
    critical: 5
    error: 4
    warning: 3
    notice: 2
    informational: 1
    info: 1
    debug: 1
  reason: Falco rule priority normalized to the OCSF severity; consume only when the expected ID is emitted.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  hostname:
  - device.hostname
  output:
  - message
  output_fields.container.id:
  - evidences.container.uid
  output_fields.container.image.repository:
  - evidences.container.image.name
  - evidences.container.image.uid
  output_fields.container.image.tag:
  - evidences.container.image.tag
  - evidences.container.tag
  output_fields.container.name:
  - evidences.container.name
  output_fields.evt.type:
  - evidences.name
  output_fields.fd.name:
  - evidences.file.path
  output_fields.k8s.ns.name:
  - resources.namespace
  output_fields.k8s.pod.name:
  - resources.name
  output_fields.ka.target.name:
  - resources.name
  output_fields.ka.target.namespace:
  - resources.namespace
  output_fields.ka.target.resource:
  - resources.type
  output_fields.ka.user.name:
  - actor.user.name
  - evidences.actor.user.name
  output_fields.proc.cmdline:
  - actor.process.cmd_line
  - evidences.process.cmd_line
  output_fields.proc.exepath:
  - actor.process.file.path
  - evidences.process.file.path
  output_fields.proc.name:
  - actor.process.name
  - evidences.process.name
  output_fields.proc.pcmdline:
  - actor.process.parent_process.cmd_line
  - evidences.process.parent_process.cmd_line
  output_fields.proc.pid:
  - actor.process.pid
  - evidences.process.pid
  output_fields.proc.pname:
  - actor.process.parent_process.name
  - evidences.process.parent_process.name
  output_fields.proc.ppid:
  - actor.process.parent_process.pid
  - evidences.process.parent_process.pid
  output_fields.user.name:
  - actor.process.user.name
  - actor.user.name
  - evidences.process.user.name
  output_fields.user.uid:
  - actor.process.user.uid
  - actor.user.uid
  - evidences.process.user.uid
  rule:
  - finding_info.analytic.name
  - finding_info.title
  - message
  source:
  - finding_info.data_sources
  tags:
  - metadata.labels
  uuid:
  - finding_info.uid
  - metadata.original_event_uid
  - metadata.uid
