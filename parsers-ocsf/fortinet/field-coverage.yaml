source: text
probe:
  mode: suffix
  require: '='
  text: ' ResidualProbe="nan2421-text-unknown" password="nan2421-secret"'
  source: ResidualProbe
transforms:
- source: status
  kind: enum
  target: status_id
  values:
    success: 1
    succeeded: 1
    failure: 2
    failed: 2
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when
    the expected ID is emitted.
- source: action
  kind: enum
  target: action_id
  values:
    allow: 1
    allowed: 1
    accept: 1
    accepted: 1
    permit: 1
    permitted: 1
    pass: 1
    passed: 1
    deny: 2
    denied: 2
    block: 2
    blocked: 2
    reject: 2
    rejected: 2
    drop: 2
    dropped: 2
    log: 3
    observed: 3
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when
    the expected ID is emitted.
- source: level
  kind: enum
  target: severity_id
  values:
    informational: 1
    info: 1
    debug: 1
    low: 2
    medium: 3
    warn: 3
    warning: 3
    high: 4
    error: 4
    critical: 5
    fatal: 6
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when
    the expected ID is emitted.
- source: severity
  kind: enum
  target: severity_id
  values:
    informational: 1
    info: 1
    debug: 1
    low: 2
    medium: 3
    warn: 3
    warning: 3
    high: 4
    error: 4
    critical: 5
    fatal: 6
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when
    the expected ID is emitted.
- source: eventtime
  kind: scale
  factor: 1.0e-06
  target: time
  reason: Existing unit conversion by 1e-06 verified against time; unused clock fallbacks remain residual.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  app:
  - app_name
  attack:
  - finding_info.analytic.name
  - finding_info.title
  attackid:
  - finding_info.analytic.uid
  - finding_info.uid
  authproto:
  - auth_protocol
  catdesc:
  - http_request.url.categories
  checksum:
  - observables.value
  devid:
  - device.uid
  devname:
  - device.hostname
  - src_endpoint.hostname
  dstcountry:
  - dst_endpoint.location.country
  dstintf:
  - dst_endpoint.interface_name
  - evidences.dst_endpoint.interface_name
  dstip:
  - dst_endpoint.ip
  - evidences.dst_endpoint.ip
  - observables.value
  dstport:
  - dst_endpoint.port
  - evidences.dst_endpoint.port
  duration:
  - duration
  filename:
  - evidences.file.name
  hostname:
  - http_request.url.hostname
  ipaddr:
  - answers.rdata
  logid:
  - metadata.event_code
  msg:
  - status_detail
  policyid:
  - firewall_rule.uid
  policyname:
  - firewall_rule.name
  proto:
  - connection_info.protocol_num
  - evidences.connection_info.protocol_num
  qclass:
  - query.class
  qname:
  - observables.value
  - query.hostname
  qtype:
  - answers.type
  - query.type
  rcvdbyte:
  - traffic.bytes_in
  rcvdpkt:
  - traffic.packets_in
  reason:
  - status_detail
  sentbyte:
  - traffic.bytes_out
  sentpkt:
  - traffic.packets_out
  service:
  - dst_endpoint.svc_name
  - evidences.dst_endpoint.svc_name
  sessionid:
  - connection_info.uid
  srccountry:
  - evidences.src_endpoint.location.country
  - src_endpoint.location.country
  srcintf:
  - evidences.src_endpoint.interface_name
  - src_endpoint.interface_name
  srcip:
  - evidences.src_endpoint.ip
  - observables.value
  - src_endpoint.ip
  srcport:
  - evidences.src_endpoint.port
  - src_endpoint.port
  url:
  - http_request.url.path
  user:
  - actor.user.name
  - observables.value
  - user.name
  virus:
  - finding_info.analytic.name
  - finding_info.title
  virusid:
  - finding_info.analytic.uid
  - finding_info.uid
  xid:
  - transaction_id
