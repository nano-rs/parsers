source: text
transforms:
- source: system.TimeCreated.@SystemTime
  kind: epoch_ms
  target: time
  reason: XML system clock converted to event milliseconds.
- source: event_data.OriginalFileName
  kind: lowercase
  reason: Case normalization already performed by the parser; observed at process.file.name,
    and checked against the emitted branch.
- source: system.Computer
  kind: lowercase
  reason: Case normalization already performed by the parser; observed at device.hostname,
    and checked against the emitted branch.
- source: event_data.Protocol
  kind: enum
  target: connection_info.protocol_num
  values:
    tcp: 6
    udp: 17
    icmp: 1
    icmpv6: 58
    ipv6-icmp: 58
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping;
    consume only when the expected ID is emitted.
- source: event_data.SourceHostname
  kind: lowercase
  reason: Case normalization already performed by the parser; observed at device.hostname,
    and checked against the emitted branch.
- source: event_data.GrantedAccess
  kind: hex
  target: actual_permissions
  reason: Parsed hexadecimal process ID or access mask is represented as an integer
    at this destination.
probe:
  mode: before
  anchor: </EventData>
  require: </EventData>
  text: <Data Name="ResidualProbe">nan2421-text-unknown</Data><Data Name="Password">nan2421-secret</Data>
  source: event_data.ResidualProbe
