name: kubernetes_container_ocsf
display_name: Kubernetes Container Logs (OCSF)
version: "1.0.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses Kubernetes container stdout/stderr logs into complete OCSF 1.9.0 Base
  Event (class_uid 0) records. Accepts the CRI log format the kubelet writes
  under /var/log/pods (`<RFC3339Nano> <stdout|stderr> <P|F> <message>`), the
  Docker json-file form (`{"log","stream","time"}`), the same record with
  Fluent Bit / Fluentd `kubernetes` metadata, and Vector's kubernetes_logs
  source (decoded `message` plus a `kubernetes` envelope). The namespace, pod,
  pod UID and container name come from that metadata or from the log file path
  (/var/log/pods/<ns>_<pod>_<uid>/<container>/N.log or
  /var/log/containers/<pod>_<ns>_<container>-<id>.log) and land on
  device.container (orchestrator Kubernetes; namespace and pod as
  container.tags), with the node as device.hostname. A JSON application body is
  passed through: msg/message and level are mapped and every other key lands in
  unmapped.log.*. Application lines are not forced into a security class; they
  keep their own severity. Input that matches none of these shapes is kept
  whole as a Base Event marked unmapped.parse_fallback.
match_values:
  - kubernetes_container
category: cloud
vendor: "CNCF"
product: "Kubernetes"
parser_vrl: |
  # Kubernetes container logs (CRI / json-file / collector envelopes) -> OCSF 1.9.0
  # Base Event. Emits the COMPLETE record on root and never aborts.

  raw_log = string(.message) ?? ""
  if !is_string(.message) && exists(.message) { raw_log = encode_json(.message) }
  __raw_body = raw_log
  __source_kv = {}
  # The collector envelope: every field Vector put beside `message`.
  __envelope = object(parse_json(encode_json(.)) ?? {}) ?? {}
  __discard = del(__envelope.message)

  # ---- envelope metadata (Vector kubernetes_logs / file sources) ----
  env_k8s = object(.kubernetes) ?? {}
  file_path = string(.file) ?? ""
  k8s = {}
  if length(env_k8s) > 0 {
      k8s.namespace = string(env_k8s.pod_namespace) ?? ""
      k8s.pod = string(env_k8s.pod_name) ?? ""
      k8s.pod_uid = string(env_k8s.pod_uid) ?? ""
      k8s.container = string(env_k8s.container_name) ?? ""
      k8s.container_id = string(env_k8s.container_id) ?? ""
      k8s.image = string(env_k8s.container_image) ?? ""
      k8s.image_id = string(env_k8s.container_image_id) ?? ""
      k8s.node = string(env_k8s.pod_node_name) ?? ""
  }

  kind = "unparsed"
  time_str = ""
  msg = ""
  body = {}
  body_is_json = false
  partial = false

  cri, crierr = parse_regex(raw_log, r'(?s)^(?P<time>\d{4}-\d{2}-\d{2}T\S+) (?P<stream>stdout|stderr) (?P<logtag>[A-Z](?::[A-Z])*)(?: (?P<log>.*))?\z')
  if crierr == null {
      # ---- CRI format (containerd / CRI-O) ----
      kind = "container"
      time_str = string(cri.time) ?? ""
      msg = string(cri.log) ?? ""
      partial = contains(string(cri.logtag) ?? "", "P")
      __source_kv = {"time": cri.time, "stream": cri.stream, "logtag": cri.logtag, "log": msg}
  } else {
      j, jerr = parse_json(raw_log)
      if jerr == null && is_object(j) && exists(j.log) {
          # ---- json-file form, optionally with Fluent Bit / Fluentd metadata ----
          kind = "container"
          jo = object!(j)
          # The record as written; message is the line, its terminator included.
          __source_kv = jo
          msg = string(jo.log) ?? encode_json(jo.log)
          time_str = string(jo.time) ?? ""
          jk = object(jo.kubernetes) ?? {}
          if length(jk) > 0 {
              k8s.namespace = string(jk.namespace_name) ?? string(k8s.namespace) ?? ""
              k8s.pod = string(jk.pod_name) ?? string(k8s.pod) ?? ""
              k8s.pod_uid = string(jk.pod_id) ?? string(k8s.pod_uid) ?? ""
              k8s.container = string(jk.container_name) ?? string(k8s.container) ?? ""
              k8s.container_id = string(jk.docker_id) ?? string(k8s.container_id) ?? ""
              k8s.image = string(jk.container_image) ?? string(k8s.image) ?? ""
              k8s.node = string(jk.host) ?? string(k8s.node) ?? ""
          }
          fj = string(jo.file) ?? ""
          if fj != "" { file_path = fj }
      } else if length(env_k8s) > 0 {
          # ---- Vector kubernetes_logs: message is already the decoded body ----
          kind = "container"
          msg = raw_log
          ts = .timestamp
          if is_timestamp(ts) { time_str = format_timestamp!(ts, "%+") } else { time_str = string(ts) ?? "" }
      }
  }

  # ---- namespace / pod / container from the log file path ----
  if file_path != "" {
      pp, pperr = parse_regex(file_path, r'/var/log/pods/(?P<ns>[^_/]+)_(?P<pod>[^_/]+)_(?P<uid>[0-9a-fA-F-]{36})/(?P<ctr>[^/]+)/')
      if pperr == null {
          if (string(k8s.namespace) ?? "") == "" { k8s.namespace = pp.ns }
          if (string(k8s.pod) ?? "") == "" { k8s.pod = pp.pod }
          if (string(k8s.pod_uid) ?? "") == "" { k8s.pod_uid = pp.uid }
          if (string(k8s.container) ?? "") == "" { k8s.container = pp.ctr }
      } else {
          cp, cperr = parse_regex(file_path, r'/var/log/containers/(?P<pod>[^_/]+)_(?P<ns>[^_/]+)_(?P<ctr>[^/]+)-(?P<cid>[0-9a-f]{64})\.log')
          if cperr == null {
              if (string(k8s.namespace) ?? "") == "" { k8s.namespace = cp.ns }
              if (string(k8s.pod) ?? "") == "" { k8s.pod = cp.pod }
              if (string(k8s.container) ?? "") == "" { k8s.container = cp.ctr }
              if (string(k8s.container_id) ?? "") == "" { k8s.container_id = cp.cid }
          }
      }
  }

  # ---- JSON application body: moved, parsed, to log_json (json-file / CRI)
  # or, for Vector kubernetes_logs, the decoded message itself ----
  b, berr = parse_json(msg)
  if berr == null && is_object(b) {
      body = object!(b)
      body_is_json = true
      if exists(__source_kv.log) && !exists(__source_kv.log_json) {
          __discard = del(__source_kv.log)
          __source_kv.log_json = body
      } else if length(__source_kv) == 0 {
          __source_kv = body
      }
  }

  level = ""
  if body_is_json {
      bl = body.level || body.severity || body.lvl || body.levelname
      level = string(bl) ?? to_string(bl) ?? ""
      bm = string(body.msg) ?? string(body.message) ?? ""
      if bm != "" { msg = bm }
  } else if msg != "" {
      lm, lmerr = parse_regex(msg, r'(?i)^\W{0,2}(?P<lvl>trace|debug|info|notice|warn|warning|error|err|fatal|crit|critical|panic)\b|\blevel=(?P<lvl2>\w+)|^(?P<klog>[IWEF])\d{4} \d{2}:\d{2}:\d{2}')
      if lmerr == null {
          level = string(lm.lvl) ?? string(lm.lvl2) ?? ""
          kl = string(lm.klog) ?? ""
          # klog header: I/W/E/F + MMDD
          if kl == "I" { level = "info" }
          if kl == "W" { level = "warning" }
          if kl == "E" { level = "error" }
          if kl == "F" { level = "fatal" }
      }
  }
  lvl = downcase(level)
  severity_id = 1
  severity = "Informational"
  if lvl == "warn" || lvl == "warning" { severity_id = 3; severity = "Medium" }
  if lvl == "error" || lvl == "err" { severity_id = 4; severity = "High" }
  if lvl == "crit" || lvl == "critical" { severity_id = 5; severity = "Critical" }
  if lvl == "fatal" || lvl == "panic" { severity_id = 6; severity = "Fatal" }

  time_ms = 0
  if time_str != "" {
      t, terr = parse_timestamp(time_str, "%+", timezone: "UTC")
      if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
  }
  if time_ms == 0 { time_ms = to_unix_timestamp(now(), unit: "milliseconds") }

  metadata = {
      "version": "1.9.0",
      "uid": sha2("kubernetes_container|raw|" + raw_log, variant: "SHA-256"),
      "log_name": "kubernetes_container",
      "log_provider": "kubelet",
      "product": { "name": "Kubernetes", "vendor_name": "CNCF" }
  }
  if time_str != "" { metadata.original_time = time_str }
  if level != "" { metadata.log_level = level }

  . = {
      "class_uid": 0,
      "class_name": "Base Event",
      "category_uid": 0,
      "category_name": "Uncategorized",
      "activity_id": 99,
      "activity_name": "Other",
      "type_uid": 99,
      "severity_id": severity_id,
      "severity": severity,
      "status_id": 0,
      "status": "Unknown",
      "time": time_ms,
      "raw_data": raw_log,
      "metadata": metadata
  }
  if msg != "" { .message = msg }
  if partial { .metadata.is_truncated = true }

  # ---- device + container ----
  ns = string(k8s.namespace) ?? ""
  pod = string(k8s.pod) ?? ""
  pod_uid = string(k8s.pod_uid) ?? ""
  ctr = string(k8s.container) ?? ""
  cid_full = string(k8s.container_id) ?? ""
  node = string(k8s.node) ?? ""
  image = string(k8s.image) ?? ""
  image_id = string(k8s.image_id) ?? ""
  runtime = ""
  cid = cid_full
  rp, rperr = parse_regex(cid_full, r'^(?P<rt>[a-z0-9-]+)://(?P<id>.+)$')
  if rperr == null { runtime = string(rp.rt) ?? ""; cid = string(rp.id) ?? "" }

  container = {}
  if cid != "" { container.uid = cid }
  if ctr != "" { container.name = ctr }
  if length(container) > 0 {
      container.orchestrator = "Kubernetes"
      if runtime != "" { container.runtime = runtime }
      if match(pod_uid, r'^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$') { container.pod_uuid = pod_uid }
      if image != "" && image_id != "" { container.image = { "name": image, "uid": image_id } }
      tags = []
      if ns != "" { tags = push(tags, { "name": "k8s.namespace", "value": ns }) }
      if pod != "" { tags = push(tags, { "name": "k8s.pod", "value": pod }) }
      if length(tags) > 0 { container.tags = tags }
  }
  device = {}
  if node != "" { device.hostname = node }
  # OCSF device needs an identifier; without the node name the pod is the host.
  if node == "" && pod != "" { device.name = pod }
  if node == "" && pod == "" && cid != "" { device.instance_uid = cid }
  if node == "" && pod == "" && cid == "" && ctr != "" { device.name = ctr }
  if length(device) > 0 {
      if length(container) > 0 { device.container = container }
      device.type_id = 0
      device.type = "Unknown"
      .device = device
      .metadata.profiles = ["host"]
      if length(container) > 0 { .metadata.profiles = ["host", "container"] }
  }
  if image != "" && image_id == "" && length(container) > 0 { .device.container.image = { "name": image } }
  # Every collector envelope field (stream, file, Vector kubernetes metadata,
  # ...) is kept as written under unmapped.envelope; a kubernetes field is
  # left out only when its value IS the attribute it was mapped to.
  envelope = __envelope
  ek8s = object(envelope.kubernetes) ?? {}
  for_each({"pod_namespace": ns, "pod_name": pod, "pod_uid": pod_uid, "container_name": ctr, "container_id": cid_full, "container_image": image, "container_image_id": image_id, "pod_node_name": node}) -> |kk, kv| {
      if kv != "" && (string(get(ek8s, [kk]) ?? null) ?? "") == kv { ek8s = remove!(ek8s, [kk]) }
  }
  if length(ek8s) > 0 { envelope.kubernetes = ek8s } else { __discard = del(envelope.kubernetes) }
  if length(envelope) > 0 { .unmapped = { "envelope": envelope } }

  if kind == "unparsed" {
      .metadata.log_level = "error"
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      . = set!(., ["unmapped", "parse_fallback"], "unparsable input")
  }
  .

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # Values spill exactly as parsed: a parser never masks, redacts or withholds
  # anything (masking is an opt-in pipeline step, never a parser concern).
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # A source field is consumed ONLY by an explicit mapping: a field-coverage.yaml
  # `mappings` entry (source key -> target paths) or a `transforms` rule with a
  # target, whose value is found AT THAT TARGET PATH of the selected branch. A
  # value that merely appears somewhere else in the event never consumes a field
  # (no coincidental consumption); everything else spills.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The sets below are strings instead
  # (a read shares the buffer). __repr holds one member per mapped leaf:
  # "," + encode_json(path) + "=" + encode_json(encode_json(value)), plus the
  # to_string form for a string or a float, so a numeric string is represented by
  # its typed scalar. Every part is a JSON text, inside which a '"' is always
  # escaped, so a member is matched exactly. Paths drop array indices
  # (resources.0.uid is resources.uid); arrays are walked two levels deep, and a
  # leaf deeper than that is simply not mapping evidence (it can only spill more).
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped = object!(parse_json!(encode_json(__mapped)))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __copy = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __repr = ""
  for_each(flatten(__mapped)) -> |path, value| {
      __p = encode_json(path)
      if is_array(value) {
          for_each(array!(value)) -> |_i, item| {
              if is_object(item) {
                  for_each(flatten(object!(item))) -> |sub, leaf| {
                      __q = encode_json(path + "." + sub)
                      if is_array(leaf) {
                          for_each(array!(leaf)) -> |_j, x| {
                              if !is_object(x) && !is_array(x) {
                                  __repr = __repr + ("," + __q + "=" + encode_json(encode_json(x)))
                                  if is_string(x) || is_float(x) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(x))) }
                              }
                          }
                      } else {
                          __repr = __repr + ("," + __q + "=" + encode_json(encode_json(leaf)))
                          if is_string(leaf) || is_float(leaf) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(leaf))) }
                      }
                  }
              } else if !is_array(item) {
                  __repr = __repr + ("," + __p + "=" + encode_json(encode_json(item)))
                  if is_string(item) || is_float(item) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(item))) }
              }
          }
      } else {
          __repr = __repr + ("," + __p + "=" + encode_json(encode_json(value)))
          if is_string(value) || is_float(value) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(value))) }
      }
  }
  __consumed = ""
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__copy.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # BEGIN parser-specific transformations
  # Declared source -> target mappings (field-coverage.yaml `mappings`).
  __decl = "\n\"log\"\t[\"message\"]\n\"time\"\t[\"metadata.original_time\"]\n\"log_json.level\"\t[\"metadata.log_level\"]\n\"log_json.msg\"\t[\"message\"]\n\"kubernetes.container_image\"\t[\"device.container.image.name\"]\n\"kubernetes.container_name\"\t[\"device.container.name\"]\n\"kubernetes.docker_id\"\t[\"device.container.uid\"]\n\"kubernetes.host\"\t[\"device.hostname\"]\n\"kubernetes.namespace_name\"\t[\"device.container.tags.value\"]\n\"kubernetes.pod_id\"\t[\"device.container.pod_uuid\"]\n\"kubernetes.pod_name\"\t[\"device.container.tags.value\"]\n\"level\"\t[\"metadata.log_level\"]\n\"msg\"\t[\"message\"]\n"
  __preserve = []
  # END parser-specific transformations
  # Declared mappings: __decl holds "\n" + encode_json(key) + "\t" + JSON array of
  # target paths + "\n" per mapped source key (a raw newline never occurs in
  # compact JSON). A key is consumed when its value, or every element of a scalar
  # array, is at one of its own targets. Keys stay ESCAPED here and in __consumed:
  # a literal dotted key ("a~1b") and the nested path ("a.b") are different
  # fields, and mapping one never consumes the other.
  for_each(__flat) -> |key, value| {
      # __decl spells a bracket inside a key as a \u escape (deploy bracket count).
      __kt = encode_json(key)
      if match(__kt, r'[\x28\x29\x5B\x5D\x7B\x7D]') {
          __kt = replace(replace(replace(replace(replace(replace(__kt, r'\x28', "\\u0028"), r'\x29', "\\u0029"), r'\x5B', "\\u005b"), r'\x5D', "\\u005d"), r'\x7B', "\\u007b"), r'\x7D', "\\u007d")
      }
      __at = find(__decl, "\n" + __kt + "\t")
      if is_integer(__at) && !is_object(value) {
          __rest = slice!(__decl, int!(__at) + strlen(__kt) + 2)
          __hit = false
          for_each(array!(parse_json!(slice!(__rest, 0, int!(find(__rest, "\n")))))) -> |_i, target| {
              __tok = "," + encode_json(target) + "="
              if !__hit && is_array(value) {
                  __all = !is_empty(array!(value))
                  for_each(array!(value)) -> |_j, item| {
                      if __all {
                          __all = !is_object(item) && !is_array(item) && (contains(__repr, __tok + encode_json(encode_json(item))) || ((is_string(item) || is_float(item)) && contains(__repr, __tok + encode_json(to_string!(item)))))
                      }
                  }
                  __hit = __all
              } else if !__hit {
                  __hit = contains(__repr, __tok + encode_json(encode_json(value))) || ((is_string(value) || is_float(value)) && contains(__repr, __tok + encode_json(to_string!(value))))
              }
          }
          if __hit { __consumed = __consumed + ("," + encode_json(key)) }
      }
  }
  # Fast path: when no two source keys decode to the same key and no two spilled
  # keys get the same name, each key's decision depends only on its own value, so
  # one filter and one rename build the residual without copying it per key.
  __distinct = true
  if __tilde {
      __distinct = length(map_keys(__flat) -> |key| { replace(replace(key, "~1", "."), "~0", "~") }) == length(__flat)
  }
  __kept = {}
  __names = {}
  if __distinct {
      __kept = filter(__flat) -> |key, value| {
          # A key is kept unless an explicit mapping or transformation consumed it.
          # Do not spill a copy of the raw body.
          value != __raw_body && !contains(__consumed, "," + encode_json(key))
      }
      __names = map_keys(__kept) -> |key| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          join!(__parts, ".")
      }
  }
  __residual = {}
  if __distinct && length(__names) == length(__kept) {
      __residual = map_values(__names) -> |value| {
          if is_array(value) || is_object(value) {
              if __tilde {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              if __complex { value = encode_json(value) }
          }
          value
      }
  } else {
      # Slow path, in source key order: a name already taken gets the next free
      # _2, _3, ... suffix.
      for_each(__flat) -> |key, value| {
          __token = "," + encode_json(key)
          key = replace(replace(key, "~1", "."), "~0", "~")
          if is_array(value) || is_object(value) {
              value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                  replace(replace(inner, "~1", "."), "~0", "~")
              }, ["v"])
          }
          if !contains(__consumed, __token) && value != __raw_body {
              __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
              __base = join!(__parts, ".")
              __key = __base
              __suffix = 2
              if includes(keys(__residual), __key) {
                  for_each(__flat) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __key) {
                          __key = __base + "_" + to_string(__suffix)
                          __suffix = __suffix + 1
                      }
                  }
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              __spill = if __complex { encode_json(value) } else { value }
              __residual = set!(__residual, [__key], __spill)
          }
      }
  }
  # Keep existing derived evidence, but remove null placeholders and copies of a
  # source value (that value is mapped or spilled above under its source path).
  # A value merely equal to some mapped attribute is kept: equality with an
  # unrelated attribute is no evidence that it is represented.
  # The canonical source spill above is the authoritative representation of
  # containers. The cheap conditions run first; the source value set is built on
  # first use.
  __original_values = null
  for_each(flatten(__existing)) -> |key, value| {
      if !is_null(value) && value != "" && !is_array(value) && !is_object(value) && value != __raw_body {
          # Members for the value itself and for to_string(value), as above.
          __json = encode_json(value)
          __as_json = "," + encode_json(__json)
          __as_string = __as_json
          if is_string(value) { __as_string = "," + __json } else if is_float(value) { __as_string = "," + encode_json(to_string!(value)) }
          if __original_values == null {
              # __source_kv may hold non-JSON types (a timestamp), so only an
              # integer or a boolean skips its to_string member here.
              __original_values = join!(map_values(values(flatten(__source_kv))) -> |source_value| {
                  __source_json = encode_json(source_value)
                  __tokens = "," + encode_json(__source_json)
                  if is_string(source_value) {
                      __tokens = __tokens + "," + __source_json
                  } else if !is_object(source_value) && !is_array(source_value) && !is_integer(source_value) && !is_boolean(source_value) {
                      __tokens = __tokens + "," + encode_json(to_string(source_value) ?? "")
                  }
                  __tokens
              }, "")
          }
          __source_set = string!(__original_values)
          __keep = !contains(__source_set, __as_json) && !contains(__source_set, __as_string)
          # Only text opening an object or an array (after JSON whitespace)
          # decodes to a container.
          if __keep && is_string(value) && match(string!(value), r'^[ \t\n\r]*[\x5B\x7B]') {
              __decoded, __decode_err = parse_json(string!(value))
              __keep = !(__decode_err == null && (is_object(__decoded) || is_array(__decoded)))
          }
          if __keep {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, as-is. These
  # entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__copy.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

# Runtime samples (NAN-2327): one per event shape this parser routes. The
# sidecar corpus in samples/ (sources in samples/README.md) is the full set.
samples:
  # cri_full_line
  - raw: "2016-10-06T00:17:09.669794202Z stdout F The content of the log entry 1"
    expect:
      "class_uid": 0
      "message": "The content of the log entry 1"
      "time": 1475713029669
  # cri_partial_line
  - raw: "2016-10-06T00:17:09.669794202Z stdout P First line of log entry 2"
    expect:
      "class_uid": 0
      "metadata.is_truncated": "true"
  # cri_stderr_klog_error
  - raw: "2026-11-20T10:00:00.123456789Z stderr F E1120 10:00:00.123456       1 reflector.go:147] failed to list *v1.Pod: Unauthorized"
    expect:
      "class_uid": 0
      "severity_id": 4
  # cri_json_body
  - raw: "2026-11-20T10:00:01.000000001Z stdout F {\"level\": \"warn\", \"ts\": \"2026-11-20T10:00:01Z\", \"msg\": \"slow request\", \"method\": \"GET\", \"path\": \"/api/orders\", \"duration_ms\": 1834, \"client_ip\": \"192.0.2.31\"}"
    expect:
      "class_uid": 0
      "severity_id": 3
      "message": "slow request"
  # jsonfile_docker_driver
  - raw: "{\"log\": \"The actual log line\\n\", \"stream\": \"stderr\", \"time\": \"2016-10-05T00:00:30.082640485Z\"}"
    expect:
      "class_uid": 0
      "message": "The actual log line"
  # fluentbit_kubernetes_metadata
  - raw: "{\"log\": \"INFO  Started OrdersApplication in 4.2 seconds\\n\", \"stream\": \"stdout\", \"time\": \"2026-11-20T10:00:04.000000000Z\", \"kubernetes\": {\"pod_name\": \"orders-5f9c8d7b6-abcde\", \"namespace_name\": \"shop\", \"pod_id\": \"7a1c2e3f-4b5d-4e6f-8a9b-0c1d2e3f4a5b\", \"labels\": {\"app\": \"orders\"}, \"host\": \"node-a.example.com\", \"container_name\": \"orders\", \"docker_id\": \"b5e1f0c2d3a4958677e6f5d4c3b2a1908f7e6d5c4b3a29180f7e6d5c4b3a2918\", \"container_image\": \"registry.example.com/shop/orders:2.4.1\"}}"
    expect:
      "device.hostname": "node-a.example.com"
      "device.container.name": "orders"
      "device.container.tags.0.value": "shop"
  # junk
