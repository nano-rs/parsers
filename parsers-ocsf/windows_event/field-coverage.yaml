source: json
transforms:
- source: computer
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value
    is emitted.
- source: event_data.SubjectUserName
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value
    is emitted.
- source: event_data.SubjectDomainName
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value
    is emitted.
- source: channel
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value
    is emitted.
- source: provider_name
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value
    is emitted.
- source: timestamp
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: event_data.TargetDomainName
  kind: lowercase
  reason: Case normalization already performed by the parser; observed at user.domain,
    and checked against the emitted branch.
- source: event_data.WorkstationName
  kind: lowercase
  reason: Case normalization already performed by the parser; observed at src_endpoint.hostname,
    and checked against the emitted branch.
- source: event_data.NewProcessId
  kind: hex
  target: process.pid
  reason: Parsed hexadecimal process ID or access mask is represented as an integer
    at this destination.
- source: event_data.ProcessId
  kind: hex
  target: actor.process.pid
  reason: Parsed hexadecimal process ID or access mask is represented as an integer
    at this destination.
consumed_candidates:
- channel
- computer
- event_data
- event_data.AuthenticationPackageName
- event_data.CommandLine
- event_data.FailureReason
- event_data.IpAddress
- event_data.IpPort
- event_data.LogonType
- event_data.NewProcessId
- event_data.NewProcessName
- event_data.ParentProcessName
- event_data.PrivilegeList
- event_data.ProcessId
- event_data.Status
- event_data.SubStatus
- event_data.SubjectDomainName
- event_data.SubjectLogonId
- event_data.SubjectUserName
- event_data.SubjectUserSid
- event_data.TargetDomainName
- event_data.TargetLogonId
- event_data.TargetUserName
- event_data.TargetUserSid
- event_data.WorkstationName
- event_id
- host
- message
- provider_name
- record_id
- timestamp
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
