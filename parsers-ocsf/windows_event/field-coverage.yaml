source: json
transforms:
- source: computer
  kind: lowercase
  target: device.hostname
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: computer
  kind: lowercase
  target: dst_endpoint.hostname
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: event_data.SubjectUserName
  kind: lowercase
  target: actor.user.name
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: event_data.SubjectUserName
  kind: lowercase
  target: user.name
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: event_data.SubjectDomainName
  kind: lowercase
  target: actor.user.domain
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: event_data.SubjectDomainName
  kind: lowercase
  target: user.domain
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: timestamp
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: event_data.TargetDomainName
  kind: lowercase
  target: user.domain
  reason: Case normalization already performed by the parser; observed at user.domain, and checked against
    the emitted branch.
- source: event_data.WorkstationName
  kind: lowercase
  target: src_endpoint.hostname
  reason: Case normalization already performed by the parser; observed at src_endpoint.hostname, and checked
    against the emitted branch.
- source: event_data.NewProcessId
  kind: hex
  target: process.pid
  reason: Parsed hexadecimal process ID or access mask is represented as an integer at this destination.
- source: event_data.ProcessId
  kind: hex
  target: actor.process.pid
  reason: Parsed hexadecimal process ID or access mask is represented as an integer at this destination.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  channel:
  - metadata.log_name
  event_data.AuthenticationPackageName:
  - auth_protocol
  event_data.CommandLine:
  - process.cmd_line
  event_data.FailureReason:
  - status_detail
  event_data.IpAddress:
  - src_endpoint.ip
  event_data.IpPort:
  - src_endpoint.port
  event_data.LogonType:
  - logon_type_id
  event_data.NewProcessName:
  - process.file.path
  event_data.ParentProcessName:
  - actor.process.file.path
  event_data.Status:
  - status_code
  event_data.SubjectLogonId:
  - session.uid
  event_data.SubjectUserName:
  - actor.user.name
  - user.name
  event_data.SubjectUserSid:
  - actor.user.uid
  - user.uid
  event_data.TargetLogonId:
  - session.uid
  event_data.TargetUserName:
  - user.name
  event_data.TargetUserSid:
  - user.uid
  event_id:
  - metadata.event_code
  message:
  - message
  provider_name:
  - metadata.log_provider
  record_id:
  - metadata.original_event_uid
