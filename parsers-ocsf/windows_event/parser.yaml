name: windows_event_ocsf
display_name: Windows Event Log (OCSF)
version: "1.4.0"
description: >
  Preserves unconsumed parsed fields in redacted, dotted snake_case unmapped keys.
  Parses Windows Security Event Log records (JSON; top-level event_id +
  event_data) into complete OCSF 1.9.0 records, routed by EventID:
    4624 Successful Logon   -> Authentication 3002 (Logon, Success)
    4625 Failed Logon       -> Authentication 3002 (Logon, Failure)
    4634 Logoff             -> Authentication 3002 (Logoff)
    4672 Special Privileges -> Authorize Session 3003 (Assign Privileges)
    4688 Process Creation   -> Process Activity 1007 (Launch)
  Emits the whole OCSF object on the root so it lands in ocsf_logs.event and the
  promoted columns materialize. Carries metadata.profiles ["host"] because the
  `device` object is profile-bound in OCSF 1.9. Mirrors the UDM windows_event
  parser but targets OCSF instead of `.udm.*`.
ocsf_version: "1.9.0"
match_values:
  - windows_event
category: endpoint
vendor: "Microsoft"
product: "Windows"
parser_vrl: |
  # Windows Security Event Log JSON -> OCSF 1.9.0. Emits the COMPLETE record on root.
  raw_log = string!(.message)
  __raw_body = raw_log
  __source_kv = {}
  parsed, err = parse_json(raw_log)
  __source_kv = object(parsed) ?? {}

  if err != null || !is_object(parsed) {
      . = {
          "class_uid": 3002,
          "category_uid": 3,
          "activity_id": 99,
          "type_uid": 300299,
          "severity_id": 1,
          "status_id": 0,
          "time": 0,
          "raw_data": raw_log,
          # 3002 requires `user` plus one of service/dst_endpoint, even on the
          # unparseable path.
          "user": { "name": "" },
          "dst_endpoint": { "hostname": "" },
          "metadata": {
              "version": "1.9.0",
              "profiles": ["host"],
              "uid": sha2("windows_event|raw|" + raw_log, variant: "SHA-256"),
              "log_level": "error",
              "product": { "name": "Windows", "vendor_name": "Microsoft" }
          }
      }
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      . = set!(., ["unmapped", "parse_fallback"], "unparsable input")
  } else {
      p = object!(parsed)
      ed = object(p.event_data) ?? {}
      eid = to_int(p.event_id) ?? 0

      computer = downcase(string(p.computer) ?? string(p.host) ?? "")

      # human-readable Windows message if present, else the raw JSON
      msg = string(p.message) ?? ""
      if msg == "" { msg = raw_log }

      # ---- event time (top-level ISO8601) -> epoch ms ----
      time_ms = 0
      ts_str = string(p.timestamp) ?? ""
      if ts_str != "" {
          t, terr = parse_timestamp(ts_str, "%+")
          if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
      }

      ocsf = {}

      if eid == 4688 {
          # Process Creation -> Process Activity 1007 (Launch)
          npn = string(ed.NewProcessName) ?? ""
          proc_name = ""
          nm, nmerr = parse_regex(npn, r'(?P<b>[^\\/]+)$')
          if nmerr == null { proc_name = string(nm.b) ?? "" }
          ppn = string(ed.ParentProcessName) ?? ""
          parent_name = ""
          pm, pmerr = parse_regex(ppn, r'(?P<b>[^\\/]+)$')
          if pmerr == null { parent_name = string(pm.b) ?? "" }

          ocsf.class_uid = 1007
          ocsf.class_name = "Process Activity"
          ocsf.category_uid = 1
          ocsf.category_name = "System Activity"
          ocsf.activity_id = 1
          ocsf.activity_name = "Launch"
          # OCSF 1007: top-level `process` (REQUIRED) = the SUBJECT (the new
          # process); `actor.process` = the PARENT/initiator.
          ocsf.process = {
              "name": proc_name,
              "cmd_line": string(ed.CommandLine) ?? "",
              "pid": parse_int(string(ed.NewProcessId) ?? "0") ?? 0,
              "file": { "name": proc_name, "path": npn, "type_id": 1 }
          }
          actor_user = {
              "name": downcase(string(ed.SubjectUserName) ?? ""),
              "domain": downcase(string(ed.SubjectDomainName) ?? ""),
              "uid": string(ed.SubjectUserSid) ?? ""
          }
          ocsf.actor = {
              "process": {
                  "name": parent_name,
                  "pid": parse_int(string(ed.ProcessId) ?? "0") ?? 0,
                  "file": { "name": parent_name, "path": ppn, "type_id": 1 }
              },
              "user": actor_user
          }
          ocsf.device = { "hostname": computer }
          ocsf.status_id = 1
          ocsf.status = "Success"
          ocsf.severity_id = 1
          ocsf.severity = "Informational"
      } else if eid == 4672 {
          # Special Privileges Assigned -> Authorize Session 3003 (IAM),
          # activity 1 (Assign Privileges). Required: user + at_least_one of
          # (privileges, groups, iam_roles); we populate privileges from PrivilegeList.
          ocsf.class_uid = 3003
          ocsf.class_name = "Authorize Session"
          ocsf.category_uid = 3
          ocsf.category_name = "Identity & Access Management"
          ocsf.activity_id = 1
          ocsf.activity_name = "Assign Privileges"
          ocsf.status_id = 1
          ocsf.status = "Success"
          ocsf.severity_id = 1
          ocsf.severity = "Informational"
          ocsf.user = { "name": downcase(string(ed.SubjectUserName) ?? ""), "domain": downcase(string(ed.SubjectDomainName) ?? ""), "uid": string(ed.SubjectUserSid) ?? "" }
          priv_raw = strip_whitespace(string(ed.PrivilegeList) ?? "")
          privileges = []
          if priv_raw != "" { privileges = split(priv_raw, r'\s+') }
          ocsf.privileges = privileges
          ocsf.device = { "hostname": computer }
          ocsf.session = { "uid": string(ed.SubjectLogonId) ?? "" }
      } else {
          # Authentication family -> 3002
          ocsf.class_uid = 3002
          ocsf.class_name = "Authentication"
          ocsf.category_uid = 3
          ocsf.category_name = "Identity & Access Management"

          activity_id = 99
          activity_name = "Other"
          status_id = 1
          status_str = "Success"
          severity_id = 1
          severity = "Informational"
          if eid == 4624 { activity_id = 1; activity_name = "Logon" }
          if eid == 4625 { activity_id = 1; activity_name = "Logon"; status_id = 2; status_str = "Failure"; severity_id = 2; severity = "Low" }
          if eid == 4634 { activity_id = 2; activity_name = "Logoff" }

          # logon events carry the principal in Target*
          uname = string(ed.TargetUserName) ?? ""
          udom = string(ed.TargetDomainName) ?? ""
          usid = string(ed.TargetUserSid) ?? ""

          # auth package -> auth_protocol(_id)
          pkg = string(ed.AuthenticationPackageName) ?? ""
          pkg_l = downcase(pkg)
          auth_protocol_id = 0
          if pkg_l == "ntlm" { auth_protocol_id = 1 }
          if pkg_l == "kerberos" { auth_protocol_id = 2 }
          if pkg != "" && auth_protocol_id == 0 { auth_protocol_id = 99 }

          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          ocsf.status_id = status_id
          ocsf.status = status_str
          ocsf.severity_id = severity_id
          ocsf.severity = severity
          ocsf.user = { "name": downcase(uname), "domain": downcase(udom), "uid": usid }
          # NAN-2986: the session is the TARGET logon's. A failed 4625 has no
          # TargetLogonId, and falling back to SubjectLogonId stamped the
          # caller's (usually 0x0 = no session) id as the failed logon's session.
          logon_id = string(ed.TargetLogonId) ?? ""
          if logon_id != "" && logon_id != "0x0" { ocsf.session = { "uid": logon_id } }
          if auth_protocol_id != 0 {
              ocsf.auth_protocol_id = auth_protocol_id
              ocsf.auth_protocol = pkg
          }

          # source endpoint (network logons carry IpAddress/IpPort/Workstation)
          ip = string(ed.IpAddress) ?? ""
          ws = string(ed.WorkstationName) ?? ""
          if ip != "" || ws != "" {
              ocsf.src_endpoint = {
                  "ip": downcase(ip),
                  "port": to_int(ed.IpPort) ?? 0,
                  "hostname": downcase(ws)
              }
          }
          # Authentication 3002 requires at_least_one(service, dst_endpoint):
          # the logon TARGET is the reporting machine.
          ocsf.dst_endpoint = { "hostname": computer }
          ocsf.device = { "hostname": computer }

          logon_type_raw = string(ed.LogonType) ?? ""
          logon_type_id = to_int(ed.LogonType) ?? 0
          logon_type = "Unknown"
          if logon_type_id == 1 { logon_type = "System" }
          if logon_type_id == 2 { logon_type = "Interactive" }
          if logon_type_id == 3 { logon_type = "Network" }
          if logon_type_id == 4 { logon_type = "Batch" }
          if logon_type_id == 5 { logon_type = "OS Service" }
          if logon_type_id == 7 { logon_type = "Unlock" }
          if logon_type_id == 8 { logon_type = "Network Cleartext" }
          if logon_type_id == 9 { logon_type = "New Credentials" }
          if logon_type_id == 10 { logon_type = "Remote Interactive" }
          if logon_type_id == 11 { logon_type = "Cached Interactive" }
          if logon_type_id == 12 { logon_type = "Cached Remote Interactive" }
          if logon_type_id == 13 { logon_type = "Cached Unlock" }
          if logon_type_raw != "" {
              if logon_type_id != 1 && logon_type_id != 2 && logon_type_id != 3 && logon_type_id != 4 && logon_type_id != 5 && logon_type_id != 7 && logon_type_id != 8 && logon_type_id != 9 && logon_type_id != 10 && logon_type_id != 11 && logon_type_id != 12 && logon_type_id != 13 {
                  logon_type_id = 99
                  logon_type = logon_type_raw
              }
              ocsf.logon_type_id = logon_type_id
              ocsf.logon_type = logon_type
              ocsf.is_remote = logon_type_id == 3 || logon_type_id == 8 || logon_type_id == 10 || logon_type_id == 12
              ocsf.is_cleartext = logon_type_id == 8
          }

          if eid == 4625 {
              ocsf.status_code = string(ed.Status) ?? ""
              ocsf.status_detail = string(ed.FailureReason) ?? ""
              ocsf.unmapped = { "sub_status": string(ed.SubStatus) ?? null }
          }
      }

      # ---- common envelope ----
      ocsf.type_uid = to_int(ocsf.class_uid) * 100 + to_int(ocsf.activity_id)
      ocsf.time = time_ms
      ocsf.message = msg
      ocsf.raw_data = raw_log
      # Windows record_id is only unique within a host/channel stream and can be
      # reused after a log reset. Include the source event time so replaying the
      # same event stays idempotent while a later reused RecordID cannot collide.
      record_id = to_string(p.record_id) ?? ""
      log_name = downcase(string(p.channel) ?? "Security")
      log_provider = downcase(string(p.provider_name) ?? "Microsoft-Windows-Security-Auditing")
      record_uid = ""
      if record_id != "" && computer != "" && ts_str != "" {
          record_uid = join!(["windows_event", computer, log_name, log_provider, record_id, ts_str], "|")
      }
      if record_uid == "" { record_uid = sha2("windows_event|raw|" + raw_log, variant: "SHA-256") }
      if is_object(ocsf.device) { ocsf.device.type_id = 0 }
      ocsf.metadata = {
          "version": "1.9.0",
          "profiles": ["host"],
          "uid": record_uid,
          "event_code": to_string(eid),
          "log_name": string(p.channel) ?? "Security",
          "log_provider": string(p.provider_name) ?? "Microsoft-Windows-Security-Auditing",
          "product": { "name": "Windows", "vendor_name": "Microsoft" }
      }

      # NAN-3713: original_event_uid carries the vendor's bare record number
      # (the per-host, per-channel sequence), not the composite uid above, so
      # it stays searchable as the number Windows shows. Omitted when absent.
      if record_id != "" { ocsf.metadata.original_event_uid = record_id }

      # NAN-2986: drop empty user identifiers (a 4625 for an unknown account
      # has no TargetUserSid). "" is not an identifier and matched every
      # `user.uid=*` hunt. `user` itself stays: 3002/3003 require it.
      if is_object(ocsf.user) {
          for_each(["uid", "domain"]) -> |_i, attr| {
              if (string(get!(ocsf.user, [attr])) ?? "") == "" { ocsf.user = remove!(object!(ocsf.user), [attr]) }
          }
      }

      . = ocsf
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # Exact value representation is evaluated AFTER branch selection. Numeric strings
  # count as represented by their typed scalar; other transformations are explicit.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The value sets below are strings
  # instead (a read shares the buffer): "," + encode_json(member) per member, and
  # contains(set, "," + encode_json(x)) is exact membership. Every member is a
  # JSON text, inside which a '"' is always escaped, so ',"' only ever starts a
  # member, and a JSON string ends at its first unescaped '"'. The fixed candidate
  # set is a regex literal, compiled once with the program.
  # __mapped holds only JSON types, so to_string equals encode_json for an integer
  # or a boolean and only strings and floats add a second member.
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped_json = encode_json(__mapped)
  __mapped = object!(parse_json!(__mapped_json))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __safe = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __safe_json = encode_json(__safe)
  # Object and array members are encodings: an empty object, an object that
  # opens with a quoted key, or an array. A lookup can ask for one only when some
  # source or existing value is an array, or a string spelling one of those
  # openings, and the regex below finds either in the JSON text (brackets are
  # written as hex escapes because nano's deploy check counts them raw).
  # Otherwise the scalar nodes suffice; a Sysmon GUID, a brace-wrapped string
  # with no quoted key, is no object member. The leaves of flatten(), with arrays
  # flattened too, are every scalar node unless a key holds a literal '.' (in
  # compact JSON only a key is followed by ':').
  # Their encodings, unwrapped from the array, already are the string members.
  __represented = ""
  __nodes = __mapped
  if !match(__safe_json, r'"(?:\x7B\\"|\x7B\x7D"|\x5B)|[:,\x5B]\x5B') && !match(__mapped_json, r'\.(?:[^"\\]|\\.)*":') {
      __leaves = flatten(values(flatten(__mapped)))
      __leaves_json = encode_json(__leaves)
      if match(__leaves_json, r'\x7B') {
          # An object inside an array: walk the leaves, objects whole.
          __nodes = __leaves
      } else {
          __nodes = []
          __members = map_values(__leaves) -> |value| {
              if is_float(value) {
                  encode_json(encode_json(value)) + "," + encode_json(to_string!(value))
              } else {
                  encode_json(encode_json(value))
              }
          }
          __represented = "," + join!(__members, ",") + "," + slice!(__leaves_json, 1, -1)
      }
  }
  __walk = map_values(__nodes, recursive: true) -> |value| {
      __json = encode_json(value)
      if is_string(value) {
          # A string's second member is the string itself, encoded: __json.
          __represented = __represented + ("," + encode_json(__json) + "," + __json)
      } else if is_float(value) {
          __represented = __represented + ("," + encode_json(__json) + "," + encode_json(to_string!(value)))
      } else {
          __represented = __represented + ("," + encode_json(__json))
      }
      value
  }
  __consumed = ""
  # BEGIN parser-specific transformations
  __source_flat = flatten(__source_kv)
  # computer: Parser lowercases this source value; consume only when the normalized value is emitted.
  __value = __source_flat."computer"
  if is_string(__value) {
      __expected = downcase(string!(__value))
      if contains(__represented, "," + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json("computer")) }
  }
  # event_data.SubjectUserName: Parser lowercases this source value; consume only when the normalized value is emitted.
  __value = __source_flat."event_data.SubjectUserName"
  if is_string(__value) {
      __expected = downcase(string!(__value))
      if contains(__represented, "," + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json("event_data.SubjectUserName")) }
  }
  # event_data.SubjectDomainName: Parser lowercases this source value; consume only when the normalized value is emitted.
  __value = __source_flat."event_data.SubjectDomainName"
  if is_string(__value) {
      __expected = downcase(string!(__value))
      if contains(__represented, "," + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json("event_data.SubjectDomainName")) }
  }
  # channel: Parser lowercases this source value; consume only when the normalized value is emitted.
  __value = __source_flat."channel"
  if is_string(__value) {
      __expected = downcase(string!(__value))
      if contains(__represented, "," + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json("channel")) }
  }
  # provider_name: Parser lowercases this source value; consume only when the normalized value is emitted.
  __value = __source_flat."provider_name"
  if is_string(__value) {
      __expected = downcase(string!(__value))
      if contains(__represented, "," + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json("provider_name")) }
  }
  # timestamp: Successful ISO timestamp conversion to the selected event clock in milliseconds.
  __value = __source_flat."timestamp"
  __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%+")
  if __clock_err == null {
      __expected = to_unix_timestamp(__clock, unit: "milliseconds")
      if ."time" == __expected { __consumed = __consumed + ("," + encode_json("timestamp")) }
  }
  # event_data.TargetDomainName: Case normalization already performed by the parser; observed at user.domain, and checked against the emitted branch.
  __value = __source_flat."event_data.TargetDomainName"
  if is_string(__value) {
      __expected = downcase(string!(__value))
      if contains(__represented, "," + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json("event_data.TargetDomainName")) }
  }
  # event_data.WorkstationName: Case normalization already performed by the parser; observed at src_endpoint.hostname, and checked against the emitted branch.
  __value = __source_flat."event_data.WorkstationName"
  if is_string(__value) {
      __expected = downcase(string!(__value))
      if contains(__represented, "," + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json("event_data.WorkstationName")) }
  }
  # event_data.NewProcessId: Parsed hexadecimal process ID or access mask is represented as an integer at this destination.
  __value = __source_flat."event_data.NewProcessId"
  __hex = replace(downcase(string(__value) ?? ""), r'^0x', "")
  __integer, __integer_err = parse_int(__hex, base: 16)
  if is_string(__value) && starts_with(downcase(string(__value) ?? ""), "0x") && __integer_err == null {
      __expected = __integer
      if ."process"."pid" == __expected { __consumed = __consumed + ("," + encode_json("event_data.NewProcessId")) }
  }
  # event_data.ProcessId: Parsed hexadecimal process ID or access mask is represented as an integer at this destination.
  __value = __source_flat."event_data.ProcessId"
  __hex = replace(downcase(string(__value) ?? ""), r'^0x', "")
  __integer, __integer_err = parse_int(__hex, base: 16)
  if is_string(__value) && starts_with(downcase(string(__value) ?? ""), "0x") && __integer_err == null {
      __expected = __integer
      if ."actor"."process"."pid" == __expected { __consumed = __consumed + ("," + encode_json("event_data.ProcessId")) }
  }
  # Only source keys read by this parser are eligible for exact-value consumption; the selected branch must emit the value. Unknown keys always spill, even when their value equals an OCSF default.
  __candidates = r'(?x)
  \A(?:
    channel
  | computer
  | event_data
  | event_data\.AuthenticationPackageName
  | event_data\.CommandLine
  | event_data\.FailureReason
  | event_data\.IpAddress
  | event_data\.IpPort
  | event_data\.LogonType
  | event_data\.NewProcessId
  | event_data\.NewProcessName
  | event_data\.ParentProcessName
  | event_data\.PrivilegeList
  | event_data\.ProcessId
  | event_data\.Status
  | event_data\.SubStatus
  | event_data\.SubjectDomainName
  | event_data\.SubjectLogonId
  | event_data\.SubjectUserName
  | event_data\.SubjectUserSid
  | event_data\.TargetDomainName
  | event_data\.TargetLogonId
  | event_data\.TargetUserName
  | event_data\.TargetUserSid
  | event_data\.WorkstationName
  | event_id
  | host
  | message
  | provider_name
  | record_id
  | timestamp
  )\z'
  __preserve = []
  # END parser-specific transformations
  # Redact at every depth, including objects inside arrays, before serialization.
  # Redaction needs a sensitive word in a key or a name/key value, and encode_json
  # never escapes a letter, so text without one of the words needs no walk.
  if match(downcase(__safe_json), r'password|secret|authorization|token') {
      __safe = map_values(__safe, recursive: true) -> |value| {
          if is_object(value) {
              # Header/parameter arrays commonly encode sensitive keys as name/value
              # or Key/Value objects instead of using the secret name as an object key.
              __sensitive_pair = false
              for_each(object!(value)) -> |key, child| {
                  if includes(["name", "key"], downcase(key)) && match(downcase(string(child) ?? ""), r'password|secret|authorization|token') {
                      __sensitive_pair = true
                  }
              }
              for_each(object!(value)) -> |key, _child| {
                  if match(downcase(key), r'password|secret|authorization|token') || (__sensitive_pair && includes(["value", "values"], downcase(key))) {
                      value = set!(value, [key], "<redacted>")
                  }
              }
          }
          value
      }
  }
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__safe.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # Fast path: when no two source keys decode to the same key and no two spilled
  # keys get the same name, each key's decision depends only on its own value, so
  # one filter and one rename build the residual without copying it per key.
  __distinct = true
  if __tilde {
      __distinct = length(map_keys(__flat) -> |key| { replace(replace(key, "~1", "."), "~0", "~") }) == length(__flat)
  }
  __kept = {}
  __names = {}
  if __distinct {
      __kept = filter(__flat) -> |key, value| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          # A key is kept unless it is consumed: by a transformation above, or as a
          # candidate whose value is represented. Redacted leaves always remain
          # visible. Do not spill a copy of the raw body.
          if value == __raw_body {
              false
          } else if value == "<redacted>" {
              true
          } else if contains(__consumed, "," + encode_json(key)) {
              false
          } else if !match(key, __candidates) {
              true
          } else {
              # flatten stops at arrays, so objects inside an array still carry the
              # escaped keys: decode them too, or `a.b` spills as `a~1b` (NAN-3604).
              if __tilde && (is_array(value) || is_object(value)) {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __same = contains(__represented, "," + encode_json(encode_json(value)))
              if !__same && (is_string(value) || is_float(value)) {
                  __same = contains(__represented, "," + encode_json(to_string!(value)))
              }
              # A scalar array is consumed only if every element is represented. Preserve
              # partially represented arrays intact, including their ordering and repeats.
              if !__same && is_array(value) && !is_empty(array!(value)) {
                  __same = true
                  for_each(array!(value)) -> |_index, item| {
                      if __same {
                          if is_object(item) || is_array(item) {
                              __same = false
                          } else if !contains(__represented, "," + encode_json(encode_json(item))) {
                              __same = (is_string(item) || is_float(item)) && contains(__represented, "," + encode_json(to_string!(item)))
                          }
                      }
                  }
              }
              !__same
          }
      }
      __names = map_keys(__kept) -> |key| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          join!(__parts, ".")
      }
  }
  __residual = {}
  if __distinct && length(__names) == length(__kept) {
      __residual = map_values(__names) -> |value| {
          if is_array(value) || is_object(value) {
              if __tilde {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              if __complex { value = encode_json(value) }
          }
          value
      }
  } else {
      # Slow path, in source key order: a decoded key consumed earlier stays
      # consumed, and a name already taken gets the next free _2, _3, ... suffix.
      for_each(__flat) -> |key, value| {
          key = replace(replace(key, "~1", "."), "~0", "~")
          if is_array(value) || is_object(value) {
              value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                  replace(replace(inner, "~1", "."), "~0", "~")
              }, ["v"])
          }
          __same = contains(__represented, "," + encode_json(encode_json(value)))
          if !__same && (is_string(value) || is_float(value)) {
              __same = contains(__represented, "," + encode_json(to_string!(value)))
          }
          if !__same && is_array(value) && !is_empty(array!(value)) {
              __same = true
              for_each(array!(value)) -> |_index, item| {
                  if __same {
                      if is_object(item) || is_array(item) {
                          __same = false
                      } else if !contains(__represented, "," + encode_json(encode_json(item))) {
                          __same = (is_string(item) || is_float(item)) && contains(__represented, "," + encode_json(to_string!(item)))
                      }
                  }
              }
          }
          __token = "," + encode_json(key)
          if __same && match(key, __candidates) { __consumed = __consumed + ("," + encode_json(key)) }
          if (!contains(__consumed, __token) || value == "<redacted>") && value != __raw_body {
              __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
              __base = join!(__parts, ".")
              __key = __base
              __suffix = 2
              if includes(keys(__residual), __key) {
                  for_each(__flat) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __key) {
                          __key = __base + "_" + to_string(__suffix)
                          __suffix = __suffix + 1
                      }
                  }
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              __spill = if __complex { encode_json(value) } else { value }
              __residual = set!(__residual, [__key], __spill)
          }
      }
  }
  # Keep existing derived evidence, but remove null placeholders and mapped copies.
  # Source-derived aliases are replaced by canonical dotted source paths above.
  # Existing aggregates may contain sensitive descendants; the canonical source
  # spill above is the authoritative representation of containers. The cheap
  # conditions run first; the source value set is built on first use.
  __original_values = null
  for_each(flatten(__existing)) -> |key, value| {
      if !is_null(value) && value != "" && !is_array(value) && !is_object(value) && value != __raw_body && !match(downcase(key), r'password|secret|authorization|token') {
          # Members for the value itself and for to_string(value), as above.
          __json = encode_json(value)
          __as_json = "," + encode_json(__json)
          __as_string = __as_json
          if is_string(value) { __as_string = "," + __json } else if is_float(value) { __as_string = "," + encode_json(to_string!(value)) }
          if __original_values == null {
              # __source_kv may hold non-JSON types (a timestamp), so only an
              # integer or a boolean skips its to_string member here.
              __original_values = join!(map_values(values(flatten(__source_kv))) -> |source_value| {
                  __source_json = encode_json(source_value)
                  __tokens = "," + encode_json(__source_json)
                  if is_string(source_value) {
                      __tokens = __tokens + "," + __source_json
                  } else if !is_object(source_value) && !is_array(source_value) && !is_integer(source_value) && !is_boolean(source_value) {
                      __tokens = __tokens + "," + encode_json(to_string(source_value) ?? "")
                  }
                  __tokens
              }, "")
          }
          __source_set = string!(__original_values)
          __keep = !contains(__source_set, __as_json) && !contains(__source_set, __as_string)
          __keep = __keep && !contains(__represented, __as_json) && !contains(__represented, __as_string)
          # Only text opening an object or an array (after JSON whitespace)
          # decodes to a container.
          if __keep && is_string(value) && match(string!(value), r'^[ \t\n\r]*[\x5B\x7B]') {
              __decoded, __decode_err = parse_json(string!(value))
              __keep = !(__decode_err == null && (is_object(__decoded) || is_array(__decoded)))
          }
          if __keep {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, with recursive
  # redaction. These entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__safe.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

