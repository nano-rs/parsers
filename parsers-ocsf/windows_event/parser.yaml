name: windows_event_ocsf
display_name: Windows Event Log (OCSF)
version: "1.1.0"
description: >
  Parses Windows Security Event Log records (JSON; top-level event_id +
  event_data) into complete OCSF 1.8.0 records, routed by EventID:
    4624 Successful Logon       -> Authentication 3002 (Logon, Success)
    4625 Failed Logon           -> Authentication 3002 (Logon, Failure)
    4634 Logoff                 -> Authentication 3002 (Logoff)
    4672 Special Privileges     -> Authorize Session 3003 (Assign Privileges)
    4688 Process Creation       -> Process Activity 1007 (Launch)
  Emits the whole OCSF object on the root so it lands in ocsf_logs.event and the
  promoted columns materialize. Mirrors the UDM windows_event parser but targets
  OCSF instead of `.udm.*`.
match_values:
  - windows_event
category: endpoint
vendor: "Microsoft"
product: "Windows"
parser_vrl: |
  # Windows Security Event Log JSON -> OCSF 1.8.0. Emits the COMPLETE record on root.
  raw_log = string!(.message)
  parsed, err = parse_json(raw_log)

  if err != null || !is_object(parsed) {
      . = {
          "class_uid": 3002,
          "category_uid": 3,
          "activity_id": 99,
          "type_uid": 300299,
          "severity_id": 1,
          "status_id": 0,
          "time": 0,
          "message": raw_log,
          "metadata": {
              "version": "1.8.0",
              # NAN-3702: deterministic, so a redelivered unparseable record
              # dedupes in the lake instead of landing as a second row.
              "uid": sha2("windows_event|raw|" + raw_log, variant: "SHA-256"),
              "log_level": "error",
              "product": { "name": "Windows", "vendor_name": "Microsoft" }
          }
      }
  } else {
      p = object!(parsed)
      ed = object(p.event_data) ?? {}
      eid = to_int(p.event_id) ?? 0

      computer = downcase(string(p.computer) ?? string(p.host) ?? "")

      # human-readable Windows message if present, else the raw JSON
      msg = string(p.message) ?? ""
      if msg == "" { msg = raw_log }

      # ---- event time (top-level ISO8601) -> epoch ms ----
      time_ms = 0
      ts_str = string(p.timestamp) ?? ""
      if ts_str != "" {
          t, terr = parse_timestamp(ts_str, "%+")
          if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
      }

      ocsf = {}

      if eid == 4688 {
          # Process Creation -> Process Activity 1007 (Launch)
          npn = string(ed.NewProcessName) ?? ""
          proc_name = ""
          nm, nmerr = parse_regex(npn, r'(?P<b>[^\\/]+)$')
          if nmerr == null { proc_name = string(nm.b) ?? "" }
          ppn = string(ed.ParentProcessName) ?? ""
          parent_name = ""
          pm, pmerr = parse_regex(ppn, r'(?P<b>[^\\/]+)$')
          if pmerr == null { parent_name = string(pm.b) ?? "" }

          ocsf.class_uid = 1007
          ocsf.class_name = "Process Activity"
          ocsf.category_uid = 1
          ocsf.category_name = "System Activity"
          ocsf.activity_id = 1
          ocsf.activity_name = "Launch"
          # OCSF 1007: top-level `process` (REQUIRED) = the SUBJECT (the new
          # process); `actor.process` = the PARENT/initiator.
          ocsf.process = {
              "name": proc_name,
              "cmd_line": string(ed.CommandLine) ?? "",
              "pid": parse_int(string(ed.NewProcessId) ?? "0") ?? 0,
              "file": { "name": proc_name, "path": npn, "type_id": 1 }
          }
          ocsf.actor = {
              "process": { "name": parent_name, "file": { "name": parent_name, "path": ppn, "type_id": 1 } },
              "user": { "name": downcase(string(ed.SubjectUserName) ?? "") }
          }
          ocsf.user = {
              "name": downcase(string(ed.SubjectUserName) ?? ""),
              "domain": downcase(string(ed.SubjectDomainName) ?? ""),
              "uid": string(ed.SubjectUserSid) ?? ""
          }
          ocsf.device = { "hostname": computer }
          ocsf.status_id = 1
          ocsf.status = "Success"
          ocsf.severity_id = 1
          ocsf.severity = "Informational"
      } else if eid == 4672 {
          # Special Privileges Assigned -> Authorize Session 3003 (IAM),
          # activity 1 (Assign Privileges). Required: user + at_least_one of
          # (privileges, groups, iam_roles); we populate privileges from PrivilegeList.
          ocsf.class_uid = 3003
          ocsf.class_name = "Authorize Session"
          ocsf.category_uid = 3
          ocsf.category_name = "Identity & Access Management"
          ocsf.activity_id = 1
          ocsf.activity_name = "Assign Privileges"
          ocsf.status_id = 1
          ocsf.status = "Success"
          ocsf.severity_id = 1
          ocsf.severity = "Informational"
          ocsf.user = { "name": downcase(string(ed.SubjectUserName) ?? ""), "domain": downcase(string(ed.SubjectDomainName) ?? ""), "uid": string(ed.SubjectUserSid) ?? "" }
          priv_raw = strip_whitespace(string(ed.PrivilegeList) ?? "")
          privileges = []
          if priv_raw != "" { privileges = split(priv_raw, r'\s+') }
          ocsf.privileges = privileges
          ocsf.device = { "hostname": computer }
          ocsf.session = { "uid": string(ed.SubjectLogonId) ?? "" }
          ocsf.unmapped = { "windows_event_id": eid }
      } else {
          # Authentication family -> 3002
          ocsf.class_uid = 3002
          ocsf.class_name = "Authentication"
          ocsf.category_uid = 3
          ocsf.category_name = "Identity & Access Management"

          activity_id = 99
          activity_name = "Other"
          status_id = 1
          status_str = "Success"
          severity_id = 1
          severity = "Informational"
          if eid == 4624 { activity_id = 1; activity_name = "Logon" }
          if eid == 4625 { activity_id = 1; activity_name = "Logon"; status_id = 2; status_str = "Failure"; severity_id = 2; severity = "Low" }
          if eid == 4634 { activity_id = 2; activity_name = "Logoff" }

          # logon events carry the principal in Target*
          uname = string(ed.TargetUserName) ?? ""
          udom = string(ed.TargetDomainName) ?? ""
          usid = string(ed.TargetUserSid) ?? ""

          # auth package -> auth_protocol(_id)
          pkg = string(ed.AuthenticationPackageName) ?? ""
          pkg_l = downcase(pkg)
          auth_protocol_id = 0
          if pkg_l == "ntlm" { auth_protocol_id = 1 }
          if pkg_l == "kerberos" { auth_protocol_id = 2 }
          if pkg != "" && auth_protocol_id == 0 { auth_protocol_id = 99 }

          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          ocsf.status_id = status_id
          ocsf.status = status_str
          ocsf.severity_id = severity_id
          ocsf.severity = severity
          ocsf.user = { "name": downcase(uname), "domain": downcase(udom), "uid": usid }
          ocsf.is_mfa = false

          logon_id = string(ed.TargetLogonId) ?? string(ed.SubjectLogonId) ?? ""
          if logon_id != "" { ocsf.session = { "uid": logon_id } }
          if auth_protocol_id != 0 {
              ocsf.auth_protocol_id = auth_protocol_id
              ocsf.auth_protocol = pkg
          }

          # source endpoint (network logons carry IpAddress/IpPort/Workstation)
          ip = string(ed.IpAddress) ?? ""
          ws = string(ed.WorkstationName) ?? ""
          if ip != "" || ws != "" {
              ocsf.src_endpoint = {
                  "ip": downcase(ip),
                  "port": to_int(ed.IpPort) ?? 0,
                  "hostname": downcase(ws)
              }
          }
          # Authentication 3002 requires at_least_one(service, dst_endpoint):
          # the logon TARGET is the reporting machine.
          ocsf.dst_endpoint = { "hostname": computer }
          ocsf.device = { "hostname": computer }

          unmapped = { "windows_event_id": eid, "logon_type": string(ed.LogonType) ?? null }
          if eid == 4625 {
              unmapped.failure_reason = string(ed.FailureReason) ?? null
              unmapped.status = string(ed.Status) ?? null
              unmapped.sub_status = string(ed.SubStatus) ?? null
          }
          ocsf.unmapped = unmapped
      }

      # ---- common envelope ----
      ocsf.type_uid = to_int(ocsf.class_uid) * 100 + to_int(ocsf.activity_id)
      ocsf.time = time_ms
      ocsf.message = msg
      # NAN-1403: record_id arrives as an integer and string() errors on
      # integers; to_string coerces int → decimal string, string → itself,
      # null/absent → "".
      # NAN-3702: the lake drops a row whose (event hour, metadata.uid) it
      # already stored, so the uid must be the same every time the same record
      # arrives and must differ between records. A bare record_id is neither:
      # it is a per-host, per-channel sequence, so two hosts (or channels) emit
      # the same number in the same hour and all but one were dropped, and it
      # restarts after a log reset. The uid is therefore the host/channel/
      # provider/record/time composite (the same form as the ocsf-1.9 parser),
      # and record_id itself moves to original_event_uid. Without the parts of
      # the composite, the raw record is hashed, which a redelivery repeats
      # byte for byte.
      record_id = to_string(p.record_id) ?? ""
      log_name = downcase(string(p.channel) ?? "Security")
      log_provider = downcase(string(p.provider_name) ?? "Microsoft-Windows-Security-Auditing")
      record_uid = ""
      if record_id != "" && computer != "" && ts_str != "" {
          record_uid = join!(["windows_event", computer, log_name, log_provider, record_id, ts_str], "|")
      }
      if record_uid == "" { record_uid = sha2("windows_event|raw|" + raw_log, variant: "SHA-256") }
      ocsf.metadata = {
          "version": "1.8.0",
          "uid": record_uid,
          "log_name": string(p.channel) ?? "Security",
          "log_provider": string(p.provider_name) ?? "Microsoft-Windows-Security-Auditing",
          "product": { "name": "Windows", "vendor_name": "Microsoft" }
      }

      if record_id != "" { ocsf.metadata.original_event_uid = record_id }

      . = ocsf
  }
samples:
  # NAN-3702: host/channel/provider/record/time composite; record_id moves to original_event_uid.
  - raw: "{\"event_id\":4624,\"record_id\":12345,\"channel\":\"Security\",\"provider_name\":\"Microsoft-Windows-Security-Auditing\",\"computer\":\"DC-01.corp.local\",\"timestamp\":\"2026-08-18T11:00:00Z\",\"event_data\":{\"TargetUserName\":\"alice\",\"TargetDomainName\":\"CORP\",\"TargetUserSid\":\"S-1-5-21-1-2-3-1001\",\"TargetLogonId\":\"0x3e7abc\",\"LogonType\":\"10\",\"IpAddress\":\"10.2.3.4\",\"IpPort\":\"49152\",\"WorkstationName\":\"WKS-09\"}}"
    expect:
      "class_uid": 3002
      "metadata.uid": "windows_event|dc-01.corp.local|security|microsoft-windows-security-auditing|12345|2026-08-18T11:00:00Z"
      "metadata.original_event_uid": "12345"
  # NAN-3702: same record_id and hour on another host: a different uid, so it is not dropped as a duplicate.
  - raw: "{\"event_id\":4624,\"record_id\":12345,\"channel\":\"Security\",\"provider_name\":\"Microsoft-Windows-Security-Auditing\",\"computer\":\"DC-02.corp.local\",\"timestamp\":\"2026-08-18T11:00:00Z\",\"event_data\":{\"TargetUserName\":\"alice\",\"TargetDomainName\":\"CORP\",\"TargetUserSid\":\"S-1-5-21-1-2-3-1001\",\"TargetLogonId\":\"0x3e7abc\",\"LogonType\":\"10\",\"IpAddress\":\"10.2.3.4\",\"IpPort\":\"49152\",\"WorkstationName\":\"WKS-09\"}}"
    expect:
      "metadata.uid": "windows_event|dc-02.corp.local|security|microsoft-windows-security-auditing|12345|2026-08-18T11:00:00Z"
      "metadata.original_event_uid": "12345"
  # NAN-3702: no record_id: the raw record is hashed.
  - raw: "{\"event_id\":4624,\"channel\":\"Security\",\"provider_name\":\"Microsoft-Windows-Security-Auditing\",\"computer\":\"DC-01.corp.local\",\"timestamp\":\"2026-08-18T11:00:00Z\",\"event_data\":{\"TargetUserName\":\"alice\",\"TargetDomainName\":\"CORP\",\"TargetUserSid\":\"S-1-5-21-1-2-3-1001\",\"TargetLogonId\":\"0x3e7abc\",\"LogonType\":\"10\",\"IpAddress\":\"10.2.3.4\",\"IpPort\":\"49152\",\"WorkstationName\":\"WKS-09\"}}"
    expect:
      "class_uid": 3002
      "metadata.uid": "25d863b1c0098ba565cc4564709e98f8beb9705d00f2eaa51339ccf3bd72bb1a"
      "metadata.original_event_uid": "<missing>"
  # NAN-3702: unparseable record (error branch).
  - raw: "<Event xmlns=not-json/>"
    expect:
      "metadata.log_level": "error"
      "metadata.uid": "e5591ec6df8f7d202c9cc670f84216a0db177d70d3d56a26835322e8f52490f1"
