name: windows_event_ocsf
display_name: Windows Event Log (OCSF)
version: "1.1.0"
description: >
  Parses Windows Security Event Log records (JSON; top-level event_id +
  event_data) into complete OCSF 1.9.0 records, routed by EventID:
    4624 Successful Logon   -> Authentication 3002 (Logon, Success)
    4625 Failed Logon       -> Authentication 3002 (Logon, Failure)
    4634 Logoff             -> Authentication 3002 (Logoff)
    4672 Special Privileges -> Authorize Session 3003 (Assign Privileges)
    4688 Process Creation   -> Process Activity 1007 (Launch)
  Emits the whole OCSF object on the root so it lands in ocsf_logs.event and the
  promoted columns materialize. Carries metadata.profiles ["host"] because the
  `device` object is profile-bound in OCSF 1.9. Mirrors the UDM windows_event
  parser but targets OCSF instead of `.udm.*`.
ocsf_version: "1.9.0"
match_values:
  - windows_event
category: endpoint
vendor: "Microsoft"
product: "Windows"
parser_vrl: |
  # Windows Security Event Log JSON -> OCSF 1.9.0. Emits the COMPLETE record on root.
  raw_log = string!(.message)
  parsed, err = parse_json(raw_log)

  if err != null || !is_object(parsed) {
      . = {
          "class_uid": 3002,
          "category_uid": 3,
          "activity_id": 99,
          "type_uid": 300299,
          "severity_id": 1,
          "status_id": 0,
          "time": 0,
          "raw_data": raw_log,
          # 3002 requires `user` plus one of service/dst_endpoint, even on the
          # unparseable path.
          "user": { "name": "" },
          "dst_endpoint": { "hostname": "" },
          "metadata": {
              "version": "1.9.0",
              "profiles": ["host"],
              "uid": uuid_v4(),
              "log_level": "error",
              "product": { "name": "Windows", "vendor_name": "Microsoft" }
          }
      }
  } else {
      p = object!(parsed)
      ed = object(p.event_data) ?? {}
      eid = to_int(p.event_id) ?? 0

      computer = downcase(string(p.computer) ?? string(p.host) ?? "")

      # human-readable Windows message if present, else the raw JSON
      msg = string(p.message) ?? ""
      if msg == "" { msg = raw_log }

      # ---- event time (top-level ISO8601) -> epoch ms ----
      time_ms = 0
      ts_str = string(p.timestamp) ?? ""
      if ts_str != "" {
          t, terr = parse_timestamp(ts_str, "%+")
          if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
      }

      ocsf = {}

      if eid == 4688 {
          # Process Creation -> Process Activity 1007 (Launch)
          npn = string(ed.NewProcessName) ?? ""
          proc_name = ""
          nm, nmerr = parse_regex(npn, r'(?P<b>[^\\/]+)$')
          if nmerr == null { proc_name = string(nm.b) ?? "" }
          ppn = string(ed.ParentProcessName) ?? ""
          parent_name = ""
          pm, pmerr = parse_regex(ppn, r'(?P<b>[^\\/]+)$')
          if pmerr == null { parent_name = string(pm.b) ?? "" }

          ocsf.class_uid = 1007
          ocsf.class_name = "Process Activity"
          ocsf.category_uid = 1
          ocsf.category_name = "System Activity"
          ocsf.activity_id = 1
          ocsf.activity_name = "Launch"
          # OCSF 1007: top-level `process` (REQUIRED) = the SUBJECT (the new
          # process); `actor.process` = the PARENT/initiator.
          ocsf.process = {
              "name": proc_name,
              "cmd_line": string(ed.CommandLine) ?? "",
              "pid": parse_int(string(ed.NewProcessId) ?? "0") ?? 0,
              "file": { "name": proc_name, "path": npn, "type_id": 1 }
          }
          actor_user = {
              "name": downcase(string(ed.SubjectUserName) ?? ""),
              "domain": downcase(string(ed.SubjectDomainName) ?? ""),
              "uid": string(ed.SubjectUserSid) ?? ""
          }
          ocsf.actor = {
              "process": {
                  "name": parent_name,
                  "pid": parse_int(string(ed.ProcessId) ?? "0") ?? 0,
                  "file": { "name": parent_name, "path": ppn, "type_id": 1 }
              },
              "user": actor_user
          }
          ocsf.device = { "hostname": computer }
          ocsf.status_id = 1
          ocsf.status = "Success"
          ocsf.severity_id = 1
          ocsf.severity = "Informational"
      } else if eid == 4672 {
          # Special Privileges Assigned -> Authorize Session 3003 (IAM),
          # activity 1 (Assign Privileges). Required: user + at_least_one of
          # (privileges, groups, iam_roles); we populate privileges from PrivilegeList.
          ocsf.class_uid = 3003
          ocsf.class_name = "Authorize Session"
          ocsf.category_uid = 3
          ocsf.category_name = "Identity & Access Management"
          ocsf.activity_id = 1
          ocsf.activity_name = "Assign Privileges"
          ocsf.status_id = 1
          ocsf.status = "Success"
          ocsf.severity_id = 1
          ocsf.severity = "Informational"
          ocsf.user = { "name": downcase(string(ed.SubjectUserName) ?? ""), "domain": downcase(string(ed.SubjectDomainName) ?? ""), "uid": string(ed.SubjectUserSid) ?? "" }
          priv_raw = strip_whitespace(string(ed.PrivilegeList) ?? "")
          privileges = []
          if priv_raw != "" { privileges = split(priv_raw, r'\s+') }
          ocsf.privileges = privileges
          ocsf.device = { "hostname": computer }
          ocsf.session = { "uid": string(ed.SubjectLogonId) ?? "" }
      } else {
          # Authentication family -> 3002
          ocsf.class_uid = 3002
          ocsf.class_name = "Authentication"
          ocsf.category_uid = 3
          ocsf.category_name = "Identity & Access Management"

          activity_id = 99
          activity_name = "Other"
          status_id = 1
          status_str = "Success"
          severity_id = 1
          severity = "Informational"
          if eid == 4624 { activity_id = 1; activity_name = "Logon" }
          if eid == 4625 { activity_id = 1; activity_name = "Logon"; status_id = 2; status_str = "Failure"; severity_id = 2; severity = "Low" }
          if eid == 4634 { activity_id = 2; activity_name = "Logoff" }

          # logon events carry the principal in Target*
          uname = string(ed.TargetUserName) ?? ""
          udom = string(ed.TargetDomainName) ?? ""
          usid = string(ed.TargetUserSid) ?? ""

          # auth package -> auth_protocol(_id)
          pkg = string(ed.AuthenticationPackageName) ?? ""
          pkg_l = downcase(pkg)
          auth_protocol_id = 0
          if pkg_l == "ntlm" { auth_protocol_id = 1 }
          if pkg_l == "kerberos" { auth_protocol_id = 2 }
          if pkg != "" && auth_protocol_id == 0 { auth_protocol_id = 99 }

          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          ocsf.status_id = status_id
          ocsf.status = status_str
          ocsf.severity_id = severity_id
          ocsf.severity = severity
          ocsf.user = { "name": downcase(uname), "domain": downcase(udom), "uid": usid }
          logon_id = string(ed.TargetLogonId) ?? string(ed.SubjectLogonId) ?? ""
          if logon_id != "" { ocsf.session = { "uid": logon_id } }
          if auth_protocol_id != 0 {
              ocsf.auth_protocol_id = auth_protocol_id
              ocsf.auth_protocol = pkg
          }

          # source endpoint (network logons carry IpAddress/IpPort/Workstation)
          ip = string(ed.IpAddress) ?? ""
          ws = string(ed.WorkstationName) ?? ""
          if ip != "" || ws != "" {
              ocsf.src_endpoint = {
                  "ip": downcase(ip),
                  "port": to_int(ed.IpPort) ?? 0,
                  "hostname": downcase(ws)
              }
          }
          # Authentication 3002 requires at_least_one(service, dst_endpoint):
          # the logon TARGET is the reporting machine.
          ocsf.dst_endpoint = { "hostname": computer }
          ocsf.device = { "hostname": computer }

          logon_type_raw = string(ed.LogonType) ?? ""
          logon_type_id = to_int(ed.LogonType) ?? 0
          logon_type = "Unknown"
          if logon_type_id == 1 { logon_type = "System" }
          if logon_type_id == 2 { logon_type = "Interactive" }
          if logon_type_id == 3 { logon_type = "Network" }
          if logon_type_id == 4 { logon_type = "Batch" }
          if logon_type_id == 5 { logon_type = "OS Service" }
          if logon_type_id == 7 { logon_type = "Unlock" }
          if logon_type_id == 8 { logon_type = "Network Cleartext" }
          if logon_type_id == 9 { logon_type = "New Credentials" }
          if logon_type_id == 10 { logon_type = "Remote Interactive" }
          if logon_type_id == 11 { logon_type = "Cached Interactive" }
          if logon_type_id == 12 { logon_type = "Cached Remote Interactive" }
          if logon_type_id == 13 { logon_type = "Cached Unlock" }
          if logon_type_raw != "" {
              if logon_type_id != 1 && logon_type_id != 2 && logon_type_id != 3 && logon_type_id != 4 && logon_type_id != 5 && logon_type_id != 7 && logon_type_id != 8 && logon_type_id != 9 && logon_type_id != 10 && logon_type_id != 11 && logon_type_id != 12 && logon_type_id != 13 {
                  logon_type_id = 99
                  logon_type = logon_type_raw
              }
              ocsf.logon_type_id = logon_type_id
              ocsf.logon_type = logon_type
              ocsf.is_remote = logon_type_id == 3 || logon_type_id == 8 || logon_type_id == 10 || logon_type_id == 12
              ocsf.is_cleartext = logon_type_id == 8
          }

          if eid == 4625 {
              ocsf.status_code = string(ed.Status) ?? ""
              ocsf.status_detail = string(ed.FailureReason) ?? ""
              ocsf.unmapped = { "sub_status": string(ed.SubStatus) ?? null }
          }
      }

      # ---- common envelope ----
      ocsf.type_uid = to_int(ocsf.class_uid) * 100 + to_int(ocsf.activity_id)
      ocsf.time = time_ms
      ocsf.message = msg
      ocsf.raw_data = raw_log
      # Windows record_id is only unique within a host/channel stream and can be
      # reused after a log reset. Include the source event time so replaying the
      # same event stays idempotent while a later reused RecordID cannot collide.
      record_id = to_string(p.record_id) ?? ""
      log_name = downcase(string(p.channel) ?? "Security")
      log_provider = downcase(string(p.provider_name) ?? "Microsoft-Windows-Security-Auditing")
      record_uid = ""
      if record_id != "" && computer != "" && ts_str != "" {
          record_uid = join!(["windows_event", computer, log_name, log_provider, record_id, ts_str], "|")
      }
      if record_uid == "" { record_uid = uuid_v4() }
      if is_object(ocsf.device) { ocsf.device.type_id = 0 }
      ocsf.metadata = {
          "version": "1.9.0",
          "profiles": ["host"],
          "uid": record_uid,
          "original_event_uid": record_uid,
          "event_code": to_string(eid),
          "log_name": string(p.channel) ?? "Security",
          "log_provider": string(p.provider_name) ?? "Microsoft-Windows-Security-Auditing",
          "product": { "name": "Windows", "vendor_name": "Microsoft" }
      }

      . = ocsf
  }
samples:
  - raw: "{\"event_id\":4624,\"record_id\":5001,\"channel\":\"Security\",\"provider_name\":\"Microsoft-Windows-Security-Auditing\",\"computer\":\"DC-01.corp.local\",\"timestamp\":\"2026-08-18T11:00:00Z\",\"message\":\"An account was successfully logged on.\",\"event_data\":{\"TargetUserName\":\"alice\",\"TargetDomainName\":\"CORP\",\"TargetUserSid\":\"S-1-5-21-1-2-3-1001\",\"TargetLogonId\":\"0x3e7abc\",\"SubjectUserName\":\"DC-01$\",\"LogonType\":\"10\",\"AuthenticationPackageName\":\"Kerberos\",\"IpAddress\":\"10.2.3.4\",\"IpPort\":\"49152\",\"WorkstationName\":\"WKS-09\",\"LogonProcessName\":\"Kerberos\"}}"
    expect:
      "class_uid": 3002
      "activity_id": 1
      "metadata.version": "1.9.0"
  - raw: "{\"event_id\":4625,\"record_id\":5002,\"computer\":\"DC-01\",\"timestamp\":\"2026-08-18T11:01:00Z\",\"event_data\":{\"TargetUserName\":\"admin\",\"TargetDomainName\":\"CORP\",\"LogonType\":\"3\",\"AuthenticationPackageName\":\"NTLM\",\"IpAddress\":\"203.0.113.9\",\"IpPort\":\"445\",\"Status\":\"0xC000006D\",\"SubStatus\":\"0xC000006A\",\"FailureReason\":\"Unknown user name or bad password\",\"WorkstationName\":\"EVIL\"}}"
    expect:
      "class_uid": 3002
      "activity_id": 1
      "metadata.version": "1.9.0"
  - raw: "{\"event_id\":4634,\"record_id\":5003,\"computer\":\"DC-01\",\"timestamp\":\"2026-08-18T11:02:00Z\",\"event_data\":{\"TargetUserName\":\"alice\",\"TargetDomainName\":\"CORP\",\"TargetLogonId\":\"0x3e7abc\",\"LogonType\":\"2\"}}"
    expect:
      "class_uid": 3002
      "activity_id": 2
      "metadata.version": "1.9.0"
  - raw: "{\"event_id\":4672,\"record_id\":5004,\"computer\":\"DC-01\",\"timestamp\":\"2026-08-18T11:03:00Z\",\"event_data\":{\"SubjectUserName\":\"admin\",\"SubjectDomainName\":\"CORP\",\"SubjectUserSid\":\"S-1-5-21-1-2-3-500\",\"SubjectLogonId\":\"0x3e7abd\",\"PrivilegeList\":\"SeDebugPrivilege SeTcbPrivilege\"}}"
    expect:
      "class_uid": 3003
      "activity_id": 1
      "metadata.version": "1.9.0"
  - raw: "{\"event_id\":4688,\"record_id\":5005,\"computer\":\"WKS-09\",\"timestamp\":\"2026-08-18T11:04:00Z\",\"event_data\":{\"NewProcessName\":\"C:\\\\Windows\\\\System32\\\\powershell.exe\",\"NewProcessId\":\"0x1a4\",\"ProcessId\":\"0x2b8\",\"ParentProcessName\":\"C:\\\\Windows\\\\explorer.exe\",\"CommandLine\":\"powershell -enc AAA\",\"SubjectUserName\":\"alice\",\"SubjectDomainName\":\"CORP\",\"SubjectUserSid\":\"S-1-5-21-1-2-3-1001\"}}"
    expect:
      "class_uid": 1007
      "activity_id": 1
      "metadata.version": "1.9.0"
  - raw: "<Event xmlns=not-json/>"
    expect:
      "class_uid": 3002
      "activity_id": 99
      "metadata.version": "1.9.0"
  - raw: "{\"event_id\":4776,\"record_id\":5006,\"computer\":\"DC-01\",\"timestamp\":\"2026-08-18T11:05:00Z\",\"event_data\":{\"TargetUserName\":\"bob\"}}"
    expect:
      "class_uid": 3002
      "activity_id": 99
      "metadata.version": "1.9.0"
