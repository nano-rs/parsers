source: json
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  '@timestamp':
  - time
  _document_id:
  - metadata.original_event_uid
  - metadata.uid
  action:
  - api.operation
  - message
  - metadata.event_code
  actor:
  - actor.user.name
  - user.name
  actor_id:
  - actor.user.uid
  - user.uid
  actor_ip:
  - src_endpoint.ip
  actor_location.country_code:
  - src_endpoint.location.country
  business:
  - resources.name
  org:
  - resources.name
  org_id:
  - resources.uid
  permission:
  - privileges
  repository:
  - resources.name
  team:
  - group.name
  user:
  - user.name
  user_id:
  - user.uid
