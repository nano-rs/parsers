source: json
transforms:
- source: Datetime
  kind: epoch_ms
  target: time
  reason: RFC 3339 Logpush clock converted to event milliseconds.
- source: Datetime
  kind: scale
  factor: 1000
  target: time
  reason: Unix-seconds Logpush clock converted to event milliseconds.
- source: CreatedAt
  kind: epoch_ms
  target: time
  reason: RFC 3339 Access clock converted to event milliseconds.
- source: CreatedAt
  kind: scale
  factor: 1000
  target: time
  reason: Unix-seconds Access clock converted to event milliseconds.
- source: QueryName
  kind: lowercase
  target: query.hostname
  reason: Query name lowercased into query.hostname.
- source: HTTPHost
  kind: lowercase
  target: dst_endpoint.hostname
  reason: Host lowercased into http_request.url.hostname and dst_endpoint.hostname.
- source: HTTPHost
  kind: lowercase
  target: http_request.url.hostname
  reason: Host lowercased into http_request.url.hostname and dst_endpoint.hostname.
- source: SNI
  kind: lowercase
  target: dst_endpoint.hostname
  reason: SNI lowercased into dst_endpoint.hostname.
- source: Action
  kind: enum
  target: action_id
  values:
    allow: 1
    allowedonnorulematch: 1
    block: 2
    login: 1
  reason: Gateway / Access verdict normalized to the OCSF action; consume only when the expected ID is
    emitted.
- source: ResolverDecision
  kind: enum
  target: action_id
  values:
    allowedonnopolicymatch: 1
    allowedbyqueryname: 1
    allowedbyanswername: 1
    blockedrule: 2
    blockedbycategory: 2
    blockedalwayscategory: 2
  reason: Resolver decision normalized to the OCSF action; consume only when the expected ID is emitted.
- source: Transport
  kind: enum
  target: connection_info.protocol_num
  values:
    tcp: 6
    udp: 17
    icmp: 1
  reason: Transport name normalized to the IANA protocol number.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  AccountID:
  - metadata.tenant_uid
  AppDomain:
  - dst_endpoint.hostname
  - service.name
  AppUUID:
  - service.uid
  BlockedFileHash:
  - file.hashes.value
  BlockedFileName:
  - file.name
  BlockedFileSize:
  - file.size
  DestinationIP:
  - dst_endpoint.ip
  DestinationIPCountryCode:
  - dst_endpoint.location.country
  DestinationPort:
  - dst_endpoint.port
  DeviceID:
  - device.uid
  DeviceName:
  - device.hostname
  - device.name
  - src_endpoint.hostname
  DstIP:
  - dst_endpoint.ip
  DstPort:
  - dst_endpoint.port
  Email:
  - actor.user.email_addr
  - actor.user.name
  - user.email_addr
  - user.name
  HTTPHost:
  - dst_endpoint.hostname
  - http_request.url.hostname
  HTTPMethod:
  - http_request.http_method
  HTTPStatusCode:
  - http_response.code
  - http_status
  HTTPVersion:
  - http_request.version
  IPAddress:
  - src_endpoint.ip
  PolicyID:
  - firewall_rule.uid
  PolicyName:
  - firewall_rule.name
  Policy:
  - firewall_rule.name
  Protocol:
  - app_name
  QueryName:
  - query.hostname
  QuerySize:
  - traffic.bytes_out
  QueryTypeName:
  - query.type
  RCode:
  - rcode_id
  RayID:
  - metadata.correlation_uid
  Referer:
  - http_request.referrer
  RequestID:
  - http_request.uid
  - metadata.correlation_uid
  ResolvedIPs:
  - answers.rdata
  SNI:
  - dst_endpoint.hostname
  SessionID:
  - connection_info.uid
  - metadata.correlation_uid
  SourceIP:
  - src_endpoint.ip
  SourceIPCountryCode:
  - src_endpoint.location.country
  SourceInternalIP:
  - device.ip
  SourcePort:
  - src_endpoint.port
  SrcIP:
  - src_endpoint.ip
  URL:
  - http_request.url.url_string
  UserAgent:
  - http_request.user_agent
  UserID:
  - actor.user.uid
  UserUID:
  - user.uid
