name: cloudflare_zero_trust_ocsf
display_name: Cloudflare Zero Trust (OCSF)
version: "1.0.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses Cloudflare Zero Trust Logpush JSON (one record per line) into OCSF
  1.9.0. The dataset is recognized from its fields: Gateway DNS
  (QueryName + ResolverDecision) becomes DNS Activity (4003) Response with
  the resolver decision as action, Gateway HTTP (HTTPMethod / HTTPHost)
  becomes HTTP Activity (4002), Gateway Network (Transport / SNI) becomes
  Network Activity (4001), and Access requests (AppDomain / AppUUID) become
  Authentication (3002) with Allowed driving the status. The Gateway user
  (Email / UserID) is the actor, the WARP device is `device`, the matched
  Gateway policy is firewall_rule, and RayID / RequestID / SessionID become
  correlation ids. A blocked malicious file download is High severity.
  Datetime / CreatedAt are accepted as RFC 3339, Unix seconds or Unix
  nanoseconds. This is a separate source type from `cloudflare` (zone
  HTTP / firewall / DNS Logpush), so both can be deployed side by side.
  JSON that matches no Zero Trust dataset becomes Base Event marked with
  unmapped.parse_fallback.
match_values:
  - cloudflare_zero_trust
category: network
vendor: "Cloudflare"
product: "Cloudflare Zero Trust"
parser_vrl: |
  # NAN source timezone. Generated by scripts/residual_spill.py; edit scripts/residual/source_tz.vrl.
  # The log source's timezone setting arrives as .nano.source_timezone (an IANA
  # name such as "America/New_York", or any fixed offset such as "+05:30"), set
  # by nano at ingest. .nano is nano's input, never part of the log: it is
  # removed whole before anything else, whatever its shape.
  # For a clock that carries no offset a parser parses it AS UTC and sets
  # __lc_pending; the generated local-clock block that follows the parse
  # (local_clock.vrl) turns it into real UTC with this setting, and the spill
  # records the zone used as unmapped.nano_time_assumed_tz (the name, the offset
  # as +HH:MM, or "UTC" when the setting is absent, invalid or "local").
  __src_nano = del(.nano)
  __src_tz_in = ""
  if is_object(__src_nano) { __src_tz_in = strip_whitespace(to_string(object!(__src_nano).source_timezone) ?? "") }
  __src_tz = "UTC"
  __src_shift_ms = 0
  __src_tz_label = "UTC"
  __time_assumed = false
  __time_inline = false
  __lc_pending = false
  # No parse_* decoder here: nano infers a parser's input contract from the first
  # decoder in its program (parse_json first = a JSON-input parser, handed the
  # whole HEC / OTLP object). This prelude opens every parser, so a decoder in it
  # would turn every JSON-input parser into a text one. match + slice instead.
  if match(__src_tz_in, r'^[+-]\d{2}:?\d{2}$') {
      __src_sign = slice(__src_tz_in, 0, 1) ?? "+"
      __src_digits = replace(slice(__src_tz_in, 1) ?? "", ":", "")
      __src_hh = slice(__src_digits, 0, 2) ?? "99"
      __src_mm = slice(__src_digits, 2, 4) ?? "99"
      __src_h = to_int(__src_hh) ?? 99
      __src_m = to_int(__src_mm) ?? 99
      if __src_h <= 14 && __src_m <= 59 {
          __src_shift_ms = (__src_h * 3600 + __src_m * 60) * 1000
          if __src_sign == "-" { __src_shift_ms = 0 - __src_shift_ms }
          if __src_shift_ms != 0 { __src_tz_label = __src_sign + __src_hh + ":" + __src_mm }
      }
  } else if __src_tz_in != "" && downcase(__src_tz_in) != "local" {
      # "local" (the Vector host's zone) would make the time depend on the host.
      __src_probe, __src_probe_err = parse_timestamp("2000-01-01 00:00:00", "%Y-%m-%d %H:%M:%S", timezone: __src_tz_in)
      if __src_probe_err == null { __src_tz = __src_tz_in; __src_tz_label = __src_tz_in }
  }
  # END NAN source timezone
  # nano's input contract (nanosiem hec_payload.rs), stated: JSON. From nano
  # v2.0.36 a declared parser gets an HEC object event's whole record, as
  # /ingest does; undeclared it gets the v2.0.35 HEC delivery (NAN-5902).
  # nano:input=json
  # Cloudflare Zero Trust Logpush -> OCSF 1.9.0 DNS Activity (4003) /
  # HTTP Activity (4002) / Network Activity (4001) / Authentication (3002)
  raw_log = if is_string(.message) { string!(.message) } else { encode_json(.) }
  __raw_body = raw_log
  __source_kv = {}

  p, perr = parse_json(raw_log)
  ok = perr == null && is_object(p)
  if ok { __source_kv = object!(p) } else { p = {} }

  dataset = ""
  if ok {
      if exists(p.QueryName) && (exists(p.ResolverDecision) || exists(p.QueryTypeName)) {
          dataset = "dns"
      } else if exists(p.HTTPMethod) || exists(p.HTTPHost) {
          dataset = "http"
      } else if exists(p.AppDomain) || exists(p.AppUUID) {
          dataset = "access"
      } else if exists(p.Transport) || exists(p.SNI) {
          dataset = "network"
      }
  }

  # ---- event clock: RFC 3339, Unix seconds or Unix nanoseconds ----
  time_ms = to_int(to_unix_timestamp(now(), unit: "milliseconds"))
  ts_raw = p.Datetime
  if ts_raw == null { ts_raw = p.CreatedAt }
  if is_string(ts_raw) && match(string!(ts_raw), r'^\d+$') { ts_raw = to_int(ts_raw) ?? ts_raw }
  if is_integer(ts_raw) {
      n = int!(ts_raw)
      if n > 100000000000000000 {
          time_ms = to_int(n * 0.000001)
      } else if n > 100000000000 {
          time_ms = n
      } else {
          time_ms = n * 1000
      }
  } else if is_string(ts_raw) {
      t, te = parse_timestamp(string!(ts_raw), "%+", timezone: "UTC")
      if te == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
  }

  metadata = {
      "version": "1.9.0",
      "uid": sha2("cloudflare_zero_trust|raw|" + raw_log, variant: "SHA-256"),
      "profiles": ["host", "security_control"],
      "log_name": "cloudflare_zero_trust",
      "product": { "name": "Cloudflare Zero Trust", "vendor_name": "Cloudflare" }
  }
  if dataset == "dns" { metadata.log_name = "gateway_dns" }
  if dataset == "http" { metadata.log_name = "gateway_http" }
  if dataset == "network" { metadata.log_name = "gateway_network" }
  if dataset == "access" { metadata.log_name = "access_requests" }
  corr = string(p.RayID) ?? string(p.RequestID) ?? string(p.SessionID) ?? ""
  if corr != "" { metadata.correlation_uid = corr }
  acct = string(p.AccountID) ?? ""
  if acct != "" { metadata.tenant_uid = acct }

  # ---- Gateway user and WARP device ----
  usr = {}
  em = string(p.Email) ?? ""
  if em != "" { usr.email_addr = em; usr.name = em }
  uid = string(p.UserID) ?? string(p.UserUID) ?? ""
  if uid != "" { usr.uid = uid }
  device = {}
  dn = string(p.DeviceName) ?? ""
  if dn != "" { device.name = dn; device.hostname = dn }
  did = string(p.DeviceID) ?? ""
  if did != "" { device.uid = did }
  sint = string(p.SourceInternalIP) ?? ""
  if sint != "" { device.ip = sint }
  if length(device) > 0 { device.type_id = 0; device.type = "Unknown" }

  rule = {}
  pid = string(p.PolicyID) ?? ""
  if pid != "" { rule.uid = pid }
  pname = string(p.PolicyName) ?? string(p.Policy) ?? ""
  if pname != "" { rule.name = pname }

  # ---- verdict ----
  verdict = downcase(string(p.Action) ?? string(p.ResolverDecision) ?? "")
  if dataset == "dns" { verdict = downcase(string(p.ResolverDecision) ?? "") }
  action_id = 0
  action = "Unknown"
  disposition_id = 0
  disposition = "Unknown"
  if starts_with(verdict, "allow") || verdict == "on" || verdict == "noscan" {
      action_id = 1; action = "Allowed"; disposition_id = 1; disposition = "Allowed"
  } else if starts_with(verdict, "block") || verdict == "off" {
      action_id = 2; action = "Denied"; disposition_id = 2; disposition = "Blocked"
  } else if contains(verdict, "override") || contains(verdict, "safesearch") || verdict == "isolate" || verdict == "redirect" {
      action_id = 4; action = "Modified"; disposition_id = 7; disposition = "Custom Action"
  }
  severity_id = 1
  severity = "Informational"
  if action_id == 2 { severity_id = 2; severity = "Low" }

  base = {
      "time": time_ms,
      "raw_data": raw_log,
      "metadata": metadata,
      "action_id": action_id, "action": action,
      "disposition_id": disposition_id, "disposition": disposition
  }

  if dataset == "dns" {
      # ================= Gateway DNS (4003) =================
      rc = to_int(p.RCode) ?? -1
      rcodes = ["NoError", "FormError", "ServError", "NXDomain", "NotImp", "Refused"]
      cats = array(p.MatchedCategoryNames) ?? []
      if action_id == 2 && (includes(cats, "Malware") || includes(cats, "Phishing") || includes(cats, "Command and Control & Botnet") || includes(cats, "Spyware")) {
          severity_id = 4; severity = "High"
      }
      . = merge(base, {
          "class_uid": 4003, "class_name": "DNS Activity",
          "category_uid": 4, "category_name": "Network Activity",
          "activity_id": 2, "activity_name": "Response",
          "type_uid": 400302,
          "severity_id": severity_id, "severity": severity,
          "query": { "hostname": replace(downcase(string(p.QueryName) ?? ""), r'\.$', "") }
      })
      qtn = string(p.QueryTypeName) ?? ""
      if qtn != "" { .query.type = qtn }
      qsz = to_int(p.QuerySize) ?? 0
      if qsz > 0 { .traffic = { "bytes_out": qsz } }
      if rc >= 0 {
          .rcode_id = if rc <= 5 { rc } else { 99 }
          .rcode = if rc <= 5 { string(get(rcodes, [rc]) ?? "Other") ?? "Other" } else { to_string(rc) }
          if rc == 0 { .status_id = 1; .status = "Success" } else { .status_id = 2; .status = "Failure" }
      }
      ans = []
      for_each(array(p.ResolvedIPs) ?? []) -> |_i, ip| {
          ans = push(ans, { "rdata": ip })
      }
      if length(ans) > 0 { .answers = ans }
      src = {}
      sip = string(p.SrcIP) ?? ""
      if sip != "" { src.ip = sip }
      sp = to_int(p.SrcPort) ?? 0
      if sp > 0 { src.port = sp }
      dst = { "svc_name": "dns" }
      dip = string(p.DstIP) ?? ""
      if dip != "" { dst.ip = dip }
      dp = to_int(p.DstPort) ?? 0
      if dp > 0 { dst.port = dp }
      # A WARP client egressing without a reported IP is still identified by its device.
      if !exists(src.ip) && dn != "" { src.hostname = dn }
      if exists(src.ip) || exists(src.hostname) { .src_endpoint = src }
      .dst_endpoint = dst
      proto = downcase(string(p.Protocol) ?? "")
      if proto != "" { .app_name = proto }
  } else if dataset == "http" {
      # ================= Gateway HTTP (4002) =================
      method = upcase(string(p.HTTPMethod) ?? "")
      acts = { "CONNECT": 1, "DELETE": 2, "GET": 3, "HEAD": 4, "OPTIONS": 5, "POST": 6, "PUT": 7, "TRACE": 8, "PATCH": 9 }
      activity_id = int(get(acts, [method]) ?? 99) ?? 99
      names = { "1": "Connect", "2": "Delete", "3": "Get", "4": "Head", "5": "Options", "6": "Post", "7": "Put", "8": "Trace", "9": "Patch" }
      activity_name = string(get(names, [to_string(activity_id)]) ?? "Other") ?? "Other"
      bfr = downcase(string(p.BlockedFileReason) ?? "")
      if action_id == 2 && bfr == "malware" { severity_id = 4; severity = "High" }
      code = to_int(p.HTTPStatusCode) ?? 0
      url = {}
      us = string(p.URL) ?? ""
      if us != "" { url.url_string = us }
      hh = downcase(string(p.HTTPHost) ?? "")
      if hh != "" { url.hostname = hh }
      if !exists(url.url_string) { url.path = "/" }
      req = { "url": url }
      if method != "" { req.http_method = method }
      ua = string(p.UserAgent) ?? ""
      if ua != "" { req.user_agent = ua }
      ref = string(p.Referer) ?? ""
      if ref != "" { req.referrer = ref }
      ver = string(p.HTTPVersion) ?? ""
      if ver != "" { req.version = ver }
      rid = string(p.RequestID) ?? ""
      if rid != "" { req.uid = rid }
      . = merge(base, {
          "class_uid": 4002, "class_name": "HTTP Activity",
          "category_uid": 4, "category_name": "Network Activity",
          "activity_id": activity_id, "activity_name": activity_name,
          "type_uid": 400200 + activity_id,
          "severity_id": severity_id, "severity": severity,
          "http_request": req
      })
      if code > 0 {
          .http_response = { "code": code }
          .http_status = code
          if code < 400 { .status_id = 1; .status = "Success" } else { .status_id = 2; .status = "Failure" }
      }
      # A Gateway block answers with a redirect to the block page; the request failed.
      if action_id == 2 { .status_id = 2; .status = "Failure" }
      src = {}
      sip = string(p.SourceIP) ?? ""
      if sip != "" { src.ip = sip }
      sp = to_int(p.SourcePort) ?? 0
      if sp > 0 { src.port = sp }
      scc = string(p.SourceIPCountryCode) ?? ""
      if scc != "" { src.location = { "country": scc } }
      dst = {}
      dip = string(p.DestinationIP) ?? ""
      if dip != "" { dst.ip = dip }
      dp = to_int(p.DestinationPort) ?? 0
      if dp > 0 { dst.port = dp }
      if hh != "" { dst.hostname = hh }
      dcc = string(p.DestinationIPCountryCode) ?? ""
      if dcc != "" { dst.location = { "country": dcc } }
      # A WARP client egressing without a reported IP is still identified by its device.
      if !exists(src.ip) && dn != "" { src.hostname = dn }
      if exists(src.ip) || exists(src.hostname) { .src_endpoint = src }
      if length(dst) > 0 { .dst_endpoint = dst }
      bfn = string(p.BlockedFileName) ?? ""
      if bfn != "" {
          f = { "name": bfn, "type_id": 1, "type": "Regular File" }
          bsz = to_int(p.BlockedFileSize) ?? 0
          if bsz > 0 { f.size = bsz }
          bfh = string(p.BlockedFileHash) ?? ""
          if match(bfh, r'^[0-9A-Fa-f]{64}$') {
              f.hashes = [{ "algorithm_id": 3, "algorithm": "SHA-256", "value": downcase(bfh) }]
          } else if bfh != "" {
              f.hashes = [{ "algorithm_id": 99, "algorithm": "Other", "value": bfh }]
          }
          .file = f
      }
  } else if dataset == "network" {
      # ================= Gateway Network (4001) =================
      activity_id = 6
      activity_name = "Traffic"
      if action_id == 2 { activity_id = 5; activity_name = "Refuse" }
      nstatus_id = 0
      nstatus = "Unknown"
      if action_id == 1 { nstatus_id = 1; nstatus = "Success" }
      if action_id == 2 { nstatus_id = 2; nstatus = "Failure" }
      . = merge(base, {
          "class_uid": 4001, "class_name": "Network Activity",
          "category_uid": 4, "category_name": "Network Activity",
          "activity_id": activity_id, "activity_name": activity_name,
          "type_uid": 400100 + activity_id,
          "severity_id": severity_id, "severity": severity,
          "status_id": nstatus_id, "status": nstatus
      })
      src = {}
      sip = string(p.SourceIP) ?? ""
      if sip != "" { src.ip = sip }
      sp = to_int(p.SourcePort) ?? 0
      if sp > 0 { src.port = sp }
      dst = {}
      dip = string(p.DestinationIP) ?? ""
      if dip != "" { dst.ip = dip }
      dp = to_int(p.DestinationPort) ?? 0
      if dp > 0 { dst.port = dp }
      sni = downcase(string(p.SNI) ?? "")
      if sni != "" { dst.hostname = sni }
      # A WARP client egressing without a reported IP is still identified by its device.
      if !exists(src.ip) && dn != "" { src.hostname = dn }
      if exists(src.ip) || exists(src.hostname) { .src_endpoint = src }
      if length(dst) > 0 { .dst_endpoint = dst }
      tr = downcase(string(p.Transport) ?? "")
      conn = { "direction_id": 2 }
      if tr == "tcp" { conn.protocol_num = 6; conn.protocol_name = "tcp" }
      if tr == "udp" { conn.protocol_num = 17; conn.protocol_name = "udp" }
      if tr == "icmp" { conn.protocol_num = 1; conn.protocol_name = "icmp" }
      ssid = string(p.SessionID) ?? ""
      if ssid != "" { conn.uid = ssid }
      .connection_info = conn
  } else if dataset == "access" {
      # ================= Access requests (3002) =================
      act = downcase(string(p.Action) ?? "")
      activity_id = 99
      activity_name = "Other"
      if act == "login" || act == "sso" { activity_id = 1; activity_name = "Logon" }
      if act == "logout" { activity_id = 2; activity_name = "Logoff" }
      allowed = p.Allowed
      status_id = 0
      status_str = "Unknown"
      if allowed == true {
          status_id = 1; status_str = "Success"
          action_id = 1; action = "Allowed"; disposition_id = 1; disposition = "Allowed"
      } else if allowed == false {
          status_id = 2; status_str = "Failure"
          action_id = 2; action = "Denied"; disposition_id = 2; disposition = "Blocked"
          severity_id = 2; severity = "Low"
      }
      if length(usr) == 0 { usr.name = "unknown" }
      . = merge(base, {
          "class_uid": 3002, "class_name": "Authentication",
          "category_uid": 3, "category_name": "Identity & Access Management",
          "activity_id": activity_id, "activity_name": activity_name,
          "type_uid": 300200 + activity_id,
          "severity_id": severity_id, "severity": severity,
          "status_id": status_id, "status": status_str,
          "action_id": action_id, "action": action,
          "disposition_id": disposition_id, "disposition": disposition,
          "user": usr,
          "is_remote": true
      })
      svc = {}
      ad = string(p.AppDomain) ?? ""
      if ad != "" { svc.name = ad }
      au = string(p.AppUUID) ?? ""
      if au != "" { svc.uid = au }
      if length(svc) > 0 { .service = svc }
      src = {}
      ipa = string(p.IPAddress) ?? ""
      if ipa != "" { src.ip = ipa }
      cc = string(p.Country) ?? ""
      if cc != "" { src.location = { "country": upcase(cc) } }
      if length(src) > 0 && exists(src.ip) { .src_endpoint = src }
      if ad != "" { .dst_endpoint = { "hostname": downcase(string(get(split(ad, "/"), [0]) ?? ad) ?? ad) } }
  } else {
      . = merge(base, {
          "class_uid": 0, "class_name": "Base Event",
          "category_uid": 0, "category_name": "Uncategorized",
          "activity_id": 99, "activity_name": "Other",
          "type_uid": 99,
          "severity_id": 1, "severity": "Informational",
          "status_id": 0, "status": "Unknown"
      })
      if ok {
          . = set!(., ["unmapped", "parse_fallback"], "unrecognized Zero Trust dataset")
      } else {
          . = set!(., ["unmapped", "parse_fallback"], "unparsable input")
      }
  }

  if dataset != "" && dataset != "access" && length(usr) > 0 { .actor = { "user": usr } }
  if dataset == "access" && length(device) > 0 { .device = device }
  if dataset != "" && dataset != "access" && length(device) > 0 { .device = device }
  if dataset != "" && length(rule) > 0 { .firewall_rule = rule }

  .

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # Values spill exactly as parsed: a parser never masks, redacts or withholds
  # anything (masking is an opt-in pipeline step, never a parser concern).
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # A source field is consumed ONLY by an explicit mapping: a field-coverage.yaml
  # `mappings` entry (source key -> target paths) or a `transforms` rule with a
  # target, whose value is found AT THAT TARGET PATH of the selected branch. A
  # value that merely appears somewhere else in the event never consumes a field
  # (no coincidental consumption); everything else spills.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The sets below are strings instead
  # (a read shares the buffer). __repr holds one member per mapped leaf:
  # "," + encode_json(path) + "=" + encode_json(encode_json(value)), plus the
  # to_string form for a string or a float, so a numeric string is represented by
  # its typed scalar. Every part is a JSON text, inside which a '"' is always
  # escaped, so a member is matched exactly. Paths drop array indices
  # (resources.0.uid is resources.uid); arrays are walked two levels deep, and a
  # leaf deeper than that is simply not mapping evidence (it can only spill more).
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped = object!(parse_json!(encode_json(__mapped)))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __copy = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __repr = ""
  for_each(flatten(__mapped)) -> |path, value| {
      __p = encode_json(path)
      if is_array(value) {
          for_each(array!(value)) -> |_i, item| {
              if is_object(item) {
                  for_each(flatten(object!(item))) -> |sub, leaf| {
                      __q = encode_json(path + "." + sub)
                      if is_array(leaf) {
                          for_each(array!(leaf)) -> |_j, x| {
                              if !is_object(x) && !is_array(x) {
                                  __repr = __repr + ("," + __q + "=" + encode_json(encode_json(x)))
                                  if is_string(x) || is_float(x) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(x))) }
                              }
                          }
                      } else {
                          __repr = __repr + ("," + __q + "=" + encode_json(encode_json(leaf)))
                          if is_string(leaf) || is_float(leaf) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(leaf))) }
                      }
                  }
              } else if !is_array(item) {
                  __repr = __repr + ("," + __p + "=" + encode_json(encode_json(item)))
                  if is_string(item) || is_float(item) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(item))) }
              }
          }
      } else {
          __repr = __repr + ("," + __p + "=" + encode_json(encode_json(value)))
          if is_string(value) || is_float(value) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(value))) }
      }
  }
  __consumed = ""
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__copy.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # BEGIN parser-specific transformations
  # Datetime: RFC 3339 Logpush clock converted to event milliseconds.
  # Datetime: Unix-seconds Logpush clock converted to event milliseconds.
  # Datetime: Unix-nanoseconds Logpush clock converted to event milliseconds.
  # CreatedAt: RFC 3339 Access clock converted to event milliseconds.
  # CreatedAt: Unix-seconds Access clock converted to event milliseconds.
  # QueryName: Query name lowercased into query.hostname.
  # HTTPHost: Host lowercased into http_request.url.hostname and dst_endpoint.hostname.
  # HTTPHost: Host lowercased into http_request.url.hostname and dst_endpoint.hostname.
  # SNI: SNI lowercased into dst_endpoint.hostname.
  # Action: Gateway / Access verdict normalized to the OCSF action; consume only when the expected ID is emitted.
  # ResolverDecision: Resolver decision normalized to the OCSF action; consume only when the expected ID is emitted.
  # Transport: Transport name normalized to the IANA protocol number.
  for_each(__flat) -> |key, value| {
      if match(key, r'(?x)
      \A(?:
        Datetime
      | CreatedAt
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%+", timezone: "UTC")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              if contains(__repr, "," + "\"time\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        Datetime
      | CreatedAt
      )\z') {
          __value = value
          __number, __number_err = to_float(__value)
          if __number_err == null && __value != null && !is_boolean(__value) {
              __expected = to_int(__number * 1000.0)
              if contains(__repr, "," + "\"time\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        Datetime
      )\z') {
          __value = value
          __number, __number_err = to_float(__value)
          if __number_err == null && __value != null && !is_boolean(__value) {
              __expected = to_int(__number * 0.000001)
              if contains(__repr, "," + "\"time\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        QueryName
      )\z') {
          __value = value
          if is_string(__value) {
              __expected = downcase(string!(__value))
              if contains(__repr, "," + "\"query.hostname\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        HTTPHost
      | SNI
      )\z') {
          __value = value
          if is_string(__value) {
              __expected = downcase(string!(__value))
              if contains(__repr, "," + "\"dst_endpoint.hostname\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        HTTPHost
      )\z') {
          __value = value
          if is_string(__value) {
              __expected = downcase(string!(__value))
              if contains(__repr, "," + "\"http_request.url.hostname\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        Action
      )\z') {
          __value = value
          if __value != null {
              __expected = get!({"allow": 1, "allowedonnorulematch": 1, "block": 2, "login": 1}, [downcase(to_string(__value) ?? "")])
              if __expected != null {
                  if contains(__repr, "," + "\"action_id\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
              }
          }
      }
      if match(key, r'(?x)
      \A(?:
        ResolverDecision
      )\z') {
          __value = value
          if __value != null {
              __expected = get!({"allowedonnopolicymatch": 1, "allowedbyqueryname": 1, "allowedbyanswername": 1, "blockedrule": 2, "blockedbycategory": 2, "blockedalwayscategory": 2}, [downcase(to_string(__value) ?? "")])
              if __expected != null {
                  if contains(__repr, "," + "\"action_id\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
              }
          }
      }
      if match(key, r'(?x)
      \A(?:
        Transport
      )\z') {
          __value = value
          if __value != null {
              __expected = get!({"tcp": 6, "udp": 17, "icmp": 1}, [downcase(to_string(__value) ?? "")])
              if __expected != null {
                  if contains(__repr, "," + "\"connection_info.protocol_num\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
              }
          }
      }
  }
  # Declared source -> target mappings (field-coverage.yaml `mappings`).
  __decl = "\n\"AccountID\"\t[\"metadata.tenant_uid\"]\n\"AppDomain\"\t[\"dst_endpoint.hostname\",\"service.name\"]\n\"AppUUID\"\t[\"service.uid\"]\n\"BlockedFileHash\"\t[\"file.hashes.value\"]\n\"BlockedFileName\"\t[\"file.name\"]\n\"BlockedFileSize\"\t[\"file.size\"]\n\"DestinationIP\"\t[\"dst_endpoint.ip\"]\n\"DestinationIPCountryCode\"\t[\"dst_endpoint.location.country\"]\n\"DestinationPort\"\t[\"dst_endpoint.port\"]\n\"DeviceID\"\t[\"device.uid\"]\n\"DeviceName\"\t[\"device.hostname\",\"device.name\",\"src_endpoint.hostname\"]\n\"DstIP\"\t[\"dst_endpoint.ip\"]\n\"DstPort\"\t[\"dst_endpoint.port\"]\n\"Email\"\t[\"actor.user.email_addr\",\"actor.user.name\",\"user.email_addr\",\"user.name\"]\n\"HTTPHost\"\t[\"dst_endpoint.hostname\",\"http_request.url.hostname\"]\n\"HTTPMethod\"\t[\"http_request.http_method\"]\n\"HTTPStatusCode\"\t[\"http_response.code\",\"http_status\"]\n\"HTTPVersion\"\t[\"http_request.version\"]\n\"IPAddress\"\t[\"src_endpoint.ip\"]\n\"PolicyID\"\t[\"firewall_rule.uid\"]\n\"PolicyName\"\t[\"firewall_rule.name\"]\n\"Policy\"\t[\"firewall_rule.name\"]\n\"Protocol\"\t[\"app_name\"]\n\"QueryName\"\t[\"query.hostname\"]\n\"QuerySize\"\t[\"traffic.bytes_out\"]\n\"QueryTypeName\"\t[\"query.type\"]\n\"RCode\"\t[\"rcode_id\"]\n\"RayID\"\t[\"metadata.correlation_uid\"]\n\"Referer\"\t[\"http_request.referrer\"]\n\"RequestID\"\t[\"http_request.uid\",\"metadata.correlation_uid\"]\n\"ResolvedIPs\"\t[\"answers.rdata\"]\n\"SNI\"\t[\"dst_endpoint.hostname\"]\n\"SessionID\"\t[\"connection_info.uid\",\"metadata.correlation_uid\"]\n\"SourceIP\"\t[\"src_endpoint.ip\"]\n\"SourceIPCountryCode\"\t[\"src_endpoint.location.country\"]\n\"SourceInternalIP\"\t[\"device.ip\"]\n\"SourcePort\"\t[\"src_endpoint.port\"]\n\"SrcIP\"\t[\"src_endpoint.ip\"]\n\"URL\"\t[\"http_request.url.url_string\"]\n\"UserAgent\"\t[\"http_request.user_agent\"]\n\"UserID\"\t[\"actor.user.uid\"]\n\"UserUID\"\t[\"user.uid\"]\n"
  __preserve = []
  # END parser-specific transformations
  # Declared mappings: __decl holds "\n" + encode_json(key) + "\t" + JSON array of
  # target paths + "\n" per mapped source key (a raw newline never occurs in
  # compact JSON). A key is consumed when its value, or every element of a scalar
  # array, is at one of its own targets. Keys stay ESCAPED here and in __consumed:
  # a literal dotted key ("a~1b") and the nested path ("a.b") are different
  # fields, and mapping one never consumes the other.
  for_each(__flat) -> |key, value| {
      # __decl spells a bracket inside a key as a \u escape (deploy bracket count).
      __kt = encode_json(key)
      if match(__kt, r'[\x28\x29\x5B\x5D\x7B\x7D]') {
          __kt = replace(replace(replace(replace(replace(replace(__kt, r'\x28', "\\u0028"), r'\x29', "\\u0029"), r'\x5B', "\\u005b"), r'\x5D', "\\u005d"), r'\x7B', "\\u007b"), r'\x7D', "\\u007d")
      }
      __at = find(__decl, "\n" + __kt + "\t")
      if is_integer(__at) && !is_object(value) {
          __rest = slice!(__decl, int!(__at) + strlen(__kt) + 2)
          __hit = false
          for_each(array!(parse_json!(slice!(__rest, 0, int!(find(__rest, "\n")))))) -> |_i, target| {
              __tok = "," + encode_json(target) + "="
              if !__hit && is_array(value) {
                  __all = !is_empty(array!(value))
                  for_each(array!(value)) -> |_j, item| {
                      if __all {
                          __all = !is_object(item) && !is_array(item) && (contains(__repr, __tok + encode_json(encode_json(item))) || ((is_string(item) || is_float(item)) && contains(__repr, __tok + encode_json(to_string!(item)))))
                      }
                  }
                  __hit = __all
              } else if !__hit {
                  __hit = contains(__repr, __tok + encode_json(encode_json(value))) || ((is_string(value) || is_float(value)) && contains(__repr, __tok + encode_json(to_string!(value))))
              }
          }
          if __hit { __consumed = __consumed + ("," + encode_json(key)) }
      }
  }
  # Fast path: when no two source keys decode to the same key and no two spilled
  # keys get the same name, each key's decision depends only on its own value, so
  # one filter and one rename build the residual without copying it per key.
  __distinct = true
  if __tilde {
      __distinct = length(map_keys(__flat) -> |key| { replace(replace(key, "~1", "."), "~0", "~") }) == length(__flat)
  }
  __kept = {}
  __names = {}
  if __distinct {
      __kept = filter(__flat) -> |key, value| {
          # A key is kept unless an explicit mapping or transformation consumed it.
          # Do not spill a copy of the raw body.
          value != __raw_body && !contains(__consumed, "," + encode_json(key))
      }
      __names = map_keys(__kept) -> |key| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          join!(__parts, ".")
      }
  }
  __residual = {}
  if __distinct && length(__names) == length(__kept) {
      __residual = map_values(__names) -> |value| {
          if is_array(value) || is_object(value) {
              if __tilde {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              if __complex { value = encode_json(value) }
          }
          value
      }
  } else {
      # Slow path: two spilled keys get the same name. A literal dotted key and a
      # nested path read alike ({"a.b": 1, "a": {"b": 2}} is "a.b" twice), and so
      # do keys that only snake-case alike ("userName", "user_name").
      # NAN-5894: a literal dotted key whose name is shared keeps its dots
      # escaped, RFC 6901 style ("a~1b", a "~" in it as "~0"), and the key
      # without a literal dot keeps "a.b". That is the name nano's ingest step
      # gives the flat key when no parser runs, so the name never depends on
      # whether a parser read the event, and it cannot clash with a vendor key
      # that is really named "b_2". A key is escaped only when its escaped name
      # is unique too (two flat keys that only snake-case alike escape to the
      # same name, so escaping would not tell them apart). Only a name still
      # taken after that gets the next free _2, _3, ... suffix, in key order:
      # keys that differ only in case or snake-casing, or a vendor key already
      # spelled "a~1b" (nothing is ever dropped).
      __spilled = filter(__flat) -> |key, value| {
          value != __raw_body && !contains(__consumed, "," + encode_json(key))
      }
      __plain = map_values(keys(__spilled)) -> |key| {
          key = replace(replace(string!(key), "~1", "."), "~0", "~")
          join!(map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }, ".")
      }
      __shared = filter(tally!(__plain)) -> |_name, count| { count > 1 }
      __shared = "\n" + join!(map_values(keys(__shared)) -> |name| { encode_json(name) }, "\n") + "\n"
      # The escaped name of each literal dotted key ("" for any other key).
      __escaped_names = map_values(keys(__spilled)) -> |key| {
          key = string!(key)
          if contains(key, "~1") {
              join!(map_values(split(key, ".")) -> |segment| {
                  join!(map_values(split(string!(segment), "~1")) -> |piece| {
                      replace(snakecase(replace(string!(piece), "~0", "~")), "~", "~0")
                  }, "~1")
              }, ".")
          } else { "" }
      }
      __escaped_shared = filter(tally!(__escaped_names)) -> |_name, count| { count > 1 }
      __escaped_shared = "\n" + join!(map_values(keys(__escaped_shared)) -> |name| { encode_json(name) }, "\n") + "\n"
      for_each(__flat) -> |key, value| {
          __token = "," + encode_json(key)
          __escaped_key = key
          key = replace(replace(key, "~1", "."), "~0", "~")
          if is_array(value) || is_object(value) {
              value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                  replace(replace(inner, "~1", "."), "~0", "~")
              }, ["v"])
          }
          if !contains(__consumed, __token) && value != __raw_body {
              __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
              __base = join!(__parts, ".")
              if contains(__escaped_key, "~1") && contains(__shared, "\n" + encode_json(__base) + "\n") {
                  __escaped_name = join!(map_values(split(__escaped_key, ".")) -> |segment| {
                      join!(map_values(split(string!(segment), "~1")) -> |piece| {
                          replace(snakecase(replace(string!(piece), "~0", "~")), "~", "~0")
                      }, "~1")
                  }, ".")
                  if !contains(__escaped_shared, "\n" + encode_json(__escaped_name) + "\n") { __base = __escaped_name }
              }
              __key = __base
              __suffix = 2
              if includes(keys(__residual), __key) {
                  for_each(__flat) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __key) {
                          __key = __base + "_" + to_string(__suffix)
                          __suffix = __suffix + 1
                      }
                  }
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              __spill = if __complex { encode_json(value) } else { value }
              __residual = set!(__residual, [__key], __spill)
          }
      }
  }
  # Names nano owns in unmapped (the parser markers and the reserved nano.*
  # namespace) are never taken by a source field: a vendor key with such a name
  # is kept, renamed source_<name>, so a log cannot forge a marker. An escaped
  # flat key ("nano~1x", NAN-5894) is renamed the same way as "nano.x".
  if match(encode_json(keys(__residual)), r'"nano(?:"|\.|~1|_time_assumed_tz"|_time_source"|_operational")') {
      for_each(object!(__residual)) -> |key, value| {
          if includes(["nano", "nano_time_assumed_tz", "nano_time_source", "nano_operational"], key) || starts_with(key, "nano.") || starts_with(key, "nano~1") {
              # source_<name>, or the next free _2, _3, ... when a vendor key
              # already holds that name: nothing is lost.
              __rk = "source_" + key
              __rn = 2
              if includes(keys(__residual), __rk) {
                  for_each(__residual) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __rk) {
                          __rk = "source_" + key + "_" + to_string(__rn)
                          __rn = __rn + 1
                      }
                  }
              }
              __residual = remove!(__residual, [key])
              __residual = set!(__residual, [__rk], value)
          }
      }
  }
  # Keep existing derived evidence, but remove null placeholders and copies of a
  # source value (that value is mapped or spilled above under its source path).
  # A value merely equal to some mapped attribute is kept: equality with an
  # unrelated attribute is no evidence that it is represented.
  # The canonical source spill above is the authoritative representation of
  # containers. The cheap conditions run first; the source value set is built on
  # first use.
  __original_values = null
  for_each(flatten(__existing)) -> |key, value| {
      if !is_null(value) && value != "" && !is_array(value) && !is_object(value) && value != __raw_body {
          # Members for the value itself and for to_string(value), as above.
          __json = encode_json(value)
          __as_json = "," + encode_json(__json)
          __as_string = __as_json
          if is_string(value) { __as_string = "," + __json } else if is_float(value) { __as_string = "," + encode_json(to_string!(value)) }
          if __original_values == null {
              # __source_kv may hold non-JSON types (a timestamp), so only an
              # integer or a boolean skips its to_string member here.
              __original_values = join!(map_values(values(flatten(__source_kv))) -> |source_value| {
                  __source_json = encode_json(source_value)
                  __tokens = "," + encode_json(__source_json)
                  if is_string(source_value) {
                      __tokens = __tokens + "," + __source_json
                  } else if !is_object(source_value) && !is_array(source_value) && !is_integer(source_value) && !is_boolean(source_value) {
                      __tokens = __tokens + "," + encode_json(to_string(source_value) ?? "")
                  }
                  __tokens
              }, "")
          }
          __source_set = string!(__original_values)
          __keep = !contains(__source_set, __as_json) && !contains(__source_set, __as_string)
          # Only text opening an object or an array (after JSON whitespace)
          # decodes to a container.
          if __keep && is_string(value) && match(string!(value), r'^[ \t\n\r]*[\x5B\x7B]') {
              __decoded, __decode_err = parse_json(string!(value))
              __keep = !(__decode_err == null && (is_object(__decoded) || is_array(__decoded)))
          }
          if __keep {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, as-is. These
  # entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__copy.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  if __time_assumed && !__time_inline { __residual = set!(__residual, ["nano_time_assumed_tz"], __src_tz_label) }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

