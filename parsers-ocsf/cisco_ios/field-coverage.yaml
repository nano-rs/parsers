source: text
transforms:
- source: header.iso_ts
  kind: epoch_ms
  target: time
  format: '%+'
  reason: RFC 3339 header clock converted to event milliseconds; device clocks without a year remain residual.
- source: event.protocol
  kind: lowercase
  reason: ACL protocol keyword lowercased into connection_info.protocol_name.
consumed_candidates:
- header.host
- header.outer_host
- header.seq
- tag.facility
- event.user
- event.source
- event.localport
- event.reason
- event.acl
- event.src_ip
- event.src_port
- event.dst_ip
- event.dst_port
- event.packets
- event.protocol
- event.tty
- event.line
- event.by
- event.interface
- event.command
- message
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
