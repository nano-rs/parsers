source: json
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
transforms:
- source: attributes.time
  kind: epoch_ms
  target: time
  format: '%+'
  reason: ISO event time converted to the event clock in milliseconds.
- source: attributes.processedAt
  kind: epoch_ms
  target: metadata.processed_time
  format: '%+'
  reason: ISO processing time converted to metadata.processed_time in milliseconds.
mappings:
  attributes.action:
  - api.operation
  - metadata.event_code
  attributes.actor.email:
  - actor.user.email_addr
  - user.email_addr
  attributes.actor.id:
  - actor.user.uid
  - user.uid
  attributes.actor.name:
  - actor.app_name
  - actor.user.name
  - user.name
  attributes.location.city:
  - src_endpoint.location.city
  attributes.location.ip:
  - src_endpoint.ip
  attributes.location.regionName:
  - src_endpoint.location.region
  id:
  - metadata.uid
  message.content:
  - message
  attributes.actor.auth.tokenId:
  - actor.user.credential_uid
  - user.credential_uid
  attributes.actor.app.id:
  - actor.app_uid
