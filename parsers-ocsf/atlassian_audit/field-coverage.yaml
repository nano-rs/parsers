source: json
transforms:
- source: attributes.time
  kind: epoch_ms
  target: time
  format: '%+'
  reason: ISO event time converted to the event clock in milliseconds.
- source: attributes.processedAt
  kind: epoch_ms
  target: metadata.processed_time
  format: '%+'
  reason: ISO processing time converted to metadata.processed_time in milliseconds.
consumed_candidates:
- attributes.action
- attributes.actor.app.id
- attributes.actor.auth.tokenId
- attributes.actor.email
- attributes.actor.id
- attributes.actor.name
- attributes.location.city
- attributes.location.ip
- attributes.location.regionName
- attributes.processedAt
- attributes.time
- id
- message.content
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. context[] and container[]
  are arrays of objects, so they always spill whole (as JSON) even though their
  users, groups and resources are mapped.
