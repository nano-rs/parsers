source: text
transforms:
- source: header.ts
  kind: epoch_ms
  target: time
  format: '%+'
  reason: Existing timestamp conversion verified against the emitted millisecond clock.
- source: PROTO
  kind: lowercase
  reason: Case normalization already performed by the parser; observed at connection_info.protocol_name,
    and checked against the emitted branch.
probe:
  raw: <34>1 2026-08-18T12:00:00Z host app 42 ID [first@1 known="existing"][residual@2421
    ResidualProbe="nan2421-text-unknown" password="nan2421-secret"] message
  source: structured_data.residual@2421.ResidualProbe
consumed_candidates:
- DPT
- DST
- MAC
- PROTO
- SPT
- SRC
- event.app
- event.command
- event.hostname
- event.ip
- event.method
- event.msg
- event.pid
- event.port
- event.pwd
- event.sd
- event.target_user
- event.ts
- event.tty
- event.user
- header.app
- header.body
- header.hostname
- header.msgid
- header.pri
- header.procid
- header.remainder
- header.rest
- header.ts
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
