      activity_id: 1
  - raw: '<86>Aug  5 12:01:00 host1 sudo:  alice : TTY=pts/0 ; PWD=/home/alice ; USER=root ; COMMAND=/usr/bin/apt install nmap'
    expect:
      class_uid: 3002
      activity_id: 1
  - raw: '<86>Aug  5 12:01:10 host1 sudo[9911]:  bob : TTY=pts/2 ; PWD=/srv ; USER=root ; COMMAND=/bin/systemctl restart nginx'
    expect:
