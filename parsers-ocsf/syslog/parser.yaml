  if __time_assumed && !__time_inline { __residual = set!(__residual, ["nano_time_assumed_tz"], __src_tz_label) }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

# Runtime samples (NAN-2327): one per event shape this parser routes.
# `class_uid` is asserted because class routing is the whole point of the
# OCSF conversion — a silent reroute is the defect most likely to survive
# a compile-only check.
samples:
  - raw: '<34>1 2026-08-05T12:00:00.000Z host1 myapp 555 ID47 - structured probe'
    expect:
      class_uid: 0
      activity_id: 99
  - raw: '<34>1 2026-08-05T12:00:01.000Z host1 myapp 556 ID48 [exampleSDID@32473 iut="3" eventSource="App"] structured with sd'
    expect:
      class_uid: 0
      activity_id: 99
  - raw: '<0>Aug  5 12:04:00 host1 kernel: emergency probe'
    expect:
      class_uid: 0
      activity_id: 99
  - raw: '<30>Aug  5 12:03:00 host1 testd: daemon informational probe'
    expect:
      class_uid: 0
      activity_id: 99
  - raw: '<4>Aug  5 12:02:00 host1 kernel: iptables-DROP: IN=eth0 OUT= MAC=00:11:22:33:44:55 SRC=203.0.113.99 DST=10.0.0.5 LEN=60 PROTO=TCP SPT=51000 DPT=22 WINDOW=1024'
    expect:
      class_uid: 4001
      activity_id: 4
  - raw: '<191>Aug  5 12:04:10 host1 testd: local7 debug probe'
    expect:
      class_uid: 0
      activity_id: 99
  - raw: '<38>Aug  5 12:03:10 host1 sshd: no pid bracket on this line'
    expect:
      class_uid: 0
      activity_id: 99
  - raw: 'this line has no PRI header at all'
    expect:
      class_uid: 0
      activity_id: 99
  - raw: '<38>Aug  5 12:00:05 host1 sshd[1240]: Failed password for invalid user root from 198.51.100.66 port 40122 ssh2'
    expect:
      class_uid: 3002
      activity_id: 1
  - raw: '<38>Aug  5 12:00:00 host1 sshd[1234]: Accepted publickey for alice from 203.0.113.5 port 22 ssh2'
    expect:
