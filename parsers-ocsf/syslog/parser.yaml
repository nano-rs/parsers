name: syslog_ocsf
display_name: Generic Syslog (OCSF)
version: "1.2.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses RFC 3164 (BSD) and RFC 5424 syslog into OCSF 1.9.0. Syslog is a
  TRANSPORT, not a schema, so this parser routes on the content it can
  positively identify and refuses to guess for the rest:
    * sshd "Accepted…" / "Failed…"    -> Authentication    (class_uid 3002)
    * sudo "user : TTY=… COMMAND=…"   -> Authentication    (class_uid 3002)
    * kernel iptables/nftables SRC=…  -> Network Activity  (class_uid 4001)
    * everything else                 -> Base Event        (class_uid 0)
  Base Event (class_uid 0) is OCSF's own concrete class for an event that no
  specific class describes; it keeps time, severity, message, device, actor
  and unmapped queryable without asserting semantics the line does not carry.
  Forcing an arbitrary daemon line into, say, HTTP Activity or API Activity
  would make every class-scoped hunt wrong.

  Two upstream defects in the UDM parser are deliberately not reproduced
  (see ../parsers/parsers/syslog/parser.yaml, FRO-677): VRL division returns a
  FLOAT, so the PRI facility quotient must be floored before it is used as an
  array index; and a named regex group that does not participate yields null,
  not "", so the optional "[pid]" capture must be read with to_string, never
  string!.
  Timestamps without an offset use the log source's timezone setting (UTC if unset).
match_values:
  - syslog
category: generic
vendor: "IETF"
product: "Syslog"
parser_vrl: |
  # NAN source timezone. Generated by scripts/residual_spill.py; edit scripts/residual/source_tz.vrl.
  # The log source's timezone setting arrives as .nano.source_timezone (an IANA
  # name such as "America/New_York", or any fixed offset such as "+05:30"), set
  # by nano at ingest. .nano is nano's input, never part of the log: it is
  # removed whole before anything else, whatever its shape.
  # For a clock that carries no offset a parser parses it AS UTC and sets
  # __lc_pending; the generated local-clock block that follows the parse
  # (local_clock.vrl) turns it into real UTC with this setting, and the spill
  # records the zone used as unmapped.nano_time_assumed_tz (the name, the offset
  # as +HH:MM, or "UTC" when the setting is absent, invalid or "local").
  __src_nano = del(.nano)
  __src_tz_in = ""
  if is_object(__src_nano) { __src_tz_in = strip_whitespace(to_string(object!(__src_nano).source_timezone) ?? "") }
  __src_tz = "UTC"
  __src_shift_ms = 0
  __src_tz_label = "UTC"
  __time_assumed = false
  __time_inline = false
  __lc_pending = false
  __lc_shifted = ""
  # No parse_* decoder here: nano infers a parser's input contract from the first
  # decoder in its program (parse_json first = a JSON-input parser, handed the
  # whole HEC / OTLP object). This prelude opens every parser, so a decoder in it
  # would turn every JSON-input parser into a text one. match + slice instead.
  if match(__src_tz_in, r'^[+-]\d{2}:?\d{2}$') {
      __src_sign = slice(__src_tz_in, 0, 1) ?? "+"
      __src_digits = replace(slice(__src_tz_in, 1) ?? "", ":", "")
      __src_hh = slice(__src_digits, 0, 2) ?? "99"
      __src_mm = slice(__src_digits, 2, 4) ?? "99"
      __src_h = to_int(__src_hh) ?? 99
      __src_m = to_int(__src_mm) ?? 99
      if __src_h <= 14 && __src_m <= 59 {
          __src_shift_ms = (__src_h * 3600 + __src_m * 60) * 1000
          if __src_sign == "-" { __src_shift_ms = 0 - __src_shift_ms }
          if __src_shift_ms != 0 { __src_tz_label = __src_sign + __src_hh + ":" + __src_mm }
      }
  } else if __src_tz_in != "" && downcase(__src_tz_in) != "local" {
      # "local" (the Vector host's zone) would make the time depend on the host.
      __src_probe, __src_probe_err = parse_timestamp("2000-01-01 00:00:00", "%Y-%m-%d %H:%M:%S", timezone: __src_tz_in)
      if __src_probe_err == null { __src_tz = __src_tz_in; __src_tz_label = __src_tz_in }
  }
  # A clock with no year: the current year in the source's zone, and the latest
  # leap year for a Feb 29 (the local-clock block then picks the nearest year).
  __src_now_ms = to_unix_timestamp(now(), unit: "milliseconds")
  __src_year = format_timestamp(from_unix_timestamp!(__src_now_ms + __src_shift_ms, unit: "milliseconds"), "%Y", timezone: __src_tz) ?? format_timestamp!(now(), "%Y")
  __src_leap_year = to_int(__src_year) ?? 2000
  if mod(__src_leap_year, 4) != 0 || (mod(__src_leap_year, 100) == 0 && mod(__src_leap_year, 400) != 0) { __src_leap_year = __src_leap_year - mod(__src_leap_year, 4) }
  __src_leap_year = to_string(__src_leap_year)
  # END NAN source timezone
  # Generic Syslog -> OCSF 1.9.0 (content-routed)
  raw_log = string!(.message)
  __raw_body = raw_log
  __source_kv = {}
  __syslog, __syslog_err = parse_syslog(raw_log)
  if __syslog_err == null {
      for_each(object!(__syslog)) -> |key, value| {
          if is_object(value) { __source_kv = set!(__source_kv, ["structured_data", key], value) }
      }
  }

  ip_re = r'^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$|^[0-9A-Fa-f:]{3,}$'

  facility_names = ["kern", "user", "mail", "daemon", "auth", "syslog", "lpr", "news",
                    "uucp", "cron", "authpriv", "ftp", "ntp", "audit", "alert", "clock",
                    "local0", "local1", "local2", "local3", "local4", "local5", "local6", "local7"]
  severity_names = ["emergency", "alert", "critical", "error", "warning", "notice", "informational", "debug"]

  have_pri = false
  facility = ""
  facility_num = 0
  syslog_severity = ""
  severity_num = 6
  rfc = ""
  hostname = ""
  app_name = ""
  pid_val = ""
  msgid = ""
  structured_data = ""
  msg_body = ""
  time_ms = 0

  pm, pmerr = parse_regex(raw_log, r'^<(?P<pri>\d{1,3})>(?P<rest>.*)')
  # Capture parsed fields before mapping; omit structural raw-body captures.
  __capture = object(parse_json!(encode_json(pm))) ?? {}
  __ignore = del(__capture.body)
  __ignore = del(__capture.content)
  __ignore = del(__capture.kvdata)
  __ignore = del(__capture.kvpart)
  __ignore = del(__capture.msg)
  __ignore = del(__capture.payload)
  __ignore = del(__capture.remainder)
  __ignore = del(__capture.rest)
  __ignore = del(__capture.sd)
  __source_kv = set!(__source_kv, ["header"], merge(object(get(__source_kv, ["header"]) ?? null) ?? {}, __capture))
  rest = raw_log
  if pmerr == null {
      have_pri = true
      pri_val = to_int(to_string(pm.pri)) ?? 0
      rest = to_string(pm.rest)
      # VRL division yields a FLOAT; floor before indexing (FRO-677).
      facility_num = to_int(floor(pri_val / 8))
      severity_num = pri_val - (facility_num * 8)
      fn = get(facility_names, [facility_num]) ?? null
      facility = to_string(fn) ?? to_string(facility_num)
      sn = get(severity_names, [severity_num]) ?? null
      syslog_severity = to_string(sn) ?? to_string(severity_num)
  }

  m5, m5err = parse_regex(rest, r'^1\s+(?P<ts>\S+)\s+(?P<hostname>\S+)\s+(?P<app>\S+)\s+(?P<procid>\S+)\s+(?P<msgid>\S+)\s*(?P<remainder>.*)')
  # Capture parsed fields before mapping; omit structural raw-body captures.
  __capture = object(parse_json!(encode_json(m5))) ?? {}
  __ignore = del(__capture.body)
  __ignore = del(__capture.content)
  __ignore = del(__capture.kvdata)
  __ignore = del(__capture.kvpart)
  __ignore = del(__capture.msg)
  __ignore = del(__capture.payload)
  __ignore = del(__capture.remainder)
  __ignore = del(__capture.rest)
  __ignore = del(__capture.sd)
  __source_kv = set!(__source_kv, ["header"], merge(object(get(__source_kv, ["header"]) ?? null) ?? {}, __capture))
  if m5err == null {
      rfc = "5424"
      ts_str = to_string(m5.ts)
      if ts_str != "-" {
          t, terr = parse_timestamp(ts_str, "%+", timezone: "UTC")
          if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
      }
      h = to_string(m5.hostname)
      if h != "-" { hostname = h }
      a = to_string(m5.app)
      if a != "-" { app_name = a }
      pv = to_string(m5.procid)
      if pv != "-" { pid_val = pv }
      mi = to_string(m5.msgid)
      if mi != "-" { msgid = mi }
      remainder = to_string(m5.remainder)
      sd, sderr = parse_regex(remainder, r'^\[(?P<sd>[^\]]+)\]\s*(?P<msg>.*)')
      # Capture parsed fields before mapping; omit structural raw-body captures.
      __capture = object(parse_json!(encode_json(sd))) ?? {}
      __ignore = del(__capture.body)
      __ignore = del(__capture.content)
      __ignore = del(__capture.kvdata)
      __ignore = del(__capture.kvpart)
      __ignore = del(__capture.msg)
      __ignore = del(__capture.payload)
      __ignore = del(__capture.remainder)
      __ignore = del(__capture.rest)
      __ignore = del(__capture.sd)
      __source_kv = set!(__source_kv, ["event"], merge(object(get(__source_kv, ["event"]) ?? null) ?? {}, __capture))
      if sderr == null {
          structured_data = to_string(sd.sd)
          msg_body = strip_whitespace(to_string(sd.msg))
      } else {
          msg_body = strip_whitespace(remainder)
      }
  } else {
      m3, m3err = parse_regex(rest, r'^(?P<ts>[A-Z][a-z]{2}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2})\s+(?P<hostname>\S+)\s+(?P<app>[^\[:\s]+)(?:\[(?P<pid>\d+)\])?:?\s*(?P<msg>.*)')
      # Capture parsed fields before mapping; omit structural raw-body captures.
      __capture = object(parse_json!(encode_json(m3))) ?? {}
      __ignore = del(__capture.body)
      __ignore = del(__capture.content)
      __ignore = del(__capture.kvdata)
      __ignore = del(__capture.kvpart)
      __ignore = del(__capture.msg)
      __ignore = del(__capture.payload)
      __ignore = del(__capture.remainder)
      __ignore = del(__capture.rest)
      __ignore = del(__capture.sd)
      __source_kv = set!(__source_kv, ["event"], merge(object(get(__source_kv, ["event"]) ?? null) ?? {}, __capture))
      if m3err == null {
          rfc = "3164"
          ts_str = to_string(m3.ts)
          # An RFC 3164 clock has no year (chrono cannot parse it without one):
          # the current year, as the other BSD-header parsers do.
          t, terr = parse_timestamp(replace(ts_str, r'\s+', " ") + " " + __src_year, "%b %d %H:%M:%S %Y", timezone: "UTC")
          if terr != null { t, terr = parse_timestamp(replace(ts_str, r'\s+', " ") + " " + __src_leap_year, "%b %d %H:%M:%S %Y", timezone: "UTC") }
          if terr == null { __lc_pending = true }
          # NAN local clock: t noyear
          # t was just parsed from a clock WITHOUT an offset, read as UTC
          # (__lc_pending). It becomes real UTC here, at the site, with the log source's
          # timezone (__src_tz / __src_shift_ms from the prelude, or an inline IANA zone
          # the parser validated): a fixed offset by arithmetic; an IANA zone with its DST
          # rules, probed 18 h either side (wider than any UTC offset), an ambiguous
          # fall-back time taking its FIRST occurrence (the earlier offset), a time in a
          # spring-forward gap moving forward by the gap. __NOYEAR__: a clock with no
          # year is tried in its year, the year before and the year after (each with its
          # own DST rules); more than a day in the future means last year, more than 180
          # days in the past means next year when that is not in the future.
          if __lc_pending {
              __lc_pending = false
              __time_assumed = true
              __lc_l = to_unix_timestamp(t, unit: "milliseconds")
              __lc_cands = [__lc_l]
              if true {
                  __lc_s = format_timestamp!(t, "%Y-%m-%d %H:%M:%S%.3f")
                  __lc_y = to_int(slice!(__lc_s, 0, 4)) ?? 0
                  __lc_p, __lc_pe = parse_timestamp(to_string(__lc_y - 1) + slice!(__lc_s, 4), "%Y-%m-%d %H:%M:%S%.3f", timezone: "UTC")
                  __lc_n, __lc_ne = parse_timestamp(to_string(__lc_y + 1) + slice!(__lc_s, 4), "%Y-%m-%d %H:%M:%S%.3f", timezone: "UTC")
                  __lc_pm = null
                  if __lc_pe == null { __lc_pm = to_unix_timestamp(__lc_p, unit: "milliseconds") }
                  __lc_nm = null
                  if __lc_ne == null { __lc_nm = to_unix_timestamp(__lc_n, unit: "milliseconds") }
                  __lc_cands = [__lc_l, __lc_pm, __lc_nm]
              }
              __lc_us = map_values(__lc_cands) -> |l| {
                  if l == null {
                      null
                  } else {
                      __u = int!(l) - __src_shift_ms
                      if __src_tz != "UTC" {
                          __offs = map_values([int!(l) - 64800000, int!(l) + 64800000]) -> |at| {
                              __z = format_timestamp(from_unix_timestamp!(at, unit: "milliseconds"), "%z", timezone: __src_tz) ?? "+0000"
                              __o = ((to_int(slice(__z, 1, 3) ?? "0") ?? 0) * 3600 + (to_int(slice(__z, 3, 5) ?? "0") ?? 0) * 60) * 1000
                              if starts_with(__z, "-") { 0 - __o } else { __o }
                          }
                          __oa = int!(__offs[0])
                          __ob = int!(__offs[1])
                          __u = int!(l) - __oa
                          if __oa != __ob {
                              __ok = map_values([int!(l) - __oa, int!(l) - __ob]) -> |at| {
                                  __z = format_timestamp(from_unix_timestamp!(at, unit: "milliseconds"), "%z", timezone: __src_tz) ?? "+0000"
                                  __o = ((to_int(slice(__z, 1, 3) ?? "0") ?? 0) * 3600 + (to_int(slice(__z, 3, 5) ?? "0") ?? 0) * 60) * 1000
                                  if starts_with(__z, "-") { 0 - __o } else { __o }
                              }
                              if int!(__ok[0]) != __oa && int!(__ok[1]) == __ob { __u = int!(l) - __ob }
                          }
                      }
                      __u
                  }
              }
              __lc_u = int!(__lc_us[0])
              if true {
                  if __lc_u > __src_now_ms + 86400000 && __lc_us[1] != null {
                      __lc_u = int!(__lc_us[1])
                  } else if __lc_u < __src_now_ms - 15552000000 && __lc_us[2] != null && int!(__lc_us[2]) <= __src_now_ms + 86400000 {
                      __lc_u = int!(__lc_us[2])
                  }
              }
              # Remembered (local -> UTC) so a transforms rule on the same source clock
              # still finds it at its target.
              if __lc_u != __lc_l { __lc_shifted = __lc_shifted + "\n" + to_string(__lc_l) + "\t" + to_string(__lc_u) + "\n" }
              t = from_unix_timestamp!(__lc_u, unit: "milliseconds")
          }
          # END NAN local clock
          if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
          hostname = to_string(m3.hostname)
          app_name = to_string(m3.app)
          # A non-participating named group is null, not "" — to_string, not string! (FRO-677).
          pid_val = to_string(m3.pid)
          msg_body = to_string(m3.msg)
      } else {
          msg_body = strip_whitespace(rest)
      }
  }

  # ---- syslog severity -> OCSF severity_id -------------------------------
  severity_id = 1
  severity = "Informational"
  if severity_num <= 1 { severity_id = 6; severity = "Fatal" } else if severity_num == 2 { severity_id = 5; severity = "Critical" } else if severity_num == 3 { severity_id = 4; severity = "High" } else if severity_num == 4 { severity_id = 3; severity = "Medium" } else if severity_num == 5 { severity_id = 2; severity = "Low" }

  app_lower = downcase(app_name)

  metadata = {
      "version": "1.9.0",
      "uid": sha2("syslog|raw|" + raw_log, variant: "SHA-256"),
      "profiles": ["host", "security_control"],
      "log_name": "syslog",
      "log_level": syslog_severity,
      "product": { "name": "Syslog", "vendor_name": "IETF" }
  }
  if app_name != "" { metadata.log_provider = app_name }
  if msgid != "" { metadata.event_code = msgid }

  unmapped = {}
  if facility != "" { unmapped.facility = facility }
  if have_pri { unmapped.facility_num = facility_num; unmapped.severity_num = severity_num }
  if syslog_severity != "" { unmapped.syslog_severity = syslog_severity }
  if rfc != "" { unmapped.rfc_version = rfc }
  # Structured-data parameters are preserved individually by residual spill.
  if __syslog_err == null && rfc == "5424" { msg_body = string(__syslog.message) ?? msg_body }
  if app_name != "" { unmapped.service_name = app_name }
  if hostname != "" { unmapped.host_name = hostname }
  if !have_pri { unmapped.parse_note = "no syslog PRI header found" }

  device = { "type_id": 0 }
  if hostname != "" { device.hostname = downcase(hostname) }

  routed = "base"

  # ---- sshd -> Authentication (3002) ------------------------------------
  ssh_user = ""
  ssh_ip = ""
  ssh_port = 0
  ssh_method = ""
  ssh_ok = false
  if app_lower == "sshd" {
      acc, accerr = parse_regex(msg_body, r'Accepted\s+(?P<method>\S+)\s+for\s+(?P<user>\S+)\s+from\s+(?P<ip>\S+)\s+port\s+(?P<port>\d+)')
      # Capture parsed fields before mapping; omit structural raw-body captures.
      __capture = object(parse_json!(encode_json(acc))) ?? {}
      __ignore = del(__capture.body)
      __ignore = del(__capture.content)
      __ignore = del(__capture.kvdata)
      __ignore = del(__capture.kvpart)
      __ignore = del(__capture.msg)
      __ignore = del(__capture.payload)
      __ignore = del(__capture.remainder)
      __ignore = del(__capture.rest)
      __ignore = del(__capture.sd)
      __source_kv = set!(__source_kv, ["event"], merge(object(get(__source_kv, ["event"]) ?? null) ?? {}, __capture))
      if accerr == null {
          routed = "auth_ssh"
          ssh_ok = true
          ssh_method = to_string(acc.method)
          ssh_user = to_string(acc.user)
          ssh_ip = to_string(acc.ip)
          ssh_port = to_int(to_string(acc.port)) ?? 0
      } else {
          fal, falerr = parse_regex(msg_body, r'Failed\s+(?P<method>\S+)\s+for\s+(?:invalid user\s+)?(?P<user>\S+)\s+from\s+(?P<ip>\S+)\s+port\s+(?P<port>\d+)')
          # Capture parsed fields before mapping; omit structural raw-body captures.
          __capture = object(parse_json!(encode_json(fal))) ?? {}
          __ignore = del(__capture.body)
          __ignore = del(__capture.content)
          __ignore = del(__capture.kvdata)
          __ignore = del(__capture.kvpart)
          __ignore = del(__capture.msg)
          __ignore = del(__capture.payload)
          __ignore = del(__capture.remainder)
          __ignore = del(__capture.rest)
          __ignore = del(__capture.sd)
          __source_kv = set!(__source_kv, ["event"], merge(object(get(__source_kv, ["event"]) ?? null) ?? {}, __capture))
          if falerr == null {
              routed = "auth_ssh"
              ssh_ok = false
              ssh_method = to_string(fal.method)
              ssh_user = to_string(fal.user)
              ssh_ip = to_string(fal.ip)
              ssh_port = to_int(to_string(fal.port)) ?? 0
          }
      }
  }

  # ---- sudo -> Authentication (3002) ------------------------------------
  sudo_user = ""
  sudo_target = ""
  sudo_cmd = ""
  sudo_tty = ""
  sudo_pwd = ""
  if app_lower == "sudo" {
      sm, smerr = parse_regex(msg_body, r'(?P<user>\S+)\s+:\s+TTY=(?P<tty>\S+)\s*;\s*PWD=(?P<pwd>\S+)\s*;\s*USER=(?P<target_user>\S+)\s*;\s*COMMAND=(?P<command>.*)')
      # Capture parsed fields before mapping; omit structural raw-body captures.
      __capture = object(parse_json!(encode_json(sm))) ?? {}
      __ignore = del(__capture.body)
      __ignore = del(__capture.content)
      __ignore = del(__capture.kvdata)
      __ignore = del(__capture.kvpart)
      __ignore = del(__capture.msg)
      __ignore = del(__capture.payload)
      __ignore = del(__capture.remainder)
      __ignore = del(__capture.rest)
      __ignore = del(__capture.sd)
      __source_kv = set!(__source_kv, ["event"], merge(object(get(__source_kv, ["event"]) ?? null) ?? {}, __capture))
      if smerr == null {
          routed = "auth_sudo"
          sudo_user = to_string(sm.user)
          sudo_target = to_string(sm.target_user)
          sudo_cmd = to_string(sm.command)
          sudo_tty = to_string(sm.tty)
          sudo_pwd = to_string(sm.pwd)
      }
  }

  # ---- kernel netfilter -> Network Activity (4001) -----------------------
  fw = {}
  if app_lower == "kernel" {
      im, imerr = parse_regex(msg_body, r'(?:iptables|nftables|netfilter)[^:]*:\s*(?P<body>.*)')
      # Capture parsed fields before mapping; omit structural raw-body captures.
      __capture = object(parse_json!(encode_json(im))) ?? {}
      __ignore = del(__capture.body)
      __ignore = del(__capture.content)
      __ignore = del(__capture.kvdata)
      __ignore = del(__capture.kvpart)
      __ignore = del(__capture.msg)
      __ignore = del(__capture.payload)
      __ignore = del(__capture.remainder)
      __ignore = del(__capture.rest)
      __ignore = del(__capture.sd)
      __source_kv = set!(__source_kv, ["header"], merge(object(get(__source_kv, ["header"]) ?? null) ?? {}, __capture))
      if imerr == null {
          kv, kverr = parse_key_value(to_string(im.body), key_value_delimiter: "=", field_delimiter: " ")
          __kv_capture = object(parse_json!(encode_json(kv))) ?? {}
          for_each(__kv_capture) -> |key, value| {
              if !is_boolean(value) { __source_kv = set!(__source_kv, [key], value) }
          }
          if kverr == null {
              routed = "firewall"
              fw = object!(kv)
          }
      }
  }

  if routed == "auth_ssh" {
      status_id = 2
      status_str = "Failure"
      if ssh_ok { status_id = 1; status_str = "Success" }
      sev_id = severity_id
      sev = severity
      if !ssh_ok && sev_id < 3 { sev_id = 3; sev = "Medium" }

      . = {
          "class_uid": 3002,
          "class_name": "Authentication",
          "category_uid": 3,
          "category_name": "Identity & Access Management",
          "activity_id": 1,
          "activity_name": "Logon",
          "type_uid": 300201,
          "severity_id": sev_id,
          "severity": sev,
          "status_id": status_id,
          "status": status_str,
          "is_alert": !ssh_ok,
          "time": time_ms,
          "raw_data": raw_log,
          "metadata": metadata,
          "user": { "name": ssh_user },
          "service": { "name": "sshd" },
          "logon_type": "Network",
          "is_remote": true,
          "device": device
      }
      se = {}
      if match(ssh_ip, ip_re) { se.ip = ssh_ip } else if ssh_ip != "" { se.hostname = downcase(ssh_ip) }
      if ssh_port != 0 { se.port = ssh_port }
      if exists(se.ip) || exists(se.hostname) { .src_endpoint = se }
      if ssh_method != "" { unmapped.auth_method = ssh_method }
      if pid_val != "" { .actor = { "process": { "name": app_name, "pid": to_int(pid_val) ?? 0 } } }
      .unmapped = unmapped
  } else if routed == "auth_sudo" {
      # sudo is an account switch: the invoking user authenticates AS the
      # target user. OCSF models that as Authentication with the target in
