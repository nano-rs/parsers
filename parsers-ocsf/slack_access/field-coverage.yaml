source: json
transforms:
- source: date_last
  target: time
  kind: scale
  reason: Slack access last-observed Unix seconds converted to milliseconds.
  factor: 1000
- source: date_first
  kind: scale
  factor: 1000
  target: time
  reason: Existing unit conversion by 1000 verified against time; unused clock fallbacks
    remain residual.
consumed_candidates:
- count
- country
- date_first
- date_last
- ip
- isp
- region
- user_agent
- user_id
- username
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
