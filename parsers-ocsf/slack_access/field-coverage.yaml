source: json
transforms:
- source: date_last
  target: time
  kind: scale
  reason: Slack access last-observed Unix seconds converted to milliseconds.
  factor: 1000
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  count:
  - count
  country:
  - src_endpoint.location.country
  ip:
  - src_endpoint.ip
  isp:
  - src_endpoint.isp
  user_agent:
  - http_request.user_agent
  user_id:
  - user.uid
  username:
  - user.name
