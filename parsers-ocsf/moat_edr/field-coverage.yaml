source: json
preserve_unmapped:
  dns: Preserve derived DNS context and queried_by_self boolean; equal-valued source flags do not substitute
    for this derived fact.
transforms:
- source: host
  kind: lowercase
  target: device.hostname
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: host
  kind: lowercase
  target: finding_info.data_sources
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: host
  kind: lowercase
  target: observables.value
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: host
  kind: lowercase
  target: src_endpoint.hostname
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: moat.dst_ip
  kind: lowercase
  target: dst_endpoint.ip
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: moat.dst_ip
  kind: lowercase
  target: observables.value
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: moat.sha256
  kind: lowercase
  target: file.hashes.value
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: moat.sha256
  kind: lowercase
  target: observables.value
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: moat.update.ts
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: moat.receipt.started
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: '@timestamp'
  kind: epoch_ms
  target: time
  format: '%+'
  reason: Existing timestamp conversion verified against the emitted millisecond clock.
- source: severity
  kind: enum
  target: severity_id
  values:
    informational: 1
    info: 1
    debug: 1
    low: 2
    medium: 3
    warn: 3
    warning: 3
    high: 4
    error: 4
    critical: 5
    fatal: 6
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when
    the expected ID is emitted.
- source: moat.receipt.duration_s
  kind: scale
  factor: 1000
  target: duration
  reason: Existing unit conversion by 1000 verified against duration; unused clock fallbacks remain residual.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  event_id:
  - finding_info.uid
  - metadata.original_event_uid
  - metadata.uid
  host:
  - device.hostname
  - finding_info.data_sources
  - observables.value
  - src_endpoint.hostname
  kind:
  - metadata.event_code
  moat.args:
  - actor.process.cmd_line
  - process.cmd_line
  moat.bytes:
  - file.size
  moat.chain.id:
  - metadata.correlation_uid
  moat.count:
  - count
  moat.dst_ip:
  - dst_endpoint.ip
  - observables.value
  moat.dst_port:
  - dst_endpoint.port
  moat.exe:
  - actor.process.file.path
  - process.file.path
  moat.exec_id:
  - actor.process.uid
  - process.uid
  moat.family:
  - finding_info.types
  moat.file.path:
  - evidences.file.path
  - observables.value
  moat.id:
  - finding_info.uid
  moat.ioc.source:
  - enrichments.provider
  - osint.vendor_name
  moat.net.domain:
  - evidences.dst_endpoint.hostname
  - evidences.query.hostname
  - observables.value
  moat.net.domain_cname:
  - observables.value
  moat.net.dst_ip:
  - evidences.dst_endpoint.ip
  - observables.value
  moat.net.dst_port:
  - evidences.dst_endpoint.port
  moat.parent.args:
  - actor.process.cmd_line
  moat.parent.exe:
  - actor.process.file.path
  moat.parent.exec_id:
  - actor.process.uid
  moat.parent.pid:
  - actor.process.pid
  moat.path:
  - file.path
  - observables.value
  moat.pid:
  - actor.process.pid
  - process.pid
  moat.process.args:
  - actor.process.cmd_line
  moat.process.exe:
  - actor.process.file.path
  moat.process.pid:
  - actor.process.pid
  moat.process.uid:
  - actor.user.uid
  moat.receipt.exit:
  - status_code
  moat.receipt.id:
  - actor.process.uid
  - process.uid
  moat.receipt.root_args:
  - actor.process.cmd_line
  - process.cmd_line
  moat.receipt.root_exe:
  - actor.process.file.path
  - process.file.path
  moat.rule:
  - finding_info.analytic.name
  - finding_info.analytic.uid
  - metadata.event_code
  moat.sha256:
  - file.hashes.value
  - observables.value
  moat.status:
  - status_code
  moat.summary:
  - message
  moat.suppressed_by:
  - status_detail
  moat.title:
  - finding_info.title
  moat.uid:
  - actor.user.uid
  moat.update.count:
  - count
  moat.version:
  - app.version
