name: moat_edr_ocsf
display_name: Moat EDR (OCSF)
version: "1.0.0"
description: >
  Parses omarchy-moat supply-chain sensor records (moat-ship NDJSON envelope)
  into complete OCSF 1.9.0 records, routed by the envelope's class + kind:
    alerts/alert     -> Detection Finding 2004 (Create)
    alerts/update    -> Detection Finding 2004 (Update)
    alerts/receipt   -> Process Activity 1007 (Terminate) - a package-install root exiting
    moat/heartbeat   -> Application Lifecycle 6002 (Other) - shipper liveness
    process/exec     -> Process Activity 1007 (Launch)
    process/exit     -> Process Activity 1007 (Terminate)
    network/connect  -> Network Activity 4001 (Open)
    file/file_write  -> File System Activity 1001 (Create | Update, from `verdict`)
    file/file_chmod  -> File System Activity 1001 (Set Attributes)
  Only the `alerts` class ships by default; process/network/file are the opt-in
  telemetry classes of moat's SHIPPING.md §2 and are handled here so enabling one
  never produces unparsed events.
  On a finding the acting process is the ACTOR (2004 carries `actor`/`device`
  through the `host` profile, and `action`/`disposition`/`is_alert`/`risk_*`
  through `security_control`); the file or destination a finding is ABOUT has no
  home on 2004, so it is carried in `evidences[]` for OCSF consumers and in
  promoted `observables[]` so it stays pivotable in the lake.
  moat's own facet vocabulary - moat_tier, family, tier, surface, context, mode,
  rarity, suppressed_by, provenance, chain and triage - is carried under
  `unmapped.*`, which is queryable. The bulky `explain` block is deliberately not
  copied out of `raw_data`.
  Emits the whole OCSF object on the root so it lands in ocsf_logs.event and the
  promoted columns materialize.
ocsf_version: "1.9.0"
match_values:
  - moat_edr
  - moat
category: endpoint
vendor: "Omarchy"
product: "Moat"
parser_vrl: |
  # omarchy-moat -> OCSF 1.9.0. Emits the COMPLETE OCSF record on the root.
  #
  # Wire format (moatd/src/ship.rs `envelope`):
  #   { v, event_id, host, class, kind, moat_tier, severity, "@timestamp",
  #     moat: <the record itself> }
  #
  # `class` is the telemetry stream (alerts | process | network | file), or
  # "moat" for the shipper's own heartbeat. `kind` discriminates within it.
  raw_log = string!(.message)
  parsed, err = parse_json(raw_log)

  if err != null || !is_object(parsed) {
      # 2004 is moat's primary output, so an unparseable line stays in the
      # findings lane rather than being filed as telemetry it is not.
      . = {
          "class_uid": 2004,
          "class_name": "Detection Finding",
          "category_uid": 2,
          "category_name": "Findings",
          "activity_id": 99,
          "activity_name": "Other",
          "type_uid": 200499,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 1,
          "status": "New",
          "time": to_int(to_unix_timestamp(now(), unit: "milliseconds")),
          "raw_data": raw_log,
          "finding_info": { "uid": uuid_v4(), "title": "Unparseable moat record" },
          "device": { "hostname": "unknown", "type_id": 0 },
          "metadata": {
              "version": "1.9.0",
              "profiles": ["host"],
              "uid": uuid_v4(),
              "log_name": "moat_edr",
              "log_source": "moat_edr",
              "product": { "name": "Moat", "vendor_name": "Omarchy" }
          }
      }
  } else {
      p = object!(parsed)

      env_class = to_string(p.class) ?? ""
      kind = to_string(p.kind) ?? ""
      host = downcase(to_string(p.host) ?? "")
      event_id = to_string(p.event_id) ?? ""
      record_uid_seed = event_id
      if record_uid_seed == "" { record_uid_seed = uuid_v4() }
      moat_tier = to_string(p.moat_tier) ?? ""
      env_sev = downcase(to_string(p.severity) ?? "")
      m = object(p.moat) ?? {}

      # ---- time ---------------------------------------------------------
      # `@timestamp` is the envelope's copy of the record's own `ts`. Updates
      # and receipts carry their timestamp one level down instead (moat's
      # envelope reads `body.ts`, which those two shapes do not have), so they
      # would otherwise all land on the epoch.
      ts_str = to_string(p."@timestamp") ?? ""
      if ts_str == "" { ts_str = to_string(m.ts) ?? "" }
      if ts_str == "" { ts_str = to_string(m.update.ts) ?? "" }
      if ts_str == "" { ts_str = to_string(m.receipt.started) ?? "" }
      # About half of all `update` records carry no timestamp anywhere - moat's
      # envelope reads `body.ts` and the shipper does not backfill one. Ingest
      # time is wrong by seconds; the epoch is wrong by 56 years, and would put
      # every one of them outside any hunt window.
      time_ms = to_int(to_unix_timestamp(now(), unit: "milliseconds"))
      if ts_str != "" {
          parsed_ts, ts_err = parse_timestamp(ts_str, "%+")
          if ts_err == null {
              time_ms = to_unix_timestamp(parsed_ts, unit: "milliseconds")
          }
      }

      # ---- severity: moat's five names -> OCSF severity_id ---------------
      sev_name = env_sev
      if sev_name == "" { sev_name = downcase(to_string(m.severity) ?? "") }
      severity_id = 1
      severity = "Informational"
      if sev_name == "low" { severity_id = 2; severity = "Low" }
      if sev_name == "medium" { severity_id = 3; severity = "Medium" }
      if sev_name == "high" { severity_id = 4; severity = "High" }
      if sev_name == "critical" { severity_id = 5; severity = "Critical" }

      device_hostname = host
      if device_hostname == "" { device_hostname = "unknown" }
      device = { "hostname": device_hostname, "type_id": 0 }

      obs = []
      if host != "" {
          obs = push(obs, { "name": "device.hostname", "type": "Hostname", "type_id": 1, "value": host })
      }

      unmapped = {}
      if moat_tier != "" { unmapped.moat_tier = moat_tier }

      ocsf = {}
      class_uid = 0
      class_name = "Base Event"
      category_uid = 0
      category_name = "Uncategorized"
      activity_id = 99
      activity_name = "Other"
      event_code = kind
      correlation_uid = ""
      profiles = ["host"]

      if env_class == "alerts" && kind == "alert" {
          # ================= Detection Finding 2004 (Create) =============
          class_uid = 2004
          class_name = "Detection Finding"
          category_uid = 2
          category_name = "Findings"
          activity_id = 1
          activity_name = "Create"
          profiles = ["host", "security_control"]

          rule = to_string(m.rule) ?? ""
          family = to_string(m.family) ?? ""
          event_code = rule

          alert_id = to_string(m.id) ?? ""
          if alert_id == "" { alert_id = event_id }
          if alert_id == "" { alert_id = uuid_v4() }
          title = to_string(m.title) ?? ""
          if title == "" { title = rule }
          if title == "" { title = "moat alert" }

          finding_info = {
              "uid": alert_id,
              "title": title,
              "data_sources": ["moat_edr", host]
          }
          if family != "" { finding_info.types = [family] }
          if rule != "" {
              # Every moat rule - kernel policy or userland correlation - is a
              # named rule, not a model. type_id 1 "Rule" throughout.
              finding_info.analytic = { "name": rule, "uid": rule, "type_id": 1, "type": "Rule" }
          }
          ocsf.finding_info = finding_info

          summary = to_string(m.summary) ?? ""
          if summary != "" { ocsf.message = summary }

          # `surface: alerts` is moat's own "this is on the badge, a person has
          # not answered it" - exactly what is_alert means.
          ocsf.is_alert = (to_string(m.surface) ?? "") == "alerts"

          count = to_int(m.count) ?? 0
          if count > 0 { ocsf.count = count }

          # risk_level restates the FINAL (context-adjusted) severity. No score
          # is synthesized - moat does not produce one.
          risk_level_id = 0
          risk_level = "Info"
          if sev_name == "low" { risk_level_id = 1; risk_level = "Low" }
          if sev_name == "medium" { risk_level_id = 2; risk_level = "Medium" }
          if sev_name == "high" { risk_level_id = 3; risk_level = "High" }
          if sev_name == "critical" { risk_level_id = 4; risk_level = "Critical" }
          ocsf.risk_level_id = risk_level_id
          ocsf.risk_level = risk_level

          # ---- what moat DID: action_taken -> disposition / action -------
          acted = to_string(m.action_taken) ?? "none"
          disposition_id = 15
          disposition = "Detected"
          action_id = 3
          action = "Observed"
          if acted == "blocked" || acted == "killed" {
              disposition_id = 2; disposition = "Blocked"; action_id = 2; action = "Denied"
          }
          if acted == "quarantined" {
              disposition_id = 3; disposition = "Quarantined"; action_id = 2; action = "Denied"
          }
          if acted == "restored" {
              disposition_id = 1; disposition = "Allowed"; action_id = 1; action = "Allowed"
          }
          ocsf.disposition_id = disposition_id
          ocsf.disposition = disposition
          ocsf.action_id = action_id
          ocsf.action = action

          # ---- the finding's lifecycle ----------------------------------
          # A suppression is a finding that a rule already answered; an ack is
          # one a person answered. Neither is "New".
          suppressed_by = to_string(m.suppressed_by) ?? ""
          status_id = 1
          status = "New"
          if suppressed_by != "" {
              status_id = 3; status = "Suppressed"
              ocsf.status_detail = suppressed_by
          }
          if (bool(m.acked) ?? false) { status_id = 4; status = "Resolved" }
          ocsf.status_id = status_id
          ocsf.status = status

          # ---- the acting process is the ACTOR on a finding --------------
          proc = object(m.process) ?? {}
          exe = to_string(proc.exe) ?? ""
          exe_name = ""
          if exe != "" {
              nm, nm_err = parse_regex(exe, r'(?P<b>[^/]+)$')
              if nm_err == null { exe_name = to_string(nm.b) }
          }
          actor_process = {}
          if exe_name != "" { actor_process.name = exe_name }
          if exe != "" { actor_process.file = { "name": exe_name, "path": exe, "type_id": 1 } }
          args = to_string(proc.args) ?? ""
          if args != "" { actor_process.cmd_line = args }
          proc_pid = to_int(proc.pid) ?? -1
          if proc_pid >= 0 { actor_process.pid = proc_pid }

          actor = {}
          if proc_pid >= 0 { actor.process = actor_process }
          proc_uid = to_int(proc.uid) ?? -1
          if proc_uid >= 0 { actor.user = { "uid": to_string(proc_uid) } }
          if length(actor) > 0 { ocsf.actor = actor }
          ocsf.device = device

          # ---- what the finding is ABOUT --------------------------------
          # 2004 defines no `file` / `dst_endpoint`, so the target artifacts go
          # into evidences[] (OCSF) and observables[] (promoted, pivotable).
          # Only artifacts with no other home go in here: the acting process is
          # already in actor.process and the host in device, and repeating them
          # would pay for the same value twice in a columnar store.
          evidence = {}

          fpath = to_string(m.file.path) ?? ""
          fsha = downcase(to_string(m.file.sha256) ?? "")
          if fpath != "" {
              fname = ""
              fn, fn_err = parse_regex(fpath, r'(?P<b>[^/]+)$')
              if fn_err == null { fname = to_string(fn.b) }
              file_obj = { "name": fname, "path": fpath, "type_id": 1 }
              if fsha != "" { file_obj.hashes = [{ "algorithm_id": 3, "value": fsha }] }
              evidence.file = file_obj
              obs = push(obs, { "name": "evidences.file.path", "type": "File Name", "type_id": 7, "value": fpath })
              if fsha != "" {
                  obs = push(obs, { "name": "evidences.file.hashes.value", "type": "Hash", "type_id": 8, "value": fsha })
              }
          }

          dst_ip = to_string(m.net.dst_ip) ?? ""
          dst_domain = to_string(m.net.domain) ?? ""
          if dst_ip != "" || dst_domain != "" {
              dst = {}
              if dst_ip != "" { dst.ip = downcase(dst_ip) }
              if dst_domain != "" { dst.hostname = downcase(dst_domain) }
              dst_port = to_int(m.net.dst_port) ?? 0
              if dst_port > 0 { dst.port = dst_port }
              evidence.dst_endpoint = dst
              if dst_ip != "" {
                  obs = push(obs, { "name": "evidences.dst_endpoint.ip", "type": "IP Address", "type_id": 2, "value": downcase(dst_ip) })
              }
              if dst_domain != "" {
                  obs = push(obs, { "name": "evidences.dst_endpoint.hostname", "type": "Hostname", "type_id": 1, "value": downcase(dst_domain) })
              }
          }

          # ---- name resolution (moat docs/DNS.md) -----------------------
          #
          # The kernel sees addresses. moat learns the NAME from
          # systemd-resolved's own query stream and ships four fields about it,
          # three of which are new and none of which had a home here.
          #
          # `domain` above is keyed by ADDRESS -- this machine resolved that
          # name to that address recently, so a connection there probably
          # belongs to it. `domain_queried_by` is keyed by the NAME and is
          # observed in the asking process's own context, so it is a strictly
          # stronger claim: it says who looked it up rather than inferring it
          # from a shared cache. Keeping them apart matters, because the
          # interesting case is when they DISAGREE -- one process resolves a
          # name and a different one connects to the address.
          #
          # Absent is NOT RECORDED, never "nobody asked": a Go binary with its
          # own resolver never touches nss, a literal-IP connection has no
          # lookup at all, and a lookup predating moatd is gone. So these keys
          # are omitted rather than emitted empty -- a null here would read as
          # a negative finding, which is the one thing it is not.
          dns = {}
          queried_by = to_string(m.net.domain_queried_by) ?? ""
          if queried_by != "" {
              dns.queried_by = queried_by
              # moat ships "<exe> (pid N)". Split it so the lake can facet on
              # the binary and join on the pid without a LIKE.
              qm = parse_regex(queried_by, r'^(?P<exe>.+?)\s+\(pid\s+(?P<pid>\d+)\)$') ?? {}
              q_exe = to_string(qm.exe)
              q_pid = to_int(qm.pid) ?? 0
              if q_exe != "" {
                  dns.queried_by_exe = q_exe
                  q_parts = split(q_exe, "/")
                  q_name = to_string(q_parts[-1])
                  if q_name != "" {
                      dns.queried_by_name = q_name
                      obs = push(obs, { "name": "unmapped.dns.queried_by_name", "type": "Process Name", "type_id": 9, "value": q_name })
                  }
              }
              if q_pid > 0 { dns.queried_by_pid = q_pid }
              # Did the process that asked also connect? The answer is the
              # difference between "this program resolved and used the name"
              # and "something else resolved it and this used the address",
              # and a reader should not have to compare two strings to get it.
              if q_pid > 0 && proc_pid >= 0 {
                  dns.queried_by_self = q_pid == proc_pid
              }
          }
          d_age = to_int(m.net.domain_age_secs) ?? -1
          if d_age >= 0 {
              # The name is cached by address, so a large age is the cue that a
              # CDN address may since have been handed to somebody else.
              dns.resolution_age_secs = d_age
          }
          d_cname = to_string(m.net.domain_cname) ?? ""
          if d_cname != "" {
              dns.cname = downcase(d_cname)
              obs = push(obs, { "name": "unmapped.dns.cname", "type": "Hostname", "type_id": 1, "value": downcase(d_cname) })
          }
          if length(dns) > 0 { unmapped.dns = dns }

          # ---- the indicator that fired ---------------------------------
          #
          # `ioc` is what makes a domain-feed or hash-feed finding a finding at
          # all, and it was not carried anywhere. `matched` is prefixed by kind
          # ("domain:evil.example", "sha256:..."), which is exactly enough to
          # type the observable correctly instead of dumping a string.
          ioc = object(m.ioc) ?? {}
          if length(ioc) > 0 {
              ioc_source = to_string(ioc.source) ?? ""
              ioc_matched = to_string(ioc.matched) ?? ""
              if ioc_source != "" { unmapped.ioc_source = ioc_source }
              if ioc_matched != "" {
                  unmapped.ioc_matched = ioc_matched
                  iparts = split(ioc_matched, ":", limit: 2)
                  ikind = to_string(iparts[0])
                  ivalue = to_string(iparts[1])
                  if ivalue != "" {
                      unmapped.ioc_kind = ikind
                      unmapped.ioc_value = ivalue
                      if ikind == "domain" {
                          obs = push(obs, { "name": "unmapped.ioc_value", "type": "Hostname", "type_id": 1, "value": downcase(ivalue) })
                      } else if ikind == "sha256" || ikind == "hash" {
                          obs = push(obs, { "name": "unmapped.ioc_value", "type": "Hash", "type_id": 8, "value": downcase(ivalue) })
                      } else {
                          obs = push(obs, { "name": "unmapped.ioc_value", "type": "Other", "type_id": 0, "value": ivalue })
                      }
                  }
              }
          }
          if length(evidence) > 0 { ocsf.evidences = [evidence] }
          if exe_name != "" {
              obs = push(obs, { "name": "actor.process.name", "type": "Process Name", "type_id": 9, "value": exe_name })
          }

          # ---- moat's facet vocabulary ----------------------------------
          # SHIPPING.md §5 "the one field to facet on" plus the four fields it
          # is derived from, the scoring trail, and provenance. The `explain`
          # block is intentionally NOT copied - it is several KB already sitting
          # in raw_data.
          if family != "" { unmapped.family = family }
          if rule != "" { unmapped.rule = rule }
          tier = to_string(m.tier) ?? ""
          if tier != "" { unmapped.tier = tier }
          surface = to_string(m.surface) ?? ""
          if surface != "" { unmapped.surface = surface }
          context = to_string(m.context) ?? ""
          if context != "" { unmapped.context = context }
          mode = to_string(m.mode) ?? ""
          if mode != "" { unmapped.mode = mode }
          if acted != "" { unmapped.action_taken = acted }
          sev_base = to_string(m.severity_base) ?? ""
          if sev_base != "" { unmapped.severity_base = sev_base }
          sev_reason = to_string(m.severity_reason) ?? ""
          if sev_reason != "" { unmapped.severity_reason = sev_reason }
          rarity = to_string(m.rarity) ?? ""
          if rarity != "" { unmapped.rarity = rarity }
          rarity_text = to_string(m.rarity_text) ?? ""
          if rarity_text != "" { unmapped.rarity_text = rarity_text }
          if suppressed_by != "" { unmapped.suppressed_by = suppressed_by }
          unmapped.pkg_install_escalation = bool(m.pkg_install_escalation) ?? false
          unmapped.acked = bool(m.acked) ?? false
          acked_by = to_string(m.acked_by) ?? ""
          if acked_by != "" { unmapped.acked_by = acked_by }
          provenance = to_string(m.actor.provenance) ?? ""
          if provenance != "" { unmapped.provenance = provenance }
          actor_package = to_string(m.actor.package) ?? ""
          if actor_package != "" { unmapped.actor_package = actor_package }
          actor_script = to_string(m.actor.script) ?? ""
          if actor_script != "" { unmapped.actor_script = actor_script }
          cwd = to_string(proc.cwd) ?? ""
          if cwd != "" { unmapped.cwd = cwd }

          # Ancestry, root-first, as one greppable string. moat ships it
          # leaf-first; its own summaries read root -> leaf.
          # moat ships ancestry leaf-first (parent, grandparent, ... init) and
          # renders it root-first. Prepending each entry rebuilds that order;
          # VRL has no reverse().
          anc = array(m.process.ancestry) ?? []
          if length(anc) > 0 {
              acc = ""
              for_each(anc) -> |_i, a| {
                  ae = to_string(a.exe) ?? ""
                  if ae != "" {
                      if acc == "" { acc = ae } else { acc = ae + " -> " + acc }
                  }
              }
              if acc != "" {
                  if exe != "" { acc = acc + " -> " + exe }
                  unmapped.ancestry = acc
                  unmapped.ancestry_depth = length(anc)
              }
          }

          # ---- correlation chain (design 2b/3a) -------------------------
          chain = object(m.chain) ?? {}
          if length(chain) > 0 {
              correlation_uid = to_string(chain.id) ?? ""
              unmapped.chain_id = correlation_uid
              unmapped.chain_severity = to_string(chain.severity) ?? ""
              unmapped.chain_severity_base = to_string(chain.severity_base) ?? ""
              unmapped.chain_severity_reason = to_string(chain.severity_reason) ?? ""
              unmapped.chain_summary = to_string(chain.summary) ?? ""
              unmapped.chain_steps_total = to_int(chain.steps_total) ?? 0
              unmapped.chain_triggers_total = to_int(chain.triggers_total) ?? 0
              unmapped.chain_span_secs = to_int(chain.span_secs) ?? 0
              unmapped.chain_ancestor_exe = to_string(chain.ancestor.exe) ?? ""
              fams = array(chain.families) ?? []
              if length(fams) > 0 { unmapped.chain_families = join!(fams, ",") }
              mems = array(chain.members) ?? []
              if length(mems) > 0 { unmapped.chain_members = join!(mems, ",") }
              rules_seen = []
              steps = array(chain.steps) ?? []
              for_each(steps) -> |_i, s| {
                  sr = to_string(s.rule) ?? ""
                  if sr != "" { rules_seen = push(rules_seen, sr) }
              }
              if length(rules_seen) > 0 { unmapped.chain_rules = join!(rules_seen, ",") }
          }

          # ---- AI triage verdict (LEARNING-AND-ANALYSIS) -----------------
          triage = object(m.triage) ?? {}
          if length(triage) > 0 {
              unmapped.triage_verdict = to_string(triage.verdict) ?? ""
              unmapped.triage_confidence = to_string(triage.confidence) ?? ""
              unmapped.triage_outcome = to_string(triage.outcome) ?? ""
              unmapped.triage_agent = to_string(triage.agent) ?? ""
              unmapped.triage_summary = to_string(triage.summary) ?? ""
              unmapped.triage_at = to_string(triage.at) ?? ""
              tpa = to_string(triage.proposed_allowlist) ?? ""
              if tpa != "" { unmapped.triage_proposed_allowlist = tpa }
          }

          # ---- staged evidence: the snapshot exists, its bytes never ship -
          inc_dir = to_string(m.incident.dir) ?? ""
          if inc_dir != "" {
              unmapped.incident_dir = inc_dir
              unmapped.incident_file_count = length(array(m.incident.files) ?? [])
          }

          # ---- content capture: shape, never the body --------------------
          content = array(m.content) ?? []
          if length(content) > 0 {
              ckinds = []
              for_each(content) -> |_i, c| {
                  ck = to_string(c.kind) ?? ""
                  if ck != "" { ckinds = push(ckinds, ck) }
              }
              if length(ckinds) > 0 { unmapped.content_kinds = join!(ckinds, ",") }
              unmapped.content_count = length(content)
          }

          acts = array(m.actions) ?? []
          if length(acts) > 0 { unmapped.actions_available = join!(acts, ",") }
          carried_gen = to_int(m.carried.generation) ?? 0
          if carried_gen > 0 { unmapped.carried_generation = carried_gen }

      } else if env_class == "alerts" && kind == "update" {
          # ================= Detection Finding 2004 (Update) =============
          # A state change on an alert already shipped: an ack, a re-count, a
          # chain that grew, a triage verdict that landed. Same finding_info.uid
          # so it joins to the Create.
          class_uid = 2004
          class_name = "Detection Finding"
          category_uid = 2
          category_name = "Findings"
          activity_id = 2
          activity_name = "Update"
          profiles = ["host", "security_control"]

          u = object(m.update) ?? {}
          alert_id = to_string(m.id) ?? ""
          if alert_id == "" { alert_id = event_id }
          if alert_id == "" { alert_id = uuid_v4() }
          ocsf.finding_info = {
              "uid": alert_id,
              "title": "moat alert state change",
              "data_sources": ["moat_edr", host]
          }
          ocsf.device = device

          status_id = 2
          status = "In Progress"
          if (bool(u.acked) ?? false) { status_id = 4; status = "Resolved" }
          ocsf.status_id = status_id
          ocsf.status = status

          count = to_int(u.count) ?? 0
          if count > 0 { ocsf.count = count }

          unmapped.acked = bool(u.acked) ?? false
          acked_by = to_string(u.acked_by) ?? ""
          if acked_by != "" { unmapped.acked_by = acked_by }
          surface = to_string(u.surface) ?? ""
          if surface != "" { unmapped.surface = surface }
          upd_ts = to_string(u.ts) ?? ""
          if upd_ts != "" { unmapped.update_ts = upd_ts }

          chain = object(u.chain) ?? {}
          if length(chain) > 0 {
              correlation_uid = to_string(chain.id) ?? ""
              unmapped.chain_id = correlation_uid
              unmapped.chain_severity = to_string(chain.severity) ?? ""
              unmapped.chain_summary = to_string(chain.summary) ?? ""
              unmapped.chain_steps_total = to_int(chain.steps_total) ?? 0
              unmapped.chain_span_secs = to_int(chain.span_secs) ?? 0
              fams = array(chain.families) ?? []
              if length(fams) > 0 { unmapped.chain_families = join!(fams, ",") }
          }
          triage = object(u.triage) ?? {}
          if length(triage) > 0 {
              unmapped.triage_verdict = to_string(triage.verdict) ?? ""
              unmapped.triage_confidence = to_string(triage.confidence) ?? ""
              unmapped.triage_outcome = to_string(triage.outcome) ?? ""
              unmapped.triage_agent = to_string(triage.agent) ?? ""
              unmapped.triage_summary = to_string(triage.summary) ?? ""
          }
          inc_dir = to_string(u.incident.dir) ?? ""
          if inc_dir != "" {
              unmapped.incident_dir = inc_dir
              unmapped.incident_file_count = length(array(u.incident.files) ?? [])
          }

      } else if env_class == "alerts" && kind == "receipt" {
          # ================= Process Activity 1007 (Terminate) ===========
          # An install receipt is written when the package-install ROOT process
          # exits, and carries that process, its exit code, how long it ran and
          # what its subtree did. 1007/Terminate is the shape that already has
          # all four; the behavioural counters ride in unmapped.
          class_uid = 1007
          class_name = "Process Activity"
          category_uid = 1
          category_name = "System Activity"
          activity_id = 2
          activity_name = "Terminate"

          r = object(m.receipt) ?? {}
          receipt_id = to_string(r.id) ?? ""
          if receipt_id == "" { receipt_id = record_uid_seed }
          root_exe = to_string(r.root_exe) ?? ""
          root_name = ""
          if root_exe != "" {
              rn, rn_err = parse_regex(root_exe, r'(?P<b>[^/]+)$')
              if rn_err == null { root_name = to_string(rn.b) }
          }
          rp = { "uid": receipt_id }
          if root_name != "" { rp.name = root_name }
          if root_exe != "" { rp.file = { "name": root_name, "path": root_exe, "type_id": 1 } }
          root_args = to_string(r.root_args) ?? ""
          if root_args != "" { rp.cmd_line = root_args }
          ocsf.process = rp
          # There is no recorded launcher for an install root - the receipt is
          # about the root itself, so it is its own actor rather than a fake pid.
          ocsf.actor = { "process": rp }
          ocsf.device = device

          exit_code = to_int(r.exit) ?? 0
          ocsf.status_code = to_string(exit_code)
          if exit_code == 0 { ocsf.status_id = 1; ocsf.status = "Success" }
          if exit_code != 0 { ocsf.status_id = 2; ocsf.status = "Failure" }
          dur_s = to_int(r.duration_s) ?? 0
          if dur_s > 0 { ocsf.duration = dur_s * 1000 }

          if root_name != "" {
              obs = push(obs, { "name": "process.name", "type": "Process Name", "type_id": 9, "value": root_name })
          }

          unmapped.receipt_id = receipt_id
          event_code = "receipt"
          rcwd = to_string(r.cwd) ?? ""
          if rcwd != "" { unmapped.cwd = rcwd }
          started = to_string(r.started) ?? ""
          if started != "" { unmapped.started = started }
          unmapped.execs_from_tree = to_int(r.execs_from_tree) ?? 0
          unmapped.execs_from_tmp = to_int(r.execs_from_tmp) ?? 0
          # The five lists are the whole point of a receipt: what an install
          # touched outside its own tree. Counts facet, the joined paths pivot.
          pis = array(r.postinstall_scripts) ?? []
          unmapped.postinstall_script_count = length(pis)
          if length(pis) > 0 { unmapped.postinstall_scripts = join!(pis, ",") }
          wop = array(r.writes_outside_project) ?? []
          unmapped.writes_outside_project_count = length(wop)
          if length(wop) > 0 { unmapped.writes_outside_project = join!(wop, ",") }
          creads = array(r.credential_reads) ?? []
          unmapped.credential_read_count = length(creads)
          if length(creads) > 0 { unmapped.credential_reads = join!(creads, ",") }
          pwrites = array(r.persistence_writes) ?? []
          unmapped.persistence_write_count = length(pwrites)
          if length(pwrites) > 0 { unmapped.persistence_writes = join!(pwrites, ",") }
          rnet = array(r.network) ?? []
          unmapped.network_count = length(rnet)
          if length(rnet) > 0 { unmapped.network = join!(rnet, ",") }

      } else if kind == "heartbeat" {
          # ================= Application Lifecycle 6002 (Other) ==========
          # SHIPPING.md §5: "alert on its absence". A shipper that has died is
          # indistinguishable from a quiet machine, so this has to be a fact the
          # lake can be queried for. 6002's activities are install/start/stop/
          # update - a periodic liveness beat is none of them, hence Other.
          class_uid = 6002
          class_name = "Application Lifecycle"
          category_uid = 6
          category_name = "Application Activity"
          activity_id = 99
          activity_name = "Other"

          ocsf.app = { "name": "moat-ship" }
          hb_version = to_string(m.version) ?? ""
          if hb_version != "" { ocsf.app.version = hb_version }
          ocsf.device = device

          last_error = to_string(m.last_error) ?? ""
          if last_error == "" { ocsf.status_id = 1; ocsf.status = "Success" }
          if last_error != "" {
              ocsf.status_id = 2
              ocsf.status = "Failure"
              ocsf.status_detail = last_error
          }

          event_code = "heartbeat"
          unmapped.app = "moat-ship"
          unmapped.shipped = to_int(m.shipped) ?? 0
          unmapped.dropped = to_int(m.dropped) ?? 0
          unmapped.withheld = to_int(m.withheld) ?? 0
          unmapped.backlog = to_int(m.backlog) ?? 0
          unmapped.backlog_bytes = to_int(m.backlog_bytes) ?? 0
          unmapped.transport = to_string(m.transport) ?? ""
          unmapped.last_ok = to_string(m.last_ok) ?? ""
          if hb_version != "" { unmapped.moat_version = hb_version }
          hb_classes = array(m.classes) ?? []
          if length(hb_classes) > 0 { unmapped.telemetry_classes = join!(hb_classes, ",") }

      } else if env_class == "process" {
          # ================= Process Activity 1007 =======================
          # The opt-in `process` class. exec ships a full projection; exit is
          # deliberately tiny - the collector already holds the exec this
          # exec_id refers to, which is the whole point of not inlining parents.
          class_uid = 1007
          class_name = "Process Activity"
          category_uid = 1
          category_name = "System Activity"
          activity_id = 1
          activity_name = "Launch"
          if kind == "exit" { activity_id = 2; activity_name = "Terminate" }

          exe = to_string(m.exe) ?? ""
          exe_name = ""
          if exe != "" {
              nm, nm_err = parse_regex(exe, r'(?P<b>[^/]+)$')
              if nm_err == null { exe_name = to_string(nm.b) }
          }
          subject = {}
          if exe_name != "" { subject.name = exe_name }
          if exe != "" { subject.file = { "name": exe_name, "path": exe, "type_id": 1 } }
          pargs = to_string(m.args) ?? ""
          if pargs != "" { subject.cmd_line = pargs }
          spid = to_int(m.pid) ?? -1
          if spid >= 0 { subject.pid = spid }
          exec_id = to_string(m.exec_id) ?? ""
          if exec_id != "" { subject.uid = exec_id }
          if spid < 0 && exec_id == "" { subject.uid = record_uid_seed }
          ocsf.process = subject

          # `inline_parent = true` restores a parent block for collectors that
          # cannot join; by default only parent_exec_id ships.
          par = object(m.parent) ?? {}
          if length(par) > 0 {
              pexe = to_string(par.exe) ?? ""
              pname = ""
              if pexe != "" {
                  pn, pn_err = parse_regex(pexe, r'(?P<b>[^/]+)$')
                  if pn_err == null { pname = to_string(pn.b) }
              }
              parent_process = {}
              if pname != "" { parent_process.name = pname }
              if pexe != "" { parent_process.file = { "name": pname, "path": pexe, "type_id": 1 } }
              pa = to_string(par.args) ?? ""
              if pa != "" { parent_process.cmd_line = pa }
              ppid = to_int(par.pid) ?? -1
              if ppid >= 0 { parent_process.pid = ppid }
              pexec = to_string(par.exec_id) ?? ""
              if pexec != "" { parent_process.uid = pexec }
              if ppid < 0 && pexec == "" { parent_process.uid = record_uid_seed }
              ocsf.actor = { "process": parent_process }
          } else {
              ocsf.actor = { "process": subject }
          }
          puid = to_int(m.uid) ?? -1
          if puid >= 0 { ocsf.actor.user = { "uid": to_string(puid) } }
          ocsf.device = device

          if kind == "exit" {
              exit_status = to_int(m.status) ?? 0
              ocsf.status_code = to_string(exit_status)
              if exit_status == 0 { ocsf.status_id = 1; ocsf.status = "Success" }
              if exit_status != 0 { ocsf.status_id = 2; ocsf.status = "Failure" }
              exit_signal = to_int(m.signal) ?? 0
              if exit_signal > 0 { unmapped.exit_signal = exit_signal }
          } else {
              ocsf.status_id = 1
              ocsf.status = "Success"
          }

          if exe_name != "" {
              obs = push(obs, { "name": "process.name", "type": "Process Name", "type_id": 9, "value": exe_name })
          }
          if exec_id != "" { unmapped.exec_id = exec_id }
          parent_exec_id = to_string(m.parent_exec_id) ?? ""
          if parent_exec_id != "" { unmapped.parent_exec_id = parent_exec_id }
          pcwd = to_string(m.cwd) ?? ""
          if pcwd != "" { unmapped.cwd = pcwd }
          pauid = to_int(m.auid) ?? -1
          if pauid >= 0 { unmapped.auid = pauid }
          pstart = to_string(m.start_time) ?? ""
          if pstart != "" { unmapped.start_time = pstart }

      } else if env_class == "network" {
          # ================= Network Activity 4001 (Open) ================
          # Only outbound connects to PUBLIC addresses reach userspace at all -
          # private, loopback, link-local and IPv6 ULA are excluded in-kernel.
          class_uid = 4001
          class_name = "Network Activity"
          category_uid = 4
          category_name = "Network Activity"
          activity_id = 1
          activity_name = "Open"

          dst = {}
          dst_ip = downcase(to_string(m.dst_ip) ?? "")
          if dst_ip != "" { dst.ip = dst_ip }
          dst_port = to_int(m.dst_port) ?? 0
          if dst_port > 0 { dst.port = dst_port }
          if dst_ip != "" { ocsf.dst_endpoint = dst }
          ocsf.src_endpoint = { "hostname": device_hostname }
          ocsf.connection_info = { "direction_id": 2 }
          ocsf.status_id = 1
          ocsf.status = "Success"

          net_actor = {}
          nexe = to_string(m.exe) ?? ""
          nname = ""
          if nexe != "" {
              nn, nn_err = parse_regex(nexe, r'(?P<b>[^/]+)$')
              if nn_err == null { nname = to_string(nn.b) }
          }
          np = {}
          if nname != "" { np.name = nname }
          if nexe != "" { np.file = { "name": nname, "path": nexe, "type_id": 1 } }
          nargs = to_string(m.args) ?? ""
          if nargs != "" { np.cmd_line = nargs }
          npid = to_int(m.pid) ?? -1
          if npid >= 0 { np.pid = npid }
          nexec = to_string(m.exec_id) ?? ""
          if nexec != "" { np.uid = nexec }
          if npid >= 0 || nexec != "" { net_actor.process = np }
          nuid = to_int(m.uid) ?? -1
          if nuid >= 0 { net_actor.user = { "uid": to_string(nuid) } }
          if length(net_actor) > 0 { ocsf.actor = net_actor }
          ocsf.device = device

          if dst_ip != "" {
              obs = push(obs, { "name": "dst_endpoint.ip", "type": "IP Address", "type_id": 2, "value": dst_ip })
          }
          if nname != "" {
              obs = push(obs, { "name": "actor.process.name", "type": "Process Name", "type_id": 9, "value": nname })
          }
          event_code = "connect"
          nhook = to_string(m.hook) ?? ""
          if nhook != "" { unmapped.hook = nhook }
          if nexec != "" { unmapped.exec_id = nexec }
          nparent = to_string(m.parent_exec_id) ?? ""
          if nparent != "" { unmapped.parent_exec_id = nparent }
          ncwd = to_string(m.cwd) ?? ""
          if ncwd != "" { unmapped.cwd = ncwd }
          # pkg_root is ancestry the kernel cannot see: it separates "npm
          # unpacked this" from "something rewrote it afterwards".
          npkg = to_string(m.pkg_root) ?? ""
          if npkg != "" { unmapped.pkg_root = npkg }

      } else if env_class == "file" {
          # ================= File System Activity 1001 ===================
          # verdict is the create/modify ladder of SHIPPING.md §3: a modify of an
          # already-installed script is worth more than its creation, which is
          # why the two are different activities here rather than one "write".
          class_uid = 1001
          class_name = "File System Activity"
          category_uid = 1
          category_name = "System Activity"
          verdict = to_string(m.verdict) ?? ""
          activity_id = 3
          activity_name = "Update"
          if verdict == "create" { activity_id = 1; activity_name = "Create" }
          if kind == "file_chmod" || verdict == "chmod_x" {
              activity_id = 6
              activity_name = "Set Attributes"
          }

          fpath = to_string(m.path) ?? ""
          fname = ""
          if fpath != "" {
              fn, fn_err = parse_regex(fpath, r'(?P<b>[^/]+)$')
              if fn_err == null { fname = to_string(fn.b) }
          }
          if fname == "" { fname = "unknown" }
          file_obj = { "name": fname, "type_id": 1 }
          if fpath != "" { file_obj.path = fpath }
          fsize = to_int(m.bytes) ?? -1
          if fsize >= 0 { file_obj.size = fsize }
          fsha = downcase(to_string(m.sha256) ?? "")
          if fsha != "" { file_obj.hashes = [{ "algorithm_id": 3, "value": fsha }] }
          ocsf.file = file_obj

          file_actor = {}
          fexe = to_string(m.exe) ?? ""
          fexe_name = ""
          if fexe != "" {
              xn, xn_err = parse_regex(fexe, r'(?P<b>[^/]+)$')
              if xn_err == null { fexe_name = to_string(xn.b) }
          }
          fp = {}
          if fexe_name != "" { fp.name = fexe_name }
          if fexe != "" { fp.file = { "name": fexe_name, "path": fexe, "type_id": 1 } }
          fargs = to_string(m.args) ?? ""
          if fargs != "" { fp.cmd_line = fargs }
          fpid = to_int(m.pid) ?? -1
          if fpid >= 0 { fp.pid = fpid }
          fexec = to_string(m.exec_id) ?? ""
          if fexec != "" { fp.uid = fexec }
          if fpid >= 0 || fexec != "" { file_actor.process = fp }
          fuid = to_int(m.uid) ?? -1
          if fuid >= 0 { file_actor.user = { "uid": to_string(fuid) } }
          if length(file_actor) > 0 { ocsf.actor = file_actor }
          ocsf.device = device
          ocsf.status_id = 1
          ocsf.status = "Success"

          if fpath != "" {
              obs = push(obs, { "name": "file.path", "type": "File Name", "type_id": 7, "value": fpath })
          }
          if fsha != "" {
              obs = push(obs, { "name": "file.hashes.value", "type": "Hash", "type_id": 8, "value": fsha })
          }
          if fexe_name != "" {
              obs = push(obs, { "name": "actor.process.name", "type": "Process Name", "type_id": 9, "value": fexe_name })
          }
          event_code = kind
          if fsize >= 0 { unmapped.file_bytes = fsize }
          if verdict != "" { unmapped.verdict = verdict }
          fshape = to_string(m.shape) ?? ""
          if fshape != "" { unmapped.shape = fshape }
          if fexec != "" { unmapped.exec_id = fexec }
          fparent = to_string(m.parent_exec_id) ?? ""
          if fparent != "" { unmapped.parent_exec_id = fparent }
          fcwd = to_string(m.cwd) ?? ""
          if fcwd != "" { unmapped.cwd = fcwd }
          fpkg = to_string(m.pkg_root) ?? ""
          if fpkg != "" { unmapped.pkg_root = fpkg }
          # capture_body is off by default and is the only switch that puts file
          # CONTENTS anywhere they can leave the machine. Kept out of a promoted
          # column on purpose.
          fbody = to_string(m.body) ?? ""
          if fbody != "" { unmapped.body = fbody }

      } else {
          # An envelope shape this parser does not know yet. Keep it in the
          # findings lane, visible and searchable, rather than silently
          # reshaping it into a class it is not.
          class_uid = 2004
          class_name = "Detection Finding"
          category_uid = 2
          category_name = "Findings"
          activity_id = 99
          activity_name = "Other"
          unknown_uid = event_id
          if unknown_uid == "" { unknown_uid = uuid_v4() }
          ocsf.finding_info = {
              "uid": unknown_uid,
              "title": "Unrecognized moat record",
              "data_sources": ["moat_edr", host]
          }
          ocsf.device = device
          ocsf.status_id = 1
          ocsf.status = "New"
          if env_class != "" { unmapped.moat_class = env_class }
          if kind != "" { unmapped.moat_kind = kind }
      }

      # ---- common envelope ---------------------------------------------
      ocsf.class_uid = class_uid
      ocsf.class_name = class_name
      ocsf.category_uid = category_uid
      ocsf.category_name = category_name
      ocsf.activity_id = activity_id
      ocsf.activity_name = activity_name
      ocsf.type_uid = class_uid * 100 + activity_id
      ocsf.severity_id = severity_id
      ocsf.severity = severity
      ocsf.time = time_ms
      ocsf.raw_data = raw_log

      record_uid = event_id
      if record_uid == "" { record_uid = uuid_v4() }
      metadata = {
          "version": "1.9.0",
          "profiles": profiles,
          "uid": record_uid,
          "original_event_uid": record_uid,
          "log_name": "moat_edr",
          "log_source": "moat_edr",
          "product": { "name": "Moat", "vendor_name": "Omarchy" }
      }
      if event_code != "" { metadata.event_code = event_code }
      # The chain is moat's own correlation id - the thing that turns several
      # ripples into one story. Promoting it to metadata.correlation_uid is what
      # lets the lake group them without knowing about chains.
      if correlation_uid != "" { metadata.correlation_uid = correlation_uid }
      ocsf.metadata = metadata

      if length(obs) > 0 { ocsf.observables = obs }
      if length(unmapped) > 0 { ocsf.unmapped = unmapped }

      . = ocsf
  }
samples:
  - raw: "{\"v\":1,\"event_id\":\"01M1YHP0B33FCV271CB2NPRNKM\",\"host\":\"mars\",\"class\":\"alerts\",\"kind\":\"alert\",\"moat_tier\":\"gator\",\"severity\":\"critical\",\"@timestamp\":\"2026-09-07T18:22:12.727Z\",\"moat\":{\"v\":1,\"id\":\"01M1YHP0B33FCV271CB2NPRNKM\",\"ts\":\"2026-09-07T18:22:12.727Z\",\"severity\":\"critical\",\"rule\":\"moat-cred-cloud-credentials-read\",\"family\":\"cred\",\"title\":\"Cloud credentials read by an unexpected program\",\"summary\":\"node (pid 41233) read ~/.aws/credentials. Parent chain: systemd -> fish -> node -> sh -> node.\",\"process\":{\"pid\":41233,\"uid\":1000,\"exe\":\"/usr/bin/node\",\"args\":\"node setup.mjs\",\"cwd\":\"~/proj\",\"start_ts\":\"2026-09-07T18:22:12.727Z\",\"ancestry\":[{\"pid\":41200,\"exe\":\"/bin/sh\"},{\"pid\":41100,\"exe\":\"/usr/bin/node\"},{\"pid\":900,\"exe\":\"/usr/bin/fish\"}]},\"file\":{\"path\":\"~/.aws/credentials\",\"sha256\":null},\"explain\":{\"what\":\"node read ~/.aws/credentials.\",\"why\":\"...\",\"evidence\":[\"...\"],\"expected\":\"...\",\"next\":[\"...\"]},\"action_taken\":\"blocked\",\"actions\":[\"kill\",\"quarantine\",\"ignore\"],\"acked\":false,\"mode\":\"enforce\",\"actor\":{\"provenance\":\"user\",\"package\":null},\"context\":\"pkg-install\",\"severity_base\":\"high\",\"severity_reason\":\"high -> critical: pkg-install context\",\"surface\":\"alerts\",\"tier\":\"detection\",\"pkg_install_escalation\":true,\"suppressed_by\":null,\"rarity\":\"first_seen\",\"rarity_text\":\"first time seen here\",\"chain\":{\"v\":1,\"id\":\"CH-01\",\"families\":[\"cred\",\"net\"],\"severity\":\"critical\",\"severity_base\":\"high\",\"severity_reason\":\"...\",\"steps_total\":2,\"triggers_total\":2,\"span_secs\":3,\"truncated\":false,\"first_ts\":\"2026-09-07T18:22:12.727Z\",\"last_ts\":\"2026-09-07T18:22:12.727Z\",\"summary\":\"credential read then egress\",\"ancestor\":{\"pid\":41100,\"exe\":\"/usr/bin/node\"},\"members\":[\"01A\",\"01B\"],\"steps\":[{\"alert\":\"01A\",\"ts\":\"2026-09-07T18:22:12.727Z\",\"family\":\"cred\",\"rule\":\"moat-cred-cloud-credentials-read\",\"exe\":\"/usr/bin/node\",\"pid\":41233,\"role\":\"trigger\",\"severity\":\"high\",\"title\":\"...\"}]}}}"
    expect:
      "class_uid": 2004
      "activity_id": 1
      "disposition_id": 2
      "finding_info.uid": "01M1YHP0B33FCV271CB2NPRNKM"
      "metadata.version": "1.9.0"
  - raw: "{\"v\":1,\"event_id\":\"01M1YHP0B33FCV271CB2NPRNKM.5e74dc7a5617\",\"host\":\"mars\",\"class\":\"alerts\",\"kind\":\"update\",\"moat_tier\":\"silt\",\"severity\":\"info\",\"@timestamp\":\"\",\"moat\":{\"v\":1,\"id\":\"01M1YHP0B33FCV271CB2NPRNKM\",\"update\":{\"acked\":true,\"acked_by\":\"dan\",\"ts\":\"2026-09-07T18:22:12.727Z\",\"count\":3,\"surface\":\"alerts\"}}}"
    expect:
      "class_uid": 2004
      "activity_id": 2
      "status_id": 4
      "metadata.version": "1.9.0"
  - raw: "{\"v\":1,\"event_id\":\"7983f8b39ff4\",\"host\":\"mars\",\"class\":\"alerts\",\"kind\":\"receipt\",\"moat_tier\":\"silt\",\"severity\":\"info\",\"@timestamp\":\"\",\"moat\":{\"v\":1,\"receipt\":{\"id\":\"01M1YGDTRRZYPAAGWYVX1DNHNZ\",\"root_exe\":\"/usr/bin/npm\",\"root_args\":\"npm install\",\"cwd\":\"~/proj\",\"started\":\"2026-09-07T18:22:12.727Z\",\"duration_s\":42,\"exit\":0,\"postinstall_scripts\":[\"~/proj/node_modules/evil/postinstall.js\"],\"writes_outside_project\":[\"~/.bashrc\"],\"network\":[\"185.220.101.55:4444\"],\"credential_reads\":[\"~/.aws/credentials\"],\"persistence_writes\":[\"~/.bashrc\"],\"execs_from_tree\":171,\"execs_from_tmp\":2}}}"
    expect:
      "class_uid": 1007
