source: json
transforms:
- source: timestamp
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  insertId:
  - api.request.uid
  - metadata.uid
  logName:
  - metadata.log_name
  protoPayload.authenticationInfo.principalEmail:
  - actor.user.email_addr
  - actor.user.name
  - actor.user.uid
  protoPayload.methodName:
  - api.operation
  protoPayload.requestMetadata.callerIp:
  - src_endpoint.hostname
  - src_endpoint.ip
  protoPayload.requestMetadata.callerSuppliedUserAgent:
  - http_request.user_agent
  protoPayload.resourceName:
  - resources.name
  - resources.uid
  protoPayload.status.code:
  - status_code
  protoPayload.status.message:
  - api.response.message
  - status_detail
  resource.labels.project_id:
  - cloud.account.name
  - cloud.account.uid
  - cloud.project_uid
  - resources.namespace
  resource.labels.zone:
  - cloud.region
  - cloud.zone
  - resources.zone
  resource.type:
  - resources.type
