source: json
transforms:
- source: timestamp
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: receiveTimestamp
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: severity
  kind: enum
  target: severity_id
  values:
    informational: 1
    info: 1
    debug: 1
    low: 2
    medium: 3
    warn: 3
    warning: 3
    high: 4
    error: 4
    critical: 5
    fatal: 6
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping;
    consume only when the expected ID is emitted.
consumed_candidates:
- insertId
- logName
- protoPayload
- protoPayload.authenticationInfo
- protoPayload.authenticationInfo.oauthInfo.oauthClientId
- protoPayload.authenticationInfo.principalEmail
- protoPayload.authenticationInfo.principalSubject
- protoPayload.authorizationInfo
- protoPayload.methodName
- protoPayload.request
- protoPayload.requestMetadata
- protoPayload.requestMetadata.callerIp
- protoPayload.requestMetadata.callerSuppliedUserAgent
- protoPayload.resourceName
- protoPayload.response
- protoPayload.serviceData
- protoPayload.serviceData.policyDelta.bindingDeltas
- protoPayload.serviceName
- protoPayload.status
- protoPayload.status.code
- protoPayload.status.message
- receiveTimestamp
- resource
- resource.labels
- resource.labels.project_id
- resource.labels.zone
- resource.type
- severity
- timestamp
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
