name: gcp_audit_ocsf
display_name: GCP Audit Log (OCSF)
version: "1.1.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields in redacted, dotted snake_case unmapped keys.
  Parses Google Cloud Audit Logs (cloudaudit.googleapis.com) into complete OCSF
  1.9.0 "API Activity" (class_uid 6003) records carrying the cloud profile.
  Admin Activity, Data Access and System Event entries all share the AuditLog
  protoPayload, so the method lands on api.operation, the principal on
  actor.user, the authorization decision on status, and the target on
  resources[]. The whole OCSF object is emitted on the root so it lands in
  ocsf_logs.event and the promoted columns materialize. Mirrors the UDM
  gcp_audit parser but targets OCSF instead of `.udm.*`.
match_values:
  - gcp_audit
category: cloud
vendor: "Google"
product: "Cloud Audit Logs"
parser_vrl: |
  # GCP Cloud Audit Log -> OCSF 1.9.0 API Activity (class_uid 6003)
  raw_log = to_string(.message) ?? ""
  __raw_body = raw_log
  __source_kv = {}
  class_uid = 6003

  parsed, err = parse_json(raw_log)
  __source_kv = object(parsed) ?? {}

  if err != null || !is_object(parsed) {
      . = {
          "class_uid": class_uid,
          "class_name": "API Activity",
          "category_uid": 6,
          "category_name": "Application Activity",
          "activity_id": 99,
          "activity_name": "Other",
          "type_uid": class_uid * 100 + 99,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "time": 0,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "profiles": ["cloud"],
              "uid": uuid_v4(),
              "log_level": "error",
              "log_name": "cloudaudit.googleapis.com",
              "product": { "name": "Google Cloud Audit Logs", "vendor_name": "Google" }
          },
          "api": { "operation": "Unknown", "service": { "name": "unknown" } },
          "cloud": { "provider": "GCP" },
          "actor": { "user": { "name": "unknown" } },
          "src_endpoint": { "ip": "0.0.0.0" }
      }
  } else {
      p = object!(parsed)
      payload = object(p.protoPayload) ?? {}
      resource = object(p.resource) ?? {}
      labels = object(resource.labels) ?? {}

      # ---- time ----
      time_ms = 0
      ts_str = to_string(p.timestamp) ?? ""
      if ts_str == "" { ts_str = to_string(p.receiveTimestamp) ?? "" }
      if ts_str != "" {
          t, terr = parse_timestamp(ts_str, "%+")
          if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
      }

      # ---- method -> activity_id ----
      method_name = to_string(payload.methodName) ?? ""
      verb = ""
      if method_name != "" {
          mparts = split(method_name, ".")
          mlast = length(mparts) - 1
          mgot, mgerr = get(mparts, [mlast])
          if mgerr == null { verb = downcase(to_string(mgot) ?? "") }
      }
      activity_id = 99
      activity_name = "Other"
      if starts_with(verb, "create") || starts_with(verb, "insert") { activity_id = 1; activity_name = "Create" }
      if starts_with(verb, "get") || starts_with(verb, "list") || starts_with(verb, "read") || starts_with(verb, "describe") || starts_with(verb, "search") || starts_with(verb, "check") || starts_with(verb, "aggregated") { activity_id = 2; activity_name = "Read" }
      if starts_with(verb, "update") || starts_with(verb, "patch") || starts_with(verb, "set") || starts_with(verb, "modify") || starts_with(verb, "enable") || starts_with(verb, "disable") || starts_with(verb, "start") || starts_with(verb, "stop") || starts_with(verb, "reset") || starts_with(verb, "resize") || starts_with(verb, "attach") || starts_with(verb, "detach") { activity_id = 3; activity_name = "Update" }
      if starts_with(verb, "delete") || starts_with(verb, "remove") || starts_with(verb, "destroy") || starts_with(verb, "purge") { activity_id = 4; activity_name = "Delete" }

      # ---- service ----
      service_name = to_string(payload.serviceName) ?? ""
      svc_short = service_name
      if service_name != "" {
          sparts = split(service_name, ".")
          sgot, sgerr = get(sparts, [0])
          if sgerr == null { svc_short = to_string(sgot) ?? service_name }
      }
      if svc_short == "" { svc_short = "unknown" }

      # ---- project id: resource.labels first, then logName ----
      project_id = to_string(labels.project_id) ?? ""
      log_name = to_string(p.logName) ?? ""
      if project_id == "" && log_name != "" {
          lparts = split(log_name, "/")
          lfirst, lferr = get(lparts, [0])
          if lferr == null && (to_string(lfirst) ?? "") == "projects" {
              lsecond, lserr = get(lparts, [1])
              if lserr == null { project_id = to_string(lsecond) ?? "" }
          }
      }

      cloud = { "provider": "GCP" }
      if project_id != "" {
          cloud.account = { "uid": project_id, "name": project_id }
          cloud.project_uid = project_id
      }
      zone = to_string(labels.zone) ?? ""
      if zone != "" { cloud.zone = zone; cloud.region = zone }

      # ---- principal ----
      auth_info = object(payload.authenticationInfo) ?? {}
      principal = to_string(auth_info.principalEmail) ?? ""
      user = { "name": "unknown" }
      if principal != "" {
          user = { "name": principal, "uid": principal }
          if contains(principal, "@") {
              user.email_addr = principal
              pparts = split(principal, "@")
              if length(pparts) == 2 { user.domain = to_string(pparts[1]) }
          }
          if ends_with(principal, ".gserviceaccount.com") {
              user.type_id = 4
              user.type = "Service"
          } else {
              user.type_id = 1
              user.type = "User"
          }
      }
      actor = { "user": user }

      # ---- caller network context ----
      req_meta = object(payload.requestMetadata) ?? {}
      caller_ip = to_string(req_meta.callerIp) ?? ""
      src_endpoint = { "ip": "0.0.0.0" }
      if caller_ip != "" {
          if is_ipv4(caller_ip) || is_ipv6(caller_ip) {
              src_endpoint = { "ip": downcase(caller_ip) }
          } else {
              # GCP emits sentinels like "private" / "gce-internal-ip"
              src_endpoint = { "ip": "0.0.0.0", "hostname": caller_ip }
          }
      }

      # ---- outcome: status.code beats authorizationInfo.granted ----
      status_obj = object(payload.status) ?? {}
      status_code_num = to_int(status_obj.code) ?? -1
      status_id = 1
      status_str = "Success"
      severity_id = 1
      severity = "Informational"

      auth_list = array(payload.authorizationInfo) ?? []
      first_auth = get(auth_list, [0]) ?? null
      permission = ""
      if first_auth != null {
          permission = to_string(get(first_auth, ["permission"]) ?? "") ?? ""
          granted = to_bool(get(first_auth, ["granted"]) ?? false) ?? false
          if !granted {
              status_id = 2
              status_str = "Failure"
              severity_id = 2
              severity = "Low"
          }
      }
      if status_code_num > 0 {
          status_id = 2
          status_str = "Failure"
          severity_id = 2
          severity = "Low"
      }

      gcp_sev = upcase(to_string(p.severity) ?? "")
      if gcp_sev == "WARNING" && severity_id < 3 { severity_id = 3; severity = "Medium" }
      if (gcp_sev == "ERROR" || gcp_sev == "CRITICAL" || gcp_sev == "ALERT" || gcp_sev == "EMERGENCY") && severity_id < 4 { severity_id = 4; severity = "High" }

      # ---- api ----
      api_obj = { "operation": method_name, "service": { "name": svc_short } }
      if method_name == "" { api_obj.operation = "Unknown" }
      insert_id = to_string(p.insertId) ?? ""
      if insert_id != "" { api_obj.request = { "uid": insert_id } }
      status_msg = to_string(status_obj.message) ?? ""
      if status_msg != "" { api_obj.response = { "message": status_msg } }

      # ---- resources ----
      resources = []
      resource_name = to_string(payload.resourceName) ?? ""
      if resource_name != "" {
          res = { "uid": resource_name, "name": resource_name }
          rtype = to_string(resource.type) ?? ""
          if rtype != "" { res.type = rtype }
          if project_id != "" { res.namespace = project_id }
          if zone != "" { res.zone = zone }
          resources = push(resources, res)
      }

      # ---- http_request: only the caller user-agent is available ----
      http_request = {}
      ua = to_string(req_meta.callerSuppliedUserAgent) ?? ""
      if ua != "" { http_request.user_agent = ua }

      ocsf = {
          "class_uid": class_uid,
          "class_name": "API Activity",
          "category_uid": 6,
          "category_name": "Application Activity",
          "activity_id": activity_id,
          "activity_name": activity_name,
          "type_uid": class_uid * 100 + activity_id,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": status_id,
          "status": status_str,
          "time": time_ms,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "profiles": ["cloud"],
              "uid": uuid_v4(),
              "log_name": "cloudaudit.googleapis.com",
              "log_provider": "Google Cloud Audit Logs",
              "product": { "name": "Google Cloud Audit Logs", "vendor_name": "Google" }
          },
          "api": api_obj,
          "cloud": cloud,
          "actor": actor,
          "src_endpoint": src_endpoint
      }
      if insert_id != "" { ocsf.metadata.uid = insert_id }
      if log_name != "" { ocsf.metadata.log_name = log_name }
      if status_code_num >= 0 { ocsf.status_code = to_string(status_code_num) }
      if status_msg != "" { ocsf.status_detail = status_msg }
      if length(resources) > 0 { ocsf.resources = resources }
      if length(keys(http_request)) > 0 { ocsf.http_request = http_request }

      unmapped = {}
      if permission != "" { unmapped.permission = permission }
      if length(auth_list) > 0 { unmapped.authorization_info = encode_json(auth_list) }
      principal_subject = to_string(auth_info.principalSubject) ?? ""
      if principal_subject != "" { unmapped.principal_subject = principal_subject }
      oauth_client = to_string(get(auth_info, ["oauthInfo", "oauthClientId"]) ?? "") ?? ""
      if oauth_client != "" { unmapped.oauth_client_id = oauth_client }
      if gcp_sev != "" { unmapped.gcp_severity = gcp_sev }
      rtype2 = to_string(resource.type) ?? ""
      if rtype2 != "" { unmapped.gcp_resource_type = rtype2 }

      # IAM policy deltas are the highest-signal part of an audit log; keep the
      # full delta and mark the event as a permission change.
      service_data = object(payload.serviceData) ?? {}
      deltas = array(get(service_data, ["policyDelta", "bindingDeltas"]) ?? []) ?? []
      if length(deltas) > 0 {
          unmapped.iam_binding_deltas = encode_json(deltas)
          unmapped.change_type = "permission_change"
          ocsf.activity_id = 3
          ocsf.activity_name = "Update"
          ocsf.type_uid = class_uid * 100 + 3
      }
      request_obj = object(payload.request) ?? {}
      if length(keys(request_obj)) > 0 { unmapped.request_details = encode_json(request_obj) }
      response_obj = object(payload.response) ?? {}
      if length(keys(response_obj)) > 0 { unmapped.response_details = encode_json(response_obj) }
      if length(keys(unmapped)) > 0 { ocsf.unmapped = unmapped }

      . = ocsf
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # Exact value representation is evaluated AFTER branch selection. Numeric strings
  # count as represented by their typed scalar; other transformations are explicit.
  __mapped = object!(parse_json!(encode_json(.)))
  __existing = object(__mapped.unmapped) ?? {}
  __discard = del(__mapped.raw_data)
  __discard = del(__mapped.unmapped)
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __represented = []
  __walk = map_values(__mapped, recursive: true) -> |value| {
      __represented = push(__represented, encode_json(value))
      if !is_object(value) && !is_array(value) && !is_null(value) {
          __represented = push(__represented, to_string(value) ?? "")
      }
      value
  }
  __consumed = []
  # BEGIN parser-specific transformations
  # timestamp: Successful ISO timestamp conversion to the selected event clock in milliseconds.
  # receiveTimestamp: Successful ISO timestamp conversion to the selected event clock in milliseconds.
  # severity: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when the expected ID is emitted.
  # Only source keys read by this parser are eligible for exact-value consumption; the selected branch must emit the value. Unknown keys always spill, even when their value equals an OCSF default.
  __candidates = ["insertId", "logName", "protoPayload", "protoPayload.authenticationInfo", "protoPayload.authenticationInfo.oauthInfo.oauthClientId", "protoPayload.authenticationInfo.principalEmail", "protoPayload.authenticationInfo.principalSubject", "protoPayload.authorizationInfo", "protoPayload.methodName", "protoPayload.request", "protoPayload.requestMetadata", "protoPayload.requestMetadata.callerIp", "protoPayload.requestMetadata.callerSuppliedUserAgent", "protoPayload.resourceName", "protoPayload.response", "protoPayload.serviceData", "protoPayload.serviceData.policyDelta.bindingDeltas", "protoPayload.serviceName", "protoPayload.status", "protoPayload.status.code", "protoPayload.status.message", "receiveTimestamp", "resource", "resource.labels", "resource.labels.project_id", "resource.labels.zone", "resource.type", "severity", "timestamp"]
  __preserve = []
  __rules = array!(parse_json!("[{\"source\":\"timestamp\",\"kind\":\"epoch_ms\",\"target\":\"time\",\"reason\":\"Successful ISO timestamp conversion to the selected event clock in milliseconds.\"},{\"source\":\"receiveTimestamp\",\"kind\":\"epoch_ms\",\"target\":\"time\",\"reason\":\"Successful ISO timestamp conversion to the selected event clock in milliseconds.\"},{\"source\":\"severity\",\"kind\":\"enum\",\"target\":\"severity_id\",\"values\":{\"informational\":1,\"info\":1,\"debug\":1,\"low\":2,\"medium\":3,\"warn\":3,\"warning\":3,\"high\":4,\"error\":4,\"critical\":5,\"fatal\":6},\"reason\":\"Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when the expected ID is emitted.\"}]"))
  __source_flat = flatten(__source_kv)
  for_each(__rules) -> |_index, rule| {
      __source_key = string!(rule.source)
      __value = get!(__source_flat, [__source_key])
      __expected = null
      __valid = false
      if rule.kind == "lowercase" && is_string(__value) {
          __expected = downcase(string!(__value))
          __valid = true
      } else if rule.kind == "epoch_ms" {
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", string(rule.format) ?? "%+")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              __valid = true
          }
      } else if rule.kind == "scale" {
          __number, __number_err = to_float(__value)
          if __number_err == null && __value != null && !is_boolean(__value) {
              __expected = to_int(__number * to_float!(rule.factor))
              __valid = true
          }
      } else if rule.kind == "hex" {
          __hex = replace(downcase(string(__value) ?? ""), r'^0x', "")
          __integer, __integer_err = parse_int(__hex, base: 16)
          __expected = __integer
          __valid = is_string(__value) && starts_with(downcase(string(__value) ?? ""), "0x") && __integer_err == null
      } else if rule.kind == "enum" {
          __expected = get!(object!(rule.values), [downcase(to_string(__value) ?? "")])
          __valid = __expected != null
      }
      __matches = includes(__represented, encode_json(__expected))
      if is_string(rule.target) { __matches = get!(., split(string!(rule.target), ".")) == __expected }
      if __valid && __matches { __consumed = push(__consumed, __source_key) }
  }
  # END parser-specific transformations
  # Redact at every depth, including objects inside arrays, before serialization.
  __safe = map_values(object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing}))), recursive: true) -> |value| {
      if is_object(value) {
          # Header/parameter arrays commonly encode sensitive keys as name/value
          # or Key/Value objects instead of using the secret name as an object key.
          __sensitive_pair = false
          for_each(object!(value)) -> |key, child| {
              if includes(["name", "key"], downcase(key)) && match(downcase(string(child) ?? ""), r'password|secret|authorization|token') {
                  __sensitive_pair = true
              }
          }
          for_each(object!(value)) -> |key, _child| {
              if match(downcase(key), r'password|secret|authorization|token') || (__sensitive_pair && includes(["value", "values"], downcase(key))) {
                  value = set!(value, [key], "<redacted>")
              }
          }
      }
      value
  }
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  __escaped = map_keys(object!(__safe.source), recursive: true) -> |key| {
      replace(replace(key, "~", "~0"), ".", "~1")
  }
  __flat = flatten(__escaped)
  __residual = {}
  for_each(__flat) -> |key, value| {
      key = replace(replace(key, "~1", "."), "~0", "~")
      __same = includes(__represented, encode_json(value))
      if !is_object(value) && !is_array(value) && !is_null(value) {
          __same = __same || includes(__represented, to_string(value) ?? "")
      }
      # A scalar array is consumed only if every element is represented. Preserve
      # partially represented arrays intact, including their ordering and repeats.
      if is_array(value) && !is_empty(array!(value)) {
          __all_items = true
          for_each(array!(value)) -> |_index, item| {
              __item_same = includes(__represented, encode_json(item))
              if !is_object(item) && !is_array(item) && !is_null(item) {
                  __item_same = __item_same || includes(__represented, to_string(item) ?? "")
              }
              if is_object(item) || is_array(item) || !__item_same { __all_items = false }
          }
          __same = __same || __all_items
      }
      if __same && includes(__candidates, key) { __consumed = push(__consumed, key) }
      # Redacted leaves always remain visible. Do not spill a copy of the raw body.
      if (!includes(__consumed, key) || value == "<redacted>") && value != __raw_body {
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          __base = join!(__parts, ".")
          __key = __base
          __suffix = 2
          if includes(keys(__residual), __key) {
              for_each(__flat) -> |_other_key, _other_value| {
                  if includes(keys(__residual), __key) {
                      __key = __base + "_" + to_string(__suffix)
                      __suffix = __suffix + 1
                  }
              }
          }
          __complex = is_object(value)
          if is_array(value) {
              for_each(array!(value)) -> |_index, item| {
                  if is_object(item) || is_array(item) { __complex = true }
              }
          }
          __spill = if __complex { encode_json(value) } else { value }
          __residual = set!(__residual, [__key], __spill)
      }
  }
  # Keep existing derived evidence, but remove null placeholders and mapped copies.
  # Source-derived aliases are replaced by canonical dotted source paths above.
  __original_values = []
  for_each(flatten(__source_kv)) -> |_key, value| {
      __original_values = push(__original_values, encode_json(value))
      if !is_object(value) && !is_array(value) { __original_values = push(__original_values, to_string(value) ?? "") }
  }
  for_each(flatten(__existing)) -> |key, value| {
      __source_alias = includes(__original_values, encode_json(value)) || includes(__original_values, to_string(value) ?? "")
      __mapped_alias = includes(__represented, encode_json(value)) || includes(__represented, to_string(value) ?? "")
      __decoded, __decode_err = parse_json(string(value) ?? "")
      __encoded_container = __decode_err == null && (is_object(__decoded) || is_array(__decoded))
      if !is_null(value) && value != "" && !__source_alias && !__mapped_alias && !__encoded_container && value != __raw_body {
          # Existing aggregates may contain sensitive descendants; the canonical
          # source spill above is the authoritative representation of containers.
          if !is_array(value) && !is_object(value) && !match(downcase(key), r'password|secret|authorization|token') {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, with recursive
  # redaction. These entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__safe.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill
