#     audit fixture
#     https://github.com/elastic/integrations/blob/main/packages/hashicorp_vault/data_stream/audit/_dev/test/pipeline/test-audit.log
#   vault_response_kv_update_error_all_fields.json: Elastic integrations
#     hashicorp_vault every-field fixture
#     https://github.com/elastic/integrations/blob/main/packages/hashicorp_vault/data_stream/audit/_dev/test/pipeline/test-faked-all-fields.log
#   vault_response_userpass_login_success.json,
#   vault_response_userpass_login_failed.json, vault_request_approle_login.json:
#     login entries built from the documented schema (auth / request /
#     response objects) and its userpass-alice example identity
#     https://github.com/hashicorp/web-unified-docs/blob/main/content/vault/v2.x/content/docs/audit/schema.mdx
#     https://developer.hashicorp.com/vault/api-docs/auth/userpass#login
#   vault_lograw_token_lookup_self.json, vault_lograw_jwt_login.json,
#   vault_lograw_userpass_password.json: the same entries as an audit device
#     with log_raw=true writes them (live-looking but fake hvs. / s. tokens, a
