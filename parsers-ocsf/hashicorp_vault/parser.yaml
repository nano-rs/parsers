#     Vault audit log entry schema, full entry examples
#     https://github.com/hashicorp/web-unified-docs/blob/main/content/vault/v2.x/content/docs/audit/schema.mdx
#   vault_request_capabilities_self_oidc.json,
#   vault_response_pki_issue_permission_denied.json,
