name: hashicorp_vault_ocsf
display_name: HashiCorp Vault Audit (OCSF)
version: "1.2.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses HashiCorp Vault audit device entries (file, socket or syslog device;
  one JSON request or response entry per line, an optional syslog header is
  skipped) into OCSF 1.9.0. A login (request.path auth/<mount>/login[/<user>]
  or an OIDC / JWT callback) is "Authentication" (3002) Logon with the issued
  identity as user (display_name, entity_id, the username from the path or
  token metadata), the auth mount as service and auth_protocol (OIDC / JWT
  OpenID, LDAP, SAML, RADIUS, Kerberos, else the mount type), and the issued
  token's accessor / hashed client token / issue time / TTL as the session.
  Every other entry is "API Activity" (6003): request.operation create / read
  and list / update and patch / delete maps to Create / Read / Update / Delete
  (others such as help or renew are Other with the operation name), the
  calling token's identity is actor.user, its policies and granting policies
  are actor.authorizations (plus a denied decision on permission denied), the
  mount is api.service and the request path is the resource with its
  namespace. Both classes carry request.remote_address / remote_port as
  src_endpoint, request.id as metadata.correlation_uid (pairing a request
  entry with its response), the entry type as metadata.type and the error as
  status_detail. A response is Success, an entry with an error is Failure
  (permission denied and invalid credentials are Medium severity) and a
  request entry without one is Unknown. A namespace prefix on the path (HCP
  Vault admin/, Enterprise child namespaces) is stripped before login
  matching. HMAC'd values (hmac-sha256:...) are kept exactly as Vault wrote
  them and never decoded; a hashed client token is session.credential_uid,
  and a client token in clear (log_raw=true) stays in unmapped as written.
  The parser never masks: every other field (request.data / response.data
  payloads, headers, metadata, unknown keys) spills to unmapped as-is, a
  syslog header is kept as unmapped.syslog_header, raw_data is the original
  line, and raw_data_size / raw_data_hash (SHA-256) describe it. Anything
  that is not a complete Vault audit entry (a truncated or non-JSON line, an
  unknown type, no request) falls back to Base Event with its text kept in
  message and raw_data.
match_values:
  - hashicorp_vault
category: security
vendor: "HashiCorp"
product: "Vault"
parser_vrl: |
  # HashiCorp Vault audit device (file / socket / syslog JSON) -> OCSF 1.9.0
  # API Activity (6003), Authentication (3002) for login paths, Base Event (0)
  # HMAC'd values ("hmac-sha256:...") are kept exactly as Vault wrote them;
  # the parser never attempts to reverse them.
  #
  # The parser maps; it never masks. Every source field is mapped into OCSF or
  # spilled to unmapped exactly as Vault wrote it, raw_data is the original
  # line, and a line that is not an audit entry falls back with its text kept.
  # What an audit device writes in clear (log_raw=true, hmac_accessor=false,
  # audit_non_hmac_*_keys) is the operator's choice; masking it is an opt-in
  # pipeline step, not a parser concern.
  raw_in = to_string(.message) ?? ""
  raw_log = raw_in
  raw_sha = sha2(raw_in, variant: "SHA-256")
  raw_size = to_int(length(encode_base16(raw_in)) / 2)
  __source_kv = {}
  ip_re = r'^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$|^[0-9A-Fa-f:]{3,}$'
  # Vault's audit HMAC is exactly hmac-sha256:<64 lowercase hex>. It only
  # decides mapping: a hashed client token is a credential identifier
  # (session.credential_uid); any other value stays in unmapped as written.
  hmac_re = r'^hmac-sha256:[0-9a-f]{64}$'

  # A syslog audit device prefixes the JSON with a syslog header, which may
  # itself hold a brace (RFC 5424 structured data), so the JSON starts at the
  # first brace that opens a Vault entry key. A trailing newline is dropped.
  # The header is kept as-is in unmapped.syslog_header.
  body = strip_whitespace(raw_log)
  header = ""
  if !match(body, r'^\x7B') {
      jm, jerr = parse_regex(body, r'(?s)^(?P<header>.*?)(?P<json>\x7B\s*"(?:time|type|auth|request|response|error|forwarded_from)"\s*:.*)$')
      if jerr == null { body = string!(jm.json); header = strip_whitespace(string!(jm.header)) }
  }
  parsed, err = parse_json(body)
  e = object(parsed) ?? {}
  __raw_body = raw_log
  __source_kv = e
  if header != "" && is_object(parsed) { __source_kv.syslog_header = header }
  req = object(e.request) ?? {}
  entry_type = downcase(to_string(e.type) ?? "")
  path = to_string(req.path) ?? ""
  req_id = to_string(req.id) ?? ""

  if err != null || !is_object(parsed) || length(req) == 0 || (entry_type != "request" && entry_type != "response") {
      # Fallback: a line that is not a complete Vault audit entry (truncated,
      # not JSON, an unknown type, no request) keeps its text as-is in
      # message and raw_data. A parsed object that is not an entry spills.
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 99,
          "activity_name": "Other",
          "type_uid": 99,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": 0,
          "message": raw_log,
          "raw_data": raw_log,
          "raw_data_size": raw_size,
          "raw_data_hash": { "algorithm_id": 3, "algorithm": "SHA-256", "value": raw_sha },
          "metadata": {
              "version": "1.9.0",
              "uid": raw_sha,
              "log_level": "error",
              "log_name": "audit",
              "product": { "name": "Vault", "vendor_name": "HashiCorp" }
          }
      }
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      . = set!(., ["unmapped", "parse_fallback"], "unparsable input")
  } else {
      auth = object(e.auth) ?? {}
      resp = object(e.response) ?? {}
      resp_auth = object(resp.auth) ?? {}
      operation = downcase(to_string(req.operation) ?? "")
      error = to_string(e.error) ?? ""
      mount_type = to_string(req.mount_type) ?? ""
      if mount_type == "" { mount_type = to_string(resp.mount_type) ?? "" }
      mount_point = to_string(req.mount_point) ?? ""
      if mount_point == "" { mount_point = to_string(resp.mount_point) ?? "" }
      # Vault Enterprise / HCP prefix request.path with the namespace path
      # (admin/auth/userpass/login/alice), so strip it before matching.
      ns_path = to_string(get(req, ["namespace", "path"]) ?? "") ?? ""
      rel_path = path
      if ns_path != "" && starts_with(path, ns_path) { rel_path = slice!(path, strlen(ns_path)) }
      rel_path = replace(rel_path, r'^/+', "")
      is_login = match(rel_path, r'^auth/.+/(?:login|callback)(?:/|$)') || (!starts_with(rel_path, "sys/") && match(rel_path, r'/auth/.+/(?:login|callback)(?:/|$)'))

      time_ms = 0
      ts = to_string(e.time) ?? ""
      if ts != "" {
          t, terr = parse_timestamp(ts, "%+", timezone: "UTC")
          if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
      }

      # ---- outcome: a request entry has none yet unless Vault refused it ----
      status_id = 0
      status_str = "Unknown"
      if entry_type == "response" { status_id = 1; status_str = "Success" }
      if error != "" { status_id = 2; status_str = "Failure" }
      severity_id = 1
      severity = "Informational"
      if error != "" { severity_id = 2; severity = "Low" }
      if contains(downcase(error), "permission denied") || contains(downcase(error), "invalid username or password") { severity_id = 3; severity = "Medium" }

      # ---- source endpoint ----
      src = {}
      rip = to_string(req.remote_address) ?? ""
      if match(rip, ip_re) { src.ip = rip }
      rport = to_int(req.remote_port) ?? 0
      if rport > 0 { src.port = rport }
      if !exists(src.ip) {
          fwd = to_string(e.forwarded_from) ?? ""
          if fwd != "" { src.name = fwd } else { src.name = "unknown" }
      }

      ua_list = array(get(req, ["headers", "user-agent"]) ?? []) ?? []
      ua = to_string(get(ua_list, [0]) ?? "") ?? ""

      # ---- the principal (the token used, or the identity a login issued) ----
      principal = auth
      if is_login && length(resp_auth) > 0 { principal = resp_auth }
      display = to_string(principal.display_name) ?? ""
      entity = to_string(principal.entity_id) ?? ""
      user = {}
      if display != "" { user.name = display }
      if entity != "" { user.uid = entity }
      uname_meta = to_string(get(principal, ["metadata", "username"]) ?? "") ?? ""
      if uname_meta != "" && !starts_with(uname_meta, "hmac-sha256:") { user.display_name = uname_meta }
      umail = to_string(get(principal, ["metadata", "email"]) ?? "") ?? ""
      if umail != "" && !starts_with(umail, "hmac-sha256:") { user.email_addr = umail }
      if is_login && !exists(user.name) {
          # The login path names the user for userpass / ldap / okta / radius.
          lm, lerr = parse_regex(rel_path, r'(?:^|/)auth/.+/login/(?P<name>[^/]+)$')
          if lerr == null { user.name = string!(lm.name) }
      }
      if !exists(user.name) && !exists(user.uid) { user.name = "unauthenticated" }

      session = {}
      acc = to_string(principal.accessor) ?? ""
      # The accessor names the token whether Vault HMAC'd it or not.
      if acc != "" { session.uid = acc }
      ctok = to_string(principal.client_token) ?? ""
      # A hashed client token identifies the credential; a clear one (log_raw)
      # is the credential itself, not an identifier, so it stays in unmapped.
      if match(ctok, hmac_re) { session.credential_uid = ctok }
      tissued = to_string(principal.token_issue_time) ?? ""
      if tissued != "" {
          it, iterr = parse_timestamp(tissued, "%+", timezone: "UTC")
          if iterr == null {
              session.created_time = to_unix_timestamp(it, unit: "milliseconds")
              ttl = to_int(principal.token_ttl) ?? 0
              if ttl > 0 { session.expiration_time = session.created_time + ttl * 1000 }
          }
      }
      if length(session) > 0 { session.issuer = "vault" }

      authz = []
      for_each(array(get(principal, ["policy_results", "granting_policies"]) ?? []) ?? []) -> |_i, gp| {
          gpn = to_string(get(gp, ["name"]) ?? "") ?? ""
          if gpn != "" {
              pol = { "name": gpn }
              gpt = to_string(get(gp, ["type"]) ?? "") ?? ""
              if gpt != "" { pol.type = gpt }
              authz = push(authz, { "decision": "allowed", "policy": pol })
          }
      }
      if length(authz) == 0 {
          for_each(array(principal.policies) ?? []) -> |_i, pn| {
              pns = to_string(pn) ?? ""
              if pns != "" { authz = push(authz, { "policy": { "name": pns } }) }
          }
      }
      if error != "" && contains(downcase(error), "permission denied") {
          authz = push(authz, { "decision": "denied" })
      }

      ns = to_string(get(req, ["namespace", "path"]) ?? "") ?? ""
      if ns == "" { ns = to_string(get(req, ["namespace", "id"]) ?? "") ?? "" }

      metadata = {
          "version": "1.9.0",
          "uid": req_id + "|" + entry_type,
          "log_name": "audit",
          "log_provider": "Vault audit device",
          "type": entry_type,
          "product": { "name": "Vault", "vendor_name": "HashiCorp" }
      }
      if req_id == "" { metadata.uid = raw_sha } else { metadata.correlation_uid = req_id }
      mrv = to_string(req.mount_running_version) ?? ""
      if mrv != "" { metadata.product.version = mrv }

      message = operation + " " + path
      if error != "" { message = message + ": " + error }

      if is_login {
          proto_id = 99
          proto = mount_type
          if mount_type == "oidc" || mount_type == "jwt" { proto_id = 4; proto = "OpenID" }
          if mount_type == "ldap" { proto_id = 12; proto = "LDAP" }
          if mount_type == "saml" { proto_id = 5; proto = "SAML" }
          if mount_type == "radius" { proto_id = 10; proto = "RADIUS" }
          if mount_type == "kerberos" { proto_id = 2; proto = "Kerberos" }
          if proto == "" { proto_id = 0; proto = "Unknown" }
          svc = { "name": "vault" }
          if mount_point != "" { svc.name = mount_point }
          macc = to_string(req.mount_accessor) ?? ""
          if macc != "" { svc.uid = macc }
          ocsf = {
              "class_uid": 3002,
              "class_name": "Authentication",
              "category_uid": 3,
              "category_name": "Identity & Access Management",
              "activity_id": 1,
              "activity_name": "Logon",
              "type_uid": 300201,
              "severity_id": severity_id,
              "severity": severity,
              "status_id": status_id,
              "status": status_str,
              "time": time_ms,
              "message": message,
              "raw_data": raw_log,
              "raw_data_size": raw_size,
              "raw_data_hash": { "algorithm_id": 3, "algorithm": "SHA-256", "value": raw_sha },
              "metadata": metadata,
              "user": user,
              "src_endpoint": src,
              "service": svc,
              "auth_protocol_id": proto_id,
              "auth_protocol": proto,
              "is_remote": true
          }
          if length(session) > 0 { ocsf.session = session }
          if error != "" { ocsf.status_detail = error }
          if ua != "" { ocsf.http_request = { "user_agent": ua } }
          if ns != "" { ocsf.metadata.tenant_uid = ns }
          . = ocsf
      } else {
          activity_id = 99
          activity_name = "Other"
          if operation == "create" { activity_id = 1; activity_name = "Create" }
          if operation == "read" || operation == "list" { activity_id = 2; activity_name = "Read" }
          if operation == "update" || operation == "patch" { activity_id = 3; activity_name = "Update" }
          if operation == "delete" { activity_id = 4; activity_name = "Delete" }

          api = { "operation": operation, "request": { "uid": req_id } }
          if req_id == "" { api.request.uid = metadata.uid }
          svc = {}
          if mount_point != "" { svc.name = mount_point } else if mount_type != "" { svc.name = mount_type }
          macc = to_string(req.mount_accessor) ?? ""
          if macc == "" { macc = to_string(resp.mount_accessor) ?? "" }
          if macc != "" { svc.uid = macc }
          if length(svc) > 0 { api.service = svc }
          if error != "" { api.response = { "error": error } }

          actor = { "user": user }
          if length(session) > 0 { actor.session = session }
          if length(authz) > 0 { actor.authorizations = authz }

          res = { "uid": path, "name": path, "type": "Vault path" }
          if path == "" { res.uid = "/"; res.name = "/" }
          if mount_type != "" { res.type = mount_type }
          if ns != "" { res.namespace = ns }

          ocsf = {
              "class_uid": 6003,
              "class_name": "API Activity",
              "category_uid": 6,
              "category_name": "Application Activity",
              "activity_id": activity_id,
              "activity_name": activity_name,
              "type_uid": 600300 + activity_id,
              "severity_id": severity_id,
              "severity": severity,
              "status_id": status_id,
              "status": status_str,
              "time": time_ms,
              "message": message,
              "raw_data": raw_log,
              "raw_data_size": raw_size,
              "raw_data_hash": { "algorithm_id": 3, "algorithm": "SHA-256", "value": raw_sha },
              "metadata": metadata,
              "actor": actor,
              "api": api,
              "src_endpoint": src,
              "resources": [res]
          }
          if activity_id == 99 && operation != "" { ocsf.activity_name = operation }
          if error != "" { ocsf.status_detail = error }
          if ua != "" { ocsf.http_request = { "user_agent": ua } }
          if ns != "" { ocsf.metadata.tenant_uid = ns }
          . = ocsf
      }
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # Values spill exactly as parsed: a parser never masks, redacts or withholds
  # anything (masking is an opt-in pipeline step, never a parser concern).
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # A source field is consumed ONLY by an explicit mapping: a field-coverage.yaml
  # `mappings` entry (source key -> target paths) or a `transforms` rule with a
  # target, whose value is found AT THAT TARGET PATH of the selected branch. A
  # value that merely appears somewhere else in the event never consumes a field
  # (no coincidental consumption); everything else spills.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The sets below are strings instead
  # (a read shares the buffer). __repr holds one member per mapped leaf:
  # "," + encode_json(path) + "=" + encode_json(encode_json(value)), plus the
  # to_string form for a string or a float, so a numeric string is represented by
  # its typed scalar. Every part is a JSON text, inside which a '"' is always
  # escaped, so a member is matched exactly. Paths drop array indices
  # (resources.0.uid is resources.uid); arrays are walked two levels deep, and a
  # leaf deeper than that is simply not mapping evidence (it can only spill more).
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped = object!(parse_json!(encode_json(__mapped)))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __copy = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __repr = ""
  for_each(flatten(__mapped)) -> |path, value| {
      __p = encode_json(path)
      if is_array(value) {
          for_each(array!(value)) -> |_i, item| {
              if is_object(item) {
                  for_each(flatten(object!(item))) -> |sub, leaf| {
                      __q = encode_json(path + "." + sub)
                      if is_array(leaf) {
                          for_each(array!(leaf)) -> |_j, x| {
                              if !is_object(x) && !is_array(x) {
                                  __repr = __repr + ("," + __q + "=" + encode_json(encode_json(x)))
                                  if is_string(x) || is_float(x) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(x))) }
                              }
                          }
                      } else {
                          __repr = __repr + ("," + __q + "=" + encode_json(encode_json(leaf)))
                          if is_string(leaf) || is_float(leaf) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(leaf))) }
                      }
                  }
              } else if !is_array(item) {
                  __repr = __repr + ("," + __p + "=" + encode_json(encode_json(item)))
                  if is_string(item) || is_float(item) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(item))) }
              }
          }
      } else {
          __repr = __repr + ("," + __p + "=" + encode_json(encode_json(value)))
          if is_string(value) || is_float(value) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(value))) }
      }
  }
  __consumed = ""
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__copy.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # BEGIN parser-specific transformations
  # time: Successful ISO timestamp conversion to the emitted millisecond clock.
  # auth.token_issue_time: The token issue time becomes the session's created_time; consume only when that clock is emitted.
  # response.auth.token_issue_time: The issued token's issue time becomes the login session's created_time; consume only when that clock is emitted.
  # request.operation: The Vault operation drives the API Activity; consume only when that activity is emitted.
  # type: The entry type is metadata.type (lowercased); consume only when emitted.
  for_each(__flat) -> |key, value| {
      if match(key, r'(?x)
      \A(?:
        time
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%+", timezone: "UTC")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              if contains(__repr, "," + "\"time\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        auth\.token_issue_time
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%+", timezone: "UTC")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              if contains(__repr, "," + "\"actor.session.created_time\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        response\.auth\.token_issue_time
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%+", timezone: "UTC")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              if contains(__repr, "," + "\"session.created_time\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        request\.operation
      )\z') {
          __value = value
          if __value != null {
              __expected = get!({"create": 1, "read": 2, "list": 2, "update": 3, "patch": 3, "delete": 4}, [downcase(to_string(__value) ?? "")])
              if __expected != null {
                  if contains(__repr, "," + "\"activity_id\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
              }
          }
      }
      if match(key, r'(?x)
      \A(?:
        type
      )\z') {
          __value = value
          if __value != null {
              __expected = get!({"request": "request", "response": "response"}, [downcase(to_string(__value) ?? "")])
              if __expected != null {
                  if contains(__repr, "," + "\"metadata.type\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
              }
          }
      }
  }
  # Declared source -> target mappings (field-coverage.yaml `mappings`).
