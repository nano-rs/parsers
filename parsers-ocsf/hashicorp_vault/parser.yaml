#     https://developer.hashicorp.com/vault/api-docs/auth/userpass#login
#   vault_lograw_token_lookup_self.json, vault_lograw_jwt_login.json,
#   vault_lograw_userpass_password.json: the same entries as an audit device
#     with log_raw=true writes them (live-looking but fake hvs. / s. tokens, a
