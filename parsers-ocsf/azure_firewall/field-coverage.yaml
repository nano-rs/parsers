source: json
transforms:
- source: properties.Action
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value
    is emitted.
- source: properties.Protocol
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value
    is emitted.
- source: time
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: properties.Action
  kind: enum
  target: action_id
  values:
    allow: 1
    allowed: 1
    accept: 1
    accepted: 1
    permit: 1
    permitted: 1
    pass: 1
    passed: 1
    deny: 2
    denied: 2
    block: 2
    blocked: 2
    reject: 2
    rejected: 2
    drop: 2
    dropped: 2
    log: 3
    observed: 3
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping;
    consume only when the expected ID is emitted.
- source: properties.ResponseCode
  kind: enum
  target: rcode
  values:
    noerror: NoError
  reason: Parser normalizes the caption case; verify the emitted caption.
consumed_candidates:
- category
- operationName
- properties
- properties.Action
- properties.DestinationIP
- properties.DestinationPort
- properties.Error
- properties.FQDN
- properties.Fqdn
- properties.Policy
- properties.Protocol
- properties.QueryClass
- properties.QueryId
- properties.QueryName
- properties.QueryType
- properties.Reason
- properties.RequestSize
- properties.ResponseCode
- properties.ResponseFlags
- properties.ResponseSize
- properties.Rule
- properties.RuleCollection
- properties.RuleCollectionGroup
- properties.SourceIP
- properties.SourcePort
- properties.TargetUrl
- properties.ThreatDescription
- properties.ThreatIntel
- properties.WebCategory
- properties.msg
- resourceId
- time
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
