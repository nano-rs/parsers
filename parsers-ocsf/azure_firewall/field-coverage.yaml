source: json
transforms:
- source: properties.Protocol
  kind: lowercase
  target: app_protocol_name
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: properties.Protocol
  kind: lowercase
  target: connection_info.protocol_name
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: time
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: properties.Action
  kind: enum
  target: action_id
  values:
    allow: 1
    allowed: 1
    accept: 1
    accepted: 1
    permit: 1
    permitted: 1
    pass: 1
    passed: 1
    deny: 2
    denied: 2
    block: 2
    blocked: 2
    reject: 2
    rejected: 2
    drop: 2
    dropped: 2
    log: 3
    observed: 3
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when
    the expected ID is emitted.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  category:
  - firewall_rule.type
  - metadata.log_source
  operationName:
  - metadata.event_code
  properties.DestinationIP:
  - dst_endpoint.ip
  properties.DestinationPort:
  - dst_endpoint.port
  properties.Fqdn:
  - dst_endpoint.hostname
  properties.Policy:
  - firewall_rule.version
  properties.QueryClass:
  - query.class
  properties.QueryId:
  - transaction_id
  properties.QueryName:
  - query.hostname
  properties.QueryType:
  - query.type
  properties.RequestSize:
  - traffic.bytes_out
  properties.ResponseSize:
  - traffic.bytes_in
  properties.Rule:
  - firewall_rule.name
  - firewall_rule.uid
  properties.RuleCollection:
  - firewall_rule.category
  - firewall_rule.name
  properties.SourceIP:
  - src_endpoint.ip
  properties.SourcePort:
  - src_endpoint.port
