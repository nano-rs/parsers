source: text
transforms:
- source: event.action
  kind: enum
  target: action_id
  values:
    allow: 1
    allowed: 1
    accept: 1
    accepted: 1
    permit: 1
    permitted: 1
    pass: 1
    passed: 1
    deny: 2
    denied: 2
    block: 2
    blocked: 2
    reject: 2
    rejected: 2
    drop: 2
    dropped: 2
    log: 3
    observed: 3
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when
    the expected ID is emitted.
- source: event.protocol
  kind: lowercase
  target: connection_info.protocol_name
  reason: Case normalization already performed by the parser; observed at connection_info.protocol_name,
    and checked against the emitted branch.
- source: event.protocol
  kind: enum
  target: connection_info.protocol_num
  values:
    tcp: 6
    udp: 17
    icmp: 1
    icmpv6: 58
    ipv6-icmp: 58
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when
    the expected ID is emitted.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  event.acl:
  - firewall_rule.name
  - firewall_rule.uid
  event.bytes:
  - traffic.bytes
  event.conn_id:
  - connection_info.uid
  event.dst_iface:
  - dst_endpoint.interface_name
  event.dst_ip:
  - dst_endpoint.ip
  - evidences.dst_endpoint.ip
  - observables.value
  event.dst_port:
  - dst_endpoint.port
  event.hits:
  - count
  event.iface:
  - dst_endpoint.interface_name
  - evidences.src_endpoint.interface_name
  - src_endpoint.interface_name
  event.ip:
  - observables.value
  - src_endpoint.ip
  event.name:
  - finding_info.analytic.name
  - finding_info.title
  event.protocol:
  - connection_info.protocol_name
  event.reason:
  - status_detail
  event.s:
  - duration
  event.server:
  - dst_endpoint.ip
  - observables.value
  event.sig:
  - finding_info.analytic.uid
  event.src_iface:
  - src_endpoint.interface_name
  event.src_ip:
  - evidences.src_endpoint.ip
  - observables.value
  - src_endpoint.ip
  event.src_port:
  - src_endpoint.port
  event.user:
  - actor.user.name
  - observables.value
  - user.name
  header.host:
  - device.hostname
  - src_endpoint.hostname
  header.msgid:
  - metadata.event_code
