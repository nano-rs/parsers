source: text
transforms:
- source: event.action
  kind: enum
  target: action_id
  values:
    allow: 1
    allowed: 1
    accept: 1
    accepted: 1
    permit: 1
    permitted: 1
    pass: 1
    passed: 1
    deny: 2
    denied: 2
    block: 2
    blocked: 2
    reject: 2
    rejected: 2
    drop: 2
    dropped: 2
    log: 3
    observed: 3
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping;
    consume only when the expected ID is emitted.
- source: event.protocol
  kind: lowercase
  reason: Case normalization already performed by the parser; observed at connection_info.protocol_name,
    and checked against the emitted branch.
- source: event.protocol
  kind: enum
  target: connection_info.protocol_num
  values:
    tcp: 6
    udp: 17
    icmp: 1
    icmpv6: 58
    ipv6-icmp: 58
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping;
    consume only when the expected ID is emitted.
consumed_candidates:
- event.acl
- event.action
- event.bytes
- event.c
- event.conn_id
- event.direction
- event.dst_iface
- event.dst_ip
- event.dst_nat_ip
- event.dst_nat_port
- event.dst_port
- event.group
- event.h
- event.hits
- event.iface
- event.ip
- event.m
- event.name
- event.protocol
- event.reason
- event.s
- event.server
- event.sig
- event.src_iface
- event.src_ip
- event.src_nat_ip
- event.src_nat_port
- event.src_port
- event.t
- event.threat
- event.user
- event.verdict
- header.body
- header.host
- header.msgid
- header.rest
- header.sev
- header.ts
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
