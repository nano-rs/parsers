name: cisco_asa_ocsf
display_name: Cisco ASA (OCSF)
version: "1.2.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses Cisco ASA / FTD syslog (%ASA-<sev>-<msgid>) into OCSF 1.9.0. Routes by
  message id: connection build/teardown, ACL permit/deny, NAT, ICMP and TCP
  drops -> Network Activity (4001); AAA, console/VPN login and device
  authentication -> Authentication (3002); IDS signature hits and threat
  detection -> Detection Finding (2004). Every other %ASA message, and any line
  the %ASA header regex does not match, still emits a well-formed Network
  Activity record with activity_id 99 and the raw line in `message`.
  Timestamps without an offset use the log source's timezone setting (UTC if unset).
match_values:
  - cisco_asa
category: network
vendor: "Cisco"
product: "ASA"
parser_vrl: |
  # NAN source timezone. Generated by scripts/residual_spill.py; edit scripts/residual/source_tz.vrl.
  # The log source's timezone setting arrives as .nano.source_timezone (an IANA
  # name such as "America/New_York", or any fixed offset such as "+05:30"), set
  # by nano at ingest. .nano is nano's input, never part of the log: it is
  # removed whole before anything else, whatever its shape.
  # For a clock that carries no offset a parser parses it AS UTC and sets
  # __lc_pending; the generated local-clock block that follows the parse
  # (local_clock.vrl) turns it into real UTC with this setting, and the spill
  # records the zone used as unmapped.nano_time_assumed_tz (the name, the offset
  # as +HH:MM, or "UTC" when the setting is absent, invalid or "local").
  __src_nano = del(.nano)
  __src_tz_in = ""
  if is_object(__src_nano) { __src_tz_in = strip_whitespace(to_string(object!(__src_nano).source_timezone) ?? "") }
  __src_tz = "UTC"
  __src_shift_ms = 0
  __src_tz_label = "UTC"
  __time_assumed = false
  __time_inline = false
  __lc_pending = false
  __lc_shifted = ""
  # No parse_* decoder here: nano infers a parser's input contract from the first
  # decoder in its program (parse_json first = a JSON-input parser, handed the
  # whole HEC / OTLP object). This prelude opens every parser, so a decoder in it
  # would turn every JSON-input parser into a text one. match + slice instead.
  if match(__src_tz_in, r'^[+-]\d{2}:?\d{2}$') {
      __src_sign = slice(__src_tz_in, 0, 1) ?? "+"
      __src_digits = replace(slice(__src_tz_in, 1) ?? "", ":", "")
      __src_hh = slice(__src_digits, 0, 2) ?? "99"
      __src_mm = slice(__src_digits, 2, 4) ?? "99"
      __src_h = to_int(__src_hh) ?? 99
      __src_m = to_int(__src_mm) ?? 99
      if __src_h <= 14 && __src_m <= 59 {
          __src_shift_ms = (__src_h * 3600 + __src_m * 60) * 1000
          if __src_sign == "-" { __src_shift_ms = 0 - __src_shift_ms }
          if __src_shift_ms != 0 { __src_tz_label = __src_sign + __src_hh + ":" + __src_mm }
      }
  } else if __src_tz_in != "" && downcase(__src_tz_in) != "local" {
      # "local" (the Vector host's zone) would make the time depend on the host.
      __src_probe, __src_probe_err = parse_timestamp("2000-01-01 00:00:00", "%Y-%m-%d %H:%M:%S", timezone: __src_tz_in)
      if __src_probe_err == null { __src_tz = __src_tz_in; __src_tz_label = __src_tz_in }
  }
  # A clock with no year: the current year in the source's zone, and the latest
  # leap year for a Feb 29 (the local-clock block then picks the nearest year).
  __src_now_ms = to_unix_timestamp(now(), unit: "milliseconds")
  __src_year = format_timestamp(from_unix_timestamp!(__src_now_ms + __src_shift_ms, unit: "milliseconds"), "%Y", timezone: __src_tz) ?? format_timestamp!(now(), "%Y")
  __src_leap_year = to_int(__src_year) ?? 2000
  if mod(__src_leap_year, 4) != 0 || (mod(__src_leap_year, 100) == 0 && mod(__src_leap_year, 400) != 0) { __src_leap_year = __src_leap_year - mod(__src_leap_year, 4) }
  __src_leap_year = to_string(__src_leap_year)
  # END NAN source timezone
  # Cisco ASA -> OCSF 1.9.0 (4001 Network Activity / 3002 Authentication /
  # 2004 Detection Finding)

  raw_log = string!(.message)
  __raw_body = raw_log
  __source_kv = {}

  time_ms = to_int(to_unix_timestamp(now(), unit: "milliseconds"))
  dvc_host = ""
  working = raw_log

  # ---- syslog PRI ----
  pri_match, pri_err = parse_regex(working, r'^<(?P<pri>\d+)>(?P<body>.*)$')
  # Capture parsed fields before mapping; omit structural raw-body captures.
  __capture = object(parse_json!(encode_json(pri_match))) ?? {}
  __ignore = del(__capture.body)
  __ignore = del(__capture.content)
  __ignore = del(__capture.kvdata)
  __ignore = del(__capture.kvpart)
  __ignore = del(__capture.msg)
  __ignore = del(__capture.payload)
  __ignore = del(__capture.remainder)
  __ignore = del(__capture.rest)
  __ignore = del(__capture.sd)
  __source_kv = set!(__source_kv, ["header"], merge(object(get(__source_kv, ["header"]) ?? null) ?? {}, __capture))
  if pri_err == null && pri_match != null { working = string!(pri_match.body) }

  # ---- syslog timestamp + optional hostname before %ASA ----
  sm, se = parse_regex(working, r'^(?P<ts>(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+\d{1,2}\s+(?:\d{4}\s+)?\d{2}:\d{2}:\d{2})\s*:?\s*(?P<host>[^\s:]+)?\s*:?\s*(?P<rest>%ASA-.*)$')
  # Capture parsed fields before mapping; omit structural raw-body captures.
  __capture = object(parse_json!(encode_json(sm))) ?? {}
  __ignore = del(__capture.body)
  __ignore = del(__capture.content)
  __ignore = del(__capture.kvdata)
  __ignore = del(__capture.kvpart)
  __ignore = del(__capture.msg)
  __ignore = del(__capture.payload)
  __ignore = del(__capture.remainder)
  __ignore = del(__capture.rest)
  __ignore = del(__capture.sd)
  __source_kv = set!(__source_kv, ["header"], merge(object(get(__source_kv, ["header"]) ?? null) ?? {}, __capture))
  if se == null && sm != null {
      ts_str = string!(sm.ts)
      ts, ts_err = parse_timestamp(ts_str, "%b %d %Y %H:%M:%S", timezone: "UTC")
      if ts_err == null { __lc_pending = true }
      # NAN local clock: ts
      # ts was just parsed from a clock WITHOUT an offset, read as UTC
      # (__lc_pending). It becomes real UTC here, at the site, with the log source's
      # timezone (__src_tz / __src_shift_ms from the prelude, or an inline IANA zone
      # the parser validated): a fixed offset by arithmetic; an IANA zone with its DST
      # rules, probed 18 h either side (wider than any UTC offset), an ambiguous
      # fall-back time taking its FIRST occurrence (the earlier offset), a time in a
      # spring-forward gap moving forward by the gap. __NOYEAR__: a clock with no
      # year is tried in its year, the year before and the year after (each with its
      # own DST rules); more than a day in the future means last year, more than 180
      # days in the past means next year when that is not in the future.
      if __lc_pending {
          __lc_pending = false
          __time_assumed = true
          __lc_l = to_unix_timestamp(ts, unit: "milliseconds")
          __lc_cands = [__lc_l]
          __lc_us = map_values(__lc_cands) -> |l| {
              if l == null {
                  null
              } else {
                  __u = int!(l) - __src_shift_ms
                  if __src_tz != "UTC" {
                      __offs = map_values([int!(l) - 64800000, int!(l) + 64800000]) -> |at| {
                          __z = format_timestamp(from_unix_timestamp!(at, unit: "milliseconds"), "%z", timezone: __src_tz) ?? "+0000"
                          __o = ((to_int(slice(__z, 1, 3) ?? "0") ?? 0) * 3600 + (to_int(slice(__z, 3, 5) ?? "0") ?? 0) * 60) * 1000
                          if starts_with(__z, "-") { 0 - __o } else { __o }
                      }
                      __oa = int!(__offs[0])
                      __ob = int!(__offs[1])
                      __u = int!(l) - __oa
                      if __oa != __ob {
                          __ok = map_values([int!(l) - __oa, int!(l) - __ob]) -> |at| {
                              __z = format_timestamp(from_unix_timestamp!(at, unit: "milliseconds"), "%z", timezone: __src_tz) ?? "+0000"
                              __o = ((to_int(slice(__z, 1, 3) ?? "0") ?? 0) * 3600 + (to_int(slice(__z, 3, 5) ?? "0") ?? 0) * 60) * 1000
                              if starts_with(__z, "-") { 0 - __o } else { __o }
                          }
                          if int!(__ok[0]) != __oa && int!(__ok[1]) == __ob { __u = int!(l) - __ob }
                      }
                  }
                  __u
              }
          }
          __lc_u = int!(__lc_us[0])
          # Remembered (local -> UTC) so a transforms rule on the same source clock
          # still finds it at its target.
          if __lc_u != __lc_l { __lc_shifted = __lc_shifted + "\n" + to_string(__lc_l) + "\t" + to_string(__lc_u) + "\n" }
          ts = from_unix_timestamp!(__lc_u, unit: "milliseconds")
      }
      # END NAN local clock
      if ts_err == null {
          time_ms = to_int(to_unix_timestamp(ts, unit: "milliseconds"))
      } else {
          ts2, ts_err2 = parse_timestamp(ts_str + " " + __src_year, "%b %d %H:%M:%S %Y", timezone: "UTC")
          if ts_err2 != null { ts2, ts_err2 = parse_timestamp(ts_str + " " + __src_leap_year, "%b %d %H:%M:%S %Y", timezone: "UTC") }
          if ts_err2 == null { __lc_pending = true }
          # NAN local clock: ts2 noyear
          # ts2 was just parsed from a clock WITHOUT an offset, read as UTC
          # (__lc_pending). It becomes real UTC here, at the site, with the log source's
          # timezone (__src_tz / __src_shift_ms from the prelude, or an inline IANA zone
          # the parser validated): a fixed offset by arithmetic; an IANA zone with its DST
          # rules, probed 18 h either side (wider than any UTC offset), an ambiguous
          # fall-back time taking its FIRST occurrence (the earlier offset), a time in a
          # spring-forward gap moving forward by the gap. __NOYEAR__: a clock with no
          # year is tried in its year, the year before and the year after (each with its
          # own DST rules); more than a day in the future means last year, more than 180
          # days in the past means next year when that is not in the future.
          if __lc_pending {
              __lc_pending = false
              __time_assumed = true
              __lc_l = to_unix_timestamp(ts2, unit: "milliseconds")
              __lc_cands = [__lc_l]
              if true {
                  __lc_s = format_timestamp!(ts2, "%Y-%m-%d %H:%M:%S%.3f")
                  __lc_y = to_int(slice!(__lc_s, 0, 4)) ?? 0
                  __lc_p, __lc_pe = parse_timestamp(to_string(__lc_y - 1) + slice!(__lc_s, 4), "%Y-%m-%d %H:%M:%S%.3f", timezone: "UTC")
                  __lc_n, __lc_ne = parse_timestamp(to_string(__lc_y + 1) + slice!(__lc_s, 4), "%Y-%m-%d %H:%M:%S%.3f", timezone: "UTC")
                  __lc_pm = null
                  if __lc_pe == null { __lc_pm = to_unix_timestamp(__lc_p, unit: "milliseconds") }
                  __lc_nm = null
                  if __lc_ne == null { __lc_nm = to_unix_timestamp(__lc_n, unit: "milliseconds") }
                  __lc_cands = [__lc_l, __lc_pm, __lc_nm]
              }
              __lc_us = map_values(__lc_cands) -> |l| {
                  if l == null {
                      null
                  } else {
                      __u = int!(l) - __src_shift_ms
                      if __src_tz != "UTC" {
                          __offs = map_values([int!(l) - 64800000, int!(l) + 64800000]) -> |at| {
                              __z = format_timestamp(from_unix_timestamp!(at, unit: "milliseconds"), "%z", timezone: __src_tz) ?? "+0000"
                              __o = ((to_int(slice(__z, 1, 3) ?? "0") ?? 0) * 3600 + (to_int(slice(__z, 3, 5) ?? "0") ?? 0) * 60) * 1000
                              if starts_with(__z, "-") { 0 - __o } else { __o }
                          }
                          __oa = int!(__offs[0])
                          __ob = int!(__offs[1])
                          __u = int!(l) - __oa
                          if __oa != __ob {
                              __ok = map_values([int!(l) - __oa, int!(l) - __ob]) -> |at| {
                                  __z = format_timestamp(from_unix_timestamp!(at, unit: "milliseconds"), "%z", timezone: __src_tz) ?? "+0000"
                                  __o = ((to_int(slice(__z, 1, 3) ?? "0") ?? 0) * 3600 + (to_int(slice(__z, 3, 5) ?? "0") ?? 0) * 60) * 1000
                                  if starts_with(__z, "-") { 0 - __o } else { __o }
                              }
                              if int!(__ok[0]) != __oa && int!(__ok[1]) == __ob { __u = int!(l) - __ob }
                          }
                      }
                      __u
                  }
              }
              __lc_u = int!(__lc_us[0])
              if true {
                  if __lc_u > __src_now_ms + 86400000 && __lc_us[1] != null {
                      __lc_u = int!(__lc_us[1])
                  } else if __lc_u < __src_now_ms - 15552000000 && __lc_us[2] != null && int!(__lc_us[2]) <= __src_now_ms + 86400000 {
                      __lc_u = int!(__lc_us[2])
                  }
              }
              # Remembered (local -> UTC) so a transforms rule on the same source clock
              # still finds it at its target.
              if __lc_u != __lc_l { __lc_shifted = __lc_shifted + "\n" + to_string(__lc_l) + "\t" + to_string(__lc_u) + "\n" }
              ts2 = from_unix_timestamp!(__lc_u, unit: "milliseconds")
          }
          # END NAN local clock
          if ts_err2 == null { time_ms = to_int(to_unix_timestamp(ts2, unit: "milliseconds")) }
      }
      hv = to_string(sm.host)
      if hv != "" && hv != ":" { dvc_host = hv }
      working = string!(sm.rest)
  }

  # ---- %ASA-<sev>-<msgid>: <body> ----
  msg_id = ""
  msg_body = working
  sev_num = 6
  am, ae = parse_regex(working, r'%ASA-(?P<sev>\d)-(?P<msgid>\d+):\s*(?P<body>.*)$')
  # Capture parsed fields before mapping; omit structural raw-body captures.
  __capture = object(parse_json!(encode_json(am))) ?? {}
  __ignore = del(__capture.body)
  __ignore = del(__capture.content)
  __ignore = del(__capture.kvdata)
  __ignore = del(__capture.kvpart)
  __ignore = del(__capture.msg)
  __ignore = del(__capture.payload)
  __ignore = del(__capture.remainder)
  __ignore = del(__capture.rest)
  __ignore = del(__capture.sd)
  __source_kv = set!(__source_kv, ["header"], merge(object(get(__source_kv, ["header"]) ?? null) ?? {}, __capture))
  if ae == null && am != null {
      msg_id = string!(am.msgid)
      msg_body = string!(am.body)
      sev_num = to_int(am.sev) ?? 6
  }

  # syslog severity -> OCSF severity_id
  severity_id = 1
  severity = "Informational"
  if sev_num <= 2 { severity_id = 5; severity = "Critical" }
  if sev_num == 3 { severity_id = 4; severity = "High" }
  if sev_num == 4 { severity_id = 3; severity = "Medium" }
  if sev_num == 5 { severity_id = 2; severity = "Low" }

  # ---- accumulators ----
  route = "network"
  activity_id = 99
  activity_name = "Other"
  action_id = 3
  action = "Observed"
  disposition_id = 17
  disposition = "Logged"
  status_id = 1
  status_str = "Success"

  src_ip = ""
  src_port = 0
  dst_ip = ""
  dst_port = 0
  src_iface = ""
  dst_iface = ""
  proto = ""
  direction_id = 0
  conn_id = ""
  bytes_total = 0
  duration_s = 0
  hit_count = 0
  rule_name = ""
  user_name = ""
  vpn_group = ""
  remote_ip = ""
  assigned_ip = ""
  sig_id = ""
  sig_name = ""
  reason = ""
  nat_src_ip = ""
  nat_src_port = 0
  nat_dst_ip = ""
  nat_dst_port = 0
  icmp_type = ""
  icmp_code = ""
  desc = ""

  # ============================================================
  # 302013/302015/302020 Built connection
  # ============================================================
  if msg_id == "302013" || msg_id == "302015" || msg_id == "302020" {
      desc = "Built connection"
      activity_id = 1
      activity_name = "Open"
      action_id = 1
      action = "Allowed"
      disposition_id = 1
      disposition = "Allowed"
      cm, ce = parse_regex(msg_body, r'Built\s+(?P<direction>inbound|outbound)\s+(?P<protocol>\w+)\s+connection\s+(?P<conn_id>\d+)\s+for\s+(?P<src_iface>\w+):(?P<src_ip>[^/]+)/(?P<src_port>\d+)\s*(?:\x28(?P<src_nat_ip>[^/]+)/(?P<src_nat_port>\d+)\x29)?\s+to\s+(?P<dst_iface>\w+):(?P<dst_ip>[^/]+)/(?P<dst_port>\d+)\s*(?:\x28(?P<dst_nat_ip>[^/]+)/(?P<dst_nat_port>\d+)\x29)?')
      # Capture parsed fields before mapping; omit structural raw-body captures.
      __capture = object(parse_json!(encode_json(cm))) ?? {}
      __ignore = del(__capture.body)
      __ignore = del(__capture.content)
      __ignore = del(__capture.kvdata)
      __ignore = del(__capture.kvpart)
      __ignore = del(__capture.msg)
      __ignore = del(__capture.payload)
      __ignore = del(__capture.remainder)
      __ignore = del(__capture.rest)
      __ignore = del(__capture.sd)
      __source_kv = set!(__source_kv, ["event"], merge(object(get(__source_kv, ["event"]) ?? null) ?? {}, __capture))
      if ce == null && cm != null {
          d = downcase(string!(cm.direction))
          if d == "inbound" { direction_id = 1 }
          if d == "outbound" { direction_id = 2 }
          proto = downcase(string!(cm.protocol))
          conn_id = string!(cm.conn_id)
          src_iface = string!(cm.src_iface)
          src_ip = string!(cm.src_ip)
          src_port = to_int(cm.src_port) ?? 0
          dst_iface = string!(cm.dst_iface)
          dst_ip = string!(cm.dst_ip)
          dst_port = to_int(cm.dst_port) ?? 0
          nat_src_ip = to_string(cm.src_nat_ip)
          if nat_src_ip != "" { nat_src_port = to_int(cm.src_nat_port) ?? 0 }
          nat_dst_ip = to_string(cm.dst_nat_ip)
          if nat_dst_ip != "" { nat_dst_port = to_int(cm.dst_nat_port) ?? 0 }
      }

  # ============================================================
  # 302014/302016/302021 Teardown connection
  # ============================================================
  } else if msg_id == "302014" || msg_id == "302016" || msg_id == "302021" {
      desc = "Teardown connection"
      activity_id = 2
      activity_name = "Close"
      action_id = 1
      action = "Allowed"
      disposition_id = 1
      disposition = "Allowed"
      tm, te = parse_regex(msg_body, r'Teardown\s+(?P<protocol>\w+)\s+connection\s+(?P<conn_id>\d+)\s+for\s+(?P<src_iface>\w+):(?P<src_ip>[^/]+)/(?P<src_port>\d+)\s+to\s+(?P<dst_iface>\w+):(?P<dst_ip>[^/]+)/(?P<dst_port>\d+)\s+duration\s+(?P<h>\d+):(?P<m>\d{2}):(?P<s>\d{2})\s+bytes\s+(?P<bytes>\d+)(?:\s+reason\s+(?P<reason>.+))?')
      # Capture parsed fields before mapping; omit structural raw-body captures.
      __capture = object(parse_json!(encode_json(tm))) ?? {}
      __ignore = del(__capture.body)
      __ignore = del(__capture.content)
      __ignore = del(__capture.kvdata)
      __ignore = del(__capture.kvpart)
      __ignore = del(__capture.msg)
      __ignore = del(__capture.payload)
      __ignore = del(__capture.remainder)
      __ignore = del(__capture.rest)
      __ignore = del(__capture.sd)
      __source_kv = set!(__source_kv, ["event"], merge(object(get(__source_kv, ["event"]) ?? null) ?? {}, __capture))
      if te == null && tm != null {
          proto = downcase(string!(tm.protocol))
          conn_id = string!(tm.conn_id)
          src_iface = string!(tm.src_iface)
          src_ip = string!(tm.src_ip)
          src_port = to_int(tm.src_port) ?? 0
          dst_iface = string!(tm.dst_iface)
          dst_ip = string!(tm.dst_ip)
          dst_port = to_int(tm.dst_port) ?? 0
          duration_s = ((to_int(tm.h) ?? 0) * 3600) + ((to_int(tm.m) ?? 0) * 60) + (to_int(tm.s) ?? 0)
          bytes_total = to_int(tm.bytes) ?? 0
          reason = to_string(tm.reason)
          if contains(downcase(reason), "reset") {
              activity_id = 3
              activity_name = "Reset"
          }
      }

  # ============================================================
  # 106023 Deny by access-group
  # ============================================================
  } else if msg_id == "106023" {
      desc = "ACL deny"
      activity_id = 5
      activity_name = "Refuse"
      action_id = 2
      action = "Denied"
      disposition_id = 2
      disposition = "Blocked"
      status_id = 2
      status_str = "Failure"
      dm, de = parse_regex(msg_body, r'Deny\s+(?P<protocol>\w+)\s+src\s+(?P<src_iface>\w+):(?P<src_ip>[^/]+)/(?P<src_port>\d+)\s+dst\s+(?P<dst_iface>\w+):(?P<dst_ip>[^/]+)/(?P<dst_port>\d+)\s+by\s+access-group\s+"(?P<acl>[^"]+)"')
      # Capture parsed fields before mapping; omit structural raw-body captures.
      __capture = object(parse_json!(encode_json(dm))) ?? {}
      __ignore = del(__capture.body)
      __ignore = del(__capture.content)
      __ignore = del(__capture.kvdata)
      __ignore = del(__capture.kvpart)
      __ignore = del(__capture.msg)
      __ignore = del(__capture.payload)
      __ignore = del(__capture.remainder)
      __ignore = del(__capture.rest)
      __ignore = del(__capture.sd)
      __source_kv = set!(__source_kv, ["event"], merge(object(get(__source_kv, ["event"]) ?? null) ?? {}, __capture))
      if de == null && dm != null {
          proto = downcase(string!(dm.protocol))
          src_iface = string!(dm.src_iface)
          src_ip = string!(dm.src_ip)
          src_port = to_int(dm.src_port) ?? 0
          dst_iface = string!(dm.dst_iface)
          dst_ip = string!(dm.dst_ip)
          dst_port = to_int(dm.dst_port) ?? 0
          rule_name = string!(dm.acl)
      }

  # ============================================================
  # 106100 access-list permit/deny with hit count
  # ============================================================
  } else if msg_id == "106100" {
      desc = "ACL hit"
      am2, ae2 = parse_regex(msg_body, r'access-list\s+(?P<acl>\S+)\s+(?P<action>\w+)\s+(?P<protocol>\w+)\s+(?P<src_iface>\w+)/(?P<src_ip>[^\x28]+?)\x28(?P<src_port>\d+)\x29\s*->\s*(?P<dst_iface>\w+)/(?P<dst_ip>[^\x28]+?)\x28(?P<dst_port>\d+)\x29\s+hit-cnt\s+(?P<hits>\d+)')
      # Capture parsed fields before mapping; omit structural raw-body captures.
      __capture = object(parse_json!(encode_json(am2))) ?? {}
      __ignore = del(__capture.body)
      __ignore = del(__capture.content)
      __ignore = del(__capture.kvdata)
      __ignore = del(__capture.kvpart)
      __ignore = del(__capture.msg)
      __ignore = del(__capture.payload)
      __ignore = del(__capture.remainder)
      __ignore = del(__capture.rest)
      __ignore = del(__capture.sd)
      __source_kv = set!(__source_kv, ["event"], merge(object(get(__source_kv, ["event"]) ?? null) ?? {}, __capture))
      if ae2 == null && am2 != null {
          act = downcase(string!(am2.action))
