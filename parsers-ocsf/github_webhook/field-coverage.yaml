source: json
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
transforms:
- source: workflow_run.updated_at
  kind: epoch_ms
  format: '%+'
  target: time
  reason: The run's last-update clock (the completion time on a completed run) is the event time.
- source: alert.updated_at
  kind: epoch_ms
  format: '%+'
  target: time
  reason: The alert's last-update clock is the event time.
- source: alert.created_at
  kind: epoch_ms
  format: '%+'
  target: time
  reason: An alert without updated_at takes its creation clock as the event time.
- source: alert.created_at
  kind: epoch_ms
  format: '%+'
  target: finding_info.created_time
  reason: The alert's creation clock.
- source: key.created_at
  kind: epoch_ms
  format: '%+'
  target: resources.created_time
  reason: The deploy key's creation clock.
- source: repository.pushed_at
  kind: scale
  factor: 1000
  target: time
  reason: push payloads carry repository.pushed_at as epoch seconds; it is the push time.
mappings:
  organization.id:
  - group.uid
  organization.login:
  - group.name
  repository.full_name:
  - resources.name
  repository.id:
  - resources.uid
  rule.id:
  - resources.uid
  rule.name:
  - resources.name
  sender.id:
  - actor.user.uid
  sender.login:
  - actor.user.name
  alert.html_url:
  - finding_info.src_url
  alert.most_recent_instance.location.path:
  - resources.name
  alert.rule.description:
  - finding_info.title
  - message
  alert.rule.id:
  - finding_info.types
  alert.state:
  - status_detail
  alert.tool.name:
  - finding_info.analytic.name
  alert.url:
  - finding_info.uid
  ref:
  - resources.name
  key.added_by:
  - resources.owner.name
  key.id:
  - resources.uid
  key.title:
  - resources.name
  github_delivery:
  - metadata.uid
  payload.membership.role:
  - privileges
  payload.membership.user.id:
  - user.uid
  payload.membership.user.login:
  - user.name
  payload.organization.id:
  - group.uid
  payload.organization.login:
  - group.name
  payload.sender.id:
  - actor.user.uid
  payload.sender.login:
  - actor.user.name
  membership.role:
  - privileges
  membership.user.id:
  - user.uid
  membership.user.login:
  - user.name
  alert.push_protection_bypassed_by.id:
  - evidences.actor.user.uid
  alert.push_protection_bypassed_by.login:
  - evidences.actor.user.name
  alert.secret_type:
  - finding_info.types
  alert.secret_type_display_name:
  - finding_info.title
  - message
  team.id:
  - group.uid
  team.permission:
  - privileges
  team.slug:
  - group.name
  workflow_run.conclusion:
  - status_detail
  workflow_run.head_sha:
  - app.version
  workflow_run.id:
  - metadata.correlation_uid
  workflow_run.name:
  - app.name
  workflow_run.path:
  - app.path
  workflow_run.triggering_actor.id:
  - actor.user.uid
  workflow_run.triggering_actor.login:
  - actor.user.name
  workflow_run.workflow_id:
  - app.uid
