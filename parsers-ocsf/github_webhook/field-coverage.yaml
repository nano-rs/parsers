source: json
preserve_unmapped:
  nano_time_source: Derived marker that the record carried no usable clock and time is when nano received
    it; kept even when a source value happens to equal "received".
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
transforms:
- source: workflow_run.updated_at
  kind: epoch_ms
  format: '%+'
  target: time
  reason: The run's last-update clock (the completion time on a completed run) is the event time.
- source: workflow_job.completed_at
  kind: epoch_ms
  format: '%+'
  target: time
  reason: A finished job's completion clock is the event time.
- source: alert.updated_at
  kind: epoch_ms
  format: '%+'
  target: time
  reason: The alert's last-update clock is the event time.
- source: alert.created_at
  kind: epoch_ms
  format: '%+'
  target: time
  reason: An alert without updated_at takes its creation clock as the event time.
- source: alert.created_at
  kind: epoch_ms
  format: '%+'
  target: finding_info.created_time
  reason: The alert's creation clock.
- source: key.created_at
  kind: epoch_ms
  format: '%+'
  target: resources.created_time
  reason: The deploy key's creation clock.
- source: repository.pushed_at
  kind: scale
  factor: 1000
  target: time
  reason: push payloads carry repository.pushed_at as epoch seconds; it is the push time.
- source: payload.workflow_run.updated_at
  kind: epoch_ms
  format: '%+'
  target: time
  reason: The run's last-update clock (the completion time on a completed run) is the event time.
- source: payload.workflow_job.completed_at
  kind: epoch_ms
  format: '%+'
  target: time
  reason: A finished job's completion clock is the event time.
- source: payload.alert.updated_at
  kind: epoch_ms
  format: '%+'
  target: time
  reason: The alert's last-update clock is the event time.
- source: payload.alert.created_at
  kind: epoch_ms
  format: '%+'
  target: time
  reason: An alert without updated_at takes its creation clock as the event time.
- source: payload.alert.created_at
  kind: epoch_ms
  format: '%+'
  target: finding_info.created_time
  reason: The alert's creation clock.
- source: payload.key.created_at
  kind: epoch_ms
  format: '%+'
  target: resources.created_time
  reason: The deploy key's creation clock.
- source: payload.repository.pushed_at
  kind: scale
  factor: 1000
  target: time
  reason: push payloads carry repository.pushed_at as epoch seconds; it is the push time.
