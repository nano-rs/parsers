source: json
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
transforms:
- source: payload.workflow_run.updated_at
  kind: epoch_ms
  format: '%+'
  target: time
  reason: The run's last-update clock (the completion time on a completed run) is the event time.
- source: payload.alert.updated_at
  kind: epoch_ms
  format: '%+'
  target: time
  reason: The alert's last-update clock is the event time.
- source: payload.alert.created_at
  kind: epoch_ms
  format: '%+'
  target: time
  reason: An alert without updated_at takes its creation clock as the event time.
- source: payload.alert.created_at
  kind: epoch_ms
  format: '%+'
  target: finding_info.created_time
  reason: The alert's creation clock.
- source: payload.key.created_at
  kind: epoch_ms
  format: '%+'
  target: resources.created_time
  reason: The deploy key's creation clock.
- source: payload.repository.pushed_at
  kind: scale
  factor: 1000
  target: time
  reason: push payloads carry repository.pushed_at as epoch seconds; it is the push time.
mappings:
  github_delivery:
  - metadata.uid
  github_event:
  - api.operation
  - message
  - metadata.event_code
  payload.organization.id:
  - group.uid
  payload.organization.login:
  - group.name
  payload.repository.full_name:
  - resources.name
  payload.repository.id:
  - resources.uid
  payload.rule.id:
  - resources.uid
  payload.rule.name:
  - resources.name
  payload.sender.id:
  - actor.user.uid
  payload.sender.login:
  - actor.user.name
  payload.alert.html_url:
  - finding_info.src_url
  payload.alert.most_recent_instance.location.path:
  - resources.name
  payload.alert.rule.description:
  - finding_info.title
  - message
  payload.alert.rule.id:
  - finding_info.types
  payload.alert.state:
  - status_detail
  payload.alert.tool.name:
  - finding_info.analytic.name
  payload.alert.url:
  - finding_info.uid
  payload.ref:
  - resources.name
  payload.key.added_by:
  - resources.owner.name
  payload.key.id:
  - resources.uid
  payload.key.title:
  - resources.name
  payload.membership.role:
  - privileges
  payload.membership.user.id:
  - user.uid
  payload.membership.user.login:
  - user.name
  payload.alert.push_protection_bypassed_by.id:
  - evidences.actor.user.uid
  payload.alert.push_protection_bypassed_by.login:
  - evidences.actor.user.name
  payload.alert.secret_type:
  - finding_info.types
  payload.alert.secret_type_display_name:
  - finding_info.title
  - message
  payload.team.id:
  - group.uid
  payload.team.permission:
  - privileges
  payload.team.slug:
  - group.name
  payload.workflow_run.conclusion:
  - status_detail
  payload.workflow_run.head_sha:
  - app.version
  payload.workflow_run.id:
  - metadata.correlation_uid
  payload.workflow_run.name:
  - app.name
  payload.workflow_run.path:
  - app.path
  payload.workflow_run.triggering_actor.id:
  - actor.user.uid
  payload.workflow_run.triggering_actor.login:
  - actor.user.name
  payload.workflow_run.workflow_id:
  - app.uid
