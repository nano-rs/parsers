name: github_webhook_ocsf
display_name: GitHub Webhooks (OCSF)
version: "1.0.0"
ocsf_version: "1.9.0"
description: |
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses GitHub organization and repository webhook deliveries into OCSF 1.9.0. This is
  the security record for organizations without GitHub Enterprise Cloud (no audit log
  API or streaming). GitHub sends the event name only in the X-GitHub-Event header, so
  the best record is a forwarder's envelope {github_event, github_delivery, payload}
  with that header's value in github_event and GitHub's body, unchanged, in payload.
  A bare body is also accepted: its event is read from the body's own keys
  (membership, team, member, key, rule, alert, workflow_run, pusher, ...), and a body
  those keys do not identify is "unknown.<action>" (API Activity, Other), never
  guessed as a repository or organization change.
    organization, member, membership, team, org_block      -> Group Management 3006
    secret_scanning_alert, code_scanning_alert,
    dependabot_alert                                       -> Detection Finding 2004
    workflow_run, workflow_job                             -> Application Lifecycle 6002
    everything else (repository, public, deploy_key, push,
    branch_protection_rule, repository_ruleset, meta, ...) -> API Activity 6003
  `sender` is the actor and metadata.event_code is "<event>.<action>". A webhook body
  has no delivery clock: time is the event's own clock where GitHub sends one
  (workflow run / job, alert, push), otherwise the time nano received it
  (unmapped.nano_time_source = "received"). A webhook names no caller address, so API
  Activity has src_endpoint {"hostname": "unknown"}. Unparseable input becomes a Base
  Event with the raw line kept.
  Ingestion: HTTP ingest (/ingest), one JSON record per line.
  Setup: GitHub can't add nano's ingest token to a webhook, so put a small
  forwarder in between (for example a Cloudflare Worker). In GitHub, open your
  organization, then Settings, then Webhooks, then Add webhook. Set the payload URL to
  the forwarder, the content type to application/json, and a secret. Choose the events
  you want: members, teams, repositories, deploy keys, branch protection rules,
  workflow runs, and secret and code scanning alerts. The forwarder checks the
  X-Hub-Signature-256 header with that secret, then posts one line to your nano HTTP
  ingest with your github_webhook ingest token as a Bearer token:
  {"github_event": <the X-GitHub-Event header>, "github_delivery": <the X-GitHub-Delivery
  header>, "payload": <the body, unchanged>}.
match_values:
  - github_webhook
category: security
vendor: "GitHub"
product: "GitHub Webhooks"
parser_vrl: |
  # NAN source timezone. Generated by scripts/residual_spill.py; edit scripts/residual/source_tz.vrl.
  # The log source's timezone setting arrives as .nano.source_timezone (an IANA
  # name such as "America/New_York", or any fixed offset such as "+05:30"), set
  # by nano at ingest. .nano is nano's input, never part of the log: it is
  # removed whole before anything else, whatever its shape.
  # For a clock that carries no offset a parser parses it AS UTC and sets
  # __lc_pending; the generated local-clock block that follows the parse
  # (local_clock.vrl) turns it into real UTC with this setting, and the spill
  # records the zone used as unmapped.nano_time_assumed_tz (the name, the offset
  # as +HH:MM, or "UTC" when the setting is absent, invalid or "local").
  __src_nano = del(.nano)
  __src_tz_in = ""
  if is_object(__src_nano) { __src_tz_in = strip_whitespace(to_string(object!(__src_nano).source_timezone) ?? "") }
  __src_tz = "UTC"
  __src_shift_ms = 0
  __src_tz_label = "UTC"
  __time_assumed = false
  __time_inline = false
  __lc_pending = false
  # No parse_* decoder here: nano infers a parser's input contract from the first
  # decoder in its program (parse_json first = a JSON-input parser, handed the
  # whole HEC / OTLP object). This prelude opens every parser, so a decoder in it
  # would turn every JSON-input parser into a text one. match + slice instead.
  if match(__src_tz_in, r'^[+-]\d{2}:?\d{2}$') {
      __src_sign = slice(__src_tz_in, 0, 1) ?? "+"
      __src_digits = replace(slice(__src_tz_in, 1) ?? "", ":", "")
      __src_hh = slice(__src_digits, 0, 2) ?? "99"
      __src_mm = slice(__src_digits, 2, 4) ?? "99"
      __src_h = to_int(__src_hh) ?? 99
      __src_m = to_int(__src_mm) ?? 99
      if __src_h <= 14 && __src_m <= 59 {
          __src_shift_ms = (__src_h * 3600 + __src_m * 60) * 1000
          if __src_sign == "-" { __src_shift_ms = 0 - __src_shift_ms }
          if __src_shift_ms != 0 { __src_tz_label = __src_sign + __src_hh + ":" + __src_mm }
      }
  } else if __src_tz_in != "" && downcase(__src_tz_in) != "local" {
      # "local" (the Vector host's zone) would make the time depend on the host.
      __src_probe, __src_probe_err = parse_timestamp("2000-01-01 00:00:00", "%Y-%m-%d %H:%M:%S", timezone: __src_tz_in)
      if __src_probe_err == null { __src_tz = __src_tz_in; __src_tz_label = __src_tz_in }
  }
  # END NAN source timezone
  # nano:input=json
  # GitHub org webhook (relay envelope) -> OCSF 1.9.0.
  # A string body is the usual wire form; a source that already decoded the
  # JSON hands over an object, or the decoded record on the root.
  raw_log = ""
  if is_string(.message) {
      raw_log = string!(.message)
  } else if is_object(.message) || is_array(.message) {
      raw_log = encode_json(.message)
  } else if exists(.message) && !is_null(.message) {
      raw_log = to_string(.message) ?? ""
  } else {
      raw_log = encode_json(.)
  }
  __raw_body = raw_log
  __source_kv = {}
  parsed, err = parse_json(raw_log)
  __source_kv = object(parsed) ?? {}

  is_github = false
  if err == null && is_object(parsed) {
      is_github = exists(parsed.github_event) || exists(parsed.payload.sender) || exists(parsed.sender)
  }

  if !is_github {
      reason = "not a JSON object"
      if err == null && is_object(parsed) { reason = "JSON object without a GitHub webhook envelope or sender" }
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 0,
          "activity_name": "Unknown",
          "type_uid": 0,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": to_unix_timestamp(now(), unit: "milliseconds"),
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": sha2("github_webhook|raw|" + raw_log, variant: "SHA-256"),
              "log_level": "error",
              "log_name": "github_webhook",
              "log_provider": "GitHub",
              "product": { "name": "GitHub", "vendor_name": "GitHub" }
          },
          "unmapped": { "parse_error": reason, "nano_time_source": "received" }
      }
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      . = set!(., ["unmapped", "parse_fallback"], "unparsable input")
  } else {
      env = object!(parsed)
      # The usual record is GitHub's signed body as delivered (the event name
      # travels in the unsigned X-GitHub-Event header, which a relay that
      # forwards only signed bytes drops). A relay envelope
      # {github_event, github_delivery, ..., payload} is also accepted.
      is_envelope = exists(env.github_event) && is_object(env.payload)
      pl = env
      if is_envelope { pl = object!(env.payload) }
      gh_event = ""
      if is_envelope { gh_event = string(env.github_event) ?? "" }
      action = string(pl.action) ?? ""
      # A bare body names no event: the payload's own keys do (first match wins).
      if gh_event == "" {
          if exists(pl.workflow_run) {
              gh_event = "workflow_run"
          } else if exists(pl.workflow_job) {
              gh_event = "workflow_job"
          } else if exists(pl.alert) && exists(pl.location) {
              gh_event = "secret_scanning_alert_location"
          } else if exists(pl.alert.secret_type) {
              gh_event = "secret_scanning_alert"
          } else if exists(pl.alert.rule) && exists(pl.alert.tool) {
              gh_event = "code_scanning_alert"
          } else if exists(pl.alert.security_advisory) || exists(pl.alert.dependency) {
              gh_event = "dependabot_alert"
          } else if exists(pl.membership) && exists(pl.team) {
              gh_event = "membership"
          } else if exists(pl.membership) || exists(pl.invitation) {
              gh_event = "organization"
          } else if exists(pl.blocked_user) {
              gh_event = "org_block"
          } else if exists(pl.team) {
              gh_event = "team"
          } else if exists(pl.member) && exists(pl.repository) {
              gh_event = "member"
          } else if exists(pl.key) && exists(pl.repository) {
              gh_event = "deploy_key"
          } else if exists(pl.rule) && exists(pl.repository) {
              gh_event = "branch_protection_rule"
          } else if exists(pl.repository_ruleset) {
              gh_event = "repository_ruleset"
          } else if exists(pl.personal_access_token_request) {
              gh_event = "personal_access_token_request"
          } else if exists(pl.pusher) {
              gh_event = "push"
          } else if exists(pl.zen) && exists(pl.hook) {
              gh_event = "ping"
          } else if exists(pl.hook) && action != "" {
              gh_event = "meta"
          } else {
              # The catch-alls must not relabel other events: issues, pull
              # requests, releases, create / delete, fork, status, ... all carry
              # repository (and often organization). A body with any other
              # top-level entity stays unnamed (event_code = its action).
              envelope_keys = ["action", "repository", "organization", "sender", "enterprise", "installation", "changes"]
              other = false
              for_each(keys(pl)) -> |_i, k| {
                  if !includes(envelope_keys, k) { other = true }
              }
              if !other && exists(pl.repository) && includes(["created", "deleted", "archived", "unarchived", "edited", "renamed", "transferred", "publicized", "privatized"], action) {
                  gh_event = "repository"
              } else if !other && exists(pl.repository) && action == "" {
                  gh_event = "public"
              } else if !other && !exists(pl.repository) && exists(pl.organization) && includes(["renamed", "deleted"], action) {
                  gh_event = "organization"
              }
          }
      }
      # An event the body does not identify is "unknown" (a delivery from a
      # relay that sends the X-GitHub-Event name in its envelope never is).
      if gh_event == "" { gh_event = "unknown" }
      event_code = gh_event
      if action != "" { event_code = gh_event + "." + action }

      # ---- actor: the account that triggered the delivery ----
      sender = object(pl.sender) ?? {}
      actor_user = {}
      s_login = string(sender.login) ?? ""
      if s_login != "" { actor_user.name = s_login }
      s_id = to_string(sender.id) ?? ""
      if s_id != "" { actor_user.uid = s_id }
      if actor_user == {} { actor_user.name = "unknown" }

      org = object(pl.organization) ?? {}
      org_login = string(org.login) ?? ""
      org_id = to_string(org.id) ?? ""

      repo = object(pl.repository) ?? {}
      repo_full = string(repo.full_name) ?? ""
      repo_id = to_string(repo.id) ?? ""
      repo_res = {}
      if repo_full != "" { repo_res.name = repo_full }
      if repo_id != "" { repo_res.uid = repo_id }
      if repo_res != {} { repo_res.type = "repository" }

      # ---- time: the event's own clock, else when nano received it ----
      time_ms = 0
      clock_src = ""
      if gh_event == "workflow_run" { clock_src = string(pl.workflow_run.updated_at) ?? "" }
      if gh_event == "workflow_job" {
          clock_src = string(pl.workflow_job.completed_at) ?? ""
          if clock_src == "" { clock_src = string(pl.workflow_job.started_at) ?? "" }
      }
      if exists(pl.alert) {
          clock_src = string(pl.alert.updated_at) ?? ""
          if clock_src == "" { clock_src = string(pl.alert.created_at) ?? "" }
      }
      if clock_src != "" {
          clock, clock_err = parse_timestamp(clock_src, "%+", timezone: "UTC")
          if clock_err == null { time_ms = to_unix_timestamp(clock, unit: "milliseconds") }
      }
      # push payloads carry repository.pushed_at as epoch seconds
      if time_ms == 0 && gh_event == "push" && is_integer(repo.pushed_at) {
          time_ms = int!(repo.pushed_at) * 1000
      }
      time_received = false
      if time_ms == 0 {
          time_ms = to_unix_timestamp(now(), unit: "milliseconds")
          time_received = true
      }

      md = {
          "version": "1.9.0",
          "uid": sha2("github_webhook|raw|" + raw_log, variant: "SHA-256"),
          "log_name": "github_webhook",
          "log_provider": "GitHub",
          "product": { "name": "GitHub", "vendor_name": "GitHub" }
      }
      delivery = string(env.github_delivery) ?? ""
      if delivery != "" { md.uid = delivery }
      if event_code != "" { md.event_code = event_code }

      severity_id = 1
      status_id = 1
      ocsf = {}
      msg = event_code

      if includes(["organization", "member", "membership", "team", "org_block"], gh_event) {
          # ================= Group Management (3006) =================
          # organization: the org is the group; member: a repository's
          # collaborators; membership / team: the team.
          grp = {}
          if org_login != "" { grp.name = org_login }
          if org_id != "" { grp.uid = org_id }
          grp.type = "organization"
          team = object(pl.team) ?? {}
          if gh_event == "membership" || gh_event == "team" {
              grp = {"type": "team"}
              t_name = string(team.slug) ?? ""
              if t_name != "" { grp.name = t_name }
              t_id = to_string(team.id) ?? ""
              if t_id != "" { grp.uid = t_id }
          }
          if gh_event == "member" {
              grp = {"type": "repository"}
              if repo_full != "" { grp.name = repo_full }
              if repo_id != "" { grp.uid = repo_id }
          }
          activity_id = 99
          activity_name = "Other"
          if action == "member_added" || action == "added" { activity_id = 3; activity_name = "Add User" }
          if action == "member_removed" || action == "removed" { activity_id = 4; activity_name = "Remove User" }
          if action == "created" { activity_id = 6; activity_name = "Create" }
          if action == "deleted" { activity_id = 5; activity_name = "Delete" }
          if action == "edited" || action == "renamed" { activity_id = 9; activity_name = "Update" }
          if action == "added_to_repository" { activity_id = 1; activity_name = "Assign Privileges" }
          if action == "removed_from_repository" { activity_id = 2; activity_name = "Revoke Privileges" }
          ocsf = {
              "class_uid": 3006,
              "class_name": "Group Management",
              "category_uid": 3,
              "category_name": "Identity & Access Management",
              "activity_id": activity_id,
              "activity_name": activity_name,
              "group": grp,
              "actor": { "user": actor_user }
          }
          # the member acted on
          subj_src = object(pl.membership.user) ?? object(pl.member) ?? object(pl.blocked_user) ?? object(pl.user) ?? object(pl.invitation) ?? {}
          subj = {}
          m_login = string(subj_src.login) ?? ""
          if m_login != "" { subj.name = m_login }
          m_id = to_string(subj_src.id) ?? ""
          if m_id != "" { subj.uid = m_id }
          if subj != {} { ocsf.user = subj }
          privs = []
          m_role = string(pl.membership.role) ?? ""
          if m_role != "" { privs = push(privs, m_role) }
          t_perm = string(team.permission) ?? ""
          if t_perm != "" { privs = push(privs, t_perm) }
          c_perm = string(pl.changes.permission.to) ?? ""
          if c_perm != "" { privs = push(privs, c_perm) }
          if length(privs) > 0 { ocsf.privileges = privs }
          if repo_res != {} && gh_event != "member" { ocsf.resources = [repo_res] }
      } else if includes(["secret_scanning_alert", "code_scanning_alert", "dependabot_alert", "repository_vulnerability_alert", "alert"], gh_event) {
          # ================= Detection Finding (2004) =================
          al = object(pl.alert) ?? {}
          activity_id = 99
          activity_name = "Other"
          if action == "created" { activity_id = 1; activity_name = "Create" }
          if includes(["reopened", "reopened_by_user", "auto_reopened", "validated", "publicly_leaked", "appeared_in_branch", "dismissal_requested", "dismissal_denied"], action) { activity_id = 2; activity_name = "Update" }
          if includes(["resolved", "fixed", "closed_by_user", "dismissed", "auto_dismissed", "revoked"], action) { activity_id = 3; activity_name = "Close" }

          al_num = to_string(al.number) ?? ""
          fi = {}
          al_url = string(al.html_url) ?? ""
          fi_uid = string(al.url) ?? ""
          if fi_uid == "" && al_num != "" { fi_uid = repo_full + "#" + gh_event + "/" + al_num }
          if fi_uid == "" { fi_uid = md.uid }
          fi.uid = fi_uid
          if al_url != "" { fi.src_url = al_url }
          title = ""
          types = []
          sev = ""
          if gh_event == "secret_scanning_alert" {
              title = string(al.secret_type_display_name) ?? ""
              st = string(al.secret_type) ?? ""
              if st != "" { types = push(types, st) }
              sev = "high"
              if (string(al.validity) ?? "") == "active" { sev = "critical" }
          } else if gh_event == "code_scanning_alert" {
              title = string(al.rule.description) ?? ""
              rid = string(al.rule.id) ?? ""
              if rid != "" { types = push(types, rid) }
              sev = downcase(string(al.rule.security_severity_level) ?? "")
              if sev == "" {
                  rsev = downcase(string(al.rule.severity) ?? "")
                  if rsev == "error" { sev = "high" }
                  if rsev == "warning" { sev = "medium" }
                  if rsev == "note" { sev = "low" }
              }
              tool = string(al.tool.name) ?? ""
              if tool != "" { fi.analytic = { "name": tool, "type_id": 1, "type": "Rule" } }
          } else {
              title = string(al.security_advisory.summary) ?? ""
              ghsa = string(al.security_advisory.ghsa_id) ?? ""
              if ghsa != "" { types = push(types, ghsa) }
              sev = downcase(string(al.security_advisory.severity) ?? "")
          }
          if title == "" { title = event_code }
          fi.title = title
          if length(types) > 0 { fi.types = types }
          created = string(al.created_at) ?? ""
          c_t, c_err = parse_timestamp(created, "%+", timezone: "UTC")
          if c_err == null { fi.created_time = to_unix_timestamp(c_t, unit: "milliseconds") }

          if sev == "low" { severity_id = 2 }
          if sev == "medium" || sev == "moderate" { severity_id = 3 }
          if sev == "high" { severity_id = 4 }
          if sev == "critical" { severity_id = 5 }
          if activity_id == 3 { severity_id = 1 }

          state = downcase(string(al.state) ?? "")
          status_id = 0
          if state == "open" { status_id = 1 }
          if state == "resolved" || state == "fixed" || state == "dismissed" || state == "auto_dismissed" { status_id = 4 }

          ocsf = {
              "class_uid": 2004,
              "class_name": "Detection Finding",
              "category_uid": 2,
              "category_name": "Findings",
              "activity_id": activity_id,
              "activity_name": activity_name,
              "finding_info": fi,
              "is_alert": activity_id != 3
          }
          res = []
          if repo_res != {} { res = push(res, repo_res) }
          loc = string(al.most_recent_instance.location.path) ?? ""
          if loc != "" { res = push(res, { "name": loc, "type": "file" }) }
          if length(res) > 0 { ocsf.resources = res }
          if state != "" { ocsf.status_detail = state }
          # a secret pushed past push protection names the account that bypassed it
          byp = object(al.push_protection_bypassed_by) ?? {}
          byp_login = string(byp.login) ?? ""
          if byp_login != "" {
              bu = { "name": byp_login }
              byp_id = to_string(byp.id) ?? ""
              if byp_id != "" { bu.uid = byp_id }
              ocsf.evidences = [{ "name": "push_protection_bypass", "actor": { "user": bu } }]
          }
          msg = title
      } else if gh_event == "workflow_run" || gh_event == "workflow_job" {
          # ================= Application Lifecycle (6002) =================
          run = object(pl.workflow_run) ?? object(pl.workflow_job) ?? {}
          activity_id = 99
          activity_name = "Other"
          if action == "requested" || action == "queued" || action == "in_progress" || action == "waiting" { activity_id = 3; activity_name = "Start" }
          if action == "completed" { activity_id = 4; activity_name = "Stop" }
          app = { "vendor_name": "GitHub" }
          r_name = string(run.name) ?? ""
          app.name = r_name
          if r_name == "" { app.name = "workflow" }
          wf_id = to_string(run.workflow_id) ?? ""
          if wf_id != "" { app.uid = wf_id }
          wf_path = string(run.path) ?? ""
          if wf_path != "" { app.path = wf_path }
          head_sha = string(run.head_sha) ?? ""
          if head_sha != "" { app.version = head_sha }
          ocsf = {
              "class_uid": 6002,
              "class_name": "Application Lifecycle",
              "category_uid": 6,
              "category_name": "Application Activity",
              "activity_id": activity_id,
              "activity_name": activity_name,
              "app": app
          }
          # the run's own actor (who started it) is the actor; sender is the
          # account that triggered this delivery (the same on a first attempt)
          r_actor = object(run.triggering_actor) ?? object(run.actor) ?? {}
          ra_login = string(r_actor.login) ?? ""
          if ra_login != "" {
              au = { "name": ra_login }
              ra_id = to_string(r_actor.id) ?? ""
              if ra_id != "" { au.uid = ra_id }
              actor_user = au
          }
          ocsf.actor = { "user": actor_user }
          md.profiles = ["host"]
          conclusion = downcase(string(run.conclusion) ?? "")
          if conclusion == "success" || conclusion == "skipped" || conclusion == "neutral" { status_id = 1 }
          if conclusion == "failure" || conclusion == "timed_out" || conclusion == "startup_failure" || conclusion == "action_required" { status_id = 2; severity_id = 2 }
          if conclusion == "cancelled" { status_id = 99 }
          if conclusion == "" { status_id = 0 }
          if conclusion != "" { ocsf.status_detail = conclusion }
          run_id = to_string(run.id) ?? ""
          if run_id != "" { md.correlation_uid = run_id }
          msg = event_code + " " + app.name
          if conclusion != "" { msg = msg + " " + conclusion }
      } else {
          # ================= API Activity (6003) =================
          activity_id = 99
          activity_name = "Other"
          if includes(["created", "added", "requested", "transferred"], action) { activity_id = 1; activity_name = "Create" }
          if includes(["edited", "renamed", "archived", "unarchived", "publicized", "privatized", "approved", "denied", "enabled", "disabled", "policy_override", "updated", "new_permissions_accepted"], action) || gh_event == "push" || gh_event == "public" { activity_id = 3; activity_name = "Update" }
          if includes(["deleted", "removed", "cancelled", "revoked"], action) { activity_id = 4; activity_name = "Delete" }
          # an unidentified event's verb is about an object this parser cannot
          # name, never the repository it carries
          if gh_event == "unknown" { activity_id = 99; activity_name = "Other" }
          op = event_code
          if op == "" { op = "unknown" }
          ocsf = {
              "class_uid": 6003,
              "class_name": "API Activity",
              "category_uid": 6,
              "category_name": "Application Activity",
              "activity_id": activity_id,
              "activity_name": activity_name,
              "api": { "operation": op, "service": { "name": "GitHub" } },
              "actor": { "user": actor_user },
              "src_endpoint": { "hostname": "unknown" }
          }
          res = []
          # the object the event is about, then its repository
          if gh_event == "deploy_key" {
              k = object(pl.key) ?? {}
              kr = { "type": "deploy_key" }
