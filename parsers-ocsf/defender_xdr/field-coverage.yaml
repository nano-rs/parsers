source: json
transforms:
- source: severity
  kind: enum
  target: severity_id
  values: &id001
    informational: 1
    low: 2
    medium: 3
    high: 4
  reason: Defender severity word normalized to OCSF severity; consume only when the expected ID is emitted.
- source: Severity
  kind: enum
  target: severity_id
  values: *id001
  reason: Defender severity word normalized to OCSF severity; consume only when the expected ID is emitted.
- source: properties.Severity
  kind: enum
  target: severity_id
  values: *id001
  reason: Defender severity word normalized to OCSF severity; consume only when the expected ID is emitted.
- source: createdDateTime
  kind: epoch_ms
  target: finding_info.created_time
  reason: ISO clock converted to an emitted OCSF millisecond timestamp; verified against the output.
- source: lastUpdateDateTime
  kind: epoch_ms
  target: finding_info.modified_time
  reason: ISO clock converted to an emitted OCSF millisecond timestamp; verified against the output.
- source: lastUpdateDateTime
  kind: epoch_ms
  target: finding_info_list.modified_time
  reason: ISO clock converted to an emitted OCSF millisecond timestamp; verified against the output.
- source: lastUpdateDateTime
  kind: epoch_ms
  target: time
  reason: ISO clock converted to an emitted OCSF millisecond timestamp; verified against the output.
- source: firstActivityDateTime
  kind: epoch_ms
  target: finding_info.first_seen_time
  reason: ISO clock converted to an emitted OCSF millisecond timestamp; verified against the output.
- source: firstActivityDateTime
  kind: epoch_ms
  target: start_time
  reason: ISO clock converted to an emitted OCSF millisecond timestamp; verified against the output.
- source: lastActivityDateTime
  kind: epoch_ms
  target: end_time
  reason: ISO clock converted to an emitted OCSF millisecond timestamp; verified against the output.
- source: lastActivityDateTime
  kind: epoch_ms
  target: finding_info.last_seen_time
  reason: ISO clock converted to an emitted OCSF millisecond timestamp; verified against the output.
- source: Timestamp
  kind: epoch_ms
  target: finding_info.created_time
  reason: ISO clock converted to an emitted OCSF millisecond timestamp; verified against the output.
- source: Timestamp
  kind: epoch_ms
  target: time
  reason: ISO clock converted to an emitted OCSF millisecond timestamp; verified against the output.
- source: status
  kind: enum
  target: status_id
  values:
    new: 1
    active: 1
    inprogress: 2
    awaitingaction: 3
    resolved: 4
  reason: Graph alert/incident status normalized to the OCSF finding status; consume only when the expected
    ID is emitted.
- source: classification
  kind: enum
  target: verdict_id
  values:
    truepositive: 2
    falsepositive: 1
    informationalexpectedactivity: 5
  reason: Graph classification normalized to OCSF verdict; consume only when the expected ID is emitted.
- source: RemoteIP
  kind: lowercase
  target: evidences.dst_endpoint.ip
  reason: IP address is lowercased in the emitted endpoint.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
