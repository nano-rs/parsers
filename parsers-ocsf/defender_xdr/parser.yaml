                      if dname != "" { dv.hostname = dname }
                      if did != "" { dv.uid = did }
                      lip = to_string(row.LocalIP) ?? ""
                      if lip != "" { dv.ip = downcase(lip) }
                      ev.device = dv
                      device = dv
                  }
                  an_ = to_string(row.AccountName) ?? ""
                  aupn = to_string(row.AccountUpn) ?? ""
                  asid = to_string(row.AccountSid) ?? ""
                  aoid = to_string(row.AccountObjectId) ?? ""
                  if an_ != "" || aupn != "" || asid != "" || aoid != "" {
                      us = {}
                      us.name = if an_ != "" { an_ } else if aupn != "" { aupn } else if asid != "" { asid } else { aoid }
                      if contains(aupn, "@") { us.email_addr = aupn }
                      ad = to_string(row.AccountDomain) ?? ""
                      if ad != "" { us.domain = ad }
                      if asid != "" { us.uid = asid }
                      if aoid != "" { us.uid_alt = aoid }
                      ev.user = us
                      actor_user = us
                  }
                  if has_proc {
                      if length(keys(actor_user)) > 0 { pr.user = actor_user }
                      ev.process = pr
                      actor_process = pr
                  }
                  rip = to_string(row.RemoteIP) ?? ""
                  if rip != "" {
                      if downcase(to_string(row.EvidenceDirection) ?? "") == "source" {
                          ev.src_endpoint = { "ip": downcase(rip) }
                      } else {
                          ev.dst_endpoint = { "ip": downcase(rip) }
                      }
                  }
                  rurl = to_string(row.RemoteUrl) ?? ""
                  if rurl != "" { ev.url = { "url_string": rurl } }
                  rk = to_string(row.RegistryKey) ?? ""
                  if rk != "" {
                      ev.reg_key = { "path": rk }
                      rvn = to_string(row.RegistryValueName) ?? ""
                      if rvn != "" { ev.reg_value = { "name": rvn, "path": rk } }
                  }
                  cres = to_string(row.CloudResource) ?? ""
                  cresid = to_string(row.ResourceID) ?? ""
                  if cres != "" || cresid != "" {
                      res = {}
                      if cres != "" { res.name = cres }
                      if cresid != "" { res.uid = cresid }
                      rty = to_string(row.ResourceType) ?? ""
                      if rty != "" { res.type = rty }
