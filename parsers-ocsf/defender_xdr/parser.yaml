                  # JSON string, not as a column. to_int(null) is 0, so null is
                  # guarded explicitly: a missing id never becomes pid 0.
                  ppid_ = -1
                  if row.ProcessId != null { ppid_ = to_int(row.ProcessId) ?? -1 }
                  if ppid_ < 0 && is_string(row.AdditionalFields) {
                      xaf = object(parse_json(string!(row.AdditionalFields)) ?? {}) ?? {}
                      if xaf.ProcessId != null { ppid_ = to_int(xaf.ProcessId) ?? -1 }
                  }
