                      # constraint; data carries the compact resource identity.
                      if length(keys(ev)) <= 2 { ev.data = res }
                      top_resources = push(top_resources, res)
                  }
                  if length(keys(ev)) <= 1 { ev.data = { "EntityType": et } }
                  evidences = [ev]
              }
          }

