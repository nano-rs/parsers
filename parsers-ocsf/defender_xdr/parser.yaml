          ocsf.class_name = "Detection Finding"
          ocsf.category_uid = 2
          ocsf.category_name = "Findings"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          ocsf.type_uid = 200400 + activity_id
          ocsf.severity_id = severity_id
          ocsf.severity = severity
          ocsf.status_id = status_id
          ocsf.status = status_str
          ocsf.is_alert = true
          ocsf.time = time_ms
          ocsf.finding_info = finding_info
          ocsf.metadata = meta
          ocsf.cloud = { "provider": "Azure" }
          if title != "" { ocsf.message = title }
          if length(evidences) > 0 { ocsf.evidences = evidences }
          if length(keys(device)) > 0 { ocsf.device = device }
          if first_ms > 0 { ocsf.start_time = first_ms }
          if last_ms > 0 { ocsf.end_time = last_ms }
