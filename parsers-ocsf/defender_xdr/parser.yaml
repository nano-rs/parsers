                      # id the uid is explicitly synthetic ("synthetic:defender_xdr:"
                      # prefix) and scoped to one alert, so it is never mistaken for
                      # an OS process GUID in a correlation join.
                      if ppid_ >= 0 {
                          pr.pid = ppid_
