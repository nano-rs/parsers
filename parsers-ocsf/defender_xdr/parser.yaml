name: defender_xdr_ocsf
display_name: Microsoft Defender XDR alerts and incidents (OCSF)
version: "1.0.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses Microsoft Defender XDR alert and incident records into OCSF 1.9.0:
    * Graph security alerts_v2 (GET /security/alerts_v2)      -> Detection Finding 2004
      with evidence[] mapped to evidences[] (device, file, process, user, ip,
      url, registry, mailbox, email message) and mitreTechniques to
      finding_info.attacks[]
    * Graph security incidents (GET /security/incidents)      -> Incident Finding 2005
      (an `alerts` array from $expand=alerts becomes finding_info_list[])
    * Streaming API / advanced hunting AlertInfo rows         -> Detection Finding 2004
    * Streaming API / advanced hunting AlertEvidence rows     -> Detection Finding 2004
      (activity Update, one evidence entity per row)
  Streaming API rows are accepted both inside the Event Hubs record
  (`category` "AdvancedHunting-AlertInfo" / "AdvancedHunting-AlertEvidence"
  with the row in `properties`) and as bare rows. One record per event: the
  Event Hubs `{"records": [...]}` envelope and the Graph `{"value": [...]}`
  page are exploded upstream; one that reaches the lane anyway is kept whole
  as a Base Event, never dropped. Anything unparseable is a Base Event with
  the body in raw_data and unmapped.parse_fallback set. Severity maps
  informational/low/medium/high to 1/2/3/4; alert status new/inProgress/resolved
  maps to finding status New/In Progress/Resolved and activity
  Create/Update/Close; classification/determination map to verdict.
  metadata.uid is deterministic (sha256 of the natural id plus last update
  time) so a replay dedupes in the lake. Distinct from defender_edr, which
  parses Defender for Endpoint device telemetry.
  The primary process and user evidence (Graph evidence[] or an AlertEvidence
  row, including ProcessCommandLine) is also promoted to actor.process /
  actor.user (host profile), and Azure resource evidence to top-level
  resources, where nano's unified hunt columns read them. A missing clock
  falls back to ingest time, never 1970. An AlertEvidence process id is read
  from the AdditionalFields JSON when present; otherwise, because OCSF needs
  pid, uid or cpid, process.uid is a synthetic value prefixed
  "synthetic:defender_xdr:" (16 hex chars of sha256 over alert id, device id
  and command line). It is scoped to one alert and is NOT an OS process GUID,
  so do not join it against EDR or Sysmon process_guid.
  Sample sources:
    https://learn.microsoft.com/en-us/graph/api/security-alert-get?view=graph-rest-1.0
    https://learn.microsoft.com/en-us/graph/api/resources/security-alert?view=graph-rest-1.0
    https://learn.microsoft.com/en-us/graph/api/security-incident-get?view=graph-rest-1.0
    https://learn.microsoft.com/en-us/graph/api/resources/security-incident?view=graph-rest-1.0
    https://learn.microsoft.com/en-us/defender-xdr/streaming-api-event-hub
    https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-alertinfo-table
    https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-alertevidence-table
match_values:
  - defender_xdr
category: security
vendor: "Microsoft"
product: "Defender XDR"
parser_vrl: |
  # NAN source timezone. Generated by scripts/residual_spill.py; edit scripts/residual/source_tz.vrl.
  # The log source's timezone setting arrives as .nano.source_timezone (an IANA
  # name such as "America/New_York", or any fixed offset such as "+05:30"), set
  # by nano at ingest. .nano is nano's input, never part of the log: it is
  # removed whole before anything else, whatever its shape.
  # For a clock that carries no offset a parser parses it AS UTC and sets
  # __lc_pending; the generated local-clock block that follows the parse
  # (local_clock.vrl) turns it into real UTC with this setting, and the spill
  # records the zone used as unmapped.nano_time_assumed_tz (the name, the offset
  # as +HH:MM, or "UTC" when the setting is absent, invalid or "local").
  __src_nano = del(.nano)
  __src_tz_in = ""
  if is_object(__src_nano) { __src_tz_in = strip_whitespace(to_string(object!(__src_nano).source_timezone) ?? "") }
  __src_tz = "UTC"
  __src_shift_ms = 0
  __src_tz_label = "UTC"
  __time_assumed = false
  __time_inline = false
  __lc_pending = false
  # No parse_* decoder here: nano infers a parser's input contract from the first
  # decoder in its program (parse_json first = a JSON-input parser, handed the
  # whole HEC / OTLP object). This prelude opens every parser, so a decoder in it
  # would turn every JSON-input parser into a text one. match + slice instead.
  if match(__src_tz_in, r'^[+-]\d{2}:?\d{2}$') {
      __src_sign = slice(__src_tz_in, 0, 1) ?? "+"
      __src_digits = replace(slice(__src_tz_in, 1) ?? "", ":", "")
      __src_hh = slice(__src_digits, 0, 2) ?? "99"
      __src_mm = slice(__src_digits, 2, 4) ?? "99"
      __src_h = to_int(__src_hh) ?? 99
      __src_m = to_int(__src_mm) ?? 99
      if __src_h <= 14 && __src_m <= 59 {
          __src_shift_ms = (__src_h * 3600 + __src_m * 60) * 1000
          if __src_sign == "-" { __src_shift_ms = 0 - __src_shift_ms }
          if __src_shift_ms != 0 { __src_tz_label = __src_sign + __src_hh + ":" + __src_mm }
      }
  } else if __src_tz_in != "" && downcase(__src_tz_in) != "local" {
      # "local" (the Vector host's zone) would make the time depend on the host.
      __src_probe, __src_probe_err = parse_timestamp("2000-01-01 00:00:00", "%Y-%m-%d %H:%M:%S", timezone: __src_tz_in)
      if __src_probe_err == null { __src_tz = __src_tz_in; __src_tz_label = __src_tz_in }
  }
  # END NAN source timezone
  # nano's input contract (nanosiem hec_payload.rs), stated: JSON. From nano
  # v2.0.36 a declared parser gets an HEC object event's whole record, as
  # /ingest does; undeclared it gets the v2.0.35 HEC delivery (NAN-5902).
  # nano:input=json
  # Microsoft Defender XDR alert / incident -> OCSF 1.9.0 (2004 / 2005 / 0)
  raw_log = to_string(.message) ?? ""
  __raw_body = raw_log
  __source_kv = {}

  parsed, err = parse_json(raw_log)
  p = {}
  is_obj = false
  if err == null && is_object(parsed) {
      p = object!(parsed)
      is_obj = true
  }
  __source_kv = p

  # ---- shape detection ----
  rec_cat = to_string(p.category) ?? ""
  props = object(p.properties) ?? {}
  row = p
  shape = "unknown"
  if rec_cat == "AdvancedHunting-AlertInfo" && length(keys(props)) > 0 {
      shape = "alertinfo"
      row = props
  } else if rec_cat == "AdvancedHunting-AlertEvidence" && length(keys(props)) > 0 {
      shape = "alertevidence"
      row = props
  } else {
      odata = downcase(to_string(get(p, ["@odata.type"]) ?? null) ?? "")
      has_alert_id = (to_string(p.AlertId) ?? "") != ""
      if has_alert_id && exists(p.EntityType) {
          shape = "alertevidence"
      } else if has_alert_id {
          shape = "alertinfo"
      } else if odata == "#microsoft.graph.security.alert" || exists(p.providerAlertId) || (exists(p.serviceSource) && exists(p.evidence)) {
          shape = "alert"
      } else if odata == "#microsoft.graph.security.incident" || (exists(p.incidentWebUrl) && exists(p.displayName)) {
          shape = "incident"
      }
  }

  base_meta = {
      "version": "1.9.0",
      "profiles": ["cloud"],
      "log_provider": "Microsoft Defender XDR",
      "product": { "name": "Microsoft Defender XDR", "vendor_name": "Microsoft" }
  }

  if !is_obj || shape == "unknown" {
      # Unparseable body or an unknown shape: still a valid OCSF Base Event.
      reason = "unparsable input"
      if is_obj { reason = "unrecognized Defender XDR record shape" }
      meta = base_meta
      meta.uid = sha2("defender_xdr|raw|" + raw_log, variant: "SHA-256")
      meta.log_level = "error"
      meta.log_name = "DefenderXDR"
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 0,
          "activity_name": "Unknown",
          "type_uid": 0,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": to_unix_timestamp(now(), unit: "milliseconds"),
          "raw_data": raw_log,
          "metadata": meta,
          "cloud": { "provider": "Azure" }
      }
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      . = set!(., ["unmapped", "parse_fallback"], reason)
  } else {
      # ---- common: severity ----
      # to_string(null) is "" (it does not fail), so each fallback is an explicit empty check.
      sev_l = downcase(to_string(row.severity) ?? "")
      if sev_l == "" { sev_l = downcase(to_string(row.Severity) ?? "") }
      severity_id = 0
      severity = "Unknown"
      if sev_l == "informational" { severity_id = 1; severity = "Informational" }
      if sev_l == "low" { severity_id = 2; severity = "Low" }
      if sev_l == "medium" { severity_id = 3; severity = "Medium" }
      if sev_l == "high" { severity_id = 4; severity = "High" }

      tenant_id = to_string(p.tenantId) ?? ""
      if tenant_id == "" { tenant_id = to_string(row.tenantId) ?? "" }
      meta = base_meta
      if tenant_id != "" { meta.tenant_uid = tenant_id }

      # ---- common: verdict from classification / determination ----
      cls_l = downcase(to_string(row.classification) ?? "")
      det_l = downcase(to_string(row.determination) ?? "")
      verdict_id = 0
      verdict = ""
      if cls_l == "truepositive" { verdict_id = 2; verdict = "True Positive" }
      if cls_l == "falsepositive" { verdict_id = 1; verdict = "False Positive" }
      if cls_l == "informationalexpectedactivity" { verdict_id = 5; verdict = "Benign" }
      if det_l == "securitytesting" { verdict_id = 6; verdict = "Test" }

      # ---- common: clocks ----
      created_ms = 0
      ct, cterr = parse_timestamp(to_string(row.createdDateTime) ?? "", "%+", timezone: "UTC")
      if cterr == null { created_ms = to_unix_timestamp(ct, unit: "milliseconds") }
      updated_ms = 0
      ut, uterr = parse_timestamp(to_string(row.lastUpdateDateTime) ?? "", "%+", timezone: "UTC")
      if uterr == null { updated_ms = to_unix_timestamp(ut, unit: "milliseconds") }
      row_ms = 0
      rt, rterr = parse_timestamp(to_string(row.Timestamp) ?? "", "%+", timezone: "UTC")
      if rterr == null { row_ms = to_unix_timestamp(rt, unit: "milliseconds") }
      rec_ms = 0
      rct, rcterr = parse_timestamp(to_string(p.time) ?? "", "%+", timezone: "UTC")
      if rcterr == null { rec_ms = to_unix_timestamp(rct, unit: "milliseconds") }

      # ---- common: MITRE techniques ----
      # Graph: ["T1564.001"]; AlertInfo/AlertEvidence: a JSON-array string,
      # e.g. "[\"Masquerading (T1036)\"]".
      tech_list = array(row.mitreTechniques) ?? []
      at_raw = row.AttackTechniques
      if is_array(at_raw) {
          tech_list = array!(at_raw)
      } else if is_string(at_raw) {
          at_parsed = parse_json(string!(at_raw)) ?? null
          if is_array(at_parsed) { tech_list = array!(at_parsed) }
      }
      attacks = []
      for_each(tech_list) -> |_i, tv| {
          ts = to_string(tv) ?? ""
          tm, tmerr = parse_regex(ts, r'^(?:(?P<name>.*?)\s*\x28)?(?P<tech>T\d{4})(?:\.(?P<sub>\d{3}))?\x29?\s*$')
          if tmerr == null {
              tech = { "uid": string!(tm.tech) }
              tname = string(tm.name) ?? ""
              sub = string(tm.sub) ?? ""
              atk = {}
              if sub != "" {
                  atk.sub_technique = { "uid": string!(tm.tech) + "." + sub }
                  if tname != "" { atk.sub_technique.name = tname }
              } else if tname != "" {
                  tech.name = tname
              }
              atk.technique = tech
              attacks = push(attacks, atk)
          }
      }

      ocsf = {}

      if shape == "incident" {
          # =================== Graph incident -> Incident Finding 2005 ===================
          inc_id = to_string(row.id) ?? ""
          title = to_string(row.displayName) ?? ""
          st_l = downcase(to_string(row.status) ?? "")
          status_id = 0
          status_str = "Unknown"
          activity_id = 2
          activity_name = "Update"
          if st_l == "active" { status_id = 1; status_str = "New"; activity_id = 1; activity_name = "Create" }
          if st_l == "inprogress" { status_id = 2; status_str = "In Progress" }
          if st_l == "awaitingaction" { status_id = 3; status_str = "On Hold" }
          if st_l == "resolved" { status_id = 4; status_str = "Resolved"; activity_id = 3; activity_name = "Close" }
          if st_l == "redirected" { status_id = 5; status_str = "Closed"; activity_id = 3; activity_name = "Close" }
          if status_id == 0 && st_l != "" { status_id = 99; status_str = to_string(row.status) ?? "Other" }

          infos = []
          for_each(array(row.alerts) ?? []) -> |_i, al| {
              a = object(al) ?? {}
              aid = to_string(a.id) ?? ""
              if aid != "" {
                  fi = { "uid": aid }
                  at = to_string(a.title) ?? ""
                  if at != "" { fi.title = at }
                  infos = push(infos, fi)
              }
          }
          if length(infos) == 0 {
              fi_uid = if inc_id != "" { inc_id } else { "unknown" }
              fi = { "uid": fi_uid }
              if title != "" { fi.title = title }
              if created_ms > 0 { fi.created_time = created_ms }
              if updated_ms > 0 { fi.modified_time = updated_ms }
              infos = [fi]
          }

          meta.log_name = "incidents"
          meta.uid = sha2("defender_xdr|incident|" + inc_id + "|" + (to_string(row.lastUpdateDateTime) ?? ""), variant: "SHA-256")
          if inc_id != "" { meta.correlation_uid = inc_id }
          meta.profiles = ["cloud", "incident"]
          inc_ms = if updated_ms > 0 { updated_ms } else { created_ms }
          if inc_ms <= 0 { inc_ms = to_unix_timestamp(now(), unit: "milliseconds") }
          ocsf = {
              "class_uid": 2005,
              "class_name": "Incident Finding",
              "category_uid": 2,
              "category_name": "Findings",
              "activity_id": activity_id,
              "activity_name": activity_name,
              "type_uid": 200500 + activity_id,
              "severity_id": severity_id,
              "severity": severity,
              "status_id": status_id,
              "status": status_str,
              "time": inc_ms,
              "finding_info_list": infos,
              "metadata": meta,
              "cloud": { "provider": "Azure" }
          }
          if title != "" { ocsf.message = title }
          desc = to_string(row.description) ?? ""
          if desc != "" { ocsf.desc = desc }
          if created_ms > 0 { ocsf.start_time = created_ms }
          url = to_string(row.incidentWebUrl) ?? ""
          if url != "" { ocsf.src_url = url }
          if verdict_id > 0 { ocsf.verdict_id = verdict_id; ocsf.verdict = verdict }
          assigned = to_string(row.assignedTo) ?? ""
          if assigned != "" {
              ocsf.assignee = { "name": assigned }
              if contains(assigned, "@") { ocsf.assignee.email_addr = assigned }
          }
          rc = to_string(row.resolvingComment) ?? ""
          if rc != "" { ocsf.comment = rc }
      } else {
          # =================== alert shapes -> Detection Finding 2004 ===================
          evidences = []
          device = {}
          alert_uid = ""
          title = ""
          activity_id = 1
          activity_name = "Create"
          status_id = 1
          status_str = "New"
          finding_info = {}
          time_ms = 0
          first_ms = 0
          # Primary entities promoted to the top level (actor / resources), where
          # nano's unified hunt columns read them; evidences[] keeps every entity.
          actor_process = {}
          actor_user = {}
          top_resources = []
          last_ms = 0

          if shape == "alert" {
              alert_uid = to_string(row.id) ?? ""
              title = to_string(row.title) ?? ""
              st_l = downcase(to_string(row.status) ?? "")
              status_id = 0
              status_str = "Unknown"
              activity_id = 2
              activity_name = "Update"
              if st_l == "new" { status_id = 1; status_str = "New"; activity_id = 1; activity_name = "Create" }
              if st_l == "inprogress" { status_id = 2; status_str = "In Progress" }
              if st_l == "resolved" { status_id = 4; status_str = "Resolved"; activity_id = 3; activity_name = "Close" }
              if status_id == 0 && st_l != "" { status_id = 99; status_str = to_string(row.status) ?? "Other" }
              time_ms = if updated_ms > 0 { updated_ms } else { created_ms }

              fi_uid = if alert_uid != "" { alert_uid } else { "unknown" }
              finding_info = { "uid": fi_uid }
              if title != "" { finding_info.title = title }
              d = to_string(row.description) ?? ""
              if d != "" { finding_info.desc = d }
              if created_ms > 0 { finding_info.created_time = created_ms }
              if updated_ms > 0 { finding_info.modified_time = updated_ms }
              fa, faerr = parse_timestamp(to_string(row.firstActivityDateTime) ?? "", "%+", timezone: "UTC")
              if faerr == null { first_ms = to_unix_timestamp(fa, unit: "milliseconds"); finding_info.first_seen_time = first_ms }
              la, laerr = parse_timestamp(to_string(row.lastActivityDateTime) ?? "", "%+", timezone: "UTC")
              if laerr == null { last_ms = to_unix_timestamp(la, unit: "milliseconds"); finding_info.last_seen_time = last_ms }
              aurl = to_string(row.alertWebUrl) ?? ""
              if aurl != "" { finding_info.src_url = aurl }
              cat = to_string(row.category) ?? ""
              if cat != "" { finding_info.types = [cat] }
              svc = to_string(row.serviceSource) ?? ""
              if svc != "" { finding_info.data_sources = [svc] }
              det_src = to_string(row.detectionSource) ?? ""
              det_id = to_string(row.detectorId) ?? ""
              if det_src != "" || det_id != "" {
                  an = { "type_id": 99, "type": "Other" }
                  if contains(downcase(det_src), "custom") { an.type_id = 1; an.type = "Rule" }
                  if det_src != "" { an.name = det_src }
                  if det_id != "" { an.uid = det_id }
                  finding_info.analytic = an
              }
              pa = to_string(row.providerAlertId) ?? ""
              if pa != "" && pa != alert_uid { finding_info.uid_alt = pa }
              pn = to_string(row.productName) ?? ""
              if pn != "" { meta.product.name = pn }
              inc = to_string(row.incidentId) ?? ""
              if inc != "" { meta.correlation_uid = inc }
              meta.log_name = "alerts_v2"
              meta.uid = sha2("defender_xdr|alert|" + alert_uid + "|" + (to_string(row.lastUpdateDateTime) ?? ""), variant: "SHA-256")

              # ---- evidence[] -> evidences[] ----
              for_each(array(row.evidence) ?? []) -> |_i, evv| {
                  e = object(evv) ?? {}
                  etype = to_string(get(e, ["@odata.type"]) ?? null) ?? ""
                  etype = replace(etype, "#microsoft.graph.security.", "")
                  ev = {}
                  if etype != "" { ev.name = etype }
                  vd = downcase(to_string(e.verdict) ?? "")
                  if vd == "suspicious" { ev.verdict_id = 4; ev.verdict = "Suspicious" }
                  if vd == "malicious" { ev.verdict_id = 8; ev.verdict = "Security Risk" }
                  if vd == "nothreatsfound" { ev.verdict_id = 5; ev.verdict = "Benign" }
                  fd = object(e.fileDetails) ?? object(e.imageFile) ?? {}
                  fname = to_string(fd.fileName) ?? ""
                  fobj = {}
                  if fname != "" {
                      fobj = { "name": fname, "type_id": 1, "type": "Regular File" }
                      fdir = to_string(fd.filePath) ?? ""
                      if fdir != "" { fobj.parent_folder = fdir; fobj.path = fdir + "\\" + fname }
                      fsz = to_int(fd.fileSize) ?? 0
                      if fsz > 0 { fobj.size = fsz }
                      hashes = []
                      h1 = to_string(fd.sha1) ?? ""
                      if h1 != "" { hashes = push(hashes, { "algorithm_id": 2, "algorithm": "SHA-1", "value": h1 }) }
                      h2 = to_string(fd.sha256) ?? ""
                      if h2 != "" { hashes = push(hashes, { "algorithm_id": 3, "algorithm": "SHA-256", "value": h2 }) }
                      if length(hashes) > 0 { fobj.hashes = hashes }
                      fpub = to_string(fd.filePublisher) ?? ""
                      if fpub != "" { fobj.company_name = fpub }
                  }
                  if etype == "deviceEvidence" {
                      dv = { "type_id": 0, "type": "Unknown" }
                      hn = to_string(e.hostName) ?? ""
                      dns = to_string(e.deviceDnsName) ?? ""
                      if hn == "" { hn = dns }
                      if hn != "" { dv.hostname = hn }
                      if dns != "" { dv.name = dns }
                      did = to_string(e.mdeDeviceId) ?? ""
                      if did != "" { dv.uid = did }
                      aad = to_string(e.azureAdDeviceId) ?? ""
                      if aad != "" { dv.uid_alt = aad }
                      dd = to_string(e.dnsDomain) ?? ""
                      if dd != "" { dv.domain = dd }
                      ips = array(e.ipInterfaces) ?? []
                      if length(ips) > 0 { dv.ip = downcase(to_string(ips[0]) ?? "") }
                      if length(keys(dv)) > 2 {
                          ev.device = dv
                          if length(keys(device)) == 0 { device = dv }
                      }
                  } else if etype == "fileEvidence" {
                      if fname != "" { ev.file = fobj }
                  } else if etype == "processEvidence" {
                      # to_int(null) is 0, not an error: guard null so a missing id
                      # never fabricates pid 0 (Windows System Idle Process).
                      pid = if e.processId != null { to_int(e.processId) ?? -1 } else { -1 }
                      if pid >= 0 {
                          pr = { "pid": pid }
                          cl = to_string(e.processCommandLine) ?? ""
                          if cl != "" { pr.cmd_line = cl }
                          if fname != "" { pr.name = fname; pr.file = fobj }
                          pct, pcterr = parse_timestamp(to_string(e.processCreationDateTime) ?? "", "%+", timezone: "UTC")
                          if pcterr == null { pr.created_time = to_unix_timestamp(pct, unit: "milliseconds") }
                          ppid = if e.parentProcessId != null { to_int(e.parentProcessId) ?? -1 } else { -1 }
                          if ppid >= 0 {
                              pp = { "pid": ppid }
                              ppf = object(e.parentProcessImageFile) ?? {}
                              ppn = to_string(ppf.fileName) ?? ""
                              if ppn != "" { pp.name = ppn }
                              pr.parent_process = pp
                          }
                          ua = object(e.userAccount) ?? {}
                          uan = to_string(ua.accountName) ?? ""
                          if uan != "" {
                              pu = { "name": uan }
                              uad = to_string(ua.domainName) ?? ""
                              if uad != "" { pu.domain = uad }
                              usid = to_string(ua.userSid) ?? ""
                              if usid != "" { pu.uid = usid }
                              pr.user = pu
                          }
                          ev.process = pr
                          if length(keys(actor_process)) == 0 { actor_process = pr }
                      } else if fname != "" {
                          ev.file = fobj
                      }
                  } else if etype == "userEvidence" {
                      ua = object(e.userAccount) ?? {}
                      un = to_string(ua.accountName) ?? ""
                      if un == "" { un = to_string(ua.userPrincipalName) ?? "" }
                      if un != "" {
                          us = { "name": un }
                          upn = to_string(ua.userPrincipalName) ?? ""
                          if contains(upn, "@") { us.email_addr = upn }
                          dn = to_string(ua.domainName) ?? ""
                          if dn != "" { us.domain = dn }
                          usid = to_string(ua.userSid) ?? ""
                          if usid != "" { us.uid = usid }
                          aid = to_string(ua.azureAdUserId) ?? ""
                          if aid != "" { us.uid_alt = aid }
                          disp = to_string(ua.displayName) ?? ""
                          if disp != "" { us.display_name = disp }
                          ev.user = us
                          if length(keys(actor_user)) == 0 { actor_user = us }
                      }
                  } else if etype == "azureResourceEvidence" {
                      arid = to_string(e.resourceId) ?? ""
                      arn = to_string(e.resourceName) ?? ""
                      if arid != "" || arn != "" {
                          res = {}
                          if arn != "" { res.name = arn }
                          if arid != "" { res.uid = arid }
                          arty = to_string(e.resourceType) ?? ""
                          if arty != "" { res.type = arty }
                          ev.resources = [res]
                          # OCSF evidences need one of actor/data/device/...; resources
                          # is not in that list, so data carries the compact resource
                          # identity only, never the whole raw Graph entity.
                          ev.data = res
                          top_resources = push(top_resources, res)
                      }
                  } else if etype == "ipEvidence" {
                      ip = to_string(e.ipAddress) ?? ""
                      if ip != "" { ev.dst_endpoint = { "ip": downcase(ip) } }
                  } else if etype == "urlEvidence" {
                      u = to_string(e.url) ?? ""
                      if u != "" { ev.url = { "url_string": u } }
                  } else if etype == "registryKeyEvidence" || etype == "registryValueEvidence" {
                      rk = to_string(e.registryKey) ?? ""
                      rh = to_string(e.registryHive) ?? ""
                      if rk != "" {
                          rpath = if rh != "" { rh + "\\" + rk } else { rk }
                          ev.reg_key = { "path": rpath }
                          rvn = to_string(e.registryValueName) ?? ""
                          if rvn != "" { ev.reg_value = { "name": rvn, "path": rpath } }
                      }
                  } else if etype == "mailboxEvidence" {
                      mb = to_string(e.primaryAddress) ?? ""
                      if mb != "" {
                          ev.user = { "name": mb, "email_addr": mb }
                          mdn = to_string(e.displayName) ?? ""
                          if mdn != "" { ev.user.display_name = mdn }
                      }
                  } else if etype == "analyzedMessageEvidence" {
                      sfrom = to_string(e.senderFromAddress) ?? ""
                      rto = to_string(e.recipientEmailAddress) ?? ""
                      if sfrom != "" || rto != "" {
                          em = {}
                          if sfrom != "" { em.from = sfrom }
                          if rto != "" { em.to = [rto] }
                          subj = to_string(e.subject) ?? ""
                          if subj != "" { em.subject = subj }
                          nmi = to_string(e.networkMessageId) ?? ""
                          if nmi != "" { em.uid = nmi }
                          imid = to_string(e.internetMessageId) ?? ""
                          if imid != "" { em.message_uid = imid }
                          ev.email = em
                      }
                  }
