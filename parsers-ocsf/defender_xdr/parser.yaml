          meta.profiles = ["cloud", "incident"]
          actor = {}
          if length(keys(actor_process)) > 0 {
              actor.process = actor_process
              if length(keys(actor_user)) == 0 && exists(actor_process.user) { actor_user = object(actor_process.user) ?? {} }
