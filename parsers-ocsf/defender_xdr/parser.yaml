              } else {
                  # One AlertEvidence row adds one entity to an existing alert.
                  activity_id = 2
                  activity_name = "Update"
                  status_id = 0
                  status_str = "Unknown"
                  meta.log_name = "AlertEvidence"
                  meta.uid = sha2("defender_xdr|alertevidence|" + raw_log, variant: "SHA-256")
                  et = to_string(row.EntityType) ?? ""
                  ev = {}
                  if et != "" { ev.name = et }
                  fname = to_string(row.FileName) ?? ""
                  fobj = {}
                  if fname != "" {
                      fobj = { "name": fname, "type_id": 1, "type": "Regular File" }
                      fp = to_string(row.FolderPath) ?? ""
                      if fp != "" { fobj.path = fp }
                      fsz = to_int(row.FileSize) ?? 0
                      if fsz > 0 { fobj.size = fsz }
                      hashes = []
                      h1 = to_string(row.SHA1) ?? ""
                      if h1 != "" { hashes = push(hashes, { "algorithm_id": 2, "algorithm": "SHA-1", "value": h1 }) }
                      h2 = to_string(row.SHA256) ?? ""
                      if h2 != "" { hashes = push(hashes, { "algorithm_id": 3, "algorithm": "SHA-256", "value": h2 }) }
                      if length(hashes) > 0 { fobj.hashes = hashes }
                      ev.file = fobj
                  }
                  pcl = to_string(row.ProcessCommandLine) ?? ""
