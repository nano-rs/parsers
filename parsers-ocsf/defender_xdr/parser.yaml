              fi_uid = if alert_uid != "" { alert_uid } else { "unknown" }
              finding_info = { "uid": fi_uid }
              if title != "" { finding_info.title = title }
              if time_ms > 0 { finding_info.created_time = time_ms }
              svc = to_string(row.ServiceSource) ?? ""
              if svc != "" { finding_info.data_sources = [svc] }
              det_src = to_string(row.DetectionSource) ?? ""
