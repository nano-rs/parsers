source: json
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
transforms:
- source: FIRST_AUTHENTICATION_FACTOR
  kind: enum
  target: auth_protocol
  values:
    saml2_assertion: SAML
    oauth_access_token: OAUTH 2.0
  reason: SAML and OAuth first factors are the authentication protocol.
mappings:
  CLIENT_IP:
  - src_endpoint.ip
  ERROR_CODE:
  - status_code
  ERROR_MESSAGE:
  - message
  - status_detail
  EVENT_ID:
  - metadata.uid
  EVENT_TYPE:
  - message
  - metadata.event_code
  FIRST_AUTHENTICATION_FACTOR:
  - auth_factors.factor_type
  SECOND_AUTHENTICATION_FACTOR:
  - auth_factors.factor_type
  USER_NAME:
  - actor.user.name
  - user.name
  DATABASE_NAME:
  - database.name
  QUERY_ID:
  - metadata.correlation_uid
  - metadata.uid
  - query_info.uid
  QUERY_TEXT:
  - query_info.query_string
  QUERY_TYPE:
  - message
  - metadata.event_code
  ROLE_NAME:
  - actor.iam_role.name
  SESSION_ID:
  - actor.session.uid
  TOTAL_ELAPSED_TIME:
  - duration
  OBJECT_MODIFIED_BY_DDL.objectName:
  - databucket.name
