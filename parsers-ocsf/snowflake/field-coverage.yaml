source: json
transforms:
- source: FIRST_AUTHENTICATION_FACTOR
  kind: enum
  target: auth_protocol
  values:
    saml2_assertion: SAML
    oauth_access_token: OAUTH 2.0
  reason: SAML and OAuth first factors are the authentication protocol.
consumed_candidates:
- CLIENT_IP
- DATABASE_NAME
- ERROR_CODE
- ERROR_MESSAGE
- EVENT_ID
- EVENT_TIMESTAMP
- EVENT_TYPE
- EXECUTION_STATUS
- FIRST_AUTHENTICATION_FACTOR
- IS_SUCCESS
- QUERY_ID
- QUERY_START_TIME
- QUERY_TEXT
- QUERY_TYPE
- ROLE_NAME
- SECOND_AUTHENTICATION_FACTOR
- SESSION_ID
- START_TIME
- TOTAL_ELAPSED_TIME
- USER_NAME
consumed_reason: The row clocks (EVENT_TIMESTAMP, START_TIME, QUERY_START_TIME) are
  parsed into time but always spill too, because Snowflake's space-separated form has no
  format both Vector and the coverage checker parse identically. Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. The ACCESS_HISTORY object
  columns are JSON text, so they always spill whole even though their tables, stages
  and users are mapped.
