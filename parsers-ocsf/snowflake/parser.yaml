name: snowflake_ocsf
display_name: Snowflake Account Usage (OCSF)
version: "1.0.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses Snowflake SNOWFLAKE.ACCOUNT_USAGE rows exported as JSON (one row per
  message, the view's own UPPER_CASE column names) into complete OCSF 1.9.0
  records:
    LOGIN_HISTORY  (EVENT_ID + EVENT_TYPE)              -> Authentication 3002
    QUERY_HISTORY  (QUERY_ID + QUERY_TEXT)              -> Datastore Activity 6005,
                   activity from QUERY_TYPE (SELECT Query, INSERT/COPY Write,
                   UPDATE/MERGE Update, DELETE/DROP Delete, CREATE Create,
                   SHOW/DESCRIBE List)
    ACCESS_HISTORY (QUERY_ID + *_OBJECTS_ACCESSED)      -> Datastore Activity 6005
                   (Read, Write when OBJECTS_MODIFIED is non-empty, the DDL
                   verb for OBJECT_MODIFIED_BY_DDL), or User Management 3007
                   when the DDL creates, alters or drops a USER
  The full SQL text goes to query_info.query_string, never truncated.
  ACCESS_HISTORY joins QUERY_HISTORY on
  metadata.correlation_uid (the QUERY_ID). CLIENT_IP values that are not IPs
  (INTERNAL_SNOWFLAKE_IP/...) are kept in unmapped, never written to an IP
  column. Rows of any other view, and unparseable input, become a Base Event
  with the raw row kept.
match_values:
  - snowflake
category: cloud
vendor: "Snowflake"
product: "Snowflake"
parser_vrl: |
  # NAN source timezone. Generated by scripts/residual_spill.py; edit scripts/residual/source_tz.vrl.
  # The log source's timezone setting arrives as .nano.source_timezone (an IANA
  # name such as "America/New_York", or any fixed offset such as "+05:30"), set
  # by nano at ingest. .nano is nano's input, never part of the log: it is
  # removed whole before anything else, whatever its shape.
  # For a clock that carries no offset a parser parses it AS UTC and sets
  # __lc_pending; the generated local-clock block that follows the parse
  # (local_clock.vrl) turns it into real UTC with this setting, and the spill
  # records the zone used as unmapped.nano_time_assumed_tz (the name, the offset
  # as +HH:MM, or "UTC" when the setting is absent, invalid or "local").
  __src_nano = del(.nano)
  __src_tz_in = ""
  if is_object(__src_nano) { __src_tz_in = strip_whitespace(to_string(object!(__src_nano).source_timezone) ?? "") }
  __src_tz = "UTC"
  __src_shift_ms = 0
  __src_tz_label = "UTC"
  __time_assumed = false
  __time_inline = false
  __lc_pending = false
  __lc_shifted = ""
  __src_off = parse_regex(__src_tz_in, r'^(?P<sign>[+-])(?P<h>\d{2}):?(?P<m>\d{2})$') ?? {}
  if !is_empty(__src_off) {
      __src_h = to_int(__src_off.h) ?? 99
      __src_m = to_int(__src_off.m) ?? 99
      if __src_h <= 14 && __src_m <= 59 {
          __src_shift_ms = (__src_h * 3600 + __src_m * 60) * 1000
          if __src_off.sign == "-" { __src_shift_ms = 0 - __src_shift_ms }
          if __src_shift_ms != 0 { __src_tz_label = string!(__src_off.sign) + string!(__src_off.h) + ":" + string!(__src_off.m) }
      }
  } else if __src_tz_in != "" && downcase(__src_tz_in) != "local" {
      # "local" (the Vector host's zone) would make the time depend on the host.
      __src_probe, __src_probe_err = parse_timestamp("2000-01-01 00:00:00", "%Y-%m-%d %H:%M:%S", timezone: __src_tz_in)
      if __src_probe_err == null { __src_tz = __src_tz_in; __src_tz_label = __src_tz_in }
  }
  # END NAN source timezone
  # Snowflake ACCOUNT_USAGE rows (LOGIN_HISTORY, QUERY_HISTORY, ACCESS_HISTORY) -> OCSF 1.9.0.
  # A string body is the usual wire form. A source that already decoded the
  # JSON hands over an object (or array) instead, and a record without any
  # `message` is the decoded event itself; never abort on either.
  raw_log = ""
  if is_string(.message) {
      raw_log = string!(.message)
  } else if is_object(.message) || is_array(.message) {
      raw_log = encode_json(.message)
  } else if exists(.message) && !is_null(.message) {
      raw_log = to_string(.message) ?? ""
  } else {
      raw_log = encode_json(.)
  }
  __raw_body = raw_log
  __source_kv = {}
  parsed, err = parse_json(raw_log)
  __source_kv = object(parsed) ?? {}

  kind = ""
  if err == null && is_object(parsed) {
      if exists(parsed.EVENT_ID) && exists(parsed.EVENT_TYPE) {
          kind = "login"
      } else if exists(parsed.QUERY_ID) && exists(parsed.QUERY_TEXT) {
          kind = "query"
      } else if exists(parsed.QUERY_ID) && (exists(parsed.DIRECT_OBJECTS_ACCESSED) || exists(parsed.BASE_OBJECTS_ACCESSED) || exists(parsed.OBJECTS_MODIFIED) || exists(parsed.OBJECT_MODIFIED_BY_DDL)) {
          kind = "access"
      }
  }

  if kind == "" {
      # Unparseable text, or a row from a view this parser does not map: an
      # OCSF Base Event with the raw row kept, never guessed into a class.
      reason = "not a JSON object"
      if err == null && is_object(parsed) { reason = "not a LOGIN_HISTORY, QUERY_HISTORY or ACCESS_HISTORY row" }
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 0,
          "activity_name": "Unknown",
          "type_uid": 0,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": 0,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": sha2("snowflake|raw|" + raw_log, variant: "SHA-256"),
              "log_level": "error",
              "log_name": "Snowflake Account Usage",
              "log_provider": "Snowflake",
              "product": { "name": "Snowflake", "vendor_name": "Snowflake" }
          },
          "unmapped": { "parse_error": reason }
      }
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      . = set!(., ["unmapped", "parse_fallback"], "unparsable input")
  } else {
      p = object!(parsed)
      user_name = string(p.USER_NAME) ?? ""
      user = { "name": "unknown" }
      if user_name != "" { user = { "name": user_name } }

      # ---- time: ISO, or Snowflake's "YYYY-MM-DD HH:MM:SS.fff +ZZZZ" ----
      ts = string(p.EVENT_TIMESTAMP) ?? ""
      if kind == "query" { ts = string(p.START_TIME) ?? "" }
      if kind == "access" { ts = string(p.QUERY_START_TIME) ?? "" }
      time_ms = 0
      t1, e1 = parse_timestamp(ts, "%+", timezone: "UTC")
      if e1 == null {
          time_ms = to_unix_timestamp(t1, unit: "milliseconds")
      } else {
          t2, e2 = parse_timestamp(ts, "%Y-%m-%d %H:%M:%S%.f %z", timezone: "UTC")
          if e2 == null {
              time_ms = to_unix_timestamp(t2, unit: "milliseconds")
          } else {
              # A trailing " Z" (UTC) or no zone at all: both are UTC.
              t3, e3 = parse_timestamp(replace(ts, r' Z$', ""), "%Y-%m-%d %H:%M:%S%.f", timezone: "UTC")
              if e3 == null { time_ms = to_unix_timestamp(t3, unit: "milliseconds") }
          }
      }

      status_id = 1
      status_str = "Success"
      severity_id = 1
      severity = "Informational"
      err_code = to_string(p.ERROR_CODE) ?? ""
      err_msg = string(p.ERROR_MESSAGE) ?? ""

      ocsf = {}
      evt_uid = ""
      event_code = ""

      if kind == "login" {
          ocsf.class_uid = 3002
          ocsf.class_name = "Authentication"
          ocsf.category_uid = 3
          ocsf.category_name = "Identity & Access Management"
          ocsf.activity_id = 1
          ocsf.activity_name = "Logon"
          ocsf.user = user
          ocsf.service = { "name": "Snowflake" }
          ocsf.is_remote = true
          # IS_SUCCESS is "YES"/"NO" in the view, but typed exports send a JSON
          # boolean or 0/1; every false spelling is a failure.
          ok_flag = downcase(to_string(p.IS_SUCCESS) ?? "")
          if includes(["no", "false", "0", "f", "n"], ok_flag) {
              status_id = 2; status_str = "Failure"; severity_id = 2; severity = "Low"
          }
          src_ip = string(p.CLIENT_IP) ?? ""
          if is_ipv4(src_ip) || is_ipv6(src_ip) { ocsf.src_endpoint = { "ip": src_ip } }

          # ---- authentication factors ----
          factors = []
          first = string(p.FIRST_AUTHENTICATION_FACTOR) ?? ""
          fu = upcase(first)
          if fu == "PASSWORD" {
              factors = push(factors, { "factor_type_id": 11, "factor_type": first })
          } else if fu == "SAML2_ASSERTION" {
              ocsf.auth_protocol_id = 5
              ocsf.auth_protocol = "SAML"
          } else if fu == "OAUTH_ACCESS_TOKEN" {
              ocsf.auth_protocol_id = 6
              ocsf.auth_protocol = "OAUTH 2.0"
          } else if first != "" {
              factors = push(factors, { "factor_type_id": 99, "factor_type": first })
          }
          second = string(p.SECOND_AUTHENTICATION_FACTOR) ?? ""
          su = upcase(second)
          if second != "" {
              ft_id = 99
              # factor_type keeps Snowflake's own factor name; the id is OCSF's.
              ft = second
              if su == "DUO_PUSH" { ft_id = 5 }
              if su == "DUO_PASSCODE" || su == "TOTP" { ft_id = 7 }
              if su == "DUO_CALL" { ft_id = 3 }
              if su == "PASSKEY" { ft_id = 10 }
              factors = push(factors, { "factor_type_id": ft_id, "factor_type": ft })
          }
          if length(factors) > 0 { ocsf.auth_factors = factors }
          ocsf.is_mfa = second != ""
          if err_code != "" { ocsf.status_code = err_code }
          if err_msg != "" { ocsf.status_detail = err_msg }
          evt_uid = to_string(p.EVENT_ID) ?? ""
          event_code = string(p.EVENT_TYPE) ?? ""
      } else if kind == "query" {
          qtype = upcase(string(p.QUERY_TYPE) ?? "")
          activity_id = 99
          activity_name = "Other"
          if qtype == "SELECT" || qtype == "UNLOAD" { activity_id = 4; activity_name = "Query" }
          if qtype == "INSERT" || qtype == "COPY" || starts_with(qtype, "PUT") || qtype == "MULTI_TABLE_INSERT" { activity_id = 5; activity_name = "Write" }
          if qtype == "UPDATE" || qtype == "MERGE" || starts_with(qtype, "ALTER") || qtype == "GRANT" || qtype == "REVOKE" { activity_id = 2; activity_name = "Update" }
          if qtype == "DELETE" || qtype == "TRUNCATE_TABLE" || starts_with(qtype, "DROP") { activity_id = 7; activity_name = "Delete" }
          if starts_with(qtype, "CREATE") { activity_id = 6; activity_name = "Create" }
          if qtype == "SHOW" || qtype == "DESCRIBE" || qtype == "LIST_FILES" { activity_id = 8; activity_name = "List" }
          ocsf.class_uid = 6005
          ocsf.class_name = "Datastore Activity"
          ocsf.category_uid = 6
          ocsf.category_name = "Application Activity"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          actor = { "user": user }
          role = string(p.ROLE_NAME) ?? ""
          if role != "" { actor.iam_role = { "name": role } }
          sess = to_string(p.SESSION_ID) ?? ""
          if sess != "" { actor.session = { "uid": sess } }
          ocsf.actor = actor
          ocsf.src_endpoint = { "hostname": "unknown" }
          db_name = string(p.DATABASE_NAME) ?? ""
          if db_name == "" { db_name = "unknown" }
          ocsf.database = { "name": db_name, "type_id": 1, "type": "Relational" }
          qtext = string(p.QUERY_TEXT) ?? ""
          # The full statement, never truncated: a parser keeps every value.
          # query_info needs a uid (OCSF at_least_one name / uid); a null or
          # absent QUERY_ID gets the fallback metadata.uid gets below.
          qinfo_uid = to_string(p.QUERY_ID) ?? ""
          if qinfo_uid == "" { qinfo_uid = sha2("snowflake|raw|" + raw_log, variant: "SHA-256") }
          qinfo = { "uid": qinfo_uid, "query_string": qtext }
          ocsf.query_info = qinfo
          exec = downcase(string(p.EXECUTION_STATUS) ?? "")
          if exec == "fail" || exec == "incident" { status_id = 2; status_str = "Failure" }
          if err_code != "" { ocsf.status_code = err_code }
          if err_msg != "" { ocsf.status_detail = err_msg }
          # to_int(null) is 0: only a present elapsed time is a duration.
          if p.TOTAL_ELAPSED_TIME != null {
              dur, dur_err = to_int(p.TOTAL_ELAPSED_TIME)
              if dur_err == null { ocsf.duration = dur }
          }
          # Privilege changes and bulk unloads (COPY INTO @stage) are Medium.
          if qtype == "GRANT" || qtype == "REVOKE" || qtype == "UNLOAD" { severity_id = 3; severity = "Medium" }
          evt_uid = to_string(p.QUERY_ID) ?? ""
          event_code = string(p.QUERY_TYPE) ?? ""
      } else {
          # ---- ACCESS_HISTORY: objects arrive as JSON text or as arrays ----
          direct = p.DIRECT_OBJECTS_ACCESSED
          if is_string(direct) { direct = parse_json(string!(direct)) ?? [] }
          base = p.BASE_OBJECTS_ACCESSED
          if is_string(base) { base = parse_json(string!(base)) ?? [] }
          modified = p.OBJECTS_MODIFIED
          if is_string(modified) { modified = parse_json(string!(modified)) ?? [] }
          ddl = p.OBJECT_MODIFIED_BY_DDL
          if is_string(ddl) { ddl = parse_json(string!(ddl)) ?? {} }
          ddl = object(ddl) ?? {}
          reads = array(direct) ?? []
          if length(reads) == 0 { reads = array(base) ?? [] }
          # A write names its target in OBJECTS_MODIFIED: that is the table or
          # stage the event is about (INSERT ... SELECT, COPY INTO either way).
          # The read sources then fill whichever of table / stage is still
          # empty; every read object stays in unmapped as written (Datastore
          # Activity has no resources list).
          objects = append(array(modified) ?? [], reads)
          n_modified = length(array(modified) ?? [])

          tbl = {}
          bucket = {}
          for_each(objects) -> |_i, item| {
              it = object(item) ?? {}
              dom = upcase(string(it.objectDomain) ?? "")
              oname = string(it.objectName) ?? ""
              if oname != "" && length(tbl) == 0 && (dom == "TABLE" || dom == "VIEW" || dom == "MATERIALIZED VIEW" || dom == "EXTERNAL TABLE" || dom == "STREAM") {
                  tbl = { "name": oname }
                  oid = to_string(it.objectId) ?? ""
                  if oid != "" { tbl.uid = oid }
              }
              if oname != "" && length(bucket) == 0 && dom == "STAGE" {
                  bucket = { "name": oname, "type_id": 99, "type": "Snowflake Stage" }
              }
          }

          ddl_domain = upcase(string(ddl.objectDomain) ?? "")
          ddl_op = upcase(string(ddl.operationType) ?? "")
          ddl_name = string(ddl.objectName) ?? ""
          activity_id = 1
          activity_name = "Read"
          if n_modified > 0 { activity_id = 5; activity_name = "Write" }

          if ddl_domain == "USER" && ddl_name != "" {
              um_id = 2
              um_name = "Update"
              if ddl_op == "CREATE" { um_id = 1; um_name = "Create" }
              if ddl_op == "DROP" { um_id = 3; um_name = "Delete" }
              ocsf.class_uid = 3007
              ocsf.class_name = "User Management"
              ocsf.category_uid = 3
              ocsf.category_name = "Identity & Access Management"
              ocsf.activity_id = um_id
              ocsf.activity_name = um_name
              subj = { "name": ddl_name }
              ddl_oid = to_string(ddl.objectId) ?? ""
              if ddl_oid != "" { subj.uid = ddl_oid }
              ocsf.user = subj
              ocsf.actor = { "user": user }
          } else {
              if ddl_op == "CREATE" { activity_id = 6; activity_name = "Create" }
              if ddl_op == "ALTER" || ddl_op == "REPLACE" { activity_id = 2; activity_name = "Update" }
              if ddl_op == "DROP" { activity_id = 7; activity_name = "Delete" }
              if ddl_name != "" && length(tbl) == 0 && (ddl_domain == "TABLE" || ddl_domain == "VIEW" || ddl_domain == "MATERIALIZED VIEW" || ddl_domain == "EXTERNAL TABLE" || ddl_domain == "STREAM") { tbl = { "name": ddl_name } }
              if ddl_name != "" && length(bucket) == 0 && ddl_domain == "STAGE" { bucket = { "name": ddl_name, "type_id": 99, "type": "Snowflake Stage" } }
              ocsf.class_uid = 6005
              ocsf.class_name = "Datastore Activity"
              ocsf.category_uid = 6
              ocsf.category_name = "Application Activity"
              ocsf.activity_id = activity_id
              ocsf.activity_name = activity_name
              ocsf.actor = { "user": user }
              ocsf.src_endpoint = { "hostname": "unknown" }
              if length(tbl) > 0 {
                  ocsf.table = tbl
                  parts = split(string!(tbl.name), ".")
                  if length(parts) == 3 { ocsf.database = { "name": parts[0], "type_id": 1, "type": "Relational" } }
              }
              if length(bucket) > 0 { ocsf.databucket = bucket }
              if length(tbl) == 0 && length(bucket) == 0 { ocsf.database = { "name": "unknown", "type_id": 1, "type": "Relational" } }
          }
          qid = to_string(p.QUERY_ID) ?? ""
          evt_uid = qid + "|access"
          event_code = "ACCESS_HISTORY"
      }

      ocsf.status_id = status_id
      ocsf.status = status_str
      ocsf.severity_id = severity_id
      ocsf.severity = severity
      ocsf.type_uid = to_int(ocsf.class_uid) * 100 + to_int(ocsf.activity_id)
      ocsf.time = time_ms
      if !exists(ocsf.src_endpoint) { ocsf.src_endpoint = { "hostname": "unknown" } }
      msg = err_msg
      if msg == "" { msg = event_code }
      if msg == "" { msg = "snowflake_event" }
      ocsf.message = msg
      ocsf.raw_data = raw_log

      if evt_uid == "" || evt_uid == "|access" { evt_uid = sha2("snowflake|raw|" + raw_log, variant: "SHA-256") }
      md = {
          "version": "1.9.0",
          "uid": evt_uid,
          "log_name": "Snowflake Account Usage",
          "log_provider": "Snowflake",
          "product": { "name": "Snowflake", "vendor_name": "Snowflake" }
      }
      if event_code != "" { md.event_code = event_code }
      if kind != "login" {
          qid = to_string(p.QUERY_ID) ?? ""
          if qid != "" { md.correlation_uid = qid }
      }
      ocsf.metadata = md

      . = ocsf
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # Values spill exactly as parsed: a parser never masks, redacts or withholds
  # anything (masking is an opt-in pipeline step, never a parser concern).
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # A source field is consumed ONLY by an explicit mapping: a field-coverage.yaml
  # `mappings` entry (source key -> target paths) or a `transforms` rule with a
  # target, whose value is found AT THAT TARGET PATH of the selected branch. A
  # value that merely appears somewhere else in the event never consumes a field
  # (no coincidental consumption); everything else spills.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The sets below are strings instead
  # (a read shares the buffer). __repr holds one member per mapped leaf:
  # "," + encode_json(path) + "=" + encode_json(encode_json(value)), plus the
  # to_string form for a string or a float, so a numeric string is represented by
  # its typed scalar. Every part is a JSON text, inside which a '"' is always
  # escaped, so a member is matched exactly. Paths drop array indices
  # (resources.0.uid is resources.uid); arrays are walked two levels deep, and a
  # leaf deeper than that is simply not mapping evidence (it can only spill more).
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped = object!(parse_json!(encode_json(__mapped)))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __copy = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __repr = ""
  for_each(flatten(__mapped)) -> |path, value| {
      __p = encode_json(path)
      if is_array(value) {
          for_each(array!(value)) -> |_i, item| {
              if is_object(item) {
                  for_each(flatten(object!(item))) -> |sub, leaf| {
                      __q = encode_json(path + "." + sub)
                      if is_array(leaf) {
                          for_each(array!(leaf)) -> |_j, x| {
                              if !is_object(x) && !is_array(x) {
                                  __repr = __repr + ("," + __q + "=" + encode_json(encode_json(x)))
                                  if is_string(x) || is_float(x) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(x))) }
                              }
                          }
                      } else {
                          __repr = __repr + ("," + __q + "=" + encode_json(encode_json(leaf)))
                          if is_string(leaf) || is_float(leaf) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(leaf))) }
                      }
                  }
              } else if !is_array(item) {
                  __repr = __repr + ("," + __p + "=" + encode_json(encode_json(item)))
                  if is_string(item) || is_float(item) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(item))) }
              }
          }
      } else {
          __repr = __repr + ("," + __p + "=" + encode_json(encode_json(value)))
          if is_string(value) || is_float(value) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(value))) }
      }
  }
  __consumed = ""
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__copy.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # BEGIN parser-specific transformations
  # FIRST_AUTHENTICATION_FACTOR: SAML and OAuth first factors are the authentication protocol.
  for_each(__flat) -> |key, value| {
      if match(key, r'(?x)
      \A(?:
        FIRST_AUTHENTICATION_FACTOR
      )\z') {
          __value = value
          if __value != null {
              __expected = get!({"saml2_assertion": "SAML", "oauth_access_token": "OAUTH 2.0"}, [downcase(to_string(__value) ?? "")])
              if __expected != null {
                  if contains(__repr, "," + "\"auth_protocol\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
              }
          }
      }
  }
  # Declared source -> target mappings (field-coverage.yaml `mappings`).
  __decl = "\n\"CLIENT_IP\"\t[\"src_endpoint.ip\"]\n\"ERROR_CODE\"\t[\"status_code\"]\n\"ERROR_MESSAGE\"\t[\"message\",\"status_detail\"]\n\"EVENT_ID\"\t[\"metadata.uid\"]\n\"EVENT_TYPE\"\t[\"message\",\"metadata.event_code\"]\n\"FIRST_AUTHENTICATION_FACTOR\"\t[\"auth_factors.factor_type\"]\n\"SECOND_AUTHENTICATION_FACTOR\"\t[\"auth_factors.factor_type\"]\n\"USER_NAME\"\t[\"actor.user.name\",\"user.name\"]\n\"DATABASE_NAME\"\t[\"database.name\"]\n\"QUERY_ID\"\t[\"metadata.correlation_uid\",\"metadata.uid\",\"query_info.uid\"]\n\"QUERY_TEXT\"\t[\"query_info.query_string\"]\n\"QUERY_TYPE\"\t[\"message\",\"metadata.event_code\"]\n\"ROLE_NAME\"\t[\"actor.iam_role.name\"]\n\"SESSION_ID\"\t[\"actor.session.uid\"]\n\"TOTAL_ELAPSED_TIME\"\t[\"duration\"]\n\"OBJECT_MODIFIED_BY_DDL.objectName\"\t[\"databucket.name\"]\n"
  __preserve = []
  # END parser-specific transformations
  # Declared mappings: __decl holds "\n" + encode_json(key) + "\t" + JSON array of
  # target paths + "\n" per mapped source key (a raw newline never occurs in
  # compact JSON). A key is consumed when its value, or every element of a scalar
  # array, is at one of its own targets. Keys stay ESCAPED here and in __consumed:
  # a literal dotted key ("a~1b") and the nested path ("a.b") are different
  # fields, and mapping one never consumes the other.
  for_each(__flat) -> |key, value| {
      # __decl spells a bracket inside a key as a \u escape (deploy bracket count).
      __kt = encode_json(key)
      if match(__kt, r'[\x28\x29\x5B\x5D\x7B\x7D]') {
          __kt = replace(replace(replace(replace(replace(replace(__kt, r'\x28', "\\u0028"), r'\x29', "\\u0029"), r'\x5B', "\\u005b"), r'\x5D', "\\u005d"), r'\x7B', "\\u007b"), r'\x7D', "\\u007d")
      }
      __at = find(__decl, "\n" + __kt + "\t")
      if is_integer(__at) && !is_object(value) {
          __rest = slice!(__decl, int!(__at) + strlen(__kt) + 2)
          __hit = false
          for_each(array!(parse_json!(slice!(__rest, 0, int!(find(__rest, "\n")))))) -> |_i, target| {
              __tok = "," + encode_json(target) + "="
              if !__hit && is_array(value) {
                  __all = !is_empty(array!(value))
                  for_each(array!(value)) -> |_j, item| {
                      if __all {
                          __all = !is_object(item) && !is_array(item) && (contains(__repr, __tok + encode_json(encode_json(item))) || ((is_string(item) || is_float(item)) && contains(__repr, __tok + encode_json(to_string!(item)))))
                      }
                  }
                  __hit = __all
              } else if !__hit {
                  __hit = contains(__repr, __tok + encode_json(encode_json(value))) || ((is_string(value) || is_float(value)) && contains(__repr, __tok + encode_json(to_string!(value))))
              }
          }
          if __hit { __consumed = __consumed + ("," + encode_json(key)) }
      }
  }
  # Fast path: when no two source keys decode to the same key and no two spilled
  # keys get the same name, each key's decision depends only on its own value, so
  # one filter and one rename build the residual without copying it per key.
  __distinct = true
  if __tilde {
      __distinct = length(map_keys(__flat) -> |key| { replace(replace(key, "~1", "."), "~0", "~") }) == length(__flat)
  }
  __kept = {}
  __names = {}
  if __distinct {
      __kept = filter(__flat) -> |key, value| {
          # A key is kept unless an explicit mapping or transformation consumed it.
          # Do not spill a copy of the raw body.
          value != __raw_body && !contains(__consumed, "," + encode_json(key))
      }
      __names = map_keys(__kept) -> |key| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          join!(__parts, ".")
      }
  }
  __residual = {}
  if __distinct && length(__names) == length(__kept) {
      __residual = map_values(__names) -> |value| {
          if is_array(value) || is_object(value) {
              if __tilde {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              if __complex { value = encode_json(value) }
          }
          value
      }
  } else {
      # Slow path, in source key order: a name already taken gets the next free
      # _2, _3, ... suffix.
      for_each(__flat) -> |key, value| {
          __token = "," + encode_json(key)
          key = replace(replace(key, "~1", "."), "~0", "~")
          if is_array(value) || is_object(value) {
              value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                  replace(replace(inner, "~1", "."), "~0", "~")
              }, ["v"])
          }
          if !contains(__consumed, __token) && value != __raw_body {
              __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
              __base = join!(__parts, ".")
              __key = __base
              __suffix = 2
              if includes(keys(__residual), __key) {
                  for_each(__flat) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __key) {
                          __key = __base + "_" + to_string(__suffix)
                          __suffix = __suffix + 1
                      }
                  }
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              __spill = if __complex { encode_json(value) } else { value }
              __residual = set!(__residual, [__key], __spill)
          }
      }
  }
  # Names nano owns in unmapped (the parser markers and the reserved nano.*
  # namespace) are never taken by a source field: a vendor key with such a name
  # is kept, renamed source_<name>, so a log cannot forge a marker.
  if match(encode_json(keys(__residual)), r'"nano(?:"|\.|_time_assumed_tz"|_time_source"|_operational")') {
      for_each(object!(__residual)) -> |key, value| {
          if includes(["nano", "nano_time_assumed_tz", "nano_time_source", "nano_operational"], key) || starts_with(key, "nano.") {
              # source_<name>, or the next free _2, _3, ... when a vendor key
              # already holds that name: nothing is lost.
              __rk = "source_" + key
              __rn = 2
              if includes(keys(__residual), __rk) {
                  for_each(__residual) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __rk) {
                          __rk = "source_" + key + "_" + to_string(__rn)
                          __rn = __rn + 1
                      }
                  }
              }
              __residual = remove!(__residual, [key])
              __residual = set!(__residual, [__rk], value)
          }
      }
  }
  # Keep existing derived evidence, but remove null placeholders and copies of a
  # source value (that value is mapped or spilled above under its source path).
  # A value merely equal to some mapped attribute is kept: equality with an
  # unrelated attribute is no evidence that it is represented.
  # The canonical source spill above is the authoritative representation of
  # containers. The cheap conditions run first; the source value set is built on
  # first use.
  __original_values = null
  for_each(flatten(__existing)) -> |key, value| {
      if !is_null(value) && value != "" && !is_array(value) && !is_object(value) && value != __raw_body {
          # Members for the value itself and for to_string(value), as above.
          __json = encode_json(value)
          __as_json = "," + encode_json(__json)
          __as_string = __as_json
          if is_string(value) { __as_string = "," + __json } else if is_float(value) { __as_string = "," + encode_json(to_string!(value)) }
          if __original_values == null {
              # __source_kv may hold non-JSON types (a timestamp), so only an
              # integer or a boolean skips its to_string member here.
              __original_values = join!(map_values(values(flatten(__source_kv))) -> |source_value| {
                  __source_json = encode_json(source_value)
                  __tokens = "," + encode_json(__source_json)
                  if is_string(source_value) {
                      __tokens = __tokens + "," + __source_json
                  } else if !is_object(source_value) && !is_array(source_value) && !is_integer(source_value) && !is_boolean(source_value) {
                      __tokens = __tokens + "," + encode_json(to_string(source_value) ?? "")
                  }
                  __tokens
              }, "")
          }
          __source_set = string!(__original_values)
          __keep = !contains(__source_set, __as_json) && !contains(__source_set, __as_string)
          # Only text opening an object or an array (after JSON whitespace)
          # decodes to a container.
          if __keep && is_string(value) && match(string!(value), r'^[ \t\n\r]*[\x5B\x7B]') {
              __decoded, __decode_err = parse_json(string!(value))
              __keep = !(__decode_err == null && (is_object(__decoded) || is_array(__decoded)))
          }
          if __keep {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, as-is. These
  # entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__copy.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  if __time_assumed && !__time_inline { __residual = set!(__residual, ["nano_time_assumed_tz"], __src_tz_label) }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

