name: carbon_black_ocsf
display_name: VMware Carbon Black (OCSF)
version: "1.1.0"
description: >
  Preserves unconsumed parsed fields in redacted, dotted snake_case unmapped keys.
  Parses VMware Carbon Black Cloud / EDR JSON into complete OCSF 1.9.0
  records, routed by payload shape:
    CB_ANALYTICS / WATCHLIST / DEVICE_CONTROL alerts -> Detection Finding 2004 (Create)
    watchlist.* report hits                          -> Detection Finding 2004 (Create)
    process telemetry (process_guid, no alert)       -> Process Activity 1007 (Launch)
  On findings the detected process is the ACTOR (keeping actor.process.* queryable)
  and is repeated in evidences[]. Carries metadata.profiles ["host"] (plus
  "security_control" on findings, which is what disposition/action are bound to).
  The OCSF counterpart of parsers/carbon_black - deploy one or the other.
ocsf_version: "1.9.0"
match_values:
  - carbon_black
category: endpoint
vendor: "VMware"
product: "Carbon Black"
parser_vrl: |
  # VMware Carbon Black Cloud / EDR JSON -> OCSF 1.9.0.
  # Emits the COMPLETE OCSF record on the root.
  #
  #   alerts (type CB_ANALYTICS | WATCHLIST | DEVICE_CONTROL, or alert_url present)
  #                              -> Detection Finding 2004 (Create)
  #   watchlist.* hits           -> Detection Finding 2004 (Create)
  #   process telemetry          -> Process Activity 1007 (Launch)
  #   anything else / unparsable -> Process Activity 1007 (Other)
  raw_log = string!(.message)
  parsed, err = parse_json(raw_log)
  __source_kv = object(parsed) ?? {}
  __raw_body = raw_log

  if err != null || !is_object(parsed) {
      . = {
          "class_uid": 1007,
          "class_name": "Process Activity",
          "category_uid": 1,
          "category_name": "System Activity",
          "activity_id": 99,
          "activity_name": "Other",
          "type_uid": 100799,
          "severity_id": 1,
          "severity": "Informational",
          "time": 0,
          "raw_data": raw_log,
          # 1007 requires actor/device/process even on the unparseable path.
          "process": { "pid": 0 },
          "actor": { "process": { "pid": 0 } },
          "device": { "hostname": "", "type_id": 0 },
          "metadata": {
              "version": "1.9.0",
              "profiles": ["host"],
              "uid": uuid_v4(),
              "log_level": "error",
              "log_source": "carbon_black",
              "product": { "name": "Carbon Black", "vendor_name": "VMware" }
          }
      }
  } else {
      p = object!(parsed)

      cb_type = to_string(p.type) ?? ""
      is_alert_shape = cb_type == "CB_ANALYTICS" || cb_type == "WATCHLIST" || cb_type == "DEVICE_CONTROL" || exists(p.alert_url)
      is_watchlist_hit = starts_with(cb_type, "watchlist.")

      # ---- time: alerts use backend/first_event_timestamp, telemetry create_time
      time_ms = 0
      ts_str = ""
      if exists(p.backend_timestamp) { ts_str = to_string(p.backend_timestamp) ?? "" }
      if ts_str == "" && exists(p.first_event_timestamp) { ts_str = to_string(p.first_event_timestamp) ?? "" }
      if ts_str == "" && exists(p.create_time) { ts_str = to_string(p.create_time) ?? "" }
      if ts_str != "" {
          t, terr = parse_timestamp(ts_str, "%+")
          if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
      }

      device_hostname = downcase(to_string(p.device_name) ?? "")
      device_ip = downcase(to_string(p.device_internal_ip) ?? "")
      device = { "hostname": device_hostname, "type_id": 0 }
      if device_ip != "" { device.ip = device_ip }

      # ---- the acting (detected) process -------------------------------
      # NOTE: to_string(<missing>) yields "" (it does not error), so `??` never
      # falls through — every fallback below has to be an explicit empty check.
      proc_path = to_string(p.process_path) ?? ""
      if proc_path == "" { proc_path = to_string(p.process_name) ?? "" }
      proc_name = ""
      pnm, pnmerr = parse_regex(proc_path, r'(?P<b>[^\\/]+)$')
      if pnmerr == null { proc_name = string(pnm.b) ?? "" }
      if proc_name == "" { proc_name = to_string(p.process_name) ?? "" }
      proc_sha = downcase(to_string(p.process_sha256) ?? "")

      proc_file = { "name": proc_name, "path": proc_path, "type_id": 1 }
      if proc_sha != "" { proc_file.hashes = [{ "algorithm_id": 3, "value": proc_sha }] }

      detected_process = {
          "name": proc_name,
          "cmd_line": to_string(p.process_cmdline) ?? "",
          "pid": to_int(p.process_pid) ?? 0,
          "uid": to_string(p.process_guid) ?? "",
          "file": proc_file
      }

      # ---- the parent process ------------------------------------------
      parent_path = to_string(p.parent_path) ?? ""
      if parent_path == "" { parent_path = to_string(p.parent_name) ?? "" }
      parent_name = ""
      qnm, qnmerr = parse_regex(parent_path, r'(?P<b>[^\\/]+)$')
      if qnmerr == null { parent_name = string(qnm.b) ?? "" }
      if parent_name == "" { parent_name = to_string(p.parent_name) ?? "" }
      parent_sha = downcase(to_string(p.parent_sha256) ?? "")
      parent_file = { "name": parent_name, "path": parent_path, "type_id": 1 }
      if parent_sha != "" { parent_file.hashes = [{ "algorithm_id": 3, "value": parent_sha }] }
      parent_process = {
          "name": parent_name,
          "cmd_line": to_string(p.parent_cmdline) ?? "",
          "pid": to_int(p.parent_pid) ?? 0,
          "uid": to_string(p.parent_guid) ?? "",
          "file": parent_file
      }
      has_parent = parent_path != "" || (to_string(p.parent_cmdline) ?? "") != ""

      user_name = downcase(to_string(p.device_username) ?? "")
      if user_name == "" { user_name = downcase(to_string(p.process_username) ?? "") }

      # ---- severity: Carbon Black scores 1-10 --------------------------
      sev_raw = to_int(p.severity) ?? 0
      if sev_raw == 0 { sev_raw = to_int(p.report.severity) ?? 0 }
      severity_id = 1
      severity = "Informational"
      risk_level_id = 0
      risk_level = "Info"
      if sev_raw >= 8 {
          severity_id = 5; severity = "Critical"; risk_level_id = 4; risk_level = "Critical"
      } else if sev_raw >= 6 {
          severity_id = 4; severity = "High"; risk_level_id = 3; risk_level = "High"
      } else if sev_raw >= 4 {
          severity_id = 3; severity = "Medium"; risk_level_id = 2; risk_level = "Medium"
      } else if sev_raw >= 1 {
          severity_id = 2; severity = "Low"; risk_level_id = 1; risk_level = "Low"
      }

      # ---- MITRE technique ids out of ttps[] / report.tags[] -----------
      mitre_ids = []
      ttp_source = []
      if is_array(p.ttps) { ttp_source = array(p.ttps) ?? [] }
      report_tags = []
      if is_array(p.report.tags) { report_tags = array(p.report.tags) ?? [] }
      for_each(report_tags) -> |_i, tag| { ttp_source = push(ttp_source, tag) }
      for_each(ttp_source) -> |_i, ttp| {
          ttp_str = to_string(ttp) ?? ""
          m, merr = parse_regex(ttp_str, r'(?P<tid>[tT]\d{4}(?:\.\d{3})?)')
          if merr == null { mitre_ids = push(mitre_ids, upcase(string(m.tid) ?? "")) }
      }
      mitre_ids = unique(mitre_ids)

      # ---- defaults; overridden per branch below ----
      class_uid = 1007
      class_name = "Process Activity"
      category_uid = 1
      category_name = "System Activity"
      activity_id = 99
      activity_name = "Other"

      ocsf = {}

      if is_alert_shape || is_watchlist_hit {
          # ---- Detection Finding 2004 ----------------------------------
          # The alert itself is the subject; the detected process is the ACTOR
          # (it is what did the thing that tripped the detection), which also
          # keeps process/file/hash queryable via the promoted actor.process.*
          # paths. The same artifacts are repeated in evidences[] for fidelity.
          class_uid = 2004
          class_name = "Detection Finding"
          category_uid = 2
          category_name = "Findings"
          activity_id = 1
          activity_name = "Create"

          rule_name = to_string(p.report_name) ?? ""
          if rule_name == "" { rule_name = to_string(p.report.name) ?? "" }
          rule_id = to_string(p.report_id) ?? ""
          if rule_id == "" { rule_id = to_string(p.report.id) ?? "" }
          finding_uid = to_string(p.id) ?? ""
          if finding_uid == "" { finding_uid = to_string(p.threat_id) ?? "" }
          if finding_uid == "" { finding_uid = uuid_v4() }

          title = to_string(p.reason) ?? ""
          if title == "" { title = rule_name }
          if title == "" { title = cb_type }

          finding_info = {
              "uid": finding_uid,
              "title": title,
              "types": [cb_type],
              "data_sources": ["carbon_black"]
          }
          if rule_name != "" || rule_id != "" {
              # WATCHLIST/watchlist.* hits are report-rule driven; CB_ANALYTICS is
              # Carbon Black's behavioural analytics engine.
              analytic_type_id = 1
              analytic_type = "Rule"
              if cb_type == "CB_ANALYTICS" { analytic_type_id = 2; analytic_type = "Behavioral" }
              finding_info.analytic = {
                  "name": rule_name,
                  "uid": rule_id,
                  "type_id": analytic_type_id,
                  "type": analytic_type
              }
          }
          ocsf.finding_info = finding_info
          ocsf.is_alert = true
          ocsf.risk_score = sev_raw * 10
          ocsf.risk_level_id = risk_level_id
          ocsf.risk_level = risk_level

          ocsf.actor = { "process": detected_process, "user": { "name": user_name } }
          ocsf.device = device

          evidence = { "process": detected_process }
          if has_parent { evidence.actor = { "process": parent_process } }
          if device_hostname != "" { evidence.device = device }
          ocsf.evidences = [evidence]

          # sensor_action -> security_control disposition/action
          sensor_action = upcase(to_string(p.sensor_action) ?? "")
          disposition_id = 15
          disposition = "Detected"
          action_id = 3
          action = "Observed"
          if sensor_action == "DENY" || sensor_action == "BLOCK" { disposition_id = 2; disposition = "Blocked"; action_id = 2; action = "Denied" }
          if sensor_action == "TERMINATE" || sensor_action == "TERMINATE_PROCESS" { disposition_id = 2; disposition = "Blocked"; action_id = 2; action = "Denied" }
          if sensor_action == "QUARANTINE" { disposition_id = 3; disposition = "Quarantined"; action_id = 2; action = "Denied" }
          if sensor_action == "DELETE" { disposition_id = 5; disposition = "Deleted"; action_id = 2; action = "Denied" }
          if sensor_action == "ALLOW" { disposition_id = 1; disposition = "Allowed"; action_id = 1; action = "Allowed" }
          ocsf.disposition_id = disposition_id
          ocsf.disposition = disposition
          ocsf.action_id = action_id
          ocsf.action = action

          # workflow.state -> the FINDING's lifecycle status (2004 status_id is
          # New/In Progress/Resolved, NOT Success/Failure).
          wf_state = upcase(to_string(p.workflow.state) ?? "")
          status_id = 1
          status = "New"
          if wf_state == "IN_PROGRESS" { status_id = 2; status = "In Progress" }
          if wf_state == "CLOSED" || wf_state == "RESOLVED" { status_id = 4; status = "Resolved" }
          if wf_state == "DISMISSED" { status_id = 3; status = "Suppressed" }
          ocsf.status_id = status_id
          ocsf.status = status
          status_detail = to_string(p.reason_code) ?? ""
          if status_detail != "" { ocsf.status_detail = status_detail }

          if length(mitre_ids) > 0 {
              attacks = []
              for_each(mitre_ids) -> |_i, tid| {
                  attacks = push(attacks, { "technique": { "uid": tid } })
              }
              ocsf.attacks = attacks
          }

          watchlists_raw = null
          if is_array(p.watchlists) { watchlists_raw = p.watchlists }
          ocsf.unmapped = {
              "cb_type": cb_type,
              "org_key": to_string(p.org_key) ?? null,
              "device_id": to_string(p.device_id) ?? null,
              "device_os": to_string(p.device_os) ?? null,
              "device_os_version": to_string(p.device_os_version) ?? null,
              "device_location": to_string(p.device_location) ?? null,
              "device_external_ip": to_string(p.device_external_ip) ?? null,
              "policy_name": to_string(p.policy_name) ?? null,
              "policy_id": to_string(p.policy_id) ?? null,
              "threat_id": to_string(p.threat_id) ?? null,
              "ioc_id": to_string(p.ioc_id) ?? null,
              "ioc_hit": to_string(p.ioc_hit) ?? null,
              "alert_url": to_string(p.alert_url) ?? null,
              "run_state": to_string(p.run_state) ?? null,
              "target_value": to_string(p.target_value) ?? null,
              "sensor_action": to_string(p.sensor_action) ?? null,
              "remediation": to_string(p.workflow.remediation) ?? null,
              "ml_verdict": to_string(p.ml_classification_final_verdict) ?? null,
              "ml_prevalence": to_string(p.ml_classification_global_prevalence) ?? null,
              "severity_score": sev_raw,
              "watchlists": watchlists_raw
          }
      } else {
          # ---- Process telemetry -> Process Activity 1007 --------------
          class_uid = 1007
          class_name = "Process Activity"
          category_uid = 1
          category_name = "System Activity"
          if exists(p.process_guid) {
              activity_id = 1
              activity_name = "Launch"
          } else {
              activity_id = 99
              activity_name = "Other"
          }
          # On a process-create the NEW process is `process`; its launcher is
          # `actor.process`. Carbon Black only carries the immediate parent.
          ocsf.process = detected_process
          actor_process = if has_parent { parent_process } else { detected_process }
          ocsf.actor = { "process": actor_process, "user": { "name": user_name } }
          ocsf.device = device
          ocsf.status_id = 1
          ocsf.status = "Success"
          ocsf.unmapped = {
              "cb_type": cb_type,
              "org_key": to_string(p.org_key) ?? null,
              "device_id": to_string(p.device_id) ?? null,
              "device_os": to_string(p.device_os) ?? null,
              "device_external_ip": to_string(p.device_external_ip) ?? null
          }
      }

      # ---- common envelope ---------------------------------------------
      ocsf.class_uid = class_uid
      ocsf.class_name = class_name
      ocsf.category_uid = category_uid
      ocsf.category_name = category_name
      ocsf.activity_id = activity_id
      ocsf.activity_name = activity_name
      ocsf.type_uid = class_uid * 100 + activity_id
      ocsf.severity_id = severity_id
      ocsf.severity = severity
      ocsf.time = time_ms
      ocsf.raw_data = raw_log

      record_uid = to_string(p.id) ?? ""
      if record_uid == "" { record_uid = to_string(p.process_guid) ?? "" }
      if record_uid == "" { record_uid = uuid_v4() }

      profiles = ["host"]
      if class_uid == 2004 { profiles = ["host", "security_control"] }
      ocsf.metadata = {
          "version": "1.9.0",
          "profiles": profiles,
          "uid": record_uid,
          "original_event_uid": record_uid,
          "event_code": cb_type,
          "log_source": "carbon_black",
          "product": { "name": "Carbon Black", "vendor_name": "VMware" }
      }

      . = ocsf
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # Exact value representation is evaluated AFTER branch selection. Numeric strings
  # count as represented by their typed scalar; other transformations are explicit.
  __mapped = object!(parse_json!(encode_json(.)))
  __existing = object(__mapped.unmapped) ?? {}
  __discard = del(__mapped.raw_data)
  __discard = del(__mapped.unmapped)
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __represented = []
  __walk = map_values(__mapped, recursive: true) -> |value| {
      __represented = push(__represented, encode_json(value))
      if !is_object(value) && !is_array(value) && !is_null(value) {
          __represented = push(__represented, to_string(value) ?? "")
      }
      value
  }
  __consumed = []
  # BEGIN parser-specific transformations
  # device_name: Parser lowercases this hostname, address, identity or hash; consume only if the normalized value is emitted.
  # device_internal_ip: Parser lowercases this hostname, address, identity or hash; consume only if the normalized value is emitted.
  # process_sha256: Parser lowercases this hostname, address, identity or hash; consume only if the normalized value is emitted.
  # parent_sha256: Parser lowercases this hostname, address, identity or hash; consume only if the normalized value is emitted.
  # device_username: Parser lowercases this hostname, address, identity or hash; consume only if the normalized value is emitted.
  # process_username: Parser lowercases this hostname, address, identity or hash; consume only if the normalized value is emitted.
  # backend_timestamp: ISO clock converted to epoch milliseconds; only the selected successful clock is consumed.
  # first_event_timestamp: ISO clock converted to epoch milliseconds; only the selected successful clock is consumed.
  # create_time: ISO clock converted to epoch milliseconds; only the selected successful clock is consumed.
  # sensor_action: Finding branch translates sensor enforcement into disposition.
  # workflow.state: Finding branch normalizes workflow lifecycle status.
  # severity: Vendor severity is normalized to the OCSF severity enumeration.
  # report.severity: Vendor severity is normalized to the OCSF severity enumeration.
  # Only source keys read by this parser are eligible for exact-value consumption; the selected branch must emit the value. Unknown keys always spill, even when their value equals an OCSF default.
  __candidates = ["alert_url", "backend_timestamp", "create_time", "device_external_ip", "device_id", "device_internal_ip", "device_location", "device_name", "device_os", "device_os_version", "device_username", "first_event_timestamp", "id", "ioc_hit", "ioc_id", "ml_classification_final_verdict", "ml_classification_global_prevalence", "org_key", "parent_cmdline", "parent_guid", "parent_name", "parent_path", "parent_pid", "parent_sha256", "policy_id", "policy_name", "process_cmdline", "process_guid", "process_name", "process_path", "process_pid", "process_sha256", "process_username", "reason", "reason_code", "report.id", "report.name", "report.severity", "report.tags", "report_id", "report_name", "run_state", "sensor_action", "severity", "target_value", "threat_id", "ttps", "type", "watchlists", "workflow.remediation", "workflow.state"]
  __preserve = []
  __rules = array!(parse_json!("[{\"source\":\"device_name\",\"kind\":\"lowercase\",\"reason\":\"Parser lowercases this hostname, address, identity or hash; consume only if the normalized value is emitted.\"},{\"source\":\"device_internal_ip\",\"kind\":\"lowercase\",\"reason\":\"Parser lowercases this hostname, address, identity or hash; consume only if the normalized value is emitted.\"},{\"source\":\"process_sha256\",\"kind\":\"lowercase\",\"reason\":\"Parser lowercases this hostname, address, identity or hash; consume only if the normalized value is emitted.\"},{\"source\":\"parent_sha256\",\"kind\":\"lowercase\",\"reason\":\"Parser lowercases this hostname, address, identity or hash; consume only if the normalized value is emitted.\"},{\"source\":\"device_username\",\"kind\":\"lowercase\",\"reason\":\"Parser lowercases this hostname, address, identity or hash; consume only if the normalized value is emitted.\"},{\"source\":\"process_username\",\"kind\":\"lowercase\",\"reason\":\"Parser lowercases this hostname, address, identity or hash; consume only if the normalized value is emitted.\"},{\"source\":\"backend_timestamp\",\"kind\":\"epoch_ms\",\"target\":\"time\",\"reason\":\"ISO clock converted to epoch milliseconds; only the selected successful clock is consumed.\"},{\"source\":\"first_event_timestamp\",\"kind\":\"epoch_ms\",\"target\":\"time\",\"reason\":\"ISO clock converted to epoch milliseconds; only the selected successful clock is consumed.\"},{\"source\":\"create_time\",\"kind\":\"epoch_ms\",\"target\":\"time\",\"reason\":\"ISO clock converted to epoch milliseconds; only the selected successful clock is consumed.\"},{\"source\":\"sensor_action\",\"target\":\"disposition_id\",\"kind\":\"enum\",\"values\":{\"deny\":2,\"block\":2,\"terminate\":2,\"terminate_process\":2,\"quarantine\":3,\"delete\":5,\"allow\":1},\"reason\":\"Finding branch translates sensor enforcement into disposition.\"},{\"source\":\"workflow.state\",\"target\":\"status_id\",\"kind\":\"enum\",\"values\":{\"open\":1,\"new\":1,\"in_progress\":2,\"closed\":4,\"resolved\":4,\"dismissed\":3},\"reason\":\"Finding branch normalizes workflow lifecycle status.\"},{\"source\":\"severity\",\"target\":\"severity_id\",\"kind\":\"enum\",\"values\":{\"0\":1,\"1\":2,\"2\":2,\"3\":2,\"4\":3,\"5\":3,\"6\":4,\"7\":4,\"8\":5,\"9\":5,\"10\":5},\"reason\":\"Vendor severity is normalized to the OCSF severity enumeration.\"},{\"source\":\"report.severity\",\"target\":\"severity_id\",\"kind\":\"enum\",\"values\":{\"0\":1,\"1\":2,\"2\":2,\"3\":2,\"4\":3,\"5\":3,\"6\":4,\"7\":4,\"8\":5,\"9\":5,\"10\":5},\"reason\":\"Vendor severity is normalized to the OCSF severity enumeration.\"}]"))
  __source_flat = flatten(__source_kv)
  for_each(__rules) -> |_index, rule| {
      __source_key = string!(rule.source)
      __value = get!(__source_flat, [__source_key])
      __expected = null
      __valid = false
      if rule.kind == "lowercase" && is_string(__value) {
          __expected = downcase(string!(__value))
          __valid = true
      } else if rule.kind == "epoch_ms" {
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", string(rule.format) ?? "%+")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              __valid = true
          }
      } else if rule.kind == "scale" {
          __number, __number_err = to_float(__value)
          if __number_err == null && __value != null && !is_boolean(__value) {
              __expected = to_int(__number * to_float!(rule.factor))
              __valid = true
          }
      } else if rule.kind == "hex" {
          __hex = replace(downcase(string(__value) ?? ""), r'^0x', "")
          __integer, __integer_err = parse_int(__hex, base: 16)
          __expected = __integer
          __valid = is_string(__value) && starts_with(downcase(string(__value) ?? ""), "0x") && __integer_err == null
      } else if rule.kind == "enum" {
          __expected = get!(object!(rule.values), [downcase(to_string(__value) ?? "")])
          __valid = __expected != null
      }
      __matches = includes(__represented, encode_json(__expected))
      if is_string(rule.target) { __matches = get!(., split(string!(rule.target), ".")) == __expected }
      if __valid && __matches { __consumed = push(__consumed, __source_key) }
  }
  # END parser-specific transformations
  # Redact at every depth, including objects inside arrays, before serialization.
  __safe = map_values(object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing}))), recursive: true) -> |value| {
      if is_object(value) {
          # Header/parameter arrays commonly encode sensitive keys as name/value
          # or Key/Value objects instead of using the secret name as an object key.
          __sensitive_pair = false
          for_each(object!(value)) -> |key, child| {
              if includes(["name", "key"], downcase(key)) && match(downcase(string(child) ?? ""), r'password|secret|authorization|token') {
                  __sensitive_pair = true
              }
          }
          for_each(object!(value)) -> |key, _child| {
              if match(downcase(key), r'password|secret|authorization|token') || (__sensitive_pair && includes(["value", "values"], downcase(key))) {
                  value = set!(value, [key], "<redacted>")
              }
          }
      }
      value
  }
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  __escaped = map_keys(object!(__safe.source), recursive: true) -> |key| {
      replace(replace(key, "~", "~0"), ".", "~1")
  }
  __flat = flatten(__escaped)
  __residual = {}
  for_each(__flat) -> |key, value| {
      key = replace(replace(key, "~1", "."), "~0", "~")
      __same = includes(__represented, encode_json(value))
      if !is_object(value) && !is_array(value) && !is_null(value) {
          __same = __same || includes(__represented, to_string(value) ?? "")
      }
      # A scalar array is consumed only if every element is represented. Preserve
      # partially represented arrays intact, including their ordering and repeats.
      if is_array(value) && !is_empty(array!(value)) {
          __all_items = true
          for_each(array!(value)) -> |_index, item| {
              __item_same = includes(__represented, encode_json(item))
              if !is_object(item) && !is_array(item) && !is_null(item) {
                  __item_same = __item_same || includes(__represented, to_string(item) ?? "")
              }
              if is_object(item) || is_array(item) || !__item_same { __all_items = false }
          }
          __same = __same || __all_items
      }
      if __same && includes(__candidates, key) { __consumed = push(__consumed, key) }
      # Redacted leaves always remain visible. Do not spill a copy of the raw body.
      if (!includes(__consumed, key) || value == "<redacted>") && value != __raw_body {
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          __base = join!(__parts, ".")
          __key = __base
          __suffix = 2
          if includes(keys(__residual), __key) {
              for_each(__flat) -> |_other_key, _other_value| {
                  if includes(keys(__residual), __key) {
                      __key = __base + "_" + to_string(__suffix)
                      __suffix = __suffix + 1
                  }
              }
          }
          __complex = is_object(value)
          if is_array(value) {
              for_each(array!(value)) -> |_index, item| {
                  if is_object(item) || is_array(item) { __complex = true }
              }
          }
          __spill = if __complex { encode_json(value) } else { value }
          __residual = set!(__residual, [__key], __spill)
      }
  }
  # Keep existing derived evidence, but remove null placeholders and mapped copies.
  # Source-derived aliases are replaced by canonical dotted source paths above.
  __original_values = []
  for_each(flatten(__source_kv)) -> |_key, value| {
      __original_values = push(__original_values, encode_json(value))
      if !is_object(value) && !is_array(value) { __original_values = push(__original_values, to_string(value) ?? "") }
  }
  for_each(flatten(__existing)) -> |key, value| {
      __source_alias = includes(__original_values, encode_json(value)) || includes(__original_values, to_string(value) ?? "")
      __mapped_alias = includes(__represented, encode_json(value)) || includes(__represented, to_string(value) ?? "")
      __decoded, __decode_err = parse_json(string(value) ?? "")
      __encoded_container = __decode_err == null && (is_object(__decoded) || is_array(__decoded))
      if !is_null(value) && value != "" && !__source_alias && !__mapped_alias && !__encoded_container && value != __raw_body {
          # Existing aggregates may contain sensitive descendants; the canonical
          # source spill above is the authoritative representation of containers.
          if !is_array(value) && !is_object(value) && !match(downcase(key), r'password|secret|authorization|token') {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, with recursive
  # redaction. These entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__safe.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

