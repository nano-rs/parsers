source: json
transforms:
- source: device_name
  kind: lowercase
  target: device.hostname
  reason: Parser lowercases this hostname, address, identity or hash; consume only if the normalized value
    is emitted.
- source: device_name
  kind: lowercase
  target: evidences.device.hostname
  reason: Parser lowercases this hostname, address, identity or hash; consume only if the normalized value
    is emitted.
- source: device_internal_ip
  kind: lowercase
  target: device.ip
  reason: Parser lowercases this hostname, address, identity or hash; consume only if the normalized value
    is emitted.
- source: device_internal_ip
  kind: lowercase
  target: evidences.device.ip
  reason: Parser lowercases this hostname, address, identity or hash; consume only if the normalized value
    is emitted.
- source: process_sha256
  kind: lowercase
  target: actor.process.file.hashes.value
  reason: Parser lowercases this hostname, address, identity or hash; consume only if the normalized value
    is emitted.
- source: process_sha256
  kind: lowercase
  target: process.file.hashes.value
  reason: Parser lowercases this hostname, address, identity or hash; consume only if the normalized value
    is emitted.
- source: device_username
  kind: lowercase
  target: actor.user.name
  reason: Parser lowercases this hostname, address, identity or hash; consume only if the normalized value
    is emitted.
- source: process_username
  kind: lowercase
  target: actor.user.name
  reason: Parser lowercases this hostname, address, identity or hash; consume only if the normalized value
    is emitted.
- source: backend_timestamp
  kind: epoch_ms
  target: time
  reason: ISO clock converted to epoch milliseconds; only the selected successful clock is consumed.
- source: create_time
  kind: epoch_ms
  target: time
  reason: ISO clock converted to epoch milliseconds; only the selected successful clock is consumed.
- source: sensor_action
  target: disposition_id
  kind: enum
  values:
    deny: 2
    block: 2
    terminate: 2
    terminate_process: 2
    quarantine: 3
    delete: 5
    allow: 1
  reason: Finding branch translates sensor enforcement into disposition.
- source: workflow.state
  target: status_id
  kind: enum
  values:
    open: 1
    new: 1
    in_progress: 2
    closed: 4
    resolved: 4
    dismissed: 3
  reason: Finding branch normalizes workflow lifecycle status.
- source: severity
  target: severity_id
  kind: enum
  values:
    '0': 1
    '1': 2
    '2': 2
    '3': 2
    '4': 3
    '5': 3
    '6': 4
    '7': 4
    '8': 5
    '9': 5
    '10': 5
  reason: Vendor severity is normalized to the OCSF severity enumeration.
- source: report.severity
  target: severity_id
  kind: enum
  values:
    '0': 1
    '1': 2
    '2': 2
    '3': 2
    '4': 3
    '5': 3
    '6': 4
    '7': 4
    '8': 5
    '9': 5
    '10': 5
  reason: Vendor severity is normalized to the OCSF severity enumeration.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  device_internal_ip:
  - device.ip
  - evidences.device.ip
  id:
  - finding_info.uid
  - metadata.original_event_uid
  - metadata.uid
  parent_cmdline:
  - evidences.actor.process.cmd_line
  parent_guid:
  - actor.process.uid
  - evidences.actor.process.uid
  parent_name:
  - actor.process.file.path
  - evidences.actor.process.file.path
  parent_pid:
  - actor.process.pid
  - evidences.actor.process.pid
  process_cmdline:
  - actor.process.cmd_line
  - evidences.process.cmd_line
  - process.cmd_line
  process_guid:
  - actor.process.uid
  - evidences.process.uid
  - metadata.original_event_uid
  - process.uid
  process_name:
  - actor.process.file.path
  - evidences.process.file.path
  - process.file.path
  process_pid:
  - actor.process.pid
  - evidences.process.pid
  - process.pid
  reason:
  - finding_info.title
  reason_code:
  - status_detail
  report.id:
  - finding_info.analytic.uid
  report.name:
  - finding_info.analytic.name
  - finding_info.title
  report_id:
  - finding_info.analytic.uid
  report_name:
  - finding_info.analytic.name
  type:
  - finding_info.types
  - metadata.event_code
