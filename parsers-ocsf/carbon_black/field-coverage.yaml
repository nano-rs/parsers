source: json
transforms:
- source: device_name
  kind: lowercase
  reason: Parser lowercases this hostname, address, identity or hash; consume only
    if the normalized value is emitted.
- source: device_internal_ip
  kind: lowercase
  reason: Parser lowercases this hostname, address, identity or hash; consume only
    if the normalized value is emitted.
- source: process_sha256
  kind: lowercase
  reason: Parser lowercases this hostname, address, identity or hash; consume only
    if the normalized value is emitted.
- source: parent_sha256
  kind: lowercase
  reason: Parser lowercases this hostname, address, identity or hash; consume only
    if the normalized value is emitted.
- source: device_username
  kind: lowercase
  reason: Parser lowercases this hostname, address, identity or hash; consume only
    if the normalized value is emitted.
- source: process_username
  kind: lowercase
  reason: Parser lowercases this hostname, address, identity or hash; consume only
    if the normalized value is emitted.
- source: backend_timestamp
  kind: epoch_ms
  target: time
  reason: ISO clock converted to epoch milliseconds; only the selected successful
    clock is consumed.
- source: first_event_timestamp
  kind: epoch_ms
  target: time
  reason: ISO clock converted to epoch milliseconds; only the selected successful
    clock is consumed.
- source: create_time
  kind: epoch_ms
  target: time
  reason: ISO clock converted to epoch milliseconds; only the selected successful
    clock is consumed.
- source: sensor_action
  target: disposition_id
  kind: enum
  values:
    deny: 2
    block: 2
    terminate: 2
    terminate_process: 2
    quarantine: 3
    delete: 5
    allow: 1
  reason: Finding branch translates sensor enforcement into disposition.
- source: workflow.state
  target: status_id
  kind: enum
  values:
    open: 1
    new: 1
    in_progress: 2
    closed: 4
    resolved: 4
    dismissed: 3
  reason: Finding branch normalizes workflow lifecycle status.
- source: severity
  target: severity_id
  kind: enum
  values:
    '0': 1
    '1': 2
    '2': 2
    '3': 2
    '4': 3
    '5': 3
    '6': 4
    '7': 4
    '8': 5
    '9': 5
    '10': 5
  reason: Vendor severity is normalized to the OCSF severity enumeration.
- source: report.severity
  target: severity_id
  kind: enum
  values:
    '0': 1
    '1': 2
    '2': 2
    '3': 2
    '4': 3
    '5': 3
    '6': 4
    '7': 4
    '8': 5
    '9': 5
    '10': 5
  reason: Vendor severity is normalized to the OCSF severity enumeration.
consumed_candidates:
- alert_url
- backend_timestamp
- create_time
- device_external_ip
- device_id
- device_internal_ip
- device_location
- device_name
- device_os
- device_os_version
- device_username
- first_event_timestamp
- id
- ioc_hit
- ioc_id
- ml_classification_final_verdict
- ml_classification_global_prevalence
- org_key
- parent_cmdline
- parent_guid
- parent_name
- parent_path
- parent_pid
- parent_sha256
- policy_id
- policy_name
- process_cmdline
- process_guid
- process_name
- process_path
- process_pid
- process_sha256
- process_username
- reason
- reason_code
- report.id
- report.name
- report.severity
- report.tags
- report_id
- report_name
- run_state
- sensor_action
- severity
- target_value
- threat_id
- ttps
- type
- watchlists
- workflow.remediation
- workflow.state
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
