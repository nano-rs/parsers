name: gitlab_audit_ocsf
display_name: GitLab Audit Events (OCSF)
version: "1.0.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses GitLab audit events into complete OCSF 1.9.0 records. Three wire forms
  share one lane: streaming audit events (instance, group and project
  destinations, keyed by `event_type`), the REST audit events API
  (/api/v4/audit_events, /groups/:id/audit_events, /projects/:id/audit_events,
  keyed by `event_name`) and the self-managed audit_json.log file (flat
  `meta.*` keys, `change`/`add`/`remove` details). Routing:
    authenticated_with_*, login_failed_with_*, omniauth_login_failed,
    user_signed_in_from_unseen_ip, audit_json sign-ins (`with`)  -> Authentication 3002
    user_* lifecycle, 2FA, password, email, personal access tokens -> User Management 3007
    member_created / member_updated / member_destroyed,
    audit_json `add`/`remove` of user_access                     -> Group Management 3006
    everything else (projects, groups, git operations, settings) -> API Activity 6003
  `author_*` is the actor; `target_*` is the account or object acted ON, and
  `entity_*` is the scope (User, Group, Project) the event was recorded on.
  Account Change 3001 is deprecated in OCSF 1.9 and is not emitted. A batched
  streaming request (a JSON array) is not fanned out here: split it upstream,
  one event per message. Unparseable input becomes a Base Event with the raw
  line kept.
match_values:
  - gitlab_audit
category: cloud
vendor: "GitLab"
product: "GitLab"
parser_vrl: |
  # GitLab audit events (streaming, REST API, audit_json.log) -> OCSF 1.9.0.
  # A string body is the usual wire form. A source that already decoded the
  # JSON hands over an object (or array) instead, and a record without any
  # `message` is the decoded event itself; never abort on either.
  raw_log = ""
  if is_string(.message) {
      raw_log = string!(.message)
  } else if is_object(.message) || is_array(.message) {
      raw_log = encode_json(.message)
  } else if exists(.message) && !is_null(.message) {
      raw_log = to_string(.message) ?? ""
  } else {
      raw_log = encode_json(.)
  }
  __raw_body = raw_log
  __source_kv = {}
  parsed, err = parse_json(raw_log)
  __source_kv = object(parsed) ?? {}

  # A JSON object only counts as a GitLab audit event when it carries at least
  # one GitLab audit field; anything else is a misrouted record.
  is_gitlab = false
  if err == null && is_object(parsed) {
      is_gitlab = exists(parsed.event_type) || exists(parsed.event_name) || exists(parsed.entity_type) ||
                  exists(parsed.author_id) || exists(parsed.target_type) || exists(parsed."meta.caller_id")
  }
  reason = "not a JSON object"
  if err == null && is_object(parsed) { reason = "JSON object without GitLab audit fields" }

  if !is_gitlab {
      # Unparseable input (or a batched JSON array that was not split upstream)
      # is emitted as an OCSF Base Event with the raw line kept, never guessed
      # into a security class.
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 0,
          "activity_name": "Unknown",
          "type_uid": 0,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": 0,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": sha2("gitlab_audit|raw|" + raw_log, variant: "SHA-256"),
              "log_level": "error",
              "log_name": "GitLab Audit Events",
              "log_provider": "GitLab",
              "product": { "name": "GitLab", "vendor_name": "GitLab" }
          },
          "unmapped": { "parse_error": reason }
      }
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      . = set!(., ["unmapped", "parse_fallback"], "unparsable input")
  } else {
      p = object!(parsed)
      d = object(p.details) ?? {}

      # ---- event identity: streaming `event_type`, REST `event_name` ----
      event = string(p.event_type) ?? ""
      if event == "" { event = string(p.event_name) ?? "" }
      if event == "" { event = string(d.event_name) ?? "" }

      # ---- time: created_at (when the action happened), else the log clock ----
      time_ms = 0
      ts = string(p.created_at) ?? ""
      if ts == "" { ts = string(p.time) ?? "" }
      clock, clock_err = parse_timestamp(ts, "%+", timezone: "UTC")
      if clock_err == null { time_ms = to_unix_timestamp(clock, unit: "milliseconds") }

      # ---- the author (actor) ----
      author_id = to_string(p.author_id) ?? ""
      if author_id == "" { author_id = to_string(d.author_id) ?? "" }
      author_name = string(p.author_name) ?? ""
      if author_name == "" { author_name = string(d.author_name) ?? "" }
      author_login = string(p."meta.user") ?? ""
      author_email = string(d.author_email) ?? ""
      actor_user = {}
      if author_login != "" {
          actor_user.name = author_login
          if author_name != "" { actor_user.display_name = author_name }
      } else if author_name != "" {
          actor_user.name = author_name
      }
      if author_id != "" && author_id != "-1" { actor_user.uid = author_id }
      # OCSF user needs a name or uid (at_least_one account / name / uid): an
      # email alone stays in unmapped and the actor is the "unknown" user.
      if length(actor_user) > 0 {
          if match(author_email, r'^[^@\s]+@[^@\s]+\.[^@\s]+$') { actor_user.email_addr = author_email }
      } else {
          actor_user = { "name": "unknown" }
      }

      # ---- target (acted on) and entity (scope recorded on) ----
      target_id = to_string(p.target_id) ?? ""
      if target_id == "" { target_id = to_string(d.target_id) ?? "" }
      target_type = string(p.target_type) ?? ""
      if target_type == "" { target_type = string(d.target_type) ?? "" }
      target_details = string(p.target_details) ?? ""
      if target_details == "" { target_details = string(d.target_details) ?? "" }
      entity_id = to_string(p.entity_id) ?? ""
      entity_type = string(p.entity_type) ?? ""
      entity_path = string(p.entity_path) ?? ""
      if entity_path == "" { entity_path = string(d.entity_path) ?? "" }

      subject = {}
      if target_type == "User" {
          if target_details != "" { subject.name = target_details }
          if target_id != "" { subject.uid = target_id }
      }
      have_subject = length(subject) > 0

      # ---- audit_json.log detail keys ----
      with = string(p.with) ?? ""
      failed_login = string(p.failed_login) ?? ""
      change = string(p.change) ?? ""
      if change == "" { change = string(d.change) ?? "" }
      add = string(p.add) ?? ""
      if add == "" { add = string(d.add) ?? "" }
      remove = string(p.remove) ?? ""
      if remove == "" { remove = string(d.remove) ?? "" }
      access_as = string(p.as) ?? ""
      if access_as == "" { access_as = string(d.as) ?? "" }
      custom_message = string(d.custom_message) ?? ""
      if custom_message == "" { custom_message = string(p.custom_message) ?? "" }
      caller_id = string(p."meta.caller_id") ?? ""

      # ---- source endpoint ----
      src_ip = string(p.ip_address) ?? ""
      if src_ip == "" { src_ip = string(p."meta.remote_ip") ?? "" }
      if src_ip == "" { src_ip = string(d.ip_address) ?? "" }
      src_ep = { "hostname": "unknown" }
      if is_ipv4(src_ip) || is_ipv6(src_ip) { src_ep = { "ip": src_ip } }

      # ---- class routing ----
      is_failed = starts_with(event, "login_failed_with_") || event == "omniauth_login_failed" || failed_login != ""
      # An administrator impersonating a user (GitLab 14.8+ `user_impersonation`).
      is_switch = event == "user_impersonation" || starts_with(event, "user_impersonation_")
      is_auth = starts_with(event, "authenticated_with_") || is_failed || is_switch ||
                event == "user_signed_in_from_unseen_ip" || event == "user_email_changed_and_user_signed_in" ||
                event == "smartcard_authentication_created" ||
                (event == "" && with != "" && entity_type == "User" && change == "" && add == "" && remove == "")
      is_member = event == "member_created" || event == "member_updated" || event == "member_destroyed" ||
                  (event == "" && (add == "user_access" || remove == "user_access" || change == "access_level"))
      is_user_event = starts_with(event, "user_") || starts_with(event, "personal_access_token_") ||
                      event == "ban_user" || event == "unban_user" || event == "unblock_user" ||
                      event == "registration_created" || event == "password_reset_requested" ||
                      event == "email_created" || event == "email_destroyed" ||
                      (event == "" && entity_type == "User" && change != "")
      is_usermgmt = !is_auth && !contains(event, "oauth_application") && is_user_event

      class_uid = 6003
      if is_auth { class_uid = 3002 } else if is_member { class_uid = 3006 } else if is_usermgmt { class_uid = 3007 }

      status_id = 1
      status_str = "Success"
      severity_id = 1
      severity = "Informational"
      if is_failed {
          status_id = 2; status_str = "Failure"; severity_id = 2; severity = "Low"
      }
      if event == "user_disable_two_factor" || event == "user_admin_status_updated" || event == "user_signed_in_from_unseen_ip" || is_switch {
          severity_id = 3; severity = "Medium"
      }
      # Owner / Maintainer grants and group or project exports.
      access_level = downcase(access_as)
      if is_member && (access_level == "owner" || access_level == "maintainer") { severity_id = 3; severity = "Medium" }
      if contains(event, "export") { severity_id = 3; severity = "Medium" }

      ocsf = {}
      if class_uid == 3002 {
          ocsf.class_uid = 3002
          ocsf.class_name = "Authentication"
          ocsf.category_uid = 3
          ocsf.category_name = "Identity & Access Management"
          ocsf.activity_id = 1
          ocsf.activity_name = "Logon"
          # Authentication carries the authenticating principal in `user`. A
          # failed login has no author account (author_id -1); the attempted
          # name is the target.
          auth_user = actor_user
          if is_failed && have_subject { auth_user = subject }
          ocsf.user = auth_user
          if is_switch {
              # The administrator (author) acts AS the target user.
              if have_subject { ocsf.user = subject }
              ocsf.actor = { "user": actor_user }
              if contains(downcase(custom_message), "stop") {
                  ocsf.activity_id = 2
                  ocsf.activity_name = "Logoff"
              } else {
                  ocsf.activity_id = 7
                  ocsf.activity_name = "Account Switch"
                  ocsf.account_switch_type_id = 2
                  ocsf.account_switch_type = "Impersonate"
              }
          }
          ocsf.service = { "name": "GitLab" }
          ocsf.is_remote = true
          method = with
          if method == "" { method = failed_login }
          if method != "" {
              ml = downcase(method)
              ap_id = 99
              ap_name = method
              if ml == "ldap" || starts_with(ml, "ldap") { ap_id = 12; ap_name = "LDAP" }
              if ml == "saml" || ml == "group_saml" { ap_id = 5; ap_name = "SAML" }
              ocsf.auth_protocol_id = ap_id
              ocsf.auth_protocol = ap_name
          }
          if event == "authenticated_with_two_factor" || event == "authenticated_with_webauthn" || event == "login_failed_with_otp_authentication" || event == "login_failed_with_webauthn_authentication" || downcase(with) == "two-factor" {
              ocsf.is_mfa = true
          }
      } else if class_uid == 3006 {
          activity_id = 9
          activity_name = "Update"
          if event == "member_created" || add == "user_access" { activity_id = 3; activity_name = "Add User" }
          if event == "member_destroyed" || remove == "user_access" { activity_id = 4; activity_name = "Remove User" }
          ocsf.class_uid = 3006
          ocsf.class_name = "Group Management"
          ocsf.category_uid = 3
          ocsf.category_name = "Identity & Access Management"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          grp = {}
          if entity_path != "" { grp.name = entity_path }
          if entity_id != "" { grp.uid = entity_id }
          if entity_type != "" { grp.type = entity_type }
          if length(grp) == 0 || (!exists(grp.name) && !exists(grp.uid)) { grp.name = "unknown" }
          ocsf.group = grp
          if have_subject { ocsf.user = subject }
          ocsf.actor = { "user": actor_user }
          if access_as != "" { ocsf.privileges = [access_as] }
      } else if class_uid == 3007 {
          activity_id = 2
          activity_name = "Update"
          if event == "user_created" || event == "registration_created" || event == "user_provisioned_by_scim" || event == "user_approved" || event == "email_created" { activity_id = 1; activity_name = "Create" }
          if event == "user_destroyed" { activity_id = 3; activity_name = "Delete" }
          if event == "unblock_user" || event == "unban_user" || event == "user_activate" { activity_id = 4; activity_name = "Enable" }
          if starts_with(event, "user_blocked") || event == "ban_user" || event == "user_deactivate" || event == "user_rejected" { activity_id = 5; activity_name = "Disable" }
          if event == "user_access_locked" { activity_id = 6; activity_name = "Lock" }
          if event == "user_access_unlocked" { activity_id = 7; activity_name = "Unlock" }
          if event == "user_password_updated" { activity_id = 8; activity_name = "Password Change" }
          if event == "password_reset_requested" { activity_id = 9; activity_name = "Password Reset" }
          if event == "user_enable_two_factor" || event == "user_enable_passkey" { activity_id = 12; activity_name = "Enable MFA Factors" }
          if event == "user_disable_two_factor" || event == "user_disable_passkey" { activity_id = 13; activity_name = "Disable MFA Factors" }
          if event == "personal_access_token_created" { activity_id = 18; activity_name = "Add Programmatic Credentials" }
          if event == "personal_access_token_revoked" { activity_id = 19; activity_name = "Remove Programmatic Credentials" }
          ocsf.class_uid = 3007
          ocsf.class_name = "User Management"
          ocsf.category_uid = 3
          ocsf.category_name = "Identity & Access Management"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          # SUBJECT is the target account; self-service changes (2FA, password)
          # fall back to the author.
          if have_subject { ocsf.user = subject } else { ocsf.user = actor_user }
          ocsf.actor = { "user": actor_user }
      } else {
          activity_id = 99
          activity_name = "Other"
          if contains(event, "create") || contains(event, "_added") || contains(event, "imported") || add != "" { activity_id = 1; activity_name = "Create" }
          if contains(event, "_updated") || contains(event, "_changed") || contains(event, "archived") || contains(event, "restored") || change != "" { activity_id = 3; activity_name = "Update" }
          if contains(event, "destroy") || contains(event, "delet") || contains(event, "_removed") || remove != "" { activity_id = 4; activity_name = "Delete" }
          if contains(event, "git_operation") || contains(event, "download_operation") { activity_id = 2; activity_name = "Read" }
          # REST events without an event type: the custom message, or the git
          # action of a repository operation, names the verb.
          if event == "" && activity_id == 99 {
              cm = downcase(custom_message)
              if contains(cm, "created") || contains(cm, "added") { activity_id = 1; activity_name = "Create" }
              if contains(cm, "updated") || contains(cm, "changed") || contains(cm, "archived") { activity_id = 3; activity_name = "Update" }
              if contains(cm, "deletion") || contains(cm, "deleted") || contains(cm, "removed") || contains(cm, "destroyed") { activity_id = 4; activity_name = "Delete" }
              git_action = ""
              if is_object(d.custom_message) { git_action = string(d.custom_message.action) ?? "" }
              if git_action == "git-upload-pack" { activity_id = 2; activity_name = "Read" }
              if git_action == "git-receive-pack" { activity_id = 3; activity_name = "Update" }
          }
          ocsf.class_uid = 6003
          ocsf.class_name = "API Activity"
          ocsf.category_uid = 6
          ocsf.category_name = "Application Activity"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          op = event
          if op == "" { op = caller_id }
          if op == "" && change != "" { op = "change " + change }
          if op == "" && add != "" { op = "add " + add }
          if op == "" && remove != "" { op = "remove " + remove }
          if op == "" { op = "unknown" }
          ocsf.api = { "operation": op, "service": { "name": "GitLab" } }
          ocsf.actor = { "user": actor_user }
          resources = []
          ent = {}
          if entity_id != "" { ent.uid = entity_id }
          if entity_path != "" { ent.name = entity_path }
          if entity_type != "" { ent.type = entity_type }
          if exists(ent.uid) || exists(ent.name) { resources = push(resources, ent) }
          tgt = {}
          if target_id != "" { tgt.uid = target_id }
          if target_details != "" { tgt.name = target_details }
          if target_type != "" { tgt.type = target_type }
          if (exists(tgt.uid) || exists(tgt.name)) && tgt != ent { resources = push(resources, tgt) }
          if length(resources) > 0 { ocsf.resources = resources }
      }

      ocsf.src_endpoint = src_ep
      ocsf.status_id = status_id
      ocsf.status = status_str
      ocsf.severity_id = severity_id
      ocsf.severity = severity
      ocsf.type_uid = to_int(ocsf.class_uid) * 100 + to_int(ocsf.activity_id)
      ocsf.time = time_ms
      msg = custom_message
      if msg == "" { msg = event }
      if msg == "" { msg = "gitlab_audit_event" }
      ocsf.message = msg
      ocsf.raw_data = raw_log

      evt_uid = to_string(p.id) ?? ""
      if evt_uid == "" { evt_uid = sha2("gitlab_audit|raw|" + raw_log, variant: "SHA-256") }
      md = {
          "version": "1.9.0",
          "uid": evt_uid,
          "log_name": "GitLab Audit Events",
          "log_provider": "GitLab",
          "product": { "name": "GitLab", "vendor_name": "GitLab" }
      }
      if event != "" { md.event_code = event }
      corr = string(p.correlation_id) ?? ""
      if corr != "" { md.correlation_uid = corr }
      lvl = string(p.severity) ?? ""
      if lvl != "" { md.log_level = lvl }
      ocsf.metadata = md

      . = ocsf
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # Values spill exactly as parsed: a parser never masks, redacts or withholds
  # anything (masking is an opt-in pipeline step, never a parser concern).
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # A source field is consumed ONLY by an explicit mapping: a field-coverage.yaml
  # `mappings` entry (source key -> target paths) or a `transforms` rule with a
  # target, whose value is found AT THAT TARGET PATH of the selected branch. A
  # value that merely appears somewhere else in the event never consumes a field
  # (no coincidental consumption); everything else spills.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The sets below are strings instead
  # (a read shares the buffer). __repr holds one member per mapped leaf:
  # "," + encode_json(path) + "=" + encode_json(encode_json(value)), plus the
  # to_string form for a string or a float, so a numeric string is represented by
  # its typed scalar. Every part is a JSON text, inside which a '"' is always
  # escaped, so a member is matched exactly. Paths drop array indices
  # (resources.0.uid is resources.uid); arrays are walked two levels deep, and a
  # leaf deeper than that is simply not mapping evidence (it can only spill more).
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped = object!(parse_json!(encode_json(__mapped)))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __copy = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __repr = ""
  for_each(flatten(__mapped)) -> |path, value| {
      __p = encode_json(path)
      if is_array(value) {
          for_each(array!(value)) -> |_i, item| {
              if is_object(item) {
                  for_each(flatten(object!(item))) -> |sub, leaf| {
                      __q = encode_json(path + "." + sub)
                      if is_array(leaf) {
                          for_each(array!(leaf)) -> |_j, x| {
                              if !is_object(x) && !is_array(x) {
                                  __repr = __repr + ("," + __q + "=" + encode_json(encode_json(x)))
                                  if is_string(x) || is_float(x) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(x))) }
                              }
                          }
                      } else {
                          __repr = __repr + ("," + __q + "=" + encode_json(encode_json(leaf)))
                          if is_string(leaf) || is_float(leaf) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(leaf))) }
                      }
                  }
              } else if !is_array(item) {
                  __repr = __repr + ("," + __p + "=" + encode_json(encode_json(item)))
                  if is_string(item) || is_float(item) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(item))) }
              }
          }
      } else {
          __repr = __repr + ("," + __p + "=" + encode_json(encode_json(value)))
          if is_string(value) || is_float(value) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(value))) }
      }
  }
  __consumed = ""
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__copy.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # BEGIN parser-specific transformations
  # created_at: ISO created_at converted to the event clock in milliseconds.
  # time: audit_json.log write clock, used only when created_at is absent.
  # with: Known GitLab sign-in methods normalize to the OCSF auth_protocol caption.
  for_each(__flat) -> |key, value| {
      if match(key, r'(?x)
      \A(?:
        created_at
      | time
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%+", timezone: "UTC")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              if contains(__repr, "," + "\"time\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        with
      )\z') {
          __value = value
          if __value != null {
              __expected = get!({"ldap": "LDAP", "saml": "SAML"}, [downcase(to_string(__value) ?? "")])
              if __expected != null {
                  if contains(__repr, "," + "\"auth_protocol\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
              }
          }
      }
  }
  # Declared source -> target mappings (field-coverage.yaml `mappings`).
  __decl = "\n\"author_id\"\t[\"actor.user.uid\",\"user.uid\"]\n\"author_name\"\t[\"actor.user.name\",\"user.display_name\",\"user.name\"]\n\"correlation_id\"\t[\"metadata.correlation_uid\"]\n\"entity_id\"\t[\"group.uid\",\"resources.uid\"]\n\"entity_type\"\t[\"group.type\",\"resources.type\"]\n\"meta~1caller_id\"\t[\"api.operation\"]\n\"meta~1remote_ip\"\t[\"src_endpoint.ip\"]\n\"meta~1user\"\t[\"user.name\"]\n\"severity\"\t[\"metadata.log_level\"]\n\"target_details\"\t[\"resources.name\",\"user.name\"]\n\"target_id\"\t[\"resources.uid\",\"user.uid\"]\n\"target_type\"\t[\"resources.type\"]\n\"with\"\t[\"auth_protocol\"]\n\"details.custom_message\"\t[\"message\"]\n\"failed_login\"\t[\"auth_protocol\"]\n\"ip_address\"\t[\"src_endpoint.ip\"]\n\"details.author_name\"\t[\"actor.user.name\"]\n\"details.entity_path\"\t[\"resources.name\"]\n\"details.ip_address\"\t[\"src_endpoint.ip\"]\n\"details.target_details\"\t[\"resources.name\",\"user.name\"]\n\"details.target_id\"\t[\"resources.uid\",\"user.uid\"]\n\"details.target_type\"\t[\"resources.type\"]\n\"entity_path\"\t[\"group.name\",\"resources.name\"]\n\"event_type\"\t[\"api.operation\",\"message\",\"metadata.event_code\"]\n\"id\"\t[\"metadata.uid\"]\n\"details.as\"\t[\"privileges\"]\n\"details.author_email\"\t[\"actor.user.email_addr\"]\n"
  __preserve = []
  # END parser-specific transformations
  # Declared mappings: __decl holds "\n" + encode_json(key) + "\t" + JSON array of
  # target paths + "\n" per mapped source key (a raw newline never occurs in
  # compact JSON). A key is consumed when its value, or every element of a scalar
  # array, is at one of its own targets. Keys stay ESCAPED here and in __consumed:
  # a literal dotted key ("a~1b") and the nested path ("a.b") are different
  # fields, and mapping one never consumes the other.
  for_each(__flat) -> |key, value| {
      # __decl spells a bracket inside a key as a \u escape (deploy bracket count).
      __kt = encode_json(key)
      if match(__kt, r'[\x28\x29\x5B\x5D\x7B\x7D]') {
          __kt = replace(replace(replace(replace(replace(replace(__kt, r'\x28', "\\u0028"), r'\x29', "\\u0029"), r'\x5B', "\\u005b"), r'\x5D', "\\u005d"), r'\x7B', "\\u007b"), r'\x7D', "\\u007d")
      }
      __at = find(__decl, "\n" + __kt + "\t")
      if is_integer(__at) && !is_object(value) {
          __rest = slice!(__decl, int!(__at) + strlen(__kt) + 2)
          __hit = false
          for_each(array!(parse_json!(slice!(__rest, 0, int!(find(__rest, "\n")))))) -> |_i, target| {
              __tok = "," + encode_json(target) + "="
              if !__hit && is_array(value) {
                  __all = !is_empty(array!(value))
                  for_each(array!(value)) -> |_j, item| {
                      if __all {
                          __all = !is_object(item) && !is_array(item) && (contains(__repr, __tok + encode_json(encode_json(item))) || ((is_string(item) || is_float(item)) && contains(__repr, __tok + encode_json(to_string!(item)))))
                      }
                  }
                  __hit = __all
              } else if !__hit {
                  __hit = contains(__repr, __tok + encode_json(encode_json(value))) || ((is_string(value) || is_float(value)) && contains(__repr, __tok + encode_json(to_string!(value))))
              }
          }
          if __hit { __consumed = __consumed + ("," + encode_json(key)) }
      }
  }
  # Fast path: when no two source keys decode to the same key and no two spilled
  # keys get the same name, each key's decision depends only on its own value, so
  # one filter and one rename build the residual without copying it per key.
  __distinct = true
  if __tilde {
      __distinct = length(map_keys(__flat) -> |key| { replace(replace(key, "~1", "."), "~0", "~") }) == length(__flat)
  }
  __kept = {}
  __names = {}
  if __distinct {
      __kept = filter(__flat) -> |key, value| {
          # A key is kept unless an explicit mapping or transformation consumed it.
          # Do not spill a copy of the raw body.
          value != __raw_body && !contains(__consumed, "," + encode_json(key))
      }
      __names = map_keys(__kept) -> |key| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          join!(__parts, ".")
      }
  }
  __residual = {}
  if __distinct && length(__names) == length(__kept) {
      __residual = map_values(__names) -> |value| {
          if is_array(value) || is_object(value) {
              if __tilde {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              if __complex { value = encode_json(value) }
          }
          value
      }
  } else {
      # Slow path, in source key order: a name already taken gets the next free
      # _2, _3, ... suffix.
      for_each(__flat) -> |key, value| {
          __token = "," + encode_json(key)
          key = replace(replace(key, "~1", "."), "~0", "~")
          if is_array(value) || is_object(value) {
              value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                  replace(replace(inner, "~1", "."), "~0", "~")
              }, ["v"])
          }
          if !contains(__consumed, __token) && value != __raw_body {
              __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
              __base = join!(__parts, ".")
              __key = __base
              __suffix = 2
              if includes(keys(__residual), __key) {
                  for_each(__flat) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __key) {
                          __key = __base + "_" + to_string(__suffix)
                          __suffix = __suffix + 1
                      }
                  }
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              __spill = if __complex { encode_json(value) } else { value }
              __residual = set!(__residual, [__key], __spill)
          }
      }
  }
  # Keep existing derived evidence, but remove null placeholders and copies of a
  # source value (that value is mapped or spilled above under its source path).
  # A value merely equal to some mapped attribute is kept: equality with an
  # unrelated attribute is no evidence that it is represented.
  # The canonical source spill above is the authoritative representation of
  # containers. The cheap conditions run first; the source value set is built on
  # first use.
  __original_values = null
  for_each(flatten(__existing)) -> |key, value| {
      if !is_null(value) && value != "" && !is_array(value) && !is_object(value) && value != __raw_body {
          # Members for the value itself and for to_string(value), as above.
          __json = encode_json(value)
          __as_json = "," + encode_json(__json)
          __as_string = __as_json
          if is_string(value) { __as_string = "," + __json } else if is_float(value) { __as_string = "," + encode_json(to_string!(value)) }
          if __original_values == null {
              # __source_kv may hold non-JSON types (a timestamp), so only an
              # integer or a boolean skips its to_string member here.
              __original_values = join!(map_values(values(flatten(__source_kv))) -> |source_value| {
                  __source_json = encode_json(source_value)
                  __tokens = "," + encode_json(__source_json)
                  if is_string(source_value) {
                      __tokens = __tokens + "," + __source_json
                  } else if !is_object(source_value) && !is_array(source_value) && !is_integer(source_value) && !is_boolean(source_value) {
                      __tokens = __tokens + "," + encode_json(to_string(source_value) ?? "")
                  }
                  __tokens
              }, "")
          }
          __source_set = string!(__original_values)
          __keep = !contains(__source_set, __as_json) && !contains(__source_set, __as_string)
          # Only text opening an object or an array (after JSON whitespace)
          # decodes to a container.
          if __keep && is_string(value) && match(string!(value), r'^[ \t\n\r]*[\x5B\x7B]') {
              __decoded, __decode_err = parse_json(string!(value))
              __keep = !(__decode_err == null && (is_object(__decoded) || is_array(__decoded)))
          }
          if __keep {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, as-is. These
  # entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__copy.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

