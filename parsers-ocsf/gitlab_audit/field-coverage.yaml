source: json
transforms:
- source: created_at
  kind: epoch_ms
  target: time
  format: '%+'
  reason: ISO created_at converted to the event clock in milliseconds.
- source: time
  kind: epoch_ms
  target: time
  format: '%+'
  reason: audit_json.log write clock, used only when created_at is absent.
- source: with
  kind: enum
  target: auth_protocol
  values:
    ldap: LDAP
    saml: SAML
  reason: Known GitLab sign-in methods normalize to the OCSF auth_protocol caption.
consumed_candidates:
- add
- as
- author_id
- author_name
- change
- correlation_id
- created_at
- custom_message
- details.add
- details.as
- details.author_email
- details.author_id
- details.author_name
- details.change
- details.custom_message
- details.custom_message.action
- details.entity_path
- details.event_name
- details.ip_address
- details.remove
- details.target_details
- details.target_id
- details.target_type
- entity_id
- entity_path
- entity_type
- event_name
- event_type
- failed_login
- id
- ip_address
- meta.caller_id
- meta.remote_ip
- meta.user
- remove
- severity
- target_details
- target_id
- target_type
- time
- with
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
