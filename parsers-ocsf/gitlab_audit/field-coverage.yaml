source: json
transforms:
- source: created_at
  kind: epoch_ms
  target: time
  format: '%+'
  reason: ISO created_at converted to the event clock in milliseconds.
- source: time
  kind: epoch_ms
  target: time
  format: '%+'
  reason: audit_json.log write clock, used only when created_at is absent.
- source: with
  kind: enum
  target: auth_protocol
  values:
    ldap: LDAP
    saml: SAML
  reason: Known GitLab sign-in methods normalize to the OCSF auth_protocol caption.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  author_id:
  - actor.user.uid
  - user.uid
  author_name:
  - actor.user.name
  - user.display_name
  - user.name
  correlation_id:
  - metadata.correlation_uid
  details.as:
  - privileges
  details.author_email:
  - actor.user.email_addr
  details.author_name:
  - actor.user.name
  details.custom_message:
  - message
  details.ip_address:
  - src_endpoint.ip
  details.target_details:
  - user.name
  details.target_id:
  - resources.uid
  - user.uid
  entity_id:
  - group.uid
  entity_path:
  - group.name
  - resources.name
  entity_type:
  - group.type
  event_type:
  - api.operation
  - message
  - metadata.event_code
  failed_login:
  - auth_protocol
  id:
  - metadata.uid
  ip_address:
  - src_endpoint.ip
  meta.caller_id:
  - api.operation
  meta.remote_ip:
  - src_endpoint.ip
  meta.user:
  - user.name
  severity:
  - metadata.log_level
  target_details:
  - resources.name
  - user.name
  target_id:
  - user.uid
  with:
  - auth_protocol
