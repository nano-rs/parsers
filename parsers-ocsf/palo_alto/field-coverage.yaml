source: text
transforms:
- source: receive_time
  kind: epoch_ms
  target: time
  format: '%Y/%m/%d %H:%M:%S'
  reason: PAN receive time converted in the existing runtime timezone.
- source: action
  kind: enum
  target: action_id
  values:
    allow: 1
    allowed: 1
    accept: 1
    accepted: 1
    permit: 1
    permitted: 1
    pass: 1
    passed: 1
    deny: 2
    denied: 2
    block: 2
    blocked: 2
    reject: 2
    rejected: 2
    drop: 2
    dropped: 2
    log: 3
    observed: 3
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when
    the expected ID is emitted.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  app_name:
  - app_name
  - dst_endpoint.svc_name
  - evidences.dst_endpoint.svc_name
  bytes_in:
  - traffic.bytes_in
  bytes_out:
  - traffic.bytes_out
  cfg_cmd:
  - api.operation
  cfg_path:
  - resources.name
  dst_country:
  - dst_endpoint.location.country
  dst_if:
  - dst_endpoint.interface_name
  - evidences.dst_endpoint.interface_name
  dst_ip:
  - dst_endpoint.ip
  - evidences.dst_endpoint.ip
  - observables.value
  dst_port:
  - dst_endpoint.port
  - evidences.dst_endpoint.port
  dst_zone:
  - dst_endpoint.zone
  - evidences.dst_endpoint.zone
  duration_s:
  - duration
  end_reason:
  - status_detail
  gp_auth_method:
  - auth_protocol
  gp_host:
  - src_endpoint.hostname
  gp_reason:
  - status_detail
  hip_name:
  - firewall_rule.name
  - firewall_rule.uid
  log_type:
  - metadata.log_name
  pkts_out:
  - traffic.packets_out
  protocol:
  - connection_info.protocol_name
  rule_name:
  - firewall_rule.name
  - firewall_rule.uid
  serial:
  - device.uid
  - src_endpoint.uid
  session_id:
  - connection_info.uid
  src_country:
  - src_endpoint.location.country
  src_if:
  - evidences.src_endpoint.interface_name
  - src_endpoint.interface_name
  src_ip:
  - evidences.src_endpoint.ip
  - observables.value
  - src_endpoint.ip
  src_port:
  - evidences.src_endpoint.port
  - src_endpoint.port
  src_zone:
  - evidences.src_endpoint.zone
  - src_endpoint.zone
  subtype:
  - finding_info.types
  sys_desc:
  - status_detail
  url_category:
  - http_request.url.categories
  url_raw:
  - observables.value
  user_name:
  - actor.user.name
  - observables.value
  - user.name
