source: text
transforms:
- source: receive_time
  kind: epoch_ms
  target: time
  format: '%Y/%m/%d %H:%M:%S'
  reason: PAN receive time converted in the existing runtime timezone.
- source: auth_evt
  kind: enum
  target: status
  values:
    failure: Failure
  reason: Parser normalizes the caption case; verify the emitted caption.
- source: gp_status
  kind: enum
  target: status
  values:
    failure: Failure
  reason: Parser normalizes the caption case; verify the emitted caption.
- source: pan_sev
  kind: enum
  target: severity
  values:
    informational: Informational
  reason: Parser normalizes the caption case; verify the emitted caption.
- source: pan_sev
  kind: enum
  target: severity
  values:
    critical: Critical
  reason: Parser normalizes the caption case; verify the emitted caption.
- source: action
  kind: enum
  target: action_id
  values:
    allow: 1
    allowed: 1
    accept: 1
    accepted: 1
    permit: 1
    permitted: 1
    pass: 1
    passed: 1
    deny: 2
    denied: 2
    block: 2
    blocked: 2
    reject: 2
    rejected: 2
    drop: 2
    dropped: 2
    log: 3
    observed: 3
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping;
    consume only when the expected ID is emitted.
consumed_candidates:
- action
- app_name
- auth_evt
- bytes_in
- bytes_out
- cfg_cmd
- cfg_path
- cfg_result
- content_type
- dst_country
- dst_if
- dst_ip
- dst_port
- dst_user
- dst_zone
- duration_s
- end_reason
- file_hash
- gp_auth_method
- gp_host
- gp_private_ip
- gp_reason
- gp_stage
- gp_status
- hip_name
- http_method
- log_type
- nat_dst_ip
- nat_dst_port
- nat_src_ip
- nat_src_port
- pan_sev
- pan_sev2
- pkts_in
- pkts_out
- protocol
- receive_time
- referrer
- repeat_count
- rule_name
- serial
- session_id
- src_country
- src_if
- src_ip
- src_port
- src_zone
- subtype
- sys_desc
- threat_raw
- url_category
- url_raw
- user_agent
- user_name
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
