name: palo_alto_ocsf
display_name: Palo Alto Networks PAN-OS (OCSF)
version: "1.2.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses Palo Alto Networks PAN-OS CSV syslog into OCSF 1.9.0, routed by log
  type: TRAFFIC -> Network Activity (4001); THREAT/url -> HTTP Activity (4002);
  every other THREAT subtype (vulnerability, spyware, virus, wildfire, file,
  data) -> Detection Finding (2004); AUTHENTICATION, GLOBALPROTECT and USERID
  -> Authentication (3002); CONFIG -> API Activity (6003). SYSTEM, HIPMATCH and
  any unrecognised log type still emit a Network Activity record with
  activity_id 99 and the raw line preserved in `message`.
match_values:
  - palo_alto
category: network
vendor: "Palo Alto Networks"
product: "PAN-OS"
parser_vrl: |
  # Palo Alto PAN-OS -> OCSF 1.9.0
  # 4001 Network Activity / 4002 HTTP Activity / 2004 Detection Finding /
  # 3002 Authentication / 6003 API Activity

  raw_log = string!(.message)
  __raw_body = raw_log
  __source_kv = {}
  working = raw_log

  # ---- strip syslog header ----
  hm, he = parse_regex(working, r'^(?:<\d+>)?(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+\d+\s+\d+:\d+:\d+\s+(?:(?P<host>\S+)\s+)?(?P<payload>\d.*|,.*|.*)$')
  dvc_host = ""
  if he == null && hm != null {
      working = string!(hm.payload)
      dvc_host = to_string(hm.host)
  }

  fields = parse_csv(working) ?? []
  n = length(fields)

  serial = to_string(fields[2])
  log_type = upcase(to_string(fields[3]))
  subtype = downcase(to_string(fields[4]))
  __column_names = {"1": "receive_time", "2": "serial", "3": "log_type", "4": "subtype"}
  if log_type == "TRAFFIC" || log_type == "THREAT" { __column_names = merge(__column_names, {"7": "src_ip", "8": "dst_ip", "9": "nat_src_ip", "10": "nat_dst_ip", "11": "rule_name", "12": "user_name", "13": "dst_user", "14": "app_name", "16": "src_zone", "17": "dst_zone", "18": "src_if", "19": "dst_if", "22": "session_id", "23": "repeat_count", "24": "src_port", "25": "dst_port", "26": "nat_src_port", "27": "nat_dst_port", "29": "protocol", "30": "action"}) }
  if log_type == "TRAFFIC" { __column_names = merge(__column_names, {"32": "bytes_out", "33": "bytes_in", "36": "duration_s", "37": "url_category", "41": "src_country", "42": "dst_country", "44": "pkts_out", "45": "pkts_in", "46": "end_reason"}) }
  if log_type == "THREAT" { __column_names = merge(__column_names, {"31": "url_raw", "32": "threat_raw", "33": "url_category", "41": "content_type", "43": "file_hash", "46": "user_agent", "49": "referrer", "62": "http_method", "34": "pan_sev"}) }
  if log_type == "AUTHENTICATION" { __column_names = merge(__column_names, {"8": "src_ip", "9": "user_name", "12": "rule_name", "18": "sys_desc", "20": "auth_evt"}) }
  if log_type == "GLOBALPROTECT" { __column_names = merge(__column_names, {"9": "gp_stage", "10": "gp_auth_method", "12": "user_name", "14": "gp_host", "15": "src_ip", "17": "gp_private_ip", "25": "gp_reason", "28": "gp_status", "30": "duration_s"}) }
  if log_type == "USERID" { __column_names = merge(__column_names, {"8": "src_ip", "9": "user_name", "14": "src_port", "15": "dst_port"}) }
  if log_type == "CONFIG" { __column_names = merge(__column_names, {"7": "src_ip", "9": "cfg_cmd", "10": "user_name", "12": "cfg_result", "13": "cfg_path"}) }
  if log_type == "HIPMATCH" { __column_names = merge(__column_names, {"7": "user_name", "9": "gp_host", "11": "src_ip", "12": "hip_name", "14": "sys_desc", "13": "pan_sev2"}) }
  for_each(fields) -> |index, value| {
      __column = string(get(__column_names, [to_string(index)]) ?? null) ?? ("column_" + to_string(index))
      __source_kv = set!(__source_kv, [__column], value)
  }


  # ---- receive_time (pos 1) ----
  time_ms = to_int(to_unix_timestamp(now(), unit: "milliseconds"))
  ts_str = to_string(fields[1])
  if ts_str != "" {
      ts, ts_err = parse_timestamp(ts_str, "%Y/%m/%d %H:%M:%S")
      if ts_err == null { time_ms = to_int(to_unix_timestamp(ts, unit: "milliseconds")) }
  }

  # ---- shared accumulators ----
  route = "network"
  activity_id = 99
  activity_name = "Other"
  action_id = 3
  action = "Observed"
  disposition_id = 17
  disposition = "Logged"
  status_id = 1
  status_str = "Success"
  severity_id = 1
  severity = "Informational"

  src_ip = ""
  dst_ip = ""
  src_port = 0
  dst_port = 0
  src_zone = ""
  dst_zone = ""
  src_if = ""
  dst_if = ""
  src_country = ""
  dst_country = ""
  nat_src_ip = ""
  nat_dst_ip = ""
  nat_src_port = 0
  nat_dst_port = 0
  proto = ""
  app_name = ""
  rule_name = ""
  session_id = ""
  user_name = ""
  dst_user = ""
  bytes_out = 0
  bytes_in = 0
  pkts_out = 0
  pkts_in = 0
  duration_s = 0
  repeat_cnt = 0
  pan_action = ""
  end_reason = ""
  url_raw = ""
  file_name = ""
  file_hash = ""
  threat_raw = ""
  threat_id = ""
  threat_name = ""
  url_category = ""
  content_type = ""
  user_agent = ""
  referrer = ""
  http_method = ""
  sys_desc = ""
  cfg_cmd = ""
  cfg_path = ""
  cfg_result = ""
  gp_stage = ""
  gp_status = ""
  gp_reason = ""
  gp_auth_method = ""
  gp_private_ip = ""
  gp_host = ""
  hip_name = ""

  # helper values shared by TRAFFIC and THREAT (identical positions 7..30)
  if log_type == "TRAFFIC" || log_type == "THREAT" {
      v7 = to_string(fields[7]);  if v7 != "" && v7 != "0.0.0.0" { src_ip = v7 }
      v8 = to_string(fields[8]);  if v8 != "" && v8 != "0.0.0.0" { dst_ip = v8 }
      v9 = to_string(fields[9]);  if v9 != "" && v9 != "0.0.0.0" { nat_src_ip = v9 }
      v10 = to_string(fields[10]); if v10 != "" && v10 != "0.0.0.0" { nat_dst_ip = v10 }
      rule_name = to_string(fields[11])
      user_name = to_string(fields[12])
      dst_user = to_string(fields[13])
      app_name = to_string(fields[14])
      src_zone = to_string(fields[16])
      dst_zone = to_string(fields[17])
      src_if = to_string(fields[18])
      dst_if = to_string(fields[19])
      session_id = to_string(fields[22])
      repeat_cnt = to_int(to_string(fields[23])) ?? 0
      src_port = to_int(to_string(fields[24])) ?? 0
      dst_port = to_int(to_string(fields[25])) ?? 0
      nat_src_port = to_int(to_string(fields[26])) ?? 0
      nat_dst_port = to_int(to_string(fields[27])) ?? 0
      proto = downcase(to_string(fields[29]))
      pan_action = downcase(to_string(fields[30]))
  }

  # ============================================================
  # TRAFFIC
  # ============================================================
  if log_type == "TRAFFIC" {
      route = "network"
      bytes_out = to_int(to_string(fields[32])) ?? 0
      bytes_in = to_int(to_string(fields[33])) ?? 0
      duration_s = to_int(to_string(fields[36])) ?? 0
      url_category = to_string(fields[37])
      src_country = to_string(fields[41])
      dst_country = to_string(fields[42])
      pkts_out = to_int(to_string(fields[44])) ?? 0
      pkts_in = to_int(to_string(fields[45])) ?? 0
      end_reason = to_string(fields[46])

      activity_id = 6
      activity_name = "Traffic"
      if subtype == "start" { activity_id = 1; activity_name = "Open" }
      if subtype == "end"   { activity_id = 2; activity_name = "Close" }
      if subtype == "drop" || subtype == "deny" { activity_id = 5; activity_name = "Refuse" }

  # ============================================================
  # THREAT
  # ============================================================
  } else if log_type == "THREAT" {
      url_raw = to_string(fields[31])
      threat_raw = to_string(fields[32])
      url_category = to_string(fields[33])
      content_type = to_string(fields[41])
      file_hash = to_string(fields[43])
      user_agent = to_string(fields[46])
      referrer = to_string(fields[49])
      http_method = upcase(to_string(fields[62]))

      if threat_raw != "" {
          tm, te = parse_regex(threat_raw, r'^(?P<name>.+?)\x28(?P<id>\d+)\x29\s*$')
          if te == null && tm != null {
              threat_name = string!(tm.name)
              threat_id = string!(tm.id)
          } else {
              threat_name = threat_raw
          }
      }
      if subtype == "file" || subtype == "virus" || subtype == "wildfire" || subtype == "data" {
          file_name = url_raw
      }

      pan_sev = downcase(to_string(fields[34]))
      severity_id = 3
      severity = "Medium"
      if pan_sev == "informational" || pan_sev == "info" { severity_id = 1; severity = "Informational" }
      if pan_sev == "low" { severity_id = 2; severity = "Low" }
      if pan_sev == "medium" { severity_id = 3; severity = "Medium" }
      if pan_sev == "high" { severity_id = 4; severity = "High" }
      if pan_sev == "critical" { severity_id = 5; severity = "Critical" }

      if subtype == "url" {
          route = "http"
          activity_id = 99
          activity_name = "Other"
          if http_method == "CONNECT" { activity_id = 1;  activity_name = "Connect" }
          if http_method == "DELETE"  { activity_id = 2;  activity_name = "Delete" }
          if http_method == "GET"     { activity_id = 3;  activity_name = "Get" }
          if http_method == "HEAD"    { activity_id = 4;  activity_name = "Head" }
          if http_method == "OPTIONS" { activity_id = 5;  activity_name = "Options" }
          if http_method == "POST"    { activity_id = 6;  activity_name = "Post" }
          if http_method == "PUT"     { activity_id = 7;  activity_name = "Put" }
          if http_method == "TRACE"   { activity_id = 8;  activity_name = "Trace" }
          if http_method == "PATCH"   { activity_id = 9;  activity_name = "Patch" }
      } else {
          route = "finding"
          activity_id = 1
          activity_name = "Create"
      }

  # ============================================================
  # AUTHENTICATION
  # ============================================================
  } else if log_type == "AUTHENTICATION" {
      route = "auth"
      activity_id = 1
      activity_name = "Logon"
      src_ip = to_string(fields[8])
      user_name = to_string(fields[9])
      rule_name = to_string(fields[12])
      sys_desc = to_string(fields[18])
      auth_evt = downcase(to_string(fields[20]))
      if subtype == "authentication-failed" || auth_evt == "failure" || subtype == "failed" {
          status_id = 2
          status_str = "Failure"
          action_id = 2
          action = "Denied"
          disposition_id = 2
          disposition = "Blocked"
          severity_id = 2
          severity = "Low"
      } else {
          action_id = 1
          action = "Allowed"
          disposition_id = 1
          disposition = "Allowed"
      }

  # ============================================================
  # GLOBALPROTECT
  # ============================================================
  } else if log_type == "GLOBALPROTECT" {
      route = "auth"
      gp_stage = to_string(fields[9])
      gp_auth_method = to_string(fields[10])
      user_name = to_string(fields[12])
      gp_host = to_string(fields[14])
      src_ip = to_string(fields[15])
      gp_private_ip = to_string(fields[17])
      gp_reason = to_string(fields[25])
      gp_status = downcase(to_string(fields[28]))
      duration_s = to_int(to_string(fields[30])) ?? 0

      activity_id = 1
      activity_name = "Logon"
      if contains(subtype, "logout") || contains(downcase(gp_stage), "logout") {
          activity_id = 2
          activity_name = "Logoff"
      }
      if gp_status == "failure" || gp_status == "failed" || gp_status == "error" {
          status_id = 2
          status_str = "Failure"
          action_id = 2
          action = "Denied"
          disposition_id = 2
          disposition = "Blocked"
          severity_id = 2
          severity = "Low"
      } else {
          action_id = 1
          action = "Allowed"
          disposition_id = 1
          disposition = "Allowed"
      }

  # ============================================================
  # USERID (user -> IP mapping)
  # ============================================================
  } else if log_type == "USERID" {
      route = "auth"
      src_ip = to_string(fields[8])
      user_name = to_string(fields[9])
      src_port = to_int(to_string(fields[14])) ?? 0
      dst_port = to_int(to_string(fields[15])) ?? 0
      activity_id = 1
      activity_name = "Logon"
      if contains(subtype, "logout") { activity_id = 2; activity_name = "Logoff" }
      action_id = 1
      action = "Allowed"
      disposition_id = 1
      disposition = "Allowed"

  # ============================================================
  # CONFIG (administrative change)
  # ============================================================
  } else if log_type == "CONFIG" {
      route = "api"
      src_ip = to_string(fields[7])
      cfg_cmd = downcase(to_string(fields[9]))
      user_name = to_string(fields[10])
      cfg_result = downcase(to_string(fields[12]))
      cfg_path = to_string(fields[13])

      activity_id = 3
      activity_name = "Update"
      if cfg_cmd == "add" || cfg_cmd == "create" || cfg_cmd == "clone" { activity_id = 1; activity_name = "Create" }
      if cfg_cmd == "delete" { activity_id = 4; activity_name = "Delete" }
      if cfg_cmd == "get" || cfg_cmd == "show" { activity_id = 2; activity_name = "Read" }
      if cfg_result == "failed" || cfg_result == "failure" {
          status_id = 2
          status_str = "Failure"
          severity_id = 2
          severity = "Low"
      }
      action_id = 1
      action = "Allowed"
      disposition_id = 1
      disposition = "Allowed"

  # ============================================================
  # HIPMATCH
  # ============================================================
  } else if log_type == "HIPMATCH" {
      route = "network"
      user_name = to_string(fields[7])
      gp_host = to_string(fields[9])
      src_ip = to_string(fields[11])
      hip_name = to_string(fields[12])
      rule_name = hip_name
      activity_id = 99
      activity_name = "Other"

  # ============================================================
  # SYSTEM and anything else
  # ============================================================
  } else {
      route = "network"
      activity_id = 99
      activity_name = "Other"
      if log_type == "SYSTEM" {
          sys_desc = to_string(fields[14])
          pan_sev2 = downcase(to_string(fields[13]))
          if pan_sev2 == "low" { severity_id = 2; severity = "Low" }
          if pan_sev2 == "medium" { severity_id = 3; severity = "Medium" }
          if pan_sev2 == "high" { severity_id = 4; severity = "High" }
          if pan_sev2 == "critical" { severity_id = 5; severity = "Critical" }
      }
  }

  # ---- PAN action -> OCSF action / disposition (TRAFFIC + THREAT) ----
  if pan_action != "" {
      if pan_action == "allow" {
          action_id = 1
          action = "Allowed"
          disposition_id = 1
          disposition = "Allowed"
      } else if pan_action == "drop" || starts_with(pan_action, "drop-") || pan_action == "random-drop" {
          action_id = 2
          action = "Denied"
          disposition_id = 6
          disposition = "Dropped"
          status_id = 2
          status_str = "Failure"
      } else if starts_with(pan_action, "reset") {
          action_id = 2
          action = "Denied"
          disposition_id = 21
          disposition = "Reset"
          status_id = 2
          status_str = "Failure"
          if route == "network" { activity_id = 3; activity_name = "Reset" }
      } else if pan_action == "alert" {
          action_id = 3
          action = "Observed"
          disposition_id = 19
          disposition = "Alert"
      } else if pan_action == "sinkhole" {
          action_id = 4
          action = "Modified"
          disposition_id = 7
          disposition = "Custom Action"
      } else {
          # deny, block-url, block-ip, block-continue, ...
          action_id = 2
          action = "Denied"
          disposition_id = 2
          disposition = "Blocked"
          status_id = 2
          status_str = "Failure"
      }
  }

  # ---- protocol number ----
  proto_num = 0
  if proto == "tcp" { proto_num = 6 }
  if proto == "udp" { proto_num = 17 }
  if proto == "icmp" { proto_num = 1 }
  if proto == "gre" { proto_num = 47 }
  if proto == "esp" { proto_num = 50 }

  # ---- endpoints ----
  src = {}
  if src_ip != "" && src_ip != "0.0.0.0" { src.ip = downcase(src_ip) }
  if src_port > 0 { src.port = src_port }
  if src_zone != "" { src.zone = src_zone }
  if src_if != "" { src.interface_name = src_if }
  if src_country != "" { src.location = { "country": src_country } }
  if gp_host != "" { src.hostname = gp_host }

  dst = {}
  if dst_ip != "" && dst_ip != "0.0.0.0" { dst.ip = downcase(dst_ip) }
  if dst_port > 0 { dst.port = dst_port }
  if dst_zone != "" { dst.zone = dst_zone }
  if dst_if != "" { dst.interface_name = dst_if }
  if dst_country != "" { dst.location = { "country": dst_country } }
  if app_name != "" { dst.svc_name = app_name }

  metadata = {
      "version": "1.9.0",
      "uid": sha2("palo_alto|raw|" + raw_log, variant: "SHA-256"),
      "log_source": "palo_alto",
      "log_provider": "PAN-OS",
      "profiles": ["host", "security_control"],
      "product": {
          "name": "PAN-OS",
          "vendor_name": "Palo Alto Networks",
          "feature": { "name": "firewall" }
      }
  }
  if log_type != "" { metadata.log_name = log_type }
  if subtype != "" { metadata.event_code = log_type + ":" + subtype }

  device = { "type_id": 9, "type": "Firewall" }
  has_device = false
  if serial != "" { device.uid = serial; has_device = true }
  if dvc_host != "" { device.hostname = dvc_host; has_device = true }

  unmapped = {}
  if session_id != "" { unmapped.session_id = session_id }
  if nat_src_ip != "" { unmapped.nat_src_ip = nat_src_ip }
  if nat_dst_ip != "" { unmapped.nat_dst_ip = nat_dst_ip }
  if nat_src_port > 0 { unmapped.nat_src_port = nat_src_port }
  if nat_dst_port > 0 { unmapped.nat_dst_port = nat_dst_port }
  if pan_action != "" { unmapped.pan_action = pan_action }
  if end_reason != "" { unmapped.session_end_reason = end_reason }
  if dst_user != "" { unmapped.dest_user = dst_user }
  if subtype != "" { unmapped.log_subtype = subtype }
  if sys_desc != "" { unmapped.description = sys_desc }
  if gp_stage != "" { unmapped.gp_stage = gp_stage }
  if gp_reason != "" { unmapped.gp_reason = gp_reason }
  if gp_private_ip != "" && gp_private_ip != "0.0.0.0" { unmapped.gp_private_ip = gp_private_ip }
  if hip_name != "" { unmapped.hip_match_name = hip_name }
  if cfg_path != "" { unmapped.config_path = cfg_path }
  if log_type == "" { unmapped.parse_status = "no_panos_log_type" }

  obs = []
  if src_ip != "" && src_ip != "0.0.0.0" { obs = push(obs, { "name": "src_endpoint.ip", "type": "IP Address", "type_id": 2, "value": downcase(src_ip) }) }
  if dst_ip != "" && dst_ip != "0.0.0.0" { obs = push(obs, { "name": "dst_endpoint.ip", "type": "IP Address", "type_id": 2, "value": downcase(dst_ip) }) }
  if user_name != "" { obs = push(obs, { "name": "user.name", "type": "User Name", "type_id": 4, "value": user_name }) }
  if url_raw != "" { obs = push(obs, { "name": "http_request.url.url_string", "type": "Uniform Resource Locator", "type_id": 23, "value": url_raw }) }
  if file_hash != "" { obs = push(obs, { "name": "file.hashes.value", "type": "Fingerprint", "type_id": 30, "value": file_hash }) }

  traffic = {}
  if bytes_in > 0 { traffic.bytes_in = bytes_in }
  if bytes_out > 0 { traffic.bytes_out = bytes_out }
  if pkts_in > 0 { traffic.packets_in = pkts_in }
  if pkts_out > 0 { traffic.packets_out = pkts_out }

  # ---- URL breakdown, shared by http + finding routes ----
  url_obj = {}
  if url_raw != "" {
      if starts_with(url_raw, "http://") || starts_with(url_raw, "https://") {
          url_obj.url_string = url_raw
      } else {
          url_obj.url_string = "http://" + url_raw
      }
      dm, de = parse_regex(url_raw, r'^(?:https?://)?(?P<domain>[^/:\s]+)')
      if de == null && dm != null { url_obj.hostname = string!(dm.domain) }
      pm, pe = parse_regex(url_raw, r'^(?:https?://)?[^/]+(?P<path>/[^\s]*)$')
      if pe == null && pm != null { url_obj.path = string!(pm.path) }
      if url_category != "" { url_obj.categories = [url_category] }
  }

  # ============================================================
  # Assemble
  # ============================================================
  if route == "auth" {
      class_uid = 3002
      . = {
          "class_uid": class_uid,
          "class_name": "Authentication",
          "category_uid": 3,
          "category_name": "Identity & Access Management",
          "activity_id": activity_id,
          "activity_name": activity_name,
          "type_uid": class_uid * 100 + activity_id,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": status_id,
          "status": status_str,
          "time": time_ms,
          "raw_data": raw_log,
          "action_id": action_id,
          "action": action,
          "disposition_id": disposition_id,
          "disposition": disposition,
          "metadata": metadata,
          "user": { "name": user_name }
      }
      if length(src) > 0 { .src_endpoint = src }
      if length(dst) > 0 {
          .dst_endpoint = dst
      } else {
          .service = { "name": "PAN-OS " + log_type }
      }
      if user_name != "" { .actor = { "user": { "name": user_name } } }
      if log_type == "GLOBALPROTECT" { .logon_type = "VPN"; .is_remote = true }
      if gp_auth_method != "" { .auth_protocol = gp_auth_method }
      if gp_reason != "" { .status_detail = gp_reason }
      if sys_desc != "" && gp_reason == "" { .status_detail = sys_desc }
      if duration_s > 0 { .duration = duration_s }
      if has_device { .device = device }

  } else if route == "api" {
      class_uid = 6003
      op = cfg_cmd
      if op == "" { op = "config" }
      . = {
          "class_uid": class_uid,
          "class_name": "API Activity",
          "category_uid": 6,
          "category_name": "Application Activity",
          "activity_id": activity_id,
          "activity_name": activity_name,
          "type_uid": class_uid * 100 + activity_id,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": status_id,
          "status": status_str,
          "time": time_ms,
          "raw_data": raw_log,
          "action_id": action_id,
          "action": action,
          "disposition_id": disposition_id,
          "disposition": disposition,
          "metadata": metadata,
          "actor": { "user": { "name": user_name } },
          "api": {
              "operation": op,
              "service": { "name": "PAN-OS Management" }
          },
          "src_endpoint": src
      }
      if length(src) == 0 { .src_endpoint = { "hostname": dvc_host } }
      if length(src) == 0 && dvc_host == "" { .src_endpoint = { "svc_name": "panos-mgmt" } }
      if cfg_path != "" { .resources = [{ "name": cfg_path, "type": "Configuration" }] }
      if has_device { .device = device }

  } else if route == "finding" {
      class_uid = 2004
      evidence = {}
      if length(src) > 0 { evidence.src_endpoint = src }
      if length(dst) > 0 { evidence.dst_endpoint = dst }
      if proto_num > 0 { evidence.connection_info = { "direction_id": 0, "protocol_num": proto_num } }
      if length(url_obj) > 0 { evidence.url = url_obj }
      if user_name != "" { evidence.user = { "name": user_name } }
      if file_name != "" {
          fobj = { "name": file_name, "type_id": 1 }
          if file_hash != "" { fobj.hashes = [{ "algorithm_id": 3, "algorithm": "SHA-256", "value": file_hash }] }
          evidence.file = fobj
      }
      evidence.name = "PAN-OS threat"
      fuid = threat_id
      if fuid == "" { fuid = threat_raw }
      if fuid == "" { fuid = log_type + ":" + subtype }
      ftitle = threat_name
      if ftitle == "" { ftitle = "PAN-OS " + subtype }
      . = {
          "class_uid": class_uid,
          "class_name": "Detection Finding",
          "category_uid": 2,
          "category_name": "Findings",
          "activity_id": activity_id,
          "activity_name": activity_name,
          "type_uid": class_uid * 100 + activity_id,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": status_id,
          "status": status_str,
          "time": time_ms,
          "raw_data": raw_log,
          "action_id": action_id,
          "action": action,
          "disposition_id": disposition_id,
          "disposition": disposition,
          "is_alert": true,
          "metadata": metadata,
          "finding_info": {
              "uid": fuid,
              "title": ftitle,
              "types": [subtype],
              "data_sources": ["palo_alto"],
              "analytic": {
                  "name": ftitle,
                  "uid": fuid,
                  "type_id": 1,
                  "type": "Rule"
              }
          },
          "evidences": [evidence]
      }
      if rule_name != "" { .firewall_rule = { "name": rule_name, "uid": rule_name } }
      if has_device { .device = device }

  } else if route == "http" {
      class_uid = 4002
      req = {}
      if http_method != "" { req.http_method = http_method }
      if user_agent != "" { req.user_agent = user_agent }
      if referrer != "" { req.referrer = referrer }
      if length(url_obj) > 0 { req.url = url_obj }
      . = {
          "class_uid": class_uid,
          "class_name": "HTTP Activity",
          "category_uid": 4,
          "category_name": "Network Activity",
          "activity_id": activity_id,
          "activity_name": activity_name,
          "type_uid": class_uid * 100 + activity_id,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": status_id,
          "status": status_str,
          "time": time_ms,
          "raw_data": raw_log,
          "action_id": action_id,
          "action": action,
          "disposition_id": disposition_id,
          "disposition": disposition,
          "metadata": metadata,
          "http_request": req,
          "connection_info": {
              "direction_id": 0,
              "protocol_num": proto_num
          }
      }
      if proto != "" { .connection_info.protocol_name = proto }
      if length(src) > 0 { .src_endpoint = src }
      if length(dst) > 0 { .dst_endpoint = dst }
      if length(src) == 0 && length(dst) == 0 { .dst_endpoint = { "svc_name": "http" } }
      if content_type != "" { .http_response = { "content_type": content_type } }
      if length(traffic) > 0 { .traffic = traffic }
      if rule_name != "" { .firewall_rule = { "name": rule_name, "uid": rule_name } }
      if user_name != "" { .actor = { "user": { "name": user_name } } }
      if has_device { .device = device }
      if app_name != "" { .app_name = app_name }

  } else {
      class_uid = 4001
      . = {
          "class_uid": class_uid,
          "class_name": "Network Activity",
          "category_uid": 4,
          "category_name": "Network Activity",
          "activity_id": activity_id,
          "activity_name": activity_name,
          "type_uid": class_uid * 100 + activity_id,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": status_id,
          "status": status_str,
          "time": time_ms,
          "raw_data": raw_log,
          "action_id": action_id,
          "action": action,
          "disposition_id": disposition_id,
          "disposition": disposition,
          "metadata": metadata,
          "connection_info": {
              "direction_id": 0,
              "protocol_num": proto_num
          }
      }
      if proto != "" { .connection_info.protocol_name = proto }
      if session_id != "" { .connection_info.uid = session_id }
      if length(src) > 0 { .src_endpoint = src }
      if length(dst) > 0 { .dst_endpoint = dst }
      if length(src) == 0 && length(dst) == 0 {
          fb = {}
          if dvc_host != "" { fb.hostname = dvc_host }
          if dvc_host == "" && serial != "" { fb.uid = serial }
          if length(fb) == 0 { fb.hostname = "unknown" }
          .src_endpoint = fb
      }
      if length(traffic) > 0 { .traffic = traffic }
      if duration_s > 0 { .duration = duration_s }
      if repeat_cnt > 1 { .count = repeat_cnt }
      if rule_name != "" { .firewall_rule = { "name": rule_name, "uid": rule_name } }
      if user_name != "" { .actor = { "user": { "name": user_name } } }
      if app_name != "" { .app_name = app_name }
      if end_reason != "" { .status_detail = end_reason }
      if has_device { .device = device }
  }

  if length(unmapped) > 0 { .unmapped = unmapped }
  if length(obs) > 0 { .observables = obs }

  .

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # Values spill exactly as parsed: a parser never masks, redacts or withholds
  # anything (masking is an opt-in pipeline step, never a parser concern).
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # A source field is consumed ONLY by an explicit mapping: a field-coverage.yaml
  # `mappings` entry (source key -> target paths) or a `transforms` rule with a
  # target, whose value is found AT THAT TARGET PATH of the selected branch. A
  # value that merely appears somewhere else in the event never consumes a field
  # (no coincidental consumption); everything else spills.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The sets below are strings instead
  # (a read shares the buffer). __repr holds one member per mapped leaf:
  # "," + encode_json(path) + "=" + encode_json(encode_json(value)), plus the
  # to_string form for a string or a float, so a numeric string is represented by
  # its typed scalar. Every part is a JSON text, inside which a '"' is always
  # escaped, so a member is matched exactly. Paths drop array indices
  # (resources.0.uid is resources.uid); arrays are walked two levels deep, and a
  # leaf deeper than that is simply not mapping evidence (it can only spill more).
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped = object!(parse_json!(encode_json(__mapped)))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __copy = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __repr = ""
  for_each(flatten(__mapped)) -> |path, value| {
      __p = encode_json(path)
      if is_array(value) {
          for_each(array!(value)) -> |_i, item| {
              if is_object(item) {
                  for_each(flatten(object!(item))) -> |sub, leaf| {
                      __q = encode_json(path + "." + sub)
                      if is_array(leaf) {
                          for_each(array!(leaf)) -> |_j, x| {
                              if !is_object(x) && !is_array(x) {
                                  __repr = __repr + ("," + __q + "=" + encode_json(encode_json(x)))
                                  if is_string(x) || is_float(x) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(x))) }
                              }
                          }
                      } else {
                          __repr = __repr + ("," + __q + "=" + encode_json(encode_json(leaf)))
                          if is_string(leaf) || is_float(leaf) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(leaf))) }
                      }
                  }
              } else if !is_array(item) {
                  __repr = __repr + ("," + __p + "=" + encode_json(encode_json(item)))
                  if is_string(item) || is_float(item) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(item))) }
              }
          }
      } else {
          __repr = __repr + ("," + __p + "=" + encode_json(encode_json(value)))
          if is_string(value) || is_float(value) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(value))) }
      }
  }
  __consumed = ""
  # BEGIN parser-specific transformations
  # receive_time: PAN receive time converted in the existing runtime timezone.
  # action: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when the expected ID is emitted.
  for_each(flatten(__source_kv)) -> |key, value| {
      if match(key, r'(?x)
      \A(?:
        receive_time
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%Y/%m/%d %H:%M:%S")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              if contains(__repr, "," + "\"time\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        action
      )\z') {
          __value = value
          if __value != null {
              __expected = get!({"allow": 1, "allowed": 1, "accept": 1, "accepted": 1, "permit": 1, "permitted": 1, "pass": 1, "passed": 1, "deny": 2, "denied": 2, "block": 2, "blocked": 2, "reject": 2, "rejected": 2, "drop": 2, "dropped": 2, "log": 3, "observed": 3}, [downcase(to_string(__value) ?? "")])
              if __expected != null {
                  if contains(__repr, "," + "\"action_id\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
              }
          }
      }
  }
  # Declared source -> target mappings (field-coverage.yaml `mappings`).
  __decl = "\n\"app_name\"\t[\"app_name\",\"dst_endpoint.svc_name\",\"evidences.dst_endpoint.svc_name\"]\n\"bytes_in\"\t[\"traffic.bytes_in\"]\n\"bytes_out\"\t[\"traffic.bytes_out\"]\n\"cfg_cmd\"\t[\"api.operation\"]\n\"cfg_path\"\t[\"resources.name\"]\n\"dst_country\"\t[\"dst_endpoint.location.country\"]\n\"dst_if\"\t[\"dst_endpoint.interface_name\",\"evidences.dst_endpoint.interface_name\"]\n\"dst_ip\"\t[\"dst_endpoint.ip\",\"evidences.dst_endpoint.ip\",\"observables.value\"]\n\"dst_port\"\t[\"dst_endpoint.port\",\"evidences.dst_endpoint.port\"]\n\"dst_zone\"\t[\"dst_endpoint.zone\",\"evidences.dst_endpoint.zone\"]\n\"duration_s\"\t[\"duration\"]\n\"end_reason\"\t[\"status_detail\"]\n\"gp_auth_method\"\t[\"auth_protocol\"]\n\"gp_host\"\t[\"src_endpoint.hostname\"]\n\"gp_reason\"\t[\"status_detail\"]\n\"hip_name\"\t[\"firewall_rule.name\",\"firewall_rule.uid\"]\n\"log_type\"\t[\"metadata.log_name\"]\n\"pkts_out\"\t[\"traffic.packets_out\"]\n\"protocol\"\t[\"connection_info.protocol_name\"]\n\"rule_name\"\t[\"firewall_rule.name\",\"firewall_rule.uid\"]\n\"serial\"\t[\"device.uid\",\"src_endpoint.uid\"]\n\"session_id\"\t[\"connection_info.uid\"]\n\"src_country\"\t[\"src_endpoint.location.country\"]\n\"src_if\"\t[\"evidences.src_endpoint.interface_name\",\"src_endpoint.interface_name\"]\n\"src_ip\"\t[\"evidences.src_endpoint.ip\",\"observables.value\",\"src_endpoint.ip\"]\n\"src_port\"\t[\"evidences.src_endpoint.port\",\"src_endpoint.port\"]\n\"src_zone\"\t[\"evidences.src_endpoint.zone\",\"src_endpoint.zone\"]\n\"subtype\"\t[\"finding_info.types\"]\n\"sys_desc\"\t[\"status_detail\"]\n\"url_category\"\t[\"http_request.url.categories\"]\n\"url_raw\"\t[\"observables.value\"]\n\"user_name\"\t[\"actor.user.name\",\"observables.value\",\"user.name\"]\n"
  __preserve = []
  # END parser-specific transformations
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__copy.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # Declared mappings: __decl holds "\n" + encode_json(key) + "\t" + JSON array of
  # target paths + "\n" per mapped source key (a raw newline never occurs in
  # compact JSON). A key is consumed when its value, or every element of a scalar
  # array, is at one of its own targets.
  for_each(__flat) -> |key, value| {
      if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
      # __decl spells a bracket inside a key as a \u escape (deploy bracket count).
      __kt = encode_json(key)
      if match(__kt, r'[\x28\x29\x5B\x5D\x7B\x7D]') {
          __kt = replace(replace(replace(replace(replace(replace(__kt, r'\x28', "\\u0028"), r'\x29', "\\u0029"), r'\x5B', "\\u005b"), r'\x5D', "\\u005d"), r'\x7B', "\\u007b"), r'\x7D', "\\u007d")
      }
      __at = find(__decl, "\n" + __kt + "\t")
      if is_integer(__at) && !is_object(value) {
          __rest = slice!(__decl, int!(__at) + strlen(__kt) + 2)
          __hit = false
          for_each(array!(parse_json!(slice!(__rest, 0, int!(find(__rest, "\n")))))) -> |_i, target| {
              __tok = "," + encode_json(target) + "="
              if !__hit && is_array(value) {
                  __all = !is_empty(array!(value))
                  for_each(array!(value)) -> |_j, item| {
                      if __all {
                          __all = !is_object(item) && !is_array(item) && (contains(__repr, __tok + encode_json(encode_json(item))) || ((is_string(item) || is_float(item)) && contains(__repr, __tok + encode_json(to_string!(item)))))
                      }
                  }
                  __hit = __all
              } else if !__hit {
                  __hit = contains(__repr, __tok + encode_json(encode_json(value))) || ((is_string(value) || is_float(value)) && contains(__repr, __tok + encode_json(to_string!(value))))
              }
          }
          if __hit { __consumed = __consumed + ("," + encode_json(key)) }
      }
  }
  # Fast path: when no two source keys decode to the same key and no two spilled
  # keys get the same name, each key's decision depends only on its own value, so
  # one filter and one rename build the residual without copying it per key.
  __distinct = true
  if __tilde {
      __distinct = length(map_keys(__flat) -> |key| { replace(replace(key, "~1", "."), "~0", "~") }) == length(__flat)
  }
  __kept = {}
  __names = {}
  if __distinct {
      __kept = filter(__flat) -> |key, value| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          # A key is kept unless an explicit mapping or transformation consumed it.
          # Do not spill a copy of the raw body.
          value != __raw_body && !contains(__consumed, "," + encode_json(key))
      }
      __names = map_keys(__kept) -> |key| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          join!(__parts, ".")
      }
  }
  __residual = {}
  if __distinct && length(__names) == length(__kept) {
      __residual = map_values(__names) -> |value| {
          if is_array(value) || is_object(value) {
              if __tilde {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              if __complex { value = encode_json(value) }
          }
          value
      }
  } else {
      # Slow path, in source key order: a name already taken gets the next free
      # _2, _3, ... suffix.
      for_each(__flat) -> |key, value| {
          key = replace(replace(key, "~1", "."), "~0", "~")
          if is_array(value) || is_object(value) {
              value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                  replace(replace(inner, "~1", "."), "~0", "~")
              }, ["v"])
          }
          __token = "," + encode_json(key)
          if !contains(__consumed, __token) && value != __raw_body {
              __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
              __base = join!(__parts, ".")
              __key = __base
              __suffix = 2
              if includes(keys(__residual), __key) {
                  for_each(__flat) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __key) {
                          __key = __base + "_" + to_string(__suffix)
                          __suffix = __suffix + 1
                      }
                  }
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              __spill = if __complex { encode_json(value) } else { value }
              __residual = set!(__residual, [__key], __spill)
          }
      }
  }
  # Keep existing derived evidence, but remove null placeholders and copies of a
  # source value (that value is mapped or spilled above under its source path).
  # A value merely equal to some mapped attribute is kept: equality with an
  # unrelated attribute is no evidence that it is represented.
  # The canonical source spill above is the authoritative representation of
  # containers. The cheap conditions run first; the source value set is built on
  # first use.
  __original_values = null
  for_each(flatten(__existing)) -> |key, value| {
      if !is_null(value) && value != "" && !is_array(value) && !is_object(value) && value != __raw_body {
          # Members for the value itself and for to_string(value), as above.
          __json = encode_json(value)
          __as_json = "," + encode_json(__json)
          __as_string = __as_json
          if is_string(value) { __as_string = "," + __json } else if is_float(value) { __as_string = "," + encode_json(to_string!(value)) }
          if __original_values == null {
              # __source_kv may hold non-JSON types (a timestamp), so only an
              # integer or a boolean skips its to_string member here.
              __original_values = join!(map_values(values(flatten(__source_kv))) -> |source_value| {
                  __source_json = encode_json(source_value)
                  __tokens = "," + encode_json(__source_json)
                  if is_string(source_value) {
                      __tokens = __tokens + "," + __source_json
                  } else if !is_object(source_value) && !is_array(source_value) && !is_integer(source_value) && !is_boolean(source_value) {
                      __tokens = __tokens + "," + encode_json(to_string(source_value) ?? "")
                  }
                  __tokens
              }, "")
          }
          __source_set = string!(__original_values)
          __keep = !contains(__source_set, __as_json) && !contains(__source_set, __as_string)
          # Only text opening an object or an array (after JSON whitespace)
          # decodes to a container.
          if __keep && is_string(value) && match(string!(value), r'^[ \t\n\r]*[\x5B\x7B]') {
              __decoded, __decode_err = parse_json(string!(value))
              __keep = !(__decode_err == null && (is_object(__decoded) || is_array(__decoded)))
          }
          if __keep {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, as-is. These
  # entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__copy.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

