source: json
transforms:
- source: created_at
  kind: epoch_ms
  format: '%+'
  target: time
  reason: The audit_log row's clock (RFC 3339, UTC) is the event time.
- source: createdAt
  kind: epoch_ms
  format: '%+'
  target: time
  reason: The audit_log row's clock in the drizzle camelCase spelling.
- source: occurred_at
  kind: epoch_ms
  format: '%+'
  target: time
  reason: A tenant-plane row's clock when its ocsf_event has no time.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
