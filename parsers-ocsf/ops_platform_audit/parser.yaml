name: ops_platform_audit_ocsf
display_name: nano Platform Audit (OCSF)
version: "1.0.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses the nano platform's own audit trail (nano-main
  services/ops-audit-export.ts) into OCSF 1.9.0. Ported from nano-main
  tools/ops-tenant/parsers/ops_platform_audit. Three record shapes share one
  lane:
    already-OCSF lines (the exporter's form): nano-main audit_log rows as API
      Activity 6003 and tenant-plane audit lines (Authentication 3002, API
      Activity 6003, Account Change 3001) pass through: class, activity,
      actor, user, api, resources, src_endpoint, http_request, status and the
      producer's metadata (uid "nano-main-audit:<id>" so re-sends dedupe,
      event_code, tenant_uid). The exporter's unmapped.organization_id is the
      actor's organization (actor.user.org.uid);
    tenant-plane rows {event_id, tenant_id, ocsf_event, occurred_at,
      actor_name, action, source, resource_*, success, status, message,
      metadata}: ocsf_event (an object or a JSON string) passes through, and a
      row without one becomes API Activity from its own fields;
    raw nano-main audit_log rows {id, organization_id, user_id, action,
      resource_type, resource_id, metadata, ip_address, user_agent,
      created_at} (snake_case or camelCase), classified by action: login /
      logout / mfa / session -> Authentication 3002 (impersonation and
      super-admin org access -> Account Switch, Impersonate), member.* ->
      Group Management 3006, user-account administration -> User Management
      3007, everything else -> API Activity 6003 with the CRUD verb of the
      action (the exporter's own rule). An action ending in _refused /
      _failed / _denied is a Failure.
  OCSF 1.9 deprecates Account Change 3001 and User Access Management 3005: they
  are re-classed User Management 3007 with the 1.9 activity of the same
  meaning (3001 Enable 2 -> 3007 Enable 4, MFA Factor Enable 10 -> Enable MFA
  Factors 12, ...). The producers never ship an e-mail or a display name: a
  user's uid is the keyed pseudonym of its e-mail (usr_<32 hex>), uid_alt the
  producer's own id. API Activity without a client address gets
  src_endpoint {"hostname": "unknown"}. Unparseable input becomes a Base Event
  with the raw line kept.
match_values:
  - ops_platform_audit
category: security
vendor: "nano"
product: "nano platform audit"
parser_vrl: |
  # NAN source timezone. Generated by scripts/residual_spill.py; edit scripts/residual/source_tz.vrl.
  # The log source's timezone setting arrives as .nano.source_timezone (an IANA
  # name such as "America/New_York", or any fixed offset such as "+05:30"), set
  # by nano at ingest. .nano is nano's input, never part of the log: it is
  # removed whole before anything else, whatever its shape.
  # For a clock that carries no offset a parser parses it AS UTC and sets
  # __lc_pending; the generated local-clock block that follows the parse
  # (local_clock.vrl) turns it into real UTC with this setting, and the spill
  # records the zone used as unmapped.nano_time_assumed_tz (the name, the offset
  # as +HH:MM, or "UTC" when the setting is absent, invalid or "local").
  __src_nano = del(.nano)
  __src_tz_in = ""
  if is_object(__src_nano) { __src_tz_in = strip_whitespace(to_string(object!(__src_nano).source_timezone) ?? "") }
  __src_tz = "UTC"
  __src_shift_ms = 0
  __src_tz_label = "UTC"
  __time_assumed = false
  __time_inline = false
  __lc_pending = false
  # No parse_* decoder here: nano infers a parser's input contract from the first
  # decoder in its program (parse_json first = a JSON-input parser, handed the
  # whole HEC / OTLP object). This prelude opens every parser, so a decoder in it
  # would turn every JSON-input parser into a text one. match + slice instead.
  if match(__src_tz_in, r'^[+-]\d{2}:?\d{2}$') {
      __src_sign = slice(__src_tz_in, 0, 1) ?? "+"
      __src_digits = replace(slice(__src_tz_in, 1) ?? "", ":", "")
      __src_hh = slice(__src_digits, 0, 2) ?? "99"
      __src_mm = slice(__src_digits, 2, 4) ?? "99"
      __src_h = to_int(__src_hh) ?? 99
      __src_m = to_int(__src_mm) ?? 99
      if __src_h <= 14 && __src_m <= 59 {
          __src_shift_ms = (__src_h * 3600 + __src_m * 60) * 1000
          if __src_sign == "-" { __src_shift_ms = 0 - __src_shift_ms }
          if __src_shift_ms != 0 { __src_tz_label = __src_sign + __src_hh + ":" + __src_mm }
      }
  } else if __src_tz_in != "" && downcase(__src_tz_in) != "local" {
      # "local" (the Vector host's zone) would make the time depend on the host.
      __src_probe, __src_probe_err = parse_timestamp("2000-01-01 00:00:00", "%Y-%m-%d %H:%M:%S", timezone: __src_tz_in)
      if __src_probe_err == null { __src_tz = __src_tz_in; __src_tz_label = __src_tz_in }
  }
  # END NAN source timezone
  # nano:input=json
  # nano platform audit (ops-audit-export) -> OCSF 1.9.0.
  raw_log = ""
  if is_string(.message) {
      raw_log = string!(.message)
  } else if is_object(.message) || is_array(.message) {
      raw_log = encode_json(.message)
  } else if exists(.message) && !is_null(.message) {
      raw_log = to_string(.message) ?? ""
  } else {
      raw_log = encode_json(.)
  }
  __raw_body = raw_log
  __source_kv = {}
  parsed, err = parse_json(raw_log)
  __source_kv = object(parsed) ?? {}

  a = object(parsed) ?? {}
  a_action = string(a.action) ?? ""
  a_ocsf = a.ocsf_event
  if is_string(a_ocsf) { a_ocsf = parse_json(string!(a_ocsf)) ?? null }
  # an already-OCSF line is its own record
  if !is_object(a_ocsf) && exists(a.class_uid) { a_ocsf = a }
  is_tenant_row = exists(a.event_id) || exists(a.tenant_id)

  sev_names = { "0": "Unknown", "1": "Informational", "2": "Low", "3": "Medium", "4": "High", "5": "Critical", "6": "Fatal" }
  status_names = { "0": "Unknown", "1": "Success", "2": "Failure" }
  # the exporter's activity rule for API Activity (ops-audit-export.ts activityOf)
  create_re = r'(^|[._:])(create|created|issue|issued|mint|register|invite|enroll|join|adopt|activate|birth|insert|grant)'
  delete_re = r'(^|[._:])(delete|destroy|revoke|purge|retire|remove|offboard|decommission|hard_delete|terminate|unsubscribe)'
  read_re = r'(^|[._:])(read|reveal|download|export|view|list)'
  update_re = r'(^|[._:])(update|set|replace|rotate|remint|rekey|change|enable|disable|unlock|promote|widen|converge|rerender|expedite)'

  if err != null || !is_object(parsed) || (!is_object(a_ocsf) && !is_tenant_row && a_action == "") {
      reason = "not a JSON object"
      if err == null && is_object(parsed) { reason = "JSON object that is not a platform audit record" }
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 0,
          "activity_name": "Unknown",
          "type_uid": 0,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": to_unix_timestamp(now(), unit: "milliseconds"),
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": sha2("ops_platform_audit|raw|" + raw_log, variant: "SHA-256"),
              "log_level": "error",
              "log_name": "audit",
              "log_provider": "nano",
              "product": { "name": "nano", "vendor_name": "nano" }
          },
          "unmapped": { "parse_error": reason }
      }
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      . = set!(., ["unmapped", "parse_fallback"], "unparsable input")
  } else {
      ev = {}
      md = {}
      time_ms = 0
      if is_object(a_ocsf) {
          # ================= pass-through of an OCSF record =================
          base = object!(a_ocsf)
          for_each(["class_uid", "class_name", "category_uid", "category_name", "activity_id", "activity_name", "message", "severity_id", "status_id", "status_detail", "status_code", "actor", "api", "src_endpoint", "dst_endpoint", "http_request", "http_response", "resources", "user", "session", "service", "auth_protocol_id", "auth_protocol", "is_mfa", "group", "privileges", "account_switch_type_id", "account_switch_type", "logon_type_id", "logon_type", "duration"]) -> |_i, k| {
              v = get(base, [k]) ?? null
              if v != null { ev = set!(ev, [k], v) }
          }
          time_ms = to_int(base.time) ?? 0
          bmd = object(base.metadata) ?? {}
          for_each(["product", "event_code", "log_name", "uid", "tenant_uid", "correlation_uid", "original_event_uid", "labels"]) -> |_i, k| {
              v = get(bmd, [k]) ?? null
              if v != null { md = set!(md, [k], v) }
          }
          # a projected tenant line carries its action only as the message (login_failed ..)
          if !exists(md.event_code) {
              p_code = string(base.api.operation) ?? ""
              if p_code == "" && match(string(base.message) ?? "", r'^[a-z][a-z0-9_.:-]{2,63}$') { p_code = string(base.message) ?? "" }
              if p_code == "" { p_code = a_action }
              if p_code != "" { md.event_code = p_code }
          }
          # the exporter: the organization the operator acted in is the actor's org
          org_uid = string(base.unmapped.organization_id) ?? ""
          if org_uid != "" && is_object(ev.actor.user) && !exists(ev.actor.user.org) {
              ev = set!(ev, ["actor", "user", "org"], { "uid": org_uid })
          }
          if is_tenant_row {
              row_id = string(a.event_id) ?? ""
              if !exists(md.uid) && row_id != "" { md.uid = row_id }
              row_tenant = string(a.tenant_id) ?? ""
              if !exists(md.tenant_uid) && row_tenant != "" { md.tenant_uid = row_tenant }
          }
      } else {
          md.product = { "name": "nano-main", "vendor_name": "nano" }
          if is_tenant_row { md.product = { "name": "nano", "vendor_name": "nano" } }
          if a_action != "" { md.event_code = a_action }
          la = downcase(a_action)
          failed = match(la, r'(refus|denied|deny|fail|reject|forbid|error)')
          status_id = 1
          if failed { status_id = 2 }
          if a.success == false { status_id = 2 }

          if is_tenant_row {
              # ================= tenant-plane row without ocsf_event =================
              aid = 99
              aname = "Other"
              if match(la, create_re) { aid = 1; aname = "Create" } else if match(la, delete_re) { aid = 4; aname = "Delete" } else if match(la, read_re) { aid = 2; aname = "Read" } else if match(la, update_re) { aid = 3; aname = "Update" }
              svc = string(a.source) ?? ""
              if svc == "" { svc = "tenant" }
              ev = {
                  "class_uid": 6003,
                  "class_name": "API Activity",
                  "category_uid": 6,
                  "category_name": "Application Activity",
                  "activity_id": aid,
                  "activity_name": aname,
                  "api": { "operation": a_action, "service": { "name": svc } },
                  "status_id": status_id
              }
              actor_name = string(a.actor_name) ?? ""
              if actor_name != "" { ev.actor = { "user": { "uid": actor_name } } }
              r = {}
              rt = string(a.resource_type) ?? ""
              if rt != "" { r.type = rt }
              ri = string(a.resource_id) ?? ""
              if ri != "" { r.uid = ri }
              rn = string(a.resource_name) ?? ""
              if rn != "" { r.name = rn }
              if r != {} { ev.resources = [r] }
              row_msg = string(a.message) ?? ""
              if row_msg != "" { ev.message = row_msg }
              row_id = string(a.event_id) ?? ""
              if row_id != "" { md.uid = row_id }
              row_tenant = string(a.tenant_id) ?? ""
              if row_tenant != "" { md.tenant_uid = row_tenant }
          } else {
              # ================= raw nano-main audit_log row =================
              o_id = string(a.organization_id) ?? string(a.organizationId) ?? ""
              u_id = string(a.user_id) ?? string(a.userId) ?? ""
              r_type = string(a.resource_type) ?? string(a.resourceType) ?? ""
              r_id = string(a.resource_id) ?? string(a.resourceId) ?? ""
              ip_raw = string(a.ip_address) ?? string(a.ipAddress) ?? ""
              # an IPv4-mapped IPv6 address names the same IPv4 host
              ip = replace(ip_raw, r'^::ffff:', "")
              ua = string(a.user_agent) ?? string(a.userAgent) ?? ""
              mdx = object(a.metadata) ?? {}
              u_pseudo = string(a.user_pseudonym) ?? string(a.userPseudonym) ?? string(mdx.pseudonym) ?? string(mdx.userPseudonym) ?? ""
              t_cand = string(a.tenant_id) ?? string(mdx.tenantId) ?? string(mdx.tenant_id) ?? ""
              if t_cand != "" { md.tenant_uid = t_cand }
              row_num = to_string(a.id) ?? ""
              if row_num != "" { md.uid = "nano-main-audit:" + row_num }
              ca, ca_err = parse_timestamp(string(a.created_at) ?? string(a.createdAt) ?? "", "%+", timezone: "UTC")
              if ca_err == null { time_ms = to_unix_timestamp(ca, unit: "milliseconds") }

              actor_user = {}
              if u_pseudo != "" {
                  actor_user.uid = u_pseudo
                  if u_id != "" { actor_user.uid_alt = u_id }
              } else if u_id != "" {
                  actor_user.uid = u_id
              }
              if o_id != "" { actor_user.org = { "uid": o_id } }
              src_ep = {}
              if is_ipv4(ip) || is_ipv6(ip) { src_ep.ip = ip }
              req = {}
              if ua != "" { req.user_agent = ua }
              m_path = string(mdx.path) ?? ""
              if m_path != "" { req.url = { "path": m_path } }
              m_method = string(mdx.method) ?? ""
              if m_method != "" { req.http_method = upcase(m_method) }
              r = {}
              if r_type != "" { r.type = r_type }
              if r_id != "" { r.uid = r_id }

              if match(la, r'(^|[._])(login|logout|logon|logoff|sign_?in|sign_?out|mfa|two_factor|totp|session|impersonat[a-z]*|super_admin_access)([._]|$)') {
                  aid = 1
                  aname = "Logon"
                  if match(la, r'logout|logoff|sign_?out|session_(ended|removed|terminated|revoked)') { aid = 2; aname = "Logoff" }
                  is_switch = match(la, r'impersonat|super_admin_access')
                  if is_switch { aid = 7; aname = "Account Switch" }
                  ev = {
                      "class_uid": 3002,
                      "class_name": "Authentication",
                      "category_uid": 3,
                      "category_name": "Identity & Access Management",
                      "activity_id": aid,
                      "activity_name": aname,
                      "service": { "name": "app.nano.rs" },
                      "status_id": status_id,
                      "is_mfa": match(la, r'mfa|two_factor|totp')
                  }
                  subject = actor_user
                  if is_switch {
                      ev.account_switch_type_id = 2
                      ev.account_switch_type = "Impersonate"
                      if actor_user != {} { ev.actor = { "user": actor_user } }
                      # impersonation names the target user; super-admin org
                      # access names the organization entered
                      if r_type == "user" && r_id != "" {
                          subject = { "uid": r_id }
                      } else if r_type == "organization" && r_id != "" {
                          subject = actor_user
                          subject.org = { "uid": r_id }
                      }
                  }
                  if subject == {} { subject = { "name": "unknown" } }
                  ev.user = subject
                  reason = string(mdx.reason) ?? ""
                  if reason != "" { ev.status_detail = reason }
              } else if starts_with(la, "member.") {
                  aid = 99
                  aname = "Other"
                  if match(la, r'^member\.(add|invite)') { aid = 3; aname = "Add User" }
                  if match(la, r'^member\.remove') { aid = 4; aname = "Remove User" }
                  if match(la, r'^member\.role_change') { aid = 1; aname = "Assign Privileges" }
                  grp = { "type": "organization" }
                  if o_id != "" { grp.uid = o_id }
                  ev = {
                      "class_uid": 3006,
                      "class_name": "Group Management",
                      "category_uid": 3,
                      "category_name": "Identity & Access Management",
                      "activity_id": aid,
                      "activity_name": aname,
                      "group": grp,
                      "status_id": status_id
                  }
                  if actor_user != {} { ev.actor = { "user": actor_user } }
                  subj = {}
                  s_uid = string(mdx.userId) ?? string(mdx.memberUserId) ?? ""
                  if s_uid == "" && r_type == "user" { s_uid = r_id }
                  s_pseudo = string(mdx.invitedPseudonym) ?? string(mdx.memberPseudonym) ?? ""
                  if s_pseudo != "" {
                      subj.uid = s_pseudo
                      if s_uid != "" { subj.uid_alt = s_uid }
                  } else if s_uid != "" {
                      subj.uid = s_uid
                  }
                  if subj != {} { ev.user = subj }
                  new_role = string(mdx.newRole) ?? string(mdx.role) ?? ""
                  if new_role != "" { ev.privileges = [new_role] }
                  if r != {} { ev.resources = [r] }
              } else if match(la, r'^(admin\.)?user\.|^user_|signup|sign_up|password') {
                  # User Management 3007, OCSF 1.9 activity ids
                  aid = 99
                  aname = "Other"
                  if match(la, r'create|signup|sign_up|register') { aid = 1; aname = "Create" }
                  if match(la, r'update|edit') { aid = 2; aname = "Update" }
                  if match(la, r'unban|enable|activate') { aid = 4; aname = "Enable" }
                  if match(la, r'(^|[._])ban$|disable|suspend') { aid = 5; aname = "Disable" }
                  if match(la, r'(^|[._])lock') { aid = 6; aname = "Lock" }
                  if match(la, r'unlock') { aid = 7; aname = "Unlock" }
                  if match(la, r'password_change|change_password') { aid = 8; aname = "Password Change" }
                  if match(la, r'password_reset|reset_password') { aid = 9; aname = "Password Reset" }
                  if match(la, r'delete') { aid = 3; aname = "Delete" }
                  ev = {
                      "class_uid": 3007,
                      "class_name": "User Management",
                      "category_uid": 3,
                      "category_name": "Identity & Access Management",
                      "activity_id": aid,
                      "activity_name": aname,
                      "status_id": status_id
                  }
                  if actor_user != {} { ev.actor = { "user": actor_user } }
                  subj = { "name": "unknown" }
                  if r_type == "user" && r_id != "" { subj = { "uid": r_id } } else if actor_user != {} { subj = actor_user }
                  ev.user = subj
                  if r != {} { ev.resources = [r] }
                  reason = string(mdx.reason) ?? ""
                  if reason != "" { ev.status_detail = reason }
              } else {
                  aid = 99
                  aname = "Other"
                  if match(la, create_re) { aid = 1; aname = "Create" } else if match(la, delete_re) { aid = 4; aname = "Delete" } else if match(la, read_re) { aid = 2; aname = "Read" } else if match(la, update_re) { aid = 3; aname = "Update" }
                  ev = {
                      "class_uid": 6003,
                      "class_name": "API Activity",
                      "category_uid": 6,
                      "category_name": "Application Activity",
                      "activity_id": aid,
                      "activity_name": aname,
                      "api": { "operation": a_action, "service": { "name": "app.nano.rs" } },
                      "status_id": status_id
                  }
                  if actor_user != {} { ev.actor = { "user": actor_user } }
                  if r != {} { ev.resources = [r] }
                  refusal = string(mdx.refusal) ?? ""
                  if refusal != "" { ev.status_detail = refusal }
              }
              if src_ep != {} { ev.src_endpoint = src_ep }
              if req != {} { ev.http_request = req }
              msg = a_action
              if r_type != "" { msg = msg + " " + r_type }
              if r_id != "" { msg = msg + " " + r_id }
              ev.message = msg
          }
          if failed && !exists(ev.severity_id) { ev.severity_id = 2 }
      }

      if time_ms == 0 {
          oa, oa_err = parse_timestamp(string(a.occurred_at) ?? "", "%+", timezone: "UTC")
          if oa_err == null { time_ms = to_unix_timestamp(oa, unit: "milliseconds") }
      }
      if time_ms == 0 { time_ms = to_unix_timestamp(now(), unit: "milliseconds") }

      # ---- OCSF 1.9: Account Change 3001 / User Access Management 3005 are deprecated ----
      cls = to_int(ev.class_uid) ?? 0
      act = to_int(ev.activity_id) ?? 0
      if cls == 3001 {
          remap = { "1": [1, "Create"], "2": [4, "Enable"], "3": [8, "Password Change"], "4": [9, "Password Reset"], "5": [5, "Disable"], "6": [3, "Delete"], "7": [10, "Attach Policies"], "8": [11, "Detach Policies"], "9": [6, "Lock"], "10": [12, "Enable MFA Factors"], "11": [13, "Disable MFA Factors"], "12": [7, "Unlock"] }
          to = array(get(remap, [to_string(act)]) ?? [99, "Other"]) ?? [99, "Other"]
          ev.activity_id = to_int(to[0]) ?? 99
          ev.activity_name = string(to[1]) ?? "Other"
          ev.class_uid = 3007
          ev.class_name = "User Management"
          cls = 3007
      }
      if cls == 3005 {
          remap = { "1": [14, "Assign Privileges"], "2": [15, "Remove Privileges"], "3": [16, "Assign Roles"], "4": [17, "Remove Roles"] }
          to = array(get(remap, [to_string(act)]) ?? [99, "Other"]) ?? [99, "Other"]
          ev.activity_id = to_int(to[0]) ?? 99
          ev.activity_name = string(to[1]) ?? "Other"
          ev.class_uid = 3007
          ev.class_name = "User Management"
          cls = 3007
      }
      # ---- required attributes the record does not carry ----
      if cls == 6003 {
          if !exists(ev.actor) { ev.actor = { "user": { "name": "unknown" } } }
          if !exists(ev.src_endpoint) { ev.src_endpoint = { "hostname": "unknown" } }
          if !exists(ev.api.operation) { ev.api = { "operation": string(md.event_code) ?? "unknown", "service": { "name": "nano" } } }
      }
      if (cls == 3002 || cls == 3007) && !exists(ev.user) {
          ev.user = object(ev.actor.user) ?? { "name": "unknown" }
      }

      sev = 1
      if exists(ev.severity_id) { sev = to_int(ev.severity_id) ?? 1 }
      ev.severity_id = sev
      ev.severity = string(get(sev_names, [to_string(sev)]) ?? "Other") ?? "Other"
      st = to_int(ev.status_id) ?? 0
      ev.status_id = st
      ev.status = string(get(status_names, [to_string(st)]) ?? "Other") ?? "Other"
      ev.type_uid = (to_int(ev.class_uid) ?? 0) * 100 + (to_int(ev.activity_id) ?? 0)
      ev.time = time_ms
      if !exists(ev.message) { ev.message = string(md.event_code) ?? "audit" }
      ev.raw_data = raw_log
      md.version = "1.9.0"
      md.log_provider = "nano"
      if !exists(md.log_name) { md.log_name = "audit" }
      if !exists(md.product) { md.product = { "name": "nano", "vendor_name": "nano" } }
      if !exists(md.uid) { md.uid = sha2("ops_platform_audit|raw|" + raw_log, variant: "SHA-256") }
      ev.metadata = md
      . = ev
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # Values spill exactly as parsed: a parser never masks, redacts or withholds
