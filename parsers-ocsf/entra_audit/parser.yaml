name: entra_audit_ocsf
display_name: Microsoft Entra ID Audit Logs (OCSF)
version: "1.0.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses Microsoft Entra ID (Azure AD) directory audit records into OCSF 1.9.0.
  Two shapes are accepted, one record per event: the diagnostic-settings
  AuditLogs record (Event Hub or storage export, `category: AuditLogs` with the
  audit in `properties`) and the bare Microsoft Graph directoryAudit resource
  (`/auditLogs/directoryAudits`). Routing:
    * user lifecycle, password change / reset, enable / disable, security info
      (MFA method) registration and removal, directory role membership,
      service principal credential add / remove,
      app role assignment to a user or to a
      service principal (the grantee SP is the
      user, the granted role is privileges[])      -> User Management 3007
    * group lifecycle and membership, app role
      assignment to a group, a role-assignable
      group added to / removed from a role         -> Group Management 3006
    * everything else (application consent, app and service principal
      changes, policies, devices, directory)       -> API Activity 6003
  The initiator is `actor` (user or app / service principal) and the target is
  the subject (`user` / `group`); every target lands in `resources`. Role
  assignments fill `iam_roles`, security info registration fills
  `auth_factors`. Privileged changes (role assignment, application consent,
  delegated permission grants, credential adds, conditional access policy
  changes) are raised to Medium severity; failures are at least Low. This is
  the audit companion to `azure_signin` (sign-ins are not handled here). An
  Event Hubs `{"records": [...]}` or Graph `{"value": [...]}` envelope is not
  exploded in VRL: explode it upstream; one that reaches the lane is kept whole
  as a Base Event marked with unmapped.parse_fallback. metadata.uid is
  deterministic (sha256 of the audit id and activity time) so a replay dedupes.
match_values:
  - entra_audit
category: cloud
vendor: "Microsoft"
product: "Microsoft Entra ID"
parser_vrl: |
  # NAN source timezone. Generated by scripts/residual_spill.py; edit scripts/residual/source_tz.vrl.
  # The log source's timezone setting arrives as .nano.source_timezone (an IANA
  # name such as "America/New_York", or any fixed offset such as "+05:30"), set
  # by nano at ingest. .nano is nano's input, never part of the log: it is
  # removed whole before anything else, whatever its shape.
  # For a clock that carries no offset a parser parses it AS UTC and sets
  # __lc_pending; the generated local-clock block that follows the parse
  # (local_clock.vrl) turns it into real UTC with this setting, and the spill
  # records the zone used as unmapped.nano_time_assumed_tz (the name, the offset
  # as +HH:MM, or "UTC" when the setting is absent, invalid or "local").
  __src_nano = del(.nano)
  __src_tz_in = ""
  if is_object(__src_nano) { __src_tz_in = strip_whitespace(to_string(object!(__src_nano).source_timezone) ?? "") }
  __src_tz = "UTC"
  __src_shift_ms = 0
  __src_tz_label = "UTC"
  __time_assumed = false
  __time_inline = false
  __lc_pending = false
  __lc_shifted = ""
  __src_off = parse_regex(__src_tz_in, r'^(?P<sign>[+-])(?P<h>\d{2}):?(?P<m>\d{2})$') ?? {}
  if !is_empty(__src_off) {
      __src_h = to_int(__src_off.h) ?? 99
      __src_m = to_int(__src_off.m) ?? 99
      if __src_h <= 14 && __src_m <= 59 {
          __src_shift_ms = (__src_h * 3600 + __src_m * 60) * 1000
          if __src_off.sign == "-" { __src_shift_ms = 0 - __src_shift_ms }
          if __src_shift_ms != 0 { __src_tz_label = string!(__src_off.sign) + string!(__src_off.h) + ":" + string!(__src_off.m) }
      }
  } else if __src_tz_in != "" && downcase(__src_tz_in) != "local" {
      # "local" (the Vector host's zone) would make the time depend on the host.
      __src_probe, __src_probe_err = parse_timestamp("2000-01-01 00:00:00", "%Y-%m-%d %H:%M:%S", timezone: __src_tz_in)
      if __src_probe_err == null { __src_tz = __src_tz_in; __src_tz_label = __src_tz_in }
  }
  # END NAN source timezone
  # Microsoft Entra ID directory audit -> OCSF 1.9.0 (3007 / 3006 / 6003)
  raw_log = to_string(.message) ?? ""
  __raw_body = raw_log
  __source_kv = {}

  parsed, err = parse_json(raw_log)
  p = {}
  if err == null && is_object(parsed) { p = object!(parsed) }
  __source_kv = p

  # ---- which shape is this? ----
  a = {}
  diag = false
  cat_top = downcase(to_string(p.category) ?? "")
  if cat_top == "auditlogs" && is_object(p.properties) {
      a = object!(p.properties)
      diag = true
  } else if exists(p.activityDisplayName) || (exists(p.initiatedBy) && exists(p.targetResources)) {
      a = p
  }

  if length(keys(a)) == 0 {
      fb_reason = "unparsable input"
      if length(keys(p)) > 0 { fb_reason = "not an Entra ID directory audit record" }
      if is_array(p.records) || is_array(p.value) { fb_reason = "envelope: explode records upstream" }
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 0,
          "activity_name": "Unknown",
          "type_uid": 0,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": to_unix_timestamp(now(), unit: "milliseconds"),
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "profiles": ["cloud"],
              "uid": sha2("entra_audit|raw|" + raw_log, variant: "SHA-256"),
              "log_name": "AuditLogs",
              "log_provider": "Microsoft Entra ID",
              "product": { "name": "Microsoft Entra ID", "vendor_name": "Microsoft" }
          },
          "cloud": { "provider": "Azure" }
      }
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      . = set!(., ["unmapped", "parse_fallback"], fb_reason)
  } else {
      # ---- clock: the audit's own activity time, else the record time ----
      time_ms = 0
      ts_str = to_string(a.activityDateTime) ?? ""
      if ts_str == "" { ts_str = to_string(p.time) ?? "" }
      if ts_str != "" {
          t, terr = parse_timestamp(ts_str, "%+", timezone: "UTC")
          if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
      }
      if time_ms == 0 { time_ms = to_unix_timestamp(now(), unit: "milliseconds") }

      natural_id = to_string(a.id) ?? ""
      activity_display = to_string(a.activityDisplayName) ?? ""
      if activity_display == "" { activity_display = to_string(p.operationName) ?? "" }
      if activity_display == "" { activity_display = "Unknown" }
      act_l = downcase(activity_display)
      audit_cat = to_string(a.category) ?? ""
      audit_cat_l = downcase(audit_cat)
      op_type = downcase(to_string(a.operationType) ?? "")
      logged_by = to_string(a.loggedByService) ?? ""
      if logged_by == "" { logged_by = "Core Directory" }
      correlation = to_string(a.correlationId) ?? ""
      if correlation == "" { correlation = to_string(p.correlationId) ?? "" }
      tenant_id = to_string(p.tenantId) ?? ""
      if tenant_id == "" {
          tm, tmerr = parse_regex(to_string(p.resourceId) ?? "", r'(?i)^/tenants/(?P<t>[^/]+)')
          if tmerr == null { tenant_id = string(tm.t) ?? "" }
      }
      caller_ip = to_string(p.callerIpAddress) ?? ""
      if caller_ip == "<null>" { caller_ip = "" }

      # ---- result -> status ----
      result_l = downcase(to_string(a.result) ?? "")
      status_id = 0
      status_str = "Unknown"
      if result_l == "success" { status_id = 1; status_str = "Success" }
      if result_l == "failure" { status_id = 2; status_str = "Failure" }
      if result_l == "timeout" { status_id = 99; status_str = "Timeout" }

      # ---- initiator -> actor ----
      initiated = object(a.initiatedBy) ?? {}
      init_user = object(initiated.user) ?? {}
      init_app = object(initiated.app) ?? {}
      actor_user = { "name": "unknown" }
      actor = {}
      src_ip = ""
      iu_upn = to_string(init_user.userPrincipalName) ?? ""
      iu_id = to_string(init_user.id) ?? ""
      iu_name = to_string(init_user.displayName) ?? ""
      ia_name = to_string(init_app.displayName) ?? ""
      ia_spn = to_string(init_app.servicePrincipalName) ?? ""
      ia_spid = to_string(init_app.servicePrincipalId) ?? ""
      ia_appid = to_string(init_app.appId) ?? ""
      if iu_upn != "" || iu_id != "" {
          actor_user = { "type_id": 1, "type": "User" }
          actor_user.name = if iu_upn != "" { iu_upn } else if iu_name != "" { iu_name } else { iu_id }
          if contains(iu_upn, "@") { actor_user.email_addr = iu_upn }
          if iu_id != "" { actor_user.uid = iu_id }
          if iu_name != "" { actor_user.display_name = iu_name }
          src_ip = to_string(init_user.ipAddress) ?? ""
      } else if ia_name != "" || ia_spid != "" || ia_appid != "" {
          actor_user = { "type_id": 4, "type": "Service" }
          actor_user.name = if ia_name != "" { ia_name } else if ia_spn != "" { ia_spn } else if ia_appid != "" { ia_appid } else { ia_spid }
          if ia_spid != "" { actor_user.uid = ia_spid }
          if ia_name != "" { actor.app_name = ia_name }
          if ia_appid != "" { actor.app_uid = ia_appid }
          src_ip = to_string(init_app.ipAddress) ?? ""
      }
      actor.user = actor_user
      if src_ip == "" || src_ip == "<null>" { src_ip = caller_ip }

      # ---- targets -> subject user / group, role, resources[] ----
      targets = array(a.targetResources) ?? []
      subj_user = {}
      subj_group = {}
      subj_sp = {}
      # The app role's resource SP (the API, e.g. Microsoft Graph) carries the
      # AppRole.* modified properties; the grantee SP does not.
      grantee_sp = {}
      role_name = ""
      role_uid = ""
      app_role = ""
      resources = []
      for_each(targets) -> |_i, target| {
          tg = object(target) ?? {}
          t_type = to_string(tg.type) ?? ""
          t_type_l = downcase(t_type)
          t_id = to_string(tg.id) ?? ""
          t_upn = to_string(tg.userPrincipalName) ?? ""
          t_name = to_string(tg.displayName) ?? ""
          label = if t_upn != "" { t_upn } else if t_name != "" { t_name } else { t_id }
          res = { "type": t_type }
          if t_id != "" { res.uid = t_id }
          if label != "" { res.name = label }
          resources = push(resources, res)
          if t_type_l == "user" && length(keys(subj_user)) == 0 {
              subj_user = { "name": label, "type_id": 1, "type": "User" }
              if t_id != "" { subj_user.uid = t_id }
              if contains(t_upn, "@") { subj_user.email_addr = t_upn }
              if t_name != "" { subj_user.display_name = t_name }
          }
          if t_type_l == "group" && length(keys(subj_group)) == 0 {
              subj_group = { "name": label }
              if t_id != "" { subj_group.uid = t_id }
          }
          if t_type_l == "role" && role_name == "" {
              role_name = label
              role_uid = t_id
          }
          # Role membership changes carry the role as a modified property of the
          # user / group target; app role assignments carry AppRole.Value.
          t_has_app_role = false
          for_each(array(tg.modifiedProperties) ?? []) -> |_j, mp| {
                  mpo = object(mp) ?? {}
                  mp_name = to_string(mpo.displayName) ?? ""
                  if starts_with(mp_name, "AppRole.") { t_has_app_role = true }
                  if mp_name == "AppRole.Value" && app_role == "" {
                      av = to_string(mpo.newValue) ?? ""
                      if av == "" { av = to_string(mpo.oldValue) ?? "" }
                      app_role = strip_whitespace(replace(av, "\"", ""))
                  }
                  if mp_name == "Role.ObjectID" && role_uid == "" {
                      role_uid = strip_whitespace(replace(to_string(mpo.newValue) ?? "", "\"", ""))
                  }
                  if mp_name == "Role.DisplayName" && role_name == "" {
                      rv = to_string(mpo.newValue) ?? ""
                      if rv == "" { rv = to_string(mpo.oldValue) ?? "" }
                      role_name = strip_whitespace(replace(rv, "\"", ""))
                  }
          }
          if t_type_l == "serviceprincipal" {
              sp = { "name": label, "type_id": 4, "type": "Service" }
              if t_id != "" { sp.uid = t_id }
              if length(keys(subj_sp)) == 0 { subj_sp = sp }
              if !t_has_app_role && length(keys(grantee_sp)) == 0 { grantee_sp = sp }
          }
      }
      have_user = length(keys(subj_user)) > 0
      have_group = length(keys(subj_group)) > 0
      have_sp = length(keys(subj_sp)) > 0

      # ---- route and pick the activity ----
      class_uid = 6003
      activity_id = 99
      activity_name = "Other"
      is_role = contains(act_l, "member to role") || contains(act_l, "member from role")
      is_cred = act_l == "add service principal credentials" || act_l == "remove service principal credentials"
      is_secinfo = contains(act_l, "security info")
      # App role assignments are logged under ApplicationManagement, so they are
      # routed by activity name, not by audit category.
      is_app_role = starts_with(act_l, "add app role assignment") || starts_with(act_l, "remove app role assignment")
      app_role_to_group = is_app_role && have_group && (ends_with(act_l, " group") || contains(act_l, " to group") || contains(act_l, " from group"))
      app_role_to_user = is_app_role && have_user && (contains(act_l, " to user") || contains(act_l, " from user"))
      # App role (application permission) granted to / revoked from a service
      # principal: the subject is the grantee SP, not the resource API SP.
      app_role_to_sp = is_app_role && have_sp && !have_user && !have_group
      if app_role_to_sp && length(keys(grantee_sp)) > 0 { subj_sp = grantee_sp }
      # A role-assignable group added to / removed from a directory role.
      group_role = is_role && have_group && !have_user && !have_sp
      user_cat = audit_cat_l == "usermanagement" || audit_cat_l == "rolemanagement" || audit_cat_l == "userauthenticationmethod" || logged_by == "Authentication Methods" || logged_by == "Self-service Password Management"
      if app_role_to_group || group_role {
          class_uid = 3006
          if starts_with(act_l, "add app role assignment") { activity_id = 1; activity_name = "Assign Privileges" }
          if starts_with(act_l, "remove app role assignment") { activity_id = 2; activity_name = "Revoke Privileges" }
          if group_role && starts_with(act_l, "add") { activity_id = 12; activity_name = "Assign Roles" }
          if group_role && starts_with(act_l, "remove") { activity_id = 13; activity_name = "Remove Roles" }
      } else if (have_user && (user_cat || is_role || app_role_to_user)) || (have_sp && (is_role || is_cred || app_role_to_sp)) {
          class_uid = 3007
          if act_l == "add user" || act_l == "create user" || act_l == "invite external user" { activity_id = 1; activity_name = "Create" }
          if act_l == "update user" || act_l == "change user license" || act_l == "user changed default security info" { activity_id = 2; activity_name = "Update" }
          if act_l == "delete user" || act_l == "hard delete user" { activity_id = 3; activity_name = "Delete" }
          if act_l == "enable account" || act_l == "restore user" { activity_id = 4; activity_name = "Enable" }
          if act_l == "disable account" { activity_id = 5; activity_name = "Disable" }
          if contains(act_l, "change user password") || starts_with(act_l, "change password") { activity_id = 8; activity_name = "Password Change" }
          if contains(act_l, "reset user password") || starts_with(act_l, "reset password") { activity_id = 9; activity_name = "Password Reset" }
          if is_secinfo && contains(act_l, "registered") { activity_id = 12; activity_name = "Enable MFA Factors" }
          if is_secinfo && contains(act_l, "deleted") { activity_id = 13; activity_name = "Disable MFA Factors" }
          if starts_with(act_l, "add app role assignment") { activity_id = 14; activity_name = "Assign Privileges" }
          if starts_with(act_l, "remove app role assignment") { activity_id = 15; activity_name = "Remove Privileges" }
          if is_role && starts_with(act_l, "add") { activity_id = 16; activity_name = "Assign Roles" }
          if is_role && starts_with(act_l, "remove") { activity_id = 17; activity_name = "Remove Roles" }
          if act_l == "add service principal credentials" { activity_id = 18; activity_name = "Add Programmatic Credentials" }
          if act_l == "remove service principal credentials" { activity_id = 19; activity_name = "Remove Programmatic Credentials" }
      } else if have_group && audit_cat_l == "groupmanagement" {
          class_uid = 3006
          if act_l == "add group" { activity_id = 6; activity_name = "Create" }
          if act_l == "delete group" || act_l == "hard delete group" { activity_id = 5; activity_name = "Delete" }
          if act_l == "update group" { activity_id = 9; activity_name = "Update" }
          if act_l == "add member to group" { activity_id = 3; activity_name = "Add User" }
          if act_l == "remove member from group" { activity_id = 4; activity_name = "Remove User" }
          if starts_with(act_l, "add app role assignment") { activity_id = 1; activity_name = "Assign Privileges" }
          if starts_with(act_l, "remove app role assignment") { activity_id = 2; activity_name = "Revoke Privileges" }
      } else {
          if op_type == "add" || op_type == "create" { activity_id = 1; activity_name = "Create" }
          if op_type == "update" || op_type == "assign" || op_type == "unassign" { activity_id = 3; activity_name = "Update" }
          if op_type == "delete" || op_type == "remove" { activity_id = 4; activity_name = "Delete" }
          # The activity verb is more precise than operationType ("Consent to
          # application" and "Add delegated permission grant" are typed Assign).
          if starts_with(act_l, "add ") || starts_with(act_l, "consent to ") { activity_id = 1; activity_name = "Create" }
          if starts_with(act_l, "update ") || starts_with(act_l, "set ") { activity_id = 3; activity_name = "Update" }
          if starts_with(act_l, "delete ") || starts_with(act_l, "remove ") || starts_with(act_l, "hard delete ") || starts_with(act_l, "revoke ") { activity_id = 4; activity_name = "Delete" }
      }

      # ---- severity: privileged changes Medium, failures at least Low ----
      severity_id = 1
      severity = "Informational"
      if (is_role && starts_with(act_l, "add")) || act_l == "consent to application" || starts_with(act_l, "add delegated permission grant") || act_l == "add app role assignment to service principal" || act_l == "add service principal credentials" || contains(act_l, "conditional access policy") || act_l == "add owner to application" || act_l == "add owner to service principal" {
          severity_id = 3
          severity = "Medium"
      }
      if status_id == 2 && severity_id < 2 { severity_id = 2; severity = "Low" }

      ocsf = {
          "class_uid": class_uid,
          "category_uid": 3,
          "category_name": "Identity & Access Management",
          "activity_id": activity_id,
          "activity_name": activity_name,
          "type_uid": class_uid * 100 + activity_id,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": status_id,
          "status": status_str,
          "time": time_ms,
          "message": activity_display,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "profiles": ["cloud"],
              "log_name": "AuditLogs",
              "log_provider": logged_by,
              "product": { "name": "Microsoft Entra ID", "vendor_name": "Microsoft" }
          },
          "api": { "operation": activity_display, "service": { "name": logged_by } },
          "actor": actor
      }
      if class_uid == 3007 {
          ocsf.class_name = "User Management"
          ocsf.user = if have_user { subj_user } else { subj_sp }
          if role_name != "" {
              role = { "name": role_name }
              if role_uid != "" { role.uid = role_uid }
              ocsf.iam_roles = [role]
          }
          if app_role != "" && (activity_id == 14 || activity_id == 15) { ocsf.privileges = [app_role] }
          if activity_id == 12 || activity_id == 13 {
              # The registered method is only named in resultReason ("User registered Mobile Phone SMS").
              rr = downcase(to_string(a.resultReason) ?? "")
              factor_id = 99
              factor = "Other"
              if contains(rr, "sms") { factor_id = 1; factor = "SMS" }
              if contains(rr, "authenticator") || contains(rr, "notification") { factor_id = 5; factor = "Push Notification" }
              if contains(rr, "phone call") || contains(rr, "voice") { factor_id = 3; factor = "Phone Call" }
              if contains(rr, "fido") || contains(rr, "passkey") { factor_id = 10; factor = "WebAuthn" }
              if contains(rr, "email") { factor_id = 8; factor = "Email" }
              if contains(rr, "security question") { factor_id = 2; factor = "Security Question" }
              if contains(rr, "software oath") || contains(rr, "hardware oath") { factor_id = 7; factor = "OTP" }
              if contains(rr, "windows hello") { factor_id = 4; factor = "Biometric" }
              ocsf.auth_factors = [{ "factor_type_id": factor_id, "factor_type": factor, "provider": "Microsoft Entra ID" }]
          }
      } else if class_uid == 3006 {
          ocsf.class_name = "Group Management"
          ocsf.group = subj_group
          if have_user { ocsf.user = subj_user }
          if role_name != "" {
              grole = { "name": role_name }
              if role_uid != "" { grole.uid = role_uid }
              ocsf.iam_roles = [grole]
          }
          if app_role != "" && (activity_id == 1 || activity_id == 2) { ocsf.privileges = [app_role] }
      } else {
          ocsf.class_name = "API Activity"
          ocsf.category_uid = 6
          ocsf.category_name = "Application Activity"
      }
      if src_ip != "" {
          ocsf.src_endpoint = { "ip": downcase(src_ip) }
      } else if class_uid == 6003 {
          ocsf.src_endpoint = { "ip": "0.0.0.0" }
      }
      if length(resources) > 0 { ocsf.resources = resources }
      reason = to_string(a.resultReason) ?? ""
      if reason != "" { ocsf.status_detail = reason }
      if audit_cat != "" { ocsf.metadata.event_code = audit_cat }
      if correlation != "" { ocsf.metadata.correlation_uid = correlation }

      # ---- user agent: properties.userAgent, else the User-Agent additional detail ----
      ua = to_string(a.userAgent) ?? ""
      for_each(array(a.additionalDetails) ?? []) -> |_k, d| {
          dd = object(d) ?? {}
          if ua == "" && downcase(to_string(dd.key) ?? "") == "user-agent" { ua = to_string(dd.value) ?? "" }
      }
      if ua != "" { ocsf.http_request = { "user_agent": ua } }

      cloud = { "provider": "Azure" }
      if tenant_id != "" {
          cloud.account = { "uid": tenant_id }
          cloud.org = { "uid": tenant_id }
      }
      ocsf.cloud = cloud

      uid_src = if natural_id != "" { "entra_audit|" + natural_id + "|" + ts_str } else { "entra_audit|raw|" + raw_log }
      ocsf.metadata.uid = sha2(uid_src, variant: "SHA-256")
      if natural_id != "" { ocsf.metadata.original_event_uid = natural_id }
      if !diag { ocsf.metadata.log_name = "directoryAudits" }
      . = ocsf
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # Values spill exactly as parsed: a parser never masks, redacts or withholds
  # anything (masking is an opt-in pipeline step, never a parser concern).
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
