              # timezone, a year rollover) is matched by its converted value.
              if __lc_shifted != "" && !(contains(__repr, "," + "\"time\"" + "=" + encode_json(encode_json(__expected)))) {
                  __lc_at = find(__lc_shifted, "\n" + to_string(__expected) + "\t")
                  if is_integer(__lc_at) {
                      __lc_rest = slice!(__lc_shifted, int!(__lc_at) + strlen(to_string(__expected)) + 2)
                      __expected = to_int(slice!(__lc_rest, 0, int!(find(__lc_rest, "\n")))) ?? __expected
                  }
              }
              if contains(__repr, "," + "\"time\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        properties\.result
      | result
      )\z') {
          __value = value
          if __value != null {
              __expected = get!({"success": "Success", "failure": "Failure", "timeout": "Timeout"}, [downcase(to_string(__value) ?? "")])
              if __expected != null {
                  if contains(__repr, "," + "\"status\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
              }
          }
      }
  }
  # Declared source -> target mappings (field-coverage.yaml `mappings`).
  __decl = "\n\"activityDisplayName\"\t[\"api.operation\",\"message\"]\n\"callerIpAddress\"\t[\"src_endpoint.ip\"]\n\"category\"\t[\"metadata.event_code\"]\n\"correlationId\"\t[\"metadata.correlation_uid\"]\n\"id\"\t[\"metadata.original_event_uid\"]\n\"initiatedBy.app.appId\"\t[\"actor.app_uid\"]\n\"initiatedBy.app.displayName\"\t[\"actor.app_name\",\"actor.user.name\"]\n\"initiatedBy.app.servicePrincipalId\"\t[\"actor.user.uid\"]\n\"initiatedBy.user.displayName\"\t[\"actor.user.display_name\"]\n\"initiatedBy.user.id\"\t[\"actor.user.uid\"]\n\"initiatedBy.user.ipAddress\"\t[\"src_endpoint.ip\"]\n\"initiatedBy.user.userPrincipalName\"\t[\"actor.user.email_addr\",\"actor.user.name\"]\n\"loggedByService\"\t[\"api.service.name\",\"metadata.log_provider\"]\n\"properties.activityDisplayName\"\t[\"api.operation\",\"message\"]\n\"properties.category\"\t[\"metadata.event_code\"]\n\"properties.correlationId\"\t[\"metadata.correlation_uid\"]\n\"properties.id\"\t[\"metadata.original_event_uid\"]\n\"properties.initiatedBy.app.displayName\"\t[\"actor.app_name\",\"actor.user.name\"]\n\"properties.initiatedBy.app.servicePrincipalId\"\t[\"actor.user.uid\"]\n\"properties.initiatedBy.user.displayName\"\t[\"actor.user.display_name\"]\n\"properties.initiatedBy.user.id\"\t[\"actor.user.uid\"]\n\"properties.initiatedBy.user.ipAddress\"\t[\"src_endpoint.ip\"]\n\"properties.initiatedBy.user.userPrincipalName\"\t[\"actor.user.email_addr\",\"actor.user.name\"]\n\"properties.loggedByService\"\t[\"api.service.name\",\"metadata.log_provider\"]\n\"properties.resultReason\"\t[\"status_detail\"]\n\"resultReason\"\t[\"status_detail\"]\n\"tenantId\"\t[\"cloud.account.uid\",\"cloud.org.uid\"]\n"
  __preserve = []
  # END parser-specific transformations
  # Declared mappings: __decl holds "\n" + encode_json(key) + "\t" + JSON array of
  # target paths + "\n" per mapped source key (a raw newline never occurs in
  # compact JSON). A key is consumed when its value, or every element of a scalar
  # array, is at one of its own targets. Keys stay ESCAPED here and in __consumed:
  # a literal dotted key ("a~1b") and the nested path ("a.b") are different
  # fields, and mapping one never consumes the other.
  for_each(__flat) -> |key, value| {
      # __decl spells a bracket inside a key as a \u escape (deploy bracket count).
      __kt = encode_json(key)
      if match(__kt, r'[\x28\x29\x5B\x5D\x7B\x7D]') {
          __kt = replace(replace(replace(replace(replace(replace(__kt, r'\x28', "\\u0028"), r'\x29', "\\u0029"), r'\x5B', "\\u005b"), r'\x5D', "\\u005d"), r'\x7B', "\\u007b"), r'\x7D', "\\u007d")
      }
