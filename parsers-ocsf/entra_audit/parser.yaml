      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # BEGIN parser-specific transformations
  # properties.activityDateTime: Successful ISO timestamp conversion to the selected event clock in milliseconds.
  # activityDateTime: Successful ISO timestamp conversion to the selected event clock in milliseconds.
  # properties.result: Entra audit result normalized to the OCSF status caption; verify the emitted caption.
  # result: Entra audit result normalized to the OCSF status caption; verify the emitted caption.
  for_each(__flat) -> |key, value| {
      if match(key, r'(?x)
      \A(?:
        properties\.activityDateTime
      | activityDateTime
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%+", timezone: "UTC")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
