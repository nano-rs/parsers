source: text
transforms:
- source: event.mac
  kind: lowercase
  reason: Case normalization already performed by the parser; observed at src_endpoint.mac,
    and checked against the emitted branch.
- source: event.proto
  kind: lowercase
  reason: Case normalization already performed by the parser; observed at connection_info.protocol_name,
    and checked against the emitted branch.
- source: event.proto
  kind: enum
  target: connection_info.protocol_num
  values:
    tcp: 6
    udp: 17
    icmp: 1
    icmpv6: 58
    ipv6-icmp: 58
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping;
    consume only when the expected ID is emitted.
consumed_candidates:
- event.action
- event.answer
- event.chain
- event.dir
- event.dst_ip
- event.dst_port
- event.in_if
- event.ip
- event.len
- event.mac
- event.out_if
- event.proto
- event.qid
- event.qname
- event.qtype
- event.server
- event.src_ip
- event.src_port
- event.user
- event.via
- header.host
- header.pri
- header.rest
- header.topics
- header.ts
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
