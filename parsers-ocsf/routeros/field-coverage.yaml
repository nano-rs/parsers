source: text
transforms:
- source: event.mac
  kind: lowercase
  target: observables.value
  reason: Case normalization already performed by the parser; observed at src_endpoint.mac, and checked
    against the emitted branch.
- source: event.mac
  kind: lowercase
  target: src_endpoint.mac
  reason: Case normalization already performed by the parser; observed at src_endpoint.mac, and checked
    against the emitted branch.
- source: event.proto
  kind: lowercase
  target: connection_info.protocol_name
  reason: Case normalization already performed by the parser; observed at connection_info.protocol_name,
    and checked against the emitted branch.
- source: event.proto
  kind: enum
  target: connection_info.protocol_num
  values:
    tcp: 6
    udp: 17
    icmp: 1
    icmpv6: 58
    ipv6-icmp: 58
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when
    the expected ID is emitted.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  event.answer:
  - answers.rdata
  event.dst_ip:
  - dst_endpoint.ip
  - observables.value
  event.dst_port:
  - dst_endpoint.port
  event.in_if:
  - src_endpoint.interface_name
  event.ip:
  - src_endpoint.ip
  event.len:
  - traffic.bytes_out
  event.mac:
  - src_endpoint.mac
  event.out_if:
  - dst_endpoint.interface_name
  event.qid:
  - transaction_id
  event.qname:
  - observables.value
  - query.hostname
  event.qtype:
  - query.type
  event.src_ip:
  - observables.value
  - src_endpoint.ip
  event.src_port:
  - src_endpoint.port
  event.user:
  - actor.user.name
  - observables.value
  - user.name
  event.via:
  - logon_type
  header.host:
  - device.hostname
  - dst_endpoint.hostname
  header.topics:
  - metadata.log_name
