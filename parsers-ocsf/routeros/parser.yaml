    activity_id: 5
    src_endpoint.ip: 10.20.0.9
    disposition_id: 1
- raw: <30>Aug  5 12:00:00 edge-rtr dhcp,info dhcp1 deassigned 10.20.0.9 from 00:16:3E:AA:BB:CC
  expect:
    class_uid: 4004
    activity_id: 7
    src_endpoint.ip: 10.20.0.9
    disposition_id: 1
