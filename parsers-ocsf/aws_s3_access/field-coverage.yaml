source: text
transforms:
- source: time
  kind: epoch_ms
  target: time
  format: '%d/%b/%Y:%H:%M:%S %z'
  reason: Parsed access-log timestamp converted to event milliseconds.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  bucket:
  - resources.name
  bytes_sent:
  - http_response.length
  error_code:
  - status_code
  - status_detail
  http_status:
  - http_response.code
  key:
  - resources.name
  operation:
  - api.operation
  referer:
  - http_request.referrer
  remote_ip:
  - src_endpoint.ip
  request_id:
  - api.request.uid
  - http_request.uid
  requester:
  - actor.user.uid
  total_time:
  - duration
  user_agent:
  - http_request.user_agent
