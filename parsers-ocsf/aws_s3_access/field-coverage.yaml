source: text
transforms:
- source: time
  kind: epoch_ms
  target: time
  format: '%d/%b/%Y:%H:%M:%S %z'
  reason: Parsed access-log timestamp converted to event milliseconds.
consumed_candidates:
- bucket
- bucket_owner
- bytes_sent
- error_code
- http_status
- key
- object_size
- operation
- referer
- remote_ip
- request_id
- request_uri
- requester
- time
- total_time
- turn_around_time
- user_agent
- version_id
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
