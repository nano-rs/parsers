name: google_workspace_ocsf
display_name: Google Workspace Audit (OCSF)
version: "1.4.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses Google Workspace Admin SDK Reports API activities into complete OCSF
  1.9.0 records, routed by id.applicationName and the primary event name:
    login                              -> Authentication 3002
    admin + user-lifecycle event names -> User Management 3007
    admin + group event names          -> Group Management 3006
    admin (everything else) and token  -> API Activity 6003
    drive                              -> File Hosting Activity 6006
  One activity carries an `events[]` array; the PRIMARY event (the one whose
  parameters carry `primary_event: true`) drives the mapping, falling back to
  `events[0]` when no event is flagged. Every event name is listed, comma-joined
  in order, in `unmapped.event_names`, and the whole array stays available, so
  the nano row count still matches the Google audit-record count.
  `events[].parameters[]` is flattened into `unmapped.params` with dots in
  parameter names replaced by underscores — dotted keys under `unmapped` wedge
  lake publication.
  On admin events the Google `actor` is the administrator (`actor.user`) and the
  USER_EMAIL / affected parameter names the subject (`user`).
match_values:
  - gws_login
  - gws_admin
  - gws_token
  - gws_drive
  - google_workspace
category: cloud
vendor: "Google"
product: "Google Workspace"
parser_vrl: |
  # NAN source timezone. Generated by scripts/residual_spill.py; edit scripts/residual/source_tz.vrl.
  # The log source's timezone setting arrives as .nano.source_timezone (an IANA
  # name such as "America/New_York", or any fixed offset such as "+05:30"), set
  # by nano at ingest. .nano is nano's input, never part of the log: it is
  # removed whole before anything else, whatever its shape.
  # For a clock that carries no offset a parser parses it AS UTC and sets
  # __lc_pending; the generated local-clock block that follows the parse
  # (local_clock.vrl) turns it into real UTC with this setting, and the spill
  # records the zone used as unmapped.nano_time_assumed_tz (the name, the offset
  # as +HH:MM, or "UTC" when the setting is absent, invalid or "local").
  __src_nano = del(.nano)
  __src_tz_in = ""
  if is_object(__src_nano) { __src_tz_in = strip_whitespace(to_string(object!(__src_nano).source_timezone) ?? "") }
  __src_tz = "UTC"
  __src_shift_ms = 0
  __src_tz_label = "UTC"
  __time_assumed = false
  __time_inline = false
  __lc_pending = false
  __src_off = parse_regex(__src_tz_in, r'^(?P<sign>[+-])(?P<h>\d{2}):?(?P<m>\d{2})$') ?? {}
  if !is_empty(__src_off) {
      __src_h = to_int(__src_off.h) ?? 99
      __src_m = to_int(__src_off.m) ?? 99
      if __src_h <= 14 && __src_m <= 59 {
          __src_shift_ms = (__src_h * 3600 + __src_m * 60) * 1000
          if __src_off.sign == "-" { __src_shift_ms = 0 - __src_shift_ms }
          if __src_shift_ms != 0 { __src_tz_label = string!(__src_off.sign) + string!(__src_off.h) + ":" + string!(__src_off.m) }
      }
  } else if __src_tz_in != "" && downcase(__src_tz_in) != "local" {
      # "local" (the Vector host's zone) would make the time depend on the host.
      __src_probe, __src_probe_err = parse_timestamp("2000-01-01 00:00:00", "%Y-%m-%d %H:%M:%S", timezone: __src_tz_in)
      if __src_probe_err == null { __src_tz = __src_tz_in; __src_tz_label = __src_tz_in }
  }
  # END NAN source timezone
  # Google Workspace Reports API activity JSON -> OCSF 1.9.0.
  raw_log = string!(.message)
  __raw_body = raw_log
  __source_kv = {}
  parsed, err = parse_json(raw_log)
  __source_kv = object(parsed) ?? {}

  if err != null || !is_object(parsed) {
      # Unparseable input is emitted as an OCSF Base Event (class_uid 0)
      # rather than being guessed into a security class: it stays valid, and
      # therefore visible, without fabricating a user or an outcome.
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 0,
          "activity_name": "Unknown",
          "type_uid": 0,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": 0,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": sha2("google_workspace|raw|" + raw_log, variant: "SHA-256"),
              "log_level": "error",
              "log_name": "Google Workspace Reports",
              "log_provider": "Google Workspace",
              "product": { "name": "Google Workspace", "vendor_name": "Google" }
          },
          "unmapped": { "parse_error": "not a JSON object" }
      }
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      . = set!(., ["unmapped", "parse_fallback"], "unparsable input")
  } else {
      p = object!(parsed)
      id = object(p.id) ?? {}
      actor_in = object(p.actor) ?? {}
      actor_app = object(actor_in.applicationInfo) ?? {}
      net = object(p.networkInfo) ?? {}

      app = downcase(string(id.applicationName) ?? "")

      # ---- time: id.time is RFC3339 in practice, epoch seconds historically ----
      time_ms = 0
      time_raw = to_string(id.time) ?? ""
      if time_raw != "" {
          t, terr = parse_timestamp(time_raw, "%+", timezone: "UTC")
          if terr == null {
              time_ms = to_unix_timestamp(t, unit: "milliseconds")
          } else {
              epoch = to_int(time_raw) ?? 0
              if epoch > 0 { time_ms = epoch * 1000 }
          }
      }

      # ---- primary event + flattened parameters ----
      # One activity often carries several events (a Drive upload arrives as
      # edit, upload, change_user_access, change_acl_editors, add_to_folder).
      # Google flags the one the user actually performed with the parameter
      # primary_event=true; it drives the mapping. With no primary flag (or a
      # single event) events[0] does, as before. Every event name stays
      # visible in unmapped.event_names.
      events_arr = array(p.events) ?? []
      chosen = {}
      if length(events_arr) > 0 { chosen = object(events_arr[0]) ?? {} }
      have_primary = false
      event_names = []
      for_each(events_arr) -> |_ei, ev| {
          eo = object(ev) ?? {}
          ev_name = string(eo.name) ?? ""
          if ev_name != "" { event_names = push(event_names, ev_name) }
          if !have_primary {
              for_each(array(eo.parameters) ?? []) -> |_pi, eprm| {
                  epo = object(eprm) ?? {}
                  if (string(epo.name) ?? "") == "primary_event" && downcase(to_string(epo.boolValue) ?? "") == "true" {
                      have_primary = true
                  }
              }
              if have_primary { chosen = eo }
          }
      }
      event_name = string(chosen.name) ?? ""
      event_kind = string(chosen.type) ?? ""

      params = {}
      for_each(array(chosen.parameters) ?? []) -> |_i, prm| {
          po = object(prm) ?? {}
          pname = to_string(po.name) ?? ""
          if pname != "" {
              # Dots in an unmapped key wedge lake publication.
              key = replace(pname, ".", "_")
              if exists(po.value) {
                  params = set!(params, [key], to_string(po.value) ?? "")
              } else if exists(po.intValue) {
                  params = set!(params, [key], to_string(po.intValue) ?? "")
              } else if exists(po.boolValue) {
                  params = set!(params, [key], to_string(po.boolValue) ?? "")
              } else if exists(po.multiValue) {
                  params = set!(params, [key], encode_json(array(po.multiValue) ?? []))
              }
          }
      }

      # ---- acting principal ----
      actor_email = string(actor_in.email) ?? ""
      actor_user = { "name": downcase(actor_email) }
      if actor_email == "" { actor_user = { "name": "unknown" } }
      profile_id = to_string(actor_in.profileId) ?? ""
      if profile_id != "" { actor_user = set!(actor_user, ["uid"], profile_id) }
      if match(actor_email, r'^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$') {
          actor_user = set!(actor_user, ["email_addr"], downcase(actor_email))
          ap = split(actor_email, "@")
          if length(ap) == 2 { actor_user = set!(actor_user, ["domain"], downcase(string(ap[1]) ?? "")) }
      }

      # ---- subject user named by the admin event parameters ----
      subj_email = string(params.USER_EMAIL) ?? string(params.affected_email_address) ?? string(params.NEW_VALUE) ?? ""
      have_subject = match(subj_email, r'^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$')
      subject = { "name": downcase(subj_email), "email_addr": downcase(subj_email) }

      group_email = string(params.GROUP_EMAIL) ?? ""

      # ---- class routing ----
      is_usermgmt = event_name == "CREATE_USER" || event_name == "DELETE_USER" || event_name == "SUSPEND_USER" ||
                    event_name == "UNSUSPEND_USER" || event_name == "CHANGE_PASSWORD" || event_name == "CHANGE_PASSWORD_ON_NEXT_LOGIN" ||
                    event_name == "GRANT_ADMIN_PRIVILEGE" || event_name == "REVOKE_ADMIN_PRIVILEGE" ||
                    event_name == "GRANT_DELEGATED_ADMIN_PRIVILEGES" || event_name == "REVOKE_DELEGATED_ADMIN_PRIVILEGES" ||
                    event_name == "UNENROLL_USER_FROM_STRONG_AUTH" || event_name == "ENROLL_USER_IN_STRONG_AUTH" ||
                    event_name == "TURN_OFF_2_STEP_VERIFICATION" || event_name == "RENAME_USER" ||
                    event_name == "MOVE_USER_TO_ORG_UNIT" || event_name == "ARCHIVE_USER" || event_name == "UNARCHIVE_USER"
      is_groupmgmt = event_name == "CREATE_GROUP" || event_name == "DELETE_GROUP" || event_name == "ADD_GROUP_MEMBER" ||
                     event_name == "REMOVE_GROUP_MEMBER" || event_name == "UPDATE_GROUP_MEMBER" ||
                     event_name == "UPDATE_GROUP_SETTING" || event_name == "CHANGE_GROUP_NAME" || group_email != ""

      class_uid = 6003
      if app == "login" {
          class_uid = 3002
      } else if app == "drive" {
          class_uid = 6006
      } else if is_usermgmt {
          class_uid = 3007
      } else if is_groupmgmt {
          class_uid = 3006
      }

      status_id = 1
      status_str = "Success"
      severity_id = 1
      severity = "Informational"

      ocsf = {}

      if class_uid == 3002 {
          activity_id = 1
          activity_name = "Logon"
          if event_name == "logout" { activity_id = 2; activity_name = "Logoff" }
          if event_name == "login_failure" {
              status_id = 2; status_str = "Failure"; severity_id = 2; severity = "Low"
          } else if event_name == "login_success" {
              status_id = 1; status_str = "Success"
          } else if event_name != "logout" {
              status_id = 0; status_str = "Unknown"
          }
          if event_name == "suspicious_login" || event_name == "suspicious_login_less_secure_app" {
              severity_id = 4; severity = "High"
          }

          ocsf.class_uid = 3002
          ocsf.class_name = "Authentication"
          ocsf.category_uid = 3
          ocsf.category_name = "Identity & Access Management"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          # Authentication 3002 carries the authenticating principal in `user`.
          ocsf.user = actor_user
          ocsf.service = { "name": "Google Workspace" }
          ocsf.is_remote = true

          # login_type distinguishes password / saml / google_password /
          # exchange — the field that shows whether SSO was bypassed.
          login_type = string(params.login_type) ?? ""
          if login_type != "" {
              lt = downcase(login_type)
              ap_id = 99
              if lt == "saml" { ap_id = 5 }
              if lt == "oauth" || lt == "exchange" { ap_id = 6 }
              ocsf.auth_protocol_id = ap_id
              ocsf.auth_protocol = login_type
          }
          challenge = string(params.login_challenge_method) ?? ""
          ocsf.is_mfa = challenge != "" || downcase(login_type) == "2sv"
          if challenge != "" { ocsf.status_detail = challenge }
      } else if class_uid == 3007 {
          activity_id = 2
          activity_name = "Update"
          if event_name == "CREATE_USER" { activity_id = 1; activity_name = "Create" }
          if event_name == "DELETE_USER" { activity_id = 3; activity_name = "Delete" }
          if event_name == "UNSUSPEND_USER" || event_name == "UNARCHIVE_USER" { activity_id = 4; activity_name = "Enable" }
          if event_name == "SUSPEND_USER" || event_name == "ARCHIVE_USER" { activity_id = 5; activity_name = "Disable" }
          if event_name == "CHANGE_PASSWORD" { activity_id = 8; activity_name = "Password Change" }
          if event_name == "CHANGE_PASSWORD_ON_NEXT_LOGIN" { activity_id = 9; activity_name = "Password Reset" }
          if event_name == "ENROLL_USER_IN_STRONG_AUTH" { activity_id = 12; activity_name = "Enable MFA Factors" }
          if event_name == "UNENROLL_USER_FROM_STRONG_AUTH" || event_name == "TURN_OFF_2_STEP_VERIFICATION" { activity_id = 13; activity_name = "Disable MFA Factors" }
          if event_name == "GRANT_ADMIN_PRIVILEGE" || event_name == "GRANT_DELEGATED_ADMIN_PRIVILEGES" { activity_id = 14; activity_name = "Assign Privileges" }
          if event_name == "REVOKE_ADMIN_PRIVILEGE" || event_name == "REVOKE_DELEGATED_ADMIN_PRIVILEGES" { activity_id = 15; activity_name = "Remove Privileges" }

          ocsf.class_uid = 3007
          ocsf.class_name = "User Management"
          ocsf.category_uid = 3
          ocsf.category_name = "Identity & Access Management"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          if have_subject { ocsf.user = subject } else { ocsf.user = actor_user }
          ocsf.actor = { "user": actor_user }
          priv = string(params.PRIVILEGE_NAME) ?? ""
          if priv != "" { ocsf.privileges = [priv] }
      } else if class_uid == 3006 {
          activity_id = 99
          activity_name = "Other"
          if event_name == "CREATE_GROUP" { activity_id = 6; activity_name = "Create" }
          if event_name == "DELETE_GROUP" { activity_id = 5; activity_name = "Delete" }
          if event_name == "ADD_GROUP_MEMBER" { activity_id = 3; activity_name = "Add User" }
          if event_name == "REMOVE_GROUP_MEMBER" { activity_id = 4; activity_name = "Remove User" }
          if event_name == "UPDATE_GROUP_SETTING" || event_name == "CHANGE_GROUP_NAME" || event_name == "UPDATE_GROUP_MEMBER" { activity_id = 9; activity_name = "Update" }

          ocsf.class_uid = 3006
          ocsf.class_name = "Group Management"
          ocsf.category_uid = 3
          ocsf.category_name = "Identity & Access Management"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          gname = group_email
          if gname == "" { gname = "unknown" }
          ocsf.group = { "name": gname }
          if have_subject { ocsf.user = subject }
          ocsf.actor = { "user": actor_user }
      } else if class_uid == 6006 {
          activity_id = 99
          activity_name = "Other"
          en = downcase(event_name)
          if en == "upload" || en == "create" { activity_id = 1; activity_name = "Upload" }
          if en == "download" { activity_id = 2; activity_name = "Download" }
          if en == "edit" { activity_id = 3; activity_name = "Update" }
          if en == "trash" || en == "delete" { activity_id = 4; activity_name = "Delete" }
          if en == "rename" { activity_id = 5; activity_name = "Rename" }
          if en == "copy" { activity_id = 6; activity_name = "Copy" }
          if en == "move" || en == "add_to_folder" || en == "remove_from_folder" { activity_id = 7; activity_name = "Move" }
          if en == "untrash" { activity_id = 8; activity_name = "Restore" }
          if en == "preview" { activity_id = 9; activity_name = "Preview" }
          if en == "view" { activity_id = 14; activity_name = "Open" }
          if starts_with(en, "change_user_access") || starts_with(en, "change_document_access") || starts_with(en, "change_document_visibility") || starts_with(en, "change_acl_editors") || en == "add_to_shared_drive" { activity_id = 12; activity_name = "Share" }
          if starts_with(en, "sheets_import_range") { activity_id = 15; activity_name = "Sync" }

          ocsf.class_uid = 6006
          ocsf.class_name = "File Hosting Activity"
          ocsf.category_uid = 6
          ocsf.category_name = "Application Activity"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          ocsf.actor = { "user": actor_user }
          doc_title = string(params.doc_title) ?? ""
          if doc_title == "" { doc_title = string(params.doc_id) ?? "" }
          if doc_title == "" { doc_title = "unknown" }
          file_obj = { "name": doc_title, "type_id": 1 }
          doc_id = string(params.doc_id) ?? ""
          if doc_id != "" { file_obj = set!(file_obj, ["uid"], doc_id) }
          doc_type = string(params.doc_type) ?? ""
          if doc_type != "" { file_obj = set!(file_obj, ["mime_type"], doc_type) }
          owner = string(params.owner) ?? ""
          if match(owner, r'^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$') {
              file_obj = set!(file_obj, ["owner"], { "name": downcase(owner), "email_addr": downcase(owner) })
          }
          ocsf.file = file_obj
      } else {
          activity_id = 99
          activity_name = "Other"
          en = downcase(event_name)
          if contains(en, "create") || contains(en, "add") || contains(en, "authorize") { activity_id = 1; activity_name = "Create" }
          if contains(en, "view") || contains(en, "list") || contains(en, "download") { activity_id = 2; activity_name = "Read" }
          if contains(en, "change") || contains(en, "update") || contains(en, "edit") { activity_id = 3; activity_name = "Update" }
          if contains(en, "delete") || contains(en, "remove") || contains(en, "revoke") { activity_id = 4; activity_name = "Delete" }

          ocsf.class_uid = 6003
          ocsf.class_name = "API Activity"
          ocsf.category_uid = 6
          ocsf.category_name = "Application Activity"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          op = event_name
          if op == "" { op = "unknown" }
          svc_name = "Google Workspace"
          if app != "" { svc_name = "Google Workspace " + app }
          ocsf.api = { "operation": op, "service": { "name": svc_name } }
          ocsf.actor = { "user": actor_user }
          # The OAuth application acting on the user's behalf — the single most
          # useful signal in the token stream.
          oauth_app = string(actor_app.applicationName) ?? string(params.app_name) ?? ""
          oauth_client = string(actor_app.oauthClientId) ?? string(params.client_id) ?? ""
          if oauth_app != "" || oauth_client != "" {
              res = { "type": "OAuthApplication" }
              if oauth_app != "" { res = set!(res, ["name"], oauth_app) }
              if oauth_client != "" { res = set!(res, ["uid"], oauth_client) }
              ocsf.resources = [res]
          }
      }

      # ---- source endpoint ----
      src_ip = string(p.ipAddress) ?? ""
      src_ep = {}
      if src_ip != "" { src_ep = set!(src_ep, ["ip"], downcase(src_ip)) }
      region_code = string(net.regionCode) ?? ""
      if region_code != "" { src_ep = set!(src_ep, ["location"], { "country": region_code }) }
      if length(src_ep) == 0 { src_ep = { "hostname": "unknown" } }
      ocsf.src_endpoint = src_ep

      # ---- common envelope ----
      ocsf.status_id = status_id
      ocsf.status = status_str
      ocsf.severity_id = severity_id
      ocsf.severity = severity
      ocsf.type_uid = to_int(ocsf.class_uid) * 100 + to_int(ocsf.activity_id)
      ocsf.time = time_ms
      msg = event_name
      if msg == "" { msg = app }
      if msg == "" { msg = "google_workspace_event" }
      ocsf.message = msg
      ocsf.raw_data = raw_log

      # Google documents (time, uniqueQualifier, applicationName, customerId) as
      # the composite key; the collector is at-least-once around the watermark.
      uniq = to_string(id.uniqueQualifier) ?? ""
      customer = to_string(id.customerId) ?? ""
      record_uid = ""
      if uniq != "" && time_raw != "" {
          record_uid = join!(["gws", app, customer, uniq, time_raw], "|")
      }
      if record_uid == "" { record_uid = sha2("google_workspace|raw|" + raw_log, variant: "SHA-256") }
      ocsf.metadata = {
          "version": "1.9.0",
          "uid": record_uid,
          "event_code": event_name,
          "log_name": "Google Workspace Reports",
          "log_provider": "Google Workspace",
          "tenant_uid": customer,
          "product": { "name": "Google Workspace", "vendor_name": "Google" }
      }
      # NAN-3718: original_event_uid holds the vendor's own per-event id and is
      # omitted when the record has none; a composite or hash belongs only in
      # metadata.uid.
      # Google: id.uniqueQualifier. Google's full activity key is the
      # time/uniqueQualifier/applicationName/customerId tuple, which is
      # the composite in metadata.uid.
      if uniq != "" { ocsf.metadata.original_event_uid = uniq }

      cand = {
          "application": app,
          "event_category": event_kind,
          "actor_caller_type": string(actor_in.callerType) ?? "",
          "oauth_application": string(actor_app.applicationName) ?? "",
          "oauth_client_id": string(actor_app.oauthClientId) ?? "",
          "oauth_impersonation": to_string(actor_app.impersonation) ?? "",
          "owner_domain": string(p.ownerDomain) ?? "",
          "region_code": region_code,
          "subdivision_code": string(net.subdivisionCode) ?? "",
          "unique_qualifier": uniq
      }
      unmapped = {}
      for_each(cand) -> |k, v| {
          if v != "" { unmapped = set!(unmapped, [k], v) }
      }
      unmapped = set!(unmapped, ["event_count"], length(events_arr))
      if length(event_names) > 0 { unmapped = set!(unmapped, ["event_names"], join!(event_names, ",")) }
      if length(params) > 0 { unmapped = set!(unmapped, ["params"], params) }
      if length(events_arr) > 1 { unmapped = set!(unmapped, ["events_json"], encode_json(events_arr)) }
      ocsf.unmapped = unmapped

      . = ocsf
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # Values spill exactly as parsed: a parser never masks, redacts or withholds
  # anything (masking is an opt-in pipeline step, never a parser concern).
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # A source field is consumed ONLY by an explicit mapping: a field-coverage.yaml
  # `mappings` entry (source key -> target paths) or a `transforms` rule with a
  # target, whose value is found AT THAT TARGET PATH of the selected branch. A
  # value that merely appears somewhere else in the event never consumes a field
  # (no coincidental consumption); everything else spills.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The sets below are strings instead
  # (a read shares the buffer). __repr holds one member per mapped leaf:
  # "," + encode_json(path) + "=" + encode_json(encode_json(value)), plus the
  # to_string form for a string or a float, so a numeric string is represented by
  # its typed scalar. Every part is a JSON text, inside which a '"' is always
  # escaped, so a member is matched exactly. Paths drop array indices
  # (resources.0.uid is resources.uid); arrays are walked two levels deep, and a
  # leaf deeper than that is simply not mapping evidence (it can only spill more).
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped = object!(parse_json!(encode_json(__mapped)))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __copy = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __repr = ""
  for_each(flatten(__mapped)) -> |path, value| {
      __p = encode_json(path)
      if is_array(value) {
          for_each(array!(value)) -> |_i, item| {
              if is_object(item) {
                  for_each(flatten(object!(item))) -> |sub, leaf| {
                      __q = encode_json(path + "." + sub)
                      if is_array(leaf) {
                          for_each(array!(leaf)) -> |_j, x| {
                              if !is_object(x) && !is_array(x) {
                                  __repr = __repr + ("," + __q + "=" + encode_json(encode_json(x)))
                                  if is_string(x) || is_float(x) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(x))) }
                              }
                          }
                      } else {
                          __repr = __repr + ("," + __q + "=" + encode_json(encode_json(leaf)))
                          if is_string(leaf) || is_float(leaf) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(leaf))) }
                      }
                  }
              } else if !is_array(item) {
                  __repr = __repr + ("," + __p + "=" + encode_json(encode_json(item)))
                  if is_string(item) || is_float(item) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(item))) }
              }
          }
      } else {
          __repr = __repr + ("," + __p + "=" + encode_json(encode_json(value)))
          if is_string(value) || is_float(value) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(value))) }
      }
  }
  __consumed = ""
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__copy.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # BEGIN parser-specific transformations
  # id.time: Successful ISO timestamp conversion to the selected event clock in milliseconds.
  for_each(__flat) -> |key, value| {
      if match(key, r'(?x)
      \A(?:
        id\.time
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%+", timezone: "UTC")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              if contains(__repr, "," + "\"time\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
  }
  # Declared source -> target mappings (field-coverage.yaml `mappings`).
  __decl = "\n\"actor.applicationInfo.applicationName\"\t[\"resources.name\"]\n\"actor.applicationInfo.oauthClientId\"\t[\"resources.uid\"]\n\"actor.email\"\t[\"actor.user.email_addr\",\"actor.user.name\",\"user.email_addr\",\"user.name\"]\n\"actor.profileId\"\t[\"actor.user.uid\",\"user.uid\"]\n\"id.customerId\"\t[\"metadata.tenant_uid\"]\n\"id.uniqueQualifier\"\t[\"metadata.original_event_uid\"]\n\"ipAddress\"\t[\"src_endpoint.ip\"]\n\"networkInfo.regionCode\"\t[\"src_endpoint.location.country\"]\n"
  __preserve = ["event_names"]
  # END parser-specific transformations
  # Declared mappings: __decl holds "\n" + encode_json(key) + "\t" + JSON array of
  # target paths + "\n" per mapped source key (a raw newline never occurs in
  # compact JSON). A key is consumed when its value, or every element of a scalar
  # array, is at one of its own targets. Keys stay ESCAPED here and in __consumed:
  # a literal dotted key ("a~1b") and the nested path ("a.b") are different
  # fields, and mapping one never consumes the other.
  for_each(__flat) -> |key, value| {
      # __decl spells a bracket inside a key as a \u escape (deploy bracket count).
      __kt = encode_json(key)
      if match(__kt, r'[\x28\x29\x5B\x5D\x7B\x7D]') {
          __kt = replace(replace(replace(replace(replace(replace(__kt, r'\x28', "\\u0028"), r'\x29', "\\u0029"), r'\x5B', "\\u005b"), r'\x5D', "\\u005d"), r'\x7B', "\\u007b"), r'\x7D', "\\u007d")
      }
      __at = find(__decl, "\n" + __kt + "\t")
      if is_integer(__at) && !is_object(value) {
          __rest = slice!(__decl, int!(__at) + strlen(__kt) + 2)
          __hit = false
          for_each(array!(parse_json!(slice!(__rest, 0, int!(find(__rest, "\n")))))) -> |_i, target| {
              __tok = "," + encode_json(target) + "="
              if !__hit && is_array(value) {
                  __all = !is_empty(array!(value))
                  for_each(array!(value)) -> |_j, item| {
                      if __all {
                          __all = !is_object(item) && !is_array(item) && (contains(__repr, __tok + encode_json(encode_json(item))) || ((is_string(item) || is_float(item)) && contains(__repr, __tok + encode_json(to_string!(item)))))
                      }
                  }
                  __hit = __all
              } else if !__hit {
                  __hit = contains(__repr, __tok + encode_json(encode_json(value))) || ((is_string(value) || is_float(value)) && contains(__repr, __tok + encode_json(to_string!(value))))
              }
          }
          if __hit { __consumed = __consumed + ("," + encode_json(key)) }
      }
  }
  # Fast path: when no two source keys decode to the same key and no two spilled
  # keys get the same name, each key's decision depends only on its own value, so
  # one filter and one rename build the residual without copying it per key.
  __distinct = true
  if __tilde {
      __distinct = length(map_keys(__flat) -> |key| { replace(replace(key, "~1", "."), "~0", "~") }) == length(__flat)
  }
  __kept = {}
  __names = {}
  if __distinct {
      __kept = filter(__flat) -> |key, value| {
          # A key is kept unless an explicit mapping or transformation consumed it.
          # Do not spill a copy of the raw body.
          value != __raw_body && !contains(__consumed, "," + encode_json(key))
      }
      __names = map_keys(__kept) -> |key| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          join!(__parts, ".")
      }
  }
  __residual = {}
  if __distinct && length(__names) == length(__kept) {
      __residual = map_values(__names) -> |value| {
          if is_array(value) || is_object(value) {
              if __tilde {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              if __complex { value = encode_json(value) }
          }
          value
      }
  } else {
      # Slow path, in source key order: a name already taken gets the next free
      # _2, _3, ... suffix.
      for_each(__flat) -> |key, value| {
          __token = "," + encode_json(key)
          key = replace(replace(key, "~1", "."), "~0", "~")
          if is_array(value) || is_object(value) {
              value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                  replace(replace(inner, "~1", "."), "~0", "~")
              }, ["v"])
          }
          if !contains(__consumed, __token) && value != __raw_body {
              __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
              __base = join!(__parts, ".")
              __key = __base
              __suffix = 2
              if includes(keys(__residual), __key) {
                  for_each(__flat) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __key) {
                          __key = __base + "_" + to_string(__suffix)
                          __suffix = __suffix + 1
                      }
                  }
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              __spill = if __complex { encode_json(value) } else { value }
              __residual = set!(__residual, [__key], __spill)
          }
      }
  }
  # Names nano owns in unmapped (the parser markers and the reserved nano.*
  # namespace) are never taken by a source field: a vendor key with such a name
  # is kept, renamed source_<name>, so a log cannot forge a marker.
  if match(encode_json(keys(__residual)), r'"nano(?:"|\.|_time_assumed_tz"|_time_source"|_operational")') {
      for_each(object!(__residual)) -> |key, value| {
          if includes(["nano", "nano_time_assumed_tz", "nano_time_source", "nano_operational"], key) || starts_with(key, "nano.") {
              # source_<name>, or the next free _2, _3, ... when a vendor key
              # already holds that name: nothing is lost.
              __rk = "source_" + key
              __rn = 2
              if includes(keys(__residual), __rk) {
                  for_each(__residual) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __rk) {
                          __rk = "source_" + key + "_" + to_string(__rn)
                          __rn = __rn + 1
                      }
                  }
              }
              __residual = remove!(__residual, [key])
              __residual = set!(__residual, [__rk], value)
          }
      }
  }
  # Keep existing derived evidence, but remove null placeholders and copies of a
  # source value (that value is mapped or spilled above under its source path).
  # A value merely equal to some mapped attribute is kept: equality with an
  # unrelated attribute is no evidence that it is represented.
  # The canonical source spill above is the authoritative representation of
  # containers. The cheap conditions run first; the source value set is built on
  # first use.
  __original_values = null
  for_each(flatten(__existing)) -> |key, value| {
      if !is_null(value) && value != "" && !is_array(value) && !is_object(value) && value != __raw_body {
          # Members for the value itself and for to_string(value), as above.
          __json = encode_json(value)
          __as_json = "," + encode_json(__json)
          __as_string = __as_json
          if is_string(value) { __as_string = "," + __json } else if is_float(value) { __as_string = "," + encode_json(to_string!(value)) }
          if __original_values == null {
              # __source_kv may hold non-JSON types (a timestamp), so only an
              # integer or a boolean skips its to_string member here.
              __original_values = join!(map_values(values(flatten(__source_kv))) -> |source_value| {
                  __source_json = encode_json(source_value)
                  __tokens = "," + encode_json(__source_json)
                  if is_string(source_value) {
                      __tokens = __tokens + "," + __source_json
                  } else if !is_object(source_value) && !is_array(source_value) && !is_integer(source_value) && !is_boolean(source_value) {
                      __tokens = __tokens + "," + encode_json(to_string(source_value) ?? "")
                  }
                  __tokens
              }, "")
          }
          __source_set = string!(__original_values)
          __keep = !contains(__source_set, __as_json) && !contains(__source_set, __as_string)
          # Only text opening an object or an array (after JSON whitespace)
          # decodes to a container.
          if __keep && is_string(value) && match(string!(value), r'^[ \t\n\r]*[\x5B\x7B]') {
              __decoded, __decode_err = parse_json(string!(value))
              __keep = !(__decode_err == null && (is_object(__decoded) || is_array(__decoded)))
          }
          if __keep {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, as-is. These
  # entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__copy.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  if __time_assumed && !__time_inline { __residual = set!(__residual, ["nano_time_assumed_tz"], __src_tz_label) }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

