source: json
transforms:
- source: id.applicationName
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value
    is emitted.
- source: id.time
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
consumed_candidates:
- actor
- actor.applicationInfo
- actor.applicationInfo.applicationName
- actor.applicationInfo.impersonation
- actor.applicationInfo.oauthClientId
- actor.callerType
- actor.email
- actor.profileId
- events
- id
- id.applicationName
- id.customerId
- id.time
- id.uniqueQualifier
- ipAddress
- networkInfo
- networkInfo.regionCode
- networkInfo.subdivisionCode
- ownerDomain
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
