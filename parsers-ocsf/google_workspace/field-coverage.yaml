source: json
preserve_unmapped:
  event_names: Derived comma-joined list of every events[].name in source order, so the non-primary events
    of a multi-event activity (a Drive upload also carries edit, change_user_access, add_to_folder) stay
    searchable; kept even when it equals the single event's name.
transforms:
- source: id.time
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  actor.applicationInfo.applicationName:
  - resources.name
  actor.applicationInfo.oauthClientId:
  - resources.uid
  actor.email:
  - actor.user.email_addr
  - actor.user.name
  - user.email_addr
  - user.name
  actor.profileId:
  - actor.user.uid
  - user.uid
  id.customerId:
  - metadata.tenant_uid
  id.uniqueQualifier:
  - metadata.original_event_uid
  ipAddress:
  - src_endpoint.ip
  networkInfo.regionCode:
  - src_endpoint.location.country
