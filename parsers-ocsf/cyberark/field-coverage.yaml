source: mixed
probe:
  raw: CEF:0|CyberArk|PAM|1|1|Logon|3|suser=alice src=192.0.2.1 act=Logon ResidualProbe=nan2421-text-unknown
    password=nan2421-secret
  source: ResidualProbe
transforms:
- source: timestamp
  kind: scale
  factor: 1000
  target: time
  reason: Existing unit conversion by 1000 verified against time; unused clock fallbacks remain residual.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  act:
  - api.operation
  action:
  - api.operation
  - message
  deviceEventClassId:
  - metadata.event_code
  dhost:
  - dst_endpoint.hostname
  dst:
  - dst_endpoint.ip
  duser:
  - resources.name
  - user.name
  fname:
  - group.name
  - resources.name
  msg:
  - message
  reason:
  - status_detail
  shost:
  - src_endpoint.hostname
  src:
  - src_endpoint.ip
  suser:
  - actor.user.name
  - user.name
  target_user:
  - resources.name
  user:
  - actor.user.name
