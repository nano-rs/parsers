name: sentry_webhook_ocsf
display_name: Sentry Webhooks (OCSF)
version: "1.0.0"
ocsf_version: "1.9.0"
description: |
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses Sentry integration platform webhooks into OCSF 1.9.0. The record is
  Sentry's JSON body exactly as signed. Sentry sends the resource only in the
  Sentry-Hook-Resource header, so it is read from the body (data.issue, data.event,
  data.metric_alert, data.error, data.installation); a relay envelope {sentry_resource,
  sentry_timestamp, payload} is also accepted.
    issue (created, resolved, assigned, ignored, archived, unresolved),
    event_alert (an issue alert rule fired), metric_alert
    (critical, warning, resolved), error                   -> Detection Finding 2004
    installation (created, deleted) and anything else      -> API Activity 6003
  The issue / event / metric alert id is finding_info.uid, its title the finding
  title, and the alert rule the analytic. The Sentry level sets severity (fatal High,
  error Medium, warning Low) and metadata.log_level. time is the event's own clock
  (event.timestamp, a metric alert's date_detected, a new issue's firstSeen); a status
  change or an install carries none, so it gets the time nano received it
  (unmapped.nano_time_source = "received"). An install or uninstall is API Activity by
  the acting user, with no caller address ({"hostname": "unknown"}). Unparseable input
  becomes a Base Event with the raw line kept.
  Ingestion: HTTP ingest (/ingest), one JSON body per line.
  Setup: Sentry can't add nano's ingest token to a webhook, so put a small
  forwarder in between (for example a Cloudflare Worker). In Sentry, open Settings,
  then Developer Settings, then Custom Integrations, and create an internal
  integration. Set the webhook URL to the forwarder, turn on the issue and error
  webhooks, and allow it in alert rules for issue and metric alerts. The forwarder
  checks the Sentry-Hook-Signature header with the integration's client secret, then
  posts the body, unchanged, to your nano HTTP ingest with your sentry_webhook ingest
  token as a Bearer token.
match_values:
  - sentry_webhook
category: application
vendor: "Sentry"
product: "Sentry Webhooks"
parser_vrl: |
  # NAN source timezone. Generated by scripts/residual_spill.py; edit scripts/residual/source_tz.vrl.
  # The log source's timezone setting arrives as .nano.source_timezone (an IANA
  # name such as "America/New_York", or any fixed offset such as "+05:30"), set
  # by nano at ingest. .nano is nano's input, never part of the log: it is
  # removed whole before anything else, whatever its shape.
  # For a clock that carries no offset a parser parses it AS UTC and sets
  # __lc_pending; the generated local-clock block that follows the parse
  # (local_clock.vrl) turns it into real UTC with this setting, and the spill
  # records the zone used as unmapped.nano_time_assumed_tz (the name, the offset
  # as +HH:MM, or "UTC" when the setting is absent, invalid or "local").
  __src_nano = del(.nano)
  __src_tz_in = ""
  if is_object(__src_nano) { __src_tz_in = strip_whitespace(to_string(object!(__src_nano).source_timezone) ?? "") }
  __src_tz = "UTC"
  __src_shift_ms = 0
  __src_tz_label = "UTC"
  __time_assumed = false
  __time_inline = false
  __lc_pending = false
  # No parse_* decoder here: nano infers a parser's input contract from the first
  # decoder in its program (parse_json first = a JSON-input parser, handed the
  # whole HEC / OTLP object). This prelude opens every parser, so a decoder in it
  # would turn every JSON-input parser into a text one. match + slice instead.
  if match(__src_tz_in, r'^[+-]\d{2}:?\d{2}$') {
      __src_sign = slice(__src_tz_in, 0, 1) ?? "+"
      __src_digits = replace(slice(__src_tz_in, 1) ?? "", ":", "")
      __src_hh = slice(__src_digits, 0, 2) ?? "99"
      __src_mm = slice(__src_digits, 2, 4) ?? "99"
      __src_h = to_int(__src_hh) ?? 99
      __src_m = to_int(__src_mm) ?? 99
      if __src_h <= 14 && __src_m <= 59 {
          __src_shift_ms = (__src_h * 3600 + __src_m * 60) * 1000
          if __src_sign == "-" { __src_shift_ms = 0 - __src_shift_ms }
          if __src_shift_ms != 0 { __src_tz_label = __src_sign + __src_hh + ":" + __src_mm }
      }
  } else if __src_tz_in != "" && downcase(__src_tz_in) != "local" {
      # "local" (the Vector host's zone) would make the time depend on the host.
      __src_probe, __src_probe_err = parse_timestamp("2000-01-01 00:00:00", "%Y-%m-%d %H:%M:%S", timezone: __src_tz_in)
      if __src_probe_err == null { __src_tz = __src_tz_in; __src_tz_label = __src_tz_in }
  }
  # END NAN source timezone
  # nano:input=json
  # Sentry integration webhook (relay envelope) -> OCSF 1.9.0.
  raw_log = ""
  if is_string(.message) {
      raw_log = string!(.message)
  } else if is_object(.message) || is_array(.message) {
      raw_log = encode_json(.message)
  } else if exists(.message) && !is_null(.message) {
      raw_log = to_string(.message) ?? ""
  } else {
      raw_log = encode_json(.)
  }
  __raw_body = raw_log
  __source_kv = {}
  parsed, err = parse_json(raw_log)
  __source_kv = object(parsed) ?? {}

  is_sentry = false
  if err == null && is_object(parsed) {
      is_sentry = exists(parsed.sentry_resource) || (exists(parsed.action) && exists(parsed.data) && exists(parsed.installation))
  }

  if !is_sentry {
      reason = "not a JSON object"
      if err == null && is_object(parsed) { reason = "JSON object that is not a Sentry webhook" }
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 0,
          "activity_name": "Unknown",
          "type_uid": 0,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": to_unix_timestamp(now(), unit: "milliseconds"),
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": sha2("sentry_webhook|raw|" + raw_log, variant: "SHA-256"),
              "log_level": "error",
              "log_name": "sentry_webhook",
              "log_provider": "Sentry",
              "product": { "name": "Sentry", "vendor_name": "Sentry" }
          },
          "unmapped": { "parse_error": reason, "nano_time_source": "received" }
      }
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      . = set!(., ["unmapped", "parse_fallback"], "unparsable input")
  } else {
      env = object!(parsed)
      # The usual record is Sentry's signed body as delivered (the resource
      # travels in the unsigned Sentry-Hook-Resource header, which a relay that
      # forwards only signed bytes drops). A relay envelope
      # {sentry_resource, sentry_timestamp, payload} is also accepted.
      is_envelope = exists(env.sentry_resource) && is_object(env.payload)
      pl = env
      if is_envelope { pl = object!(env.payload) }
      data = object(pl.data) ?? {}
      resource = ""
      if is_envelope { resource = string(env.sentry_resource) ?? "" }
      if resource == "" {
          if exists(data.issue) {
              resource = "issue"
          } else if exists(data.event) {
              resource = "event_alert"
          } else if exists(data.metric_alert) {
              resource = "metric_alert"
          } else if exists(data.error) {
              resource = "error"
          } else if exists(data.installation) || exists(pl.installation.app) {
              resource = "installation"
          } else if exists(data.comment) {
              resource = "comment"
          }
      }
      action = string(pl.action) ?? ""
      event_code = resource
      if action != "" {
          event_code = action
          if resource != "" { event_code = resource + "." + action }
      }

      # ---- time: the event's own clock, else the hook send time ----
      time_ms = 0
      ev_obj = object(data.event) ?? object(data.error) ?? {}
      if is_float(ev_obj.timestamp) || is_integer(ev_obj.timestamp) {
          time_ms = to_int((to_float(ev_obj.timestamp) ?? 0.0) * 1000)
      }
      # an error event without the numeric timestamp carries datetime (RFC 3339)
      if time_ms == 0 {
          ev_t, ev_err = parse_timestamp(string(ev_obj.datetime) ?? "", "%+", timezone: "UTC")
          if ev_err == null { time_ms = to_unix_timestamp(ev_t, unit: "milliseconds") }
      }
      # a resolved metric alert happened when it closed, not when it first fired
      if time_ms == 0 && resource == "metric_alert" && action == "resolved" {
          mc_t, mc_err = parse_timestamp(string(data.metric_alert.date_closed) ?? "", "%+", timezone: "UTC")
          if mc_err == null { time_ms = to_unix_timestamp(mc_t, unit: "milliseconds") }
      }
      if time_ms == 0 && resource == "metric_alert" && action != "resolved" {
          ma_t, ma_err = parse_timestamp(string(data.metric_alert.date_detected) ?? "", "%+", timezone: "UTC")
          if ma_err == null { time_ms = to_unix_timestamp(ma_t, unit: "milliseconds") }
      }
      # a new issue happened at its first sighting; a later status change
      # (resolved, assigned, ...) carries no clock of its own
      if time_ms == 0 && resource == "issue" && action == "created" {
          fs_t, fs_err = parse_timestamp(string(data.issue.firstSeen) ?? "", "%+", timezone: "UTC")
          if fs_err == null { time_ms = to_unix_timestamp(fs_t, unit: "milliseconds") }
      }
      if time_ms == 0 && is_envelope {
          hook_s = to_int(env.sentry_timestamp) ?? 0
          if hook_s > 0 { time_ms = hook_s * 1000 }
      }
      # no clock in the record: the time nano received it, and say so
      time_received = false
      if time_ms == 0 {
          time_ms = to_unix_timestamp(now(), unit: "milliseconds")
          time_received = true
      }

      md = {
          "version": "1.9.0",
          "uid": sha2("sentry_webhook|raw|" + raw_log, variant: "SHA-256"),
          "log_name": "sentry_webhook",
          "log_provider": "Sentry",
          "product": { "name": "Sentry", "vendor_name": "Sentry" }
      }
      if event_code != "" { md.event_code = event_code }

      act = object(pl.actor) ?? {}
      act_type = string(act.type) ?? ""

      severity_id = 1
      status_id = 1
      ocsf = {}
      msg = event_code
      is_finding = includes(["issue", "event_alert", "metric_alert", "error"], resource)

      if is_finding {
          # ================= Detection Finding (2004) =================
          activity_id = 99
          activity_name = "Other"
          fi = {}
          level = ""
          fi_status = ""
          res = []
          if resource == "issue" {
              iss = object(data.issue) ?? {}
              if action == "created" { activity_id = 1; activity_name = "Create" }
              if includes(["assigned", "ignored", "archived", "unresolved"], action) { activity_id = 2; activity_name = "Update" }
              if action == "resolved" { activity_id = 3; activity_name = "Close" }
              fi.uid = to_string(iss.id) ?? md.uid
              fi.title = string(iss.title) ?? event_code
              short = string(iss.shortId) ?? ""
              if short != "" { fi.uid_alt = short }
              url = string(iss.web_url) ?? ""
              if url != "" { fi.src_url = url }
              culprit = string(iss.culprit) ?? ""
              if culprit != "" { fi.desc = culprit }
              fs, fs_err = parse_timestamp(string(iss.firstSeen) ?? "", "%+", timezone: "UTC")
              if fs_err == null { fi.first_seen_time = to_unix_timestamp(fs, unit: "milliseconds") }
              ls, ls_err = parse_timestamp(string(iss.lastSeen) ?? "", "%+", timezone: "UTC")
              if ls_err == null { fi.last_seen_time = to_unix_timestamp(ls, unit: "milliseconds") }
              level = string(iss.level) ?? ""
              i_status = string(iss.status) ?? ""
              if i_status == "unresolved" { status_id = 1 }
              if i_status == "resolved" { status_id = 4 }
              if i_status == "ignored" || i_status == "archived" { status_id = 3 }
              if i_status != "" { fi_status = i_status }
              proj = object(iss.project) ?? {}
              pr = { "type": "project" }
              p_id = to_string(proj.id) ?? ""
              if p_id != "" { pr.uid = p_id }
              p_slug = string(proj.slug) ?? ""
              if p_slug != "" { pr.name = p_slug }
              if p_id != "" || p_slug != "" { res = push(res, pr) }
          } else if resource == "metric_alert" {
              ma = object(data.metric_alert) ?? {}
              if action == "critical" || action == "warning" { activity_id = 1; activity_name = "Create" }
              if action == "resolved" { activity_id = 3; activity_name = "Close" }
              fi.uid = to_string(ma.id) ?? md.uid
              fi.title = string(data.description_title) ?? event_code
              d_text = string(data.description_text) ?? ""
              if d_text != "" { fi.desc = d_text }
              url = string(data.web_url) ?? ""
              if url != "" { fi.src_url = url }
              rule_name = string(ma.alert_rule.name) ?? ""
              if rule_name != "" {
                  an = { "name": rule_name, "type_id": 1, "type": "Rule" }
                  rule_id = to_string(ma.alert_rule.id) ?? ""
                  if rule_id != "" { an.uid = rule_id }
                  fi.analytic = an
              }
              if action == "critical" { level = "fatal" }
              if action == "warning" { level = "warning" }
              for_each(array(ma.projects) ?? []) -> |_i, pslug| {
                  if is_string(pslug) { res = push(res, { "name": pslug, "type": "project" }) }
              }
              status_id = 1
              if action == "resolved" { status_id = 4 }
          } else {
              # event_alert (an issue alert rule fired on this event) / error
              if action == "triggered" || action == "created" { activity_id = 1; activity_name = "Create" }
              fi.uid = string(ev_obj.event_id) ?? md.uid
              fi.title = string(ev_obj.title) ?? event_code
              url = string(ev_obj.web_url) ?? ""
              if url != "" { fi.src_url = url }
              rule = string(data.triggered_rule) ?? ""
              if rule != "" { fi.analytic = { "name": rule, "type_id": 1, "type": "Rule" } }
              level = string(ev_obj.level) ?? ""
              p_id = to_string(ev_obj.project) ?? ""
              if p_id != "" { res = push(res, { "uid": p_id, "type": "project" }) }
              rel = string(ev_obj.release) ?? ""
              if rel != "" { res = push(res, { "name": rel, "type": "release" }) }
          }
          lv = downcase(level)
          if lv == "warning" { severity_id = 2 }
          if lv == "error" { severity_id = 3 }
          if lv == "fatal" { severity_id = 4 }
          if activity_id == 3 { severity_id = 1 }
          if level != "" { md.log_level = level }
          ocsf = {
              "class_uid": 2004,
              "class_name": "Detection Finding",
              "category_uid": 2,
              "category_name": "Findings",
              "activity_id": activity_id,
              "activity_name": activity_name,
              "finding_info": fi,
              "is_alert": activity_id != 3
          }
          if length(res) > 0 { ocsf.resources = res }
          if fi_status != "" { ocsf.status_detail = fi_status }
          msg = fi.title
      } else {
          # ================= API Activity (6003) =================
          activity_id = 99
          activity_name = "Other"
          if action == "created" { activity_id = 1; activity_name = "Create" }
          if action == "deleted" { activity_id = 4; activity_name = "Delete" }
          actor = { "user": { "name": "unknown" } }
          a_name = string(act.name) ?? ""
          a_id = to_string(act.id) ?? ""
          if act_type == "user" {
              au = {}
              if a_name != "" { au.name = a_name }
              if a_id != "" { au.uid = a_id }
              if au != {} { actor = { "user": au } }
          } else if a_name != "" {
              actor = { "app_name": a_name }
              if a_id != "" { actor.app_uid = a_id }
          }
          ocsf = {
              "class_uid": 6003,
              "class_name": "API Activity",
              "category_uid": 6,
              "category_name": "Application Activity",
              "activity_id": activity_id,
              "activity_name": activity_name,
              "api": { "operation": event_code, "service": { "name": "Sentry" } },
              "actor": actor,
              "src_endpoint": { "hostname": "unknown" }
          }
          if event_code == "" { ocsf.api.operation = "unknown" }
          inst = object(pl.installation) ?? {}
          ir = { "type": "sentry_app_installation" }
          i_uuid = string(inst.uuid) ?? ""
          if i_uuid != "" { ir.uid = i_uuid }
          app_slug = string(inst.app.slug) ?? ""
          if app_slug != "" { ir.name = app_slug }
          if i_uuid != "" || app_slug != "" { ocsf.resources = [ir] }
          if resource == "installation" && action == "deleted" { severity_id = 3 }
      }

      ocsf.severity_id = severity_id
      sev_names = { "1": "Informational", "2": "Low", "3": "Medium", "4": "High", "5": "Critical" }
      ocsf.severity = string(get(sev_names, [to_string(severity_id)]) ?? "Informational") ?? "Informational"
      ocsf.status_id = status_id
      st_names = { "0": "Unknown", "1": "Success", "2": "Failure" }
      if is_finding { st_names = { "0": "Unknown", "1": "New", "3": "Suppressed", "4": "Resolved" } }
      ocsf.status = string(get(st_names, [to_string(status_id)]) ?? "Unknown") ?? "Unknown"
      ocsf.type_uid = to_int(ocsf.class_uid) * 100 + to_int(ocsf.activity_id)
      ocsf.time = time_ms
      ocsf.message = msg
      ocsf.raw_data = raw_log
      ocsf.metadata = md
      if time_received { ocsf = set!(ocsf, ["unmapped", "nano_time_source"], "received") }
      . = ocsf
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # Values spill exactly as parsed: a parser never masks, redacts or withholds
  # anything (masking is an opt-in pipeline step, never a parser concern).
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # A source field is consumed ONLY by an explicit mapping: a field-coverage.yaml
  # `mappings` entry (source key -> target paths) or a `transforms` rule with a
  # target, whose value is found AT THAT TARGET PATH of the selected branch. A
  # value that merely appears somewhere else in the event never consumes a field
  # (no coincidental consumption); everything else spills.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The sets below are strings instead
  # (a read shares the buffer). __repr holds one member per mapped leaf:
  # "," + encode_json(path) + "=" + encode_json(encode_json(value)), plus the
  # to_string form for a string or a float, so a numeric string is represented by
  # its typed scalar. Every part is a JSON text, inside which a '"' is always
  # escaped, so a member is matched exactly. Paths drop array indices
  # (resources.0.uid is resources.uid); arrays are walked two levels deep, and a
  # leaf deeper than that is simply not mapping evidence (it can only spill more).
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped = object!(parse_json!(encode_json(__mapped)))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __copy = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __repr = ""
  for_each(flatten(__mapped)) -> |path, value| {
      __p = encode_json(path)
      if is_array(value) {
          for_each(array!(value)) -> |_i, item| {
              if is_object(item) {
                  for_each(flatten(object!(item))) -> |sub, leaf| {
                      __q = encode_json(path + "." + sub)
                      if is_array(leaf) {
                          for_each(array!(leaf)) -> |_j, x| {
                              if !is_object(x) && !is_array(x) {
                                  __repr = __repr + ("," + __q + "=" + encode_json(encode_json(x)))
                                  if is_string(x) || is_float(x) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(x))) }
                              }
                          }
                      } else {
                          __repr = __repr + ("," + __q + "=" + encode_json(encode_json(leaf)))
                          if is_string(leaf) || is_float(leaf) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(leaf))) }
                      }
                  }
              } else if !is_array(item) {
                  __repr = __repr + ("," + __p + "=" + encode_json(encode_json(item)))
                  if is_string(item) || is_float(item) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(item))) }
              }
          }
      } else {
          __repr = __repr + ("," + __p + "=" + encode_json(encode_json(value)))
          if is_string(value) || is_float(value) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(value))) }
      }
  }
  __consumed = ""
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__copy.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # BEGIN parser-specific transformations
  # data.event.timestamp: The event's own clock (epoch seconds, fractional) is the event time.
  # data.metric_alert.date_detected: The metric alert's detection clock is the event time.
  # payload.data.issue.firstSeen: The issue's first-seen clock.
  # data.issue.firstSeen: The issue's first-seen clock.
  # payload.data.issue.lastSeen: The issue's last-seen clock.
  # data.issue.lastSeen: The issue's last-seen clock.
  # data.issue.firstSeen: A new issue's first sighting is the event time.
  # data.error.datetime: An error event's own clock (RFC 3339) when it has no numeric timestamp.
  # data.metric_alert.date_closed: A resolved metric alert's close clock is the event time.
  for_each(__flat) -> |key, value| {
      if match(key, r'(?x)
      \A(?:
        data\.event\.timestamp
      )\z') {
          __value = value
          __number, __number_err = to_float(__value)
          if __number_err == null && __value != null && !is_boolean(__value) {
              __expected = to_int(__number * 1000.0)
              if contains(__repr, "," + "\"time\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        data\.metric_alert\.date_detected
      | data\.issue\.firstSeen
      | data\.error\.datetime
      | data\.metric_alert\.date_closed
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%+", timezone: "UTC")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              if contains(__repr, "," + "\"time\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        payload\.data\.issue\.firstSeen
      | data\.issue\.firstSeen
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%+", timezone: "UTC")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
