source: json
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
transforms:
- source: data.event.timestamp
  kind: scale
  factor: 1000
  target: time
  reason: The event's own clock (epoch seconds, fractional) is the event time.
- source: data.metric_alert.date_detected
  kind: epoch_ms
  format: '%+'
  target: time
  reason: The metric alert's detection clock is the event time.
- source: payload.data.issue.firstSeen
  kind: epoch_ms
  format: '%+'
  target: finding_info.first_seen_time
  reason: The issue's first-seen clock.
- source: data.issue.firstSeen
  kind: epoch_ms
  format: '%+'
  target: finding_info.first_seen_time
  reason: The issue's first-seen clock.
- source: payload.data.issue.lastSeen
  kind: epoch_ms
  format: '%+'
  target: finding_info.last_seen_time
  reason: The issue's last-seen clock.
- source: data.issue.lastSeen
  kind: epoch_ms
  format: '%+'
  target: finding_info.last_seen_time
  reason: The issue's last-seen clock.
- source: data.issue.firstSeen
  kind: epoch_ms
  format: '%+'
  target: time
  reason: A new issue's first sighting is the event time.
mappings:
  payload.data.issue.culprit:
  - finding_info.desc
  payload.data.issue.id:
  - finding_info.uid
  payload.data.issue.level:
  - metadata.log_level
  payload.data.issue.project.id:
  - resources.uid
  payload.data.issue.project.slug:
  - resources.name
  payload.data.issue.shortId:
  - finding_info.uid_alt
  payload.data.issue.status:
  - status_detail
  payload.data.issue.title:
  - finding_info.title
  - message
  payload.data.issue.web_url:
  - finding_info.src_url
  actor.id:
