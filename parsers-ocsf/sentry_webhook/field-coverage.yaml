  actor.name:
  - actor.user.name
  data.event.event_id:
  - finding_info.uid
  data.event.level:
  - metadata.log_level
  data.event.project:
  - resources.uid
  data.event.release:
  - resources.name
  data.event.title:
  - finding_info.title
