      activity_id: 99
  # NAN-2995: OCSF 1.9 bytes_in = destination -> source, bytes_out = source -> destination; Response Size is bytes_in, Request Size is bytes_out.
  - raw: "\"2026-08-12 09:15:31\",\"alice@corp.example\",\"LAPTOP-4471\",\"10.40.1.22\",\"198.51.100.4\",\"https://files.example.org/setup.exe\",\"https://portal.example.org/\",\"Allowed\",\"200\",\"512\",\"58213\",\"\",\"files.example.org\",\"Software Downloads\",\"\",\"\",\"\",\"Default Policy\""
    expect:
