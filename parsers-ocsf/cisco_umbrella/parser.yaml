  # NAN-3702 (existing sample, error branch): metadata.uid is sha256("cisco_umbrella|raw|" + raw), so the
  # same record parsed twice gets the same uid (a random uid could never match).
  - raw: "\"2026-08-12 09:15:44\",\"x\",\"y\""
