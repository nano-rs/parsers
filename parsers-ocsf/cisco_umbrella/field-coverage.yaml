source: mixed
transforms:
- source: timestamp
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: timestamp
  kind: epoch_ms
  target: time
  format: '%Y-%m-%d %H:%M:%S'
  reason: Umbrella CSV timestamp parsed in the existing runtime timezone.
- source: device
  kind: lowercase
  reason: Case normalization already performed by the parser; observed at src_endpoint.hostname,
    and checked against the emitted branch.
consumed_candidates:
- action
- av_result
- categories
- category
- category_1
- category_2
- category_3
- column_11
- column_12
- column_14
- column_15
- device
- domain
- externalIp
- external_ip
- http_status
- identity
- identity_id
- internalIp
- internal_ip
- policy
- queryType
- query_type
- referrer
- request_bytes
- responseCode
- response_bytes
- response_code
- timestamp
- url
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
