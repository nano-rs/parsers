source: mixed
transforms:
- source: timestamp
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: timestamp
  kind: epoch_ms
  target: time
  format: '%Y-%m-%d %H:%M:%S'
  reason: Umbrella CSV timestamp parsed in the existing runtime timezone.
- source: device
  kind: lowercase
  target: src_endpoint.hostname
  reason: Case normalization already performed by the parser; observed at src_endpoint.hostname, and checked
    against the emitted branch.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  av_result:
  - malware.name
  category:
  - http_request.url.categories
  domain:
  - http_request.url.hostname
  - query.hostname
  http_status:
  - http_response.code
  identity:
  - actor.user.name
  internalIp:
  - src_endpoint.ip
  internal_ip:
  - src_endpoint.ip
  queryType:
  - query.type
  query_type:
  - query.type
  referrer:
  - http_request.referrer
  request_bytes:
  - traffic.bytes_out
  responseCode:
  - rcode
  response_bytes:
  - traffic.bytes_in
  response_code:
  - rcode
  url:
  - http_request.url.url_string
