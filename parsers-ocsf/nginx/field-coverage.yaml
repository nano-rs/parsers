source: mixed
transforms:
- source: timestamp
  kind: epoch_ms
  target: time
  reason: Built-in parsed timestamp converted to event milliseconds.
- source: time_local
  kind: epoch_ms
  target: time
  format: '%d/%b/%Y:%H:%M:%S %z'
  reason: Nginx local timestamp with explicit offset converted to event milliseconds.
- source: request_time
  kind: scale
  factor: 1000
  target: duration
  reason: Existing unit conversion by 1000 verified against duration; unused clock
    fallbacks remain residual.
consumed_candidates:
- agent
- body_bytes_sent
- client
- host
- http_referer
- http_user_agent
- http_x_forwarded_for
- message
- pid
- referer
- remote_addr
- remote_user
- request
- request_length
- request_time
- server
- severity
- size
- status
- time_local
- timestamp
- upstream
- upstream_addr
- upstream_response_time
- user
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
