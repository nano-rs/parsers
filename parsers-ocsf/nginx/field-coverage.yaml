source: mixed
transforms:
- source: time_local
  kind: epoch_ms
  target: time
  format: '%d/%b/%Y:%H:%M:%S %z'
  reason: Nginx local timestamp with explicit offset converted to event milliseconds.
- source: request_time
  kind: scale
  factor: 1000
  target: duration
  reason: Existing unit conversion by 1000 verified against duration; unused clock fallbacks remain residual.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  agent:
  - http_request.user_agent
  body_bytes_sent:
  - http_response.length
  - traffic.bytes_in
  client:
  - src_endpoint.ip
  host:
  - dst_endpoint.hostname
  - http_request.url.hostname
  http_user_agent:
  - http_request.user_agent
  referer:
  - http_request.referrer
  remote_addr:
  - src_endpoint.ip
  severity:
  - metadata.log_level
  size:
  - http_response.length
  - traffic.bytes_in
  status:
  - http_response.code
  user:
  - actor.user.name
