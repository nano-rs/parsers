name: windows_sysmon_ocsf
display_name: Microsoft Sysmon (OCSF)
version: "1.1.0"
description: >
  Parses Windows Sysmon events in JSON form (top-level event_id + event_data)
  into complete OCSF 1.9.0 records, routed by Sysmon EventID:
    1  Process Create    -> Process Activity 1007 (Launch)
    5  Process Terminate -> Process Activity 1007 (Terminate)
    10 Process Access    -> Process Activity 1007 (Open)
    7  Image Loaded      -> Module Activity 1005 (Load; module = the loaded image)
    12 Registry Key      -> Registry Key Activity 201001 (Win ext; Create/Delete)
    13 Registry Value    -> Registry Value Activity 201002 (Win ext; Set)
    3  Network Connect   -> Network Activity 4001 (Open)
    11 File Create       -> File System Activity 1001 (Create)
    23 File Delete       -> File System Activity 1001 (Delete)
    22 DNS Query         -> DNS Activity 4003 (Query)
  Emits the whole OCSF object on the root so it lands in ocsf_logs.event and the
  promoted columns materialize. Carries metadata.profiles ["host"] because the
  `device` object is profile-bound in OCSF 1.9. The OCSF counterpart of
  parsers/windows_sysmon — deploy one or the other, never both.
ocsf_version: "1.9.0"
match_values:
  - windows_sysmon
category: endpoint
vendor: "Microsoft"
product: "Sysmon"
parser_vrl: |
  # Sysmon JSON -> OCSF 1.9.0. Emits the COMPLETE OCSF record on the root.
  raw_log = string!(.message)
  parsed, err = parse_json(raw_log)

  if err != null || !is_object(parsed) {
      . = {
          "class_uid": 1007,
          "category_uid": 1,
          "activity_id": 99,
          "type_uid": 100799,
          "severity_id": 1,
          "status_id": 0,
          "time": 0,
          "message": raw_log,
          "raw_data": raw_log,
          # 1007 requires actor/device/process even on the unparseable path.
          "process": { "pid": 0 },
          "actor": { "process": { "pid": 0 } },
          "device": { "hostname": "", "type_id": 0 },
          "metadata": {
              "version": "1.9.0",
              "profiles": ["host"],
              "uid": uuid_v4(),
              "log_level": "error",
              "product": { "name": "Sysmon", "vendor_name": "Microsoft" }
          }
      }
  } else {
      p = object!(parsed)
      ed = object(p.event_data) ?? {}
      eid = to_int(p.event_id) ?? 0

      computer = downcase(string(p.computer) ?? string(p.host) ?? "")

      # ---- event time (top-level ISO8601) -> epoch ms ----
      time_ms = 0
      ts_str = string(p.timestamp) ?? ""
      if ts_str != "" {
          t, terr = parse_timestamp(ts_str, "%+")
          if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
      }

      # ---- shared helpers (inlined) ------------------------------------
      # actor user "DOMAIN\\user" -> name (strip domain)
      actor_user = ""
      au_raw = string(ed.User) ?? ""
      if au_raw != "" {
          aup = split(au_raw, "\\")
          actor_user = if length(aup) >= 2 { string(aup[1]) ?? "" } else { string(aup[0]) ?? "" }
      }
      # actor process basename from Image path (VRL has no dynamic array index,
      # so take the trailing path segment via regex)
      img = string(ed.Image) ?? ""
      actor_proc_name = ""
      anm, anmerr = parse_regex(img, r'(?P<b>[^\\/]+)$')
      if anmerr == null { actor_proc_name = string(anm.b) ?? "" }
      # parent basename
      pimg = string(ed.ParentImage) ?? ""
      parent_proc_name = ""
      pnm, pnmerr = parse_regex(pimg, r'(?P<b>[^\\/]+)$')
      if pnmerr == null { parent_proc_name = string(pnm.b) ?? "" }
      # SHA-256 out of the "SHA256=..,MD5=.." Hashes string
      sha = ""
      hs = string(ed.Hashes) ?? ""
      if hs != "" {
          hm, hmerr = parse_regex(hs, r'SHA256=(?P<h>[0-9A-Fa-f]+)')
          if hmerr == null { sha = downcase(string(hm.h) ?? "") }
      }

      # The Image-based (acting/subject) process, assembled once. For 1007
      # process-family events this is the OCSF top-level `process` (the SUBJECT);
      # for the network/file/dns classes it is the initiator (actor.process).
      subject_process = {
          "name": actor_proc_name,
          "cmd_line": string(ed.CommandLine) ?? "",
          "pid": to_int(ed.ProcessId) ?? 0,
          "uid": string(ed.ProcessGuid) ?? "",
          "file": { "name": actor_proc_name, "path": img, "type_id": 1 }
      }
      if sha != "" { subject_process.file = { "name": actor_proc_name, "path": img, "type_id": 1, "hashes": [{ "algorithm_id": 3, "value": sha }] } }

      # The PARENT process (initiator), present on Process Create (EID 1).
      parent_process = {
          "name": parent_proc_name,
          "cmd_line": string(ed.ParentCommandLine) ?? "",
          "pid": to_int(ed.ParentProcessId) ?? 0
      }
      has_parent = pimg != "" || (string(ed.ParentCommandLine) ?? "") != ""

      # actor.process for the non-1007 classes (network/file/dns): the initiator
      # is the Image-based process, with its parent nested.
      actor_process = subject_process
      if has_parent { actor_process.parent_process = parent_process }

      # ---- defaults; overridden per class below ----
      class_uid = 1007
      class_name = "Process Activity"
      category_uid = 1
      category_name = "System Activity"
      activity_id = 99
      activity_name = "Other"

      ocsf = {}

      if eid == 1 || eid == 5 {
          # process-family -> Process Activity 1007
          class_uid = 1007; class_name = "Process Activity"; category_uid = 1; category_name = "System Activity"
          if eid == 1 { activity_id = 1; activity_name = "Launch" }
          if eid == 5 { activity_id = 2; activity_name = "Terminate" }
          # OCSF 1007: top-level `process` (REQUIRED) = the SUBJECT process.
          ocsf.process = subject_process
          # EID 1 (Create) carries a parent/initiator -> actor.process. Terminate
          # has no separate initiator, so actor is the user only.
          if eid == 1 {
              ocsf.actor = { "process": parent_process, "user": { "name": actor_user } }
          } else {
              ocsf.actor = { "user": { "name": actor_user } }
          }
          ocsf.device = { "hostname": computer }
      } else if eid == 12 {
          # Registry Key Create/Delete -> Registry Key Activity 201001 (Windows
          # extension). actor.process makes the change; reg_key is the subject.
          class_uid = 201001; class_name = "Registry Key Activity"; category_uid = 1; category_name = "System Activity"
          reg_event = string(ed.EventType) ?? ""
          activity_id = 99; activity_name = "Other"
          if reg_event == "CreateKey" { activity_id = 1; activity_name = "Create" }
          if reg_event == "DeleteKey" { activity_id = 4; activity_name = "Delete" }
          ocsf.actor = { "process": subject_process, "user": { "name": actor_user } }
          ocsf.reg_key = { "path": string(ed.TargetObject) ?? "" }
          ocsf.device = { "hostname": computer }
      } else if eid == 13 {
          # Registry Value Set -> Registry Value Activity 201002 (Windows
          # extension), activity 2 (Set). reg_value carries the value + data.
          class_uid = 201002; class_name = "Registry Value Activity"; category_uid = 1; category_name = "System Activity"
          activity_id = 2; activity_name = "Set"
          ocsf.actor = { "process": subject_process, "user": { "name": actor_user } }
          # Sysmon TargetObject is the full key\value; split on the LAST backslash:
          # tail -> reg_value.name (required), head -> reg_value.path (required).
          tgt = string(ed.TargetObject) ?? ""
          rv_name = ""
          rvm, rvmerr = parse_regex(tgt, r'(?P<n>[^\\]+)$')
          if rvmerr == null { rv_name = string(rvm.n) ?? "" }
          rv_path = tgt
          rpm, rpmerr = parse_regex(tgt, r'^(?P<p>.*)\\[^\\]+$')
          if rpmerr == null { rv_path = string(rpm.p) ?? "" }
          ocsf.reg_value = { "name": rv_name, "path": rv_path, "data": string(ed.Details) ?? "" }
          ocsf.device = { "hostname": computer }
      } else if eid == 7 {
          # Image Loaded -> Module Activity 1005 (Load). OCSF models this as a
          # module load: the loading process is the ACTOR (actor.process), the
          # loaded image is the `module` (its own subject), NOT Process Activity.
          class_uid = 1005; class_name = "Module Activity"; category_uid = 1; category_name = "System Activity"
          activity_id = 1; activity_name = "Load"
          loaded = string(ed.ImageLoaded) ?? ""
          mod_name = ""
          mnm, mnmerr = parse_regex(loaded, r'(?P<b>[^\\/]+)$')
          if mnmerr == null { mod_name = string(mnm.b) ?? "" }
          ocsf.actor = { "process": subject_process, "user": { "name": actor_user } }
          signed_raw = downcase(string(ed.Signed) ?? "")
          signature_state = string(ed.SignatureStatus) ?? ""
          signature_state_id = 99
          if downcase(signature_state) == "valid" { signature_state_id = 1; signature_state = "Valid" }
          if downcase(signature_state) == "expired" { signature_state_id = 2; signature_state = "Expired" }
          if downcase(signature_state) == "revoked" { signature_state_id = 3; signature_state = "Revoked" }
          if downcase(signature_state) == "untrusted" { signature_state_id = 6; signature_state = "Untrusted" }
          module_file = {
              "path": loaded,
              "name": mod_name,
              "type_id": 1
          }
          if signed_raw == "true" {
              module_file.signatures = [{
                  "algorithm_id": 4,
                  "algorithm": "Authenticode",
                  "serialization_id": 6,
                  "serialization": "Authenticode",
                  "developer_uid": string(ed.Signature) ?? "",
                  "state_id": signature_state_id,
                  "state": signature_state
              }]
          } else {
              # OCSF models positive signing evidence as `signatures[]` but has
              # no explicit unsigned boolean. Preserve that negative source
              # assertion (and any source status text) without fabricating a
              # Digital Signature object.
              ocsf.unmapped = {
                  "signed": ed.Signed,
                  "signature": string(ed.Signature) ?? null,
                  "signature_status": string(ed.SignatureStatus) ?? null
              }
          }
          ocsf.module = { "load_type_id": 1, "file": module_file }
          ocsf.device = { "hostname": computer }
      } else if eid == 10 {
          # Process Access -> Process Activity 1007 (Open). Source = actor, Target = process.
          class_uid = 1007; class_name = "Process Activity"; category_uid = 1; category_name = "System Activity"
          activity_id = 3; activity_name = "Open"
          simg = string(ed.SourceImage) ?? ""
          src_proc_name = ""
          snm, snmerr = parse_regex(simg, r'(?P<b>[^\\/]+)$')
          if snmerr == null { src_proc_name = string(snm.b) ?? "" }
          timg = string(ed.TargetImage) ?? ""
          tgt_proc_name = ""
          tnm, tnmerr = parse_regex(timg, r'(?P<b>[^\\/]+)$')
          if tnmerr == null { tgt_proc_name = string(tnm.b) ?? "" }
          ocsf.actor = {
              "process": { "name": src_proc_name, "uid": string(ed.SourceProcessGUID) ?? "", "pid": to_int(ed.SourceProcessId) ?? 0, "file": { "name": src_proc_name, "path": simg, "type_id": 1 } },
              "user": { "name": actor_user }
          }
          ocsf.process = { "name": tgt_proc_name, "uid": string(ed.TargetProcessGUID) ?? "", "pid": to_int(ed.TargetProcessId) ?? 0, "file": { "name": tgt_proc_name, "path": timg, "type_id": 1 } }
          ocsf.device = { "hostname": computer }
          # OCSF actual_permissions is integer_t. Sysmon emits a hexadecimal
          # access mask such as 0x1fffff, so preserve the mask losslessly as an
          # integer instead of leaking its source string into the typed field.
          granted_access_raw = downcase(string(ed.GrantedAccess) ?? "")
          if granted_access_raw != "" {
              granted_access_hex = replace(granted_access_raw, "0x", "")
              granted_access, granted_access_err = parse_int(granted_access_hex, base: 16)
              if granted_access_err == null { ocsf.actual_permissions = granted_access }
          }
      } else if eid == 3 {
          # Network Connection -> Network Activity 4001 (Open)
          class_uid = 4001; class_name = "Network Activity"; category_uid = 4; category_name = "Network Activity"
          activity_id = 1; activity_name = "Open"
          proto = downcase(string(ed.Protocol) ?? "")
          ocsf.src_endpoint = { "ip": downcase(string(ed.SourceIp) ?? ""), "port": to_int(ed.SourcePort) ?? 0, "hostname": downcase(string(ed.SourceHostname) ?? "") }
          ocsf.dst_endpoint = { "ip": downcase(string(ed.DestinationIp) ?? ""), "port": to_int(ed.DestinationPort) ?? 0, "hostname": downcase(string(ed.DestinationHostname) ?? "") }
          # protocol_num is an IANA number; only emit it when known (no -1 sentinel).
          if proto == "tcp" { ocsf.connection_info = { "direction_id": 0, "protocol_num": 6 } }
          if proto == "udp" { ocsf.connection_info = { "direction_id": 0, "protocol_num": 17 } }
          if !is_object(ocsf.connection_info) { ocsf.connection_info = { "direction_id": 0 } }
          ocsf.actor = { "process": actor_process, "user": { "name": actor_user } }
          ocsf.device = { "hostname": computer }
      } else if eid == 11 || eid == 23 {
          # File Create / Delete -> File System Activity 1001
          class_uid = 1001; class_name = "File System Activity"; category_uid = 1; category_name = "System Activity"
          if eid == 11 { activity_id = 1; activity_name = "Create" }
          if eid == 23 { activity_id = 4; activity_name = "Delete" }
          tf = string(ed.TargetFilename) ?? ""
          file_name = ""
          fnm, fnmerr = parse_regex(tf, r'(?P<b>[^\\/]+)$')
          if fnmerr == null { file_name = string(fnm.b) ?? "" }
          file_obj = { "name": file_name, "path": tf, "type_id": 1 }
          if sha != "" { file_obj.hashes = [{ "algorithm_id": 3, "value": sha }] }
          ocsf.file = file_obj
          ocsf.actor = { "process": actor_process, "user": { "name": actor_user } }
          ocsf.device = { "hostname": computer }
      } else if eid == 22 {
          # DNS Query -> DNS Activity 4003 (Query)
          class_uid = 4003; class_name = "DNS Activity"; category_uid = 4; category_name = "Network Activity"
          activity_id = 1; activity_name = "Query"
          # OCSF 1.9 DNS Activity requires at least one network endpoint. Sysmon
          # observes the query on this host, so the device is also the source
          # endpoint even though Event ID 22 does not carry a remote DNS server.
          if computer != "" { ocsf.src_endpoint = { "hostname": computer } }
          ocsf.query = { "hostname": downcase(string(ed.QueryName) ?? "") }
          qr = string(ed.QueryResults) ?? ""
          if qr != "" { ocsf.answers = [{ "rdata": qr }] }
          ocsf.actor = { "process": actor_process, "user": { "name": actor_user } }
          ocsf.device = { "hostname": computer }
      } else {
          # unknown EventID -> Process Activity / Other, carry context.
          # 1007 requires `process`; the only process this record describes is the
          # Image-based one, so it is both subject and (with its parent) actor.
          ocsf.process = subject_process
          ocsf.actor = { "process": actor_process, "user": { "name": actor_user } }
          ocsf.device = { "hostname": computer }
      }

      # ---- common envelope ----
      ocsf.class_uid = class_uid
      ocsf.class_name = class_name
      ocsf.category_uid = category_uid
      ocsf.category_name = category_name
      ocsf.activity_id = activity_id
      ocsf.activity_name = activity_name
      ocsf.type_uid = class_uid * 100 + activity_id
      ocsf.severity_id = 1
      ocsf.severity = "Informational"
      ocsf.status_id = 1
      ocsf.status = "Success"
      ocsf.time = time_ms
      ocsf.message = raw_log
      ocsf.raw_data = raw_log
      # Windows record_id is only unique within a host/channel stream and can be
      # reused after a log reset. Include the source event time so replaying the
      # same event stays idempotent while a later reused RecordID cannot collide.
      record_id = to_string(p.record_id) ?? ""
      log_name = downcase(string(p.channel) ?? "Microsoft-Windows-Sysmon/Operational")
      log_provider = downcase(string(p.provider_name) ?? "Microsoft-Windows-Sysmon")
      record_uid = ""
      if record_id != "" && computer != "" && ts_str != "" {
          record_uid = join!(["windows_sysmon", computer, log_name, log_provider, record_id, ts_str], "|")
      }
      if record_uid == "" { record_uid = uuid_v4() }
      if is_object(ocsf.device) { ocsf.device.type_id = 0 }
      ocsf.metadata = {
          "version": "1.9.0",
          "profiles": ["host"],
          "uid": record_uid,
          "original_event_uid": record_uid,
          "event_code": to_string(eid),
          "log_name": string(p.channel) ?? "Microsoft-Windows-Sysmon/Operational",
          "log_provider": string(p.provider_name) ?? "Microsoft-Windows-Sysmon",
          "product": { "name": "Sysmon", "vendor_name": "Microsoft" }
      }

      . = ocsf
  }
samples:
  - raw: "{\"event_id\":1,\"record_id\":91234,\"channel\":\"Microsoft-Windows-Sysmon/Operational\",\"provider_name\":\"Microsoft-Windows-Sysmon\",\"computer\":\"WKS-01.corp.local\",\"timestamp\":\"2026-08-18T10:15:00.123Z\",\"event_data\":{\"Image\":\"C:\\\\Windows\\\\System32\\\\cmd.exe\",\"CommandLine\":\"cmd.exe /c whoami\",\"ProcessId\":\"4321\",\"ProcessGuid\":\"{aaaa-1111}\",\"ParentImage\":\"C:\\\\Windows\\\\explorer.exe\",\"ParentCommandLine\":\"explorer.exe\",\"ParentProcessId\":\"1200\",\"User\":\"CORP\\\\alice\",\"Hashes\":\"SHA256=ABCD1234EF,MD5=00112233\"}}"
    expect:
      "class_uid": 1007
      "activity_id": 1
      "metadata.version": "1.9.0"
  - raw: "{\"event_id\":10,\"record_id\":91236,\"computer\":\"WKS-01\",\"timestamp\":\"2026-08-18T10:17:00Z\",\"event_data\":{\"SourceImage\":\"C:\\\\tools\\\\mimikatz.exe\",\"SourceProcessId\":\"777\",\"SourceProcessGUID\":\"{bbbb}\",\"TargetImage\":\"C:\\\\Windows\\\\System32\\\\lsass.exe\",\"TargetProcessId\":\"640\",\"TargetProcessGUID\":\"{cccc}\",\"GrantedAccess\":\"0x1fffff\",\"User\":\"CORP\\\\alice\"}}"
    expect:
      "class_uid": 1007
      "activity_id": 3
      "metadata.version": "1.9.0"
  - raw: "{\"event_id\":11,\"record_id\":91242,\"computer\":\"WKS-01\",\"timestamp\":\"2026-08-18T10:22:00Z\",\"event_data\":{\"Image\":\"C:\\\\Windows\\\\System32\\\\notepad.exe\",\"TargetFilename\":\"C:\\\\Users\\\\alice\\\\notes.txt\",\"ProcessId\":\"1010\",\"User\":\"CORP\\\\alice\"}}"
    expect:
      "class_uid": 1001
      "activity_id": 1
      "metadata.version": "1.9.0"
  - raw: "{\"event_id\":12,\"record_id\":91239,\"computer\":\"WKS-01\",\"timestamp\":\"2026-08-18T10:19:00Z\",\"event_data\":{\"EventType\":\"CreateKey\",\"TargetObject\":\"HKLM\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run\",\"Image\":\"C:\\\\Windows\\\\regedit.exe\",\"ProcessId\":\"555\",\"User\":\"CORP\\\\bob\"}}"
    expect:
      "class_uid": 201001
      "activity_id": 1
      "metadata.version": "1.9.0"
  - raw: "{\"event_id\":13,\"record_id\":91240,\"computer\":\"WKS-01\",\"timestamp\":\"2026-08-18T10:20:00Z\",\"event_data\":{\"EventType\":\"SetValue\",\"TargetObject\":\"HKLM\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run\\\\Updater\",\"Details\":\"C:\\\\tmp\\\\bad.exe\",\"Image\":\"C:\\\\Windows\\\\regedit.exe\",\"ProcessId\":\"555\",\"User\":\"CORP\\\\bob\"}}"
    expect:
      "class_uid": 201002
      "activity_id": 2
      "metadata.version": "1.9.0"
  - raw: "{\"event_id\":22,\"record_id\":91244,\"computer\":\"WKS-01\",\"timestamp\":\"2026-08-18T10:24:00Z\",\"event_data\":{\"Image\":\"C:\\\\Windows\\\\System32\\\\svchost.exe\",\"QueryName\":\"evil.example.com\",\"QueryResults\":\"type:  5 evil.cdn.net;::ffff:1.2.3.4;\",\"ProcessId\":\"1012\"}}"
    expect:
      "class_uid": 4003
      "activity_id": 1
      "metadata.version": "1.9.0"
  - raw: "{\"event_id\":23,\"record_id\":91243,\"computer\":\"WKS-01\",\"timestamp\":\"2026-08-18T10:23:00Z\",\"event_data\":{\"Image\":\"C:\\\\Windows\\\\System32\\\\cmd.exe\",\"TargetFilename\":\"C:\\\\Users\\\\alice\\\\secret.docx\",\"Hashes\":\"SHA256=FFEE0011\",\"ProcessId\":\"1011\"}}"
    expect:
      "class_uid": 1001
      "activity_id": 4
      "metadata.version": "1.9.0"
  - raw: "{\"event_id\":3,\"record_id\":91241,\"computer\":\"WKS-01\",\"timestamp\":\"2026-08-18T10:21:00Z\",\"event_data\":{\"Image\":\"C:\\\\Windows\\\\System32\\\\curl.exe\",\"ProcessId\":\"888\",\"Protocol\":\"tcp\",\"SourceIp\":\"10.1.2.3\",\"SourcePort\":\"51234\",\"SourceHostname\":\"WKS-01\",\"DestinationIp\":\"93.184.216.34\",\"DestinationPort\":\"443\",\"DestinationHostname\":\"example.com\",\"User\":\"CORP\\\\alice\"}}"
    expect:
      "class_uid": 4001
      "activity_id": 1
      "metadata.version": "1.9.0"
  - raw: "{\"event_id\":5,\"record_id\":91235,\"computer\":\"WKS-01\",\"timestamp\":\"2026-08-18T10:16:00Z\",\"event_data\":{\"Image\":\"C:\\\\Windows\\\\System32\\\\cmd.exe\",\"ProcessId\":\"4321\",\"ProcessGuid\":\"{aaaa-1111}\",\"User\":\"CORP\\\\alice\"}}"
    expect:
      "class_uid": 1007
      "activity_id": 2
      "metadata.version": "1.9.0"
  - raw: "{\"event_id\":7,\"record_id\":91237,\"computer\":\"WKS-01\",\"timestamp\":\"2026-08-18T10:18:00Z\",\"event_data\":{\"Image\":\"C:\\\\Windows\\\\System32\\\\svchost.exe\",\"ImageLoaded\":\"C:\\\\Windows\\\\System32\\\\ntdll.dll\",\"Signed\":\"true\",\"Signature\":\"Microsoft Windows\",\"SignatureStatus\":\"Valid\",\"ProcessId\":\"900\",\"User\":\"NT AUTHORITY\\\\SYSTEM\"}}"
    expect:
      "class_uid": 1005
      "activity_id": 1
      "metadata.version": "1.9.0"
  - raw: "{\"event_id\":7,\"record_id\":91238,\"computer\":\"WKS-01\",\"timestamp\":\"2026-08-18T10:18:30Z\",\"event_data\":{\"Image\":\"C:\\\\tmp\\\\bad.exe\",\"ImageLoaded\":\"C:\\\\tmp\\\\eeevil.dll\",\"Signed\":\"false\",\"SignatureStatus\":\"Unavailable\",\"ProcessId\":\"901\"}}"
    expect:
      "class_uid": 1005
      "activity_id": 1
      "metadata.version": "1.9.0"
  - raw: "{\"event_id\":255,\"record_id\":91245,\"computer\":\"WKS-01\",\"timestamp\":\"2026-08-18T10:25:00Z\",\"event_data\":{\"Image\":\"C:\\\\Windows\\\\Sysmon.exe\"}}"
    expect:
      "class_uid": 1007
      "activity_id": 99
      "metadata.version": "1.9.0"
  - raw: "not json at all"
    expect:
      "class_uid": 1007
      "activity_id": 99
      "metadata.version": "1.9.0"
