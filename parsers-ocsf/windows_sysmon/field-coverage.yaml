source: json
reference: windows_sysmon
reference_reason: Reuse v1.2 branch consumed-key lists; the independent Sysmon mappings checker verifies
  transformed destinations, including hashes, users, enums and hexadecimal masks.
transforms:
- source: computer
  kind: lowercase
  target: device.hostname
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: computer
  kind: lowercase
  target: src_endpoint.hostname
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: event_data.SourceIp
  kind: lowercase
  target: src_endpoint.ip
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: event_data.SourceHostname
  kind: lowercase
  target: src_endpoint.hostname
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: event_data.DestinationIp
  kind: lowercase
  target: dst_endpoint.ip
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: event_data.DestinationHostname
  kind: lowercase
  target: dst_endpoint.hostname
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: event_data.QueryName
  kind: lowercase
  target: query.hostname
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: timestamp
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: time_created
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: event_data.Protocol
  kind: enum
  target: connection_info.protocol_num
  values:
    tcp: 6
    udp: 17
    icmp: 1
    icmpv6: 58
    ipv6-icmp: 58
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when
    the expected ID is emitted.
- source: event_data.GrantedAccess
  kind: hex
  target: actual_permissions
  reason: Parsed hexadecimal process ID or access mask is represented as an integer at this destination.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  channel:
  - metadata.log_name
  event_data.CommandLine:
  - actor.process.cmd_line
  - process.cmd_line
  event_data.DestinationHostname:
  - dst_endpoint.hostname
  event_data.DestinationIp:
  - dst_endpoint.ip
  event_data.DestinationPort:
  - dst_endpoint.port
  event_data.DestinationPortName:
  - dst_endpoint.svc_name
  event_data.Details:
  - reg_value.data
  event_data.Image:
  - actor.process.file.path
  - process.file.path
  event_data.ImageLoaded:
  - module.file.path
  event_data.IntegrityLevel:
  - process.integrity
  event_data.ParentCommandLine:
  - actor.process.cmd_line
  - actor.process.parent_process.cmd_line
  event_data.ParentImage:
  - actor.process.file.path
  - actor.process.parent_process.file.name
  - actor.process.parent_process.file.path
  - actor.process.parent_process.name
  event_data.ParentProcessGuid:
  - actor.process.parent_process.uid
  - actor.process.uid
  event_data.ParentProcessId:
  - actor.process.parent_process.pid
  - actor.process.pid
  event_data.ParentUser:
  - actor.process.parent_process.user.name
  - actor.process.user.name
  event_data.ProcessGuid:
  - actor.process.uid
  - process.uid
  event_data.ProcessId:
  - actor.process.pid
  - process.pid
  event_data.QueryName:
  - query.hostname
  event_data.QueryResults:
  - answers.rdata
  event_data.Signature:
  - module.file.signatures.developer_uid
  event_data.SignatureStatus:
  - module.file.signatures.state
  event_data.SourceImage:
  - actor.process.file.path
  event_data.SourceIp:
  - src_endpoint.ip
  event_data.SourcePort:
  - src_endpoint.port
  event_data.SourcePortName:
  - src_endpoint.svc_name
  event_data.SourceProcessGUID:
  - actor.process.uid
  event_data.SourceProcessId:
  - actor.process.pid
  event_data.SourceThreadId:
  - actor.process.ptid
  event_data.SourceUser:
  - actor.process.user.name
  event_data.TargetFilename:
  - file.path
  event_data.TargetImage:
  - process.file.path
  event_data.TargetObject:
  - reg_key.path
  event_data.TargetProcessGUID:
  - process.uid
  event_data.TargetProcessId:
  - process.pid
  event_data.TargetUser:
  - process.user.name
  event_id:
  - metadata.event_code
  provider_name:
  - metadata.log_provider
  record_id:
  - metadata.original_event_uid
