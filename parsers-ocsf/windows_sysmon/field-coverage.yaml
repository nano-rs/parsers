- source: timestamp
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: time_created
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: event_data.UtcTime
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: event_data.CreationUtcTime
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: host
  kind: lowercase
  reason: Case normalization already performed by the parser; observed at device.hostname,
    and checked against the emitted branch.
- source: event_data.Protocol
  kind: enum
  target: connection_info.protocol_num
  values:
    tcp: 6
    udp: 17
    icmp: 1
    icmpv6: 58
    ipv6-icmp: 58
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping;
    consume only when the expected ID is emitted.
- source: event_data.GrantedAccess
  kind: hex
  target: actual_permissions
  reason: Parsed hexadecimal process ID or access mask is represented as an integer
    at this destination.
reference: windows_sysmon
reference_reason: Reuse v1.2 branch consumed-key lists; the independent Sysmon mappings
  checker verifies transformed destinations, including hashes, users, enums and hexadecimal
  masks.
