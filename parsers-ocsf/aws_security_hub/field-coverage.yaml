source: json
transforms:
- source: CreatedAt
  kind: epoch_ms
  target: finding_info.created_time
  reason: Successful ISO timestamp conversion to the emitted millisecond clock.
- source: UpdatedAt
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the emitted millisecond clock.
- source: FirstObservedAt
  kind: epoch_ms
  target: finding_info.first_seen_time
  reason: Successful ISO timestamp conversion to the emitted millisecond clock.
- source: LastObservedAt
  kind: epoch_ms
  target: finding_info.last_seen_time
  reason: Successful ISO timestamp conversion to the emitted millisecond clock.
- source: ProcessedAt
  kind: epoch_ms
  target: metadata.processed_time
  reason: Successful ISO timestamp conversion to the emitted millisecond clock.
- source: Process.LaunchedAt
  kind: epoch_ms
  target: actor.process.created_time
  reason: Successful ISO timestamp conversion to the emitted millisecond clock.
- source: Process.TerminatedAt
  kind: epoch_ms
  target: actor.process.terminated_time
  reason: Successful ISO timestamp conversion to the emitted millisecond clock.
- source: Severity.Label
  kind: enum
  target: severity_id
  values:
    informational: 1
    low: 2
    medium: 3
    high: 4
    critical: 5
  reason: The ASFF severity label normalized to the OCSF severity; consume only when the expected ID is
    emitted.
- source: Workflow.Status
  kind: enum
  target: status_id
  values:
    new: 1
    notified: 2
    suppressed: 3
    resolved: 4
  reason: The ASFF workflow status normalized to the OCSF finding status; consume only when the expected
    ID is emitted.
- source: Compliance.Status
  kind: enum
  target: compliance.status_id
  values:
    passed: 1
    warning: 2
    failed: 3
    not_available: 99
  reason: The ASFF compliance status normalized to the OCSF compliance status; consume only when the expected
    ID is emitted.
- source: VerificationState
  kind: enum
  target: verdict_id
  values:
    unknown: 0
    false_positive: 1
    true_positive: 2
    benign_positive: 5
  reason: The ASFF verification state normalized to the OCSF verdict; consume only when the expected ID
    is emitted.
- source: ProductFields.aws/guardduty/service/action/networkConnectionAction/protocol
  kind: lowercase
  target: evidences.connection_info.protocol_name
  reason: Parser lowercases the GuardDuty protocol; consume only when the normalized value is emitted.
- source: ProductFields.aws/guardduty/service/action/networkConnectionAction/connectionDirection
  kind: enum
  values:
    inbound: 1
    outbound: 2
  target: evidences.connection_info.direction_id
  reason: GuardDuty connection direction normalized to the OCSF direction_id in the evidence; consume
    only when that ID is emitted.
- source: ProductFields.aws/guardduty/service/action/networkConnectionAction/remoteIpDetails/ipAddressV6
  kind: lowercase
  target: evidences.src_endpoint.ip
  reason: Parser lowercases the GuardDuty IPv6 address; consume only when the normalized value is emitted.
- source: ProductFields.aws/guardduty/service/action/networkConnectionAction/localIpDetails/ipAddressV6
  kind: lowercase
  target: evidences.dst_endpoint.ip
  reason: Parser lowercases the GuardDuty IPv6 address; consume only when the normalized value is emitted.
- source: ProductFields.aws/guardduty/service/action/awsApiCallAction/remoteIpDetails/ipAddressV6
  kind: lowercase
  target: evidences.src_endpoint.ip
  reason: Parser lowercases the GuardDuty IPv6 address; consume only when the normalized value is emitted.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
