source: json
transforms:
- source: CreatedAt
  kind: epoch_ms
  target: finding_info.created_time
  reason: Successful ISO timestamp conversion to the emitted millisecond clock.
- source: UpdatedAt
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the emitted millisecond clock.
- source: FirstObservedAt
  kind: epoch_ms
  target: finding_info.first_seen_time
  reason: Successful ISO timestamp conversion to the emitted millisecond clock.
- source: LastObservedAt
  kind: epoch_ms
  target: finding_info.last_seen_time
  reason: Successful ISO timestamp conversion to the emitted millisecond clock.
- source: ProcessedAt
  kind: epoch_ms
  target: metadata.processed_time
  reason: Successful ISO timestamp conversion to the emitted millisecond clock.
- source: Process.LaunchedAt
  kind: epoch_ms
  reason: Successful ISO timestamp conversion to the emitted millisecond clock.
- source: Process.TerminatedAt
  kind: epoch_ms
  reason: Successful ISO timestamp conversion to the emitted millisecond clock.
- source: Network.Protocol
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: Action.NetworkConnectionAction.Protocol
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: Network.SourceMac
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: Severity.Label
  kind: enum
  target: severity_id
  values:
    informational: 1
    low: 2
    medium: 3
    high: 4
    critical: 5
  reason: The ASFF severity label normalized to the OCSF severity; consume only when the expected ID is emitted.
- source: FindingProviderFields.Severity.Label
  kind: enum
  target: severity_id
  values:
    informational: 1
    low: 2
    medium: 3
    high: 4
    critical: 5
  reason: The provider severity label, used when Severity.Label is absent; consume only when the expected ID is emitted.
- source: Workflow.Status
  kind: enum
  target: status_id
  values:
    new: 1
    notified: 2
    suppressed: 3
    resolved: 4
  reason: The ASFF workflow status normalized to the OCSF finding status; consume only when the expected ID is emitted.
- source: Compliance.Status
  kind: enum
  target: compliance.status_id
  values:
    passed: 1
    warning: 2
    failed: 3
    not_available: 99
  reason: The ASFF compliance status normalized to the OCSF compliance status; consume only when the expected ID is emitted.
- source: VerificationState
  kind: enum
  target: verdict_id
  values:
    unknown: 0
    false_positive: 1
    true_positive: 2
    benign_positive: 5
  reason: The ASFF verification state normalized to the OCSF verdict; consume only when the expected ID is emitted.
- source: Network.Direction
  kind: enum
  values:
    in: 1
    out: 2
    inbound: 1
    outbound: 2
  reason: Connection direction normalized to the OCSF direction_id in the evidence; consume only when that ID is emitted.
- source: Action.NetworkConnectionAction.ConnectionDirection
  kind: enum
  values:
    in: 1
    out: 2
    inbound: 1
    outbound: 2
  reason: Connection direction normalized to the OCSF direction_id in the evidence; consume only when that ID is emitted.
