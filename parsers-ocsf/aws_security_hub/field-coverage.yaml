    new: 1
    notified: 2
    suppressed: 3
    resolved: 4
  reason: The ASFF workflow status normalized to the OCSF finding status; consume only when
    the expected ID is emitted.
- source: Compliance.Status
  kind: enum
  target: compliance.status_id
  values:
    passed: 1
    warning: 2
    failed: 3
    not_available: 99
  reason: The ASFF compliance status normalized to the OCSF compliance status; consume only
    when the expected ID is emitted.
- source: VerificationState
  kind: enum
  target: verdict_id
