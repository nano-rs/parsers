          if rcountry != "" { rloc.country = rcountry }
          rcity = to_string(get(remote, ["City", "CityName"]) ?? "") ?? ""
          if rcity != "" { rloc.city = rcity }
          if length(keys(rloc)) > 0 { rep.location = rloc }
          ras = {}
          rasn = to_int(get(remote, ["Organization", "Asn"]) ?? 0) ?? 0
