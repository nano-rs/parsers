          rasorg = to_string(get(remote, ["Organization", "AsnOrg"]) ?? "") ?? ""
          if rasorg != "" { ras.name = rasorg }
          if length(keys(ras)) > 0 { rep.autonomous_system = ras }
          risp = to_string(get(remote, ["Organization", "Isp"]) ?? "") ?? ""
          if risp != "" { rep.isp = risp }
          rorg = to_string(get(remote, ["Organization", "Org"]) ?? "") ?? ""
          if rorg != "" { rep.isp_org = rorg }
