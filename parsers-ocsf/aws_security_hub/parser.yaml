name: aws_security_hub_ocsf
display_name: AWS Security Hub Findings (OCSF)
version: "1.0.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields in redacted, dotted snake_case unmapped keys.
  Parses AWS Security Hub findings in the AWS Security Finding Format (ASFF),
  including findings aggregated from GuardDuty, Inspector, Macie, AWS Config,
  IAM Access Analyzer, Firewall Manager and partner products, into complete OCSF
  1.9.0 findings carrying the cloud and security_control profiles (plus incident
  when a VerificationState verdict is present). The class follows the finding:
  a finding with Vulnerabilities[] (Inspector CVEs, package findings) is a
  "Vulnerability Finding" (2002); one with Compliance.Status (Security Hub
  controls, AWS Config rules) is a "Compliance Finding" (2003); everything else
  (GuardDuty threats, Macie, Access Analyzer) is a "Detection Finding" (2004).
  Severity.Label (or Severity.Normalized) maps to severity_id, Workflow.Status
  to status_id (an ARCHIVED record is Archived and its activity is Close),
  VerificationState to verdict, the originating integration to
  metadata.product.feature.name and finding_info.product, Resources[] to
  resources[] with their tags, and Network / Action / Process to evidences[].
  metadata.uid is Id + UpdatedAt, so each update of a finding is its own record.
  Accepts a bare ASFF finding (GetFindings, Firehose, S3 export) or the
  EventBridge "Security Hub Findings - Imported" envelope, which carries one
  finding per event. This is a separate lane from aws_guardduty, which parses
  GuardDuty's native finding JSON. Anything else falls back to Base Event with
  the raw record kept.
match_values:
  - aws_security_hub
category: cloud
vendor: "Amazon"
product: "Security Hub"
parser_vrl: |
  # AWS Security Hub ASFF finding -> OCSF 1.9.0 Vulnerability (2002) /
  # Compliance (2003) / Detection (2004) Finding
  raw_log = to_string(.message) ?? ""
  __raw_body = raw_log
  __source_kv = {}

  parsed, err = parse_json(raw_log)
  __source_kv = object(parsed) ?? {}
  p = object(parsed) ?? {}

  # The EventBridge envelope carries one finding in detail.findings[0].
  f = p
  env_findings = array(get(p, ["detail", "findings"]) ?? null) ?? []
  if length(env_findings) > 0 { f = object(get(env_findings, [0]) ?? {}) ?? {} }
  finding_id = to_string(f.Id) ?? ""
  is_asff = finding_id != "" && (f.SchemaVersion != null || f.ProductArn != null)

  if err != null || !is_object(parsed) || !is_asff {
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 99,
          "activity_name": "Other",
          "type_uid": 99,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": 0,
          "message": "Unrecognized Security Hub record",
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "profiles": ["cloud"],
              "uid": sha2("aws_security_hub|raw|" + raw_log, variant: "SHA-256"),
              "log_level": "error",
              "log_name": "Security Hub findings",
              "product": { "name": "AWS Security Hub", "vendor_name": "Amazon" }
          },
          "cloud": { "provider": "AWS" }
      }
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      . = set!(., ["unmapped", "parse_fallback"], "unparsable input")
  } else {
      sev_obj = object(f.Severity) ?? {}
      fpf = object(f.FindingProviderFields) ?? {}
      compliance_src = object(f.Compliance) ?? {}
      vulns_src = array(f.Vulnerabilities) ?? []

      # ---- class by finding content ----
      class_uid = 2004
      class_name = "Detection Finding"
      comp_status = upcase(to_string(compliance_src.Status) ?? "")
      if length(vulns_src) > 0 {
          class_uid = 2002
          class_name = "Vulnerability Finding"
      } else if comp_status != "" {
          class_uid = 2003
          class_name = "Compliance Finding"
      }

      # ---- times ----
      created_ms = 0
      created_str = to_string(f.CreatedAt) ?? ""
      if created_str != "" {
          ct, cterr = parse_timestamp(created_str, "%+")
          if cterr == null { created_ms = to_unix_timestamp(ct, unit: "milliseconds") }
      }
      updated_ms = 0
      updated_str = to_string(f.UpdatedAt) ?? ""
      if updated_str != "" {
          ut, uterr = parse_timestamp(updated_str, "%+")
          if uterr == null { updated_ms = to_unix_timestamp(ut, unit: "milliseconds") }
      }
      first_ms = 0
      first_str = to_string(f.FirstObservedAt) ?? ""
      if first_str != "" {
          ft, fterr = parse_timestamp(first_str, "%+")
          if fterr == null { first_ms = to_unix_timestamp(ft, unit: "milliseconds") }
      }
      last_ms = 0
      last_str = to_string(f.LastObservedAt) ?? ""
      if last_str != "" {
          lt, lterr = parse_timestamp(last_str, "%+")
          if lterr == null { last_ms = to_unix_timestamp(lt, unit: "milliseconds") }
      }
      processed_ms = 0
      processed_str = to_string(f.ProcessedAt) ?? ""
      if processed_str != "" {
          pt, pterr = parse_timestamp(processed_str, "%+")
          if pterr == null { processed_ms = to_unix_timestamp(pt, unit: "milliseconds") }
      }
      time_ms = updated_ms
      if time_ms == 0 { time_ms = created_ms }

      # ---- severity: Label, else Normalized (0-100) ----
      label = upcase(to_string(sev_obj.Label) ?? "")
      if label == "" { label = upcase(to_string(get(fpf, ["Severity", "Label"]) ?? "") ?? "") }
      severity_id = 0
      severity = "Unknown"
      if label == "INFORMATIONAL" { severity_id = 1; severity = "Informational" }
      if label == "LOW" { severity_id = 2; severity = "Low" }
      if label == "MEDIUM" { severity_id = 3; severity = "Medium" }
      if label == "HIGH" { severity_id = 4; severity = "High" }
      if label == "CRITICAL" { severity_id = 5; severity = "Critical" }
      if severity_id == 0 && sev_obj.Normalized != null {
          norm = to_int(sev_obj.Normalized) ?? -1
          if norm == 0 { severity_id = 1; severity = "Informational" }
          if norm >= 1 { severity_id = 2; severity = "Low" }
          if norm >= 40 { severity_id = 3; severity = "Medium" }
          if norm >= 70 { severity_id = 4; severity = "High" }
          if norm >= 90 { severity_id = 5; severity = "Critical" }
      }

      # ---- lifecycle: Workflow.Status + RecordState ----
      record_state = upcase(to_string(f.RecordState) ?? "")
      workflow = upcase(to_string(get(f, ["Workflow", "Status"]) ?? "") ?? "")
      status_id = 0
      status_str = "Unknown"
      if workflow == "NEW" { status_id = 1; status_str = "New" }
      if workflow == "NOTIFIED" { status_id = 2; status_str = "In Progress" }
      if workflow == "SUPPRESSED" { status_id = 3; status_str = "Suppressed" }
      if workflow == "RESOLVED" { status_id = 4; status_str = "Resolved" }
      if record_state == "ARCHIVED" && status_id <= 1 { status_id = 5; status_str = "Archived" }
      activity_id = 1
      activity_name = "Create"
      if updated_ms > created_ms && created_ms > 0 { activity_id = 2; activity_name = "Update" }
      if record_state == "ARCHIVED" { activity_id = 3; activity_name = "Close" }

      # ---- the originating integration ----
      product_name = to_string(f.ProductName) ?? ""
      if product_name == "" { product_name = to_string(get(f, ["ProductFields", "aws/securityhub/ProductName"]) ?? "") ?? "" }
      company = to_string(f.CompanyName) ?? ""
      if company == "" { company = to_string(get(f, ["ProductFields", "aws/securityhub/CompanyName"]) ?? "") ?? "" }
      product_arn = to_string(f.ProductArn) ?? ""
      origin = {}
      if product_name != "" { origin.name = product_name }
      if company != "" { origin.vendor_name = company }
      if product_arn != "" { origin.uid = product_arn }

      types = array(f.Types) ?? []
      title = to_string(f.Title) ?? ""
      generator = to_string(f.GeneratorId) ?? ""

      finding_info = { "uid": finding_id, "title": title }
      if title == "" { finding_info.title = finding_id }
      desc = to_string(f.Description) ?? ""
      if desc != "" { finding_info.desc = desc }
      if length(types) > 0 { finding_info.types = types }
      if created_ms > 0 { finding_info.created_time = created_ms }
      if updated_ms > 0 { finding_info.modified_time = updated_ms }
      if first_ms > 0 { finding_info.first_seen_time = first_ms }
      if last_ms > 0 { finding_info.last_seen_time = last_ms }
      src_url = to_string(f.SourceUrl) ?? ""
      if src_url != "" { finding_info.src_url = src_url }
      if product_arn != "" { finding_info.product_uid = product_arn }
      if length(keys(origin)) > 0 { finding_info.product = origin }
      if product_name != "" { finding_info.data_sources = [product_name] }
      if generator != "" { finding_info.analytic = { "uid": generator, "name": generator, "type_id": 1, "type": "Rule" } }

      # ---- cloud ----
      cloud = { "provider": "AWS" }
      acct = to_string(f.AwsAccountId) ?? ""
      if acct != "" { cloud.account = { "uid": acct } }
      acct_name = to_string(f.AwsAccountName) ?? ""
      if acct_name != "" && acct != "" { cloud.account.name = acct_name }
      region = to_string(f.Region) ?? ""
      if region != "" { cloud.region = region }

      # ---- resources ----
      resources = []
      for_each(array(f.Resources) ?? []) -> |_i, r| {
          rid = to_string(get(r, ["Id"]) ?? "") ?? ""
          res = {}
          if rid != "" {
              res.uid = rid
              rparts = split(rid, "/")
              rname = to_string(get(rparts, [length(rparts) - 1]) ?? "") ?? ""
              if rname != "" { res.name = rname }
          }
          rtype = to_string(get(r, ["Type"]) ?? "") ?? ""
          if rtype != "" { res.type = rtype }
          rregion = to_string(get(r, ["Region"]) ?? "") ?? ""
          if rregion != "" { res.region = rregion }
          rpart = to_string(get(r, ["Partition"]) ?? "") ?? ""
          if rpart != "" { res.cloud_partition = rpart }
          rtags = object(get(r, ["Tags"]) ?? {}) ?? {}
          tag_list = []
          for_each(rtags) -> |k, v| { tag_list = push(tag_list, { "name": k, "value": to_string(v) ?? "" }) }
          if length(tag_list) > 0 { res.tags = tag_list }
          if length(keys(res)) > 0 { resources = push(resources, res) }
      }

      # ---- malware ----
      malware = []
      for_each(array(f.Malware) ?? []) -> |_i, m| {
          mtype = upcase(to_string(get(m, ["Type"]) ?? "") ?? "")
          cid = 99
          if mtype == "ADWARE" { cid = 1 }
          if mtype == "BOTNET_AGENT" { cid = 3 }
          if mtype == "EXPLOIT_KIT" { cid = 8 }
          if mtype == "KEYLOGGER" { cid = 9 }
          if mtype == "RANSOMWARE" { cid = 10 }
          if mtype == "REMOTE_ACCESS" { cid = 11 }
          if mtype == "COIN_MINER" { cid = 13 }
          if mtype == "ROOTKIT" { cid = 15 }
          if mtype == "SPYWARE" { cid = 17 }
          if mtype == "TROJAN" { cid = 18 }
          if mtype == "VIRUS" { cid = 19 }
          if mtype == "WORM" { cid = 22 }
          mal = { "classification_ids": [cid] }
          mname = to_string(get(m, ["Name"]) ?? "") ?? ""
          if mname != "" { mal.name = mname }
          mpath = to_string(get(m, ["Path"]) ?? "") ?? ""
          if mpath != "" { mal.path = mpath }
          if mtype != "" { mal.classifications = [mtype] }
          malware = push(malware, mal)
      }

      # ---- remediation ----
      rec_text = to_string(get(f, ["Remediation", "Recommendation", "Text"]) ?? "") ?? ""
      rec_url = to_string(get(f, ["Remediation", "Recommendation", "Url"]) ?? "") ?? ""
      remediation = {}
      if rec_text != "" { remediation.desc = rec_text }
      if rec_url != "" {
          if rec_text == "" { remediation.desc = rec_url }
          remediation.references = [rec_url]
      }

      # ---- evidence: Network, Action (GuardDuty shapes), Process ----
      src_ep = {}
      dst_ep = {}
      conn = {}
      net = object(f.Network) ?? {}
      if length(keys(net)) > 0 {
          sip = to_string(net.SourceIpV4) ?? ""
          if sip == "" { sip = to_string(net.SourceIpV6) ?? "" }
          if sip != "" { src_ep.ip = downcase(sip) }
          sport = to_int(net.SourcePort) ?? 0
          if sport > 0 { src_ep.port = sport }
          sdom = to_string(net.SourceDomain) ?? ""
          if sdom != "" { src_ep.domain = sdom }
          smac = to_string(net.SourceMac) ?? ""
          if smac != "" { src_ep.mac = downcase(smac) }
          dip = to_string(net.DestinationIpV4) ?? ""
          if dip == "" { dip = to_string(net.DestinationIpV6) ?? "" }
          if dip != "" { dst_ep.ip = downcase(dip) }
          dport = to_int(net.DestinationPort) ?? 0
          if dport > 0 { dst_ep.port = dport }
          ddom = to_string(net.DestinationDomain) ?? ""
          if ddom != "" { dst_ep.domain = ddom }
          nproto = to_string(net.Protocol) ?? ""
          if nproto != "" { conn.protocol_name = downcase(nproto) }
          ndir = upcase(to_string(net.Direction) ?? "")
          if ndir == "IN" { conn.direction_id = 1; conn.direction = "Inbound" }
          if ndir == "OUT" { conn.direction_id = 2; conn.direction = "Outbound" }
      }

      act = object(f.Action) ?? {}
      api = {}
      query = {}
      remote = {}
      api_call = object(act.AwsApiCallAction) ?? {}
      if length(keys(api_call)) > 0 {
          api_name = to_string(api_call.Api) ?? ""
          api_svc = to_string(api_call.ServiceName) ?? ""
          if api_name != "" { api.operation = api_name }
          if api_svc != "" { api.service = { "name": api_svc } }
          remote = object(api_call.RemoteIpDetails) ?? {}
      }
      net_act = object(act.NetworkConnectionAction) ?? {}
      if length(keys(net_act)) > 0 {
          remote = object(net_act.RemoteIpDetails) ?? {}
          cdir = upcase(to_string(net_act.ConnectionDirection) ?? "")
          if cdir == "INBOUND" { conn.direction_id = 1; conn.direction = "Inbound" }
          if cdir == "OUTBOUND" { conn.direction_id = 2; conn.direction = "Outbound" }
          aproto = to_string(net_act.Protocol) ?? ""
          if aproto != "" && !exists(conn.protocol_name) { conn.protocol_name = downcase(aproto) }
          lport = to_int(get(net_act, ["LocalPortDetails", "Port"]) ?? 0) ?? 0
          rport = to_int(get(net_act, ["RemotePortDetails", "Port"]) ?? 0) ?? 0
          if cdir == "OUTBOUND" {
              if lport > 0 && !exists(src_ep.port) { src_ep.port = lport }
              if rport > 0 && !exists(dst_ep.port) { dst_ep.port = rport }
          } else {
              if lport > 0 && !exists(dst_ep.port) { dst_ep.port = lport }
              if rport > 0 && !exists(src_ep.port) { src_ep.port = rport }
          }
      }
      dns_act = object(act.DnsRequestAction) ?? {}
      qdomain = to_string(dns_act.Domain) ?? ""
      if qdomain != "" { query = { "hostname": qdomain } }
      probe = object(act.PortProbeAction) ?? {}
      probe_details = array(probe.PortProbeDetails) ?? []
      first_probe = get(probe_details, [0]) ?? null
      if first_probe != null {
          remote = object(get(first_probe, ["RemoteIpDetails"]) ?? {}) ?? {}
          pport = to_int(get(first_probe, ["LocalPortDetails", "Port"]) ?? 0) ?? 0
          if pport > 0 && !exists(dst_ep.port) { dst_ep.port = pport }
          plip = to_string(get(first_probe, ["LocalIpDetails", "IpAddressV4"]) ?? "") ?? ""
          if plip != "" && !exists(dst_ep.ip) { dst_ep.ip = downcase(plip) }
      }
      # The remote party of a GuardDuty action: the destination of an outbound
      # connection, the source otherwise.
      if length(keys(remote)) > 0 {
          rep = {}
          rip = to_string(remote.IpAddressV4) ?? ""
          if rip == "" { rip = to_string(remote.IpAddressV6) ?? "" }
          if rip != "" { rep.ip = downcase(rip) }
          rloc = {}
          rcountry = to_string(get(remote, ["Country", "CountryName"]) ?? "") ?? ""
          if rcountry != "" { rloc.country = rcountry }
          rcity = to_string(get(remote, ["City", "CityName"]) ?? "") ?? ""
          if rcity != "" { rloc.city = rcity }
          if length(keys(rloc)) > 0 { rep.location = rloc }
          ras = {}
          rasn = to_int(get(remote, ["Organization", "Asn"]) ?? 0) ?? 0
          if rasn > 0 { ras.number = rasn }
          rasorg = to_string(get(remote, ["Organization", "AsnOrg"]) ?? "") ?? ""
          if rasorg != "" { ras.name = rasorg }
          if length(keys(ras)) > 0 { rep.autonomous_system = ras }
          risp = to_string(get(remote, ["Organization", "Isp"]) ?? "") ?? ""
          if risp != "" { rep.isp = risp }
          rorg = to_string(get(remote, ["Organization", "Org"]) ?? "") ?? ""
          if rorg != "" { rep.isp_org = rorg }
          conn_dir = to_int(conn.direction_id)
          if conn_dir == 2 {
              if !exists(dst_ep.ip) { dst_ep = merge(dst_ep, rep) }
          } else if !exists(src_ep.ip) {
              src_ep = merge(src_ep, rep)
          }
      }
      if length(keys(conn)) > 0 && !exists(conn.direction_id) { conn.direction_id = 0; conn.direction = "Unknown" }

      proc_src = object(f.Process) ?? {}
      process = {}
      if length(keys(proc_src)) > 0 {
          pname = to_string(proc_src.Name) ?? ""
          if pname != "" { process.name = pname }
          ppid = to_int(proc_src.Pid) ?? 0
          process.pid = ppid
          ppath = to_string(proc_src.Path) ?? ""
          if ppath != "" {
              fparts = split(ppath, "/")
              fbase = to_string(get(fparts, [length(fparts) - 1]) ?? "") ?? ""
              if fbase == "" { fbase = ppath }
              process.file = { "path": ppath, "name": fbase, "type_id": 1, "type": "Regular File" }
          }
          parent_pid = to_int(proc_src.ParentPid) ?? 0
          if parent_pid > 0 { process.parent_process = { "pid": parent_pid } }
          plaunch = to_string(proc_src.LaunchedAt) ?? ""
          if plaunch != "" {
              plt, plerr = parse_timestamp(plaunch, "%+")
              if plerr == null { process.created_time = to_unix_timestamp(plt, unit: "milliseconds") }
          }
          pterm = to_string(proc_src.TerminatedAt) ?? ""
          if pterm != "" {
              ptt, pterr2 = parse_timestamp(pterm, "%+")
              if pterr2 == null { process.terminated_time = to_unix_timestamp(ptt, unit: "milliseconds") }
          }
      }

      ev = {}
      if length(keys(src_ep)) > 0 { ev.src_endpoint = src_ep }
      if length(keys(dst_ep)) > 0 { ev.dst_endpoint = dst_ep }
      if length(keys(conn)) > 0 { ev.connection_info = conn }
      if length(keys(api)) > 0 { ev.api = api }
      if length(keys(query)) > 0 { ev.query = query }
      if length(keys(process)) > 0 { ev.process = process }
      action_type = to_string(act.ActionType) ?? ""
      if length(keys(ev)) > 0 && action_type != "" { ev.name = action_type }

      record_uid = finding_id
      if updated_str != "" { record_uid = finding_id + "|" + updated_str }

      product = { "name": "AWS Security Hub", "vendor_name": "Amazon" }
      if product_name != "" { product.feature = { "name": product_name } }
      msg = title
      if msg == "" { msg = finding_id }

      ocsf = {
          "class_uid": class_uid,
          "class_name": class_name,
          "category_uid": 2,
          "category_name": "Findings",
          "activity_id": activity_id,
          "activity_name": activity_name,
          "type_uid": class_uid * 100 + activity_id,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": status_id,
          "status": status_str,
          "time": time_ms,
          "message": msg,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "profiles": ["cloud", "security_control"],
              "uid": record_uid,
              "original_event_uid": finding_id,
              "log_name": "Security Hub findings",
              "log_provider": "AWS Security Hub",
              "product": product
          },
          "cloud": cloud,
          "finding_info": finding_info
      }
      if processed_ms > 0 { ocsf.metadata.processed_time = processed_ms }
      schema_ver = to_string(f.SchemaVersion) ?? ""
      if schema_ver != "" { ocsf.metadata.log_version = schema_ver }
      if length(resources) > 0 { ocsf.resources = resources }
      if length(malware) > 0 { ocsf.malware = malware }
      if f.Confidence != null { ocsf.confidence_score = to_int(f.Confidence) ?? 0 }
      verification = upcase(to_string(f.VerificationState) ?? "")
      if verification == "UNKNOWN" { ocsf.verdict_id = 0; ocsf.verdict = "Unknown" }
      if verification == "FALSE_POSITIVE" { ocsf.verdict_id = 1; ocsf.verdict = "False Positive" }
      if verification == "TRUE_POSITIVE" { ocsf.verdict_id = 2; ocsf.verdict = "True Positive" }
      if verification == "BENIGN_POSITIVE" { ocsf.verdict_id = 5; ocsf.verdict = "Benign" }
      # verdict is bound to the incident profile.
      if exists(ocsf.verdict_id) { ocsf.metadata.profiles = ["cloud", "security_control", "incident"] }
      note = to_string(get(f, ["Note", "Text"]) ?? "") ?? ""
      if note != "" { ocsf.comment = note }

      if class_uid == 2002 {
          ocsf.is_alert = severity_id >= 4
          vulns = []
          for_each(vulns_src) -> |_i, vsrc| {
              vid = to_string(get(vsrc, ["Id"]) ?? "") ?? ""
              vuln = {}
              if vid != "" { vuln.title = vid }
              cvss = []
              for_each(array(get(vsrc, ["Cvss"]) ?? []) ?? []) -> |_j, c| {
                  cscore = to_float(get(c, ["BaseScore"]) ?? null) ?? -1.0
                  cver = to_string(get(c, ["Version"]) ?? "") ?? ""
                  if cscore >= 0.0 && cver != "" {
                      if starts_with(cver, "V") || starts_with(cver, "v") { cver = slice!(cver, 1) }
                      cv = { "base_score": cscore, "version": cver }
                      cvec = to_string(get(c, ["BaseVector"]) ?? "") ?? ""
                      if cvec != "" { cv.vector_string = cvec }
                      csrc = to_string(get(c, ["Source"]) ?? "") ?? ""
                      if csrc != "" { cv.vendor_name = csrc }
                      cvss = push(cvss, cv)
                  }
              }
              if match(vid, r'^(?i)CVE-\d{4}-\d+$') {
                  cve = { "uid": upcase(vid) }
                  if length(cvss) > 0 { cve.cvss = cvss }
                  vuln.cve = cve
              } else if vid != "" {
                  vuln.advisory = { "uid": vid, "title": vid }
              }
              vvendor = to_string(get(vsrc, ["Vendor", "Name"]) ?? "") ?? ""
              if vvendor != "" { vuln.vendor_name = vvendor }
              vsev = to_string(get(vsrc, ["Vendor", "VendorSeverity"]) ?? "") ?? ""
              if vsev != "" { vuln.severity = vsev }
              vrefs = array(get(vsrc, ["ReferenceUrls"]) ?? []) ?? []
              if length(vrefs) > 0 { vuln.references = vrefs }
              vrel = array(get(vsrc, ["RelatedVulnerabilities"]) ?? []) ?? []
              if length(vrel) > 0 { vuln.related_vulnerabilities = vrel }
              vfix = upcase(to_string(get(vsrc, ["FixAvailable"]) ?? "") ?? "")
              if vfix == "YES" { vuln.is_fix_available = true }
              if vfix == "NO" { vuln.is_fix_available = false }
              vexp = upcase(to_string(get(vsrc, ["ExploitAvailable"]) ?? "") ?? "")
              if vexp == "YES" { vuln.is_exploit_available = true }
              if vexp == "NO" { vuln.is_exploit_available = false }
              pkgs = []
