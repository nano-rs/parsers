name: conduit_proxy_ocsf
display_name: Conduit MITM Proxy (OCSF)
version: "2.1.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields in redacted, dotted snake_case unmapped keys.
  Parses Conduit MITM proxy access logs into a complete OCSF 1.9.0
  "HTTP Activity" (class_uid 4002) record. The whole OCSF object is emitted on
  the root so it lands in the ocsf_logs `event` column and the promoted columns
  materialize. Mirrors the UDM conduit_proxy parser
  (../parsers/parsers/conduit_proxy/parser.yaml) but targets OCSF instead of
  `.udm.*`. Threat detector results become OCSF `enrichments`; the three
  proxy facts with no OCSF home (cache result, proxy auth method, TLS
  interception) stay in `unmapped`.

  v2.0.0 — OCSF 1.8.0 -> 1.9.0 upgrade:
    * metadata.version is now "1.9.0".
    * metadata.profiles declares BOTH "host" (for `actor`) and
      "security_control" (for action/disposition/risk_*/is_alert/
      firewall_rule). Declaring only one of them makes the other family of
      attributes fail as "not defined for this OCSF class/profile".
    * The top-level `user` object was REMOVED. `user` is not an attribute of
      HTTP Activity in OCSF 1.9 at all — the authenticated proxy user is
      `actor.user.name` and nothing else.
    * src_endpoint/dst_endpoint are now only emitted when they carry an
      identifying attribute, and `ip` only when the value really is an IP:
      network_endpoint has an at-least-one constraint and `ip` is regex-checked
      as ip_t, so the old unconditional `{"ip": ""}` was invalid.
    * The non-access/parse-failure fallback emits Base Event (class_uid 0)
      instead of a 4002 with neither http_request nor http_response.
match_values:
  - conduit_proxy
category: network
vendor: "Conduit"
product: "Conduit Proxy"
parser_vrl: |
  # Conduit proxy JSON access log -> OCSF 1.9.0 HTTP Activity (class_uid 4002).
  # Emits the COMPLETE OCSF record on the root.

  raw_log = string!(.message)
  __raw_body = raw_log
  __source_kv = {}
  parsed, err = parse_json(raw_log)
  __source_kv = object(parsed) ?? {}

  ip_re = r'^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$|^[0-9A-Fa-f:]{3,}$'

  if err == null && is_object(parsed) {
      p = object!(parsed)

      # ---- method -> activity_id (OCSF HTTP Activity enum, 1.9.0) ----
      method = upcase(string(p.method) ?? "")
      activity_id = 99
      activity_name = "Other"
      if method == "CONNECT" { activity_id = 1; activity_name = "Connect" }
      if method == "DELETE"  { activity_id = 2; activity_name = "Delete" }
      if method == "GET"     { activity_id = 3; activity_name = "Get" }
      if method == "HEAD"    { activity_id = 4; activity_name = "Head" }
      if method == "OPTIONS" { activity_id = 5; activity_name = "Options" }
      if method == "POST"    { activity_id = 6; activity_name = "Post" }
      if method == "PUT"     { activity_id = 7; activity_name = "Put" }
      if method == "TRACE"   { activity_id = 8; activity_name = "Trace" }
      if method == "PATCH"   { activity_id = 9; activity_name = "Patch" }

      # ---- status_code -> status_id (2xx/3xx Success, else Failure) ----
      code = to_int(p.status_code) ?? 0
      status_id = 2
      status_str = "Failure"
      if code >= 200 && code < 400 { status_id = 1; status_str = "Success" }

      # ---- severity: elevate when the proxy blocked the request ----
      severity_id = 1
      severity = "Informational"
      blocked = if is_boolean(p.threat_blocked) { bool(p.threat_blocked) ?? false } else { false }
      if blocked {
          severity_id = 4
          severity = "High"
      }

      # ---- time: ISO8601 (nanoseconds) -> epoch milliseconds ----
      time_ms = 0
      ts_str = string(p.timestamp) ?? ""
      if ts_str != "" {
          t, terr = parse_timestamp(ts_str, "%+")
          if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
      }

      # ---- upstream_addr "ip:port" -> dst_endpoint ip/port ----
      dst_endpoint = {}
      host = string(p.host) ?? ""
      if host != "" { dst_endpoint.hostname = downcase(host) }
      upstream = string(p.upstream_addr) ?? ""
      if upstream != "" {
          ua = split(upstream, ":")
          cand = downcase(string(ua[0]) ?? "")
          if match(cand, ip_re) { dst_endpoint.ip = cand }
          if length(ua) >= 2 {
              uport = to_int(ua[1]) ?? 0
              if uport != 0 { dst_endpoint.port = uport }
          }
      }
      if !exists(dst_endpoint.port) {
          dport = to_int(p.port) ?? 0
          if dport != 0 { dst_endpoint.port = dport }
      }

      class_uid = 4002

      req_path = string(p.path) ?? ""
      full_url = string(p.full_url) ?? ""

      # NAN-1465: web content/filtering category -> OCSF url.categories (promoted
      # column http_request.url.categories, queryable via has()). Single source
      # value -> single-element array per the OCSF url spec.
      url_categories = []
      cat_val = string(p.category) ?? ""
      if cat_val != "" { url_categories = [cat_val] }

      url_obj = {}
      if req_path != "" { url_obj.path = req_path }
      if full_url != "" { url_obj.url_string = full_url }
      if host != "" { url_obj.hostname = downcase(host) }
      scheme = downcase(string(p.scheme) ?? "")
      if scheme != "" { url_obj.scheme = scheme }
      if length(url_categories) > 0 { url_obj.categories = url_categories }
      # url has an at-least-one [url_string, path] constraint.
      if !exists(url_obj.path) && !exists(url_obj.url_string) { url_obj.path = "/" }

      http_request = { "url": url_obj }
      if method != "" { http_request.http_method = method }

      http_response = {
          "code": code,
          "length": to_int(p.response_bytes) ?? 0,
          "status": status_str
      }
      ctype = string(p.content_type) ?? ""
      if ctype != "" { http_response.content_type = ctype }

      # Security-control profile outcome. The normalized action/disposition are
      # intentionally separate from the source's raw value, which is retained
      # when it cannot be mapped.
      action_raw = downcase(string(p.action) ?? "")
      action_id = 0
      action_name = "Unknown"
      disposition_id = 0
      disposition_name = "Unknown"
      if action_raw == "allow" || action_raw == "allowed" {
          action_id = 1
          action_name = "Allowed"
          disposition_id = 1
          disposition_name = "Allowed"
      } else if action_raw == "deny" || action_raw == "denied" || action_raw == "block" || action_raw == "blocked" || blocked {
          action_id = 2
          action_name = "Denied"
          disposition_id = 2
          disposition_name = "Blocked"
      } else if action_raw != "" {
          action_id = 99
          action_name = action_raw
      }

      threat_tier = downcase(string(p.threat_tier) ?? "")
      risk_level_id = 99
      risk_level = threat_tier
      if threat_tier == "tier0" { risk_level_id = 0; risk_level = "Info" }
      if threat_tier == "tier1" { risk_level_id = 1; risk_level = "Low" }
      if threat_tier == "tier2" { risk_level_id = 2; risk_level = "Medium" }
      if threat_tier == "tier3" { risk_level_id = 3; risk_level = "High" }
      if threat_tier == "tier4" { risk_level_id = 4; risk_level = "Critical" }
      if threat_tier == "" { risk_level = "Unknown" }

      # Every detector result is an OCSF enrichment of the requested host. The
      # detector-specific score and tier stay lossless in `data`.
      enrichments = []
      raw_signals = array(p.threat_signals) ?? []
      for_each(raw_signals) -> |_i, sig| {
          s = object(sig) ?? {}
          sig_name = string(s.name) ?? ""
          if sig_name != "" {
              enrichments = push(enrichments, {
                  "name": "http_request.url.hostname",
                  "value": downcase(host),
                  "type": "threat_signal",
                  "provider": "Conduit Proxy",
                  "data": {
                      "detector": sig_name,
                      "score": s.score,
                      "tier": s.tier
                  }
              })
          }
      }

      # OCSF 1.9 has no cache-result, proxy-auth-method, or TLS-interception
      # attribute. Keep only those three source facts in `unmapped`.
      unmapped = {}
      am = string(p.auth_method) ?? ""
      if am != "" { unmapped.auth_method = am }
      cs = string(p.cache_status) ?? ""
      if cs != "" { unmapped.cache_status = cs }
      if is_boolean(p.tls_intercepted) { unmapped.tls_intercepted = p.tls_intercepted }

      . = {
          "class_uid": class_uid,
          "class_name": "HTTP Activity",
          "category_uid": 4,
          "category_name": "Network Activity",
          "activity_id": activity_id,
          "activity_name": activity_name,
          "type_uid": class_uid * 100 + activity_id,
          "severity_id": severity_id,
          "severity": severity,
          "action_id": action_id,
          "action": action_name,
          "disposition_id": disposition_id,
          "disposition": disposition_name,
          "is_alert": blocked,
          "risk_score": to_int((to_float(p.threat_score) ?? 0.0) * 100.0),
          "risk_level_id": risk_level_id,
          "risk_level": risk_level,
          "status_id": status_id,
          "status": status_str,
          "time": time_ms,
          # NAN-1465: base-event duration (ms) -> promoted `duration` column.
          "duration": to_int(p.duration_ms) ?? 0,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              # "host" unlocks `actor`; "security_control" unlocks
              # action/disposition/risk_*/is_alert/firewall_rule.
              "profiles": ["host", "security_control"],
              "uid": string(p.id) ?? uuid_v4(),
              "log_name": "conduit-proxy",
              "product": {
                  "name": "Conduit Proxy",
                  "vendor_name": "Conduit"
              }
          },
          "http_request": http_request,
          "http_response": http_response,
          # OCSF: bytes_in = source(client)->destination, bytes_out = destination->source.
          "traffic": {
              "bytes_in": to_int(p.request_bytes) ?? 0,
              "bytes_out": to_int(p.response_bytes) ?? 0
          }
      }

      client_ip = downcase(string(p.client_ip) ?? "")
      if match(client_ip, ip_re) { .src_endpoint = { "ip": client_ip } }
      if exists(dst_endpoint.ip) || exists(dst_endpoint.hostname) { .dst_endpoint = dst_endpoint }
      if length(enrichments) > 0 { .enrichments = enrichments }
      if length(unmapped) > 0 { .unmapped = unmapped }

      rule_id = to_string(p.rule_id) ?? ""
      if rule_id != "" { .firewall_rule = { "uid": rule_id } }

      # Authenticated proxy user -> actor.user.name ONLY. OCSF 1.9 HTTP
      # Activity has no top-level `user`; emitting one is rejected outright.
      auth_user = string(p.username) ?? ""
      if auth_user != "" {
          .actor = { "user": { "name": downcase(auth_user) } }
      }
  } else {
      # Non-access (internal/error) lines or parse failure: land a minimal,
      # debuggable Base Event rather than dropping the row or emitting a 4002
      # that carries neither http_request nor http_response.
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 99,
          "activity_name": "Other",
          "type_uid": 99,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": 0,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": uuid_v4(),
              "log_level": "error",
              "log_name": "conduit-proxy",
              "product": {
                  "name": "Conduit Proxy",
                  "vendor_name": "Conduit"
              }
          }
      }
  }

  .

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # Exact value representation is evaluated AFTER branch selection. Numeric strings
  # count as represented by their typed scalar; other transformations are explicit.
  __mapped = object!(parse_json!(encode_json(.)))
  __existing = object(__mapped.unmapped) ?? {}
  __discard = del(__mapped.raw_data)
  __discard = del(__mapped.unmapped)
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __represented = []
  __walk = map_values(__mapped, recursive: true) -> |value| {
      __represented = push(__represented, encode_json(value))
      if !is_object(value) && !is_array(value) && !is_null(value) {
          __represented = push(__represented, to_string(value) ?? "")
      }
      value
  }
  __consumed = []
  # BEGIN parser-specific transformations
  # scheme: Parser lowercases this source value; consume only when the normalized value is emitted.
  # action: Parser lowercases this source value; consume only when the normalized value is emitted.
  # threat_tier: Parser lowercases this source value; consume only when the normalized value is emitted.
  # client_ip: Parser lowercases this source value; consume only when the normalized value is emitted.
  # timestamp: Successful ISO timestamp conversion to the selected event clock in milliseconds.
  # action: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when the expected ID is emitted.
  # Only source keys read by this parser are eligible for exact-value consumption; the selected branch must emit the value. Unknown keys always spill, even when their value equals an OCSF default.
  __candidates = ["action", "auth_method", "cache_status", "category", "client_ip", "content_type", "duration_ms", "full_url", "host", "id", "method", "path", "port", "request_bytes", "response_bytes", "rule_id", "scheme", "status_code", "threat_blocked", "threat_score", "threat_signals", "threat_tier", "timestamp", "tls_intercepted", "upstream_addr", "username"]
  __preserve = []
  __rules = array!(parse_json!("[{\"source\":\"scheme\",\"kind\":\"lowercase\",\"reason\":\"Parser lowercases this source value; consume only when the normalized value is emitted.\"},{\"source\":\"action\",\"kind\":\"lowercase\",\"reason\":\"Parser lowercases this source value; consume only when the normalized value is emitted.\"},{\"source\":\"threat_tier\",\"kind\":\"lowercase\",\"reason\":\"Parser lowercases this source value; consume only when the normalized value is emitted.\"},{\"source\":\"client_ip\",\"kind\":\"lowercase\",\"reason\":\"Parser lowercases this source value; consume only when the normalized value is emitted.\"},{\"source\":\"timestamp\",\"kind\":\"epoch_ms\",\"target\":\"time\",\"reason\":\"Successful ISO timestamp conversion to the selected event clock in milliseconds.\"},{\"source\":\"action\",\"kind\":\"enum\",\"target\":\"action_id\",\"values\":{\"allow\":1,\"allowed\":1,\"accept\":1,\"accepted\":1,\"permit\":1,\"permitted\":1,\"pass\":1,\"passed\":1,\"deny\":2,\"denied\":2,\"block\":2,\"blocked\":2,\"reject\":2,\"rejected\":2,\"drop\":2,\"dropped\":2,\"log\":3,\"observed\":3},\"reason\":\"Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when the expected ID is emitted.\"}]"))
  __source_flat = flatten(__source_kv)
  for_each(__rules) -> |_index, rule| {
      __source_key = string!(rule.source)
      __value = get!(__source_flat, [__source_key])
      __expected = null
      __valid = false
      if rule.kind == "lowercase" && is_string(__value) {
          __expected = downcase(string!(__value))
          __valid = true
      } else if rule.kind == "epoch_ms" {
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", string(rule.format) ?? "%+")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              __valid = true
          }
      } else if rule.kind == "scale" {
          __number, __number_err = to_float(__value)
          if __number_err == null && __value != null && !is_boolean(__value) {
              __expected = to_int(__number * to_float!(rule.factor))
              __valid = true
          }
      } else if rule.kind == "hex" {
          __hex = replace(downcase(string(__value) ?? ""), r'^0x', "")
          __integer, __integer_err = parse_int(__hex, base: 16)
          __expected = __integer
          __valid = is_string(__value) && starts_with(downcase(string(__value) ?? ""), "0x") && __integer_err == null
      } else if rule.kind == "enum" {
          __expected = get!(object!(rule.values), [downcase(to_string(__value) ?? "")])
          __valid = __expected != null
      }
      __matches = includes(__represented, encode_json(__expected))
      if is_string(rule.target) { __matches = get!(., split(string!(rule.target), ".")) == __expected }
      if __valid && __matches { __consumed = push(__consumed, __source_key) }
  }
  # END parser-specific transformations
  # Redact at every depth, including objects inside arrays, before serialization.
  __safe = map_values(object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing}))), recursive: true) -> |value| {
      if is_object(value) {
          # Header/parameter arrays commonly encode sensitive keys as name/value
          # or Key/Value objects instead of using the secret name as an object key.
          __sensitive_pair = false
          for_each(object!(value)) -> |key, child| {
              if includes(["name", "key"], downcase(key)) && match(downcase(string(child) ?? ""), r'password|secret|authorization|token') {
                  __sensitive_pair = true
              }
          }
          for_each(object!(value)) -> |key, _child| {
              if match(downcase(key), r'password|secret|authorization|token') || (__sensitive_pair && includes(["value", "values"], downcase(key))) {
                  value = set!(value, [key], "<redacted>")
              }
          }
      }
      value
  }
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  __escaped = map_keys(object!(__safe.source), recursive: true) -> |key| {
      replace(replace(key, "~", "~0"), ".", "~1")
  }
  __flat = flatten(__escaped)
  __residual = {}
  for_each(__flat) -> |key, value| {
      key = replace(replace(key, "~1", "."), "~0", "~")
      __same = includes(__represented, encode_json(value))
      if !is_object(value) && !is_array(value) && !is_null(value) {
          __same = __same || includes(__represented, to_string(value) ?? "")
      }
      # A scalar array is consumed only if every element is represented. Preserve
      # partially represented arrays intact, including their ordering and repeats.
      if is_array(value) && !is_empty(array!(value)) {
          __all_items = true
          for_each(array!(value)) -> |_index, item| {
              __item_same = includes(__represented, encode_json(item))
              if !is_object(item) && !is_array(item) && !is_null(item) {
                  __item_same = __item_same || includes(__represented, to_string(item) ?? "")
              }
              if is_object(item) || is_array(item) || !__item_same { __all_items = false }
          }
          __same = __same || __all_items
      }
      if __same && includes(__candidates, key) { __consumed = push(__consumed, key) }
      # Redacted leaves always remain visible. Do not spill a copy of the raw body.
      if (!includes(__consumed, key) || value == "<redacted>") && value != __raw_body {
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          __base = join!(__parts, ".")
          __key = __base
          __suffix = 2
          if includes(keys(__residual), __key) {
              for_each(__flat) -> |_other_key, _other_value| {
                  if includes(keys(__residual), __key) {
                      __key = __base + "_" + to_string(__suffix)
                      __suffix = __suffix + 1
                  }
              }
          }
          __complex = is_object(value)
          if is_array(value) {
              for_each(array!(value)) -> |_index, item| {
                  if is_object(item) || is_array(item) { __complex = true }
              }
          }
          __spill = if __complex { encode_json(value) } else { value }
          __residual = set!(__residual, [__key], __spill)
      }
  }
  # Keep existing derived evidence, but remove null placeholders and mapped copies.
  # Source-derived aliases are replaced by canonical dotted source paths above.
  __original_values = []
  for_each(flatten(__source_kv)) -> |_key, value| {
      __original_values = push(__original_values, encode_json(value))
      if !is_object(value) && !is_array(value) { __original_values = push(__original_values, to_string(value) ?? "") }
  }
  for_each(flatten(__existing)) -> |key, value| {
      __source_alias = includes(__original_values, encode_json(value)) || includes(__original_values, to_string(value) ?? "")
      __mapped_alias = includes(__represented, encode_json(value)) || includes(__represented, to_string(value) ?? "")
      __decoded, __decode_err = parse_json(string(value) ?? "")
      __encoded_container = __decode_err == null && (is_object(__decoded) || is_array(__decoded))
      if !is_null(value) && value != "" && !__source_alias && !__mapped_alias && !__encoded_container && value != __raw_body {
          # Existing aggregates may contain sensitive descendants; the canonical
          # source spill above is the authoritative representation of containers.
          if !is_array(value) && !is_object(value) && !match(downcase(key), r'password|secret|authorization|token') {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, with recursive
  # redaction. These entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__safe.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

# Runtime samples (NAN-2327): one per event shape this parser routes.
# `class_uid` is asserted because class routing is the whole point of the
# OCSF conversion — a silent reroute is the defect most likely to survive
# a compile-only check.
samples:
  - raw: '{"id":"01J8ZR","timestamp":"2026-08-12T09:15:25.000000000Z","client_ip":"10.10.4.32","method":"CONNECT","scheme":"https","host":"api.github.com","port":443,"path":"/","full_url":"https://api.github.com/","status_code":200,"request_bytes":420,"response_bytes":15320,"duration_ms":88,"action":"allow","threat_score":0.02,"threat_tier":"tier0","threat_blocked":false,"threat_signals":[]}'
    expect:
      class_uid: 4002
      activity_id: 1
  - raw: '{"id":"01J8ZQ","timestamp":"2026-08-12T09:15:22.123456789Z","client_ip":"10.10.4.31","username":"bsmith","method":"GET","scheme":"https","host":"malware-cdn.example","port":443,"path":"/payload.bin","full_url":"https://malware-cdn.example/payload.bin","status_code":403,"request_bytes":812,"response_bytes":0,"duration_ms":14,"upstream_addr":"198.51.100.77:443","content_type":"application/octet-stream","cache_status":"MISS","auth_method":"ntlm","tls_intercepted":true,"action":"block","category":"malware","threat_score":0.93,"threat_tier":"tier4","threat_blocked":true,"rule_id":"RULE-118","threat_signals":[{"name":"dga_entropy","score":0.81,"tier":"tier3"},{"name":"newly_seen_domain","score":0.95,"tier":"tier4"}]}'
    expect:
      class_uid: 4002
      activity_id: 3
  - raw: '2026-08-12T09:15:30Z conduit-proxy INFO reload complete, 4 workers'
    expect:
      class_uid: 0
      activity_id: 99
