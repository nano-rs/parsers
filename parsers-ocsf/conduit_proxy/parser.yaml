  - raw: '{"id":"c683df0c","timestamp":"2026-10-08T12:46:36.051082208Z","client_ip":"192.168.44.72","username":"dan","auth_method":"ip_map","method":"GET","scheme":"https","host":"us.nano.rs","port":443,"path":"/api/search/jobs","full_url":"https://us.nano.rs/api/search/jobs","referer":"https://us.nano.rs/t/acme/search?q=error","user_agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36","category":"security_pki","action":"allow","rule_id":null,"status_code":200,"request_bytes":0,"response_bytes":581,"duration_ms":204,"tls_intercepted":true,"upstream_addr":"104.26.15.114:443","content_type":"application/json","node_name":"conduit-01","threat_score":0.2,"threat_tier":"tier0","threat_blocked":false}'
    expect:
