source: json
transforms:
- source: scheme
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value
    is emitted.
- source: action
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value
    is emitted.
- source: threat_tier
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value
    is emitted.
- source: client_ip
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value
    is emitted.
- source: timestamp
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: action
  kind: enum
  target: action_id
  values:
    allow: 1
    allowed: 1
    accept: 1
    accepted: 1
    permit: 1
    permitted: 1
    pass: 1
    passed: 1
    deny: 2
    denied: 2
    block: 2
    blocked: 2
    reject: 2
    rejected: 2
    drop: 2
    dropped: 2
    log: 3
    observed: 3
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping;
    consume only when the expected ID is emitted.
consumed_candidates:
- action
- auth_method
- cache_status
- category
- client_ip
- content_type
- duration_ms
- full_url
- host
- id
- method
- path
- port
- request_bytes
- response_bytes
- rule_id
- scheme
- status_code
- threat_blocked
- threat_score
- threat_signals
- threat_tier
- timestamp
- tls_intercepted
- upstream_addr
- username
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
