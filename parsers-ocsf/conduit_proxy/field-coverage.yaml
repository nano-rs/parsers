source: json
transforms:
- source: scheme
  kind: lowercase
  target: http_request.url.scheme
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: client_ip
  kind: lowercase
  target: src_endpoint.ip
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: action
  kind: enum
  target: action_id
  values:
    allow: 1
    allowed: 1
    accept: 1
    accepted: 1
    permit: 1
    permitted: 1
    pass: 1
    passed: 1
    deny: 2
    denied: 2
    block: 2
    blocked: 2
    reject: 2
    rejected: 2
    drop: 2
    dropped: 2
    log: 3
    observed: 3
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when
    the expected ID is emitted.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  category:
  - http_request.url.categories
  client_ip:
  - src_endpoint.ip
  content_type:
  - http_response.content_type
  duration_ms:
  - duration
  full_url:
  - http_request.url.url_string
  host:
  - dst_endpoint.hostname
  - enrichments.value
  - http_request.url.hostname
  id:
  - metadata.uid
  method:
  - http_request.http_method
  path:
  - http_request.url.path
  port:
  - dst_endpoint.port
  referer:
  - http_request.referrer
  request_bytes:
  - traffic.bytes_out
  response_bytes:
  - http_response.length
  - traffic.bytes_in
  rule_id:
  - firewall_rule.uid
  scheme:
  - http_request.url.scheme
  status_code:
  - http_response.code
  threat_blocked:
  - is_alert
  user_agent:
  - http_request.user_agent
  username:
  - actor.user.name
