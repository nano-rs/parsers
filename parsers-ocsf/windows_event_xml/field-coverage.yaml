source: text
probe:
  mode: before
  anchor: </EventData>
  require: </EventData>
  text: <Data Name="ResidualProbe">nan2421-text-unknown</Data><Data Name="Password">nan2421-secret</Data>
  source: event_data.ResidualProbe
transforms:
- source: event_data.SubjectUserName
  kind: lowercase
  target: actor.user.name
  reason: Parser lowercases this Windows identity field when emitted.
- source: event_data.SubjectUserName
  kind: lowercase
  target: user.name
  reason: Parser lowercases this Windows identity field when emitted.
- source: event_data.SubjectDomainName
  kind: lowercase
  target: actor.user.domain
  reason: Parser lowercases this Windows identity field when emitted.
- source: event_data.SubjectDomainName
  kind: lowercase
  target: user.domain
  reason: Parser lowercases this Windows identity field when emitted.
- source: event_data.TargetUserName
  kind: lowercase
  target: group.name
  reason: Parser lowercases this Windows identity field when emitted.
- source: event_data.TargetUserName
  kind: lowercase
  target: user.name
  reason: Parser lowercases this Windows identity field when emitted.
- source: event_data.TargetDomainName
  kind: lowercase
  target: group.domain
  reason: Parser lowercases this Windows identity field when emitted.
- source: event_data.TargetDomainName
  kind: lowercase
  target: user.domain
  reason: Parser lowercases this Windows identity field when emitted.
- source: system.TimeCreated.@SystemTime
  kind: epoch_ms
  target: time
  reason: XML system clock converted to event milliseconds.
- source: system.Computer
  kind: lowercase
  target: device.hostname
  reason: Case normalization already performed by the parser; observed at device.hostname, and checked
    against the emitted branch.
- source: system.Computer
  kind: lowercase
  target: dst_endpoint.hostname
  reason: Case normalization already performed by the parser; observed at device.hostname, and checked
    against the emitted branch.
- source: event_data.WorkstationName
  kind: lowercase
  target: src_endpoint.hostname
  reason: Case normalization already performed by the parser; observed at src_endpoint.hostname, and checked
    against the emitted branch.
- source: event_data.ProcessId
  kind: hex
  target: actor.process.pid
  reason: Parsed hexadecimal process ID or access mask is represented as an integer at this destination.
- source: event_data.NewProcessId
  kind: hex
  target: process.pid
  reason: Parsed hexadecimal process ID or access mask is represented as an integer at this destination.
- source: event_data.ProcessId
  kind: hex
  target: process.pid
  reason: Parsed hexadecimal process ID or access mask is represented as an integer at this destination.
- source: event_data.MemberName
  kind: lowercase
  target: user.name
  reason: Case normalization already performed by the parser; observed at user.name, and checked against
    the emitted branch.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
