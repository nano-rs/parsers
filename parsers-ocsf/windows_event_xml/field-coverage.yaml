source: text
transforms:
- source: event_data.SubjectUserName
  kind: lowercase
  reason: Parser lowercases this Windows identity field when emitted.
- source: event_data.SubjectDomainName
  kind: lowercase
  reason: Parser lowercases this Windows identity field when emitted.
- source: event_data.TargetUserName
  kind: lowercase
  reason: Parser lowercases this Windows identity field when emitted.
- source: event_data.TargetDomainName
  kind: lowercase
  reason: Parser lowercases this Windows identity field when emitted.
- source: event_data.UserName
  kind: lowercase
  reason: Parser lowercases this Windows identity field when emitted.
- source: event_data.DomainName
  kind: lowercase
  reason: Parser lowercases this Windows identity field when emitted.
- source: system.TimeCreated.@SystemTime
  kind: epoch_ms
  target: time
  reason: XML system clock converted to event milliseconds.
- source: system.Computer
  kind: lowercase
  reason: Case normalization already performed by the parser; observed at device.hostname,
    and checked against the emitted branch.
- source: event_data.WorkstationName
  kind: lowercase
  reason: Case normalization already performed by the parser; observed at src_endpoint.hostname,
    and checked against the emitted branch.
- source: event_data.ProcessId
  kind: hex
  target: actor.process.pid
  reason: Parsed hexadecimal process ID or access mask is represented as an integer
    at this destination.
- source: event_data.NewProcessId
  kind: hex
  target: process.pid
  reason: Parsed hexadecimal process ID or access mask is represented as an integer
    at this destination.
- source: event_data.ProcessId
  kind: hex
  target: process.pid
  reason: Parsed hexadecimal process ID or access mask is represented as an integer
    at this destination.
- source: event_data.MemberName
  kind: lowercase
  reason: Case normalization already performed by the parser; observed at user.name,
    and checked against the emitted branch.
probe:
  mode: before
  anchor: </EventData>
  require: </EventData>
  text: <Data Name="ResidualProbe">nan2421-text-unknown</Data><Data Name="Password">nan2421-secret</Data>
  source: event_data.ResidualProbe
