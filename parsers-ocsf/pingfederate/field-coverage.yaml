source: text
transforms:
- source: status
  kind: enum
  target: status_id
  values:
    success: 1
    failure: 2
    failed: 2
    inprogress: 99
  reason: Audit status normalized to the OCSF status; consume only when the expected ID is emitted.
- source: msg
  kind: enum
  target: status_id
  values:
    success: 1
    failure: 2
    failed: 2
    inprogress: 99
    in progress: 99
  reason: CEF msg carries the audit status; consume only when the expected ID is emitted.
- source: protocol
  kind: enum
  target: auth_protocol_id
  values:
    saml20: 5
    saml11: 5
    oauth20: 6
    oidc: 4
  reason: Identity protocol normalized to the OCSF auth protocol; consume only when the expected ID is emitted.
- source: cs3
  kind: enum
  target: auth_protocol_id
  values:
    saml20: 5
    saml11: 5
    oauth20: 6
    oidc: 4
  reason: CEF cs3 (Protocol) normalized to the OCSF auth protocol; consume only when the expected ID is emitted.
- source: event
  kind: enum
  target: metadata.event_code
  values:
    oauth: OAUTH
  reason: Event type upper-cased onto metadata.event_code; consume only when the emitted code matches.
probe:
  raw: CEF:0|Ping Identity|PingFederate|12.0|SSO|SSO|0|rt=Feb 02 2024 15:49:15.178 duid=alice src=192.0.2.1 msg=success ResidualProbe=nan2421-text-unknown password=nan2421-secret
  source: ResidualProbe
consumed_candidates:
- app
