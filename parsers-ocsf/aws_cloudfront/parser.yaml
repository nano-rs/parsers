name: aws_cloudfront_ocsf
display_name: Amazon CloudFront Access Logs (OCSF)
version: "1.0.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses Amazon CloudFront access logs into complete OCSF 1.9.0 "HTTP Activity"
  (class_uid 4002) records. Three wire forms are read onto one canonical field set:
  the standard (legacy) log line (33 tab-separated W3C fields in the documented
  order, older 24 to 32 field lines included), the real-time log record delivered
  through Kinesis (epoch timestamp first, fields in the documented real-time order,
  with or without s-ip), and standard logging v2 JSON output. The viewer is
  src_endpoint (c-ip, c-port, c-country, asn), the edge is dst_endpoint (cs-host,
  s-ip), the request lands on http_request (method, url from cs-protocol +
  x-host-header + cs-uri-stem + cs-uri-query, URL-decoded user agent, referrer,
  x-forwarded-for, x-edge-request-id), the response on http_response (sc-status,
  content type and length, time-to-first-byte latency), plus tls, traffic and
  duration. A geo-restricted or blocked request (x-edge-detailed-result-type
  ClientGeoBlocked / InvalidRequestBlocked) carries action Denied and disposition
  Blocked. The W3C "#Version" / "#Fields" directives become a Base Event with
  log_level info. A real-time record whose field selection is not in the
  documented order cannot be read positionally, so it is kept whole as a Base
  Event with unmapped.parse_fallback rather than guessed; the closed-set fields
  (cs-protocol, cs-protocol-version, c-ip-version, c-port, result types, c-country)
  are checked so a configuration that omits a middle field falls back too. A JSON
  object without CloudFront fields is not HTTP Activity. Samples are drawn from
  the Elastic aws.cloudfront_logs pipeline fixtures and the AWS CloudFront
  standard and real-time log references, with documentation addresses.
match_values:
  - aws_cloudfront
category: cloud
vendor: "Amazon"
product: "CloudFront"
parser_vrl: |
  # NAN source timezone. Generated by scripts/residual_spill.py; edit scripts/residual/source_tz.vrl.
  # The log source's timezone setting arrives as .nano.source_timezone (an IANA
  # name such as "America/New_York", or any fixed offset such as "+05:30"), set
  # by nano at ingest. .nano is nano's input, never part of the log: it is
  # removed whole before anything else, whatever its shape.
  # For a clock that carries no offset a parser parses it AS UTC and sets
  # __lc_pending; the generated local-clock block that follows the parse
  # (local_clock.vrl) turns it into real UTC with this setting, and the spill
  # records the zone used as unmapped.nano_time_assumed_tz (the name, the offset
  # as +HH:MM, or "UTC" when the setting is absent, invalid or "local").
  __src_nano = del(.nano)
  __src_tz_in = ""
  if is_object(__src_nano) { __src_tz_in = strip_whitespace(to_string(object!(__src_nano).source_timezone) ?? "") }
  __src_tz = "UTC"
  __src_shift_ms = 0
  __src_tz_label = "UTC"
  __time_assumed = false
  __time_inline = false
  __lc_pending = false
  # No parse_* decoder here: nano infers a parser's input contract from the first
  # decoder in its program (parse_json first = a JSON-input parser, handed the
  # whole HEC / OTLP object). This prelude opens every parser, so a decoder in it
  # would turn every JSON-input parser into a text one. match + slice instead.
  if match(__src_tz_in, r'^[+-]\d{2}:?\d{2}$') {
      __src_sign = slice(__src_tz_in, 0, 1) ?? "+"
      __src_digits = replace(slice(__src_tz_in, 1) ?? "", ":", "")
      __src_hh = slice(__src_digits, 0, 2) ?? "99"
      __src_mm = slice(__src_digits, 2, 4) ?? "99"
      __src_h = to_int(__src_hh) ?? 99
      __src_m = to_int(__src_mm) ?? 99
      if __src_h <= 14 && __src_m <= 59 {
          __src_shift_ms = (__src_h * 3600 + __src_m * 60) * 1000
          if __src_sign == "-" { __src_shift_ms = 0 - __src_shift_ms }
          if __src_shift_ms != 0 { __src_tz_label = __src_sign + __src_hh + ":" + __src_mm }
      }
  } else if __src_tz_in != "" && downcase(__src_tz_in) != "local" {
      # "local" (the Vector host's zone) would make the time depend on the host.
      __src_probe, __src_probe_err = parse_timestamp("2000-01-01 00:00:00", "%Y-%m-%d %H:%M:%S", timezone: __src_tz_in)
      if __src_probe_err == null { __src_tz = __src_tz_in; __src_tz_label = __src_tz_in }
  }
  # END NAN source timezone
  # Amazon CloudFront access log -> OCSF 1.9.0 HTTP Activity (class_uid 4002)
  # Three wire forms land on one canonical field dict `f` (W3C names, snake_case):
  #   standard (legacy) log line : 33 tab-separated fields in the documented order
  #   real-time log record       : tab-separated, epoch timestamp first, fields in
  #                                the documented real-time order
  #   standard logging v2 JSON   : one object per request, W3C names as keys
  raw_log = to_string(.message) ?? ""
  __raw_body = raw_log
  __source_kv = {}
  class_uid = 4002

  f = {}
  form = ""
  fallback = ""
  is_header = false

  std_names = ["date", "time", "x_edge_location", "sc_bytes", "c_ip", "cs_method", "cs_host", "cs_uri_stem", "sc_status", "cs_referer", "cs_user_agent", "cs_uri_query", "cs_cookie", "x_edge_result_type", "x_edge_request_id", "x_host_header", "cs_protocol", "cs_bytes", "time_taken", "x_forwarded_for", "ssl_protocol", "ssl_cipher", "x_edge_response_result_type", "cs_protocol_version", "fle_status", "fle_encrypted_fields", "c_port", "time_to_first_byte", "x_edge_detailed_result_type", "sc_content_type", "sc_content_len", "sc_range_start", "sc_range_end"]
  rt_names = ["timestamp", "c_ip", "s_ip", "time_to_first_byte", "sc_status", "sc_bytes", "cs_method", "cs_protocol", "cs_host", "cs_uri_stem", "cs_bytes", "x_edge_location", "x_edge_request_id", "x_host_header", "time_taken", "cs_protocol_version", "c_ip_version", "cs_user_agent", "cs_referer", "cs_cookie", "cs_uri_query", "x_edge_response_result_type", "x_forwarded_for", "ssl_protocol", "ssl_cipher", "x_edge_result_type", "fle_encrypted_fields", "fle_status", "sc_content_type", "sc_content_len", "sc_range_start", "sc_range_end", "c_port", "x_edge_detailed_result_type", "c_country", "cs_accept_encoding", "cs_accept", "cache_behavior_path_pattern", "cs_headers", "cs_header_names", "cs_headers_count", "primary_distribution_id", "primary_distribution_dns_name", "origin_fbl", "origin_lbl", "asn"]

  if starts_with(raw_log, "#") {
      is_header = true
  } else if match(raw_log, r'^\s*\x7B') {
      parsed, jerr = parse_json(raw_log)
      if jerr == null && is_object(parsed) {
          __source_kv = object!(parsed)
          form = "json"
          # cs(User-Agent) -> cs_user_agent, timestamp(ms) -> timestamp_ms
          f = map_keys(object!(parsed)) -> |k| {
              replace(replace(replace(downcase(k), "(", "_"), ")", ""), "-", "_")
          }
          # "-" is the access log's empty value.
          f = filter(f) -> |_k, v| { v != "-" && v != "" && v != null }
          # Any JSON object is not a CloudFront record: require a v2 field.
          if !(exists(f.c_ip) || exists(f.cs_method) || exists(f.sc_status) || exists(f.cs_uri_stem) || exists(f.x_edge_request_id) || exists(f.distributionid)) {
              form = ""
              fallback = "JSON is not a CloudFront v2 log record"
          }
      } else {
          fallback = "unparsable JSON"
      }
  } else {
      shape, serr = parse_regex(raw_log, r'^(?P<lead>\d{4}-\d{2}-\d{2}\t\d{2}:\d{2}:\d{2}|\d{9,11}(?:\.\d+)?)\t')
      if serr != null {
          fallback = "not a CloudFront access log line"
      } else {
          parts = split(raw_log, "\t")
          lead = string!(shape.lead)
          if contains(lead, "-") {
              form = "standard"
              for_each(parts) -> |i, v| {
                  name = get(std_names, [i]) ?? null
                  if name == null { name = "field_" + to_string(i + 1) }
                  if v != "-" && v != "" { f = set!(f, [string!(name)], v) }
              }
          } else {
              form = "realtime"
              names = rt_names
              # Older real-time records predate s-ip: field 3 is then
              # time-to-first-byte (a decimal), never an IP address.
              third = to_string(get(parts, [2]) ?? "") ?? ""
              if match(third, r'^\d+(?:\.\d+)?$') { names = remove!(rt_names, [2]) }
              for_each(parts) -> |i, v| {
                  name = get(names, [i]) ?? null
                  if name == null { name = "field_" + to_string(i + 1) }
                  if v != "-" && v != "" { f = set!(f, [string!(name)], v) }
              }
          }
      }
  }

  if form == "standard" {
      # date + time are one UTC instant; capture them as one source field.
      d = string(f.date) ?? ""
      t = string(f.time) ?? ""
      f = remove!(f, ["date"])
      f = remove!(f, ["time"])
      if d != "" && t != "" { f.timestamp = d + "T" + t + "Z" }
  }
  if form != "json" && form != "" {
      # User-Agent is URL-encoded in the access log; decode it once.
      ua_enc = string(f.cs_user_agent) ?? ""
      if ua_enc != "" { f.cs_user_agent = decode_percent(ua_enc) }
      __source_kv = f
  }

  method = upcase(string(f.cs_method) ?? "")
  code = to_int(f.sc_status) ?? 0
  if form == "realtime" {
      # A real-time configuration that does not select the documented field
      # order cannot be read positionally; keep every column, do not guess.
      # Omitting a middle field shifts every later column, so the fields with a
      # closed value set are checked wherever they land.
      proto_rt = string(f.cs_protocol) ?? ""
      pver_rt = string(f.cs_protocol_version) ?? ""
      ipver_rt = string(f.c_ip_version) ?? ""
      port_rt = string(f.c_port) ?? ""
      result_rt = string(f.x_edge_result_type) ?? ""
      resp_rt = string(f.x_edge_response_result_type) ?? ""
      country_rt = string(f.c_country) ?? ""
      results = ["Hit", "RefreshHit", "Miss", "LimitExceeded", "CapacityExceeded", "Error", "Redirect", "LambdaExecutionError", "LambdaGeneratedResponse", "LambdaValidationError", "OriginShieldHit", "MissGeneratedResponse", "FunctionGeneratedResponse", "FunctionExecutionError", "FunctionThrottledError", "FunctionValidationError"]
      # A result type AWS adds later still has the documented shape: PascalCase
      # ending in one of the documented outcome words. A shifted column (a
      # country code, a host, a number) never does.
      result_shape = r'^(?:[A-Z][a-z]+)+(?:Hit|Miss|Error|Response|Exceeded|Redirect)$'
      # sc-status 000: the viewer closed the connection before a response was
      # sent. cs-method "-" (read as empty): a malformed viewer request.
      # Methods may carry '-' (M-SEARCH, VERSION-CONTROL).
      sc_raw = string(f.sc_status) ?? ""
      code_ok = (code >= 100 && code <= 599) || (code == 0 && (sc_raw == "000" || sc_raw == "0"))
      aligned = code_ok && (method == "" || match(method, r'^[A-Z][A-Z0-9_-]*$'))
      aligned = aligned && (proto_rt == "" || includes(["http", "https", "ws", "wss", "grpcs"], downcase(proto_rt)))
      aligned = aligned && (pver_rt == "" || starts_with(pver_rt, "HTTP/"))
      aligned = aligned && (ipver_rt == "" || ipver_rt == "IPv4" || ipver_rt == "IPv6")
      aligned = aligned && (port_rt == "" || match(port_rt, r'^\d{1,5}$'))
      aligned = aligned && (result_rt == "" || includes(results, result_rt) || match(result_rt, result_shape))
      aligned = aligned && (resp_rt == "" || includes(results, resp_rt) || match(resp_rt, result_shape))
      aligned = aligned && (country_rt == "" || match(country_rt, r'^[A-Z]{2}$'))
      if !aligned { fallback = "real-time field selection not in the documented order" }
  }

  if is_header || fallback != "" || form == "" {
      if fallback == "" && !is_header { fallback = "unparsable input" }
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 0,
          "activity_name": "Unknown",
          "type_uid": 0,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": to_unix_timestamp(now(), unit: "milliseconds"),
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "profiles": ["cloud"],
              "uid": sha2("aws_cloudfront|raw|" + raw_log, variant: "SHA-256"),
              "log_level": "info",
              "log_name": "CloudFront",
              "log_provider": "Amazon CloudFront",
              "product": { "name": "CloudFront", "vendor_name": "Amazon" }
          },
          "cloud": { "provider": "AWS" }
      }
      if is_header {
          # W3C directives (#Version / #Fields) head every standard log file.
          .message = raw_log
      } else {
          .metadata.log_level = "error"
          # NAN-5264: explicit fallback marker; nano parser health counts it.
          . = set!(., ["unmapped", "parse_fallback"], fallback)
      }
  } else {
      # ---- time ----
      time_ms = 0
      ts_ms = to_int(f.timestamp_ms) ?? 0
      ts = string(f.timestamp) ?? to_string(f.timestamp) ?? ""
      if ts_ms > 0 {
          time_ms = ts_ms
      } else if match(ts, r'^\d+(?:\.\d+)?$') {
          time_ms = to_int((to_float(ts) ?? 0.0) * 1000.0)
      } else if ts != "" {
          tp, terr = parse_timestamp(ts, "%+", timezone: "UTC")
          if terr == null { time_ms = to_unix_timestamp(tp, unit: "milliseconds") }
      } else {
          dt = (string(f.date) ?? "") + " " + (string(f.time) ?? "")
          # utc-by-spec: CloudFront access logs write date and time in UTC.
          tp, terr = parse_timestamp(dt, "%Y-%m-%d %H:%M:%S", timezone: "UTC")
          if terr == null { time_ms = to_unix_timestamp(tp, unit: "milliseconds") }
      }

      # ---- method -> activity_id ----
      activity_id = 99
      activity_name = "Other"
      if method == "CONNECT" { activity_id = 1; activity_name = "Connect" }
      if method == "DELETE"  { activity_id = 2; activity_name = "Delete" }
      if method == "GET"     { activity_id = 3; activity_name = "Get" }
      if method == "HEAD"    { activity_id = 4; activity_name = "Head" }
      if method == "OPTIONS" { activity_id = 5; activity_name = "Options" }
      if method == "POST"    { activity_id = 6; activity_name = "Post" }
      if method == "PUT"     { activity_id = 7; activity_name = "Put" }
      if method == "TRACE"   { activity_id = 8; activity_name = "Trace" }
      if method == "PATCH"   { activity_id = 9; activity_name = "Patch" }

      # ---- url ----
      scheme = downcase(string(f.cs_protocol) ?? "")
      edge_host = string(f.cs_host) ?? ""
      host = string(f.x_host_header) ?? edge_host
      path = string(f.cs_uri_stem) ?? ""
      query = string(f.cs_uri_query) ?? ""
      if query == "-" { query = "" }
      url_obj = {}
      if path != "" { url_obj.path = path }
      if query != "" { url_obj.query_string = query }
      if host != "" { url_obj.hostname = host }
      if scheme != "" { url_obj.scheme = scheme }
      if host != "" && scheme != "" {
          url_obj.url_string = scheme + "://" + host + path
          if query != "" { url_obj.url_string = url_obj.url_string + "?" + query }
      }
      if length(url_obj) == 0 { url_obj.path = "/" }

      http_request = { "url": url_obj }
      # http_method is an OCSF enum with no "Other": a method outside it
      # (M-SEARCH, PROPFIND, ...) stays as sent in unmapped.cs_method.
      if includes(["CONNECT", "DELETE", "GET", "HEAD", "OPTIONS", "POST", "PUT", "TRACE", "PATCH"], method) { http_request.http_method = method }
      ua = string(f.cs_user_agent) ?? ""
      if ua != "" && ua != "-" { http_request.user_agent = ua }
      ref = string(f.cs_referer) ?? ""
      if ref != "" && ref != "-" { http_request.referrer = ref }
      pver = string(f.cs_protocol_version) ?? ""
      if pver != "" && pver != "-" { http_request.version = pver }
      rid = string(f.x_edge_request_id) ?? ""
      if rid != "" && rid != "-" { http_request.uid = rid }
      xff = string(f.x_forwarded_for) ?? ""
      if xff != "" && xff != "-" {
          http_request.x_forwarded_for = map_values(split(xff, ",")) -> |v| { strip_whitespace(string!(v)) }
      }

      # ---- response ----
      http_response = {}
      # sc-status 000 (no response was sent) is the code the source wrote: 0.
      sc_text = string(f.sc_status) ?? ""
      if code > 0 || sc_text == "000" || sc_text == "0" { http_response.code = code }
      ctype = string(f.sc_content_type) ?? ""
      if ctype != "" && ctype != "-" { http_response.content_type = ctype }
      if exists(f.sc_content_len) {
          clen = to_int(f.sc_content_len) ?? -1
          if clen >= 0 { http_response.length = clen }
      }
      if exists(f.time_to_first_byte) {
          ttfb = to_float(f.time_to_first_byte) ?? -1.0
          if ttfb >= 0.0 { http_response.latency = to_int(ttfb * 1000.0) }
      }

      status_id = 0
      status_str = "Unknown"
      if code > 0 {
          if code < 400 { status_id = 1; status_str = "Success" } else { status_id = 2; status_str = "Failure" }
          http_response.status = status_str
      }

      # ---- endpoints ----
      src_endpoint = {}
      cip = string(f.c_ip) ?? ""
      if cip != "" { src_endpoint.ip = downcase(cip) }
      cport = to_int(f.c_port) ?? 0
      if cport > 0 { src_endpoint.port = cport }
      country = string(f.c_country) ?? ""
      if country != "" && country != "-" { src_endpoint.location = { "country": country } }
      asn = to_int(f.asn) ?? 0
      if asn > 0 { src_endpoint.autonomous_system = { "number": asn } }
      if length(src_endpoint) == 0 { src_endpoint.ip = "0.0.0.0" }

      dst_endpoint = {}
      if edge_host != "" { dst_endpoint.hostname = edge_host }
      sip = string(f.s_ip) ?? ""
      if sip != "" && sip != "-" { dst_endpoint.ip = downcase(sip) }
      if scheme == "https" || scheme == "wss" || scheme == "grpcs" { dst_endpoint.port = 443 }
      if scheme == "http" || scheme == "ws" { dst_endpoint.port = 80 }

      # ---- tls / traffic / duration ----
      tls = {}
      sslp = string(f.ssl_protocol) ?? ""
      if sslp != "" && sslp != "-" { tls.version = sslp }
      sslc = string(f.ssl_cipher) ?? ""
      if sslc != "" && sslc != "-" { tls.cipher = sslc }

      traffic = {}
      if exists(f.sc_bytes) {
          scb = to_int(f.sc_bytes) ?? -1
          if scb >= 0 { traffic.bytes_in = scb }
      }
      if exists(f.cs_bytes) {
          csb = to_int(f.cs_bytes) ?? -1
          if csb >= 0 { traffic.bytes_out = csb }
      }

      # ---- edge verdict: geo restriction / blocked request ----
      detailed = string(f.x_edge_detailed_result_type) ?? ""
      result_type = string(f.x_edge_result_type) ?? ""
      blocked = detailed == "ClientGeoBlocked" || detailed == "InvalidRequestBlocked"
      severity_id = 1
      severity = "Informational"
      if result_type == "Error" && code >= 500 { severity_id = 2; severity = "Low" }

      profiles = ["cloud"]
      if blocked { profiles = push(profiles, "security_control") }

      uid = rid
      if uid == "" || uid == "-" { uid = sha2("aws_cloudfront|raw|" + raw_log, variant: "SHA-256") }

      ocsf = {
          "class_uid": class_uid,
          "class_name": "HTTP Activity",
          "category_uid": 4,
          "category_name": "Network Activity",
          "activity_id": activity_id,
          "activity_name": activity_name,
          "type_uid": class_uid * 100 + activity_id,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": status_id,
          "status": status_str,
          "time": time_ms,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "profiles": profiles,
              "uid": uid,
              "log_name": "CloudFront",
              "log_provider": "Amazon CloudFront",
              "product": { "name": "CloudFront", "vendor_name": "Amazon" }
          },
          "cloud": { "provider": "AWS" },
          "src_endpoint": src_endpoint,
          "http_request": http_request
      }
      if length(dst_endpoint) > 0 { ocsf.dst_endpoint = dst_endpoint }
      if length(http_response) > 0 { ocsf.http_response = http_response }
      if length(tls) > 0 { ocsf.tls = tls }
      if length(traffic) > 0 { ocsf.traffic = traffic }
      if exists(f.time_taken) {
          tt = to_float(f.time_taken) ?? -1.0
          if tt >= 0.0 { ocsf.duration = to_int(tt * 1000.0) }
      }
      if result_type != "" && result_type != "-" { ocsf.status_detail = result_type }
      if blocked {
          ocsf.action_id = 2
          ocsf.action = "Denied"
          ocsf.disposition_id = 2
          ocsf.disposition = "Blocked"
          ocsf.is_alert = false
      }
      if form == "realtime" { ocsf.metadata.log_name = "CloudFront real-time" }
      . = ocsf
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # Values spill exactly as parsed: a parser never masks, redacts or withholds
  # anything (masking is an opt-in pipeline step, never a parser concern).
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # A source field is consumed ONLY by an explicit mapping: a field-coverage.yaml
  # `mappings` entry (source key -> target paths) or a `transforms` rule with a
  # target, whose value is found AT THAT TARGET PATH of the selected branch. A
  # value that merely appears somewhere else in the event never consumes a field
  # (no coincidental consumption); everything else spills.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The sets below are strings instead
  # (a read shares the buffer). __repr holds one member per mapped leaf:
  # "," + encode_json(path) + "=" + encode_json(encode_json(value)), plus the
  # to_string form for a string or a float, so a numeric string is represented by
  # its typed scalar. Every part is a JSON text, inside which a '"' is always
  # escaped, so a member is matched exactly. Paths drop array indices
  # (resources.0.uid is resources.uid); arrays are walked two levels deep, and a
  # leaf deeper than that is simply not mapping evidence (it can only spill more).
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped = object!(parse_json!(encode_json(__mapped)))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __copy = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __repr = ""
  for_each(flatten(__mapped)) -> |path, value| {
      __p = encode_json(path)
      if is_array(value) {
          for_each(array!(value)) -> |_i, item| {
              if is_object(item) {
                  for_each(flatten(object!(item))) -> |sub, leaf| {
                      __q = encode_json(path + "." + sub)
                      if is_array(leaf) {
                          for_each(array!(leaf)) -> |_j, x| {
                              if !is_object(x) && !is_array(x) {
                                  __repr = __repr + ("," + __q + "=" + encode_json(encode_json(x)))
                                  if is_string(x) || is_float(x) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(x))) }
                              }
                          }
                      } else {
                          __repr = __repr + ("," + __q + "=" + encode_json(encode_json(leaf)))
                          if is_string(leaf) || is_float(leaf) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(leaf))) }
                      }
                  }
              } else if !is_array(item) {
                  __repr = __repr + ("," + __p + "=" + encode_json(encode_json(item)))
                  if is_string(item) || is_float(item) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(item))) }
              }
          }
      } else {
          __repr = __repr + ("," + __p + "=" + encode_json(encode_json(value)))
          if is_string(value) || is_float(value) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(value))) }
      }
  }
  __consumed = ""
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__copy.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # BEGIN parser-specific transformations
  # cs-method: The OCSF http_method enum; a method outside it (M-SEARCH, PROPFIND) is not emitted and stays in unmapped as sent.
  # cs_method: The OCSF http_method enum; a method outside it (M-SEARCH, PROPFIND) is not emitted and stays in unmapped as sent.
  # timestamp: Real-time and v2 epoch-second timestamps converted to the emitted millisecond clock.
  # time_taken: Seconds converted to the emitted millisecond duration.
  # time-taken: Seconds converted to the emitted millisecond duration (v2 JSON key).
  # time_to_first_byte: Seconds converted to the emitted millisecond response latency.
  # time-to-first-byte: Seconds converted to the emitted millisecond response latency (v2 JSON key).
  for_each(__flat) -> |key, value| {
      if match(key, r'(?x)
      \A(?:
        cs\-method
      | cs_method
      )\z') {
          __value = value
          if __value != null {
              __expected = get!({"connect": "CONNECT", "delete": "DELETE", "get": "GET", "head": "HEAD", "options": "OPTIONS", "post": "POST", "put": "PUT", "trace": "TRACE", "patch": "PATCH"}, [downcase(to_string(__value) ?? "")])
              if __expected != null {
                  if contains(__repr, "," + "\"http_request.http_method\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
              }
          }
      }
      if match(key, r'(?x)
      \A(?:
        timestamp
      )\z') {
          __value = value
          __number, __number_err = to_float(__value)
          if __number_err == null && __value != null && !is_boolean(__value) {
              __expected = to_int(__number * 1000.0)
              if contains(__repr, "," + "\"time\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        time_taken
      | time\-taken
      )\z') {
          __value = value
          __number, __number_err = to_float(__value)
          if __number_err == null && __value != null && !is_boolean(__value) {
              __expected = to_int(__number * 1000.0)
              if contains(__repr, "," + "\"duration\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        time_to_first_byte
      | time\-to\-first\-byte
      )\z') {
          __value = value
          __number, __number_err = to_float(__value)
          if __number_err == null && __value != null && !is_boolean(__value) {
              __expected = to_int(__number * 1000.0)
              if contains(__repr, "," + "\"http_response.latency\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
  }
  # Declared source -> target mappings (field-coverage.yaml `mappings`).
  __decl = "\n\"asn\"\t[\"src_endpoint.autonomous_system.number\"]\n\"c-country\"\t[\"src_endpoint.location.country\"]\n\"c-ip\"\t[\"src_endpoint.ip\"]\n\"c-port\"\t[\"src_endpoint.port\"]\n\"c_country\"\t[\"src_endpoint.location.country\"]\n\"c_ip\"\t[\"src_endpoint.ip\"]\n\"c_port\"\t[\"src_endpoint.port\"]\n\"cs\\u0028Host\\u0029\"\t[\"dst_endpoint.hostname\"]\n\"cs\\u0028User-Agent\\u0029\"\t[\"http_request.user_agent\"]\n\"cs-bytes\"\t[\"traffic.bytes_out\"]\n\"cs-protocol\"\t[\"http_request.url.scheme\"]\n\"cs-protocol-version\"\t[\"http_request.version\"]\n\"cs-uri-stem\"\t[\"http_request.url.path\"]\n\"cs_bytes\"\t[\"traffic.bytes_out\"]\n\"cs_host\"\t[\"dst_endpoint.hostname\"]\n\"cs_protocol\"\t[\"http_request.url.scheme\"]\n\"cs_protocol_version\"\t[\"http_request.version\"]\n\"cs_referer\"\t[\"http_request.referrer\"]\n\"cs_uri_query\"\t[\"http_request.url.query_string\"]\n\"cs_uri_stem\"\t[\"http_request.url.path\"]\n\"cs_user_agent\"\t[\"http_request.user_agent\"]\n\"s_ip\"\t[\"dst_endpoint.ip\"]\n\"sc-bytes\"\t[\"traffic.bytes_in\"]\n\"sc-content-len\"\t[\"http_response.length\"]\n\"sc-content-type\"\t[\"http_response.content_type\"]\n\"sc-status\"\t[\"http_response.code\"]\n\"sc_bytes\"\t[\"traffic.bytes_in\"]\n\"sc_content_len\"\t[\"http_response.length\"]\n\"sc_content_type\"\t[\"http_response.content_type\"]\n\"sc_status\"\t[\"http_response.code\"]\n\"ssl-cipher\"\t[\"tls.cipher\"]\n\"ssl-protocol\"\t[\"tls.version\"]\n\"ssl_cipher\"\t[\"tls.cipher\"]\n\"ssl_protocol\"\t[\"tls.version\"]\n\"timestamp\\u0028ms\\u0029\"\t[\"time\"]\n\"x-edge-request-id\"\t[\"http_request.uid\",\"metadata.uid\"]\n\"x-edge-result-type\"\t[\"status_detail\"]\n\"x-host-header\"\t[\"http_request.url.hostname\"]\n\"x_edge_request_id\"\t[\"http_request.uid\",\"metadata.uid\"]\n\"x_edge_result_type\"\t[\"status_detail\"]\n\"x_host_header\"\t[\"http_request.url.hostname\"]\n"
  __preserve = []
  # END parser-specific transformations
  # Declared mappings: __decl holds "\n" + encode_json(key) + "\t" + JSON array of
  # target paths + "\n" per mapped source key (a raw newline never occurs in
  # compact JSON). A key is consumed when its value, or every element of a scalar
  # array, is at one of its own targets. Keys stay ESCAPED here and in __consumed:
  # a literal dotted key ("a~1b") and the nested path ("a.b") are different
  # fields, and mapping one never consumes the other.
  for_each(__flat) -> |key, value| {
      # __decl spells a bracket inside a key as a \u escape (deploy bracket count).
      __kt = encode_json(key)
      if match(__kt, r'[\x28\x29\x5B\x5D\x7B\x7D]') {
          __kt = replace(replace(replace(replace(replace(replace(__kt, r'\x28', "\\u0028"), r'\x29', "\\u0029"), r'\x5B', "\\u005b"), r'\x5D', "\\u005d"), r'\x7B', "\\u007b"), r'\x7D', "\\u007d")
      }
      __at = find(__decl, "\n" + __kt + "\t")
      if is_integer(__at) && !is_object(value) {
          __rest = slice!(__decl, int!(__at) + strlen(__kt) + 2)
          __hit = false
          for_each(array!(parse_json!(slice!(__rest, 0, int!(find(__rest, "\n")))))) -> |_i, target| {
              __tok = "," + encode_json(target) + "="
              if !__hit && is_array(value) {
                  __all = !is_empty(array!(value))
                  for_each(array!(value)) -> |_j, item| {
                      if __all {
                          __all = !is_object(item) && !is_array(item) && (contains(__repr, __tok + encode_json(encode_json(item))) || ((is_string(item) || is_float(item)) && contains(__repr, __tok + encode_json(to_string!(item)))))
                      }
                  }
                  __hit = __all
              } else if !__hit {
                  __hit = contains(__repr, __tok + encode_json(encode_json(value))) || ((is_string(value) || is_float(value)) && contains(__repr, __tok + encode_json(to_string!(value))))
              }
          }
          if __hit { __consumed = __consumed + ("," + encode_json(key)) }
      }
  }
  # Fast path: when no two source keys decode to the same key and no two spilled
  # keys get the same name, each key's decision depends only on its own value, so
  # one filter and one rename build the residual without copying it per key.
  __distinct = true
  if __tilde {
      __distinct = length(map_keys(__flat) -> |key| { replace(replace(key, "~1", "."), "~0", "~") }) == length(__flat)
  }
  __kept = {}
  __names = {}
  if __distinct {
      __kept = filter(__flat) -> |key, value| {
          # A key is kept unless an explicit mapping or transformation consumed it.
          # Do not spill a copy of the raw body.
          value != __raw_body && !contains(__consumed, "," + encode_json(key))
      }
      __names = map_keys(__kept) -> |key| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          join!(__parts, ".")
      }
  }
  __residual = {}
  if __distinct && length(__names) == length(__kept) {
      __residual = map_values(__names) -> |value| {
          if is_array(value) || is_object(value) {
              if __tilde {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              if __complex { value = encode_json(value) }
          }
          value
      }
  } else {
      # Slow path: two spilled keys get the same name. A literal dotted key and a
      # nested path read alike ({"a.b": 1, "a": {"b": 2}} is "a.b" twice), and so
      # do keys that only snake-case alike ("userName", "user_name").
      # NAN-5894: a literal dotted key whose name is shared keeps its dots
      # escaped, RFC 6901 style ("a~1b", a "~" in it as "~0"), and the key
      # without a literal dot keeps "a.b". That is the name nano's ingest step
      # gives the flat key when no parser runs, so the name never depends on
      # whether a parser read the event, and it cannot clash with a vendor key
      # that is really named "b_2". A key is escaped only when its escaped name
      # is unique too (two flat keys that only snake-case alike escape to the
      # same name, so escaping would not tell them apart). Only a name still
      # taken after that gets the next free _2, _3, ... suffix, in key order:
      # keys that differ only in case or snake-casing, or a vendor key already
      # spelled "a~1b" (nothing is ever dropped).
      __spilled = filter(__flat) -> |key, value| {
          value != __raw_body && !contains(__consumed, "," + encode_json(key))
      }
      __plain = map_values(keys(__spilled)) -> |key| {
          key = replace(replace(string!(key), "~1", "."), "~0", "~")
          join!(map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }, ".")
      }
      __shared = filter(tally(__plain)) -> |_name, count| { count > 1 }
      __shared = "\n" + join!(map_values(keys(__shared)) -> |name| { encode_json(name) }, "\n") + "\n"
      # The escaped name of each literal dotted key ("" for any other key).
      __escaped_names = map_values(keys(__spilled)) -> |key| {
          key = string!(key)
          if contains(key, "~1") {
              join!(map_values(split(key, ".")) -> |segment| {
                  join!(map_values(split(string!(segment), "~1")) -> |piece| {
                      replace(snakecase(replace(string!(piece), "~0", "~")), "~", "~0")
                  }, "~1")
              }, ".")
          } else { "" }
      }
      __escaped_shared = filter(tally(__escaped_names)) -> |_name, count| { count > 1 }
      __escaped_shared = "\n" + join!(map_values(keys(__escaped_shared)) -> |name| { encode_json(name) }, "\n") + "\n"
      for_each(__flat) -> |key, value| {
          __token = "," + encode_json(key)
          __escaped_key = key
          key = replace(replace(key, "~1", "."), "~0", "~")
          if is_array(value) || is_object(value) {
              value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                  replace(replace(inner, "~1", "."), "~0", "~")
              }, ["v"])
          }
          if !contains(__consumed, __token) && value != __raw_body {
              __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
              __base = join!(__parts, ".")
              if contains(__escaped_key, "~1") && contains(__shared, "\n" + encode_json(__base) + "\n") {
                  __escaped_name = join!(map_values(split(__escaped_key, ".")) -> |segment| {
                      join!(map_values(split(string!(segment), "~1")) -> |piece| {
                          replace(snakecase(replace(string!(piece), "~0", "~")), "~", "~0")
                      }, "~1")
                  }, ".")
                  if !contains(__escaped_shared, "\n" + encode_json(__escaped_name) + "\n") { __base = __escaped_name }
              }
              __key = __base
              __suffix = 2
              if includes(keys(__residual), __key) {
                  for_each(__flat) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __key) {
                          __key = __base + "_" + to_string(__suffix)
                          __suffix = __suffix + 1
                      }
                  }
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              __spill = if __complex { encode_json(value) } else { value }
              __residual = set!(__residual, [__key], __spill)
          }
      }
  }
  # Names nano owns in unmapped (the parser markers and the reserved nano.*
  # namespace) are never taken by a source field: a vendor key with such a name
  # is kept, renamed source_<name>, so a log cannot forge a marker. An escaped
  # flat key ("nano~1x", NAN-5894) is renamed the same way as "nano.x".
  if match(encode_json(keys(__residual)), r'"nano(?:"|\.|~1|_time_assumed_tz"|_time_source"|_operational")') {
      for_each(object!(__residual)) -> |key, value| {
          if includes(["nano", "nano_time_assumed_tz", "nano_time_source", "nano_operational"], key) || starts_with(key, "nano.") || starts_with(key, "nano~1") {
              # source_<name>, or the next free _2, _3, ... when a vendor key
              # already holds that name: nothing is lost.
              __rk = "source_" + key
              __rn = 2
              if includes(keys(__residual), __rk) {
                  for_each(__residual) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __rk) {
                          __rk = "source_" + key + "_" + to_string(__rn)
                          __rn = __rn + 1
                      }
                  }
              }
              __residual = remove!(__residual, [key])
              __residual = set!(__residual, [__rk], value)
          }
      }
  }
  # Keep existing derived evidence, but remove null placeholders and copies of a
  # source value (that value is mapped or spilled above under its source path).
  # A value merely equal to some mapped attribute is kept: equality with an
  # unrelated attribute is no evidence that it is represented.
  # The canonical source spill above is the authoritative representation of
  # containers. The cheap conditions run first; the source value set is built on
  # first use.
  __original_values = null
  for_each(flatten(__existing)) -> |key, value| {
      if !is_null(value) && value != "" && !is_array(value) && !is_object(value) && value != __raw_body {
          # Members for the value itself and for to_string(value), as above.
          __json = encode_json(value)
          __as_json = "," + encode_json(__json)
          __as_string = __as_json
          if is_string(value) { __as_string = "," + __json } else if is_float(value) { __as_string = "," + encode_json(to_string!(value)) }
          if __original_values == null {
              # __source_kv may hold non-JSON types (a timestamp), so only an
              # integer or a boolean skips its to_string member here.
              __original_values = join!(map_values(values(flatten(__source_kv))) -> |source_value| {
                  __source_json = encode_json(source_value)
                  __tokens = "," + encode_json(__source_json)
                  if is_string(source_value) {
                      __tokens = __tokens + "," + __source_json
                  } else if !is_object(source_value) && !is_array(source_value) && !is_integer(source_value) && !is_boolean(source_value) {
                      __tokens = __tokens + "," + encode_json(to_string(source_value) ?? "")
                  }
                  __tokens
              }, "")
          }
          __source_set = string!(__original_values)
          __keep = !contains(__source_set, __as_json) && !contains(__source_set, __as_string)
          # Only text opening an object or an array (after JSON whitespace)
          # decodes to a container.
          if __keep && is_string(value) && match(string!(value), r'^[ \t\n\r]*[\x5B\x7B]') {
              __decoded, __decode_err = parse_json(string!(value))
              __keep = !(__decode_err == null && (is_object(__decoded) || is_array(__decoded)))
          }
          if __keep {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, as-is. These
  # entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__copy.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  if __time_assumed && !__time_inline { __residual = set!(__residual, ["nano_time_assumed_tz"], __src_tz_label) }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

