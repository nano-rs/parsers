source: mixed
transforms:
- source: timestamp
  kind: epoch_ms
  target: time
  format: '%+'
  reason: Standard log date + time captured as one UTC instant and converted to the emitted millisecond clock.
- source: timestamp
  kind: scale
  factor: 1000
  target: time
  reason: Real-time and v2 epoch-second timestamps converted to the emitted millisecond clock.
- source: time_taken
  kind: scale
  factor: 1000
  target: duration
  reason: Seconds converted to the emitted millisecond duration.
- source: time-taken
  kind: scale
  factor: 1000
  target: duration
  reason: Seconds converted to the emitted millisecond duration (v2 JSON key).
- source: time_to_first_byte
  kind: scale
  factor: 1000
  target: http_response.latency
  reason: Seconds converted to the emitted millisecond response latency.
- source: time-to-first-byte
  kind: scale
  factor: 1000
  target: http_response.latency
  reason: Seconds converted to the emitted millisecond response latency (v2 JSON key).
