source: mixed
transforms:
- source: start
  target: time
  kind: scale
  factor: 1000
  reason: Source seconds converted to the emitted millisecond value.
- source: start
  target: start_time
  kind: scale
  factor: 1000
  reason: Source seconds converted to the emitted millisecond value.
- source: end
  target: end_time
  kind: scale
  factor: 1000
  reason: Source seconds converted to the emitted millisecond value.
- source: action
  kind: enum
  target: action_id
  values:
    allow: 1
    allowed: 1
    accept: 1
    accepted: 1
    permit: 1
    permitted: 1
    pass: 1
    passed: 1
    deny: 2
    denied: 2
    block: 2
    blocked: 2
    reject: 2
    rejected: 2
    drop: 2
    dropped: 2
    log: 3
    observed: 3
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping;
    consume only when the expected ID is emitted.
consumed_candidates:
- account_id
- action
- az_id
- bytes
- dstaddr
- dstport
- end
- flow-direction
- flow_direction
- instance_id
- interface_id
- log_status
- packets
- pkt-dst-aws-service
- pkt-src-aws-service
- protocol
- region
- srcaddr
- srcport
- start
- subnet_id
- tcp_flags
- type
- version
- vpc_id
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
