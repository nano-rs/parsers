source: mixed
transforms:
- source: start
  target: time
  kind: scale
  factor: 1000
  reason: Source seconds converted to the emitted millisecond value.
- source: start
  target: start_time
  kind: scale
  factor: 1000
  reason: Source seconds converted to the emitted millisecond value.
- source: end
  target: end_time
  kind: scale
  factor: 1000
  reason: Source seconds converted to the emitted millisecond value.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  account_id:
  - cloud.account.uid
  bytes:
  - traffic.bytes
  - traffic.bytes_out
  dstaddr:
  - dst_endpoint.ip
  dstport:
  - dst_endpoint.port
  instance_id:
  - dst_endpoint.instance_uid
  interface_id:
  - dst_endpoint.interface_uid
  packets:
  - traffic.packets
  - traffic.packets_out
  pkt-dst-aws-service:
  - dst_endpoint.svc_name
  protocol:
  - connection_info.protocol_num
  region:
  - cloud.region
  srcaddr:
  - src_endpoint.ip
  srcport:
  - src_endpoint.port
  subnet_id:
  - dst_endpoint.subnet_uid
  vpc_id:
  - dst_endpoint.vpc_uid
