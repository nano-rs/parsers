source: json
transforms:
- source: timestamp
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: event_type
  kind: lowercase
  target: metadata.event_code
  reason: Parser lowercases the event type; consume only when the normalized value
    is emitted.
consumed_candidates:
- application.display_label
- application.id
- application.name
- client_ip
- error_message
- failure_reason
- geoip.country_code
- geoip.country_code2
- geoip.latitude
- geoip.longitude
- geoip.region_name
- id
- initiated_by.email
- initiated_by.id
- initiated_by.name
- initiated_by.username
- message
- mfa
- organization
- outer.error_message
- resource.email
- resource.id
- resource.name
- resource.recipient_email
- resource.type
- resource.username
- service
- src_ip
- success
- system.displayName
- system.hostname
- system.id
- username
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
