source: json
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
transforms:
- source: timestamp
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: event_type
  kind: lowercase
  target: metadata.event_code
  reason: Parser lowercases the event type; consume only when the normalized value is emitted.
mappings:
  client_ip:
  - src_endpoint.ip
  error_message:
  - status_detail
  event_type:
  - api.operation
  - message
  - metadata.event_code
  geoip.country_code:
  - src_endpoint.location.country
  geoip.region_name:
  - src_endpoint.location.region
  id:
  - metadata.uid
  mfa:
  - is_mfa
  organization:
  - metadata.tenant_uid
  service:
  - api.service.name
  username:
  - user.name
  initiated_by.email:
  - actor.user.email_addr
  - actor.user.name
  - user.email_addr
  - user.name
  initiated_by.id:
  - actor.user.uid
  - user.uid
  resource.email:
  - user.email_addr
  - user.name
  resource.id:
  - group.uid
  - user.uid
  resource.type:
  - group.type
  resource.username:
  - user.name
  geoip.latitude:
  - src_endpoint.location.lat
  geoip.longitude:
  - src_endpoint.location.long
  geoip.country_code2:
  - src_endpoint.location.country
  resource.name:
  - group.name
  - user.display_name
  application.display_label:
  - service.name
  application.id:
  - service.uid
  initiated_by.username:
  - user.name
  message:
  - message
  src_ip:
  - src_endpoint.ip
  system.displayName:
  - dst_endpoint.name
  system.hostname:
  - dst_endpoint.hostname
  system.id:
  - dst_endpoint.uid
  resource.recipient_email:
  - user.email_addr
