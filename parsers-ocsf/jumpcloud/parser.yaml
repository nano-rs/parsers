name: jumpcloud_ocsf
display_name: JumpCloud Directory Insights (OCSF)
version: "1.0.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses JumpCloud Directory Insights events (POST /insights/directory/v1/events,
  one array element per input event) into complete OCSF 1.9.0 records, routed
  by event_type:
    user_login_attempt, admin_login_attempt, sso_auth, radius_auth,
    ldap_bind, user_login (systems)          -> Authentication 3002
    user_* / admin_* / systemuser_* account lifecycle, lockout, suspension,
    password and TOTP enrollment events      -> User Management 3007
    group_create / group_update / group_delete,
    user_group_admin_grant / _revoke         -> Group Management 3006
    any other event with an initiated_by     -> API Activity 6003
    anything else (mdm, software, agent)     -> Base Event 0, kept whole
  Account Change 3001 is deprecated in OCSF 1.9 and is not emitted. The
  `success` boolean drives status; initiated_by is the actor and `resource`
  (or `username` on auth events) the subject. The service names the protocol:
  sso -> SAML, radius -> RADIUS, ldap -> LDAP.
match_values:
  - jumpcloud
category: security
vendor: "JumpCloud"
product: "Directory Insights"
parser_vrl: |
  # NAN source timezone. Generated by scripts/residual_spill.py; edit scripts/residual/source_tz.vrl.
  # The log source's timezone setting arrives as .nano.source_timezone (an IANA
  # name such as "America/New_York", or any fixed offset such as "+05:30"), set
  # by nano at ingest. .nano is nano's input, never part of the log: it is
  # removed whole before anything else, whatever its shape.
  # For a clock that carries no offset a parser parses it AS UTC and sets
  # __lc_pending; the generated local-clock block that follows the parse
  # (local_clock.vrl) turns it into real UTC with this setting, and the spill
  # records the zone used as unmapped.nano_time_assumed_tz (the name, the offset
  # as +HH:MM, or "UTC" when the setting is absent, invalid or "local").
  __src_nano = del(.nano)
  __src_tz_in = ""
  if is_object(__src_nano) { __src_tz_in = strip_whitespace(to_string(object!(__src_nano).source_timezone) ?? "") }
  __src_tz = "UTC"
  __src_shift_ms = 0
  __src_tz_label = "UTC"
  __time_assumed = false
  __time_inline = false
  __lc_pending = false
  __lc_shifted = ""
  __src_off = parse_regex(__src_tz_in, r'^(?P<sign>[+-])(?P<h>\d{2}):?(?P<m>\d{2})$') ?? {}
  if !is_empty(__src_off) {
      __src_h = to_int(__src_off.h) ?? 99
      __src_m = to_int(__src_off.m) ?? 99
      if __src_h <= 14 && __src_m <= 59 {
          __src_shift_ms = (__src_h * 3600 + __src_m * 60) * 1000
          if __src_off.sign == "-" { __src_shift_ms = 0 - __src_shift_ms }
          if __src_shift_ms != 0 { __src_tz_label = string!(__src_off.sign) + string!(__src_off.h) + ":" + string!(__src_off.m) }
      }
  } else if __src_tz_in != "" && downcase(__src_tz_in) != "local" {
      # "local" (the Vector host's zone) would make the time depend on the host.
      __src_probe, __src_probe_err = parse_timestamp("2000-01-01 00:00:00", "%Y-%m-%d %H:%M:%S", timezone: __src_tz_in)
      if __src_probe_err == null { __src_tz = __src_tz_in; __src_tz_label = __src_tz_in }
  }
  # END NAN source timezone
  # JumpCloud Directory Insights JSON -> OCSF 1.9.0.
  raw_log = to_string(.message) ?? ""
  __raw_body = raw_log
  __source_kv = {}
  parsed, err = parse_json(raw_log)
  __source_kv = object(parsed) ?? {}

  if err != null || !is_object(parsed) || !is_string(parsed.event_type) {
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 0,
          "activity_name": "Unknown",
          "type_uid": 0,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": 0,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": sha2("jumpcloud|raw|" + raw_log, variant: "SHA-256"),
              "log_level": "error",
              "log_name": "Directory Insights",
              "log_provider": "JumpCloud",
              "product": { "name": "Directory Insights", "vendor_name": "JumpCloud" }
          },
          "unmapped": { "parse_error": "not a JumpCloud Directory Insights event" }
      }
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      . = set!(., ["unmapped", "parse_fallback"], "unparsable input")
  } else {
      p = object!(parsed)
      event_type = downcase(string(p.event_type) ?? "")
      svc = downcase(string(p.service) ?? "")
      init = object(p.initiated_by) ?? {}
      res = object(p.resource) ?? {}
      geo = object(p.geoip) ?? {}
      app = object(p.application) ?? {}
      sys = object(p.system) ?? {}

      # ---- time ----
      time_ms = 0
      t, terr = parse_timestamp(string(p.timestamp) ?? "", "%+", timezone: "UTC")
      if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }

      # ---- outcome ----
      status_id = 0
      status_str = "Unknown"
      if is_boolean(p.success) {
          if bool!(p.success) { status_id = 1; status_str = "Success" } else { status_id = 2; status_str = "Failure" }
      }
      err_msg = string(p.error_message) ?? ""
      if err_msg == "" { err_msg = string(p.failure_reason) ?? "" }
      if err_msg == "" { err_msg = string(p.outer.error_message) ?? "" }

      severity_id = 1
      severity = "Informational"
      if status_id == 2 { severity_id = 2; severity = "Low" }
      if ends_with(event_type, "_lockout") { severity_id = 3; severity = "Medium" }

      # ---- actor: initiated_by ----
      email_re = r'^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$'
      i_type = downcase(string(init.type) ?? "")
      i_email = string(init.email) ?? ""
      i_username = string(init.username) ?? ""
      i_id = string(init.id) ?? ""
      actor_user = {}
      if i_email != "" || i_username != "" || i_id != "" {
          au = { "type_id": 1, "type": "User" }
          if i_type == "admin" { au = { "type_id": 2, "type": "Admin" } }
          if i_type == "system" { au = { "type_id": 3, "type": "System" } }
          if i_username != "" { au.name = i_username } else if i_email != "" { au.name = i_email }
          if match(i_email, email_re) { au.email_addr = i_email }
          if i_id != "" { au.uid = i_id }
          i_full = string(init.name) ?? ""
          if i_full != "" { au.full_name = i_full }
          actor_user = au
      }

      # ---- subject: resource, else username ----
      subj = {}
      r_type = downcase(string(res.type) ?? "")
      r_username = string(res.username) ?? ""
      r_email = string(res.email) ?? ""
      if r_email == "" { r_email = string(res.recipient_email) ?? "" }
      r_id = string(res.id) ?? ""
      if r_type == "user" || r_type == "systemuser" || r_type == "admin" {
          su = { "type_id": 1, "type": "User" }
          if r_type == "admin" { su = { "type_id": 2, "type": "Admin" } }
          if r_username != "" { su.name = r_username } else if r_email != "" { su.name = r_email }
          if match(r_email, email_re) { su.email_addr = r_email }
          if r_id != "" { su.uid = r_id }
          r_disp = string(res.name) ?? ""
          if r_disp != "" { su.display_name = r_disp }
          # OCSF user needs at least one of name / uid: a resource with neither
          # names no subject, and its fields stay in unmapped.
          if exists(su.name) || exists(su.uid) { subj = su }
      }
      p_username = string(p.username) ?? ""

      # ---- source endpoint ----
      src_ip = string(p.src_ip) ?? ""
      if src_ip == "" { src_ip = string(p.client_ip) ?? "" }
      src_ep = {}
      # ip_t only takes a real address; anything else stays in unmapped.
      if src_ip != "" && (is_ipv4(src_ip) || is_ipv6(src_ip)) { src_ep.ip = src_ip }
      loc = {}
      cc = string(geo.country_code) ?? ""
      if cc == "" { cc = string(geo.country_code2) ?? "" }
      if cc != "" { loc.country = cc }
      rn = string(geo.region_name) ?? ""
      if rn != "" { loc.region = rn }
      la = null
      if is_integer(geo.latitude) || is_float(geo.latitude) { la = to_float(geo.latitude) ?? null }
      if la != null { loc.lat = la }
      lo = null
      if is_integer(geo.longitude) || is_float(geo.longitude) { lo = to_float(geo.longitude) ?? null }
      if lo != null { loc.long = lo }
      # location needs a country or region beside any coordinates.
      if cc != "" || rn != "" { src_ep.location = loc }

      # ---- class routing ----
      class_uid = 0
      if ends_with(event_type, "_login_attempt") || includes(["sso_auth", "radius_auth", "ldap_bind", "user_login", "user_logout"], event_type) {
          class_uid = 3002
      } else if (match(event_type, r'^(user|admin|systemuser)_') && !starts_with(event_type, "user_group_")) || match(event_type, r'^(admin_)?totp_') {
          class_uid = 3007
      } else if includes(["group_create", "group_update", "group_delete", "user_group_admin_grant", "user_group_admin_revoke"], event_type) {
          class_uid = 3006
      } else if length(actor_user) > 0 {
          class_uid = 6003
      }

      ocsf = {}
      if class_uid == 3002 {
          activity_id = 1
          activity_name = "Logon"
          if event_type == "user_logout" { activity_id = 2; activity_name = "Logoff" }
          ocsf.class_name = "Authentication"
          ocsf.category_uid = 3
          ocsf.category_name = "Identity & Access Management"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          # The principal: resource (admin_login_attempt), else the initiator,
          # else the username presented (radius / ldap / systems).
          user = {}
          if length(subj) > 0 {
              user = subj
          } else if length(actor_user) > 0 {
              user = actor_user
          }
          if p_username != "" { user.name = p_username }
          if length(user) == 0 { user = { "name": "unknown" } }
          ocsf.user = user
          # 3002 constraint: at_least_one(service, dst_endpoint).
          service = { "name": "JumpCloud" }
          if svc == "sso" {
              an = string(app.display_label) ?? ""
              if an == "" { an = string(app.name) ?? "" }
              if an != "" { service = { "name": an } }
              aid = string(app.id) ?? ""
              if aid != "" { service.uid = aid }
              surl = string(app.sso_url) ?? ""
              if contains(surl, "saml") { ocsf.auth_protocol_id = 5; ocsf.auth_protocol = "SAML" }
          } else if svc == "radius" {
              service = { "name": "JumpCloud RADIUS" }
              ocsf.auth_protocol_id = 10
              ocsf.auth_protocol = "RADIUS"
          } else if svc == "ldap" {
              service = { "name": "JumpCloud LDAP" }
              ocsf.auth_protocol_id = 12
              ocsf.auth_protocol = "LDAP"
          } else if svc == "directory" {
              service = { "name": "JumpCloud Console" }
              if starts_with(event_type, "user_") { service = { "name": "JumpCloud User Portal" } }
          }
          ocsf.service = service
          if svc == "systems" {
              dst = {}
              hn = string(sys.hostname) ?? ""
              if hn != "" { dst.hostname = hn }
              dn = string(sys.displayName) ?? ""
              if dn != "" { dst.name = dn }
              sid = string(sys.id) ?? ""
              if sid != "" { dst.uid = sid }
              if length(dst) > 0 { ocsf.dst_endpoint = dst }
          }
          if is_boolean(p.mfa) { ocsf.is_mfa = bool!(p.mfa) }
          ocsf.is_remote = true
      } else if class_uid == 3007 {
          activity_id = 99
          activity_name = "Other"
          base = replace(event_type, r'_provision$', "")
          if ends_with(base, "_create") { activity_id = 1; activity_name = "Create" }
          if ends_with(base, "_update") { activity_id = 2; activity_name = "Update" }
          if ends_with(base, "_delete") && !starts_with(base, "totp_") && !contains(base, "_schedule_") { activity_id = 3; activity_name = "Delete" }
          if ends_with(base, "_lockout") { activity_id = 6; activity_name = "Lock" }
          if ends_with(base, "_unlocked") { activity_id = 7; activity_name = "Unlock" }
          if ends_with(base, "_suspended") { activity_id = 5; activity_name = "Disable" }
          if ends_with(base, "_unsuspended") || ends_with(base, "_unsuspend") || base == "user_activated" { activity_id = 4; activity_name = "Enable" }
          if ends_with(base, "_password_change") || base == "user_password_set" { activity_id = 8; activity_name = "Password Change" }
          if ends_with(base, "_password_reset_request") { activity_id = 9; activity_name = "Password Reset" }
          if ends_with(base, "totp_finish_enrollment") { activity_id = 12; activity_name = "Enable MFA Factors" }
          if base == "totp_delete_enrollment" || base == "admin_totp_disable" { activity_id = 13; activity_name = "Disable MFA Factors" }
          if base == "user_admin_granted" { activity_id = 14; activity_name = "Assign Privileges" }
          if base == "user_admin_revoked" { activity_id = 15; activity_name = "Remove Privileges" }
          if contains(base, "_schedule_") { activity_id = 99; activity_name = "Other" }
          ocsf.class_name = "User Management"
          ocsf.category_uid = 3
          ocsf.category_name = "Identity & Access Management"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          user = subj
          if length(user) == 0 && p_username != "" { user = { "name": p_username } }
          if length(user) == 0 && length(actor_user) > 0 { user = actor_user }
          if length(user) == 0 { user = { "name": "unknown" } }
          ocsf.user = user
          if length(actor_user) > 0 { ocsf.actor = { "user": actor_user } }
      } else if class_uid == 3006 {
          activity_id = 99
          activity_name = "Other"
          if event_type == "group_create" { activity_id = 6; activity_name = "Create" }
          if event_type == "group_update" { activity_id = 9; activity_name = "Update" }
          if event_type == "group_delete" { activity_id = 5; activity_name = "Delete" }
          if event_type == "user_group_admin_grant" { activity_id = 1; activity_name = "Assign Privileges" }
          if event_type == "user_group_admin_revoke" { activity_id = 2; activity_name = "Revoke Privileges" }
          ocsf.class_name = "Group Management"
          ocsf.category_uid = 3
          ocsf.category_name = "Identity & Access Management"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          g = {}
          gn = string(res.name) ?? ""
          if gn != "" { g.name = gn }
          if r_id != "" { g.uid = r_id }
          gt = string(res.type) ?? ""
          if gt != "" { g.type = gt }
          if length(g) == 0 { g = { "name": "unknown" } }
          ocsf.group = g
          if length(actor_user) > 0 { ocsf.actor = { "user": actor_user } }
      } else if class_uid == 6003 {
          activity_id = 99
          activity_name = "Other"
          if match(event_type, r'_(create|add|include|activate)$') { activity_id = 1; activity_name = "Create" }
          if match(event_type, r'_(download|run|read|view)$') { activity_id = 2; activity_name = "Read" }
          if match(event_type, r'_(update|change|enable|disable)$') { activity_id = 3; activity_name = "Update" }
          if match(event_type, r'_(delete|remove|exclude|deactivate)$') { activity_id = 4; activity_name = "Delete" }
          ocsf.class_name = "API Activity"
          ocsf.category_uid = 6
          ocsf.category_name = "Application Activity"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          api_svc = svc
          if api_svc == "" { api_svc = "jumpcloud" }
          ocsf.api = { "operation": event_type, "service": { "name": api_svc } }
          ocsf.actor = { "user": actor_user }
          if length(src_ep) == 0 { src_ep = { "hostname": "unknown" } }
          # OCSF resource needs at least one of name / uid.
          if r_id != "" || (string(res.name) ?? "") != "" {
              rd = {}
              if r_id != "" { rd.uid = r_id }
              if r_type != "" { rd.type = string(res.type) ?? "" }
              rname = string(res.name) ?? ""
              if rname != "" { rd.name = rname }
              ocsf.resources = [rd]
          }
      } else {
          ocsf.class_name = "Base Event"
          ocsf.category_uid = 0
          ocsf.category_name = "Uncategorized"
          ocsf.activity_id = 0
          ocsf.activity_name = "Unknown"
      }
      ocsf.class_uid = class_uid
      # Base Event has no src_endpoint: its address and location stay in unmapped.
      if length(src_ep) > 0 && class_uid != 0 { ocsf.src_endpoint = src_ep }

      ocsf.status_id = status_id
      ocsf.status = status_str
      if err_msg != "" { ocsf.status_detail = err_msg }
      ocsf.severity_id = severity_id
      ocsf.severity = severity
      ocsf.type_uid = class_uid * 100 + to_int(ocsf.activity_id)
      ocsf.time = time_ms
      msg = string(p.message) ?? ""
      if msg == "" { msg = event_type }
      ocsf.message = msg
      ocsf.raw_data = raw_log

      evt_uid = string(p.id) ?? ""
      if evt_uid == "" { evt_uid = sha2("jumpcloud|raw|" + raw_log, variant: "SHA-256") }
      meta = {
          "version": "1.9.0",
          "uid": evt_uid,
          "event_code": event_type,
          "log_name": "Directory Insights",
          "log_provider": "JumpCloud",
          "product": { "name": "Directory Insights", "vendor_name": "JumpCloud" }
      }
      org = string(p.organization) ?? ""
      if org != "" { meta.tenant_uid = org }
      ocsf.metadata = meta

      . = ocsf
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # Values spill exactly as parsed: a parser never masks, redacts or withholds
  # anything (masking is an opt-in pipeline step, never a parser concern).
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # A source field is consumed ONLY by an explicit mapping: a field-coverage.yaml
  # `mappings` entry (source key -> target paths) or a `transforms` rule with a
  # target, whose value is found AT THAT TARGET PATH of the selected branch. A
  # value that merely appears somewhere else in the event never consumes a field
  # (no coincidental consumption); everything else spills.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The sets below are strings instead
  # (a read shares the buffer). __repr holds one member per mapped leaf:
  # "," + encode_json(path) + "=" + encode_json(encode_json(value)), plus the
  # to_string form for a string or a float, so a numeric string is represented by
  # its typed scalar. Every part is a JSON text, inside which a '"' is always
  # escaped, so a member is matched exactly. Paths drop array indices
  # (resources.0.uid is resources.uid); arrays are walked two levels deep, and a
  # leaf deeper than that is simply not mapping evidence (it can only spill more).
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped = object!(parse_json!(encode_json(__mapped)))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __copy = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __repr = ""
  for_each(flatten(__mapped)) -> |path, value| {
      __p = encode_json(path)
      if is_array(value) {
          for_each(array!(value)) -> |_i, item| {
              if is_object(item) {
                  for_each(flatten(object!(item))) -> |sub, leaf| {
                      __q = encode_json(path + "." + sub)
                      if is_array(leaf) {
                          for_each(array!(leaf)) -> |_j, x| {
                              if !is_object(x) && !is_array(x) {
                                  __repr = __repr + ("," + __q + "=" + encode_json(encode_json(x)))
                                  if is_string(x) || is_float(x) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(x))) }
                              }
                          }
                      } else {
                          __repr = __repr + ("," + __q + "=" + encode_json(encode_json(leaf)))
                          if is_string(leaf) || is_float(leaf) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(leaf))) }
                      }
                  }
              } else if !is_array(item) {
                  __repr = __repr + ("," + __p + "=" + encode_json(encode_json(item)))
                  if is_string(item) || is_float(item) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(item))) }
              }
          }
      } else {
          __repr = __repr + ("," + __p + "=" + encode_json(encode_json(value)))
          if is_string(value) || is_float(value) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(value))) }
      }
  }
  __consumed = ""
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__copy.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # BEGIN parser-specific transformations
  # timestamp: Successful ISO timestamp conversion to the selected event clock in milliseconds.
  # event_type: Parser lowercases the event type; consume only when the normalized value is emitted.
  for_each(__flat) -> |key, value| {
      if match(key, r'(?x)
      \A(?:
        timestamp
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%+", timezone: "UTC")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              # A clock the local-clock block moved to real UTC (the log source's
              # timezone, a year rollover) is matched by its converted value.
              if __lc_shifted != "" && !(contains(__repr, "," + "\"time\"" + "=" + encode_json(encode_json(__expected)))) {
                  __lc_at = find(__lc_shifted, "\n" + to_string(__expected) + "\t")
                  if is_integer(__lc_at) {
                      __lc_rest = slice!(__lc_shifted, int!(__lc_at) + strlen(to_string(__expected)) + 2)
                      __expected = to_int(slice!(__lc_rest, 0, int!(find(__lc_rest, "\n")))) ?? __expected
                  }
              }
              if contains(__repr, "," + "\"time\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        event_type
      )\z') {
          __value = value
          if is_string(__value) {
              __expected = downcase(string!(__value))
              if contains(__repr, "," + "\"metadata.event_code\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
  }
  # Declared source -> target mappings (field-coverage.yaml `mappings`).
  __decl = "\n\"client_ip\"\t[\"src_endpoint.ip\"]\n\"error_message\"\t[\"status_detail\"]\n\"event_type\"\t[\"api.operation\",\"message\",\"metadata.event_code\"]\n\"geoip.country_code\"\t[\"src_endpoint.location.country\"]\n\"geoip.region_name\"\t[\"src_endpoint.location.region\"]\n\"id\"\t[\"metadata.uid\"]\n\"mfa\"\t[\"is_mfa\"]\n\"organization\"\t[\"metadata.tenant_uid\"]\n\"service\"\t[\"api.service.name\"]\n\"username\"\t[\"user.name\"]\n\"initiated_by.email\"\t[\"actor.user.email_addr\",\"actor.user.name\",\"user.email_addr\",\"user.name\"]\n\"initiated_by.id\"\t[\"actor.user.uid\",\"user.uid\"]\n\"resource.email\"\t[\"user.email_addr\",\"user.name\"]\n\"resource.id\"\t[\"group.uid\",\"user.uid\"]\n\"resource.type\"\t[\"group.type\"]\n\"resource.username\"\t[\"user.name\"]\n\"geoip.latitude\"\t[\"src_endpoint.location.lat\"]\n\"geoip.longitude\"\t[\"src_endpoint.location.long\"]\n\"geoip.country_code2\"\t[\"src_endpoint.location.country\"]\n\"resource.name\"\t[\"group.name\",\"user.display_name\"]\n\"application.display_label\"\t[\"service.name\"]\n\"application.id\"\t[\"service.uid\"]\n\"initiated_by.username\"\t[\"user.name\"]\n\"message\"\t[\"message\"]\n\"src_ip\"\t[\"src_endpoint.ip\"]\n\"system.displayName\"\t[\"dst_endpoint.name\"]\n\"system.hostname\"\t[\"dst_endpoint.hostname\"]\n\"system.id\"\t[\"dst_endpoint.uid\"]\n\"resource.recipient_email\"\t[\"user.email_addr\"]\n"
  __preserve = []
  # END parser-specific transformations
  # Declared mappings: __decl holds "\n" + encode_json(key) + "\t" + JSON array of
  # target paths + "\n" per mapped source key (a raw newline never occurs in
  # compact JSON). A key is consumed when its value, or every element of a scalar
  # array, is at one of its own targets. Keys stay ESCAPED here and in __consumed:
  # a literal dotted key ("a~1b") and the nested path ("a.b") are different
  # fields, and mapping one never consumes the other.
  for_each(__flat) -> |key, value| {
      # __decl spells a bracket inside a key as a \u escape (deploy bracket count).
      __kt = encode_json(key)
      if match(__kt, r'[\x28\x29\x5B\x5D\x7B\x7D]') {
          __kt = replace(replace(replace(replace(replace(replace(__kt, r'\x28', "\\u0028"), r'\x29', "\\u0029"), r'\x5B', "\\u005b"), r'\x5D', "\\u005d"), r'\x7B', "\\u007b"), r'\x7D', "\\u007d")
      }
      __at = find(__decl, "\n" + __kt + "\t")
      if is_integer(__at) && !is_object(value) {
          __rest = slice!(__decl, int!(__at) + strlen(__kt) + 2)
          __hit = false
          for_each(array!(parse_json!(slice!(__rest, 0, int!(find(__rest, "\n")))))) -> |_i, target| {
              __tok = "," + encode_json(target) + "="
              if !__hit && is_array(value) {
                  __all = !is_empty(array!(value))
                  for_each(array!(value)) -> |_j, item| {
                      if __all {
                          __all = !is_object(item) && !is_array(item) && (contains(__repr, __tok + encode_json(encode_json(item))) || ((is_string(item) || is_float(item)) && contains(__repr, __tok + encode_json(to_string!(item)))))
                      }
                  }
                  __hit = __all
              } else if !__hit {
                  __hit = contains(__repr, __tok + encode_json(encode_json(value))) || ((is_string(value) || is_float(value)) && contains(__repr, __tok + encode_json(to_string!(value))))
              }
          }
          if __hit { __consumed = __consumed + ("," + encode_json(key)) }
      }
  }
  # Fast path: when no two source keys decode to the same key and no two spilled
  # keys get the same name, each key's decision depends only on its own value, so
  # one filter and one rename build the residual without copying it per key.
  __distinct = true
  if __tilde {
      __distinct = length(map_keys(__flat) -> |key| { replace(replace(key, "~1", "."), "~0", "~") }) == length(__flat)
  }
  __kept = {}
  __names = {}
  if __distinct {
      __kept = filter(__flat) -> |key, value| {
          # A key is kept unless an explicit mapping or transformation consumed it.
          # Do not spill a copy of the raw body.
          value != __raw_body && !contains(__consumed, "," + encode_json(key))
      }
      __names = map_keys(__kept) -> |key| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          join!(__parts, ".")
      }
  }
  __residual = {}
  if __distinct && length(__names) == length(__kept) {
      __residual = map_values(__names) -> |value| {
          if is_array(value) || is_object(value) {
              if __tilde {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              if __complex { value = encode_json(value) }
          }
          value
      }
  } else {
      # Slow path, in source key order: a name already taken gets the next free
      # _2, _3, ... suffix.
      for_each(__flat) -> |key, value| {
          __token = "," + encode_json(key)
          key = replace(replace(key, "~1", "."), "~0", "~")
          if is_array(value) || is_object(value) {
              value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                  replace(replace(inner, "~1", "."), "~0", "~")
              }, ["v"])
          }
          if !contains(__consumed, __token) && value != __raw_body {
              __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
              __base = join!(__parts, ".")
              __key = __base
              __suffix = 2
              if includes(keys(__residual), __key) {
                  for_each(__flat) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __key) {
                          __key = __base + "_" + to_string(__suffix)
                          __suffix = __suffix + 1
                      }
                  }
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              __spill = if __complex { encode_json(value) } else { value }
              __residual = set!(__residual, [__key], __spill)
          }
      }
  }
  # Names nano owns in unmapped (the parser markers and the reserved nano.*
  # namespace) are never taken by a source field: a vendor key with such a name
  # is kept, renamed source_<name>, so a log cannot forge a marker.
  if match(encode_json(keys(__residual)), r'"nano(?:"|\.|_time_assumed_tz"|_time_source"|_operational")') {
      for_each(object!(__residual)) -> |key, value| {
          if includes(["nano", "nano_time_assumed_tz", "nano_time_source", "nano_operational"], key) || starts_with(key, "nano.") {
              # source_<name>, or the next free _2, _3, ... when a vendor key
              # already holds that name: nothing is lost.
              __rk = "source_" + key
              __rn = 2
              if includes(keys(__residual), __rk) {
                  for_each(__residual) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __rk) {
                          __rk = "source_" + key + "_" + to_string(__rn)
                          __rn = __rn + 1
                      }
                  }
              }
              __residual = remove!(__residual, [key])
              __residual = set!(__residual, [__rk], value)
          }
      }
  }
  # Keep existing derived evidence, but remove null placeholders and copies of a
  # source value (that value is mapped or spilled above under its source path).
  # A value merely equal to some mapped attribute is kept: equality with an
  # unrelated attribute is no evidence that it is represented.
  # The canonical source spill above is the authoritative representation of
  # containers. The cheap conditions run first; the source value set is built on
  # first use.
  __original_values = null
  for_each(flatten(__existing)) -> |key, value| {
      if !is_null(value) && value != "" && !is_array(value) && !is_object(value) && value != __raw_body {
          # Members for the value itself and for to_string(value), as above.
          __json = encode_json(value)
          __as_json = "," + encode_json(__json)
          __as_string = __as_json
          if is_string(value) { __as_string = "," + __json } else if is_float(value) { __as_string = "," + encode_json(to_string!(value)) }
          if __original_values == null {
              # __source_kv may hold non-JSON types (a timestamp), so only an
              # integer or a boolean skips its to_string member here.
              __original_values = join!(map_values(values(flatten(__source_kv))) -> |source_value| {
                  __source_json = encode_json(source_value)
                  __tokens = "," + encode_json(__source_json)
                  if is_string(source_value) {
                      __tokens = __tokens + "," + __source_json
                  } else if !is_object(source_value) && !is_array(source_value) && !is_integer(source_value) && !is_boolean(source_value) {
                      __tokens = __tokens + "," + encode_json(to_string(source_value) ?? "")
                  }
                  __tokens
              }, "")
          }
          __source_set = string!(__original_values)
          __keep = !contains(__source_set, __as_json) && !contains(__source_set, __as_string)
          # Only text opening an object or an array (after JSON whitespace)
          # decodes to a container.
          if __keep && is_string(value) && match(string!(value), r'^[ \t\n\r]*[\x5B\x7B]') {
              __decoded, __decode_err = parse_json(string!(value))
              __keep = !(__decode_err == null && (is_object(__decoded) || is_array(__decoded)))
          }
          if __keep {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, as-is. These
  # entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__copy.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  if __time_assumed && !__time_inline { __residual = set!(__residual, ["nano_time_assumed_tz"], __src_tz_label) }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

