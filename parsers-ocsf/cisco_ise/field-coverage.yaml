source: text
transforms:
- source: fields.Calling-Station-ID
  kind: lowercase
  target: src_endpoint.mac
  reason: Endpoint MAC lowercased (dashes become colons) into src_endpoint.mac; a dashed MAC remains residual.
- source: fields.Calling-Station-ID
  kind: lowercase
  target: src_endpoint.uid
  reason: Endpoint MAC lowercased (dashes become colons) into src_endpoint.mac; a dashed MAC remains residual.
