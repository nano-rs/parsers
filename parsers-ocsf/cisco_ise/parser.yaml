name: cisco_ise_ocsf
display_name: Cisco ISE (OCSF)
version: "1.0.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses Cisco Identity Services Engine remote-logging syslog
  (CISE_<category> <msg id> <segments> <segment> <timestamp> <seq> <code>
  <severity> <class>: <text>, key=value, ...) into OCSF 1.9.0. Passed
  Authentications (52xx) and Failed Attempts (54xx) with a user become
  Authentication (3002) Logon, Success or Failure, with FailureReason as
  status_code / status_detail; RADIUS and TACACS+ are told apart by
  Protocol. The endpoint (Calling-Station-ID MAC, Framed-IP or
  Remote-Address) is src_endpoint and the network access device rides on
  src_endpoint.intermediate_ips; the ISE node is dst_endpoint. RADIUS
  Accounting Start / Stop / Interim become Authentication Logon / Logoff /
  Other with the accounting session id, and TACACS+ session accounting does
  the same. TACACS+ command accounting (CmdSet) becomes API Activity (6003)
  with the device command as api.operation, so admin commands on network
  gear are huntable. Posture reports with a PostureStatus become Compliance
  Finding (2003). Every other ISE message (diagnostics, system statistics,
  administrative audit, continuation segments of a split message) becomes
  Base Event (0) with the header and key=value body parsed; a line with no
  ISE header is a Base Event marked with unmapped.parse_fallback. ISE splits
  long messages into numbered segments; segments are parsed one at a time
  (nano does not reassemble them), so raise the ISE "maximum length" to
  8192 to keep a message in one segment.
match_values:
  - cisco_ise
category: security
vendor: "Cisco"
product: "Identity Services Engine"
parser_vrl: |
  # Cisco ISE -> OCSF 1.9.0 Authentication (3002) / API Activity (6003) /
  # Compliance Finding (2003) / Base Event (0)
  raw_log = if is_string(.message) { string!(.message) } else { encode_json(.) }
  __raw_body = raw_log
  __source_kv = {}

  time_ms = to_int(to_unix_timestamp(now(), unit: "milliseconds"))
  parsed = false
  host = ""
  cat = ""
  code = 0
  sev_word = ""
  text = ""
  kv = ""
  segment = 0

  hm, he = parse_regex(raw_log, r'^(?:<(?P<pri>\d{1,3})>)?(?P<ts>[A-Z][a-z]{2}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2})\s+(?P<host>\S+)\s+(?P<category>CISE_\S+)\s+(?P<msg_id>\d+)\s+(?P<total>\d+)\s+(?P<segment>\d+)\s+(?P<rest>.*)$')
  if he == null {
      parsed = true
      hdr = { "ts": hm.ts, "host": hm.host, "category": hm.category, "msg_id": hm.msg_id, "total_segments": hm.total, "segment": hm.segment }
      if hm.pri != null { hdr.pri = hm.pri }
      host = string!(hm.host)
      cat = string!(hm.category)
      segment = to_int(hm.segment) ?? 0
      rest = string!(hm.rest)
      bm, be = parse_regex(rest, r'^(?P<date>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}(?:\.\d+)?)\s+(?P<tz>[+-]\d{2}:?\d{2})\s+(?P<seq>\d+)\s+(?P<code>\d+)\s+(?P<severity>[A-Z]+)\s+(?P<class>[^:,]+):\s*(?P<text>[^,]*),?\s*(?P<kv>.*)$')
      if be == null {
          hdr.date = bm.date
          hdr.tz = bm.tz
          hdr.sequence = bm.seq
          hdr.code = bm.code
          hdr.severity = bm.severity
          hdr.class = bm.class
          hdr.text = bm.text
          code = to_int(bm.code) ?? 0
          sev_word = string!(bm.severity)
          text = string!(bm.text)
          kv = string!(bm.kv)
          t, te = parse_timestamp(string!(bm.date) + " " + string!(bm.tz), "%Y-%m-%d %H:%M:%S%.f %:z", timezone: "UTC")
          if te == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
      } else {
          # a continuation segment carries only key=value pairs
          kv = rest
      }
      __source_kv.header = hdr
  }

  # ---- key=value body: split on ", " only where a new key starts ----
  cmd = ""
  cm, ce = parse_regex(kv, r'CmdSet=\x5B(?P<set>[^\x5D]*)\x5D')
  if ce == null {
      # "CmdAV=show CmdArgAV=running-config <cr>": the command word and its
      # arguments arrive as separate AV tokens; keep only their values.
      cmd = replace(string!(cm.set), r'Cmd(?:Arg)?AV=', "")
      cmd = replace(cmd, "<cr>", "")
      cmd = strip_whitespace(replace(cmd, r'\s+', " "))
      if cmd != "" { __source_kv.cmd = cmd }
      # Remove the set with exactly one neighbouring ", " so no empty field is left behind.
      kv = replace(kv, r'(?:,\s*)?CmdSet=\x5B[^\x5D]*\x5D', "")
      kv = replace(kv, r'^\s*,\s*', "")
  }
  f = {}
  last = ""
  for_each(split(kv, ", ")) -> |_i, piece| {
      pm, pe = parse_regex(piece, r'^\s*(?P<k>[A-Za-z][A-Za-z0-9 _.:-]{0,63})=(?P<v>.*)$')
      # An empty trailing piece carries nothing; never glue ", " onto the last value.
      blank = strip_whitespace(replace(piece, r',\s*$', "")) == ""
      if !blank && pe == null {
          k = string!(pm.k)
          v = replace(string!(pm.v), r',\s*$', "")
          prev = get(f, [k]) ?? null
          if prev == null {
              f = set!(f, [k], v)
          } else if is_array(prev) {
              f = set!(f, [k], push(array!(prev), v))
          } else {
              f = set!(f, [k], [prev, v])
          }
          last = k
      } else if !blank && last != "" {
          prev = get(f, [last]) ?? ""
          if is_string(prev) { f = set!(f, [last], string!(prev) + ", " + replace(piece, r',\s*$', "")) }
      }
  }
  if length(f) > 0 { __source_kv.fields = f }

  # ---- severity ----
  severity_id = 1
  severity = "Informational"
  if sev_word == "WARN" || sev_word == "WARNING" { severity_id = 3; severity = "Medium" }
  if sev_word == "ERROR" { severity_id = 4; severity = "High" }
  if sev_word == "FATAL" { severity_id = 6; severity = "Fatal" }

  # ---- common entities ----
  fv = f
  user_name = string(fv.UserName) ?? string(fv."User-Name") ?? string(fv.User) ?? ""
  mac_re = r'^(?:[0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}$'
  csid = string(fv."Calling-Station-ID") ?? ""
  src = {}
  if match(csid, mac_re) { src.mac = downcase(replace(csid, "-", ":")) }
  cip = string(fv."Framed-IP-Address") ?? string(fv."Remote-Address") ?? ""
  if cip == "" && (is_ipv4(csid) || is_ipv6(csid)) { cip = csid }
  if is_ipv4(cip) || is_ipv6(cip) { src.ip = cip }
  nad_ip = string(fv."Device IP Address") ?? string(fv."NAS-IP-Address") ?? ""
  if !is_ipv4(nad_ip) && !is_ipv6(nad_ip) { nad_ip = "" }
  if nad_ip != "" && nad_ip != cip { src.intermediate_ips = [nad_ip] }
  if !exists(src.ip) && exists(src.mac) { src.uid = src.mac }
  if !exists(src.ip) && !exists(src.uid) && nad_ip != "" { src.ip = nad_ip; __d = del(src.intermediate_ips) }
  dst = {}
  dip = string(fv.DestinationIPAddress) ?? ""
  if is_ipv4(dip) || is_ipv6(dip) { dst.ip = dip }
  dport = to_int(string(fv.DestinationPort) ?? "0") ?? 0
  if dport > 0 { dst.port = dport }
  if host != "" { dst.hostname = host }
  protocol = downcase(string(fv.Protocol) ?? "")
  if cat == "CISE_TACACS_Accounting" { protocol = "tacacs" }
  if cat == "CISE_RADIUS_Accounting" { protocol = "radius" }
  session = {}
  sid = string(fv."Acct-Session-Id") ?? string(fv.CPMSessionID) ?? string(fv.SessionId) ?? ""
  if sid != "" { session.uid = sid }
  acs = string(fv.AcsSessionID) ?? ""
  if acs != "" { session.uid_alt = acs }

  # ---- route ----
  route = "base"
  activity_id = 99
  activity_name = "Other"
  status_id = 0
  status_str = "Unknown"
  if parsed && segment == 0 {
      if (cat == "CISE_Passed_Authentications" || cat == "CISE_Failed_Attempts") && user_name != "" {
          route = "auth"
          activity_id = 1; activity_name = "Logon"
          if cat == "CISE_Failed_Attempts" || (code >= 5400 && code < 5500) {
              status_id = 2; status_str = "Failure"
              if severity_id < 2 { severity_id = 2; severity = "Low" }
          } else {
              status_id = 1; status_str = "Success"
          }
      } else if cat == "CISE_RADIUS_Accounting" && user_name != "" {
          route = "auth"
          ast = downcase(string(fv."Acct-Status-Type") ?? "")
          status_id = 1; status_str = "Success"
          if ast == "start" { activity_id = 1; activity_name = "Logon" }
          if ast == "stop" { activity_id = 2; activity_name = "Logoff" }
      } else if cat == "CISE_TACACS_Accounting" && cmd != "" {
          route = "api"
          status_id = 1; status_str = "Success"
          if match(cmd, r'^(?:show|sh|ping|traceroute|dir|more)\b') { activity_id = 2; activity_name = "Read" }
      } else if cat == "CISE_TACACS_Accounting" && user_name != "" {
          route = "auth"
          flags = downcase(string(fv."AcctRequest-Flags") ?? "")
          status_id = 1; status_str = "Success"
          if flags == "start" || code == 3301 { activity_id = 1; activity_name = "Logon" }
          if flags == "stop" || code == 3302 { activity_id = 2; activity_name = "Logoff" }
      } else if exists(fv.PostureStatus) {
          route = "posture"
      }
  }

  metadata = {
      "version": "1.9.0",
      "uid": sha2("cisco_ise|raw|" + raw_log, variant: "SHA-256"),
      "profiles": ["host", "security_control"],
      "log_name": "cisco_ise",
      "product": { "name": "Identity Services Engine", "vendor_name": "Cisco" }
  }
  if cat != "" { metadata.log_provider = cat }
  if code > 0 { metadata.event_code = to_string(code) }
  if sev_word != "" { metadata.log_level = sev_word }

  if route == "auth" {
      . = {
          "class_uid": 3002, "class_name": "Authentication",
          "category_uid": 3, "category_name": "Identity & Access Management",
          "activity_id": activity_id, "activity_name": activity_name,
          "type_uid": 300200 + activity_id,
          "severity_id": severity_id, "severity": severity,
          "status_id": status_id, "status": status_str,
          "time": time_ms,
          "raw_data": raw_log,
          "metadata": metadata,
          "user": { "name": user_name },
          "is_remote": true
      }
      if text != "" { .message = text }
      if status_id == 1 {
          .action_id = 1; .action = "Allowed"; .disposition_id = 1; .disposition = "Allowed"
      } else if status_id == 2 {
          .action_id = 2; .action = "Denied"; .disposition_id = 2; .disposition = "Blocked"
      }
      if protocol == "radius" {
          .auth_protocol_id = 10; .auth_protocol = "RADIUS"
          .logon_type_id = 3; .logon_type = "Network"
      } else if protocol == "tacacs" {
          .auth_protocol_id = 99; .auth_protocol = "TACACS+"
          .logon_type_id = 10; .logon_type = "Remote Interactive"
      }
      fr = string(fv.FailureReason) ?? ""
      if fr != "" {
          .status_detail = fr
          frm, fre = parse_regex(fr, r'^(?P<c>\d+)\s')
          if fre == null { .status_code = frm.c }
      }
      if length(src) > 0 { .src_endpoint = src }
      if length(dst) > 0 { .dst_endpoint = dst }
      if length(session) > 0 { .session = session }
      svc = string(fv.SelectedAccessService) ?? ""
      if svc != "" { .service = { "name": svc } }
      pol = string(fv.AuthorizationPolicyMatchedRule) ?? ""
      if pol != "" { .policy = { "name": pol } }
  } else if route == "api" {
      actor_name = if user_name != "" { user_name } else { "unknown" }
      . = {
          "class_uid": 6003, "class_name": "API Activity",
          "category_uid": 6, "category_name": "Application Activity",
          "activity_id": activity_id, "activity_name": activity_name,
          "type_uid": 600300 + activity_id,
          "severity_id": severity_id, "severity": severity,
          "status_id": status_id, "status": status_str,
          "time": time_ms,
          "raw_data": raw_log,
          "metadata": metadata,
          "actor": { "user": { "name": actor_name } },
          "api": { "operation": cmd, "service": { "name": "TACACS+ command accounting" } }
      }
      if text != "" { .message = text }
      asrc = {}
      ra = string(fv."Remote-Address") ?? ""
      if is_ipv4(ra) || is_ipv6(ra) { asrc.ip = ra } else { asrc.name = "unknown" }
      .src_endpoint = asrc
      adst = {}
      if nad_ip != "" { adst.ip = nad_ip }
      ndn = string(fv.NetworkDeviceName) ?? ""
      if ndn != "" { adst.name = ndn; adst.hostname = ndn }
      if length(adst) > 0 { .dst_endpoint = adst }
      if length(session) > 0 { .actor.session = session }
  } else if route == "posture" {
      ps = string(fv.PostureStatus) ?? ""
      cstat = 0
      if downcase(ps) == "compliant" { cstat = 1 }
      if downcase(ps) == "noncompliant" { cstat = 3; if severity_id < 3 { severity_id = 3; severity = "Medium" } }
      comp = { "status": ps, "status_id": cstat }
      ppm = string(fv.PosturePolicyMatched) ?? ""
      if ppm != "" { comp.control = ppm }
      dev = { "type_id": 0, "type": "Unknown" }
      pmac = string(fv.MacAddress) ?? ""
      if match(pmac, mac_re) { dev.mac = downcase(replace(pmac, "-", ":")) }
      pip = string(fv.IpAddress) ?? ""
      if is_ipv4(pip) || is_ipv6(pip) { dev.ip = pip }
      sname = string(fv.SystemName) ?? ""
      if sname != "" { dev.hostname = sname }
      if !exists(dev.ip) && !exists(dev.hostname) && exists(dev.mac) { dev.uid = dev.mac }
      . = {
          "class_uid": 2003, "class_name": "Compliance Finding",
          "category_uid": 2, "category_name": "Findings",
          "activity_id": 1, "activity_name": "Create",
          "type_uid": 200301,
          "severity_id": severity_id, "severity": severity,
          "status_id": 1, "status": "New",
          "time": time_ms,
          "raw_data": raw_log,
          "metadata": metadata,
          "compliance": comp,
          "finding_info": { "uid": metadata.uid, "title": "Endpoint posture " + ps }
      }
      if text != "" { .message = text }
      if exists(dev.ip) || exists(dev.hostname) || exists(dev.uid) { .device = dev }
      if user_name != "" { .actor = { "user": { "name": user_name } } }
  } else {
      . = {
          "class_uid": 0, "class_name": "Base Event",
          "category_uid": 0, "category_name": "Uncategorized",
          "activity_id": 99, "activity_name": "Other",
          "type_uid": 99,
          "severity_id": severity_id, "severity": severity,
          "status_id": 0, "status": "Unknown",
          "time": time_ms,
          "raw_data": raw_log,
          "metadata": metadata
      }
      if text != "" { .message = text }
      if !parsed { . = set!(., ["unmapped", "parse_fallback"], "unparsable input") }
  }
  if parsed && route != "base" && host != "" && route != "posture" {
      .device = { "hostname": host, "type_id": 1, "type": "Server" }
  }

  .

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # Values spill exactly as parsed: a parser never masks, redacts or withholds
  # anything (masking is an opt-in pipeline step, never a parser concern).
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # A source field is consumed ONLY by an explicit mapping: a field-coverage.yaml
  # `mappings` entry (source key -> target paths) or a `transforms` rule with a
  # target, whose value is found AT THAT TARGET PATH of the selected branch. A
  # value that merely appears somewhere else in the event never consumes a field
  # (no coincidental consumption); everything else spills.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The sets below are strings instead
  # (a read shares the buffer). __repr holds one member per mapped leaf:
  # "," + encode_json(path) + "=" + encode_json(encode_json(value)), plus the
  # to_string form for a string or a float, so a numeric string is represented by
  # its typed scalar. Every part is a JSON text, inside which a '"' is always
  # escaped, so a member is matched exactly. Paths drop array indices
  # (resources.0.uid is resources.uid); arrays are walked two levels deep, and a
  # leaf deeper than that is simply not mapping evidence (it can only spill more).
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped = object!(parse_json!(encode_json(__mapped)))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __copy = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __repr = ""
  for_each(flatten(__mapped)) -> |path, value| {
      __p = encode_json(path)
      if is_array(value) {
          for_each(array!(value)) -> |_i, item| {
              if is_object(item) {
                  for_each(flatten(object!(item))) -> |sub, leaf| {
                      __q = encode_json(path + "." + sub)
                      if is_array(leaf) {
                          for_each(array!(leaf)) -> |_j, x| {
                              if !is_object(x) && !is_array(x) {
                                  __repr = __repr + ("," + __q + "=" + encode_json(encode_json(x)))
                                  if is_string(x) || is_float(x) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(x))) }
                              }
                          }
                      } else {
                          __repr = __repr + ("," + __q + "=" + encode_json(encode_json(leaf)))
                          if is_string(leaf) || is_float(leaf) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(leaf))) }
                      }
                  }
              } else if !is_array(item) {
                  __repr = __repr + ("," + __p + "=" + encode_json(encode_json(item)))
                  if is_string(item) || is_float(item) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(item))) }
              }
          }
      } else {
          __repr = __repr + ("," + __p + "=" + encode_json(encode_json(value)))
          if is_string(value) || is_float(value) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(value))) }
      }
  }
  __consumed = ""
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__copy.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # BEGIN parser-specific transformations
  # fields.Calling-Station-ID: Endpoint MAC lowercased (dashes become colons) into src_endpoint.mac; a dashed MAC remains residual.
  # fields.Calling-Station-ID: Endpoint MAC lowercased (dashes become colons) into src_endpoint.mac; a dashed MAC remains residual.
  for_each(__flat) -> |key, value| {
      if match(key, r'(?x)
      \A(?:
        fields\.Calling\-Station\-ID
      )\z') {
          __value = value
          if is_string(__value) {
              __expected = downcase(string!(__value))
              if contains(__repr, "," + "\"src_endpoint.mac\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        fields\.Calling\-Station\-ID
      )\z') {
          __value = value
          if is_string(__value) {
              __expected = downcase(string!(__value))
              if contains(__repr, "," + "\"src_endpoint.uid\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
  }
  # Declared source -> target mappings (field-coverage.yaml `mappings`).
  __decl = "\n\"header.host\"\t[\"device.hostname\",\"dst_endpoint.hostname\"]\n\"header.category\"\t[\"metadata.log_provider\"]\n\"header.code\"\t[\"metadata.event_code\"]\n\"header.severity\"\t[\"metadata.log_level\"]\n\"header.text\"\t[\"message\"]\n\"cmd\"\t[\"api.operation\"]\n\"fields.UserName\"\t[\"actor.user.name\",\"user.name\"]\n\"fields.User-Name\"\t[\"user.name\"]\n\"fields.User\"\t[\"actor.user.name\",\"user.name\"]\n\"fields.Calling-Station-ID\"\t[\"src_endpoint.mac\",\"src_endpoint.uid\"]\n\"fields.Framed-IP-Address\"\t[\"src_endpoint.ip\"]\n\"fields.Remote-Address\"\t[\"src_endpoint.ip\"]\n\"fields.Device IP Address\"\t[\"dst_endpoint.ip\",\"src_endpoint.intermediate_ips\"]\n\"fields.DestinationIPAddress\"\t[\"dst_endpoint.ip\"]\n\"fields.DestinationPort\"\t[\"dst_endpoint.port\"]\n\"fields.Acct-Session-Id\"\t[\"session.uid\"]\n\"fields.CPMSessionID\"\t[\"session.uid\"]\n\"fields.AcsSessionID\"\t[\"actor.session.uid_alt\",\"session.uid_alt\"]\n\"fields.FailureReason\"\t[\"status_detail\"]\n\"fields.SelectedAccessService\"\t[\"service.name\"]\n\"fields.AuthorizationPolicyMatchedRule\"\t[\"policy.name\"]\n\"fields.NetworkDeviceName\"\t[\"dst_endpoint.hostname\",\"dst_endpoint.name\"]\n\"fields.PostureStatus\"\t[\"compliance.status\"]\n\"fields.PosturePolicyMatched\"\t[\"compliance.control\"]\n\"fields.IpAddress\"\t[\"device.ip\"]\n\"fields.SystemName\"\t[\"device.hostname\"]\n"
  __preserve = []
  # END parser-specific transformations
  # Declared mappings: __decl holds "\n" + encode_json(key) + "\t" + JSON array of
  # target paths + "\n" per mapped source key (a raw newline never occurs in
  # compact JSON). A key is consumed when its value, or every element of a scalar
  # array, is at one of its own targets. Keys stay ESCAPED here and in __consumed:
  # a literal dotted key ("a~1b") and the nested path ("a.b") are different
  # fields, and mapping one never consumes the other.
  for_each(__flat) -> |key, value| {
      # __decl spells a bracket inside a key as a \u escape (deploy bracket count).
      __kt = encode_json(key)
      if match(__kt, r'[\x28\x29\x5B\x5D\x7B\x7D]') {
          __kt = replace(replace(replace(replace(replace(replace(__kt, r'\x28', "\\u0028"), r'\x29', "\\u0029"), r'\x5B', "\\u005b"), r'\x5D', "\\u005d"), r'\x7B', "\\u007b"), r'\x7D', "\\u007d")
      }
      __at = find(__decl, "\n" + __kt + "\t")
      if is_integer(__at) && !is_object(value) {
          __rest = slice!(__decl, int!(__at) + strlen(__kt) + 2)
          __hit = false
          for_each(array!(parse_json!(slice!(__rest, 0, int!(find(__rest, "\n")))))) -> |_i, target| {
              __tok = "," + encode_json(target) + "="
              if !__hit && is_array(value) {
                  __all = !is_empty(array!(value))
                  for_each(array!(value)) -> |_j, item| {
                      if __all {
                          __all = !is_object(item) && !is_array(item) && (contains(__repr, __tok + encode_json(encode_json(item))) || ((is_string(item) || is_float(item)) && contains(__repr, __tok + encode_json(to_string!(item)))))
                      }
                  }
                  __hit = __all
              } else if !__hit {
                  __hit = contains(__repr, __tok + encode_json(encode_json(value))) || ((is_string(value) || is_float(value)) && contains(__repr, __tok + encode_json(to_string!(value))))
              }
          }
          if __hit { __consumed = __consumed + ("," + encode_json(key)) }
      }
  }
  # Fast path: when no two source keys decode to the same key and no two spilled
  # keys get the same name, each key's decision depends only on its own value, so
  # one filter and one rename build the residual without copying it per key.
  __distinct = true
  if __tilde {
      __distinct = length(map_keys(__flat) -> |key| { replace(replace(key, "~1", "."), "~0", "~") }) == length(__flat)
  }
  __kept = {}
  __names = {}
  if __distinct {
      __kept = filter(__flat) -> |key, value| {
          # A key is kept unless an explicit mapping or transformation consumed it.
          # Do not spill a copy of the raw body.
          value != __raw_body && !contains(__consumed, "," + encode_json(key))
      }
      __names = map_keys(__kept) -> |key| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          join!(__parts, ".")
      }
  }
  __residual = {}
  if __distinct && length(__names) == length(__kept) {
      __residual = map_values(__names) -> |value| {
          if is_array(value) || is_object(value) {
              if __tilde {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              if __complex { value = encode_json(value) }
          }
          value
      }
  } else {
      # Slow path, in source key order: a name already taken gets the next free
      # _2, _3, ... suffix.
      for_each(__flat) -> |key, value| {
          __token = "," + encode_json(key)
          key = replace(replace(key, "~1", "."), "~0", "~")
          if is_array(value) || is_object(value) {
              value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                  replace(replace(inner, "~1", "."), "~0", "~")
              }, ["v"])
          }
          if !contains(__consumed, __token) && value != __raw_body {
              __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
              __base = join!(__parts, ".")
              __key = __base
              __suffix = 2
              if includes(keys(__residual), __key) {
                  for_each(__flat) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __key) {
                          __key = __base + "_" + to_string(__suffix)
                          __suffix = __suffix + 1
                      }
                  }
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              __spill = if __complex { encode_json(value) } else { value }
              __residual = set!(__residual, [__key], __spill)
          }
      }
  }
  # Keep existing derived evidence, but remove null placeholders and copies of a
  # source value (that value is mapped or spilled above under its source path).
  # A value merely equal to some mapped attribute is kept: equality with an
  # unrelated attribute is no evidence that it is represented.
  # The canonical source spill above is the authoritative representation of
  # containers. The cheap conditions run first; the source value set is built on
  # first use.
  __original_values = null
  for_each(flatten(__existing)) -> |key, value| {
      if !is_null(value) && value != "" && !is_array(value) && !is_object(value) && value != __raw_body {
          # Members for the value itself and for to_string(value), as above.
          __json = encode_json(value)
          __as_json = "," + encode_json(__json)
          __as_string = __as_json
          if is_string(value) { __as_string = "," + __json } else if is_float(value) { __as_string = "," + encode_json(to_string!(value)) }
          if __original_values == null {
              # __source_kv may hold non-JSON types (a timestamp), so only an
              # integer or a boolean skips its to_string member here.
              __original_values = join!(map_values(values(flatten(__source_kv))) -> |source_value| {
                  __source_json = encode_json(source_value)
                  __tokens = "," + encode_json(__source_json)
                  if is_string(source_value) {
                      __tokens = __tokens + "," + __source_json
                  } else if !is_object(source_value) && !is_array(source_value) && !is_integer(source_value) && !is_boolean(source_value) {
                      __tokens = __tokens + "," + encode_json(to_string(source_value) ?? "")
                  }
                  __tokens
              }, "")
          }
          __source_set = string!(__original_values)
          __keep = !contains(__source_set, __as_json) && !contains(__source_set, __as_string)
          # Only text opening an object or an array (after JSON whitespace)
          # decodes to a container.
          if __keep && is_string(value) && match(string!(value), r'^[ \t\n\r]*[\x5B\x7B]') {
              __decoded, __decode_err = parse_json(string!(value))
              __keep = !(__decode_err == null && (is_object(__decoded) || is_array(__decoded)))
          }
          if __keep {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, as-is. These
  # entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__copy.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

