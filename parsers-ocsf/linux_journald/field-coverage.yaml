source: json
transforms:
- source: __REALTIME_TIMESTAMP
  kind: scale
  factor: 0.001
  target: time
  reason: Existing unit conversion by 0.001 verified against time; unused clock fallbacks remain residual.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  MESSAGE:
  - message
  MESSAGE_ID:
  - metadata.event_code
  SYSLOG_IDENTIFIER:
  - actor.process.file.name
  - actor.process.name
  - metadata.log_name
  _AUDIT_SESSION:
  - session.uid
  _EXE:
  - actor.process.file.path
  _HOSTNAME:
  - device.hostname
  - dst_endpoint.hostname
  _MACHINE_ID:
  - device.uid
  _PID:
  - actor.process.pid
  _TRANSPORT:
  - metadata.source
  _UID:
  - actor.user.uid
