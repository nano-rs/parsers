source: json
transforms:
- source: __REALTIME_TIMESTAMP
  kind: scale
  factor: 0.001
  target: time
  reason: Existing unit conversion by 0.001 verified against time; unused clock fallbacks
    remain residual.
consumed_candidates:
- MESSAGE
- MESSAGE_ID
- PRIORITY
- SYSLOG_IDENTIFIER
- SYSLOG_PID
- _AUDIT_SESSION
- _BOOT_ID
- _CMDLINE
- _COMM
- _EXE
- _HOSTNAME
- _MACHINE_ID
- _PID
- _SYSTEMD_UNIT
- _TRANSPORT
- _UID
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
