name: netskope_ocsf
display_name: Netskope (OCSF)
version: "1.1.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields in redacted, dotted snake_case unmapped keys.
  Parses Netskope CASB/SSE Data Export records into OCSF 1.9.0, routed by
  `record_type` (with `type` and field-sniffing as fallbacks):
    * alert / incident, or any record Netskope escalated (alert="yes")
                              -> Detection Finding (class_uid 2004)
    * page                    -> HTTP Activity     (class_uid 4002)
    * application / audit     -> API Activity      (class_uid 6003)
    * network / connection    -> Network Activity  (class_uid 4001)
    * infrastructure / endpoint / unknown
                              -> Base Event        (class_uid 0)
  Netskope names bytes from the client's point of view, so client_bytes is
  traffic.bytes_in (client -> server) and server_bytes is traffic.bytes_out.
  Mirrors the UDM netskope parser (../parsers/parsers/netskope/parser.yaml).
match_values:
  - netskope
  - netskope_events
  - netskope_alert
  - netskope_application
  - netskope_network
  - netskope_audit
  - netskope_page
  - netskope_connection
  - netskope_incident
  - netskope_infrastructure
  - netskope_endpoint
category: security
vendor: "Netskope"
product: "SSE"
parser_vrl: |
  # Netskope SSE -> OCSF 1.9.0 (multi-class)
  raw_log = string!(.message)
  __raw_body = raw_log
  __source_kv = {}
  ip_re = r'^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$|^[0-9A-Fa-f:]{3,}$'

  p, perr = parse_json(raw_log)
  __source_kv = object(p) ?? {}
  ok = perr == null && is_object(p)
  e = {}
  if ok { e = object!(p) }

  # ---- event class -------------------------------------------------------
  record_type = downcase(to_string(e.record_type) ?? "")
  if record_type == "" { record_type = downcase(to_string(e.type) ?? "") }
  if record_type == "" {
      if exists(e.alert_type) || exists(e.alert_name) { record_type = "alert" } else if exists(e.audit_log_event) { record_type = "audit" } else if exists(e.activity) || exists(e.app) { record_type = "application" } else { record_type = "unknown" }
  }
  is_alert = record_type == "alert" || record_type == "incident"
  if downcase(to_string(e.alert) ?? "") == "yes" { is_alert = true }

  # ---- time (epoch seconds) ---------------------------------------------
  time_ms = 0
  ts_sec = to_int(e.timestamp) ?? 0
  if ts_sec > 0 { time_ms = ts_sec * 1000 }

  # ---- action -> security-control action/disposition --------------------
  raw_action = downcase(to_string(e.action) ?? "")
  action_id = 0
  action_name = "Unknown"
  disposition_id = 0
  disposition_name = "Unknown"
  blocked = false
  if raw_action == "block" || raw_action == "deny" {
      action_id = 2; action_name = "Denied"
      disposition_id = 2; disposition_name = "Blocked"
      blocked = true
  } else if raw_action == "quarantine" {
      action_id = 2; action_name = "Denied"
      disposition_id = 5; disposition_name = "Quarantined"
      blocked = true
  } else if raw_action == "allow" || raw_action == "bypass" {
      action_id = 1; action_name = "Allowed"
      disposition_id = 1; disposition_name = "Allowed"
  } else if raw_action != "" {
      action_id = 99; action_name = raw_action
  }

  # ---- severity ----------------------------------------------------------
  sev_raw = downcase(to_string(e.severity) ?? "")
  if sev_raw == "" { sev_raw = downcase(to_string(e.dlp_rule_severity) ?? "") }
  if sev_raw == "" { sev_raw = downcase(to_string(e.risk_level) ?? "") }
  severity_id = 1
  severity = "Informational"
  if contains(sev_raw, "critical") { severity_id = 5; severity = "Critical" } else if contains(sev_raw, "high") { severity_id = 4; severity = "High" } else if contains(sev_raw, "medium") { severity_id = 3; severity = "Medium" } else if contains(sev_raw, "low") { severity_id = 2; severity = "Low" }
  if is_alert && severity_id < 3 { severity_id = 3; severity = "Medium" }

  user_name = to_string(e.user) ?? ""
  app_name = to_string(e.app) ?? ""
  activity_verb = to_string(e.activity) ?? ""
  url_str = to_string(e.url) ?? ""
  domain = downcase(to_string(e.domain) ?? "")
  if domain == "" && url_str != "" {
      pu, puerr = parse_url(url_str)
      if puerr == null { domain = downcase(to_string(pu.host)) }
  }

  src_endpoint = {}
  sip = to_string(e.srcip) ?? ""
  if sip == "" { sip = to_string(e.userip) ?? "" }
  if match(sip, ip_re) { src_endpoint.ip = sip }
  shost = downcase(to_string(e.hostname) ?? "")
  if shost != "" { src_endpoint.hostname = shost }
  sport = to_int(e.srcport) ?? 0
  if sport != 0 { src_endpoint.port = sport }
  sctry = to_string(e.src_country) ?? ""
  if sctry != "" { src_endpoint.location = { "country": upcase(sctry) } }

  dst_endpoint = {}
  dip = to_string(e.dstip) ?? ""
  if match(dip, ip_re) { dst_endpoint.ip = dip }
  dhost = downcase(to_string(e.dsthost) ?? "")
  if dhost == "" { dhost = domain }
  if dhost != "" { dst_endpoint.hostname = dhost }
  dport = to_int(e.dstport) ?? 0
  if dport != 0 { dst_endpoint.port = dport }
  dctry = to_string(e.dst_country) ?? ""
  if dctry != "" { dst_endpoint.location = { "country": upcase(dctry) } }

  has_src = exists(src_endpoint.ip) || exists(src_endpoint.hostname)
  has_dst = exists(dst_endpoint.ip) || exists(dst_endpoint.hostname)

  bytes_in = to_int(e.client_bytes) ?? 0
  bytes_out = to_int(e.server_bytes) ?? 0

  metadata = {
      "version": "1.9.0",
      "uid": uuid_v4(),
      "profiles": ["host", "security_control"],
      "log_name": "netskope-" + record_type,
      "product": { "name": "SSE", "vendor_name": "Netskope" }
  }
  nsid = to_string(e._id) ?? ""
  if nsid != "" { metadata.original_event_uid = nsid }
  txid = to_string(e.transaction_id) ?? ""
  if txid != "" { metadata.correlation_uid = txid }

  unmapped = {}
  for_each(["access_method", "traffic_type", "appcategory", "ccl", "instance_name", "instance_id", "organization_unit", "device", "device_classification", "os", "os_version", "browser", "browser_version", "object_type", "dlp_profile", "dlp_rule", "dlp_incident_id", "site", "page", "from_user", "to_user", "connection_id", "detection_engine", "malware_type", "policy", "alert_type", "audit_log_event", "audit_type"]) -> |_i, k| {
      v = to_string(get(e, [k]) ?? "") ?? ""
      if v != "" { unmapped = set!(unmapped, [k], v) }
  }
  if activity_verb != "" { unmapped.activity = activity_verb }
  if raw_action != "" { unmapped.action = raw_action }
  cci = to_int(e.cci) ?? -1
  if cci >= 0 { unmapped.cci = cci }

  file_obj = {}
  fname = to_string(e.object) ?? ""
  otype = downcase(to_string(e.object_type) ?? "")
  if fname != "" && (otype == "file" || otype == "") { file_obj.name = fname }
  fpath = to_string(e.file_path) ?? ""
  if fpath != "" { file_obj.path = fpath }
  fsha = downcase(to_string(e.sha256) ?? "")
  fmd5 = downcase(to_string(e.md5) ?? "")
  hashes = []
  if fsha != "" { hashes = push(hashes, { "algorithm_id": 3, "algorithm": "SHA-256", "value": fsha }) }
  if fmd5 != "" { hashes = push(hashes, { "algorithm_id": 1, "algorithm": "MD5", "value": fmd5 }) }
  if length(hashes) > 0 { file_obj.hashes = hashes }
  if length(file_obj) > 0 { file_obj.type_id = 1 }

  if ok && is_alert {
      # =================== Detection Finding (2004) ===================
      finding_uid = to_string(e.alert_id) ?? ""
      if finding_uid == "" { finding_uid = to_string(e.dlp_incident_id) ?? "" }
      if finding_uid == "" { finding_uid = nsid }
      if finding_uid == "" { finding_uid = uuid_v4() }

      title = to_string(e.alert_name) ?? ""
      if title == "" { title = to_string(e.malware_name) ?? "" }
      if title == "" { title = to_string(e.dlp_rule) ?? "" }
      if title == "" { title = "Netskope alert" }

      finding_info = { "uid": finding_uid, "title": title }
      atype = to_string(e.alert_type) ?? ""
      if atype != "" { finding_info.types = [atype] }
      engine = to_string(e.detection_engine) ?? ""
      if engine == "" { engine = to_string(e.dlp_profile) ?? "" }
      if engine != "" { finding_info.analytic = { "name": engine, "type_id": 1, "type": "Rule" } }
      finding_info.data_sources = ["netskope"]

      . = {
          "class_uid": 2004,
          "class_name": "Detection Finding",
          "category_uid": 2,
          "category_name": "Findings",
          "activity_id": 1,
          "activity_name": "Create",
          "type_uid": 200401,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": 1,
          "status": "New",
          "action_id": action_id,
          "action": action_name,
          "disposition_id": disposition_id,
          "disposition": disposition_name,
          "is_alert": true,
          "time": time_ms,
          "raw_data": raw_log,
          "metadata": metadata,
          "finding_info": finding_info
      }
      ev = {}
      if length(file_obj) > 0 { ev.file = file_obj }
      if user_name != "" { ev.user = { "name": user_name } }
      if has_src { ev.src_endpoint = src_endpoint }
      if has_dst { ev.dst_endpoint = dst_endpoint }
      if url_str != "" { ev.url = { "url_string": url_str } }
      if length(ev) > 0 { .evidences = [ev] }
      if user_name != "" { .actor = { "user": { "name": user_name } } }
      mal = to_string(e.malware_name) ?? ""
      if mal != "" { .malware = [{ "name": mal, "classification_ids": [0], "provider": "Netskope" }] }
      # `evidences.*` is not addressable in nPL on this deployment, so every
      # pivotable entity is ALSO emitted as an OCSF observable, which is.
      obs = []
      if user_name != "" { obs = push(obs, { "name": "evidences.user.name", "type": "User Name", "type_id": 4, "value": user_name }) }
      if fsha != "" { obs = push(obs, { "name": "evidences.file.hashes.value", "type": "Hash", "type_id": 8, "value": fsha }) }
      if fmd5 != "" { obs = push(obs, { "name": "evidences.file.hashes.value", "type": "Hash", "type_id": 8, "value": fmd5 }) }
      if fname != "" { obs = push(obs, { "name": "evidences.file.name", "type": "File Name", "type_id": 7, "value": fname }) }
      if url_str != "" { obs = push(obs, { "name": "evidences.url.url_string", "type": "URL String", "type_id": 6, "value": url_str }) }
      if sip != "" { obs = push(obs, { "name": "evidences.src_endpoint.ip", "type": "IP Address", "type_id": 2, "value": sip }) }
      if dip != "" { obs = push(obs, { "name": "evidences.dst_endpoint.ip", "type": "IP Address", "type_id": 2, "value": dip }) }
      if length(obs) > 0 { .observables = obs }
      if length(unmapped) > 0 { .unmapped = unmapped }
  } else if ok && record_type == "page" {
      # =================== HTTP Activity (4002) ===================
      code = to_int(e.http_status_code) ?? 0
      status_id = 2
      status_str = "Failure"
      if code >= 200 && code < 400 { status_id = 1; status_str = "Success" }
      if code == 0 { status_id = 0; status_str = "Unknown" }

      url_obj = {}
      if url_str != "" { url_obj.url_string = url_str }
      if domain != "" { url_obj.hostname = domain }
      pu2, pu2err = parse_url(url_str)
      if pu2err == null {
          up = to_string(pu2.path)
          if up != "" { url_obj.path = up }
          us = to_string(pu2.scheme)
          if us != "" { url_obj.scheme = us }
      }
      appcat = to_string(e.appcategory) ?? ""
      if appcat != "" { url_obj.categories = [appcat] }
      if !exists(url_obj.path) && !exists(url_obj.url_string) { url_obj.path = "/" }

      http_request = { "url": url_obj }
      ua = to_string(e.useragent) ?? ""
      if ua != "" { http_request.user_agent = ua }
      rf = to_string(e.referer) ?? ""
      if rf != "" { http_request.referrer = rf }

      . = {
          "class_uid": 4002,
          "class_name": "HTTP Activity",
          "category_uid": 4,
          "category_name": "Network Activity",
          "activity_id": 99,
          "activity_name": "Other",
          "type_uid": 400299,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": status_id,
          "status": status_str,
          "action_id": action_id,
          "action": action_name,
          "disposition_id": disposition_id,
          "disposition": disposition_name,
          "is_alert": blocked,
          "time": time_ms,
          "raw_data": raw_log,
          "metadata": metadata,
          "http_request": http_request,
          "http_response": { "code": code, "status": status_str },
          "traffic": { "bytes_in": bytes_in, "bytes_out": bytes_out }
      }
      if has_src { .src_endpoint = src_endpoint }
      if has_dst { .dst_endpoint = dst_endpoint }
      if user_name != "" { .actor = { "user": { "name": user_name } } }
      if app_name != "" { .app_name = app_name }
      if length(unmapped) > 0 { .unmapped = unmapped }
  } else if ok && (record_type == "network" || record_type == "connection") {
      # =================== Network Activity (4001) ===================
      . = {
          "class_uid": 4001,
          "class_name": "Network Activity",
          "category_uid": 4,
          "category_name": "Network Activity",
          "activity_id": 6,
          "activity_name": "Traffic",
          "type_uid": 400106,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": 1,
          "status": "Success",
          "action_id": action_id,
          "action": action_name,
          "disposition_id": disposition_id,
          "disposition": disposition_name,
          "is_alert": blocked,
          "time": time_ms,
          "raw_data": raw_log,
          "metadata": metadata,
          "traffic": { "bytes_in": bytes_in, "bytes_out": bytes_out }
      }
      if has_src { .src_endpoint = src_endpoint } else { .src_endpoint = { "svc_name": "netskope" } }
      if has_dst { .dst_endpoint = dst_endpoint }
      proto = downcase(to_string(e.protocol) ?? "")
      if proto != "" { .connection_info = { "direction_id": 2, "direction": "Outbound", "protocol_name": proto } }
      if user_name != "" { .actor = { "user": { "name": user_name } } }
      if app_name != "" { .app_name = app_name }
      if length(unmapped) > 0 { .unmapped = unmapped }
  } else if ok && (record_type == "application" || record_type == "audit") {
      # =================== API Activity (6003) ===================
      # A Netskope application event is "user did <activity> in <app>", and an
      # audit event is "admin did <event> in the Netskope tenant". Both are
      # operations against a service API, which is exactly 6003 — not 4002:
      # most of them carry no HTTP request at all.
      op = activity_verb
      if op == "" { op = to_string(e.audit_log_event) ?? "" }
      if op == "" { op = "Unknown" }
      svc = app_name
      if svc == "" { svc = "Netskope Admin" }

      status_id = 1
      status_str = "Success"
      if blocked { status_id = 2; status_str = "Failure" }

      . = {
          "class_uid": 6003,
          "class_name": "API Activity",
          "category_uid": 6,
          "category_name": "Application Activity",
          "activity_id": 99,
          "activity_name": "Other",
          "type_uid": 600399,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": status_id,
          "status": status_str,
          "action_id": action_id,
          "action": action_name,
          "disposition_id": disposition_id,
          "disposition": disposition_name,
          "is_alert": blocked,
          "time": time_ms,
          "raw_data": raw_log,
          "metadata": metadata,
          "api": { "operation": op, "service": { "name": svc } },
          "actor": { "user": { "name": "unknown" } },
          "src_endpoint": { "svc_name": "netskope" }
      }
      if user_name != "" { .actor = { "user": { "name": user_name } } }
      if has_src { .src_endpoint = src_endpoint }
      if has_dst { .dst_endpoint = dst_endpoint }
      res = {}
      if fname != "" { res.name = fname }
      otyp = to_string(e.object_type) ?? ""
      if otyp != "" { res.type = otyp }
      if length(res) > 0 { .resources = [res] }
      if length(unmapped) > 0 { .unmapped = unmapped }
  } else {
      # =================== Base Event (0) ===================
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 99,
          "activity_name": "Other",
          "type_uid": 99,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": 0,
          "status": "Unknown",
          "time": time_ms,
          "raw_data": raw_log,
          "metadata": metadata
      }
      if !ok {
          .metadata = {
              "version": "1.9.0",
              "uid": uuid_v4(),
              "log_level": "error",
              "log_name": "netskope",
              "product": { "name": "SSE", "vendor_name": "Netskope" }
          }
      } else {
          if user_name != "" { .actor = { "user": { "name": user_name } } }
          if length(unmapped) > 0 { .unmapped = unmapped }
      }
  }

  .

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # Exact value representation is evaluated AFTER branch selection. Numeric strings
  # count as represented by their typed scalar; other transformations are explicit.
  __mapped = object!(parse_json!(encode_json(.)))
  __existing = object(__mapped.unmapped) ?? {}
  __discard = del(__mapped.raw_data)
  __discard = del(__mapped.unmapped)
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __represented = []
  __walk = map_values(__mapped, recursive: true) -> |value| {
      __represented = push(__represented, encode_json(value))
      if !is_object(value) && !is_array(value) && !is_null(value) {
          __represented = push(__represented, to_string(value) ?? "")
      }
      value
  }
  __consumed = []
  # BEGIN parser-specific transformations
  # record_type: Parser lowercases this source value; consume only when the normalized value is emitted.
  # type: Parser lowercases this source value; consume only when the normalized value is emitted.
  # alert: Parser lowercases this source value; consume only when the normalized value is emitted.
  # action: Parser lowercases this source value; consume only when the normalized value is emitted.
  # severity: Parser lowercases this source value; consume only when the normalized value is emitted.
  # dlp_rule_severity: Parser lowercases this source value; consume only when the normalized value is emitted.
  # risk_level: Parser lowercases this source value; consume only when the normalized value is emitted.
  # domain: Parser lowercases this source value; consume only when the normalized value is emitted.
  # hostname: Parser lowercases this source value; consume only when the normalized value is emitted.
  # dsthost: Parser lowercases this source value; consume only when the normalized value is emitted.
  # object_type: Parser lowercases this source value; consume only when the normalized value is emitted.
  # sha256: Parser lowercases this source value; consume only when the normalized value is emitted.
  # md5: Parser lowercases this source value; consume only when the normalized value is emitted.
  # protocol: Parser lowercases this source value; consume only when the normalized value is emitted.
  # action: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when the expected ID is emitted.
  # severity: Parser normalizes the caption case; verify the emitted caption.
  # severity: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when the expected ID is emitted.
  # timestamp: Existing unit conversion by 1000 verified against time; unused clock fallbacks remain residual.
  # Only source keys read by this parser are eligible for exact-value consumption; the selected branch must emit the value. Unknown keys always spill, even when their value equals an OCSF default.
  __candidates = ["_id", "action", "activity", "alert", "alert_id", "alert_name", "alert_type", "app", "appcategory", "audit_log_event", "cci", "client_bytes", "detection_engine", "dlp_incident_id", "dlp_profile", "dlp_rule", "dlp_rule_severity", "domain", "dst_country", "dsthost", "dstip", "dstport", "file_path", "hostname", "http_status_code", "malware_name", "md5", "object", "object_type", "protocol", "record_type", "referer", "risk_level", "server_bytes", "severity", "sha256", "src_country", "srcip", "srcport", "timestamp", "transaction_id", "type", "url", "user", "useragent", "userip"]
  __preserve = []
  __rules = array!(parse_json!("[{\"source\":\"record_type\",\"kind\":\"lowercase\",\"reason\":\"Parser lowercases this source value; consume only when the normalized value is emitted.\"},{\"source\":\"type\",\"kind\":\"lowercase\",\"reason\":\"Parser lowercases this source value; consume only when the normalized value is emitted.\"},{\"source\":\"alert\",\"kind\":\"lowercase\",\"reason\":\"Parser lowercases this source value; consume only when the normalized value is emitted.\"},{\"source\":\"action\",\"kind\":\"lowercase\",\"reason\":\"Parser lowercases this source value; consume only when the normalized value is emitted.\"},{\"source\":\"severity\",\"kind\":\"lowercase\",\"reason\":\"Parser lowercases this source value; consume only when the normalized value is emitted.\"},{\"source\":\"dlp_rule_severity\",\"kind\":\"lowercase\",\"reason\":\"Parser lowercases this source value; consume only when the normalized value is emitted.\"},{\"source\":\"risk_level\",\"kind\":\"lowercase\",\"reason\":\"Parser lowercases this source value; consume only when the normalized value is emitted.\"},{\"source\":\"domain\",\"kind\":\"lowercase\",\"reason\":\"Parser lowercases this source value; consume only when the normalized value is emitted.\"},{\"source\":\"hostname\",\"kind\":\"lowercase\",\"reason\":\"Parser lowercases this source value; consume only when the normalized value is emitted.\"},{\"source\":\"dsthost\",\"kind\":\"lowercase\",\"reason\":\"Parser lowercases this source value; consume only when the normalized value is emitted.\"},{\"source\":\"object_type\",\"kind\":\"lowercase\",\"reason\":\"Parser lowercases this source value; consume only when the normalized value is emitted.\"},{\"source\":\"sha256\",\"kind\":\"lowercase\",\"reason\":\"Parser lowercases this source value; consume only when the normalized value is emitted.\"},{\"source\":\"md5\",\"kind\":\"lowercase\",\"reason\":\"Parser lowercases this source value; consume only when the normalized value is emitted.\"},{\"source\":\"protocol\",\"kind\":\"lowercase\",\"reason\":\"Parser lowercases this source value; consume only when the normalized value is emitted.\"},{\"source\":\"action\",\"kind\":\"enum\",\"target\":\"action_id\",\"values\":{\"allow\":1,\"allowed\":1,\"accept\":1,\"accepted\":1,\"permit\":1,\"permitted\":1,\"pass\":1,\"passed\":1,\"deny\":2,\"denied\":2,\"block\":2,\"blocked\":2,\"reject\":2,\"rejected\":2,\"drop\":2,\"dropped\":2,\"log\":3,\"observed\":3},\"reason\":\"Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when the expected ID is emitted.\"},{\"source\":\"severity\",\"kind\":\"enum\",\"target\":\"severity\",\"values\":{\"high\":\"High\"},\"reason\":\"Parser normalizes the caption case; verify the emitted caption.\"},{\"source\":\"severity\",\"kind\":\"enum\",\"target\":\"severity_id\",\"values\":{\"informational\":1,\"info\":1,\"debug\":1,\"low\":2,\"medium\":3,\"warn\":3,\"warning\":3,\"high\":4,\"error\":4,\"critical\":5,\"fatal\":6},\"reason\":\"Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when the expected ID is emitted.\"},{\"source\":\"timestamp\",\"kind\":\"scale\",\"factor\":1000,\"target\":\"time\",\"reason\":\"Existing unit conversion by 1000 verified against time; unused clock fallbacks remain residual.\"}]"))
  __source_flat = flatten(__source_kv)
  for_each(__rules) -> |_index, rule| {
      __source_key = string!(rule.source)
      __value = get!(__source_flat, [__source_key])
      __expected = null
      __valid = false
      if rule.kind == "lowercase" && is_string(__value) {
          __expected = downcase(string!(__value))
          __valid = true
      } else if rule.kind == "epoch_ms" {
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", string(rule.format) ?? "%+")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              __valid = true
          }
      } else if rule.kind == "scale" {
          __number, __number_err = to_float(__value)
          if __number_err == null && __value != null && !is_boolean(__value) {
              __expected = to_int(__number * to_float!(rule.factor))
              __valid = true
          }
      } else if rule.kind == "hex" {
          __hex = replace(downcase(string(__value) ?? ""), r'^0x', "")
          __integer, __integer_err = parse_int(__hex, base: 16)
          __expected = __integer
          __valid = is_string(__value) && starts_with(downcase(string(__value) ?? ""), "0x") && __integer_err == null
      } else if rule.kind == "enum" {
          __expected = get!(object!(rule.values), [downcase(to_string(__value) ?? "")])
          __valid = __expected != null
      }
      __matches = includes(__represented, encode_json(__expected))
      if is_string(rule.target) { __matches = get!(., split(string!(rule.target), ".")) == __expected }
      if __valid && __matches { __consumed = push(__consumed, __source_key) }
  }
  # END parser-specific transformations
  # Redact at every depth, including objects inside arrays, before serialization.
  __safe = map_values(object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing}))), recursive: true) -> |value| {
      if is_object(value) {
          # Header/parameter arrays commonly encode sensitive keys as name/value
          # or Key/Value objects instead of using the secret name as an object key.
          __sensitive_pair = false
          for_each(object!(value)) -> |key, child| {
              if includes(["name", "key"], downcase(key)) && match(downcase(string(child) ?? ""), r'password|secret|authorization|token') {
                  __sensitive_pair = true
              }
          }
          for_each(object!(value)) -> |key, _child| {
              if match(downcase(key), r'password|secret|authorization|token') || (__sensitive_pair && includes(["value", "values"], downcase(key))) {
                  value = set!(value, [key], "<redacted>")
              }
          }
      }
      value
  }
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  __escaped = map_keys(object!(__safe.source), recursive: true) -> |key| {
      replace(replace(key, "~", "~0"), ".", "~1")
  }
  __flat = flatten(__escaped)
  __residual = {}
  for_each(__flat) -> |key, value| {
      key = replace(replace(key, "~1", "."), "~0", "~")
      __same = includes(__represented, encode_json(value))
      if !is_object(value) && !is_array(value) && !is_null(value) {
          __same = __same || includes(__represented, to_string(value) ?? "")
      }
      # A scalar array is consumed only if every element is represented. Preserve
      # partially represented arrays intact, including their ordering and repeats.
      if is_array(value) && !is_empty(array!(value)) {
          __all_items = true
          for_each(array!(value)) -> |_index, item| {
              __item_same = includes(__represented, encode_json(item))
              if !is_object(item) && !is_array(item) && !is_null(item) {
                  __item_same = __item_same || includes(__represented, to_string(item) ?? "")
              }
              if is_object(item) || is_array(item) || !__item_same { __all_items = false }
          }
          __same = __same || __all_items
      }
      if __same && includes(__candidates, key) { __consumed = push(__consumed, key) }
      # Redacted leaves always remain visible. Do not spill a copy of the raw body.
      if (!includes(__consumed, key) || value == "<redacted>") && value != __raw_body {
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          __base = join!(__parts, ".")
          __key = __base
          __suffix = 2
          if includes(keys(__residual), __key) {
              for_each(__flat) -> |_other_key, _other_value| {
                  if includes(keys(__residual), __key) {
                      __key = __base + "_" + to_string(__suffix)
                      __suffix = __suffix + 1
                  }
              }
          }
          __complex = is_object(value)
          if is_array(value) {
              for_each(array!(value)) -> |_index, item| {
                  if is_object(item) || is_array(item) { __complex = true }
              }
          }
          __spill = if __complex { encode_json(value) } else { value }
          __residual = set!(__residual, [__key], __spill)
      }
  }
  # Keep existing derived evidence, but remove null placeholders and mapped copies.
  # Source-derived aliases are replaced by canonical dotted source paths above.
  __original_values = []
  for_each(flatten(__source_kv)) -> |_key, value| {
      __original_values = push(__original_values, encode_json(value))
      if !is_object(value) && !is_array(value) { __original_values = push(__original_values, to_string(value) ?? "") }
  }
  for_each(flatten(__existing)) -> |key, value| {
      __source_alias = includes(__original_values, encode_json(value)) || includes(__original_values, to_string(value) ?? "")
      __mapped_alias = includes(__represented, encode_json(value)) || includes(__represented, to_string(value) ?? "")
      __decoded, __decode_err = parse_json(string(value) ?? "")
      __encoded_container = __decode_err == null && (is_object(__decoded) || is_array(__decoded))
      if !is_null(value) && value != "" && !__source_alias && !__mapped_alias && !__encoded_container && value != __raw_body {
          # Existing aggregates may contain sensitive descendants; the canonical
          # source spill above is the authoritative representation of containers.
          if !is_array(value) && !is_object(value) && !match(downcase(key), r'password|secret|authorization|token') {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, with recursive
  # redaction. These entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__safe.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

