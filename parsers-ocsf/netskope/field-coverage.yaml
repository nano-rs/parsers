source: json
transforms:
- source: domain
  kind: lowercase
  target: dst_endpoint.hostname
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: domain
  kind: lowercase
  target: http_request.url.hostname
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: hostname
  kind: lowercase
  target: evidences.src_endpoint.hostname
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: hostname
  kind: lowercase
  target: src_endpoint.hostname
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: sha256
  kind: lowercase
  target: observables.value
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: protocol
  kind: lowercase
  target: connection_info.protocol_name
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: action
  kind: enum
  target: action_id
  values:
    allow: 1
    allowed: 1
    accept: 1
    accepted: 1
    permit: 1
    permitted: 1
    pass: 1
    passed: 1
    deny: 2
    denied: 2
    block: 2
    blocked: 2
    reject: 2
    rejected: 2
    drop: 2
    dropped: 2
    log: 3
    observed: 3
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when
    the expected ID is emitted.
- source: severity
  kind: enum
  target: severity_id
  values:
    informational: 1
    info: 1
    debug: 1
    low: 2
    medium: 3
    warn: 3
    warning: 3
    high: 4
    error: 4
    critical: 5
    fatal: 6
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when
    the expected ID is emitted.
- source: timestamp
  kind: scale
  factor: 1000
  target: time
  reason: Existing unit conversion by 1000 verified against time; unused clock fallbacks remain residual.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  _id:
  - metadata.original_event_uid
  activity:
  - api.operation
  alert_id:
  - finding_info.uid
  alert_name:
  - finding_info.title
  alert_type:
  - finding_info.types
  app:
  - api.service.name
  - app_name
  appcategory:
  - http_request.url.categories
  audit_log_event:
  - api.operation
  client_bytes:
  - traffic.bytes_out
  detection_engine:
  - finding_info.analytic.name
  domain:
  - dst_endpoint.hostname
  - http_request.url.hostname
  dst_country:
  - evidences.dst_endpoint.location.country
  dstip:
  - dst_endpoint.ip
  - evidences.dst_endpoint.ip
  - observables.value
  dstport:
  - dst_endpoint.port
  http_status_code:
  - http_response.code
  malware_name:
  - malware.name
  object:
  - evidences.file.name
  - observables.value
  - resources.name
  object_type:
  - resources.type
  protocol:
  - connection_info.protocol_name
  referer:
  - http_request.referrer
  server_bytes:
  - traffic.bytes_in
  src_country:
  - evidences.src_endpoint.location.country
  srcip:
  - evidences.src_endpoint.ip
  - observables.value
  - src_endpoint.ip
  srcport:
  - src_endpoint.port
  url:
  - evidences.url.url_string
  - http_request.url.url_string
  - observables.value
  user:
  - actor.user.name
  - evidences.user.name
  - observables.value
  useragent:
  - http_request.user_agent
