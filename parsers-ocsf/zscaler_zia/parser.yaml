name: zscaler_zia_ocsf
display_name: Zscaler Internet Access (OCSF)
version: "1.4.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields in redacted, dotted snake_case unmapped keys.
  Parses Zscaler Internet Access NSS/LSS JSON feeds into OCSF 1.9.0, routing
  each feed to the class that actually describes it rather than flattening
  them all into one:
    * zscalernss-web    -> HTTP Activity      (class_uid 4002)
    * zscalernss-fw     -> Network Activity   (class_uid 4001)
    * zscalernss-dns    -> DNS Activity       (class_uid 4003)
    * zscalernss-tunnel -> Network Activity   (class_uid 4001)
    * zscalernss-edlp   -> Detection Finding  (class_uid 2004)
    * zscalernss-audit  -> API Activity       (class_uid 6003)
    * anything else     -> Base Event         (class_uid 0)
  Handles both the {"sourcetype":…,"event":{…}} envelope and flat JSON.
  Mirrors the UDM zscaler_zia parser
  (../parsers/parsers/zscaler_zia/parser.yaml).
match_values:
  - zscaler_zia
category: network
vendor: "Zscaler"
product: "Internet Access"
parser_vrl: |
  # Zscaler Internet Access -> OCSF 1.9.0 (multi-class)
  raw_log = string!(.message)
  __raw_body = raw_log
  __source_kv = {}
  ip_re = r'^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$|^[0-9A-Fa-f:]{3,}$'

  top, terr = parse_json(raw_log)
  __source_kv = object(top) ?? {}
  ok = terr == null && is_object(top)

  sourcetype = ""
  e = {}
  if ok {
      t = object!(top)
      sourcetype = downcase(string(t.sourcetype) ?? "")
      if exists(t.event) { e = object(t.event) ?? {} } else { e = t }
  }

  # ---- timestamp: epochtime (seconds) / "time" / "datetime" -------------
  time_ms = 0
  ep = to_int(e.epochtime) ?? 0
  if ep > 0 { time_ms = ep * 1000 }
  if time_ms == 0 {
      ts_str = string(e.time) ?? ""
      if ts_str == "" { ts_str = string(e.datetime) ?? "" }
      if ts_str != "" {
          tv, tverr = parse_timestamp(ts_str, "%a %b %d %H:%M:%S %Y")
          if tverr == null { time_ms = to_unix_timestamp(tv, unit: "milliseconds") } else {
              tv2, tv2err = parse_timestamp(ts_str, "%+")
              if tv2err == null { time_ms = to_unix_timestamp(tv2, unit: "milliseconds") }
          }
      }
  }

  # ---- Zscaler action -> security-control action/disposition ------------
  raw_action = downcase(string(e.action) ?? "")
  if raw_action == "" { raw_action = downcase(string(e.reqaction) ?? "") }
  if raw_action == "" { raw_action = downcase(string(e.actiontaken) ?? "") }
  action_id = 0
  action_name = "Unknown"
  disposition_id = 0
  disposition_name = "Unknown"
  is_alert = false
  if contains(raw_action, "block") || contains(raw_action, "drop") || contains(raw_action, "deny") {
      action_id = 2; action_name = "Denied"
      disposition_id = 2; disposition_name = "Blocked"
      is_alert = true
  } else if contains(raw_action, "quarantin") {
      action_id = 2; action_name = "Denied"
      disposition_id = 5; disposition_name = "Quarantined"
      is_alert = true
  } else if contains(raw_action, "allow") {
      action_id = 1; action_name = "Allowed"
      disposition_id = 1; disposition_name = "Allowed"
  } else if raw_action != "" {
      action_id = 99; action_name = raw_action
  }

  # ---- severity: Zscaler threat/DLP severity ---------------------------
  severity_id = 1
  severity = "Informational"
  sev_raw = downcase(string(e.threatseverity) ?? "")
  if sev_raw == "" { sev_raw = downcase(string(e.severity) ?? "") }
  if contains(sev_raw, "critical") { severity_id = 5; severity = "Critical" } else if contains(sev_raw, "high") { severity_id = 4; severity = "High" } else if contains(sev_raw, "medium") { severity_id = 3; severity = "Medium" } else if contains(sev_raw, "low") { severity_id = 2; severity = "Low" }
  if is_alert && severity_id < 3 { severity_id = 3; severity = "Medium" }

  user_name = string(e.login) ?? ""
  if user_name == "" { user_name = string(e.user) ?? "" }
  if user_name == "" { user_name = string(e.adminid) ?? "" }
  if user_name == "" { user_name = string(e.admin) ?? "" }

  device_host = string(e.devicehostname) ?? ""

  metadata = {
      "version": "1.9.0",
      "uid": sha2("zscaler_zia|raw|" + raw_log, variant: "SHA-256"),
      "profiles": ["host", "security_control"],
      "log_name": sourcetype,
      "product": { "name": "Internet Access", "vendor_name": "Zscaler" }
  }
  if sourcetype == "" { metadata.log_name = "zscaler-zia" }
  recid = to_string(e.recordid) ?? ""
  if recid != "" { metadata.original_event_uid = recid }

  unmapped = {}
  for_each(["dept", "location", "locationname", "cloudname", "datacenter", "datacentercity", "datacentercountry", "deviceostype", "deviceowner", "devicemodel", "appname", "appclass", "urlclass", "urlsubcat", "urlcatmethod", "threatcat", "malwarecategory", "malwareclass", "ssldecrypted", "clttlsversion", "srvtlsversion", "rulelabel", "ruletype", "nwsvc", "nwapp", "tuntype", "tunneltype", "ikeversion", "channel", "reason"]) -> |_i, k| {
      v = to_string(get(e, [k]) ?? "") ?? ""
      if v != "" && v != "None" { unmapped = set!(unmapped, [k], v) }
  }

  threat_name = string(e.threatname) ?? ""
  if threat_name == "None" { threat_name = "" }

  if ok && contains(sourcetype, "web") {
      # =================== HTTP Activity (4002) ===================
      method = upcase(string(e.reqmethod) ?? "")
      activity_id = 99
      activity_name = "Other"
      if method == "CONNECT" { activity_id = 1; activity_name = "Connect" }
      if method == "DELETE"  { activity_id = 2; activity_name = "Delete" }
      if method == "GET"     { activity_id = 3; activity_name = "Get" }
      if method == "HEAD"    { activity_id = 4; activity_name = "Head" }
      if method == "OPTIONS" { activity_id = 5; activity_name = "Options" }
      if method == "POST"    { activity_id = 6; activity_name = "Post" }
      if method == "PUT"     { activity_id = 7; activity_name = "Put" }
      if method == "TRACE"   { activity_id = 8; activity_name = "Trace" }
      if method == "PATCH"   { activity_id = 9; activity_name = "Patch" }

      code = to_int(e.respcode) ?? 0
      status_id = 2
      status_str = "Failure"
      if code >= 200 && code < 400 { status_id = 1; status_str = "Success" }
      if code == 0 { status_id = 0; status_str = "Unknown" }

      url_str = string(e.url) ?? ""
      b64 = string(e.b64url) ?? ""
      if b64 != "" {
          dec = decode_base64(b64) ?? ""
          if dec != "" { url_str = dec }
      }
      host = string(e.host) ?? ""

      url_obj = {}
      if url_str != "" { url_obj.url_string = url_str }
      if host != "" { url_obj.hostname = downcase(host) }
      supercat = string(e.urlsupercat) ?? ""
      if supercat != "" && supercat != "None" { url_obj.categories = [supercat] }
      pu, puerr = parse_url(url_str)
      if puerr == null {
          up = to_string(pu.path)
          if up != "" { url_obj.path = up }
          us = to_string(pu.scheme)
          if us != "" { url_obj.scheme = us }
          if !exists(url_obj.hostname) {
              uh = to_string(pu.host)
              if uh != "" { url_obj.hostname = downcase(uh) }
          }
      }
      if !exists(url_obj.path) && !exists(url_obj.url_string) { url_obj.path = "/" }

      http_request = { "url": url_obj }
      if method != "" { http_request.http_method = method }
      ua = string(e.useragent) ?? ""
      if ua != "" { http_request.user_agent = ua }
      rf = string(e.referrer) ?? ""
      if rf != "" { http_request.referrer = rf }

      http_response = { "code": code, "status": status_str }
      ct = string(e.contenttype) ?? ""
      if ct != "" { http_response.content_type = ct }
      respsize = to_int(e.respsize) ?? 0
      reqsize = to_int(e.reqsize) ?? 0
      if respsize != 0 { http_response.length = respsize }

      . = {
          "class_uid": 4002,
          "class_name": "HTTP Activity",
          "category_uid": 4,
          "category_name": "Network Activity",
          "activity_id": activity_id,
          "activity_name": activity_name,
          "type_uid": 400200 + activity_id,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": status_id,
          "status": status_str,
          "action_id": action_id,
          "action": action_name,
          "disposition_id": disposition_id,
          "disposition": disposition_name,
          "is_alert": is_alert,
          "time": time_ms,
          "raw_data": raw_log,
          "metadata": metadata,
          "http_request": http_request,
          "http_response": http_response,
          # NAN-2995: OCSF 1.9 network_traffic: bytes_in = destination -> source, bytes_out = source -> destination.
          # src = client: respsize is bytes_in, reqsize is bytes_out.
          "traffic": { "bytes_in": respsize, "bytes_out": reqsize }
      }
      cip = string(e.cltip) ?? ""
      se = {}
      if match(cip, ip_re) { se.ip = cip }
      if device_host != "" { se.hostname = downcase(device_host) }
      if exists(se.ip) || exists(se.hostname) { .src_endpoint = se }
      de = {}
      sip = string(e.serverip) ?? ""
      if match(sip, ip_re) { de.ip = sip }
      if host != "" { de.hostname = downcase(host) }
      if exists(de.ip) || exists(de.hostname) { .dst_endpoint = de }
      if user_name != "" { .actor = { "user": { "name": user_name } } }
      rsc = to_int(e.riskscore) ?? -1
      if rsc >= 0 { .risk_score = rsc }
      if threat_name != "" {
          .malware = [{ "name": threat_name, "classification_ids": [0], "provider": "Zscaler" }]
      }
      fname = string(e.filename) ?? ""
      fhash = downcase(string(e.sha256) ?? "")
      if fname != "" || fhash != "" {
          fobj = {}
          if fname != "" { fobj.name = fname }
          if fhash != "" { fobj.hashes = [{ "algorithm_id": 3, "value": fhash }] }
          fobj.type_id = 1
          .file = fobj
      }
      dlprule = string(e.dlprulename) ?? ""
      if dlprule != "" { .firewall_rule = { "name": dlprule, "type": "dlp" } }
      if length(unmapped) > 0 { .unmapped = unmapped }
  } else if ok && (contains(sourcetype, "fw") || contains(sourcetype, "tunnel")) {
      # =================== Network Activity (4001) ===================
      is_tunnel = contains(sourcetype, "tunnel")
      se = {}
      de = {}
      if is_tunnel {
          s = string(e.sourceip) ?? ""
          d = string(e.destinationip) ?? ""
          if match(s, ip_re) { se.ip = s }
          if match(d, ip_re) { de.ip = d }
          sp = to_int(e.sourceport) ?? 0
          dp = to_int(e.destinationport) ?? 0
          if sp != 0 { se.port = sp }
          if dp != 0 { de.port = dp }
          sh = string(e.srciphost) ?? ""
          dh = string(e.destinationiphost) ?? ""
          if sh != "" { se.hostname = downcase(sh) }
          if dh != "" { de.hostname = downcase(dh) }
      } else {
          s = string(e.csip) ?? ""
          d = string(e.cdip) ?? ""
          if match(s, ip_re) { se.ip = s }
          if match(d, ip_re) { de.ip = d }
          sp = to_int(e.csport) ?? 0
          dp = to_int(e.cdport) ?? 0
          if sp != 0 { se.port = sp }
          if dp != 0 { de.port = dp }
          if device_host != "" { se.hostname = downcase(device_host) }
      }
      if !exists(se.ip) && !exists(se.hostname) && !exists(de.ip) && !exists(de.hostname) {
          se.svc_name = "zscaler-zia"
      }

      bytes_in = to_int(e.inbytes) ?? 0
      bytes_out = to_int(e.outbytes) ?? 0
      if is_tunnel {
          # Tunnel logs: src = the customer tunnel endpoint, dst = the ZIA node.
          # rxbytes = received BY ZIA from the tunnel (src -> dst = bytes_out),
          # txbytes = transmitted BY ZIA into the tunnel (dst -> src = bytes_in).
          bytes_in = to_int(e.txbytes) ?? 0
          bytes_out = to_int(e.rxbytes) ?? 0
      }

      proto = upcase(string(e.proto) ?? "")
      if proto == "" { proto = upcase(string(e.protocol) ?? "") }

      . = {
          "class_uid": 4001,
          "class_name": "Network Activity",
          "category_uid": 4,
          "category_name": "Network Activity",
          "activity_id": 6,
          "activity_name": "Traffic",
          "type_uid": 400106,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": 1,
          "status": "Success",
          "action_id": action_id,
          "action": action_name,
          "disposition_id": disposition_id,
          "disposition": disposition_name,
          "is_alert": is_alert,
          "time": time_ms,
          "duration": to_int(e.duration) ?? 0,
          "raw_data": raw_log,
          "metadata": metadata,
          "traffic": { "bytes_in": bytes_in, "bytes_out": bytes_out }
      }
      if exists(se.ip) || exists(se.hostname) || exists(se.svc_name) { .src_endpoint = se }
      if exists(de.ip) || exists(de.hostname) { .dst_endpoint = de }
      if proto != "" { .connection_info = { "direction_id": 2, "direction": "Outbound", "protocol_name": downcase(proto) } }
      if user_name != "" { .actor = { "user": { "name": user_name } } }
      rule = string(e.rule) ?? ""
      if rule != "" { .firewall_rule = { "name": rule } }
      if threat_name != "" {
          .malware = [{ "name": threat_name, "classification_ids": [0], "provider": "Zscaler" }]
      }
      if length(unmapped) > 0 { .unmapped = unmapped }
  } else if ok && contains(sourcetype, "dns") {
      # =================== DNS Activity (4003) ===================
      qname = string(e.dns_req) ?? ""
      answer = string(e.dns_resp) ?? ""
      qtype = upcase(string(e.dns_reqtype) ?? "")

      . = {
          "class_uid": 4003,
          "class_name": "DNS Activity",
          "category_uid": 4,
          "category_name": "Network Activity",
          "activity_id": 2,
          "activity_name": "Response",
          "type_uid": 400302,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": 1,
          "status": "Success",
          "action_id": action_id,
          "action": action_name,
          "disposition_id": disposition_id,
          "disposition": disposition_name,
          "is_alert": is_alert,
          "time": time_ms,
          "duration": to_int(e.durationms) ?? 0,
          "raw_data": raw_log,
          "metadata": metadata
      }
      if qname != "" {
          q = { "hostname": downcase(qname) }
          if qtype != "" { q.type = qtype }
          .query = q
      }
      if answer != "" { .answers = [{ "rdata": answer }] }
      se = {}
      cs = string(e.clt_sip) ?? ""
      if match(cs, ip_re) { se.ip = cs }
      if device_host != "" { se.hostname = downcase(device_host) }
      de = {}
      sd = string(e.srv_dip) ?? ""
      if match(sd, ip_re) { de.ip = sd }
      dpn = to_int(e.srv_dport) ?? 0
      if dpn != 0 { de.port = dpn }
      if exists(se.ip) || exists(se.hostname) { .src_endpoint = se }
      if exists(de.ip) { .dst_endpoint = de }
      if !exists(.src_endpoint) && !exists(.dst_endpoint) { .dst_endpoint = { "svc_name": "zscaler-dns" } }
      if user_name != "" { .actor = { "user": { "name": user_name } } }
      if length(unmapped) > 0 { .unmapped = unmapped }
  } else if ok && (contains(sourcetype, "dlp") || contains(sourcetype, "edlp")) {
      # =================== Detection Finding (2004) ===================
      rule_name = string(e.dlprulename) ?? ""
      engine = string(e.dlpeng) ?? ""
      finding_uid = recid
      if finding_uid == "" { finding_uid = to_string(e.dlpidentifier) ?? "" }
      if finding_uid == "" { finding_uid = sha2("zscaler_zia|raw|" + raw_log, variant: "SHA-256") }

      finding_info = { "uid": finding_uid }
      if rule_name != "" { finding_info.title = rule_name }
      if engine != "" {
          # analytic.type_id 1 = Rule; a DLP engine is a rule set, not an ML model.
          finding_info.analytic = { "name": engine, "type_id": 1, "type": "Rule" }
      }
      finding_info.types = ["Data Loss Prevention"]

      . = {
          "class_uid": 2004,
          "class_name": "Detection Finding",
          "category_uid": 2,
          "category_name": "Findings",
          "activity_id": 1,
          "activity_name": "Create",
          "type_uid": 200401,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": 1,
          "status": "New",
          "action_id": action_id,
          "action": action_name,
          "disposition_id": disposition_id,
          "disposition": disposition_name,
          "is_alert": true,
          "time": time_ms,
          "raw_data": raw_log,
          "metadata": metadata,
          "finding_info": finding_info
      }
      fname = string(e.filename) ?? ""
      fhash = downcase(string(e.sha256) ?? "")
      ev = {}
      if fname != "" || fhash != "" {
          fobj = { "type_id": 1 }
          if fname != "" { fobj.name = fname }
          if fhash != "" { fobj.hashes = [{ "algorithm_id": 3, "value": fhash }] }
          ev.file = fobj
      }
      if user_name != "" { ev.user = { "name": user_name } }
      if device_host != "" { ev.device = { "type_id": 0, "hostname": downcase(device_host) } }
      if length(ev) > 0 { .evidences = [ev] }
      if user_name != "" { .actor = { "user": { "name": user_name } } }
      # `evidences.*` is not addressable in nPL on this deployment; observables
      # are, so the DLP file/user pivots are mirrored there.
      obs = []
      if user_name != "" { obs = push(obs, { "name": "evidences.user.name", "type": "User Name", "type_id": 4, "value": user_name }) }
      if fhash != "" { obs = push(obs, { "name": "evidences.file.hashes.value", "type": "Hash", "type_id": 8, "value": fhash }) }
      if fname != "" { obs = push(obs, { "name": "evidences.file.name", "type": "File Name", "type_id": 7, "value": fname }) }
      if length(obs) > 0 { .observables = obs }
      if length(unmapped) > 0 { .unmapped = unmapped }
  } else if ok && contains(sourcetype, "audit") {
      # =================== API Activity (6003) ===================
      op = string(e.action) ?? ""
      if op == "" { op = "Unknown" }
      cat = string(e.category) ?? ""
      result = downcase(string(e.result) ?? "")
      status_id = 0
      status_str = "Unknown"
      if contains(result, "success") { status_id = 1; status_str = "Success" }
      if contains(result, "fail") { status_id = 2; status_str = "Failure" }

      api = { "operation": op, "service": { "name": "ZIA Admin Portal" } }

      se = {}
      cip = string(e.clientip) ?? ""
      if match(cip, ip_re) { se.ip = cip } else { se.svc_name = "zia-admin" }

      . = {
          "class_uid": 6003,
          "class_name": "API Activity",
          "category_uid": 6,
          "category_name": "Application Activity",
          "activity_id": 99,
          "activity_name": "Other",
          "type_uid": 600399,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": status_id,
          "status": status_str,
          "time": time_ms,
          "raw_data": raw_log,
          "metadata": metadata,
          "api": api,
          "src_endpoint": se,
          "actor": { "user": { "name": user_name } }
      }
      if user_name == "" { .actor = { "user": { "name": "unknown" } } }
      res = string(e.resource) ?? ""
      rtype = string(e.resourcetype) ?? ""
      if res != "" {
          r = { "name": res }
          if rtype != "" { r.type = rtype }
          .resources = [r]
      }
      if cat != "" { unmapped.category = cat }
      pre = string(e.preaction) ?? ""
      post = string(e.postaction) ?? ""
      if pre != "" { unmapped.pre_action = pre }
      if post != "" { unmapped.post_action = post }
      if length(unmapped) > 0 { .unmapped = unmapped }
  } else {
      # =================== Base Event (0) ===================
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 99,
          "activity_name": "Other",
          "type_uid": 99,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": 0,
          "status": "Unknown",
          "time": time_ms,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": sha2("zscaler_zia|raw|" + raw_log, variant: "SHA-256"),
              "profiles": ["host"],
              "log_name": "zscaler-zia",
              "product": { "name": "Internet Access", "vendor_name": "Zscaler" }
          }
      }
      if !ok { .metadata.log_level = "error" }
      if user_name != "" { .actor = { "user": { "name": user_name } } }
      if length(unmapped) > 0 { .unmapped = unmapped }
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      if !ok { . = set!(., ["unmapped", "parse_fallback"], "unparsable input") }
  }

  .

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # Exact value representation is evaluated AFTER branch selection. Numeric strings
  # count as represented by their typed scalar; other transformations are explicit.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The value sets below are strings
  # instead (a read shares the buffer): "," + encode_json(member) per member, and
  # contains(set, "," + encode_json(x)) is exact membership. Every member is a
  # JSON text, inside which a '"' is always escaped, so ',"' only ever starts a
  # member, and a JSON string ends at its first unescaped '"'. The fixed candidate
  # set is a regex literal, compiled once with the program.
  # __mapped holds only JSON types, so to_string equals encode_json for an integer
  # or a boolean and only strings and floats add a second member.
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped_json = encode_json(__mapped)
  __mapped = object!(parse_json!(__mapped_json))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __safe = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __safe_json = encode_json(__safe)
  # Object and array members are encodings: an empty object, an object that
  # opens with a quoted key, or an array. A lookup can ask for one only when some
  # source or existing value is an array, or a string spelling one of those
  # openings, and the regex below finds either in the JSON text (brackets are
  # written as hex escapes because nano's deploy check counts them raw).
  # Otherwise the scalar nodes suffice; a Sysmon GUID, a brace-wrapped string
  # with no quoted key, is no object member. The leaves of flatten(), with arrays
  # flattened too, are every scalar node unless a key holds a literal '.' (in
  # compact JSON only a key is followed by ':').
  # Their encodings, unwrapped from the array, already are the string members.
  __represented = ""
  __nodes = __mapped
  if !match(__safe_json, r'"(?:\x7B\\"|\x7B\x7D"|\x5B)|[:,\x5B]\x5B') && !match(__mapped_json, r'\.(?:[^"\\]|\\.)*":') {
      __leaves = flatten(values(flatten(__mapped)))
      __leaves_json = encode_json(__leaves)
      if match(__leaves_json, r'\x7B') {
          # An object inside an array: walk the leaves, objects whole.
          __nodes = __leaves
      } else {
          __nodes = []
          __members = map_values(__leaves) -> |value| {
              if is_float(value) {
                  encode_json(encode_json(value)) + "," + encode_json(to_string!(value))
              } else {
                  encode_json(encode_json(value))
              }
          }
          __represented = "," + join!(__members, ",") + "," + slice!(__leaves_json, 1, -1)
      }
  }
  __walk = map_values(__nodes, recursive: true) -> |value| {
      __json = encode_json(value)
      if is_string(value) {
          # A string's second member is the string itself, encoded: __json.
          __represented = __represented + ("," + encode_json(__json) + "," + __json)
      } else if is_float(value) {
          __represented = __represented + ("," + encode_json(__json) + "," + encode_json(to_string!(value)))
      } else {
          __represented = __represented + ("," + encode_json(__json))
      }
      value
  }
  __consumed = ""
  # BEGIN parser-specific transformations
  # sourcetype: Parser lowercases this source value; consume only when the normalized value is emitted.
  # event.action: Parser lowercases this source value; consume only when the normalized value is emitted.
  # event.reqaction: Parser lowercases this source value; consume only when the normalized value is emitted.
  # event.actiontaken: Parser lowercases this source value; consume only when the normalized value is emitted.
  # event.threatseverity: Parser lowercases this source value; consume only when the normalized value is emitted.
  # event.severity: Parser lowercases this source value; consume only when the normalized value is emitted.
  # event.sha256: Parser lowercases this source value; consume only when the normalized value is emitted.
  # event.result: Parser lowercases this source value; consume only when the normalized value is emitted.
  # event.time: Successful ISO timestamp conversion to the selected event clock in milliseconds.
  # event.datetime: Successful ISO timestamp conversion to the selected event clock in milliseconds.
  # event.result: Parser normalizes the caption case; verify the emitted caption.
  # event.result: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when the expected ID is emitted.
  # event.actiontaken: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when the expected ID is emitted.
  # event.devicehostname: Case normalization already performed by the parser; observed at src_endpoint.hostname, and checked against the emitted branch.
  # event.reqaction: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when the expected ID is emitted.
  # event.action: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when the expected ID is emitted.
  # event.proto: Case normalization already performed by the parser; observed at connection_info.protocol_name, and checked against the emitted branch.
  # event.protocol: Case normalization already performed by the parser; observed at connection_info.protocol_name, and checked against the emitted branch.
  # event.epochtime: Existing unit conversion by 1000 verified against time; unused clock fallbacks remain residual.
  for_each(flatten(__source_kv)) -> |key, value| {
      if match(key, r'(?x)
      \A(?:
        sourcetype
      | event\.action
      | event\.reqaction
      | event\.actiontaken
      | event\.threatseverity
      | event\.severity
      | event\.sha256
      | event\.result
      | event\.devicehostname
      | event\.proto
      | event\.protocol
      )\z') {
          __value = value
          if is_string(__value) {
              __expected = downcase(string!(__value))
              if contains(__represented, "," + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        event\.time
      | event\.datetime
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%+")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              if ."time" == __expected { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        event\.result
      )\z') {
          __value = value
          if __value != null {
              __expected = get!({"success": "Success"}, [downcase(to_string(__value) ?? "")])
              if __expected != null {
                  if ."status" == __expected { __consumed = __consumed + ("," + encode_json(key)) }
              }
          }
      }
      if match(key, r'(?x)
      \A(?:
        event\.result
      )\z') {
          __value = value
          if __value != null {
              __expected = get!({"success": 1, "succeeded": 1, "failure": 2, "failed": 2}, [downcase(to_string(__value) ?? "")])
              if __expected != null {
                  if ."status_id" == __expected { __consumed = __consumed + ("," + encode_json(key)) }
              }
          }
      }
      if match(key, r'(?x)
      \A(?:
        event\.actiontaken
      | event\.reqaction
      | event\.action
      )\z') {
          __value = value
          if __value != null {
              __expected = get!({"allow": 1, "allowed": 1, "accept": 1, "accepted": 1, "permit": 1, "permitted": 1, "pass": 1, "passed": 1, "deny": 2, "denied": 2, "block": 2, "blocked": 2, "reject": 2, "rejected": 2, "drop": 2, "dropped": 2, "log": 3, "observed": 3}, [downcase(to_string(__value) ?? "")])
              if __expected != null {
                  if ."action_id" == __expected { __consumed = __consumed + ("," + encode_json(key)) }
              }
          }
      }
      if match(key, r'(?x)
      \A(?:
        event\.epochtime
      )\z') {
          __value = value
          __number, __number_err = to_float(__value)
          if __number_err == null && __value != null && !is_boolean(__value) {
              __expected = to_int(__number * 1000.0)
              if ."time" == __expected { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
  }
  # Only source keys read by this parser are eligible for exact-value consumption; the selected branch must emit the value. Unknown keys always spill, even when their value equals an OCSF default.
  __candidates = r'(?x)
  \A(?:
    action
  | actiontaken
  | admin
  | adminid
  | b64url
  | category
  | cdip
  | cdport
  | clientip
  | clt_sip
  | cltip
  | contenttype
  | csip
  | csport
  | datetime
  | destinationip
  | destinationiphost
  | destinationport
  | devicehostname
  | dlpeng
  | dlpidentifier
  | dlprulename
  | dns_req
  | dns_reqtype
  | dns_resp
  | duration
  | durationms
  | epochtime
  | event
  | event\.action
  | event\.actiontaken
  | event\.admin
  | event\.adminid
  | event\.b64url
  | event\.category
  | event\.cdip
  | event\.cdport
  | event\.clientip
  | event\.clt_sip
  | event\.cltip
  | event\.contenttype
  | event\.csip
  | event\.csport
  | event\.datetime
  | event\.destinationip
  | event\.destinationiphost
  | event\.destinationport
  | event\.devicehostname
  | event\.dlpeng
  | event\.dlpidentifier
  | event\.dlprulename
  | event\.dns_req
  | event\.dns_reqtype
  | event\.dns_resp
  | event\.duration
  | event\.durationms
  | event\.epochtime
  | event\.filename
  | event\.host
  | event\.inbytes
  | event\.login
  | event\.outbytes
  | event\.postaction
  | event\.preaction
  | event\.proto
  | event\.protocol
  | event\.recordid
  | event\.referrer
  | event\.reqaction
  | event\.reqmethod
  | event\.reqsize
  | event\.resource
  | event\.resourcetype
  | event\.respcode
  | event\.respsize
  | event\.result
  | event\.riskscore
  | event\.rule
  | event\.rxbytes
  | event\.serverip
  | event\.severity
  | event\.sha256
  | event\.sourceip
  | event\.sourceport
  | event\.srciphost
  | event\.srv_dip
  | event\.srv_dport
  | event\.threatname
  | event\.threatseverity
  | event\.time
  | event\.txbytes
  | event\.url
  | event\.urlsupercat
  | event\.user
  | event\.useragent
  | filename
  | host
  | inbytes
  | login
  | outbytes
  | postaction
  | preaction
  | proto
  | protocol
  | recordid
  | referrer
  | reqaction
  | reqmethod
  | reqsize
  | resource
  | resourcetype
  | respcode
  | respsize
  | result
  | riskscore
  | rule
  | rxbytes
  | serverip
  | severity
  | sha256
  | sourceip
  | sourceport
  | sourcetype
  | srciphost
  | srv_dip
  | srv_dport
  | threatname
  | threatseverity
  | time
  | txbytes
  | url
  | urlsupercat
  | user
  | useragent
  )\z'
  __preserve = []
  # END parser-specific transformations
  # Redact at every depth, including objects inside arrays, before serialization.
  # Redaction needs a sensitive word in a key or a name/key value, and encode_json
  # never escapes a letter, so text without one of the words needs no walk.
  if match(downcase(__safe_json), r'password|secret|authorization|token') {
      __safe = map_values(__safe, recursive: true) -> |value| {
          if is_object(value) {
              # Header/parameter arrays commonly encode sensitive keys as name/value
              # or Key/Value objects instead of using the secret name as an object key.
              __sensitive_pair = false
              for_each(object!(value)) -> |key, child| {
                  if includes(["name", "key"], downcase(key)) && match(downcase(string(child) ?? ""), r'password|secret|authorization|token') {
                      __sensitive_pair = true
                  }
              }
              for_each(object!(value)) -> |key, _child| {
                  if match(downcase(key), r'password|secret|authorization|token') || (__sensitive_pair && includes(["value", "values"], downcase(key))) {
                      value = set!(value, [key], "<redacted>")
                  }
              }
          }
          value
      }
  }
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__safe.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # Fast path: when no two source keys decode to the same key and no two spilled
  # keys get the same name, each key's decision depends only on its own value, so
  # one filter and one rename build the residual without copying it per key.
  __distinct = true
  if __tilde {
      __distinct = length(map_keys(__flat) -> |key| { replace(replace(key, "~1", "."), "~0", "~") }) == length(__flat)
  }
  __kept = {}
  __names = {}
  if __distinct {
      __kept = filter(__flat) -> |key, value| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          # A key is kept unless it is consumed: by a transformation above, or as a
          # candidate whose value is represented. Redacted leaves always remain
          # visible. Do not spill a copy of the raw body.
          if value == __raw_body {
              false
          } else if value == "<redacted>" {
              true
          } else if contains(__consumed, "," + encode_json(key)) {
              false
          } else if !match(key, __candidates) {
              true
          } else {
              # flatten stops at arrays, so objects inside an array still carry the
              # escaped keys: decode them too, or `a.b` spills as `a~1b` (NAN-3604).
              if __tilde && (is_array(value) || is_object(value)) {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __same = contains(__represented, "," + encode_json(encode_json(value)))
              if !__same && (is_string(value) || is_float(value)) {
                  __same = contains(__represented, "," + encode_json(to_string!(value)))
              }
              # A scalar array is consumed only if every element is represented. Preserve
              # partially represented arrays intact, including their ordering and repeats.
              if !__same && is_array(value) && !is_empty(array!(value)) {
                  __same = true
                  for_each(array!(value)) -> |_index, item| {
                      if __same {
                          if is_object(item) || is_array(item) {
                              __same = false
                          } else if !contains(__represented, "," + encode_json(encode_json(item))) {
                              __same = (is_string(item) || is_float(item)) && contains(__represented, "," + encode_json(to_string!(item)))
                          }
                      }
                  }
              }
              !__same
          }
      }
      __names = map_keys(__kept) -> |key| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          join!(__parts, ".")
      }
  }
  __residual = {}
  if __distinct && length(__names) == length(__kept) {
      __residual = map_values(__names) -> |value| {
          if is_array(value) || is_object(value) {
              if __tilde {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
