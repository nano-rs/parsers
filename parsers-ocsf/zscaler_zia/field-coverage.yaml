- source: event.result
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value
    is emitted.
- source: event.time
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: event.datetime
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: event.result
  kind: enum
  target: status
  values:
    success: Success
  reason: Parser normalizes the caption case; verify the emitted caption.
- source: event.result
  kind: enum
  target: status_id
  values:
    success: 1
    succeeded: 1
    failure: 2
    failed: 2
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping;
    consume only when the expected ID is emitted.
- source: event.actiontaken
  kind: enum
  target: action_id
  values:
    allow: 1
    allowed: 1
    accept: 1
    accepted: 1
    permit: 1
    permitted: 1
    pass: 1
    passed: 1
    deny: 2
    denied: 2
    block: 2
    blocked: 2
    reject: 2
    rejected: 2
    drop: 2
    dropped: 2
    log: 3
    observed: 3
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping;
    consume only when the expected ID is emitted.
- source: event.devicehostname
  kind: lowercase
  reason: Case normalization already performed by the parser; observed at src_endpoint.hostname,
    and checked against the emitted branch.
- source: event.reqaction
  kind: enum
  target: action_id
  values:
    allow: 1
    allowed: 1
    accept: 1
    accepted: 1
    permit: 1
    permitted: 1
    pass: 1
    passed: 1
    deny: 2
    denied: 2
    block: 2
    blocked: 2
    reject: 2
    rejected: 2
    drop: 2
    dropped: 2
    log: 3
    observed: 3
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping;
    consume only when the expected ID is emitted.
- source: event.action
  kind: enum
  target: action_id
  values:
    allow: 1
    allowed: 1
    accept: 1
    accepted: 1
    permit: 1
    permitted: 1
    pass: 1
    passed: 1
    deny: 2
    denied: 2
    block: 2
    blocked: 2
    reject: 2
    rejected: 2
    drop: 2
    dropped: 2
    log: 3
    observed: 3
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping;
    consume only when the expected ID is emitted.
- source: event.proto
  kind: lowercase
  reason: Case normalization already performed by the parser; observed at connection_info.protocol_name,
    and checked against the emitted branch.
- source: event.protocol
  kind: lowercase
  reason: Case normalization already performed by the parser; observed at connection_info.protocol_name,
    and checked against the emitted branch.
- source: event.epochtime
  kind: scale
  factor: 1000
  target: time
  reason: Existing unit conversion by 1000 verified against time; unused clock fallbacks
    remain residual.
