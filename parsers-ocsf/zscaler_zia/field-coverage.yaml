source: json
transforms:
- source: sourcetype
  kind: lowercase
  target: metadata.log_name
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: event.sha256
  kind: lowercase
  target: file.hashes.value
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: event.sha256
  kind: lowercase
  target: observables.value
  reason: Parser lowercases this source value; consume only when the normalized value is emitted.
- source: event.result
  kind: enum
  target: status_id
  values:
    success: 1
    succeeded: 1
    failure: 2
    failed: 2
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when
    the expected ID is emitted.
- source: event.actiontaken
  kind: enum
  target: action_id
  values:
    allow: 1
    allowed: 1
    accept: 1
    accepted: 1
    permit: 1
    permitted: 1
    pass: 1
    passed: 1
    deny: 2
    denied: 2
    block: 2
    blocked: 2
    reject: 2
    rejected: 2
    drop: 2
    dropped: 2
    log: 3
    observed: 3
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when
    the expected ID is emitted.
- source: event.devicehostname
  kind: lowercase
  target: evidences.device.hostname
  reason: Case normalization already performed by the parser; observed at src_endpoint.hostname, and checked
    against the emitted branch.
- source: event.devicehostname
  kind: lowercase
  target: src_endpoint.hostname
  reason: Case normalization already performed by the parser; observed at src_endpoint.hostname, and checked
    against the emitted branch.
- source: event.reqaction
  kind: enum
  target: action_id
  values:
    allow: 1
    allowed: 1
    accept: 1
    accepted: 1
    permit: 1
    permitted: 1
    pass: 1
    passed: 1
    deny: 2
    denied: 2
    block: 2
    blocked: 2
    reject: 2
    rejected: 2
    drop: 2
    dropped: 2
    log: 3
    observed: 3
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when
    the expected ID is emitted.
- source: event.action
  kind: enum
  target: action_id
  values:
    allow: 1
    allowed: 1
    accept: 1
    accepted: 1
    permit: 1
    permitted: 1
    pass: 1
    passed: 1
    deny: 2
    denied: 2
    block: 2
    blocked: 2
    reject: 2
    rejected: 2
    drop: 2
    dropped: 2
    log: 3
    observed: 3
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when
    the expected ID is emitted.
- source: event.proto
  kind: lowercase
  target: connection_info.protocol_name
  reason: Case normalization already performed by the parser; observed at connection_info.protocol_name,
    and checked against the emitted branch.
- source: event.protocol
  kind: lowercase
  target: connection_info.protocol_name
  reason: Case normalization already performed by the parser; observed at connection_info.protocol_name,
    and checked against the emitted branch.
- source: event.epochtime
  kind: scale
  factor: 1000
  target: time
  reason: Existing unit conversion by 1000 verified against time; unused clock fallbacks remain residual.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  event.action:
  - api.operation
  event.adminid:
  - actor.user.name
  event.cdip:
  - dst_endpoint.ip
  event.cdport:
  - dst_endpoint.port
  event.clientip:
  - src_endpoint.ip
  event.clt_sip:
  - src_endpoint.ip
  event.cltip:
  - src_endpoint.ip
  event.contenttype:
  - http_response.content_type
  event.csip:
  - src_endpoint.ip
  event.csport:
  - src_endpoint.port
  event.destinationip:
  - dst_endpoint.ip
  event.destinationport:
  - dst_endpoint.port
  event.dlpeng:
  - finding_info.analytic.name
  event.dlpidentifier:
  - finding_info.uid
  event.dlprulename:
  - finding_info.title
  event.dns_req:
  - query.hostname
  event.dns_reqtype:
  - query.type
  event.dns_resp:
  - answers.rdata
  event.duration:
  - duration
  event.durationms:
  - duration
  event.filename:
  - evidences.file.name
  - file.name
  - observables.value
  event.host:
  - dst_endpoint.hostname
  - http_request.url.hostname
  event.inbytes:
  - traffic.bytes_in
  event.login:
  - actor.user.name
  event.outbytes:
  - traffic.bytes_out
  event.recordid:
  - metadata.original_event_uid
  event.referrer:
  - http_request.referrer
  event.reqmethod:
  - http_request.http_method
  event.reqsize:
  - traffic.bytes_out
  event.resource:
  - resources.name
  event.resourcetype:
  - resources.type
  event.respcode:
  - http_response.code
  event.respsize:
  - http_response.length
  - traffic.bytes_in
  event.riskscore:
  - risk_score
  event.rule:
  - firewall_rule.name
  event.rxbytes:
  - traffic.bytes_out
  event.serverip:
  - dst_endpoint.ip
  event.sourceip:
  - src_endpoint.ip
  event.sourceport:
  - src_endpoint.port
  event.srv_dip:
  - dst_endpoint.ip
  event.srv_dport:
  - dst_endpoint.port
  event.threatname:
  - malware.name
  event.txbytes:
  - traffic.bytes_in
  event.urlsupercat:
  - http_request.url.categories
  event.user:
  - actor.user.name
  - evidences.user.name
  - observables.value
  event.useragent:
  - http_request.user_agent
  sourcetype:
  - metadata.log_name
