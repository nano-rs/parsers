source: json
transforms:
- source: action
  kind: enum
  target: action_id
  values:
    allow: 1
    allowed: 1
    accept: 1
    accepted: 1
    permit: 1
    permitted: 1
    pass: 1
    passed: 1
    deny: 2
    denied: 2
    block: 2
    blocked: 2
    reject: 2
    rejected: 2
    drop: 2
    dropped: 2
    log: 3
    observed: 3
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when
    the expected ID is emitted.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  httpRequest.args:
  - http_request.url.query_string
  httpRequest.clientIp:
  - src_endpoint.ip
  httpRequest.country:
  - src_endpoint.location.country
  httpRequest.httpMethod:
  - http_request.http_method
  httpRequest.httpVersion:
  - http_request.version
  httpRequest.requestId:
  - http_request.uid
  - metadata.uid
  httpRequest.uri:
  - http_request.url.path
  responseCodeSent:
  - http_response.code
  terminatingRuleId:
  - firewall_rule.name
  - firewall_rule.uid
  terminatingRuleType:
  - firewall_rule.type
  timestamp:
  - time
