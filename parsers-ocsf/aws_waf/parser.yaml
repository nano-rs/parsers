name: aws_waf_ocsf
display_name: AWS WAF (OCSF)
version: "1.1.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields in redacted, dotted snake_case unmapped keys.
  Parses AWS WAF v2 access logs into complete OCSF 1.9.0 "HTTP Activity"
  (class_uid 4002) records carrying the security_control profile, so the WAF
  verdict lands on action_id / disposition_id / firewall_rule and the inspected
  request lands on http_request. The whole OCSF object is emitted on the root so
  it lands in ocsf_logs.event and the promoted columns materialize. Mirrors the
  UDM aws_waf parser but targets OCSF instead of `.udm.*`.
match_values:
  - aws_waf
category: cloud
vendor: "Amazon"
product: "WAF"
parser_vrl: |
  # AWS WAF v2 JSON log -> OCSF 1.9.0 HTTP Activity (class_uid 4002)
  raw_log = to_string(.message) ?? ""
  __raw_body = raw_log
  __source_kv = {}
  class_uid = 4002

  parsed, err = parse_json(raw_log)
  __source_kv = object(parsed) ?? {}

  if err != null || !is_object(parsed) {
      . = {
          "class_uid": class_uid,
          "class_name": "HTTP Activity",
          "category_uid": 4,
          "category_name": "Network Activity",
          "activity_id": 99,
          "activity_name": "Other",
          "type_uid": class_uid * 100 + 99,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "time": 0,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "profiles": ["cloud", "security_control"],
              "uid": uuid_v4(),
              "log_level": "error",
              "log_name": "AWS WAF",
              "product": { "name": "AWS WAF", "vendor_name": "Amazon" }
          },
          "cloud": { "provider": "AWS" },
          "http_request": { "url": { "path": "/" } }
      }
  } else {
      p = object!(parsed)
      req = object(p.httpRequest) ?? {}

      # ---- time: WAF emits epoch milliseconds ----
      time_ms = to_int(p.timestamp) ?? 0

      # ---- method -> activity_id ----
      method = upcase(to_string(req.httpMethod) ?? "")
      activity_id = 99
      activity_name = "Other"
      if method == "CONNECT" { activity_id = 1; activity_name = "Connect" }
      if method == "DELETE"  { activity_id = 2; activity_name = "Delete" }
      if method == "GET"     { activity_id = 3; activity_name = "Get" }
      if method == "HEAD"    { activity_id = 4; activity_name = "Head" }
      if method == "OPTIONS" { activity_id = 5; activity_name = "Options" }
      if method == "POST"    { activity_id = 6; activity_name = "Post" }
      if method == "PUT"     { activity_id = 7; activity_name = "Put" }
      if method == "TRACE"   { activity_id = 8; activity_name = "Trace" }
      if method == "PATCH"   { activity_id = 9; activity_name = "Patch" }

      # ---- WAF verdict -> security_control action/disposition ----
      waf_action = upcase(to_string(p.action) ?? "")
      action_id = 0
      action_str = "Unknown"
      disposition_id = 0
      disposition = "Unknown"
      is_alert = false
      severity_id = 1
      severity = "Informational"
      if waf_action == "ALLOW" {
          action_id = 1; action_str = "Allowed"; disposition_id = 1; disposition = "Allowed"
      }
      if waf_action == "BLOCK" {
          action_id = 2; action_str = "Denied"; disposition_id = 2; disposition = "Blocked"
          is_alert = true; severity_id = 3; severity = "Medium"
      }
      if waf_action == "COUNT" {
          action_id = 3; action_str = "Observed"; disposition_id = 20; disposition = "Count"
      }
      if waf_action == "CAPTCHA" {
          action_id = 2; action_str = "Denied"; disposition_id = 22; disposition = "Captcha"
          is_alert = true; severity_id = 2; severity = "Low"
      }
      if waf_action == "CHALLENGE" {
          action_id = 2; action_str = "Denied"; disposition_id = 23; disposition = "Challenge"
          is_alert = true; severity_id = 2; severity = "Low"
      }
      if waf_action == "EXCLUDED_AS_COUNT" {
          action_id = 3; action_str = "Observed"; disposition_id = 20; disposition = "Count"
      }

      # ---- headers: host / user-agent / referer ----
      host = ""
      user_agent = ""
      referrer = ""
      headers = array(req.headers) ?? []
      for_each(headers) -> |_i, h| {
          hname = downcase(to_string(get(h, ["name"]) ?? "") ?? "")
          hval = to_string(get(h, ["value"]) ?? "") ?? ""
          if hname == "host" { host = hval }
          if hname == "user-agent" { user_agent = hval }
          if hname == "referer" { referrer = hval }
      }

      # ---- url ----
      uri = to_string(req.uri) ?? ""
      args = to_string(req.args) ?? ""
      url_obj = {}
      if uri != "" { url_obj.path = uri }
      if args != "" { url_obj.query_string = args }
      if host != "" {
          url_obj.hostname = host
          url_obj.scheme = "https"
          if args != "" {
              url_obj.url_string = "https://" + host + uri + "?" + args
          } else {
              url_obj.url_string = "https://" + host + uri
          }
      }
      if length(keys(url_obj)) == 0 { url_obj.path = "/" }

      http_request = { "url": url_obj }
      if method != "" { http_request.http_method = method }
      if user_agent != "" { http_request.user_agent = user_agent }
      if referrer != "" { http_request.referrer = referrer }
      hver = to_string(req.httpVersion) ?? ""
      if hver != "" { http_request.version = hver }
      rid = to_string(req.requestId) ?? ""
      if rid != "" { http_request.uid = rid }

      # ---- response ----
      code = to_int(p.responseCodeSent) ?? 0
      status_id = 0
      status_str = "Unknown"
      if code > 0 {
          if code >= 200 && code < 400 { status_id = 1; status_str = "Success" } else { status_id = 2; status_str = "Failure" }
      } else if waf_action == "ALLOW" {
          status_id = 1
          status_str = "Success"
      }

      # ---- source endpoint (+ WAF-resolved country) ----
      src_endpoint = {}
      client_ip = to_string(req.clientIp) ?? ""
      if client_ip != "" { src_endpoint.ip = downcase(client_ip) }
      country = to_string(req.country) ?? ""
      if country != "" { src_endpoint.location = { "country": country } }
      if length(keys(src_endpoint)) == 0 { src_endpoint.ip = "0.0.0.0" }

      # ---- the terminating rule -> firewall_rule ----
      fw = {}
      rule_id = to_string(p.terminatingRuleId) ?? ""
      if rule_id != "" { fw.uid = rule_id; fw.name = rule_id }
      rule_type = to_string(p.terminatingRuleType) ?? ""
      if rule_type != "" { fw.type = rule_type }
      match_details = array(p.terminatingRuleMatchDetails) ?? []
      first_match = get(match_details, [0]) ?? null
      if first_match != null {
          cond = to_string(get(first_match, ["conditionType"]) ?? "") ?? ""
          if cond != "" { fw.category = cond }
          fw.match_details = [encode_json(first_match)]
          loc = to_string(get(first_match, ["location"]) ?? "") ?? ""
          if loc != "" { fw.match_location = loc }
      }

      ocsf = {
          "class_uid": class_uid,
          "class_name": "HTTP Activity",
          "category_uid": 4,
          "category_name": "Network Activity",
          "activity_id": activity_id,
          "activity_name": activity_name,
          "type_uid": class_uid * 100 + activity_id,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": status_id,
          "status": status_str,
          "action_id": action_id,
          "action": action_str,
          "disposition_id": disposition_id,
          "disposition": disposition,
          "is_alert": is_alert,
          "time": time_ms,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "profiles": ["cloud", "security_control"],
              "uid": rid,
              "log_name": "AWS WAF",
              "log_provider": "AWS WAF",
              "product": { "name": "AWS WAF", "vendor_name": "Amazon" }
          },
          "cloud": { "provider": "AWS" },
          "src_endpoint": src_endpoint,
          "http_request": http_request
      }
      if rid == "" { ocsf.metadata.uid = uuid_v4() }
      if code > 0 { ocsf.http_response = { "code": code, "status": status_str } }
      if length(keys(fw)) > 0 { ocsf.firewall_rule = fw }

      unmapped = {}
      webacl = to_string(p.webaclId) ?? ""
      if webacl != "" { unmapped.web_acl_id = webacl }
      if waf_action != "" { unmapped.waf_action = waf_action }
      src_name = to_string(p.httpSourceName) ?? ""
      if src_name != "" { unmapped.http_source_name = src_name }
      src_id = to_string(p.httpSourceId) ?? ""
      if src_id != "" { unmapped.http_source_id = src_id }
      labels = array(p.labels) ?? []
      if length(labels) > 0 { unmapped.labels = encode_json(labels) }
      rgl = array(p.ruleGroupList) ?? []
      if length(rgl) > 0 { unmapped.rule_group_list = encode_json(rgl) }
      rbrl = array(p.rateBasedRuleList) ?? []
      if length(rbrl) > 0 { unmapped.rate_based_rule_list = encode_json(rbrl) }
      ntmr = array(p.nonTerminatingMatchingRules) ?? []
      if length(ntmr) > 0 { unmapped.non_terminating_matching_rules = encode_json(ntmr) }
      if length(keys(unmapped)) > 0 { ocsf.unmapped = unmapped }

      . = ocsf
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # Exact value representation is evaluated AFTER branch selection. Numeric strings
  # count as represented by their typed scalar; other transformations are explicit.
  __mapped = object!(parse_json!(encode_json(.)))
  __existing = object(__mapped.unmapped) ?? {}
  __discard = del(__mapped.raw_data)
  __discard = del(__mapped.unmapped)
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __represented = []
  __walk = map_values(__mapped, recursive: true) -> |value| {
      __represented = push(__represented, encode_json(value))
      if !is_object(value) && !is_array(value) && !is_null(value) {
          __represented = push(__represented, to_string(value) ?? "")
      }
      value
  }
  __consumed = []
  # BEGIN parser-specific transformations
  # action: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when the expected ID is emitted.
  # action: Parser normalizes the caption case; verify the emitted caption.
  # action: Parser normalizes the caption case; verify the emitted caption.
  # Only source keys read by this parser are eligible for exact-value consumption; the selected branch must emit the value. Unknown keys always spill, even when their value equals an OCSF default.
  __candidates = ["action", "httpRequest", "httpRequest.args", "httpRequest.clientIp", "httpRequest.country", "httpRequest.headers", "httpRequest.httpMethod", "httpRequest.httpVersion", "httpRequest.requestId", "httpRequest.uri", "httpSourceId", "httpSourceName", "labels", "nonTerminatingMatchingRules", "rateBasedRuleList", "responseCodeSent", "ruleGroupList", "terminatingRuleId", "terminatingRuleMatchDetails", "terminatingRuleType", "timestamp", "webaclId"]
  __preserve = []
  __rules = array!(parse_json!("[{\"source\":\"action\",\"kind\":\"enum\",\"target\":\"action_id\",\"values\":{\"allow\":1,\"allowed\":1,\"accept\":1,\"accepted\":1,\"permit\":1,\"permitted\":1,\"pass\":1,\"passed\":1,\"deny\":2,\"denied\":2,\"block\":2,\"blocked\":2,\"reject\":2,\"rejected\":2,\"drop\":2,\"dropped\":2,\"log\":3,\"observed\":3},\"reason\":\"Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when the expected ID is emitted.\"},{\"source\":\"action\",\"kind\":\"enum\",\"target\":\"disposition\",\"values\":{\"captcha\":\"Captcha\"},\"reason\":\"Parser normalizes the caption case; verify the emitted caption.\"},{\"source\":\"action\",\"kind\":\"enum\",\"target\":\"disposition\",\"values\":{\"count\":\"Count\"},\"reason\":\"Parser normalizes the caption case; verify the emitted caption.\"}]"))
  __source_flat = flatten(__source_kv)
  for_each(__rules) -> |_index, rule| {
      __source_key = string!(rule.source)
      __value = get!(__source_flat, [__source_key])
      __expected = null
      __valid = false
      if rule.kind == "lowercase" && is_string(__value) {
          __expected = downcase(string!(__value))
          __valid = true
      } else if rule.kind == "epoch_ms" {
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", string(rule.format) ?? "%+")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              __valid = true
          }
      } else if rule.kind == "scale" {
          __number, __number_err = to_float(__value)
          if __number_err == null && __value != null && !is_boolean(__value) {
              __expected = to_int(__number * to_float!(rule.factor))
              __valid = true
          }
      } else if rule.kind == "hex" {
          __hex = replace(downcase(string(__value) ?? ""), r'^0x', "")
          __integer, __integer_err = parse_int(__hex, base: 16)
          __expected = __integer
          __valid = is_string(__value) && starts_with(downcase(string(__value) ?? ""), "0x") && __integer_err == null
      } else if rule.kind == "enum" {
          __expected = get!(object!(rule.values), [downcase(to_string(__value) ?? "")])
          __valid = __expected != null
      }
      __matches = includes(__represented, encode_json(__expected))
      if is_string(rule.target) { __matches = get!(., split(string!(rule.target), ".")) == __expected }
      if __valid && __matches { __consumed = push(__consumed, __source_key) }
  }
  # END parser-specific transformations
  # Redact at every depth, including objects inside arrays, before serialization.
  __safe = map_values(object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing}))), recursive: true) -> |value| {
      if is_object(value) {
          # Header/parameter arrays commonly encode sensitive keys as name/value
          # or Key/Value objects instead of using the secret name as an object key.
          __sensitive_pair = false
          for_each(object!(value)) -> |key, child| {
              if includes(["name", "key"], downcase(key)) && match(downcase(string(child) ?? ""), r'password|secret|authorization|token') {
                  __sensitive_pair = true
              }
          }
          for_each(object!(value)) -> |key, _child| {
              if match(downcase(key), r'password|secret|authorization|token') || (__sensitive_pair && includes(["value", "values"], downcase(key))) {
                  value = set!(value, [key], "<redacted>")
              }
          }
      }
      value
  }
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  __escaped = map_keys(object!(__safe.source), recursive: true) -> |key| {
      replace(replace(key, "~", "~0"), ".", "~1")
  }
  __flat = flatten(__escaped)
  __residual = {}
  for_each(__flat) -> |key, value| {
      key = replace(replace(key, "~1", "."), "~0", "~")
      __same = includes(__represented, encode_json(value))
      if !is_object(value) && !is_array(value) && !is_null(value) {
          __same = __same || includes(__represented, to_string(value) ?? "")
      }
      # A scalar array is consumed only if every element is represented. Preserve
      # partially represented arrays intact, including their ordering and repeats.
      if is_array(value) && !is_empty(array!(value)) {
          __all_items = true
          for_each(array!(value)) -> |_index, item| {
              __item_same = includes(__represented, encode_json(item))
              if !is_object(item) && !is_array(item) && !is_null(item) {
                  __item_same = __item_same || includes(__represented, to_string(item) ?? "")
              }
              if is_object(item) || is_array(item) || !__item_same { __all_items = false }
          }
          __same = __same || __all_items
      }
      if __same && includes(__candidates, key) { __consumed = push(__consumed, key) }
      # Redacted leaves always remain visible. Do not spill a copy of the raw body.
      if (!includes(__consumed, key) || value == "<redacted>") && value != __raw_body {
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          __base = join!(__parts, ".")
          __key = __base
          __suffix = 2
          if includes(keys(__residual), __key) {
              for_each(__flat) -> |_other_key, _other_value| {
                  if includes(keys(__residual), __key) {
                      __key = __base + "_" + to_string(__suffix)
                      __suffix = __suffix + 1
                  }
              }
          }
          __complex = is_object(value)
          if is_array(value) {
              for_each(array!(value)) -> |_index, item| {
                  if is_object(item) || is_array(item) { __complex = true }
              }
          }
          __spill = if __complex { encode_json(value) } else { value }
          __residual = set!(__residual, [__key], __spill)
      }
  }
  # Keep existing derived evidence, but remove null placeholders and mapped copies.
  # Source-derived aliases are replaced by canonical dotted source paths above.
  __original_values = []
  for_each(flatten(__source_kv)) -> |_key, value| {
      __original_values = push(__original_values, encode_json(value))
      if !is_object(value) && !is_array(value) { __original_values = push(__original_values, to_string(value) ?? "") }
  }
  for_each(flatten(__existing)) -> |key, value| {
      __source_alias = includes(__original_values, encode_json(value)) || includes(__original_values, to_string(value) ?? "")
      __mapped_alias = includes(__represented, encode_json(value)) || includes(__represented, to_string(value) ?? "")
      __decoded, __decode_err = parse_json(string(value) ?? "")
      __encoded_container = __decode_err == null && (is_object(__decoded) || is_array(__decoded))
      if !is_null(value) && value != "" && !__source_alias && !__mapped_alias && !__encoded_container && value != __raw_body {
          # Existing aggregates may contain sensitive descendants; the canonical
          # source spill above is the authoritative representation of containers.
          if !is_array(value) && !is_object(value) && !match(downcase(key), r'password|secret|authorization|token') {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, with recursive
  # redaction. These entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__safe.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill
