source: mixed
transforms:
- source: epoch
  kind: scale
  factor: 1000
  target: time
  reason: Signal-handler Unix seconds converted to event milliseconds.
- source: timestamp
  kind: scale
  factor: 1000
  target: time
  reason: MONITOR Unix seconds with microseconds converted to event milliseconds.
consumed_candidates:
- args
- client
- count
- db
- level
- msg
- object
- timestamp-created
- time
- timestamp
- username
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
