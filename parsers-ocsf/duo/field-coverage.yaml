source: json
transforms:
- source: isotimestamp
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: username
  kind: lowercase
  target: actor.user.name
  reason: Case normalization already performed by the parser; observed at actor.user.name, and checked
    against the emitted branch.
- source: username
  kind: lowercase
  target: user.name
  reason: Case normalization already performed by the parser; observed at actor.user.name, and checked
    against the emitted branch.
- source: result
  kind: enum
  target: status_id
  values:
    success: 1
    succeeded: 1
    failure: 2
    failed: 2
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when
    the expected ID is emitted.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  access_device.hostname:
  - src_endpoint.hostname
  access_device.ip:
  - src_endpoint.ip
  action:
  - api.operation
  - metadata.event_code
  application.key:
  - service.uid
  application.name:
  - service.name
  description:
  - message
  email:
  - user.email_addr
  eventtype:
  - api.operation
  - message
  - metadata.event_code
  - resources.type
  factor:
  - auth_protocol
  ip_address:
  - src_endpoint.ip
  object:
  - group.name
  - resources.name
  - user.name
  reason:
  - status_detail
  txid:
  - metadata.original_event_uid
  - metadata.uid
  - session.uid
  user.key:
  - user.uid
  username:
  - user.name
