name: pfsense_ocsf
display_name: pfSense / OPNsense (OCSF)
version: "1.0.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses pfSense and OPNsense syslog (RFC 3164 or RFC 5424) into OCSF 1.9.0.
  The filterlog CSV packet log (IPv4 and IPv6; TCP, UDP, ICMP and any other
  protocol) becomes Network Activity (4001): pass is activity Traffic with
  action Allowed, block and reject are activity Refuse with action Denied,
  the rule tracker id becomes firewall_rule.uid, and the in / out column
  becomes connection_info.direction_id Inbound / Outbound with the logging
  interface on the ingress (src) or egress (dst) endpoint. unbound query and reply
  lines become DNS Activity (4003), dhcpd lease messages become DHCP
  Activity (4004), and OpenVPN user authentication lines become
  Authentication (3002). Every other program on the box (dhcp6c, php-fpm,
  OpenVPN TLS chatter, flowd, ...) becomes Base Event (0) with the syslog
  header parsed; a line with no recognizable syslog header is a Base Event
  marked with unmapped.parse_fallback.
  Timestamps without an offset use the log source's timezone setting (UTC if unset).
match_values:
  - pfsense
category: network
vendor: "Netgate / Deciso"
product: "pfSense / OPNsense"
parser_vrl: |
  # NAN source timezone. Generated by scripts/residual_spill.py; edit scripts/residual/source_tz.vrl.
  # The log source's timezone setting arrives as .nano.source_timezone (an IANA
  # name such as "America/New_York", or any fixed offset such as "+05:30"), set
  # by nano at ingest. .nano is nano's input, never part of the log: it is
  # removed whole before anything else, whatever its shape.
  # For a clock that carries no offset a parser parses it AS UTC and sets
  # __lc_pending; the generated local-clock block that follows the parse
  # (local_clock.vrl) turns it into real UTC with this setting, and the spill
  # records the zone used as unmapped.nano_time_assumed_tz (the name, the offset
  # as +HH:MM, or "UTC" when the setting is absent, invalid or "local").
  __src_nano = del(.nano)
  __src_tz_in = ""
  if is_object(__src_nano) { __src_tz_in = strip_whitespace(to_string(object!(__src_nano).source_timezone) ?? "") }
  __src_tz = "UTC"
  __src_shift_ms = 0
  __src_tz_label = "UTC"
  __time_assumed = false
  __time_inline = false
  __lc_pending = false
  __lc_shifted = ""
  __src_off = parse_regex(__src_tz_in, r'^(?P<sign>[+-])(?P<h>\d{2}):?(?P<m>\d{2})$') ?? {}
  if !is_empty(__src_off) {
      __src_h = to_int(__src_off.h) ?? 99
      __src_m = to_int(__src_off.m) ?? 99
      if __src_h <= 14 && __src_m <= 59 {
          __src_shift_ms = (__src_h * 3600 + __src_m * 60) * 1000
          if __src_off.sign == "-" { __src_shift_ms = 0 - __src_shift_ms }
          if __src_shift_ms != 0 { __src_tz_label = string!(__src_off.sign) + string!(__src_off.h) + ":" + string!(__src_off.m) }
      }
  } else if __src_tz_in != "" && downcase(__src_tz_in) != "local" {
      # "local" (the Vector host's zone) would make the time depend on the host.
      __src_probe, __src_probe_err = parse_timestamp("2000-01-01 00:00:00", "%Y-%m-%d %H:%M:%S", timezone: __src_tz_in)
      if __src_probe_err == null { __src_tz = __src_tz_in; __src_tz_label = __src_tz_in }
  }
  # A clock with no year: the current year in the source's zone, and the latest
  # leap year for a Feb 29 (the local-clock block then picks the nearest year).
  __src_now_ms = to_unix_timestamp(now(), unit: "milliseconds")
  __src_year = format_timestamp(from_unix_timestamp!(__src_now_ms + __src_shift_ms, unit: "milliseconds"), "%Y", timezone: __src_tz) ?? format_timestamp!(now(), "%Y")
  __src_leap_year = to_int(__src_year) ?? 2000
  if mod(__src_leap_year, 4) != 0 || (mod(__src_leap_year, 100) == 0 && mod(__src_leap_year, 400) != 0) { __src_leap_year = __src_leap_year - mod(__src_leap_year, 4) }
  __src_leap_year = to_string(__src_leap_year)
  # END NAN source timezone
  # pfSense / OPNsense -> OCSF 1.9.0 Network Activity (4001) / DNS Activity
  # (4003) / DHCP Activity (4004) / Authentication (3002) / Base Event (0)
  raw_log = if is_string(.message) { string!(.message) } else { encode_json(.) }
  __raw_body = raw_log
  __source_kv = {}

  time_ms = to_int(to_unix_timestamp(now(), unit: "milliseconds"))
  header_ok = false
  host = ""
  prog = ""
  msg = raw_log
  sev_num = 6

  # ---- syslog header: RFC 5424 first, then RFC 3164 ----
  h5, h5e = parse_regex(raw_log, r'^<(?P<pri>\d{1,3})>1\s+(?P<ts>\S+)\s+(?P<host>\S+)\s+(?P<prog>\S+)\s+(?P<pid>\S+)\s+(?P<msgid>\S+)\s+(?P<sd>-|(?:\x5B(?:[^\x5D\\]|\\.)*\x5D)+)\s?(?P<msg>.*)$')
  if h5e == null {
      header_ok = true
      hdr = { "pri": h5.pri, "ts": h5.ts, "host": h5.host, "prog": h5.prog, "pid": h5.pid }
      if h5.msgid != "-" { hdr.msgid = h5.msgid }
      if h5.sd != "-" { hdr.structured_data = h5.sd }
      __source_kv.header = hdr
      host = string(h5.host) ?? ""
      prog = string(h5.prog) ?? ""
      msg = string(h5.msg) ?? ""
      sev_num = mod(to_int(h5.pri) ?? 6, 8)
      t5, t5e = parse_timestamp(string(h5.ts) ?? "", "%+", timezone: "UTC")
      if t5e == null { time_ms = to_unix_timestamp(t5, unit: "milliseconds") }
  } else {
      h3, h3e = parse_regex(raw_log, r'^(?:<(?P<pri>\d{1,3})>)?(?P<ts>[A-Z][a-z]{2}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2})\s+(?:(?P<host>[^\s\x5B]+)\s+)?(?P<prog>[A-Za-z0-9_./-]+)(?:\x5B(?P<pid>\d+)\x5D)?:\s?(?P<msg>.*)$')
      if h3e == null {
          header_ok = true
          hdr = { "ts": h3.ts, "prog": h3.prog }
          if h3.pri != null { hdr.pri = h3.pri; sev_num = mod(to_int(h3.pri) ?? 6, 8) }
          if h3.host != null { hdr.host = h3.host; host = string!(h3.host) }
          if h3.pid != null { hdr.pid = h3.pid }
          __source_kv.header = hdr
          prog = string(h3.prog) ?? ""
          msg = string(h3.msg) ?? ""
          ts_str = replace(string(h3.ts) ?? "", r'\s+', " ")
          t3, t3e = parse_timestamp(ts_str + " " + __src_year, "%b %d %H:%M:%S %Y", timezone: "UTC")
          if t3e != null { t3, t3e = parse_timestamp(ts_str + " " + __src_leap_year, "%b %d %H:%M:%S %Y", timezone: "UTC") }
          if t3e == null { __lc_pending = true }
          # NAN local clock: t3 noyear
          # t3 was just parsed from a clock WITHOUT an offset, read as UTC
          # (__lc_pending). It becomes real UTC here, at the site, with the log source's
          # timezone (__src_tz / __src_shift_ms from the prelude, or an inline IANA zone
          # the parser validated): a fixed offset by arithmetic; an IANA zone with its DST
          # rules, probed 18 h either side (wider than any UTC offset), an ambiguous
          # fall-back time taking its FIRST occurrence (the earlier offset), a time in a
          # spring-forward gap moving forward by the gap. __NOYEAR__: a clock with no
          # year is tried in its year, the year before and the year after (each with its
          # own DST rules); more than a day in the future means last year, more than 180
          # days in the past means next year when that is not in the future.
          if __lc_pending {
              __lc_pending = false
              __time_assumed = true
              __lc_l = to_unix_timestamp(t3, unit: "milliseconds")
              __lc_cands = [__lc_l]
              if true {
                  __lc_s = format_timestamp!(t3, "%Y-%m-%d %H:%M:%S%.3f")
                  __lc_y = to_int(slice!(__lc_s, 0, 4)) ?? 0
                  __lc_p, __lc_pe = parse_timestamp(to_string(__lc_y - 1) + slice!(__lc_s, 4), "%Y-%m-%d %H:%M:%S%.3f", timezone: "UTC")
                  __lc_n, __lc_ne = parse_timestamp(to_string(__lc_y + 1) + slice!(__lc_s, 4), "%Y-%m-%d %H:%M:%S%.3f", timezone: "UTC")
                  __lc_pm = null
                  if __lc_pe == null { __lc_pm = to_unix_timestamp(__lc_p, unit: "milliseconds") }
                  __lc_nm = null
                  if __lc_ne == null { __lc_nm = to_unix_timestamp(__lc_n, unit: "milliseconds") }
                  __lc_cands = [__lc_l, __lc_pm, __lc_nm]
              }
              __lc_us = map_values(__lc_cands) -> |l| {
                  if l == null {
                      null
                  } else {
                      __u = int!(l) - __src_shift_ms
                      if __src_tz != "UTC" {
                          __offs = map_values([int!(l) - 64800000, int!(l) + 64800000]) -> |at| {
                              __z = format_timestamp(from_unix_timestamp!(at, unit: "milliseconds"), "%z", timezone: __src_tz) ?? "+0000"
                              __o = ((to_int(slice(__z, 1, 3) ?? "0") ?? 0) * 3600 + (to_int(slice(__z, 3, 5) ?? "0") ?? 0) * 60) * 1000
                              if starts_with(__z, "-") { 0 - __o } else { __o }
                          }
                          __oa = int!(__offs[0])
                          __ob = int!(__offs[1])
                          __u = int!(l) - __oa
                          if __oa != __ob {
                              __ok = map_values([int!(l) - __oa, int!(l) - __ob]) -> |at| {
                                  __z = format_timestamp(from_unix_timestamp!(at, unit: "milliseconds"), "%z", timezone: __src_tz) ?? "+0000"
                                  __o = ((to_int(slice(__z, 1, 3) ?? "0") ?? 0) * 3600 + (to_int(slice(__z, 3, 5) ?? "0") ?? 0) * 60) * 1000
                                  if starts_with(__z, "-") { 0 - __o } else { __o }
                              }
                              if int!(__ok[0]) != __oa && int!(__ok[1]) == __ob { __u = int!(l) - __ob }
                          }
                      }
                      __u
                  }
              }
              __lc_u = int!(__lc_us[0])
              if true {
                  if __lc_u > __src_now_ms + 86400000 && __lc_us[1] != null {
                      __lc_u = int!(__lc_us[1])
                  } else if __lc_u < __src_now_ms - 15552000000 && __lc_us[2] != null && int!(__lc_us[2]) <= __src_now_ms + 86400000 {
                      __lc_u = int!(__lc_us[2])
                  }
              }
              # Remembered (local -> UTC) so a transforms rule on the same source clock
              # still finds it at its target.
              if __lc_u != __lc_l { __lc_shifted = __lc_shifted + "\n" + to_string(__lc_l) + "\t" + to_string(__lc_u) + "\n" }
              t3 = from_unix_timestamp!(__lc_u, unit: "milliseconds")
          }
          # END NAN local clock
          if t3e == null { time_ms = to_unix_timestamp(t3, unit: "milliseconds") }
      }
  }
  prog = replace(prog, r'^/', "")

  severity_id = 1
  severity = "Informational"
  if sev_num == 0 { severity_id = 6; severity = "Fatal" }
  if sev_num == 1 || sev_num == 2 { severity_id = 5; severity = "Critical" }
  if sev_num == 3 { severity_id = 4; severity = "High" }
  if sev_num == 4 { severity_id = 3; severity = "Medium" }
  if sev_num == 5 { severity_id = 2; severity = "Low" }

  metadata = {
      "version": "1.9.0",
      "uid": sha2("pfsense|raw|" + raw_log, variant: "SHA-256"),
      "profiles": ["host", "security_control"],
      "log_name": "pfsense",
      "log_provider": prog,
      "product": { "name": "pfSense / OPNsense", "vendor_name": "Netgate / Deciso" }
  }
  if prog == "" { __d = del(metadata.log_provider) }
  device = {}
  if host != "" { device = { "hostname": host, "type_id": 9, "type": "Firewall" } }

  route = "base"
  activity_id = 99
  activity_name = "Other"
  action_id = 0
  action = "Unknown"
  disposition_id = 0
  disposition = "Unknown"
  status_id = 0
  status_str = "Unknown"
  src = {}
  dst = {}
  conn = {}
  rule_uid = ""
  pkt_len = 0
  query = {}
  rcode = ""
  user_name = ""
  dhcp_type = ""

  if header_ok && prog == "filterlog" {
      # ================= filterlog CSV =================
      f = split(msg, ",")
      n = length(f)
      if n >= 9 {
          fl = {
              "rule_number": f[0], "sub_rule": f[1], "anchor": f[2], "tracker": f[3],
              "interface": f[4], "reason": f[5], "action": f[6], "direction": f[7],
              "ip_version": f[8]
          }
          ipver = string(f[8]) ?? ""
          proto_name = ""
          proto_num = -1
          rest_at = -1
          if ipver == "4" && n >= 20 {
              fl.tos = f[9]; fl.ecn = f[10]; fl.ttl = f[11]; fl.id = f[12]; fl.offset = f[13]
              fl.ip_flags = f[14]; fl.protocol_id = f[15]; fl.protocol = f[16]; fl.length = f[17]
              fl.src_ip = f[18]; fl.dst_ip = f[19]
              proto_num = to_int(f[15]) ?? -1
              proto_name = downcase(string(f[16]) ?? "")
              pkt_len = to_int(f[17]) ?? 0
              rest_at = 20
          } else if ipver == "6" && n >= 17 {
              fl.class = f[9]; fl.flow_label = f[10]; fl.hop_limit = f[11]; fl.protocol = f[12]
              fl.protocol_id = f[13]; fl.length = f[14]; fl.src_ip = f[15]; fl.dst_ip = f[16]
              proto_num = to_int(f[13]) ?? -1
              proto_name = downcase(string(f[12]) ?? "")
              pkt_len = to_int(f[14]) ?? 0
              rest_at = 17
          }
          if rest_at > 0 {
              rest = slice(f, rest_at) ?? []
              if proto_num == 6 && length(rest) >= 3 {
                  fl.src_port = rest[0]; fl.dst_port = rest[1]; fl.data_length = rest[2]
                  if length(rest) >= 9 {
                      fl.tcp_flags = rest[3]; fl.sequence = rest[4]; fl.ack = rest[5]
                      fl.window = rest[6]; fl.urg = rest[7]; fl.tcp_options = rest[8]
                  }
              } else if proto_num == 17 && length(rest) >= 3 {
                  fl.src_port = rest[0]; fl.dst_port = rest[1]; fl.data_length = rest[2]
              } else if (proto_num == 1 || proto_num == 58) && length(rest) >= 1 {
                  fl.icmp_type = rest[0]
                  # everything after the ICMP type, as logged (id,seq / unreach detail / ...)
                  if length(rest) > 1 { fl.icmp_data = string(get(split(msg, ",", limit: rest_at + 2), [rest_at + 1]) ?? "") ?? "" }
              } else if length(rest) > 0 {
                  fl.protocol_data = string(get(split(msg, ",", limit: rest_at + 1), [rest_at]) ?? "") ?? ""
              }
          }
          # Empty CSV columns (unused anchor, ECN, ACK, ...) carry no value.
          fl = compact(fl, string: true, null: true)
          __source_kv.filter = fl

          if rest_at > 0 {
              route = "network"
              act = downcase(string(f[6]) ?? "")
              if act == "pass" {
                  activity_id = 6; activity_name = "Traffic"
                  action_id = 1; action = "Allowed"; disposition_id = 1; disposition = "Allowed"
                  status_id = 1; status_str = "Success"
              } else if act == "block" || act == "reject" {
                  activity_id = 5; activity_name = "Refuse"
                  action_id = 2; action = "Denied"; disposition_id = 2; disposition = "Blocked"
                  status_id = 2; status_str = "Failure"
              }
              sip = string(fl.src_ip) ?? ""
              dip = string(fl.dst_ip) ?? ""
              if sip != "" { src.ip = sip }
              if dip != "" { dst.ip = dip }
              sp = to_int(fl.src_port) ?? 0
              dp = to_int(fl.dst_port) ?? 0
              if sp > 0 { src.port = sp }
              if dp > 0 { dst.port = dp }
              iface = string(f[4]) ?? ""
              # filterlog direction is relative to the interface that logged the
              # packet: "in" arrived on it (ingress), "out" left through it (egress).
              pdir = downcase(string(f[7]) ?? "")
              conn = { "direction_id": 0 }
              if pdir == "in" {
                  conn = { "direction_id": 1, "direction": "Inbound" }
                  if iface != "" { src.interface_name = iface }
              } else if pdir == "out" {
                  conn = { "direction_id": 2, "direction": "Outbound" }
                  if iface != "" { dst.interface_name = iface }
              } else if iface != "" {
                  src.interface_name = iface
              }
              if proto_num >= 0 { conn.protocol_num = proto_num }
              if proto_name != "" { conn.protocol_name = proto_name }
              if proto_num == 1 && proto_name == "" { conn.protocol_name = "icmp" }
              rule_uid = string(f[3]) ?? ""
              if rule_uid == "" { rule_uid = string(f[0]) ?? "" }
          }
      }
  } else if header_ok && prog == "unbound" {
      # ================= unbound query / reply log =================
      um, ue = parse_regex(msg, r'^\x5B(?P<thread>[^\x5D]+)\x5D\s+(?P<level>\w+):\s+(?P<client>[0-9A-Fa-f.:]+)\s+(?P<qname>\S+)\s+(?P<qtype>[A-Z0-9]+)\s+(?P<qclass>[A-Z]+)(?:\s+(?P<rcode>[A-Z]+)\s+(?P<duration>[0-9.]+)\s+(?P<cached>\d)\s+(?P<size>\d+))?\s*$')
      if ue == null {
          __source_kv.dns = um
          route = "dns"
          qn = replace(string(um.qname) ?? "", r'\.$', "")
          query = { "hostname": qn, "type": um.qtype, "class": um.qclass }
          src.ip = um.client
          activity_id = 1; activity_name = "Query"
          action_id = 1; action = "Allowed"; disposition_id = 1; disposition = "Allowed"
          status_id = 1; status_str = "Success"
          if um.rcode != null {
              activity_id = 2; activity_name = "Response"
              rcode = string!(um.rcode)
              if rcode != "NOERROR" { status_id = 2; status_str = "Failure" }
          }
      }
  } else if header_ok && prog == "dhcpd" {
      # ================= ISC dhcpd =================
      dm, de = parse_regex(msg, r'^(?P<type>DHCP[A-Z]+)\s+(?:(?:on|for|of)\s+(?P<ip>[0-9.]+)\s+(?:\x28(?P<server>[0-9.]+)\x29\s+)?(?:to|from)\s+|from\s+)?(?P<mac>(?:[0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2})?\s*(?:\x28(?P<hostname>[^\x29]*)\x29)?\s*(?:via\s+(?P<via>\S+))?')
      if de == null {
          route = "dhcp"
          dcap = { "type": dm.type }
          if dm.ip != null { dcap.ip = dm.ip }
          if dm.server != null { dcap.server = dm.server }
          if dm.mac != null { dcap.mac = dm.mac }
          if dm.hostname != null { dcap.hostname = dm.hostname }
          if dm.via != null { dcap.via = dm.via }
          __source_kv.dhcp = dcap
          dhcp_type = string!(dm.type)
          if dhcp_type == "DHCPDISCOVER" { activity_id = 1; activity_name = "Discover" }
          if dhcp_type == "DHCPOFFER" { activity_id = 2; activity_name = "Offer" }
          if dhcp_type == "DHCPREQUEST" { activity_id = 3; activity_name = "Request" }
          if dhcp_type == "DHCPDECLINE" { activity_id = 4; activity_name = "Decline" }
          if dhcp_type == "DHCPACK" { activity_id = 5; activity_name = "Ack" }
          if dhcp_type == "DHCPNAK" { activity_id = 6; activity_name = "Nak" }
          if dhcp_type == "DHCPRELEASE" { activity_id = 7; activity_name = "Release" }
          if dhcp_type == "DHCPINFORM" { activity_id = 8; activity_name = "Inform" }
          status_id = 1; status_str = "Success"
          if activity_id == 4 || activity_id == 6 { status_id = 2; status_str = "Failure" }
          if dm.ip != null { src.ip = dm.ip }
          if dm.mac != null { src.mac = downcase(string!(dm.mac)) }
          if dm.hostname != null && dm.hostname != "" { src.hostname = dm.hostname }
          # A DISCOVER client has no address yet: its MAC is its only identity.
          if !exists(src.ip) && !exists(src.hostname) && exists(src.mac) { src.uid = src.mac }
          dst = { "svc_name": "dhcp", "port": 67 }
          if dm.via != null { dst.interface_name = dm.via }
          if dm.server != null { dst.ip = dm.server }
      }
  } else if header_ok && prog == "openvpn" {
      # ================= OpenVPN user authentication =================
      om, oe = parse_regex(msg, r'^(?:(?P<client>[0-9A-Fa-f.:]+):(?P<client_port>\d+)\s+)?user\s+\x27(?P<user>[^\x27]+)\x27\s+(?P<result>authenticated|could not authenticate)')
      if oe == null {
          route = "auth"
          ocap = { "user": om.user, "result": om.result }
          if om.client != null { ocap.client = om.client; ocap.client_port = om.client_port }
          __source_kv.openvpn = ocap
          user_name = string!(om.user)
          activity_id = 1; activity_name = "Logon"
          if om.result == "authenticated" {
              status_id = 1; status_str = "Success"
              action_id = 1; action = "Allowed"; disposition_id = 1; disposition = "Allowed"
          } else {
              status_id = 2; status_str = "Failure"
              action_id = 2; action = "Denied"; disposition_id = 2; disposition = "Blocked"
              if severity_id < 2 { severity_id = 2; severity = "Low" }
          }
          if om.client != null { src.ip = om.client; src.port = to_int(om.client_port) ?? 0 }
      } else {
          pm, pe = parse_regex(msg, r'^(?P<client>[0-9A-Fa-f.:]+):(?P<client_port>\d+)\s+\x5B(?P<user>[^\x5D]+)\x5D\s+Peer Connection Initiated with')
          if pe == null {
              route = "auth"
              __source_kv.openvpn = { "client": pm.client, "client_port": pm.client_port, "user": pm.user }
              user_name = string!(pm.user)
              activity_id = 1; activity_name = "Logon"
              status_id = 1; status_str = "Success"
              action_id = 1; action = "Allowed"; disposition_id = 1; disposition = "Allowed"
              src.ip = pm.client
              src.port = to_int(pm.client_port) ?? 0
          }
      }
  }

  base = {
      "severity_id": severity_id,
      "severity": severity,
      "time": time_ms,
      "raw_data": raw_log,
      "metadata": metadata
  }

  if route == "network" {
      . = merge(base, {
          "class_uid": 4001, "class_name": "Network Activity",
          "category_uid": 4, "category_name": "Network Activity",
          "activity_id": activity_id, "activity_name": activity_name,
          "type_uid": 400100 + activity_id,
          "status_id": status_id, "status": status_str,
          "action_id": action_id, "action": action,
          "disposition_id": disposition_id, "disposition": disposition,
          "connection_info": conn
      })
      if length(src) > 0 { .src_endpoint = src }
      if length(dst) > 0 { .dst_endpoint = dst }
      if pkt_len > 0 { .traffic = { "bytes_out": pkt_len, "packets_out": 1 } }
      if rule_uid != "" { .firewall_rule = { "uid": rule_uid } }
  } else if route == "dns" {
      . = merge(base, {
          "class_uid": 4003, "class_name": "DNS Activity",
          "category_uid": 4, "category_name": "Network Activity",
          "activity_id": activity_id, "activity_name": activity_name,
          "type_uid": 400300 + activity_id,
          "status_id": status_id, "status": status_str,
          "action_id": action_id, "action": action,
          "disposition_id": disposition_id, "disposition": disposition,
          "query": query,
          "src_endpoint": src,
          "dst_endpoint": { "svc_name": "dns", "port": 53 }
      })
      if host != "" { .dst_endpoint.hostname = host }
      if rcode != "" {
          .rcode = rcode
          rc = { "NOERROR": 0, "FORMERR": 1, "SERVFAIL": 2, "NXDOMAIN": 3, "NOTIMP": 4, "REFUSED": 5 }
          .rcode_id = get(rc, [rcode]) ?? 99
      }
  } else if route == "dhcp" {
      . = merge(base, {
          "class_uid": 4004, "class_name": "DHCP Activity",
          "category_uid": 4, "category_name": "Network Activity",
          "activity_id": activity_id, "activity_name": activity_name,
          "type_uid": 400400 + activity_id,
          "status_id": status_id, "status": status_str,
          "dst_endpoint": dst
      })
      if dhcp_type != "" { .metadata.event_code = dhcp_type }
      if length(src) > 0 { .src_endpoint = src }
  } else if route == "auth" {
      . = merge(base, {
          "class_uid": 3002, "class_name": "Authentication",
          "category_uid": 3, "category_name": "Identity & Access Management",
          "activity_id": activity_id, "activity_name": activity_name,
          "type_uid": 300200 + activity_id,
          "status_id": status_id, "status": status_str,
          "action_id": action_id, "action": action,
          "disposition_id": disposition_id, "disposition": disposition,
          "user": { "name": user_name },
          "is_remote": true,
          "service": { "name": "OpenVPN" },
          "logon_type": "VPN"
      })
      if length(src) > 0 { .src_endpoint = src }
      if host != "" { .dst_endpoint = { "hostname": host } }
  } else {
      . = merge(base, {
          "class_uid": 0, "class_name": "Base Event",
          "category_uid": 0, "category_name": "Uncategorized",
          "activity_id": 99, "activity_name": "Other",
          "type_uid": 99,
          "status_id": 0, "status": "Unknown"
      })
      if header_ok {
          .message = msg
          __source_kv.message = msg
      } else {
          . = set!(., ["unmapped", "parse_fallback"], "unparsable input")
      }
  }
  if length(device) > 0 { .device = device }

  .

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # Values spill exactly as parsed: a parser never masks, redacts or withholds
  # anything (masking is an opt-in pipeline step, never a parser concern).
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # A source field is consumed ONLY by an explicit mapping: a field-coverage.yaml
  # `mappings` entry (source key -> target paths) or a `transforms` rule with a
  # target, whose value is found AT THAT TARGET PATH of the selected branch. A
  # value that merely appears somewhere else in the event never consumes a field
  # (no coincidental consumption); everything else spills.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The sets below are strings instead
  # (a read shares the buffer). __repr holds one member per mapped leaf:
  # "," + encode_json(path) + "=" + encode_json(encode_json(value)), plus the
  # to_string form for a string or a float, so a numeric string is represented by
  # its typed scalar. Every part is a JSON text, inside which a '"' is always
  # escaped, so a member is matched exactly. Paths drop array indices
  # (resources.0.uid is resources.uid); arrays are walked two levels deep, and a
  # leaf deeper than that is simply not mapping evidence (it can only spill more).
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped = object!(parse_json!(encode_json(__mapped)))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __copy = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __repr = ""
  for_each(flatten(__mapped)) -> |path, value| {
      __p = encode_json(path)
      if is_array(value) {
          for_each(array!(value)) -> |_i, item| {
              if is_object(item) {
                  for_each(flatten(object!(item))) -> |sub, leaf| {
                      __q = encode_json(path + "." + sub)
                      if is_array(leaf) {
                          for_each(array!(leaf)) -> |_j, x| {
                              if !is_object(x) && !is_array(x) {
                                  __repr = __repr + ("," + __q + "=" + encode_json(encode_json(x)))
                                  if is_string(x) || is_float(x) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(x))) }
                              }
                          }
                      } else {
                          __repr = __repr + ("," + __q + "=" + encode_json(encode_json(leaf)))
                          if is_string(leaf) || is_float(leaf) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(leaf))) }
                      }
                  }
              } else if !is_array(item) {
                  __repr = __repr + ("," + __p + "=" + encode_json(encode_json(item)))
                  if is_string(item) || is_float(item) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(item))) }
              }
          }
      } else {
          __repr = __repr + ("," + __p + "=" + encode_json(encode_json(value)))
          if is_string(value) || is_float(value) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(value))) }
      }
  }
  __consumed = ""
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__copy.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # BEGIN parser-specific transformations
  # header.ts: RFC 5424 timestamp converted to event milliseconds; RFC 3164 clocks carry no year and remain residual.
  # filter.protocol: filterlog protocol names (UDP on IPv6) are lowercased into connection_info.protocol_name.
  # filter.action: filterlog verdict normalized to the OCSF action; consume only when the expected ID is emitted.
  # dhcp.mac: Client MAC lowercased into src_endpoint.mac.
  # dhcp.mac: Client MAC lowercased into src_endpoint.mac.
  # filter.direction: filterlog packet direction normalized to the OCSF direction id.
  for_each(__flat) -> |key, value| {
      if match(key, r'(?x)
      \A(?:
        header\.ts
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%+", timezone: "UTC")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              # A clock the local-clock block moved to real UTC (the log source's
              # timezone, a year rollover) is matched by its converted value.
              if __lc_shifted != "" && !(contains(__repr, "," + "\"time\"" + "=" + encode_json(encode_json(__expected)))) {
                  __lc_at = find(__lc_shifted, "\n" + to_string(__expected) + "\t")
                  if is_integer(__lc_at) {
                      __lc_rest = slice!(__lc_shifted, int!(__lc_at) + strlen(to_string(__expected)) + 2)
                      __expected = to_int(slice!(__lc_rest, 0, int!(find(__lc_rest, "\n")))) ?? __expected
                  }
              }
              if contains(__repr, "," + "\"time\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        filter\.protocol
      )\z') {
          __value = value
          if is_string(__value) {
              __expected = downcase(string!(__value))
              if contains(__repr, "," + "\"connection_info.protocol_name\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        filter\.action
      )\z') {
          __value = value
          if __value != null {
              __expected = get!({"pass": 1, "block": 2, "reject": 2}, [downcase(to_string(__value) ?? "")])
              if __expected != null {
                  if contains(__repr, "," + "\"action_id\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
              }
          }
      }
      if match(key, r'(?x)
      \A(?:
        dhcp\.mac
      )\z') {
          __value = value
          if is_string(__value) {
              __expected = downcase(string!(__value))
              if contains(__repr, "," + "\"src_endpoint.mac\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        dhcp\.mac
      )\z') {
          __value = value
          if is_string(__value) {
              __expected = downcase(string!(__value))
              if contains(__repr, "," + "\"src_endpoint.uid\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        filter\.direction
      )\z') {
          __value = value
          if __value != null {
              __expected = get!({"in": 1, "out": 2}, [downcase(to_string(__value) ?? "")])
              if __expected != null {
                  if contains(__repr, "," + "\"connection_info.direction_id\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
              }
          }
      }
  }
  # Declared source -> target mappings (field-coverage.yaml `mappings`).
  __decl = "\n\"header.host\"\t[\"device.hostname\",\"dst_endpoint.hostname\"]\n\"header.prog\"\t[\"metadata.log_provider\"]\n\"filter.tracker\"\t[\"firewall_rule.uid\"]\n\"filter.interface\"\t[\"dst_endpoint.interface_name\",\"src_endpoint.interface_name\"]\n\"filter.protocol\"\t[\"connection_info.protocol_name\"]\n\"filter.protocol_id\"\t[\"connection_info.protocol_num\"]\n\"filter.src_ip\"\t[\"src_endpoint.ip\"]\n\"filter.dst_ip\"\t[\"dst_endpoint.ip\"]\n\"filter.src_port\"\t[\"src_endpoint.port\"]\n\"filter.dst_port\"\t[\"dst_endpoint.port\"]\n\"filter.length\"\t[\"traffic.bytes_out\"]\n\"dns.client\"\t[\"src_endpoint.ip\"]\n\"dns.qtype\"\t[\"query.type\"]\n\"dns.qclass\"\t[\"query.class\"]\n\"dns.rcode\"\t[\"rcode\"]\n\"dhcp.type\"\t[\"metadata.event_code\"]\n\"dhcp.ip\"\t[\"src_endpoint.ip\"]\n\"dhcp.server\"\t[\"dst_endpoint.ip\"]\n\"dhcp.mac\"\t[\"src_endpoint.mac\",\"src_endpoint.uid\"]\n\"dhcp.hostname\"\t[\"src_endpoint.hostname\"]\n\"dhcp.via\"\t[\"dst_endpoint.interface_name\"]\n\"openvpn.user\"\t[\"user.name\"]\n\"openvpn.client\"\t[\"src_endpoint.ip\"]\n\"openvpn.client_port\"\t[\"src_endpoint.port\"]\n\"message\"\t[\"message\"]\n"
  __preserve = []
  # END parser-specific transformations
  # Declared mappings: __decl holds "\n" + encode_json(key) + "\t" + JSON array of
  # target paths + "\n" per mapped source key (a raw newline never occurs in
  # compact JSON). A key is consumed when its value, or every element of a scalar
  # array, is at one of its own targets. Keys stay ESCAPED here and in __consumed:
  # a literal dotted key ("a~1b") and the nested path ("a.b") are different
  # fields, and mapping one never consumes the other.
  for_each(__flat) -> |key, value| {
      # __decl spells a bracket inside a key as a \u escape (deploy bracket count).
      __kt = encode_json(key)
      if match(__kt, r'[\x28\x29\x5B\x5D\x7B\x7D]') {
          __kt = replace(replace(replace(replace(replace(replace(__kt, r'\x28', "\\u0028"), r'\x29', "\\u0029"), r'\x5B', "\\u005b"), r'\x5D', "\\u005d"), r'\x7B', "\\u007b"), r'\x7D', "\\u007d")
      }
      __at = find(__decl, "\n" + __kt + "\t")
      if is_integer(__at) && !is_object(value) {
          __rest = slice!(__decl, int!(__at) + strlen(__kt) + 2)
          __hit = false
          for_each(array!(parse_json!(slice!(__rest, 0, int!(find(__rest, "\n")))))) -> |_i, target| {
              __tok = "," + encode_json(target) + "="
              if !__hit && is_array(value) {
                  __all = !is_empty(array!(value))
                  for_each(array!(value)) -> |_j, item| {
                      if __all {
                          __all = !is_object(item) && !is_array(item) && (contains(__repr, __tok + encode_json(encode_json(item))) || ((is_string(item) || is_float(item)) && contains(__repr, __tok + encode_json(to_string!(item)))))
                      }
                  }
                  __hit = __all
              } else if !__hit {
                  __hit = contains(__repr, __tok + encode_json(encode_json(value))) || ((is_string(value) || is_float(value)) && contains(__repr, __tok + encode_json(to_string!(value))))
              }
          }
          if __hit { __consumed = __consumed + ("," + encode_json(key)) }
      }
  }
  # Fast path: when no two source keys decode to the same key and no two spilled
  # keys get the same name, each key's decision depends only on its own value, so
  # one filter and one rename build the residual without copying it per key.
  __distinct = true
  if __tilde {
      __distinct = length(map_keys(__flat) -> |key| { replace(replace(key, "~1", "."), "~0", "~") }) == length(__flat)
  }
  __kept = {}
  __names = {}
  if __distinct {
      __kept = filter(__flat) -> |key, value| {
          # A key is kept unless an explicit mapping or transformation consumed it.
          # Do not spill a copy of the raw body.
          value != __raw_body && !contains(__consumed, "," + encode_json(key))
      }
      __names = map_keys(__kept) -> |key| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          join!(__parts, ".")
      }
  }
  __residual = {}
  if __distinct && length(__names) == length(__kept) {
      __residual = map_values(__names) -> |value| {
          if is_array(value) || is_object(value) {
              if __tilde {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              if __complex { value = encode_json(value) }
          }
          value
      }
  } else {
      # Slow path, in source key order: a name already taken gets the next free
      # _2, _3, ... suffix.
      for_each(__flat) -> |key, value| {
          __token = "," + encode_json(key)
          key = replace(replace(key, "~1", "."), "~0", "~")
          if is_array(value) || is_object(value) {
              value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                  replace(replace(inner, "~1", "."), "~0", "~")
              }, ["v"])
          }
          if !contains(__consumed, __token) && value != __raw_body {
              __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
              __base = join!(__parts, ".")
              __key = __base
              __suffix = 2
              if includes(keys(__residual), __key) {
                  for_each(__flat) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __key) {
                          __key = __base + "_" + to_string(__suffix)
                          __suffix = __suffix + 1
                      }
                  }
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              __spill = if __complex { encode_json(value) } else { value }
              __residual = set!(__residual, [__key], __spill)
          }
      }
  }
  # Names nano owns in unmapped (the parser markers and the reserved nano.*
  # namespace) are never taken by a source field: a vendor key with such a name
  # is kept, renamed source_<name>, so a log cannot forge a marker.
  if match(encode_json(keys(__residual)), r'"nano(?:"|\.|_time_assumed_tz"|_time_source"|_operational")') {
      for_each(object!(__residual)) -> |key, value| {
          if includes(["nano", "nano_time_assumed_tz", "nano_time_source", "nano_operational"], key) || starts_with(key, "nano.") {
              # source_<name>, or the next free _2, _3, ... when a vendor key
              # already holds that name: nothing is lost.
              __rk = "source_" + key
              __rn = 2
              if includes(keys(__residual), __rk) {
                  for_each(__residual) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __rk) {
                          __rk = "source_" + key + "_" + to_string(__rn)
                          __rn = __rn + 1
                      }
                  }
              }
              __residual = remove!(__residual, [key])
              __residual = set!(__residual, [__rk], value)
          }
      }
  }
  # Keep existing derived evidence, but remove null placeholders and copies of a
  # source value (that value is mapped or spilled above under its source path).
  # A value merely equal to some mapped attribute is kept: equality with an
  # unrelated attribute is no evidence that it is represented.
  # The canonical source spill above is the authoritative representation of
  # containers. The cheap conditions run first; the source value set is built on
  # first use.
  __original_values = null
  for_each(flatten(__existing)) -> |key, value| {
      if !is_null(value) && value != "" && !is_array(value) && !is_object(value) && value != __raw_body {
          # Members for the value itself and for to_string(value), as above.
          __json = encode_json(value)
          __as_json = "," + encode_json(__json)
          __as_string = __as_json
          if is_string(value) { __as_string = "," + __json } else if is_float(value) { __as_string = "," + encode_json(to_string!(value)) }
          if __original_values == null {
              # __source_kv may hold non-JSON types (a timestamp), so only an
              # integer or a boolean skips its to_string member here.
              __original_values = join!(map_values(values(flatten(__source_kv))) -> |source_value| {
                  __source_json = encode_json(source_value)
                  __tokens = "," + encode_json(__source_json)
                  if is_string(source_value) {
                      __tokens = __tokens + "," + __source_json
                  } else if !is_object(source_value) && !is_array(source_value) && !is_integer(source_value) && !is_boolean(source_value) {
                      __tokens = __tokens + "," + encode_json(to_string(source_value) ?? "")
                  }
                  __tokens
              }, "")
          }
          __source_set = string!(__original_values)
          __keep = !contains(__source_set, __as_json) && !contains(__source_set, __as_string)
          # Only text opening an object or an array (after JSON whitespace)
          # decodes to a container.
          if __keep && is_string(value) && match(string!(value), r'^[ \t\n\r]*[\x5B\x7B]') {
              __decoded, __decode_err = parse_json(string!(value))
              __keep = !(__decode_err == null && (is_object(__decoded) || is_array(__decoded)))
          }
          if __keep {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, as-is. These
  # entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__copy.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  if __time_assumed && !__time_inline { __residual = set!(__residual, ["nano_time_assumed_tz"], __src_tz_label) }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

