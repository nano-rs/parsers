source: text
transforms:
- source: header.ts
  kind: epoch_ms
  target: time
  format: '%+'
  reason: RFC 5424 / RFC 3339 header clock converted to event milliseconds; BSD clocks without a year
    remain residual.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  header.host:
  - device.hostname
  - dst_endpoint.hostname
  - src_endpoint.hostname
  header.prog:
  - actor.process.name
  - metadata.log_provider
  header.pid:
  - actor.process.pid
  header.tag:
  - metadata.event_code
  sd.username:
  - user.name
  sd.source-address:
  - src_endpoint.ip
  sd.interface-name:
  - device.network_interfaces.name
  event.user:
  - actor.user.name
  - user.name
  event.class:
  - user.groups.name
  event.level:
  - user.groups.name
  event.mode:
  - logon_type
  event.src:
  - src_endpoint.ip
  event.src_ip:
  - src_endpoint.ip
  event.src_port:
  - src_endpoint.port
  event.command:
  - api.operation
  event.interface:
  - device.network_interfaces.name
  message:
  - message
