source: text
transforms:
- source: header.ts
  kind: epoch_ms
  target: time
  format: '%+'
  reason: RFC 5424 / RFC 3339 header clock converted to event milliseconds; BSD clocks without a year remain residual.
consumed_candidates:
- header.host
- header.prog
- header.pid
- header.tag
- sd.username
- sd.source-address
- sd.class-name
- sd.client-mode
- sd.interface-name
- sd.command
- event.user
- event.class
- event.level
- event.mode
- event.src
- event.src_ip
- event.src_port
- event.command
- event.interface
- message
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
