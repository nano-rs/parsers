      status_id: 2
      user.name: unknown
  - raw: '<38>Dec 20 23:16:40 bilbo sshd[16639]: Invalid user oracle from 203.0.113.9 port 52044'
    expect:
      class_uid: 3002
      status_id: 2
      status_detail: Invalid user
      src_endpoint.ip: 203.0.113.9
  # configuration (napalm-logs CONFIGURATION_* and USER_ENTER_CONFIG_MODE)
  - raw: "<189>Jul 20 21:44:00 vmx01 mgd[7729]: UI_COMMIT: User 'luke' requested 'commit synchronize' operation (comment: hello)"
    expect:
      class_uid: 6003
      activity_id: 3
      api.operation: commit synchronize
      actor.user.name: luke
