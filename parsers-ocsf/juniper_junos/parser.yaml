  - raw: '<189>Jul 20 21:44:00 vmx01 mgd[7729]: UI_COMMIT_COMPLETED: commit complete'
    expect:
      class_uid: 6003
      api.operation: commit complete
  - raw: "<189>Jul 20 21:44:00 vmx01 mgd[7729]: UI_LOAD_EVENT: User 'luke' is performing a 'rollback 3'"
