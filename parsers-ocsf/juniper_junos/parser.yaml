    expect:
      class_uid: 6003
      time: 1730281872123
  # link state (napalm-logs INTERFACE_DOWN / UP / LACP_INTERFACE_DOWN, Elastic test-system.log)
  - raw: '<28>Jul 20 21:45:59 vmx01 mib2d[2424]: SNMP_TRAP_LINK_DOWN: ifIndex 502, ifAdminStatus down(2), ifOperStatus down(2), ifName xe-0/0/0'
    expect:
      class_uid: 0
      metadata.event_code: SNMP_TRAP_LINK_DOWN
      device.network_interfaces.0.name: xe-0/0/0
      severity_id: 3
  - raw: '<28>Jul 20 21:45:59 vmx01 mib2d[2424]: SNMP_TRAP_LINK_UP: ifIndex 502, ifAdminStatus up(1), ifOperStatus up(1), ifName xe-0/0/0'
    expect:
      class_uid: 0
      device.network_interfaces.0.name: xe-0/0/0
  - raw: '<175>2020-11-04T07:05:36+00:00 some-switch lacpd[12694]: LACP_INTF_DOWN: ae105: Interface marked down due to lacp timeout on member et-0/0/25:3'
    expect:
      class_uid: 0
      device.network_interfaces.0.name: ae105
      time: 1604473536000
  - raw: '<28>1 2023-05-08T14:25:07.466+10:00 fw01.example.com mib2d 8956 SNMP_TRAP_LINK_DOWN [junos@2636.1.1.1.2.129 snmp-interface-index="508" admin-status="up(1)" operational-status="down(2)" interface-name="st0.60"]'
    expect:
      class_uid: 0
      device.network_interfaces.0.name: st0.60
  # other tags and untagged lines -> Base Event
  - raw: '<37>1 2023-05-10T00:10:24.232+10:00 fw01.example.com snmpd 8959 SNMPD_AUTH_FAILURE [junos@2636.1.1.1.2.129 function-name="nsa_log_community" message="unauthorized SNMP community" source-address="198.51.100.56" destination-address="192.0.2.128" index1="j5Cx6eSkKF7A"]'
    expect:
      class_uid: 0
      metadata.event_code: SNMPD_AUTH_FAILURE
  - raw: '<28>Nov 20 16:58:04 re0-gw2.example.net rpd[3167]: bgp_listen_accept:4984: NOTIFICATION sent to 2001:db8:124::f1:12:1+51528 (proto): code 6 (Cease) subcode 5 (Connection Rejected), Reason: Connection attempt from unconfigured neighbor: 2001:db8:124::f1:12:1+51528'
    expect:
      class_uid: 0
      metadata.log_provider: rpd
  - raw: '<4>Jul 20 21:23:00 vmx01 /kernel: tcp_auth_ok: Packet from 192.0.2.254:61664 wrong MD5 digest'
    expect:
      class_uid: 0
      metadata.log_provider: kernel
      severity_id: 3
  - raw: '<25>Jun 21 14:03:12 vmx01 eswd[2902]: ESWD_BPDU_BLOCK_ERROR_DISABLED: ge-0/0/17.0: bpdu-block disabled port'
    expect:
      class_uid: 0
      metadata.event_code: ESWD_BPDU_BLOCK_ERROR_DISABLED
  # SRX flow logs belong to juniper_srx; here they stay Base Events
