    expect:
      class_uid: 3002
      status_id: 2
      user.name: user1
  # neon #80 r2: the structured-data username stays authoritative
  - raw: '<36>1 2023-05-09T15:00:06.756+10:00 rtr01 login 4130 LOGIN_PAM_MAX_RETRIES [junos@2636.1.1.1.2.129 username="user_ops"] Maximum number of authentication attempts exceeded for user_ops'
    expect:
      class_uid: 3002
      user.name: user_ops
