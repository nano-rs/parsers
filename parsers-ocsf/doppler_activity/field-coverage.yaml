source: json
transforms:
- source: created_at
  kind: epoch_ms
  format: '%+'
  target: time
  reason: The activity record's clock (RFC 3339, UTC) is the event time.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  enclave_config:
  - resources.name
  enclave_project:
  - resources.name
  - resources.namespace
  id:
  - metadata.uid
  text:
  - api.operation
  - message
  user.slug:
  - actor.user.uid
  user.username:
  - actor.user.name
