source: json
transforms:
- source: date_create
  target: time
  kind: scale
  reason: Slack audit Unix seconds converted to milliseconds.
  factor: 1000
consumed_candidates:
- action
- actor
- actor.type
- actor.user
- actor.user.email
- actor.user.id
- actor.user.name
- actor.user.team
- context
- context.ip_address
- context.location
- context.location.domain
- context.location.id
- context.location.name
- context.location.type
- context.session_id
- context.ua
- date_create
- details
- details.method
- details.mfa
- details.new_value
- entity
- entity.channel
- entity.channel.id
- entity.channel.name
- entity.file
- entity.file.id
- entity.file.name
- entity.file.title
- entity.type
- entity.user
- entity.user.email
- entity.user.id
- entity.user.name
- entity.usergroup
- entity.usergroup.id
- entity.usergroup.name
- entity.workspace
- entity.workspace.domain
- entity.workspace.id
- entity.workspace.name
- id
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
