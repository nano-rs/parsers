source: json
transforms:
- source: date_create
  target: time
  kind: scale
  reason: Slack audit Unix seconds converted to milliseconds.
  factor: 1000
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  action:
  - api.operation
  - message
  - metadata.event_code
  actor.user.email:
  - actor.user.email_addr
  - actor.user.name
  - user.email_addr
  - user.name
  actor.user.id:
  - actor.user.uid
  - user.uid
  context.ip_address:
  - src_endpoint.ip
  context.session_id:
  - session.uid
  context.ua:
  - http_request.user_agent
  details.method:
  - auth_protocol
  details.mfa:
  - is_mfa
  details.new_value:
  - status_detail
  entity.channel.id:
  - resources.uid
  entity.channel.name:
  - resources.name
  entity.file.id:
  - resources.uid
  entity.file.name:
  - resources.name
  entity.type:
  - resources.name
  - resources.type
  entity.user.email:
  - user.email_addr
  - user.name
  entity.user.id:
  - user.uid
  entity.usergroup.id:
  - group.uid
  entity.usergroup.name:
  - group.name
  id:
  - metadata.original_event_uid
  - metadata.uid
