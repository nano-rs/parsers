name: slack_audit_ocsf
display_name: Slack Audit Log (OCSF)
version: "1.3.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields in redacted, dotted snake_case unmapped keys.
  Parses Slack Enterprise Grid Audit Logs API events into complete OCSF 1.9.0
  records, routed by `action`:
    user_login / user_login_failed / user_logout      -> Authentication 3002
    user_created / user_deactivated / user_reactivated /
      user_role_changed / user_email_changed /
      user_password_* / user_mfa_*                     -> User Management 3007
    usergroup_* / workspace member add/remove          -> Group Management 3006
    channel_*, file_*, app_*, workspace_*, everything
      else                                             -> API Activity 6003
  Distinct from slack_access (team.accessLogs) — a different endpoint and
  schema. The Slack `actor.user` is the administrator (`actor.user` in OCSF)
  and `entity.user` is the account acted on (`user` in OCSF).
match_values:
  - slack_audit
category: cloud
vendor: "Salesforce"
product: "Slack"
parser_vrl: |
  # Slack Enterprise Grid audit event JSON -> OCSF 1.9.0.
  raw_log = string!(.message)
  __raw_body = raw_log
  __source_kv = {}
  parsed, err = parse_json(raw_log)
  __source_kv = object(parsed) ?? {}

  if err != null || !is_object(parsed) {
      # Unparseable input is emitted as an OCSF Base Event (class_uid 0)
      # rather than being guessed into a security class: it stays valid, and
      # therefore visible, without fabricating a user or an outcome.
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 0,
          "activity_name": "Unknown",
          "type_uid": 0,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": 0,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": sha2("slack_audit|raw|" + raw_log, variant: "SHA-256"),
              "log_level": "error",
              "log_name": "Slack Audit Logs",
              "log_provider": "Slack",
              "product": { "name": "Slack", "vendor_name": "Salesforce" }
          },
          "unmapped": { "parse_error": "not a JSON object" }
      }
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      . = set!(., ["unmapped", "parse_fallback"], "unparsable input")
  } else {
      p = object!(parsed)
      actor_in = object(p.actor) ?? {}
      actor_u = object(actor_in.user) ?? {}
      ctx = object(p.context) ?? {}
      ctx_loc = object(ctx.location) ?? {}
      entity = object(p.entity) ?? {}
      entity_user = object(entity.user) ?? {}
      entity_ws = object(entity.workspace) ?? {}
      entity_ch = object(entity.channel) ?? {}
      entity_file = object(entity.file) ?? {}
      entity_ug = object(entity.usergroup) ?? {}
      details = object(p.details) ?? {}

      action = string(p.action) ?? ""

      # ---- time: date_create is epoch seconds ----
      time_ms = 0
      ts_sec = to_int(p.date_create) ?? 0
      if ts_sec > 0 { time_ms = ts_sec * 1000 }

      # ---- acting principal ----
      actor_email = string(actor_u.email) ?? ""
      actor_name = actor_email
      if actor_name == "" { actor_name = string(actor_u.name) ?? "" }
      actor_user = { "name": downcase(actor_name) }
      if actor_name == "" { actor_user = { "name": "unknown" } }
      actor_uid = string(actor_u.id) ?? ""
      if actor_uid != "" { actor_user = set!(actor_user, ["uid"], actor_uid) }
      if match(actor_email, r'^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$') {
          actor_user = set!(actor_user, ["email_addr"], downcase(actor_email))
      }

      # ---- subject named by entity.user ----
      subj_email = string(entity_user.email) ?? ""
      subj_name = subj_email
      if subj_name == "" { subj_name = string(entity_user.name) ?? "" }
      subject = { "name": downcase(subj_name) }
      subj_uid = string(entity_user.id) ?? ""
      if subj_uid != "" { subject = set!(subject, ["uid"], subj_uid) }
      if match(subj_email, r'^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$') {
          subject = set!(subject, ["email_addr"], downcase(subj_email))
      }
      have_subject = subj_name != ""

      # ---- class routing ----
      is_auth = action == "user_login" || action == "user_login_failed" || action == "user_logout"
      is_usermgmt = action == "user_created" || action == "user_deactivated" || action == "user_reactivated" ||
                    action == "user_role_changed" || action == "user_email_changed" || action == "user_name_changed" ||
                    action == "user_password_changed" || action == "user_password_reset" ||
                    action == "user_mfa_reset" || action == "user_mfa_disabled" || action == "user_mfa_enabled" ||
                    action == "guest_created" || action == "guest_deactivated" || action == "guest_expiration_set" ||
                    action == "owner_transferred" || action == "role_change_to_owner" || action == "role_change_to_admin" ||
                    action == "role_change_to_user"
      is_groupmgmt = starts_with(action, "usergroup_") || action == "workspace_member_joined" ||
                     action == "organization_member_joined" || action == "organization_member_left" ||
                     action == "member_added_to_workspace" || action == "member_removed_from_workspace"

      class_uid = 6003
      if is_auth { class_uid = 3002 } else if is_usermgmt { class_uid = 3007 } else if is_groupmgmt { class_uid = 3006 }

      status_id = 1
      status_str = "Success"
      severity_id = 1
      severity = "Informational"
      if action == "user_login_failed" {
          status_id = 2; status_str = "Failure"; severity_id = 2; severity = "Low"
      }

      ocsf = {}

      if class_uid == 3002 {
          activity_id = 1
          activity_name = "Logon"
          if action == "user_logout" { activity_id = 2; activity_name = "Logoff" }
          ocsf.class_uid = 3002
          ocsf.class_name = "Authentication"
          ocsf.category_uid = 3
          ocsf.category_name = "Identity & Access Management"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          # Authentication 3002 carries the authenticating principal in `user`.
          ocsf.user = actor_user
          ocsf.service = { "name": "Slack" }
          ocsf.is_remote = true
          sid = string(ctx.session_id) ?? ""
          if sid != "" { ocsf.session = { "uid": sid } }
          method = string(details.method) ?? ""
          if method != "" {
              ml = downcase(method)
              ap_id = 99
              if ml == "saml" || ml == "sso" { ap_id = 5 }
              if ml == "oauth" { ap_id = 6 }
              ocsf.auth_protocol_id = ap_id
              ocsf.auth_protocol = method
          }
          mfa = false
          if is_boolean(details.mfa) { mfa = bool!(details.mfa) }
          if is_string(details.mfa) { mfa = downcase(string!(details.mfa)) == "true" }
          ocsf.is_mfa = mfa
      } else if class_uid == 3007 {
          activity_id = 2
          activity_name = "Update"
          if action == "user_created" || action == "guest_created" { activity_id = 1; activity_name = "Create" }
          if action == "user_reactivated" { activity_id = 4; activity_name = "Enable" }
          if action == "user_deactivated" || action == "guest_deactivated" { activity_id = 5; activity_name = "Disable" }
          if action == "user_password_changed" { activity_id = 8; activity_name = "Password Change" }
          if action == "user_password_reset" { activity_id = 9; activity_name = "Password Reset" }
          if action == "user_mfa_enabled" { activity_id = 12; activity_name = "Enable MFA Factors" }
          if action == "user_mfa_disabled" || action == "user_mfa_reset" { activity_id = 13; activity_name = "Disable MFA Factors" }
          if action == "role_change_to_owner" || action == "role_change_to_admin" || action == "owner_transferred" { activity_id = 16; activity_name = "Assign Roles" }
          if action == "role_change_to_user" { activity_id = 17; activity_name = "Remove Roles" }

          ocsf.class_uid = 3007
          ocsf.class_name = "User Management"
          ocsf.category_uid = 3
          ocsf.category_name = "Identity & Access Management"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          # SUBJECT = entity.user; ACTOR = actor.user (usually a workspace admin).
          if have_subject { ocsf.user = subject } else { ocsf.user = actor_user }
          ocsf.actor = { "user": actor_user }
          new_role = string(details.new_value) ?? ""
          if new_role != "" { ocsf.status_detail = new_role }
      } else if class_uid == 3006 {
          activity_id = 99
          activity_name = "Other"
          if action == "usergroup_created" { activity_id = 6; activity_name = "Create" }
          if action == "usergroup_deleted" || action == "usergroup_disabled" { activity_id = 5; activity_name = "Delete" }
          if action == "usergroup_updated" { activity_id = 9; activity_name = "Update" }
          if action == "workspace_member_joined" || action == "organization_member_joined" || action == "member_added_to_workspace" { activity_id = 3; activity_name = "Add User" }
          if action == "organization_member_left" || action == "member_removed_from_workspace" { activity_id = 4; activity_name = "Remove User" }

          ocsf.class_uid = 3006
          ocsf.class_name = "Group Management"
          ocsf.category_uid = 3
          ocsf.category_name = "Identity & Access Management"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          gname = string(entity_ug.name) ?? string(entity_ws.name) ?? ""
          guid = string(entity_ug.id) ?? string(entity_ws.id) ?? ""
          grp = {}
          if gname != "" { grp = set!(grp, ["name"], gname) }
          if guid != "" { grp = set!(grp, ["uid"], guid) }
          if length(grp) == 0 { grp = { "name": "unknown" } }
          ocsf.group = grp
          if have_subject { ocsf.user = subject }
          ocsf.actor = { "user": actor_user }
      } else {
          activity_id = 99
          activity_name = "Other"
          if contains(action, "created") || contains(action, "added") || contains(action, "installed") || contains(action, "uploaded") { activity_id = 1; activity_name = "Create" }
          if contains(action, "downloaded") || contains(action, "viewed") || contains(action, "exported") { activity_id = 2; activity_name = "Read" }
          if contains(action, "changed") || contains(action, "updated") || contains(action, "renamed") || contains(action, "converted") { activity_id = 3; activity_name = "Update" }
          if contains(action, "deleted") || contains(action, "removed") || contains(action, "uninstalled") || contains(action, "archived") { activity_id = 4; activity_name = "Delete" }

          ocsf.class_uid = 6003
          ocsf.class_name = "API Activity"
          ocsf.category_uid = 6
          ocsf.category_name = "Application Activity"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          op = action
          if op == "" { op = "unknown" }
          ocsf.api = { "operation": op, "service": { "name": "Slack" } }
          ocsf.actor = { "user": actor_user }

          resources = []
          ent_type = string(entity.type) ?? ""
          ch_name = string(entity_ch.name) ?? ""
          if ch_name != "" {
              res = { "name": ch_name, "type": "Channel" }
              ch_id = string(entity_ch.id) ?? ""
              if ch_id != "" { res = set!(res, ["uid"], ch_id) }
              resources = push(resources, res)
          }
          f_name = string(entity_file.name) ?? string(entity_file.title) ?? ""
          if f_name != "" {
              res = { "name": f_name, "type": "File" }
              f_id = string(entity_file.id) ?? ""
              if f_id != "" { res = set!(res, ["uid"], f_id) }
              resources = push(resources, res)
          }
          ws_name = string(entity_ws.name) ?? ""
          if ws_name != "" {
              res = { "name": ws_name, "type": "Workspace" }
              ws_id = string(entity_ws.id) ?? ""
              if ws_id != "" { res = set!(res, ["uid"], ws_id) }
              resources = push(resources, res)
          }
          if length(resources) == 0 && ent_type != "" {
              resources = push(resources, { "name": ent_type, "type": ent_type })
          }
          if length(resources) > 0 { ocsf.resources = resources }
      }

      # ---- source endpoint ----
      src_ip = string(ctx.ip_address) ?? ""
      src_ep = {}
      if src_ip != "" { src_ep = set!(src_ep, ["ip"], downcase(src_ip)) }
      if length(src_ep) == 0 { src_ep = { "hostname": "unknown" } }
      ocsf.src_endpoint = src_ep

      ua = string(ctx.ua) ?? ""
      if ua != "" { ocsf.http_request = { "user_agent": ua } }

      # ---- common envelope ----
      ocsf.status_id = status_id
      ocsf.status = status_str
      ocsf.severity_id = severity_id
      ocsf.severity = severity
      ocsf.type_uid = to_int(ocsf.class_uid) * 100 + to_int(ocsf.activity_id)
      ocsf.time = time_ms
      msg = action
      if msg == "" { msg = "slack_audit_event" }
      ocsf.message = msg
      ocsf.raw_data = raw_log

      evt_uid = string(p.id) ?? ""
      if evt_uid == "" { evt_uid = sha2("slack_audit|raw|" + raw_log, variant: "SHA-256") }
      ocsf.metadata = {
          "version": "1.9.0",
          "uid": evt_uid,
          "original_event_uid": evt_uid,
          "event_code": action,
          "log_name": "Slack Audit Logs",
          "log_provider": "Slack",
          "product": { "name": "Slack", "vendor_name": "Salesforce" }
      }

      cand = {
          "actor_type": string(actor_in.type) ?? "",
          "actor_team": string(actor_u.team) ?? "",
          "entity_type": string(entity.type) ?? "",
          "channel_id": string(entity_ch.id) ?? "",
          "channel_name": string(entity_ch.name) ?? "",
          "file_id": string(entity_file.id) ?? "",
          "file_title": string(entity_file.title) ?? "",
          "workspace_id": string(entity_ws.id) ?? "",
          "workspace_domain": string(entity_ws.domain) ?? string(ctx_loc.domain) ?? "",
          "location_type": string(ctx_loc.type) ?? "",
          "location_id": string(ctx_loc.id) ?? "",
          "location_name": string(ctx_loc.name) ?? "",
          "target_user_id": subj_uid,
          "target_user_email": subj_email
      }
      unmapped = {}
      for_each(cand) -> |k, v| {
          if v != "" { unmapped = set!(unmapped, [k], v) }
      }
      if length(details) > 0 { unmapped = set!(unmapped, ["details_json"], encode_json(details)) }
      if length(unmapped) > 0 { ocsf.unmapped = unmapped }

      . = ocsf
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # Exact value representation is evaluated AFTER branch selection. Numeric strings
  # count as represented by their typed scalar; other transformations are explicit.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The value sets below are strings
  # instead (a read shares the buffer): "," + encode_json(member) per member, and
  # contains(set, "," + encode_json(x)) is exact membership. Every member is a
  # JSON text, inside which a '"' is always escaped, so ',"' only ever starts a
  # member, and a JSON string ends at its first unescaped '"'. The fixed candidate
  # set is a regex literal, compiled once with the program.
  # __mapped holds only JSON types, so to_string equals encode_json for an integer
  # or a boolean and only strings and floats add a second member.
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped_json = encode_json(__mapped)
  __mapped = object!(parse_json!(__mapped_json))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __safe = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __safe_json = encode_json(__safe)
  # Object and array members are encodings: an empty object, an object that
  # opens with a quoted key, or an array. A lookup can ask for one only when some
  # source or existing value is an array, or a string spelling one of those
  # openings, and the regex below finds either in the JSON text (brackets are
  # written as hex escapes because nano's deploy check counts them raw).
  # Otherwise the scalar nodes suffice; a Sysmon GUID, a brace-wrapped string
  # with no quoted key, is no object member. The leaves of flatten(), with arrays
  # flattened too, are every scalar node unless a key holds a literal '.' (in
  # compact JSON only a key is followed by ':').
  # Their encodings, unwrapped from the array, already are the string members.
  __represented = ""
  __nodes = __mapped
  if !match(__safe_json, r'"(?:\x7B\\"|\x7B\x7D"|\x5B)|[:,\x5B]\x5B') && !match(__mapped_json, r'\.(?:[^"\\]|\\.)*":') {
      __leaves = flatten(values(flatten(__mapped)))
      __leaves_json = encode_json(__leaves)
      if match(__leaves_json, r'\x7B') {
          # An object inside an array: walk the leaves, objects whole.
          __nodes = __leaves
      } else {
          __nodes = []
          __members = map_values(__leaves) -> |value| {
              if is_float(value) {
                  encode_json(encode_json(value)) + "," + encode_json(to_string!(value))
              } else {
                  encode_json(encode_json(value))
              }
          }
          __represented = "," + join!(__members, ",") + "," + slice!(__leaves_json, 1, -1)
      }
  }
  __walk = map_values(__nodes, recursive: true) -> |value| {
      __json = encode_json(value)
      if is_string(value) {
          # A string's second member is the string itself, encoded: __json.
          __represented = __represented + ("," + encode_json(__json) + "," + __json)
      } else if is_float(value) {
          __represented = __represented + ("," + encode_json(__json) + "," + encode_json(to_string!(value)))
      } else {
          __represented = __represented + ("," + encode_json(__json))
      }
      value
  }
  __consumed = ""
  # BEGIN parser-specific transformations
  __source_flat = flatten(__source_kv)
  # date_create: Slack audit Unix seconds converted to milliseconds.
  __value = __source_flat."date_create"
  __number, __number_err = to_float(__value)
  if __number_err == null && __value != null && !is_boolean(__value) {
      __expected = to_int(__number * 1000.0)
      if ."time" == __expected { __consumed = __consumed + ("," + encode_json("date_create")) }
  }
  # Only source keys read by this parser are eligible for exact-value consumption; the selected branch must emit the value. Unknown keys always spill, even when their value equals an OCSF default.
  __candidates = r'(?x)
  \A(?:
    action
  | actor
  | actor\.type
  | actor\.user
  | actor\.user\.email
  | actor\.user\.id
  | actor\.user\.name
  | actor\.user\.team
  | context
  | context\.ip_address
  | context\.location
  | context\.location\.domain
  | context\.location\.id
  | context\.location\.name
  | context\.location\.type
  | context\.session_id
  | context\.ua
  | date_create
  | details
  | details\.method
  | details\.mfa
  | details\.new_value
  | entity
  | entity\.channel
  | entity\.channel\.id
  | entity\.channel\.name
  | entity\.file
  | entity\.file\.id
  | entity\.file\.name
  | entity\.file\.title
  | entity\.type
  | entity\.user
  | entity\.user\.email
  | entity\.user\.id
  | entity\.user\.name
  | entity\.usergroup
  | entity\.usergroup\.id
  | entity\.usergroup\.name
  | entity\.workspace
  | entity\.workspace\.domain
  | entity\.workspace\.id
  | entity\.workspace\.name
  | id
  )\z'
  __preserve = []
  # END parser-specific transformations
  # Redact at every depth, including objects inside arrays, before serialization.
  # Redaction needs a sensitive word in a key or a name/key value, and encode_json
  # never escapes a letter, so text without one of the words needs no walk.
  if match(downcase(__safe_json), r'password|secret|authorization|token') {
      __safe = map_values(__safe, recursive: true) -> |value| {
          if is_object(value) {
              # Header/parameter arrays commonly encode sensitive keys as name/value
              # or Key/Value objects instead of using the secret name as an object key.
              __sensitive_pair = false
              for_each(object!(value)) -> |key, child| {
                  if includes(["name", "key"], downcase(key)) && match(downcase(string(child) ?? ""), r'password|secret|authorization|token') {
                      __sensitive_pair = true
                  }
              }
              for_each(object!(value)) -> |key, _child| {
                  if match(downcase(key), r'password|secret|authorization|token') || (__sensitive_pair && includes(["value", "values"], downcase(key))) {
                      value = set!(value, [key], "<redacted>")
                  }
              }
          }
          value
      }
  }
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__safe.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # Fast path: when no two source keys decode to the same key and no two spilled
  # keys get the same name, each key's decision depends only on its own value, so
  # one filter and one rename build the residual without copying it per key.
  __distinct = true
  if __tilde {
      __distinct = length(map_keys(__flat) -> |key| { replace(replace(key, "~1", "."), "~0", "~") }) == length(__flat)
  }
  __kept = {}
  __names = {}
  if __distinct {
      __kept = filter(__flat) -> |key, value| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          # A key is kept unless it is consumed: by a transformation above, or as a
          # candidate whose value is represented. Redacted leaves always remain
          # visible. Do not spill a copy of the raw body.
          if value == __raw_body {
              false
          } else if value == "<redacted>" {
              true
          } else if contains(__consumed, "," + encode_json(key)) {
              false
          } else if !match(key, __candidates) {
              true
          } else {
              # flatten stops at arrays, so objects inside an array still carry the
              # escaped keys: decode them too, or `a.b` spills as `a~1b` (NAN-3604).
              if __tilde && (is_array(value) || is_object(value)) {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __same = contains(__represented, "," + encode_json(encode_json(value)))
              if !__same && (is_string(value) || is_float(value)) {
                  __same = contains(__represented, "," + encode_json(to_string!(value)))
              }
              # A scalar array is consumed only if every element is represented. Preserve
              # partially represented arrays intact, including their ordering and repeats.
              if !__same && is_array(value) && !is_empty(array!(value)) {
                  __same = true
                  for_each(array!(value)) -> |_index, item| {
                      if __same {
                          if is_object(item) || is_array(item) {
                              __same = false
                          } else if !contains(__represented, "," + encode_json(encode_json(item))) {
                              __same = (is_string(item) || is_float(item)) && contains(__represented, "," + encode_json(to_string!(item)))
                          }
                      }
                  }
              }
              !__same
          }
      }
      __names = map_keys(__kept) -> |key| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          join!(__parts, ".")
      }
  }
  __residual = {}
  if __distinct && length(__names) == length(__kept) {
      __residual = map_values(__names) -> |value| {
          if is_array(value) || is_object(value) {
              if __tilde {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              if __complex { value = encode_json(value) }
          }
          value
      }
  } else {
      # Slow path, in source key order: a decoded key consumed earlier stays
      # consumed, and a name already taken gets the next free _2, _3, ... suffix.
      for_each(__flat) -> |key, value| {
          key = replace(replace(key, "~1", "."), "~0", "~")
          if is_array(value) || is_object(value) {
              value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                  replace(replace(inner, "~1", "."), "~0", "~")
              }, ["v"])
          }
          __same = contains(__represented, "," + encode_json(encode_json(value)))
          if !__same && (is_string(value) || is_float(value)) {
              __same = contains(__represented, "," + encode_json(to_string!(value)))
          }
          if !__same && is_array(value) && !is_empty(array!(value)) {
              __same = true
              for_each(array!(value)) -> |_index, item| {
                  if __same {
                      if is_object(item) || is_array(item) {
                          __same = false
                      } else if !contains(__represented, "," + encode_json(encode_json(item))) {
                          __same = (is_string(item) || is_float(item)) && contains(__represented, "," + encode_json(to_string!(item)))
                      }
                  }
              }
          }
          __token = "," + encode_json(key)
          if __same && match(key, __candidates) { __consumed = __consumed + ("," + encode_json(key)) }
          if (!contains(__consumed, __token) || value == "<redacted>") && value != __raw_body {
              __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
              __base = join!(__parts, ".")
              __key = __base
              __suffix = 2
              if includes(keys(__residual), __key) {
                  for_each(__flat) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __key) {
                          __key = __base + "_" + to_string(__suffix)
                          __suffix = __suffix + 1
                      }
                  }
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              __spill = if __complex { encode_json(value) } else { value }
              __residual = set!(__residual, [__key], __spill)
          }
      }
  }
  # Keep existing derived evidence, but remove null placeholders and mapped copies.
  # Source-derived aliases are replaced by canonical dotted source paths above.
  # Existing aggregates may contain sensitive descendants; the canonical source
  # spill above is the authoritative representation of containers. The cheap
  # conditions run first; the source value set is built on first use.
  __original_values = null
  for_each(flatten(__existing)) -> |key, value| {
      if !is_null(value) && value != "" && !is_array(value) && !is_object(value) && value != __raw_body && !match(downcase(key), r'password|secret|authorization|token') {
          # Members for the value itself and for to_string(value), as above.
          __json = encode_json(value)
          __as_json = "," + encode_json(__json)
          __as_string = __as_json
          if is_string(value) { __as_string = "," + __json } else if is_float(value) { __as_string = "," + encode_json(to_string!(value)) }
          if __original_values == null {
              # __source_kv may hold non-JSON types (a timestamp), so only an
              # integer or a boolean skips its to_string member here.
              __original_values = join!(map_values(values(flatten(__source_kv))) -> |source_value| {
                  __source_json = encode_json(source_value)
                  __tokens = "," + encode_json(__source_json)
                  if is_string(source_value) {
                      __tokens = __tokens + "," + __source_json
                  } else if !is_object(source_value) && !is_array(source_value) && !is_integer(source_value) && !is_boolean(source_value) {
                      __tokens = __tokens + "," + encode_json(to_string(source_value) ?? "")
                  }
                  __tokens
              }, "")
          }
          __source_set = string!(__original_values)
          __keep = !contains(__source_set, __as_json) && !contains(__source_set, __as_string)
          __keep = __keep && !contains(__represented, __as_json) && !contains(__represented, __as_string)
          # Only text opening an object or an array (after JSON whitespace)
          # decodes to a container.
          if __keep && is_string(value) && match(string!(value), r'^[ \t\n\r]*[\x5B\x7B]') {
              __decoded, __decode_err = parse_json(string!(value))
              __keep = !(__decode_err == null && (is_object(__decoded) || is_array(__decoded)))
          }
          if __keep {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, with recursive
  # redaction. These entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__safe.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

