  __candidates = r'(?x)
  \A(?:
    CVE
  | IPS_id
  | action
  | app_category
  | app_name
  | appi_name
  | attack
  | attack_severity
  | auth_method
  | auth_status
  | bot_name
  | bytes
  | client_inbound_bytes
  | client_inbound_packets
  | client_outbound_bytes
  | client_outbound_packets
  | community
  | confidence_level
  | dst
  | dst_machine_name
  | duration
  | elapsed
  | header\.host
  | header\.payload
  | header\.ts
  | i/f_dir
  | i/f_name
  | ifdir
  | ifname
  | inzone
  | layer_name
  | logid
  | loguid
  | malware_family
  | malware_rule_id
  | matched_category
  | message_info
  | method
  | orig
  | origin
  | originsicname
  | outzone
  | peer_gateway
  | product
  | protection_id
  | protection_name
  | proto
  | reason
  | received_bytes
  | resource
  | rule
  | rule_action
  | rule_name
  | rule_uid
  | s_port
  | sent_bytes
  | service
  | service_id
  | session_id
  | severity
  | src
  | src_machine_name
  | src_user_name
  | ssl_server_name
