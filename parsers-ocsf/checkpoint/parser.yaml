  __decl = "\n\"appi_name\"\t[\"app_name\"]\n\"auth_method\"\t[\"auth_protocol\"]\n\"confidence_level\"\t[\"confidence_score\"]\n\"dst\"\t[\"dst_endpoint.ip\",\"evidences.dst_endpoint.ip\",\"observables.value\"]\n\"header.host\"\t[\"device.hostname\",\"src_endpoint.hostname\"]\n\"i/f_name\"\t[\"src_endpoint.interface_name\"]\n\"ifname\"\t[\"src_endpoint.interface_name\"]\n\"inzone\"\t[\"src_endpoint.zone\"]\n\"layer_name\"\t[\"firewall_rule.category\"]\n\"loguid\"\t[\"metadata.original_event_uid\"]\n\"matched_category\"\t[\"http_request.url.categories\"]\n\"orig\"\t[\"device.ip\"]\n\"origin\"\t[\"device.ip\"]\n\"originsicname\"\t[\"device.name\"]\n\"outzone\"\t[\"dst_endpoint.zone\"]\n\"product\"\t[\"metadata.product.feature.name\"]\n\"protection_id\"\t[\"finding_info.analytic.uid\",\"finding_info.uid\"]\n\"protection_name\"\t[\"finding_info.analytic.name\",\"finding_info.title\"]\n\"proto\"\t[\"connection_info.protocol_name\",\"connection_info.protocol_num\",\"evidences.connection_info.protocol_num\"]\n\"reason\"\t[\"status_detail\"]\n\"resource\"\t[\"evidences.url.url_string\",\"http_request.url.url_string\"]\n\"rule\"\t[\"firewall_rule.uid\"]\n\"rule_name\"\t[\"firewall_rule.name\"]\n\"rule_uid\"\t[\"firewall_rule.uid\"]\n\"s_port\"\t[\"evidences.src_endpoint.port\",\"src_endpoint.port\"]\n\"service\"\t[\"dst_endpoint.port\",\"evidences.dst_endpoint.port\"]\n\"service_id\"\t[\"dst_endpoint.svc_name\"]\n\"src\"\t[\"evidences.src_endpoint.ip\",\"observables.value\",\"src_endpoint.ip\"]\n\"src_user_name\"\t[\"actor.user.name\",\"evidences.user.name\",\"observables.value\",\"user.name\"]\n\"sys_message\"\t[\"status_detail\"]\n\"user\"\t[\"actor.user.name\",\"observables.value\"]\n"
