  __consumed = ""
  # BEGIN parser-specific transformations
  # service_id: Parser case-normalizes this parsed field when represented in output.
  # proto: Parser case-normalizes this parsed field when represented in output.
  # proto: Parser case-normalizes this parsed field when represented in output.
  # proto: Parser case-normalizes this parsed field when represented in output.
  # action: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when the expected ID is emitted.
  # rule_action: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when the expected ID is emitted.
  # severity: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when the expected ID is emitted.
