source: text
transforms:
- source: service_id
  kind: lowercase
  reason: Parser case-normalizes this parsed field when represented in output.
- source: proto
  kind: lowercase
  reason: Parser case-normalizes this parsed field when represented in output.
- source: ifdir
  kind: lowercase
  reason: Parser case-normalizes this parsed field when represented in output.
- source: rule_action
  kind: lowercase
  reason: Parser case-normalizes this parsed field when represented in output.
- source: action
  kind: lowercase
  reason: Parser case-normalizes this parsed field when represented in output.
- source: auth_status
  kind: lowercase
  reason: Parser case-normalizes this parsed field when represented in output.
- source: severity
  kind: lowercase
  reason: Parser case-normalizes this parsed field when represented in output.
- source: attack_severity
  kind: lowercase
  reason: Parser case-normalizes this parsed field when represented in output.
- source: action
  kind: enum
  target: action_id
  values:
    allow: 1
    allowed: 1
    accept: 1
    accepted: 1
    permit: 1
    permitted: 1
    pass: 1
    passed: 1
    deny: 2
    denied: 2
    block: 2
    blocked: 2
    reject: 2
    rejected: 2
    drop: 2
    dropped: 2
    log: 3
    observed: 3
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping;
    consume only when the expected ID is emitted.
- source: header.app
  kind: lowercase
  reason: Case normalization already performed by the parser; observed at metadata.log_source,
    and checked against the emitted branch.
- source: rule_action
  kind: enum
  target: action_id
  values:
    allow: 1
    allowed: 1
    accept: 1
    accepted: 1
    permit: 1
    permitted: 1
    pass: 1
    passed: 1
    deny: 2
    denied: 2
    block: 2
    blocked: 2
    reject: 2
    rejected: 2
    drop: 2
    dropped: 2
    log: 3
    observed: 3
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping;
    consume only when the expected ID is emitted.
- source: severity
  kind: enum
  target: severity
  values:
    medium: Medium
  reason: Parser normalizes the caption case; verify the emitted caption.
- source: severity
  kind: enum
  target: severity_id
  values:
    informational: 1
    info: 1
    debug: 1
    low: 2
    medium: 3
    warn: 3
    warning: 3
    high: 4
    error: 4
    critical: 5
    fatal: 6
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping;
    consume only when the expected ID is emitted.
probe:
  mode: before
  anchor: ']'
  require: 'action:'
  text: ; ResidualProbe:"nan2421-text-unknown"; password:"nan2421-secret"
  source: ResidualProbe
