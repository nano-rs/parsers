source: text
probe:
  mode: before
  anchor: ']'
  require: 'action:'
  text: ; ResidualProbe:"nan2421-text-unknown"; password:"nan2421-secret"
  source: ResidualProbe
transforms:
- source: service_id
  kind: lowercase
  target: dst_endpoint.svc_name
  reason: Parser case-normalizes this parsed field when represented in output.
- source: proto
  kind: lowercase
  target: connection_info.protocol_name
  reason: Parser case-normalizes this parsed field when represented in output.
- source: proto
  kind: lowercase
  target: connection_info.protocol_num
  reason: Parser case-normalizes this parsed field when represented in output.
- source: proto
  kind: lowercase
  target: evidences.connection_info.protocol_num
  reason: Parser case-normalizes this parsed field when represented in output.
- source: action
  kind: enum
  target: action_id
  values:
    allow: 1
    allowed: 1
    accept: 1
    accepted: 1
    permit: 1
    permitted: 1
    pass: 1
    passed: 1
    deny: 2
    denied: 2
    block: 2
    blocked: 2
    reject: 2
    rejected: 2
    drop: 2
    dropped: 2
    log: 3
    observed: 3
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when
    the expected ID is emitted.
- source: rule_action
  kind: enum
  target: action_id
  values:
    allow: 1
    allowed: 1
    accept: 1
    accepted: 1
    permit: 1
    permitted: 1
    pass: 1
    passed: 1
    deny: 2
    denied: 2
    block: 2
    blocked: 2
    reject: 2
    rejected: 2
    drop: 2
    dropped: 2
    log: 3
    observed: 3
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when
    the expected ID is emitted.
- source: severity
  kind: enum
  target: severity_id
  values:
    informational: 1
    info: 1
    debug: 1
    low: 2
    medium: 3
    warn: 3
    warning: 3
    high: 4
    error: 4
    critical: 5
    fatal: 6
  reason: Named vendor outcome/protocol/severity normalized by the existing mapping; consume only when
    the expected ID is emitted.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  appi_name:
  - app_name
  auth_method:
  - auth_protocol
  confidence_level:
  - confidence_score
  dst:
  - dst_endpoint.ip
  - evidences.dst_endpoint.ip
  - observables.value
  header.host:
  - device.hostname
  - src_endpoint.hostname
  i/f_name:
  - src_endpoint.interface_name
  ifname:
  - src_endpoint.interface_name
  inzone:
  - src_endpoint.zone
  layer_name:
  - firewall_rule.category
  loguid:
  - metadata.original_event_uid
  matched_category:
  - http_request.url.categories
  orig:
  - device.ip
  origin:
  - device.ip
  originsicname:
  - device.name
  outzone:
  - dst_endpoint.zone
  product:
  - metadata.product.feature.name
  protection_id:
  - finding_info.analytic.uid
  - finding_info.uid
  protection_name:
  - finding_info.analytic.name
  - finding_info.title
  proto:
  - connection_info.protocol_name
  - connection_info.protocol_num
  - evidences.connection_info.protocol_num
  reason:
  - status_detail
  resource:
  - evidences.url.url_string
  - http_request.url.url_string
  rule:
  - firewall_rule.uid
  rule_name:
  - firewall_rule.name
  rule_uid:
  - firewall_rule.uid
  s_port:
  - evidences.src_endpoint.port
  - src_endpoint.port
  service:
  - dst_endpoint.port
  - evidences.dst_endpoint.port
  service_id:
  - dst_endpoint.svc_name
  src:
  - evidences.src_endpoint.ip
  - observables.value
  - src_endpoint.ip
  src_user_name:
  - actor.user.name
  - evidences.user.name
  - observables.value
  - user.name
  sys_message:
  - status_detail
  user:
  - actor.user.name
  - observables.value
