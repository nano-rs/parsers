source: json
transforms:
- source: first_found
  kind: epoch_ms
  target: finding_info.first_seen_time
  reason: Successful ISO timestamp conversion to the emitted millisecond clock.
- source: last_found
  kind: epoch_ms
  target: finding_info.last_seen_time
  reason: Successful ISO timestamp conversion to the emitted millisecond clock.
- source: firstSeen
  kind: scale
  factor: 1000
  target: finding_info.first_seen_time
  reason: Security Center epoch seconds converted to the emitted millisecond clock.
- source: lastSeen
  kind: scale
  factor: 1000
  target: finding_info.last_seen_time
  reason: Security Center epoch seconds converted to the emitted millisecond clock.
- source: severity
  kind: enum
  target: severity_id
  values:
    info: 1
    informational: 1
    none: 1
    low: 2
    medium: 3
    high: 4
    critical: 5
    '0': 1
    '1': 2
    '2': 3
    '3': 4
    '4': 5
  reason: Tenable severity name (or Nessus 0-4 level) normalized to the OCSF severity; consume only when the expected ID is emitted.
- source: severity.id
  kind: enum
  target: severity_id
  values:
    '0': 1
    '1': 2
    '2': 3
    '3': 4
    '4': 5
  reason: Security Center 0-4 severity id normalized to the OCSF severity; consume only when the expected ID is emitted.
- source: severity.name
  kind: enum
  target: severity_id
  values:
    info: 1
    low: 2
    medium: 3
    high: 4
    critical: 5
  reason: Security Center severity name normalized to the OCSF severity; consume only when the expected ID is emitted.
- source: state
  kind: enum
  target: activity_id
  values:
    open: 1
    reopened: 2
    fixed: 3
  reason: The finding state drives the OCSF activity (OPEN Create, REOPENED Update, FIXED Close); consume only when that activity is emitted.
- source: asset.fqdn
  kind: lowercase
  reason: Parser lowercases the FQDN; consume only when the normalized value is emitted.
- source: dnsName
  kind: lowercase
  reason: Parser lowercases the DNS name; consume only when the normalized value is emitted.
- source: asset.mac_address
  kind: lowercase
  reason: Parser lowercases the MAC address; consume only when the normalized value is emitted.
- source: macAddress
  kind: lowercase
  reason: Parser lowercases the MAC address; consume only when the normalized value is emitted.
- source: asset.ipv6
  kind: lowercase
  reason: Parser lowercases the IPv6 address; consume only when the normalized value is emitted.
- source: baseScore
  kind: scale
  factor: 1
  reason: A whole-number CVSS score (for example 10.0) is emitted as the float base_score; consume when that value is emitted.
- source: cvssV3BaseScore
  kind: scale
  factor: 1
  reason: A whole-number CVSS score (for example 10.0) is emitted as the float base_score; consume when that value is emitted.
- source: plugin.cvss_base_score
  kind: scale
  factor: 1
  reason: A whole-number CVSS score (for example 10.0) is emitted as the float base_score; consume when that value is emitted.
- source: plugin.cvss3_base_score
  kind: scale
  factor: 1
  reason: A whole-number CVSS score (for example 10.0) is emitted as the float base_score; consume when that value is emitted.
- source: plugin.cvss4_base_score
  kind: scale
  factor: 1
  reason: A whole-number CVSS score (for example 10.0) is emitted as the float base_score; consume when that value is emitted.
consumed_candidates:
- asset.fqdn
- asset.hostname
- asset.ipv4
- asset.ipv6
- asset.mac_address
- asset.netbios_name
- asset.operating_system
- asset.uuid
- baseScore
- count
- cpe
- cve
- cvssV3BaseScore
- cvssV3Vector
- cvssVector
- description
- dnsName
- family.name
- finding_id
- hostname
- ip
- macAddress
- netbiosName
- operatingSystem
- plugin.cpe
- plugin.cve
- plugin.cvss3_base_score
- plugin.cvss3_vector.raw
- plugin.cvss4_base_score
- plugin.cvss4_vector.raw
- plugin.cvss_base_score
- plugin.cvss_vector.raw
- plugin.description
- plugin.exploit_available
- plugin.family
- plugin.has_patch
- plugin.id
- plugin.name
- plugin.risk_factor
- plugin.see_also
- plugin.solution
- plugin.synopsis
- plugin_family
- plugin_id
- plugin_name
- pluginID
- pluginName
- port
- port.port
- port.protocol
- port.service
- protocol
- riskFactor
- seeAlso
- solution
- synopsis
- uuid
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
