source: json
transforms:
- source: first_found
  kind: epoch_ms
  target: finding_info.first_seen_time
  reason: Successful ISO timestamp conversion to the emitted millisecond clock.
- source: last_found
  kind: epoch_ms
  target: finding_info.last_seen_time
  reason: Successful ISO timestamp conversion to the emitted millisecond clock.
- source: firstSeen
  kind: scale
  factor: 1000
  target: finding_info.first_seen_time
  reason: Security Center epoch seconds converted to the emitted millisecond clock.
- source: lastSeen
  kind: scale
  factor: 1000
  target: finding_info.last_seen_time
  reason: Security Center epoch seconds converted to the emitted millisecond clock.
- source: severity
  kind: enum
  target: severity_id
  values:
    info: 1
    informational: 1
    none: 1
    low: 2
    medium: 3
    high: 4
    critical: 5
    '0': 1
    '1': 2
    '2': 3
    '3': 4
    '4': 5
  reason: Tenable severity name (or Nessus 0-4 level) normalized to the OCSF severity; consume only when
    the expected ID is emitted.
- source: severity.id
  kind: enum
  target: severity_id
  values:
    '0': 1
    '1': 2
    '2': 3
    '3': 4
    '4': 5
  reason: Security Center 0-4 severity id normalized to the OCSF severity; consume only when the expected
    ID is emitted.
- source: state
  kind: enum
  target: activity_id
  values:
    open: 1
    reopened: 2
    fixed: 3
  reason: The finding state drives the OCSF activity (OPEN Create, REOPENED Update, FIXED Close); consume
    only when that activity is emitted.
- source: asset.fqdn
  kind: lowercase
  target: device.hostname
  reason: Parser lowercases the FQDN; consume only when the normalized value is emitted.
- source: asset.fqdn
  kind: lowercase
  target: observables.value
  reason: Parser lowercases the FQDN; consume only when the normalized value is emitted.
- source: asset.fqdn
  kind: lowercase
  target: resource.hostname
  reason: Parser lowercases the FQDN; consume only when the normalized value is emitted.
- source: asset.fqdn
  kind: lowercase
  target: resource.name
  reason: Parser lowercases the FQDN; consume only when the normalized value is emitted.
- source: asset.fqdn
  kind: lowercase
  target: resources.hostname
  reason: Parser lowercases the FQDN; consume only when the normalized value is emitted.
- source: asset.fqdn
  kind: lowercase
  target: resources.name
  reason: Parser lowercases the FQDN; consume only when the normalized value is emitted.
- source: dnsName
  kind: lowercase
  target: device.hostname
  reason: Parser lowercases the DNS name; consume only when the normalized value is emitted.
- source: dnsName
  kind: lowercase
  target: observables.value
  reason: Parser lowercases the DNS name; consume only when the normalized value is emitted.
- source: dnsName
  kind: lowercase
  target: resource.hostname
  reason: Parser lowercases the DNS name; consume only when the normalized value is emitted.
- source: dnsName
  kind: lowercase
  target: resource.name
  reason: Parser lowercases the DNS name; consume only when the normalized value is emitted.
- source: dnsName
  kind: lowercase
  target: resources.hostname
  reason: Parser lowercases the DNS name; consume only when the normalized value is emitted.
- source: dnsName
  kind: lowercase
  target: resources.name
  reason: Parser lowercases the DNS name; consume only when the normalized value is emitted.
- source: asset.mac_address
  kind: lowercase
  target: device.mac
  reason: Parser lowercases the MAC address; consume only when the normalized value is emitted.
- source: macAddress
  kind: lowercase
  target: device.mac
  reason: Parser lowercases the MAC address; consume only when the normalized value is emitted.
- source: asset.ipv6
  kind: lowercase
  target: device.ip
  reason: Parser lowercases the IPv6 address; consume only when the normalized value is emitted.
- source: asset.ipv6
  kind: lowercase
  target: observables.value
  reason: Parser lowercases the IPv6 address; consume only when the normalized value is emitted.
- source: asset.ipv6
  kind: lowercase
  target: resource.ip
  reason: Parser lowercases the IPv6 address; consume only when the normalized value is emitted.
- source: asset.ipv6
  kind: lowercase
  target: resources.ip
  reason: Parser lowercases the IPv6 address; consume only when the normalized value is emitted.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
