name: tenable_ocsf
display_name: Tenable Vulnerability Findings (OCSF)
version: "1.1.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses Tenable vulnerability findings into OCSF 1.9.0 "Vulnerability Finding"
  (class_uid 2002) with the security_control profile. Three shapes are
  recognized: the Tenable Vulnerability Management (Tenable.io) vulnerability
  export (asset{} + plugin{} + state), the Tenable Security Center (Tenable.sc)
  analysis API vulnerability record (pluginID, severity{}, ip, epoch-second
  firstSeen / lastSeen) and the Nessus REST API vulnerability row (plugin_id,
  plugin_name, numeric severity) from GET /scans/{id} or
  /scans/{id}/hosts/{host_id}. Each finding is one record; a vulnerability
  export or Nessus response array must be split one finding per event
  upstream (the parser does not fan out). Severity (info / low / medium /
  high / critical, or 0-4) maps to severity_id 1-5. The state maps to the
  lifecycle: OPEN is Create / New, REOPENED (or a Security Center cumulative
  record with hasBeenMitigated) is Update / New with status_detail, FIXED (or
  a Security Center patched record: sourceType patched, or a non-cumulative
  record whose mitigateTime / lastMitigated is not older than lastSeen) is
  Close / Resolved, and an accepted risk is
  Suppressed. Every CVE id becomes its own vulnerabilities[] entry carrying
  the CVSS v2 / v3 / v4 base scores and vectors (N/A and other non-CVE
  tokens are dropped); a plugin without a CVE is an advisory keyed by its
  plugin id. An IPv6-only asset uses its IPv6 address as the IP.
  The plugin is finding_info.analytic (uid = plugin id, category = family),
  the asset is resource / resources[] / device (IP, FQDN, NetBIOS, MAC, OS),
  and port / protocol / service sit in resource.data with a Port observable.
  Anything else falls back to Base Event with the raw record kept.
match_values:
  - tenable
category: security
vendor: "Tenable"
product: "Tenable Vulnerability Management / Security Center / Nessus"
parser_vrl: |
  # NAN source timezone. Generated by scripts/residual_spill.py; edit scripts/residual/source_tz.vrl.
  # The log source's timezone setting arrives as .nano.source_timezone (an IANA
  # name such as "America/New_York", or any fixed offset such as "+05:30"), set
  # by nano at ingest. .nano is nano's input, never part of the log: it is
  # removed whole before anything else, whatever its shape.
  # A parser reads a clock that carries no offset AS UTC (timezone: "UTC", never
  # ambiguous) and records it: __time_assumed = true and the clock's ms in
  # __time_local (",<ms>" per clock). The spill block then turns every *time
  # field holding a recorded value into real UTC with the setting: a fixed
  # offset by arithmetic, an IANA zone with its DST rules (an ambiguous
  # fall-back time takes its FIRST occurrence, the earlier offset; a time in a
  # spring-forward gap moves forward by the gap), and records the zone used as
  # unmapped.nano_time_assumed_tz (the name, the offset as +HH:MM, or "UTC" when
  # the setting is absent or invalid). A clock with no year uses __src_year (the
  # current year in the source's zone) and records its ms in __time_noyear too:
  # a result more than a day in the future moves to the previous year.
  __src_nano = del(.nano)
  __src_tz_in = ""
  if is_object(__src_nano) { __src_tz_in = strip_whitespace(to_string(object!(__src_nano).source_timezone) ?? "") }
  __src_tz = "UTC"
  __src_shift_ms = 0
  __src_tz_label = "UTC"
  __time_assumed = false
  __time_inline = false
  __time_local = ""
  __time_noyear = ""
  __src_off = parse_regex(__src_tz_in, r'^(?P<sign>[+-])(?P<h>\d{2}):?(?P<m>\d{2})$') ?? {}
  if !is_empty(__src_off) {
      __src_h = to_int(__src_off.h) ?? 99
      __src_m = to_int(__src_off.m) ?? 99
      if __src_h <= 14 && __src_m <= 59 {
          __src_shift_ms = (__src_h * 3600 + __src_m * 60) * 1000
          if __src_off.sign == "-" { __src_shift_ms = 0 - __src_shift_ms }
          if __src_shift_ms != 0 { __src_tz_label = string!(__src_off.sign) + string!(__src_off.h) + ":" + string!(__src_off.m) }
      }
  } else if __src_tz_in != "" && downcase(__src_tz_in) != "local" {
      # "local" (the Vector host's zone) would make the time depend on the host.
      __src_probe, __src_probe_err = parse_timestamp("2000-01-01 00:00:00", "%Y-%m-%d %H:%M:%S", timezone: __src_tz_in)
      if __src_probe_err == null { __src_tz = __src_tz_in; __src_tz_label = __src_tz_in }
  }
  __src_now_ms = to_unix_timestamp(now(), unit: "milliseconds")
  __src_year = format_timestamp!(from_unix_timestamp!(__src_now_ms + __src_shift_ms, unit: "milliseconds"), "%Y", timezone: __src_tz)
  # END NAN source timezone
  # Tenable (Vulnerability Management / Security Center / Nessus) -> OCSF 1.9.0
  # Vulnerability Finding (2002) / Base Event (0)
  raw_log = to_string(.message) ?? ""
  __raw_body = raw_log
  __source_kv = {}
  ip_re = r'^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$|^[0-9A-Fa-f:]{3,}$'

  parsed, err = parse_json(raw_log)
  __source_kv = object(parsed) ?? {}
  e = object(parsed) ?? {}

  # ---- which Tenable shape ----
  # Tenable Vulnerability Management (Tenable.io) export: asset{} + plugin{}
  # Tenable Security Center (Tenable.sc) analysis API: pluginID + severity{}
  # Nessus REST API scan / host vulnerability rows: plugin_id + plugin_name
  shape = "unknown"
  if is_object(e.asset) && is_object(e.plugin) {
      shape = "tio"
  } else if e.pluginID != null && is_object(e.severity) {
      shape = "tsc"
  } else if e.plugin_id != null && e.plugin_name != null {
      shape = "nessus"
  }

  if err != null || !is_object(parsed) || shape == "unknown" {
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 99,
          "activity_name": "Other",
          "type_uid": 99,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": 0,
          "message": "Unrecognized Tenable record",
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": sha2("tenable|raw|" + raw_log, variant: "SHA-256"),
              "log_level": "error",
              "log_name": "tenable",
              "product": { "name": "Tenable", "vendor_name": "Tenable" }
          }
      }
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      . = set!(., ["unmapped", "parse_fallback"], "unparsable input")
  } else {
      plugin_id = ""
      plugin_name = ""
      family = ""
      synopsis = ""
      desc = ""
      solution = ""
      refs = []
      cves = []
      sev_key = ""
      state = "OPEN"
      first_ms = 0
      last_ms = 0
      host_ip = ""
      host_ip6 = ""
      host_fqdn = ""
      host_name = ""
      host_uid = ""
      host_mac = ""
      netbios = ""
      os_name = ""
      port = 0
      proto = ""
      svc = ""
      has_patch = null
      exploit = null
      v2_score = -1.0
      v2_vector = ""
      v3_score = -1.0
      v3_vector = ""
      v4_score = -1.0
      v4_vector = ""
      finding_uid = ""
      product_name = "Tenable Vulnerability Management"
      log_name = "vulnerability export"
      status_detail = ""
      accepted = false
      vendor_sev = ""
      cpe = ""

      if shape == "tio" {
          a = object(e.asset) ?? {}
          p = object(e.plugin) ?? {}
          plugin_id = to_string(p.id) ?? ""
          plugin_name = to_string(p.name) ?? ""
          family = to_string(p.family) ?? ""
          synopsis = to_string(p.synopsis) ?? ""
          desc = to_string(p.description) ?? ""
          solution = to_string(p.solution) ?? ""
          refs = array(p.see_also) ?? []
          for_each(array(p.cve) ?? []) -> |_i, c| {
              cs = upcase(to_string(c) ?? "")
              if match(cs, r'^CVE-\d{4}-\d+$') { cves = push(cves, cs) }
          }
          sev_key = downcase(to_string(e.severity) ?? "")
          state = upcase(to_string(e.state) ?? "OPEN")
          ff = to_string(e.first_found) ?? ""
          if ff != "" {
              t, terr = parse_timestamp(ff, "%+", timezone: "UTC")
              if terr == null { first_ms = to_unix_timestamp(t, unit: "milliseconds") }
          }
          lf = to_string(e.last_found) ?? ""
          if lf != "" {
              t, terr = parse_timestamp(lf, "%+", timezone: "UTC")
              if terr == null { last_ms = to_unix_timestamp(t, unit: "milliseconds") }
          }
          host_ip = to_string(a.ipv4) ?? ""
          host_ip6 = to_string(a.ipv6) ?? ""
          host_fqdn = to_string(a.fqdn) ?? ""
          host_name = to_string(a.hostname) ?? ""
          host_uid = to_string(a.uuid) ?? ""
          host_mac = to_string(a.mac_address) ?? ""
          netbios = to_string(a.netbios_name) ?? ""
          os_list = array(a.operating_system) ?? []
          os_name = to_string(get(os_list, [0]) ?? "") ?? ""
          po = object(e.port) ?? {}
          port = to_int(po.port) ?? 0
          proto = to_string(po.protocol) ?? ""
          svc = to_string(po.service) ?? ""
          if is_boolean(p.has_patch) { has_patch = p.has_patch }
          if is_boolean(p.exploit_available) { exploit = p.exploit_available }
          v2_score = if p.cvss_base_score == null || p.cvss_base_score == "" { -1.0 } else { to_float(p.cvss_base_score) ?? -1.0 }
          v2_vector = to_string(get(p, ["cvss_vector", "raw"]) ?? "") ?? ""
          v3_score = if p.cvss3_base_score == null || p.cvss3_base_score == "" { -1.0 } else { to_float(p.cvss3_base_score) ?? -1.0 }
          v3_vector = to_string(get(p, ["cvss3_vector", "raw"]) ?? "") ?? ""
          v4_score = if p.cvss4_base_score == null || p.cvss4_base_score == "" { -1.0 } else { to_float(p.cvss4_base_score) ?? -1.0 }
          v4_vector = to_string(get(p, ["cvss4_vector", "raw"]) ?? "") ?? ""
          finding_uid = to_string(e.finding_id) ?? ""
          vendor_sev = to_string(p.risk_factor) ?? ""
          cpe_list = array(p.cpe) ?? []
          cpe = to_string(get(cpe_list, [0]) ?? "") ?? ""
          if upcase(to_string(e.severity_modification_type) ?? "") == "ACCEPTED" { accepted = true }
      } else if shape == "tsc" {
          product_name = "Tenable Security Center"
          log_name = "analysis vulnerability"
          plugin_id = to_string(e.pluginID) ?? ""
          plugin_name = to_string(e.pluginName) ?? ""
          family = to_string(get(e, ["family", "name"]) ?? "") ?? ""
          synopsis = to_string(e.synopsis) ?? ""
          desc = to_string(e.description) ?? ""
          solution = to_string(e.solution) ?? ""
          see = to_string(e.seeAlso) ?? ""
          if see != "" { refs = split(see, r'\s+') }
          for_each(split(to_string(e.cve) ?? "", ",")) -> |_i, c| {
              # Tenable.sc writes N/A or other references here too; only CVE ids
              # become vulnerabilities[].cve.
              cs = upcase(strip_whitespace(c))
              if match(cs, r'^CVE-\d{4}-\d+$') { cves = push(cves, cs) }
          }
          sev_key = to_string(get(e, ["severity", "id"]) ?? "") ?? ""
          if sev_key == "" { sev_key = downcase(to_string(get(e, ["severity", "name"]) ?? "") ?? "") }
          # hasBeenMitigated is "1" both on a cumulative record that resurfaced
          # (reopened) and on a patched record that is currently fixed; the
          # patched one carries a positive mitigation time (or sourceType patched).
          # A cumulative record is the live view: a mitigation time older than
          # lastSeen is history from before the finding resurfaced, not a fix.
          mitigated_at = 0
          if e.mitigateTime != null { mitigated_at = to_int(e.mitigateTime) ?? 0 } else if e.lastMitigated != null { mitigated_at = to_int(e.lastMitigated) ?? 0 }
          src_type = downcase(to_string(e.sourceType) ?? "")
          seen_at = to_int(e.lastSeen) ?? 0
          if src_type == "patched" || (src_type != "cumulative" && mitigated_at > 0 && (seen_at == 0 || mitigated_at >= seen_at)) {
              state = "FIXED"
          } else if (to_string(e.hasBeenMitigated) ?? "") == "1" {
              state = "REOPENED"
              status_detail = "Previously mitigated"
          }
          if (to_string(e.acceptRisk) ?? "") == "1" { accepted = true }
          fs = to_int(e.firstSeen) ?? 0
          if fs > 0 { first_ms = fs * 1000 }
          ls = to_int(e.lastSeen) ?? 0
          if ls > 0 { last_ms = ls * 1000 }
          host_ip = to_string(e.ip) ?? ""
          host_fqdn = to_string(e.dnsName) ?? ""
          host_uid = to_string(e.uuid) ?? ""
          host_mac = to_string(e.macAddress) ?? ""
          netbios = to_string(e.netbiosName) ?? ""
          os_name = to_string(e.operatingSystem) ?? ""
          port = to_int(e.port) ?? 0
          proto = to_string(e.protocol) ?? ""
          ea = downcase(to_string(e.exploitAvailable) ?? "")
          if ea == "yes" { exploit = true }
          if ea == "no" { exploit = false }
          v2_score = if e.baseScore == null || e.baseScore == "" { -1.0 } else { to_float(e.baseScore) ?? -1.0 }
          v2_vector = to_string(e.cvssVector) ?? ""
          v3_score = if e.cvssV3BaseScore == null || e.cvssV3BaseScore == "" { -1.0 } else { to_float(e.cvssV3BaseScore) ?? -1.0 }
          v3_vector = to_string(e.cvssV3Vector) ?? ""
          vendor_sev = to_string(e.riskFactor) ?? ""
          cpe = to_string(e.cpe) ?? ""
          if contains(cpe, "<br/>") { cpe = "" }
          rid = to_string(get(e, ["repository", "id"]) ?? "") ?? ""
          finding_uid = "tsc|" + rid + "|" + host_ip + "|" + host_fqdn + "|" + plugin_id + "|" + to_string(port) + "|" + proto
      } else {
          product_name = "Nessus"
          log_name = "scan results"
          plugin_id = to_string(e.plugin_id) ?? ""
          plugin_name = to_string(e.plugin_name) ?? ""
          family = to_string(e.plugin_family) ?? ""
          sev_key = downcase(to_string(e.severity) ?? "")
          hn = to_string(e.hostname) ?? ""
          if match(hn, ip_re) { host_ip = hn } else { host_fqdn = hn }
          hid = to_string(e.host_id) ?? ""
          finding_uid = "nessus|" + hid + "|" + hn + "|" + plugin_id
      }

      # ---- severity: Tenable name or 0-4 id ----
      severity_id = 0
      severity = "Unknown"
      if sev_key == "info" || sev_key == "informational" || sev_key == "none" || sev_key == "0" { severity_id = 1; severity = "Informational" }
      if sev_key == "low" || sev_key == "1" { severity_id = 2; severity = "Low" }
      if sev_key == "medium" || sev_key == "2" { severity_id = 3; severity = "Medium" }
      if sev_key == "high" || sev_key == "3" { severity_id = 4; severity = "High" }
      if sev_key == "critical" || sev_key == "4" { severity_id = 5; severity = "Critical" }

      # ---- lifecycle: OPEN / REOPENED / FIXED ----
      activity_id = 1
      activity_name = "Create"
      status_id = 1
      status_str = "New"
      if state == "REOPENED" {
          activity_id = 2
          activity_name = "Update"
          if status_detail == "" { status_detail = "Reopened" }
      } else if state == "FIXED" {
          activity_id = 3
          activity_name = "Close"
          status_id = 4
          status_str = "Resolved"
      } else if state != "OPEN" && state != "NEW" && state != "ACTIVE" {
          status_id = 99
          status_str = "Other"
          status_detail = state
      }
      if accepted && status_id != 4 {
          status_id = 3
          status_str = "Suppressed"
          status_detail = "Risk accepted"
      }

      time_ms = last_ms
      if time_ms == 0 { time_ms = first_ms }
      if finding_uid == "" { finding_uid = sha2("tenable|" + host_uid + "|" + plugin_id + "|" + to_string(port) + "|" + proto, variant: "SHA-256") }
      title = plugin_name
      if title == "" { title = "Tenable plugin " + plugin_id }

      finding_info = { "uid": finding_uid, "title": title, "types": ["Vulnerability"], "data_sources": [product_name] }
      if synopsis != "" { finding_info.desc = synopsis }
      if first_ms > 0 { finding_info.first_seen_time = first_ms }
      if last_ms > 0 { finding_info.last_seen_time = last_ms }
      if plugin_id != "" {
          an = { "uid": plugin_id, "name": title, "type_id": 1, "type": "Rule" }
          if family != "" { an.category = family }
          finding_info.analytic = an
      }

      # ---- CVSS ----
      cvss = []
      if v4_score >= 0.0 {
          c4 = { "base_score": v4_score, "version": "4.0", "depth": "Base", "vendor_name": "Tenable" }
          if v4_vector != "" { c4.vector_string = v4_vector }
          cvss = push(cvss, c4)
      }
      if v3_score >= 0.0 && (v3_score > 0.0 || v3_vector != "") {
          c3 = { "base_score": v3_score, "version": "3", "depth": "Base", "vendor_name": "Tenable" }
          if v3_vector != "" { c3.vector_string = v3_vector }
          cvss = push(cvss, c3)
      }
      if v2_score >= 0.0 && (v2_score > 0.0 || v2_vector != "") {
          c2 = { "base_score": v2_score, "version": "2.0", "depth": "Base", "vendor_name": "Tenable" }
          if v2_vector != "" { c2.vector_string = v2_vector }
          cvss = push(cvss, c2)
      }

      base_vuln = { "title": title, "severity": severity, "vendor_name": "Tenable" }
      if vendor_sev != "" { base_vuln.severity = vendor_sev }
      if desc != "" { base_vuln.desc = desc }
      if length(refs) > 0 { base_vuln.references = refs }
      if solution != "" { base_vuln.remediation = { "desc": solution } }
      if has_patch != null { base_vuln.is_fix_available = has_patch }
      if exploit != null { base_vuln.is_exploit_available = exploit }
      if first_ms > 0 { base_vuln.first_seen_time = first_ms }
      if last_ms > 0 { base_vuln.last_seen_time = last_ms }
      if family != "" { base_vuln.category = family }

      # One vulnerability per CVE (OCSF allows just one of cve/advisory/cwe on
      # each); a plugin with no CVE is an advisory keyed by its plugin id.
      vulns = []
      for_each(cves) -> |_i, c| {
          cve = { "uid": upcase(to_string(c) ?? "") }
          if length(cvss) > 0 { cve.cvss = cvss }
          vulns = push(vulns, merge(base_vuln, { "cve": cve }))
      }
      if length(vulns) == 0 {
          adv = { "uid": plugin_id, "title": title }
          if plugin_id == "" { adv.uid = finding_uid }
          vulns = [merge(base_vuln, { "advisory": adv })]
      }

      # ---- the scanned asset ----
      res = {}
      if host_uid != "" { res.uid = host_uid }
      if !match(host_ip, ip_re) && match(host_ip6, ip_re) { host_ip = downcase(host_ip6) }
      if match(host_ip, ip_re) { res.ip = host_ip }
      if host_fqdn != "" { res.hostname = downcase(host_fqdn) }
      rname = host_fqdn
      if rname == "" { rname = netbios }
      if rname == "" && host_name != "" && !match(host_name, ip_re) { rname = host_name }
      if rname == "" { rname = host_ip }
      if rname != "" { res.name = rname }
      if !exists(res.name) && !exists(res.uid) { res.uid = finding_uid }
      res.type = "Host"
      if port > 0 || proto != "" || svc != "" {
          rd = {}
          if port > 0 { rd.port = port }
          if proto != "" { rd.protocol = proto }
          if svc != "" { rd.service = svc }
          res.data = rd
      }

      dev = { "type_id": 0, "type": "Unknown" }
      if host_uid != "" { dev.uid = host_uid }
      if match(host_ip, ip_re) { dev.ip = host_ip }
      if host_fqdn != "" { dev.hostname = downcase(host_fqdn) } else if host_name != "" && !match(host_name, ip_re) { dev.hostname = downcase(host_name) }
      if netbios != "" { dev.name = netbios }
      if host_mac != "" { dev.mac = downcase(host_mac) }
      if os_name != "" {
          os_type_id = 0
          os_type = "Unknown"
          los = downcase(os_name)
          if contains(los, "windows") { os_type_id = 100; os_type = "Windows" } else if contains(los, "mac os") || contains(los, "macos") { os_type_id = 300; os_type = "macOS" } else if contains(los, "linux") { os_type_id = 200; os_type = "Linux" }
          dev.os = { "name": os_name, "type_id": os_type_id, "type": os_type }
          if cpe != "" && starts_with(cpe, "cpe:/o") { dev.os.cpe_name = cpe }
      }

      obs = []
      for_each(cves) -> |_i, c| { obs = push(obs, { "name": "vulnerabilities.cve.uid", "type": "CVE Object: uid", "type_id": 18, "value": upcase(to_string(c) ?? "") }) }
      if match(host_ip, ip_re) { obs = push(obs, { "name": "resource.ip", "type": "IP Address", "type_id": 2, "value": host_ip }) }
      if host_ip6 != "" && downcase(host_ip6) != host_ip { obs = push(obs, { "name": "device.ipv6", "type": "IP Address", "type_id": 2, "value": downcase(host_ip6) }) }
      if host_fqdn != "" { obs = push(obs, { "name": "resource.hostname", "type": "Hostname", "type_id": 1, "value": downcase(host_fqdn) }) }
      if port > 0 { obs = push(obs, { "name": "resource.data.port", "type": "Port", "type_id": 11, "value": to_string(port) }) }

      ocsf = {
          "class_uid": 2002,
          "class_name": "Vulnerability Finding",
          "category_uid": 2,
          "category_name": "Findings",
          "activity_id": activity_id,
          "activity_name": activity_name,
          "type_uid": 200200 + activity_id,
          "severity_id": severity_id,
          "severity": severity,
          "status_id": status_id,
          "status": status_str,
          "time": time_ms,
          "message": title,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "profiles": ["security_control"],
              "uid": sha2("tenable|" + finding_uid + "|" + state + "|" + to_string(time_ms), variant: "SHA-256"),
              "original_event_uid": finding_uid,
              "log_name": log_name,
              "log_provider": product_name,
              "product": { "name": product_name, "vendor_name": "Tenable" }
          },
          "finding_info": finding_info,
          "vulnerabilities": vulns,
          "resource": res,
          "resources": [res],
          "is_alert": severity_id >= 4 && status_id != 4 && status_id != 3
      }
      if length(obs) > 0 { ocsf.observables = obs }
      if exists(dev.uid) || exists(dev.ip) || exists(dev.hostname) || exists(dev.name) { ocsf.device = dev }
      if status_detail != "" { ocsf.status_detail = status_detail }
