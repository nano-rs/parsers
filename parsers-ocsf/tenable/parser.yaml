  # BEGIN parser-specific transformations
  # first_found: Successful ISO timestamp conversion to the emitted millisecond clock.
  # last_found: Successful ISO timestamp conversion to the emitted millisecond clock.
  # firstSeen: Security Center epoch seconds converted to the emitted millisecond clock.
  # lastSeen: Security Center epoch seconds converted to the emitted millisecond clock.
  # severity: Tenable severity name (or Nessus 0-4 level) normalized to the OCSF severity; consume only when the expected ID is emitted.
  # severity.id: Security Center 0-4 severity id normalized to the OCSF severity; consume only when the expected ID is emitted.
  # severity.name: Security Center severity name normalized to the OCSF severity; consume only when the expected ID is emitted.
  # state: The finding state drives the OCSF activity (OPEN Create, REOPENED Update, FIXED Close); consume only when that activity is emitted.
  # asset.fqdn: Parser lowercases the FQDN; consume only when the normalized value is emitted.
  # dnsName: Parser lowercases the DNS name; consume only when the normalized value is emitted.
  # asset.mac_address: Parser lowercases the MAC address; consume only when the normalized value is emitted.
  # macAddress: Parser lowercases the MAC address; consume only when the normalized value is emitted.
  # asset.ipv6: Parser lowercases the IPv6 address; consume only when the normalized value is emitted.
  # baseScore: A whole-number CVSS score (for example 10.0) is emitted as the float base_score; consume when that value is emitted.
  # cvssV3BaseScore: A whole-number CVSS score (for example 10.0) is emitted as the float base_score; consume when that value is emitted.
  # plugin.cvss_base_score: A whole-number CVSS score (for example 10.0) is emitted as the float base_score; consume when that value is emitted.
  # plugin.cvss3_base_score: A whole-number CVSS score (for example 10.0) is emitted as the float base_score; consume when that value is emitted.
  # plugin.cvss4_base_score: A whole-number CVSS score (for example 10.0) is emitted as the float base_score; consume when that value is emitted.
  for_each(flatten(__source_kv)) -> |key, value| {
      if match(key, r'(?x)
      \A(?:
        first_found
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%+")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              if ."finding_info"."first_seen_time" == __expected { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        last_found
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%+")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              if ."finding_info"."last_seen_time" == __expected { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        firstSeen
      )\z') {
          __value = value
          __number, __number_err = to_float(__value)
          if __number_err == null && __value != null && !is_boolean(__value) {
              __expected = to_int(__number * 1000.0)
              if ."finding_info"."first_seen_time" == __expected { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        lastSeen
      )\z') {
          __value = value
          __number, __number_err = to_float(__value)
          if __number_err == null && __value != null && !is_boolean(__value) {
              __expected = to_int(__number * 1000.0)
              if ."finding_info"."last_seen_time" == __expected { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        severity
      )\z') {
          __value = value
          if __value != null {
              __expected = get!({"info": 1, "informational": 1, "none": 1, "low": 2, "medium": 3, "high": 4, "critical": 5, "0": 1, "1": 2, "2": 3, "3": 4, "4": 5}, [downcase(to_string(__value) ?? "")])
              if __expected != null {
                  if ."severity_id" == __expected { __consumed = __consumed + ("," + encode_json(key)) }
              }
          }
      }
      if match(key, r'(?x)
      \A(?:
        severity\.id
      )\z') {
          __value = value
          if __value != null {
              __expected = get!({"0": 1, "1": 2, "2": 3, "3": 4, "4": 5}, [downcase(to_string(__value) ?? "")])
              if __expected != null {
                  if ."severity_id" == __expected { __consumed = __consumed + ("," + encode_json(key)) }
              }
          }
      }
      if match(key, r'(?x)
      \A(?:
        severity\.name
      )\z') {
          __value = value
          if __value != null {
              __expected = get!({"info": 1, "low": 2, "medium": 3, "high": 4, "critical": 5}, [downcase(to_string(__value) ?? "")])
              if __expected != null {
                  if ."severity_id" == __expected { __consumed = __consumed + ("," + encode_json(key)) }
              }
          }
      }
      if match(key, r'(?x)
      \A(?:
        state
      )\z') {
          __value = value
          if __value != null {
              __expected = get!({"open": 1, "reopened": 2, "fixed": 3}, [downcase(to_string(__value) ?? "")])
              if __expected != null {
                  if ."activity_id" == __expected { __consumed = __consumed + ("," + encode_json(key)) }
              }
          }
      }
      if match(key, r'(?x)
      \A(?:
        asset\.fqdn
      | dnsName
      | asset\.mac_address
      | macAddress
      | asset\.ipv6
      )\z') {
          __value = value
          if is_string(__value) {
              __expected = downcase(string!(__value))
              if contains(__represented, "," + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        baseScore
      | cvssV3BaseScore
      | plugin\.cvss_base_score
      | plugin\.cvss3_base_score
      | plugin\.cvss4_base_score
      )\z') {
          __value = value
          __number, __number_err = to_float(__value)
          if __number_err == null && __value != null && !is_boolean(__value) {
              __expected = to_int(__number * 1.0)
              if contains(__represented, "," + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
