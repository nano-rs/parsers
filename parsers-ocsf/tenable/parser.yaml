  # Only source keys read by this parser are eligible for exact-value consumption; the selected branch must emit the value. Unknown keys always spill, even when their value equals an OCSF default.
  __candidates = r'(?x)
  \A(?:
    asset\.fqdn
  | asset\.hostname
  | asset\.ipv4
  | asset\.ipv6
  | asset\.mac_address
  | asset\.netbios_name
  | asset\.operating_system
  | asset\.uuid
  | baseScore
  | count
  | cpe
  | cve
  | cvssV3BaseScore
  | cvssV3Vector
  | cvssVector
  | description
  | dnsName
  | family\.name
  | finding_id
  | hostname
  | ip
  | macAddress
  | mitigateTime
  | lastMitigated
  | sourceType
  | netbiosName
  | operatingSystem
  | plugin\.cpe
  | plugin\.cve
  | plugin\.cvss3_base_score
  | plugin\.cvss3_vector\.raw
  | plugin\.cvss4_base_score
  | plugin\.cvss4_vector\.raw
  | plugin\.cvss_base_score
  | plugin\.cvss_vector\.raw
  | plugin\.description
  | plugin\.exploit_available
  | plugin\.family
  | plugin\.has_patch
  | plugin\.id
  | plugin\.name
  | plugin\.risk_factor
  | plugin\.see_also
  | plugin\.solution
  | plugin\.synopsis
  | plugin_family
  | plugin_id
  | plugin_name
  | pluginID
  | pluginName
  | port
  | port\.port
  | port\.protocol
  | port\.service
  | protocol
  | riskFactor
  | seeAlso
  | solution
  | synopsis
  | uuid
