source: json
transforms:
- source: unixTime
  kind: scale
  factor: 1000
  target: metadata.logged_time
  reason: Epoch seconds converted to the emitted OCSF millisecond timestamp.
- source: unixTime
  kind: scale
  factor: 1000
  target: time
  reason: Epoch seconds converted to the emitted OCSF millisecond timestamp.
- source: columns.time
  kind: scale
  factor: 1000
  target: time
  reason: Epoch seconds converted to the emitted OCSF millisecond timestamp.
- source: columns.time
  kind: scale
  factor: 1000
  target: session.created_time
  reason: Epoch seconds converted to the emitted OCSF millisecond timestamp.
- source: columns.mtime
  kind: scale
  factor: 1000
  target: file.modified_time
  reason: Epoch seconds converted to the emitted OCSF millisecond timestamp.
- source: columns.atime
  kind: scale
  factor: 1000
  target: file.accessed_time
  reason: Epoch seconds converted to the emitted OCSF millisecond timestamp.
- source: action
  kind: enum
  target: activity_id
  values:
    added: 1
    removed: 2
  reason: Differential added / removed normalized to Launch / Terminate, Logon / Logoff or Close; consume
    only when the expected ID is emitted.
- source: columns.action
  kind: enum
  target: activity_id
  values:
    created: 1
    accessed: 2
    updated: 3
    deleted: 4
    moved_from: 5
    moved_to: 5
    attributes_modified: 6
    opened: 14
  reason: The FIM action normalized to the OCSF File System Activity activity; consume only when the expected
    ID is emitted.
- source: severity
  kind: enum
  target: severity_id
  values:
    '0': 1
    '1': 3
    '2': 4
    '3': 6
  reason: The glog status severity normalized to the OCSF severity; consume only when the expected ID
    is emitted.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  columns.address:
  - dst_endpoint.ip
  columns.auid:
  - actor.user.uid
  columns.cmdline:
  - actor.process.cmd_line
  - process.cmd_line
  columns.cwd:
  - process.working_directory
  columns.host:
  - src_endpoint.ip
  columns.inode:
  - file.uid
  columns.md5:
  - file.hashes.value
  columns.name:
  - actor.process.name
  - process.name
  columns.parent:
  - actor.process.pid
  - process.parent_process.pid
  columns.path:
  - actor.process.file.path
  - process.file.path
  columns.pid:
  - actor.process.pid
  - process.pid
  columns.port:
  - dst_endpoint.port
  columns.protocol:
  - connection_info.protocol_num
  columns.sha1:
  - file.hashes.value
  columns.sha256:
  - file.hashes.value
  columns.size:
  - file.size
  columns.target_path:
  - file.path
  columns.tty:
  - session.terminal
  columns.uid:
  - file.owner.uid
  - process.user.uid
  columns.user:
  - user.name
  decorations.host_uuid:
  - device.uid
  decorations.hostname:
  - device.hostname
  - dst_endpoint.hostname
  hostIdentifier:
  - device.hostname
  message:
  - message
  name:
  - metadata.event_code
  version:
  - metadata.product.version
