source: json
transforms:
- source: unixTime
  kind: scale
  factor: 1000
  target: metadata.logged_time
  reason: Epoch seconds converted to the emitted OCSF millisecond timestamp.
- source: unixTime
  kind: scale
  factor: 1000
  target: time
  reason: Epoch seconds converted to the emitted OCSF millisecond timestamp.
- source: columns.time
  kind: scale
  factor: 1000
  target: time
  reason: Epoch seconds converted to the emitted OCSF millisecond timestamp.
- source: columns.time
  kind: scale
  factor: 1000
  target: session.created_time
  reason: Epoch seconds converted to the emitted OCSF millisecond timestamp.
- source: columns.start_time
  kind: scale
  factor: 1000
  target: process.created_time
  reason: Epoch seconds converted to the emitted OCSF millisecond timestamp.
- source: columns.mtime
  kind: scale
  factor: 1000
  target: file.modified_time
  reason: Epoch seconds converted to the emitted OCSF millisecond timestamp.
- source: columns.atime
  kind: scale
  factor: 1000
  target: file.accessed_time
  reason: Epoch seconds converted to the emitted OCSF millisecond timestamp.
- source: action
  kind: enum
  target: activity_id
  values:
    added: 1
    removed: 2
  reason: Differential added / removed normalized to Launch / Terminate, Logon / Logoff or Close; consume only when the expected ID is emitted.
- source: action
  kind: enum
  target: activity_id
  values:
    added: 7
  reason: A listening_ports row that was added is a Listen; consume only when the expected ID is emitted.
- source: columns.action
  kind: enum
  target: activity_id
  values:
    created: 1
    accessed: 2
    updated: 3
    deleted: 4
    moved_from: 5
    moved_to: 5
    attributes_modified: 6
    opened: 14
  reason: The FIM action normalized to the OCSF File System Activity activity; consume only when the expected ID is emitted.
- source: severity
  kind: enum
  target: severity_id
  values:
    '0': 1
    '1': 3
    '2': 4
    '3': 6
  reason: The glog status severity normalized to the OCSF severity; consume only when the expected ID is emitted.
consumed_candidates:
- action
- columns.action
- columns.address
- columns.atime
- columns.auid
- columns.cmdline
- columns.cwd
- columns.host
- columns.inode
- columns.md5
- columns.mtime
- columns.name
- columns.parent
- columns.path
- columns.pid
- columns.port
- columns.protocol
- columns.sha1
- columns.sha256
- columns.sid
- columns.size
- columns.start_time
- columns.target_path
- columns.time
- columns.tty
- columns.uid
- columns.user
- decorations.host_uuid
- decorations.hostname
- hostIdentifier
- message
- name
- severity
- unixTime
- version
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
