source: json
transforms:
- source: recordedAt
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: createdAt
  kind: epoch_ms
  target: metadata.logged_time
  reason: Successful ISO timestamp conversion of the log write time in milliseconds.
- source: result.status
  kind: enum
  target: status
  values:
    success: Success
    succeeded: Success
    failed: Failure
    failure: Failure
  reason: PingOne result.status normalized to the OCSF status caption; consume only
    when the emitted caption matches (a named-failure override keeps it residual).
consumed_candidates:
- action.description
- action.type
- actors.client.environment.id
- actors.client.id
- actors.client.name
- actors.user.environment.id
- actors.user.id
- actors.user.name
- correlationId
- id
- internalCorrelation.sessionId
- internalCorrelation.transactionId
- result.description
- source.ipAddress
- source.userAgent
- tags
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
