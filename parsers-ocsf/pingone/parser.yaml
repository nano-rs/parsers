name: pingone_ocsf
display_name: PingOne (OCSF)
version: "1.0.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields, unaltered, in dotted snake_case unmapped keys.
  Parses PingOne platform audit activities (GET /v1/environments/{id}/activities,
  or the same JSON pushed by a PingOne webhook subscription) into complete OCSF
  1.9.0 records, routed by action.type:
    USER.ACCESS_ALLOWED / USER.ACCESS_DENIED, PASSWORD.CHECK_*, OTP.CHECK_*,
    USER.KERBEROS_*, SESSION.CREATED       -> Authentication 3002 (Logon)
    SESSION.DELETED, USER.SLO_*            -> Authentication 3002 (Logoff)
    USER.*, PASSWORD.* (set/reset/lock), DEVICE.* (MFA devices),
    ROLE_ASSIGNMENT.* on a USER            -> User Management 3007
    GROUP.*, MEMBER_OF_GROUP.*             -> Group Management 3006
    every other action type (configuration of applications, policies,
    populations, flows, keys, ...)         -> API Activity 6003
  Account Change 3001 is deprecated in OCSF 1.9 and is not emitted. The outcome
  comes from result.status, overridden to Failure when the action type itself
  names a failure (PASSWORD.CHECK_FAILED is logged with status SUCCESS: the
  audit write succeeded, the password check did not). actors.user is the actor
  (admin) and the USER entry in resources[] is the subject; on group
  membership events the member is read from the MEMBER_OF_GROUP resource
  (its id and href) and the group id from its href. One activity per
  input event: split a paged `_embedded.activities` response upstream.
  PingFederate audit logs (pipe-delimited / CEF) are a different source and are
  not handled here.
match_values:
  - pingone
category: security
vendor: "Ping Identity"
product: "PingOne"
parser_vrl: |
  # PingOne audit activity JSON -> OCSF 1.9.0.
  raw_log = to_string(.message) ?? ""
  __raw_body = raw_log
  __source_kv = {}
  parsed, err = parse_json(raw_log)
  __source_kv = object(parsed) ?? {}

  if err != null || !is_object(parsed) || !is_object(parsed.action) {
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 0,
          "activity_name": "Unknown",
          "type_uid": 0,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": 0,
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "uid": sha2("pingone|raw|" + raw_log, variant: "SHA-256"),
              "log_level": "error",
              "log_name": "Audit Activities",
              "log_provider": "PingOne",
              "product": { "name": "PingOne", "vendor_name": "Ping Identity" }
          },
          "unmapped": { "parse_error": "not a PingOne audit activity" }
      }
      # NAN-5264: explicit fallback marker; nano parser health counts it.
      . = set!(., ["unmapped", "parse_fallback"], "unparsable input")
  } else {
      p = object!(parsed)
      act = object(p.action) ?? {}
      action_type = upcase(string(act.type) ?? "")
      action_desc = string(act.description) ?? ""
      actors = object(p.actors) ?? {}
      a_user = object(actors.user) ?? {}
      a_client = object(actors.client) ?? {}
      result = object(p.result) ?? {}
      src = object(p.source) ?? {}
      icorr = object(p.internalCorrelation) ?? {}
      ecorr = object(p.externalCorrelation) ?? {}

      # ---- time: recordedAt (event clock), createdAt (log write) ----
      time_ms = 0
      t, terr = parse_timestamp(string(p.recordedAt) ?? "", "%+")
      if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
      logged_ms = 0
      lt, lterr = parse_timestamp(string(p.createdAt) ?? "", "%+")
      if lterr == null { logged_ms = to_unix_timestamp(lt, unit: "milliseconds") }
      if time_ms == 0 { time_ms = logged_ms }

      # ---- outcome ----
      rstatus = upcase(string(result.status) ?? "")
      status_id = 0
      status_str = "Unknown"
      if rstatus == "SUCCESS" || rstatus == "SUCCEEDED" { status_id = 1; status_str = "Success" }
      if rstatus == "FAILED" || rstatus == "FAILURE" { status_id = 2; status_str = "Failure" }
      named_failure = match(action_type, r'(FAILED|DENIED|INVALID|FAILURE|FRAUD_REPORTED|ERROR)')
      if named_failure { status_id = 2; status_str = "Failure" }

      severity_id = 1
      severity = "Informational"
      if status_id == 2 { severity_id = 2; severity = "Low" }
      if match(action_type, r'^(USER|PASSWORD|DEVICE)\.LOCKED$|FRAUD_REPORTED|PAIRING_FAILED_COMPROMISED') { severity_id = 3; severity = "Medium" }

      # ---- actor (admin or client performing the action) ----
      email_re = r'^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$'
      actor = {}
      au_name = string(a_user.name) ?? ""
      au_id = string(a_user.id) ?? ""
      if au_name != "" || au_id != "" {
          au = { "type_id": 1, "type": "User" }
          if au_name != "" { au.name = au_name }
          if au_id != "" { au.uid = au_id }
          if match(au_name, email_re) { au.email_addr = au_name }
          actor.user = au
      }
      ac_name = string(a_client.name) ?? ""
      ac_id = string(a_client.id) ?? ""
      if ac_name != "" { actor.app_name = ac_name }
      if ac_id != "" { actor.app_uid = ac_id }

      # ---- subject: first USER / GROUP in resources[] ----
      resources = array(p.resources) ?? []
      subj = {}
      have_subj = false
      grp = {}
      have_grp = false
      for_each(resources) -> |_i, rv| {
          r = object(rv) ?? {}
          rtype = upcase(string(r.type) ?? "")
          rname = string(r.name) ?? ""
          rid = string(r.id) ?? ""
          if rtype == "USER" && !have_subj {
              su = { "type_id": 1, "type": "User" }
              if rname != "" { su.name = rname }
              if rid != "" { su.uid = rid }
              if match(rname, email_re) { su.email_addr = rname }
              # OCSF user needs at least one of name / uid.
              if exists(su.name) || exists(su.uid) {
                  subj = su
                  have_subj = true
              }
          }
          if rtype == "GROUP" && !have_grp {
              g = {}
              if rname != "" { g.name = rname }
              if rid != "" { g.uid = rid }
              if length(g) > 0 { grp = g; have_grp = true }
          }
          # A membership resource names the GROUP but carries the USER's id;
          # its href is .../users/{user id}/memberOfGroups/{group id}.
          if rtype == "MEMBER_OF_GROUP" && !have_grp {
              g = {}
              if rname != "" { g.name = rname }
              member_uid = rid
              hm, hmerr = parse_regex(string(r.href) ?? "", r'/users/(?P<uid>[^/?#]+)/memberOfGroups/(?P<gid>[^/?#]+)')
              if hmerr == null {
                  member_uid = string!(hm.uid)
                  g.uid = string!(hm.gid)
              }
              if length(g) > 0 { grp = g; have_grp = true }
              if member_uid != "" && !have_subj {
                  subj = { "type_id": 1, "type": "User", "uid": member_uid }
                  have_subj = true
              }
          }
      }

      env_id = string(a_user.environment.id) ?? ""
      if env_id == "" { env_id = string(a_client.environment.id) ?? "" }
      if env_id == "" && length(resources) > 0 { env_id = string(resources[0].environment.id) ?? "" }

      # ---- source endpoint ----
      src_ip = string(src.ipAddress) ?? ""
      ua = string(src.userAgent) ?? ""
      src_ep = {}
      # ip_t only takes a real address; anything else stays in unmapped.
      if src_ip != "" && (is_ipv4(src_ip) || is_ipv6(src_ip)) { src_ep.ip = src_ip }

      # ---- class routing ----
      prefix = string(split(action_type, ".")[0]) ?? ""
      verb = ""
      vparts = split(action_type, ".")
      if length(vparts) > 1 { verb = string(vparts[1]) ?? "" }
      class_uid = 6003
      if includes(["USER.ACCESS_ALLOWED", "USER.ACCESS_DENIED", "SESSION.CREATED", "SESSION.DELETED", "USER.KERBEROS_SUCCEEDED", "USER.KERBEROS_FAILED"], action_type) || starts_with(action_type, "PASSWORD.CHECK_") || starts_with(action_type, "OTP.CHECK_") || starts_with(action_type, "USER.SLO_") {
          class_uid = 3002
      } else if prefix == "USER" || prefix == "PASSWORD" || prefix == "DEVICE" || (prefix == "ROLE_ASSIGNMENT" && have_subj) {
          # A role assigned to a non-USER principal (GATEWAY, APPLICATION) is
          # not a user change: it stays API Activity with the principal in
          # resources[], so the admin is never recorded as the subject.
          class_uid = 3007
      } else if prefix == "GROUP" || prefix == "MEMBER_OF_GROUP" {
          class_uid = 3006
      }

      ocsf = {}
      if class_uid == 3002 {
          activity_id = 1
          activity_name = "Logon"
          if action_type == "SESSION.DELETED" || starts_with(action_type, "USER.SLO_") { activity_id = 2; activity_name = "Logoff" }
          ocsf.class_name = "Authentication"
          ocsf.category_uid = 3
          ocsf.category_name = "Identity & Access Management"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          # Authentication carries the principal in `user`: the resource USER,
          # else the acting user.
          if have_subj {
              ocsf.user = subj
          } else if exists(actor.user) {
              ocsf.user = actor.user
          } else {
              ocsf.user = { "name": "unknown" }
          }
          if exists(actor.user) && have_subj && actor.user != subj { ocsf.actor = { "user": actor.user } }
          svc_name = ac_name
          if svc_name == "" { svc_name = "PingOne" }
          svc = { "name": svc_name }
          if ac_id != "" { svc.uid = ac_id }
          ocsf.service = svc
          if starts_with(action_type, "OTP.CHECK_") {
              ocsf.is_mfa = true
              ocsf.auth_factors = [{ "factor_type_id": 7, "factor_type": "OTP" }]
          }
          if starts_with(action_type, "PASSWORD.CHECK_") { ocsf.auth_factors = [{ "factor_type_id": 11, "factor_type": "Password" }] }
          if starts_with(action_type, "USER.KERBEROS_") { ocsf.auth_protocol_id = 2; ocsf.auth_protocol = "Kerberos" }
          ocsf.is_remote = true
          sid = string(icorr.sessionId) ?? ""
          if sid != "" { ocsf.session = { "uid": sid } }
      } else if class_uid == 3007 {
          activity_id = 99
          activity_name = "Other"
          if action_type == "USER.CREATED" { activity_id = 1; activity_name = "Create" }
          if includes(["USER.UPDATED", "USER.MOVED", "PASSWORD.FORCE_CHANGE", "PASSWORD.UNSET"], action_type) { activity_id = 2; activity_name = "Update" }
          if action_type == "USER.DELETED" { activity_id = 3; activity_name = "Delete" }
          if action_type == "USER.LOCKED" || action_type == "PASSWORD.LOCKED" { activity_id = 6; activity_name = "Lock" }
          if action_type == "USER.UNLOCKED" || action_type == "PASSWORD.UNLOCKED" { activity_id = 7; activity_name = "Unlock" }
          if action_type == "PASSWORD.SET" || action_type == "PASSWORD.EXTERNAL_SET" { activity_id = 8; activity_name = "Password Change" }
          if action_type == "PASSWORD.RESET" || action_type == "PASSWORD.RECOVERY" { activity_id = 9; activity_name = "Password Reset" }
          if action_type == "DEVICE.CREATED" || action_type == "DEVICE.ACTIVATED" { activity_id = 12; activity_name = "Enable MFA Factors" }
          if action_type == "DEVICE.DELETED" { activity_id = 13; activity_name = "Disable MFA Factors" }
          if action_type == "ROLE_ASSIGNMENT.CREATED" { activity_id = 16; activity_name = "Assign Roles" }
          if action_type == "ROLE_ASSIGNMENT.DELETED" { activity_id = 17; activity_name = "Remove Roles" }
          ocsf.class_name = "User Management"
          ocsf.category_uid = 3
          ocsf.category_name = "Identity & Access Management"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          if have_subj {
              ocsf.user = subj
          } else if exists(actor.user) {
              ocsf.user = actor.user
          } else {
              ocsf.user = { "name": "unknown" }
          }
          if length(actor) > 0 { ocsf.actor = actor }
      } else if class_uid == 3006 {
          activity_id = 99
          activity_name = "Other"
          if action_type == "MEMBER_OF_GROUP.CREATED" { activity_id = 3; activity_name = "Add User" }
          if action_type == "MEMBER_OF_GROUP.DELETED" { activity_id = 4; activity_name = "Remove User" }
          if action_type == "GROUP.CREATED" { activity_id = 6; activity_name = "Create" }
          if action_type == "GROUP.DELETED" { activity_id = 5; activity_name = "Delete" }
          if action_type == "GROUP.UPDATED" { activity_id = 9; activity_name = "Update" }
          ocsf.class_name = "Group Management"
          ocsf.category_uid = 3
          ocsf.category_name = "Identity & Access Management"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          if have_grp {
              ocsf.group = grp
          } else {
              ocsf.group = { "name": "unknown" }
          }
          if have_subj { ocsf.user = subj }
          if length(actor) > 0 { ocsf.actor = actor }
      } else {
          activity_id = 99
          activity_name = "Other"
          if verb == "CREATED" { activity_id = 1; activity_name = "Create" }
          if verb == "READ" { activity_id = 2; activity_name = "Read" }
          if verb == "UPDATED" { activity_id = 3; activity_name = "Update" }
          if verb == "DELETED" { activity_id = 4; activity_name = "Delete" }
          ocsf.class_name = "API Activity"
          ocsf.category_uid = 6
          ocsf.category_name = "Application Activity"
          ocsf.activity_id = activity_id
          ocsf.activity_name = activity_name
          ocsf.api = { "operation": action_type, "service": { "name": "PingOne" } }
          if length(actor) == 0 { actor = { "app_name": "PingOne" } }
          ocsf.actor = actor
          # API Activity requires src_endpoint; the audit record names no
          # caller address for most configuration events.
          if length(src_ep) == 0 { src_ep = { "hostname": "unknown" } }
          res_list = []
          for_each(resources) -> |_i, rv| {
              r = object(rv) ?? {}
              rd = { "type": string(r.type) ?? "" }
              rn = string(r.name) ?? ""
              if rn != "" { rd.name = rn }
              ri = string(r.id) ?? ""
              if ri != "" { rd.uid = ri }
              # OCSF resource needs at least one of name / uid.
              if rn != "" || ri != "" { res_list = push(res_list, rd) }
          }
          if length(res_list) > 0 { ocsf.resources = res_list }
      }
      ocsf.class_uid = class_uid
      if length(src_ep) > 0 { ocsf.src_endpoint = src_ep }
      if ua != "" { ocsf.http_request = { "user_agent": ua } }

      ocsf.status_id = status_id
      ocsf.status = status_str
      rdesc = string(result.description) ?? ""
      if rdesc != "" { ocsf.status_detail = rdesc }
      ocsf.severity_id = severity_id
      ocsf.severity = severity
      ocsf.type_uid = class_uid * 100 + to_int(ocsf.activity_id)
      ocsf.time = time_ms
      msg = action_desc
      if msg == "" { msg = action_type }
      ocsf.message = msg
      ocsf.raw_data = raw_log

      evt_uid = string(p.id) ?? ""
      if evt_uid == "" { evt_uid = sha2("pingone|raw|" + raw_log, variant: "SHA-256") }
      meta = {
          "version": "1.9.0",
          "uid": evt_uid,
          "event_code": action_type,
          "log_name": "Audit Activities",
          "log_provider": "PingOne",
          "product": { "name": "PingOne", "vendor_name": "Ping Identity" }
      }
      corr = string(p.correlationId) ?? ""
      if corr == "" { corr = string(icorr.transactionId) ?? "" }
      if corr != "" { meta.correlation_uid = corr }
      if logged_ms > 0 { meta.logged_time = logged_ms }
      if env_id != "" { meta.tenant_uid = env_id }
      tags = array(p.tags) ?? []
      if length(tags) > 0 { meta.labels = tags }
      ocsf.metadata = meta

      . = ocsf
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # Values spill exactly as parsed: a parser never masks, redacts or withholds
  # anything (masking is an opt-in pipeline step, never a parser concern).
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # A source field is consumed ONLY by an explicit mapping: a field-coverage.yaml
  # `mappings` entry (source key -> target paths) or a `transforms` rule with a
  # target, whose value is found AT THAT TARGET PATH of the selected branch. A
  # value that merely appears somewhere else in the event never consumes a field
  # (no coincidental consumption); everything else spills.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The sets below are strings instead
  # (a read shares the buffer). __repr holds one member per mapped leaf:
  # "," + encode_json(path) + "=" + encode_json(encode_json(value)), plus the
  # to_string form for a string or a float, so a numeric string is represented by
  # its typed scalar. Every part is a JSON text, inside which a '"' is always
  # escaped, so a member is matched exactly. Paths drop array indices
  # (resources.0.uid is resources.uid); arrays are walked two levels deep, and a
  # leaf deeper than that is simply not mapping evidence (it can only spill more).
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped = object!(parse_json!(encode_json(__mapped)))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __copy = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __repr = ""
  for_each(flatten(__mapped)) -> |path, value| {
      __p = encode_json(path)
      if is_array(value) {
          for_each(array!(value)) -> |_i, item| {
              if is_object(item) {
                  for_each(flatten(object!(item))) -> |sub, leaf| {
                      __q = encode_json(path + "." + sub)
                      if is_array(leaf) {
                          for_each(array!(leaf)) -> |_j, x| {
                              if !is_object(x) && !is_array(x) {
                                  __repr = __repr + ("," + __q + "=" + encode_json(encode_json(x)))
                                  if is_string(x) || is_float(x) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(x))) }
                              }
                          }
                      } else {
                          __repr = __repr + ("," + __q + "=" + encode_json(encode_json(leaf)))
                          if is_string(leaf) || is_float(leaf) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(leaf))) }
                      }
                  }
              } else if !is_array(item) {
                  __repr = __repr + ("," + __p + "=" + encode_json(encode_json(item)))
                  if is_string(item) || is_float(item) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(item))) }
              }
          }
      } else {
          __repr = __repr + ("," + __p + "=" + encode_json(encode_json(value)))
          if is_string(value) || is_float(value) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(value))) }
      }
  }
  __consumed = ""
  # BEGIN parser-specific transformations
  # recordedAt: Successful ISO timestamp conversion to the selected event clock in milliseconds.
  # createdAt: Successful ISO timestamp conversion of the log write time in milliseconds.
  # result.status: PingOne result.status normalized to the OCSF status caption; consume only when the emitted caption matches (a named-failure override keeps it residual).
  for_each(flatten(__source_kv)) -> |key, value| {
      if match(key, r'(?x)
      \A(?:
        recordedAt
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%+")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              if contains(__repr, "," + "\"time\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        createdAt
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%+")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              if contains(__repr, "," + "\"metadata.logged_time\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
      if match(key, r'(?x)
      \A(?:
        result\.status
      )\z') {
          __value = value
          if __value != null {
              __expected = get!({"success": "Success", "succeeded": "Success", "failed": "Failure", "failure": "Failure"}, [downcase(to_string(__value) ?? "")])
              if __expected != null {
                  if contains(__repr, "," + "\"status\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
              }
          }
      }
  }
  # Declared source -> target mappings (field-coverage.yaml `mappings`).
  __decl = "\n\"action.description\"\t[\"message\"]\n\"action.type\"\t[\"api.operation\",\"metadata.event_code\"]\n\"actors.client.environment.id\"\t[\"metadata.tenant_uid\"]\n\"actors.client.id\"\t[\"actor.app_uid\",\"service.uid\"]\n\"actors.client.name\"\t[\"actor.app_name\",\"service.name\"]\n\"actors.user.environment.id\"\t[\"metadata.tenant_uid\"]\n\"actors.user.id\"\t[\"actor.user.uid\"]\n\"actors.user.name\"\t[\"actor.user.email_addr\",\"actor.user.name\"]\n\"correlationId\"\t[\"metadata.correlation_uid\"]\n\"id\"\t[\"metadata.uid\"]\n\"internalCorrelation.sessionId\"\t[\"session.uid\"]\n\"result.description\"\t[\"status_detail\"]\n\"source.ipAddress\"\t[\"src_endpoint.ip\"]\n\"source.userAgent\"\t[\"http_request.user_agent\"]\n\"tags\"\t[\"metadata.labels\"]\n"
  __preserve = []
  # END parser-specific transformations
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__copy.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # Declared mappings: __decl holds "\n" + encode_json(key) + "\t" + JSON array of
  # target paths + "\n" per mapped source key (a raw newline never occurs in
  # compact JSON). A key is consumed when its value, or every element of a scalar
  # array, is at one of its own targets.
  for_each(__flat) -> |key, value| {
      if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
      # __decl spells a bracket inside a key as a \u escape (deploy bracket count).
      __kt = encode_json(key)
      if match(__kt, r'[\x28\x29\x5B\x5D\x7B\x7D]') {
          __kt = replace(replace(replace(replace(replace(replace(__kt, r'\x28', "\\u0028"), r'\x29', "\\u0029"), r'\x5B', "\\u005b"), r'\x5D', "\\u005d"), r'\x7B', "\\u007b"), r'\x7D', "\\u007d")
      }
      __at = find(__decl, "\n" + __kt + "\t")
      if is_integer(__at) && !is_object(value) {
          __rest = slice!(__decl, int!(__at) + strlen(__kt) + 2)
          __hit = false
          for_each(array!(parse_json!(slice!(__rest, 0, int!(find(__rest, "\n")))))) -> |_i, target| {
              __tok = "," + encode_json(target) + "="
              if !__hit && is_array(value) {
                  __all = !is_empty(array!(value))
                  for_each(array!(value)) -> |_j, item| {
                      if __all {
                          __all = !is_object(item) && !is_array(item) && (contains(__repr, __tok + encode_json(encode_json(item))) || ((is_string(item) || is_float(item)) && contains(__repr, __tok + encode_json(to_string!(item)))))
                      }
                  }
                  __hit = __all
              } else if !__hit {
                  __hit = contains(__repr, __tok + encode_json(encode_json(value))) || ((is_string(value) || is_float(value)) && contains(__repr, __tok + encode_json(to_string!(value))))
              }
          }
          if __hit { __consumed = __consumed + ("," + encode_json(key)) }
      }
  }
  # Fast path: when no two source keys decode to the same key and no two spilled
  # keys get the same name, each key's decision depends only on its own value, so
  # one filter and one rename build the residual without copying it per key.
  __distinct = true
  if __tilde {
      __distinct = length(map_keys(__flat) -> |key| { replace(replace(key, "~1", "."), "~0", "~") }) == length(__flat)
  }
  __kept = {}
  __names = {}
  if __distinct {
      __kept = filter(__flat) -> |key, value| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          # A key is kept unless an explicit mapping or transformation consumed it.
          # Do not spill a copy of the raw body.
          value != __raw_body && !contains(__consumed, "," + encode_json(key))
      }
      __names = map_keys(__kept) -> |key| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          join!(__parts, ".")
      }
  }
  __residual = {}
  if __distinct && length(__names) == length(__kept) {
      __residual = map_values(__names) -> |value| {
          if is_array(value) || is_object(value) {
              if __tilde {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              if __complex { value = encode_json(value) }
          }
          value
      }
  } else {
      # Slow path, in source key order: a name already taken gets the next free
      # _2, _3, ... suffix.
      for_each(__flat) -> |key, value| {
          key = replace(replace(key, "~1", "."), "~0", "~")
          if is_array(value) || is_object(value) {
              value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                  replace(replace(inner, "~1", "."), "~0", "~")
              }, ["v"])
          }
          __token = "," + encode_json(key)
          if !contains(__consumed, __token) && value != __raw_body {
              __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
              __base = join!(__parts, ".")
              __key = __base
              __suffix = 2
              if includes(keys(__residual), __key) {
                  for_each(__flat) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __key) {
                          __key = __base + "_" + to_string(__suffix)
                          __suffix = __suffix + 1
                      }
                  }
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              __spill = if __complex { encode_json(value) } else { value }
              __residual = set!(__residual, [__key], __spill)
          }
      }
  }
  # Keep existing derived evidence, but remove null placeholders and copies of a
  # source value (that value is mapped or spilled above under its source path).
  # A value merely equal to some mapped attribute is kept: equality with an
  # unrelated attribute is no evidence that it is represented.
  # The canonical source spill above is the authoritative representation of
  # containers. The cheap conditions run first; the source value set is built on
  # first use.
  __original_values = null
  for_each(flatten(__existing)) -> |key, value| {
      if !is_null(value) && value != "" && !is_array(value) && !is_object(value) && value != __raw_body {
          # Members for the value itself and for to_string(value), as above.
          __json = encode_json(value)
          __as_json = "," + encode_json(__json)
          __as_string = __as_json
          if is_string(value) { __as_string = "," + __json } else if is_float(value) { __as_string = "," + encode_json(to_string!(value)) }
          if __original_values == null {
              # __source_kv may hold non-JSON types (a timestamp), so only an
              # integer or a boolean skips its to_string member here.
              __original_values = join!(map_values(values(flatten(__source_kv))) -> |source_value| {
                  __source_json = encode_json(source_value)
                  __tokens = "," + encode_json(__source_json)
                  if is_string(source_value) {
                      __tokens = __tokens + "," + __source_json
                  } else if !is_object(source_value) && !is_array(source_value) && !is_integer(source_value) && !is_boolean(source_value) {
                      __tokens = __tokens + "," + encode_json(to_string(source_value) ?? "")
                  }
                  __tokens
              }, "")
          }
          __source_set = string!(__original_values)
          __keep = !contains(__source_set, __as_json) && !contains(__source_set, __as_string)
          # Only text opening an object or an array (after JSON whitespace)
          # decodes to a container.
          if __keep && is_string(value) && match(string!(value), r'^[ \t\n\r]*[\x5B\x7B]') {
              __decoded, __decode_err = parse_json(string!(value))
              __keep = !(__decode_err == null && (is_object(__decoded) || is_array(__decoded)))
          }
          if __keep {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, as-is. These
  # entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__copy.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

