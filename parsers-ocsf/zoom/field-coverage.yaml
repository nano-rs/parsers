source: json
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
transforms:
- source: time
  kind: epoch_ms
  target: time
  format: '%+'
  reason: ISO activity / operation-log time converted to the event clock in milliseconds.
- source: payload.object.date_time
  kind: epoch_ms
  target: time
  format: '%+'
  reason: Webhook object time, used only when event_ts is absent.
- source: payload.object.start_time
  kind: epoch_ms
  target: time
  format: '%+'
  reason: meeting.started start time, used when the webhook has no event_ts.
mappings:
  email:
  - user.email_addr
  - user.name
  ip_address:
  - src_endpoint.ip
  type:
  - message
  action:
  - api.operation
  category_type:
  - api.group.name
  operation_detail:
  - message
  operator:
  - actor.user.email_addr
  - actor.user.name
  event:
  - api.operation
  - message
  - metadata.event_code
  event_ts:
  - time
  payload.account_id:
  - metadata.tenant_uid
  payload.object.email:
  - user.email_addr
  - user.name
  payload.object.id:
  - resources.uid
  - user.uid
  payload.operator:
  - actor.user.email_addr
  - actor.user.name
  payload.operator_id:
  - actor.user.uid
  payload.time_stamp:
  - time
  payload.object.host_id:
  - actor.user.uid
  payload.object.topic:
  - resources.name
  payload.object.uuid:
  - resources.uid
  payload.object.participant.public_ip:
  - src_endpoint.ip
  payload.object.host_email:
  - actor.user.email_addr
  - actor.user.name
