source: json
transforms:
- source: time
  kind: epoch_ms
  target: time
  format: '%+'
  reason: ISO activity / operation-log time converted to the event clock in milliseconds.
- source: payload.object.date_time
  kind: epoch_ms
  target: time
  format: '%+'
  reason: Webhook object time, used only when event_ts is absent.
- source: payload.object.participant.join_time
  kind: epoch_ms
  target: time
  format: '%+'
  reason: Participant join time, used when the webhook has no event_ts.
- source: payload.object.participant.leave_time
  kind: epoch_ms
  target: time
  format: '%+'
  reason: Participant leave time, used when the webhook has no event_ts.
- source: payload.object.participant.sharing_details.date_time
  kind: epoch_ms
  target: time
  format: '%+'
  reason: Screen-share time, used when the webhook has no event_ts.
- source: payload.object.recording_file.recording_start
  kind: epoch_ms
  target: time
  format: '%+'
  reason: Recording segment start, used when the webhook has no event_ts.
- source: payload.object.end_time
  kind: epoch_ms
  target: time
  format: '%+'
  reason: meeting.ended end time, used when the webhook has no event_ts.
- source: payload.object.start_time
  kind: epoch_ms
  target: time
  format: '%+'
  reason: meeting.started start time, used when the webhook has no event_ts.
consumed_candidates:
- action
- category_type
- email
- event
- event_ts
- ip_address
- operation_detail
- operator
- payload.account_id
- payload.object.email
- payload.object.host_email
- payload.object.host_id
- payload.object.id
- payload.object.ip_address
- payload.object.participant.public_ip
- payload.object.topic
- payload.object.uuid
- payload.operator
- payload.operator_id
- payload.time_stamp
- time
- type
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
