source: json
transforms:
- source: time
  kind: epoch_ms
  target: time
  format: '%+'
  reason: ISO activity / operation-log time converted to the event clock in milliseconds.
- source: payload.object.date_time
  kind: epoch_ms
  target: time
  format: '%+'
  reason: Webhook object time, used only when event_ts is absent.
consumed_candidates:
- action
- category_type
- email
- event
- event_ts
- ip_address
- operation_detail
- operator
- payload.account_id
- payload.object.email
- payload.object.host_email
- payload.object.host_id
- payload.object.id
- payload.object.ip_address
- payload.object.participant.public_ip
- payload.object.topic
- payload.object.uuid
- payload.operator
- payload.operator_id
- time
- type
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
