name: azure_monitor_ocsf
display_name: Azure Monitor diagnostic export (OCSF)
version: "1.0.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields in redacted, dotted snake_case unmapped keys.
  Parses Azure Monitor diagnostic-settings records (the resource-log schema
  that Diagnostic Settings stream to an Event Hub or storage account) into
  OCSF 1.9.0, dispatching on the record's `category`, because one Event Hub
  routinely receives several categories (a subscription's Activity Log plus a
  tenant's Entra ID logs):
    * Activity Log  Administrative, Policy, Autoscale, Alert, Recommendation,
                    ServiceHealth, ResourceHealth   -> API Activity 6003
                    Security (Defender for Cloud)    -> Detection Finding 2004
    * Entra ID      SignInLogs, NonInteractiveUserSignInLogs,
                    ServicePrincipalSignInLogs,
                    ManagedIdentitySignInLogs        -> Authentication 3002
                    AuditLogs: user lifecycle/password/security-info and
                    role membership                  -> User Management 3007
                    group lifecycle/membership       -> Group Management 3006
                    everything else (apps, policies,
                    devices, directory)              -> API Activity 6003
    * any other category (or no category)            -> Base Event 0
  Nothing is dropped: every source field the mapping does not consume is
  spilled to `unmapped`, and an unparseable body becomes a Base Event with
  metadata.log_level = "error" and the body in raw_data. One record per event:
  the Event Hubs `{"records": [...]}` envelope is exploded upstream by the
  pull container's platform stamp; an envelope that reaches the lane anyway
  is kept whole as a Base Event. metadata.uid is deterministic (sha256 of the record's natural id, or
  of the record) so an Event Hubs replay dedupes in the lake. Account Change
  3001 and User Access Management 3005 are deprecated in OCSF 1.9 and are
  deliberately not emitted. On management events the initiator is `actor`
  and the target is the subject (`user` / `group`).
match_values:
  - azure_monitor
category: cloud
vendor: "Microsoft"
product: "Azure Monitor"
parser_vrl: |
  # Azure Monitor diagnostic-settings record -> OCSF 1.9.0 (dispatch on category).
  raw_log = to_string(.message) ?? ""
  __raw_body = raw_log
  __source_kv = {}

  parsed, err = parse_json(raw_log)
  p = {}
  is_record = false
  # One record per event: the pull container's platform stamp explodes the
  # Event Hubs `{"records": [...]}` envelope before this lane. An envelope that
  # reaches the lane anyway (e.g. pushed over HEC) has no category, so it is
  # kept whole as a Base Event with the records in `unmapped` (never dropped).
  if err == null && is_object(parsed) {
      p = object!(parsed)
      is_record = true
  }
  __source_kv = p

  if !is_record {
      # Unparseable body: still a VALID OCSF record (Base Event), never a drop.
      . = {
          "class_uid": 0,
          "class_name": "Base Event",
          "category_uid": 0,
          "category_name": "Uncategorized",
          "activity_id": 0,
          "activity_name": "Unknown",
          "type_uid": 0,
          "severity_id": 1,
          "severity": "Informational",
          "status_id": 0,
          "status": "Unknown",
          "time": to_unix_timestamp(now(), unit: "milliseconds"),
          "raw_data": raw_log,
          "metadata": {
              "version": "1.9.0",
              "profiles": ["cloud"],
              "uid": sha2("azure_monitor|raw|" + raw_log, variant: "SHA-256"),
              "log_level": "error",
              "log_name": "AzureMonitor",
              "log_provider": "Azure Monitor",
              "product": { "name": "Azure Monitor", "vendor_name": "Microsoft" }
          },
          "cloud": { "provider": "Azure" },
          "unmapped": { "parse_error": "body is not a JSON object" }
      }
  } else {
      props = object(p.properties) ?? {}

      # ---- category -> family ----
      category = to_string(p.category) ?? ""
      if category == "" { category = to_string(get(p, ["category", "value"]) ?? null) ?? "" }
      cat_l = downcase(category)
      event_cat = to_string(props.eventCategory) ?? ""
      res_id = to_string(p.resourceId) ?? ""
      res_id_l = downcase(res_id)
      activity_cats = ["administrative", "security", "servicehealth", "resourcehealth", "alert", "recommendation", "policy", "autoscale"]
      signin_cats = ["signinlogs", "noninteractiveusersigninlogs", "serviceprincipalsigninlogs", "managedidentitysigninlogs"]
      family = "other"
      act_cat = ""
      if includes(signin_cats, cat_l) {
          family = "signin"
      } else if cat_l == "auditlogs" {
          family = "audit"
      } else if includes(activity_cats, downcase(event_cat)) {
          family = "activity"
          act_cat = downcase(event_cat)
      } else if includes(activity_cats, cat_l) {
          family = "activity"
          act_cat = cat_l
      } else if includes(["write", "delete", "action"], cat_l) && starts_with(res_id_l, "/subscriptions/") {
          # Older Activity Log exports carried the ARM verb as `category`;
          # without properties.eventCategory the record is Administrative.
          family = "activity"
          act_cat = "administrative"
      }

      # ---- clock: properties' own event time wins, else the record time ----
      time_ms = 0
      ts_str = to_string(props.createdDateTime) ?? ""
      if ts_str == "" { ts_str = to_string(props.activityDateTime) ?? "" }
      if ts_str == "" { ts_str = to_string(p.time) ?? "" }
      if ts_str == "" { ts_str = to_string(p.eventTimestamp) ?? "" }
      if ts_str != "" {
          t, terr = parse_timestamp(ts_str, "%+")
          if terr == null { time_ms = to_unix_timestamp(t, unit: "milliseconds") }
      }
      if time_ms == 0 { time_ms = to_unix_timestamp(now(), unit: "milliseconds") }

      # ---- severity from the record level (string or Windows-style number) ----
      level_raw = p.level
      if level_raw == null { level_raw = p.Level }
      level_s = downcase(to_string(level_raw) ?? "")
      severity_id = 1
      severity = "Informational"
      if level_s == "warning" || level_s == "3" { severity_id = 3; severity = "Medium" }
      if level_s == "error" || level_s == "2" { severity_id = 4; severity = "High" }
      if level_s == "critical" || level_s == "1" { severity_id = 5; severity = "Critical" }

      # ---- ARM coordinates from resourceId ----
      sub_id = ""
      rg_name = ""
      rp_ns = ""
      rp_type = ""
      rm, rmerr = parse_regex(res_id, r'(?i)^/subscriptions/(?P<sub>[^/]+)(?:/resourcegroups/(?P<rg>[^/]+))?(?:/providers/(?P<ns>[^/]+)/(?P<ty>[^/]+))?')
      if rmerr == null {
          sub_id = string(rm.sub) ?? ""
          rg_name = string(rm.rg) ?? ""
          rp_ns = string(rm.ns) ?? ""
          rp_type = string(rm.ty) ?? ""
      }
      tenant_id = to_string(p.tenantId) ?? ""
      if tenant_id == "" {
          tm, tmerr = parse_regex(res_id, r'(?i)^/tenants/(?P<t>[^/]+)')
          if tmerr == null { tenant_id = string(tm.t) ?? "" }
      }

      correlation = to_string(p.correlationId) ?? ""
      if correlation == "" { correlation = to_string(props.correlationId) ?? "" }
      caller_ip = to_string(p.callerIpAddress) ?? ""
      if caller_ip == "<null>" { caller_ip = "" }

      ocsf = {}
      natural_id = ""

      if family == "signin" {
          # =================== Entra ID sign-in -> Authentication 3002 ===================
          natural_id = to_string(props.id) ?? ""

          status_obj = object(props.status) ?? {}
          error_code = to_int(status_obj.errorCode) ?? -1
          failure_reason = to_string(status_obj.failureReason) ?? ""
          additional = to_string(status_obj.additionalDetails) ?? ""
          if error_code < 0 {
              rt = to_string(p.resultType) ?? ""
              if rt != "" { error_code = to_int(rt) ?? -1 }
          }
          if failure_reason == "" { failure_reason = to_string(p.resultDescription) ?? "" }
          status_id = 0
          status_str = "Unknown"
          if error_code == 0 {
              status_id = 1
              status_str = "Success"
          } else if error_code > 0 {
              status_id = 2
              status_str = "Failure"
              if severity_id < 2 { severity_id = 2; severity = "Low" }
          }

          # ---- subject: the user, or the service principal / managed identity ----
          upn = to_string(props.userPrincipalName) ?? ""
          display = to_string(props.userDisplayName) ?? ""
          sp_name = to_string(props.servicePrincipalName) ?? ""
          sp_id = to_string(props.servicePrincipalId) ?? ""
          is_workload = cat_l == "serviceprincipalsigninlogs" || cat_l == "managedidentitysigninlogs"
          user = { "name": "unknown" }
          if upn != "" && !is_workload {
              user = { "name": upn, "type_id": 1, "type": "User" }
              if contains(upn, "@") {
                  user.email_addr = upn
                  upn_parts = split(upn, "@")
                  if length(upn_parts) == 2 { user.domain = string(upn_parts[1]) ?? "" }
              }
          } else if sp_name != "" {
              user = { "name": sp_name, "type_id": 4, "type": "Service" }
          } else if display != "" {
              user = { "name": display, "type_id": 0, "type": "Unknown" }
          }
          if display != "" { user.display_name = display }
          uid = to_string(props.userId) ?? ""
          if uid == "" || is_workload { uid = sp_id }
          if uid != "" { user.uid = uid }

          # ---- the target application (3002 at_least_one: service) ----
          app_name = to_string(props.resourceDisplayName) ?? ""
          if app_name == "" { app_name = to_string(props.appDisplayName) ?? "" }
          if app_name == "" { app_name = "unknown" }
          service = { "name": app_name }
          svc_uid = to_string(props.resourceId) ?? ""
          if svc_uid != "" { service.uid = svc_uid }

          # ---- source endpoint ----
          ip = to_string(props.ipAddress) ?? ""
          if ip == "" { ip = caller_ip }
          src_endpoint = { "ip": "0.0.0.0" }
          if ip != "" { src_endpoint = { "ip": downcase(ip) } }
          location = object(props.location) ?? {}
          loc = {}
          country = to_string(location.countryOrRegion) ?? ""
          if country != "" { loc.country = country }
          city = to_string(location.city) ?? ""
          if city != "" { loc.city = city }
          state = to_string(location.state) ?? ""
          if state != "" { loc.region = state }
          if length(keys(loc)) > 0 { src_endpoint.location = loc }
          asn = to_int(props.autonomousSystemNumber) ?? 0
          if asn > 0 { src_endpoint.autonomous_system = { "number": asn } }

          # ---- MFA / logon type / protocol ----
          auth_req = to_string(props.authenticationRequirement) ?? ""
          mfa_detail = object(props.mfaDetail) ?? {}
          mfa_method = to_string(mfa_detail.authMethod) ?? ""
          is_mfa = auth_req == "multiFactorAuthentication" || mfa_method != ""
          is_interactive = to_bool(props.isInteractive) ?? false
          logon_type_id = 3
          logon_type = "Network"
          if is_interactive { logon_type_id = 2; logon_type = "Interactive" }
          auth_proto = downcase(to_string(props.authenticationProtocol) ?? "")
          auth_protocol_id = 6
          auth_protocol = "OAUTH 2.0"
          if auth_proto == "saml" || auth_proto == "saml20" { auth_protocol_id = 5; auth_protocol = "SAML" }
          if auth_proto == "openidconnect" || auth_proto == "oidc" { auth_protocol_id = 4; auth_protocol = "OpenID" }
          if auth_proto == "ropc" || auth_proto == "password" { auth_protocol_id = 11; auth_protocol = "Basic Authentication" }
          if auth_proto == "wsfederation" || auth_proto == "ws-fed" { auth_protocol_id = 99; auth_protocol = "Other" }

          # ---- risk ----
          risk = downcase(to_string(props.riskLevelDuringSignIn) ?? "")
          if risk == "" || risk == "none" || risk == "hidden" { risk = downcase(to_string(props.riskLevelAggregated) ?? "") }
          risk_level_id = 0
          risk_level = "Info"
          if risk == "low" { risk_level_id = 1; risk_level = "Low" }
          if risk == "medium" { risk_level_id = 2; risk_level = "Medium" }
          if risk == "high" { risk_level_id = 3; risk_level = "High" }
          if risk_level_id >= 2 && severity_id < 3 { severity_id = 3; severity = "Medium" }

          # ---- device (host profile) ----
          dev_detail = object(props.deviceDetail) ?? {}
          device = {}
          dev_name = to_string(dev_detail.displayName) ?? ""
          if dev_name != "" { device.hostname = dev_name }
          dev_id = to_string(dev_detail.deviceId) ?? ""
          if dev_id != "" { device.uid = dev_id }
          dev_os = to_string(dev_detail.operatingSystem) ?? ""
          if dev_os != "" {
              os_l = downcase(dev_os)
              os_type_id = 0
              if contains(os_l, "windows") { os_type_id = 100 }
              if contains(os_l, "android") { os_type_id = 201 }
              if contains(os_l, "linux") || contains(os_l, "ubuntu") { os_type_id = 200 }
              if contains(os_l, "macos") || contains(os_l, "mac os") || contains(os_l, "os x") { os_type_id = 300 }
              if contains(os_l, "ios") && !contains(os_l, "bios") { os_type_id = 301 }
              if contains(os_l, "ipados") { os_type_id = 302 }
              device.os = { "name": dev_os, "type_id": os_type_id }
          }
          if length(keys(device)) > 0 { device.type_id = 0 }

          session = { "is_mfa": is_mfa }
          if natural_id != "" { session.uid = natural_id }
          if is_interactive { session.is_remote = true }

          ocsf = {
              "class_uid": 3002,
              "class_name": "Authentication",
              "category_uid": 3,
              "category_name": "Identity & Access Management",
              "activity_id": 1,
              "activity_name": "Logon",
              "status_id": status_id,
              "status": status_str,
              "is_mfa": is_mfa,
              "is_remote": true,
              "logon_type_id": logon_type_id,
              "logon_type": logon_type,
              "auth_protocol_id": auth_protocol_id,
              "auth_protocol": auth_protocol,
              "risk_level_id": risk_level_id,
              "risk_level": risk_level,
              "message": "Sign-in to " + app_name + ": " + status_str,
              "metadata": {
                  "version": "1.9.0",
                  "profiles": ["cloud", "host", "security_control"],
                  "log_name": category,
                  "log_provider": "Microsoft Entra ID",
                  "product": { "name": "Microsoft Entra ID", "vendor_name": "Microsoft" }
              },
              "api": { "operation": "Sign-in activity", "service": { "name": "Microsoft Entra ID" } },
              "user": user,
              "service": service,
              "src_endpoint": src_endpoint,
              "session": session
          }
          if error_code > 0 { ocsf.status_code = to_string(error_code) }
          if failure_reason != "" && error_code != 0 { ocsf.status_detail = failure_reason }
          if additional != "" && error_code == 0 { ocsf.status_detail = additional }
          if length(keys(device)) > 0 { ocsf.device = device }
          ua = to_string(props.userAgent) ?? ""
          if ua != "" { ocsf.http_request = { "user_agent": ua } }
      } else if family == "audit" {
          # =================== Entra ID audit -> 3007 / 3006 / 6003 ===================
          natural_id = to_string(props.id) ?? ""
          activity_display = to_string(props.activityDisplayName) ?? ""
          if activity_display == "" { activity_display = to_string(p.operationName) ?? "" }
          act_l = downcase(activity_display)
          audit_cat = to_string(props.category) ?? ""
          audit_cat_l = downcase(audit_cat)
          op_type = downcase(to_string(props.operationType) ?? "")
          logged_by = to_string(props.loggedByService) ?? ""
          if logged_by == "" { logged_by = "Microsoft Entra ID" }

          result_l = downcase(to_string(props.result) ?? "")
          status_id = 0
          status_str = "Unknown"
          if result_l == "success" { status_id = 1; status_str = "Success" }
          if result_l == "failure" { status_id = 2; status_str = "Failure" }
          if result_l == "timeout" { status_id = 99; status_str = "Timeout" }
          if status_id == 2 && severity_id < 2 { severity_id = 2; severity = "Low" }

          # ---- initiator -> actor ----
          initiated = object(props.initiatedBy) ?? {}
          init_user = object(initiated.user) ?? {}
          init_app = object(initiated.app) ?? {}
          actor_user = { "name": "unknown" }
          actor = {}
          src_ip = ""
          iu_upn = to_string(init_user.userPrincipalName) ?? ""
          iu_id = to_string(init_user.id) ?? ""
          iu_name = to_string(init_user.displayName) ?? ""
          ia_name = to_string(init_app.displayName) ?? ""
          ia_spn = to_string(init_app.servicePrincipalName) ?? ""
          ia_spid = to_string(init_app.servicePrincipalId) ?? ""
          ia_appid = to_string(init_app.appId) ?? ""
          if iu_upn != "" || iu_id != "" {
              actor_user = { "type_id": 1, "type": "User" }
              actor_user.name = if iu_upn != "" { iu_upn } else if iu_name != "" { iu_name } else { iu_id }
              if contains(iu_upn, "@") { actor_user.email_addr = iu_upn }
              if iu_id != "" { actor_user.uid = iu_id }
              if iu_name != "" { actor_user.display_name = iu_name }
              src_ip = to_string(init_user.ipAddress) ?? ""
          } else if ia_name != "" || ia_spid != "" || ia_appid != "" {
              actor_user = { "type_id": 4, "type": "Service" }
              actor_user.name = if ia_name != "" { ia_name } else if ia_spn != "" { ia_spn } else if ia_appid != "" { ia_appid } else { ia_spid }
              if ia_spid != "" { actor_user.uid = ia_spid }
              if ia_name != "" { actor.app_name = ia_name }
              if ia_appid != "" { actor.app_uid = ia_appid }
              src_ip = to_string(init_app.ipAddress) ?? ""
          }
          actor.user = actor_user
          if src_ip == "" || src_ip == "<null>" { src_ip = caller_ip }

          # ---- targets -> subject user / group, resources[] ----
          targets = array(props.targetResources) ?? []
          subj_user = {}
          subj_group = {}
          role_name = ""
          resources = []
          for_each(targets) -> |_i, target| {
              tg = object(target) ?? {}
              t_type = to_string(tg.type) ?? ""
              t_type_l = downcase(t_type)
              t_id = to_string(tg.id) ?? ""
              t_upn = to_string(tg.userPrincipalName) ?? ""
              t_name = to_string(tg.displayName) ?? ""
              label = if t_upn != "" { t_upn } else if t_name != "" { t_name } else { t_id }
              res = { "type": t_type }
              if t_id != "" { res.uid = t_id }
              if label != "" { res.name = label }
              resources = push(resources, res)
              if t_type_l == "user" && length(keys(subj_user)) == 0 {
                  subj_user = { "name": label, "type_id": 1, "type": "User" }
                  if t_id != "" { subj_user.uid = t_id }
                  if contains(t_upn, "@") { subj_user.email_addr = t_upn }
                  if t_name != "" { subj_user.display_name = t_name }
              }
              if t_type_l == "serviceprincipal" && length(keys(subj_user)) == 0 && audit_cat_l == "rolemanagement" {
                  subj_user = { "name": label, "type_id": 4, "type": "Service" }
                  if t_id != "" { subj_user.uid = t_id }
              }
              if t_type_l == "group" && length(keys(subj_group)) == 0 {
                  subj_group = { "name": label }
                  if t_id != "" { subj_group.uid = t_id }
              }
              if t_type_l == "role" && role_name == "" { role_name = label }
          }
          have_user = length(keys(subj_user)) > 0
          have_group = length(keys(subj_group)) > 0

          class_uid = 6003
          activity_id = 99
          activity_name = "Other"
          if have_user && (audit_cat_l == "usermanagement" || audit_cat_l == "rolemanagement" || audit_cat_l == "userauthenticationmethod") {
              class_uid = 3007
              if act_l == "add user" || act_l == "create user" { activity_id = 1; activity_name = "Create" }
              if act_l == "update user" || starts_with(act_l, "update stsrefreshtokenvalidfrom") { activity_id = 2; activity_name = "Update" }
              if act_l == "delete user" || act_l == "hard delete user" { activity_id = 3; activity_name = "Delete" }
              if act_l == "enable account" || act_l == "restore user" { activity_id = 4; activity_name = "Enable" }
              if act_l == "disable account" { activity_id = 5; activity_name = "Disable" }
              if contains(act_l, "change user password") || starts_with(act_l, "change password") { activity_id = 8; activity_name = "Password Change" }
              if contains(act_l, "reset user password") || starts_with(act_l, "reset password") { activity_id = 9; activity_name = "Password Reset" }
              if contains(act_l, "registered security info") { activity_id = 12; activity_name = "Enable MFA Factors" }
              if contains(act_l, "deleted security info") { activity_id = 13; activity_name = "Disable MFA Factors" }
              if starts_with(act_l, "add app role assignment") { activity_id = 14; activity_name = "Assign Privileges" }
              if starts_with(act_l, "remove app role assignment") { activity_id = 15; activity_name = "Remove Privileges" }
              if starts_with(act_l, "add") && contains(act_l, "member to role") { activity_id = 16; activity_name = "Assign Roles" }
              if starts_with(act_l, "remove") && contains(act_l, "member from role") { activity_id = 17; activity_name = "Remove Roles" }
          } else if have_group && audit_cat_l == "groupmanagement" {
              class_uid = 3006
              if act_l == "add group" { activity_id = 6; activity_name = "Create" }
              if act_l == "delete group" || act_l == "hard delete group" { activity_id = 5; activity_name = "Delete" }
              if act_l == "update group" { activity_id = 9; activity_name = "Update" }
              if act_l == "add member to group" { activity_id = 3; activity_name = "Add User" }
              if act_l == "remove member from group" { activity_id = 4; activity_name = "Remove User" }
              if starts_with(act_l, "add app role assignment") { activity_id = 1; activity_name = "Assign Privileges" }
              if starts_with(act_l, "remove app role assignment") { activity_id = 2; activity_name = "Revoke Privileges" }
          } else {
              if op_type == "add" || op_type == "create" { activity_id = 1; activity_name = "Create" }
              if op_type == "update" || op_type == "assign" || op_type == "unassign" { activity_id = 3; activity_name = "Update" }
              if op_type == "delete" || op_type == "remove" { activity_id = 4; activity_name = "Delete" }
          }

          ocsf = {
              "class_uid": class_uid,
              "category_uid": 3,
              "category_name": "Identity & Access Management",
              "activity_id": activity_id,
              "activity_name": activity_name,
              "status_id": status_id,
              "status": status_str,
              "message": activity_display,
              "metadata": {
                  "version": "1.9.0",
                  "profiles": ["cloud"],
                  "log_name": category,
                  "log_provider": logged_by,
                  "product": { "name": "Microsoft Entra ID", "vendor_name": "Microsoft" }
              },
              "api": { "operation": activity_display, "service": { "name": logged_by } },
              "actor": actor
          }
          if class_uid == 3007 {
              ocsf.class_name = "User Management"
              ocsf.user = subj_user
          } else if class_uid == 3006 {
              ocsf.class_name = "Group Management"
              ocsf.group = subj_group
              if have_user { ocsf.user = subj_user }
          } else {
              ocsf.class_name = "API Activity"
              ocsf.category_uid = 6
              ocsf.category_name = "Application Activity"
          }
          src_ep = { "ip": "0.0.0.0" }
          if src_ip != "" { src_ep = { "ip": downcase(src_ip) } }
          ocsf.src_endpoint = src_ep
          if length(resources) > 0 { ocsf.resources = resources }
          reason = to_string(props.resultReason) ?? ""
          if reason != "" { ocsf.status_detail = reason }
          if audit_cat != "" { ocsf.metadata.event_code = audit_cat }
      } else if family == "activity" {
          # =================== Azure Activity Log -> 6003 / 2004 ===================
          operation = to_string(p.operationName) ?? ""
          if operation == "" { operation = to_string(get(p, ["operationName", "value"]) ?? null) ?? "" }
          if operation == "" { operation = "Unknown" }
          op_parts = split(operation, "/")
          verb = downcase(string(op_parts[-1]) ?? "")
          svc_name = string(op_parts[0]) ?? ""
          if rp_ns != "" && svc_name == operation { svc_name = rp_ns }

          result_raw = to_string(p.resultType) ?? ""
          result_l = downcase(result_raw)
          status_id = 0
          status_str = "Unknown"
          if result_l == "success" || result_l == "succeeded" { status_id = 1; status_str = "Success" }
          if result_l == "failure" || result_l == "failed" { status_id = 2; status_str = "Failure" }
          if status_id == 0 && result_raw != "" { status_id = 99; status_str = result_raw }
          if status_id == 2 && severity_id < 2 { severity_id = 2; severity = "Low" }

          # ---- caller identity from the ARM token claims / RBAC evidence ----
          ident = object(p.identity) ?? {}
          claims = object(ident.claims) ?? {}
          authz = object(ident.authorization) ?? {}
          evidence = object(authz.evidence) ?? {}
          caller = strip_whitespace(to_string(get(claims, ["http://schemas.xmlsoap.org/ws/2005/05/identity/claims/upn"]) ?? null) ?? "")
          if caller == "" { caller = strip_whitespace(to_string(get(claims, ["http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name"]) ?? null) ?? "") }
          if caller == "" { caller = strip_whitespace(to_string(p.caller) ?? "") }
          oid = to_string(get(claims, ["http://schemas.microsoft.com/identity/claims/objectidentifier"]) ?? null) ?? ""
          if oid == "" { oid = to_string(evidence.principalId) ?? "" }
          claim_name = to_string(claims.name) ?? ""
          appid = to_string(claims.appid) ?? ""
          principal_type = to_string(evidence.principalType) ?? ""
          if tenant_id == "" { tenant_id = to_string(get(claims, ["http://schemas.microsoft.com/identity/claims/tenantid"]) ?? null) ?? "" }

          actor = {}
          if caller != "" || oid != "" || appid != "" {
              actor_user = { "name": "unknown" }
              if caller != "" { actor_user.name = caller } else if claim_name != "" { actor_user.name = claim_name } else if oid != "" { actor_user.name = oid } else { actor_user.name = appid }
              if contains(caller, "@") { actor_user.email_addr = caller }
              if oid != "" { actor_user.uid = oid }
              if claim_name != "" { actor_user.display_name = claim_name }
              pt_l = downcase(principal_type)
              if pt_l == "user" || contains(caller, "@") {
                  actor_user.type_id = 1
                  actor_user.type = "User"
              } else if pt_l == "serviceprincipal" || caller == "" {
                  actor_user.type_id = 4
                  actor_user.type = "Service"
              }
              actor.user = actor_user
              if appid != "" { actor.app_uid = appid }
          } else {
              # Platform-originated events (health, advisor, autoscale) carry no caller.
              actor.app_name = "Microsoft Azure"
          }
          if caller_ip == "" { caller_ip = to_string(claims.ipaddr) ?? "" }
          src_ep = { "ip": "0.0.0.0" }
          if caller_ip != "" { src_ep = { "ip": downcase(caller_ip) } }

          res_parts = split(res_id, "/")
          res_last = string(res_parts[-1]) ?? ""
          resources = []
          if res_id != "" {
              res = { "uid": res_id }
              if res_last != "" { res.name = res_last }
              if rp_ns != "" && rp_type != "" { res.type = rp_ns + "/" + rp_type }
              if rg_name != "" { res.group = { "name": rg_name } }
              resources = push(resources, res)
          }

          status_code = to_string(props.statusCode) ?? ""
          if status_code == "" { status_code = to_string(p.resultSignature) ?? "" }
          detail = to_string(p.resultDescription) ?? ""
          if detail == "" { detail = to_string(props.statusMessage) ?? "" }

          if act_cat == "security" {
              # Defender for Cloud alert -> Detection Finding 2004.
              alert_sev = downcase(to_string(props.Severity) ?? to_string(props.severity) ?? "")
              if alert_sev == "informational" || alert_sev == "low" || alert_sev == "medium" || alert_sev == "high" {
                  severity_id = 1
                  severity = "Informational"
                  if alert_sev == "low" { severity_id = 2; severity = "Low" }
                  if alert_sev == "medium" { severity_id = 3; severity = "Medium" }
                  if alert_sev == "high" { severity_id = 4; severity = "High" }
              }
              title = to_string(props.eventName) ?? ""
              if title == "" { title = to_string(props.alertDisplayName) ?? "" }
              if title == "" { title = operation }
              alert_uid = to_string(props.alertId) ?? ""
              if alert_uid == "" { alert_uid = res_last }
              if alert_uid == "" { alert_uid = correlation }
              finding_info = { "uid": alert_uid, "title": title }
              if detail != "" { finding_info.desc = detail }
              f_activity = 2
              f_activity_name = "Update"
              f_status = 99
              f_status_name = result_raw
              if result_l == "active" { f_activity = 1; f_activity_name = "Create"; f_status = 1; f_status_name = "New" }
              if result_l == "resolved" { f_activity = 3; f_activity_name = "Close"; f_status = 4; f_status_name = "Resolved" }
              if result_l == "dismissed" { f_activity = 3; f_activity_name = "Close"; f_status = 3; f_status_name = "Suppressed" }
              if result_raw == "" { f_status = 0; f_status_name = "Unknown" }
              ocsf = {
                  "class_uid": 2004,
                  "class_name": "Detection Finding",
                  "category_uid": 2,
                  "category_name": "Findings",
                  "activity_id": f_activity,
                  "activity_name": f_activity_name,
                  "status_id": f_status,
                  "status": f_status_name,
                  "is_alert": true,
                  "message": title,
                  "finding_info": finding_info,
                  "metadata": {
                      "version": "1.9.0",
                      "profiles": ["cloud"],
                      "log_name": "AzureActivity",
                      "log_provider": "Azure Monitor",
                      "event_code": "Security",
                      "product": { "name": "Microsoft Defender for Cloud", "vendor_name": "Microsoft" }
                  },
                  "api": { "operation": operation, "service": { "name": svc_name } }
              }
              if length(resources) > 0 { ocsf.resources = resources }
              if length(keys(actor)) > 0 && exists(actor.user) { ocsf.actor = actor }
          } else {
              activity_id = 99
              activity_name = "Other"
              act_event_code = event_cat
              if act_event_code == "" { act_event_code = category }
              if verb == "read" || verb == "list" || verb == "listkeys" { activity_id = 2; activity_name = "Read" }
              if verb == "write" { activity_id = 3; activity_name = "Update" }
              if verb == "delete" { activity_id = 4; activity_name = "Delete" }
              ocsf = {
                  "class_uid": 6003,
                  "class_name": "API Activity",
                  "category_uid": 6,
                  "category_name": "Application Activity",
                  "activity_id": activity_id,
                  "activity_name": activity_name,
                  "status_id": status_id,
                  "status": status_str,
                  "message": operation,
                  "metadata": {
                      "version": "1.9.0",
                      "profiles": ["cloud"],
                      "log_name": "AzureActivity",
                      "log_provider": "Azure Monitor",
                      "event_code": act_event_code,
                      "product": { "name": "Azure Activity Log", "vendor_name": "Microsoft" }
                  },
                  "api": { "operation": operation, "service": { "name": svc_name } },
                  "actor": actor,
                  "src_endpoint": src_ep
              }
              if length(resources) > 0 { ocsf.resources = resources }
              if status_code != "" { ocsf.status_code = status_code }
              if detail != "" { ocsf.status_detail = detail }
          }
          op_id = to_string(props.operationId) ?? ""
          if op_id != "" { ocsf.api.request = { "uid": op_id } }
      } else {
          # =================== unknown category -> Base Event 0 ===================
          # Kept whole: every source field spills to `unmapped` below.
          operation = to_string(p.operationName) ?? ""
          other_log_name = category
          if other_log_name == "" { other_log_name = "AzureMonitor" }
          ocsf = {
              "class_uid": 0,
              "class_name": "Base Event",
              "category_uid": 0,
              "category_name": "Uncategorized",
              "activity_id": 99,
              "activity_name": "Other",
              "status_id": 0,
              "status": "Unknown",
              "metadata": {
                  "version": "1.9.0",
                  "profiles": ["cloud"],
                  "log_name": other_log_name,
                  "log_provider": "Azure Monitor",
                  "product": { "name": "Azure Monitor", "vendor_name": "Microsoft" }
              }
          }
          if category != "" { ocsf.metadata.event_code = category }
          if operation != "" { ocsf.message = operation }
          result_raw = to_string(p.resultType) ?? ""
          if result_raw != "" { ocsf.status_detail = result_raw }
      }

      # ---- common envelope ----
      ocsf.type_uid = ocsf.class_uid * 100 + ocsf.activity_id
      ocsf.severity_id = severity_id
      ocsf.severity = severity
      ocsf.time = time_ms
      ocsf.raw_data = raw_log
      cloud = { "provider": "Azure" }
      if sub_id != "" { cloud.account = { "uid": sub_id } } else if tenant_id != "" { cloud.account = { "uid": tenant_id } }
      if tenant_id != "" { cloud.org = { "uid": tenant_id } }
      ocsf.cloud = cloud
      if correlation != "" { ocsf.metadata.correlation_uid = correlation }
      # NAN-3490: deterministic uid. The lake keeps the first row per
      # metadata.uid, so an Event Hubs replay (at-least-once) dedupes.
      # The record's own clock is part of the key: Entra does not promise a
      # sign-in id is unique across aggregated non-interactive rows.
      uid_src = if natural_id != "" { "azure_monitor|" + cat_l + "|" + natural_id + "|" + ts_str } else { "azure_monitor|" + encode_json(p) }
      ocsf.metadata.uid = sha2(uid_src, variant: "SHA-256")
      if natural_id != "" { ocsf.metadata.original_event_uid = natural_id }
      . = ocsf
  }

