source: json
transforms:
- source: properties.createdDateTime
  kind: epoch_ms
  target: time
  reason: Sign-in event clock, preferred over the record time; verified against the emitted clock.
- source: properties.activityDateTime
  kind: epoch_ms
  target: time
  reason: Audit event clock, preferred over the record time; verified against the emitted clock.
- source: level
  kind: enum
  target: severity_id
  values:
    informational: 1
    information: 1
    warning: 3
    error: 4
    critical: 5
  reason: Azure record level normalized to OCSF severity; consume only when the expected ID is emitted.
- source: Level
  kind: enum
  target: severity_id
  values:
    '4': 1
    '3': 3
    '2': 4
    '1': 5
  reason: Windows-style numeric record level normalized to OCSF severity; consume only when the expected
    ID is emitted.
- source: properties.Severity
  kind: enum
  target: severity_id
  values:
    informational: 1
    low: 2
    medium: 3
    high: 4
  reason: Defender for Cloud alert severity drives the finding severity; consume only when the expected
    ID is emitted.
- source: properties.riskLevelDuringSignIn
  kind: enum
  target: risk_level
  values:
    low: Low
    medium: Medium
    high: High
  reason: Parser normalizes the caption case; verify the emitted caption.
- source: properties.result
  kind: enum
  target: status
  values:
    success: Success
    failure: Failure
  reason: Entra audit result normalized to the OCSF status caption; verify the emitted caption.
- source: resultType
  kind: enum
  target: status
  values:
    success: Success
    failure: Failure
  reason: Activity Log result normalized to the OCSF status caption; verify the emitted caption.
- source: callerIpAddress
  kind: lowercase
  target: src_endpoint.ip
  reason: Parser lowercases IPs (nano lowercases at ingest); consume only when the normalized value is
    emitted.
- source: properties.ipAddress
  kind: lowercase
  target: device.ip
  reason: Parser lowercases IPs (nano lowercases at ingest); consume only when the normalized value is
    emitted.
- source: properties.ipAddress
  kind: lowercase
  target: src_endpoint.ip
  reason: Parser lowercases IPs (nano lowercases at ingest); consume only when the normalized value is
    emitted.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  resourceId:
  - resources.uid
  operationName:
  - api.operation
  - message
  category:
  - metadata.event_code
  - metadata.log_name
  tenantId:
  - cloud.account.uid
  - cloud.org.uid
  resultType:
  - status
  resultSignature:
  - status_code
  resultDescription:
  - finding_info.desc
  callerIpAddress:
  - src_endpoint.ip
  correlationId:
  - metadata.correlation_uid
  identity.claims.http://schemas.xmlsoap.org/ws/2005/05/identity/claims/upn:
  - actor.user.email_addr
  - actor.user.name
  identity.claims.http://schemas.microsoft.com/identity/claims/objectidentifier:
  - actor.user.name
  - actor.user.uid
  identity.claims.http://schemas.microsoft.com/identity/claims/tenantid:
  - cloud.org.uid
  identity.claims.name:
  - actor.user.display_name
  identity.claims.appid:
  - actor.app_uid
  identity.claims.ipaddr:
  - src_endpoint.ip
  properties.eventCategory:
  - metadata.event_code
  properties.statusCode:
  - status_code
  properties.statusMessage:
  - status_detail
  properties.eventName:
  - finding_info.title
  - message
  properties.id:
  - metadata.original_event_uid
  - session.uid
  properties.userPrincipalName:
  - user.email_addr
  - user.name
  properties.userDisplayName:
  - user.display_name
  properties.userId:
  - user.uid
  properties.servicePrincipalName:
  - user.name
  properties.servicePrincipalId:
  - user.uid
  properties.resourceDisplayName:
  - service.name
  properties.appDisplayName:
  - service.name
  properties.resourceId:
  - service.uid
  properties.ipAddress:
  - device.ip
  - src_endpoint.ip
  properties.location.countryOrRegion:
  - src_endpoint.location.country
  properties.location.city:
  - src_endpoint.location.city
  properties.location.state:
  - src_endpoint.location.region
  properties.autonomousSystemNumber:
  - src_endpoint.autonomous_system.number
  properties.status.errorCode:
  - status_code
  properties.status.failureReason:
  - status_detail
  properties.status.additionalDetails:
  - status_detail
  properties.deviceDetail.displayName:
  - device.hostname
  properties.deviceDetail.deviceId:
  - device.uid
  properties.deviceDetail.operatingSystem:
  - device.os.name
  properties.userAgent:
  - http_request.user_agent
  properties.activityDisplayName:
  - api.operation
  - message
  properties.category:
  - metadata.event_code
  properties.resultReason:
  - status_detail
  properties.loggedByService:
  - api.service.name
  - metadata.log_provider
  properties.initiatedBy.user.id:
  - actor.user.uid
  properties.initiatedBy.user.userPrincipalName:
  - actor.user.email_addr
  - actor.user.name
  properties.initiatedBy.user.ipAddress:
  - src_endpoint.ip
  properties.initiatedBy.app.displayName:
  - actor.app_name
  - actor.user.name
  properties.initiatedBy.app.servicePrincipalId:
  - actor.user.uid
