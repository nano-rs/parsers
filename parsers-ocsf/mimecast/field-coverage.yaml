    is emitted.
- source: Act
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value
    is emitted.
- source: action
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value
    is emitted.
- source: scanResult
  kind: lowercase
  reason: Parser lowercases this source value; consume only when the normalized value
    is emitted.
