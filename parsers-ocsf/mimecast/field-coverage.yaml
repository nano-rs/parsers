source: json
transforms:
- source: datetime
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  AttNames:
  - email.files.name
  IP:
  - src_endpoint.ip
  MsgId:
  - email.message_uid
  - metadata.original_event_uid
  MsgSz:
  - email.size
  Rcpt:
  - email.to
  Sender:
  - email.from
  SpamProcessingDetail.dkim.allow:
  - email_auth.dkim
  SpamProcessingDetail.dmarc.allow:
  - email_auth.dmarc
  SpamProcessingDetail.spf.allow:
  - email_auth.spf
  SpamScore:
  - risk_score
  Subject:
  - email.subject
  - message
  VirusFound:
  - malware.name
  category:
  - email.urls.categories
  fileName:
  - email.files.name
  fromUserEmailAddress:
  - email.from
  messageId:
  - email.message_uid
  - metadata.original_event_uid
  recipientAddress:
  - email.to
  senderAddress:
  - email.from
  sendingIp:
  - src_endpoint.ip
  subject:
  - email.subject
  - message
  type:
  - metadata.event_code
  url:
  - email.urls.url_string
  userEmailAddress:
  - email.to
