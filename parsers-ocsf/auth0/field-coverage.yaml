source: json
transforms:
- source: date
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
- source: details.request.method
  kind: enum
  target: http_request.http_method
  values:
    patch: PATCH
  reason: Parser normalizes the caption case; verify the emitted caption.
- source: strategy
  kind: enum
  target: metadata.log_provider
  values:
    auth0: Auth0
  reason: Parser normalizes the caption case; verify the emitted caption.
consumed_candidates:
- client_id
- client_name
- connection
- connection_id
- date
- description
- details
- details.factor.name
- details.request
- details.request.method
- details.request.path
- details.response
- details.response.statusCode
- details.session_id
- hostname
- ip
- isMobile
- location_info
- location_info.city_name
- location_info.country_code
- location_info.country_name
- location_info.time_zone
- log_id
- strategy
- strategy_type
- type
- user_agent
- user_id
- user_name
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
