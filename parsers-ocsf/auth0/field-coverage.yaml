source: json
transforms:
- source: date
  kind: epoch_ms
  target: time
  reason: Successful ISO timestamp conversion to the selected event clock in milliseconds.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  client_id:
  - service.uid
  client_name:
  - service.name
  description:
  - message
  - status_detail
  details.request.path:
  - http_request.url.path
  details.response.statusCode:
  - http_response.code
  details.session_id:
  - session.uid
  ip:
  - src_endpoint.ip
  location_info.country_code:
  - src_endpoint.location.country
  log_id:
  - metadata.original_event_uid
  - metadata.uid
  strategy:
  - auth_protocol
  type:
  - api.operation
  - metadata.event_code
  user_agent:
  - http_request.user_agent
  user_id:
  - actor.user.uid
  - user.uid
  user_name:
  - actor.user.email_addr
  - actor.user.name
  - user.email_addr
  - user.name
