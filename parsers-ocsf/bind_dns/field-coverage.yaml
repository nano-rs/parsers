source: text
transforms:
- source: header.ts
  kind: epoch_ms
  target: time
  format: '%+'
  reason: RFC 5424 syslog timestamp converted to event milliseconds; RFC 3164 clocks carry no year and remain residual.
consumed_candidates:
- header.host
- category
- level
- client.ip
- client.port
- client.view
- query.name
- query.class
- query.type
- query.server
- acl.name
- acl.class
- acl.type
- acl.acl
- rpz.name
- rpz.type
- rpz.class
- rpz.via
- rpz.policy
- message
consumed_reason: Only source keys read by this parser are eligible for exact-value
  consumption; the selected branch must emit the value. Unknown keys always spill,
  even when their value equals an OCSF default.
