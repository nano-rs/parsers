source: text
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  header.host:
  - device.hostname
  - dst_endpoint.hostname
  client.ip:
  - src_endpoint.ip
  client.port:
  - src_endpoint.port
  client.view:
  - policy.name
  query.name:
  - query.hostname
  query.class:
  - query.class
  query.type:
  - query.type
  query.server:
  - dst_endpoint.ip
  acl.name:
  - query.hostname
  acl.class:
  - query.class
  acl.type:
  - query.type
  acl.acl:
  - firewall_rule.name
  rpz.name:
  - query.hostname
  rpz.type:
  - query.type
  rpz.class:
  - query.class
  rpz.via:
  - firewall_rule.name
  message:
  - message
