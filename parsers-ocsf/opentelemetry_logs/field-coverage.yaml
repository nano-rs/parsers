source: otlp
preserve_unmapped:
  trace_id: Documented fallback slot (source manifest field 37, role trace_fallback); kept although trace.uid
    carries the same value.
  span_id: Documented fallback slot (source manifest field 38, role span_fallback); OCSF trace.span needs
    start/end times a LogRecord does not have.
  nano_time_source: Derived fact that the row's time is ingest-side because the LogRecord carried no usable
    timestamp.
transforms:
- source: timestamp
  kind: epoch_ms
  target: time
  reason: The LogRecord timestamp is converted to epoch milliseconds and wins over ingest time.
mappings_reason: Each source key maps to the OCSF target path(s) its value is copied to; a key is consumed
  only when its value is at one of them (field_coverage_check.py verifies each by perturbation). Everything
  else spills to unmapped.
mappings:
  severity:
  - severity
  trace_id:
  - trace.uid
