name: opentelemetry_logs_ocsf
display_name: OpenTelemetry Logs (OCSF)
version: "1.1.0"
description: >
  Parses OpenTelemetry LogRecords (the OTLP/HTTP `/v1/logs` lane, source type
  `otlp_log`) into OCSF 1.9.0 "API Activity" (class_uid 6003) with the OCSF
  Trace profile (`trace.uid`, `trace.span.uid`). The LogRecord timestamp wins
  over ingest time; OTLP SeverityNumber maps to OCSF severity_id; resource and
  log attributes are kept under `unmapped` (dots rewritten to underscores so
  the lake schema stays flat). This was the platform's built-in OTLP parser;
  with no built-in parsers (NAN-2977) install it here to class OTLP logs,
  otherwise they land as OCSF Base Event (class 0) through the generic lane.

  v1.1.0 (ocsf-1.9 port, NAN-2977): adds the NAN-2421 residual spill over the
  LogRecord (body, severity, trace context, flattened resource + log
  attributes) with "_"-joined keys only, and runtime samples.
ocsf_version: "1.9.0"
match_values:
  - otlp_log
category: application
vendor: "OpenTelemetry"
product: "OTLP Logs"
parser_vrl: |
  # OpenTelemetry LogRecord -> OCSF 1.9.0 API Activity (6003) + Trace profile
  #
  # WHY API Activity (6003) and NOT Base Event (0): Base Event is the schema's
  # designated home for undefined events and passes OCSF validation, but the lake
  # sink computes `%class_uid = to_int(.class_uid) ?? 0`, so a real class_uid of 0
  # is indistinguishable from "attribute absent" and the row never lands. 6003 is
  # the closest OCSF class for service/application telemetry and carries the
  # required actor / api / src_endpoint, which OTLP resource+attributes supply.
  #
  # WHY trace.* and not unmapped.*: OCSF 1.9 defines the Trace profile — `trace`
  # carries a REQUIRED `uid` and a nested `span` whose `uid` is likewise required.
  # Emitting the canonical paths means hunts read `trace.uid="..."` rather than
  # `unmapped.trace_id="..."`. The lake's field validator is data-driven
  # (schema/ocsf.rs:902-911), so writing these makes them queryable with no alias
  # and no validator change. `unmapped.trace_id`/`unmapped.span_id` remain the
  # documented fallback for foreign producers that do not emit the profile
  # (source manifest fields 37/38, roles trace_fallback/span_fallback).
  #
  # Input shape is whatever `otlp_logs_prep` (config/vector/03-otlp-source.toml)
  # leaves on the event: .message (body), .severity / .severity_number,
  # .trace_id / .span_id (already downcased), .resources, .attributes.

  body = to_string(.message) ?? ""

  # ---- severity: OTLP SeverityNumber -> OCSF severity_id ----
  # OCSF: 0 Unknown, 1 Informational, 2 Low, 3 Medium, 4 High, 5 Critical,
  # 6 Fatal, 99 Other. otlp_logs_prep already banded the text; keep it as the
  # human-facing `severity` string and derive the id from the numeric when present.
  sev_text = to_string(.severity) ?? ""
  sev_num = to_int(.severity_number) ?? 0

  severity_id = 0
  if sev_num >= 21 {
      severity_id = 6
  } else if sev_num >= 17 {
      severity_id = 4
  } else if sev_num >= 13 {
      severity_id = 3
  } else if sev_num >= 5 {
      severity_id = 1
  } else if sev_num >= 1 {
      severity_id = 1
  }

  # No numeric SeverityNumber: fall back to the text band otlp_logs_prep computed.
  if severity_id == 0 {
      if sev_text == "Fatal" {
          severity_id = 6
      } else if sev_text == "Error" {
          severity_id = 4
      } else if sev_text == "Warn" {
          severity_id = 3
      } else if sev_text != "" {
          severity_id = 1
      }
  }

  if sev_text == "" {
      sev_text = "Unknown"
  }

  # ---- time: the LOG timestamp, never ingest time ----
  # The OTLP LogRecord time must win: stamping ingest time would silently
  # back-date/forward-date every OTLP row and corrupt time-ordered hunts.
  # `.timestamp` arrives as a real timestamp from Vector's OTLP source, but can be
  # an RFC3339 string or raw epoch (OTLP carries unix NANOS) depending on the
  # producer, so handle all three rather than letting a type mismatch fall through
  # to now(). `to_unix_timestamp` errors on a non-timestamp, which is exactly how
  # the first draft of this parser silently stamped ingest time.
  resolve_ms = {
      ms = null
      candidate = .timestamp
      if candidate == null { candidate = .observed_timestamp }

      if is_timestamp(candidate) {
          ms = to_unix_timestamp(timestamp!(candidate), unit: "milliseconds")
      } else if is_string(candidate) {
          parsed_ts, parse_err = parse_timestamp(string!(candidate), "%+")
          if parse_err == null {
              ms = to_unix_timestamp(parsed_ts, unit: "milliseconds")
          }
      } else if is_integer(candidate) || is_float(candidate) {
          # A large epoch (OTLP nanos) decodes as a float in some JSON paths, so
          # accept both and normalise through float before truncating back.
          raw = to_float(candidate) ?? 0.0
          # Disambiguate by magnitude: OTLP emits nanoseconds; tolerate micros,
          # millis and seconds from looser producers. Thresholds are year-2001-ish
          # in each unit, so a plausible event time never lands in the wrong band.
          # NOTE: VRL division always yields a float — truncate explicitly, or the
          # downstream int coercion aborts the whole program ("expected integer,
          # got float") and the row is dropped with no row and no error surface.
          if raw > 100000000000000000.0 {
              ms = to_int(floor(raw / 1000000.0))
          } else if raw > 100000000000000.0 {
              ms = to_int(floor(raw / 1000.0))
          } else if raw > 100000000000.0 {
              ms = to_int(floor(raw))
          } else if raw > 0.0 {
              ms = to_int(floor(raw * 1000.0))
          }
      }
      ms
  }

  time_ms = 0
  time_from_record = true
  if resolve_ms != null {
      time_ms = to_int(resolve_ms)
  } else {
      time_from_record = false
      # No usable record time. Fall back to the routing stamp (still ingest-side,
      # but at least explicit) and record that the time is not authoritative.
      rts, rts_err = to_unix_timestamp(.routing_timestamp, unit: "milliseconds")
      if rts_err == null {
          time_ms = rts
      } else {
          time_ms = to_unix_timestamp(now(), unit: "milliseconds")
      }
  }

  # ---- trace context (OCSF Trace profile) ----
  trace_uid = downcase(to_string(.trace_id) ?? "")
  span_uid = downcase(to_string(.span_id) ?? "")

  # ---- resource / log-record attributes ----
  resources = {}
  if is_object(.resources) {
      resources = object!(.resources)
  }
  attributes = {}
  if is_object(.attributes) {
      attributes = object!(.attributes)
  }

  # ---- NAN-2421 residual source (ocsf-1.9 convention) ----
  # The OTLP lane hands this parser a structured Vector event, not a raw line,
  # so the "source" the residual spill accounts for is the LogRecord itself:
  # body, severity, trace context and the resource + log attributes.
  # Pipeline plumbing added by otlp_logs_prep (ext, metadata, routing_timestamp,
  # auth_status, content_format) is deliberately NOT source.
  # Keys are flattened with "_" (never "."): a dotted `unmapped` key wedged
  # Iceberg publication for every source ("Cannot add column with ambiguous
  # name: client.address"), and the residual template joins nested paths with
  # dots. Same precedence as `unmapped` below: a log attribute wins over a
  # same-named resource attribute.
  __raw_body = body
  __otlp_scope = {}
  if is_object(.scope) { __otlp_scope = {"scope": object!(.scope)} }
  __otlp_record = {}
  for_each(["severity", "severity_text", "severity_number", "trace_id", "span_id", "flags", "dropped_attributes_count"]) -> |_i, k| {
      v = get!(., [k])
      if v != null && v != "" && !is_object(v) && !is_array(v) { __otlp_record = set!(__otlp_record, [k], v) }
  }
  if is_string(.timestamp) { __otlp_record.timestamp = .timestamp }
  if is_string(.observed_timestamp) { __otlp_record.observed_timestamp = .observed_timestamp }
  __otlp_flat = map_keys(merge(merge(__otlp_scope, resources), attributes), recursive: true) -> |key| {
      replace(key, ".", "_")
  }
  __source_kv = merge(flatten(__otlp_flat, "_"), __otlp_record)

  service_name = to_string(resources."service.name") ?? ""

  # Non-OCSF residue rides `unmapped` (the OCSF spill), resource attrs first so a
  # same-named log attribute wins — same precedence otlp_logs_prep used for `ext`.
  #
  # CRITICAL: keys must not contain dots. OTLP semantic conventions are dotted
  # almost everywhere (`service.name`, `client.address`, `http.method`), but the
  # Iceberg additive-schema step reads a dot as a nested-struct path and refuses
  # the whole batch:
  #   PreconditionFailed => Cannot add column with ambiguous name: client.address
  # That error is retried forever on a durable batch, which wedges publication for
  # EVERY source, not just this one. Flatten the separator to `_` so each OTLP
  # attribute becomes an unambiguous leaf.
  unmapped = map_keys(merge(resources, attributes), recursive: true) -> |key| {
      replace(key, ".", "_")
  }

  # ---- required attributes for 6003, sourced from OTLP where available ----
  operation = to_string(attributes."http.request.method") ?? to_string(attributes."http.method") ?? ""
  url_path = to_string(attributes."url.path") ?? to_string(attributes."http.target") ?? ""
  if operation == "" { operation = "log" }
  api = {"operation": operation}
  if service_name != "" { api = merge(api, {"service": {"name": service_name}}) }
  if url_path != "" { api = merge(api, {"request": {"uid": url_path}}) }

  # `actor` is REQUIRED and must carry at least one of
  # [process, user, iam_role, invoked_by, session, application, app_name, app_uid].
  # A LogRecord often has no principal at all, so fall back to naming the emitting
  # application — an OCSF-valid actor beats dropping the row.
  user_name = to_string(attributes."enduser.id") ?? ""
  actor = {}
  if user_name != "" { actor = {"user": {"name": user_name}} }
  if actor == {} {
      if service_name != "" {
          actor = {"app_name": service_name}
      } else {
          actor = {"app_name": "OpenTelemetry"}
      }
  }

  client_ip = to_string(attributes."client.address") ?? to_string(attributes."net.peer.ip") ?? ""
  src_endpoint = {}
  if client_ip != "" { src_endpoint = {"ip": client_ip} }
  host_name = to_string(resources."host.name") ?? ""
  if host_name != "" { src_endpoint = merge(src_endpoint, {"hostname": host_name}) }
  if service_name != "" { src_endpoint = merge(src_endpoint, {"svc_name": service_name}) }
  # Same contract as `actor`: at least one identifying attribute is REQUIRED.
  if src_endpoint == {} { src_endpoint = {"svc_name": "unknown"} }

  # ---- assemble the OCSF record on the root ----
  . = {
      "class_uid": 6003,
      "class_name": "API Activity",
      "category_uid": 6,
      "category_name": "Application Activity",
      "activity_id": 0,
      "activity_name": "Unknown",
      "type_uid": 600300,
      "actor": actor,
      "api": api,
      "src_endpoint": src_endpoint,
      "severity_id": severity_id,
      "severity": sev_text,
      "time": time_ms,
      "message": body,
      "metadata": {
          "version": "1.9.0",
          "uid": uuid_v4(),
          # REQUIRED for the `trace` object to be admitted. OCSF binds `trace` to
          # the "trace" profile, and the strict admission validator
          # (nanosiem-core/src/parsers/ocsf_validation.rs, `attribute_allowed`)
          # only permits a profile-bound attribute when the event DECLARES that
          # profile here. Without this, every bronze object carrying one of these
          # rows is rejected wholesale as `strict_admission_failed`
          # ("attribute \"trace\" is not defined for this OCSF class/profile") --
          # taking any co-located rows from other sources down with it.
          "profiles": ["trace"],
          "product": {
              "name": "OpenTelemetry",
              "vendor_name": "OpenTelemetry"
          },
          "log_provider": "OTLP"
      },
      "unmapped": unmapped
  }

  # OCSF Trace profile — only when the LogRecord actually carried trace context.
  # `trace.uid` is REQUIRED by the trace object, so never emit a bare/empty trace.
  if trace_uid != "" {
      trace = {"uid": trace_uid}
      # Deliberately NO `trace.span`. OCSF's span object requires `start_time` and
      # `end_time` as well as `uid`, and a LogRecord carries only the span ID from
      # its W3C trace context -- it does not know when that span began or ended.
      # Emitting the object without them is rejected outright
      # ("required OCSF attribute \"trace.span.end_time\""), and inventing the
      # timestamps would put fabricated timing into a security event store. The
      # span identity therefore rides `unmapped.span_id`, which is exactly the
      # `span_fallback` role the source manifest declares (field 38). The span's
      # real timings live on the span row itself, in the spans dataset.
      if service_name != "" {
          trace = merge(trace, {"service": {"name": service_name}})
      }
      .trace = trace

      # Fallback slots the entity manifest declares (fields 37/38) so foreign
      # consumers and the primary-then-fallback query predicate both resolve.
      .unmapped.trace_id = trace_uid
      if span_uid != "" {
          .unmapped.span_id = span_uid
      }
  }

  # service.name -> OCSF actor.process / src_endpoint has no clean slot for a
  # logical service, so keep it on the canonical `metadata.product.feature`
  # (a real OCSF path) in addition to trace.service.name above.
  if service_name != "" {
      .metadata.product.feature = {"name": service_name}
  }

  # The LogRecord carried no usable time, so `time` is ingest-side. Say so on the
  # row rather than letting a fabricated time read as the event's own.
  if !time_from_record {
      .unmapped.nano_time_source = "ingest"
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # Exact value representation is evaluated AFTER branch selection. Numeric strings
  # count as represented by their typed scalar; other transformations are explicit.
  __mapped = object!(parse_json!(encode_json(.)))
  __existing = object(__mapped.unmapped) ?? {}
  __discard = del(__mapped.raw_data)
  __discard = del(__mapped.unmapped)
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __represented = []
  __walk = map_values(__mapped, recursive: true) -> |value| {
      __represented = push(__represented, encode_json(value))
      if !is_object(value) && !is_array(value) && !is_null(value) {
          __represented = push(__represented, to_string(value) ?? "")
      }
      value
  }
  __consumed = []
  # BEGIN parser-specific transformations
  # timestamp: The LogRecord timestamp is converted to epoch milliseconds and wins over ingest time.
  # Only LogRecord fields this parser maps are eligible for exact-value consumption. Resource and log attributes always spill to unmapped under their "_"-flattened names (the names the platform parser always used), even when a value is also mapped (service.name -> api.service.name), so existing hunts keep working.
  __candidates = ["message", "severity", "timestamp", "trace_id"]
  __preserve = ["trace_id", "span_id", "nano_time_source"]
  __rules = array!(parse_json!("[{\"source\":\"timestamp\",\"kind\":\"epoch_ms\",\"target\":\"time\",\"reason\":\"The LogRecord timestamp is converted to epoch milliseconds and wins over ingest time.\"}]"))
  __source_flat = flatten(__source_kv)
  for_each(__rules) -> |_index, rule| {
      __source_key = string!(rule.source)
      __value = get!(__source_flat, [__source_key])
      __expected = null
      __valid = false
      if rule.kind == "lowercase" && is_string(__value) {
          __expected = downcase(string!(__value))
          __valid = true
      } else if rule.kind == "epoch_ms" {
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", string(rule.format) ?? "%+")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              __valid = true
          }
      } else if rule.kind == "scale" {
          __number, __number_err = to_float(__value)
          if __number_err == null && __value != null && !is_boolean(__value) {
              __expected = to_int(__number * to_float!(rule.factor))
              __valid = true
          }
      } else if rule.kind == "hex" {
          __hex = replace(downcase(string(__value) ?? ""), r'^0x', "")
          __integer, __integer_err = parse_int(__hex, base: 16)
          __expected = __integer
          __valid = is_string(__value) && starts_with(downcase(string(__value) ?? ""), "0x") && __integer_err == null
      } else if rule.kind == "enum" {
          __expected = get!(object!(rule.values), [downcase(to_string(__value) ?? "")])
          __valid = __expected != null
      }
      __matches = includes(__represented, encode_json(__expected))
      if is_string(rule.target) { __matches = get!(., split(string!(rule.target), ".")) == __expected }
      if __valid && __matches { __consumed = push(__consumed, __source_key) }
  }
  # END parser-specific transformations
  # Redact at every depth, including objects inside arrays, before serialization.
  __safe = map_values(object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing}))), recursive: true) -> |value| {
      if is_object(value) {
          # Header/parameter arrays commonly encode sensitive keys as name/value
          # or Key/Value objects instead of using the secret name as an object key.
          __sensitive_pair = false
          for_each(object!(value)) -> |key, child| {
              if includes(["name", "key"], downcase(key)) && match(downcase(string(child) ?? ""), r'password|secret|authorization|token') {
                  __sensitive_pair = true
              }
          }
          for_each(object!(value)) -> |key, _child| {
              if match(downcase(key), r'password|secret|authorization|token') || (__sensitive_pair && includes(["value", "values"], downcase(key))) {
                  value = set!(value, [key], "<redacted>")
              }
          }
      }
      value
  }
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  __escaped = map_keys(object!(__safe.source), recursive: true) -> |key| {
      replace(replace(key, "~", "~0"), ".", "~1")
  }
  __flat = flatten(__escaped)
  __residual = {}
  for_each(__flat) -> |key, value| {
      key = replace(replace(key, "~1", "."), "~0", "~")
      __same = includes(__represented, encode_json(value))
      if !is_object(value) && !is_array(value) && !is_null(value) {
          __same = __same || includes(__represented, to_string(value) ?? "")
      }
      # A scalar array is consumed only if every element is represented. Preserve
      # partially represented arrays intact, including their ordering and repeats.
      if is_array(value) && !is_empty(array!(value)) {
          __all_items = true
          for_each(array!(value)) -> |_index, item| {
              __item_same = includes(__represented, encode_json(item))
              if !is_object(item) && !is_array(item) && !is_null(item) {
                  __item_same = __item_same || includes(__represented, to_string(item) ?? "")
              }
              if is_object(item) || is_array(item) || !__item_same { __all_items = false }
          }
          __same = __same || __all_items
      }
      if __same && includes(__candidates, key) { __consumed = push(__consumed, key) }
      # Redacted leaves always remain visible. Do not spill a copy of the raw body.
      if (!includes(__consumed, key) || value == "<redacted>") && value != __raw_body {
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          __base = join!(__parts, ".")
          __key = __base
          __suffix = 2
          if includes(keys(__residual), __key) {
              for_each(__flat) -> |_other_key, _other_value| {
                  if includes(keys(__residual), __key) {
                      __key = __base + "_" + to_string(__suffix)
                      __suffix = __suffix + 1
                  }
              }
          }
          __complex = is_object(value)
          if is_array(value) {
              for_each(array!(value)) -> |_index, item| {
                  if is_object(item) || is_array(item) { __complex = true }
              }
          }
          __spill = if __complex { encode_json(value) } else { value }
          __residual = set!(__residual, [__key], __spill)
      }
  }
  # Keep existing derived evidence, but remove null placeholders and mapped copies.
  # Source-derived aliases are replaced by canonical dotted source paths above.
  __original_values = []
  for_each(flatten(__source_kv)) -> |_key, value| {
      __original_values = push(__original_values, encode_json(value))
      if !is_object(value) && !is_array(value) { __original_values = push(__original_values, to_string(value) ?? "") }
  }
  for_each(flatten(__existing)) -> |key, value| {
      __source_alias = includes(__original_values, encode_json(value)) || includes(__original_values, to_string(value) ?? "")
      __mapped_alias = includes(__represented, encode_json(value)) || includes(__represented, to_string(value) ?? "")
      __decoded, __decode_err = parse_json(string(value) ?? "")
      __encoded_container = __decode_err == null && (is_object(__decoded) || is_array(__decoded))
      if !is_null(value) && value != "" && !__source_alias && !__mapped_alias && !__encoded_container && value != __raw_body {
          # Existing aggregates may contain sensitive descendants; the canonical
          # source spill above is the authoritative representation of containers.
          if !is_array(value) && !is_object(value) && !match(downcase(key), r'password|secret|authorization|token') {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, with recursive
  # redaction. These entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__safe.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

# Runtime samples (NAN-2327). An inline sample reaches the parser as
# {"message": raw}, i.e. a LogRecord with only a body and no attributes, trace
# context or timestamp. Full LogRecords (resource + log attributes, trace
# context, nested and colliding attributes) are the sidecar samples/*.json,
# which validate-ocsf.sh and field_coverage_check.py read as whole events.
samples:
  - raw: 'payment worker started'
    expect:
      "class_uid": 6003
      "activity_id": 0
      "type_uid": 600300
      "metadata.version": "1.9.0"
      "message": "payment worker started"
      "actor.app_name": "OpenTelemetry"
      "api.operation": "log"
      "src_endpoint.svc_name": "unknown"
      "trace": "<missing>"
      "unmapped.nano_time_source": "ingest"
