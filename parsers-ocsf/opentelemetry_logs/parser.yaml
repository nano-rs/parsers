name: opentelemetry_logs_ocsf
display_name: OpenTelemetry Logs (OCSF)
version: "1.2.0"
description: >
  Parses OpenTelemetry LogRecords (the OTLP/HTTP `/v1/logs` lane, source type
  `otlp_log`) into OCSF 1.9.0 "API Activity" (class_uid 6003) with the OCSF
  Trace profile (`trace.uid`, `trace.span.uid`). The LogRecord timestamp wins
  over ingest time; OTLP SeverityNumber maps to OCSF severity_id; resource and
  log attributes are kept under `unmapped` (dots rewritten to underscores so
  the lake schema stays flat). This was the platform's built-in OTLP parser;
  with no built-in parsers (NAN-2977) install it here to class OTLP logs,
  otherwise they land as OCSF Base Event (class 0) through the generic lane.

  v1.1.0 (ocsf-1.9 port, NAN-2977): adds the NAN-2421 residual spill over the
  LogRecord (body, severity, trace context, flattened resource + log
  attributes) with "_"-joined keys only, and runtime samples.
ocsf_version: "1.9.0"
match_values:
  - otlp_log
category: application
vendor: "OpenTelemetry"
product: "OTLP Logs"
parser_vrl: |
  # NAN source timezone. Generated by scripts/residual_spill.py; edit scripts/residual/source_tz.vrl.
  # The log source's timezone setting arrives as .nano.source_timezone (an IANA
  # name such as "America/New_York", or any fixed offset such as "+05:30"), set
  # by nano at ingest. .nano is nano's input, never part of the log: it is
  # removed whole before anything else, whatever its shape.
  # For a clock that carries no offset a parser parses it AS UTC and sets
  # __lc_pending; the generated local-clock block that follows the parse
  # (local_clock.vrl) turns it into real UTC with this setting, and the spill
  # records the zone used as unmapped.nano_time_assumed_tz (the name, the offset
  # as +HH:MM, or "UTC" when the setting is absent, invalid or "local").
  __src_nano = del(.nano)
  __src_tz_in = ""
  if is_object(__src_nano) { __src_tz_in = strip_whitespace(to_string(object!(__src_nano).source_timezone) ?? "") }
  __src_tz = "UTC"
  __src_shift_ms = 0
  __src_tz_label = "UTC"
  __time_assumed = false
  __time_inline = false
  __lc_pending = false
  __src_off = parse_regex(__src_tz_in, r'^(?P<sign>[+-])(?P<h>\d{2}):?(?P<m>\d{2})$') ?? {}
  if !is_empty(__src_off) {
      __src_h = to_int(__src_off.h) ?? 99
      __src_m = to_int(__src_off.m) ?? 99
      if __src_h <= 14 && __src_m <= 59 {
          __src_shift_ms = (__src_h * 3600 + __src_m * 60) * 1000
          if __src_off.sign == "-" { __src_shift_ms = 0 - __src_shift_ms }
          if __src_shift_ms != 0 { __src_tz_label = string!(__src_off.sign) + string!(__src_off.h) + ":" + string!(__src_off.m) }
      }
  } else if __src_tz_in != "" && downcase(__src_tz_in) != "local" {
      # "local" (the Vector host's zone) would make the time depend on the host.
      __src_probe, __src_probe_err = parse_timestamp("2000-01-01 00:00:00", "%Y-%m-%d %H:%M:%S", timezone: __src_tz_in)
      if __src_probe_err == null { __src_tz = __src_tz_in; __src_tz_label = __src_tz_in }
  }
  # END NAN source timezone
  # OpenTelemetry LogRecord -> OCSF 1.9.0 API Activity (6003) + Trace profile
  #
  # WHY API Activity (6003) and NOT Base Event (0): Base Event is the schema's
  # designated home for undefined events and passes OCSF validation, but the lake
  # sink computes `%class_uid = to_int(.class_uid) ?? 0`, so a real class_uid of 0
  # is indistinguishable from "attribute absent" and the row never lands. 6003 is
  # the closest OCSF class for service/application telemetry and carries the
  # required actor / api / src_endpoint, which OTLP resource+attributes supply.
  #
  # WHY trace.* and not unmapped.*: OCSF 1.9 defines the Trace profile — `trace`
  # carries a REQUIRED `uid` and a nested `span` whose `uid` is likewise required.
  # Emitting the canonical paths means hunts read `trace.uid="..."` rather than
  # `unmapped.trace_id="..."`. The lake's field validator is data-driven
  # (schema/ocsf.rs:902-911), so writing these makes them queryable with no alias
  # and no validator change. `unmapped.trace_id`/`unmapped.span_id` remain the
  # documented fallback for foreign producers that do not emit the profile
  # (source manifest fields 37/38, roles trace_fallback/span_fallback).
  #
  # Input shape is whatever `otlp_logs_prep` (config/vector/03-otlp-source.toml)
  # leaves on the event: .message (body), .severity / .severity_number,
  # .trace_id / .span_id (already downcased), .resources, .attributes.

  body = to_string(.message) ?? ""

  # ---- severity: OTLP SeverityNumber -> OCSF severity_id ----
  # OCSF: 0 Unknown, 1 Informational, 2 Low, 3 Medium, 4 High, 5 Critical,
  # 6 Fatal, 99 Other. otlp_logs_prep already banded the text; keep it as the
  # human-facing `severity` string and derive the id from the numeric when present.
  sev_text = to_string(.severity) ?? ""
  sev_num = to_int(.severity_number) ?? 0

  severity_id = 0
  if sev_num >= 21 {
      severity_id = 6
  } else if sev_num >= 17 {
      severity_id = 4
  } else if sev_num >= 13 {
      severity_id = 3
  } else if sev_num >= 5 {
      severity_id = 1
  } else if sev_num >= 1 {
      severity_id = 1
  }

  # No numeric SeverityNumber: fall back to the text band otlp_logs_prep computed.
  if severity_id == 0 {
      if sev_text == "Fatal" {
          severity_id = 6
      } else if sev_text == "Error" {
          severity_id = 4
      } else if sev_text == "Warn" {
          severity_id = 3
      } else if sev_text != "" {
          severity_id = 1
      }
  }

  if sev_text == "" {
      sev_text = "Unknown"
  }

  # ---- time: the LOG timestamp, never ingest time ----
  # The OTLP LogRecord time must win: stamping ingest time would silently
  # back-date/forward-date every OTLP row and corrupt time-ordered hunts.
  # `.timestamp` arrives as a real timestamp from Vector's OTLP source, but can be
  # an RFC3339 string or raw epoch (OTLP carries unix NANOS) depending on the
  # producer, so handle all three rather than letting a type mismatch fall through
  # to now(). `to_unix_timestamp` errors on a non-timestamp, which is exactly how
  # the first draft of this parser silently stamped ingest time.
  resolve_ms = {
      ms = null
      candidate = .timestamp
      if candidate == null { candidate = .observed_timestamp }

      if is_timestamp(candidate) {
          ms = to_unix_timestamp(timestamp!(candidate), unit: "milliseconds")
      } else if is_string(candidate) {
          parsed_ts, parse_err = parse_timestamp(string!(candidate), "%+", timezone: "UTC")
          if parse_err == null {
              ms = to_unix_timestamp(parsed_ts, unit: "milliseconds")
          }
      } else if is_integer(candidate) || is_float(candidate) {
          # A large epoch (OTLP nanos) decodes as a float in some JSON paths, so
          # accept both and normalise through float before truncating back.
          raw = to_float(candidate) ?? 0.0
          # Disambiguate by magnitude: OTLP emits nanoseconds; tolerate micros,
          # millis and seconds from looser producers. Thresholds are year-2001-ish
          # in each unit, so a plausible event time never lands in the wrong band.
          # NOTE: VRL division always yields a float — truncate explicitly, or the
          # downstream int coercion aborts the whole program ("expected integer,
          # got float") and the row is dropped with no row and no error surface.
          if raw > 100000000000000000.0 {
              ms = to_int(floor(raw / 1000000.0))
          } else if raw > 100000000000000.0 {
              ms = to_int(floor(raw / 1000.0))
          } else if raw > 100000000000.0 {
              ms = to_int(floor(raw))
          } else if raw > 0.0 {
              ms = to_int(floor(raw * 1000.0))
          }
      }
      ms
  }

  time_ms = 0
  time_from_record = true
  if resolve_ms != null {
      time_ms = to_int(resolve_ms)
  } else {
      time_from_record = false
      # No usable record time. Fall back to the routing stamp (still ingest-side,
      # but at least explicit) and record that the time is not authoritative.
      rts, rts_err = to_unix_timestamp(.routing_timestamp, unit: "milliseconds")
      if rts_err == null {
          time_ms = rts
      } else {
          time_ms = to_unix_timestamp(now(), unit: "milliseconds")
      }
  }

  # ---- trace context (OCSF Trace profile) ----
  trace_uid = downcase(to_string(.trace_id) ?? "")
  span_uid = downcase(to_string(.span_id) ?? "")

  # ---- resource / log-record attributes ----
  resources = {}
  if is_object(.resources) {
      resources = object!(.resources)
  }
  attributes = {}
  if is_object(.attributes) {
      attributes = object!(.attributes)
  }

  # ---- NAN-2421 residual source (ocsf-1.9 convention) ----
  # The OTLP lane hands this parser a structured Vector event, not a raw line,
  # so the "source" the residual spill accounts for is the LogRecord itself:
  # body, severity, trace context and the resource + log attributes.
  # Pipeline plumbing added by otlp_logs_prep (ext, metadata, routing_timestamp,
  # auth_status, content_format) is deliberately NOT source.
  # Keys are flattened with "_" (never "."): a dotted `unmapped` key wedged
  # Iceberg publication for every source ("Cannot add column with ambiguous
  # name: client.address"), and the residual template joins nested paths with
  # dots. Same precedence as `unmapped` below: a log attribute wins over a
  # same-named resource attribute.
  __raw_body = body
  __otlp_scope = {}
  if is_object(.scope) { __otlp_scope = {"scope": object!(.scope)} }
  __otlp_record = {}
  for_each(["severity", "severity_text", "severity_number", "trace_id", "span_id", "flags", "dropped_attributes_count"]) -> |_i, k| {
      v = get!(., [k])
      if v != null && v != "" && !is_object(v) && !is_array(v) { __otlp_record = set!(__otlp_record, [k], v) }
  }
  if is_string(.timestamp) { __otlp_record.timestamp = .timestamp }
  if is_string(.observed_timestamp) { __otlp_record.observed_timestamp = .observed_timestamp }
  __otlp_flat = map_keys(merge(merge(__otlp_scope, resources), attributes), recursive: true) -> |key| {
      replace(key, ".", "_")
  }
  __source_kv = merge(flatten(__otlp_flat, "_"), __otlp_record)

  service_name = to_string(resources."service.name") ?? ""

  # Non-OCSF residue rides `unmapped` (the OCSF spill), resource attrs first so a
  # same-named log attribute wins — same precedence otlp_logs_prep used for `ext`.
  #
  # CRITICAL: keys must not contain dots. OTLP semantic conventions are dotted
  # almost everywhere (`service.name`, `client.address`, `http.method`), but the
  # Iceberg additive-schema step reads a dot as a nested-struct path and refuses
  # the whole batch:
  #   PreconditionFailed => Cannot add column with ambiguous name: client.address
  # That error is retried forever on a durable batch, which wedges publication for
  # EVERY source, not just this one. Flatten the separator to `_` so each OTLP
  # attribute becomes an unambiguous leaf.
  unmapped = map_keys(merge(resources, attributes), recursive: true) -> |key| {
      replace(key, ".", "_")
  }

  # ---- required attributes for 6003, sourced from OTLP where available ----
  operation = to_string(attributes."http.request.method") ?? to_string(attributes."http.method") ?? ""
  url_path = to_string(attributes."url.path") ?? to_string(attributes."http.target") ?? ""
  if operation == "" { operation = "log" }
  api = {"operation": operation}
  if service_name != "" { api = merge(api, {"service": {"name": service_name}}) }
  if url_path != "" { api = merge(api, {"request": {"uid": url_path}}) }

  # `actor` is REQUIRED and must carry at least one of
  # [process, user, iam_role, invoked_by, session, application, app_name, app_uid].
  # A LogRecord often has no principal at all, so fall back to naming the emitting
  # application — an OCSF-valid actor beats dropping the row.
  user_name = to_string(attributes."enduser.id") ?? ""
  actor = {}
  if user_name != "" { actor = {"user": {"name": user_name}} }
  if actor == {} {
      if service_name != "" {
          actor = {"app_name": service_name}
      } else {
          actor = {"app_name": "OpenTelemetry"}
      }
  }

  client_ip = to_string(attributes."client.address") ?? to_string(attributes."net.peer.ip") ?? ""
  src_endpoint = {}
  if client_ip != "" { src_endpoint = {"ip": client_ip} }
  host_name = to_string(resources."host.name") ?? ""
  if host_name != "" { src_endpoint = merge(src_endpoint, {"hostname": host_name}) }
  if service_name != "" { src_endpoint = merge(src_endpoint, {"svc_name": service_name}) }
  # Same contract as `actor`: at least one identifying attribute is REQUIRED.
  if src_endpoint == {} { src_endpoint = {"svc_name": "unknown"} }

  # ---- metadata.uid (NAN-3702) ----
  # The lake drops a row whose (event hour, metadata.uid) it already stored, so
  # an OTLP retry of the same LogRecord must map to the same uid. This lane gets
  # a structured event, not a raw line, so the identity is the LogRecord itself:
  # body, severity, trace context, flags, scope, resource + log attributes and
  # the record's own time. Pipeline plumbing (routing_timestamp, observed time,
  # ext) is left out because it is stamped per delivery.
  # With NO record time the content alone cannot tell a retry from a second,
  # identical log line in the same hour (a periodic "heartbeat ok"), and the
  # only clock left is ingest time, so that case keeps a random uid: a retry
  # there may duplicate, but distinct records are never collapsed.
  otlp_uid = uuid_v4()
  if time_from_record {
      otlp_identity = {
          "body": body,
          "time_ms": time_ms,
          "severity": sev_text,
          "severity_number": sev_num,
          "trace_id": trace_uid,
          "span_id": span_uid,
          "flags": .flags,
          "scope": __otlp_scope,
          "resources": resources,
          "attributes": attributes
      }
      otlp_uid = sha2("opentelemetry_logs|" + encode_json(otlp_identity), variant: "SHA-256")
  }

  # ---- assemble the OCSF record on the root ----
  . = {
      "class_uid": 6003,
      "class_name": "API Activity",
      "category_uid": 6,
      "category_name": "Application Activity",
      "activity_id": 0,
      "activity_name": "Unknown",
      "type_uid": 600300,
      "actor": actor,
      "api": api,
      "src_endpoint": src_endpoint,
      "severity_id": severity_id,
      "severity": sev_text,
      "time": time_ms,
      "message": body,
      "metadata": {
          "version": "1.9.0",
          "uid": otlp_uid,
          # REQUIRED for the `trace` object to be admitted. OCSF binds `trace` to
          # the "trace" profile, and the strict admission validator
          # (nanosiem-core/src/parsers/ocsf_validation.rs, `attribute_allowed`)
          # only permits a profile-bound attribute when the event DECLARES that
          # profile here. Without this, every bronze object carrying one of these
          # rows is rejected wholesale as `strict_admission_failed`
          # ("attribute \"trace\" is not defined for this OCSF class/profile") --
          # taking any co-located rows from other sources down with it.
          "profiles": ["trace"],
          "product": {
              "name": "OpenTelemetry",
              "vendor_name": "OpenTelemetry"
          },
          "log_provider": "OTLP"
      },
      "unmapped": unmapped
  }

  # OCSF Trace profile — only when the LogRecord actually carried trace context.
  # `trace.uid` is REQUIRED by the trace object, so never emit a bare/empty trace.
  if trace_uid != "" {
      trace = {"uid": trace_uid}
      # Deliberately NO `trace.span`. OCSF's span object requires `start_time` and
      # `end_time` as well as `uid`, and a LogRecord carries only the span ID from
      # its W3C trace context -- it does not know when that span began or ended.
      # Emitting the object without them is rejected outright
      # ("required OCSF attribute \"trace.span.end_time\""), and inventing the
      # timestamps would put fabricated timing into a security event store. The
      # span identity therefore rides `unmapped.span_id`, which is exactly the
      # `span_fallback` role the source manifest declares (field 38). The span's
      # real timings live on the span row itself, in the spans dataset.
      if service_name != "" {
          trace = merge(trace, {"service": {"name": service_name}})
      }
      .trace = trace

      # Fallback slots the entity manifest declares (fields 37/38) so foreign
      # consumers and the primary-then-fallback query predicate both resolve.
      .unmapped.trace_id = trace_uid
      if span_uid != "" {
          .unmapped.span_id = span_uid
      }
  }

  # service.name -> OCSF actor.process / src_endpoint has no clean slot for a
  # logical service, so keep it on the canonical `metadata.product.feature`
  # (a real OCSF path) in addition to trace.service.name above.
  if service_name != "" {
      .metadata.product.feature = {"name": service_name}
  }

  # The LogRecord carried no usable time, so `time` is ingest-side. Say so on the
  # row rather than letting a fabricated time read as the event's own.
  if !time_from_record {
      .unmapped.nano_time_source = "ingest"
  }

  # NAN-2421 residual spill. Generated by scripts/residual_spill.py; edit the template.
  # Values spill exactly as parsed: a parser never masks, redacts or withholds
  # anything (masking is an opt-in pipeline step, never a parser concern).
  # __source_kv is a local variable, never an OCSF attribute. The checker instruments
  # this marker to observe the parsed source without changing production output.
  # A source field is consumed ONLY by an explicit mapping: a field-coverage.yaml
  # `mappings` entry (source key -> target paths) or a `transforms` rule with a
  # target, whose value is found AT THAT TARGET PATH of the selected branch. A
  # value that merely appears somewhere else in the event never consumes a field
  # (no coincidental consumption); everything else spills.
  # NAN-5351: VRL copies a variable on every read, so an array or object used as a
  # lookup set costs a full copy per lookup. The sets below are strings instead
  # (a read shares the buffer). __repr holds one member per mapped leaf:
  # "," + encode_json(path) + "=" + encode_json(encode_json(value)), plus the
  # to_string form for a string or a float, so a numeric string is represented by
  # its typed scalar. Every part is a JSON text, inside which a '"' is always
  # escaped, so a member is matched exactly. Paths drop array indices
  # (resources.0.uid is resources.uid); arrays are walked two levels deep, and a
  # leaf deeper than that is simply not mapping evidence (it can only spill more).
  # raw_data and unmapped are dropped before the JSON round trip, not after it.
  __mapped = .
  __discard = del(__mapped.raw_data)
  __existing = del(__mapped.unmapped)
  __existing = object(parse_json!(encode_json(__existing))) ?? {}
  __mapped = object!(parse_json!(encode_json(__mapped)))
  if __mapped.message == __raw_body { __discard = del(__mapped.message) }
  __copy = object!(parse_json!(encode_json({"source": __source_kv, "existing": __existing})))
  __repr = ""
  for_each(flatten(__mapped)) -> |path, value| {
      __p = encode_json(path)
      if is_array(value) {
          for_each(array!(value)) -> |_i, item| {
              if is_object(item) {
                  for_each(flatten(object!(item))) -> |sub, leaf| {
                      __q = encode_json(path + "." + sub)
                      if is_array(leaf) {
                          for_each(array!(leaf)) -> |_j, x| {
                              if !is_object(x) && !is_array(x) {
                                  __repr = __repr + ("," + __q + "=" + encode_json(encode_json(x)))
                                  if is_string(x) || is_float(x) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(x))) }
                              }
                          }
                      } else {
                          __repr = __repr + ("," + __q + "=" + encode_json(encode_json(leaf)))
                          if is_string(leaf) || is_float(leaf) { __repr = __repr + ("," + __q + "=" + encode_json(to_string!(leaf))) }
                      }
                  }
              } else if !is_array(item) {
                  __repr = __repr + ("," + __p + "=" + encode_json(encode_json(item)))
                  if is_string(item) || is_float(item) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(item))) }
              }
          }
      } else {
          __repr = __repr + ("," + __p + "=" + encode_json(encode_json(value)))
          if is_string(value) || is_float(value) { __repr = __repr + ("," + __p + "=" + encode_json(to_string!(value))) }
      }
  }
  __consumed = ""
  # Escape literal dots before flattening so dotted source keys cannot overwrite
  # nested paths. Decode for naming, and disambiguate collisions with suffixes.
  # In compact JSON only an object key is followed by ':', so a source whose text
  # has no '.' or '~' followed by the rest of a string and then ':' has no key to
  # escape. ('.' and '~' are never the escaped half of a JSON escape.)
  __escaped = object!(__copy.source)
  __tilde = false
  if match(encode_json(__escaped), r'[.~](?:[^"\\]|\\.)*":') {
      __escaped = map_keys(__escaped, recursive: true) -> |key| {
          replace(replace(key, "~", "~0"), ".", "~1")
      }
      # Keys without a "~" decode to themselves, including the object keys inside
      # an array that flatten leaves escaped; encode_json never escapes a "~".
      __tilde = contains(encode_json(__escaped), "~")
  }
  __flat = flatten(__escaped)
  # BEGIN parser-specific transformations
  # timestamp: The LogRecord timestamp is converted to epoch milliseconds and wins over ingest time.
  for_each(__flat) -> |key, value| {
      if match(key, r'(?x)
      \A(?:
        timestamp
      )\z') {
          __value = value
          __clock, __clock_err = parse_timestamp(string(__value) ?? "", "%+", timezone: "UTC")
          if __clock_err == null {
              __expected = to_unix_timestamp(__clock, unit: "milliseconds")
              if contains(__repr, "," + "\"time\"" + "=" + encode_json(encode_json(__expected))) { __consumed = __consumed + ("," + encode_json(key)) }
          }
      }
  }
  # Declared source -> target mappings (field-coverage.yaml `mappings`).
  __decl = "\n\"severity\"\t[\"severity\"]\n\"trace_id\"\t[\"trace.uid\"]\n"
  __preserve = ["trace_id", "span_id", "nano_time_source"]
  # END parser-specific transformations
  # Declared mappings: __decl holds "\n" + encode_json(key) + "\t" + JSON array of
  # target paths + "\n" per mapped source key (a raw newline never occurs in
  # compact JSON). A key is consumed when its value, or every element of a scalar
  # array, is at one of its own targets. Keys stay ESCAPED here and in __consumed:
  # a literal dotted key ("a~1b") and the nested path ("a.b") are different
  # fields, and mapping one never consumes the other.
  for_each(__flat) -> |key, value| {
      # __decl spells a bracket inside a key as a \u escape (deploy bracket count).
      __kt = encode_json(key)
      if match(__kt, r'[\x28\x29\x5B\x5D\x7B\x7D]') {
          __kt = replace(replace(replace(replace(replace(replace(__kt, r'\x28', "\\u0028"), r'\x29', "\\u0029"), r'\x5B', "\\u005b"), r'\x5D', "\\u005d"), r'\x7B', "\\u007b"), r'\x7D', "\\u007d")
      }
      __at = find(__decl, "\n" + __kt + "\t")
      if is_integer(__at) && !is_object(value) {
          __rest = slice!(__decl, int!(__at) + strlen(__kt) + 2)
          __hit = false
          for_each(array!(parse_json!(slice!(__rest, 0, int!(find(__rest, "\n")))))) -> |_i, target| {
              __tok = "," + encode_json(target) + "="
              if !__hit && is_array(value) {
                  __all = !is_empty(array!(value))
                  for_each(array!(value)) -> |_j, item| {
                      if __all {
                          __all = !is_object(item) && !is_array(item) && (contains(__repr, __tok + encode_json(encode_json(item))) || ((is_string(item) || is_float(item)) && contains(__repr, __tok + encode_json(to_string!(item)))))
                      }
                  }
                  __hit = __all
              } else if !__hit {
                  __hit = contains(__repr, __tok + encode_json(encode_json(value))) || ((is_string(value) || is_float(value)) && contains(__repr, __tok + encode_json(to_string!(value))))
              }
          }
          if __hit { __consumed = __consumed + ("," + encode_json(key)) }
      }
  }
  # Fast path: when no two source keys decode to the same key and no two spilled
  # keys get the same name, each key's decision depends only on its own value, so
  # one filter and one rename build the residual without copying it per key.
  __distinct = true
  if __tilde {
      __distinct = length(map_keys(__flat) -> |key| { replace(replace(key, "~1", "."), "~0", "~") }) == length(__flat)
  }
  __kept = {}
  __names = {}
  if __distinct {
      __kept = filter(__flat) -> |key, value| {
          # A key is kept unless an explicit mapping or transformation consumed it.
          # Do not spill a copy of the raw body.
          value != __raw_body && !contains(__consumed, "," + encode_json(key))
      }
      __names = map_keys(__kept) -> |key| {
          if __tilde { key = replace(replace(key, "~1", "."), "~0", "~") }
          __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
          join!(__parts, ".")
      }
  }
  __residual = {}
  if __distinct && length(__names) == length(__kept) {
      __residual = map_values(__names) -> |value| {
          if is_array(value) || is_object(value) {
              if __tilde {
                  value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                      replace(replace(inner, "~1", "."), "~0", "~")
                  }, ["v"])
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              if __complex { value = encode_json(value) }
          }
          value
      }
  } else {
      # Slow path, in source key order: a name already taken gets the next free
      # _2, _3, ... suffix.
      for_each(__flat) -> |key, value| {
          __token = "," + encode_json(key)
          key = replace(replace(key, "~1", "."), "~0", "~")
          if is_array(value) || is_object(value) {
              value = get!(map_keys({"v": value}, recursive: true) -> |inner| {
                  replace(replace(inner, "~1", "."), "~0", "~")
              }, ["v"])
          }
          if !contains(__consumed, __token) && value != __raw_body {
              __parts = map_values(split(key, ".")) -> |part| { snakecase(string!(part)) }
              __base = join!(__parts, ".")
              __key = __base
              __suffix = 2
              if includes(keys(__residual), __key) {
                  for_each(__flat) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __key) {
                          __key = __base + "_" + to_string(__suffix)
                          __suffix = __suffix + 1
                      }
                  }
              }
              __complex = is_object(value)
              if is_array(value) {
                  for_each(array!(value)) -> |_index, item| {
                      if is_object(item) || is_array(item) { __complex = true }
                  }
              }
              __spill = if __complex { encode_json(value) } else { value }
              __residual = set!(__residual, [__key], __spill)
          }
      }
  }
  # Names nano owns in unmapped (the parser markers and the reserved nano.*
  # namespace) are never taken by a source field: a vendor key with such a name
  # is kept, renamed source_<name>, so a log cannot forge a marker.
  if match(encode_json(keys(__residual)), r'"nano(?:"|\.|_time_assumed_tz"|_time_source"|_operational")') {
      for_each(object!(__residual)) -> |key, value| {
          if includes(["nano", "nano_time_assumed_tz", "nano_time_source", "nano_operational"], key) || starts_with(key, "nano.") {
              # source_<name>, or the next free _2, _3, ... when a vendor key
              # already holds that name: nothing is lost.
              __rk = "source_" + key
              __rn = 2
              if includes(keys(__residual), __rk) {
                  for_each(__residual) -> |_other_key, _other_value| {
                      if includes(keys(__residual), __rk) {
                          __rk = "source_" + key + "_" + to_string(__rn)
                          __rn = __rn + 1
                      }
                  }
              }
              __residual = remove!(__residual, [key])
              __residual = set!(__residual, [__rk], value)
          }
      }
  }
  # Keep existing derived evidence, but remove null placeholders and copies of a
  # source value (that value is mapped or spilled above under its source path).
  # A value merely equal to some mapped attribute is kept: equality with an
  # unrelated attribute is no evidence that it is represented.
  # The canonical source spill above is the authoritative representation of
  # containers. The cheap conditions run first; the source value set is built on
  # first use.
  __original_values = null
  for_each(flatten(__existing)) -> |key, value| {
      if !is_null(value) && value != "" && !is_array(value) && !is_object(value) && value != __raw_body {
          # Members for the value itself and for to_string(value), as above.
          __json = encode_json(value)
          __as_json = "," + encode_json(__json)
          __as_string = __as_json
          if is_string(value) { __as_string = "," + __json } else if is_float(value) { __as_string = "," + encode_json(to_string!(value)) }
          if __original_values == null {
              # __source_kv may hold non-JSON types (a timestamp), so only an
              # integer or a boolean skips its to_string member here.
              __original_values = join!(map_values(values(flatten(__source_kv))) -> |source_value| {
                  __source_json = encode_json(source_value)
                  __tokens = "," + encode_json(__source_json)
                  if is_string(source_value) {
                      __tokens = __tokens + "," + __source_json
                  } else if !is_object(source_value) && !is_array(source_value) && !is_integer(source_value) && !is_boolean(source_value) {
                      __tokens = __tokens + "," + encode_json(to_string(source_value) ?? "")
                  }
                  __tokens
              }, "")
          }
          __source_set = string!(__original_values)
          __keep = !contains(__source_set, __as_json) && !contains(__source_set, __as_string)
          # Only text opening an object or an array (after JSON whitespace)
          # decodes to a container.
          if __keep && is_string(value) && match(string!(value), r'^[ \t\n\r]*[\x5B\x7B]') {
              __decoded, __decode_err = parse_json(string!(value))
              __keep = !(__decode_err == null && (is_object(__decoded) || is_array(__decoded)))
          }
          if __keep {
              __key = snakecase(key)
              if !includes(keys(__residual), __key) { __residual = set!(__residual, [__key], value) }
          }
      }
  }
  # Parser-declared derived evidence is merged after source spill, as-is. These
  # entries preserve meaning beyond source scalar value equality.
  for_each(__preserve) -> |_index, key| {
      __derived = get!(object!(__copy.existing), [string!(key)])
      if __derived != null { __residual = set!(__residual, [string!(key)], __derived) }
  }
  if __time_assumed && !__time_inline { __residual = set!(__residual, ["nano_time_assumed_tz"], __src_tz_label) }
  __discard = del(.unmapped)
  if !is_empty(__residual) { .unmapped = __residual }
  .
  # END NAN-2421 residual spill

# Runtime samples (NAN-2327). An inline sample reaches the parser as
# {"message": raw}, i.e. a LogRecord with only a body and no attributes, trace
# context or timestamp. Full LogRecords (resource + log attributes, trace
# context, nested and colliding attributes) are the sidecar samples/*.json,
# which validate-ocsf.sh and field_coverage_check.py read as whole events.
samples:
  - raw: 'payment worker started'
    expect:
      "class_uid": 6003
      "activity_id": 0
      "type_uid": 600300
      "metadata.version": "1.9.0"
      "message": "payment worker started"
      "actor.app_name": "OpenTelemetry"
      "api.operation": "log"
      "src_endpoint.svc_name": "unknown"
      "trace": "<missing>"
      "unmapped.nano_time_source": "ingest"
