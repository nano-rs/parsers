name: Validate & Auto-Merge Parsers

on:
  # NAN-3680: the merge to main/ocsf-1.9 re-runs validation with the private
  # OCSF contract validator, so a fork PR (which cannot read it) is still
  # schema-checked before its content is trusted.
  push:
    branches: [main, ocsf-1.9]
    paths:
      - "parsers/**"
      - "parsers-ocsf/**"
      - "enrichments/**"
      - "scripts/**"
      - ".github/workflows/validate-parsers.yml"
  pull_request:
    # `ocsf-1.9` is the OCSF 1.9 line; `main` keeps the OCSF 1.8 content for
    # tenants still running OCSF on ClickHouse. Both need the same gates, and a
    # PR that targets ocsf-1.9 would otherwise trigger nothing at all.
    branches: [main, ocsf-1.9]
    # `ready_for_review` is not in the default type set (opened, synchronize,
    # reopened). Without it, undrafting a PR re-runs nothing, so the Auto-Merge
    # job keeps whatever result it got while the PR was still a draft — a red X
    # that never clears and never merges. Every draft PR then needs a manual
    # merge despite a green validation run.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "parsers/**"
      # parsers-ocsf/ was covered by neither the path filter nor the discovery
      # glob, so its parsers had never been validated by CI at all — a PR
      # touching only them triggered no run.
      - "parsers-ocsf/**"
      - "enrichments/**"
      # The validator's own rules are the change most likely to invalidate
      # parsers repo-wide, so a PR touching only the script or this workflow
      # must still run the whole-repo pass. Without these two entries such a
      # PR triggers no validation at all.
      - "scripts/**"
      - ".github/workflows/validate-parsers.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-vrl:
    name: Validate VRL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Vector
        run: |
          curl -sSL https://sh.vector.dev | bash -s -- -y --prefix "$HOME/.vector"
          echo "$HOME/.vector/bin" >> $GITHUB_PATH

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Find changed parsers
        id: changed
        # PR-only: a push has no base ref. The whole-repo pass below covers it.
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.event.pull_request.base.ref }}"
          changed=$(git diff --name-only "$base"...HEAD -- 'parsers/*/parser.yaml' 'enrichments/**/parser.yaml')
          if [ -z "$changed" ]; then
            echo "No parser files changed"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changed parsers:"
            echo "$changed"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            # Write to file so next step can read it
            echo "$changed" > /tmp/changed_parsers.txt
          fi

      - name: Validate VRL syntax
        if: steps.changed.outputs.has_changes == 'true'
        run: bash scripts/validate-vrl.sh /tmp/changed_parsers.txt

      # Validating only the changed parsers let three parsers reach main in a
      # state nano refuses to deploy (aws_s3_access, juniper_srx, linux_auditd —
      # all unbalanced bracket counts). Nothing ever re-checked them, and this
      # workflow auto-merges on a green run, so they merged unattended. The
      # whole-repo pass is cheap (one `vector vrl` per parser) and is what keeps
      # main deployable rather than merely keeping each PR self-consistent.
      - name: Validate every parser in the repo
        run: |
          find parsers parsers-ocsf enrichments -name parser.yaml | sort > /tmp/all_parsers.txt
          count=$(wc -l < /tmp/all_parsers.txt)
          echo "Validating $count parsers"
          # A glob that silently matches nothing would let this step pass while
          # covering nothing — the same false sense of coverage that let three
          # broken parsers sit on main. Fail loudly instead.
          if [ "$count" -lt 50 ]; then
            echo "Expected at least 50 parsers, found $count — parser discovery is broken."
            exit 1
          fi
          bash scripts/validate-vrl.sh /tmp/all_parsers.txt

  validate-ocsf:
    name: Validate OCSF
    runs-on: ubuntu-24.04  # validator binary needs glibc >= 2.34
    steps:
      - uses: actions/checkout@v4

      - name: Install Vector
        run: |
          curl -sSL https://sh.vector.dev | bash -s -- -y --prefix "$HOME/.vector"
          echo "$HOME/.vector/bin" >> $GITHUB_PATH

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      # Whole-tree, same reasoning as the VRL job: validating only what a PR
      # touched is what let broken parsers sit on main unnoticed. This job runs
      # the static OCSF consistency rules (metadata.version vs the parser's own
      # ocsf_version, type_uid arithmetic, no .udm.*/source_type, no deprecated
      # class_uid) plus gate 1 against each parser's samples/ corpus.
      #
      # The OCSF *contract* half of gate 2 runs nano's `ocsf_event_validate`:
      # the exact check nano's lake enforces at admission. NAN-3680: it is
      # MANDATORY here. azure_monitor 1.0.0 passed this job with it skipped and
      # then lost every unregistered-device sign-in in the lake. The binary is
      # pinned (url + sha256) in scripts/ocsf-validator.lock; validate-ocsf.sh
      # fails under CI when it is missing.
      #
      # The binary is a private nano build artifact (a release asset on the
      # private nano-rs/nanosiem repo), read with OCSF_VALIDATOR_TOKEN: a
      # fine-grained, read-only token for that one repo. A fork PR cannot read
      # repository secrets, so its schema half reports "skipped (fork)"; the
      # push run after merge to main/ocsf-1.9 enforces it with the secret.
      - name: Fetch nano OCSF contract validator
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
        env:
          OCSF_VALIDATOR_TOKEN: ${{ secrets.OCSF_VALIDATOR_TOKEN }}
        run: echo "OCSF_VALIDATOR=$(bash scripts/fetch-ocsf-validator.sh "$RUNNER_TEMP/ocsf")" >> "$GITHUB_ENV"

      - name: Mark fork PR (schema half skipped, enforced post-merge)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: echo "OCSF_VALIDATOR_SKIP_REASON=fork" >> "$GITHUB_ENV"

      - name: Validate OCSF parser tree
        run: bash scripts/validate-ocsf.sh

      - name: Check generated residual blocks
        run: python3 scripts/residual_spill.py --check

      - name: Test residual preservation and checker rejection
        run: python3 scripts/test_field_coverage_check.py

      - name: Check field coverage for every OCSF parser
        run: python3 scripts/field_coverage_check.py --all

  auto-merge:
    name: Auto-Merge
    needs: [validate-vrl, validate-ocsf]
    runs-on: ubuntu-latest
    # Skip on drafts rather than attempting the merge and failing with
    # "Pull Request is still a draft". That error is expected on every draft
    # PR, but it surfaces as a failed check, which is indistinguishable at a
    # glance from a real problem. Combined with the ready_for_review trigger
    # above, a draft now shows no auto-merge result until it is marked ready.
    if: success() && github.event_name == 'pull_request' && github.event.pull_request.draft == false
    steps:
      - name: Enable auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              console.log('No PR context, skipping auto-merge');
              return;
            }

            // Only auto-merge if PR author is a collaborator
            const { data: permLevel } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: pr.user.login,
            });

            const allowed = ['admin', 'write'];
            if (!allowed.includes(permLevel.permission)) {
              console.log(`PR author ${pr.user.login} has '${permLevel.permission}' permission, skipping auto-merge`);
              return;
            }

            console.log(`VRL validation passed, approving and merging PR #${pr.number}`);

            // Approve the PR
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              event: 'APPROVE',
              body: 'VRL validation passed. Auto-approved.',
            });

            // Merge
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              merge_method: 'squash',
            });
