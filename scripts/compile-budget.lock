# NAN-5388: the per-parser load/compile budget and the Vector it is measured in.
#
# Keep in step with nanosiem `nanosiem-enterprise/src/platform/content/parser_gate`
# (PARSER_COMPILE_BUDGET, PINNED_VECTOR_IMAGE): the content publisher refuses to
# sign a revision with a parser over this budget, so a PR that passes here is
# the only kind it will publish. VECTOR_IMAGE is the `vector` line of nanosiem's
# images.lock: the image every nano install runs.
#
# BUDGET_VERSION changes whenever BUDGET_SECS does.
BUDGET_VERSION=1
BUDGET_SECS=15
VECTOR_IMAGE=ghcr.io/nano-rs/vector:0.61.0-nano.11-debian@sha256:27e8dc155770379cef504fe647d7611cad527143120a17e2e1bfae8ab4bc54c2
