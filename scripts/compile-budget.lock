# NAN-5388: the per-parser load/compile budget and the Vector it is measured in.
#
# Keep in step with nanosiem `nanosiem-enterprise/src/platform/content/parser_gate`
# (PARSER_COMPILE_BUDGET, PINNED_VECTOR_IMAGE): the content publisher refuses to
# sign a revision with a parser over this budget, so a PR that passes here is
# the only kind it will publish. VECTOR_IMAGE is the `vector` line of nanosiem's
# images.lock: the image every nano install runs.
#
# BUDGET_VERSION changes whenever BUDGET_SECS does.
BUDGET_VERSION=1
BUDGET_SECS=15
VECTOR_IMAGE=ghcr.io/nano-rs/vector:0.61.0-nano.14-debian@sha256:8995b2b456d104373056c4e72eded60c59c197ab1605d8de8d362b3a67fc857c
#
# A shared CI runner can be much slower than another (the same parser on the
# same image has measured 7.6 s to 15 s). check-compile-budget.sh times a fixed
# reference program (scripts/compile-budget-reference.vrl) on the runner and
# divides each parser's median load time by the runner factor
# reference / REFERENCE_BASELINE_MS, never below 1 and at most
# RUNNER_FACTOR_CAP, so a slow runner cannot fail a good parser while a real
# regression still does. REFERENCE_BASELINE_MS is the reference's load time on
# a normal GitHub runner with VECTOR_IMAGE: re-measure it whenever
# VECTOR_IMAGE changes. BUDGET_RUNS: runs per parser near the budget (median).
REFERENCE_BASELINE_MS=7600
RUNNER_FACTOR_CAP=1.5
BUDGET_RUNS=3
